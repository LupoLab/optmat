# Read the Docs: the manual at https://optmat.readthedocs.io.
# The build is the gate's last step (`uv run poe docs`): warnings are errors and the
# gallery executes.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    post_checkout:
      # hatch-vcs takes the version from the git history, which a shallow clone lacks.
      - git fetch --unshallow --tags || true
    create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    install:
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --frozen --all-extras
    build:
      html:
        # Diagnostic, not for merging: stop before Read the Docs' 15-minute limit, so that
        # the log survives, with elapsed seconds on each line and a probe of load and memory.
        - nproc; free -m; cat /proc/loadavg
        - |
          (while sleep 60; do echo "[probe] $(cat /proc/loadavg) $(free -m | sed -n 2p)"; done) &
          probe=$!
          PYTHONUNBUFFERED=1 UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH timeout -k 10 840 uv run --frozen sphinx-build -b html -W -n --keep-going docs $READTHEDOCS_OUTPUT/html 2>&1 | perl -pe 'BEGIN{$|=1;$t=time} printf "%5d ", time-$t'
          kill $probe
