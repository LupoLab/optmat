# Read the Docs: the manual at https://optmat.readthedocs.io.
# The build is the gate's last step (`uv run poe docs`): warnings are errors and the
# gallery executes.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    post_checkout:
      # hatch-vcs takes the version from the git history, which a shallow clone lacks.
      - git fetch --unshallow --tags || true
    create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    install:
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --frozen --all-extras
    build:
      html:
        # Under test (#40): the full log stays in a file, and only its end goes to Read the
        # Docs. Read the Docs wraps a command in single quotes, so it must hold none.
        - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv run --frozen sphinx-build -b html -W -n --keep-going docs $READTHEDOCS_OUTPUT/html > /tmp/sphinx.log 2>&1; status=$?; if [ $status -eq 0 ]; then tail -n 20 /tmp/sphinx.log; else tail -n 300 /tmp/sphinx.log; fi; exit $status
