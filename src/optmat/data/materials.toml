# The materials the curated records may name (TC-318).
#
# A record's dataset names its material by `id`. The id is the directory of the
# material's extracted files (`data/values/<family>/<id>/`), so it is short and safe as
# a file name. `kind` is gas, ion, glass or crystal; `optics` is isotropic, uniaxial or
# biaxial, and an anisotropic material lists the `axes` a dataset's `parameters.axis`
# may take. Media add their own facts in their subpackage (optmat.gas.gases for the
# gases); this file only says what a material is.
#
# A material is added here, with its identity, before data for it are recorded.

# The gases (optmat.gas).
[He]
name = "helium"
kind = "gas"

[Ne]
name = "neon"
kind = "gas"

[Ar]
name = "argon"
kind = "gas"

[Kr]
name = "krypton"
kind = "gas"

[Xe]
name = "xenon"
kind = "gas"

[H2]
name = "hydrogen (normal)"
kind = "gas"

[D2]
name = "deuterium (normal)"
kind = "gas"

[N2]
name = "nitrogen"
kind = "gas"

[O2]
name = "oxygen"
kind = "gas"

[CH4]
name = "methane"
kind = "gas"

[SF6]
name = "sulfur hexafluoride"
kind = "gas"

[N2O]
name = "nitrous oxide"
kind = "gas"

[CO2]
name = "carbon dioxide"
kind = "gas"

[O3]
name = "ozone"
kind = "gas"

[CO]
name = "carbon monoxide"
kind = "gas"

# Atomic hydrogen: not one of optmat's gases (no models), named only by reference
# calculations of the ionisation of a one-electron atom (zhao_2016's TDSE).
[H]
name = "hydrogen (atomic)"
kind = "gas"

# Molecules named only by reference data on their dissociation and ionisation (TC-954):
# not optmat's gases (no models).
[NO2]
name = "nitrogen dioxide"
kind = "gas"

[N2O5]
name = "dinitrogen pentoxide"
kind = "gas"

[NO]
name = "nitric oxide"
kind = "gas"

# The singly charged cations of the gases, in their ground state (TC-440). Their data
# (a static polarizability, for the Stark shift of the ionisation rates) are the ion's
# own and never enter the neutral gas's models; `kind = "ion"` keeps them apart.
["He+"]
name = "helium cation"
kind = "ion"

["Ne+"]
name = "neon cation"
kind = "ion"

["Ar+"]
name = "argon cation"
kind = "ion"

["Kr+"]
name = "krypton cation"
kind = "ion"

["Xe+"]
name = "xenon cation"
kind = "ion"

["H2+"]
name = "hydrogen molecular cation"
kind = "ion"

["D2+"]
name = "deuterium molecular cation"
kind = "ion"

["N2+"]
name = "nitrogen cation"
kind = "ion"

["O2+"]
name = "oxygen cation"
kind = "ion"

["CH4+"]
name = "methane cation"
kind = "ion"

["SF6+"]
name = "sulfur hexafluoride cation"
kind = "ion"

["N2O+"]
name = "nitrous oxide cation"
kind = "ion"

["CO2+"]
name = "carbon dioxide cation"
kind = "ion"

# Molecular cations named only by dissociative-recombination and fragmentation data
# (TC-954).
["NO2+"]
name = "nitrogen dioxide cation"
kind = "ion"

["NO+"]
name = "nitric oxide cation"
kind = "ion"

# Molecular dications named only by the transition dipoles of the density-matrix models
# of sequential double ionisation (TC-954).
["N2++"]
name = "nitrogen dication"
kind = "ion"

["O2++"]
name = "oxygen dication"
kind = "ion"

# Glasses. A glass's grade (Corning 7980, Suprasil 1, Lithosil Q2, ...) is a dataset
# parameter, not a separate material: grades of one glass differ in impurities (OH,
