# The Kerr response of fused silica: the long-pulse n2(lambda) and its Raman fraction
# (TC-393). Every measured self coefficient of the curated sources with a stated or
# inferable pulse length. Each source has a calibration scale with a 10 % prior (the
# spread of absolute calibrations between laboratories); per-point uncertainties are
# the sources' own. The fitted dispersion is below the two-photon edge (lambda >= 350
# nm: 2 hbar omega < 7.1 eV, below the 8.4 eV gap).
material = "SiO2"
description = "Fused silica's n2 from 350 nm to 3.5 um, with Hollenbeck's Raman response"
range_nm = [350.0, 3500.0]
# The Raman fraction is set by Stolen & Ippen's measured gain (below), not by a prior:
# Stolen et al. 1989's alpha = 0.18, the prior until TC-696, was derived from that gain
# and Hellwarth et al.'s spectra, so both would count the same measurement twice.
# Only the E^2 term of the dispersion: with the E^4 term free the curve turns over near
# 400 nm (a maximum, then falling towards the two-photon edge), which the near-UV data's
# scatter allows but physics does not (TC-393).
quartic = false

[[fitted]]
key = "desalvo_1996/n2_SiO2"
range_nm = [350.0, 3500.0]
note = "15-30 ps (per-row pulse_fs): eta = 1"

[[fitted]]
key = "adair_1989/n2_SiO2"
raman = "full"
note = "nanosecond three-wave mixing, electronic plus vibrational, no electrostriction (the paper)"

# Milam & Weber 1976: time-resolved interferometry, 125-ps pulses at 1064 nm (TC-594).
# Adair et al. 1987's silica (0.85e-13 esu) is not added: it equals adair_1989's value
# from the same apparatus and calibration, which is fitted.
[[fitted]]
key = "milam_1976/gamma_SiO2"
raman = "full"
note = "125 ps pulses: the full Raman response"

[[fitted]]
key = "white_1984/this_work_355_SiO2"
raman = "full"
note = "0.15-0.20 ns pulses"

[[fitted]]
key = "flom_2015/n2_SiO2"

[[fitted]]
key = "ensley_2019/n2_SiO2"

[[fitted]]
key = "jansonas_2022/eff_SiO2"

[[fitted]]
