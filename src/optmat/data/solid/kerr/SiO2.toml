# Validators: Milam's assessment (it averages originals fitted above), DeSalvo's 266
# nm value (2 hbar omega = 9.3 eV, above the gap: two-photon resonant), and Couairon's
# n2 from a measured critical power (model-dependent).
[[validators]]
key = "milam_1998/best_1053"
raman = "full"

[[validators]]
key = "milam_1998/best_uv_visible"
raman = "full"

[[validators]]
key = "desalvo_1996/n2_SiO2"
range_nm = [260.0, 270.0]

[[validators]]
key = "couairon_2005/n2"
sigma = 0.2

# The absolute Raman gain of fused quartz (TC-693): 1.5e-11 cm/W +- 10 % at 330 cm-1
# for a 526.0 nm pump, predicted as 2 omega_s n2(526 nm) f_R Im H_R(330 cm-1) / c with
# Hollenbeck & Cantrell's shape. It fixes f_R n2, so f_R is paired with that shape
# (TC-696). Hellwarth et al.'s nuclear share (0.21 +- 0.03, hellwarth_1975) is compared,
# not fitted: its cross sections and Stolen & Ippen's agree within their errors.
[[raman_gains]]
key = "stolen_1973/gain_amplifier"
