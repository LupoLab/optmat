# The complex index of copper from curated tables, joined by range (TC-619, TC-646).
# Each range is one source's pair of tables; nothing is averaged.
material = "Cu"

[[segments]]
real = "hagemann_1974/delta_Cu"
imaginary = "hagemann_1974/k_Cu"
range_nm = [3.09, 19.2]
reason = "Hagemann, Gudat & Kunz's DESY report SR-74/7, Table 3, 65-400 eV, which prints 1 - n (three decimals) instead of n from 65 eV: their own film transmission to 150 eV, Sonntag's to 450 eV. The table ends at 400 eV, where the printed 1 - n is 0.007; above it the decrement approaches the printout's resolution."

[[segments]]
real = "hagemann_1974/n_Cu"
imaginary = "hagemann_1974/k_Cu"
range_nm = [19.3, 41.35]
reason = "Hagemann, Gudat & Kunz's DESY report SR-74/7, Table 3, 30-64 eV: the Kramers-Kronig analysis of their own transmission of evaporated films (13-150 eV). Babar & Weaver's copper above 6 eV is joined to this report's, so the two meet at 30 eV to 2 % in n and 4 % in k."

[[segments]]
real = "babar_2015/web_n_Cu"
imaginary = "babar_2015/web_k_Cu"
range_nm = [41.4, 12400.0]
reason = "Babar & Weaver's Kramers-Kronig analysis of the absorptivity of polished single crystals (0.1-6 eV), joined to Johnson & Christy's and then Hagemann et al.'s data to 30 eV, as published on Weaver's website: 0.1-29.9 eV. The reference optical constants from the vacuum ultraviolet to the mid infrared. Stahrenberg et al.'s ellipsometry is 5-17 % higher in epsilon_2 at 2.5-9 eV; Johnson & Christy's films agree in k to -7/+4 % but not in n (2-4 times higher in the infrared, where the films' epsilon_2 is 2-4 times the crystals')."

[[segments]]
real = "ordal_1985/n_Cu"
imaginary = "ordal_1985/k_Cu"
range_nm = [12400.5, 56000.0]
reason = "Ordal et al.'s (1985) Kramers-Kronig analysis of their own infrared reflectance, 180-800 cm-1: the only measured copper beyond 12.4 um. It meets Babar & Weaver at 12.4-12.5 um with k 11 % lower (over 5.5-10.5 um, where both tabulate, Ordal's k is 9-10 % below Babar's): a step of that size at the join, and the difference is the uncertainty of the far infrared."
