# The complex index of aluminium from curated tables, joined by range (TC-619, TC-647).
# Each range is one source's pair of tables; nothing is averaged. The core is one
# self-consistent analysis (Shiles et al.), which the other two continue.
material = "Al"

[[segments]]
real = "rakic_1995/n_Al"
imaginary = "rakic_1995/k_Al"
range_nm = [0.79, 31.0]
reason = "Rakic's (1995) Table 2, 40 eV-1.56 keV: above the plasma edge its k is Shiles et al.'s (through Palik's handbook) and its n its own Kramers-Kronig result, which agrees with Shiles et al.'s to 0.3 % here. It prints five figures, where the Shiles tabulation's three leave k at 0.00x above 40 eV and 0.000 from 500 eV, and it samples the L edge (72.7 eV) every 0.05-0.1 eV."

[[segments]]
real = "weaver_1981/n_Al"
imaginary = "weaver_1981/k_Al"
range_nm = [31.5, 31000.0]
reason = "Shiles, Sasaki, Inokuti & Smith's self-consistent Kramers-Kronig analysis of the measured reflectance, ellipsometry, transmission and energy-loss data (Phys. Rev. B 22, 1612 (1980)), as tabulated in Weaver et al.'s Physics Data 18-2 (pp. 79-86), 0.040-39 eV: the reference optical constants of bulk aluminium, tested against the sum rules, the dc conductivity and the stopping power, and the data Ordal et al.'s (1988) table rests on above 320 cm-1. Rakic's analysis of films is within 1-2 % in k at 5-10 eV, within 2-4 % in k and 9 % in n below 2 eV, and differs at the plasma edge; the DESY report's n is 20-40 % lower at 0.2-1.3 eV; McPeak et al.'s template-stripped film is 21-31 % lower in |epsilon| (docs/metals.md)."

[[segments]]
real = "ordal_1988/n_Al"
imaginary = "ordal_1988/k_Al"
range_nm = [31500.0, 200001.0]
reason = "Ordal et al.'s (1988) Kramers-Kronig analysis of their far-infrared cavity measurements (30-300 cm-1) joined to Shiles et al.'s data: 50-300 cm-1. Beyond the Shiles tabulation's end (31 um) the only measured aluminium; where both tabulate it lies 1-3 % above Shiles et al.'s. Its printed epsilon above |1000| is ten times too small and corrected (TC-622); n and k are as printed."
