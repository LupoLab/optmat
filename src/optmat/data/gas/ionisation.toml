[Ne.reasons]
barrier_suppression_zhang = "Zhang, Lan & Lu 2014 Table XI, fitted to their SAE static rates; eq. (8) read with the + sign, which reproduces their own Table IX (TC-542)."
structure = "Tong, Zhao & Lin 2002 Table II: C_l from a self-interaction-free density-functional calculation, the atomic counterpart of the MO-ADK coefficients (their ADK row is kept in tong_2002 as a check)."
ion_polarizability = "Wang et al. 2021, CCSD(T) (solprop took the Hartree-Fock column, TC-441)."
barrier_suppression_alpha = "Tong & Lin 2005 Table 2, fitted to their TDSE rates."
ionization_energy = "NIST ASD 5.12, to Ne+ 2p5 2P3/2 (TC-443)."
orbital = "The m = 0 member of the p shell ionises fastest in a linearly polarised field (Ammosov et al. 1986, eq. 14)."

