# The curated ionisation parameters of each gas (optmat.gas.ionisation, TC-439, TC-441).
#
# Each entry names the datasets its values come from (`source/dataset`, or
# `source/dataset#row` for one row of a table) and says why each was chosen. The neutral's
# static polarizability is not named here: it is the static limit of the electronic part
# of the gas's fitted dispersion model (`fit/<gas>`, TC-441).
#
# Keys:
#   ionization_energy          an `ionization_energy` dataset of the gas
#   orbital                    the ionising orbital, as the sources name it
#   orbital_l, orbital_m       an atom's valence l (the ADK/PPT angular factor) and m;
#                              a molecule's m along its axis
#   structure                  named `tunnelling_structure_coefficient` datasets
#   default_structure          the recommended one of them
#   ion_polarizability         a `polarizability` dataset of the cation
#   barrier_suppression_alpha  Tong & Lin's alpha (an `ionization_model_parameter`)
#   reasons                    why, per choice

[He]
barrier_suppression_zhang = "zhang_2014/tableXI_He"
ionization_energy = "nist_asd_2026/ie_He_I"
orbital = "1s"
orbital_l = 0
orbital_m = 0
ion_polarizability = "wang_2021/ccsdt_He+"
barrier_suppression_alpha = "tong_2005/alpha_He"
default_structure = "tong_2002"
[He.structure]
tong_2002 = "tong_2002/cl_He"
[He.reasons]
barrier_suppression_zhang = "Zhang, Lan & Lu 2014 Table XI, fitted to their SAE static rates; eq. (8) read with the + sign, which reproduces their own Table IX (TC-542)."
structure = "Tong, Zhao & Lin 2002 Table II: C_l from a self-interaction-free density-functional calculation, the atomic counterpart of the MO-ADK coefficients (their ADK row is kept in tong_2002 as a check)."
ion_polarizability = "Wang et al. 2021, CCSD(T) (solprop took the Hartree-Fock column, TC-441)."
barrier_suppression_alpha = "Tong & Lin 2005 Table 2, fitted to their TDSE rates."
ionization_energy = "NIST ASD 5.12, to He+ 1s 2S1/2 (TC-443)."

