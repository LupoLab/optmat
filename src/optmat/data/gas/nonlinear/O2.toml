# The electronic second hyperpolarizability: Shelton's ESHG (1990, rescaled to Bishop &
# Pipin's He), with ab initio process dependence where available (TC-313).
gas = "O2"
description = "Oxygen: Shelton's 1990 ESHG with his gamma^vR (Table V formula) subtracted; B' from its prior only."
range_nm = [400.0, 20000.0]
b_prime_prior = [0.0, 1.4]
validators = [
    "wahlstrand_2012/n2_O2",
    "zahedpour_2015/n2_O2",
    "zahedpour_2019/n2_O2",
    "nibbering_1997/n2_instant_O2",
    "loriot_2009/n2_O2",
    "lundeen_1983/fwm_532_O2",
    "ward_1979/chi3_O2",
]

[[fitted]]
key = "shelton_1990/table3_O2_present"
subtract_formula = "shelton_1990/table5_gammavR_O2"

[[fitted]]
key = "shelton_1990/table3_O2_literature"
subtract_formula = "shelton_1990/table5_gammavR_O2"
