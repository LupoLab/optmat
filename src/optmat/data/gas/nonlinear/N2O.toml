# Nitrous oxide: one measured n2; the dispersion is borrowed from CO2 (isoelectronic).
gas = "N2O"
description = "Nitrous oxide: the Maryland n2 at 800 nm (Wahlstrand 2012; electronic plus the small vibrational part) is the only third-order datum in the library. The dispersion (A, B) is borrowed from CO2 with a 50 % (A) and 100 % (B) prior, so the value away from 800 nm carries that uncertainty. B' fixed at 0."
range_nm = [400.0, 20000.0]
a_prior = [1.25, 0.6]
b_prior = [2.4, 2.4]
validators = [
]

[[fitted]]
key = "wahlstrand_2012/n2_N2O"
