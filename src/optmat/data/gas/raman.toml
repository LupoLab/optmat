vibrational = "The two Raman-active bands at Danichkin's positions, their transition polarizabilities from Schrötter & Klöckner's cross sections relative to N2 with rho taken as 0 (no ratio curated: an upper bound on the mean element)."
vibrational_widths = "No N2O Q-branch width is curated: Chen et al. 2007's rotational dephasing time (23.8 ps at 2.4 atm) stands in, as a collisional width (a declared stopgap, TC-542)."
