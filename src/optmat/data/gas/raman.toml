constants = "C.-H. W. Wang's (1975) B0 and D0 of the (00^0 0) level as Weber 1979 reprints them. Only even J exist (I(16O) = 0, X 1Sigma_g+)."
anisotropy = "Bogaard et al.'s optical anisotropy at 632.8 nm as Gentle et al. 1989 reprint it."
rotational_widths = "Pinter's S(22), S(26), S(32) self-broadening (HWHM per atm, doubled) as Jammu et al. 1966 reprint them, held at S(22)'s value below (room temperature, taken as 295 K): the only per-line CO2 widths curated; no temperature law (TC-542)."
