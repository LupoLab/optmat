gas = "Xe"
description = "Chan et al.'s (1992) discrete lines (the unlisted members to the 2P3/2 limit as one pseudo-line), their absolute continuum from 13.5 to 398 eV, Henke's f2 above; the measured continuum scaled to Huot & Bose's dielectric static polarizability."

[lines]
dataset = "chan_1992/present_Xe"
total = "chan_1992/present_total_Xe"
pseudo_line_ev = 12.08          # just below the 2P3/2 limit, 12.130 eV

[[continuum]]
dataset = "chan_1992/continuum_Xe"
extend_to_ev = 12.130           # the 2P3/2 limit: the autoionising region at the first tabulated density

[[continuum]]
henke = "xe"
min_ev = 399.0

[constraint]
dataset = "kumar_2010/huot_bose_1991_Xe"
row = "1"
k = -2
region_max_ev = 399.0
