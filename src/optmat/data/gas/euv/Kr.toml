gas = "Kr"
description = "Chan et al.'s (1992) discrete lines (the unlisted members to the 2P3/2 limit as one pseudo-line), their absolute continuum from 14.7 to 380 eV, Henke's f2 above; the measured continuum scaled to Huot & Bose's dielectric static polarizability."

[lines]
dataset = "chan_1992/present_Kr"
total = "chan_1992/present_total_Kr"
pseudo_line_ev = 13.95          # just below the 2P3/2 limit, 14.000 eV

[[continuum]]
dataset = "chan_1992/continuum_Kr"
extend_to_ev = 14.000           # the 2P3/2 limit: the autoionising region at the first tabulated density

[[continuum]]
henke = "kr"
min_ev = 381.0

[constraint]
dataset = "kumar_2010/huot_bose_1991_Kr"
row = "1"
k = -2
region_max_ev = 381.0
