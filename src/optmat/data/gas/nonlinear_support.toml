# The resonance limits of each gas's hyperpolarizability support record (OEP 5; TC-870).
#
# Each gas names the datasets of its limits and says why each was chosen.
# `tools/fit/nonlinear_support_record.py` derives the records from this file, the stored
# fits and the datasets, and writes `data/gas/models/nonlinear_support/<gas>.json`; a
# test checks they are fresh. The resonances are those of the electronic response in
# the electric-dipole approximation, from the ground state (OEP 5, section 4).
#
# Keys of a gas:
#   ionisation            the `ionization_energy` dataset (`source/dataset`, or
#                         `source/dataset#row` for one row of a table)
#   ionisation_registers  the register entries of that choice
#   ionisation_qualifications
#   [<gas>.e1]            the lowest included level dipole-coupled to the ground state
#   [<gas>.e2]            the lowest included level two dipole steps from it, for one
#                         linear polarisation common to all legs
#   [<gas>.e2_any]        the same for any polarisation
#   [<gas>.missing]       why each of e1, e2, e2_any that is not given is missing
#
# Keys of a limit:
#   kind            `level`, `band_origin` or `absorption_evidence`
#   candidates      level: `level_energy` datasets; band_origin: chains `a + b + ...` of
#                   `electronic_state_energy` datasets whose 0-0 bands (`nu00_cm1`) sum to
#                   the state's origin above the ground state's v = 0. The limit is the
#                   smallest candidate.
#   dataset, at,    absorption_evidence: the measured dataset, the end of its sampled
#   detected        window taken (`lowest` or `highest` wavenumber), and whether
#                   absorption was detected there
#   registers       the register entries of the choice
#   qualifications  why, and the assumptions behind it

[He]
ionisation = "nist_asd_2026/ie_He_I"
ionisation_registers = ["TC-443"]
ionisation_qualifications = ["NIST ASD 5.12, to He+ 1s 2S1/2."]

[He.e1]
kind = "level"
candidates = ["nist_asd_2026/level_He_1s2p_1P1"]
registers = ["TC-862", "TC-865"]
qualifications = [
    "1s2p 1P1, the lowest odd-parity singlet J = 1 level: the lowest dipole-coupled to the 1s2 1S0 ground level. The triplets are spin-forbidden.",
    "NIST ASD brackets the value as semi-empirical; the dataset is use = check (TC-862).",
]

[He.e2]
kind = "level"
candidates = ["nist_asd_2026/level_He_1s2s_1S0"]
registers = ["TC-862", "TC-865"]
qualifications = [
    "1s2s 1S0, the lowest even-parity singlet level of J = 0 or 2, two dipole steps from the ground level through the 1snp 1P1 levels. 1s2s 3S1 is spin-forbidden.",
    "NIST ASD brackets the value as semi-empirical; the dataset is use = check (TC-862).",
]

[He.e2_any]
kind = "level"
candidates = ["nist_asd_2026/level_He_1s2s_1S0"]
registers = ["TC-862", "TC-865"]
qualifications = [
    "As e2: a singly excited 1snl singlet has J = L = l, which is even for even parity, so no singly excited level is even with J = 1, and any polarisation adds no candidate.",
]

