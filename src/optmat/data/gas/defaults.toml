# The recommended dispersion model of each gas, and why. A fitted model where the curated
# data support one; otherwise the best published formula, stated range and all.

[He]
model = "fit/He"
reason = "Ab initio backbone (Puchalski et al. 2016) with the microwave static value; 0.1 ppm in the near infrared, 0.01 % at 65 nm."

[Ne]
model = "fit/Ne"
reason = "Ab initio moments (Lesiuk et al. 2020) and DCGT; the experiments' dispersion is 2.5 sigma stronger (TC-92)."

[Ar]
model = "fit/Ar"
reason = "Ab initio moments (Lesiuk & Jeziorski 2023), DCGT and refractometry, with Peck & Fisher's shape; 3 ppm at 800 nm."

[Kr]
model = "fit/Kr"
reason = "Dielectric static values, Birch, and the ultraviolet interferometry of Smith et al. (1976); 80 ppm at 800 nm."

[Xe]
model = "fit/Xe"
reason = "Dielectric static value and Bideau-Mehu's vacuum ultraviolet; 190 ppm at 800 nm."

[H2]
model = "fit/H2"
reason = "On theory: Raj et al.'s 2018 ab initio average of normal H2 (0.1 %), with the refractometry's shapes (TC-95)."

[D2]
model = "fit/D2"
reason = "On theory: Raj et al.'s 2018 ab initio average of normal D2, with Shelton's D2/H2 ratios."

[N2]
model = "fit/N2"
reason = "Griesmann's VUV, Peck & Khanna and the 633 nm metrology agree."

[O2]
model = "fit/O2"
reason = "Smith et al. above the Schumann-Runge bands, Birch, Swift and Marchetti; not below 195 nm."

[CH4]
model = "fit/CH4"
reason = "Effective electronic oscillators fitted to the Cuthbertsons' and Watson & Ramaswamy's visible dispersion, Achtermann and Shelton's ratios (to 1.3 um), with HITRAN's vibrational bands; 240 nm-1.4 um (TC-146)."

[SF6]
model = "fit/SF6"
reason = "Effective electronic oscillators fitted to Swift, Vukovic, Achtermann and Shelton's ratios (229 nm-1.3 um), with HITRAN's vibrational bands; 230 nm-5 um (TC-146)."

[N2O]
model = "fit/N2O"
reason = "Effective electronic oscillators fitted to the Cuthbertsons' visible dispersion and the 633 nm metrology, with HITRAN's vibrational bands and the TRK sum; 450 nm-2 um (TC-146)."

[CO2]
model = "fit/CO2"
reason = "Effective electronic oscillators fitted to Old, Gentili & Peck, the visible data, the 633 nm and 1542 nm metrology, Shelton's ratios and Marchetti's 10 um values, with HITRAN's vibrational bands; 250 nm-1.4 um and the 8-12 um window (TC-148)."

[O3]
model = "fit/O3"
reason = "Measured absorption (Serdyuchenko et al. 2014, 293 K) by Kramers-Kronig, with the remote strength fitted to Swift, the Cuthbertsons' level and the ab initio static value plus its vibrational correction; complex (absorbing), n - 1 to about 2 %."

[CO]
model = "fit/CO"
reason = "Smith et al.'s ultraviolet interferometry, the Cuthbertsons' visible dispersion and Zhao et al.'s 1566 nm refractometry agree (reduced chi-squared 0.37), with HITRAN's bands; 167 nm to 2 um."
