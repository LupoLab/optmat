# Oxygen: the refractive polarizability from 195 nm (above the Schumann-Runge bands,
# 175-205 nm, where O2 absorbs) to the static limit. O2's paramagnetism does not follow
# optical frequencies; the 47.7 GHz values are excluded for it (the 60 GHz band).
gas = "O2"
description = "Oxygen: effective oscillators fitted to Smith, Huber & Parkinson's ultraviolet interferometry above the Schumann-Runge bands, Egan et al.'s 2026 refractometry at 633 and 1542 nm, Birch's 633 nm value, Swift's visible and 1.3 um values, Hohm's 325-633 nm dispersion (Mol. Phys. 1994; its shape at 4e-5, the level free) and Marchetti's 10.57 um point. Kumar & Thakkar's constrained dipole sums (built on the same refractivities) and Zhang's 800 nm value (distorted by the A band, per Kren) are validators."
range_nm = [195.0, "inf"]

validators = [
    "thalman_2014/bbces_O2_370",   # Rayleigh scattering (TC-711)
    "thalman_2014/bbces_O2_405",
    "thalman_2014/bbces_O2_660",
    { key = "schmidt_2003/A_eps_tau_O2", electric = true },   # static dielectric (TC-400)
    # Stoll's 1922 dispersion (438-922 nm) arches +-250 ppm about the fit even with a free
    # scale (chi-squared 125 for 24 lines); his N2 dispersion is 40 % off (TC-147).
    "stoll_1922/electrolytic_O2",
    "kumar_2011/o2",
    "zhang_2008/measured_O2",
]

[model]
# The temperature the polarizability refers to: a molecule's zero-density polarizability
# changes with temperature (rotational and vibrational averaging), which the model does
# not carry; datasets measured elsewhere are brought here where the coefficient is
# measured (TC-730).
reference_temperature_k = 293.15
effective = 2
effective_min_energy_hartree = 0.26
chi0_au = 0.0

[[fitted]]
key = "smith_1976/experiment_O2"
range_nm = [195.0, "inf"]    # the 184.3 and 191.85 nm points are inside the SR bands

[[fitted]]
key = "egan_2026/A_R_O2"     # 633 and 1542 nm, 7.2e-6 ): the level
# A_303, at 303 K; A_theta = 2.11(4)e-6 per K at 633 nm (2.02 at 1542 nm), combined u 9.4 %
# (egan_2026, pp. 4, 7-8): -21 ppm to 293.15 K, with 2.0 ppm for the coefficient (TC-730).
temperature = { measured_k = 303.0, coefficient = 2.11e-6, sigma = 0.20e-6 }

[[fitted]]
key = "birch_1991/alpha_O2"

[[fitted]]
key = "swift_1988/experiment_O2"

[[fitted]]
key = "marchetti_2006/alpha_p_O2"

# Near-infrared dispersion relative to a partner gas: N2/O2 ratio, nitrogen fixed at fit/N2.
[[fitted]]
key = "shelton_1990/density_N2_over_O2"

[[fitted]]
key = "hohm_1994b/alpha_O2"   # 325-633 nm dispersion (the original of hohm_1994's input)
free_scale = true             # level free: Hohm's absolute levels scatter by 0.1-0.5 % (TC-400)
shape_relative = 4e-5         # the shape's precision, from his argon against theory (TC-400)
