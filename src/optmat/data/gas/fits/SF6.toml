# Sulfur hexafluoride: effective electronic oscillators plus the HITRAN infrared bands
# (fixed). The near-infrared dispersion rests on Shelton's phase-matching ratios, which
# are consistent only with the infrared term (TC-104).
gas = "SF6"
description = "Sulfur hexafluoride: two effective electronic oscillators fitted to Swift's and Vukovic's refractivities (to 1.3 um), Achtermann's 633 nm and Burns et al.'s 458-633 nm molar refractivities and Shelton's N2/SF6 phase-matching ratios (458-1319 nm, harmonics to 229 nm), with the vibrational bands from HITRAN (Ref. [1164] cross-sections) fixed. Valid from 230 nm; the weak combination bands above 1100 cm^-1 are one pole, so the model is not a description of the infrared absorption region beyond about 5 um."
range_nm = [230.0, 5000.0]

validators = [
    "sneep_2005/rayleigh_SF6",   # Rayleigh scattering (TC-150)
    "ityaksov_2008/rayleigh_SF6",   # Rayleigh scattering (TC-150)
    # Watson & Ramaswamy's dispersion (436-644 nm) is inconsistent with Shelton's ratios
    # and Swift's values: chi-squared 135 for 5 points even with a free scale (TC-146).
    "watson_1936/dispersion_SF6",
    "watson_1936/zero_celsius_SF6",
    "vukovic_1996/A_R",
    { key = "hosticka_1974/A_eps_SF6", electric = true },   # static dielectric, 323-374 K (TC-606)
]

[model]
effective = 2
# Above the highest photon energy of the data (229 nm = 0.199 hartree), below SF6's
# first absorption (a modelling bound, not a datum).
effective_min_energy_hartree = 0.25
chi0_au = 0.0
starts = 12
infrared_max_wavenumber = 2000.0

[[fitted]]
key = "swift_1988/experiment_SF6"

[[fitted]]
key = "vukovic_1996/refractivity_25C"

[[fitted]]
key = "achtermann_1991/A_R_this_work_SF6"

# Near-infrared and visible dispersion relative to nitrogen (fit/N2 held fixed).
[[fitted]]
key = "shelton_1985_sf6/density_N2_over_SF6"

[[fitted]]
key = "shelton_1990/density_N2_over_SF6"

[[fitted]]
key = "burns_1986/A_R_SF6"   # 458-633 nm molar refractivity, 0.1 %
