# The bound two-photon levels of the noble gases (OEP 6, Phase 2a: curation only).
#
# Per gas: the assessment of its curated bound strengths, and the curated values each
# attached to a NIST level: two-photon strengths (calculated delta^TP, or a
# frequency-integrated cross section sigma_0^(2), measured or calculated) and the
# photoionisation of the level. The levels themselves are every even level with J = 0,
# 1 or 2 below the ionisation energy in the NIST lists held as returned
# (data/external/nist_asd/<gas>_I_levels.tsv, nist_asd_2026); helium's singlets only
# (two photons from 1 1S do not reach a triplet). The derivation
# (optmat.gas._two_photon_bound_derivation) reads this file, and
# tools/fit/two_photon_bound_record.py writes the stored records
# (data/gas/models/two_photon_bound/<gas>.json); a test checks they are fresh.
#
# A level is "configuration|term|J" as NIST prints it. An entry with no level is held
# unassigned, with its reason. The canonical strength is delta^TP per level (summed
# over M_J), parallel linear polarisation, equal photons, atomic units; a measured
# sigma_0^(2) is in m^4, profile normalised in the two-photon angular frequency,
# corrected for photon statistics. sigma_0 = 2 pi^3 alpha^2 a0^4 omega_au^2 delta^TP at
# the NIST level's photon frequency (TC-952).
#
# Keys of a strength:
#   dataset, row            the curated value
#   level                   the NIST level, or absent (unassigned) with "unassigned"
#   convention              "per_level" (delta as printed), "one_component" (a J = 2
#                           level's single tensor component S_xy^2, times 4/3: a
#                           derived value), or "sigma0" (a cross section as printed)
#   reason                  why this level

[He]
assessment = "checked"
assessment_reason = "Hattig et al.'s CCSD 1s2s 1S strength agrees within 1 to 4 % with Drake's exact two-photon decay rate (through Bassi and Baluja), Kumar et al.'s and Kapralova-Zdanska's two-photon couplings and Bassi and Baluja's partial closure; the simpler calculations (CCS, CC2, Henriksson et al.'s TDDHF) are 0.85 to 0.94 of it (TC-952). No measured cross section."

[[He.strengths]]
dataset = "hattig_1998b/S_He_CCSD_degenerate"
row = "CCSD"
level = "1s.2s|1S|0"
convention = "per_level"
reason = "1s2s 1S0, the only level of 1s2s 1S; a J = 0 level's strength is the same in both conventions."

[[He.strengths]]
