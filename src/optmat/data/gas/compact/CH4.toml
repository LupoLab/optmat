# The compact infrared terms of fit/CH4 (OEP 2): a few poles in place of its vibrational
# rules, fitted to their contribution over its first optical interval, shortened.
gas = "CH4"
parent = "fit/CH4"
description = "Methane: the vibrational rules of fit/CH4 as five poles below 240-1070 nm, with M0 and M-2 kept. The compact interval ends 4.7 % short of the 3nu3 band system's absorption at 1122.6 nm: closer to it, and in the parent's narrow intervals between its overtones to 1313 nm, no few poles follow the parent's band rules (TC-799)."
# Where the compact interval ends, nm: inside the parent's first optical interval.
longest_nm = 1070.0
# Per absorbing region, in ascending energy: below 1070 nm, and above 240 nm (the fold's
# share of the top band system, OEP 3).
poles = [5, 0]
random_starts = 4
