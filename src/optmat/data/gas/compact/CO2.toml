# The compact infrared terms of fit/CO2 (OEP 2): a few poles in place of its vibrational
# rules, fitted to their contribution over its optical interval.
gas = "CO2"
parent = "fit/CO2"
description = "Carbon dioxide: the vibrational rules of fit/CO2 (every band system to 7000 cm-1) as five poles below its optical interval, 250-1400 nm, with M0 and M-2 kept; the fold's share above it is represented by them."
# Per absorbing region, in ascending energy: below 1400 nm, and above 250 nm (the fold's
# share of the top band system, OEP 3).
poles = [5, 0]
# Without random starts the search can stop in a local minimum with a pole of zero
# strength (OEP 2, section 7).
random_starts = 12
