citation = "W. F. Chan, G. Cooper, X. Guo, G. R. Burton, and C. E. Brion, \"Erratum: Absolute optical oscillator strengths for the electronic excitation of atoms at high resolution. III. The photoabsorption of argon, krypton, and xenon [Phys. Rev. A 46, 149 (1992)]\", Phys. Rev. A 48, 858 (1993)"
doi = "10.1103/physreva.48.858"
library = "Chan_1993_ErratumAbsoluteOptical"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """The authors' erratum to chan_1992 (dipole (e,e) oscillator strengths of Ar, \
Kr and Xe): Tables V, VII and IX reprinted whole; no new measurement is described."""
notes = """Journal pp. 858-860 (PDF pages 1-3; the third page also carries an unrelated \
erratum by another author, on affiliations only). The whole text: 'Some values in Tables V, VII, \
and IX were incorrectly positioned. The tables are reproduced below in their entireties' \
(p. 858). Identity and authors checked against the page images (2026-09-29).

Nothing is taken here as a dataset: the reprinted tables repeat chan_1992's Tables V, \
VII and IX, and the corrections are applied to chan_1992's datasets (its [[errata]] and \
excluded_rows), so the measurement is recorded once. Compared cell by cell (library \
tables tbl_73d8dcfe47d0 = V, tbl_70b698d2df73 = VII(a), tbl_3ba04aab3432 = VII(b), \
tbl_2389d67b360e = IX(a), tbl_60dfca332c57 = IX(b), images checked against chan_1992's \
tbl_699514709b3b, tbl_0dd5fa4f52b5 and tbl_1dbc4809ef5a):

WHAT IT CORRECTS. Three rows print one value for an unresolved group of lines; the 1992 \
tables repeated it under each line of the group. The reprint prints it once, centred \
under a brace spanning the group:
- Table V(b), present work, argon: 0.0426 for 7s (15.186 eV) and 5d-underlined \
(15.190 eV) together, uncertainty printed '0.0063' (without parentheses) where 1992 \
printed 0.0426(0.0043) in both columns. The 'Total to ionization' is reprinted \
0.859 (0.043), confirming chan_1992's erratum of the printed (0.0043).
- Table VII(b), Geiger [82] electron impact, krypton: 0.187 for 5d-underlined (13.099) \
and 7s (13.114 eV) together, 0.054 for 6d-underlined (13.423) and 8s (13.437 eV) \
together (1992: each printed in both columns).
- Table IX(b), Delage and Carette [81] electron impact, xenon: 0.251 for 9s (11.583) \
and 5d' (11.607 eV) together, 0.171 for 8d (11.683), 8d-underlined (11.740) and 10s \
(11.752 eV) together (1992: in every column of each group). The braces are drawn under \
Geiger's row, above Delage and Carette's; Geiger's six values stay in their own columns.

WHAT IT LEAVES UNCHANGED. Sub-tables V(a), VII(a) and IX(a), and every other row of the \
(b) sub-tables, are reprinted with the same values in the same columns. In particular \
Wiese, Smith and Miles's 3d' value (14.304 eV) is reprinted 0.0106: chan_1992's erratum \
of it (to 0.106) rests on the table's own evidence, not on this erratum. The reprint's \
own misprints of names ('Greiger' in VII(a); 'Mielczarek and Mielczarek'; 'Delgage'; \
'Natali, Kuyatt, and Garrett' kept from 1992) touch no value. Where 1992 printed \
'Miekzarek' the reprint prints 'Mielczarek' (the correct spelling).

DOUBT: the argon blend's new uncertainty 0.0063 is 15 % of 0.0426, against the 10 % of \
every other non-resonance line; it is printed without parentheses, perhaps a typesetting \
slip for (0.0063) or for (0.0043). Taken as printed (TC-710)."""
