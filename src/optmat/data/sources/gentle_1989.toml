check = "Reproduced (2026-09-26): a line through Table I's A_K against 1/T weighted by the printed Table I errors gives 1.056 and 6.889, standard errors x sqrt(chi^2/dof = 11.2) = 0.269 and 0.096, as printed. The line reproduces Table I to +-0.3 % except 370.9 K (-0.8 %), 348.8 K (+0.8 %) and 330.9 K (-1.4 %). Intercept gives gamma^K = 81 eps0/N_A x 1.05e-28 = 0.1250e-60; slope gives Delta alpha Delta alpha^0 = 405 eps0 k/N_A x 6.89e-25 = 5.664e-80, both as printed."
notes = "The weighted least-squares line of Table II (note a: 'From weighted least-squares straight line fitted to data in Table I'); Fig. 3 plots it. Its errors are the scatter of the fit (see the record's notes)."
