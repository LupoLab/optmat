notes = "Table I (p. 3037): the zero-density molar Kerr constant A_K of CO2 (including the orientation term) at 9 temperatures, 299.2-489.5 K, 632.8 nm; 7-12 pressures each, 150-1040 kPa. Uncertainty: the stated 'overall accuracy ... +-2%' (p. 3036); the printed errors (+-0.003 to +-0.006, 'based on the standard deviations derived from the least-squares fitting ... together with appropriate allowance for systematic errors') are in the 'printed' column only. table2_gamma_K_CO2 and table2_anisotropy_static_CO2 are derived from these values: fit these or those."
