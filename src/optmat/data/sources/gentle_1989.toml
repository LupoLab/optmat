citation = "I. R. Gentle, D. R. Laver and G. L. D. Ritchie, \"Second hyperpolarizability and static polarizability anisotropy of carbon dioxide\", J. Phys. Chem. 93, 3035 (1989)"
doi = "10.1021/j100345a033"
library = "Gentle_1989_SecondHyperpolarizabilityStatic"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Absolute dc Kerr effect (electric birefringence) of CO2 (> 99.8 %) at 632.8 nm \
(2 mW He-Ne laser; Fig. 1 caption, Table I caption), about 299-490 K and 100-1000 kPa: \
the gas cell (Rogowski-profiled SC23 steel electrodes, effective length 0.500 +- 0.001 m, \
d^2/l = (5.236 +- 0.015) x 10^-5 m, confirmed to +-0.5 % against a small reference \
assembly; distortion < 1.5 % at 413 K) and a reference cell of liquid cyclohexane in \
series, a 512 Hz ac voltage on both and a dc bias on each, nulled at the fundamental by \
a feedback loop (k1 V1 = -k2 V2, Eq. 5); the reference cell calibrated with Faraday \
coils against an analyser micrometer (reproducible to better than +-1 %). Pressures \
(Baratron, +-0.5 %), temperatures (+-0.2 K control, +-1 K accuracy); molar volumes from \
Dymond & Smith's virial coefficients; mK0 = (2/27)(n_par - n_perp) V_m F^-2 fitted \
against 1/V_m at each temperature (Eq. 6) (pp. 3035-3037)."""
notes = """Pages are the journal's (3035-3038; p. = pdf page + 3034). The PDF's last page \
continues with the next article (Whittaker et al.), not used.

DEFINITIONS (p. 3035). mK = 6 n V_m [(n^2 + 2)^2 (eps_r + 2)^2]^-1 [(n_par - n_perp) \
F^-2]_(F=0) (Eq. 1); mK = A_K + B_K V_m^-1 + ... (Eq. 2); for a linear nondipolar \
molecule A_K = (N_A/(405 eps0))[5 gamma^K + (kT)^-1 Delta alpha Delta alpha^0] (Eq. 3), \
with gamma^K = [3 gamma_abab(-w; w, 0, 0) - gamma_aabb(-w; w, 0, 0)]/10 'the second Kerr \
hyperpolarizability', Delta alpha = alpha_zz - alpha_xx (optical), Delta alpha^0 the \
static anisotropy. gamma^K is Buckingham's dc Kerr gamma_K in the Taylor-series \
convention (SI: C m^4 V^-3 = C^4 m^4 J^-3; shelton_1994 Table XII reproduces it as \
2005 +- 513 au). Eq. (6): mK0 = A_K + [B_K + A_K (2 A_eps + A_R/2)] V_m^-1, with A_eps \
and A_R from the static (3.241 x 10^-40) and optical (2.933 x 10^-40 C m^2 V^-1) \
polarizabilities of refs 9 and 14.

WAVELENGTH: 632.8 nm, stated in the Fig. 1 caption ('L, 2-mW He-Ne laser (632.8 nm)') \
and the Table I caption ('Temperature Dependence of the Kerr Effect of Carbon Dioxide \
at 632.8 nm'): this settles the wavelength that shelton_1986_co2's note added in proof \
left unstated (TC-233).

ACCURACY. 'The overall accuracy of measurements of A_K is conservatively estimated at \
+-2% over the full temperature range' (p. 3036); Table I: 'the uncertainties quoted are \
based on the standard deviations derived from the least-squares fitting of straight \
lines to the density-dependence data, together with appropriate allowance for \
systematic errors' (p. 3037): +-0.003 to +-0.006 (0.1-0.3 %) on A_K. The A_K dataset \
carries the stated 2 % (level not stated); the printed errors are kept in the file's \
'printed' column. 'the values of B_K are too imprecise to draw any firm conclusions' \
(p. 3037).

TABLE II AND ITS ERRORS (checked here, 2026-09-26). A weighted least-squares line of \
Table I's A_K against 1/T, weighted by the printed Table I errors, gives intercept \
1.056 x 10^-28 and slope 6.889 x 10^-25, with standard errors 0.080 and 0.029 that \
become 0.269 and 0.096 when scaled by sqrt(chi^2/dof) = sqrt(11.2): Table II's 1.05 +- \
0.27 and 6.89 +- 0.10 exactly. So gamma^K = 0.125 +- 0.032 and Delta alpha^0 = 2.41 +- \
0.08 carry the scatter of the fit, not the +-2 % accuracy of A_K (Fig. 3's caption \
nevertheless says '2% uncertainties'). Weighted instead by the stated 2 %, the same \
data give intercept (0.89 +- 0.79) x 10^-28 (standard error, unscaled; chi^2/dof = \
0.13), i.e. gamma^K = 0.106 +- 0.094 x 10^-60, and slope 6.96 x 10^-25. The line \
reproduces Table I to within +-0.3 % except 370.9 K (-0.8 %), 348.8 K (+0.8 %) and \
330.9 K (-1.4 %). Checks of Table II: 81 eps0/N_A x 1.05e-28 = 0.1250e-60 (gamma^K); \
405 eps0 k/N_A x 6.89e-25 = 5.664e-80 (Delta alpha Delta alpha^0, printed 5.66 +- 0.08); \
5.66/2.35 = 2.409 (Delta alpha^0). 'the term (N_A/81 eps0) gamma^K contributes only \
4.4%, rather than 17%, of the value of A_K at 300 K' (p. 3037).

PARTS. gamma^K is the temperature-independent intercept: electronic plus vibrational \
(the authors: Shelton's ESHG-based prediction 0.073 +- 0.002, which allows for the \
electronic dispersion and a vibrational contribution, suggests 'the latter correction \
could be larger than was thought', p. 3038).

EARLIER KERR STUDY (Buckingham et al. 1970, buckingham_1970), pp. 3037-3038: its gamma^K \
0.56 +- 0.12 and Delta alpha^0 2.39 +- 0.18; 'A reexamination of the original data \
indicates that the intercept has an uncertainty, expressed as the standard deviation, of \
75% rather than the quoted value of 21%; furthermore, if the lowest temperature point \
(10^3 T^-1 = 3.97) is omitted, the value of gamma^K changes from +0.56 +- 0.42 to -0.06 \
+- 0.18' (text_reanalysis_buckingham_1970). Extrapolation ratio T_min/(T_max - T_min): \
3.0 there, 1.6 here. Laser Stark spectroscopy (Gough, Orr & Scoles 1983) gave Delta \
alpha^0 = 2.89 +- 0.20, 'about 20% too high', and from Rayleigh depolarisation and \
infrared intensities 2.57 +- 0.06 (text_anisotropy_static_literature).

Reproductions elsewhere: shelton_1986_co2/text_dc_kerr_gentle (the pre-publication \
110 +- 39 x 10^-63, not this paper's 125 +- 32 x 10^-63); shelton_1994/table12_CO2_dc_kerr \
(2005 +- 513 au = 0.125 +- 0.032 x 10^-60 / 6.2354e-65). The library copy has no \
validation warnings (identity reviewed: title, first author and year agree)."""

