citation = "J. M. St-Arnaud and T. K. Bose, \"Direct determination of the intermolecular interaction contribution to the refractive index of carbon dioxide and sulfur hexafluoride\", J. Chem. Phys. 71, 4951 (1979)"
doi = "10.1063/1.438308"
library = "StArnaud_1979_DirectDeterminationIntermolecular"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """The direct expansion method of st_arnaud_1976 (two nearly equal optical cells \
joined by a valve, the gas expanded from one into the other, the change of the \
summed optical path measured by a Hewlett-Packard 5525A He-Ne interferometer at 6328 \
A), extended to about 80 atm; B_n from the slope of Eq. (16) (a quadratic in the \
summed refractivities for CO2, linear for SF6), A_R from the absolute refractive \
index against pressure below 12 atm (quartz Bourdon gauge calibrated against a \
pressure balance). Both gases at 323 K. CO2 (Union Carbide; O2 < 1, N2 < 8 ppm), SF6 \
research grade, 99.18 % minimum (air and CF4 the main impurities) (pp. 4951-4952)."""
notes = """Identity: VALIDATED_WITH_WARNINGS in the library (a caption warning); first page \
checked (pdf page 2: J. Chem. Phys. 71, 4951 (1979), received 4 June 1979; pdf page 1 is \
the publisher's cover). The DOI is the library's. Page numbers are journal pages \
(pdf page + 4949).

DEFINITIONS as st_arnaud_1976 (Eqs. 1, 8-11): A_R, B_R of the Lorentz-Lorenz \
function against molar density; the Clausius-Mossotti A_eps, B_eps (Eq. 2) at low \
frequency, with B_eps = B_FIR + B_IR + B_R (Eq. 3). 'Our estimated error for A_R, B_R, \
and B_P is three standard deviations' (p. 4953).

A_R (6328 A, 323 K): CO2 6.658 +- 0.021, SF6 11.348 +- 0.021 cm^3/mol, both 0.23 % \
above the curated dispersion at 632.99 nm (6.643 and 11.322 cm^3/mol, fit/<gas> \
default models, computed 2026-09-25), within the stated 3 sigma. A_eps - A_R gives \
the 'atomic' (vibrational) polarizability: 9 % of the total for CO2, 31 % for SF6 \
(Eqs. 17, 18; alpha_atom 2.74 +- 0.10 and 20.59 +- 0.15 x 10^-25 cm^3, derived, not \
extracted).

B_R (6328 A, 323 K): CO2 3.3 +- 3.6, SF6 36.0 +- 1.8 cm^6/mol^2; the classical DID \
theory (Eq. 20, Lennard-Jones 6-12 with sigma = 3.819 A, epsilon/k = 218.8 K for CO2; \
7-28 with 4.68 A, 439 K for SF6) gives 6.9 and 24.8. C_R of CO2 was fitted but is \
'rather inaccurate' and not printed. B_eps - B_R agrees with B_FIR + B_IR (Table III: \
CO2 47.4 +- 4.5 against 49.0 +- 5; SF6 27.3 +- 4.6 against 24.73).

Not extracted: B_P (Table II, a density virial, and the literature B_P); Table I's \
Landolt-Bornstein A_R (SF6 11.41, CO2 6.647; footnote a, no wavelength or temperature) \
and Timoshenko et al. and Kholodov et al.'s CO2 A_R 6.687 and B_R 4.6 (243-363 K, \
Refs. 7, 8, no wavelength); Orcutt and Cole's CO2 B_R 5.3 at 323 K (Ref. 9 = \
orcutt_1967, which quotes 5.3 +- 0.9 as a fit of Michels and Hamers's data averaged \
over 4471-6678 A: no single wavelength); the derived alpha columns; B_FIR and B_IR \
(no quantity: SF6 0.53 (Ref. 27) and 24.2 (Ref. 3, calculated); CO2 48 +- 5 (Ref. 28, \
333 K) and 1.0)."""

