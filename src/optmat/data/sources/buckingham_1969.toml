    ["Eq. (8), Table 1", "632.8", "0.180", "0.009"],
]
table = "text"
quantity = "hyperpolarizability"
unit = "SI"
scale = 1e-60
abscissa_unit = "nm"
wavelength_medium = "standard_air"
use = "primary"
notes = "p. 677: '10^60 gamma(CH4) = 0.180 +- 0.009 C^4 m^4 J^-3' (2887 +- 144 au), the dc Kerr gamma_K of CH4 at 632.8 nm from the temperature-independent A_K of Table 1 by Eq. (8). A tetrahedral molecule has no orientation term, so gamma is the total dc Kerr response (electronic plus vibrational). The error is the 5 % absolute accuracy (calibration); level not stated. shelton_1986_ch4 finds it about 10 % above the ESHG-predicted dc Kerr value."
[datasets.uncertainty]
column = true
level = "not stated"
[datasets.parameters]
process = "dc_kerr"
convention = "T"
part = "total"
component = "K"
