notes = """Nothing extracted: no number is printed. Phys. Rev. Lett. 62(1), 112 (2 January \
1989) = PDF page 1; a scan with a text layer. Identity checked against the page \
(journal, volume, number, date, authors, received 15 November 1988).

WHAT IS ARGUED. The Fano profile (q + e)^2/(1 + e^2) of hutchinson_1988 'was quoted in \
the introduction specifically for weak fields', the experiment used strong fields, \
and 'No attempt was made to fit the weak-field Fano profile to the strong-field \
results'. The experiment ran 'under conditions of high xenon density where effects of \
collisions, ionization, and stimulated emission become significant'; tang_1989's \
calculation includes none of them, so agreement 'is not to be expected'. No pressure \
dependence, collision rate or dephasing value is given.

WHAT BEARS ON OEP 8. The dispute leaves the xenon LICS without a fitted q, width or \
shift: hutchinson_1988's line shape is not reproduced by tang_1989's collisionless \
calculation, and the authors attribute the difference to collisions (pure dephasing, \
OEP 8's gamma^phi), the 65-70 % ionisation and stimulated emission at 5-10 Torr, none \
quantified. knight_1990 (TC-989, Sec. 5) reads the exchange the same way ('collisional \
broadening would need to be included'). No light shift is printed (see \
hutchinson_1988's notes)."""
