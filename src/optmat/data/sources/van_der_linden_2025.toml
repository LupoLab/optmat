quantity = "nonlinear_index"
unit = "cm2/W"
scale = 1e-16
abscissa_unit = "nm"
use = "primary"
notes = "Table 1, this work (TWINS), average over 24-55 GW/cm^2; 5 mm Thorlabs window. Laser centred at 804 nm (printed 800)."
[datasets.uncertainty]
column = true
level = "2 sigma"
[datasets.parameters]
