table = "fig_1efe76bb16f6"
digitised = "raster"
quantity = "ionization_rate"
unit = "s-1"
abscissa = "intensity"
abscissa_unit = "W/cm2"
use = "check"
notes = "Fig. 6, He (solid line): the R-matrix Floquet rate at 390 nm, s-1, against W/cm2, read from the image (the record's notes), 1.05 to 2.45e14 W/cm2. The broad peaks near 1.6 and 1.9e14 are resonances of the Floquet calculation. 5 %: the reading, checked on Ar against the vector copy."
[datasets.uncertainty]
