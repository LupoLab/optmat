citation = "W. F. Chan, G. Cooper and C. E. Brion, \"Absolute optical oscillator strengths for discrete and continuum photoabsorption of carbon monoxide (7-200 eV) and transition moments for the X 1Sigma+ -> A 1Pi system\", Chem. Phys. 170, 123 (1993)"
doi = "10.1016/0301-0104(93)80098-t"
library = "Chan_1993_AbsoluteOpticalOscillator"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Dipole (e,e) spectroscopy. Low resolution (about 1 eV FWHM, 8 keV impact energy, zero \
mean scattering angle): energy-loss spectra at 7-50, 50-94 and 94-200 eV in 0.5, 1 and \
2 eV steps, converted with the spectrometer's known Bethe-Born factor; the \
valence-shell fraction above 200 eV estimated from a fit A E^-B to 90-200 eV (B = \
2.243; 6.7 %), and the whole area TRK-normalised to 10.3 (10 valence electrons plus \
0.3 for Pauli-excluded K-shell transitions) (p. 4). High resolution (0.048 eV FWHM, 3 \
keV): 7-20.3 eV, Bethe-Born converted and normalised to the low-resolution value at 20 \
eV (smooth continuum); vibronic band strengths from Voigt-profile fits (Figs. 3-4). \
The absolute scale is independent of any optical measurement and of the target \
density; no line saturation. Background gases and non-spectral electrons removed by \
quartering the sample pressure; energy scale from helium's 21.218 eV line admitted \
with the sample. Matheson CO, 99.5 % (pp. 4-5)."""
notes = """Values per molecule; no density or state involved (room-temperature CO, not stated).

Table 1 (p. 6): the low-resolution df/dE, 7-200 eV (184 points; sigma(Mb) = 109.75 \
df/dE(eV^-1), note a). No uncertainty is stated for it. The present data agree \
'extremely' well with Samson and Haddad's photoabsorption, are about 10 % below the \
1976 dipole (e,e) data of Ref. [64] (J. Phys. B 9, 675) and about 15 % above De \
Reilhac's at 25 eV and above 60 eV (p. 5). Olney et al. (1997, olney_1997 Section 3.1) \
later found this low-resolution energy scale about 0.25 eV too high. Two single points \
stand off their neighbours (41.0 eV: 11.69 between 10.91 and 10.64; 43.0 eV: 10.33 \
between 10.11 and 9.88); the image prints them so, and without other evidence they are \
kept.

Sums computed from Table 1 (2026-09-27; trapezoidal rule, with the A E^-B tail, B = \
2.243, from the 200 eV point): S(0) = 9.610 over 7-200 eV and 10.352 with the tail \
(the paper: 6.7 % above 200 eV, normalised to 10.3; 9.610/0.933 = 10.30); S(-1) = \
9.246, S(-2) = 12.662 au, S(-3) = 22.06, S(-4) = 45.05, S(-6) = 259.7. The S(-2) of \
12.66 au reproduces Olney et al.'s 12.64 au for 'the originally published CO spectrum' \
(olney_1997 table1_CO_published). The paper itself prints no S(k).

Discrete bands (Tables 2-4): oscillator strengths of X 1Sigma+ (v'' = 0) -> A 1Pi (v' \
= 0-12), B 1Sigma+, C 1Sigma+ and E 1Pi (v' = 0, 1), from Voigt-profile fits of the \
high-resolution spectrum; uncertainty 'about 5% for resolved peaks and about 10% for \
unresolved peaks' (p. 7), which peaks are unresolved not said. No transition energies \
are tabulated (the positions are Krupenie's, Tilford and Simmons's and Tanaka et \
al.'s): rows and label abscissa are v' (Table 2) or state and v' (Table 4: B0, B1, C0, \
C1, E0, E1). The literature columns are reproduced datasets. Table 4's values of \
Nielsen et al., Padial et al., Wood, Coughran et al. and Rose et al. are printed \
centred between the v' = 0 and 1 columns: the state's sum (text p. 11), stored as \
*_sum datasets with rows B, C, E.

Column sums of Table 2 (checked 2026-09-27) against Table 3: present 0.18074 (0.1807), \
Lassettre and Skerbele 0.19445 (0.1945), Eidelsberg et al. 0.19406 (0.1941), \
Chantranupong et al. 0.2250 (0.2250), Field et al. 0.197 against 0.187 (the v' = 4 \
value is misprinted: erratum), Kirby and Cooper 0.1668 against 0.1636 (no single \
misprint explains the 0.0032; kept). Chantranupong et al.'s v' = 7 value 0.0010 falls \
from 0.0168 at v' = 6 but is part of their printed total: kept.

Table 5 (p. 13): integrated oscillator strengths over energy intervals, 12.13-16.98 eV \
(present work, and Stark et al.'s and Letzelter et al.'s higher-resolution \
photoabsorption summed over the same intervals by Chan et al.). Two interval edges are \
misprinted (errata): '12.237-13.364' for 13.237 and '15.085-15.296' for 15.269. The \
present intervals from 12.130 to 14.016 eV sum to 0.645; the text (p. 11) gives 0.640 \
for 12-14 eV, against Berkowitz's 0.7921 (from Huffman et al. 1964) and 0.8165 (from \
Cook et al. 1965) (inline datasets). These high-resolution interval values overlap the \
low-resolution Table 1 (the same measurement programme at two resolutions; the HR \
scale is normalised to the LR at 20 eV): not independent of it.

Text only (p. 11): from Hesser's lifetimes (cited as '[43]', a misprint for [45]) the \
B and C v' = 0 oscillator strengths are 0.0054 and 0.119 with Dotchin and Chupp's \
branching ratios, 0.0079 and 0.1350 with Aarts and De Heer's; lifetime-derived values \
are therefore not in Table 4 (not extracted).

Transition moments (Section 3.3): |R_e(r_v'0)| of the A-X bands derived from Table 2 \
with Eidelsberg et al.'s Franck-Condon factors and r centroids (Fig. 6 only; no fit of \
the present values). The paper quotes Field et al.'s linear dipole moment function, \
Eq. (2), |R_e(r)| = 7.48(1 - 0.683 r), and De Leon's (1988), Eq. (3), |R_e(r)| = \
1.5741(1 - 1.17722 r + 0.35013 r^2), units not stated. Not recorded as formulas: they \
are other authors' functions with no value printed here to check them against, and at \
r = 1.128 A Eq. (2) gives 1.72 but Eq. (3) 0.185 (so Eq. (3) as printed is in other \
units or misprinted; De Leon's paper is not in the library)."""

