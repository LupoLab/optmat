citation = "K. C. Smyth, G. J. Rosasco and W. S. Hurst, \"Measurement and rate law analysis of D2 Q-branch line broadening coefficients for collisions with D2, He, Ar, H2, and CH4\", J. Chem. Phys. 87, 1001 (1987)"
doi = "10.1063/1.453333"
library = "Smyth_1987_MeasurementRateLaw"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """High-resolution cw stimulated Raman spectroscopy, amplitude- and \
phase-modulated (pp. 1002-1003): a single-mode Kr-ion pump at 676 nm (about 700 mW, < 15 \
MHz FWHM) and a ring-dye probe (about 1 MHz), copropagating through a multipass cell \
(10-40-fold), forward scattering; frequency differences to +-0.1e-3 cm-1 (3 MHz). \
D2 Q(0)-Q(5), v = 0 -> 1, at room temperature (296.0-298.5 K): pure D2 at 0.87-20.0 \
amagat; 5 % D2 in He and H2 at 0.93-5.56 amagat; 10 % D2 in CH4 and Ar at 0.66-5.55 \
amagat and 2.5 % D2 in Ar at 0.28-3.74 amagat (Q(3), Q(4) only). Widths against density \
fitted with the Dicke expression, Eq. (1); at 1-10 amagat each line fitted as a narrow \
major and a broad minor Lorentzian ('two-line fits'), the narrow one's width being used \
(pp. 1004-1006)."""
notes = """Identity checked against the first page. Page numbers are journal pages: \
the library pdf's page 1 is the publisher's cover sheet, and pdf pages 2-12 are pp. \
1001-1011. Material: D2 as supplied (normal, room-temperature ortho:para; not stated \
otherwise). HD appears only in the discussion. The foreign partners He, Ar, H2 and CH4 \
are the perturber ids.

WIDTH CONVENTION. HALF widths, per amagat. Eq. (1), p. 1004: 'Gamma (HWHM, cm-1) = D_0 \
k^2/2 pi c rho + rho gamma, where c is the speed of light and gamma is the density \
independent line broadening coefficient', k = 2 pi nu_Raman (forward scattering), D_0 the \
diffusion coefficient at 1 amagat, rho in amagat. Table I caption (p. 1005): 'Line \
broadening coefficients (HWHM, 10^-3 cm-1/amagat)'; Table III caption (p. 1008): 'units \
of 10^-3 cm-1/amagat, half-width at half-maximum'; Fig. 2 (p. 1005): 'Total linewidth \
measurements (half-width at half-maximum)'. The width law INCLUDES the Dicke term D_0 \
k^2/(2 pi c rho) (HWHM, cm-1 with D_0 in cm2/s at 1 amagat; formula eq1_dicke); gamma, \
the tabulated coefficient, excludes it.

UNCERTAINTIES. Table I caption: 'estimated uncertainties are +-3 % for J = 0-4 and +-5 % \
for J = 5'; p. 1005: 'A conservative estimate of the total uncertainty in the line \
broadening coefficients for Q(0)-Q(4) is +-3 % and for Q(5) is +-5 %, since a \
measurement was made at only one density for this transition' (level not stated). The \
two-line fits lower the coefficients by about 3 % (D2:D2, D2:He 2.8 %, D2:H2 2.2 %) and \
8-9 % (D2:CH4, D2:Ar) against single Lorentzians; lines measured at one or two \
densities were corrected by the same factor (pp. 1005-1006). The rms uncertainties of \
the sets (p. 1007): +-0.07 (D2), +-0.05 (He), +-0.09 (Ar), +-0.06 (H2), +-0.15 (CH4) \
x 10^-3 cm-1/amagat.

MIXTURES. The foreign-gas coefficients come from 2.5-10 % D2 mixtures; the paper does \
not say whether the D2:D2 share of the collisions (2.5-10 % of the density) was \
subtracted. D2:H2 Q(4) and Q(5) are enhanced by near-resonant rotational energy exchange \
with H2 (p. 1009) and are outside the Table II fit (J = 0-3).

DIFFUSION (text; no quantity). Pure D2 (p. 1005): effective D_0 = 0.984 +- 0.022 (Q(1)) \
and 0.967 +- 0.022 cm2/s (Q(2)) at 298.5 K and 1.0 amagat (mass diffusion 0.950, Ref. \
61); no J dependence. D2:He and D2:H2: the mass diffusion value 1.16 cm2/s at 296 K \
(Ref. 62) was used, to within 2 %. D2:CH4 0.471 +- 0.02 and D2:Ar 0.438 +- 0.02 cm2/s at \
298 K and 1.0 amagat (p. 1006; mass diffusion 0.487 and 0.530). Single-Lorentzian \
coefficients (p. 1005): Q(1) 1.36 and Q(2) 2.13 x 10^-3 cm-1/amagat, against 1.33 and \
2.06 from the two-line fits.

THE RATE LAW (Eqs. (2)-(3), p. 1006; Table II, p. 1007): a modified exponential gap \
(MEG) law for the rotationally inelastic rates plus a J-independent vibrational \
dephasing term; one formula per mixture (table2_*), each with the fit without and with \
the dephasing term. f(T0/T) = 1 (all at room temperature). The printed rms deviations \
are reproduced to 0.01 (see the checks).

OTHER TEXT VALUES. Keijser et al.'s pure rotational S(J) self-broadening of D2 at 293 K, \
HWHM, J = 0-5 (dataset keijser_S_branch, reproduced from keijser_1974, p. 1008). The O1(4) line in pure \
D2: 2.50 x 10^-3 cm-1/amagat (dataset o_branch_O4, p. 1009), and the elastic \
reorientation contributions derived from it and from the S lines (0.38; 0.80, 1.01, \
0.48, 0.29 for S(0)-S(3)): notes only, model-derived. The rotationally inelastic parts \
of Q(0), 2.46 (D2), 1.61 (D2:H2), 1.51 (D2:He), 1.12 (D2:Ar) x 10^-3 cm-1/amagat \
(pp. 1009), and Meier et al.'s rate-implied 9.6, 9.0, 4.2: notes only. The note added in \
proof: Blackmore, Green and Monchick's ab initio D2:He widths agree to 5-10 % for J = \
0-5, with vibrational dephasing 0.80-0.99 x 10^-3 cm-1/amagat for J = 0, 2, 4 (p. \
1010).

What this bears on: the D2 Q-branch width in use (Ottusch and Rockwell's law, TC-492; \
ottusch_1988 cites this paper and russell_1987): pure D2 Q(2), gamma = 2.06e-3 cm-1/ \
amagat HWHM, i.e. 4.12e-3 cm-1/amagat = 123.5 MHz/amagat FWHM, against Ottusch and \
Rockwell's 120; the Dicke term from D_0 = 0.967 (Q(2)) and nu = 2987 cm-1 is 2 pi nu^2 \
D_0/c = 54.2 MHz amagat HWHM (108.4 FWHM), against their 101 (Russell and Roh's). The \
foreign-gas coefficients (He, Ar, H2, CH4) are the only curated D2 Q-branch foreign \
broadening. Table III reads Murray and Javan's D2 coefficients as half widths (see \
russell_1987); the original (murray_1972, curated 2026-09-27) calls its widths full \
widths, so the question is open again (murray_1972's DOUBT)."""

