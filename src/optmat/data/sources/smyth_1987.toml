[[formulas]]
id = "eq1_dicke"
material = "D2"
equation = "Eq. (1), p. 1004; D_0 values pp. 1005-1006"
printed = "Gamma (HWHM, cm-1) = D_0 k^2 / 2 pi c rho + rho gamma"
variable = "k = 2 pi nu_Raman (nu in cm-1, forward scattering); D_0 the (effective) diffusion coefficient at 1 amagat in cm2/s; c in cm/s; rho in amagat; gamma the HWHM line broadening coefficient in cm-1/amagat (Table I); the Dicke term D_0 k^2/(2 pi c rho) = 2 pi nu^2 D_0/(c rho)"
state = "D2 at room temperature, pure and in mixtures"
density = "unknown"
range = "the Dicke regime k L << 1, above about 0.5 amagat in D2 (p. 1003); 0.28-20 amagat measured"
coefficients = { D0_D2_Q1 = "0.984", D0_D2_Q1_error = "0.022", D0_D2_Q2 = "0.967", D0_D2_Q2_error = "0.022", D0_D2_mass = "0.950", D0_He_H2_mass = "1.16", D0_CH4 = "0.471", D0_CH4_error = "0.02", D0_Ar = "0.438", D0_Ar_error = "0.02" }
check = "Against russell_1987's FWHM law (scratch, 2026-09-27): twice this Dicke term is (4 pi nu^2/c) D_0, Russell and Roh's Eq. (1) term, so the two laws agree in form. For Q(2) (nu = 2987 cm-1) D_0 = 0.967 gives 54.2 MHz amagat HWHM (108.4 FWHM), against Russell and Roh's 101.0 FWHM from D_0 = 0.901 (7 % apart, within Russell and Roh's D_0 error 0.06)."
notes = "D_0 of pure D2 at 298.5 K from Q(1) and Q(2) (two-line fits); no J dependence (p. 1005). 0.950 is the literature mass diffusion (Ref. 61). D2:He and D2:H2 used the literature mass diffusion 1.16 cm2/s at 296 K (Ref. 62) (p. 1005). D2:CH4 and D2:Ar from Q(1)-Q(2) at 298 K (p. 1006), 3.3 % and 17 % below the mass diffusion (0.487 and 0.530)."

[[formulas]]
id = "table2_self"
material = "D2"
equation = "Eqs. (2)-(3), p. 1006; Table II (tbl_a413288f32f6), p. 1007"
printed = "R_ji = alpha f(T0/T) [(1 + A E_i/kT delta)/(1 + A E_i/kT)]^2 exp(-beta Delta E_ij/kT) (E_i < E_j), R_ij from microscopic reversibility; gamma_j = 1/2 sum_{i != j} [R_ij(v = 0) + R_ij(v = 1)] + gamma_vib.dephasing"
variable = "E_i the rotational term energy of the lower level J_i, Delta E_ij = E_j - E_i, kT, in cm-1; alpha and gamma_j (HWHM) in 10^-3 cm-1/amagat as printed; f(T0/T) = 1 (room temperature); R_ij(v = 0) = R_ij(v = 1), with the ground-state level spacings; A fixed per collision pair; case a: no dephasing; case b: the best J-independent dephasing term"
state = "pure D2, room temperature"
density = "unknown"
range = "J = 0-5, room temperature (296.0-298.5 K)"
