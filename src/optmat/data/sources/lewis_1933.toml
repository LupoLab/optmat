notes = """A letter to the editor (Phys. Rev. 43, 837 (1933), dated May 3, 1933), one \
page; the library's page begins with Coates's letter on x-rays from mercury ions, \
which is unrelated, and the text columns are interleaved in the library's Markdown \
(read in order: '... The Q-branches are strong and the relative intensity of their \
lines is being investigated. ...'). Identity VALIDATED_WITH_WARNINGS (DOI \
10.1103/PhysRev.43.837.2); first page checked.

What the letter states about D2 (TC-105): 'In all cases the transitions \
involving even rotational levels are more intense than those involving the odd. This \
shows at once that the spin of H2 [the deuteron] is neither zero, 1/2 nor 3/2. It may \
be stated without reasonable doubt that this spin is 2/2, or twice the spin of H1.' \
No intensity ratio is printed: the letter gives the even-J-stronger alternation and \
the spin 1, qualitatively. It is the first of the three: murphy_1934 measures the \
ratio (1.97 +- 0.03 : 1), farkas_1934 prints the weights (t + 1)(2t + 1) and t(2t + 1), \
i.e. 6 and 3, and cites this letter for the alternation.

No refractive data: no datasets."""
