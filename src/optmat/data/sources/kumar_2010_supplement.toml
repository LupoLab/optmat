citation = "A. Kumar and A. J. Thakkar, J. Chem. Phys. 132, 074301 (2010), supplementary material"
doi = "10.1063/1.3315418"
library = "Kumar_2010_DipoleOscillatorStrength/supplement_01"
identity = "VALIDATED"
kind = "compilation"
technique = """Supplementary material (EPAPS, Ref. 84 of the paper) of Kumar and Thakkar's \
constrained dipole oscillator strength distributions (the paper is kumar_2010): the \
integrated DOS of the adopted DOSDs per energy interval (Table I, p. 2) and the \
ten-term pseudospectra {f_i, E_i} reproducing the dipole sums (p. 3)."""
notes = """The library record is UNVERIFIED and untitled; the first page names it: \
'Supplementary material for the paper "Dipole oscillator strength distributions with \
improved high-energy behavior. Dipole sum rules and dispersion coefficients for Ne, Ar, \
Kr, and Xe revisited" by Ashok Kumar and Ajit J. Thakkar' (kumar_2010; file name \
KumarMeathSupplementary.pdf). 'The reference numbers are the same as in the paper.'

Table I (IDOS): E_j in eV; the IDOS entries are for [E_j, E_j+1], the last interval \
ending at infinity; the 'Discrete' row sums 17, 20, 25 and 28 discrete transitions for \
Ne, Ar, Kr, Xe (note e; initial data from Refs. 50, 51, 74, 78, 83 and Natali et al., \
unpublished). Datasets 'idos_<gas>' (rows j, abscissa E_j the LOWER edge of the \
interval; FORMAT NEED: an integrated oscillator strength over an interval has no \
quantity of its own, so oscillator_strength at the lower edge is used) and \
'discrete_<gas>' (index abscissa). Check (2026-09-25): discrete + IDOS sums to 9.99956 \
(Ne), 18.0006 (Ar), 35.9994 (Kr), 53.9990 (Xe), the electron numbers (S(0) = N).

Constraints and initial data (Table I notes a-d; Refs. of kumar_2010): Ne: initial DOSD \
from Refs. 50 (Chan et al. 1992, neon = chan_1992_neon), 58 (Samson and Stolte 2002), 73 \
(Marr and West 1976), 60 (Suzuki and Saito 2003), 71 (Veigele 1973), 56 (Chantler \
1995), above E_48 Eq. (9) with b = 3.373(6); scaling spread 100 a-bar = 0.451, 100 s = \
0.601; refractivity constraints at 302.2 and 546.2 nm from Ref. 79 (Cuthbertson and \
Cuthbertson 1932 = cuthbertson_1932). Ar: Refs. 51 (Chan et al. 1992 = chan_1992), 73, \
58, 61 (Suzuki and Saito 2005), 69 (Watson 1972), 71; Eq. (9) above E_47 with b = \
-1.710(7), 100 a-bar = 0.337, 100 s = 0.512; refractivity at 325.1 and 633.0 nm from \
Ref. 62 (Hohm 1994, not in the library). Kr: Refs. 51, 72 (Lang and Watson 1975), 59 \
(Suzuki and Saito 2002), 52 (Henke et al. 1993 = henke_1993), 56; Eq. (9) above E_54 with \
b = -2.594(9), 100 a-bar = 0.147, 100 s = 0.262; refractivity at 177.1 and 263.2 nm from \
Ref. 81 (Smith et al. 1976 = smith_1976). Xe: Refs. 51, 58, 60, 71; Eq. (9) above E_60 \
with b = -2.702(10), 100 a-bar = 0.255, 100 s = 0.342; refractivity at 170.2 and 253.7 nm \
from Ref. 82 (Bideau-Mehu et al. 1981 = bideau_mehu_1981). The constraint values \
themselves are not printed. So the DOSDs (and the pseudospectra and kumar_2010's S_k) \
are tied to those refractivities at two wavelengths each: use as checks, not beside \
those data in a fit (as kumar_2010, TC-72).

Pseudospectra (p. 3, 'in a form suitable for cut-and-paste'): recorded as oscillator \
formulas. The columns are headed 'f' and 'E' ('The symbols f and E stand for f and \
epsilon respectively', p. 1), but the 'f' column holds the energies and the 'E' column \
the strengths (see the formulas' notes and TC-119). The Kr list is not a library \
table (the extraction turned it into a line of text on page 3); its numbers were \
checked against the pdf page image. Energies are in hartree: S(k) with the energies in \
hartree reproduces kumar_2010's moments."""

[[datasets]]
id = "idos_Ne"
material = "Ne"
file = "Ne/kumar_2010_supplement__idos_Ne.csv"
table = "tbl_8fedf8f12d10"
quantity = "interval_oscillator_strength"
abscissa_unit = "eV"
columns = { x_upper = "eV" }
use = "check"
notes = "Table I: integrated oscillator strength of the adopted constrained DOSD over [E_j, E_j+1] (the last to infinity), rows j = 18-48, abscissa E_j (eV, the lower edge; 21.56 eV - 100 keV), 31 intervals. Not a line: an interval integral (format need, source notes). Constrained to refractivity data (source notes): a check."

