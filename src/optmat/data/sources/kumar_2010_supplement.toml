[[formulas]]
id = "pseudospectrum_Ne"
form = "oscillator"
energy_unit = "hartree"
terms = { f = ["1.72761e-1", "7.05592e-2", "2.39565e-1", "5.90543e-1", "1.10197", "1.80237", "2.34931", "1.71152", "1.90122", "6.01847e-2"], E = ["6.18514e-1", "7.25160e-1", "8.27158e-1", "1.02722", "1.39273", "2.10855", "3.68085", "8.11069", "4.74204e+1", "5.96639e+2"] }
range_nm = [81.0, "inf"]
material = "Ne"
equation = "Ten-term pseudospectrum, page 3, tbl_ef48d8ee5ced"
printed = "columns headed f, E: 6.18514e-1 1.72761e-1; 7.25160e-1 7.05592e-2; 8.27158e-1 2.39565e-1; 1.02722 5.90543e-1; 1.39273 1.10197; 2.10855 1.80237; 3.68085 2.34931; 8.11069 1.71152; 4.74204e+1 1.90122; 5.96639e+2 6.01847e-2"
variable = "omega: photon energy in hartree; alpha(omega) = sum_i f_i / (E_i^2 - omega^2) in atomic units"
state = "none (per atom)"
density = "none"
range = "The pseudospectrum represents the constrained DOSD below the first resonance; its lowest pole is at 0.618514 hartree (73.67 nm). range_nm lower bound = 1.1 x that wavelength is the extractor's choice (TC-119), not the paper's."
check = "S(k) = sum f_i E_i^k reproduces kumar_2010's Table I for every integer k from 2 to -10 to 3e-4 (the table's rounding), S(0) = 10.0000; S(-2) = 2.66934 against 2.669. Half-integer k are not constrained: S(-0.5) is 3e-4 off (checked 2026-09-25)."
notes = "COLUMNS SWAPPED IN THE ORIGINAL: the column headed f holds the excitation energies (hartree) and the column headed E the oscillator strengths. Evidence: the E column sums to the electron number (the TRK sum rule S(0) = N), the f column's smallest entry is at the first resonance, and only this reading reproduces kumar_2010's S(k) (check). terms.f is therefore the printed E column and terms.E the printed f column (a structural relabelling, like a wrong caption; each coefficient is as printed). Not independent of the refractivity data used as constraints (source notes): a check against those data, not a fit to them."

