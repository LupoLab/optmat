citation = "A. Bideau-Mehu, Y. Guern, R. Abjean and A. Johannin-Gilles, J. Quant. Spectrosc. Radiat. Transfer 25, 395 (1981)"
doi = "10.1016/0022-4073(81)90057-1"
library = "BideauMehu_1981_MeasurementRefractiveIndices"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Fabry-Perot interferometry in the vacuum ultraviolet: MgF2 etalon plates \
coated with Al + MgF2, platinum hollow-cathode lamp (and an electrodeless iodine lamp \
for xenon at 164.1 nm), gas near 290 K (stabilised to +-0.025 K), pressure by mercury \
manometer, spacers 1-10 mm."""
notes = """Values are n - 1 at 0 degrees C and 760 Torr, reduced 'using the van der Waals \
relations for neon, xenon and krypton and Hilsenrath's tables for the compressibility \
correction for argon' (p. 396): a real-gas reduction. Uncertainty (p. 396): 'The total \
relative error for (n-1) varies from about 0.5% for neon to 0.3% for xenon at 164.1, \
152.5, and 140.4 nm. For xenon at 149.5 and 148.3 nm, absorption begins to appear and \
the accuracy is only about 1%.' The level is not stated. Argon and krypton are given \
the neon value, 0.5 %, as the bound of the stated range.

The library's captions of Tables 2, 4 and 5 are wrong (see the extraction script); the \
columns between the measurement and the fit reproduce other authors' values, and the \
cells the printed tables mark as extrapolations are not extracted. The paper's \
Sellmeier fits (last column of each table) are extracted as 'check' datasets: they \
test the published formulas (models), two of which are misprinted (Ne, Xe).

Reference numbering is the paper's; Ref. 19 is Heddle et al. (1963), whose values \
(332.0, 336.0 at 184.9, 180.7 nm) are not the ones in Heddle's paper (325 +- 3 at \
1850 A, 328 +- 3 at 1805 A)."""


