[[errata]]
dataset = "fit_Ne"
row = "253.7"
column = "value"
printed = "69.60"
corrected = "68.60"
reason = "The tabulated fit value at 253.7 nm does not follow the fit: the paper's neon formula, with its two misprints corrected, gives 68.60 there and reproduces every other row of the column to within one unit of the last digit (170.2, 164.1 and 152.5 nm are 0.01 off)."
evidence = "Formula evaluated at all ten wavelengths (2026-09-24): 68.60, 69.37, 69.98, 71.04, ..., 77.18 against the printed column; the printed 69.60 would also break the column's monotonic rise. Table image tbl_804a29eb8dd3.jpg shows 69.60 as extracted."

# The paper's dispersion formulas (Eq. (2) with a few terms), p. 397-400:
# n - 1 = 1.2055e-2 * sum_i f_i / (lambda_i^-2 - lambda^-2), lambda in um, at 0 degrees C
# and 760 Torr. Each term's numerator is an oscillator strength, its denominator the
# square of the line's wavenumber in um^-1; 1.2055e-2 is N e^2 / (8 pi^2 eps0 m c^2) at
# that state, in um^-2. The fits include longer-wavelength literature data (Cuthbertson
# for neon, Larsen for argon, Koch for krypton and xenon).

[[formulas]]
id = "sellmeier_Ne"
material = "Ne"
equation = "unnumbered, p. 397"
printed = "n - 1 = 1.2055 x 10^-2 (0.1063/(184.661 - lambda^-2) + 182.90/(376.840 - lambda^-1))"
variable = "lambda: vacuum wavelength in um"
form = "dn_sigma2"
terms = { scale = "1.2055e-2", B = ["0.1063", "182.90"], C = ["184.661", "376.840"] }
state = "1atm_0C"
density = "real"
range_nm = [140.4, 546.1]
check = "With the corrections, reproduces the 'our formula' column of Table 2 to within one unit of the last digit at all ten wavelengths except 253.7 nm, where the column itself is misprinted (dataset fit_Ne erratum)."
notes = "The second term as printed has lambda^-1 and numerator 182.90; both are misprints (lambda^-2 and 1.8290). Luna PR #425 transcribes C1 as 184.6661. The range is the fitted data's: 140.4 nm to Cuthbertson's longest wavelength (546.1 nm)."
[[formulas.corrections]]
term = "B"
index = 1
printed = "182.90"
corrected = "1.8290"
reason = "The printed numerator is 100 times too large (and the printed denominator has lambda^-1 for lambda^-2, which the form already corrects): with 182.90 the formula gives n - 1 = 6e-3, a hundred times the measured values."
evidence = "With B1 = 1.8290 and lambda^-2 the formula reproduces Table 2's 'our formula' column (69.37, 69.98, 71.04, 71.68, 72.00, 72.95, 73.60, 75.10, 77.18 at 228.8-140.4 nm) to within one unit of the last digit (72.944, 73.591, 75.091 against 72.95, 73.60, 75.10 at 170.2, 164.1, 152.5 nm); checked 2026-09-24, (second read 2026-09-25; TC-102)."

[[formulas]]
id = "sellmeier_Ar"
material = "Ar"
equation = "unnumbered, p. 398"
printed = "n - 1 = 1.2055 x 10^-2 (0.2075/(91.012 - lambda^-2) + 0.0415/(87.892 - lambda^-2) + 4.3330/(214.02 - lambda^-2))"
variable = "lambda: vacuum wavelength in um"
form = "dn_sigma2"
terms = { scale = "1.2055e-2", B = ["0.2075", "0.0415", "4.3330"], C = ["91.012", "87.892", "214.02"] }
state = "1atm_0C"
density = "real"
range_nm = [140.4, 567.7]
check = "Reproduces Table 3's 'our formula' column (303.2 at 253.7 nm, 395.5 at 140.4 nm: 395.4 computed)."
notes = "Terms: the 104.8 nm and 106.7 nm resonance lines and one effective term. The upper range is Larsen's longest wavelength as refractiveindex.info gives it (567.7 nm); check against Larsen."

[[formulas]]
id = "sellmeier_Kr"
material = "Kr"
equation = "unnumbered, p. 399"
printed = "n - 1 = 1.2055 x 10^-2 (0.2104/(65.474 - lambda^-2) + 0.2270/(73.698 - lambda^-2) + 5.14975/(181.08 - lambda^-2))"
variable = "lambda: vacuum wavelength in um"
form = "dn_sigma2"
terms = { scale = "1.2055e-2", B = ["0.2104", "0.2270", "5.14975"], C = ["65.474", "73.698", "181.08"] }
state = "1atm_0C"
density = "real"
range_nm = [140.4, 623.4]
check = "Does NOT reproduce Table 4's 'our formula' column: 0.1-0.7 % low (488.1 vs 488.7 at 228.8 nm, 651.6 vs 654.3 at 152.5 nm, 767.4 vs 772.7 at 140.4 nm). No single corrected coefficient explains it (best, C1 = 65.03, still leaves rms 0.47e-6, and C1 = 65.474 is the 123.6 nm line). Left as printed."
notes = "Terms: the 123.6 nm and 116.5 nm resonance lines and one effective term. Luna PR #425 transcribes C1 as 65.4742. Range upper end from refractiveindex.info (Koch's longest wavelength); check."

[[formulas]]
id = "sellmeier_Xe"
material = "Xe"
equation = "unnumbered, p. 401"
printed = "n - 1 = 1.2055 x 10^-2 (0.26783/(46.301 - lambda^-2) + 0.29481/(50.578 - lambda^-2) + 5.0333/(112.74 - lambda^-2))"
variable = "lambda: vacuum wavelength in um"
form = "dn_sigma2"
terms = { scale = "1.2055e-2", B = ["0.26783", "0.29481", "5.0333"], C = ["46.301", "50.578", "112.74"] }
state = "1atm_0C"
density = "real"
range_nm = [140.4, 670.8]
check = "With the correction, reproduces Table 5's 'our formula' column to 0.04 % above 180 nm (1033.3 against 1032.9 at 184.9 nm) and to 0.3-1 % at 152.5-148.3 nm next to the 146.9 nm resonance, where the column is sensitive to the rounding of C1 (46.289 instead of 46.301 brings the rms to 6e-4)."
notes = "Terms: the 146.9 nm line, the 129.5 nm and 125.6 nm lines together (the paper's wording), and one effective term. The formula is valid on both sides of the 146.9 nm line down to 140.4 nm but not across the 129.5 nm line. Range upper end from refractiveindex.info (Koch's longest wavelength); check."
[[formulas.corrections]]
term = "C"
index = 1
printed = "50.578"
corrected = "59.578"
reason = "The second term represents the 129.6 nm line, whose squared wavenumber is 1/0.1296^2 = 59.5 um^-2; 50.578 would put a pole at 140.6 nm, and the formula would give n - 1 = -0.023 at 140.4 nm against the measured +6.5e-4."
evidence = "With C2 = 59.578 the formula reproduces Table 5's 'our formula' column (809.9 vs 809.8 at 253.7 nm, 974.4 vs 974.2 at 194.2 nm, 651.2 vs 652.9 at 140.4 nm); Leonard (1974) gives the same pole for this line; refractiveindex.info uses 59.578. Checked 2026-09-24."
