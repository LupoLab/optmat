citation = "L. Yang, Y. Li, and H. Wei, Sci. Rep. 8, 16447 (2018)"
doi = "10.1038/s41598-018-34641-y"
library = "Yang_2018_HighPrecisionGas"
identity = "VALIDATED"
kind = "measurement"
technique = """Absolute group-refractivity measurement by comb-mode-resolved spectral \
interferometry: an Er fibre frequency comb (250 MHz, filtered to 5 GHz mode spacing by a \
fibre Fabry-Perot cavity, centre 1530.8 nm, 37.5 nm bandwidth) through a Jamin \
interferometer with a 396.000 mm double-spaced vacuum cell; the comb modes resolved by \
a VIPA and grating spectrometer on an InGaAs camera; the group refractivity N - 1 from \
the FFT of the spectral interferogram (Eq. (6)), one measurement in 10 ms (pp. 2-4)."""
notes = """No datasets: the only gas measured is ambient laboratory air (skipped: not a \
curated species), a 10-hour record of its group refractive index compared with \
Ciddor's equation, shown in figures only (Figs. 3, 4). The stated combined standard \
uncertainty is (N - 1) x 4.7 x 10^-6, 1.3 x 10^-9 for air, dominated by the cell length \
(p. 7). The conclusion (p. 7) proposes measurements of N2, He and CO2 in future work; \
none are reported."""
