citation = "Z.-L. Nie, J. Wang, C.-L. Hu, Y. R. Sun, C.-F. Cheng, Y. Tan and S.-M. Hu, \"Polarizability of molecular hydrogen and gas metrology\", Phys. Rev. A 111, 012801 (2025)"
doi = "10.1103/PhysRevA.111.012801"
library = "Nie_2025_PolarizabilityMolecularHydrogen"
identity = "VALIDATED"
kind = "measurement"
technique = """Fabry-Perot gas refractometers (USTC; the instrument of zhao_2026): 10 cm \
ULE cavities (R ~ 99.9 %, FSR 1.5 GHz, mode width ~0.4 MHz) in a vacuum cell in an \
aluminium cylinder at about 297.53 K (calibrated platinum resistance thermometer, < 5 \
mK), a 1566 nm fibre laser (< 10 kHz) PDH-locked to a cavity mode, the mode frequency \
beaten against a reference laser (drift ~0.1 Hz/s). n - 1 from the mode shift, Eq. \
(2), with the bulk modulus K = 3.3372e10 Pa and mirror-deformation d_1 = 1.6119e-13 \
Pa^-1 (Opt-1; d_2 = 0 for Opt-2) calibrated at 70 kPa with ARGON against a Fluke \
PG7601 piston gauge (11 ppm) taking A_eps(Ar) = 4.140686(10) cm^3/mol (Gaiser and \
Fellmuth 2018, gaiser_2018). Pressure from an Inficon CDGSci manometer calibrated \
against the optical gauge, u = sqrt((20e-6 p)^2 + (1.5 Pa)^2). Gases 99.9999 %; H2 \
through a liquid-nitrogen trap. Pressure points 2-100 kPa, several series; the \
static A_eps from each point through Eqs. (1) and (3), weighted mean (pp. 1-4)."""
notes = """Identity VALIDATED; first page checked (pdf page 1: Phys. Rev. A 111, 012801 \
(2025), published 7 January 2025). Page numbers are the article pages 1-5 (= pdf \
pages).

WHAT IS MEASURED AND WHAT IS PRINTED (the same scheme as zhao_2026, whose record \
explains it at length). The refractometer measures n - 1 at 1566 nm (vacuum). Eq. (1) \
reduces it to the refractive molar polarization A_eps'(omega) + A_mu; the authors \
subtract A_mu (Table I; Refs. 32, 33) and convert to the static A_eps with Eq. (3), \
the electronic dipole sums S(-4), S(-6), S(-8) of Table I ('S parameters are from Ref. \
[21]', Olney et al. 1997, for all four gases). They are not Olney et al.'s own sums but \
comparison rows of Olney's Table 3 (olney_1997, curated 2026-09-26): N2 and H2 are \
Zeiss et al.'s DOSD (zeiss_1977), Ne and Ar Kumar and Meath's (kumar_1985); the \
parenthesised uncertainties are not in Olney et al. and are Nie et al.'s own. Only the static A_eps is printed \
(Table II, the text, the abstract). The datasets A_R_1566_* are RECONSTRUCTED by \
tools/extract/nie_2025.py, inverting Eq. (3) exactly (see its docstring: the reduced-\
mass factor applied to H2 with the proton mass, +5 ppm; omitted for N2 and Ne, < 0.1 \
ppm). Their A_mu convention is that of Rourke (A_mu = chi_M/3, SI): Ar -80.9(6)e-6 \
cm^3/mol equals rourke_2021's -8.09(57)e-5, and Ne -29.2(6)e-6 is near lesiuk_2020's \
chi_0 converted, -31.7e-6.

WHAT THE STATIC VALUES INCLUDE. As in zhao_2026: the electronic polarizability plus \
the (negative) infrared response at 1566 nm, which the conversion does not remove; no \
static vibrational polarizability. N2, Ne and H2 have no infrared-active vibration, so \
here the static values are the electronic (vibrationally and rotationally averaged, \
297.53 K) static polarizabilities. For H2 the value is for normal hydrogen at 297.53 K; \
the natural D/H ratio 'should be corrected by -2 x 10^-6' (p. 4).

NOT INDEPENDENT OF ARGON: the pressure scale (K, d) is calibrated with argon's A_eps \
from gaiser_2018 at one point (70 kPa); every result here is relative to it. zhao_2026 \
in turn calibrates with this paper's N2 value.

UNCERTAINTY (Table II, ppm; the level is not stated in the table, taken as one \
standard uncertainty like the paper's k = 1 gauge uncertainties): T 16, p \
25, K 11, purity 1, outgas 0.2/0.9/0.5, frequency and L_cav < 0.1, statistics 9/26/5, \
A_mu 0.1/0.6/0.2, B_eps 3/<0.1/2, B_T 12/20/4, S(i) 7/1/12 (N2/Ne/H2); totals 36, 46, 35 \
(each the root sum of squares, checked). The reconstructed A_R keeps all but S(i) and \
A_mu: 35.2 (N2), 45.6 (Ne), 32.4 (H2) ppm.

COMPARISONS (computed 2026-09-25): H2 static 2.031027(71) is 26 ppm above raj_2018's \
normal-H2 static average at 296.15 K (5.4332744 au = 2.030975 cm^3/mol) and 0.00023 \
above Sun et al.'s 2.03080(12), which omits relativistic and QED terms (the authors \
estimate 60 ppm, p. 4). Ne static 0.994742(46) is 31 ppm above gaiser_2018's \
0.9947114(24). N2 4.38705(16) is 59 ppm above the Egan et al. value 4.38679(7). The \
reconstructed Ne A_R(1566) 0.995627(45) is 44 ppm above rourke_2021's A_R at 1550 nm \
(0.9956018(34)) moved to 1566 nm with Olney's sums (0.995583). Lesiuk et al.'s Ne \
value as quoted, 0.99470(13) cm^3/mol, is 2.66103 au, not lesiuk_2020's alpha_0 \
2.66080 au (0.994615 cm^3/mol; 86 ppm lower): the quoted value may include \
something else (the magnetic term would lower it); not resolved.

Text values not extracted as datasets: Egan et al.'s Ne 0.994598(16) cm^3/mol (p. 4; \
Nie et al.'s conversion of egan_2019, like the N2 value of Table II); Klopper et al.'s \
0.99503(75) (already gaiser_2018/klopper_2004_Ne); the calibration value A_eps(Ar) = \
4.140686(10) (gaiser_2018's). Not extracted: Table I's B_T and B_eps (Ar -16.1(5), \
1.72(11); Ne 11.0(5), -0.0930(5); N2 -5.5(3), 1.12(30); H2 14.1(1), 0.06(10); \
cm^3/mol and cm^6/mol^2 at about 297.5 K, sources Refs. 34-37 not assigned per gas), \
the argon column (a calibration input, not a result), the per-pressure points \
(figures only)."""

