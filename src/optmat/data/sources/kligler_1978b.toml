notes = "p. 311: 'This radiative lifetime is in excellent agreement with the theoretical value of 90 ns derived from the theoretical studies of Wolniewicz [7] and the Franck-Condon factors of Spindler [10].' Wolniewicz's E,F -> B transition moments and Spindler's Franck-Condon factors, combined by an unnamed hand (the Letter does not say whether by the authors); check, not either source's own value. No uncertainty."
[datasets.parameters]
method = "calculated from Wolniewicz's E,F -> B transition moments (J. Chem. Phys. 51, 5002 (1969)) and Spindler's Franck-Condon factors (J. Quant. Spectrosc. Radiat. Transfer 9, 1041 (1969)), as cited"

