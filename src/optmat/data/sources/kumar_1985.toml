[[errata]]
dataset = "leonard_barker_Kr"
row = "-4"
column = "value"
printed = "5.665"
corrected = "5.665e1"
reason = "The power of ten '(1)' is missing: S_-4 of krypton is about 56 (the adopted value is 5.632(1) = 56.32), and the column rises monotonically from S_-3 = 29.44 to S_-5 = 116.4."
evidence = "Table image tbl_1b74f66df9be.jpg prints '5.665' with no exponent in the Leonard and Barker krypton column, beside '5.632(1)' adopted; every other entry of the S_-3 ... S_-8 rows carries (1) or (2) for krypton. Checked 2026-09-24."
