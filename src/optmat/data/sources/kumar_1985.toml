citation = "A. Kumar and W. J. Meath, Can. J. Chem. 63, 1616 (1985)"
doi = "10.1139/v85-272"
library = "Kumar_1985_IntegratedDipoleOscillator"
identity = "VALIDATED_WITH_WARNINGS"
kind = "compilation"
technique = """Constrained dipole oscillator strength distributions (DOSDs): measured \
photoabsorption and fast-electron energy-loss oscillator-strength data (discrete lines \
from Moore's levels and several f-value sources; continuum from the references in \
Tables 8-11; Henke et al. and Veigele's photoelectric cross sections at high energy; \
the Stobbe formula above 100 keV), each spectral region scaled by (1 + a_j) (Eq. [5]) so \
that the whole distribution satisfies the Thomas-Reiche-Kuhn sum rule S_0 = Z and two \
molar refractivities R_lambda = (4 pi/3) N_A alpha_d(lambda) (Eq. [6]); the adopted \
DOSD is the one of least overall adjustment (STD, about 0.5). Starting distributions \
followed Berkowitz's (1979) analysis of the rare-gas spectra (pp. 1616-1618, 1623)."""
notes = """Only the rare gases are curated: HF, HCl and HBr (Tables 1-7, and their columns \
in Table 2) are not species of the package and are skipped.

Dipole sums S_k = sum_i (E_i/2R)^k f_i + integral (E/2R)^k (df/dE) dE (Eqs. [1], [4]), \
atomic units (energies in hartree); S_-2 = alpha_d/a0^3 is the static polarizability, \
S_0 = Z by construction, and S_-2, S_-4, S_-6, ... are the Cauchy coefficients of \
alpha(omega).

Refractivity constraints (captions of Tables 8-11 and p. 1623): Ne R(5462.25 A) = \
1.00537 and R(2894.44 A) = 1.02573 cm^3/mol from Cuthbertson and Cuthbertson (1932) \
'correcting for non-ideal behaviour by using the second virial coefficient of Michels \
et al.'; Ar R(6329.9 A) = 4.1973 and R(4766.2 A) = 4.2407 from Coulon, Montixi and \
Occelli (1981); Kr R(2632.1 A) = 7.0106 and R(1770.9 A) = 8.3522 from Smith, Huber and \
Parkinson (1976); Xe R(2537.0 A) = 12.1423 and R(1702.0 A) = 17.7290 from Bideau-Mehu \
et al. (1981). These are extracted as reproduced molar refractivities (constraint_*); \
the S_k (k < 0) are therefore not independent of those refractivity data. Wavelengths \
are vacuum wavelengths (they are those sources' vacuum values: 5462.23/2894.44 A, \
263.21/177.09 nm, 253.7/170.2 nm).

Uncertainties (p. 1628): 'For the rare gases the estimated errors in the S_k, for -6 \
<~ k <~ 0, are <~1%. L_0 and S_1 are uncertain by ~2%'; S_k for k >= 1, 'particularly \
for k = 2, can have uncertainties of ~3%'; all 'under the assumption that the values of \
the molar refractivity constraints ... are reliable (errors <~0.5%)'. No level stated.

Table 12 misprint: Leonard and Barker's krypton S_-4 is printed '5.665' without its \
power of ten (image checked); 56.65 fits between S_-3 = 29.44 and S_-5 = 116.4 and the \
adopted 56.32 (erratum).

Integrated oscillator strengths (Tables 8-11): the format has no quantity for an \
oscillator strength integrated over a photon-energy interval (it needs two energies). \
They are stored as oscillator_strength with an index abscissa (the row's position) and \
the interval in eV as the row id, e.g. '21.47-21.57' or 'discrete:16.67-21.48' (the \
whole discrete spectrum); the reference number of each cell's data is in the printed \
cell. Only the 'Adopted DOSD' column is extracted; the other columns are the \
integrated initial input data of individual references (one reference per cell, \
several references per column), not extracted. Table 9 (image checked): \
Ar initial-data column 2 prints '7.374 (81)' at 30.0-35.0 eV, apparently for 7.374(-1); \
not extracted.

No pseudo-spectrum is given: 'The pseudo-DOSDs for the hydrogen halides and the rare \
gases will be presented elsewhere' (p. 1628; Kumar and Meath, Mol. Phys. 54, 823 \
(1985), not in the library). Not extracted: the logarithmic sums L_k (no quantity), \
Table 12's footnotes (Hartree-Fock S_2, S_1, S_-1 of Cummings 1975 and CI of Saxon \
1973, Naon et al. 1975; the Ne CI S_2 '2.599' and HF S_1 '1.514(3)' are misprinted \
for 2.599(4) and 1.514(2), compare kumar_2010)."""

[[datasets]]
id = "dosd_Ne"
material = "Ne"
file = "Ne/kumar_1985__dosd_Ne.csv"
table = "tbl_9594b1549318"
quantity = "interval_oscillator_strength"
abscissa_unit = "eV"
columns = { x_upper = "eV" }
use = "check"
notes = "Table 8 'Adopted DOSD': the integrated dipole oscillator strength over each photon-energy interval (eV, the row id; first row the whole discrete spectrum, 16.67-21.48 eV); the index abscissa is the row's position (the format has no integrated-oscillator-strength quantity, source notes). Absorption edges 48.5 eV (L1) and 866.9 eV (K). Data sources of the adopted cells (reference numbers in the printed cells): Radler and Berkowitz 1979, Samson 1966, Ederer and Tomboulian 1964, Henke et al. (33), Veigele (34) and the Stobbe formula; discrete part from Moore's levels and refs. 60-65. The column sums to 10.0003 (S_0 = 10 by construction)."

