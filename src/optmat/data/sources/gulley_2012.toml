[[formulas]]
id = "propagation_model"
material = "SiO2"
equation = "Eq. (1), p. 013808-2, and Table I"
printed = "dA/dz = (i/(2k0)) T^-1 nabla_perp^2 A + i D_b A + i (k0 n2/n0)(1 - f_r) T I A + i (k0 n2/n0) f_r T [int_-inf^tau dtau' R(tau - tau') I(tau')] A - (W_PI U/(2I)) A - (sigma/2)(1 + i omega0 tau_c) G^-1 [rho A]; I = (1/2) n0 c eps0 |A|^2; D_b = sum_{m>=2} (k_m/m!)(i d_tau)^m; T = 1 + (i/omega0) d_tau; G = 1 + (i/omega0) g d_tau; g = (-i omega0 tau_c)/(1 - i omega0 tau_c); sigma = e^2 tau_c/(m_e n0 eps0 c (1 + omega0^2 tau_c^2)); R(tau) = [(tau_1^2 + tau_2^2)/(tau_1 tau_2^2)] exp(-tau/tau_2) sin(tau/tau_1)"
variable = "A: complex field envelope, E = (1/2) A exp[i(k0 z - omega0 t)] + c.c.; tau = t - z k_1; rho the free-carrier density from Rethfeld's multiple rate equation (rethfeld_2004)"
coefficients = { tau_1 = "32 fs", tau_2 = "12.2 fs", f_r = "0.18", n0 = "1.45", k_2 = "361 (unit printed fs^2 W^-1)", n2 = "2.48e-16 cm^2/W", U = "9 eV", tau_c = "10 fs (chosen)", tau_rec = "150 fs" }
reproduced_from = ["J. R. Gulley and W. M. Dennis, Phys. Rev. A 81, 033818 (2010)"]
check = "sigma peaks at tau_c = 1/omega0 = 0.425 fs at 800 nm (printed 'approximately tau_c = 0.42 fs'); at tau_c = 10 fs, sigma = 1.32e-18 cm2 (computed, not printed) (2026-09-26)."
notes = "The Drude dispersion operator G is the paper's subject (ref. 30); only the GVD term of D_b is kept. P_cr is written lambda^2/(8 pi n0 n2) in the self-focusing length z_sf = pi w_xy^2/(lambda sqrt(P/P_cr - 1)) (p. 013808-4; source notes, finding 3)."
