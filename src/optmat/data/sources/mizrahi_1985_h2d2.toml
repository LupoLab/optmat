citation = "V. Mizrahi and D. P. Shelton, Phys. Rev. A 32, 3454 (1985)"
doi = "10.1103/physreva.32.3454"
library = "Mizrahi_1985_NonlinearSusceptibilityH2"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Electric-field-induced second-harmonic generation (ESHG) with periodic \
phase matching (150 electrode pairs, 2.69 mm spacing), cw argon-ion and dye lasers at \
457.9-700 nm, the gas density scanned through the phase-match peak; H2 measured \
against He and against D2 in triplets; pressures by capacitance manometer (0.15 %) \
and Bourdon gauge (He, 0.1 % of 160 bar), densities with virial corrections, T = 22 C \
(pp. 3455-3456)."""
notes = """No linear-dispersion data: nothing is extracted. The paper measures ratios of \
the third-order susceptibility chi(3)(-2w; w, w, 0), H2/He at 19 and H2/D2 at 9 \
wavelengths (Table I, raw and corrected for the vibrational resonance), extrapolates \
them to w = 0 with A(1 + B w^2) (B = 9.01(22), 8.31(21), 0.47(13), 0.24(13) x \
10^-10 cm^2 for the four columns, Table I caption) and compares chi(3)el(0) of H2 \
(647 +- 4 a.u., with chi_He(3)(0) = 42.8 a.u.) and the H2/D2 ratio (1.025 +- 0.004) \
with theory (Table III). The phase-match densities, which would measure n(2w) - n(w), \
are not tabulated (they enter Eq. (4) only), and the phase-match pressure is given \
only as 'of order 1 atm (T = 22 C), except for helium ... of order 100 atm' (p. \
3455). The linear polarizability appears only through alpha(R) plotted in Fig. 4 \
(Kolos & Wolniewicz, Ref. 19) and the statement <R>_H2 = 1.01 <R>_D2 (p. 3459). The \
D2/H2 phase-matching density ratios of this group are in shelton_1986 (Table III) \
and shelton_1990 (Table I).

For the later chi(3) work: Table I (tbl_d9c17b1ffdb1, JSON) gives lambda in air (nm) \
and the vacuum wavenumber (cm^-1) of each line; Table II (tbl_79b8cb3720a5) the ab \
initio transition polarizabilities (Hunt et al.) used for the vibrational correction \
(H2 alpha_01,11 = 0.74027, gamma_01,11 = 0.61175, omega = 0.01894 a.u.; D2 \
alpha_02,12 = 0.61765, gamma_02,12 = 0.50224, omega = 0.01361); Eq. (8) is Sitz & \
Yaris's chi_He(3)(w) as 42.6 {1 + [w/(58300 cm^-1)]^2} a.u. Accuracy of the ratios \
0.3-1.2 % (p. 3457).

Duplicate: the library's second copy Mizrahi_1985_NonlinearSusceptibilityH2_2b7b33 \
(another PDF of the same article, 7 pages) has cell-for-cell identical Tables I-III \
(checked 2026-09-25); not used.

THIRD-ORDER DATA (added 2026-09-26; supersedes "nothing is extracted" above, \
which concerned linear dispersion). DEFINITIONS (Sec. II, p. 3454): 'ESHG in gases may, \
for our experimental geometry (optical-field polarization parallel to the static \
field), be described by P_z(2 omega) = (3/2) chi_zzzz(3)(-2 omega; omega, omega, 0) \
E_z(omega) E_z(omega) E_z(0)' (Eq. 1), in the notation of Bogaard & Orr, which 'has the \
desirable property that chi(3)(0; 0, 0, 0) = lim chi(3)(-2 omega; omega, omega, 0) \
without the need for additional numerical factors'; the macroscopic chi_zzzz(3) = (1/6) \
rho L <Phi_za Phi_zb Phi_zc Phi_zd> gamma_abcd(-2 omega; omega, omega, 0) (Eq. 2), L \
the local-field factor (< 1 % from unity here); the 'microscopic nonlinear \
susceptibility' chi(3)(omega) is the isotropic average <Phi Phi Phi Phi> gamma, and \
chi(3)(0) = (1/5) gamma_xixietaeta (Eq. 3): Shelton & Rice's gamma_par (Taylor \
convention), called chi(3) here. Ratios: chi_A/chi_B = (S_A/S_B)^(1/2) (n_B rho_B)/(n_A \
rho_A) (Eq. 4). Expansion chi(3)(omega) = chi(3)(0)(1 + a omega^2 + b omega^4 + ...) \
(Eq. 5), fitted as A(1 + B omega^2) with omega the vacuum wavenumber (cm^-1; not \
nu_L^2). PARTS: chi(3) = chi(3)el + chi(3)vib (Eq. 6); the vibrational resonance \
contribution is calculated (Eq. 7) from the v = 1, J = 1 (H2) or J = 2 (D2) Q(J) \
transition only (Delta J = 0; rotational Raman ignored), with Hunt, Poll & Wolniewicz's \
matrix elements (Table II: H2 alpha_01,11 = 0.74027, gamma_01,11 = 0.61175, omega = \
0.01894 au = 4156 cm^-1; D2 alpha_02,12 = 0.61765, gamma_02,12 = 0.50224, omega = \
0.01361 au = 2988 cm^-1; here gamma is the transition anisotropy alpha_par - alpha_perp, \
not a hyperpolarizability), and subtracted: 'The corrections for H2 vary between 1.7% \
and 0.5%, while the corrections for D2 are about half as large' (p. 3458). \
CALIBRATION: Sitz & Yaris's chi_He(3)(omega) = 42.6 {1 + [omega/(58300 cm^-1)]^2} au \
(Eq. 8) for the dispersion, and chi_He(3)(0) = 42.8 au ('about midrange' of four \
calculations: 43.10, 42.81, 42.8, 42.6 au) for the static result 647 +- 4 au (conversion \
1 au = 6.2353e-65 C^4 m^4 J^-3 = 5.0366e-40 esu, Table III note a). ACCURACY: 'estimated \
accuracies ranging between 0.3% and 1.2%' (p. 3457); Ward & Miller's 694.3 nm ratio \
agrees with the smoothed raw value; Shelton & Buckingham's 514.5 nm value (shelton_1982) \
is 1.9 % lower, attributed to beam steering (p. 3457). Other statements: footnote 18 \
(p. 3460) quotes Buckingham & Dunmur's dc Kerr gamma_He = 53.6 au +- 7 % and gamma_Ar / \
gamma_He = 21.8 +- 2.2 (632.8 nm), judged to carry a systematic error of 20 % or more \
(both reproduced in buckingham_1968's record, not repeated here); footnote 22: \
Jaszunski & Roos's Table 7 value '668.8 ... should be 688.8 as in their Table 6' (a \
misprint in another paper). The J = 0 averages 691.2 (JR), 689.5 (JR recomputed) and \
667.0 au (BW) precede the thermal averages of Table III (p. 3459)."""

