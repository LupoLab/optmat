convention = "T"
part = "vibrational"
range = "optical frequencies (x >> 1), v = 1, J = 1 only, Delta J = 0"
coefficients = { chi_vib0 = "184", omega_v = "0.01894", omega_v_cm = "4156" }
coefficient_units = { chi_vib0 = "au", omega_v = "au (hartree)", omega_v_cm = "cm^-1" }
check = "Reproduces Table I's raw-to-corrected shift of H2/He at 632.8 nm (0.223, see H2_over_He_corrected). Checked 2026-09-26."
notes = "In atomic units (Eq. 7). Here gamma_0J,1J is the transition polarizability anisotropy, not a hyperpolarizability."

