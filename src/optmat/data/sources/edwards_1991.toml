citation = "H. G. M. Edwards, D. A. Long and G. Sherwood, \"Line widths in the pure rotational Raman spectra of hydrogen and deuterium self-broadened and broadened by foreign gases\", J. Raman Spectrosc. 22, 607 (1991)"
doi = "10.1002/jrs.1250221103"
library = "Edwards_1991_LineWidthsPure"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Spontaneous pure rotational Raman spectroscopy (apparatus and data handling as \
in the authors' earlier papers, Refs. 1 and 3, p. 1); spectra calibrated against a \
thorium hollow-cathode lamp; each line's width measured five times per pressure and \
the full width at half maximum found with a curve-analysis program (CAP, Ref. 1); the \
broadening coefficient sigma from the averaged widths against pressure (p. 2). Self \
broadening: 1H2 at 1-100 bar, 2H2 at 1-60 bar, 90-375 K; foreign broadening: 1 bar of \
the host with He, Ar, O2, N2, CO or HCl to 2-100 bar total (HCl to 40 bar), 293 K; \
2H2 S0(0) with N2 and CO at 100-293 K. Gases from the British Oxygen Company, 99.9 %."""
notes = """Identity checked against the first page. Page numbers are pdf pages (1-5 = \
journal pp. 607-611). Materials: 1H2 is H2 and 2H2 is D2, both as supplied (normal: \
ortho:para not altered; the paper says nothing about conversion at 90 K). HD is not \
measured here (Refs. 9, 10 studied it).

WIDTH CONVENTION. p. 2: 'Line-width measurements on each rotational line were repeated \
five times for each pressure. The full width at half maximum intensity (FWHM) was then \
obtained using a curve analysis program (CAP) described previously. The average of each \
set of linewidth measurements was used in the calculation of the broadening \
coefficients.' The broadening coefficients 'sigma cm-1 bar-1' (p. 2) are therefore \
taken as FWHM per bar (the paper never writes the law Delta nu = sigma p explicitly). \
Per bar of pressure at the stated temperature (not per amagat). Dicke narrowing: 'In \
the pressure region 1-10 bar at 293 K, a narrowing of line width (Dicke narrowing) with \
increase in pressure was observed' (p. 2; Fig. 1), and at 5-15 bar in the foreign-gas \
runs (p. 3, Fig. 3); no Dicke term is given, and the pressure range over which sigma was \
fitted is not stated. Uncertainties: the +- are not described (level not stated).

FOREIGN GASES. 'In all the measurements of foreign gas broadening, the partial pressure \
of the host gas was 1 bar over a total pressure range of 2-100 bar' (p. 2): sigma is per \
bar of the total pressure, including the host's 1 bar (not corrected for \
self-broadening, as far as the paper says). HCl (not a curated material) as printed, \
10^3 sigma: 1H2 S0(0) 27.6 +- 1.4, S0(1) 32.7 +- 1.8, S0(2) 11.7 +- 0.9 (Table 4, the \
row label extracted as 'HCI'); 2H2 S0(0)-S0(4) 136.2 +- 6.8, 63.7 +- 2.5, 31.8 +- 1.7, \
17.4 +- 1.0, 9.73 +- 0.59 (Table 5). Table 1 (tbl_a8cade374157) summarises the systems \
(no values).

COMPARISONS (Tables 7-9, pp. 4-5). 'there is generally little agreement between any \
of the results' (p. 4). This paper's 1H2 self-broadening is about half the others': \
Cooper et al. 1970 (Ref. 7) and Knaap et al. (Ref. 10) 2.8 and 3.5 (S0(0), S0(1)) \
against 1.19 and 1.48 here; and Herring et al. 1986 (herring_1986, Table V, FWHM) \
77 and 114 MHz/amagat at 295 K, i.e. 2.36 and 3.50e-3 cm-1 per bar at 293 K (1 bar = \
0.920 amagat), 2.0 and 2.4 times this paper's. The 2H2 S0(0)-S0(4) are 0.72, 0.60, \
0.60, 0.36, 0.39 of Knaap et al.'s. Whether this paper's sigma is a half width despite \
the FWHM statement cannot be settled from the paper: the ratio to Cooper's and \
Herring's is 2.0-2.4 for 1H2 but 1.4-2.8 for 2H2. Tables 7-8 print Cooper et al.'s \
(Ref. 7) values, 2.8 and 3.5, in '10^3 cm-1 bar-1', but Herring et al. print the same \
paper as 84 and 105 MHz/amagat = 2.80 and 3.50e-3 cm-1/amagat: the comparison columns \
appear to be per amagat under a per-bar label (a 9 % difference at 293 K). Herring et \
al.'s citation of Ref. 7 is 'V. G. Cooper, A. D. May, and B. K. Gupta, Can. J. Phys. \
48, 725 (1970)' (the same paper, authors in another order). Knaap et al. (Ref. 10, \
knaap_1979, curated 2026-09-27) print half widths in figures only: the 'Knaap et al.' \
columns of Tables 7-8 are twice those half widths per amagat (for both 1H2 and 2H2 \
exactly twice keijser_1974's Table I 293 K HWHM, to which they are re-pointed), so they \
are FWHM per amagat. Against \
them this paper's own sigma is 0.89-0.91 of the half width per bar for 1H2 S0(0)-S0(1), \
0.50 for S0(2), and 1.3-1.6 (S0(0)-S0(2)) and 0.8-0.9 (S0(3)-S0(4)) for 2H2: no single \
factor (see knaap_1979's notes).

TEMPERATURE. The self-broadening sigma of 2H2 S0(0) is 8.56 (90 K), 5.61 (200 K), 4.05 \
(293 K), 3.34 (375 K) x 10^-3 cm-1 bar-1; the N2- and CO-broadened ones rise threefold \
from 293 to 100 K (Table 6). Per bar at fixed T, so part of the rise is the density \
factor 1/T.

solprop: its D2 rotational linewidth is Table 2's 2H2 S0(0), 4.05e-3 cm-1/bar at 293 \
K, taken as FWHM and converted to 131.96e6 Hz/amagat (4.05e-3 x 29.9792458e9 Hz / \
0.92006 amagat per bar): the conversion is right if sigma is a FWHM per bar; see the \
doubt above."""

