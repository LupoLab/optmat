abscissa = "label"
use = "reproduced"
reproduced_from = ["keijser_1974"]
notes = "Table 8 (p. 4), Ref. 10 (Knaap et al. 1979 = knaap_1979), room-temperature self-broadening of 2H2, as printed in 10^3 cm-1 bar-1. Against the original (2026-09-27): knaap_1979 prints no numbers (figures only) and its widths are HALF widths; these are exactly twice Keijser et al.'s 293 K HWHM per amagat (2.80, 2.23, 2.07, 1.70, 1.43, as smyth_1987 quotes them, p. 1008), which are also the 295 K points of knaap_1979's Fig. 6: FULL widths PER AMAGAT, not per bar. Re-pointed to keijser_1974 (2026-09-27): twice its Table I nD2 HWHM (0.084, 0.067, 0.062, 0.051, 0.043 GHz/amagat, 293 K) in cm-1 is 5.604, 4.470, 4.136, 3.402, 2.869e-3 cm-1/amagat, which rounds to these values in every row (its S0(5), 0.028, is not printed here)."
