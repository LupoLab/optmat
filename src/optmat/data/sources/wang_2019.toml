technique = """Linear Wiley-McLaren time-of-flight mass spectrometry of N2O (effusive, \
leak valve; chamber below 1e-5 Pa) in 800 nm, 50 fs, 1 kHz pulses (Ti:sapphire, up to \
4 mJ) focused by a 25 cm lens; intensity set by a half-wave plate and Glan prism, \
ellipticity by a quarter-wave plate; dual microchannel plates, 5000 shots per spectrum; \
a 0.5 mm slit at the end of the flight tube for the angular distributions (p. \
053301-2)."""
notes = """PDF page 1 is IOP's cover; pdf pages 2-7 = article pages 053301-1 to -6. \
Identity checked on pdf page 2 (title, authors, Chin. Phys. B 28 053301, DOI).

WHY NO DATASETS (TC-969). The yields are in figures only, all vector drawings: Fig. 1, \
the yields of N2O+ and the fragment ions (NO+, N2+, O^n+, N^m+) against intensity, \
2.0 x 10^13 to 3.6 x 10^14 W/cm2, linear; Fig. 2, the LP and CP mass spectra at \
2 x 10^14 W/cm2; Fig. 3, each fragment's yield over N2O+ against ellipticity at 1.4 x \
10^14 W/cm2, normalised to linear polarisation; Fig. 4, the widths of those curves \
against intensity; Fig. 5, the angular distributions. The intensity calibration is not \
stated. The numbers in the text fit no quantity:
- Appearance intensities (p. 053301-2): the doubly charged O^2+ and N^2+ 'begin to appear \
at a stronger laser intensity of 7.0 x 10^13 W/cm2, and N3+ ions are not detectable \
until the laser intensity reaches 1.2 x 10^14 W/cm2' (N^3+), the singly charged fragments at \
'a relatively low laser intensity' (no number). There is no quantity for the intensity \
at which an ion first appears (reported).
- Ellipticity (p. 053301-3): 'the ratio of singly-charged fragment ions in the CP laser \
fields is about 15%-25% of that in the LP laser fields', the ratio being each \
fragment's yield over N2O+ at 1.4 x 10^14 W/cm2 (Fig. 3); N3+ falls to zero at an \
ellipticity of 0.3. A ratio of two branching ratios (CP over LP), whose LP and CP \
values themselves are not printed.
- No N2O2+ or higher parent ions are observed, which the paper attributes to their \
short lifetime, 'for instance, the lifetime of the metastable state of N2O2+ is only \
660 +- 70 ns' (p. 053301-2, quoted from their Ref. 32, not in the library; not taken).
- Quoted ionisation potentials: N2O 12.889 eV, Xe 12.13 eV (p. 053301-3).

FINDINGS STATED: the highly charged fragments come mainly from multiply charged parents \
formed by recollision (non-sequential) ionisation, their ellipticity dependence \
following the three-step model (for N3+); NO+ and O^n+ peak along the polarisation, \
N^m+ also perpendicular (central and terminal N; as Graham et al. with 15N14N16O).

FIGURES FOR LATER (TC-969; vector): Fig. 1 (yields against intensity) and Fig. 3 \
(fragment/N2O+ against ellipticity)."""
