[[datasets]]
id = "density_He_over_H2"
material = "He"
file = "He/donley_1993__density_He_over_H2.csv"
table = "tbl_6498821f87d2"
quantity = "phase_match_density_ratio"
unit = "1"
abscissa_unit = "cm-1"
density = "real"
use = "primary"
notes = "Table 2 (p. 3): rho_B/rho_A with A = H2 (sample), B = He (reference) as printed, filed under He with reference_material H2 so that the printed number is rho_gas/rho_reference (as in shelton_1990). One row per array. Densities from pressure (+-0.02-0.08 %) and temperature (+-0.1 C) with the virial equation of state (p. 2). Caption: 'The phase match density of the gas is inversely proportional to the polarizability dispersion [alpha(2 omega) - alpha(omega)] ... The measured phase match density ratios show no significant density dependence (an increase by 0.01%-0.02% over this density range is predicted from measured refractive index virial coefficients [4])'."
[datasets.uncertainty]
column = true
level = "1 sigma"
[datasets.parameters]
reference_material = "H2"
harmonic = 2
process = "ESHG (electric-field-induced second-harmonic generation), periodic phase matching"
definition = "rho_gas / rho_reference_gas at equal wave-vector mismatch |Delta k| = (4 pi / lambda) |n(2w) - n(w)|; to first order in density = [alpha_ref(2w) - alpha_ref(w)] / [alpha_gas(2w) - alpha_gas(w)]; lambda = fundamental"
sample_gas = "H2"
shelton_reference_gas = "He"
temperature_k = 298.0

