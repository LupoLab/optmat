table = "tbl_6498821f87d2"
quantity = "hyperpolarizability_ratio"
unit = "1"
abscissa_unit = "cm-1"
use = "check"
notes = "Table 2 (p. 3): gamma_A/gamma_B with A = H2, B = He, as printed, one row per electrode array (per phase-match density; Table 1 gives rho(H2) = 80.5, 152.4, 202.3, 323.5 mol m^-3; the other gases are at nearly fixed density ratios, Table 2). Gas pressures 1-8 atm at T = 298 K (He 25-125 atm). 'The stated uncertainties are treated as one standard deviation' (p. 2). Finite-density values: the zero-density intercept (gamma_H2_over_He_zero_density) is the isolated-molecule result."
[datasets.uncertainty]
column = true
level = "1 sigma"
[datasets.parameters]
reference_material = "He"
