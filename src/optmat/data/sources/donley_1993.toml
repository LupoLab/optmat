citation = "E. A. Donley and D. P. Shelton, Chem. Phys. Lett. 215, 156 (1993)"
doi = "10.1016/0009-2614(93)89280-u"
library = "Donley_1993_HyperpolarizabilitiesMeasuredInteracting"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """ESHG with periodic phase matching (argon-ion laser, 514.5 nm, nu = 19430 \
cm^-1), as in shelton_1990; four electrode arrays of different periods (Table 1: L = \
5.080, 2.692, 2.032, 1.270 mm; N = 82, 150, 200, 160 pairs) give four phase-match \
densities (rho(H2) = 80.5-323.5 mol m^-3); about 200 measurement triplets; 99.999 % \
gases at 1-8 atm and 298 K (He 25-125 atm); densities by the virial equation of state; \
optical field parallel to the static field (pp. 1-3)."""
notes = """Hyperpolarizability ratios of H2/He, Ar/H2 and N2/H2 as functions of gas \
density, 'with 0.1% accuracy': the zero-density intercepts are the isolated-molecule \
ratios, and the slopes measure the pair (collision) contribution to gamma (the density \
correction to ESHG gamma). Referred to by Shelton & Rice 1994 as ref 35 ('these effects \
are at the 0.1% level in the measurements for H2').

Definitions: gamma_A/gamma_B = (S^(1/2)/q rho V)_A / (S^(1/2)/q rho V)_B (Eq. 1, p. 2), \
S the harmonic photon flux, rho the phase-match density, V the electrode voltage, and \
q = (T_1^2 T_2)^(1/2) (F)^(1/2) (n_omega^(zeta-2) n_2omega^-1)^(1/2) (f_0 f_omega^2 \
f_2omega) (Eq. 2): window transmission, the pressure-induced lens of the entrance \
window, refractive-index factors (zeta ~ 0.4) and the Lorentz local-field factors f = \
(n^2 + 2)/3. 'The largest correction to gamma is -0.8% for He gas with array No. 4' and \
'the net correction to gamma_A/gamma_B is typically much less than 0.1%' (p. 3). gamma \
is the ESHG gamma of shelton_1990 (Taylor convention; 1 au = 6.235377e-65 C^4 m^4 \
J^-3, Table 3 note a). Uncertainty: 'Statistical and calibration uncertainties each \
contribute about +-0.07% to the error bars on the final results. The stated \
uncertainties are treated as one standard deviation. The final results may be somewhat \
more accurate than the assigned error bars suggest' (p. 2). Parts: the molecular \
ratios are of the total ESHG gamma (the ab initio comparison adds gamma^v and gamma^R \
for H2, Table 3 note b).

PAIR (DENSITY) CORRECTIONS, not expressible as a dataset (no quantity for a \
hyperpolarizability density coefficient): gamma_A/gamma_B = (gamma_A/gamma_B)_0 [1 + \
b(AB) rho(H2)] (Eq. 5), b(AB) = (b_A - b_B rho_B/rho_A)(rho_A/rho_C), C = H2 (Eq. 6). \
Table 3, measured b(AB) in 10^-6 m^3 mol^-1: H2/He +5.6 +- 6.2, Ar/H2 -7.0 +- 5.0, N2/H2 \
-6.9 +- 4.6; calculated (binary dipole-induced-dipole model) -2.1, +4.5, +3.4: 'The \
measured and calculated slopes agree in magnitude, but they are of opposite sign' (p. \
6). DID model: gamma(R) = gamma [1 + 48 (alpha/4 pi eps0 R^3)^2] (Eq. 3), gamma(rho) = \
gamma (1 + b rho) (Eq. 4). Table 4 (Lennard-Jones 6-12 potential): He, H2, Ar, N2: \
alpha (10^-40 C^2 m^2 J^-1, at 632.8 nm, from Bogaard & Orr 1975) 0.230, 0.92, 1.85, \
1.97; sigma (nm) 0.257, 0.30, 0.343, 0.366; eps/k (K) 11, 40, 122, 97 (Reed & Gubbins \
1973); (Delta gamma/gamma)_{R = sigma} 0.00714, 0.0449, 0.0815, 0.0629; b (10^-6 m^3 \
mol^-1) 0.46, 4.59, 12.43, 11.67; and the local-field coefficient c = d(f_0 f_omega^2 \
f_2omega)/d rho = 2.10, 8.52, 17.13, 18.15 (10^-6 m^3 mol^-1). 'Extrapolated to liquid \
density, the binary DID contribution in eq. (4) is 1%, 16%, 34% or 43% of the \
individual molecule contribution for He, H2, N2 or Ar' (p. 6); the measured slopes \
suggest an electron-overlap contribution of about -2 x DID (p. 6). The Table 4 \
polarizabilities are reproduced (Bogaard & Orr) and not extracted.

Table 1 (array parameters and typical H2 signals) is recorded in the technique only. \
The library's validation notes 'REFERENCES_REORDERED' on p. 7 (a stray Leonard 1974 \
reference line before [1]); the references used here are unaffected. The table cells \
agree with the images."""

