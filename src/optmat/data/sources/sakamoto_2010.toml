variable = "E: photon energy in Ry (13.606 eV), k^2 = E - 1; df/dE per Ry"
state = "none (per molecule)"
density = "none"
range = "above 10 keV (the sources table: 10^4-inf, sigma(H2) = 1.444 x 2 x sigma(H))"
coefficients = { ratio = "2.888" }
check = "2.888 x the hydrogen formula reproduces the table's df/dE from 12.5 keV to 1e5 eV to 6e-5, and gives 0.057434 eV^-1 for H at threshold (the hydrogen table prints 5.7437E-02). At 10 keV the table (book value) is 27 % below the formula: a step at the join (checked 2026-09-25)."
