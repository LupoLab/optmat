citation = "N. Sakamoto, H. Tsuchida, T. Kato, S. Kamakura, H. Ogawa, K. Ishii, I. Murakami, D. Kato, H. Sakaue, M. Kato, J. Berkowitz and M. Inokuti, \"Oscillator strength spectra and related quantities of 9 atoms and 23 molecules over the entire energy region\", NIFS-DATA-109 (National Institute for Fusion Science, Toki, 2010)"
library = "Sakamoto_2010_OscillatorStrengthSpectra"
identity = "ASSERTED"
kind = "compilation"
technique = """Reconstruction of Berkowitz's recommended photoabsorption (J. Berkowitz, Atomic \
and Molecular Photoabsorption: Absolute Total Cross Sections (Academic Press, 2002), \
'Berkowitz's book' below) over the whole energy range, per species: the book's tables \
of discrete oscillator strengths; its continuum given as tables, as four-term \
polynomials df/dE = a y^2 + b y^3 + c y^4 + d y^5 (y proportional to 1/E), as \
figures (digitised by the authors) or only as partial moments S(p) (then the original \
papers' data were used and adjusted until S(0) and S(1) of the interval agreed with \
the book's to +-1 %); above 10^4 eV Chantler (1995) and above 10^5 eV a hydrogenic \
K-shell formula. Every partial moment was recomputed and compared with the book; the \
disagreements were settled with Berkowitz (a coauthor) (PDF pp. 5-7). Per species: \
Table I (and II ...) discrete f, then df/dE, sigma_a = 109.76097 df/dE (Mb, df/dE in \
eV^-1) and the mass absorption coefficient against photon energy (eV), and a table \
of the source of each energy interval."""
notes = """Identity checked against the title page (PDF p. 3): the title, the twelve \
authors and 'NIFS-DATA-109' as cited; the library's identity is ASSERTED (a BibTeX entry supplied with the files), no DOI. A 'preprint' of NIFS (PDF p. 1). Page \
numbers below are PDF pages. The electronic tables are the NIFS database's text \
files, attached to the report in the library with their URLs (retrieved 2026-09-25). \
Only He, Ne, Ar, H2, N2, O2, CO, \
CO2, N2O, O3, CH4 and SF6 are curated; H, Li, N, O, Na, Cl, NO, HCl, H2O, NO2, H2S, \
SO2, NH3, C2H2, C2H4, C2H6, CH3OH, C6H6, SiH4 and C60 are skipped.

DEFINITIONS (pp. 4-5): S(p) = sum_n f_n E_n^p + integral_IP^inf E^p (df/dE) dE, -2 <= \
p <= 2, 'we use the Rydberg energy Ry = 13.606 eV as the unit of E throughout' (so \
alpha = 4 S(-2) in atomic units); S(-2) and S(0) 'we used ... as constraints to the \
selection of the magnitude of a measured oscillator-strength spectrum'; the TRK sum \
rule 'should be accurate to ~0.1%'. No uncertainty is stated for any value, and no \
S(p) total or polarizability is printed for any species: the report gives the \
distributions only.

WHAT IS EXTRACTED: the discrete tables (22 datasets, 443 rows; extraction script \
sakamoto_2010.py, which reads the NIFS text files, not the library's cells: see its \
docstring). All rows are Berkowitz's recommended values copied from his book's tables \
(the sources tables below), so every dataset is 'reproduced' from the book (not in \
the library), helium Table I from berkowitz_1997. No uncertainty stated. The \
continuum tables are not extracted: they are the NIFS files themselves.

CHECK OF THE NIFS FILES AGAINST THE PDF (2026-09-25): pdftotext -layout of pp. 14-258 \
against every file: each numeric row of each file (discrete, interval and continuum; \
102 He, 96 Ne, 226 Ar, 326 H2, 289 N2, 741 O2, 352 CO, 1217 CO2, 682 N2O, 540 O3, 285 \
CH4, 487 SF6) is a run of cells on one printed line, and the multisets of the numbers \
agree exactly for every species. Page images checked by eye: every discrete table \
(pp. 14, 28, 37, 42-44, 47, 53, 65, 120) and a continuum page per species (pp. 15, \
29, 39, 44, 47, 53 and 60, 65, 110, 120, 173, 190, 254). Internal consistency of every \
row: E x lambda = hc to 2e-4, sigma_a = 109.76097 df/dE and mu_m = sigma_a N_A / M_A \
to 3e-4, with one exception: HELIUM's df/dE column from 1.25e4 to 1e5 eV (17 rows) \
prints '.80404E-10' ... '.62035E-13', a factor 10 too small (sigma_a/df/dE = 1097.6, \
not 109.76; the page image prints the same; the sigma_a and mu_m columns are right \
and agree with the high-energy formula below to 1e-5 at 2e4 and 1e5 eV). A loader of \
the helium file must use sigma_a (or df/dE x 10) there.

HOW THE CONTINUUM JOINS THE LINES (first continuum row; the NIFS files):
  He: lines 21.218-24.572 eV (n = 2-20, and the sum n >= 21 at 24.572 eV); continuum \
from 24.587 eV (the IP, 24.5874). Table II's 'excess' strengths of the two-electron \
resonances (60.15-72.55 eV) are added to the smooth continuum (tabulated on a 10 eV \
grid there).
  Ne: lines 16.671-21.622 eV; continuum from 21.661 eV (the sources table's first \
boundary); the 2s -> np resonances (44.98-48.83 eV) sit on the \
continuum; the K-edge resonances (867.05-869.63 eV) below the continuum step at \
870.25 eV (printed twice).
  Ar: lines 11.624-15.852 eV, including series sums and the 'underlying continuum \
between 2P3/2 and 2P1/2' as one f (mark d, at 15.852 eV); continuum from 15.937 eV. \
Table II's NEGATIVE strengths (26.61-29.10 eV) are the window resonances of the 3s -> \
np series: to be subtracted from the smooth continuum (tabulated at 25, 27.5, 30 eV). \
K-edge line at 3203.3 eV (Deslattes et al.), continuum step at 3206 eV.
  H2: bands below the IP (Lyman 11.18-14.67, Werner 12.29-14.67, B' 13.70-14.67, \
D 13.99-16.52, higher Rydbergs 14.60-15.40 eV) and above it (D-state bands to 16.52, \
predissociation 15.58-16.21, autoionisation 15.435-16.975 eV), on a continuum that \
starts at 15.426 eV (the IP, 15.4258) with only two points below 17.5 eV (0.0130 and \
0.0959 eV^-1). The sources table lists Glass-Maujean et al.'s dissociation continua \
below and above the IP, but no table holds them: they are missing or folded into the \
bands (TC-219).
  N2: lines 12.500-14.839 eV; continuum from 14.920 eV, below the IP (15.58: \
Chan et al.'s spectrum as df/dE from 14.92 eV); K-edge resonances 401.0-406.8 eV \
(Table II), continuum from 407.4 eV (Zhadenov et al.).
  O2: continuum 7.125-9.75 eV (the Schumann-Runge continuum; df/dE = 0 is printed at \
9.75 eV), then Table I's eleven interval strengths 9.75-12.07 eV (df/dE is not \
tabulated there), continuum again from 12.07 eV (the IP). The Schumann-Runge BANDS \
below 7.125 eV are not included (the sources table starts at 7.125 eV). K-edge line \
at 530.90 eV (Barrus et al.).
  CO: lines 8.028-11.789 eV (A 1Pi 8.03-9.95, B 10.78-11.03, C 11.40-11.66, E \
11.52-11.79 eV: rule-separated groups on the page); continuum from 12.130 eV, below \
the IP (14.0136; Chan et al.'s 12.13-14.01 eV region as df/dE); K-edge resonances \
287.40 and 534.11 eV (Table II).
  CO2: no discrete table: continuum from 7.0 eV (Chan et al. 1993 below and above the \
IP 13.7763 as df/dE); the K-edge resonances at 291.0 and 534.6 eV (book Table 5.4) \
are in the continuum grid.
  N2O: five interval strengths 5.70-12.8898 eV (Table I, the IP included); continuum \
from 12.890 eV.
  O3: continuum from 1.65 eV; the Wulf region 1.31-1.65 eV is printed with a dash (no \
data) in the sources table and is not included.
  CH4: continuum from 8.61 eV (df/dE = 0 printed there); SF6: continuum from 9.5572 eV.

SUMS COMPUTED HERE (not printed in the report; 2026-09-25): discrete lines + interval \
strengths (at the interval's geometric-mean energy) + the trapezoidal integral of the \
continuum on its printed grid (sigma_a/109.76097, which bypasses the helium df/dE \
misprint) + the tail formulas above 10^5 eV. S(-2) (Ry^-2; alpha = 4 S(-2) au) and \
S(0) (against Z): He 0.3490 (1.396 au), 1.9958 (Z 2); Ne 0.6469 (2.588), 9.693 (10); \
Ar 2.7493 (10.997), 18.031 (18); H2 1.3184 (5.274), 1.960 (2); N2 3.0037 (12.015), \
14.031 (14); O2 2.7135 (10.854), 16.004 (16); CO 3.3152 (13.261), 14.027 (14); CO2 \
4.3584 (17.434), 22.205 (22); N2O 4.8519 (19.408), 22.309 (22); O3 4.3474 (17.390), \
22.163 (24); CH4 4.1977 (16.791), 9.903 (10); SF6 7.6052 (30.421), 69.042 (70). The \
trapezoid on the printed grid is a crude integration where the grid is coarse (the \
book integrated its polynomials): it reproduces the printed corrected partial moments \
below to 0.03 % (CO2 S(2), 35.93-107.08 eV), 0.6-1.0 % (Ar, 243-253 eV) and 3.5-4 % \
(CO, IP-17.712 eV; Ar S(1), 500-929.7 eV). S(0) misses Z by 2 % (H2), 3 % (Ne) and \
7.7 % (O3): more than the grid can explain; the tables alone do not satisfy TRK for \
these (TC-219).

CORRECTIONS TO BERKOWITZ'S BOOK (pp. 6-7; book tables and pages; curated species \
only): Ar, 243.0-253.0 eV (Table 2.34, p. 89): S(1) = 3.5471, S(2) = 64.8246; Ar, \
500-929.7 eV (Table 2.35, p. 90): coefficient c = 8315.576, 'not 8315576', and S(1) = \
111.9896; CO, IP-17.712 eV (Table 4.14, p. 160): S(p), p = -2, -1, 0, 1, 2 = 0.6587, \
0.7582, 0.8771, 1.0195, 1.1908 ('corrected slightly'); CO2, 35.93-107.08 eV (Table \
5.4, p. 192): S(2) = 145.296, 'not 15.296'. These are the only moments the report \
prints: partial moments of one interval (in Ry^p), with no quantity in the format (a \
cauchy_moment is a total): kept here, not as datasets (format need). (The other \
corrections concern Li, O, Cl, NO, HCl, SO2, NH3, SiH4.)

