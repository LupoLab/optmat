technique = "ellipsometry and spectrophotometry (UDM fit)"

[[datasets]]
id = "rii_20C_n"
material = "Si"
file = "Si/franta_2017__rii_20C_n.csv"
table = "data/external/refractiveindex_info/main/Si/nk/Franta-20C.yml"
quantity = "refractive_index"
abscissa_unit = "um"
use = "primary"
notes = "n of the revised temperature-dependent model (this paper as updated in franta_2018) at 293.15 K, as the refractiveindex.info page Franta-20C.yml prints it ('Numerical data kindly provided by Daniel Franta'; see notes): 3664 rows, 0.0309963-142.663 um (40 eV to 70 cm-1), the rows beyond 70 cm-1 not extracted. The model at the optmat reference temperature, 20 degrees C (293.15 K: the page's n at 2 um matches franta_2018's two-term Sellmeier formula at 293.15 K, not at the CONDITIONS value 293 K; see notes). No uncertainty stated; the model table is dense, so a fit should weight it as one curve."
[datasets.parameters]
temperature_k = 293.15
grade = "float zone"
form = "bulk"
technique = "ellipsometry and spectrophotometry (ADM fit, tied to Frey et al.'s index at 2 um)"

