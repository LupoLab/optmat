citation = "D. Franta, A. Dubroka, C. Wang, A. Giglia, J. Vohánka, P. Franta and I. Ohlídal, \"Temperature-dependent dispersion model of float zone crystalline silicon\", Appl. Surf. Sci. 421, 405 (2017)"
doi = "10.1016/j.apsusc.2017.02.021"
library = "Franta_2017_TemperatureDependentDispersion"
identity = "VALIDATED"
kind = "fit"
technique = """Temperature-dependent advanced dispersion model (ADM) of float-zone c-Si \
(B-doped 5e13 cm-3, 80 Ohm cm, 0.58 mm, (100)), fitted in newAD2 to 37 749 points: \
Woollam IR-VASE (cryostat 5-380 K, heating cell 300-600 K, 263-7800 cm-1), Woollam VASE \
(cryostat 10-390 K, 0.6-6.5 eV), UVISEL2 VUV (300-700 K, 0.6-8.3 eV), UVISEL (300 K), \
Bruker Vertex 80v R and T (70-7500 cm-1, 300 K), Lambda 1050 T (0.69-1.38 eV), Elettra \
BEAR reflectance (6-40 eV), plus Frey et al.'s prism indices (1.1-5.5 um, 30-295 K) and \
Eq. (3)'s extrapolation at 2 um, 5-700 K (Table 1, p. 407)."""
notes = """Journal pages 405-419 = PDF pages 1-15. Identity checked against the first page. \
Material: float-zone crystalline silicon (Si). No n, k table is printed (Figs. 10-17 \
only); refractiveindex.info carries 'numerical data kindly provided by Daniel Franta' \
for this paper at 10-500 K, 20 and 25 degrees C (main/Si/nk/Franta-*.yml): three of \
its pages are curated here as this source's numbers, taken through the database as \
for stahrenberg_2001 (datasets rii_*; see REFRACTIVEINDEX.INFO below). The newAD2 \
site's unpublished UDM of float-zone Si (c-Si.par, c-Si.Enk), attached to this paper \
in the library, is recorded as the formula udm_c_si and the check datasets newad2_* \
(see NEWAD2 UDM below).

MODEL MAP (journal pages; this is the ADM, not the UDM). Eq. (4), p. 407: F = E eps_i, J = \
E^2 eps_i; Eq. (5): int_0^inf F dE = N; Eq. (6): N = Z N_a U (Z = 14, U = 1.0002735); Eq. \
(7): eps = 1 + sum_t N_t eps0_t; Eqs. (8)-(9), p. 407: unit normalisation and the KK \
integral eps0_r = (2/pi) int F0/(X^2 - E^2) dX; Eq. (10), p. 408: N_t = n_t N_a. Valence \
electrons, Eqs. (11)-(13): N_ve(T) = n_ve N_a(T) (thermal expansion only), N_vx = \
alpha_x N_ve, N_vc = (1 - alpha_x) N_ve, N_dt = N_vc - N_idt. Indirect transitions, \
Eqs. (14)-(19), pp. 408-409: phonon-assisted absorption and emission edges \
(Bose-Einstein weights, Eq. (15)), each edge a sum of five truncated Lorentzian terms \
(Eq. (16), with 'the expression for the complex dielectric function and normalization \
constant ... in Appendix A in [12]' = Thin Solid Films 539, 233 (2013), not in the \
library), Eq. (17) the weights A_idt,j; free carriers Eq. (18) (factor (T/300)^(3/2) \
exp[-(E_g/(2 k_B))(1/T - 1/300)]), alpha_fc = 8e-13 (from ref. [7], p. 409). Direct \
transitions, Eqs. (20)-(51), pp. 409-411: five integration paths through four critical \
points (Table 3), each with twelve 3D and 2D critical-point contributions J_0..J_11 (Eqs. \
(22)-(48)) including Wannier-exciton factors R_k, normalised by Eq. (49), \
eps-broadened (Eq. (50), Gauss-Dawson kernel of franta_2014) with widths B_1,k \
(contributions 0, 1, 4, 6, 7, 10) and B_2,k (2, 3, 5, 8, 9, 11), summed by Eq. (51). High \
energy excitations, Eq. (52)-(53), p. 411: the Campi-Coriasso form of the Tauc-Lorentz \
model F0_vx = (2/pi) B_x (|E| - E_gx)^2 Pi/{[(|E| - E_gx)^2 - (E_cx - E_gx)^2]^2 + B_x^2 (|E| - \
E_gx)^2}, real part numerically. Core electrons: 'the same simple model as ... in [12]' \
(p. 411). Temperature dependence, Eqs. (54)-(56), p. 411: E(T) = E^0K + (E^300K - E^0K) \
(exp(Theta/300) - 1)/(exp(Theta/T) - 1) for points with a Theta, and a logarithmic \
coupling (Eqs. (55)-(56)) for the points marked 'T dep. by ...'; A, B, R interpolated \
by cubic splines between tabulated temperatures (A at 0, 100, ..., 700 K). Phonons: \
the model of franta_2014b extended with three-phonon absorption below 1000 cm-1 and a \
substitutional-carbon line at 612.7 cm-1 (0 K) and 610.1 cm-1 (300 K); 'the parameter \
values of the phonon absorption are not presented here with the exception of phonon \
frequencies' (p. 412); common Theta_ph = 426.1 K.

WHAT CANNOT BE IMPLEMENTED FROM THE PAPER: the A_0..A_11 of every path, the A and B of \
the indirect terms, the vx parameters E_cx, B_x, alpha_x, the core-electron strengths \
and all phonon amplitudes are not printed. The printed parameters are recorded as \
formulas below.

TEXT VALUES (not extracted unless noted): relative strengths of the indirect branches \
at 300 K alpha_TA = 7e-5, alpha_L = 0.0014, alpha_TO = 0.00072, total 0.00214 (p. 414; the \
earlier value 0.13 of ref. [7] 'can be explained by different separation'); f_L(X) = \
12.13 THz (0 K) and 12 THz (300 K); n_ve = 4.51 (Jellison-Modine) or 4.37 (Campi-Coriasso; \
'4.373' in the conclusion, p. 416), both 'too large' (p. 415). Comparisons (p. 417): \
Herzinger's n is 2.0e-3 above Frey's at 295 K and 1.2e-3 above the extrapolated Frey at \
300 K; Palik's n is 4.5e-3 below Frey's at 2 um and 295 K; the maximum k at E_2^X is 5.355 \
in this model against 5.435 (Palik), 5.465 (Herzinger) and 5.448 (ref. [48]).

TABLE CHECKS (2026-09-26, images): Table 2's JSON cells lose the primes of E'_0^Gamma, \
E'_1^L, E'_2^X and E'_3^X; the formula keys follow the image. Table 4 prints degenerate \
frequencies once ('The values of phonon frequencies in the empty fields are identical \
with the values on the left', p. 412). Oddities as printed: E_0^Gamma rises from 4.068 \
(0 K) to 4.149 eV (300 K) while every other critical point falls; at K, f_TO2 (14.18) < \
f_TO1 (14.31) at 0 K but f_TO2 (14.87) > f_TO1 (13.89) at 300 K, and f_TA1(K) falls from \
5.31 to 4.82 THz (TC-388).

REFRACTIVEINDEX.INFO (2026-09-26, 2026-10-14). Thirteen pages, main/Si/nk/Franta-10K, \
-50K, -100K, -150K, -200K, -250K, -300K, -350K, -400K, -450K, -500K, -20C and -25C.yml \
(commit c5c2f18, kept in data/external/refractiveindex_info/). Their headers are \
identical but for the temperature (and a trailing space in Franta-50K). REFERENCES: this \
paper ('Temperature-dependent dispersion model of float zone crystalline silicon, Appl. \
Surf. Sci. 421, 405-419 (2017)'; the link is printed as \
https://doi.org/j.apsusc.2017.02.021, without the 10.1016/ prefix) and '(Numerical data \
kindly provided by Daniel Franta)'. COMMENTS: 'Float zone c-Si;' then '[heterogeneous, \
misspelt on the page] data processing combining ellipsometric and spectrophotometric \
measurements with refractive index determined in' B. J. Frey, D. B. Leviton and T. J. Madison, 'Temperature-dependent \
refractive index of silicon and germanium', Proc. SPIE 6273, 62732J (2006); 'Numerical \
procedures updated in' D. Franta, P. Franta, J. Vohánka, M. Čermák and I. Ohlídal, J. \
Appl. Phys. 123, 185707 (2018) (franta_2018); then 'Temperature 300 K.' (or '20 °C', \
'25 °C', ...). CONDITIONS temperature: the kelvin value, except 293 for Franta-20C and \
25 for Franta-25C (the Celsius value, where every other page gives kelvin). Each page \
holds one 'tabulated nk' block of 4001 rows: vacuum wavelength (um), n and k, \
0.0309963-309.963 um (40 eV to 0.004 eV), one logarithmic grid shared by all pages, n \
and k to 12 significant digits. No uncertainty is stated.

WHAT THE PAGES ARE (checked 2026-10-14). This paper's ADM as revised in franta_2018 \
(the 0.25 mm wafer and 14.33 mm slab added, transmittance at 300-450 K, 1 cm-1 FIR \
resolution, 85 078 points at 0.0086-40 eV and 5-700 K, franta_2018 Table III; the 2 um \
pseudo-data from franta_2018's two-term Sellmeier formula instead of Eq. (3); \
spline-based Gaussian broadening). Evidence: the pages' n at 2 um (interpolated in log \
wavelength) follows franta_2018's two-term formula within 1e-5 at every page \
temperature, 10-500 K (10 K -4e-7, 300 K +3.2e-6, 400 K +8.9e-6), as franta_2018 Fig. 11 \
says of its model; this paper's Eq. (3) is 9e-4 lower at 500 K. Franta-20C agrees with \
the two-term formula at 293.15 K (+2.7e-6), not at 293 K (+2.8e-5): its temperature is \
20 degrees C = 293.15 K, the CONDITIONS value rounded. Franta-25C agrees at 298.15 K \
(+4.4e-6). The pages are one temperature-dependent model: Franta-20C differs from the \
linear interpolation of Franta-250K and Franta-300K to 293.15 K by at most 6.8e-5 in n \
over 1.2-6 um (the curvature in T; up to 0.022 in the UV at 0.355 um, where E_1 moves). \
n at 2 um: 3.453229 (20 C), 3.454084 (25 C), 3.454400 (300 K); n(300 K) - n(20 C) = \
1.17e-3 there, between -0.029 and +0.017 over the whole grid (largest in the UV). k at \
632.8 nm: 0.01522, 0.01547, 0.01556.

WHAT IS CURATED. Franta-20C (the optmat reference temperature, 293.15 K) as primary, \
Franta-25C and Franta-300K as checks, n and k as separate datasets, rows at most \
142.857 um (70 cm-1, the lowest wavenumber measured, franta_2018 Table III): 3664 rows, \
0.0309963-142.663 um; the 337 rows at 142.991-309.963 um are the model's extrapolation \
and are not extracted. The upper end, 40 eV, is the top of the Elettra reflectance \
(6-40 eV, at 300 K only). The other ten temperatures are not extracted. The numbers \
are the model's table on a dense grid, not individual measurements: no uncertainty is \
stated (the datasets state none; a fit sets its own sigma). franta_2018 gives the \
model's statistical uncertainty of n as about 2e-5 at room temperature in the infrared \
(Fig. 9) and ties the absolute n to Frey et al.'s data (uncertainty 1e-4). \
DOUBLE COUNTING: in the transparent range the pages' n is tied to Frey et al. (2006) \
through franta_2018's Sellmeier pseudo-data at 2 um (5-700 K); a fit that uses Frey et \
al.'s silicon data must not also fit these pages' n there as independent.

NEWAD2 UDM (formula udm_c_si; datasets newad2_n, newad2_k). The newAD2 site's \
universal-dispersion-model file of float-zone c-Si and its table (c-Si.par, c-Si.Enk; \
http://newad.physics.muni.cz/parfile-udm/c-Si and /table-udm/c-Si.Enk, retrieved \
2026-09-26), attached to this paper in the library because they describe the same \
material. The parameter file ends: 'material: Si, silicon', 'form: crystalline, Float \
zone', 'characterization: ellipsometry & photometry', 'range: FIR (80&nbsp;1/cm) - VUV \
(8.5&nbsp;eV)', 'published: unpublished', 'submitted: Daniel Franta'. It is not this \
paper's ADM: a UDM (interband, four excitonic terms, higher-energy excitations, Urbach \
tail, eleven Gaussian 'localised' terms that carry the E_1 and E_2 structure, 36 \
phonon terms), at one temperature, which is not stated, and it is not tied to Frey et \
al.'s index. It disagrees with the pages and with measurements (TC-388): c-Si.Enk's n \
is higher than Franta-300K's by 0.013-0.018 at 0.02-1.1 eV and 0.021-0.026 at 1.2-1.5 \
eV (3.468960 against 3.454400 at 2 um, where Eq. (3), fitted to Frey et al., gives \
3.45351 at 295 K), and \
its k near the gap is 2.4-2.6 times the page's at 1.5-2 eV (0.03988 against 0.01556 at \
632.8 nm)."""

