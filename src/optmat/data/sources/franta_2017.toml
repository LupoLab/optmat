[[datasets]]
id = "newad2_n"
material = "Si"
file = "Si/franta_2017__newad2_n.csv"
table = "data/c-Si.Enk"
quantity = "refractive_index"
abscissa_unit = "eV"
use = "check"
notes = "n of the newAD2 site's unpublished UDM of float-zone c-Si (c-Si.Enk, computed from c-Si.par: formula udm_c_si), 0.01-8.49 eV (the file's stated range; 2930 of the table's 4001 rows; the rows above 8.5 eV are extrapolation and are not extracted). A check, not data: the model disagrees with measurements (n 0.015 high in the near infrared; TC-388). Temperature not stated."
[datasets.parameters]
grade = "float zone"
form = "bulk"
technique = "ellipsometry and spectrophotometry (UDM fit)"

[[datasets]]
