citation = "N. Böwering, M. R. Bruce and J. W. Keto, \"Collisional deactivation of two-photon laser excited xenon 5p5 6p. II. Lifetimes and total quench rates\", J. Chem. Phys. 84, 715-726 (1986)"
doi = "10.1063/1.450568"
library = "Bowering_1986_CollisionalDeactivationTwo_5bde1b"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Two-photon excitation of Xe 6p[1/2]0, 6p[3/2]2 and 6p[5/2]2 (Paschen 2p5, \
2p6, 2p9) from the ground state by a frequency-doubled, nitrogen-laser-pumped dye laser \
near 250 nm in purified xenon (1 to above 3000 Torr); time-resolved infrared \
fluorescence of the 6p -> 6s lines (828.0, 823.2, 904.5, 881.9 and 980.0 nm) on cooled \
RCA 8852 or Hamamatsu R632 photomultipliers, recorded with a transient digitiser and by \
delayed-coincidence single-photon counting (agreeing to a few per cent), the instrument \
response (from p > 3000 Torr) fully deconvolved by nonlinear least squares. Low laser \
power to avoid stimulated emission, photoionisation and radiation trapping. Stern-Volmer \
plots (Fig. 3) of the decay rate nu = A + k(1) p (+ k(2) p^2 for 2p5) at T = 296 K; \
radiative lifetimes from the zero-pressure intercepts; 2p7 from time-integrated \
intensity ratios (Eq. 4); 2p10 and the 6s' levels from the three-component 980 nm \
cascade after 2p9 or 2p6 excitation, analysed with a three-level coupling model \
(appendix)."""
notes = """J. Chem. Phys. 84(2), 715-726 (15 January 1986) = PDF pages 2-13 (PDF page 1 \
is the AIP download cover; journal page = PDF page + 713); a scanned (raster) PDF with \
an OCR text layer. Identity checked on the first page of the article (PDF p. 2: title \
'Collisional deactivation of two-photon laser excited xenon 5p5 6p. II. Lifetimes and \
total quench rates', N. Böwering, M. R. Bruce and J. W. Keto, University of Texas at \
Austin, received 24 May 1985, accepted 17 September 1985, footer J. Chem. Phys. 84 (2), \
15 January 1986, 715) on 2026-10-09. Tables I-V checked cell by cell against the table \
images. The companion paper I is bowering_1986.

LEVELS. Paschen notation in Tables I-III, Racah in Table V and paper I's Table I (the \
mapping and its evidence in bowering_1986's notes): 2p5 = 6p[1/2]0 = 5p5(2P*3/2)6p \
2[1/2], J = 0 (NIST 80118.962 cm-1); 2p6 = 6p[3/2]2 (79212.465); 2p7 = 6p[3/2]1 \
(78956.031); 2p8 = 6p[5/2]3 (78403.061); 2p9 = 6p[5/2]2 (78119.798); 2p10 = 6p[1/2]1 = \
2[1/2], J = 1 (77269.145); 6s'[1/2]1 = 1s2 = 5p5(2P*1/2)6s 2[1/2]*, J = 1 (77185.041); \
6s'[1/2]0 = 1s3 = 2[1/2]*, J = 0 (76196.767). Evidence here: the 2p10 - 1s2 gap, 'only \
84 cm-1' (p. 715; NIST 84.104), and the equilibrium coefficients 1.51 and 63.5 at 294 K \
(p. 721), which NIST's energies give as 1.509 and 63.4 (script check).

TAKEN (radiative_lifetime and collisional_quenching_rate_coefficient, TC-1011; \
extraction script tools/extract/bowering_1986b.py for the tables, inline points for the \
text), the column 'This work':
- Table I (p. 719), radiative lifetimes (ns): 2p5 28 +- 1, 2p6 35 +- 3, 2p9 30 +- 4 \
(tau_Xe, primary); 2p9 36 +- 4 (footnote a, 'Extracted for data from 1 to 10 Torr'; \
tau_low_Xe, check: a subset of the same measurement, which the authors list because it \
agrees better with others, p. 723).
- Table II (p. 719), total quenching by xenon (perturber self): binary (10^-12 cm3/s) \
2p5 5.9 +- 3.3, 2p6 92.2 +- 4.7, 2p7 89 +- 26 (from the time-integrated ratios, Eq. 4 \
and Fig. 5), 2p8 39.2 +- 4.4 (late decay after cascade, intercept fixed at Setser's \
30.68 +- 0.69 ns), 2p9 86.8 +- 5.9, 2p10 295 +- 48 (the fast rise of the 980 nm \
cascade) (kq_self_Xe, primary); tertiary (10^-31 cm6/s) 2p5 6.5 +- 0.6 (kq3_self_Xe, \
primary). Temperature: 'T = 296 K' for the Fig. 3 decays (p. 716); the 2p10 analysis \
states 294 K (p. 721); no temperature_k is given.
- Text p. 719, 2p8 from the time-integrated ratios, '(4.5 +- 1.0) x 10^-11 cm3 s-1, in \
agreement with the value obtained from the data of Fig. 3(d)' (kq_2p8_integrated_Xe, \
check).
- Table III (p. 722), the coupled rates (footnote a, 'Coupled with Xe 2p10'): \
6s'[1/2]1 (4.22 +- 0.28) x 10^-11 (kc_1s2_Xe) and 6s'[1/2]0 (7.64 +- 0.94) x 10^-12 \
cm3/s (kc_1s3_Xe), check. They are the slopes, 5-100 Torr, of the two slow decay \
rates of the 980 nm signal, the mixed decays of 1s2 and 1s3 with 2p10 (k2c, k3c; Eqs. \
A12-A13), not the levels' removal coefficients (Ref. 4's low-pressure totals are 6.65 \
and 0.845 x 10^-11); the coupled-pair caution of TC-1016. The 2p10 row repeats Table \
II.
- Table IV (p. 723), the coupled-state model's state-to-state rates (cm3/s), check: \
k12 = 1.00e-10 (2p10 -> 6s'[1/2]1), k13 = 1.02e-10 (2p10 -> 6s'[1/2]0), k10 = 9.3e-11 \
(2p10 -> other states, 'Xe 1s4 and Xe 1s5', p. 724), k21 = 6.65e-11 (6s'[1/2]1 -> \
2p10), k31 = 1.6e-12 (6s'[1/2]0 -> 2p10; 'with a large uncertainty', p. 722). No \
uncertainties printed. They are derived, not fitted: k21 is set equal to Ref. 4's total \
k2tot (the quadratic's solution 'k21 ~ k2tot'), k31 from the same quadratic, k12 and \
k13 by detailed balance, and k10 = k1tot - k12 - k13 (script checks). k12 and k21 are \
printed 'kappa12' and 'kappa21' in Table IV, the letter of the equilibrium coefficient \
(p. 721); the text calls them k12 and k21 (p. 722). Not taken: k1tot = 2.95e-10 (Table \
II's 295) and k2tot, k3tot (Ref. 4's).
- Text pp. 721-722, the zero-pressure intercepts of Fig. 8 for 2p10: tau1 = 49.6 +- 17.5 ns \
from the fast rise times (tau_2p10_rise_Xe, check: 'although not very accurately \
determined', p. 721) and tau1 = 43.8 +- 8.0 ns from the coupled-state intercept tau2 = \
110 +- 20 ns by Eq. (8), tau1 = tau_c kappa^-1 / (1 + kappa^-1) (tau_2p10_coupled_Xe, \
check; script check). Not taken: tau1 >= 26 ns from tau3 >= 1.7 us (a one-sided bound); \
tau2 and tau3 themselves (coupled-state limits, not lifetimes, p. 722).
Uncertainty level of the tables not stated; the errors of Fig. 3's points are 'two \
standard deviations' (p. 716).

NOT TAKEN: the other rows and columns of Tables I-III and V (Refs. 3-10, 16-18; \
reproduced; among them McCown et al.'s 2p5 rate, 400 +- 100 x 10^-12, which this paper \
and ku_1986 contradict); Table V's cross sections (A^2), k / v of Table II's rates \
(script check; no quantity, and derivable); the comparison with the elastic collision \
frequencies from Ref. 11's high-resolution linewidths (raymond_1984): for 2p6 and 2p9 \
'binary elastic collisions with xenon ground state atoms are about an order of \
magnitude more frequent than inelastic collisions' (p. 723), no number.

FINDING (lifetimes, ns; NIST 1/sum A over Xe_I_lines_nir.tsv, TC-985; bruce_1990 and \
ku_1986 Table I). 2p5: 28 +- 1 here, NIST 27.1, bruce_1990 26.8 +- 0.8, ku_1986 32.6 +- \
1.0. 2p6: 35 +- 3, NIST 27.2 (A 2.86e7 B+ and 8.1e6 C+), bruce_1990 31.3 +- 1.8, ku_1986 \
36.0 +- 3.0: every measurement is 15-32 % longer than NIST's. 2p9: 30 +- 4 (36 +- 4 \
below 10 Torr), NIST 39.4, bruce_1990 36.0 +- 2.8, ku_1986 39.3 +- 1.0. 2p10: 49.6 +- \
17.5 and 43.8 +- 8.0, NIST 30.4, ku_1986 38.2 +- 1.0. No 6p' or 7p lifetime is measured \
here, so the paper does not bear on bruce_1990's 6p' disagreement with NIST (TC-1003, \
TC-1010).

FINDING (quenching by xenon, against bruce_1990 and ku_1986, 10^-12 cm3/s): 2p5 5.9 +- \
3.3 (bruce 5.9 +- 0.5, Ku 5.8 +- 0.5), tertiary 6.5 +- 0.6 x 10^-31 cm6/s (bruce 7.0 +- \
0.5); 2p6 92.2 +- 4.7 (bruce 101 +- 3, Ku 82 +- 5); 2p9 86.8 +- 5.9 (bruce 116 +- 3, Ku \
96 +- 3); 2p7 89 +- 26 (Ku 128 +- 4); 2p8 39.2 +- 4.4 (Ku 53 +- 3); 2p10 295 +- 48 (Ku \
133 +- 5, and Ku's note added in proof prefers its own). Table V implies one mean \
relative speed of 2.97e4 cm/s for every level, the speed at 273 K, not at 296 K \
(3.09e4 cm/s): the cross sections are about 4 % high (script check).

TWO-PHOTON DATA CITED, NOT IN THE LIBRARY: G. Inoue, J. K. Ku and D. W. Setser, J. \
Chem. Phys. 81, 5760 (1984) (Ref. 6; Xe 6p, 6p', 7p, 6d lifetimes, Ar and Ne \
quenching); H. Horiguchi, R. S. F. Chang and D. W. Setser, J. Chem. Phys. 75, 1207 \
(1981) (Ref. 5); N. Sadeghi and J. Sabbagh, Phys. Rev. A 16, 2336 (1977) (Ref. 4; 6s' \
quenching); X. Husson and J. Margerie, Opt. Commun. 5, 139 (1972) and T. Suzuki and K. \
Shimoda, J. Phys. Soc. Jpn. 43, 233 (1977) (Refs. 9-10, lifetimes); M. Aymar and M. \
Coulombe, At. Data Nucl. Data Tables 21, 537 (1978) (Ref. 17, calculated lifetimes and \
branching). Held: mccown_1982 (Ref. 7), raymond_1984 (Ref. 11), mcguire_1981 (Ref. 16, \
TC-879)."""

