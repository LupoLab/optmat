citation = "D. Bermejo, R. Escribano and J. M. Orza, \"Absolute Raman intensities of CH4, CH3D, CH2D2, CHD3, and CD4\", J. Mol. Spectrosc. 65, 345 (1977)"
doi = "10.1016/0022-2852(77)90274-0"
library = "Bermejo_1977_AbsoluteRamanIntensities"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Spontaneous vibrational Raman scattering of the gases at room temperature, \
Ar+ laser at 488.0 nm (0.5 W), 90-degree scattering with the electric vector of the \
incident light perpendicular to the direction of observation, f/0.95 collection, a \
Polaroid analyzer and a scrambler, Jarrell-Ash 25-300 spectrophotometer with photon \
counting; spectral sensitivity from calibrated tungsten and halogen lamps; collection \
angle and convergence corrections (pp. 347-348). Relative band intensities in a glass \
cell at about 1.5 atm; every compound referred to the nu1 band of CH4 in a steel cell \
(five sequences); the absolute nu1 intensity of CH4 measured against the Rayleigh line \
of CH4 at about 0.1 atm, 20 alternating recordings (pp. 348-349). The alpha^S tensors \
(derivatives with respect to Mills's symmetry coordinates) from a weighted least-squares \
fit to the 36 intensities and depolarization ratios of the five isotopologues, with \
Mills's L matrix (p. 352)."""
notes = """Journal pages 345-353 = PDF pages 1-9 (page n of the PDF is p. 344 + n). The \
citation first requested, 'J. Raman Spectrosc. 6', is wrong: the paper is J. Mol. \
Spectrosc. 65, 345 (1977) (checked against the first page).

SCOPE AND ISOTOPOLOGUES. Only CH4 (12CH4, natural methane, purity >= 99.9 %) is a \
curated material. The deuterated isotopologues CH3D (~98 %), CH2D2 (~94 %), CHD3 (~85 %) \
and CD4 (~89 %, with air and CHD3) (p. 347) fill the rest of Tables I and II and are \
not extracted: for review, CD4 nu1 (2108.6 cm-1) I = 71.9 and 115 +- 8 with 2nu2, \
nu2 + nu4 and 2nu4 added (Table II); CD4 nu3 (2258.5 cm-1) 70.5 +- 5.

WHAT THE INTENSITY IS. Table I footnote b: 'I = g_i (45 alpha'^2 + 7 gamma'^2) . N . \
10^-32 cm^4 gr^-1 (Where N is the Avogadro Number)': the scattering activity, as in \
Murphy et al. 1969 (murphy_1969), so a printed number is in angstrom^4/amu exactly. It \
is absolute: 'we measured the absolute intensity of the nu1(a1) band of methane with \
reference to the Rayleigh line' of CH4 (p. 348; the reduction from the Rayleigh line, \
through CH4's polarizability and anisotropy, is not given), and every other band was \
referred to CH4's nu1 (p. 348). 'We found (45 alpha'^2 + 7 gamma'^2) = 223 . N . 10^-32 \
g^-1 cm^4; comparable, for instance, with 237 and 223, calculated from data published \
in Refs. (10) and (11)' (p. 349): the two reproduced values are the inline dataset \
intensity_CH4_nu1_others. The excitation wavelength does not enter the activity; it is \
488.0 nm (air) for every datum.

TABLE I (p. 348): band positions ('a: Our measurement'; nu4's 1310 cm-1 carries no mark \
and is excluded from shift_CH4), intensities and depolarization ratios. Every CH4 \
depolarization ratio is 'd: Expected values, not measured' (0 for nu1, 3/4 for the \
others): none is extracted. Footnote c defines rho = 3 gamma'^2/(45 alpha'^2 + 4 \
gamma'^2), the ratio for linearly polarized incident light. nu4's intensity is an upper \
limit, '<= 0.05^Q' (Q branch only), not extracted. No uncertainty is printed in Table I; \
Table II gives the adopted values with their +-.

TABLE II (p. 350): 'Observed and Calculated Intensities and Depolarization Ratios'. \
Footnote a: 'Intensities of overtones and combinations assumed to be in interaction with \
fundamentals have been added to that of the fundamental', so CH4 nu1's 230 +- 12 is \
Table I's 223 + 7 (2nu2); nu2 7.0 +- 0.4 and nu3 128 +- 7 are Table I's. 'We have thus \
adopted as experimental intensities, I_exp, those given in Table II' (p. 352). The +- \
level is not stated. I_calc is recomputed from the fitted alpha^S tensors (use = \
"check"); the fit's 'standard deviation of the calculated values of the data is sigma = \
0.94' (p. 352). nu4: calculated 0.22, experimental '<= 0.24' (not extracted).

THE alpha^S INVARIANTS (p. 352): 'From a weighted least-squares adjustment of the 36 \
experimental measurements, using the L matrix derived from Mills (6), we find: |c(S1)| \
= 2.260 +- 0.042 A^2; |c(S2)| = 0.139 +- 0.015 A^2; c(S3) = 1.366 +- 0.077 A^2; c(S4) = \
0.00 +- 0.10 A^2 (signs of c(S3) and c(S4) may be simultaneously changed)': the \
derivatives of the polarizability tensor with respect to Mills's symmetry coordinates, \
the one parameter of each tensor (theory, pp. 345-346: for S1, alpha_xx' = alpha_yy' = \
alpha_zz' = c, the mean-polarizability derivative; S2, S3, S4 traceless). They are \
isotope invariant, so they hold for CH4 and every deuterated form. Datasets dS1_CH4 \
(component mean) and dS_aniso_CH4 (component anisotropy: the tensor element c, not the \
invariant gamma'). Check (2026-09-26): for CH4, I(nu1) = 45 alpha_1'^2 with alpha_1' = \
l_11 c(S1) and l_11 = m_H^(-1/2) (S1 the symmetric sum of the four C-H stretches with \
coefficient 1/2); 230 gives c(S1) = (230/45)^(1/2) 1.008^(1/2) = 2.270, 223 gives 2.235: \
the fitted 2.260 lies between (the fit uses all five molecules).

ELECTRO-OPTICAL PARAMETERS (p. 352), from Eqs. (3)-(6) in the first-order bond \
polarizability approximation: '|alpha'_C-H| = 1.130 +- 0.021 A^2; |gamma_C-H| = 0.279 +- \
0.030 A^3; |gamma'_C-H| = 2.05 +- 0.16 A^2; |gamma'^(alpha)_C-H| = 0.18 +- 0.13 A^2, \
which agree fairly well with those found by Yoshino and Bernstein'. Eq. (3): alpha'_C-H = \
(1/3)|alpha_l' + 2 alpha_p'| = (1/2)(dalpha/dS1)_xx, the derivative of the mean bond \
polarizability with respect to the C-H bond length (1.130 = 2.260/2, checked); Eq. (5): \
gamma'_C-H = |alpha_l' - alpha_p'| = (3/2)(dalpha/dS3)_yz (1.366 x 3/2 = 2.049, \
checked). The datasets dalpha_CH_CH4 (component mean) and dgamma_CH_CH4 (component \
anisotropy) hold them per bond. gamma_C-H (a bond polarizability anisotropy, not per \
molecule) and gamma'^(alpha) (a derivative with respect to the bond angle; its sign is \
argued negative, p. 352) have no quantity: notes only. Sign: 'alpha'_C-H must be \
positive' (Yoshino and Bernstein); no reason is found to choose the sign of gamma'_C-H \
(p. 352).

FOR REVIEW (solprop's CH4 1.04e-20 m^2, Murphy et al.'s Table I, ref. 17): the same \
per-bond mean derivative here is 1.130 +- 0.021 A^2 = 1.130e-20 m^2 (8.7 % higher), from \
a laser measurement against the Rayleigh line; Murphy et al.'s own four values are 1.03 \
to 1.08.

ISOTOPE RULES (Table III, p. 351, printed as an equation block garbled in the library \
text): the sum rules hold to 0.96-1.05. Not extracted."""

