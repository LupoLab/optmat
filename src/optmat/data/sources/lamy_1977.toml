citation = "P. L. Lamy, \"Optical constants of crystalline and fused quartz in the far ultraviolet\", Appl. Opt. 16, 2212 (1977)"
doi = "10.1364/ao.16.002212"
library = "Lamy_1977_OpticalConstantsCrystalline"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Near-normal-incidence reflectance (9 degrees, no collimator; unchanged between \
5 and 9 degrees) of a Z-cut crystal-quartz plate and a Tetrasil SE fused-silica plate \
(Electro-Quartz), both 5 mm thick, polished with cerium oxide and outgassed by gentle \
heating in vacuum, at the 21 emission lines of an H2-filled MacPherson lamp from 1026 to \
1640 A, in the vacuum monochromator of the Laboratoire de Technologie Optique (Al + MgF2 \
coated grating); 1980-4000 A with a standard double monochromator (p. 2212). \
Kramers-Kronig analysis of the reflectance (Philipp and Taft's phase integral), \
extended below 1000 A with Philipp's crystal-quartz data (450-1000 A) or Platzoder and \
Steinmann's fused-quartz data (500-1000 A) and the asymptotic forms R = 1.658e-12 \
omega^-4 (crystal) and 9.6e-13 omega^-4 (fused), omega in A^-1; and above 2000 A with the \
Smithsonian Physical Tables, Spitzer and Kleinman (crystal, to 35 um), Malitson, \
Drummond and Steyer and Huffman (fused, to 50 um). A constant was subtracted from the \
phase so that k >= 0 and k and the phase vanish in the transparent range (p. 2213)."""
notes = """Journal pages 2212-2214 = pdf pages 1-3 (p. 2214 is half a page; the rest of \
the pdf page is the journal's meetings calendar, and the extraction mixes its lines into \
the reference list). Identity checked against the first page. Table I (p. 2213): 'The \
Complex Index of Refraction of Crystalline Quartz (Ordinary Ray) and Fused Quartz', N and \
K against wavelength in angstrom, 1000-1650 A; the complex index is written m = n - ik \
(p. 2212), so K is the usual (positive) extinction coefficient. Fig. 1 (reflectance of \
both, with the values adopted for the analysis dashed) and Fig. 2 (N and K with \
Osantowski's and Platzoder and Steinmann's points) are figures only, not digitised.

THE ROWS. The measured range is 1026-1640 A; the 1000 and 1020 A rows and the 1650 A \
row rest on the extrapolated reflectance (Philipp's or Platzoder and Steinmann's data \
below 1000 A, and the longer-wavelength data). The wavelengths are those of a vacuum \
monochromator in the vacuum ultraviolet, i.e. vacuum wavelengths (the paper does not \
say so explicitly). K is not printed where the analysis gives no usable value: from \
1450 A (crystal) and 1550 A (fused). Four small K values carry a third digit in \
parentheses ('0.08(4)'), read as 0.084 (see the extraction script); the paper does not \
explain the parentheses. The crystal-quartz K at 1200 A is printed '1 25', the decimal \
point lost in the print; read as 1.25 (extraction script).

ACCURACY. No uncertainty is stated for Table I. Lamy's checks (pp. 2213-2214): for fused \
quartz, 'excellent agreement with those of Platzoder and Steinmann at 1216 A and with \
those of Osantowski except for k at 920 A and 1048 A'; for crystal quartz, eps_2 agrees \
'very well' with Philipp's graphical result except below 800 A, while 'the oscillations \
of the eps_1 curve are shifted by a few angstroms, and our eps_1 is larger by typically \
0.2'. Extended to the infrared, the n 'was found in excellent agreement with published \
data for all wavelengths up to 10 um, with an absolute error not exceeding 0.007'; 'The \
validity of the results of the Kramers-Kronig analysis for the extinction coefficient is \
restricted to sufficiently large values (k >~ 0.05)' (p. 2214), which the smallest \
printed K values (0.043-0.084) approach. The fused-quartz reflectance agrees 'excellent' \
with Platzoder and Steinmann's (20 degrees) and differs from Philipp's, 'whose peaks are \
somewhat narrower particularly the one centered at approximately 1220 A'; the crystal \
reflectance agrees with Philipp's (p. 2212).

COMPARISON WITH philipp_1985 (Palik's Table X, fused silica). Philipp's 25-11.4 eV \
values (philipp_1985/philipp_lamy_n, _k) are a smooth curve drawn through Philipp's and \
this paper's Kramers-Kronig results; they are not a reprint of Table I, so nothing there \
is re-pointed (they overlap Table I only at 1000-1088 A, where they agree with Table I's fused-quartz values within 0.04 in n and 0.03 in k: n = 1.550, k = 0.873 at 1050 A, interpolated, against 1.51 and 0.89 here). Above 1100 A Table X holds Philipp's own n (philipp_vuv_n) and transmission-based k (weinberg_k, transmission_curve_k), and the two sets differ strongly (checked 2026-09-27, Table X interpolated to Table I's wavelengths): Philipp's n peaks at 2.33 at 1228 A and is 0.29-0.33 above Lamy's at 1200-1220 A, then 0.06-0.11 below it at 1300-1500 A; Lamy's k exceeds the transmission k from 1210 A on, by a factor 6 at 1300 A (0.40 against 0.064) and 40 at 1500 A (0.043 against 0.0011). Lamy's fused-quartz structure is broader and lower than Philipp's, as he says of the reflectance, and his long-wavelength k is a limit of the Kramers-Kronig analysis, not an absorption measurement.

The crystal is alpha-quartz cut perpendicular to its optic axis (Z-cut) and measured \
near normal incidence, so the field is perpendicular to the axis: the ordinary ray, as \
the caption says (axis = o). The sample temperature is not stated (room temperature). \
refractiveindex.info's copies in data/external have no page for this paper."""

[[datasets]]
id = "quartz_o_n"
material = "SiO2_quartz"
file = "SiO2_quartz/lamy_1977__quartz_o_n.csv"
table = "tbl_1c325c8f2d92"
quantity = "refractive_index"
abscissa_unit = "angstrom"
use = "primary"
notes = "Table I, crystalline quartz (ordinary ray), N, 1000-1650 A: Kramers-Kronig analysis of the Z-cut crystal's near-normal reflectance. No uncertainty stated."
[datasets.parameters]
axis = "o"
form = "bulk"
technique = "Kramers-Kronig analysis of reflectance"
index_medium = "vacuum"

[[datasets]]
id = "quartz_o_k"
material = "SiO2_quartz"
file = "SiO2_quartz/lamy_1977__quartz_o_k.csv"
table = "tbl_1c325c8f2d92"
quantity = "extinction_coefficient"
abscissa_unit = "angstrom"
use = "primary"
notes = "Table I, crystalline quartz (ordinary ray), K, 1000-1400 A (not printed beyond). The 1200 A cell prints '1 25' (decimal point lost; read 1.25); 1350 and 1400 A print '0.08(4)' and '0.05(5)' (read 0.084, 0.055). The paper restricts the Kramers-Kronig k to k >~ 0.05 (p. 2214)."
[datasets.parameters]
axis = "o"
form = "bulk"
technique = "Kramers-Kronig analysis of reflectance"

[[datasets]]
id = "fused_n"
material = "SiO2"
file = "SiO2/lamy_1977__fused_n.csv"
table = "tbl_1c325c8f2d92"
quantity = "refractive_index"
abscissa_unit = "angstrom"
use = "primary"
notes = "Table I, fused quartz (Tetrasil SE, Electro-Quartz), N, 1000-1650 A: Kramers-Kronig analysis of near-normal reflectance, extended below 1000 A with Platzoder and Steinmann's reflectance. No uncertainty stated."
[datasets.parameters]
grade = "Tetrasil SE"
form = "bulk"
technique = "Kramers-Kronig analysis of reflectance"
index_medium = "vacuum"

[[datasets]]
id = "fused_k"
material = "SiO2"
file = "SiO2/lamy_1977__fused_k.csv"
table = "tbl_1c325c8f2d92"
quantity = "extinction_coefficient"
abscissa_unit = "angstrom"
use = "primary"
notes = "Table I, fused quartz (Tetrasil SE), K, 1000-1500 A (not printed beyond). 1450 and 1500 A print '0.08(0)' and '0.04(3)' (read 0.080, 0.043). The paper restricts the Kramers-Kronig k to k >~ 0.05 (p. 2214); at these wavelengths k is far above the intrinsic absorption edge's transmission values (philipp_1985/transmission_curve_k gives 1.1e-3 at 1500 A and 7e-3 at 1450 A), so the tail of this column is an artefact of the analysis's limits, not an absorption measurement."
[datasets.parameters]
grade = "Tetrasil SE"
form = "bulk"
technique = "Kramers-Kronig analysis of reflectance"
