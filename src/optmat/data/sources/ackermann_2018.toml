notes = """Nothing extracted: the argon refractive index (Appendix A, Section 3) is a model: \
a Lorentz sum over the dipole-allowed bound states up to 5d (81.62 nm) with oscillator \
strengths from Chan et al. averaged with Xu and Wu, plus a continuum from the \
photoabsorption cross section through Kramers-Kronig; the paper prints no refractivity \
values ('The values differ less than 1 % from the Sellmeier equation approach within \
its valid spectral regime', citing Bideau-Mehu et al.). The nonlinear susceptibilities \
of its Table 2 and the literature n2 (10e-20 cm^2/W at 800 nm) and n4 values belong to \
the nonlinear-optics phase. Table 1 is a modal power decomposition of the pump beam."""
