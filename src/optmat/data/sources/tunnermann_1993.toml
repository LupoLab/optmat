citation = "A. Tünnermann, C. Momma, K. Mossavi, C. Windolph and B. Wellegehausen, \"Generation of tunable short pulse VUV radiation by four-wave mixing in xenon with femtosecond KrF-excimer laser pulses\", IEEE J. Quantum Electron. 29, 1233 (1993)"
