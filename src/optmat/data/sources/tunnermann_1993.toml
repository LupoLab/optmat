technique = """Four-wave difference-frequency mixing w_s = 2 w_p - w_i in xenon (1-760 Torr): \
the femtosecond KrF pump (248.5 nm, 10 mJ, 360 fs, up to 10^15 W/cm2, f = 1000 mm) with \
tunable nanosecond seeds from 185 to 1905 nm (excimer- or Nd:YAG-pumped dye lasers, 368-608 \
nm, about 8 GHz wide, extended by H2 Raman shifting and doubling; f = 300 mm). Output \
133-355 nm measured with a vuv monochromator, calibrated pyroelectric meter, streak \
camera and ionisation-chamber autocorrelators; amplification at 193, 308 and 351 nm in \
an excimer discharge (pp. 1233-1235)."""
notes = """No datasets. Identity checked on the first page: Tünnermann, Momma, Mossavi, \
Windolph and Wellegehausen, IEEE J. Quantum Electron. 29 (No. 4, April 1993), \
1233-1238; PDF pages 1-6 = journal pp. 1233-1238 (the library's author list misspells \
Wellegehausen). It is Ref. [7] of lehmberg_1995 and the sequel of tunnermann_1992 (its \
Ref. [12]).

WHAT IT REPORTS. The pump is 'dominated by a near resonant two-photon excitation at \
the 5p6 1S0 -> 6p[1/2]0 transition' (p. 1234), detuned by 363 cm^-1 (p. 1236; NIST: \
363.9 cm^-1 for 248.5 nm in vacuum). Examples (pp. 1234-1235): 141 nm from a 1064 nm \
seed at 80 Torr, 5 uJ (E_p = 5 mJ, E_i = 90 mJ); 157 nm from 595 nm (35 mJ) at 30 Torr, \
up to 7 uJ; 193 nm from 352 nm at 450 Torr, 8 uJ (E_p = 10 mJ, E_i = 70 mJ), 1.0 ps \
(sech^2) by a two-photon-ionisation autocorrelator in 20 Torr of xenon. FWM spectra \
about 600 cm^-1 wide (FWHM) against 'the combined bandwidth of two fs-KrF-excimer laser \
photons [160 cm^-1 (FWHM)]' (pp. 1234-1235). Conversion 10^-2 to 10^-3. Amplified to 1.9 \
(193 nm), 3.0 (308 nm) and 2.8 mJ (351 nm) (Table I).

SUSCEPTIBILITY. Eq. (1) (p. 1236, after Hanna, Yuratich and Cotter): I_FWM = 9 w_s^2 \
N^2 |chi(3)_FWM|^2 l^2 I_i I_p^2 sinc^2(Delta k l/2) / [(2c)^4 eps0^2 n_s n_i n_p^2]. \
With plane waves, E = (1/2) E exp(-iwt) + c.c. and I = (1/2) eps0 c n |E|^2, it \
corresponds to P(w_s) = (3/4) eps0 N chi E_p^2 E_i* (derived here; tunnermann_1992's \
gain Eq. 5 gives the same factor), so the Taylor gamma per atom is 6 eps0 chi. Fig. 6 \
(raster) shows |chi(3)| in 10^-48 m^5/V^2 against the generated wavelength, 135-195 nm \
(inset 175-335 nm), with experimental rhombs from Eq. (1) 'assuming an average \
intensity of 10^14 W/cm2' for I_p; the 148.5 and 320 nm points come from the FWPO of \
tunnermann_1992. The calculated curve (four-level, fixed 363 cm^-1 detuning, \
oscillator strengths of Aymar and Coulombe; no saturation, transients, damping or \
ponderomotive shift) is drawn 'x 0.25': the calculation lies about four times above \
the points, 'within one order of magnitude' (p. 1236).

NOT TAKEN (awaiting vocabulary): Fig. 6's rhombs and curve, raster, and in a \
convention CONVENTIONS lacks (Hanna, Yuratich and Cotter's per-atom SI chi(3); see \
tunnermann_1992). NOT TAKEN (not a xenon property): Table I's amplifier energies. The \
library's extracted Table I misplaces the rows (the image: XeF 0.26 and 2.8, XeCl 0.50 \
and 3.0, ArF 0.26 and 1.9 mJ); nothing depends on it.

DOUBTS. The FWPO point is at 320 nm here and at 280 nm in tunnermann_1992; the \
detuning of the calculation is 363 cm^-1 here and '0.2 nm' there.

TWO-PHOTON STRENGTH. Nothing here implies a 6p[1/2]0 strength: the measured |chi(3)| \
scale as 1/I_p with an assumed I_p, and the resonant part pairs the two-photon \
amplitude with a (w_s, w_i) amplitude that is not printed. The xenon ionisation energy \
'12.13 eV' is quoted from Samson.

Register: TC-999."""
