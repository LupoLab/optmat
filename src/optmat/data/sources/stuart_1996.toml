quantity = "avalanche_coefficient"
unit = "cm2/(ps GW)"
abscissa_unit = "nm"
use = "check"
notes = "Calculated, not measured: the avalanche coefficient alpha of beta = alpha I (Eqs. 16, 18) from the numerical solution of the kinetic equation, 'From the figure, alpha = 0.011 cm2/ps GW' at 1053 nm (p. 1756, Fig. 11) and 'alpha = 0.013 cm2/ps GW ... for fused silica at 526 nm' (p. 1757). The flux-doubling estimate at 1053 nm is 0.0065-0.013 (p. 1755). Inputs: U_I = 9 eV, m* = m_e, U_phon = 0.033 eV and Arnold et al.'s scattering rates. Checked: 2/alpha = 0.18 J/cm2 at 1053 nm (printed 'the scale fluence 2/alpha is 0.2 J/cm2') and 0.154 at 526 nm (printed 0.15)."
[datasets.parameters]
definition = "alpha in dn/dt = alpha I(t) n (Eq. 18), from the kinetic (Fokker-Planck) equation of Sec. IV"

[[formulas]]
id = "kinetic_equation"
material = "SiO2"
equation = "Eqs. (1)-(6), pp. 1753-1754"
printed = "df/dt + d/de [V(e) f - D(e) df/de] = S(e,t); V(e) = sigma(e) E^2(t)/3 - U_phon gamma(e); D(e) = 2 sigma(e) E^2 e / 3; sigma(e) = e^2 tau_m(e) / (m* [1 + omega^2 tau_m^2(e)]); S = R_imp + R_pi; R_imp(e,t) = -nu_i(e) f(e) + 4 nu_i(2e + U_I) f(2e + U_I)"
variable = "e (epsilon): electron kinetic energy in the conduction band; f(e,t) de the electron density with energy e; E the laser field; tau_m(e) the momentum scattering time; gamma(e) the energy-transfer rate to the lattice"
coefficients = { m_star = "m_e", U_I = "9 eV", U_phon = "0.033 eV" }
check = "Not reproduced numerically: tau_m(e) and gamma(e) are Arnold, Cartier and DiMaria's (ref. 28) and are shown only in Fig. 9."
notes = "Fokker-Planck equation for the electron energy distribution (refs. 3, 10). Boundary conditions: the distribution vanishes at infinite energy and the current at zero energy. The flux-doubling alternative replaces R_imp by f(U_I,t) = 0, J(0,t) = 2 J(U_I,t) (Eq. 7), valid when U_I nu_i(2e + U_I) >> sigma_max E^2 (Eq. 8)."

[[formulas]]
id = "impact_ionization_rate"
material = "SiO2"
equation = "p. 1753 (text after Eq. 6)"
printed = "nu_i(e) = 1.5 (e/U_I - 1)^2 fs^-1"
variable = "e: electron kinetic energy; U_I = 9 eV the band gap"
coefficients = { prefactor = "1.5 fs^-1", U_I = "9 eV" }
reproduced_from = ["B. K. Ridley, Quantum Processes in Semiconductors (Clarendon, Oxford, 1993), pp. 276-278"]
check = "Nothing printed to reproduce."
notes = "'The ionization rate nu_i(e) was taken in the Keldysh impact ionization form (ref. 37) as 1.5 (e/U_I - 1)^2 fs^-1' (p. 1753); zero below U_I is implied, not stated."

[[formulas]]
id = "avalanche_rate"
material = "SiO2"
equation = "Eq. (16), p. 1755, and Eq. (A6), p. 1760"
printed = "beta = p E^2 / int_0^U_I de/sigma(e) = alpha I"
variable = "E: laser field; I the intensity; p a numerical factor between 0.5 and 1.0 (the numerical calculations give p = 0.85, p. 1760)"
coefficients = { p = "0.5-1.0 (numerically 0.85)" }
check = "The flux-doubling range 0.0065-0.013 cm2/(ps GW) gives 1/alpha = 0.077-0.154 J/cm2, the printed 'between 0.08 and 0.16 J/cm2' (checked 2026-09-26)."
notes = "Valid for I >> I_b ~ 80 GW/cm2 (p. 1754). See the dataset model_avalanche_coefficient."

[[formulas]]
id = "mpi_526nm"
material = "SiO2"
equation = "Eq. (19), p. 1756"
printed = "P(I) = sigma_4 (I/hbar omega)^4 N_s, sigma_4 = 2 x 10^-114 cm^8 sec^3"
variable = "I: intensity; hbar omega the 526-nm photon energy; N_s 'the solid atom density' (no value given)"
coefficients = { sigma_4 = "2e-114 cm^8 s^3" }
reproduced_from = ["S. C. Jones, P. Braunlich, R. T. Casper, X.-A. Shen and P. Kelly, Opt. Eng. 28, 1039 (1989)"]
check = "Not reproducible without N_s."
notes = "The four-photon cross section of NaCl, applied to fused silica (see model_sigma4)."

[[formulas]]
id = "mpi_1053nm_fit"
material = "SiO2"
equation = "Eq. (20), p. 1756"
printed = "P(I) = 9.52 x 10^10 I^8 cm^-3 ps^-1, where the intensity I is in TW/cm^2"
variable = "I: intensity in TW/cm2 at 1053 nm"
coefficients = { prefactor = "9.52e10 cm^-3 ps^-1 (TW/cm^2)^-8" }
check = "A fit to the Keldysh rate (ref. 38) for fused silica with U_I = 9 eV, 'valid up to intensities on the order of 10^3 TW/cm^2'; the Keldysh evaluation itself is not printed, so not reproduced."
notes = "'For 1053-nm light, eight-photon absorption cross-section values were not available, so we used the strong-field Keldysh formula for P(I). Evaluation of the Keldysh expression leads to a result that is fit very well by the eight-photon absorption form' (p. 1756)."

[[formulas]]
id = "rate_equation"
material = "SiO2"
equation = "Eqs. (18), (21), (23)-(26), pp. 1756-1757"
printed = "dn/dt = beta(I) n + P(I) (21); n = n_0 exp[alpha I_0 tau (pi/ln 2)^(1/2) / 4] (23); F_cr = (I_0 tau/2)(pi/ln 2)^(1/2) = (2/alpha) ln(n_cr/n_0) (25); Phi_cr = tau^(3/4) (n_cr/(sigma_4 N_s))^(1/4) (pi/ln 2)^(3/8) hbar omega / sqrt(2) (26)"
variable = "I(t) = I_0 exp(-4 ln 2 t^2/tau^2), tau the intensity FWHM (Eq. 22); n_0 the multiphoton-produced density (Eq. 24); n_cr the critical density"
coefficients = { n_cr = "~1e21 cm^-3 (1053 nm)" }
check = "2/alpha from alpha = 0.011 (0.013) cm2/(ps GW) is 0.18 (0.154) J/cm2, printed 0.2 (0.15) J/cm2 (checked 2026-09-26)."
notes = "The analytic estimate separating multiphoton seeding at the pulse peak from the avalanche; Eq. (26) is the multiphoton-only limit for four-photon absorption, scaling generally as tau^((m-1)/m) n_cr^(1/m)."

[[formulas]]
id = "plasma_absorption"
material = "SiO2"
equation = "Eqs. (33)-(35), pp. 1758"
printed = "a = alpha n [<e> + U_I] (33); epsilon(omega) = 1 - n <sigma>(i + omega tau_m)/omega = 1 - (n/n_c) / (1 + i/(omega tau_m)) (34); T = |2 Re sqrt(epsilon) / (1 + sqrt(epsilon))|^2 (35)"
variable = "a: intensity absorption coefficient; n the electron density; <e> the mean electron energy"
coefficients = { alpha_inverse = "0.1 J/cm^2", energy = "<e> + U_I = 15 eV" }
check = "With 1/alpha = 0.1 J/cm2, <e> + U_I = 15 eV and n_cr = 1e21 cm^-3, Eq. (33) gives a = 2.403 um^-1 (n/n_cr); printed 'a = 2.4 (n/n_cr) um^-1' (checked 2026-09-26)."
notes = "The Drude response of the conduction electrons (p. 1758)."
