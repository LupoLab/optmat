notes = """A doctoral thesis, without a DOI; identity ASSERTED by the library (a public copy \
is hosted by NIST). Printed page = pdf page - 10 (checked at pp. 128-130 and 198). The \
library's extraction is PARTIAL (pdf pages 4 and 220 empty), and its text of Table \
6.1's header is garbled; that table was read from the pdf's text layer.

THE PAIRS (Tables 2.9-2.10, pp. 24-25): all fifteen binaries of CO2, H2O, N2, O2, Ar \
and CO. New departure functions: CO2-H2O, CO2-Ar, H2O-N2 (H2O-O2 and H2O-CO reuse \
H2O-N2's with a fitted F). CO2-N2's departure function, and the N2-O2 and CO-Ar \
parameters, are GERG-2008's unchanged; O2-CO is unfitted (no data). These are the \
pairs CoolProp names `Gernert-Thesis-2013`.

THE VIRIAL LIMITATION (§5.2.4, pp. 127-130; checked in GPT-6's review of OEP 4 and \
again by a reader, 2026-09-30): the model's second virial coefficient as a function of \
composition 'is clearly not quadratic, which is again a result of the corresponding \
states approach' (p. 129), and the quadratic mixing rule, Eq. (5.11), 'is not \
correctly reproduced by the model' (p. 130). It is shown for H2O-N2 (Fig. 5.23), with \
'only a small influence' when the components' critical temperatures are similar \
(p. 130).

CROSS SECOND VIRIAL DATA (Table A2.1, p. 198; deviations in cm^3/mol per its note a, \
though the column head reads %): CO2-Ar: Bose and Cole 1970 (5 points, 320-322 K, none \
used, deviation 6.169), Cottrell et al. 1956 (3, none used), Martin et al. 1982 (3, all \
used), Schonmann 1971 (3, all used); 14 in all, 6 used (Table 5.3, p. 95). N2-O2: \
Fostiropoulos 1988 (87-475 K), Gorski and Miller 1953 (303 K), Hall and Iglesias-Silva \
1994 (188-480 K), Martin 1982 (289-319 K), Wilson 1965 (72-144 K). N2-Ar: Brewer and \
Vaughn 1969 (123-323 K), Crain and Sonntag 1966 (143-273 K), Dymond and Smith 1980 \
(213-474 K), Elshayal and Lu 1975 (353-463 K), Knobler 1959 (90 K), Martin (289-319 K), \
Schramm and Mueller 1982 (296 K), Wilson 1965, Zandbergen and Beenakker 1967 (170-270 K). \
O2-Ar: Martin (289-319 K), Vatter et al. 1996 (296-463 K). The Elshayal and Lu \
reference is printed as an ethylene-propane paper, apparently a citation error.

STATED UNCERTAINTY (Table 6.1, p. 137): density of the gas at reduced density below \
0.6: N2-O2 < 0.1 %, N2-Ar < 0.5 %, O2-Ar < 1.0 %, CO2-N2 < 0.3 %, CO2-Ar < 0.5 %, \
