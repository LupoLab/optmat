citation = "A. Kumar and A. J. Thakkar, J. Chem. Phys. 132, 074301 (2010)"
doi = "10.1063/1.3315418"
library = "Kumar_2010_DipoleOscillatorStrength"
identity = "VALIDATED"
kind = "compilation"
technique = """Constrained dipole oscillator strength distributions (the Meath method): \
theoretical and experimental photoabsorption and dipole (e,e) oscillator-strength data \
(Refs. 50-61: Chan et al. 1992 for Ne and for Ar/Kr/Xe, Henke et al. 1993, Samson and \
Stolte 2002, Suzuki and Saito 2002-2005, Chantler, ...) divided into energy intervals, \
each scaled by (1 + a_i) so that the distribution satisfies the Kuhn-Reiche-Thomas sum \
rule S_0 = N and experimental refractivities at two well-separated wavelengths \
(Refs. 62, 63, 79-82); the adopted DOSD has the smallest spread s of the a_i (Eq. (5)) \
among 29, 39, 24 and 21 initial distributions. New here: the high-energy tail is a \
[1/1] Pade form (Eq. (9)) of the asymptotic expansion df/dE = A E^-7/2 + beta E^-4 + \
... with A = 2 sqrt(2) Z S_2/pi and beta = -2 Z^2 S_2 (Eqs. (6)-(8), Struensee), \
iterated with the constraint procedure until S_2 converges (10-15 iterations), used \
above 100 keV instead of the Stobbe formula (pp. 074301-2 to -3)."""
notes = """Dipole sums S_k = sum f_i E_i^k + integral (df/dE) E^k dE in atomic units (Eq. \
(1)); S_-2 is the static polarizability and S_-2k (k >= 2) are the Cauchy coefficients of \
alpha(omega) (Eq. (4)); S_0 = N by construction. Table I caption: 'the numbers in \
parentheses are powers of ten. The estimated uncertainties are +-3% for k=2, +-2% for \
k=1, +-1% for 0 > k >= -6 and 3% for -7 >= k >= -10' (no confidence level). The text \
(p. 074301-5) says '1%-2% for 0 > k > -6' and that more than 75 % of S_k for k <= -6 comes \
from the discrete transitions, which limits their accuracy.

Refractivity constraints: 'values of the refractivity at two well-separated \
wavelengths, taken from experimental measurements' Refs. 62, 63 (U. Hohm, Mol. Phys. 81, \
157 (1994); U. Hohm and U. Trumper, Mol. Phys. 89, 943 (1996)) and 79-82 (Cuthbertson \
and Cuthbertson 1932; Coulon et al. 1981; Smith et al. 1976; Bideau-Mehu et al. 1981), \
p. 074301-3. Which wavelengths and values were used for which gas is given only in \
the supplementary material (Ref. 84), curated as kumar_2010_supplement; S_-2 is 'identical \
to the earlier DOSD values of Kumar and Meath primarily because the refractivity \
constraints we used are so similar' (p. 074301-4). The S_k (k < 0) are therefore not \
independent of those refractivity data (cuthbertson_1932, smith_1976, \
bideau_mehu_1981, and Coulon's and Hohm's, not in the library): fitting both double \
counts part of the information.

Pseudo-spectrum: the ten-term pseudospectra {f_i, epsilon_i} reproducing S_k for 2 >= \
k >= -17 (p. 074301-5 to -6) are in the supplementary material only (with the \
integrated DOS of the adopted distributions): recorded as formulas in \
kumar_2010_supplement.

Text values extracted (p. 074301-5): the polarizabilities recommended in Thakkar and \
Lupinetti's (2006) review, experimental (dielectric constants) and theoretical; the \
earlier DOSD and current S_-2 'given their +-1% uncertainties, are in good agreement'. \
Neon's recommended experimental 2.6669(8) (Huot and Bose 1991) is 0.2 % above Gaiser and \
Fellmuth's DCGT value (gaiser_2010), far outside both uncertainties.

Tables II-IV compare S_2, S_1, S_-1 with other work; their constrained-DOSD rows repeat \
Table I and kumar_1985's Table 12 (identical, checked) and are not extracted again. \
Not extracted: Table V (mean excitation energies I_k, no quantity), Tables VI and VII \
(C6 and C9 dispersion coefficients). The comparison with Pawlowski et al.'s CC3 Cauchy \
moments, Bulanin and Kislyakov's and Olney et al.'s (Fig. 2) is graphical only."""

