technique = """A self-consistent set of optical constants from 1e-3 to 1e6 eV for Mg, Al, \
Cu, Ag, Au, Bi, C and Al2O3, built by Kramers-Kronig analysis of the authors' \
transmittance measurements combined with the literature. The authors' measurements: \
transmittance of thin films between 13 and 150 eV with the DESY synchrotron, a \
fixed-exit-slit grazing-incidence monochromator and a two-beam optical densitometer; \
films vacuum-evaporated (~5e-7 torr), from under 100 A to 600 A thick, protected against \
oxidation by 50 A of carbon evaporated in situ on both sides; thickness by an \
oscillating-quartz monitor, accurate to <= +-10 A (p. 742). Outside 15-150 eV the data \
are other authors' (reflectance in the infrared, visible and near UV; absorption in the \
x-ray region from Hubbell). One of three procedures per substance: (1) Kramers-Kronig \
analysis of the absorption spectrum where mu could be determined from transmittance; \
(2) where only reflectance was available (infrared to near UV), the reflection phase by \
Kramers-Kronig, combined with the vuv and x-ray absorption into a complete absorption \
spectrum; (3) for Au and Ag, whose reflectance is large between 20 and 50 eV, a complete \
transmittance spectrum and the Kramers-Kronig phase of the transmitted beam (after \
Nilsson) (p. 742)."""
notes = """Journal pages 742-744 = PDF pages 1-3. Identity checked against the first page \
(the library flags warnings on the bibliographic record only). Nothing is extracted: \
this Letter prints the optical constants only as figures, and its numerical tables are \
in the DESY report.

THE TABLES ARE IN DESY REPORT SR-74/7, NOW THE SOURCE hagemann_1974. 'A comprehensive \
publication of our results [Ref. 1] is available from the Deutsches Elektronen-Synchrotron \
DESY. That report contains numerical tables and graphs of the optical functions of the \
eight substances investigated: reflectivity R, absorption coefficient mu, energy loss \
-Im epsilon^-1, refractive index n + ik, dielectric constant epsilon_1 + i epsilon_2, \
and the numerical evaluation of five sum rules' (p. 742). Ref. 1: H.-J. Hagemann, W. \
Gudat and C. Kunz, DESY SR-74/7 (Hamburg, 1974), in the library since 2026-09-28 and \
recorded as hagemann_1974: its Tables 2-6 and 9 (Al, Cu, Ag, Au in two versions, \
amorphous Al2O3) are extracted there, with the data behind each energy range ('the \
origin or the analysis of the data finally chosen [and] the way of combining them', p. \
742) in that record's notes. This Letter holds no numbers of its own beyond Table I, \
which reproduces the report's Table 10 (below). solprop cites this work for Ag below \
0.017 um and above 24.8 um, and for Al below 0.138 um, through the refractiveindex.info \
Ag/Hagemann and Al/Hagemann pages (their data from the DESY report, i.e. hagemann_1974).

WHAT THE LETTER SAYS OF THE RANGES. The 15-150 eV data 'originate from the present \
measurements, except for carbon' (glassy-carbon data of Williams and Arakawa used \
instead of the authors' evaporated carbon) (p. 743). Figs. 1-8 show the final \
absorption coefficient mu against photon energy for each substance with literature data \
for comparison (Al, Fig. 2: Gahwiller and Brown, Fomichev and Lukirskii, Haensel et al.; \
Cu, Fig. 3, and Ag, Fig. 4: Haensel et al.; Au, Fig. 5: Jaegle and Missoni, Haensel et \
al., Lukirskii et al.). 'Quite generally, our results give the highest absorption \
coefficients in the energy region below 100 eV. We feel that high values are more \
reliable because most systematic errors, such as from stray light and from higher \
orders, tend to diminish the apparent absorption coefficient' (pp. 743-744). No \
uncertainty is given for the optical constants.

TABLE I (tbl_bad4ffdcb6dd, p. 742; image checked): the sum-rule evaluation. Columns: n_0 \
(conduction electrons), Delta n_cond (integral of omega epsilon_2 to the first core \
onset), Delta n_K (integral of mu above the K onset), Z, and n_eff from epsilon_2, from mu \
and from Im(-1/epsilon), each with its deviation from Z. Mg: 2, 2.2, 1.3, 12; 12.2 (+1.7 \
%), 12.6 (+5 %), 12.6 (+5 %). Al: 3, 2.8, 1.5, 13; 13.4 (+3 %), 13.6 (+4.5 %), 13.6 (+4.5 %). \
Cu: 1, 0.6, 1.2, 29; 27.6 (-5 %) in all three. Ag: 1, 0.9, 1.3, 47; 47.5 (+1 %), 47.7 \
(+1.5 %), 47.6 (+1.3 %). Au: 1, 0.9, 1.3, 79; 78.9 (-0.1 %), 79.0 (0 %), 79.0 (0 %). Bi: \
-, -, 1.25, 83; 82.3 (-1 %) in all three. C: -, -, 2.0, 6; 6.1 (+1.7 %), 6.1 (+1.7 %), 6.2 \
(+3.3 %). Al2O3: Z = 50; 50.6 (+1.2 %), 50.3 (+0.6 %), 50.2 (+0.4 %). n_eff has no \
quantity: notes only. Reproduced from the report: every entry equals the report's Table \
10 (hagemann_1974, printed on the back of its errata sheet, PDF p. 3; compared value \
for value, 2026-09-28). The sum rules for mu, (n - 1) and (n - 1) against energy 'was \
found to approach zero for all eight substances' (p. 744).

MATERIALS. Mg, Bi and C (and Al2O3, registered as sapphire and as amorphous alumina, of \
which the paper does not say which it measured) have no data here and are not \
registered for this record."""
