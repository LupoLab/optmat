citation = "J. K. Wahlstrand, S. Zahedpour and H. M. Milchberg, \"Optimizing the time resolution of supercontinuum spectral interferometry\", J. Opt. Soc. Am. B 33, 1476 (2016)"
doi = "10.1364/josab.33.001476"
library = "Wahlstrand_2016_OptimizingTimeResolution"
identity = "VALIDATED_WITH_WARNINGS"
kind = "theory"
technique = """Analysis of single-shot supercontinuum spectral interferometry (SSSI): an \
analytical (stationary-phase) model of the spectral phase and amplitude modulation of a \
chirped supercontinuum probe by a weak transient phase perturbation (Eqs. 1-6), \
numerical simulations, and a multishot delay-scan method for measuring the probe's \
spectral phase in situ, demonstrated in argon (50 fs pump, about 60 TW/cm^2, below \
ionization; supercontinuum from filamentation of a 40 fs pulse in 2.7 atm Xe), with the \
setup of the group's earlier n2 measurements."""
notes = """NOTES-ONLY RECORD: nothing is extracted. This is a methods paper on the time \
resolution of SSSI, not a calibration or measurement of the nonlinear index. It prints \
no n2 of any gas, no gas density and no absolute scale. What it contains:
- Eqs. (7)-(8): the spectral-resolution conditions |beta_2 Delta omega| < tau_r/2 and \
|beta_2/tau_r| < tau_w/(4 pi) (tau_r the probe-reference delay, tau_w the duration of \
the phase transient), and the allowed error in the probe's spectral-phase \
coefficients, Delta beta_n < (tau_w/pi)^n (e.g. 10 fs^2 in beta_2 and 32 fs^3 in beta_3 \
for a 10 fs transient) (Section 5).
- Simulations (Figs. 1-2, 5-6) with an assumed n2 = 10^-19 cm^2/W, 'for the Kerr \
co-efficient', a peak pump intensity of 8 x 10^13 W/cm^2 and L_eff = 0.4 mm, 'all \
typical parameters in our experiments [3]': an assumed model input, not a measurement \
of any gas, and not stored (it would be an assumed value of no stated gas).
- The argon demonstration (Fig. 3) yields the probe's dispersion coefficients (beta_2 = \
1956 fs^2, beta_3 = 386 fs^3, beta_4 = 168 fs^4), properties of that probe beam, not of \
argon.
The n2 values of the same group are recorded from their own papers (wahlstrand_2012, \
wahlstrand_2012b, zahedpour_2015 and others). The library's validation reports unmapped \
glyphs on p. 2 (in the definition of the pump intensity I(t), not a number) and \
informational figure-grouping findings."""
