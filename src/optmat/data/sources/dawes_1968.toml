[[formulas]]
id = "eq9_He"
material = "He"
equation = "Eq. (9), p. 48, with Table I's N_0 and nu_0"
printed = "alpha_zzzz(3nu) = N_0 e^4 / (16 pi^4 m^2 h) (nu_0^2 + 6 nu^2) / [nu_0 (nu_0^2 - 9 nu^2) (nu_0^2 - 4 nu^2) (nu_0^2 - nu^2)]"
variable = "nu: the fundamental frequency in Hz (cycles per second); Gaussian units (e, m, h in cgs); result in esu per atom, New and Ward's convention (gamma_T/6)"
range = "Below the first resonance nu_0/3; evaluated by the paper at 6943 A only"
coefficients = { N_0 = "1.224", nu_0_1e15_cps = "6.19" }
check = "With nu = c/6943 A and CODATA e, m, h (Gaussian), Eq. (9) gives 0.923 x 10^-39 esu against Table I's 0.9 (computed 2026-09-26; He-Kr within 2.5 %, Xe 1.7 % low: the printed values are rounded, and no single correction is implied)."
notes = "Process: THG, gamma(-3w; w, w, w), electronic. N_0 and nu_0 are Cuthbertson's (1932) refractive-index fit parameters (reproduced in Table I), not fitted to nonlinear data. Dawes notes the same procedure could give the dc and Kerr coefficients (p. 48)."

