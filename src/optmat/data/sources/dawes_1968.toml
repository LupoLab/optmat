citation = "E. L. Dawes, Phys. Rev. 169, 47 (1968)"
doi = "10.1103/physrev.169.47"
library = "Dawes_1968_OpticalThirdHarmonic"
identity = "VALIDATED_WITH_WARNINGS"
kind = "theory"
technique = """One-term (average-energy) estimate of the third-harmonic coefficient \
alpha_zzzz(3nu) of the rare gases at 6943 A: Armstrong et al.'s sum over states with \
every excitation replaced by one average frequency nu_0 and the sums reduced with the \
Thomas-Reiche-Kuhn rule, the effective electron number N_0 and nu_0 taken from \
Cuthbertson's fits to refractive-index data."""
notes = """Definition (p. 47): Eq. (3), alpha_zzzz(3nu) = (e^4/h^3) sum nu_ig Z_gi Z_ij \
Z_jk Z_kg A_ijk, 'our Eq. (3) is their [Armstrong, Bloembergen, Ducuing and Pershan, \
Phys. Rev. 127, 1918 (1962)] Eq. (2.22), except for a factor of 1/4 which has been \
removed as per Ref. 1' (New and Ward 1967): the same coefficient as New and Ward's, \
i.e. Ward and New's chi = gamma_T/6 (see ward_1969), in esu per atom. Lehmeier et al. \
1985 divide these values by 4 (their Table 2 column (g)); Ward and New 1969 normalise \
them to He = 4.0.

Result (Eq. (9), p. 48): alpha_zzzz(3nu) ~ N_0 e^4 / (16 pi^4 m^2 h) (nu_0^2 + 6 nu^2) / \
[nu_0 (nu_0^2 - 9 nu^2)(nu_0^2 - 4 nu^2)(nu_0^2 - nu^2)], recorded as formulas below. \
Table I's N_0 and nu_0 are reproduced from C. and M. Cuthbertson, Proc. Roy. Soc. \
(London) 135A, 40 (1932), whose fit is of the linear polarizability, Eq. (2), \
alpha^L = N_0 e^2 / (4 pi^2 m (nu_0^2 - nu^2)); not extracted as data. Columns (C) and \
(D) are New and Ward's (1967) two sets of experimental ratios as ranges (not \
extracted). Table I's caption prints the unit as '10^39 esu/atom', a misprint for \
10^-39 (abstract: 0.9 x 10^-39 esu/atom for He). No uncertainty is given; Ward and New \
1969 find the helium value a factor 4 below Sitz and Yaris's. Electronic, static \
atoms; nu (the fundamental) is the ruby 6943 A (printed)."""


[[datasets]]
id = "alpha_3nu_He"
material = "He"
file = "He/dawes_1968__alpha_3nu_He.csv"
table = "tbl_f296ada000f8"
quantity = "hyperpolarizability"
unit = "esu"
scale = 1e-39
abscissa_unit = "nm"
use = "primary"
notes = "Table I (p. 48), column (A): alpha_zzzz(3nu) calculated by Eq. (9) at 6943 A, 10^-39 esu/atom, New and Ward's convention (= gamma_T/6). A crude one-term model: see the source notes."
[datasets.parameters]
process = "thg"
convention = "ward_1969"
part = "electronic"

