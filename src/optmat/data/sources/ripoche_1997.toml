quantity = "rotational_constant"
unit = "cm-1"
abscissa = "label"
use = "reproduced"
reproduced_from = ["lin_1976"]
notes = "Table 1 (p. 313), N2: B = 2.0 cm-1, from Ref. [13] (lin_1976's 2.001, which cites Herzberg), rounded. The vibrational state is not stated; used in Eqs. (17)-(18) as the ground-state rotational constant with no distortion term."
[datasets.parameters]
