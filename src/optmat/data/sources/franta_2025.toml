[[formulas]]
id = "profile_function"
material = "Ta2O5"
equation = "Eqs. (3)-(4), pp. 906-907; values p. 911"
printed = "p(z) = \\sum_{i=1}^{N_p - 1} [erf((z - h_i)/w_i) - erf(-h_i/w_i)]/[1 - erf(-h_i/w_i)]"
variable = "z: distance from the bottom interface (nm); N_p = 3 phases"
coefficients = { h1 = "16.0", h1_sigma = "0.4", w1 = "1.0", w1_sigma = "0.2", h2 = "206", h2_sigma = "2", w2 = "30", w2_sigma = "2" }
check = "Values in concise notation as printed (16.0(4) etc.); no printed quantity to reproduce from them alone (the phase parameters are in Supplement 1)."
notes = "Each dispersion parameter p_j(z) = p_j^a [1 - p] + p_j^b p for p in [0, 1], p_j^b [2 - p] + p_j^c [p - 1] for p in [1, 2] (Eq. (4)). Structural, not optical; recorded because the IHL optical constants depend on it."
