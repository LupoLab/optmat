citation = "M. Puchalski, K. Piszczatowski, J. Komasa, B. Jeziorski and K. Szalewicz, \"Theoretical determination of the polarizability dispersion and the refractive index of helium\", Phys. Rev. A 93, 032515 (2016)"
doi = "10.1103/PhysRevA.93.032515"
library = "Puchalski_2016_TheoreticalDeterminationPolarizability"
identity = "VALIDATED"
kind = "theory"
technique = """Ab initio dynamic dipole polarizability of the helium atom as the power series \
alpha(omega) = alpha_0 + alpha_2 omega^2 + alpha_4 omega^4 + ... (Eq. 2), \
alpha_k = 2 <psi| z R^(k+1) z |psi> (Eq. 10), with explicitly correlated Slater-geminal \
bases (600-term fully optimized and 800-term stochastically optimized, independent \
codes). Nonrelativistic coefficients with the finite nuclear mass of 4He included \
exactly; relativistic (Breit-Pauli, 1/c^2) corrections for the infinite nuclear mass \
and the relativistic recoil 1/(M c^2) for k = 0, 2; QED 1/c^3 corrections (the static \
one complete, the dispersion ones in the Pachucki-Sapirstein approximation, 10 % \
uncertainty), the one-loop 1/c^4 term and the finite nuclear size for the static value \
(pp. 3-10). Comparison with experiment and a first-principles virial expansion of n \
(pp. 10-13)."""
notes = """Units and states (pp. 2-3, 7): atomic units a0^3 for the polarizability and \
t0 = hbar^3/(m_e e^4) for time, 'we never use the reduced units in the present work'; \
M = m_alpha/m_e = 7294.2995361, c = 137.0359991. alpha_k^(0) (Table II) are for 4He \
with the nuclear mass included exactly (nonrelativistic Hamiltonian with the \
mass-polarization term, Eq. 12); alpha_k^(20) (Tables III, IV, VIII) and alpha_k^(30) \
(Table VIII) are for infinite nuclear mass; alpha_k^(21) (Table IV) are the 4He \
recoil corrections of order 1/(M c^2). The totals of Table VII (static and at 6329.908 \
A) are for 4He with all of these. Wavelengths are vacuum wavelengths: lambda = f/omega \
with f = 5e7/R_inf (cm^-1) = 455.633525275 (lambda in A, omega in 1/t0), p. 2.

Uncertainties: basis-set ones are half the difference of the two largest SO bases \
('very conservative', p. 7); the static total's 0.14 u a0^3 (0.1 ppm) is dominated by \
a 25 % allowance on the one-loop 1/c^4 term (p. 3); the dispersion QED terms carry 10 \
%. The level is not stated (estimates). The static and the 6329.908 A totals share the \
0.14 u a0^3 uncertainty (fully correlated).

Recommended alpha(omega) (not printed as one series; see the formula 'recommended'): \
the static total of Table VII plus sum_k [alpha_k^(0) + alpha_k^(20) + alpha_k^(21) + \
alpha_k^(30)] omega^k for k = 2, 4, 6, plus alpha_k^(0) omega^k for k = 8-14. It \
reproduces Table VII's 1.39181197(14) at 6329.908 A (checked 2026-09-24).

Relativistic and QED components (all in u a0^3 t0^k = 1e-6 a0^3 t0^k): Table IV \
alpha_0^(20) = -80.35991(1), alpha_0^(21) = -0.0935(1), alpha_2^(20) = -33.06576(2), \
alpha_2^(21) = -0.144(1), alpha_4^(20) = 5.05105(5), alpha_6^(20) = 62.8500(5); \
Table VIII totals of the 1/c^3 terms alpha_0^(30) = 30.47381, alpha_2^(30) = \
61.9014, alpha_4^(30) = 116.988, alpha_6^(30) = 216.89, and the one-loop 1/c^4 \
component alpha_0^(40) = 0.563 89, alpha_2^(40) = 1.156 5, alpha_4^(40) = 2.196, \
alpha_6^(40) = 4.08 (only alpha_0^(40) enters the recommended value). Bethe logarithm \
ln k0 = 4.37016022306(2) (Korobov 2012). Bhatia and Drachman's relativistic values \
(Table IV, 'BD', converted from reduced Rydberg units): -80.062, -32.629, 4.814. \
Tables I, III and V (basis-set convergence; Table V is 3He, not a species) are not \
extracted; their largest-basis values are those of Tables II and IV.

Table VII components at 6329.908 A (a0^3): static nonrelativistic 1.3838099864, 1/c^2 \
-0.0000803599, 1/(Mc^2) -0.0000000935(1), 1/c^3 without the field derivative of the \
Bethe logarithm 0.0000304738(1), that derivative's term 0.000000183(1), 1/c^4 \
0.00000056(14), finite nuclear size 0.0000000217(1), total 1.38376077(14); lambda^-2 \
terms 0.007995798, -0.000000171, -0.000000001, 1/c^3 0.00000032(3), total \
0.00799595(3); lambda^-4 0.000054836, 0.0000000001, 0.0000000031(3), total \
0.000054840; lambda^-6 0.000000408; lambda^-8 0.0000000032; alpha(lambda) - alpha_0 = \
0.00805120(3) (Bhatia and Drachman, corrected: 0.008050871; their Eq. 15 as printed: \
0.008052951). The lambda^-10 term is 2.5e-11.

Magnetizability (diamagnetic susceptibility) chi_0 of the helium atom: refractometry \
measures alpha + chi, n = 1 + 2 pi (alpha + chi) rho for the ideal gas (Eq. 1, p. 1; \
a_n = 2 pi (alpha + chi), Eq. 44, and n^2 = eps_r mu_r with the magnetic analogue of \
Clausius-Mossotti, Eq. 40, p. 11). The paper prints (p. 11, checked on the pdf text): \
'The static nonrelativistic value of A_mu is -0.000007922 4(4) cm3/mol, converted from \
chi = -0.000021194(1) a0^3 computed by Bruch and Weinhold [47] with an account of the \
nuclear motion. We assigned the uncertainty assuming that the relativistic corrections \
enter at the fifth significant digit.' So chi_0 = -0.000021194(1) in atomic units \
(a0^3, the Gaussian volume convention of alpha, so that alpha + chi is meaningful), \
reproduced from L. W. Bruch and F. Weinhold, J. Chem. Phys. 117, 3243 (2002); Erratum \
119, 638 (2003) (not in the library); A_mu = 4 pi N_A chi/3 = -0.0000079224(4) cm^3/mol \
= -1.53e-5 A_eps, so a measured helium refractivity is 1.5e-5 below 2 pi alpha rho. \
The frequency dependence of chi is neglected ('negligible for the helium atom', Table X \
note a). No dataset: the format has no quantity for a magnetizability (polarizability \
would be misread). The same chi is printed by piszczatowski_2015 (Table II note b); \
schmidt_2007 uses A_mu = 4 pi chi_0/3 = -0.000 008 03 (17) cm^3/mol (Table I, from \
Bruch and Weinhold 2000). The datasets here are alpha and A_eps only (the package's \
molar refractivity N_A alpha/(3 eps0) is A_eps).

Table X (not extracted: the format has no quantity for a_r = A_eps + A_mu or for the \
virial coefficients of n itself), cm^3/mol, cm^6/mol^2, cm^9/mol^3, lambda in A: \
a_r(0) present 0.51724620(6), expt. [8] (Schmidt et al. 2007) 0.5172455(47); \
a_r(6329.908) present 0.52025577(6), expt. [41,42] 0.5213(1), expt. [43] 0.5220(3); \
b_n(0) present 273.16 K 0.0244(3); b_n(6329.908) present 273.16 K 0.0238(3), 303 K \
0.0184(3), 323 K 0.0150(3), expt. [42] 0.000(15); c_n(0) present 273.16 K -0.96(25). \
Here n = 1 + a_n rho + b_n rho^2 + c_n rho^3 (Eq. 41, rho molar density), a_r = \
(2/3) a_n; the Lorentz-Lorenz second refractivity virial coefficient (the package's \
B_R) is b_r = (2/3) b_n - a_r^2/4 (Eq. 49), e.g. -0.0518 cm^6/mol^2 at 273.16 K and \
6329.908 A (computed here, not printed). b_n and c_n follow from Eqs. (45)-(46) with \
the dielectric virial coefficients b_eps = B_eps/A_eps of Rizzo et al. (J. Chem. Phys. \
117, 2609 (2002)): b_eps(273.16 K) = -0.0978(4) cm^3/mol static, -0.0996(4) at \
6329.908 A, b_eps(303 K) = -0.1065(4), b_eps(323 K) = -0.1108(4) at 6329.908 A (pp. \
12-13), and c_eps = -1.38 cm^6/mol^2 (Heller and Gelbart), uncertainty from Huot and \
Bose's -1.7(9) (p. 13). The static B_eps(273.16 K) is extracted (dataset \
dielectric_virial_rizzo). Also quoted (p. 11): Kirouac and Bose (1976) A_eps = \
0.5210(2), Huot and Bose (1991) 0.5196(2) cm^3/mol, dielectric measurements the \
authors call incompatible with theory; not extracted (low accuracy, originals not in \
the library).

Schmidt et al.'s Eq. (4) lacks a factor 2 in front of the A_eps^2 b rho^2 term (p. 12). \
Bhatia and Drachman's A_k (Phys. Rev. A 58, 4470, Eq. 15) were converted from reduced \
Rydberg units with (1 + m_e/m_alpha)^(2k) instead of (1 + m_e/m_alpha)^k, and their \
lambda^-4 coefficient has a typographical error (Table VI notes c-e); see bhatia_1998. \
The abstract of Ref. [13] (Piszczatowski et al. 2015) misprints alpha(6329.908 A) \
(Table VII note e); see piszczatowski_2015."""

