notes = """The total 4He dispersion coefficients with every correction the paper gives, as the Cauchy moments S(-k-2) = alpha_k in atomic units (a0^3 t0^k): COMPUTED HERE from printed components (2026-09-24), not printed as such. Row -2: the static total of Table VII, 1.38376077(14) (nonrelativistic 4He + 1/c^2 + 1/(M c^2) + 1/c^3 incl. the field derivative of ln k0 + one-loop 1/c^4 + finite nuclear size), its printed uncertainty. Rows -4, -6, -8: alpha_k = alpha_k^(0) (Table II, 4He finite mass) + alpha_k^(20) (Table IV, infinite mass) + alpha_k^(21) (Table IV, 4He recoil, k = 2 only; the paper takes it negligible for k >= 4, p. 5) + alpha_k^(30) (Table VIII 'Total' 1/c^3 rows, infinite mass): alpha_2 = 1.54321081882 + (-33.06576 - 0.144 + 61.9014)e-6 = 1.54323951046; alpha_4 = 2.0426550150 + (5.05105 + 116.988)e-6 = 2.04277705405; alpha_6 = 2.9304069980 + (62.8500 + 216.89)e-6 = 2.9306867380 (exact decimal sums, digits kept; the uncertainty is in the sixth decimal). Their sigmas add in quadrature the printed basis-set uncertainties (Table II: 1e-11, 1e-10, 7e-10; Table IV: 2e-11, 1e-9 (recoil), 5e-11, 5e-10) and 10 % of alpha_k^(30) ('the uncertainties of alpha_k^(30), k = 2, 4, 6 are assumed to be 10 %', p. 10): 6.19e-6, 1.170e-5, 2.169e-5, rounded to 0.0000062, 0.0000117, 0.0000217; the QED term dominates. The one-loop 1/c^4 dispersion components of Table VIII (alpha_2^(40) = 1.1565, alpha_4^(40) = 2.196, alpha_6^(40) = 4.08 u a0^3 t0^k) are, like the paper's recommended value, NOT included and not added to the sigma (each is below 20 % of the stated QED uncertainty). Rows -10 ... -16: the nonrelativistic alpha_8 ... alpha_14 (p. 7; 4.39500532(1), 6.7725956(1), 10.622083(1), 16.86118(1)), uncorrected; their sigma adds to the printed last-digit uncertainty the size of the omitted relativistic + QED correction estimated from the lower orders: the relative total correction r_k = (alpha_k^(20) + alpha_k^(21) + alpha_k^(30))/alpha_k^(0) is 1.86e-5, 5.97e-5 and 9.55e-5 for k = 2, 4, 6, extrapolated linearly in k from k = 4, 6 to 1.31e-4, 1.67e-4, 2.03e-4, 2.38e-4 for k = 8-14, times alpha_k^(0): 5.8e-4, 1.13e-3, 2.15e-3, 4.02e-3, rounded to 0.00058, 0.0011, 0.0022, 0.0040. These corrections are positive for k = 2-6, so the four uncorrected higher moments are probably low by about their sigma (a bias, not only a spread). Check: with omega = 455.633525275/6329.908 the series of these eight moments gives alpha(6329.908 A) = 1.391811967, Table VII's 1.39181197(14). Correlations: all rows share the static-to-dispersion QED model; row -2's 0.14 u is the 1/c^4 allowance, independent of the others."""
