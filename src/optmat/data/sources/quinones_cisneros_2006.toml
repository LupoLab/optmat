citation = "S. E. Quiñones-Cisneros and U. K. Deiters, \"Generalization of the Friction Theory for Viscosity Modeling\", J. Phys. Chem. B 110, 12820 (2006)"
doi = "10.1021/jp0618577"
library = "QuinonesCisneros_2006_GeneralizationFrictionTheory"
identity = "VALIDATED"
kind = "fit"
technique = """The friction theory of viscosity extended to any equation of state, with \
models for the light alkanes, HFC-134a, carbon dioxide and water. The dilute-gas term \
is an empirical function of the reduced temperature, regressed against low-pressure \
viscosity data together with a linear friction term for the initial-density \
contribution (section 4.1)."""
notes = """Identity VALIDATED by the library. Printed pp. 12820-12834; p. = pdf page + \
12819.

THE DILUTE-GAS VISCOSITY (section 4.1, Eq. 24 and Table 1, p. 12824): eta0 = d0 + d1 \
Tr^0.25 + d2 Tr^0.5 + d3 Tr^0.75, in mPa s, Tr = T/T_c; methane d0 = 0.00260536, d1 = \
-0.0185247, d2 = 0.0234216, d3 = 0. The paper does not print methane's T_c; CoolProp \
uses 190.564 K, Setzmann and Wagner's (setzmann_1991).

RANGE AND UNCERTAINTY (Table 1): for methane the regression covers 95-600 K with an \
absolute average deviation of 0.31 %. No uncertainty is stated. optmat takes 95-600 K.

REPRODUCED: CoolProp 8.0.0's methane viscosity (reference key \
QuinonesCisneros-JPCB-2006) at 1e-6 mol/m^3 equals Eq. (24) with T_c = 190.564 K to \
1.1e-10, 120-500 K (computed 2026-09-30)."""

