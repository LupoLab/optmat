technique = """A one-dimensional semi-analytic model of high-harmonic generation \
efficiency (three-step model with dynamic ionisation per half-cycle, Eqs. (2)-(5)), run \
with the ADK or the Yudin-Ivanov (yudin_2001) ionisation rate, compared with the HHG \
spectra and efficiencies measured at 400 and 800 nm by Falcão-Filho et al. (2010) in \
Ar, Ne and He (pp. 1-3)."""
notes = """Pages are pdf pages (1-6 = 013427-1 to -6). Identity checked against pdf p. \
1; 'mulitphoton' is the published spelling of the title. UNMAPPED_GLYPHS on p. 2 (Omega \
in the harmonic frequency).

WHY NOTHING IS TAKEN. The measured and computed quantities are harmonic spectra and \
conversion efficiencies, not ionisation rates or yields; the ionisation rates \
themselves appear only as Figs. 4(a) (p. 3) and 5(a) (p. 4) (He, YI against ADK rate against \
time, at 400 nm, 8.5 x 10^14 W/cm^2, gamma ~ 1, and at 800 nm, 7.4 x 10^14 W/cm^2, gamma = 0.52; \
text p. 5). The paper prints no rate formula of its own and does not say which YI prefactor \
it used. No table.

EXPERIMENT MODELLED (Falcão-Filho et al., Appl. Phys. Lett. 97, 061107 (2010), ref. [6], \
not in the library): 400 nm, 1 mJ, 26 fs, 30 um waist; 800 nm, 35 fs, 40 um waist (Ar \
0.6 mJ, Ne 2 mJ, He 2 mJ); 2 mm nozzle, Ar 50 mbar, Ne 300 mbar, He 2 bar (p. 2). \
Simulation intensities (optimised for phase matching, below the experiment's): 400 nm, \
Ar 2.5, Ne 5.3, He 8.5 x 10^14 W/cm^2; 800 nm, Ar 1.2, Ne 3.2, He 7.4 x 10^14 W/cm^2 \
(Figs. 1-2). Efficiencies (p. 3): 400 nm measured peaks 1e-4 at 28 eV (Ar), 1e-5 at 34 eV \
(Ne), 1e-5 at 53 eV (He); simulated 6e-5 (33.5 eV), 2e-5 (51.7 eV), 4e-5 (66.5 eV); 800 \
nm measured at the cutoff 1e-7 at 45 eV (Ar), 1e-7 at 88 eV (Ne), 1e-8 at 110 eV (He), \
simulated 1e-6 (41 eV), 1e-7 (82 eV), 1e-8 (107 eV). The measured 400 nm peak intensity \
was 2.7 x 10^15 W/cm^2 at 1 mJ (p. 2). None is an optmat quantity."""
