citation = "V.-M. Gkortsas, S. Bhardwaj, C.-J. Lai, K.-H. Hong, E. L. Falcão-Filho and F. X. Kärtner, \"Interplay of mulitphoton and tunneling ionization in short-wavelength-driven high-order harmonic generation\", Phys. Rev. A 84, 013427 (2011)"
