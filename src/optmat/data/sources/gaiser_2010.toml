abscissa_unit = "nm"
use = "check"
notes = "Table 2 'Weighted mean', alpha_0 = 2.66110 a.u.: the same measurement as molar_polarizability converted with CODATA 2006 (reproduces, source notes); a check. Reproduced as 2.66110(3) by Lesiuk et al. 2020 and Wang et al. 2021."
[datasets.uncertainty]
relative = 10.6e-6
level = "1 sigma"

