citation = "J. Lang, G. Garberoglio, M. Przybytek and M. Lesiuk, \"Determination of fundamental properties of nitrogen from first principles. III. Temperature and frequency dependence of the molecular polarizability and magnetic susceptibility\", arXiv:2607.21261v2 [physics.chem-ph] (2026)"
doi = "10.48550/arxiv.2607.21261"
library = "Lang_2026_DeterminationFundamentalProperties"
identity = "VALIDATED"
kind = "theory"
technique = """Ab initio isotropic static polarizability alpha_0(R), Cauchy coefficients \
alpha_2(R), alpha_4(R), alpha_6(R) (alpha(omega, R) = alpha_0 + alpha_2 omega^2 + \
alpha_4 omega^4 + alpha_6 omega^6, Eq. (2)) and isotropic magnetic susceptibility \
chi_0(R) of 14N2 (X 1Sigma_g+) on a grid of internuclear distances R = 1.75-2.60 bohr. \
Polarizability: composite coupled-cluster scheme, Eq. (32): frozen-core CCSD (with the \
Hartree-Fock part; aug-cc-pVXZ to X = 7) + CC3 (X = 6) + full CCSDT (X = 4) + CCSDTQ \
(aug-cc-pVDZ, 50 % uncertainty) + all-electron CC3 (aug-cc-pCVXZ, X = 4) and CCSDT (X = \
3) core corrections + one-electron scalar relativistic (DKH2, all-electron CCSD, X = 4); \
Riemann extrapolation to the basis-set limit with random-walk uncertainty; alpha_6 at \
CCSD + CC3 only (flat 10 % uncertainty). QED, diagonal Born-Oppenheimer and \
two-electron relativistic terms neglected (p. 7). The Cauchy coefficients of the \
post-CC3 terms by fitting a 27-frequency grid (p. 7). Magnetic susceptibility: \
diamagnetic plus paramagnetic (Van Vleck) terms, Eq. (40), frozen-core CC3 response \
with aug-cc-pV5Z (gauge origin at the molecular centre; 5 % uncertainty; no \
relativistic or post-CC3 terms; frequency dependence neglected, pp. 10-11). Thermal \
averages 50-2000 K by rovibrational averaging over 345 levels of the Paper II \
potential with the 14N2 nuclear-spin weights, Eqs. (18)-(22), and independently by path \
integral Monte Carlo (Eqs. (24)-(31)); the two agree within the PIMC statistics \
(p. 13)."""
notes = """The library copy is the arXiv preprint 2607.21261v2 (dated 9 September 2026, \
18 pdf pages); not peer reviewed; no journal reference. Page numbers are the \
preprint's pdf pages. Atomic units throughout: polarizability and magnetic \
susceptibility in a0^3 (the magnetic term enters the Lorentz-Lorenz relation as \
alpha + chi, Eq. (1)), omega in hartree; 1 cm^3/mol = 2.675205 a.u. (p. 2; the \
package's (4 pi/3) N_A a0^3 = 0.3738031 cm^3/mol gives 2.675205), CODATA 2022.

Papers I (the nitrogen atom's polarizability, the same Cauchy expansion) and II (the \
N2 ground-state potential, its rovibrational levels, D_0 = 9.76 eV) of the series \
are referred to only as 'Paper I' and 'Paper II' (pp. 1, 2, 4-5, 7): the reference \
list does not cite them. Neither is in the library; neither holds a quantity of the \
package for N2 (Paper II's potential enters here only through the averaging). The \
supplementary material (Zenodo, doi 10.5281/zenodo.22662189: alpha_n(T) and chi_0(T) \
on a 1 K grid, the Eq. (52) parameters, the uncertainty fits, the full R grid) is not \
in the library: the temperature dependence exists here only at 303 K (Eq. (53)) and, \
semi-empirically, at 273.16 K (p. 15). Figures 2 and 3 (alpha_n(T), chi_0(T), raster) \
are not digitised: the numbers are published in the supplement (TC-699).

ELECTRIC POLARIZABILITY. The alpha_n here are the electric polarizability alone; the \
refractive (package) polarizability is alpha + chi_0 (Eq. (54)). Every dataset below \
says which it holds.

UNCERTAINTIES. alpha_0, alpha_2, alpha_4 at 303 K: expanded, k = 2 ('evaluated at 2 \
sigma confidence level', p. 14; 'approximately a 95% confidence level', p. 6), \
including the potential's propagated uncertainty. alpha_6 and chi_0 carry flat 10 % \
and 5 % estimates (pp. 9, 11, 13), with no stated level ('extremely unlikely to \
exceed 5%', p. 11, for chi_0).

CHECKS (2026-09-29). Eq. (55) with the Eq. (53) values reproduces the paper's \
theoretical molar polarizabilities 11.743(13) at 1542.383 nm and 11.875(13) at \
632.9908 nm (computed 11.743019, 11.874645). The semi-empirical alpha_0 = 11.735962 \
and alpha_2 = 30.086359 with the theoretical alpha_4, alpha_6, chi_0 reproduce the \
measured 11.762120 and 11.894428 to 1e-6 (computed 11.762119, 11.894427). Eq. (50) with \
Table III reproduces Table I's totals at R = 1.750, 2.070, 2.600 bohr (formula \
alpha_n_of_R); Eq. (51) reproduces Table II's aug-cc-pV5Z diamagnetic + paramagnetic \
sums (formula chi0_of_R). Eq. (53) and the p. 15 values checked on the pdf text.

COMPARISON WITH fit/N2 (computed 2026-09-29; fit/N2 has chi0_au = 0, so its \
polarizability is the refractive one). Ab initio alpha + chi_0 at 303 K is 1606 ppm \
below the fit at the static limit, 1615, 1638 and 1656 ppm below at 1542, 800 and 633 \
nm (2.9-3.0 sigma of the theory's k = 2 uncertainty halved); its GVD (d^2(omega \
alpha)/d omega^2) is 0.54, 0.52, 0.51 % below the fit's at 1550, 800, 633 nm \
(theory sigma 0.13 %: about 4 sigma); S(-4) is 0.55 % below the fit's 30.0938, S(-6) \
0.20 % above its 100.423, S(-8) 2.8 % above its 372.66 (within the 10 %). The \
semi-empirical values (below) agree with the fit to +9.9 ppm (static, with chi_0), \
+9.3 (1542 nm), +8.0 (800 nm), +7.0 ppm (633 nm), and in GVD to -0.02 %; fit/N2 \
rests on data near 293 K, and the theory's temperature coefficient (below) moves the \
303 K values by -11 to -12 ppm to 293 K, leaving the fit 1.5 (1542 nm) to 4.6 ppm \
(633 nm) above them.

TEMPERATURE COEFFICIENT (computed from the two semi-empirical static values, p. 15): \
(11.735962 - 11.735585)/29.84 K = 1.263e-5 a.u./K = 1.077e-6 per K of alpha_0 = \
47.2e-7 (cm^3/mol)/K, 273.16-303 K; egan_2019 lists Buldakov et al. 48(1)e-7 \
(optical, theory), Sharipov et al. 51e-7 (static, theory), Schmidt and Moldover \
62(11)e-7 (static); Egan and Yang (2023, Int. J. Thermophys. 44, 181, p. 17; in the \
library, not curated) measure A_theta = 1.18(4)e-6 per K at 632.9908 nm over 293-433 \
K. N2's first refractivity coefficient changes by about 30 ppm between 273 and 303 K, \
four times its pair term at 1 atm (Achtermann's B_R rho/A_R = 8e-6).

MAGNETIC SUSCEPTIBILITY. chi_0(303 K) = -1.75(9) x 10^-4 a.u. (Eq. (53)), \
diamagnetic -3.46 x 10^-4 and paramagnetic +1.70 x 10^-4 at R = 2.07 bohr (Table II): \
the paramagnetic term 'is substantial and cannot be omitted' (p. 15). -14.9 ppm of \
alpha_0. The four measurements the paper quotes (datasets below) are 5-31 % smaller in \
magnitude; the authors 'cannot explain the origin of this discrepancy' (p. 15). The \
same measurer's neon agrees with the ab initio neon to 1.1 % and his argon is 6.3 % \
low (lesiuk_2023b, Table X): scaled by argon's 6.3 %, Havens' N2 would still be 18 % \
below this theory. The centre-of-mass coupling (Eq. (49)) and the frequency dependence \
of chi (below 1 %, p. 11) are negligible. The conclusions (p. 16) speak of 'the single \
experimental result'; p. 15 quotes four.

Also in the text (p. 15): Egan and Yang's own static value 11.735909 a.u. (the \
yang_2025 A_eps_N2, 4.38692 cm^3/mol, with older alpha_4, alpha_6, chi_0) and \
'Egan and collaborators' alpha_2 30.109 a.u. (yang_2025's n2_cauchy, S(-4) = \
30.1086): not extracted (in yang_2025). The kinetic-energy correction to Eq. (10), \
about -2 x 10^-4 a.u. for v = J = 0 from the b 1Pi_u state alone (p. 4), is \
neglected by the paper.

Byproduct (computed, not printed): Eq. (50) gives d alpha_0/dR = 5.98 a0^2 at R = \
2.07 bohr (1.675 angstrom^2), the derivative of the mean polarizability with the \
bond length; murphy_1969's reproduced N2 d alpha/dr is 1.75 angstrom^2 (4 % higher).

Not extracted: Table I's components by R (not a quantity: a polarizability at fixed \
R is not the molecule's), Table II's basis-set sequence (its X = 5 sums are the \
check of chi0_of_R), Fig. 1 (the partition-function exchange ratio)."""

