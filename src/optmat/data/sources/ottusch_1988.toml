citation = "J. J. Ottusch and D. A. Rockwell, \"Measurement of Raman gain coefficients of hydrogen, deuterium, and methane\", IEEE J. Quantum Electron. 24, 2076 (1988)"
doi = "10.1109/3.8545"
library = "Ottusch_1988_MeasurementRamanGain"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Small-signal steady-state Raman gain at a 532 nm pump (frequency-doubled \
single-mode phase-conjugate Nd:YAG, 35 ns FWHM): a backward-Raman oscillator \
generates the Stokes seed, which is amplified with the pump in an 18.5 cm amplifier \
cell holding the same gas at the same pressure; calorimeters on the pump, the input and \
the amplified seed; the gain from the slope of E_S/E_S0 against E_P with the measured \
area and time overlap integrals, Eqs. (1)-(3) (pp. 2076-2078). Also the gain against \
the amplifier density with the oscillator fixed at 61 amagat (Fig. 5)."""
notes = """Journal pages 2076-2080 = PDF pages 1-5 (page n of the PDF is p. 2075 + n). \
Identity checked on the first page.

DUPLICATE COPY: the library's Ottusch_1988_MeasurementRamanGain_ec9131 is the same \
article from a different PDF file (sha256 ec91313e... against 86cd3d06...): the text \
is identical but for metadata and a footnote's position, Table II's cells are \
identical, and Table I (its tbl_fb338ba08905) differs only by a misread 'D_3 Q(2)' for \
'D_2 Q(2)'. Not extracted twice (compared 2026-09-26).

TABLE I (p. 2077), 'Spectroscopic parameters used in Raman gain calculation' (all taken \
from others): Stokes wavelength 683 (H2 Q(1)), 633 (D2 Q(2)), 630 nm (CH4 nu1); Delta N \
0.66 N_TOT, 0.38 N_TOT, N_TOT; the linewidth laws (footnote a: 'FWHM, rho in amagats'), \
in MHz: H2 309/rho + 51.8 rho [12], D2 101/rho + 120 rho [16], [17], CH4 8220 + 384 rho \
[13] (the formulas linewidth_H2, linewidth_D2, linewidth_CH4); dsigma/dOmega (cm^2 \
sr^-1) 0.81e-30, 0.79e-30, 2.7e-30 [18] (Bischel and Black 1983), the datasets dsigma_*. \
'The values we use for Delta N, Delta nu, and dsigma/dOmega are essentially the same as \
those used by Hanna et al. [14] (hanna_1986), with the exception that more recently \
measured expressions for Delta nu have been used for CH4 and D2' (p. 2077). The H2 law is \
cited to [12] = Bischel and Dyer, J. Opt. Soc. Am. B 3, 677 (1986) (bischel_1986b, Eq. 8 \
at 298 K), itself reproducing Bischel and Dyer, Phys. Rev. A 33, 3113 (1986) (bischel_1986).

LINEWIDTH LAWS (for review and solprop): FWHM, in MHz, rho in amagat (Table I footnote \
a, image checked). The 1/rho terms are the Dicke-narrowing terms (H2, D2), in MHz amagat; \
the CH4 constant 8220 MHz is the width of the unresolved Q branch at zero density, not a \
collision width. Temperature not stated (room temperature).

TABLE II (p. 2079), 'Comparison of calculated and measured Raman gain coefficients at \
lambda_P = 532 nm', cm/GW: H2 Q(1) at 60 amagat: calculated 2.86, this work 2.64 +- \
0.20, previous 2.5 +- 0.4 (bischel_1986b); D2 Q(2) at 60 amagat: 0.55, 0.45 +- 0.05; \
CH4 nu1 at 115 amagat: 1.28, 1.26 +- 0.10, previous 1.2 (Lopert, Ph.D. dissertation, \
Univ. California, Davis, 1983). 'The uncertainties result mainly from imperfect \
shot-to-shot repeatability of the IR source and are estimated from the scatter in the \
values of the gain slope produced by several independent measurements' (p. 2078): level \
not stated. 'The measured Raman gain coefficients listed in Table II are uncorrected for \
the small, but finite, spectral bandwidth of the seed beam ... we judge the possible \
underestimation of the true Raman gain to be no more than 8 percent for H2, 4 percent for \
D2, and 6 percent for CH4' (p. 2079). The D2 gain 'is lower by more than a factor of 2 \
than the corresponding value reported by Hanna et al.', who claim a factor-of-two \
accuracy (pp. 2078-2079). The previous-work column is a reproduction (use = \
"reproduced"); the calculated column Eq. (4) (use = "check").

THE STATE of a gain (the quantity requires one): the gains are at the printed density \
(amagat, the abscissa); the measurement temperature is not stated (room temperature). \
The state is recorded as { 60 (or 115) atm, 273.15 K }, the ideal-gas state at 0 C with \
that density in amagat, so that it encodes the printed density exactly, not a \
measured pressure (a second curator's decision: a gain against density needs no \
pressure).

REPRODUCTION (2026-09-26): Eq. (4), g = (2 lambda_S^2/h nu_S)(Delta N/pi Delta nu) \
dsigma/dOmega, with Table I's parameters and N_TOT = rho x 2.6868e19 cm^-3 gives 2.827 \
(H2, printed 2.86), 0.546 (D2, 0.55) and 1.276 cm/GW (CH4, 1.28): within 1.2 %.

LINE SHIFTS (Fig. 5 caption, p. 2079; reproduced, formulas shift_H2 and shift_D2): 'for \
H2 nu_A,S - nu(rho = 0) = -96 rho + 0.17 rho^2 [12], [20] and for D2 nu_A,S - nu(rho = \
0) = -50 rho [20] (nu in MHz, rho in amagats)'. Fig. 5 (gain against amplifier density, \
oscillator at 61 amagat) is a figure only.

ISOTOPOLOGUES: natural H2 and D2 (normal: the J = 1 and J = 2 fractions 0.66 and 0.38 of \
Table I are room-temperature populations); 12CH4."""

