unit = "cm2/sr"
scale = 1e-30
abscissa_unit = "nm"
use = "reproduced"
reproduced_from = ["bischel_1983"]
notes = "Table I (p. 2077), dsigma/dOmega of H2 Q(1) used in Eq. (4) at the 532 nm pump, footnote e: [18] Bischel and Black (bischel_1983, re-pointed 2026-09-27). Polarization and definition not restated here. Bischel and Black print no value at 532 nm: their H2 fit (Table 1) gives 8.59e-31 cm2/sr for the Q branch (8.51e-31 with bischel_1986b's R = 0.99 for Q(1)), 6 % above this 0.81e-30."
