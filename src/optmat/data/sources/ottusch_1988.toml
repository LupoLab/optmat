[[formulas]]
id = "linewidth_H2"
material = "H2"
equation = "Table I, p. 2077"
printed = "Delta nu = 309/rho + 51.8 rho (MHz; FWHM, rho in amagats)"
variable = "rho: the density of H2 in amagat"
state = "room temperature (not stated; Bischel and Dyer's 298 K)"
density = "unknown"
range = "not stated (Bischel and Dyer: rho < 100 amagat)"
coefficients = { A_MHz_amagat = "309", B_MHz_per_amagat = "51.8" }
check = "At 60 amagat, 3113 MHz, which with Table I's other parameters reproduces the calculated H2 gain 2.86 cm/GW to 1.2 % (2026-09-26). Identical to bischel_1986b Eq. (8) at T = 298 K."
notes = "The Q(1) FWHM with the Dicke term 309/rho (MHz amagat), reproduced from [12] (bischel_1986b, Eq. 8), originally Bischel and Dyer, Phys. Rev. A 33, 3113 (1986) (bischel_1986). Not solprop's H2 source (solprop takes 309 and 52.2 from bischel_1986 Table I)."

[[formulas]]
id = "linewidth_D2"
material = "D2"
equation = "Table I, p. 2077"
printed = "Delta nu = 101/rho + 120 rho (MHz; FWHM, rho in amagats)"
variable = "rho: the density of D2 in amagat"
state = "room temperature (not stated)"
density = "unknown"
range = "not stated"
coefficients = { A_MHz_amagat = "101", B_MHz_per_amagat = "120" }
check = "At 60 amagat, 7202 MHz, which reproduces the calculated D2 gain 0.55 cm/GW to 0.7 % (2026-09-26)."
notes = "The D2 Q(2) FWHM with the Dicke term 101/rho (MHz amagat), from [16] D. A. Russell and W. B. Roh, J. Mol. Spectrosc. 124, 240 (1987) (russell_1987) and [17] K. C. Smyth, G. J. Rosasco and W. S. Hurst, J. Chem. Phys. 87, 1001 (1987) (smyth_1987); which coefficient comes from which is not said. Against the originals (checked 2026-09-27): 101 MHz amagat is Russell and Roh's Q(2) Dicke term, (4 pi nu^2/c) D_0 with D_0 = 0.901 cm2 amagat/s (their Table I) and nu = 2987 cm-1: 3.370e-3 cm-1 amagat = 101.0 MHz amagat; 120 MHz/amagat lies between Russell and Roh's FWHM a(Q(2)) = 3.91e-3 cm-1/amagat = 117.2 MHz/amagat and twice Smyth et al.'s HWHM gamma(Q(2)) = 2 x 2.06e-3 cm-1/amagat = 123.5 MHz/amagat, and equals their mean (120.4) to the printed digits (an inference). Both originals are room-temperature measurements; the FWHM of this law is consistent with both (Smyth et al.'s are half widths). solprop's D2 vibrational linewidth is this law: inverse_density 1.01e8 (Hz amagat) and density 1.20e8 (Hz/amagat), FWHM: the same numbers."

[[formulas]]
id = "linewidth_CH4"
material = "CH4"
equation = "Table I, p. 2077"
printed = "Delta nu = 8220 + 384 rho (MHz; FWHM, rho in amagats)"
variable = "rho: the density of CH4 in amagat"
state = "room temperature (not stated)"
density = "unknown"
range = "not stated"
coefficients = { constant_MHz = "8220", B_MHz_per_amagat = "384" }
check = "At 115 amagat, 52380 MHz, which reproduces the calculated CH4 gain 1.28 cm/GW to 0.3 % (2026-09-26)."
notes = "The CH4 nu1 Q-branch FWHM from [13] R. B. Lopert, Ph.D. dissertation (UC Davis, 1983), not in the library. The constant 8220 MHz (0.274 cm-1) is the unresolved Q-branch width at zero density. solprop's CH4 vibrational linewidth is this law: constant 8.22e9 Hz, density 3.84e8 Hz/amagat, FWHM (solprop: 'its constant term is not a verified isolated-molecule lifetime'). Hanna et al. used Taira et al.'s 0.32 + 0.012p cm-1 instead (hanna_1986)."

[[formulas]]
id = "shift_H2"
material = "H2"
equation = "Fig. 5 caption, p. 2079"
printed = "nu_A,S - nu(rho = 0) = -96 rho + 0.17 rho^2 (nu in MHz, rho in amagats)"
variable = "rho: the density of H2 in amagat"
state = "room temperature (not stated)"
density = "unknown"
range = "not stated"
coefficients = { C_MHz_per_amagat = "-96", D_MHz_per_amagat2 = "0.17" }
check = "Not reproducible here (Fig. 5 is a figure); the same numbers as bischel_1986b Eq. (9) (C = -96 MHz/amagat at 298 K, D = 0.174 MHz amagat^-2 from Murray and Javan)."
notes = "The collisional shift of H2 Q(1), reproduced from [12] (bischel_1986b) and [20] J. R. Murray and A. Javan, J. Mol. Spectrosc. 42, 1 (1972), curated as murray_1972 (2026-09-27); used for the theoretical curves of Fig. 5. The 0.17 MHz/amagat^2 is Murray and Javan's Q_1(0) quadratic coefficient (0.0058e-3 cm-1/amagat^2 = 0.174), carried over from bischel_1986b; their Q_1(1) value is 0.0045e-3 = 0.135 MHz/amagat^2."

[[formulas]]
id = "shift_D2"
material = "D2"
equation = "Fig. 5 caption, p. 2079"
printed = "nu_A,S - nu(rho = 0) = -50 rho (nu in MHz, rho in amagats)"
variable = "rho: the density of D2 in amagat"
state = "room temperature (not stated)"
density = "unknown"
range = "not stated"
coefficients = { C_MHz_per_amagat = "-50" }
check = "Not reproducible here (Fig. 5 is a figure). Against the original (murray_1972, 2026-09-27): its Table III linear-fit a for D2 Q_1(2), -1.7 +- 0.3 x 10^-3 cm-1/amagat at 25 C, is -51.0 MHz/amagat (x 29.98): this -50 to 2 %."
notes = "The collisional shift of D2 Q(2), reproduced from [20] Murray and Javan (1972), curated as murray_1972 (2026-09-27)."

[[formulas]]
id = "gain_eq4"
material = "H2"
equation = "Eq. (4), p. 2077"
printed = "g = (2 lambda_S^2/(h nu_S)) (Delta N/(pi Delta nu)) (dsigma/dOmega)"
variable = "lambda_S, nu_S: the Stokes wavelength and frequency; Delta N the population difference; Delta nu the FWHM of the gain profile; dsigma/dOmega the differential cross section"
state = "as the parameters"
density = "unknown"
range = "steady state, small signal"
coefficients = { factor = "2" }
check = "With Table I's parameters and rho x 2.6868e19 cm^-3 reproduces Table II's calculated gains to 1.2 % (H2), 0.7 % (D2) and 0.3 % (CH4) (2026-09-26)."
notes = "The plane-wave steady-state peak gain [12] (bischel_1986b Eq. 4), for H2, D2 and CH4 alike (the material key names the first). Hanna et al.'s Eq. (1) is the same law in angular frequencies."
