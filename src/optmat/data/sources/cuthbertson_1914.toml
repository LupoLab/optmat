[[formulas]]
id = "ozone_two_point"
material = "O3"
equation = "p. 20 (text)"
printed = "mu - 1 = 2.0414 x 10^27 / (4221.3 x 10^27 - n^2)"
variable = "n: frequency, 3 x 10^10 / lambda(cm), lambda in air"
state = { pressure_pa = 101258.0, temperature_k = 273.15 }
density = "ideal"
range = "6708-4800 A (through the two end points only)"
coefficients = { N = "2.0414e27", n02 = "4221.3e27" }
check = "Gives 52083 x 1e-8 at 5461 (the paper: 52082, against the derived 52000) and 50765 and 53291 at 6708 and 4800, the two points it was drawn through (checked 2026-09-24)."
notes = "Fixed from mu_6708 - 1 and mu_4800 - 1 alone; the authors infer that 'a second term is required' because the measured curvature is larger."

[[formulas]]
id = "n2o"
material = "N2O"
equation = "p. 25 (text)"
printed = "(mu - 1) D/(d0 76) = 5.6685 x 10^27 / (11416 x 10^27 - n^2)"
variable = "n: frequency, 3 x 10^10 / lambda(cm), lambda in air"
state = { pressure_pa = 101258.0, temperature_k = 273.15 }
density = "ideal"
range = "6708-4800 A"
coefficients = { N = "5.6685e27", n02 = "11416e27" }
check = "Reproduces Table XIV's calculated column within 1.6 x 1e-8 at six wavelengths, 2.2 at 5209.1 and 6.7 at 4799.9 (51413.3 against 51420): the printed constants are rounded (checked 2026-09-24)."
notes = "One-term Sellmeier fitted by the paper's modified least squares (p. 26)."
