notes = "p. 30 (checked on the pdf text): 'the final result for 4He corresponds to A_mu = -7.92128(13) x 10^-6 cm3 mol-1', converted by the reviewers from Puchalski et al.'s atomic units; 'all effects through order alpha^4', the nonrelativistic limit with Slater geminals; relative uncertainty 'conservatively estimated at 16 ppm', mainly the neglected alpha^5 QED (level not stated). A_mu is the molar magnetic term of Eq. (11), (4 pi/3) N_A chi_0: chi_0 = -2.119105e-5 a.u. (with 0.3738031 cm^3/mol per a.u., computed), 1.4e-4 of itself smaller in magnitude than Bruch and Weinhold's -2.1194(1)e-5 that fit/He uses (via puchalski_2016), a change of 2.1e-9 of helium's refractive polarizability. The original (published as Phys. Rev. A 108, 042812 (2023), as lang_2026 and lesiuk_2023b cite it) is not in the library: this is the best copy."
