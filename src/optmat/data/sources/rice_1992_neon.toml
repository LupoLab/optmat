citation = "J. E. Rice, G. E. Scuseria, T. J. Lee, P. R. Taylor and J. Almlof, \"Connected triple excitations in coupled-cluster calculations of hyperpolarizabilities: neon\", Chem. Phys. Lett. 191, 23 (1992)"
doi = "10.1016/0009-2614(92)85362-e"
library = "Rice_1992_ConnectedTripleExcitations"
identity = "VALIDATED_WITH_WARNINGS"
kind = "theory"
technique = """Finite-field SCF, MP2, CCSD, CCSD + T(CCSD), CCSD(T) and full CCSDT energies of \
neon (fields 0-0.020 a.u., fitted to a sixth-order polynomial) in the ANO basis C = \
[4+1+1s 3+1+1p 2+1+1d 1+1f] with diffuse sets up to (3s3p2d3f2g), and in the \
uncontracted (13s8p8d4f) basis with core correlation (manuscript pp. 5-6); CCSDT by \
Scuseria's program as the benchmark for (T). Static values; the dynamic ESHG and dc \
Kerr values combine the static best estimate with MP2 frequency-dependent corrections \
(rice_1992)."""
notes = """IDENTITY. The library first held this document as Unverified_bb10c94322e6 \
(observed title only); during this extraction (2026-09-26) it was validated and renamed \
Rice_1992_ConnectedTripleExcitations: Chem. Phys. Lett. 191, 23-28 (1992), DOI \
10.1016/0009-2614(92)85362-e, document version 'preprint' (the typed manuscript, 12 \
pages, file Connected_triple_excitations_in_coupled.pdf). This agrees with the \
identification made from rice_1992 (Ref. 5, 'Chem. Phys. Lett. (in press)') and Shelton \
and Rice 1994 (Ref. 170). The page numbers below are the manuscript's (pdf pages), not \
the journal's; the published text was not compared.

DEFINITION (p. 6): 'E(F) = E_0 - (1/2) alpha F^2 - (1/4!) gamma F^4 - (1/6!) epsilon \
F^6', static field F (Buckingham): gamma is the static Taylor-series (T) value. Process \
static, part electronic, atomic units, nonrelativistic. Fit error in gamma below 0.2 \
a.u. for the correlated values (p. 6).

TABLE 1 (p. 12, image checked): dataset table1 (21 rows). A TEXT-TABLE INCONSISTENCY: \
the text says 'The CCSDT gamma value of 110.9 a.u. in this basis [C + (2s2p1d2f)] is in \
very good agreement with that from the CCSD(T) method (111.2 a.u.)' (p. 6), while the \
table prints CCSD(T) 110.9 and CCSDT 111.2. The table is consistent with CCSD(T) 111.0 \
in the next basis (the two bases give 'essentially identical' results, p. 6), so the \
text has probably swapped them; the table is recorded as printed (TC-245).

BEST ESTIMATE (pp. 7, 9): 'Our best computed CCSD(T) value for gamma of neon, including \
the effects of multiple sets of diffuse s, p, d and f functions and of core \
correlation, is 109.8 a.u. After incorporating corrections for diffuse g functions and \
a more complete treatment of triple excitations our best estimate is 110 a.u. with an \
error estimate of 3 a.u.' The uncertainty is 'almost entirely due to uncertainty in the \
estimated contribution of connected quadruple (and higher) excitations' (p. 7). Dataset \
best (check). This REVISES Taylor et al. 1989's neon values (the manuscript's Ref. 4 \
cites that paper with a correction, 'Chem. Phys. Lett. xxx, xxx (1991)'), which \
rice_1991 still quotes as 119 +- 4: see rice_1991's excluded Ne datasets.

DYNAMIC VALUES (pp. 8-9): 'combined the MP2 frequency-dependent corrections [Ref. 26: \
J. E. Rice, J. Chem. Phys., submitted = rice_1992] for gamma(-2w; w, w, 0) of neon with \
our best estimate for the static value': 112 +- 3 (1319 nm), 113 +- 3 (1064 nm), 124 +- \
4 (514.5 nm), and gamma^K(-w; w, 0, 0) 113 +- 3 at 632.8 nm. The same numbers are in \
rice_1992 (datasets best_eshg_Ne, best_dc_kerr_Ne), which computes the MP2 dispersion: \
recorded there, not again here.

REPRODUCED VALUES. Shelton's revised static estimate '108 +- 2 a.u.' (Ref. 21, personal \
communication and ACS meeting, August 1991), which 'differs from his earlier static \
value of 119 +- 2 due to his discovery of a systematic error in some of the \
measurements' (p. 7): dataset shelton_static (reproduced). Other theory (pp. 7-8): \
Maroulis and Thakkar's CCD+ST(CCD) 114 +- 9 (Chem. Phys. Lett. 156, 87 (1989)), Chong \
and Langhoff's CCSD(T) 111.0 (J. Chem. Phys. 93, 570 (1990)), Jensen et al.'s RAS-SCF \
108 +- 5: dataset other_theory (reproduced). The experimental ESHG values 111.1 +- 0.8 \
(1319 nm), 109.9 +- 0.5 (1064 nm) and 122.2 +- 0.5 (514.5 nm) and the dc Kerr 101 +- 8 \
(632.8 nm, Buckingham and Dunmur, cited here correctly as Trans. Faraday Soc. 64, 1776 \
(1968) = buckingham_1968) are recorded in rice_1992, not again. The linear \
polarizability (best 2.677 +- 0.015 a.u., p. 8) is linear data, not extracted."""

