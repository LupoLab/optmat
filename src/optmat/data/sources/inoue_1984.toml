citation = "G. Inoue, J. K. Ku and D. W. Setser, \"Laser induced fluorescence study of Xe(5p56p, 5p56p', 5p57p, and 5p56d) states in Ne and Ar: Radiative lifetimes and collisional deactivation rate constants\", J. Chem. Phys. 81, 5760-5774 (1984)"
doi = "10.1063/1.447628"
library = "Inoue_1984_LaserInducedFluorescence"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Laser-induced fluorescence in the afterglow of a pulsed discharge (4.5 kV, 2 \
mA, 300 us) in slowly flowing premixed 1.0-1.5 % xenon in neon or argon: Xe(1s5) and \
Xe(1s4) (6s[3/2]2, 6s[3/2]1) made by the discharge were excited 4 ms (1s5) or 1.2 ms \
(1s4) after it by a Nd:YAG-pumped dye laser (8 ns), one-photon to the 6p' and 7p \
levels, by its H2 Raman-shifted (first or second Stokes) output to the 6p levels, and \
two-photon (first Stokes of the DCM dye, 0.3 mJ, 1 m lens; resonant via 6p) to the 6d \
levels. Fluorescence through a 1 m monochromator (1200 g/mm) onto cooled or room-\
temperature photomultipliers, digitised and averaged over 2500-9000 shots; detection \
calibrated with a quartz-iodine lamp. Radiative lifetimes and total deactivation rate \
constants from Stern-Volmer plots of the (single, or fast-component) decay constants \
against 0.2-4 Torr of buffer gas; where the decays in neon were multi-exponential, \
two- or three-level coupled kinetic models (Eqs. 3a-4) checked the assignment. Product \
distributions from the product emission at low pressure with Aymar and Coulombe's \
theoretical radiative branching fractions (Eq. 2)."""
notes = """J. Chem. Phys. 81(12), Pt. I, 5760-5774 (15 December 1984) = PDF pages 2-16 \
(PDF page 1 is the AIP download cover; journal page = PDF page + 5758); a scanned \
(raster) PDF with an OCR text layer. Identity checked on the first page of the article \
(PDF p. 2: title 'Laser induced fluorescence study of Xe(5p56p, 5p56p', 5p57p and \
5p56d) states in Ne and Ar: Radiative lifetimes and collisional deactivation rate \
constants', Gen Inoue, J. K. Ku and D. W. Setser, Kansas State University, received 4 \
June 1984, accepted 10 August 1984, footer J. Chem. Phys. 81 (12), Pt. I, 15 Dec. \
1984, 5760) on 2026-10-09. Tables I and II checked cell by cell against the table \
images and the rendered pages (4x), with their footnotes; Figs. 1 and 2 and the text \
passages cited below on the rendered pages.

LEVELS. Paschen notation in the text and both tables (rows here), Racah beside it in \
Table I and Fig. 2. NIST (src/optmat/data/external/nist_asd/Xe_I_levels.tsv; \
configuration, term, J, cm-1): 6p' = 5p5(2P*1/2)6p: 2p1 = 6p'[1/2]0 = 2[1/2] J = 0 \
(89860.015); 2p2 = 6p'[1/2]1 = 2[1/2] J = 1 (89278.706); 2p3 = 6p'[3/2]2 = 2[3/2] J = \
2 (89162.356); 2p4 = 6p'[3/2]1 = 2[3/2] J = 1 (88379.126). 6p = 5p5(2P*3/2)6p: 2p5 = \
6p[1/2]0 (80118.962); 2p6 = 6p[3/2]2 (79212.465); 2p7 = 6p[3/2]1 (78956.031); 2p8 = \
6p[5/2]3 (78403.061); 2p9 = 6p[5/2]2 (78119.798); 2p10 = 6p[1/2]1 (77269.145). 7p = \
5p5(2P*3/2)7p: 3p5 = 7p[1/2]0 (88842.256); 3p7 = 7p[3/2]1 (88744.559); 3p6 = \
7p[3/2]2 (88686.500); 3p8 = 7p[5/2]3 (88469.213); 3p9 = 7p[5/2]2 (88351.681); 3p10 = \
7p[1/2]1 (87927.131). 6d = 5p5(2P*3/2)6d: 4d2 = 6d[3/2]1 = 2[3/2]* J = 1 \
(90032.155); 4d1' = 6d[5/2]3 (89534.568); 4d1'' = 6d[5/2]2 (89243.258); 4d4 = \
6d[7/2]3 (89024.890); 4d4' = 6d[7/2]4 (88911.692); 4d3 = 6d[3/2]2 (88708.466); 4d5 = \
6d[1/2]1 (88549.775); 4d6 = 6d[1/2]0 (88491.020). Evidence (script checks): Fig. 2's \
eighteen printed energies of the 6p', 7p and 6d levels exceed NIST's by a uniform \
0.43-0.57 cm-1 (the older energy scale ku_1986's Fig. 1 also shows); the gaps the text \
prints, 581, 172, 325, -425 (3p10 - 3p9), 2487 (3p10 - 2s4), 69.4, 22, 'less than 58' \
and 1073 cm-1 (NIST 581.31, 172.14, 325.45, -424.55, 2487.11, 69.44, 21.81, 58.06, \
1072.38); the air wavelengths 828.01 (2p5 -> 1s4), 820.63 (2p4 -> 1s3), 823.16 (2p6 -> \
1s5), 450.1 (2p2 -> 1s5) and 452.5 nm (2p3 -> 1s5), NIST's vacuum lines 828.239, \
820.859, 823.390, 450.224 and 452.595 nm; and the equilibrium constants K(4d1'/2p1) = \
33, K(4d1'/2p2) = 1.5 and K(2p10/1s3) = 57, which NIST's energies give at 300 K \
(33.3, 1.46, 57.1). The temperature is not stated (room temperature; the equilibrium \
constants imply 300 K), so no temperature_k is given.

TAKEN (radiative_lifetime and collisional_quenching_rate_coefficient, TC-1011, TC-1040; \
extraction script tools/extract/inoue_1984.py), the columns 'This work' only. \
Uncertainty level not stated anywhere in the paper.
- Table I (p. 5761), radiative lifetimes (ns), the zero-pressure intercepts in neon \
(13 levels) and in argon (20 levels): tau_Ne_Xe (primary) 2p1 40 +- 2, 2p6 31 +- 1, \
2p7 37 +- 1, 2p8 31 +- 1, 2p9 39 +- 1, 2p10 38 +- 1, 3p5 62 +- 3, 3p10 123 +- 3, 4d1' \
87 +- 2, 4d4 59 +- 2, 4d4' 46 +- 2; tau_Ar_Xe (primary) 2p1 38 +- 2, 2p2 38 +- 2, 2p3 \
37 +- 2, 2p4 48 +- 2, 2p6 31 +- 2, 2p8 30 +- 2, 2p10 38 +- 2, 3p5 65 +- 2, 3p7 70 +- \
2, 3p6 115 +- 3, 3p8 154 +- 9, 3p9 166 +- 9, 4d1' 89 +- 2, 4d1'' 70 +- 2, 4d4 60 +- 3, \
4d4' 48 +- 2, 4d3 57 +- 2, 4d5 43 +- 2, 4d6 42 +- 2. The three values the authors \
call the less reliable of a pair are apart, use = check: 2p4 50 +- 2 and 3p9 154 +- 9 \
in neon (tau_Ne_check_Xe: 'the radiative lifetime from Ar data should be the more \
reliable', pp. 5769-5770; the neon intercepts are linear extrapolations through \
coupled decays) and 3p10 131 +- 4 in argon (tau_Ar_check_Xe: 'we prefer tau(3p10) = \
123 ns from experiments in Ne', p. 5765). Where only one buffer is printed the authors \
chose it: 2p2, 4d1'', 2p3, 3p7, 4d3, 3p6 and 3p8 'from the Ar decay constants' (pp. \
5766, 5768-5769). 2p5 and 4d2 were not measured. Text checks: 3p10 '123 +- 3 ns' and \
'131 +- 4 ns' (p. 5765), 4d1' '88 ns' (the mean of 87 and 89), 2p2 '38 ns', 3p8 '154 \
ns'.
- Table II (p. 5763), total deactivation rate constants (10^-11 cm3 atom-1 s-1), \
bimolecular, channel total: by neon, 22 levels, 0.2 +- 0.2 (2p6) to 71 +- 7 (4d6) \
(kq_Ne_Xe, primary); by argon, 20 levels, 0.3 +- 0.3 (2p10) to 52 +- 2 (4d6) \
(kq_Ar_Xe, primary); by xenon, 2p10 13 +- 2, the slope of the fast component of a \
double-exponential decay (Fig. 10b; '1.3 x 10^-10', p. 5770; ku_1986's kq_self_Xe \
takes its own 13.3 +- 0.5 the same way) (kq_self_Xe, primary). Text checks: 3p10 '(7 \
+- 2) x 10^-12' and '(2.1 +- 0.3) x 10^-10' and 'the quenching rate constant in Ar is \
30 times larger', 2p10 '0.3 +- 0.3 x 10^-11', 4d4 'four times larger', 2p2 '25% \
lower' than Ref. 4's 15 (27 %), the conclusions' 4d6 52 and 71 and the argon range '30 \
to 0.3' (28 to 0.3 printed).

NOT TAKEN: Table I's theoretical columns (tau_r, tau_v: Aymar and Coulombe, At. Data \
Nucl. Data Tables 21, 537 (1978); reproduced) and the experimental columns HS, AJS, VO, \
KK, JCS and Others (Refs. 4, 8, 6, 7, 12, 9, 13; reproduced); Table II's parenthesised \
values (Refs. 4 and 8), its 2p10 xenon value '(41 +- 5)^c' (Sadeghi and Sabbagh's data, \
Ref. 10, converted by detailed balance on an assumed 75 % branching), and 2p5's and \
2p6's xenon values, 0.58 +- 0.05 and 8.2 +- 0.5 (footnote d, the note added in proof: \
Setser and Ku's two-photon measurement, Ref. 29, published as ku_1986, whose Table I \
prints the same numbers); the Stern-Volmer figures (Figs. 3-10), whose slopes and \
intercepts are the tables'; Xe(1s5) by neon, 1.8 +- 0.3 x 10^-16 (Ref. 24, p. 5773). \
NOT TAKEN (no quantity): Table III, the collisional branching fractions (Observed and \
Simulation) from the 6p', 7p and 6d levels in neon and argon (the state-to-state rate \
coefficients are not printed; k_Q times the fraction would be derived, and the two \
columns differ by up to a factor 4); Table IV, the radiative cascade distribution among \
the 6p levels after 3p8 or 2p4 excitation; the 2p10 -> 1s2 / 1s3 branching in xenon, \
0.6 / 0.4 (p. 5771, a model fit).

FINDING (the 6p' lifetimes: Inoue sides with bruce_1990, not NIST). ns; NIST is 1/sum \
A over the NIST lines from the level in Xe_I_lines.tsv and Xe_I_lines_nir.tsv (vacuum \
wavelengths, TC-985; script check). 2p1 = 6p'[1/2]0: Ne 40 +- 2, Ar 38 +- 2; \
bruce_1990 34.1 +- 0.8 (2 sigma); NIST 27.5 from 458.40 nm (to 6s[3/2]1, A = 1.3e6, C) \
and 788.96 nm (6s'[1/2]1, 3.5e7, C+), no A for 1012.8, 1675.0 (5d) and 2262.5 nm (7s). \
2p3 = 6p'[3/2]2: Ar 37 +- 2; bruce_1990 32.1 +- 0.8; NIST 22.8 from 452.59 (6s[3/2]2, \
4.6e5, C+), 473.55 (6s[3/2]1, 1.38e6, C+) and 834.91 nm (6s'[1/2]1, 4.2e7, C+), no A \
for five 5d lines (1089.8-1485.4 nm) and 2516.6 nm (7s). 2p2 = 6p'[1/2]1: Ar 38 +- 2; \
NIST 25.9 from 450.22 (6s[3/2]2, 1.46e6, C+), 764.41 (6s'[1/2]0, 2.1e7, C+) and 826.88 \
nm (6s'[1/2]1, 1.62e7, C+), no A for 470.95 nm (6s[3/2]1), three 5d and two 7s lines. \
2p4 = 6p'[3/2]1: Ar 48 +- 2 (Ne 50 +- 2, check); NIST 22.8 from 469.23 (2.8e5, C+), \
491.79 (1.6e6, C+), 820.86 (6s'[1/2]0, 2.0e7, C) and 893.33 nm (6s'[1/2]1, 2.2e7, C), \
no A for five 5d and two 7s lines. Neither bowering_1986b nor ku_1986 measures a 6p' \
level. NIST's 1/sum A is 0.72 (2p1), 0.62 (2p3), 0.68 (2p2) and 0.48 (2p4) of Inoue's \
argon value, and the NIST 6p' -> 6s' lines alone (3.5e7, 4.2e7, 3.72e7, 4.2e7 s-1) \
exceed the measured total decay rates (2.6e7, 2.7e7, 2.6e7, 2.1e7 s-1) by 1.3-2.0: \
the missing lines can only shorten NIST's lifetimes further. Inoue is longer than \
bruce_1990 by 4-5 ns in argon, 1.8 and 2.3 times the combined printed errors (Inoue's level not \
stated, Bruce's 2 sigma); Table I's other experiments split the same way (2p1: AJS \
38.5 +- 1.5, VO 30 +- 3, KK 33 +- 3, JCS 30.7 +- 1; 2p3: HS 35 +- 1, AJS 39.0 +- 1.5, \
VO 34 +- 2, KK 33 +- 3, JCS 30.5 +- 3, Ref. 9 (level crossing) 38.1 +- 1.3), all above NIST, and Aymar \
and Coulombe's velocity form gives 36.9 and 36.0 ns. So two independent groups put \
6p'[1/2]0 at 34-40 ns and 6p'[3/2]2 at 32-37 ns, against NIST's 27.5 and 22.8.

FINDING (the 7p lifetimes: neither side). 3p5 = 7p[1/2]0: Ne 62 +- 3, Ar 65 +- 2; \
bruce_1990 69.1 +- 1.3; NIST 69.0 (five lines, B: 480.84, 857.84, 1129.2, 2019.3, \
2939.2 nm). 3p6 = 7p[3/2]2: Ar 115 +- 3; bruce_1990 105.3 +- 2.9; NIST 106.4 (eleven \
lines to 6s, 6s', 5d, 7s, B-D). 3p9 = 7p[5/2]2: Ar 166 +- 9 (Ne 154 +- 9, check); \
bruce_1990 128.6 +- 5.6; NIST 129.2 (eleven lines, B-D). 3p8 = 7p[5/2]3: Ar 154 +- 9; \
NIST 123.7 (seven lines, B-C). 3p10 = 7p[1/2]1: Ne 123 +- 3; NIST 109.1 (eleven lines, \
D+). 3p7 = 7p[3/2]1: Ar 70 +- 2; NIST 100.8 (ten lines, D-D+). Where bruce_1990 \
measures (3p5, 3p6, 3p9) NIST agrees with it within 1 % (NIST's A values for these lines are T8608's), \
and Inoue differs from both by -10 to +29 %, by 1.7-3.5 times the \
combined printed errors; Inoue's 7p track Aymar and Coulombe's tau_v (115, 157, \
151, 122, 72.3 ns; 3p5 apart, 74.6) instead. bruce_1990 (time-correlated photon counting from 1e-4 Torr, \
2 sigma) is the better 7p measurement; Inoue's 7p values are a check on it, not a \
confirmation.

FINDING (the 6p lifetimes). 2p6 = 6p[3/2]2: Ne 31 +- 1, Ar 31 +- 2; bruce_1990 31.3 +- \
1.8; bowering_1986b 35 +- 3; ku_1986 36.0 +- 3.0; NIST 27.2 (823.39, 895.47 nm; no A \
for 4932.3 nm). 2p7 = 6p[3/2]1: Ne 37 +- 1; ku_1986 36.7 +- 1.0; NIST 37.0. 2p8 = \
6p[5/2]3: Ne 31 +- 1, Ar 30 +- 2; ku_1986 32.3 +- 1.0; NIST 33.3 (882.18 nm, A+). 2p9 \
= 6p[5/2]2: Ne 39 +- 1; bruce_1990 36.0 +- 2.8; bowering_1986b 30 +- 4 (36 +- 4 from 1-10 \
Torr); ku_1986 39.3 +- 1.0; NIST 39.4. 2p10 = 6p[1/2]1: Ne 38 +- 1, Ar 38 +- 2; ku_1986 \
38.2 +- 1.0; bowering_1986b 43.8 +- 8.0 (coupled, check); NIST 30.4 (980.24, 1084.13 \
nm). A fourth group's values thus agree with TC-1041: NIST's 1/sum A is 12-20 % short \
for 6p[3/2]2 and 6p[1/2]1 and within 7 % for 6p[3/2]1, 6p[5/2]3 and 6p[5/2]2. 2p5 is \
not measured.

FINDING (the 6d lifetimes). NIST gives transition probabilities only for 4d2 (111.07 \
nm to the ground level, 1.50e8 s-1, 6.7 ns; Aymar and Coulombe 1.3-1.4 ns; trapped in \
the experiment, p. 5765) and 4d5 (112.93 nm, 4.4e6 s-1, D+), none for the 6d -> 6p \
lines: Inoue's 42-89 ns are the only measured 6d lifetimes here.

FINDING (quenching, against bruce_1990, ku_1986 and bowering_1986b, 10^-11 cm3/s). By \
argon: 2p1 28 +- 3 (bruce_1990 24.7 +- 1.4); 2p3 16 +- 2 (17.9 +- 1.4); 3p5 19 +- 3 \
(25.6 +- 3.4); 3p6 23 +- 2 (34.8 +- 3.2; Horiguchi 30 +- 3); 3p9 24 +- 2 (25.9 +- \
2.0); 2p6 2.2 +- 0.2 against bruce_1990's 4.0 +- 0.2 and ku_1986's 4.7 +- 0.5 (a \
factor 2; the same laboratory, two years apart). By xenon: 2p10 13 +- 2 (ku_1986 13.3 \
+- 0.5; bowering_1986b 29.5 +- 4.8). ku_1986 quotes this paper (its Ref. 7) correctly \
for 2p6-2p10's lifetimes and 2p10's xenon rate, but prints its argon rate of 2p6 as \
'2.2 +- 0.5' (ku_1986 Table II, table image) where this paper prints 2.2 +- 0.2.

DOUBTS (printed inconsistencies; no taken value is affected). Table I's footnote a \
gives the theoretical lifetimes as 'Reference 15' (Pence and Leone, Ca), but the text \
attributes tau_r and tau_v to Aymar and Coulombe, Ref. 17 (p. 5770). The text gives \
the 3p8 -> 1s5 line 'at 452.7 nm' (p. 5769); NIST's 3p8 -> 1s5 line is 467.25 nm \
(vacuum; 467.1 in air) and no line from 3p8 lies near 452.7 nm (452.5 nm is 2p3 -> \
1s5); script check. The text says 'The radiative lifetimes for 2p4, 4d1'' and 2p3 \
were obtained from the Ar decay constants' in the paragraph on 2p2, 4d1'' and 2p3 (p. \
5766): 2p2 is meant (Table I prints 2p2 in argon only, 2p4 in both). K(4d1'/2p1) = 33 \
is N(4d1')/N(2p1) at equilibrium, but K(4d1'/2p2) = 1.5 is N(2p2)/N(4d1') (the \
inverse, 0.68). The average discrepancy from tau_v, '1.7 and 3 ns for the Xe(6p and \
6p') and Xe(7p) states' (p. 5772): all the printed 6p and 6p' values give 1.69 ns \
(script check); the 7p '3 ns' is not reproduced (3.6-5.5 ns, whichever values are \
taken).

TWO-PHOTON DATA CITED, NOT IN THE LIBRARY: D. W. Setser and J. Ku, Proceedings of the \
38th International Meeting of the Societe Francaise de Chimie: Photophysics and \
Photochemistry above 6 eV (1984) (Ref. 29; two-photon excitation of Xe 2p5 and 2p6 in \
xenon; its numbers are ku_1986's). Held: raymond_1984 (Ref. 26). Lifetime and \
quenching papers cited, not in the library: N. Sadeghi and J. Sabbagh, Phys. Rev. A \
16, 2336 (1977) (Ref. 10; not sabbagh_1977, their JQSRT paper); H. Horiguchi, R. \
S. F. Chang and D. W. Setser, J. Chem. Phys. 75, 1207 (1981) (Ref. 4); L. Allen, D. G. \
C. Jones and D. G. Schofield, J. Opt. Soc. Am. 59, 842 (1969) (Ref. 8); X. Husson and \
J. Margerie, Opt. Commun. 5, 139 (1972) (Ref. 9); M. Aymar and M. Coulombe, At. Data \
Nucl. Data Tables 21, 537 (1978) (Ref. 17)."""

