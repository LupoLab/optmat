technique = """In-fiber Mach-Zehnder interferometer in a hollow-core photonic-crystal fiber \
(HC-1550-02): the phase of the beat between core modes near 1532 nm recorded while \
the gas pressure in the fiber is varied from 0.07 to 0.6 bar, for nine gases."""
notes = """Nothing is extracted. The measurement gives the interferometric phase per unit \
pressure (Fig. 7, figures only), which the paper converts to refractive index only \
through a calibration against literature polarizabilities (Fig. 9, with an \
instrument sensitivity coefficient f = 0.0078): it is not an independent \
determination of n. Table 1 (tbl_9c65adc46529, image checked; the library's header \
cells are garbled but the numbers are correct) lists only literature values: 'alpha \
from n at 1532 nm' for He, Ar, N2 and C2H2, 'calculated using known dispersion and \
refractive indices' of Mansfield & Peck (He), Peck & Fisher (Ar), Peck & Khanna (N2), \
and static average polarizabilities from compilations (units 1e-40 J^-1 C^2 m^2), to \
three digits. They are derived reproductions and are internally doubtful: the \
1532 nm values of Ar (1.74) and N2 (1.95) lie below the static values listed beside \
them (1.82, 1.96), whereas the dynamic polarizability must exceed the static one \
(the static Ar value 1.82 agrees with the known 1.64 A^3 = 1.826e-40). NH3, C2H2, \
CF4 and ClF2CH are not curated species."""
