citation = "C. R. Mansfield and E. R. Peck, \"Dispersion of Helium\", J. Opt. Soc. Am. 59, 199 (1969)"
library = "Mansfield_1969_DispersionHelium"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Compensated corner-reflector Michelson interferometer, fringe shifts \
monitored simultaneously at two wavelengths while a 24 cm gas cell was evacuated to \
about 0.01 torr and filled to nearly atmospheric pressure; mercury manometer with \
travelling microscope and meter bar (corrected for mercury expansion and local \
gravity), copper-constantan thermocouple against an ice bath; helium of 99.99 % \
minimum purity through a dry-ice-acetone trap. The absolute refractivity was measured \
at the Hg green line (5462.258 A); the other wavelengths were measured as refractivity \
ratios to it (pp. 199-200)."""
notes = """Identity unverified by the library: the observed title and authors are \
"Dispersion of Helium", C. R. Mansfield and E. R. Peck (University of Idaho, received \
28 March 1968); the original file is 'josa-59-2-199-2.pdf', consistent with JOSA 59, \
199 (1969). No DOI is recorded.

Reduction (p. 199): values are converted to 760 torr, 0 degrees C with the \
Lorentz-Lorenz form r0/r = rho0/rho [1 + r0 (1 - P T0 / P0 T) / 6] and the density \
ratio rho0/rho = P0 T Z / (P T0 Z0), Z from the virial fit to White et al. (1960): \
Z = 1 + (0.74062e-8 T^2 - 0.061793e-4 T + 16.742e-4) P, P in atm, T in K. A real-gas \
reduction. Wavelengths are vacuum wavelengths (Table I heading and p. 200).

Uncertainty (p. 200): the absolute refractivity at 5462.258 A, 760 torr, 0 degrees C, \
is (n-1) x 10^5 = 3.4950 +- 0.0014, 'the standard deviation from the mean of 156 \
individual measurements'; 'a liberal estimate of the systematic errors resulting from \
impurities, pressure measurement, temperature measurement, and cell-length \
measurement would raise the error of the absolute refractivity to +-0.009' (Table III \
prints +-0.0088). Every other value is the green-line value divided by a measured \
ratio, so the absolute error is a scale error common to all points; the ratios are \
'subject only to errors of the measurement of fringe shift and wavelength'. The \
per-point scatter is taken from the rms residual of the four-parameter Eq. (4) fit, \
2.9e-5 in units of (n-1) x 10^5, i.e. 0.29 in the printed units of 1e-9.

Table I's 'Deviation from Eq. (4)' column is not extracted and does not reproduce: the \
printed Eq. (4) gives residuals (fit minus value) of 0.02, -0.73, -0.06, ... and a \
free four-parameter refit of the 13 fitted points reproduces neither sign of the \
printed column (checked 2026-09-24). The two excluded points, at which the refit lies \
1.6e-9 and 4.6e-9 above the measurement, are printed with -1.72 and -4.23, so the \
column's sign is probably value minus fit, against its heading.

The theoretical refractivity (p. 202) is computed from Eq. (5) with Loschmidt's \
number and oscillator strengths and photoionisation cross sections from the literature \
(Table II; Stewart and Webb 1963 for the continuum), n - 1 = (3/2) R (1 + R/4) with R \
the Lorentz-Lorenz function: an ideal-gas density at 760 torr, 0 degrees C. The 26 \
computed values are not tabulated, only fitted (Eqs. 6-8) and quoted at 5462.258 A \
(Table IV). The paper's sum-rule check (p. 202): discrete F = 0.447, continuum 1.540, \
total 1.998. 'We have not estimated the absolute accuracy of the computation.'

Not extracted: Table V (effective F values and absorption wavelengths of one-term \
formulas), Table VII (Becquerel-equation constants) and Table VIII (Verdet constants \
derived from the dispersion formulas through the Becquerel equation, printed in \
'min/Oe cm' with no power of ten, and a ratio r to the unquoted measurement of \
Ingersoll and Liebenberg): they are derived from dispersion formulas, not measured. \
The dielectric-constant column of Table VI ((k - 1) at 760 torr, 20 degrees C, twice \
the extrapolated n' - 1) has no quantity of its own; its polarizability column is \
extracted. Table VI's alpha follows from (k-1) by Clausius-Mossotti with the ideal-gas \
density at 760 torr, 20 degrees C (6.462e-5 gives 0.2054e-24 cm^3; checked \
2026-09-24)."""

