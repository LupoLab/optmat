citation = "G. Liggett and J. S. Levinger, J. Opt. Soc. Am. 58, 109 (1968)"
doi = "10.1364/josa.58.000109"
library = "Liggett_1968_CalculationIndexRefraction"
identity = "VALIDATED_WITH_WARNINGS"
kind = "theory"
technique = """Kramers-Kronig calculation of delta(E) = Re(n - 1) of neon and argon from \
photoabsorption cross sections (Ederer and Tomboulian, Samson, Lukerskii, Allen) and \
calculated discrete oscillator strengths (Cooper, Sewell; for Ar 3p-4s the average \
0.28 of Cooper, Knox, Geiger, Stacey and Vaughan), scaled so that the TRK sum rule and \
the accepted static polarizability are reproduced; x-ray region by Parratt and \
Hempstead's integrals over power-law cross sections."""
notes = """Scaling (pp. 2-3): for neon the discrete strengths were multiplied by 0.85 and the \
continuum by 0.96; for argon all but the 3p-4s strength by 1.04. The corrected neon \
oscillator strengths (p. 2) are 2p-3s 0.138, 2p-4s 0.022, 2p-5s 0.008, 2p-3d 0.032, \
2s-3p 0.067, 2s-4p 0.024, 2s-5p 0.011; argon (p. 3): 3p-4s 0.28, 3p-3d,5s 0.239, \
3p-4d,6s 0.127, 3p-5d,7s 0.071. These are not extracted as datasets because the paper \
prints no transition wavelengths (the package keys an oscillator strength to its \
wavelength); they are recorded here. Figures 1-6 (delta(E) from 0.1 to 1000 Ry) are \
not digitised.

Tables IV and V give delta(E) x 10^8 of neon (302-502 Ry: -1.09 ... -0.40 'normal', \
-1.13 ... -0.40 this paper, -1.13 ... -0.41 Parratt) and argon (20-4246 Ry: e.g. at 20 Ry \
-441., -107., -124.; at 1415 Ry -0.090, -0.091, -0.091) in the x-ray region, where \
n - 1 is negative; the 'normal' column is the free-electron term -CZN/E^2 (Eq. (7)). \
They are not extracted: the package's refractivity datasets must imply a positive \
polarizability. Accuracy: the results 'generally agree with existing theoretical \
calculations and experimental measurements to within 10 %' (abstract); the cross \
sections are 'known experimentally to an accuracy of about 5 %'. The library marks \
Table II's caption as unmatched (CAPTION_UNMATCHED): it is printed in the text above \
the table."""

[[datasets]]
id = "mu4_cuthbertson_Ne"
material = "Ne"
file = "Ne/liggett_1968__mu4_cuthbertson_Ne.csv"
table = "tbl_699c13f7b3b4"
quantity = "cauchy_moment"
unit = "au"
scale = 16
abscissa = "order"
abscissa_unit = "1"
use = "reproduced"
reproduced_from = ["cuthbertson_1910", "cuthbertson_1932"]
notes = "Table II, the negative fourth moment mu_-4 = sum f E^-4 + R int sigma E^-4 dE with energies in rydbergs (Eq. (2)); since E(Ry) = 2 E(hartree), S(-4) in atomic units is 16 mu_-4 (scale 16; e.g. argon's 1.76 x 16 = 28.16, Langhoff and Karplus's S(-4)). 'Determined from the index of refraction, see Refs. 3, 4 and Eq. (3)' (note a): the Cauchy slope of C. and M. Cuthbertson's visible data, 'whose accuracy is about 10 %' (p. 1)."

