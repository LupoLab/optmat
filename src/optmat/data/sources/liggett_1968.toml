check = "Not checkable against printed values (the cross sections enter only the Kramers-Kronig integral)."
notes = "Photoionisation cross-section power law sigma = A E^-p used above 11 Ry for neon (compiled by Piech and Levinger 1964, Ref. 10; Table I note b); Table I note a: 'Allen, Ref. 16 and Lukerskii, Ref. 15'. Not a refractivity formula; recorded because the x-ray refractivities of Tables IV-V follow from it through Parratt and Hempstead's integrals."

