[[formulas]]
id = "free_carrier_index_1550"
material = "Si"
equation = "Eq. (18), p. 16615"
printed = "n_f(\\omega_r, N_e, N_h) = -(8.8 \\times 10^{-4} N_e + 8.5 N_h^{0.8}) \\times 10^{-18}"
variable = "N_e, N_h: electron and hole densities in cm^-3; at lambda_r = 2 pi c/omega_r = 1550 nm"
coefficients = { electron = "8.8e-4", hole = "8.5", hole_exponent = "0.8", scale = "1e-18" }
check = "The paper's statements follow (computed 2026-09-26): the hole term over the electron term is 3.85 at 1e17 cm^-3 and 6.1 at 1e16 cm^-3 (printed 'about 3.8 and 6.1'); with holes taken as 5 times the electron term, sigma_n = -6 x 8.8e-22 = -5.3e-21 cm3 (printed zeta ~ -5.3e-21 cm3)."
notes = "Reproduced from Soref and Bennett (IEEE J. Quantum Electron. 23, 123 (1987); Proc. SPIE 704, 32 (1987)), refs. 81 and 135, 'it is common to employ the following empirical formulas'. For TPA-generated carriers (N_e = N_h = N), Eq. (20): n_f = sigma_n N with sigma_n = zeta (omega_r/omega)^2, zeta ~ -5.3e-21 cm3 (the paper's assumption that holes contribute 5 times the electrons)."

[[formulas]]
id = "free_carrier_absorption_1550"
material = "Si"
equation = "Eq. (19), p. 16615"
printed = "\\alpha_f(\\omega_r, N_e, N_h) = (8.5 N_e + 6.0 N_h) \\times 10^{-18}"
variable = "N_e, N_h: electron and hole densities in cm^-3; alpha_f in cm^-1; at 1550 nm"
coefficients = { electron = "8.5", hole = "6.0", scale = "1e-18" }
check = "With N_e = N_h = N it gives alpha_f = 1.45e-17 N cm^-1, the printed sigma_a = 1.45 x 10^-17 cm2 of Eq. (20) at omega = omega_r (computed 2026-09-26)."
notes = "Reproduced from Soref and Bennett (refs. 81, 135). Eq. (20): alpha_f = sigma_a N, sigma_a = 1.45 x 10^-17 (omega_r/omega)^2 cm2, the Drude lambda^2 scaling applied to the empirical coefficient."
