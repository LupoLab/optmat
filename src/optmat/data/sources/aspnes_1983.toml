citation = "D. E. Aspnes and A. A. Studna, \"Dielectric functions and optical parameters of Si, Ge, GaP, GaAs, GaSb, InP, InAs, and InSb from 1.5 to 6.0 eV\", Phys. Rev. B 27, 985-1009 (1983)"
doi = "10.1103/PhysRevB.27.985"
library = "Aspnes_1983_DielectricFunctionsOptical"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Spectroscopic ellipsometry, 1.5-6.0 eV, with an automatic rotating-analyzer \
ellipsometer (RAE): 75 W Xe short-arc lamp, 0.4 m Cary 14 prism-grating monochromator \
(12 A FWHM at 2537 A to 22 A at 4915 A), quartz Rochon prisms, polarizer at 30 deg, \
angle of incidence 67.08 +- 0.01 deg, calibration and alignment to +-0.03 deg (pp. \
2-3). The pseudodielectric function <epsilon> is calculated from the measured complex \
reflectance ratio in the two-phase (substrate-ambient) model, Eq. (2), 'without regard \
to the possible presence of overlayers' (p. 4): rather than correct for overlayers, the \
surfaces were chemically stripped in a windowless cell under dry N2 while their \
<epsilon_2> at the E2 peak was watched in real time ('biggest-is-best'), and measured \
with accretion of order 1 A/h (p. 3). The ac/dc ratios were scaled by a factor rising \
linearly from about 0.998 at 1.5 eV to 1.000 at 3000 A (the RAE ratio artifact, p. 5). \
n, k, R and alpha are calculated from <epsilon>."""
notes = """Pdf pages 1-25. Identity: the library's record is VALIDATED_WITH_WARNINGS (a \
2011 date hint in the pdf, the download date); title, authors, journal, volume and \
pages agree with the first page.

WHAT IS PRINTED. Tables II-IX (one per material) print against the photon energy E \
(eV), 1.500-6.000 eV in 0.100 eV steps (46 rows): <epsilon_1>, <epsilon_2>, n, k (three \
decimals), R (three decimals) and 10^3 alpha (cm^-1) (two decimals; the column is \
alpha in units of 10^3 cm^-1). Table I gives each sample's orientation, doping, \
pretreatment and final polish. The temperature is not stated (room temperature: the \
GaP section quotes 'the direct gap, which occurs at 2.76 eV at room temperature', p. \
11). The values are pseudodielectric functions 'reported as observed with no \
corrections made for possible surface overlayer or substrate damage effects' (p. 2), \
except epsilon_2 below the direct thresholds of Si and GaP. Extracted: Si (Table II), \
Ge (III), GaAs (V), GaSb (VI) and InP (VII), the registered materials, as n and k \
(primary) and <epsilon_1>, <epsilon_2> (checks). GaP (IV), InAs (VIII) and InSb (IX) \
are not registered and not extracted.

SILICON (pp. 5-9). <111> surfaces 'because we could prepare more abrupt interfaces on \
these surfaces' (p. 9, of Ge 'as with Si'). '... we have replaced our <epsilon_2> data \
below 1.93 eV with values calculated from our results for n and from the absorption \
coefficient data of Dash and Newman (DN). Between 1.93 and 2.84 eV, the data are a \
linear interpolation between our <epsilon_2> data and those calculated from Ref. 48, \
with a weighting factor that changes from 0 to 1 over the range' (p. 6; Ref. 48 = W. C. \
Dash and R. Newman, Phys. Rev. 99, 1151 (1955), not in the library). So k and \
epsilon_2 at 1.5-2.8 eV are excluded rows. A point-by-point scaling also brought \
epsilon_2 to about 0 below the direct onset before the replacement (p. 5). ACCURACY: \
the third-derivative noise near 5.3 eV is +-0.1 % of the E1 structure (p. 7, Fig. 4); \
<epsilon_1> and <epsilon_2> are Kramers-Kronig self-consistent 'to within +-0.5 %', \
with structures of 0.2 % near E1 (3.4 eV) and E2 (4.2 eV) (p. 7, Fig. 5); the peak \
<epsilon_2> is 46.80 at 4.25 eV (p. 7). The conclusion (p. 23): 'these <epsilon> data \
are approaching the intrinsic bulk values. Consequently, we do not anticipate \
significant further changes, certainly no more than 5% and probably no more than 1 or \
2%.' No uncertainty is recorded on the datasets: the paper states a precision and a \
self-consistency, not an accuracy, and the residual surface layer is a systematic \
offset (herzinger_1998: the Si table behaves as if it retained 0.18 nm of SiO2, from \
oxide thicknesses fitted with it; jellison_1992's k is below this table's under 3.4 \
eV, 0.296 against 0.387 at 400 nm). Single-wavelength values quoted in the text: n = 4.097 at 5461 A and \
n = 3.881 at 6328 A (p. 8), <epsilon> = 35.76 + i34.98 at 3650 A (3.397 eV), 23.40 + \
i1.78 at 4358 A and 4.51 + i44.16 at 2967 A (p. 9), peak R 0.744 at 4.56 eV (p. 9).

CHECKS (2026-10-14). Table II was compared with its image cell by cell, and every row \
of the five extracted tables with its redundant columns: epsilon = (n + ik)^2 holds \
within the printed rounding in every row, R = |(N - 1)/(N + 1)|^2 within its rounding, \
and alpha = 4 pi k E/(hc) within the rounding of epsilon_2 (alpha is computed from \
unrounded k), except Si at 3.100 eV: <epsilon_2> is printed 4.321 (image checked), but \
the row's n = 5.570, k = 0.387 give 2nk = 4.311 (4.305-4.317 over their rounding), and \
its alpha = 121.62 x 10^3 cm^-1 requires k = 0.38708, i.e. epsilon_2 = 4.3120 with \
the printed epsilon_1 (4.321 would give k = 0.3879 and alpha = 121.87): a transposition \
of 4.312, corrected by an erratum. The remaining discrepancies are ties at the half \
unit (Ge 5.2 eV n, k; Ge 6.0 eV n; GaAs 4.0 eV k, 4.5 eV n; GaSb 5.4 eV n; InP 2.6 eV k: \
sqrt(<epsilon>) is x.xxx5). The energy grid is checked by the script.

COMPARISONS (2026-10-14). The refractiveindex.info page Si/Aspnes (46 rows, wavelength \
in um from 1239.84/E to four figures, n and k as printed here) is this table: its n \
and k equal Table II's in every row. Jellison 1992's Table 2 compares his (100) \
values with 'Ref. [4]' (Edwards in Palik's Handbook, which takes the Si data in this \
region from Aspnes and Studna): its 400 nm row, n = 5.570, k = 0.387, is this table's \
3.100 eV row. Both Jellison (Ref. 3) and Herzinger et al. (Ref. 1) cite Aspnes and \
Studna's Si as 'Phys. Rev. B 27, 7466 (1983)', not this paper's 985; that paper is not \
in the library."""

