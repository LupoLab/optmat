citation = "B. L. Jhanwar and W. J. Meath, \"Dipole oscillator strength distributions, sums, and dispersion energy coefficients for CO and CO2\", Chem. Phys. 67, 185 (1982)"
doi = "10.1016/0301-0104(82)85033-7"
library = "Jhanwar_1982_DipoleOscillatorStrength"
identity = "VALIDATED_WITH_WARNINGS"
kind = "compilation"
technique = """Constrained dipole oscillator strength distributions (DOSDs) as in Zeiss et al. \
(1977): measured photoabsorption and fast-electron energy-loss data (CO: Sun and \
Weissler, Huffman et al., Cairns and Samson, Cook et al., Lee et al., Watson et al., \
Samson and Gardner, the 1976 dipole (e,e) data of Ref. [17], de Reilhac and Damany, \
Cole and Dexter; CO2: Inn et al., Nakata et al., Cairns and Samson, Cook et al., Lee \
et al., Watson et al., de Reilhac and Damany, Hitchcock et al., Person and Nicole), \
mixture rules sigma(CO) = sigma(C) + sigma(O2)/2 and sigma(CO2) = sigma(C) + sigma(O2) \
at high energy (Eqs. (1)-(2)), the Born formulae above 1e9 eV, and for CO2 the \
infrared bands (0.0827, 0.2913, 0.4481, 0.4607 eV) from Thorndike's and Eggers and \
Crawford's band intensities. The initial DOSDs (24 regions for CO, 21 for CO2) are \
adjusted by weighted least squares to the TRK sum rule and molar refractivities: CO at \
5462 A (Watson and Ramaswamy) and 1672 A (Smith et al.); CO2 at 6440 A (Watson and \
Ramaswamy) and 2379 A (Koch), and for the total DOSD also Newell and Baird's \
refractive index at 6280.2e4 A (47.736 GHz). The recommended DOSD is the one of least \
total adjustment (pp. 186-188)."""
notes = """Values per molecule. The UV (electronic, 'UV and higher energy') DOSDs exclude the \
vibrational transitions; the CO2 'total' DOSD includes the infrared bands. Sums S_k = \
integral of (E/2R)^k df/dE (Eq. (5)), atomic units; S_-2 is the static polarizability \
in a0^3. The tables print powers of ten in parentheses (13.79(3) = 13.79e3); stored in \
e-notation, digits unchanged.

Constraints (p. 186): the refractivity values used are not printed; Watson and \
Ramaswamy (watson_1936) for CO and CO2, Smith, Huber and Parkinson (1976, smith_1976) \
for CO at 1672 A, Koch (1913) for CO2 at 2379 A, Newell and Baird (1965) for CO2's \
microwave index. So the sums are not independent of those data (as kumar_1985): \
checks. Accuracy (p. 191): 'the S_k corresponding to the UV and higher photon energy \
part of the DOSD are very reliable until k < -8 while the S_k evaluated with the total \
DOSD for CO2 probably become less reliable for the larger negative values of k'; the \
error estimates of the earlier work assume refractivity constraints reliable to a few \
tenths of a per cent; no numbers are given here. Molar refractivities from the DOSDs \
(Figs. 1-3, figures only): CO within 0.01 % of the experimental data except Smith et \
al. (up to 0.3 % above); CO2 (UV DOSD) within 0.03 % of Cuthbertson, Koch, and Watson \
and Ramaswamy (2379-6709 A); Old et al.'s and Bideau-Mehu et al.'s CO2 refractivities \
'should be lowered by 0.67%' (their second virial coefficient B = 0.22 cm^3/mol at \
273.2 K is too small; here -149.7 cm^3/mol), after which Old et al.'s agree to 0.06 % \
in the visible (p. 189); Wetterblad's are up to 1.5 % high.

Tables 1 and 2 (pp. 187-188; Table 1's caption is printed in the text above it and is \
not attached in the extraction): the recommended DOSDs integrated over energy regions \
(eV) (interval datasets, checks); CO sums to 14.002, CO2 UV to 22.0015, CO2 total \
(with the infrared 0.000155) to 22.0017 (checked 2026-09-27). The initial-data columns \
(one value per reference, several per cell) are not extracted. Table 2's last lower \
edge is illegible in the scan (extracted '10^2'); it is 10^4 (structural, the regions \
being contiguous). Table 2's IR row: 0.000155 from Thorndike (0.0827, 0.2913 eV bands) \
and Eggers and Crawford (0.4481, 0.4607 eV) (note a); 0.000135 and 0.000123 (Eggers \
and Crawford for all bands, note b) are initial values, not extracted.

Tables 3 and 4 (pp. 191, 192): recommended S_k (k = 2, 1, -1, -2, -3, -4, -6, -8, -10) \
and literature values: the SCF sum-rule values of Mulder and Meath (1981; a), the \
Cauchy moments of Parker and Pack (CO; b) and Pack (CO2; b), Watson and Ramaswamy's \
S_-2 (c), uncoupled Hartree-Fock (Liebmann and Moskowitz, CO; d) and Hartree-Fock \
(Morrison and Hay, CO2; d), and Mulder, Thomas and Meath's non-empirical Kirkwood and \
Unsold values (e; the pair 'X and Y', read as Unsold then Kirkwood, see \
tools/extract/jhanwar_1982.py). Table 4's 'S_-5' row is S_-8 (poor scan; reproduced by \
the pseudo-DOSD). Watson and Ramaswamy's CO2 'total' S_-2, 19.68, is from \
dielectric-constant measurements (p. 191); the text (p. 191) says the recommended \
total 19.79 is 'slightly higher (by about 0.6%)'. The paper's apparent errors of the \
Cauchy moments S_-4, S_-6, S_-8: CO -0.9, 7.5, 17.5 %; CO2 -3.4, 11.3, 16.5 %; Pack's \
CO2 total S_-2 is 0.6 % low because of 'an unnecessary correction for non-ideal \
behaviour' of Newell and Baird's index (p. 192).

Table 5 (p. 194): ten-term UV pseudo-DOSDs (E_i in units of 2R, i.e. hartree; f_i) \
fitted to S_k, k = 2 ... -17 (formulas pseudospectrum_CO, pseudospectrum_CO2), and in \
its footnote a fourteen-term total CO2 pseudo-DOSD (four IR bands and ten UV terms; \
formula pseudospectrum_CO2_total, one printed value corrected). They reproduce Tables \
3-4's sums (formula checks). Section 2.4 (pp. 192-193): Berkowitz's (1979) CO \
integrated strengths 0.483 (8.0-11.8 eV, Lassettre and Skerbele), 0.7921 and 0.8165 \
(12-14 eV, from Huffman et al. and Cook et al.), 2.386 and 1.479 (14-20.7 eV), against \
the authors' own integrations of the graphs, 0.494, 0.712, 1.88 and 1.54; Berkowitz's \
CO2 S_0 = 21.10 and S_-2 = 16.7 (preliminary) and his S_-1 13.48 and 14.59: in notes \
only.

Section 3 (pp. 193-197): C6 dispersion coefficients (Table 6: CO and CO2 with H2, N2, \
O2, CO, CO2, and Pade bounds; Table 7: Pade bounds for CO-CO and CO2-CO2 with mixed \
Cauchy/DOSD inputs; C6(CO-CO) = 81.40, C6(CO2-CO2) = 158.7, total with IR 161.3 \
hartree bohr^6): no quantity, not extracted.

olney_1997 quotes this paper's sums as its Meath DOSD comparison rows for CO and CO2 \
(see that record)."""

