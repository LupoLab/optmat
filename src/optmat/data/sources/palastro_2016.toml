unit = "m2/W"
scale = 1e-24
abscissa_unit = "nm"
state = { pressure_pa = 101325.0, temperature_k = 293.15 }
use = "reproduced"
reproduced_from = ["wahlstrand_2012", "zahedpour_2015"]
notes = "Table I, n2 = 9.3e-24 m2/W: as n2_N2 (sources 9.5 and 8.1 x 1e-20 cm2/W at 800 nm), vibrational part subtracted."
[datasets.parameters]
part = "electronic"
coefficient = "self"

