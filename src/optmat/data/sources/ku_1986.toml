citation = "J. K. Ku and D. W. Setser, \"Collisional deactivation of Xe(5p56p) states in Xe and Ar\", J. Chem. Phys. 84, 4304-4316 (1986)"
doi = "10.1063/1.450825"
library = "Ku_1986_CollisionalDeactivationXe"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Laser-induced fluorescence in a static Pyrex cell at 300 K: two-photon \
excitation of Xe 2p5, 2p6 and 2p9 (6p[1/2]0, 6p[3/2]2, 6p[5/2]2) from the ground state \
by a frequency-doubled (LFM crystal) Nd:YAG-pumped dye laser (Coumarin 500, about 10 ns, \
about 2 MW/cm2 in the loose focus, low enough to avoid multiphoton ionisation and \
stimulated emission); one-photon excitation of 2p7, 2p8 and 2p10 from Xe(1s5) made in \
the afterglow of a pulsed discharge (Raman-shifted dye laser). 6p -> 6s fluorescence \
through a 1 m monochromator onto a cooled Hamamatsu R632-01, digitised and averaged \
(about 3000 shots); detectivity calibrated with a tungsten-iodine lamp and for \
polarisation. Stern-Volmer plots of the single-exponential decay constants (intercept \
1/tau, slope k_Q) in xenon and, at 3.0 Torr xenon, in argon; state-to-state rates from \
kinetic simulations of the product time profiles with Aymar and Coulombe's branching \
fractions (velocity form); fluorescence polarisation after two-photon excitation with \
a Glan polariser."""
notes = """J. Chem. Phys. 84(8), 4304-4316 (15 April 1986) = PDF pages 2-14 (PDF page 1 \
is the AIP download cover; journal page = PDF page + 4302); a scanned (raster) PDF with \
an OCR text layer. Identity checked on the first page of the article (PDF p. 2: title \
'Collisional deactivation of Xe(5p56p) states in Xe and Ar', J. K. Ku and D. W. Setser, \
Kansas State University, received 30 December 1985, accepted 10 January 1986, footer J. \
Chem. Phys. 84 (8), 15 April 1986, 4304) on 2026-10-09. Tables I-III checked cell by \
cell against the table images (Table III also on the rendered page at 4x, for the \
stacked lines and the footnote marks), the equations (1a)-(2d) and (4a)-(5c) on the \
rendered pages.

LEVELS. Paschen notation in the text and rows, Racah beside it in the tables and Fig. \
1. NIST (src/optmat/data/external/nist_asd/Xe_I_levels.tsv): 2p5 = 6p[1/2]0 = \
5p5(2P*3/2)6p 2[1/2], J = 0 (80118.962 cm-1); 2p6 = 6p[3/2]2 = 2[3/2], J = 2 \
(79212.465); 2p7 = 6p[3/2]1 = 2[3/2], J = 1 (78956.031); 2p8 = 6p[5/2]3 = 2[5/2], J = 3 \
(78403.061); 2p9 = 6p[5/2]2 = 2[5/2], J = 2 (78119.798); 2p10 = 6p[1/2]1 = 2[1/2], J = 1 \
(77269.145); 1s2 = 6s'[1/2]1 = 5p5(2P*1/2)6s 2[1/2]*, J = 1 (77185.041); 1s3 = \
6s'[1/2]0, J = 0 (76196.767); 3d5 = 5d[1/2]1 = 5p5(2P*3/2)5d 2[1/2]*, J = 1 \
(79986.618; bruce_1990's 5d[1/2]1). Evidence: Fig. 1's twelve level energies (80119.47 \
for 2p5 ... 76197.29 for 1s3, 79987.16 for 3d5) exceed NIST's by a uniform 0.50-0.54 \
cm-1 (an older energy scale; script check), and the gaps the text quotes, 2p7 - 2p6 \
'256.4 cm-1' (p. 4312; NIST 256.434) and 3d5 '132 cm-1 below Xe(2p5)' (p. 4308; NIST \
132.344).

TAKEN (radiative_lifetime and collisional_quenching_rate_coefficient, TC-1011; \
extraction script tools/extract/ku_1986.py for the tables, inline points for the text), \
'This work' only, temperature 300 K ('at 300 K', abstract):
- Table I (p. 4307), in pure xenon: radiative lifetimes (ns) 2p5 32.6 +- 1.0, 2p6 36.0 \
+- 3.0, 2p7 36.7 +- 1.0, 2p8 32.3 +- 1.0, 2p9 39.3 +- 1.0, 2p10 38.2 +- 1.0 (tau_Xe, \
primary) and the total quenching rate constants k_Q (10^-11 cm3 molecule-1 s-1) 0.58 \
+- 0.05, 8.2 +- 0.5, 12.8 +- 0.4, 5.3 +- 0.3, 9.6 +- 0.3, 13.3 +- 0.5 (kq_self_Xe, \
primary; 2p10 from the fast component). The 'Slow component' after 2p10 excitation \
(footnote g), slope 3.4 +- 0.5 (kq_slow_Xe, check): the slope of the slow decay \
eigenvalue of the coupled 2p10 / 1s2 pair, not a level's removal coefficient (the \
coupled-pair caution of TC-1016); the text gives '3.5 +- 0.5 x 10^-10' for the same \
slope (p. 4307), a factor 10 and 0.1 apart from the table (doubt). Uncertainty level \
not stated ('The statistical uncertainty ... was less than 10%', 'reliable, +-20%', \
pp. 4307, 4313).
- Table II (p. 4309), in argon (3.0 Torr xenon): k_Ar 2p6 4.7 +- 0.5 and 2p9 8.2 +- \
0.5 (kq_Ar_Xe, primary); 2p5's fast and slow components, 14.0 +- 1.0 (footnote b) and \
(3.0 +- 0.5) (c) (kq_Ar_coupled_Xe, check: the slopes of the two decay eigenvalues of \
2p5 coupled to 3d5, as bruce_1990's kq_Ar_coupled_Xe); the radiative lifetimes from the \
argon intercepts less k_Xe [Xe], 2p5 30 +- 2, 2p6 34 +- 2, 2p9 37 +- 2 (tau_Ar_Xe, \
check: the paper offers them as a consistency check of Table I, p. 4308).
- Text pp. 4308-4309, Eqs. (1a)-(2c), the rate assignments 'satisfactory for fitting \
the decay constants and the amplitude ratio for Xe(2p5) decay' in argon (10^-11 cm3 \
molecule-1 s-1): 2p5 + Ar -> 3d5, 10.0 (k1a_Ar, primary) and -> other Xe(6p), 4.0 \
(k1b_Ar, primary), both 'reliable to +-20%'; 3d5 + Ar -> 2p5, 1.8 (k2a_Ar, check: from \
(1a) by detailed balance, script check) and -> other Xe(6p or 5d), 2.0 (k2b_Ar, check: \
'an unreliability ... of a factor of 2'); 3d5 + Xe -> other Xe(6p, 6s' or 6s), 9.5 \
(k2c_self, check: tied to the assumed 2 us effective lifetime of the trapped 3d5; the \
conclusions call it 'the total quenching rate constant for Xe(3d5) ... inferred'). Not \
taken: tau(2p5) = 32 ns and tau_eff(3d5) = 2 us (model inputs).
- Table III (p. 4310), the state-to-state rate constants by xenon, one dataset per \
product (channel), the rows the reactants: k_2p6_Xe ... k_1s3_6s_Xe (primary), the \
upper limits 2p6 -> 2p10 and 2p9 -> 1s2, '<0.2', held as the interval 0-0.2 (check). \
Eqs. (4a)-(5b) repeat the 2p10 and 1s2 rows.

NOT TAKEN: Table I's 'Others' column and the parenthesised k_Q (Refs. 7, 23-28; \
reproduced), the 1s3 row (Ref. 23) and the slow component's intercept 330 +- 10 ns \
(the coupled pair's, not a radiative lifetime); Table II's previous values (Refs. 7, 8); \
Table III's Gamma (k_ij / k_Q, script check) and tau columns (the simulations' rounded \
inputs); the figures (their slopes and intercepts are the tables'); the rate constants \
quoted for 6p' from Ref. 25 ('26-48 x 10^-11', p. 4307).
NOT TAKEN (no quantity; collisional_depolarization_rate_coefficient declined, TC-1040): the collisional \
depolarisation of two-photon aligned 2p6 and 2p9 by xenon, from the decay of the degree \
of fluorescence polarisation, 5.7 +- 0.6 x 10^-10 cm3 molecule-1 s-1 (p. 4306, Fig. 2b, \
both levels together; abstract '~6 x 10^-10'), and from the polarisation index (the \
alignment), 9.2 +- 2.5 x 10^-10 cm3 molecule-1 s-1, '(290 +- 80 A2)' (p. 4312); the \
zero-pressure degree of polarisation, -0.60 (p. 4306) or -0.62 +- 0.02 (p. 4312), \
against -1.0 without hyperfine structure (a hyperfine depolarisation; declined, TC-1011, \
as hyperfine constants and anisotropy parameters).

FINDING (lifetimes, ns; NIST 1/sum A over Xe_I_lines_nir.tsv, TC-985; bruce_1990 and \
bowering_1986b in brackets). 2p5 32.6 +- 1.0 (Ar intercept 30 +- 2), NIST 27.1 (one \
line, 828.24 nm, A = 3.69e7, B; [26.8 +- 0.8; 28 +- 1]): here 20 % longer than NIST and \
the other two. 2p6 36.0 +- 3.0 (Ar 34 +- 2), NIST 27.2 ([31.3 +- 1.8; 35 +- 3]): all \
experiments 15-32 % above NIST. 2p7 36.7 +- 1.0, NIST 37.0. 2p8 32.3 +- 1.0, NIST 33.3 \
(882.18 nm, A+). 2p9 39.3 +- 1.0 (Ar 37 +- 2), NIST 39.4 ([36.0 +- 2.8; 30 +- 4]). 2p10 \
38.2 +- 1.0, NIST 30.4 (bowering_1986b 43.8 +- 8.0). No 6p' or 7p level is measured, so \
the paper does not bear on bruce_1990's 6p' disagreement with NIST (TC-1003, TC-1010); \
where it overlaps, NIST's 1/sum A is too short by 25 % for 2p6 and 2p10 and agrees for \
2p7, 2p8 and 2p9.

FINDING (quenching, against bruce_1990 and bowering_1986b, 10^-12 cm3/s). By xenon: \
2p5 5.8 +- 0.5 (5.9 +- 0.5; 5.9 +- 3.3); 2p6 82 +- 5 (101 +- 3; 92.2 +- 4.7); 2p9 96 \
+- 3 (116 +- 3; 86.8 +- 5.9); 2p7 128 +- 4 (89 +- 26); 2p8 53 +- 3 (39.2 +- 4.4); 2p10 \
133 +- 5 (295 +- 48). By argon: 2p6 47 +- 5 (bruce 40 +- 2.0), 2p9 82 +- 5 (82 +- 4); \
2p5's fast component 140 +- 10 against bruce_1990's 200 +- 4.0 and the slow 30 +- 5 \
against 5.9 +- 0.4, and the state-to-state 2p5 -> 3d5 100 (+-20 %) against k12 = 170 \
+- 3, 2p5 -> other 40 against k10 = 13 +- 6, 3d5 -> 2p5 18 against k21 = 30 +- 1, 3d5 \
-> other 20 against k20 = 4.6 +- 1.6: Ku and Setser's 2p5/3d5 scheme rests on 3-10.6 \
Torr argon, an assumed 2 us 3d5 lifetime and a large 3d5 + Xe rate (95, against \
bruce_1990's measured 197 +- 26); bruce_1990's covers up to 400 Torr and supersedes it. \
Detailed balance: 3d5 -> 2p5 = (1/3) exp(-132.34 cm-1 / kT) (2p5 -> 3d5) gives 1.77, \
printed 1.8 (script check).

BEARING ON OEP 8 (scale only): the depolarisation rate constants, 5.7-9.2 x 10^-10 \
cm3/s, are about 60-110 times 2p5's quenching by xenon and 6-10 times the other 6p \
levels'; elastic collisions dominate the 6p levels' collisional relaxation, as \
bowering_1986b says for the linewidths. Neither paper measures the pressure broadening \
of the two-photon line (gornik_1981's 25 +- 15 MHz/Torr for 2p5, from Hawkins et al., \
is 2.4e-9 cm3/s as a 1/T2 rate at 296 K, for scale).

TWO-PHOTON DATA CITED, NOT IN THE LIBRARY: G. Inoue, J. K. Ku and D. W. Setser, J. \
Chem. Phys. 81, 5760 (1984) (Ref. 7; lifetimes of 22 Xe 6p, 6p', 7p and 6d levels in Ne \
and Ar: the independent 6p' and 7p lifetimes to test bruce_1990 against NIST); H. \
Horiguchi, R. S. F. Chang and D. W. Setser, J. Chem. Phys. 75, 1207 (1981) (Ref. 8; \
printed '15, 1207'); R. T. Hawkins, H. Egger, J. Bokor and C. K. Rhodes, Appl. Phys. \
Lett. 36, 391 (1980) (Ref. 13, the first two-photon excitation of 2p5); X. Husson and \
J. Margerie, Opt. Commun. 5, 139 (1972) (Ref. 27/33, zero-field level-crossing dealignment); T. Suzuki and \
K. Shimoda, J. Phys. Soc. Jpn. 43, 233 (1977) (Ref. 28). Held: gornik_1981 (Ref. 14), \
raymond_1984 (Ref. 15), mccown_1982 (Ref. 24)."""

