citation = "D. Franta, D. Nečas, I. Ohlídal and A. Giglia, \"Dispersion model for optical thin films applicable in wide spectral range\", Proc. SPIE 9628, 96281U (2015)"
doi = "10.1117/12.2190104"
library = "Franta_2015_DispersionModelOptical"
identity = "VALIDATED"
kind = "fit"
technique = """The universal dispersion model (UDM) fitted to multi-instrument ellipsometry \
(Woollam IR-VASE 0.037-0.8 eV; Jobin Yvon UVISEL 0.6-6.5 eV and UVISEL2 VUV 0.6-8.7 \
eV) and spectrophotometry (Bruker Vertex 80v FIR 80-680 and MIR 370-7500 cm-1; Perkin \
Elmer Lambda 1050 NIR and UV-VIS; McPherson VUVAS 2000 3.3-10.8 eV; Elettra BEAR 9-50 \
eV for MgF2 and SiO2) of six evaporated films on silicon (Leybold SYRUSpro DUV, Meopta \
samples): MgF2 X2935, SiO2 X2551, Al2O3 X2890, HfO2 X2194, Ta2O5 X2656, TiO2 X2801 \
(Tables 1-3, pp. 2-3)."""
notes = """Proceedings pages 96281U-1 to -12 = PDF pages 1-12, cited below as p. N. Identity \
checked against the first page. This is the only paper of the set that prints the \
complete analytic UDM of 2015 (every term's imaginary part, real part and \
normalisation); franta_2015 (Appl. Opt., the hafnia paper) points to other papers for \
several of these. The films' parameters are not printed ('will be presented \
elsewhere', p. 8), and n, k are figures only (Figs. 6-12); for three films the authors' \
newAD2 site publishes the parameter file and the computed n, k table under this \
citation, recorded here as datasets and formulas.

UDM EQUATION MAP (p. = PDF page). Eq. (1), p. 2: eps = 1 + N_vc eps0_vc + N_vx eps0_vx + \
N_ut eps0_ut + sum_p N_loc,p eps0_loc,p + sum_p N_ph,p eps0_ph,p. Eq. (2), p. 3: F_j = N_j \
eps0_i,j E, J_j = N_j eps0_i,j E^2. Eq. (3): normalisation int_0^inf eps0_i,j E dE = 1 (so \
every N_j is a transition strength in eV^2).
- IBT, symmetric term vc0 (p. 3-4): Eq. (4) J_vc0 = (N_vc0/C_N)(E - E_g)^2 (E_h - E)^2 \
Pi_{Eg,Eh}(E); Eq. (5) C_N = (E_h^2 - E_g^2)[(E_h^2 + E_g^2)/12 - 2 E_g E_h/3] + E_g^2 E_h^2 \
ln(E_h/E_g); Eq. (6) Pi the unit box; Eq. (7) eps0_i = (E - E_g)^2 (E_h - E)^2 Pi/(C_N E^2); \
Eqs. (8)-(12) eps0_r = [a ln|(E_h - E)/(E_g - E)| + b ln|(E_h + E)/(E_g + E)| + c]/(pi C_N E^2), a = \
y - x, b = y + x, x = 2E[E_h(E_g^2 + E^2) + E_g(E_h^2 + E^2)], y = E^2(E_h^2 + E_g^2 + 4 E_g E_h + E^2) + \
E_g^2 E_h^2, c = -2 E_g^2 E_h^2 ln(E_h/E_g) - 3(E_h^2 - E_g^2) E^2.
- EXCITONS (Lorentz-modified IBT), p. 4-5: Eq. (13) J_ex = N_ex (E - E_g)^2 (E_h - E)^2/(C_N \
[(E - E_c)^2 + B_c^2]) Pi; Eq. (14) eps0_i; Eq. (15) eps0_r (same form as Eq. (8), labelled \
'eps0_r,vc' in print); Eqs. (16)-(25) the modified C_N, a, b, c, d, e, delta, eta and \
alpha = E_c^2 + B_c^2, beta = E_g + E_h, gamma = E_g^2 + E_h^2, A (two arctangents), L (a \
log ratio). Combination Eq. (26), p. 5: eps0_vc = (1/C_N)[A_0 eps0_vc0 + sum_p A_p \
eps0_ex,p] with C_N = sum_p A_p (Eq. (27)); one A fixed.
- HET (vx), p. 5-6: Eq. (28) J_vx = N_vx 3 E_xi (E - E_xi)^2/E^3 Pi_{E_xi,inf}(|E|), E_xi = E_x + \
E_g/2; Eq. (29) eps0_i = 3 E_xi (E - E_xi)^2 Pi/E^5; Eqs. (30)-(31) eps0_r = (3 E_xi/(pi E^2))[a \
ln|1 - E/E_xi| + b ln|1 + E/E_xi| - 2/(3 E_xi) - 2 E_xi/E^2], a = -(E_xi - E)^2/E^3, b = (E_xi \
+ E)^2/E^3.
- URBACH TAIL (ut), p. 6-7: Eq. (32) the four-piece JDOS (exp((|E| - E_g)/E_u) on (E_g/2, \
E_g); 1 + (E_m - E_g)/(4 E_u) - (2|E| - E_m - E_g)^2/(4 E_u (E_m - E_g)) on (E_g, E_m); \
exp((E_m - |E|)/E_u) on (E_m, E_m + E_g/2); minus exp(-E_g/(2 E_u)) on (E_g/2, E_m + E_g/2)), \
E_m = E_g/2 + E_h/2 (Eq. (33)); Eq. (34) eps0_i = {...}/(C_N E^2); Eq. (35) eps0_r with the \
scaled exponential integral; Eq. (36) C_N; Eqs. (37)-(39) a, b, x, y, c; Eq. (40) Ei(x) = \
int_-inf^x e^t/t dt and Ei~(x) = e^-x Ei(x).
- LOCALISED STATES (loc), p. 7-8: Eq. (41) eps0_i,p = [exp(-(E - E_p)^2/(2 B_p^2)) - exp(-(E \
+ E_p)^2/(2 B_p^2))]/(sqrt(2 pi) B_p E_p); Eq. (42) eps0_r,p = -(sqrt(2)/(pi B_p E_p))[D((E - \
E_p)/(sqrt(2) B_p)) - D((E + E_p)/(sqrt(2) B_p))]; Eq. (43) D the Dawson integral; Eq. (44) \
the JDOS; Eq. (45) the sum over n_loc peaks, parameters N_loc,p, E_loc,p, B_loc,p (B the \
rms, eV). This is the eps-broadened delta line of franta_2014 Eq. (40).
- PHONONS (ph), p. 8: the same Gaussian with E_p = h c nu_p and B_p = h c beta_p/(2 sqrt(2 ln \
2)) (Eq. (46): nu_p the position and beta_p the FWHM, both in cm^-1); Eq. (47) the sum \
over n_ph peaks. (The text's last parameter name 'beta_loc,p' after Eq. (47) means \
beta_ph,p.)

CHECK (scratch, 2026-09-26, 30-50 digit arithmetic): for every term the printed \
normalisation constant equals the numerical integral of the JDOS/E (vc0, ex, ut: to 25 \
digits), each unit-strength term integrates to 1, and each printed real part equals the \
numerical Kramers-Kronig transform of its imaginary part (to 1e-22 or better, at 0.05, \
3, 7.5 and 25 eV). The 2015 formulas are therefore self-consistent. They do NOT \
reproduce the newAD2 tables recorded below from the matching parameter files: with the \
.par parameters and Eqs. (1)-(47) (vc as in Eq. (26)), the phonon-region k agrees to \
0.1-1 %, but n in the transparent region is 0.003 (MgF2), 0.006 (Al2O3) and 0.013 (SiO2) \
too high, and k in the Urbach region is 2.5-2.6 times the table's (Al2O3 at 6.31 eV: \
0.0156 against 0.00619; MgF2 at 6.31 eV: 3.1e-4 against 1.2e-4). The alternative \
exciton convention of franta_2015 Eq. (16) is worse (n off by 0.02-0.06). The newAD2 \
program behind the published tables evidently implements a later form of the \
interband and Urbach terms (Franta, Vohanka and Cermak, 'Universal dispersion model \
for characterization of thin films over wide spectral range', Springer Series in \
Surface Sciences 64, 31 (2018); Franta et al., Thin Solid Films 631, 12 (2017); neither \
in the library) (TC-387).

NOT EXTRACTED: HfO2 X2194, Ta2O5 X2656 and TiO2 X2801 (figures only; no newAD2 files \
fetched for them); Table 1 deposition conditions (nominal thickness, substrate \
temperature, rate): MgF2 120 nm, 300 C, 1 nm/s; SiO2 800 nm, 300 C, 1 nm/s; Al2O3 120 \
nm, 150 C, 0.5 nm/s; HfO2 120 nm, 150 C, 0.5 nm/s; Ta2O5 200 nm, 25 C, 0.25 nm/s; TiO2 100 \
nm, 150 C, 0.3 nm/s (p. 2). The SiO2 X2551 film is also modelled in franta_2016 (Proc. \
SPIE 9890, 2016) with a later parameter set: the two are different fits of the same \
sample."""

