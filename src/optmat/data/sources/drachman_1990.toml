m_zz_per_unit = 1.3333333333333333
method = "pseudostate summation, N0 = 15 eigenvectors of H0 in the basis exp(-a r) r^(1+j) P1, a = 1, eigenvalues in the denominators; non-relativistic, infinite nuclear mass"

[[datasets]]
id = "D3_N15"
material = "H"
file = "H/drachman_1990__D3_N15.csv"
table = "tbl_a9b929131d75"
quantity = "two_photon_transition_amplitude"
unit = "1"
abscissa = "wavelength"
abscissa_unit = "rydberg"
use = "check"
notes = "Table IV, column D3, the third line of each omega (N0 = 15, a = 1). The commutator form is exact only for true eigenstates; with pseudostates it converges more slowly (the text): 2e-6 to 3e-6 relative from the exact amplitude at N0 = 15. Kept as a check, not fitted beside D1 and D2. x and row: omega, one photon's energy as printed (rydberg)."
[datasets.parameters]
