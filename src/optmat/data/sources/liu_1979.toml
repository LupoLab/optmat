citation = "P. Liu, R. Yen, and N. Bloembergen, \"Two-photon absorption coefficients in uv window and coating materials\", Appl. Opt. 18, 1015-1018 (1979)"
doi = "10.1364/ao.18.001015"
library = "Liu_1979_TwoPhotonAbsorption"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """The set-up of liu_1978 (Ref. 3): single 30-ps (average) pulses from a mode-locked \
Nd:YAG oscillator, amplified, frequency-tripled (355 nm) or quadrupled (266 nm), \
separated by a dispersive prism; energy transmission against peak input intensity of \
a Gaussian beam, fitted with Eq. (8) (reflection R and linear absorption alpha \
included; R from the low-intensity transmission, 'The published data on the index of \
refraction of these materials in this region are quite limited', p. 1017), with the \
tau-A pulse normalisation (Eqs. 11-13). New: an automatic data acquisition with an HP \
9820A calculator and cascaded sample-and-hold circuits (Figs. 1-2): 'the transmission \
can be measured with a standard deviation of 0.4%. At a maximum intensity level of few \
GW/cm2 and sample thickness of 5 mm, two-photon absorption coefficients of a few times \
10^-6 cm/MW can be measured' (p. 1017). Bulk single crystals about 5 mm thick, \
oriented by x-ray diffraction: SrF2, BaF2, CdF2 from Optovac, MgF2 from Harshaw, \
LiYF4 from Sanders Associates; fused silica. Linear polarization (the polarization \
dependence studied by rotating the crystal; circular light by a quartz quarter-wave \
plate)."""
notes = """Journal pages 1015-1018 = pdf pages 1-4 (journal page = 1014 + pdf page). \
Identity checked against the first page. The last page mixes the journal's meetings \
calendar with the references.

DEFINITION OF beta: as liu_1978, the two-photon coefficient of dI/dz = -alpha I - beta \
I^2 with the surface reflection removed (Eqs. 7-10); Eq. (2), gamma_N = N hbar omega \
W/I^N; Eqs. (4)-(6) relate beta to chi''(3) for [100], [110] and circular polarization \
(as liu_1978's Eqs. 6-8). beta in cm/MW (Table I).

TABLE I (tbl_14fb6f23a7e6, p. 1017; image checked, all cells agree). beta at 355 and \
266 nm and the band gap. Upper bounds ('<') are kept as excluded datasets. The \
uncertainties: footnote b (fused silica) 'The uncertainty shown here only counts the \
scattering of the data. For absolute value, a systematic uncertainty +-43% should be \
added'; text (p. 1017): 'The main uncertainty in the absolute value ... is from the \
calibrations and the saturation of the conversion efficiency in the tau A technique. \
It was estimated to be +-43%. However, the uncertainty in the relative values ... is \
quite small. It is due to the scattering of the data points and ranges from +-5% to \
+-20%.' Recorded: relative = the printed %, systematic_relative = 0.43, level not \
stated. Detection limit: 'In materials with band gaps larger than 2 hbar omega, the \
nonlinear absorption is below the detection limit of 3 x 10^-6 cm/MW' (abstract).

FUSED SILICA AT 266 NM (p. 1017): 'The two-photon absorption coefficient of fused \
silica at 266 nm is measured to be 1.7 x 10^-5 +- 20% cm/MW. Previously it was reported \
to be on the verge of the earlier detection limit of 4.5 x 10^-5 cm/MW' (liu_1978's \
Table II value, recorded there as check). This value supersedes it.

BAND GAPS. 'Band gaps are listed when available' (footnote a); no source is given in \
the table. The text (p. 1017): 'BaF2, with a published band gap of 9.06 eV (Ref. 13: \
W. H. Strelow [Strehlow] and E. L. Cook, J. Phys. Chem. Ref. Data 2, 163 (1973)), does \
not show two-photon absorption at 266 nm, and no band gap information of SrF2 is \
available. Apparently, accurate measurements of band gaps in these materials are \
needed.' SrF2's gap is printed '?' (not recorded); CdF2 '~6' and LiYF4 '~11' are \
approximate (the tilde stays in printed). taylor_1988 quotes this paper's doubt about \
BaF2's gap.

CdF2 (p. 1017): 'our CdF2 sample displayed a two-photon absorption coefficient, which \
is highly frequency dependent. It increased by a factor of 38 in going from 355 nm to \
266 nm' (1.60e-3/4.17e-5 = 38.4, computed). 'Our CdF2 sample had a low intensity \
transmission of 83% at 355 nm and 63% at 266 nm, which is much higher than the \
published data' (Ref. 12).

POLARIZATION (p. 1017): at 266 nm in NaCl, for light along [001] polarized along [100] \
or [110], and for circular light, 'no change in the two-photon absorption coefficient \
is observed' (no value printed): the isotropy condition 2 chi''_xxyy + chi''_xyyx = \
chi''_xxxx holds and chi''_xyyx is small; 'Similar results have been observed in RbI \
at 355 nm'. (liu_1978 found circular light smaller in RbI.)

KELDYSH FORMULA. Eqs. (1)-(3) (p. 1015) repeat liu_1978's Eqs. (3)-(4) with the \
exponent printed exp[2<Delta/hbar omega + 1>(2 - Delta/E_g)] (equal to liu_1978's \
exp[2N(1 - e^2E^2/4m*omega^2E_g)] to first order) and without the leading omega in \
Eq. (1); no new parameters are fitted here. See liu_1978 (formula keldysh_gamma_n).

FIGURES (not digitised). Fig. 1: block diagram of the data acquisition. Fig. 2: its \
circuits.

REPRODUCTIONS OF THIS PAPER: taylor_1988 (the 266-nm column with liu_1978), \
brimacombe_1989 (fused silica 1.7e-5 cm/MW), dragomir_2002 (Table 1: fused silica \
1.7e-11 cm/W, 30 ps), couairon_2005."""

