citation = "M. J. Weber, D. Milam, and W. L. Smith, \"Nonlinear refractive index of glasses and crystals\", Opt. Eng. 17, 463-469 (1978)"
doi = "10.1117/12.7972266"
library = "Weber_1978_NonlinearRefractiveIndex"
identity = "VALIDATED_WITH_WARNINGS"
kind = "compilation"
technique = """A review of the Livermore time-resolved interferometry (TRI) of the nonlinear \
index at 1064 nm, with a compilation of TRI values of glasses (Table 1) and crystals \
(Table 2): 'all data cited are for interferometric measurements made using linearly \
polarized 1064-nm radiation, pulse durations in the range 100-1000 ps, and for sample \
temperatures of ~295 K. Several measurements are made of each sample to obtain an \
averaged result with the estimated error cited' (p. 467). The method (Sec. III, pp. \
465-466): Milam's double-pass modified Michelson interferometer with a streak camera \
(10-ps resolution), gamma from Eq. (16), intensities up to 2.5e14 W/m2, Gaussian beams \
6-12 mm in 1/e2 diameter; fringe shifts limited to ~0.3 waves. Table 3: the nuclear \
contribution from Raman spectra (Heiman and Hellwarth's Born-Oppenheimer parameters)."""
notes = """Journal pages 463-469 = pdf pages 1-7 (journal page = 462 + pdf page). Identity \
checked against the first page (title, authors; Optical Engineering 17(5)). kind = \
compilation: most table values are the authors' or others' earlier papers (reference \
letters); the values of 'D. Milam and W. L. Smith (unpublished)' (Table 1 reference f: \
Q-88, LG-812; Table 2 reference b: Al2O3, BeAl2O4, La2Be2O5:Nd, NaCl) are first \
published here and are primary.

DEFINITIONS (quoted). p. 463: 'For a laser beam of intensity I, the index change is \
given by gamma I or, alternatively, by n2 <E^2>, where E is the amplitude of the \
optical electric field and the brackets denote a time average.' Eq. (18), p. 467: \
gamma(m^2/W) = (40 pi/cn) n2(esu), c in m/s. Eq. (5): n2 = (12 pi/n) Re chi1111(-w, w, \
w, -w) for linear polarization in an isotropic medium; Eq. (7): beta = (96 pi^2 omega/ \
n^2 c^2) Im chi1111, with dI/dz = -alpha I - beta I^2 (Eq. 6). Eqs. (11)-(12): n2(LP) = \
(12 pi/n) chi1111 = (2 pi/n)(3 sigma/4 + A0 + B0); n2(CP) = (24 pi/n) chi1122 = (pi/n)(sigma \
+ 2 A0 + B0); Eqs. (13)-(15) for cubic crystals along (100) and (111). 'if the \
electronic response is dominant, the ratio of the n2 values for the two polarizations \
should be 3/2', as Moran et al. observed for SF-6 and YAG (p. 467). The tabulated gamma \
are optmat's n2 (nonlinear_index, the self coefficient, linear polarization).

PART (p. 467): 'the observed fringe shifts are coincident with the variation of the \
beam intensity for 125-ps laser pulses. Since the response times for electrostrictive \
self-focusing when the beam structure is large and for thermal self-focusing are much \
longer, the gamma values are attributed to the optical Kerr effect'; 'The \
interferometric method measures the total nonlinear index for a given polarization' \
(p. 466), and for glasses 'the fraction f_e of n2 that is electronic in origin is \
~0.6' (sic: Table 3 gives 0.57-0.81). Hence part = electronic_vibrational (Raman \
included; no electrostriction or heating) for Tables 1 and 2.

TABLE 1 (tbl_b9afd7663851, p. 466; image checked) and TABLE 2 (tbl_279cf82b90e4, \
p. 466; image checked). One dataset per row (datasets gamma_*), gamma in 10^-20 m^2/W \
with the printed +- (level not stated), n_D kept in the printed cells only (source \
not stated). Reference letters (each table has its own list): Table 1 a Milam and \
Weber 1976 (milam_1976: reproduced; identical to its Table I in cm^2/W), b Weber, \
Cline, Smith, Milam, Heiman and Hellwarth, Appl. Phys. Lett. 32, 403 (1978), c Moran, \
She and Carman 1975, d Bliss, Speck and Simmons 1974, e Milam and Weber, IEEE J. \
Quantum Electron. QE-12, 512 (1976), f Milam and Smith (unpublished); Table 2 a Bliss \
et al. 1974, b Milam and Smith (unpublished), c Moran et al. 1975, d Milam and Weber \
1976 (milam_1976), e Milam, Weber and Glass, Appl. Phys. Lett. 31, 822 (1977). The \
asterisk ('Measured relative to ED-2 with gamma = 4.05 x 10^-20 m^2/W', both tables) \
marks Moran et al.'s relative values (SF-6, C-835, C-2828, Al2O3:Cr) put on the scale \
of Bliss et al.'s ED-2 value (Table 1's second ED-2 row, reference d): reproduced and \
rescaled. Crystal orientations: 'this information was not noted for all samples and \
the original references should be consulted' (p. 467); no axis is recorded. The \
'(o)' of the n_D of Al2O3, MgF2, LaF3, LiYF4 labels the index, not the polarization of \
the n2 measurement. n_D of La2Be2O5:Nd and CeF3 are printed '~2.0-2.05' and '~1.60' \
(the extraction attaches the '~' to the structure-type cell; the image shows it before \
n_D). Identity choices: 'Fused silica 4000' is Dynasil 4000 (milam_1976); 'FK-5' is \
milam_1976's Hoya FC-5 (the same value, reference a); Table 1's ED-2 n_D is 1.572 \
where milam_1976 prints 1.567.

TABLE 3 (tbl_b4032b6777cc, p. 467; image checked). 'Nuclear contributions to the \
nonlinear refractive index of glasses. Parameters A0 and B0 were determined from \
Raman scattering spectra by Heiman and Hellwarth (Refs. 9, 21, 22); the total n2 \
values are from Table 1. f_e is the fraction of n2 which is electronic in origin. All \
quantities are in esu.' Recorded: n2(nuclear) = (2 pi/n)(A0 + B0) (Eq. 19) as \
nonlinear_index_field, part vibrational (datasets n2_nuclear_*, primary: derived here \
from Heiman and Hellwarth's unpublished parameters; their later paper, Heiman, \
Hellwarth and Hamilton, J. Non-Cryst. Solids 34, 63 (1979), is not in the library); \
n2(total) as check (datasets n2_total_*). A0, B0 (10^-16 esu) and f_e have no quantity \
and stay in the printed cells: f_e = SF-6 0.81, ED-4 0.81, SiO2 0.74, BK-7 0.78, LHG-5 \
0.61, LHG-6 0.57, FK-5 0.79, FK-51 0.76, B-101 0.72, BeF2 0.79; the Raman fraction of \
the long-pulse n2 is 1 - f_e (fused silica 0.26). Checks (computed 2026-09-27): Eq. \
(19) with Table 1's n_D reproduces n2(nuclear) (SF-6 16.71, SiO2 2.499, BK-7 2.775, \
LHG-5 4.485, LHG-6 4.265, FK-5 2.282, FK-51 1.648, B-101 0.938, BeF2 0.493; printed 16.7, \
2.49, 2.78, 4.5, 4.3, 2.28, 1.64, 0.94, 0.49: the silica and FK-51 cells are truncated, \
not rounded); Eq. (18) reproduces n2(total) from Table 1 to the printed digits except \
SF-6 (91.3 against 90.0); f_e = 1 - nuclear/total to the printed digits. FINDING: ED-4 \
is in Table 3 but not in Table 1, and its n2(total) 14.1 equals ED-2's Table 1 value \
converted (3.77e-20 m^2/W, n_D 1.572: 14.14); either the row is ED-2 or its total is \
of unstated origin (no erratum: the paper does not decide it).

FORMULA. Eq. (24), with K = 2.8 x 10^-18 m^2/W (p. 468): recorded as bgo_gamma; no \
calculated value is printed (Fig. 2 only).

OTHER STATEMENTS. 'The smallest gamma value reported for any solid is that of glassy \
BeF2' (p. 468, Ref. 21). The nuclear contribution 'for subnanosecond pulses is small \
or it scales in a manner similar to that of the electronic contribution' (p. 468). \
Figure-of-merit table (p. 463): window gamma^-1, Brewster disk n gamma^-1, lens (n - 1) \
gamma^-1. B integral, Eq. (3).

FIGURES (not digitised). Fig. 1 (p. 465): the interferometer. Fig. 2 (p. 468): \
measured against calculated n2 for glasses and crystals of Tables 1 and 2. Fig. 3 (p. \
468): n_d against Abbe number of optical glasses with lines of constant gamma from Eq. \
(24). Fig. 4: the same for cubic crystals.

REPRODUCTIONS OF THIS PAPER: adair_1987 Table 2 (reference c: seven glasses, the \
calibration standards; reference d values are this paper's rescaled Moran entries), \
white_1984 (fused silica at 1064 nm, 2.73), adair_1989 Table III (TRI column: the \
fluorides equal Table 2's reference-e values converted to esu)."""

[[formulas]]
id = "bgo_gamma"
equation = "Eq. (24), p. 467, with K on p. 468"
printed = "\\gamma = K (n_d - 1)(n_d^2 + 2)^2 / ( n_d \\nu [1.5 + (n_d^2 + 2)(n_d + 1) \\nu / 6 n_d]^{1/2} ), K = 2.8 \\times 10^{-18} m^2/W"
variable = "n_d: the index at 587.6 nm; nu = (n_d - 1)/(n_F - n_C), F and C at 486.1 and 656.3 nm; gamma in m^2/W (Delta n = gamma I)"
range = "isotropic materials in the long-wavelength limit (omega << omega_0); 'Eq. (24) has been applied to crystalline materials; however, it must be modified to account for the spatial anisotropy' (p. 468)"
coefficients = { K = "2.8e-18", constant = "1.5" }
check = "No calculated value is printed (Fig. 2 only). With Table 1's n_D and milam_1976's Abbe numbers (computed 2026-09-27): fused silica (1.458, 68) 2.46e-20 m^2/W (measured 2.73), BK-7 (1.517, 64) 3.13 (3.43), FK-5 (1.487, 70) 2.54 (3.01), FK-51 (1.487, 84) 1.94 (1.94), ED-2 (1.567, 54) 4.54 (3.77). The formula is the esu Boling-Glass-Owyoung formula times 40 pi/(c n_d): K = 68e-13 x 40 pi/c = 2.85e-18, and 1.5 for 1.517."
notes = "'The constant K obtained initially from fitting data on several oxide glasses and crystals is 2.8 x 10^-18 m^2/W. More recently Eq. (24) was applied to gamma data measured for a large number of different fluoride crystals. The value of K which provided the best fit to the data was essentially the same' (p. 468). Derived by Glass (Ref. 26) from Eq. (23) by expanding about the d line. 'predictions of gamma for low-index solids based upon Eq. (24) are generally as reliable as single measurements of gamma' (p. 468)."

