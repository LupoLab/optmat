[[datasets]]
id = "chi3_1216_Kr"
material = "Kr"
table = "text"
points = [["1216", "3647", "-1.1e-36"]]
quantity = "hyperpolarizability"
unit = "esu"
abscissa_unit = "angstrom"
use = "check"
notes = "PDF p. 5 (journal p. 448), and repeated with Figs. 4-6 (PDF p. 6): 'We have calculated third-order susceptibilities for Xe and Kr at 1216 A in order to obtain conversion efficiencies; details of the calculations will be reported later. We will use values chi_Kr(3)(1216 A) = -1.1 x 10^-36 ESU and chi_Xe(3)(1216 A) = 2.0 x 10^-35 ESU.' The THG susceptibility per atom (it multiplies N in Eq. (1)) for tripling 3647 A to 1215.67 A (the wavelength column is the fundamental, 3647 A as printed in the abstract; the row is the harmonic, 1216 A). Near-resonant; the sign is negative: at 1215.67 A krypton is negatively dispersive (n - 1 = -7.75e-24 N, PDF p. 4), i.e. the harmonic lies above a Kr resonance. Convention Bjorklund's (Eq. (1), PDF p. 2: P_3 = 8.215e-2 / (3 lambda)^4 [chi(3)(lambda)]^2 N^2 P_1^3 F_1, P in W, N in cm^-3, lambda the harmonic wavelength in cm, chi in esu); Bjorklund's definition of chi (IEEE J. Quantum Electron. 11, 287 (1975)) is not in the library, so the factor to gamma_T is not established here. A calculation used only for relative conversion efficiencies ('our results are not dependent on the accuracy of chi(3)'): check. Electronic."
[datasets.parameters]
process = "thg"
convention = "bjorklund_1975"
part = "electronic"
beyond_resonance = true

