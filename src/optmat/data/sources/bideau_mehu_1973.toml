citation = "A. Bideau-Mehu, Y. Guern, R. Abjean and A. Johannin-Gilles, \"Interferometric determination of the refractive index of carbon dioxide in the ultraviolet region\", Opt. Commun. 9, 432 (1973)"
doi = "10.1016/0030-4018(73)90289-7"
library = "BideauMehu_1973_InterferometricDeterminationRefractive"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Fabry-Perot interferometry (the technique of Abjean and Johannin-Gilles, Opt. \
Commun. 1, 385 (1970)) at 2537 A (Hg I), 2288 A (Cd I), 2139 A (Zn I), 2062 A (I I), \
1942 A (Hg II), 1849 A (Hg I) and 1807 A (S I); interferometer thickness up to 5 mm, \
20-30 fringes scanned; Air Liquide CO2 better than 99.998 %; each value the average of \
at least 12 measurements (p. 432)."""
notes = """Page numbers are the journal's (432-434; pdf page 1 = p. 432).

State (p. 432): 'The refractive index is given at standard conditions (0 degrees and \
760 torr) using the relation fitted by Old et al. from Hilsenrath's tables' (old_1971's \
compressibility): a real-gas reduction. Wavelengths are vacuum wavelengths, printed to \
0.001 A; the formula's sigma is 'the wavenumber in reciprocal micrometer vacuum \
wavelengths' (p. 432).

Uncertainty (p. 432): 'The most important error (1/100) originates from the estimation \
of the fractional part of the fringes. The refractive error in the interference order \
measurement is at most 0.01/20 = 5 x 10^-4, and that in the pressure is evaluated to \
3 x 10^-4. The total relative error for (n - 1) is about 8 x 10^-4. In fact, we have \
found for n a statistical standard derivation of about 3 x 10^-7 for 2537 A and of \
5 x 10^-7 for 1807 A.' Level not stated.

Table 1 also gives the extrapolations to the ultraviolet of the formulas of \
Cuthbertson and Cuthbertson (ref. 2, cuthbertson_1920), Koch (ref. 4, Arkiv Mat. \
Astr. Fys. 10, 1 (1914), not in the library) and Old et al. (ref. 5, old_1971); they \
are not extracted. The formulas as quoted (p. 432): Cuthbertson, (n - 1) x 10^5 = \
6914.45/(156.85 - sigma^2), a rewriting of cuthbertson_1920's frequency form (which \
gives about 6905/(156.63 - sigma^2) with c = 3e10 cm/s; the source of the difference is \
not said); Koch, recorded below; Old et al., identical to old_1971's formula.

Table 2's measured column holds this work's seven values (marked *, as in Table 1 but \
52.07 at 2062.300 A), fifteen of Koch's (marked [4]) and fifteen of Old et al.'s \
(marked [5]), which the formula was fitted to. The Old et al. values are old_1971's \
experimental column rounded to 0.01 (45.34 at 4801.260 A: 4534.159e-7 there; 43.74 at \
16945.210 A: 4373.838e-7).

Reproductions elsewhere: sneep_2005/co2_eq13 (the formula as corrected by Sneep and \
Ubachs and rescaled to 15 C; see the formula's notes), ityaksov_2008_co2 (via \
sneep_2005) and he_2021 (a CO2 formula citing this paper); the fits' CO2 data should take \
this record's experiment_CO2 as the original."""

