[[formulas]]
id = "sellmeier_CO2"
material = "CO2"
equation = "unnumbered, p. 433"
printed = "(n - 1) x 10^5 = 1205.5 5.79925/(166.175 - sigma^2) + 0.12005/(79.609 - sigma^2) + 0.53334 x 10^-2/(56.3064 - sigma^2) + 0.43244 x 10^-2/(46.0196 - sigma^2) + 1.218145 x 10^-4/(0.0584738 - sigma^2)"
variable = "sigma: vacuum wavenumber in um^-1"
form = "dn_sigma2"
terms = { scale = "1205.5e-5", B = ["5.79925", "0.12005", "0.53334e-2", "0.43244e-2", "1.218145e-4"], C = ["166.175", "79.609", "56.3064", "46.0196", "0.0584738"] }
state = "1atm_0C"
density = "real"
range_nm = [180.7, 1694.5]
check = "Read with the factor 1205.5 multiplying every term and the infrared numerator corrected, reproduces Table 2's calculated column at all 37 wavelengths to 0.013 (rms 0.0034, the rounding of the column); with the printed infrared numerator the residual grows to 0.027 at 16945 A (rms 0.008). Checked 2026-09-25 (equation read on the page image, pdf page 2)."
notes = """STRUCTURE: the printed formula has no brackets: as printed 1205.5 multiplies \
only the first fraction, which would give (n - 1) x 10^5 = 46.4 at 2537 A against the \
table's 48.98; 1205.5 = 1.2055e-2 x 10^5 (N e^2/(8 pi^2 eps0 m c^2) at 0 C, 760 Torr, \
um^-2, as in bideau_mehu_1981) multiplies the whole sum, and the numerators are \
oscillator strengths ('The numerators represent the oscillator strengths of the \
transitions', pp. 433-434; Inn et al.'s 0.12, 0.53e-2, 0.43e-2 for the 1121, 1332 and \
1475 A bands). The first term is the ionisation continuum (0.0775 um), the last the \
4.13 um infrared band kept from Old et al. (p. 434). The form's terms apply the \
bracket.

Sneep and Ubachs (sneep_2005, Eq. 13) write 'Their article contains a typographical \
error' and give the corrected formula scaled to 15 C and 1013 hPa: the same poles \
(sqrt(C_i) x 10^4 = 128908.9, 89223.8, 75037.5, 67837.7, 2418.1 cm^-1), numerators \
1000 times these (5799.25, 120.05, 5.3334, 4.3244) with the prefactor 1.1427 x 10^3 \
(read for their misprinted 10^6) = 1.2055 x 10^3 x 273.15/288.15 (ideal-gas rescaling, \
to 4e-5): their correction is the bracket. Their infrared numerator, 0.1218145 x \
10^-4, is 10^4 times smaller than this paper's (1000 x 1.218145e-4 = 0.1218145), which \
makes the infrared term negligible: it leaves Table 2's calculated column 0.53 high at \
16945 A (rms 0.16), so it is a second misprint, in Sneep's copy (TC-167)."""
[[formulas.corrections]]
term = "B"
index = 4
printed = "1.218145e-4"
corrected = "1.28154e-4"
reason = "The paper keeps 'the term corresponding to the absorption band at 4.13 u given by Old et al.' (p. 433): Old et al.'s term is 0.154489/(0.0584738 - sigma^2) on (n - 1) x 10^5 (quoted p. 432; old_1971/sellmeier), the same pole, so the numerator here is 0.154489/1205.5 = 1.28154e-4; old_1971 gives the band's oscillator strength as 1.28e-4. The printed 1.218145 transposes those digits."
evidence = "With 1.28154e-4 the formula reproduces Table 2's calculated column at all 37 wavelengths to the rounding (rms 0.0034; 43.680 against 43.68 at 16945.210 A); with the printed value the residual grows steadily through the infrared rows to 0.027 at 16945.210 A (rms 0.008, 43.707). Checked 2026-09-25."

