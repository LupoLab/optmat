unit = "esu (per amagat)"
scale = 1e-19
abscissa_unit = "cm-1"
use = "check"
notes = "Table 1 (p. 1254), 10^-19 esu at 1 amagat and 296 K (per amagat, N0 = Loschmidt's number; no state), Hellwarth's convention of rosasco_1985 (2 sigma/24 = N0 gamma_T/36): 2 sigma/24 of D2, 'From the H2 value and the ratio of H2/D2 of ~1.02; see Ref. 13' (note c, Mizrahi and Shelton 1985, mizrahi_1985_h2d2): derived, not measured (2.966/1.02 = 2.908). Electronic."
[datasets.parameters]
process = "kerr"
convention = "rosasco_1985_hellwarth"
part = "electronic"
probe_cm1 = 17751

