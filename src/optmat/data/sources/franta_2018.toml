corrected = "35.188e-4"
reason = "Table I prints the ABESF coefficients e_j of Eq. (3) without their factor 10^-4: as printed, e(300 K) = 2.7, where the reference temperature 300 K requires e(300 K) = 0."
evidence = "With e_j x 10^-4, e(300 K) = 6.5e-7, zero to the rounding of the printed e_0 = -2.7131e-4 (computed 2026-10-14). franta_2019 Table 1 reprints the 4th fit as e_1 = -0.00017(2), e_2 = 0.00332(3), e_3 = 0.00186(12) (here -1.748, 33.153, 18.635)."

