citation = "L. R. Ingersoll and D. H. Liebenberg, J. Opt. Soc. Am. 44, 566 (1954)"
doi = "10.1364/josa.44.000566"
library = "Ingersoll_1954_FaradayEffectGases"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Photoelectric Faraday-rotation method: light from a projection lamp, plane \
polarized, folded by a White mirror system to a 20 m path inside a 175 cm solenoid \
(300 Oe at 11 A); double-image analyzer, polaroid chopper at 10 cps, phototube and \
tuned amplifier; rotations measured against small known rotations of polarizer and \
analyzer, down to about 0.0003 degree. 22 interference filters, their effective \
wavelengths calibrated (probable error about 10 A, more at the ends of the spectrum). \
Scale from the Verdet constant of water. Gas at 1-3 atm (sometimes 0.1 atm), about \
17 C (pp. 1-3)."""
notes = """The Verdet constant V is 'the rotation R in minutes (or microminutes) for a field \
H of 1 oersted and path length L of 1 cm in gas at a pressure of 1 atmosphere for 0 C' \
(p. 2), with 'the simple (perfect) gas law' (p. 5): state 1 atm, 0 C, density ideal. \
Wavelengths are filter effective wavelengths, medium not stated; taken as air as in \
leonard_1974.

SUPERSEDED: the second paper (ingersoll_1956) found by a repeated water calibration \
that 'the former scale is almost 1% low and that the Verdet values in the earlier \
paper should be multiplied by 1.0094', and republishes all six curated gases of this \
paper with that and minor corrections. Every dataset here is therefore excluded, \
kept for the record (the de Mallemann and Bizette-Tsai values excepted, which are \
reproduced as printed).

Accuracy (p. 3): average deviation of the points from the smooth curves He 0.87, Ne \
1.92, H2 0.27, D2 0.39, N2 0.37, O2 0.32 %; 'the average absolute probable error is \
considered to be about 1 percent', much less for comparisons between gases and in the \
visible; an infrared zero error 'may amount to several percent' for helium and \
neon. Oxygen was corrected for 0.60 % hydrogen.

Tables I and III are values from the smooth curves; Table II (dispersion relative to \
4000 A) is Table I divided out and not extracted. Table IV (Verdet constants at two \
pressures, individual determinations at a few wavelengths) shows pressure effects \
below 1/2 % except for butane; it carries the same 1 % scale error and is not \
extracted. n-Butane is not curated.

de Mallemann's values (Table III, 'M', at 4360, 5460, 5780 A; pressures neon 260, \
hydrogen 310, nitrogen 271, oxygen 310 cm) run 'about 2 percent or so above the \
present ones and for neon, 10 percent' (p. 5), which the authors attribute to de \
Mallemann's neglect of a zero correction. Bizette and Tsai's helium value at 5460 A \
was measured at 89 atm."""

