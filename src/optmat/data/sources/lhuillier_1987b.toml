citation = "A. L'Huillier and G. Wendin, \"Two-photon one-electron ionisation cross section of the 5p shell of xenon including screening effects\", J. Phys. B: At. Mol. Phys. 20, L37-L44 (1987)"
doi = "10.1088/0022-3700/20/2/002"
library = "LHuillier_1987_TwoPhotonOne"
identity = "VALIDATED_WITH_WARNINGS"
kind = "theory"
technique = """Diagrammatic many-body perturbation theory of two-photon one-electron \
ionisation of the Xe 5p shell, lowest (second) order in the field, with every \
electron-photon interaction replaced by the RPA-screened dipole operator r(omega) = r \
epsilon^-1(r, omega) (Eqs. 2-3, Fig. 1(a)): 'non-linear screening', which brings in \
double excitations of the 5p shell; for comparison only the first interaction \
screened (Fig. 1(c)), and the unscreened independent-electron amplitude (Fig. 1(b)). \
Two bases: local density (LDA, LDRPA; 5p ionisation limit 0.62 Ry, no discrete \
states) and Hartree-Fock average (HF, RPAE; 5p^-1 ns, n = 6-8, and nd, n = 5-6, \
resonances included; 'our HF zeroth-order potential is more attractive than the \
configuration average HF potential; in particular, the discrete levels are more \
closely bound', p. L41). Free-free matrix elements above the 5p limit (ATI). \
Nonrelativistic; linear polarisation."""
notes = """Journal pp. L37-L44 = PDF pages 2-9 (PDF page 1 is the publisher's cover \
sheet); a scan, each page one 1-bit image of 2076 x 2945 pixels (300 dpi), with a text \
layer. Identity checked on PDF page 2 (J. Phys. B: At. Mol. Phys. 20 (1987) L37-L44, \
Letter to the Editor; Anne L'Huillier and Goran Wendin, Chalmers and CEN-Saclay; \
received 10 October 1986) on 2026-10-09.

THE DEFINITION (p. L38, Eq. 1): 'The two-photon one-electron ionisation generalised \
cross section sigma_2 (cm4 s) can be written as sigma_2 = 2 pi (alpha c / a0) (omega \
/ F0)^2 sum_l |t_eps_i(omega)|^2 where alpha is the fine-structure constant, c the \
speed of light, a0 the Bohr radius, omega the photon energy and F0 is equal to 3.22 \
x 10^34 (photons/cm2 s)'; the rate is sigma_2 F^2, F the photon flux. Length form \
(the dipole operator r). Linear polarisation (every figure caption). wendin_1987's \
Eq. (14) writes the same cross section with (1 / F F0)^2 and the intensity carried in \
t (its Eqs. 9a, 13).

THE ENERGY AXES: the PHOTON energy in Ry, as printed in every figure ('Photon energy \
(Ryd)'). The thresholds and resonances are the calculation's own: the LDA 5p limit \
0.62 Ry ('lower than the experimental threshold (~0.90 Ryd)', p. L40), so the LDA \
two-photon threshold is 0.31 Ry; the HF two-photon and one-photon thresholds 0.46 and \
0.92 Ry (Fig. 4's caption); resonance positions nonrelativistic, without the \
spin-orbit splitting of the core, and 'the RPAE screening leads to an important shift \
of the positions of the 5p^-1 nd resonances towards higher energies' (p. L41). No \
shift or scaling was applied by the authors, and none here.

EXTRACTED (tools/extract/lhuillier_1987b.py), by data rule 8 (TC-699): the cross \
sections are in figures only, read from the page images at their native resolution, \
the method of lhuillier_1987 (TC-883) scaled to 300 dpi. Every tick mark is found \
where the script writes it (within 2 pixels) and lies on the fitted scale within \
1.5 pixels; Fig. 2 is calibrated from its top and right lines (no curve meets them), \
Figs. 3 and 4 from the bottom and left. Fig. 3's frame lines lie at the text's 0.46 \
and 0.86 Ry (p. L41) within 0.002 Ry. Lettering, the hatched threshold marks, \
McCown et al.'s crosses and Fig. 4's six squares are erased; pieces of ink are sorted \
by size into the solid line (at least 75 pixels; 40 in Fig. 4, where the squares cut \
it), dots (at most 7) and dashes; a value is read only where its line is one run at \
most 7 pixels tall, not touching anything erased, and agrees with a neighbour. Steep \
flanks and peaks are not read. One pixel is 0.00097 Ry and 0.0054e-49 cm4 s in Fig. \
2, 0.00035 Ry and 1.9 % in Fig. 3, 0.00093 Ry and 1.8 % in Fig. 4. The overlays of \
every value on the page images were inspected (2026-10-09): all lie on their lines.

CHECKS (the script raises if any fails). (1) Fig. 4's squares ('theoretical (MQDT) \
results by Gangopadhyay et al (1986)') are gangopadhyay_1986's Table I, the sum of \
its two cores, at half the total energy: 0.978-1.069 of the sums, drawn 0.001-0.0055 \
Ry to the right of Table I's energies (hand-placed; six squares, Table I's first six \
rows). (2) Fig. 4's cross lies at 0.4719 Ry, 193 nm's 0.4722 (the text: 'at 0.47 \
Ryd (193 nm)', p. L43), 1.00 times mccown_1982's alpha hbar omega (TC-884). (3) Fig. \
4's LDRPA (log axis) is Fig. 2's LDRPA (linear) redrawn: median ratio 1.016 \
(0.992-1.053) where Fig. 2's value exceeds 0.3. (4) Fig. 3's solid and dashed lines \
are lhuillier_1987's Fig. 6 HF and RPAE: median ratios 0.991 (0.964-1.012) and 0.993 \
(0.931-1.037) at the shared grid points; the overlay of lhuillier_1987's values on \
this Fig. 3 was inspected. Reported: Fig. 4's RPAE and LDRPA over lhuillier_1987's \
Figs. 6 and 7: medians 1.006 (0.980-1.037) and 1.001 (0.918-1.049).

COMPANION (lhuillier_1987, TC-883, Phys. Rev. A 36, 4747, received 9 February 1987: \
the full account, published after this letter). The same calculations: this letter's \
HF and RPAE (Fig. 3) and RPAE and LDRPA (Fig. 4) are that paper's Figs. 6 and 7 \
within the reading (checks 3 and 4). NEW here: (a) the LDA basis, Fig. 2, from the \
LDA two-photon threshold 0.31 Ry to 1.40 Ry on a linear axis: the LDA \
independent-electron cross section (with the 5p -> eps d peak at 0.68 Ry, p. L40) and \
the LDRPA with only the first interaction screened, neither in the PRA; \
(b) the HF-basis RPAE with only the first interaction screened (Fig. 3, dotted); (c) \
Fig. 4's RPAE and LDRPA from 0.31 to 1.40 Ry, including the LDRPA below the HF \
two-photon threshold (0.31-0.46 Ry) and between the PRA's two figures (0.86-0.98 \
Ry). The PRA's Fig. 10 'RPAE linear screening' (dash-dot; not taken by \
lhuillier_1987) has, by eye, the shape of this letter's Fig. 3 dotted line (not \
compared numerically); its Figs. 9-12 (the 5s shell, TDAE, screening at 2 omega) are \
not in the letter.

FINDINGS. (1) Fig. 3 draws McCown et al.'s cross at 0.4846 Ry, 0.0124 Ry (35 pixels) \
above 193 nm, on the dotted line at 1.07 times McCown's value; Fig. 4 (and \
lhuillier_1987's Fig. 6) draw it at 193 nm. (2) Fig. 4's hatched marks stand at \
0.457 and 0.907 Ry; the caption gives the HF thresholds as 0.46 and 0.92 Ry: the \
one-photon mark is drawn 0.013 Ry low. Fig. 2's hatched mark stands at 0.621 Ry, the \
text's LDA limit 0.62. (3) Gangopadhyay et al.'s values, here and in every later \
drawing (gangopadhyay_1986's notes), are the open-continuum Table I above the 2P1/2 \
limit, not the region between the thresholds that 193 nm reaches.

THE TEXT (pp. L42-L43): Gangopadhyay et al.'s MQDT 'leads to good agreement with the \
present non-linear LDRPA and RPAE results in the 0.5-0.6 Ryd range'; McCown et al.'s \
point 'may be somewhat fortuitous because this point lies in the region of \
autoionising resonances'; McGuire's result 'is slightly below our independent-electron \
result'.

NOT TAKEN: Fig. 3's solid (HF) and dashed (RPAE) lines, the calculations \
lhuillier_1987 holds from its Fig. 6 (checked above); the squares (gangopadhyay_1986 \
holds Table I) and the crosses (mccown_1982); Fig. 1 (diagrams). Further two-photon \
calculations the paper cites, not in the library: M. S. Pindzola and H. P. Kelly, \
Phys. Rev. A 11, 1543 (1975); B. Ritchie, Phys. Rev. A 16, 2080 (1977); R. Moccia, N. \
K. Rahman and A. Rizzo, J. Phys. B 16, 2737 (1983); A. F. Starace, Phys. Scr. (1986, \
Proc. 8th VUV conference); G. A. Victor, Proc. Phys. Soc. 91, 825 (1967)."""

