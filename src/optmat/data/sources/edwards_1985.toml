citation = "D. F. Edwards, \"Silicon (Si)\", in Handbook of Optical Constants of Solids, E. D. Palik, ed. (Academic Press, 1985), pp. 547-569"
doi = "10.1016/b978-0-08-054721-3.50029-0"
library = "EDWARDS_1985_SiliconSi"
identity = "VALIDATED_WITH_WARNINGS"
kind = "compilation"
technique = """A critical compilation of the optical constants of crystalline silicon at room \
temperature from 2000 eV (6.2 A) to 0.00372 eV (333 um), each range from a different \
original (text pp. 547-552): values computed by Edwards from Henke et al.'s atomic \
scattering factors (99-2000 eV); absorption near the L2,3 edge (Gahwiller and Brown; \
Brown, Bachrach and Skibowski; synchrotron); Hunter's unpublished critical-angle n and \
transmission k of evaporated films (20-95 eV); Philipp's Kramers-Kronig analysis of \
reflectance (5-20 eV); Aspnes and Theeten's spectroscopic ellipsometry, combined with \
Hulthen's eps_2 below 2.5 eV (1.5-6.0 eV); Hulthen's transmission of epitaxial films, \
read from his graphs, and McFarlane and Roberts' absorption (band edge, k only); \
minimum-deviation and channel-spectrum indices (Primak; Salzberg and Villa; Edwards and \
Ochoa; Loewenstein et al.; Randall and Rawcliffe; 1.12-333 um); photoacoustic (Hordvik \
and Skolnik), multiphonon absorption (Johnson; Bendow et al.) and far-infrared \
Fourier-transform (Afsar and Hasted) k."""
notes = """Chapter pages 547-569 are pdf pages 1-23: text pp. 547-552 (pdf 1-6), \
references pp. 552-553, Fig. 11 (log-log plot of n and k against wavelength, figure \
only) p. 554, Table XII pp. 555-568 (pdf 9-22, fourteen parts), Table XIII p. 569. \
Identity checked against the first page.

WHAT TABLE XII HOLDS. 'Values of n and k for Silicon Obtained from Various References' \
(caption; footnote a: 'References are indicated in brackets'). For every row: photon \
energy (eV), the wavenumber (cm-1, from 6.0 eV down only), the wavelength (angstrom to \
650 A, micrometre from 0.06526 um: the unit switches at the p. 560 part), and two pairs \
of n and k columns. A reference tag in brackets after a value names the original of \
that value and of the values below it in the same column, until the next tag; the \
second pair holds a second original where two overlap (Gahwiller-Brown and Brown et \
al. beside the Henke calculation; Aspnes and Theeten beside Philipp; McFarlane and \
Roberts beside Hulthen). The datasets below are one per column kind (n, k), tag and, \
for Philipp's values, wavelength unit. Every k printed as a bare mantissa inherits the \
power of ten of the cell above it in its column (see the extraction script); every \
part was compared with its table image, cell by cell. The table prints no stated \
uncertainty.

ROWS WITHOUT AN ENERGY. Six lines print no energy or wavelength, only a second value \
under the line above: Philipp's n and k at 20.00 eV (620 A) under Hunter's, and \
Johnson's k under Bendow et al.'s at 7.143, 7.692, 8.333 and 9.091 um. Each takes the \
wavelength of the line above (both originals' grids put it there: Philipp's 0.5-eV \
grid, and the page break after 7.692 um).

CROSS-CHECK. eV x wavelength agrees with hc to the printed digits on every row but one: \
the 640 A row prints 10.37 eV for 19.37 eV (hc/640 A = 19.373 eV; the rows around it are \
19.5 and 19.07 eV). The wavenumber agrees with the wavelength on every row but three: \
1,492 cm-1 for 1,429 at 7.00 um (0.1771 eV), 608 for 606 at 16.50 um (0.07513 eV; the \
text names this band 'the peak at 606 cm-1', p. 548) and 21,660 for about 21,620 at \
0.4626 um (2.68 eV). The abscissa here is the wavelength, which is right on all three \
rows, so none of these needs an erratum.

RANGES AND ORIGINALS (text pp. 547-552; references p. 552-553):
- 2000-100 eV n and k [30]: 'From 99 to 2000 eV we have calculated n and k from a \
model of Henke et al. [30] as discussed by Lynch and Hunter in the metal section of this \
handbook. While the calculation cannot account for the fine structure, the magnitude of \
k is in reasonable agreement with experiment [31, 32].' The steps of k at 1815-1860 eV \
(the K edge) and at 100-101.6 eV (the L2,3 edge) are as printed. The 166 and 162 eV rows \
print the same n and k (0.99235, 1.45e-2), against the trend of both columns (170 eV: \
0.99176, 1.28e-2; 158 eV: 0.99287, 1.52e-2); probably a repeated line, kept as printed.
- 210-110 eV and 95 eV k [31] (Gahwiller and Brown 1970) and 105-99.0 eV k [32] (Brown, \
Bachrach and Skibowski 1977): the absorption near the L2,3 edge, 'measured [31, 32] \
with chemically etched and polished samples and with films flash evaporated onto NaCl \
substrates and floated off; the latter were polycrystalline. A synchrotron source was \
used' (p. 552). Which sample goes with which reference is not said.
- 99.19-19.07 eV n and k [29]: Hunter's 'private communication of unpublished data \
(1982)', 'For the range 20-95 eV ... Samples were evaporated Si on glass plates for \
measurement of n by a critical-angle method; they were freestanding for measurement of \
k by transmission. While the samples were probably amorphous, we find that the data fit \
reasonably well between the results of Henke [30] and Philipp [26]' (p. 552). 'An \
interpolation has been done between 95 and 99 eV to keep the continuity' (p. 552): the \
four rows above 95 eV (125-130 A) carry Hunter's tag but are Edwards' interpolation \
(excluded rows). Hunter's methods paper (Appl. Opt. 21, 2103 (1982)) is in the library \
without tables.
- 20.0-5.0 eV n and k [26]: Philipp, J. Appl. Phys. 43, 2836 (1972), and private \
communication (1982); Kramers-Kronig analysis of reflectance on 'chemically prepared \
surfaces with minimum time spent in air before insertion into the vacuum spectrometer' \
(p. 551); 'we have therefore elected to tabulate the Philipp data from 5 to 25 eV' \
(only 20.0-5.0 eV is printed). Philipp's and Sasaki and Ishiguro's data agree within \
'typically <~30% for n but <~10% for k'; Aspnes and Theeten's and Philipp's within \
'<~5% for k and <~10% for n in the overlap region 5-6 eV' (pp. 551-552). The table does \
NOT cite Philipp and Ehrenreich, Phys. Rev. 129, 1550 (1963) (philipp_1963); it cites \
Philipp and Taft 1960 [25], Philipp 1972 [26] and Philipp and Ehrenreich 1967 (in \
Semiconductors and Semimetals, Vol. 2) [27], and tags only [26].
- 6.0-1.5 eV n and k [20]: Aspnes and Theeten, J. Electrochem. Soc. 127, 1359 (1980), \
and private communication (1980): spectroscopic ellipsometry on {100}, {111} and {110} \
wafers (~26 ohm cm, Syton polished, oxides grown, stripped and regrown), the oxide and \
its 6-A transition layer removed mathematically. 'Temperature was not stated but was \
probably 298 K.' 'The data were combined with eps_2 data of Hulthen [21] below 2.5 eV \
to generate the final values we have tabulated' (pp. 551-552): below 2.5 eV the k \
column is in part Hulthen's. Not Aspnes and Studna 1983 (aspnes_1983), whose Si \
values are a different measurement.
- 2.0-1.2 eV k [21]: Hulthen, Phys. Scr. 12, 342 (1975), transmission of epitaxial \
films on sapphire; 'We obtained n and k from reading graphs [21]' (p. 552): read from \
figures by Edwards. 'Temperature was not stated but was probably 298 K.'
- 1.28-1.06 eV k [23] (0.9686-1.170 um): McFarlane and Roberts, Phys. Rev. 98, 1865 \
(1955), absorption at 290 K on 100 ohm cm material, mechanically polished; at 1.2 eV a \
'factor of 5 difference' from Hulthen's (p. 552; here 1.8e-4 against 1.07e-3).
- 1.12-25.00 um n [1, 2, 3, 8]: Edwards' selection of 'representative ... average \
values' from Primak [1] (1.12-2.16 um, minimum deviation), Salzberg and Villa [2] \
(1.3570-11.04 um, minimum deviation), Edwards and Ochoa [3] (2.4373-25 um, channel \
spectra), with Icenogle et al. [4]; criteria: single crystals, values readable 'to at \
least a few places in the third decimal place', and 'agreement in overlap areas to less \
than five in the third place between different data sets' (p. 547). Tag [8] is Li, J. \
Phys. Chem. Ref. Data 9, 561 (1980) (li_1980), the source of the Sellmeier form; the \
printed values are not Li's Table 1 at 293 K (3.5167 at 1.20 um and 3.4719 at 1.60 um, \
against 3.5193 and 3.4710 here), but Li compiles the same measurements, so li_1980 is \
listed among the originals. Each investigator's samples were at room temperature; the \
dispersion fits of p. 548 are for 26 C.
- 30.30-333.3 um n [5, 6]: Loewenstein, Smith and Morgan (28.57-333 um) and Randall and \
Rawcliffe (67.8-588 um), channel spectra, room temperature (pp. 547-548).
- 2.7144 and 3.80 um k [12]: Hordvik and Skolnik, photoacoustic absorption at the HF \
and DF laser lines (p. 549).
- 5.00-7.692 um, 8.000-9.091 um k [15] and 7.143-29.41 um k [14]: Bendow, Lipson and \
Yukon, and Johnson (oxygen-free silicon, 6.7-25 um), the multiphonon absorption 'for \
the major absorption peaks and shoulders' (p. 549). The two alternate between 7.1 and \
9.1 um, each line tagged; from 9.259 um on the column carries Johnson's tag. The 1450 \
cm-1 value (2.45e-5 at 6.897 um, printed with its power) is ten times its neighbours \
(2.66e-6 at 6.667 um); kept as printed.
- 62.50-250.0 um k [19]: Afsar and Hasted, Fourier-transform spectroscopy, 1000 ohm cm, \
303 K; chosen 'for k below 160 cm-1' because the highest resistivity 'should minimize \
the free-carrier effects on k' (p. 550).

USE. Hunter's otherwise unpublished data are primary (as in philipp_1985), filed under \
crystalline Si with form = film although Edwards calls the samples 'probably \
amorphous'. Every other range reproduces another work and is 'reproduced'; none of \
those originals is in the library with these values, so they remain the best copies \
available (an original curated later is named in reproduced_from). The temperature is \
room temperature (not stated) except where a dataset says so. Wavelengths are vacuum \
values (computed from the photon energy in the VUV; the infrared rows are on a \
wavenumber grid).

NOT TRANSCRIBED. The Herzberger-type (A = 3.41906, B = 1.23172e-1, C = 2.65456e-2, D = \
-2.66511e-8, E = 5.45852e-14, L = 1/(lambda^2 - 0.028)) and Sellmeier-type (eps = \
1.16858e1, A = 9.39816e-1, B = 8.10461e-3, lambda_1 = 1.1071 um) fits to the 184 \
infrared index points, 1.12-588 um, 26 C (p. 548); Table XIII (p. 569), Icenogle et \
al.'s dn/dT = B1 + B2 T + B3 T^2 for 100-296 K at four wavelengths, 2.554-10.270 um (its \
B1 at 2.732 um, -1.0255e-5, is ten times smaller than its neighbours'); the Drude \
model of Kinasewitz and Senitzky at 107.3 GHz (p. 552)."""

