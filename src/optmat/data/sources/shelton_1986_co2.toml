citation = "D. P. Shelton, J. Chem. Phys. 85, 4234 (1986)"
doi = "10.1063/1.451794"
library = "Shelton_1986_HyperpolarizabilityDispersionMeasured"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """ESHG with periodic phase matching as in shelton_1985_sf6 (electrode spacing \
2.69 mm, 1.2-6.5 atm at 19-22 C), cw dye or argon-ion laser, 0.2-1.0 W; dye-laser \
wavelengths set to Na or Ne lines; sample CO2 (99.99 %) and reference N2 (99.999 %) \
in triplets; densities from the virial equation of state (p. 2)."""
notes = """The by-product ratio Delta alpha_CO2 / Delta alpha_N2 (Delta alpha = \
alpha(2 omega) - alpha(omega)) is the phase-match density ratio rho_N2 / rho_CO2, filed \
under N2 with CO2 as reference_material as in shelton_1990. Table I gives the air \
wavelength and the vacuum wavenumber of the fundamental; the wavenumber is the \
abscissa.

Uncertainty (p. 2): the ratio accuracy 'has been given as +-0.20%, a conservative \
estimate based on the absolute pressure gauge accuracy of +-0.15%. If the gauge is \
linear, the dispersion ratio accuracy will instead be set by the +-0.04% density \
ratio reproducibility'; Table I note c: 'The tabulated error bars may be too \
pessimistic by as much as a factor of 5.'

The ratio has a minimum near 16 000 cm^-1: 'in the red end of the visible the \
dispersion due to low frequency vibrational resonances becomes comparable to that \
due to high frequency electronic resonances' (p. 6). The paper separates the \
vibrational part with the two infrared fundamentals (Eq. 14) and fits the electronic \
remainder (formulas below).

Table III lists CO2 infrared transition dipole moments (from Rothman's intensities) \
and Raman transition polarizabilities used for the vibrational Kerr hyperpolarizability, \
and alpha = 293.3 x 10^-42 C^2 m^2 J^-1 at 632.8 nm 'from the refractive index' \
(Landolt-Bornstein; reproduced): not extracted (the infrared module uses HITRAN). The \
gamma values and Table II are hyperpolarizabilities and are not extracted.

THIRD-ORDER DATA (added 2026-09-26; supersedes the last sentence above). \
gamma is the ESHG <gamma>_ZZZZ of Shelton's series (Taylor convention, SI C^4 m^4 \
J^-3), calibrated through Mizrahi & Shelton's gamma_N2/gamma_He = 20.30 [1 + 6.55e-10 \
nu^2] (Eq. 2) and Sitz & Yaris's gamma_He = 42.6 au [1 + 2.94e-10 nu^2] (Eq. 3, 1 au = \
6.2360e-65 C^4 m^4 J^-3), nu the fundamental wavenumber in cm^-1: the old He \
calibration (shelton_1990 Table III(c) rescales these values; Shelton & Rice's warning \
that the A, B of the 1985-86 papers are against nu^2 of ESHG, not nu_L^2, and on this \
He value, applies to the formulas below). The electronic dispersion of all processes \
is written gamma^e(-omega_s; omega_1, omega_2, omega_3) = gamma^e(0; 0, 0, 0) [1 + C \
omega_L^2] (Eq. 4), omega_L^2 = omega_s^2 + omega_1^2 + omega_2^2 + omega_3^2 (Eq. 5). \
The dc Kerr gamma is gamma_Kerr = (3/2)[<gamma>_ZZZZ - <gamma>_XZZX] (Eq. 9). Parts: the \
vibrational gamma^v_Kerr is calculated (Eqs. 6-11, Table III matrix elements) and \
found small (0 +- 2e-63); 'the vibrational contributions to gamma_CO2 appear to be \
insignificant for ESHG and THG, but not for FWM and the dc Kerr effect' (p. 4238). The \
literature dc Kerr value (558 +- 120e-63) is shown to be spurious (excluded; the \
reanalysis gives -61 +- 200e-63). Table III (transition dipoles and polarizabilities of \
12C16O2, incl. the mean polarizability 293.3e-42 and anisotropy 235e-42 C^2 m^2 J^-1 at \
632.8 nm, reproduced from refractive-index and depolarized-scattering literature) is \
not extracted (no quantity for transition matrix elements; the anisotropy is a \
reproduction of Bogaard et al. / Alms et al.)."""

