abscissa = "label"
use = "primary"
notes = "Table I (p. 136), 'Wave numbers of the rotational Raman lines of 14N2': the pure rotational S(J) lines, J = 0-18 (the table prints the lower level J), each the mean of the Stokes and anti-Stokes shifts (p. 141), calibrated against CO's rotational lines as an internal standard. sigma: the 'est. dev.' column, judged from the line's appearance on the plate (level not stated). The 'obs. - calc.' column (Rot. constants of Table VII) is kept in 'printed'."
