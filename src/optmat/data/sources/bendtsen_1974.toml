citation = "J. Bendtsen, \"The rotational and rotation-vibrational Raman spectra of 14N2, 14N15N and 15N2\", J. Raman Spectrosc. 2, 133 (1974)"
doi = "10.1002/jrs.1250020204"
library = "Bendtsen_1974_RotationalRotationVibrational"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Photographic grating Raman spectroscopy (the instrument of Brodersen and \
Bendtsen, J. Raman Spectrosc. 1, 97 (1973)): argon-ion excitation at 4880 and 5145 A, \
grating in the 12th (rotational) or 11th (rotation-vibration) order, spectral slit \
width 0.15 cm^-1, Kodak IIa-D plates. Pure rotational spectra of samples at \
atmospheric pressure (minutes) or of 30 torr N2 with 150 torr CO (hours), Stokes and \
anti-Stokes on one plate, calibrated against the pure rotational lines of CO (constants \
from Guelachvili's infrared spectrum) as an internal standard; rotation-vibration \
spectra of samples at 1 atm, 4880 A, 20 h exposures, calibrated with thorium lines and \
calibration-polynomial constants interpolated from CO spectra (pp. 134-137). Weighted \
least-squares fits of the line positions to Eqs. (5)-(6) (weights 1/est. dev.^2), p. \
141."""
notes = """Journal pages 133-145 = PDF pages 1-13 (p. = pdf page + 132). Identity checked \
against the first page (the library's 'review' flag only says that the PDF prints no \
DOI). All tables checked against their images: the extracted cells agree.

MATERIAL. N2 is 14N2, 'natural nitrogen' (purity 99.9995 %, p. 134). The 14N15N (98 % \
14N15N) and 15N2 (95 %) samples, and every value of those isotopologues, are in these \
notes only: Tables II (14N15N) and III (15N2) (pure rotational lines, J = 0-17 and \
0-19), V (14N15N) and VI (15N2) (fundamental band, O, Q and S branches), and their rows \
of Tables VII-IX: 14N15N B_0 = 1.923596 +- 9 (Rot.), D = 5.38 +- 3 x 1e-6, nu_0 = \
2291.3324 +- 4, B_0 - B_1 = 0.016508 +- 2, alpha = 0.016416 +- 2, B_e = 1.931816 +- 9, \
r_e = 1.097702 +- 4 A; 15N2 B_0 = 1.857624 +- 16, D = 5.08 +- 5 x 1e-6, nu_0 = 2252.1249 \
+- 3, B_0 - B_1 = 0.015667 (printed '0.015667 - 2' in Table VII: the '+-' is misprinted \
as a minus sign), alpha = 0.015575 +- 2, B_e = 1.865424 +- 16, r_e = 1.097700 +- 8 A. \
In the extraction of Table VII the 14N15N label spans only the two rotation-vibration \
rows; the image shows the 'Rot.' row above them belongs to 14N15N (and likewise for \
15N2). Nuclear-spin statistics (p. 141): in 14N2 the even-J lines are twice as intense \
as the odd-J lines, in 15N2 the odd-J lines three times the even-J, and 14N15N has no \
alternation; 'the observed spectra show intensity variations which agree'.

WAVENUMBERS. All values are in cm^-1. The paper does not say vacuum or air; the \
calibration against CO's rotational lines from infrared spectroscopy [11] makes them \
vacuum wavenumbers (an inference, not a statement). The temperature is not stated \
(room temperature). Pressure shifts are not discussed.

LINE POSITIONS (Tables I and IV). Table I (p. 136): the pure rotational lines 'as \
meanvalues of the averaged Stokes and anti-Stokes frequencies from each plate' (p. \
141), printed as |nu| against the lower level J (recorded as S(J)). Table IV (p. 138): \
the fundamental band, O(2)-O(17), Q(8)-Q(20), S(0)-S(17), not averaged over Stokes and \
anti-Stokes. 'To each individual line an estimated deviation is assigned. This \
deviation is judged from the appearance of the line on the plate' (p. 141): the sigma \
column, level not stated. Accuracy (p. 142): 'An overall shift, different from plate \
to plate, is recognized by the fact that corresponding Stokes and anti-Stokes shifts \
differ by a constant amount except when calibration is performed by the use of an \
internal standard ... Clearly the nu_0 determination in the vibrational bands is \
affected by a similar shift. By experience it is found that the absolute frequency \
determination is not better than +-0.01 cm^-1.' So the pure rotational lines (internal \
CO standard, Stokes and anti-Stokes averaged) carry their estimated deviations only; \
the fundamental band's lines carry theirs too, the +-0.01 cm^-1 being a common offset \
of the band (in notes, not added per line), and nu_0 carries the +-0.01 cm^-1 as its \
absolute uncertainty (combined in quadrature with the standard deviation).

CONSTANTS (Table VII, p. 141; 'Molecular constants in cm^-1'; 'Preferred values are in \
italics'; 'Deviations are standard deviations quoted in units of the last decimal'). \
Eq. (5): E = B_0 J(J+1) - D J^2(J+1)^2 for v = 0 (printed with a stray 'J^2' for J_0^2) \
and Eq. (6): E = nu_0 + B_1 J(J+1) - D J^2(J+1)^2 for v = 1; 'The dependence of D on v \
is neglected, because Delta D is beyond the experimental accuracy' (p. 141): D is one \
constant for both levels (so D_1 = D_0 by assumption; no D_1 is determined). The \
italic (preferred) values for 14N2 are B_0 and D from the pure rotational analysis, and \
nu_0 and B_0 - B_1 from the unconstrained rotation-vibration analysis (image checked). \
'The deviations quoted in Table VII refers only to the internal consistency' (p. 142). \
'The rotational constant B_0 given in Table VII shows a systematic shift between the \
two types of spectra, whereas the D values are in excellent agreement. The B_0's \
obtained from the pure rotational spectra have to be preferred because of the \
calibration by the internal standard' (p. 142): 1.989707 against 1.989574, 11 \
standard deviations; the rotation-vibration B_0 and D are use = 'check'. A Th-calibrated \
pure rotational analysis gave B_0 = 1.989785 +- 20 x 1e-6 cm^-1 ('even worse', p. 142; \
not taken). The constrained analysis holds B_0 and D at the 'Rot.' values (printed in \
parentheses, not taken). B_1 is not printed: B_1 = B_0 - (B_0 - B_1) is 1.972323 \
(unconstrained) or 1.972217 (constrained) cm^-1 (computed here, not stored).

CHECKED (2026-09-26, scratch script): the 'obs. - calc.' column of Table I is reproduced \
from the Rot. constants (B_0 = 1.989574, D = 5.76e-6) to <= 0.0002 cm^-1, and that of \
Table IV from the unconstrained constants (B_0 = 1.989707, D = 5.71e-6, nu_0 = \
2329.9168, B_1 = B_0 - 0.017384) to <= 0.0003 cm^-1 (the rounding of the printed \
constants), as the paper says (p. 142: 'obtained using the constants from the \
unconstrained analysis'; the constrained constants leave residuals up to 0.016).

ALPHA (Table VIII, p. 143): alpha = B_0 - B_1 + 2 gamma (Eq. 7), gamma = -4.6e-5 cm^-1 \
'as determined by Lofthus [3]', the same gamma assumed for all isotopologues; alpha is \
the alpha_e of Eq. (2), B_v = B_e - alpha (v + 1/2) + gamma (v + 1/2)^2. Reproduced \
exactly from Table VII (0.017384 - 0.000092 = 0.017292). The unconstrained values are \
preferred (italic) and 'adopted for further calculations' (p. 143) because alpha \
mu^(3/2) is more nearly constant: 0.32036 +- 6, 0.31994 +- 4, 0.31991 +- 4 \
(unconstrained) and 0.31986 +- 10, 0.31944 +- 23, 0.31985 +- 4 (constrained) for 14N2, \
14N15N, 15N2 (notes only: no quantity). alpha depends on an assumed gamma: use = \
'check' (B_0 - B_1 is the measured constant).

B_e AND r_e (Table IX, p. 143): B_e from Eq. (2) with Table VIII's alpha and Lofthus's \
gamma (B_e = B_0 + alpha/2 - gamma/4 = 1.9982315 reproduces 1.998232), r_e with the \
constants of Taylor et al. [15]: r_e(14N2) = 1.097700 +- 7 A, mean of the three \
isotopologues 1.097701 +- 0.000004 A (p. 145; bond length, no quantity: notes only). \
D check (p. 143): D = 4 B_e^3/omega^2 (Eq. 8) with Lofthus's omega gives D(14N2) = 5.74 \
x 10^-6 cm^-1 (5.36 and 5.00 x 10^-6 for 14N15N and 15N2 by mu^-2 scaling), 'agreeing \
well with the values given in Table VII' (text values, not stored: a model estimate \
with another paper's omega).

TABLE X (p. 144; the unlabelled table tbl_66df62a78ce2, its title 'TABLE X Molecular \
constants for 14N2' extracted as text): 'Error limits are quoted in units of the last \
decimal. Values in parentheses are transferred from Stoicheff [1] and used in a \
constrained analysis. a Q branch maximum.' The other authors' rows are reproduced \
(table10_* datasets, one per constant, a row per author); none of the cited papers is \
in the library. The parenthesised values of Lofthus (B_0 1.9897, nu_0 2329.66) and \
Wilkinson (nu_0 2329.66) are Stoicheff's, held fixed in their analyses: not taken \
(Stoicheff's own row has them). The 'This work' row repeats Table VII rounded, but \
prints nu_0 as 2329.92 +- 2 (+-0.02 cm^-1, an error limit twice the p. 142 \
statement's 0.01 and 70 times Table VII's standard deviation): not a separate dataset. \
The error limits' level is not stated. 'In those cases where error limits are given, \
the agreement with the results obtained in the present work are within 2 or 3 times \
the sum of the deviations' (p. 145), except for Wilkinson's alpha.

FORMULAS: the spectroscopic model is Eqs. (5)-(6) with the Table VII constants, \
recorded as datasets (no separate formula entry)."""

