variable = "lambda: wavelength in um"
form = "n2_sellmeier"
terms = { B = ["0.00032323117217767093", "0.00011557814904827939", "0.00010909808164540697"], C = ["0.0045416501944977915", "0.011120847461156543", "0.0006827046691889898"] }
state = "1bar_0C"
