[[formulas]]
id = "keldysh_parameter"
equation = "Sect. 1.1.1, p. 1696"
printed = "gamma = omega (2 m* E_g)^(1/2) / (e E)"
variable = "m*, e: the effective mass and charge of the electron; E the amplitude of the laser field at frequency omega; E_g the band gap"
check = "Nothing to reproduce."
notes = "Note the factor 2 under the root (compare couairon_2005 and jing_2012: omega sqrt(m U_i)/(e E) with m the reduced mass)."

[[formulas]]
id = "rate_equations"
equation = "Sect. 1.1.3, p. 1697"
printed = "dN/dt = a I N + sigma N I^m; with trapping: dN/dt = a I N + sigma N I^m + sigma_x N_STE I^(m_x) - N/tau_x, dN_STE/dt = -sigma_x N_STE p I^(m_x) + N/tau_x"
variable = "N: conduction-band density; a a constant (avalanche); sigma the m-photon cross section; N_STE the self-trapped-exciton density; sigma_x the m_x-photon cross section of STEs; tau_x the trapping time"
reproduced_from = ["stuart_1996"]
check = "Nothing to reproduce."
notes = "As printed, the multiphoton term sigma N I^m is proportional to N; in stuart_1996 (Eq. 21), cited as ref. 19 for the first equation, the photoionization rate P(I) does not multiply n. The symbol p in the STE equation is not defined."

[[formulas]]
id = "drude_and_plasma_index"
equation = "Sects. 1.1.2 and 1.2.2, pp. 1696-1698; Sect. 2.2, p. 1702"
printed = "eps = 1 - omega_p^2 [tau^2/(1 + omega^2 tau^2) + i tau^2/(omega tau (1 + omega^2 tau^2))], omega_p = sqrt(e^2 N/(eps0 m*)); n = n0 - N/(2 n0 N_c), N_c = omega^2 eps0 m*/e^2; Delta n = N_STE e^2/(2 n0 m eps0) x 1/(omega_tr^2 - omega^2); P_cr = 3.77 lambda^2/(8 pi n0 n2); n2 = 3 chi(3)/(4 eps0 c n0^2), I = (1/2) eps0 c n0 E^2"
variable = "tau: the scattering time; omega_tr the STE resonance (~4.2 eV in SiO2)"
coefficients = { factor = "3.77" }
check = "Nothing to reproduce."
notes = "The STE (Lorentz) index change explains the positive phase shift in SiO2 after ~150 fs (p. 1702)."

[[formulas]]
id = "frohlich_coupling"
equation = "Sect. 2.4, p. 1704"
printed = "alpha = (e^2/hbar) (m*/(2 hbar omega_LO))^(1/2) (1/eps_inf - 1/eps_0)"
variable = "omega_LO: the LO phonon frequency at the zone centre; eps_inf, eps_0 the high-frequency and static dielectric constants; m* the electron effective mass"
reproduced_from = ["G. D. Mahan, Many Particles Physics (Plenum, New York, 1990)"]
check = "Nothing to reproduce."
notes = "Gaussian-unit form, as printed."
