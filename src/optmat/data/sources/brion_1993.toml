citation = "J. Brion, A. Chakir, D. Daumont, J. Malicet and C. Parisse, \"High-resolution laboratory absorption cross section of O3. Temperature effect\", Chem. Phys. Lett. 213, 610 (1993)"
doi = "10.1016/0009-2614(93)89169-i"
library = "Brion_1993_HighResolutionLaboratory"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """The device of daumont_1992 (their ref. [6]): quartz absorption tubes 32.85 and \
815.0 mm long, ozone partial pressure about 1-600 Torr (optical densities near unity), \
Jobin-Yvon THR 1500 and HR 640 spectrometers, 'In both cases the spectral bandwidth is \
about 0.01 nm'; for low temperatures a cryostat with cooled methanol flow (fluctuation \
within 0.1 K, below 0.3 K along the cell); sigma = D / (2 l [(p_O2)_i - p_T]) x RT/N, \
the ozone pressure from the total pressure during decomposition (p. 612)."""
notes = """Identity checked against the first page (PDF page 1, journal p. 610): Brion, \
Chakir, Daumont, Malicet and Parisse, Chem. Phys. Lett. 213, 610 (1993). Journal pages \
610-612 = PDF pages 1-3. O3 only. A three-page letter announcing the Reims (BDM) \
temperature-dependent cross sections; the full account is malicet_1995 (same data, \
same group).

Facts for the data files:
- Temperatures: 218, 228, 243 and 295 K over 195-345 nm, and 273 K over 300-345 nm \
(p. 610); p. 612 says 'at five temperatures between 295 and 218 K in the spectral range \
190-350 nm (273 K: 300-345 nm) in steps of 0.01 nm' (190-350 against 195-345 on p. \
610: the range of the files is not unambiguous).
- Resolution and sampling: spectral bandwidth about 0.01 nm; steps of 0.01 nm (p. 612).
- Wavelengths: medium not stated (daumont_1992's calibration is in air).
- Absolute scale: the pressure method (formula above), not normalised; at 253.65 nm and \
ambient temperature '(113.0 +- 1.1) x 10^-19 cm^2 is close to the new value determined by \
Mauersberger et al.: (113.6 +- 0.5) x 10^-19 cm^2 ... this agreement confirms the \
validity of our absolute measurements' (p. 611).
- Uncertainty: 'the total error has been estimated [daumont_1992] as 1.3% in the Hartley \
band and 1.3% to 2.5% in the Huggins bands' (p. 612; level not stated).
- The published file: 'now available on floppy disks' (p. 612).

Temperature effect (p. 611): at 253.65 nm the cross section increases by about 1 % from \
295 to 218 K; negligible in the 210 nm window; strong in the Huggins bands, \
particularly between the peaks; the structure shifts about 0.05 nm to shorter \
wavelengths at 218 K. Comparisons (p. 611): Molina and Molina better than 1 % near 210 \
nm, 2-3 % above 230 nm; Bass and Paur 1-2 % after recalibration to Mauersberger et \
al. and a shift of their wavelength scale by about 0.05 nm towards the UV. No table; \
Figs. 1-2 only."""

