material = "O3"
points = [["253.65", "253.65", "113.0", "1.1"]]
table = "text"
quantity = "absorption_cross_section"
unit = "cm2"
scale = 1e-19
abscissa_unit = "nm"
wavelength_medium = "standard_air"
use = "reproduced"
reproduced_from = ["daumont_1992"]
notes = "p. 611: 'At ambient temperature, our sigma value (113.0 +- 1.1) x 10^-19 cm^2' at 'the mercury line wavelength (lambda = 253.65 nm)': daumont_1992's method-1 value (113.05 +- 1.1), rounded. Medium not stated (air, as daumont_1992). Ambient temperature (295 K, daumont_1992)."
[datasets.uncertainty]
column = true
level = "not stated"
