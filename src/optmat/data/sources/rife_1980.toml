file = "Cer-Vit-C101/rife_1980__glass_a_n.csv"
table = "tbl_5e4d1f912c2e"
quantity = "refractive_index"
abscissa_unit = "angstrom"
use = "primary"
notes = "Table I, glass A (Cer-Vit C101), n, 68-308 A, reflectance against angle of incidence. The 68 A row is below the measured range (stray light)."
[datasets.parameters]
