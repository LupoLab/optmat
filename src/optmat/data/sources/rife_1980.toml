citation = "J. Rife and J. Osantowski, \"Extreme ultraviolet optical properties of two SiO2 based low-expansion materials\", J. Opt. Soc. Am. 70, 1513 (1980)"
doi = "10.1364/josa.70.001513"
library = "Rife_1980_ExtremeUltravioletOptical"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Unpolarized reflectance (the average of s and p, measured on both sides of \
normal incidence) at 15, 45, 70, 80 and 85 degrees angle of incidence of two \
superpolished (bowl-feed; about 10 A rms by FECO; 5 x 7.5 x 1 cm, flat to lambda/8) \
commercial low-expansion glasses: 80-310 A on the 2.2-m grazing-incidence monochromator \
of the NBS SURF synchrotron (about 2 A resolution with 250 um slits, points every 2 A; \
scattered light removed with an e^-lambda function fitted at 60 A, second order \
corrected as 3 % of the first-order flux at lambda/2), and 300-1050 A with line sources \
on the Goddard reflectometer (pp. 1513-1514). n and k from the intersections of the \
isoreflectance curves of the different angles in n-k space (the reflectance-versus-angle \
method): at 100 A the 80 and 85 degree curves, at 300 A the 70 and 45 degree curves \
(p. 1515)."""
notes = """Journal pages 1513-1518 = pdf pages 1-6 (p. 1513 is pdf page 1). Identity checked against the first page. \
The glasses (footnote 1, p. 1518): glass A is 'Cer-Vit C101' (Owens-Illinois), 'a \
slightly amber recrystallized glass ceramic composed mostly of lithium aluminum silicate \
(Li2O.Al2O3.6.5SiO2) with small amounts of other materials including TiO2 for \
nucleation'; glass B is 'Code 7971-ULE-Glass' (Corning), 'a high silica glass with 7.5% \
TiO2 ... formed by plasma deposition' (p. 1514). Neither is pure silica: glass A is \
registered as Cer-Vit-C101, glass B is SiO2-TiO2 (already registered as Rife and \
Osantowski's sample). Wavelengths are vacuum wavelengths (a grazing-incidence vacuum \
monochromator in the extreme ultraviolet).

WHAT THE TABLES HOLD. Tables I (glass A) and II (glass B), p. 1516: n and k at 68-308 A \
in 10 A steps, 'at selected intervals from 70 to 310 A' (p. 1515); 'The n and k error \
estimate indicates the range of reasonable intersection of the isoreflector curves in n \
and k space' (captions), printed on eight rows of each table (+-0.001 to +-0.004 in n, +-0.002 \
to +-0.015 in k): kept as per-point sigma with level 'bound'. The 68 A row lies below \
the 80 A lower limit of the SURF data, where 'The rising absorption below 75 A is most \
likely a stray light effect' (p. 1517); below 100 A 'the problems of \
monochromator-scattered-light correction were compounded by the small, relatively \
noisier, signal' (pp. 1515-1516). Table III (p. 1517): measured and calculated \
reflectances of glass A at 78, 118, 158, 228 and 298 A for the five angles; \
reflectance has no quantity: not extracted. Check (2026-09-27): the Fresnel \
reflectances computed from Table I's n and k (n - ik, unpolarized) reproduce Table \
III's calculated rows to 1 in the last printed digit at 15-80 degrees and to 7e-4 at 85 \
degrees (78 A: 0.5664 against 0.5658), which also confirms that Table I is glass A. The \
measured and calculated reflectances 'agree well' at 70-85 degrees, but not at 15 and \
45 degrees at short wavelengths (p. 1515; up to a factor 20 at 78 A, 15 degrees).

FIGURES (not digitised). Figs. 1 and 2: the reflectance of glass A and glass B at the \
five angles, 80-310 A (SURF) and 300-1050 A (NASA, glass A's published before in \
Osantowski, J. Opt. Soc. Am. 64, 834 (1974)). Figs. 3 and 4: n and k of glass A and \
glass B near the Si L_II,III edge (about 80-140 A, 2 A spacing). Fig. 5: n and k of \
glass A near the Al L_II,III edge. TEXT VALUES (notes only, no quantity): the plasma \
energy hbar omega_p ~ 23 eV (540 A) (p. 1514); the SiO2 k features at 79, 96, 108 and 114 A; the Si \
L_II,III edge of SiO2 at 106.5 eV against 99.8 eV in Si; the Si L_I edge at 79 A; the \
p-d enhancement peak at 95 A (p. 1517); Al L_II,III features at 128-160 A in glass A \
(about 10 mol % Al2O3) (pp. 1517-1518); the penetration depth in glass A at 120 A, about \
850 A at normal incidence and 100 A at 85 degrees (p. 1516).

REPRODUCTION IN philipp_1985 (checked 2026-09-27 against the files). Palik's Table X \
(philipp_1985/rife_osantowski_n, _k, 82-290 A, material SiO2-TiO2, 'a high-silica \
glass with 7.5% TiO2') is not a copy of glass B alone:
- 88, 98, 108, 118, 128 and 138 A equal Table II (glass B) exactly, n and k;
- the 2-A-spaced rows between them (82-86, 90-96, ..., 130-136 A) are in neither table \
(presumably read from Fig. 4 or the authors' data);
- 150, 160, ..., 260 A equal Table I (GLASS A, Cer-Vit) at 148, 158, ..., 258 A, n and k \
exactly, with the wavelength moved up by 2 A (and the eV column computed from the moved \
wavelength);
- 270, 280 and 290 A (n 0.9207, 0.9175, 0.9137; k 0.068, 0.075, 0.082) match neither \
table (glass B prints 0.9225, 0.9214, 0.9202 at 268-288 A).
So Table X's 150-260 A rows are the lithium aluminosilicate glass ceramic, not the \
titania-silica glass. philipp_1985's two datasets now cite this record."""

[[datasets]]
