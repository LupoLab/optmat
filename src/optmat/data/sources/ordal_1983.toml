citation = "M. A. Ordal, L. L. Long, R. J. Bell, S. E. Bell, R. R. Bell, R. W. Alexander, Jr., and C. A. Ward, \"Optical properties of the metals Al, Co, Cu, Au, Fe, Pb, Ni, Pd, Pt, Ag, Ti, and W in the infrared and far infrared\", Appl. Opt. 22, 1099-1119 (1983)"
doi = "10.1364/AO.22.001099"
library = "Ordal_1983_OpticalPropertiesMetals"
identity = "VALIDATED_WITH_WARNINGS"
kind = "compilation"
technique = """A compilation, not a measurement: 'Infrared optical constants collected from \
the literature are tabulated' (abstract, p. 1099). Tables 1-12 (pp. 1103-1118) give, for \
each of twelve metals, blocks of omega (cm-1), lambda (um), -epsilon_1, epsilon_2, n and k \
to three significant figures, one block per original source, each under its reference \
line. 'All data in the form of n and k were changed to epsilon_1 and epsilon_2' (Sec. III, \
p. 1116). The authors then fitted the Drude model, Eq. (2), by eye to the compiled \
epsilon of Au, Ag, Cu, Al, Pb and W (Table 13, p. 1118): omega_tau from Eq. (12), \
omega_tau = omega epsilon_2 / (1 - epsilon_1), and omega_p from Eq. (13), omega_p^2 = \
(1 - epsilon_1)(omega^2 + omega_tau^2), at several omega, keeping 'the curve with the best \
eyeball fit to the data'; for Au and Pb, omega_tau instead from Brandli and Sievers's \
far-infrared surface resistance, Eq. (14), with omega_p from the near-infrared fit \
(p. 1118)."""
notes = """Journal pages 1099-1119 = PDF pages 1-21 (0003-6935/83/071099-21). PDF page 22 \
is not part of this paper: three photographs of a lens-polishing set-up ('6 Close-up of \
polishing setup', '7 Interferogram ...', '8 Grinding the cone ...') from another article \
of the issue. Identity checked against the first page (the library flags warnings on the \
bibliographic record only).

WHAT IS TABULATED. Tables 1 Al, 2 Cu, 3 Au, 4 Pb, 5 Ag, 6 Co, 7 Fe, 8 Ni, 9 Pd, 10 Pt, \
11 Ti and 12 W, each a run of blocks from different authors, printed one after another \
with a caption per block ('TABLE 2. Cu, COPPER (Continued)') and the block's reference \
line. The data of Al, Cu, Au and Ag are datasets here, one per metal, quantity and block \
(18 blocks, 245 rows, 72 datasets): n and k use = reproduced (every value is another \
author's), epsilon_1 and epsilon_2 use = check (Ordal et al.'s conversion of the same n \
and k), all with reproduced_from naming the block's source (the curated id where there is \
one, otherwise the reference line as printed). lambda (= 1e4 / omega) has no dataset and \
stays in printed. The fourth column is headed -epsilon_1 (checked on the images): stored \
as printed with scale = -1. No uncertainty is given for any block, and nothing is said \
about the samples (film or bulk, preparation) or the methods of the originals: for those \
see the originals. The figures' captions (Figs. 1-12, pp. 1100-1102) name the sources the \
same way.

WHICH BLOCK IS WHICH. The library splits the tables into 39 blocks (155 files) and its \
captions are not reliable (tools/extract/ordal_1983.py lists the cases): the assignment \
here was read from the page images, where each caption and reference line sits directly \
above its block. The library's 'TABLE 3. Au, GOLD' (tbl_6418218be243) is copper after \
Dold and Mecke; gold starts with the next block (Bennett and Bennett, tbl_d345d262b8b8).

CHECKS (2026-09-28). Every row of the 18 blocks, and of the other 21, satisfies \
epsilon_1 = n^2 - k^2 and epsilon_2 = 2nk, and lambda = 1e4 / omega, to within the \
printed rounding of the cells (the bound from half a unit in the last digit of each). \
The worst row per table: Table 1 (Al), Shiles block at 6.45E+03 cm-1, -epsilon_1 \
printed 252 against k^2 - n^2 = 253.9 (0.91 of the bound); Table 2 (Cu), Lenham and \
Treherne at 5.00E+02, 13500 against 13401 (0.57); Table 3 (Au), Weaver et al. at \
1.21E+03, 3070 against 3077.6 (0.72); Table 5 (Ag), Bennett and Bennett at 8.33E+02, \
epsilon_2 1280 against 1283 (0.47). Unlike Ordal et al. (1988; ordal_1988, 51 errata), \
no |epsilon| is printed ten times too small, and no erratum is needed. The cells were \
compared with the images block by block.

THE SOURCES (as the blocks and Refs. 7-11 give them):
- Al (Table 1, Fig. 1, Ref. 7): Shiles, Sasaki, Inokuti and Smith 1980 (323-16100 cm-1; \
the values of Weaver et al.'s tabulation, Physics Data 18-2, p. 79); Bennett and Bennett \
1966 (313-1250 cm-1; a Drude curve, below); Schulz 1954 (10500-25000 cm-1, 0.95-0.40 um).
- Cu (Table 2, Fig. 2, Ref. 8): Schulz 1954 (10500-22200); Lenham and Treherne 1966 \
(500-2500); Robusto and Braunstein 1981 (15600-25000); Hagemann, Gudat and Kunz 1975 \
(807-16100; the DESY report's rows, hagemann_1974); Dold and Mecke 1965 (1000-8000).
- Au (Table 3, Fig. 3, Ref. 9): Bennett and Bennett 1966 (313-3330; a Drude curve); \
Schulz 1954 (10500-22200); Motulevich and Shubin 1965 (833-10000); Padalka and \
Shklyarevskii 1961 (909-10000); Bolotin et al. 1962 (1050-4000); Brandli and Sievers 1972 \
(31.4-150, the far infrared); Weaver et al. 1981 (807-16100).
- Ag (Table 5, Fig. 5, Ref. 11): Bennett and Bennett 1966 (313-5000; a Drude curve); \
Schulz 1954 (10500-25000); Hagemann et al. 1975 (807-16100).
The blocks overlap and disagree: at 1000 cm-1 (10 um) gold's n + ik is 7.62 + 71.5i \
(Bennett), 11.5 + 67.5i (Motulevich), 7.41 + 53.4i (Padalka) and, at 1050 cm-1, 10.9 + \
50.6i (Bolotin); the authors do not choose between them.

BENNETT AND BENNETT'S BLOCKS ARE A DRUDE CURVE. The introduction says Bennett and \
Bennett showed that the Drude model fits the reflectance of Au, Ag and Al at 3-30 um 'with \
one adjustable parameter; i.e., the Drude model parameters were obtained from the dc \
resistivity and fitted with one free electron per atom for gold and silver and 2.6 free \
electrons per atom for aluminum' (p. 1099; Ref. 5: omega_tau estimated at 145, 216 and \
663 cm-1 for Ag, Au and Al). Every row of the three Bennett blocks gives, by Eqs. (12) and \
(13), the same omega_tau and omega_p to the printed rounding (Al 657-669 and \
118,200-119,100 cm-1; Au 214-217 and 72,500-73,000; Ag 144.8-146.1 and 72,360-72,710): \
the blocks are that model, not measured points.

HAGEMANN'S AND WEAVER'S BLOCKS. The Hagemann blocks cite the JOSA paper (hagemann_1975, \
figures only) but are the DESY report's printed rows (hagemann_1974) at 0.1-2.0 eV, n and \
k rounded (n to two decimals) and epsilon recomputed from them. The Weaver block of gold \
is Weaver et al.'s gold table (weaver_1981), agreeing with the Babar-Weaver file's copy \
(sheet JHW-Au-ZAED) at every common energy; epsilon is again recomputed from the rounded \
n and k. See the datasets' notes for the numbers.

TABLE 13 (p. 1118): Drude parameters fitted to the compiled epsilon, the formulas below \
for Al, Cu, Au and Ag. Columns: omega_f, 'the frequency at which the fit is forced'; \
omega_tau and omega_p of the IR fit; -epsilon_1(0) = (omega_p / omega_tau)^2; omega_tau \
'from dc resistivities and omega_p' (Ref. 19, the AIP Handbook); omega_tau at the \
crossover -epsilon_1 = epsilon_2. Pb: 5.00x10^1, 1.45x10^3, 6.20x10^4, 1.33x10^3, \
1.35x10^3, 1.55x10^3; W: 8.06x10^2, 4.33x10^2, 4.84x10^4, 1.25x10^4, 2.16x10^2, 4.30x10^2 \
(same order, cm-1). The Al, Au and Ag fits reproduce Bennett and Bennett's Drude curves \
(to 0.1-5 %), not Shiles's Al (30-40 % away at 1000-5000 cm-1) nor Weaver's Au. The \
authors 'disclaim any physical significance for the Drude model' (p. 1118). Ordal et al. \
1985 (ordal_1985) revise these: Cu (omega_tau 73.2, omega_p 59,600), Pb ('a numerical \
error in our earlier tabulation') and slightly Al, Au, Ag and W; it also corrects this \
paper's Eq. (5) (epsilon_inf misplaced in omega_p) and Eq. (10) (the surface impedance's \
sign convention; Eq. (11), and so the numbers, unchanged).

THE OTHER METALS (not registered; not transcribed). Every row consistent as above. Pb \
(Table 4, pp. 1107-1108): Brandli and Sievers 1972 (6.25-121 cm-1, 14 rows); Golovashkin \
and Motulevich 1968 (833-22200, 32). Co (Table 6, pp. 1109-1110): Kirillova and Charikov \
1964 (500-4000, 19); Johnson and Christy 1974 (5160-53200, 49); Weaver, Colavita, Lynch \
and Rosei 1979 (807-16100, 18). Fe (Table 7, p. 1111): Weaver, Colavita, Lynch and Rosei \
1979 (807-16100, 31); Bolotin, Kirillova and Mayevskiy 1969 (526-10000, 21). Ni (Table 8, \
p. 1112): Lynch, Rosei and Weaver 1971 (807-12900, 50); Johnson and Christy 1974 \
(5160-20200, 16). Pd (Table 9, p. 1113, printed sideways): Weaver and Benbow 1975 \
(807-16100, 15); Bolotin, Kirilova, Nomerovannaya and Noskov 1967 (556-3330, 13; not \
among the library's tables); Johnson and Christy 1974 (5160-48200, 44; the library merges \
it with Weaver and Benbow's into one 12-column table without a CSV). Pt (Table 10, p. \
1114): Weaver 1975 (807-16100, 14); Weaver, Lynch and Olson 1974 (806-16100, 29). Ti \
(Table 11, pp. 1115-1116): Kirillova and Charikov 1964 (500-4000, 24); Lynch, Olson and \
Weaver 1975 (807-1690, 6); Johnson and Christy 1974 (5160-12200, 8); Kirillova and \
Charikov 1963 (2500-8330, 19); Bolotin et al. 1962 (1000-5000, 17), whose rows from 1180 \
to 4000 cm-1 repeat the Kirillova and Charikov 1964 block's (identical but for a unit in \
the last digit at 2220 cm-1; a probable compilation error). W (Table 12, pp. 1117-1118): Nomerovannaya, Kirillova and Noskov 1964 \
(500-10000, 48 + 19 rows over two blocks, the second without a reference line); Weaver, Lynch and Olson 1975 (484-16100, 19; \
epsilon_1 positive at 1.21E+04 and 1.61E+04, printed -epsilon_1 = -4.33 and -4.61).

FIGURES 1-12 (pp. 1100-1102): -epsilon_1 and epsilon_2 against omega (log-log) for each \
metal, the blocks' data as symbols and, for Al, Cu, Au, Pb, Ag and W, the Drude curve of \
Table 13 as a line; not digitised."""

[[formulas]]
id = "drude_Al"
material = "Al"
equation = "Eq. (2), p. 1099, with Table 13, p. 1118"
printed = "epsilon_c = epsilon_inf - omega_p^2 / (omega^2 + i omega omega_tau); Table 13, Al: omega_f (cm-1) for fit of data in IR 1.11x10^3; omega_tau (cm-1) IR fit 6.47x10^2; omega_p (cm-1) IR fit 1.19x10^5; -epsilon_1(0) = -(omega_p/omega_tau)^2 3.37x10^4; omega_tau (cm-1) from dc resistivities and omega_p 6.45x10^2; omega_tau (cm-1) crossover on -epsilon_1, epsilon_2 plot 7.00x10^2"
variable = "omega: wavenumber in cm-1; epsilon_inf = 1 (Eqs. 12-13, p. 1116, use 1 - epsilon_1)"
range = "The infrared of Fig. 1 (the fit is forced at omega_f = 1.11x10^3 cm-1); 'The high frequency termination occurs where the Drude model becomes invalid' (p. 1118)"
coefficients = { omega_tau = "6.47x10^2", omega_p = "1.19x10^5" }
check = "(omega_p/omega_tau)^2 = 33,829 against the printed -epsilon_1(0) = 3.37x10^4 (0.4 %, the parameters' rounding). At 1110 cm-1 the formula gives -epsilon_1 = 8,578, epsilon_2 = 5,000 against Bennett and Bennett's block 8.41E+03, 5.02E+03 (+2.0 %, -0.4 %); at 313 cm-1, +5 % and +2 %. Against Shiles et al.'s block it is 15-40 % off (1050 cm-1: 9,309 + 5,737i against 6.93E+03 + 4.07E+03i). Checked 2026-09-28."
notes = "A fit by eye to the compiled data (Sec. III); in effect it follows Bennett and Bennett's Drude curve (record notes). Superseded by ordal_1985/drude_Al (omega_tau 660, omega_p 119,000 cm-1)."

