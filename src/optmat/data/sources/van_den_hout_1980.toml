[[datasets]]
id = "table5_H2_176K"
material = "H2"
file = "H2/van_den_hout_1980__table5_H2_176K.csv"
table = "tbl_cd5b5a338e81"
quantity = "raman_line_shift"
unit = "MHz m3/mol"
abscissa = "label"
use = "primary"
excluded_rows = { "S0(3)" = "printed in parentheses (the paper does not say why; presumably less reliable)" }
notes = "Table V (p. 533), normal H2 (25.1 % pH2), 176 K: line-shift coefficients Delta nu_S/rho of S0(0), S0(1), S0(2), S0(3), MHz m3/mol (x 44.62 = MHz/amagat), from the interferometer scanning pressure at two or more densities (pp. 519-520). Sign: 'negative when the Raman line moves away from the exciting frequency with increasing density' (p. 532): a positive coefficient moves the Stokes line towards the laser, i.e. LOWERS the Raman shift (herring_1986 prints this paper's 77.8 K S0(0), S0(1) as -22.3, -17.8 MHz/amagat in the Raman-shift sign). No uncertainty printed; 'the accuracy of the data is discussed in the text' (limited by alignment drifts between densities a day apart; the depolarised Rayleigh line's shift, zero in theory, came out 0 +- 0.05 MHz m3/mol, p. 519)."
[datasets.parameters]
transition = "S0(J), v = 0, J -> J + 2, per row"
perturber = "self"
temperature_k = 176
ortho_para = "3:1"

