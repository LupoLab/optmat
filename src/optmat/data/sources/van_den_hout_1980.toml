citation = "K. D. Van den Hout, P. W. Hermans, E. Mazur and H. F. P. Knaap, \"The broadening and shift of the rotational Raman lines for hydrogen isotopes at low temperatures\", Physica A 104, 509 (1980)"
doi = "10.1016/0378-4371(80)90012-6"
library = "VanDenHout_1980_BroadeningShiftRatational"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Pure rotational Raman scattering (Stokes S0(J) lines) at 20-176 K (pp. \
512-516): a single-mode argon-ion laser at 514.5 nm (about 1 W), horizontally polarised, \
90 degree scattering from a brass cell (to 75 atm) on a continuous-flow cryostat \
(stability 0.1 K, platinum thermometer); a Glan-Thompson polariser, a 25 cm \
monochromator selecting one line and a pressure-scanned Fabry-Perot interferometer \
(free spectral range 38.95 or 75.56 GHz, finesse about 35, instrumental half width \
about 0.5 GHz), photon counting. The instrument removed by Fourier transform (Eqs. \
3-4); the lines are Lorentzian (Eqs. 8-9) and the half width is taken from the \
exponential decay of F_R(t). Densities 1000-5000 mol/m3 (about 20-100 amagat, p. 511). \
Samples: commercial nH2 (25 % pH2, > 99.9 %) and nD2 (67 % oD2, > 99.6 %); 90 % pH2 \
made on iron oxide at 20 K; 23 % oD2 - 77 % pD2 by preferential adsorption on Al2O3; HD \
from LiAlH4 and D2O (1.2 % D2, 0.2 % H2). The ortho-para composition monitored between \
runs (drift usually < 1 % per measurement, p. 516)."""
notes = """Identity checked against the first page (the library's title keeps the \
journal's 'ratational' misprint in the title field: the printed title reads \
'rotational'). PAGES: pdf page n is journal p. 508 + n (Table I p. 526, Table II p. \
528, Table V p. 533). The Leiden group's low-temperature continuation of keijser_1974 \
(its 293 K rows are Keijser's); knaap_1979 shows the same cross sections in figures.

MATERIALS. Normal H2 (Table I: 25.1 % pH2), normal D2 (66.7 % oD2), and the pure \
modifications oH2, pH2, oD2, pD2 extrapolated from the ortho-para series (Table II), \
all as datasets of H2 or D2 with parameters.ortho_para. HD is not a material (notes \
below). Only the Stokes S0(J) lines (v = 0, J -> J + 2).

WIDTH CONVENTION: HALF WIDTHS. Eq. (1), p. 510: I(nu) = (I_0/pi) Delta nu_1/2(rho) / \
[(nu - nu_R(rho))^2 + Delta nu_1/2(rho)^2], 'Delta nu_1/2(rho) is the halfwidth*', \
footnote * (p. 510): 'The halfwidth indicates half the (full) width at half height.' \
Eq. (9), p. 521: 1/(2 pi tau) = Delta nu_1/2, 'the collisional halfwidth'. The tables \
give Delta nu_1/2/rho in MHz m3/mol, 'a 1 MHz m3/mol corresponds to 44.62 MHz/amagat' \
(Tables I, II, V; Fig. 10: 1 amagat = 44.615 mol/m3, the 0 C amagat): HWHM per mole \
per m3. Checked: Table I's 293 K rows x 44.62 are keijser_1974's Table I (GHz/amagat \
HWHM) to the printed digits, every line of H2, D2 and HD.

DICKE. Eq. (5), p. 518: Delta nu_1/2^total = k^2 D_R/2 pi + B rho, D_R ~ 1/rho; 'A \
correction for the diffusional contribution was applied, using a value for the \
diffusional constant obtained from literature' (H2 self-diffusion from Harteck and \
Schmidt, Lipsicas, Hartland and Lipsicas, interpolated; HD and D2 by D ~ m^-1/2, p. \
519). The tabulated coefficients EXCLUDE the Dicke term (D_R 20 % above D changes them \
by < 1 %, p. 519).

UNCERTAINTIES. Tables I-II print +- per value; not described (level not stated). Laser \
mode hops: error 'not larger than 1 %' (p. 517). Line shifts: no per-value errors (the \
293 K ones are Cooper et al.'s); 'The accuracy of the data is discussed in the text' \
(Table V): two densities about a day apart, alignment drifts 'affected the line shift \
measurements severely' (p. 519); the depolarised Rayleigh line's shift, zero in theory, \
came out 0 +- 0.05 MHz m3/mol for nH2 against 'a typical Raman line shift' of 1 (p. \
519). Values printed in parentheses (H2 S0(3) at 176 and 137 K, D2 S0(4) at 148.5 K; \
HD) are not explained: excluded rows here.

SHIFT SIGN. 'Delta nu_S is the difference between the central line frequency at \
density rho and the frequency at zero density. The sign of Delta nu_S is negative when \
the Raman line moves away from the exciting frequency with increasing density' (p. \
532; also Eq. (2), p. 510). A positive coefficient therefore moves the Stokes line \
towards the laser: the Raman shift DEcreases. herring_1986 (Table VI) prints this \
paper's 77.8 K S0(0), S0(1) (0.5, 0.4 MHz m3/mol) as -22.3 and -17.8 MHz/amagat \
(delta nu = nu_R(rho) - nu_R(0) of the Raman shift): 0.5 x 44.62 = 22.3, 0.4 x 44.62 = \
17.8, the opposite sign convention, consistent.

CROSS SECTIONS (Tables III, IV, VI; no quantity, notes). S_RR = 2 pi Delta nu_1/2/(n \
<v>), <v> = (8 k_B T/pi mu)^1/2 (Eqs. 10-11); the shift cross section likewise (Eq. \
12). Checked (scratch, 2026-09-27): Table I's 77.8 K H2 S0(0), 0.70 MHz m3/mol, with n = \
N_A per mol/m3 and mu = 1.008 amu gives 0.57e-20 m2, Table III's 0.57. Table III \
(1e-20 m2), nH2 S0(0), S0(1): 293 K 0.40, 0.49; 77.8 K 0.57, 0.90; 24.8 K 1.51, 2.38; \
nD2 293 K 1.12, 0.89; 28.3 K 4.13, 3.03. Some Table III cells carry an extra \
superscript digit (0.39^4, 0.40^8, 0.64^2, 0.38^4, 0.44^6, 2.44 +- 0.1^5, 2.2^5; the \
library reads the 8 and the second 4 as 'g' and 'd'): an extra digit set small in the \
print (image checked), not transcribed. Table VIII (p. 544): the DWBA translational factors S_202(0) and S_224(0) fitted to the pure-limit \
cross sections (H2 24.8 K: 3.2 +- 0.2 and 19.2, 13.0, 16 from three lines; H2 77.8 K: \
0.9 and 5.8, 5.9, 6.2; D2 28.3 K: 7.0 and 35.2, 39.4, 34.9; 1e-20 m2), with Eqs. \
(25)-(27): model parameters, notes only. S_RR ~ m/T for H2 and D2 below 80 K (Fig. 26, \
p. 539).

HD (not a material). Table I (MHz m3/mol, HWHM), S0(0)-S0(4): 293 K 9.6, 8.5, 7.4, \
6.1, 4.5 (+- 0.2; Keijser's); 149.3 K 4.93, 4.80, 4.06, 3.1; 78.5 K 3.03, 3.09, 2.94; \
41.2 K 2.53, 2.35; 27.0 K 2.91, 2.33. Table V shifts: 149.3 K -1.8, -2.2, -1.2, \
(-0.1); 78.5 K -1.1, -1.5, -0.8; 41.2 K -0.3, -1.1; 27.0 K (-0.5), (-0.8).

FIGURES (not digitised). Figs. 10-14: half widths against density per temperature \
(nH2, nD2, HD, 90 % pH2 at 24.8 and 77.8 K, 23 % oD2 at 28.3 K); Figs. 15-16: \
coefficients against ortho-para composition; Figs. 17-21: cross sections against \
temperature; Figs. 22-24: shift cross sections; Fig. 27: Moraal's DWBA against \
experiment at 293 K; Fig. 28: Coombe and Kohler's DWBA (square well) against \
experiment, 20-300 K; Fig. 29: the HD S_RR^101 estimate.

WHO REPRINTS IT. herring_1986's table5_van_den_hout_295K (84, 104 MHz/amagat FWHM) is \
Table I's 293 K row doubled and converted, i.e. Keijser et al.'s values (note b); its \
table5_van_den_hout_80K (63, 99) is Table I's 77.8 K S0(0), S0(1) (0.70, 1.11 MHz \
m3/mol = 31.2, 49.5 MHz/amagat HWHM, x 2 = 62.5, 99.1 FWHM); its \
table6_van_den_hout_80K (-22.3, -17.8) is Table V's 77.8 K row with the sign reversed \
(above). herring_1986 is another extraction's record: the re-point is reported."""

