citation = "U. Hohm and U. Trümper, \"Temperature dependence of the dipole polarizability of xenon (1S0) due to dynamic non-resonant Stark effect caused by black-body radiation\", Chem. Phys. 189, 443 (1994)"
doi = "10.1016/0301-0104(94)00296-7"
library = "Hohm_1994_TemperatureDependenceDipole"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """The evacuated high-temperature Michelson interferometer of Hohm and Kerl (Meas. \
Sci. Technol. 1, 329 (1990); hohm_1990), quartz sample cell, 290-1100 K; four sources \
at once, He-Ne lasers at the vacuum wavelengths 632.99, 594.096 and 543.516 nm and a \
He-Cd laser at 325.13 nm (at most 2 mW, 'to exclude non-linear effects'). At each \
temperature 4-8 isothermal measurements between 1e4 and 5e5 Pa, up to 24 pressure \
points each; the polarizabilities follow from the Fourier transform of the \
pressure-dependent interferograms (hohm_1990b, hohm_1993), extrapolated to zero density \
(Eq. 9). Xenon purity better than 99.99 % (Linde) (pp. 444-445)."""
notes = """Identity checked against the first page (Chem. Phys. 189 (1994) 443-449, \
received 1 August 1994). Page numbers are the journal's: p. = pdf page + 442. The paper \
olney_1997 cites as Ref. [102] for the xenon polarizability its S(-2) was renormalised \
to.

WHAT THE VALUES ARE (pp. 444-446). alpha(omega, T_k) = lim_(p -> 0) [(n^2 - 1)/(n^2 + \
2)] (3/4 pi) (k_B T_k/p)/a0^3 (Eq. 9): the polarizability of the free atom in atomic \
units (a0^3, i.e. 4 pi eps0 a0^3), at the four frequencies of the table's note, omega_1 = \
0.07198116, omega_2 = 0.07669359, omega_3 = 0.08383075, omega_4 = 0.1401389 au (the \
text's 632.99, 594.096, 543.516 and 325.13 nm, vacuum wavelengths; 45.563353/lambda(nm) \
reproduces the printed omegas). No state: zero-density values. Each is 'the arithmetic \
mean of 4 to 8 independent measurements; the errors given in parentheses are the \
statistical rms errors' (pp. 445-446, and Table 1's note a). Uncertainty budget (p. 445): \
Delta p/p < 5e-4, Delta T/T < 2e-4, Delta N/N < 1e-4, Delta l/l < 1.7e-4, Delta \
lambda/lambda < 1.5e-5 'would yield an overall uncertainty in the polarizability of \
Delta alpha/alpha < 10^-3'; the pressure error cancels in the extrapolation, and the \
cell length and wavelength errors are common to all data, so for relative changes \
'the remaining uncertainty is determined by Delta T and Delta N and results in Delta \
alpha/alpha ~ 3 x 10^-4'; 'the absolute uncertainty is at least in the order of Delta \
alpha ~ 0.008 au'. Recorded: the rms errors as the per-point sigma, and 0.008 au/27.8 au \
= 3e-4 as a systematic relative uncertainty common to all points (its level is not \
stated; 'at least' is the paper's word).

TEMPERATURE DEPENDENCE. 'An increase of Delta alpha/alpha ~ 0.2 %/1000 K has been \
detected, which increases slightly with the frequency omega of the measuring light' \
(abstract), attributed to the dynamic non-resonant Stark shift of the atomic levels by \
black-body radiation: alpha(0, T) = S0(-2) + C S0(-4) T^2 + D S0(-6) T^4 + ... (Eq. 12, \
C = 40 (pi k_B/E_H)^2/21 = 1.885340e-10 K^-2, D = 8 (pi k_B/E_H)^4 = 7.837694e-20 K^-4 \
for alpha and omega in au; computed from the paper's k_B and E_H: 1.885341e-10 and \
7.837695e-20, as printed). The measured b1 exceeds the Eq. (16) prediction by a \
factor R(omega) = 1.57-1.62 (p. 448), 'a little bit outside their error limits' (p. 447); \
the authors suspect their measured temperature dependence is too large by R(0) (p. 448). \
Table 1's values are flat to +-0.01 au up to 666 K and rise by about 0.035 au above 760 \
K (Fig. 1, not digitised).

DIPOLE SUMS (p. 447, dataset dipole_sums_Xe): S0(-2) = 27.120(8), S0(-4) = 127.36(89), \
S0(-6) = 860(12), S0(-8) = 6407(602), 'obtained with a special fitting procedure from \
our zero-temperature limits alpha(omega, 0) [21, 25]' (Hohm, Mol. Phys. 78, 929 (1993) \
= hohm_1993; Hohm, Z. Naturforsch. A 48, 878 (1993), not in the library). The Eq. (16) \
predictions of Table 2 use instead Kumar and Meath's (1985) room-temperature S(-2k), k = \
1-5 (kumar_1985: C S(-4) = 1.88534e-10 x 129.6 = 2.443e-8 K^-2, the printed 2.44; at \
omega_1, 2.506e-8, the printed 2.50; checked).

COMPARISONS (computed 2026-09-27). At 294.26 K and 632.99 nm, 27.808(17) au = 4.1207 \
angstrom^3, against hohm_1990's 300-1100 K mean 4.1217(40) angstrom^3 = 27.815 au \
(-0.02 %), and against hohm_1994b's 27.8952(71) au at 293.60 K (-0.31 %; at 325.13 nm \
30.015 against 30.1116, -0.32 %; at 594.096 and 543.516 nm -0.31 % and -0.31 %): the same \
laboratory, the same method, the same year, and a 0.3 % difference, 11 times this \
paper's stated absolute uncertainty and 12 times hohm_1994b's printed one. hohm_1994b's \
xenon is +0.47 % above optmat's fit/Xe at 633 nm (its record's notes), so this paper's \
room-temperature values lie about +0.16 % above it. The dispersion alpha(omega_4) - \
alpha(omega_1) agrees: 2.207 here, 2.2164 in hohm_1994b. olney_1997 (Table 1 note n) \
prints 27.124 for this paper's xenon value and uses 27.12 as S(-2): the 294.26 K \
alpha(omega -> 0) = 27.1239(6), or S0(-2) = 27.120(8).

NOT EXTRACTED: Fig. 1 (alpha(0, T) with Eq. (14)'s fit and Eq. (13)'s theory curve), \
Fig. 2 (Delta alpha(T) = alpha(omega_4, T) - alpha(omega_1, T), formula eq_delta_alpha), \
the theory of Section 2 (Eqs. 1-8, 10-13, 15-16; Eqs. 14-16 are the formulas below)."""


