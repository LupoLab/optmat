notes = "Table III, Newell and Baird's Fabry-Perot resonator (an independent check of the cylindrical cavity; pressure, impurity and hydrostatic errors are common to both): (n - 1) x 1e6 at 0 degrees C, 760 Torr, measured near 20 degrees C and 600-760 Torr and reduced with Barrell and Sears's empirical air equation (Eq. 8); 47.736 GHz, vacuum wavelength c/f = 6.2802 mm (effectively static). Uncertainty: the rms sum of the Table II errors, 'a 2 sigma limit' (p. 3756). Excluded from polarizability fits: oxygen's microwave refractivity includes the paramagnetic (mu_r) term and the dispersion of the 60 GHz magnetic-dipole band ('The difference in the values for oxygen was to be expected as a result of the oxygen absorption at 60 GHz', p. 3757); it is not the electronic polarizability."
[datasets.uncertainty]
column = true
level = "2 sigma"

