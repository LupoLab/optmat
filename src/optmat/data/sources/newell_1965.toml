citation = "A. C. Newell and R. C. Baird, \"Absolute Determination of Refractive Indices of Gases at 47.7 Gigahertz\", J. Appl. Phys. 36, 3751 (1965)"
doi = "10.1063/1.1713942"
library = "Newell_1965_AbsoluteDeterminationRefractive"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Microwave cavity refractometry at 47.736 GHz: the resonant frequency of an \
evacuated and a gas-filled resonator, (n - 1) = (f_e - f_g)/f_g (Eqs. 1, 6), located \
with a hybrid-tee bridge (setting to 5 parts in 1e8, frequency referred to the NBS 100 \
kHz standard); two resonators, an invar TE017 cylindrical cavity (Q about 30 000) and a \
Fabry-Perot (spherical and plane brass mirrors on invar rods), each in a bell jar; \
cavity temperature from calibrated thermistors, the frequency corrected for it (Eqs. \
2-5); gas pressure from a U-tube manometer (0.05 Torr); a hydrostatic (cavity \
expansion on evacuation) correction of +0.30e-6 (Eqs. 15-16). At least 15 \
determinations per gas at a mean 20 degrees C and 600-760 Torr (pp. 3751-3756)."""
notes = """Reduction to 0 degrees C and 760 Torr (p. 3754): 'it is sufficient to assume that \
the refractivity of a gas is proportional to its density', with the ideal-gas law for \
helium and hydrogen (Eq. 7), Barrell and Sears's empirical equation for dry air (Eq. \
8) for nitrogen, oxygen and argon, and Berthelot's equation (Eqs. 9-14; T_c = 304.20 K, \
P_c = 55 366 Torr) for carbon dioxide; the gas laws were chosen by their agreement with \
NBS Circular 564; Eq. (14) agrees with the density tables to 2 parts in 1e8. The \
datasets' density is 'ideal' for He and H2 and 'real' for the others. The values are \
referred to 1 atm, 0 degrees C from measurements near 1 atm and 20 degrees C, so the \
ideal-gas scaling spans only the temperature step.

Accuracy (Table II; p. 3756): per-gas errors in (n - 1) x 1e6 from pressure, \
impurities, the hydrostatic correction, temperature and the random error 2 sigma_N \
(sigma_N the standard deviation of the mean of at least 15 determinations), combined \
in quadrature: 'This rms sum is then a 2 sigma limit of the estimated total error, and \
it is this value which is quoted in the results.' Cylindrical / Fabry-Perot totals: air \
0.05/0.13, Ar 0.05/0.13, CO2 0.08/0.23, He 0.05/0.05, H2 0.05/0.07, N2 0.07/0.12, O2 \
0.05/0.11. Impurities (Table I, ppm by volume): Ar N2 10, O2 10, H2O 6; CO2 N2 40, O2 \
10, H2O 5; He N2 10, O2 5, H2O 1; H2 N2 25, CO2 5, H2O 1; N2 O2 50, H2O 14; O2 N2 100, \
H2O 6.

Frequency and wavelength: 47.736 GHz, vacuum wavelength 6.2802 mm (c/f, computed \
here); the table lists 48 GHz. 'There is no reason to expect any dispersive effects \
for any of the gases except oxygen' (p. 3757): the values are effectively the static \
limit, but they include every low-frequency contribution: the infrared (vibrational) \
polarizability of the molecules (large for CO2) and, for oxygen, the paramagnetic \
permeability and the 60 GHz magnetic-dipole band, so oxygen is excluded. The other \
authors' wavelengths are c/f of their nominal frequencies; Maryott and Buckley's means \
('rf to optical') are stored at infinity.

Helium: 'a rather large difference ... when compared with the values quoted by Mayrott \
and Buckley and Essen and Froome', attributed to impurities in the others' helium; \
Jelatis (1948) and Cuthbertson and Cuthbertson (1932) agree with Newell and Baird (p. \
3757). Dry CO2-free air (288.13 +- 0.05, cylindrical) is not a curated species. The \
abstract's list repeats the cylindrical-cavity values."""

