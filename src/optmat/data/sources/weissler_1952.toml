citation = "G. L. Weissler and Po Lee, \"Absorption coefficients of oxygen in the vacuum ultraviolet\", J. Opt. Soc. Am. 42, 200 (1952)"
doi = "10.1364/josa.42.000200"
library = "Weissler_1952_AbsorptionCoefficientsOxygen"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Photographic photometry with a grazing-incidence vacuum spectrograph filled \
with O2 at 0.5-100 micron (Hg) and a line-emission light source (lines of O, N, C, Si, \
H, He ions, some in second and third order); light path 79.7 cm at 550 A to 103.3 cm at \
1300 A. Each k is the slope of ln I against p from at least three, often five, \
pressures (Beer's law tested) (Eqs. 1, 1a, pp. 200-201). Wavelengths are those of the \
source lines (vacuum ultraviolet: vacuum wavelengths; the printed wave numbers are \
1e8/lambda). Resolution: that of the spectrograph with a line source; not stated."""
notes = """Journal pages 200-203 = PDF pages 1-4. O2 only; 76 rows between 303.779 and \
1306.038 A (the paper's '76 wavelengths' counts the OI 990.797 line printed twice).

Quantity: k (cm^-1) is defined by I = I0 exp(-k x), 'x is the thickness of the \
absorbing gas layer at N.T.P.', reduced with the ideal-gas law x = T0 L p / (p0 T), T0 = \
0 C, p0 = atmospheric pressure (Eq. 1, pp. 200-201): a natural-log absorption \
coefficient per unit length at 0 C and 1 atm. The paper gives no conversion to cross \
sections. The datasets store the printed k with scale = 1e18 / n0 (and x 10^2 for Table \
I's column factor), n0 = 101325 Pa / (k_B 273.15 K) = 2.6867801e19 cm^-3 (the ideal-gas \
Loschmidt number from the exact SI constants, matching the paper's ideal-gas \
reduction), giving the photoabsorption cross section per molecule in Mb. The vocabulary \
has no photoabsorption cross section: 'photoionization_cross_section' is used, as for the \
noble gases, although below the first ionisation limit (about 1027 A) the absorption is \
into bands and dissociation continua, not ionisation (format need reported).

Accuracy (p. 202): 'The error in the coefficients presented here is estimated to be \
about ten percent for k-values greater than 100 cm^-1 and fifteen percent for lower \
values', with the note 'The experiment was not designed to measure k-values less than \
20 cm^-1 accurately'; slit-width errors 'within the stated limits'. 'it is felt that \
the accuracy of k-values which fall within molecular absorption bands is less than those \
within a continuum. Furthermore, their physical significance is not clear' (p. 201): \
those rows carry a band location (B.H., B.M., B.T.) in the printed column; they are not \
band averages but values at single source lines, partly inside unresolved bands.

Text values (pp. 200-203, not extracted as data): at 1300 A 'k less than 10 cm^-1'; \
between 1300 and 1000 A about 10 cm^-1 outside bands, 'a weak continuous absorption ... \
of the order of k = 50 cm^-1 to k = 100 cm^-1' (p. 202); between 1000 and 740 A the \
lowest value outside a band 110 cm^-1, in the bands 600 cm^-1 or more; below 740 A k = \
500-1000 cm^-1 'with a broad maximum of k = 700 cm^-1 between 400A and 600A and still \
being strong at 303A, namely k = 550 cm^-1' (p. 202). The abstract says 530 cm^-1 at \
303A, as Table I (5.3 x 10^2 at 303.779 A): the text's 550 is a misprint of the paper \
(no dataset holds it). The dotted curve of Fig. 1 (figure only) joins roughly the lowest \
k values between 1000 and 300 A. Reproduced (p. 200): Ladenburg and Van Voorhis's \
Schumann continuum maximum 490 cm^-1 at about 1450 A.

Comparison: Watanabe et al. (1953, watanabe_1953) found the k of these authors in \
1060-1170 A 'in general, considerably larger' (attributed to resolution) and the weak \
continuum near 1105 A of order 1 cm^-1, not 50-100 cm^-1; Metzger and Cook (1964, \
metzger_1964) measured windows of k = 0.20-0.62 cm^-1 at 1108-1216 A, where this table \
gives 43-120 cm^-1 at nearby lines. Above 1027 A these values are not reliable \
between bands.

Wave-number and wavelength columns disagree (1e8/lambda against the printed wave \
number) beyond their precision in 14 rows; the wavelength (the source line) is used and \
only row 54 is corrected, where the paper itself gives the evidence (erratum). Rows \
(printed wave number; wavelength implied by it): 4 (80431.1; 1243.30), 8 (83364.8; \
1199.55, italic digit), 15 (92201.7; 1084.58), 17 (96497.1; 1036.300), 18 (97942.8 for \
97492.8, a transposition), 32 (110667; 903.611), 33 (113815; 878.62, against 886.618 \
printed), 38 (120060; 832.917), 48 (142284; 702.820), 52 (148600; 672.948), 54 \
(151450; 660.284: erratum), 63 (172177; 580.797), 68 (185499; 539.086), 71 (188900, \
italic 00; 529.38), 74 (235236 for 232536, a transposition). In bands and windows a \
wrong wavelength would matter; in the continuum below 740 A it does not.

Table II's percent differences are not all reproduced by its columns: 640 and 670 \
differ by 4.6 %, printed 7.8 (the others agree to 0.3 %); not extracted.

Formula: Ladenburg and Wolfsohn's three-term dispersion of O2, quoted p. 200 (see \
formulas); the paper's integral of its continuum (p. 203) 'a mean oscillator strength of \
approximately f = 6', against Ladenburg and Wolfsohn's f3 = 5.9."""

