quantity = "absorption_cross_section"
unit = "Mb"
scale = 3.7219272080
abscissa_unit = "angstrom"
wavelength_medium = "vacuum"
use = "primary"
excluded_rows = { "1" = "k = 7 cm^-1, below the 20 cm^-1 the experiment 'was not designed to measure ... accurately' (p. 202, Table note)", "24" = "the paper prints the line OI 990.797 (100929 cm^-1, 1.7 x 10^2) twice, as rows 21 and 24; the repeat is dropped" }
notes = "Table I, rows in print order 1-76: k (cm^-1, natural log, layer reduced to 0 C and 1 atm) at the source-line wavelengths, printed as mantissa x 10^2; scale = 1e20 / n0 (n0 = 2.6867801e19 cm^-3) turns the mantissa into the photoabsorption cross section in Mb (see the source notes). 10 % for k > 100 cm^-1, 15 % for k <= 100 cm^-1 (rows with mantissa <= 1.0). Rows with a band location (printed column: B.H., B.M., B.T., reference 6 Price and Collins or 8 Tanaka and Takamine) lie inside molecular bands; the paper doubts their accuracy and meaning. Values above about 1000 A disagree strongly with the photoelectric data of watanabe_1953 and metzger_1964 (source notes). Row 54 prints 660.380 A for 660.280 (erratum)."
