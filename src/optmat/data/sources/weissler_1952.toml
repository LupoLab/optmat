check = "Read as a per-molecule oscillator model alpha = sum f_i / (E_i^2 - omega^2) (atomic units, E_i = hc/lambda_i), it gives the static polarizability 10.562 au and 10.774 au at 589 nm, 11.510 au at 300 nm, 13.694 au at 200 nm: 0.24-0.45 % below the stored fit/O2 (10.587, 10.805, 11.550, 13.755 au) (computed 2026-09-25)."
notes = "Quoted without the equation; the f_i are classical oscillator strengths per molecule. Watanabe et al. (1953) quote lambda_2 = 1468A from the same work and Koch's (1912) lambda_2 = 1421A. The original is not in the library (missing-K)."
