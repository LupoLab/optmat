citation = "P. Gürtler, V. Saile and E. E. Koch, \"High resolution absorption spectrum of nitrogen in the vacuum ultraviolet\", Chem. Phys. Lett. 48, 245 (1977)"
doi = "10.1016/0009-2614(77)80308-4"
library = "Gurtler_1977_HighResolutionAbsorption"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Absolute photoabsorption of N2 with synchrotron radiation from the DORIS \
storage ring (DESY) and a 3 m normal-incidence monochromator, resolution 0.03 A, \
photoelectric recording (sodium salicylate and an EMI 9804 photomultiplier); a \
windowless cell of 60 cm at 1e-4 to 1e-1 torr (membrane manometer); N2 99.997 % (pp. \
245-247)."""
notes = """Journal pages 245-250 = PDF pages 1-6. N2 only. No datasets: the absolute \
absorption cross section is given only in figures (Fig. 1: 990-660 A; Fig. 2: 700-450 \
A, with a Fano-profile inset), and the band oscillator strengths f(v') of the b 1Pi_u \
and b' 1Sigma_u^+ progressions only in Fig. 3 (plotted with the vibrational spacings \
DeltaG(v')). The abstract says 10-35 eV; the figures cover 12-30 eV (1000-400 A). No \
table; the text gives no cross-section values and states no uncertainty.

What the text states (pp. 247-249): agreement of the absolute cross section with Carter \
(1972), Huffman et al. and Lee et al. (1973) ('good agreement'); four regions (discrete \
bands with rotational structure above 795.9 A; sharp Rydberg bands 795-730 A on a \
continuum; below 730 A autoionisation 'apparent emission' structure; a vibrational \
progression near 500 A); Rydberg series to n = 23; quantum defects 1.05 and 0.17 \
(series to A 2Pi_u), 0.15 (nd sigma_g) and 0.94 (ns sigma_g) (to B 2Sigma_u^+), about \
0.9 near 500 A (to the C 2Sigma_u^+ state); the 5d sigma resonance halfwidth 20 meV \
(autoionisation rate 3e13 s^-1), 6s sigma 2e13 s^-1. None is a dispersion quantity. \
The data would need the tabulated cross section (the authors' or a later compilation, \
not in the library)."""
