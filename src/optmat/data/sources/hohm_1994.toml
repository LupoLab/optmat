citation = "U. Hohm, \"Dispersion of polarizability anisotropy of H2, O2, N2O, CO2, NH3, C2H6, and cyclo-C3H6 and evaluation of isotropic and anisotropic dispersion-interaction energy coefficients\", Chem. Phys. 179, 533 (1994)"
doi = "10.1016/0301-0104(94)87028-4"
library = "Hohm_1994_DispersionPolarizabilityAnisotropy"
identity = "VALIDATED_WITH_WARNINGS"
kind = "fit"
technique = """A two-term sum-over-states model of the parallel and perpendicular \
polarizabilities (Eqs. 4-5, four parameters f_par, f_perp, omega_par^2, omega_perp^2) \
fitted by least squares (Eq. 13, relative residuals) to N = 4-5 mean polarizabilities \
measured in the author's laboratory by refractometry at 632.99-325.13 nm and M = 1-5 \
Rayleigh depolarization ratios from the literature at 647.1-457.9 nm (p. 536)."""
notes = """Page numbers are the journal's (533-541; pdf page 1 = p. 533). Atomic units \
throughout (p. 535): 1 au of polarizability = 1.648778e-41 C^2 m^2 J^-1.

Mean polarizabilities (Table 2, input rows): 'whose frequency dependence is determined \
in our laboratory with very high precision (Delta alpha(omega)/alpha(omega) ~ 10^-5 \
with respect to a reference value alpha(omega_1)) in the frequency range between omega = \
0.07198 au (632.99 nm) and omega = 0.1401 au (325.13 nm)' (p. 536); from the free-molecule \
limit of the Lorentz-Lorenz function (Eq. 6). The absolute accuracy of the reference \
value alpha(omega_1) is not stated here; the same laboratory's apparatus gives |Delta \
alpha/alpha| < 1e-3 (hohm_1990, p. 809), used as the datasets' scale uncertainty. The \
column wavelengths are those of the table's note a), vacuum (632.990 nm with 0.0719812 \
au). The measurement temperature is not stated (room temperature presumably).

Sources of the inputs (note b-d): H2, ref. [33] 'U. Hohm, unpublished results', so this \
paper is their first publication (primary here); O2, N2O and CO2, ref. [29] 'U. Hohm, \
Mol. Phys. (1993); in press', published as U. Hohm, Mol. Phys. 81, 157 (1994) \
(hohm_1994b), whose Table 1 rows (b, this work) these inputs are, digit for digit \
(checked 2026-09-26): reproductions, not fitted beside the original. The original \
prints an absolute uncertainty of the last digits (O2 0.0013, N2O 0.0015, CO2 0.0013 \
au, level not stated, the same at every wavelength) and the gas temperatures (292.06, \
295.05, 293.80 K), which this paper omits; the 1e-5 relative figure quoted below is \
this paper's statement of the dispersion's precision.

Accuracy of the fit (p. 537): 'the mean dipole polarizabilities alpha(omega) are correct \
to 0.5% in the range between omega = 0 and omega = 0.2 au' (by comparison with Meath's \
DOSD values); kappa(omega) to 3 %. Table 1's caption: Delta f/f ~ 0.05 %, Delta \
omega^2/omega^2 ~ 0.1 %, 'more figures are given in order to reproduce the input data \
correctly'. The two-term form 'cannot account correctly for the Schumann-Runge band of \
O2' (p. 540), which makes its C6 10-20 % low.

Not extracted: the depolarization ratios (100 rho, Table 2; for the anisotropies later), \
the kappa(omega) dispersion (Figs. 2-3), the C6, C6', C6'' coefficients (Tables 3-5), \
and NH3, C2H6, cyclo-C3H6 (not curated species)."""

