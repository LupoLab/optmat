# Table 1 (p. 536): the fit parameters of Eq. (4),
# alpha(omega) = (1/3) [f_par/(omega_par^2 - omega^2) + 2 f_perp/(omega_perp^2 - omega^2)],
# omega the photon energy in hartree. Not in a registered form (the package's oscillator
# form takes f_i/(E_i^2 - omega^2) with E_i itself; here the strengths carry 1/3 and 2/3
# and the squared energies are printed), so recorded without a form. Equivalent oscillator
# terms: f = (f_par/3, 2 f_perp/3), E = (sqrt(omega_par^2), sqrt(omega_perp^2)).

[[formulas]]
id = "two_term_H2_a"
material = "H2"
equation = "Eq. (4) with Table 1, p. 536"
printed = "alpha(omega) = (1/3)(f_par/(omega_par^2 - omega^2) + 2 f_perp/(omega_perp^2 - omega^2)); H2 (a): f_par = 1.62632, f_perp = 1.40105, omega_par^2 = 0.23940245 au, omega_perp^2 = 0.29486069 au"
variable = "omega: photon energy in hartree; alpha in au"
range = "0-0.2 au (to 228 nm), 'correct to 0.5%' (p. 537); fitted 325-633 nm"
coefficients = { f_par = "1.62632", f_perp = "1.40105", omega_par2 = "0.23940245", omega_perp2 = "0.29486069" }
check = "Reproduces Table 2's calculated row to 1e-5 au (5.53888, 5.54649, 5.55364, 5.57795, 5.86052 against 5.53887 ... 5.86051); static limit 5.4321 au. Checked 2026-09-25."
notes = "Set a: two of Kumar and Meath's anisotropies used as depolarization inputs; its kappa(omega) is within 1.34 % of theirs at 0.3 au (set b: 40 %, p. 536)."

[[formulas]]
id = "two_term_H2_b"
material = "H2"
equation = "Eq. (4) with Table 1, p. 536"
printed = "as two_term_H2_a; H2 (b): f_par = 1.36603, f_perp = 1.70361, omega_par^2 = 0.20191405 au, omega_perp^2 = 0.35741442 au"
variable = "omega: photon energy in hartree; alpha in au"
range = "as two_term_H2_a"
coefficients = { f_par = "1.36603", f_perp = "1.70361", omega_par2 = "0.20191405", omega_perp2 = "0.35741442" }
check = "Reproduces Table 2's calculated row to 1e-5 au (5.53893, 5.54651, 5.55362, 5.57784, 5.86052); static limit 5.4328 au. Checked 2026-09-25."
notes = "Set b: one anisotropy input; its anisotropy dispersion is poor (40 % at 0.3 au), its mean polarizability as good as set a's."

