citation = "J. Berkowitz, \"Sum rules and the oscillator strength distribution in helium\", J. Phys. B: At. Mol. Opt. Phys. 30, 881 (1997)"
library = "Berkowitz_1997_SumRulesOscillator"
identity = "VALIDATED_WITH_WARNINGS"
kind = "compilation"
technique = """Evaluation of the oscillator-strength sums S(p), p = -2..+2, of helium from \
calculated discrete oscillator strengths (Kono and Hattori 1984, Drake 1996), the \
measured photoabsorption cross sections of Samson et al. (1994) and Bizeau and \
Wuilleumier (1995), and the calculated cross sections of Hino and collaborators, each \
region fitted by a power series in y = IP/E (IP = 24.5874 eV) and integrated \
(pp. 881-888)."""
notes = """Identity unverified by the library; the downloaded pdf's header gives 'J. Phys. B: \
At. Mol. Opt. Phys. 30 881' (1997), received 15 May 1996. No DOI recorded. Pages \
are counted from 881.

S(p) is 'defined with the excitation energy measured in Rydberg units' (p. 882): the \
datasets convert with scale 2^-p to atomic units. E/R in Table 1 uses R = 13.6057 eV \
(Table 2's weighted columns check with it). Pekeris's exact values (p. 881-882): \
S(-1) = 0.752 497, S(0) = 2, S(+1) = 8.167 45, S(+2) = 121.336. The 'exact' S(-2) = \
0.345 778 is derived from Miller's polarizability with a0 = 0.529 177 249e-8 cm \
(p. 889). The author's recommended totals (bold in Table 3) reach 99.78 % (S(-2)), \
99.40 % (S(-1)), 99.07 % (S(0)), 98.6 % (S(+1)) and 97.4 % (S(+2)) of the exact \
values; the older Migneron and Levinger sums (Table 3 column d) are in migneron_1965 \
and are not extracted again.

Table 3's partial sums are not extracted. Their merged cells were read on the image; \
the IP-120 eV S(-1) of Chan et al. is printed 0.4476 in the table but 0.4776 in the text \
(p. 888), and the table is probably wrong (0.4747 for Samson's data, 'the differences \
are < 1%').

Table 4's power-series fits are recorded as formulas; their integrals reproduce the \
Table 3 partial sums for the df/d(E/R) fits (checked 2026-09-24), but not for the \
3000-12000 eV (E/R)^2 df/d(E/R) fit.

Also in the text: Miller's 'exact' polarizability, printed '0.020 4956 x 10^-24 cm^3' \
(p. 889), a factor 10 too small (erratum below)."""

