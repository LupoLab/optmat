[[errata]]
dataset = "miller_alpha"
row = "1"
column = "value"
printed = "0.0204956"
corrected = "0.204956"
reason = "The printed polarizability is a factor 10 too small: helium's static polarizability volume is 0.205e-24 cm^3 (1.383 a.u.)."
evidence = "The paper's own derivation from it, S(-2) = alpha/(4 a0^3) with a0 = 0.529177249e-8 cm, gives its printed 'exact' S(-2) = 0.345778 only for 0.204956e-24 cm^3 (0.204956e-24/(4 x 1.48185e-25) = 0.34578; checked 2026-09-24)."

