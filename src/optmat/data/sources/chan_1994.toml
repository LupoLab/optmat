[[formulas]]
id = "tail_fit"
material = "N2O"
equation = "Section 3.1, p. 5"
printed = "df/dE = A E^-2 + B E^-3 + C E^-4, fitted over 90-203 eV: 'A = 2.005, B = 150.9 and C = -652.3 (x10^4)'"
variable = "E: photon energy in eV; df/dE (in Table 1's unit, 10^-2 eV^-1) = factor x (A E^-2 + B E^-3 + C E^-4), the printed '(x10^4)' read as applying to all three coefficients"
state = "none (per molecule)"
density = "none"
range = "fitted over 90-203 eV; used to estimate the valence-shell oscillator strength above 203 eV (7.1 % of 16.51)"
coefficients = { A = "2.005", B = "150.9", C = "-652.3", factor = "1e4" }
check = "With the factor on all three coefficients and df/dE in 10^-2 eV^-1: the integral from 203 eV to infinity is 1.1682, 7.08 % of 16.51 (printed 7.1 %); the curve gives 0.663 at 203.00 eV and 3.404 at 100.54 eV against Table 1's 0.686 and 3.44 (computed 2026-09-27)."
notes = "The paper's high-energy extrapolation of the low-resolution df/dE (Fig. 1 insert, to 300 eV). As in chan_1993_co2's tail_fit, the factor and the unit are inferred from the check; the coefficients are as printed."
