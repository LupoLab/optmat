citation = "W. F. Chan, G. Cooper and C. E. Brion, \"Discrete and continuum photoabsorption oscillator strengths for the electronic spectrum of nitrous oxide (5.5-203 eV)\", Chem. Phys. 180, 77 (1994)"
doi = "10.1016/0301-0104(93)e0386-a"
library = "Chan_1994_DiscreteContinuumPhotoabsorption"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Dipole (e,e) spectroscopy. Low resolution (about 1 eV FWHM, 8 keV, zero mean \
scattering angle): energy-loss spectra at 7.4-39.9, 40.0-79.3 and 80-203 eV at about \
0.5, 1 and 2 eV intervals, Bethe-Born converted; the valence-shell fraction above 203 \
eV from a fit A E^-2 + B E^-3 + C E^-4 to 90-203 eV (7.1 %); the whole TRK-normalised \
to 16.51 (16 valence electrons plus 0.51 for Pauli-excluded K-shell transitions) (pp. \
2-5). High resolution (0.048 eV FWHM, 3 keV): 5.5-30 eV, Bethe-Born converted and \
normalised at 26 eV to the low-resolution value; band and interval strengths by \
integrating the spectrum over energy ranges (pp. 7-11). Independent of optical data \
and target density; no line saturation. Background removed by quartering the sample \
pressure; energy scale from helium's 21.218 eV line. Linde N2O, 99 % (p. 3)."""
notes = """Values per molecule; no density or state involved (room-temperature N2O, not stated). \
Uncertainty (p. 4): 'The uncertainty of the present measurements is estimated to be \
+-5%, arising from use of the TRK sum-rule ... to determine the absolute scale, \
uncertainties in the determination of the kinematic Bethe-Born factors for each \
spectrometer, and the background subtraction procedures'. A small sharp peak at 12.94 \
eV (Figs. 4, 7) is 'likely due to very small nitrogen impurity' (p. 7).

Table 1 (p. 4): the low-resolution df/dE, 7.40-203.00 eV, 164 points (sigma(Mb) = \
109.75 df/dE(eV^-1)). Two energies are misprinted (errata): 129.28 and 131.23 for \
129.23 and 131.28 (the grid steps 2.05 eV, 127.18 ... 133.33, as in the carbon dioxide \
paper's Table 1, chan_1993_co2). Comparisons (pp. 5-6): Shaw et al. (1992) slightly \
higher at 20-25.83 eV; Lee et al. (1973) slightly lower at 20-25 eV, slightly higher \
at 40-50 eV; Cole and Dexter 10-15 % lower; De Reilhac and Damany significantly lower; \
Hitchcock et al. and Brion and Tan (normalised to Lee et al.) slightly higher. Sums \
computed from Table 1 (2026-09-27; trapezoid from 7.40 eV plus the paper's tail, the \
formula below): S(0) = 15.341 over 7.40-203 eV and 16.509 in all (normalisation 16.51; \
tail 7.08 %, printed 7.1 %); S(-1) = 14.254, S(-2) = 19.319 au, S(-3) = 34.02, S(-4) = \
70.57, S(-6) = 401.9. Olney et al. (olney_1997 table1_N2O) quote 20.23 au for the \
S(-2) of 'the originally published' spectrum, 4.7 % above this table's 19.32 (the CO, \
N2 and CO2 values of Olney's Table 1 agree with the corresponding Chan tables to 1 %): \
a finding, unexplained here. The paper prints no S(k).

Table 2 (p. 8): the three dissociative continuum bands below 10 eV integrated over the \
ranges printed in its header (B 1Delta 5.70-7.70, C 1Pi 7.70-8.97, D 1Sigma+ \
8.97-10.23 eV): the present values and Lee and Suto's (digitised from their figure and \
integrated over the same ranges by Chan et al., p. 9) as interval data; the others \
(Huebner et al., Rabalais et al., Zelikoff et al., and Chutjian and Segal's INDO \
theory) as band values (rows B, C, D), their own ranges not being stated (Zelikoff et \
al.'s, in zelikoff_1953, differ). Rabalais et al.'s C 1Pi value 0.007 'is likely to be \
incorrect' (p. 9). Table 3 (p. 11): 35 intervals, 10.23-16.40 eV, present and Huebner \
et al. (100 eV impact energy; 'in general about 10%-15% higher'). The present \
intervals 5.70-16.40 eV (Tables 2 and 3) are one dataset; the Table 3 intervals sum to \
1.543 (the low-resolution Table 1 gives about 1.62 over the same range), the Table 2 \
bands to 0.402 (Table 1: 0.376 to 10.23 eV).

zelikoff_1953 (curated) holds the same Zelikoff et al. band strengths (0.0015, 0.0211, \
0.367; its continuum_f): the Zelikoff dataset here is reproduced from it."""

