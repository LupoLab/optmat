quantity = "electronic_state_energy"
unit = "cm-1"
abscissa = "label"
use = "reproduced"
reproduced_from = ["K. P. Huber and G. Herzberg, Molecular Spectra and Molecular Structure IV. Constants of Diatomic Molecules (Van Nostrand Reinhold, New York, 1979), data collected through February 1977"]
points = [["1", "B 1Σu+ 2pσ", "91700.0", ""]]
notes = """H2 B 1Σu+ 2pσ: the lowest dipole-allowed state: the Lyman bands. Te (cm^-1), the minimum of the state's potential above that of X, as Huber & Herzberg tabulate it (WebBook constants of diatomic molecules, data/external/nist_webbook/H2_diatomic_constants.html.gz); their Trans. column reads 'B ↔ X 115 116 117 R'. The 0-0 band of that transition is at 90203.35 cm^-1 (parameters.nu00_cm1, .transition); with the lower state's own 0-0 band to X it gives T0, the energy from the ground level."""
