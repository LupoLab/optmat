citation = "P. J. Linstrom and W. G. Mallard (eds.), NIST Chemistry WebBook, NIST Standard Reference Database 69, National Institute of Standards and Technology, https://webbook.nist.gov, gas-phase ion energetics (ionization energy determinations), queried 2026-09-26, and constants of diatomic molecules (K. P. Huber and G. Herzberg), queried 2026-10-07"
doi = "10.18434/T4D303"
kind = "database"
technique = """The WebBook's ion-energetics pages list, for each molecule, the published \
determinations of the first ionisation energy (eV) with the method (S spectroscopy, \
PE photoelectron, PI photoionisation, EI electron impact, EVAL evaluation), the \
reference and a comment ('Vertical value' where the determination is vertical). \
The compilations behind them are Lias et al. (J. Phys. Chem. Ref. Data 17, Suppl. 1, \
1988) and its updates."""
notes = """A stopgap for the molecules' ionisation energies until the primary \
papers are in the library (TC-444; they are requested on the roadmap page). Every \
value here is the WebBook's listing of one primary determination, recorded as \
reproduced from it, with the reference as the WebBook prints it: one adiabatic \
determination per molecule (the most precise spectroscopic or threshold value \
listed) and, where listed, one vertical value. The WebBook pages were read, not \
stored (NIST Standard Reference Data). The uncertainty level is not stated. \
Page URLs: https://webbook.nist.gov/cgi/cbook.cgi?ID=<CAS>&Mask=20 with CAS \
C1333740 (H2), C7782390 (D2), C7727379 (N2), C7782447 (O2), C74828 (CH4), \
C2551624 (SF6), C10024972 (N2O), C124389 (CO2).

RE-POINTED: the primaries of eight datasets are now curated, and \
their reproduced_from names the curated record: adiabatic_N2 (trickl_1989), \
adiabatic_O2 (tonkyn_1989), adiabatic_CH4 (berkowitz_1987), vertical_CH4 \
(bieri_1977, itself a reprint of Heilbronner, Jones & Maier 1977), adiabatic_SF6 \
(frost_1967), vertical_SF6 (potts_1970), adiabatic_N2O (berkowitz_1977) and \
adiabatic_CO2 (wang_1988). No value was changed; each dataset's notes compare the \
WebBook's number with the paper's. Still not curated: McCormack et al. 1989 (H2; \
shiner_1993 recombines its Rydberg measurement, and liu_2010 quotes Liu et al. \
2009), Takezawa & Tanaka 1975 (D2; liu_2010 reprints it with a -1.0 cm^-1 correction), \
Banna & Shirley 1976 (O2 vertical) and Potts & Williams 1974 (N2O and CO2 vertical).

ELECTRONIC STATES (queried 2026-10-07). The WebBook's 'Constants of diatomic \
molecules' of H2, D2, N2, O2 and CO (Mask=1000), compiled by K. P. Huber and G. H. \
Herzberg (data collected through February 1977), are stored as returned, \
gzip-compressed, in data/external/nist_webbook/<gas>_diatomic_constants.html.gz \
(PROVENANCE.md there, with the sha256 of each). The datasets state_<gas>_<state> hold \
the Te of the states that bound where the third-order response is off resonance: the \
lowest dipole-allowed, two-photon-allowed and spin-forbidden excited states, with the \
0-0 band of the transition the page lists (parameters.nu00_cm1, .transition) and the \
selection rules from the ground state (.one_photon, .two_photon: allowed, forbidden, \
spin_forbidden; the curators' reading of the state's symmetry, TC-863). The strings are \
the page's, checked against the files by tests/test_nist_webbook_states.py; H&H's \
parentheses and brackets (a doubtful or deduced value) are stated in each dataset's \
notes. Two Trans. cells are garbled on the page: D2's C state reads 'CX ↔' (C ↔ X) and \
its E state 'E → N', which is E → B: with B's 0-0 band it gives the EF(0)-X(0) interval \
within 0.4 cm^-1 of liu_2010's (TC-863)."""

[[datasets]]
id = "adiabatic_H2"
material = "H2"
quantity = "ionization_energy"
unit = "eV"
abscissa = "label"
use = "reproduced"
reproduced_from = ["E. McCormack, J. M. Gilligan, C. Cornaggia and E. E. Eyler, Phys. Rev. A 39, 2260 (1989)"]
points = [["1", "H2", "15.425932", "0.000002"]]
notes = """As listed by the WebBook: 15.425932 +- 0.000002 eV, method S \
(spectroscopy (Rydberg series or threshold)), comment: 'T = 0 K'. Not re-pointed (the \
original is not in the library). Against the curated values of the same (N = 0 -> \
N+ = 0) interval: shiner_1993/mccormack_H2 (McCormack et al.'s measurement with \
Shiner et al.'s recalibration) 124 417.507(12) cm^-1 = 15.425805 eV, and \
liu_2010/liu_2009_H2 124 417.491 13(37) cm^-1 = 15.425803 eV (hc = 1.239841984e-4 eV \
cm). The WebBook's number is 0.13 meV (1.0 cm^-1) higher, 60 times its stated \
uncertainty. It is what a value near 124 417.5 cm^-1 gives with the old conversion \
1 eV = 8065.479 cm^-1 (124 417.507 / 8065.479 = 15.425929 eV), so the difference is \
the conversion factor, not the measurement (an inference: the WebBook states no \
factor)."""
[datasets.parameters]
kind = "adiabatic"
final_state = "the cation's ground state"

[datasets.uncertainty]
column = true
level = "not stated"

[[datasets]]
id = "adiabatic_D2"
material = "D2"
quantity = "ionization_energy"
unit = "eV"
abscissa = "label"
use = "reproduced"
reproduced_from = ["S. Takezawa and Y. Tanaka, J. Mol. Spectrosc. 54, 379 (1975)"]
points = [["1", "D2", "15.4667", "0.0001"]]
notes = """As listed by the WebBook: 15.4667 +- 0.0001 eV, method S \
(spectroscopy (Rydberg series or threshold)). Not re-pointed (Takezawa & Tanaka 1975 \
is not in the library). Against liu_2010/ie_ortho_D2 (X (0, N = 0) -> X+ (0, N+ = 0)), \
124 745.394 07(58) cm^-1 = 15.466458 eV: the WebBook's number is 0.24 meV (2.0 cm^-1) \
higher. liu_2010's Table IV lists Takezawa & Tanaka's value as 124 745.6(6) cm^-1 with \
a -1.0 cm^-1 pressure-shift correction included (liu_2010/takezawa_1975_D2), i.e. \
124 746.6 cm^-1 as published; with 1 eV = 8065.479 cm^-1 that gives 15.46673 eV, the \
WebBook's value to its last digit (an inference). So the WebBook's D2 value carries \
both the uncorrected pressure shift and the old conversion factor."""
[datasets.parameters]
kind = "adiabatic"
final_state = "the cation's ground state"

[datasets.uncertainty]
column = true
level = "not stated"

