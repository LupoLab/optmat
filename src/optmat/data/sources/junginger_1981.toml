citation = "H. Junginger, H. B. Puell, H. Scheingraber and C. R. Vidal, \"Resonant third-harmonic generation in a low-loss medium\", IEEE J. Quantum Electron. 17, 557 (1981)"
doi = "10.1109/jqe.1981.1071134"
library = "Junginger_1981_ResonantThirdHarmonic"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Two-photon resonant third-harmonic generation in a phase-matched Mg-Kr \
mixture in a concentric heat-pipe oven (Mg 14-45 Torr, Kr about 12-15 times as much; \
partial pressures by capacitance manometers to 0.1 %): an N2-pumped dye laser (3.5 ns, \
0.45 cm^-1, 30 kW) tuned to the Mg 3s^2 - 3s3d two-photon resonance at 431 nm, harmonic \
at 143.7 nm, weakly focused (b = 121 cm, L = 17 cm) for the phase-matching curves \
(third-harmonic energy against P_Kr / P_Mg), tightly focused (b = 32.4 cm) for the \
intensity dependence."""
notes = """Journal pages 557-562 = PDF pages 1-6; PDF page 1 opens with an unrelated \
correction by Byer and Eggleston. The paper is the corrected republication of the \
October 1980 article, some of whose figures were mislabelled (p. 557). The library's \
title drops the word 'in'. Identity checked against the first page.

The medium of interest is magnesium, not a material of the package: its linear \
susceptibilities (Table I, p. 560: 1.75e-23 ESU at 431.0 nm and -5.35e-24 ESU at 143.7 \
nm for the ground state, and the 3s3p and 3s3d states), its third-order \
susceptibilities (the second table, resonant and nonresonant parts, ESU) and the \
absorption cross section sigma(3 omega) = (4.5 +- 0.7)e-19 cm^2 at 143.7 nm (p. 560) \
are not extracted. In the second table the first row is printed chi_T^(1)(3 omega) \
(image checked); the text calls it chi_T^(3)(3 omega), the third-harmonic \
susceptibility.

PHASE MATCHING (p. 559; TC-719). The optimum ratio measured with the \
parallel beam, P_Kr / P_Mg = 12.7 (11.8 with the calculated susceptibilities), is the \
Delta k = 0 condition of the mixture at a 431.0 nm fundamental. Krypton is the \
reference: its susceptibilities were 'interpolated from a set of 120 measurements \
covering the wavelength region from 670 to 135 nm' (Leonard 1974; Chashchina and \
Shreider), and the discrepancy was attributed to magnesium's susceptibility at 3 omega, \
which the ratio then determines: (-5.35 +- 0.1)e-24 ESU, against -3.72e-24 calculated. \
Reproduced from Table I: N_Kr / N_Mg = -[chi_Mg(3w) - chi_Mg(w)] / [chi_Kr(3w) - \
chi_Kr(w)] = 12.84 with the measured and 11.92 with the calculated chi_Mg(3 omega), 1.1 \
% and 1.0 % above the printed 12.7 and 11.8. The ratio measures magnesium against \
krypton, and magnesium's index at 143.7 nm is known only from it, so it cannot test \
the krypton model; tightly focused, the optimum falls to 12.4 (p. 560). No mixture \
ratio quantity exists in any case (the package's phase_match_density_ratio is \
Shelton's equal-mismatch ratio).

The susceptibilities are per atom in ESU with n^2 - 1 = 4 pi N chi, i.e. the \
polarizability volume in cm^3: krypton's 2.59e-24 is 17.48 au (checked against the \
package's krypton model, below). The wavelength medium is not stated; 431.0 / 3 = \
143.67 either way, and the difference between air and vacuum (0.03 %) is below the \
values' three digits: recorded as vacuum.

Third-order data (checked 2026-09-29): magnesium only (see above); nothing for \
krypton."""

[[datasets]]
id = "interpolated_Kr"
material = "Kr"
points = [["431.0", "431.0", "2.59e-24"], ["143.7", "143.7", "4.37e-24"]]
table = "text"
quantity = "polarizability"
unit = "cm3"
abscissa_unit = "nm"
wavelength_medium = "vacuum"
use = "check"
reproduced_from = ["G. I. Chashchina and E. Ya. Shreider, Opt. Spectrosc. 27, 79 (1969)", "P. J. Leonard, At. Data Nucl. Data Tables 14, 21 (1974)"]
notes = "Table I, note 2 (p. 560): 'Real part of the linear susceptibility of krypton as interpolated from [17]': chi_Kr(1)(431.0 nm) = 2.59 x 10^-24 ESU, chi_Kr(1)(143.7 nm) = 4.37 x 10^-24 ESU. Per atom, the polarizability volume (n^2 - 1 = 4 pi N chi). The text (p. 559) says the krypton values were interpolated from 120 measurements between 670 and 135 nm, citing Leonard 1974 and Chashchina and Shreider ([16], [17]); the reference list prints the latter's year as 1968. An interpolation of others' data, not a measurement: a check. No uncertainty stated."
