citation = "J. Brion, A. Chakir, J. Charbonnier, D. Daumont, C. Parisse and J. Malicet, \"Absorption spectra measurements for the ozone molecule in the 350-830 nm region\", J. Atmos. Chem. 30, 291 (1998)"
doi = "10.1023/a:1006036924364"
library = "Brion_1998_AbsorptionSpectraMeasurements"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """The Reims method (daumont_1992, malicet_1995): Beer-Lambert law for a perfect gas, \
the ozone partial pressure P_O3 = 2[(P_O2)_i - P_T] from the total pressure (MKS \
Baratron, Delta P / P better than 0.1 %) during decomposition; O3 made as Griggs \
(1968); trace gases below 0.1 % (FTIR). Monochromatic light '(0.02 nm FWHM)' from a \
Jobin-Yvon HR 640 monochromator, split into working and reference beams; a 1 m coolable \
stainless-steel multipass cell, path lengths up to 92 m, optical density 0.5-2; 295 K \
(whole range) and 218 K (515-650 nm), Pt sensors (0.05 K), gradients below 0.3 K; \
scans added, standard deviation between scans 0.9-2 % (pp. 292-293)."""
notes = """Identity checked against the first page (PDF page 1, journal p. 291): Brion, \
Chakir, Charbonnier, Daumont, Parisse and Malicet, J. Atmos. Chem. 30, 291-299 (1998). \
Journal pages 291-299 = PDF pages 1-9. O3 only. The paper prints decimal commas.

Facts for the data files (the Reims/BDM visible set):
- Range and temperatures: 350-830 nm at 295 K; 515-650 nm at 218 K (pp. 291-293).
- Resolution and sampling: 0.02 nm FWHM (p. 292; 'Delta lambda <= 0,02 nm FWHM', p. \
298); 'determined for the whole 350-830 spectral region by steps of 0.01 nm' (p. 294).
- Wavelengths: medium not stated (the group's calibration is in air, daumont_1992; \
Table II's lines, He-Ne laser and mercury lamp lines, are given as air values: recorded \
as standard air, TC-186). Wavelength uncertainty 0.01 nm (p. 294).
- Absolute scale: the pressure method, not normalised.
- Uncertainty (Table I, image checked, p. 295): optical density 1 % (420-830 nm), 1-3 % \
(350-420 nm); optical path 0.1 %; ozone pressure 0.1 %; temperature 0.02 % (295 K), \
0.15 % (218 K); impurities < 0.1 %; wavelength 0.1 % (420-830 nm), 0.1-0.7 % (350-420 \
nm); total systematic error about 1.5 % (420-830 nm), 1.5-4 % (350-420 nm); random \
error (RMS) 0.9-2 %. Text (p. 296): 'the total uncertainty is about 1,5% for the \
Chappuis band region and about 4% near the absorption minimum'. Level not stated.
- The published file: 'available on request to the authors either by e-mail, or on \
floppy disk' (p. 294).

Temperature effect (p. 298): 515-650 nm, the 218 and 295 K spectra overlap except near \
the two maxima, where the cross section increases by about 1 % as the temperature \
decreases; at 520 nm and 218 K below 1 % (against Burkholder and Talukdar's 4 %).

Comparisons (pp. 296-297): Vigroux, Griggs, Penney and Anderson agree within 1 % but \
are 10 % above Inn and Tanaka and 4-5 % above Amoruso; Anderson and Mauersberger \
(1993) in the Wulf band 2-5 % below this work, at 3.1 nm FWHM. Table II's deviation \
column (A&M or Hearn against this work) is derived and not extracted; it reproduces \
from the printed values to 0.02 % except at 543.516 nm (-1.51 % against the printed \
-1.53) and 594.096 nm (-2.41 % against -2.47), presumably from unrounded values.

Datasets: Table II (image checked) and the text values; the Table II caption gives \
sigma x 10^21 cm^2, scale 1e-21 to cm^2. This work's values are points of the data \
file: 'check'."""

