citation = "A. Weber, \"High-Resolution Rotational Raman Spectra of Gases\", in Raman Spectroscopy of Gases and Liquids, A. Weber, ed., Topics in Current Physics 11 (Springer, Berlin, 1979), Chap. 3, pp. 71-121"
doi = "10.1007/978-3-642-81279-8"
library = "Weber_1979_RamanSpectroscopyGases"
identity = "VALIDATED_WITH_WARNINGS"
kind = "compilation"
technique = """A review of pure rotational Raman spectroscopy of gases with laser and mercury-arc \
excitation: the photographic grating spectrographs and Fabry-Perot techniques \
(Sect. 3.1), and the molecular constants obtained from the observed rotational spectra \
(Sect. 3.2), fitted to the S-branch shifts with Eq. (3.10), Delta nu_S = (4 B_v - 6 \
D_v)(J + 3/2) - 8 D_v (J + 3/2)^3, or with the three-constant Eq. (3.9) including H_v \
(p. 87). The constants are the cited authors'; the chapter measures nothing itself."""
notes = """BOOK AND CHAPTER. The library copy (Weber_1979_RamanSpectroscopyGases; \
Unverified_6d54463e97c7 until the library validated it, 2026-09-27: the same tables) \
is the whole book: 'Raman Spectroscopy of Gases and Liquids', edited by A. \
Weber, Topics in Current Physics 11, Springer-Verlag Berlin Heidelberg 1979 (ISBN-13 \
978-3-642-81281-1, e-ISBN-13 978-3-642-81279-8, DOI 10.1007/978-3-642-81279-8, the \
book's DOI; no chapter DOI is printed). Identity checked against the title and \
copyright pages and the contents (pdf pp. 3-11). This record is Chapter 3, by A. Weber \
(Fordham University and NBS), pp. 71-121 (pdf pages 82-132: book page = pdf page - 11). \
The other chapters used: brodersen_1979 (Chap. 2), schrotter_1979 (Chap. 4).

DEFINITIONS (pp. 86-87). F_v(J) = B_v J(J + 1) - D_v [J(J + 1)]^2 + H_v [J(J + 1)]^3 \
(Eq. 3.1), B_v = B_e - alpha_e (v + 1/2), D_v = D_e + beta_e (v + 1/2); for O2 \
(3Sigma_g-) Eq. (3.1) 'represents only one of the three levels with the proviso that J \
is replaced by ... N' (p. 90): the constants are those of the N(N + 1) ladder, the spin \
splitting not included. Wavenumbers in cm^-1 (vacuum, as usual; not stated).

WHAT IS TAKEN.
- Table 3.2 (p. 88), 'Molecular constants of diatomic molecules determined from pure \
rotational Raman spectra' (JSON cells = image), B_0 and D_0 of: H2 and D2 ([3.136] \
B. P. Stoicheff, Canad. J. Phys. 35, 730 (1957), curated as stoicheff_1957, 'Values \
in square brackets are based on pre-laser techniques', no uncertainty); 14N2 ([3.17a] R. J. Butcher, D. V. Willetts \
and W. J. Jones, Proc. R. Soc. A324, 231 (1971), note a 'Values determined from a two \
constant formula (3.10)' and note b 'from a three constant formula (3.9)', H_0 = (3.7 \
+- 11.0)e-10 cm^-1; and [3.89] J. Bendtsen, J. Raman Spectrosc. 2, 133 (1974), \
curated as bendtsen_1974, note c B_e = 1.998232 +- 0.000012 cm^-1); 16O2 ([3.17a] \
Butcher et al.; and [3.43] H. G. M. Edwards, E. A. M. Good and D. A. Long, J. Chem. \
Soc., Faraday Trans. II 72, 865 (1976), note a B_e = 1.4458 +- 0.0003 cm^-1). \
Recommended by the chapter for N2: 'the values for B_0 and D_0 obtained for nitrogen \
... by means of the grating spectrograph [3.89] are recommended as the best determined \
so far' (p. 89).
- Table 3.3 (p. 93), 'Molecular constants of linear polyatomic molecules determined \
from pure rotational Raman spectra', CO2 ([3.141] Chiu-Hua W. Wang, Dissertation, \
Fordham University (1975), not in the library): B_0 and D_0 of the ground state \
(00^0 0), note a 'Ground state constants', and of the (01^1 0) state, note b 'Constants \
for the c-levels of (01^1 0)-state', from the rotational hot band (nu_2^1 = 667 cm^-1, \
room-temperature population about 7 %, p. 93; R and S branches observed [3.9, 3.141]).

ALL VALUES ARE REPRODUCED. The chapter compiles 'only the most recent results' (p. \
87); every value carries its reference. The originals are not in the library except \
Bendtsen's (bendtsen_1974, digit-identical: B_0 1.989574 +- 12, D 5.76 +- 3 in its \
Table VII) and Stoicheff's (stoicheff_1957, since 2026-09-27: the H2 and D2 B_0, D_0 \
and note a's H_0 are its Table II v = 0 values, digit-identical but for the misprinted \
56.3392; the HD values and the B_e of note a are its too). Wang's dissertation was done in the chapter author's laboratory (the \
'Fordham instrument') and is unpublished; this chapter is its only copy at hand, so its \
CO2 constants are the best copy available (reproduced, but usable).

N2O IS NOT IN THE BOOK. Table 3.3 lists CO2, CS2, HCN, DCN, XeF2, 12C2H2, C2HI, C4H2, \
C4D2 and 12C2 14N2 only; no N2O rotational constant is printed in Chapters 2 or 3 (the \
subject index lists N2O on pp. 138, 142 and 186 only, the cross sections and a line-width \
table). CO is not in Table 3.2 either: its rotational Raman analysis (J. V. Kainnady, \
Dissertation, Fordham 1976, [3.124a]) is mentioned without values (p. 89).

ERRATUM. Table 3.2 prints H2's B_0 as [56.3392]; it is 59.3392 (see [[errata]]).

UNCERTAINTIES. Table 3.2 and 3.3 print +- without stating the level, except 'Quoted \
errors are five standard deviations' for S2 (note a). For N2 the chapter says Butcher \
et al.'s 'statistical error quotes ... are only a measure of the precision with which \
the data can be represented by the two frequency formulas' (p. 89); Bendtsen's are \
standard deviations of internal consistency (bendtsen_1974). Recorded as 'not stated'.

NOT TAKEN. Table 3.2: HD ([44.6678], [0.02592]), HT, DT, T2, F2, 35Cl2, 35Cl37Cl, \
37Cl2, 79Br2, 81Br2, 14N15N (Butcher 1.923604 +- 0.000020, 5.297 +- 0.038; Bendtsen \
1.923596 +- 0.000009, '5.83 +- 0.03' x 1e-6, where Bendtsen and Chap. 2's Table 2.3 \
have 5.38: a transposition in Table 3.2), 15N2, 16O17O, 16O18O, 17O2, 18O2, S2, NO; the \
notes: H_0 of HD 2.2e-5 cm^-1 (H2 and D2 are datasets); B_e of H2 60.841, HD 45.638, D2 \
30.442 cm^-1 (Stoicheff). Table 3.3: CS2, HCN, DCN, XeF2, C2H2, C2HI, C4H2, C4D2, \
C2N2. Tables 3.4-3.9 (symmetric and asymmetric tops, nuclear-spin weights, argon laser \
lines): out of scope. The text's '5.48 x 10^-8', '5.74 x 10^-8' and '5.723 x 10^-8' for \
N2's D_0 (p. 87) are misprints for 10^-6 (the table has 10^-6); not data here. \
Section 3.2.5: the 'forbidden' rotational spectra of CH4 and SF6 'have not yet been \
observed' (p. 115): no constants."""

