corrected = "59.3392"
reason = "A misprinted digit (6 for 9) in Table 3.2's B_0 of H2: the printed value is inconsistent with the table's own B_e and with the isotope scaling of its D2 and HD constants."
evidence = "Image checked (p. 88): '[56.3392]^a'. (1) The table's note gives B_e(H2) = 60.841 and B_e(D2) = 30.442 cm^-1 against B_0(D2) = 29.9105, so alpha_e(D2) = 2 (B_e - B_0) = 1.063 cm^-1; alpha_e scales as mu^(-3/2) and mu(D2)/mu(H2) = B_e(H2)/B_e(D2) = 1.9986, so alpha_e(H2) = 1.063 x 1.9986^1.5 = 3.003 and B_0(H2) = 60.841 - 1.502 = 59.339 cm^-1, where 56.3392 would need alpha_e = 9.0. HD agrees: alpha_e(HD) = 2 (45.638 - 44.6678) = 1.940, scaled by (B_e(H2)/B_e(HD))^1.5 = 1.539 to 2.99 for H2. (2) Shelton and Ulivi (1993, curated as shelton_1993), citing this chapter (their ref. [17], p. 71), quote 'B_0 = 59.3392 cm^-1 and D_0 = 0.04599 cm^-1' (their Table 2 caption). (3) The original, Stoicheff 1957 (curated as stoicheff_1957), Table II (p. 734, image checked 2026-09-27): B_0 of H2 = 59.339 with a subscript 2."
