[[errata]]
dataset = "barter_1960_Ne"
row = ""
column = "scale"
printed = "0.0001"
corrected = "1e-05"
reason = "Table X prints Barter et al.'s neon chi_0 as -7.80(16) x 10^-4 a.u., ten times every other neon entry of the table (experimental -7.56e-5 and -8.574e-5, theoretical -8.27e-5 to -8.57e-5, this work -8.4786e-5); read as x 10^-5 it is 8 % below the theory with a 2 % stated uncertainty, the persistent disagreement the text describes."
evidence = "Circumstantial: p. 9, 'the present results are in disagreement with the experimental data of Barter et al.' and, after Rourke's revision for argon, 'for neon a large discrepancy remains', a disagreement at the level of the other experiments, not an order of magnitude. The same table misprints the power of ten of Barter et al.'s revised argon line (10^-5 for 10^-4; source notes). Corroborated by nie_2025, whose Table I takes A_mu from Barter et al. (its Ref. 32): neon -29.2(6) x 10^-6 cm^3/mol, which is -7.81(16) x 10^-5 a.u. by the conversion in the source notes (argon -80.9(6) x 10^-6, i.e. -2.164(16) x 10^-4 a.u., Barter et al.'s argon line here). Not stated by the authors; the original (J. Phys. Chem. 64, 1312 (1960)) is not in the library. Checked 2026-09-29 against the table image and the text."
