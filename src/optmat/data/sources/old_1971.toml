citation = "J. G. Old, K. L. Gentili and E. R. Peck, J. Opt. Soc. Am. 61, 89 (1971)"
library = "Old_1971_DispersionCarbonDioxide"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Modified Michelson interferometer with corner-cube reflectors (the apparatus \
of Peck & Khanna and Peck & Fisher), the mercury green line (0.5462258 um) as \
reference; refractivity ratios to other lines from 0.48 to 1.82 um. CO2 with at most \
100 ppm impurities (N2, O2, H2O)."""
notes = """Identity: the library record is UNVERIFIED; the text is 'Dispersion of Carbon \
Dioxide' by J. G. Old, K. L. Gentili and E. R. Peck (University of Idaho, received \
29 June 1970), from the M.S. theses of Old and Gentili. The citation J. Opt. Soc. Am. \
61, 89 (1971) is the one assigned here; it could not be checked against the \
record (no DOI or page numbers are recorded) and is to be verified.

Reduction to 1 atm and 0 C with 'a simple virial expansion for the compressibility', \
Z = 1 - P (9.0143 - 0.048529 T + 6.980e-5 T^2) 1e-5 fitted to Hilsenrath's tables \
(pdf p. 1; the unit of P is not stated): density = real. Wavelengths are vacuum. The \
absolute value at 0.5462 um is (n - 1) 10^7 = 4505.0 +- 0.6 (pdf p. 1; the level is not \
stated); 'to preserve the accuracy of the ratio of refractivities ... three decimals \
have been added'. The rms difference between the experimental values and the fit is \
0.030 (pdf p. 1), taken as the per-point uncertainty (absolute = 0.030, rms), and the \
absolute value's 0.6/4505 = 1.33e-4 as the scale uncertainty (systematic_relative). \
Impurities are said to affect the data less than the stated error.

The Sellmeier formula's left-hand side, (n - 1) 10^5, is only in the equation image \
(eq_8da9a196527f); the library's Markdown loses it. Table II gives a derived Verdet \
'S' factor (the ratio of Ingersoll & Liebenberg's measured Verdet constants to the \
normal Verdet constant from this dispersion formula); it is not refractive-index \
data and is not extracted. Its values are not monotonic at 0.8000 um (0.463, 0.400, \
0.416, 0.366 at 0.75, 0.80, 0.85, 0.90 um), suggesting a misprint there, which cannot \
be resolved from the paper. Other results (pdf p. 2): absorption wavelengths 4.13, \
0.1290 and 0.0689 um with oscillator strengths 1.28e-4, 0.240 and 6.90; \
(n^2 - 1)_inf 1e6 = 936 against the measured dielectric constant 922 +- 1; Rayleigh \
cross section 1.17e-28 cm^2 at 0.6943 um and 60 degrees."""

