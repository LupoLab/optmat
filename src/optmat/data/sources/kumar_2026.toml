citation = "S. Kumar, J. D. Piel, C. H. Greene and N. Shivaram, \"Broadband femtosecond lasers enable efficient two-photon excitation of the ultranarrow linewidth singlet 1s2s state in helium\", Phys. Rev. Research 8, 013009 (2026)"
