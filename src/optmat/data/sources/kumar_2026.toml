technique = """An effective two-level (three-level for two colours) model of He 1s2 -> 1s2s \
1S0 two-photon excitation by broadband femtosecond pulses: intermediate p states \
adiabatically eliminated, the continuum coupling of 1s2s in the Markov approximation \
(Eqs. 4-11, Appendix A), rotating-wave and two-photon rotating-wave approximations; \
field-free energies and dipole matrix elements from finite-volume variational \
R-matrix calculations; Eq. 7 integrated by an explicit Runge-Kutta method for Gaussian \
pulses at 120.27 nm (one colour) and 65 nm + 800 nm (two colours)."""
notes = """Pages are PDF pages (article 013009, pp. 1-10). Identity checked against the \
first page: Physical Review Research 8, 013009 (2026), not Phys. Rev. A.

NOTHING TAKEN (the maintainer, 2026-10-08, TC-872): the coefficients of Table I \
