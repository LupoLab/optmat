citation = "N. J. Bridge and A. D. Buckingham, \"Polarization of Laser Light Scattered by Gases\", J. Chem. Phys. 40, 2733 (1964)"
doi = "10.1063/1.1725590"
library = "Bridge_1964_PolarizationLaserLight"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Depolarization of Rayleigh (plus rotational Raman) light scattered at 90 \
degrees from gases at 1 atm and 20 C inside the resonant cavity of a continuous He-Ne \
laser (6328 A, about 100 mW circulating), Glan-Thompson analyser, EMI 9558A \
photomultiplier with phase-sensitive detection (pp. 2733-2734)."""
notes = """A letter (J. Chem. Phys. 40, 2733-2734 (1964), received 10 February 1964; \
identity VALIDATED_WITH_WARNINGS, a caption warning; first page checked: pdf page 2, \
which begins with the end of another letter; pdf page 1 is the publisher's cover). \
Page numbers are journal pages (pdf page + 2731). Not the full paper of Bridge and \
Buckingham, Proc. R. Soc. A 295, 334 (1966), which sneep_2005 and christiansen_1998 \
cite (not in the library).

WHAT IS HERE. Table I: 10^2 rho_0 (the depolarization ratio at 1 atm, 20 C) and the \
anisotropy (alpha_par - alpha_perp) (A^3) of Ar, Xe, SF6, H2, N2, O2, CO2 (for a later \
phase: not extracted), and the mean polarizability alpha (A^3) 'calculated (for 6328 \
A) from refractive indices given in the Landolt-Bornstein tables (1962)' (p. 2734): not \
the authors' measurement. These seven alpha are extracted as reproduced polarizability \
volumes. CO is not in the table. The H2 anisotropy kappa = 0.125 +- 0.005 is compared \
with a calculated 0.117 (text).

CHECK (computed 2026-09-25): against the curated fits at 632.99 nm (vacuum) the alpha \
agree to -0.06 ... +0.3 % (Ar -0.02, Xe -0.06, H2 +0.28, N2 +0.25, O2 +0.08, CO2 +0.06 \
%) except SF6, +0.71 %. alms_1975's N2 at 6328 A (Landolt-Bornstein, 1.766) is the \
same source to the last digit.

STRUCTURAL FIX in the script: the library cells lost the gas-name column and the \
headings; the rows are assigned in the printed order (image checked). The \
depolarization cells are misread ('0.OO5', 'Q.OO1'); they are not extracted."""

[[datasets]]
id = "alpha_Ar"
material = "Ar"
file = "Ar/bridge_1964__alpha_Ar.csv"
table = "tbl_63a38649ff5e"
quantity = "polarizability"
unit = "angstrom3"
abscissa_unit = "angstrom"
wavelength_medium = "standard_air"
use = "reproduced"
reproduced_from = ["Landolt-Bornstein, Zahlenwerte und Funktionen (Springer, Berlin, 1962), Vol. II, Pt. 8 (refractive indices, as Bridge and Buckingham state)"]
notes = "Table I, alpha (A^3) at 6328 A, from Landolt-Bornstein's refractive indices (p. 2734); no uncertainty stated. The original compilation is not in the library."

