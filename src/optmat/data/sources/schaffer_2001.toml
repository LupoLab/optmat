[[formulas]]
id = "keldysh_parameter"
equation = "Eq. (1), p. 1785"
printed = "gamma = (omega/e) [m c n eps0 E_g / I]^(1/2)"
variable = "omega: laser angular frequency; I the intensity at the focus; m, e 'the reduced mass and charge of the electron'; n the refractive index; E_g the band gap"
coefficients = { transition = "gamma ~ 1.5 (multiphoton above, tunnelling below)" }
check = "Table 2's gamma with Table 1's E_g and I_th require m n = 0.72-0.76 m_e (0.83 for SF11); the 400/800-nm ratios agree with 2 sqrt(I_800/I_400) to 1-2 % (checked 2026-09-26). m and n are not given."
notes = "'When the Keldysh parameter is larger (smaller) than about 1.5, photoionization is a multiphoton (tunnelling) process' (p. 1785)."

[[formulas]]
id = "energy_threshold"
equation = "Eqs. (4), (5), (7), pp. 1788-1789"
printed = "P_cr = 3.77 lambda^2 / (8 pi n0 n2) (4); I_sf = I / (1 - P/P_cr) (5); E_th = I_th tau lambda^2 / (pi NA^2 + I_th lambda^2 / P_cr) (7)"
variable = "lambda: wavelength; tau the pulse duration; NA the objective's numerical aperture; I_th the threshold intensity"
coefficients = { factor = "3.77" }
check = "Not reproducible: the energy thresholds are in Fig. 7 only."
notes = "Eq. (5) is Soileau et al.'s weak self-focusing correction (ref. 29), valid below about P_cr/4."

[[formulas]]
id = "rate_equation"
equation = "Eqs. (2), (8), pp. 1786, 1792"
printed = "dN/dt = eta N (2), eta = alpha I (Stuart); dN/dt = alpha I N + P(I) (8), P(I) = sigma_k I^k"
variable = "N: conduction-electron density; I the intensity; alpha the avalanche coefficient; P(I) the photoionization rate"
coefficients = { alpha = "fitted per material (datasets avalanche_*)" }
reproduced_from = ["stuart_1996"]
check = "The alpha values are derived by the paper from the measured I_th; nothing further printed to reproduce."
notes = "The multiphoton form P(I) = sigma_k I^k with k the smallest integer with k hbar omega >= E_g (p. 1785)."
