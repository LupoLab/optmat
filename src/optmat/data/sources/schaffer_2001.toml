citation = "C. B. Schaffer, A. Brodeur and E. Mazur, \"Laser-induced breakdown and damage in bulk transparent materials induced by tightly focused femtosecond laser pulses\", Meas. Sci. Technol. 12, 1784 (2001)"
doi = "10.1088/0957-0233/12/11/305"
library = "Schaffer_2001_LaserInducedBreakdown"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Bulk (not surface) damage thresholds of SF11, Corning 0211, fused silica and \
CaF2 with 110-fs pulses at 400 and 800 nm, focused inside the sample by microscope \
objectives of NA 0.25-1.4 at the depth of best focus (ray-traced for spherical \
aberration). Energy thresholds by dark-field He:Ne scattering after 3000 pulses per site \
(Sec. 3.4), checked by DIC microscopy (Sec. 3.1) and transmission (Sec. 3.2). The \
threshold intensity I_th is fitted to the energy thresholds at several NA with Eq. (7), \
E_th = I_th tau lambda^2 / (pi NA^2 + I_th lambda^2 / P_cr), which includes weak \
self-focusing through P_cr (pp. 1789-1792)."""
notes = """Journal pages 1784-1794 = PDF pages 2-12 (PDF page 1 is the publisher's \
download cover). The PDF prints no usable DOI; identity from the library's bibliographic \
search, title and authors checked against page 1784.

TABLE 1 (p. 1793, tbl_dbd271b58058, image checked): band gap, and at 400 and 800 nm, \
110 fs, the fitted I_th and 'the critical powers, P_cr, used in the fit to equation (7)'. \
SF11 at 400 nm is '—': 'We do not observe damage in SF11 using 400 nm laser pulses with \
laser energy up to several times the threshold for other materials', attributed to \
two-photon absorption before the focus (p. 1792). Origin of the critical powers \
(p. 1792): 'The lines represent fits to equation (7) using critical powers from the \
literature [34] or measured using the technique described in section 3.3. For Corning \
0211 ... the critical power at 800 nm was left as a free parameter. Our fits yield \
P_cr = 1.5 MW, in good agreement with the 1.6 MW value for BK7 ... We used the known \
scaling of the critical power with laser wavelength (equation (4)) to obtain a value for \
Corning 0211 at 400 nm.' Checked: 1.5 MW x (400/800)^2 = 0.375 MW, printed 0.4. Which of \
the other P_cr are from ref. 34 (Brodeur and Chin 1998) and which from Sec. 3.3 is not \
said. Sec. 3.3 (p. 1790): self-focusing thresholds in fused silica measured as \
white-light-continuum thresholds with a 0.20-m lens, '140 nJ at 400 nm and 580 nJ at \
800 nm' (energies; the conversion to power is not given, not extracted). The band gaps \
have no cited source; they are recorded as assumed model inputs. Eq. (4) is \
P_cr = 3.77 lambda^2 / (8 pi n0 n2) (Marburger, ref. 31).

TABLE 2 (p. 1793, tbl_ec8b126f418c) is scrambled in the library; transcribed from the \
image in the script, which checks the transcription against the scrambled characters. \
Keldysh parameter gamma (Eq. 1) and electron density N from Keldysh's full formula at \
the Table 1 threshold intensities, avalanche excluded. gamma, not a curated quantity: \
400 nm: Corning 0211 2.7, fused silica 2.5, CaF2 2.3 (SF11 '—'); 800 nm: SF11 1.2, \
Corning 0211 1.0, fused silica 1.2, CaF2 1.2. N is recorded as ionization_yield \
(electron density per cm3, check) against the threshold intensity. The caption cites \
'equation (37) in [30]', but ref. 30 is Boyd's Nonlinear Optics; the text (pp. 1785, \
1793) says 'equation (37) in [8]', Keldysh: the caption's reference number is wrong. \
Critical densities for comparison (caption, p. 1793): 6.9e21 cm^-3 (400 nm), 1.7e21 \
(800 nm); omega^2 eps0 m_e/e^2 gives 6.97e21 and 1.74e21 (checked 2026-09-26: the 400-nm \
value is truncated, not rounded). CHECK of gamma (2026-09-26): Eq. (1), gamma = \
(omega/e)[m c n eps0 E_g/I]^(1/2), with the Table 1 E_g and I_th, requires m n = \
0.72-0.76 m_e for Corning 0211, silica and CaF2 at both wavelengths (0.83 m_e for SF11); \
m ('the reduced mass') and n are not given, so the absolute values cannot be checked, but \
the 400/800-nm ratios agree with 2 sqrt(I_800/I_400) to 1-2 % (2.70 v 2.73, 2.08 v 2.10, \
1.92 v 1.89).

TEXT VALUES (datasets): DIC threshold in Corning 0211 at 1.4 NA, 6.6 nJ for single and \
multiple shots (p. 1790; the wavelength of Sec. 3.1 is not stated; at 0.25 NA the \
threshold falls with the number of shots, incubation); transmission-drop thresholds in \
fused silica at 0.65 NA, 25 nJ at 800 nm and 20 nJ at 400 nm (p. 1790, Fig. 5); the \
additional 800-nm dark-field thresholds in Corning 0211 at 1.0 NA (7.0 nJ) and 1.4 NA \
(5.0 nJ) used in the fit (p. 1792); the avalanche coefficients needed to reach the \
critical density with Keldysh photoionization, 1.6 (800 nm, fused silica), 2.0 (800 nm, \
CaF2), 1.3 (400 nm, fused silica), 1.4 cm2/J (400 nm, CaF2), and 4.5 cm2/J (fused silica, \
800 nm) with Lenzner's sigma_6 = 6.0 x 10^8 cm^-3 ps^-1 (cm2/TW)^6 (p. 1793). 'Values \
range from 4.0 cm2 J-1 to 10 cm2 J-1' for the literature fused-silica avalanche \
coefficient at 800 nm (p. 1793, no citation: not extracted).

FIGURES ONLY: Fig. 2, the Keldysh, multiphoton and tunnelling rates for fused silica \
(7.5 eV) at 800 nm against intensity; Fig. 5, transmission of 110-fs pulses at 400 and \
800 nm through fused silica (0.65 NA) against energy, with the self-focusing energies \
marked; Fig. 7, the energy thresholds against NA (0.25-1.4) at 400 and 800 nm for the \
four materials with the Eq. (7) fits.

STATED UNCERTAINTY: none for Table 1. 'The three different techniques used to determine \
the threshold for damage yield results that agree within experimental error' (p. 1790). \
Polarization not stated. The surface/bulk comparison: 'For fused silica we find that the \
intensity threshold for bulk material damage ... agrees very well with the thresholds \
for surface ablation found by other groups. The bulk threshold for CaF2, however, is \
larger than the previously measured surface threshold [21] by about a factor of two' \
(pp. 1789-1790).

REPRODUCTIONS: Lenzner et al. 1998's sigma_6 (reproduced dataset); Stuart et al.'s \
factor of two between 526 and 1053 nm (stuart_1996, text only). Reproduced by \
hamam_2018 (ref. 10, the NA limit 0.5) and jing_2012 (ref. 9)."""

