citation = "D. P. Shelton, Phys. Rev. A 42, 2578 (1990)"
doi = "10.1103/physreva.42.2578"
library = "Shelton_1990_NonlinearOpticalSusceptibilities"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Electric-field-induced second-harmonic generation (ESHG) with periodic phase \
matching, as in Shelton & Mizrahi (1986) but with a Q-switched Nd:YAG laser at 1064 or \
1319 nm (150 ns pulses) and coarser electrode arrays (N = 8, L = 20.320 cm at \
1319 nm); z0 = 20 cm. Sample (A) and reference (B) gases measured alternately in \
coupled triplets (ABABA...); the phase-match pressure found from a quadratic fit to the \
signal within 15 % of its peak. Densities from pressure (Bourdon gauge, 0.1 % of \
160 bar full scale, or capacitance manometer, 0.15 % relative) and temperature \
(thermistor in the gas, 0.1 C; room temperature 21-23 C) by the virial equation of \
state (Dymond & Smith); virial corrections typically below 1 %, 5 % for He (p. 5)."""
notes = """The paper's aim is the hyperpolarizability gamma; its by-product, the ratio of \
phase-match densities of a sample A and a reference B at the same apparatus \
|Delta k|_opt, measures refractive-index dispersion: 'rho_B/rho_A ~ (alpha_2w - \
alpha_w)_A / (alpha_2w - alpha_w)_B' (p. 6), with Delta k = (-2 pi / (lambda eps0)) \
(alpha_2w - alpha_w) rho (Eq. 4), lambda the fundamental. The process is ESHG (second \
harmonic, n(2 omega) - n(omega)), not third-harmonic generation.

Table I prints rho_B/rho_A, the reference's density over the sample's. The package's \
phase_match_density_ratio is rho_gas / rho_reference, so each ratio is filed under \
Shelton's reference gas B as 'gas', with Shelton's sample A as 'reference_material': the \
printed number is then the quantity as defined, not inverted (parameters.sample_gas \
and parameters.shelton_reference_gas keep Shelton's roles). Rows for CF4, C2H6, C3H8, \
n-C4H10 and C4H6 are skipped (not curated species); the hyperpolarizability ratios \
and the gamma tables (II-IV) are not refractive-index data and are not extracted.

Wavelengths: Table I prints 1319 and 1064 nm; Table III's caption says 'Wavelengths \
lambda are those measured in air, while wavenumbers nu are those measured in vacuum', \
and gives 7581 and 9395 cm^-1 for these two lines, so the wavelengths are recorded as \
standard air (the vacuum wavelengths 1319.09 and 1064.40 nm from the wavenumbers differ \
by at most 0.02 % from the converted ones, far below any effect on the ratios).

Uncertainty: the per-ratio +- of Table I (level not stated). 'The random uncertainty \
is 0.1 % for a single phase-match-density determination' (p. 5); for rho_H2/rho_D2 and \
rho_N2/rho_Ar 'the stated uncertainty ... is essentially the statistical uncertainty' \
(Table I caption). The caption also says the Ar/He, N2/He and Ar/N2 measurements 'form \
an overdetermined set; the values given in the table have been adjusted to maximize \
the self-consistency of this set' (said of the gamma ratios; the density ratios are \
consistent: 19.83 x 0.9282 = 18.406 against 18.41 at 1319 nm, 19.93 x 0.9295 = 18.525 \
against 18.54 at 1064 nm). O2 purity was only 99.6 %, with possible systematic errors \
above 0.1 % (p. 6).

Cross-check with Shelton & Mizrahi (1986): rho_H2/rho_D2 = 0.9720 and 0.9717 here, \
against 1/1.0290 = 0.9718 for the 1986 zero-frequency limit of rho_D2/rho_H2.

The library holds a second copy of this paper (Shelton_1990_NonlinearOpticalSusceptibilities_9e0b1a, \
same DOI) with the identical Table I; it is not extracted twice.

THIRD-ORDER DATA (added 2026-09-26; the remark above that the gamma tables \
are not extracted predates it). Definitions: <gamma> is the isotropically averaged \
<gamma>_zzzz, all fields parallel, in SI units C^4 m^4 J^-3 (1 au = 6.235377e-65 with \
mu = m_e, p. 14); the same gamma as Shelton & Rice's Taylor-series convention \
(shelton_1994 reproduces these values in au). The ESHG susceptibility of a low-density \
gas is chi^(3) = (1/4) L_0 L_omega^2 L_2omega <gamma> rho (Eq. 2, p. 2), L_omega = \
(n_omega^2 + 2)/3 the Lorentz local-field factor, rho the number density; the \
second-harmonic power is Eq. (1) (proportional to (chi^(3) P^(omega) E_0^(0))^2 for a \
static field E_0^(0) sin Kz); the field convention of chi^(3) is not spelled out beyond \
Eqs (1)-(2). The ratio <gamma_A>/<gamma_B> follows from the peak signals, phase-match \
densities and electrode voltages by Eq. (5) with the refractive-index factor n' = \
(n_0^4 n_omega^(2+3 xi) n_2omega)^(1/6) (Eq. 6, 3 xi = 1). Calibration: every value \
rests on Bishop & Pipin's ab initio gamma_He (bishop_1989), fitted by the author \
(Table II, formulas table2_He_*); Ar, H2, N2 and Ne are measured against He, D2 against \
H2's curve, O2, SF6, CH4, CO2 against N2's, Kr and Xe against Ar's (Table III caption). \
Parts: for H2 and D2 the calculated <gamma^vR> (Eqs 9-11) and for N2, O2 Eq. (15) with \
Table V are subtracted before fitting <gamma^e> (Table IV: diatomics electronic); for \
the atoms <gamma> is electronic; for CO2, SF6, CH4 the fits are to the total <gamma> \
(vibrational part not separated: 'we are unable to accurately determine <gamma^e> or \
its static limit for these molecules', p. 13). ESHG's rotational part is negligible. \
Accuracy (p. 13): 'the absolute accuracy of the <gamma> dispersion curves for Ar, H2, \
and N2 (calibrated directly against He) is expected to be about 0.2% over the fitted \
range. The extrapolation to the static limit of <gamma^e> for the atoms and diatomic \
molecules should be accurate to about 0.5%' (Ne about 2 %); but He pair interactions \
'may increase chi^(3) ... by 1%' (ref 46), so 'all the experimental estimates of \
<gamma> given here should be adjusted upward by about 1%, except gamma_Ne which should \
only increase half as much' (not applied), and 'Until the above-mentioned defects are \
corrected or resolved, the effective accuracy of our results is only about 1%, even for \
the atoms and diatomic molecules' (p. 13). Datasets: Table I gamma ratios \
(gamma_<A>_over_<B>, check: the raw measurement behind the calibrated values); Table \
III present-work values (table3_<gas>_present, primary), the rescaled literature values \
(table3_<gas>_literature, reproduced; Ne's excluded as spurious), H2 and D2 \
gamma^vR; text values (p. 14). Formulas: Table II (He calibration, with the misprinted \
C corrected), Table IV (gamma_0, A, B per gas), Table V (G, H of gamma^vR). Only curated \
species: CF4, C2H6, C3H8, n-C4H10 and C4H6 are skipped (their Table I, III, IV values \
and, in the text, CF4's Hartree-Fock 143 au against 985 au). The dipolar-molecule \
mu beta/3kT remark concerns only the skipped C3H8, n-C4H10, C4H6. The second library \
copy (..._9e0b1a) agrees number for number in all six tables (checked 2026-09-26)."""

[[datasets]]
id = "density_He_over_Ne"
material = "He"
file = "He/shelton_1990__density_He_over_Ne.csv"
table = "tbl_5295cecf2a78"
quantity = "phase_match_density_ratio"
abscissa_unit = "nm"
wavelength_medium = "standard_air"
density = "real"
use = "primary"
notes = "Table I row A = Ne, B = He: rho_He / rho_Ne as printed."
[datasets.uncertainty]
column = true
level = "not stated"
[datasets.parameters]
reference_material = "Ne"
harmonic = 2
process = "ESHG (electric-field-induced second-harmonic generation), periodic phase matching"
definition = "rho_gas / rho_reference_gas at equal wave-vector mismatch |Delta k| = (4 pi / lambda) |n(2w) - n(w)|; to first order in density = [alpha_ref(2w) - alpha_ref(w)] / [alpha_gas(2w) - alpha_gas(w)]; lambda = fundamental"
sample_gas = "Ne"
shelton_reference_gas = "He"

