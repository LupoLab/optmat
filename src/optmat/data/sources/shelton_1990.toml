# ---- Third-order formulas ------------------------------------------------

[[formulas]]
id = "table2_He_au"
material = "He"
equation = "Eq. (8), p. 7; Table II, p. 7"
printed = "gamma(-omega_s; omega_1, omega_2, omega_3) = gamma_0 (1 + A omega_L^2 + B omega_L^4 + C omega_L^6 + ...); Table II, atomic units: gamma_0 = 43.104, A = 2.191, B = 3.381, C = 6.748"
variable = "omega_L^2 = omega_s^2 + omega_1^2 + omega_2^2 + omega_3^2 in au (omega_L^2 = 6 omega^2 for ESHG); the au of frequency for these coefficients is not stated (the SI column uses the He reduced-mass value 1 au = 219444.5464 cm^-1)"
process = "eshg"
convention = "T"
part = "electronic"
range = "fitted over 0.004 <= omega_L^2 <= 0.08 au (lambda >= 395 nm), 'to better than 0.01%' (p. 9)"
coefficients = { gamma0 = "43.104", A = "2.191", B = "3.381", C = "6.748" }
coefficient_units = { gamma0 = "au", A = "au", B = "au", C = "au" }
reproduced_from = ["bishop_1989"]
check = "A = 2.191 / 219444.5464^2 = 4.5498e-11 cm^2 and B = 3.381 / 219444.5464^4 = 1.4580e-21 cm^4 reproduce the SI column; C = 6.748 / 219444.5464^6 = 6.043e-32 cm^6 (see table2_He_si). Checked 2026-09-26."
notes = "The author's fit to Bishop & Pipin's ab initio gamma_He (ref 24 = bishop_1989) for DFWM, dc Kerr, ESHG and THG, 'the coefficient A was constrained to be identical for all four ... A = 2.191 a.u. obtained in this way is a good estimate (+-0.001 a.u.) of the coefficient A in the infinite power series expansion, though the coefficients B and C are not. The fit coefficients obtained for the ESHG process in He are given in Table II' (pp. 7-9). The ab initio values' 'estimated convergence error of about 0.02% is also the estimated accuracy'. The ultimate calibration of every ESHG value here."

[[formulas]]
id = "table2_He_si"
material = "He"
equation = "Eq. (8), p. 7; Table II, p. 7"
printed = "Table II, SI units: gamma_0 = 2.6903 x 10^-63 C^4 m^4 J^-3, A = 4.550 x 10^-11 cm^2, B = 1.458 x 10^-21 cm^4, C = 6.043 x 10^-31 cm^6"
variable = "nu_L^2 = 6 nu^2 in cm^-2 for ESHG, nu the vacuum wavenumber of the fundamental in cm^-1"
process = "eshg"
convention = "T"
part = "electronic"
range = "lambda >= 395 nm"
coefficients = { gamma0 = "2.6903e-63", A = "4.550e-11", B = "1.458e-21", C = "6.043e-31" }
coefficient_units = { gamma0 = "C^4 m^4 J^-3", A = "cm^2", B = "cm^4", C = "cm^6" }
reproduced_from = ["bishop_1989"]
check = "gamma_0 = 43.104 x 6.241363e-65 = 2.6903e-63 (the He reduced-mass conversion, p. 9). C IS MISPRINTED: 6.748 / 219444.5464^6 = 6.043e-32 cm^6, and shelton_1992 (p. 3) states 'table 2 of ref. [1] ... has a misprint: 10^-31 in the last line should be 10^-32'; shelton_1994 Table VII prints C = 0.060 4 x 10^-30 cm^6 (= 6.04e-32). The corrected C is 6.043e-32 cm^6. Checked 2026-09-26."
notes = "Converted with the He reduced-mass factors: 'omega, 1 a.u. = 219444.5464 cm^-1; and gamma, 1 a.u. = 6.241363 x 10^-65 C^4 m^4 J^-3' (p. 9; 1986 CODATA). The C term contributes only ~5e-5 at 457.9 nm, so the misprint does not change the calibration."

[[formulas.corrections]]
term = "C"
printed = "6.043e-31"
corrected = "6.043e-32"
reason = "Table II's exponent is misprinted: the atomic-unit C, 6.748, is 6.043e-32 cm^6 (6.748 / 219444.5464^6)."
evidence = "shelton_1992 (p. 3): 'table 2 of ref. [1] ... has a misprint: 10^-31 in the last line should be 10^-32'; shelton_1994 Table VII prints C = 0.0604 x 10^-30 cm^6. Checked 2026-09-26."

[[formulas]]
id = "table5_gammavR_H2"
material = "H2"
equation = "Eq. (15), p. 10; Table V, p. 11"
printed = "<gamma^vR> ~ G omega^-2 + H omega^-4 (Eq. 15); Table V caption: <gamma^vR> = G nu^-2 + H nu^-4 at T = 295 K; H2: G = -1.591 x 10^-55 C^4 m^4 J^-3 cm^-2, H = -2.492 x 10^-48 C^4 m^4 J^-3 cm^-4"
variable = "nu: vacuum wavenumber of the fundamental in cm^-1 (the caption's nu; Eq. 15 writes omega)"
process = "eshg"
convention = "T"
part = "vibrational (vibrational + rotational: gamma^vR)"
range = "optical frequencies far above the rovibrational ones; for H2 and D2 accurate in the visible only (p. 12)"
coefficients = { G = "-1.591e-55", H = "-2.492e-48" }
coefficient_units = { G = "C^4 m^4 J^-3 cm^-2", H = "C^4 m^4 J^-3 cm^-4" }
check = "At 632.8 nm (15798 cm^-1) it gives -0.678e-63 against Table III's H2^vR -0.68; at 1064 nm -2.12e-63 against -2.25 (the text: Eq. 15 'is significantly in error for the near-infrared wavelengths'). Checked 2026-09-26."
notes = "Eq. (12)-(14): <gamma^vR> ~ sum_v (2/hbar Omega_0v)(alpha_bar^2 + (4/45) Delta alpha^2)_0v F(Omega_0v; omega) + (Delta alpha_00^2/15kT) F(Omega_rms; omega), F(Omega; omega) = [1 - (2 omega/Omega)^2]^-1 + 2 [1 - (omega/Omega)^2]^-1 (Eq. 11) ~ -(9/4)(Omega/omega)^2 - (33/16)(Omega/omega)^4 (Eq. 14), Omega_rms = 4 B_0/(hbar B_0/kT)^(1/2) (Eq. 13). Table V inputs for H2 (note a: 'From Refs. 5 and 39-43 for J = 1'): B_0 = 59.3 (cm^-1), nu_0,v = 4156 and 8075 cm^-1 (v = 1, 2), Delta alpha_0,0 = 33.8e-42 C^2 m^2 J^-1, (alpha_bar^2 + (4/45) Delta alpha^2)_0,v^(1/2) = 12.58e-42 and 1.10e-42 C^2 m^2 J^-1 (v = 1, 2). 'For H2 and D2 the values of Omega_rms from Eq. (13) have been slightly adjusted to improve the estimate of <gamma^R>' (caption). The Table III gamma^vR of H2 come from the full Eqs 9-11, not from this formula."

