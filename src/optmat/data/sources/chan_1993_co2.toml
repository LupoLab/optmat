table = "tbl_b45cfc94562b"
quantity = "differential_oscillator_strength"
unit = "1/eV"
scale = 0.01
abscissa_unit = "eV"
use = "primary"
notes = "Table 1: low-resolution (1 eV FWHM) dipole (e,e) absolute df/dE (10^-2 eV^-1), 8.53-203.00 eV, 162 points in print order (about 0.51 eV steps to 39.74 eV, 1.03 eV to 79.30 eV, 2.05 eV to 203 eV); TRK-normalised to 16.51 including the fitted tail above 203 eV (formula tail_fit); independent of optical data. No uncertainty stated."

