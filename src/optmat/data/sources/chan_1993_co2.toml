[[formulas]]
id = "tail_fit"
material = "CO2"
equation = "Section 3.1, p. 3"
printed = "df/dE = A E^-2 + B E^-3 + C E^-4, fitted over 90-203 eV: 'A = 2.616, B = 95.24 and C = 246.9 (x10^4)'"
variable = "E: photon energy in eV; df/dE (in Table 1's unit, 10^-2 eV^-1) = factor x (A E^-2 + B E^-3 + C E^-4), the printed '(x10^4)' read as applying to all three coefficients"
state = "none (per molecule)"
density = "none"
range = "fitted over 90-203 eV; used to estimate the valence-shell oscillator strength above 203 eV (8.51 % of 16.51)"
coefficients = { A = "2.616", B = "95.24", C = "246.9", factor = "1e4" }
check = "Read with every coefficient times 10^4 and df/dE in 10^-2 eV^-1: the integral from 203 eV to infinity is 1.4052, 8.511 % of 16.51 (printed 8.51 %); the curve gives 0.750 at 203.00 eV and 3.549 at 100.54 eV against Table 1's 0.788 and 3.58 (computed 2026-09-27). The '(x10^4)' is printed after C only; applying it to C alone gives nothing sensible (A/E^2 = 6e-5 at 203 eV)."
notes = "The paper's high-energy extrapolation of the low-resolution df/dE (Fig. 1 insert shows it to 300 eV). The scale factor 10^4 applied to all three coefficients and the unit 10^-2 eV^-1 are inferred from the check; the coefficients are as printed, the factor separate."
