citation = "W. F. Chan, G. Cooper and C. E. Brion, \"The electronic spectrum of carbon dioxide. Discrete and continuum photoabsorption oscillator strengths (6-203 eV)\", Chem. Phys. 178, 401 (1993)"
doi = "10.1016/0301-0104(93)85079-n"
library = "Chan_1993_ElectronicSpectrumCarbon"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Dipole (e,e) spectroscopy. Low resolution (about 1 eV FWHM, 8 keV, zero mean \
scattering angle): energy-loss spectra at 8.5-39.7, 40-79 and 80-203 eV at about 0.5, \
1 and 2 eV intervals, Bethe-Born converted; the valence-shell fraction above 203 eV \
from a fit A E^-2 + B E^-3 + C E^-4 to 90-203 eV (8.51 %), and the whole \
TRK-normalised to 16.51 (16 valence electrons plus 0.51 for Pauli-excluded K-shell \
transitions, from atomic C and O estimates) (pp. 2-3). High resolution (0.048 eV \
FWHM): 6-30 eV, Bethe-Born converted and normalised at 26 eV to the low-resolution \
value; the two bands below 10 eV deconvoluted, the others integrated over energy \
ranges (pp. 7-10). Independent of optical data and target density; no line saturation. \
Background removed by quartering the sample pressure; energy scale from helium's \
21.218 eV line. Canadian Liquid Air CO2 (p. 3)."""
notes = """Values per molecule; no density or state involved (room-temperature CO2, not stated). \
No uncertainty is stated anywhere in the paper for the present values.

Table 1 (p. 5, unlabelled in the extraction): the low-resolution df/dE, 8.53-203.00 \
eV, 162 points (sigma(Mb) = 109.75 df/dE(eV^-1)); the step changes at 40 and 80 eV \
(39.74, 40.03; 79.30, 80.05) follow the three measured ranges. Generally good \
agreement with Samson and Haddad's photoabsorption; Lee et al. (synchrotron) 5-10 % \
higher above 22 eV and much lower below; De Reilhac and Damany 10-15 % higher at 37-50 \
eV and much lower above; Brion and Tan's (1978) and Hitchcock et al.'s (1980) dipole \
(e,e) data, normalised to Lee et al., slightly higher (pp. 3-5). Sums computed from \
Table 1 (2026-09-27; trapezoid from 8.53 eV plus the paper's A E^-2 + B E^-3 + C E^-4 \
tail above 203 eV, the formula below): S(0) = 15.020 over 8.53-203 eV and 16.425 in \
all (normalised to 16.51; the table misses the discrete bands below 8.5 eV and the \
trapezoid is coarse); S(-1) = 13.384, S(-2) = 16.876 au, S(-3) = 26.63, S(-4) = 47.73, \
S(-6) = 187.9. Olney et al. (olney_1997 table1_CO2) quote 16.92 au for the S(-2) of \
'the originally published' spectrum (0.3 % above). The paper prints no S(k).

High resolution (Section 3.2): Table 2 (p. 10; the extraction attaches the caption \
'Table 3' to it and puts 'Table 2' and its caption in its footnotes, a structural \
fix): the deconvoluted strengths of the two weak diffuse bands below 10 eV, 1Delta_u \
(peak about 8.38 eV in the table, 'about 8.35' in the text) and 1Pi_g (about 9.30 eV; \
text 'about 9.40'), with four other measurements. Table 3 (p. 10): the 1Sigma_u+ \
(1pi_g -> 3p pi_u, about 11.05 eV) and 1Pi_u (1pi_g -> 3p sigma_u, about 11.40 eV) \
bands, the present values integrated over 10.30-11.28 and 11.28-11.49 eV (interval \
dataset), with two theories and four experiments per state (the ranges of the others \
are not stated: band datasets). Table 4 (p. 10): the present oscillator strength \
integrated over 16 intervals from 11.49 eV to the first ionisation threshold, 13.78 \
eV. The present intervals 10.30-13.78 eV sum to 1.197, and with the two bands below 10 \
eV to 1.210 below the IP (checked 2026-09-27).

Text (p. 11): over 14.83-20.66 eV the present estimate is 1.674; the original data of \
Nakata et al. give 1.372, Berkowitz's scaled (by 150 %) version 2.031, 'likely ... \
overcorrected' (inline datasets). Figs. 4-6 (6-30, 6-15, 15-20 eV high-resolution \
spectra) are figures only.

inn_1953 (curated) holds the same three Inn et al. strengths (0.0043, 0.0053, 0.12) as \
this paper's Tables 2-3 quote: those datasets are reproduced from inn_1953."""

