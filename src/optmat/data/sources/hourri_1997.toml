citation = "A. Hourri, J. M. St-Arnaud and T. K. Bose, \"Dielectric and pressure virial coefficients of imperfect gases: CO2-SF6 mixtures\", J. Chem. Phys. 106, 1780 (1997)"
doi = "10.1063/1.473317"
library = "Hourri_1997_DielectricPressureVirial"
identity = "VALIDATED"
kind = "measurement"
technique = """Static dielectric constant of five CO2-SF6 mixtures at 322.85 K: capacitance \
bridge at 1 kHz (Andeen-Hagerling 2500A, 5e-6 pF), stainless-steel gold-plated cells \
(compressibility correction kappa = 2e-8 MPa^-1) in a bath controlled to 10 mK (Pt \
thermometer). A_eps and B_p from absolute measurements to 1.4 MPa (quartz transducer, \
0.01 %, against a 0.005 % standard), CM RT/P against CM (Eq. 7); B_eps and C_eps from \
the differential expansion technique of Buckingham, Cole and Sutter (two cells, Eq. 8, \
slope and curvature). Mixtures by weighing, checked by gas chromatography; CO2 and SF6 \
99.9 % minimum purity (pp. 3-4)."""
notes = """Identity checked against the first page (pdf page 1 is the publisher's cover; \
journal pp. 1780-1785 = pdf pages 2-7). Page numbers below are pdf pages.

SCOPE. The mixtures are not curated species: only the pure-gas rows of Table I and the \
pure-SF6 B_eps of the text are recorded. Table I's pure rows are reprints: 'The pure \
components values are from the literature' (caption, p. 5), SF6 A_eps from Ref. 4 \
(Hosticka and Bose 1974 = hosticka_1974), CO2 A_eps, B_eps, C_eps from Ref. 10 (Bose and \
Cole 1970 = bose_1970); both originals re-pointed 2026-09-27 (323.3 K and 49.7 degrees C). Their temperatures are not stated here (the table \
is 'at 322.85 K' for this work); the CO2 B_eps, 50.7 +- 0.9, is the Bose and Cole value \
that achtermann_1991 reprints at 322.9 K (B_eps_bose_cole_1970_322.9_CO2).

THE STATIC QUANTITIES. CM/rho = A_eps + B_eps rho + C_eps rho^2 (Eq. 1), the static \
(1 kHz) Clausius-Mossotti expansion; for these non-polar gases A_eps = (4 pi N_A/3) \
alpha (Eq. 4), the electronic plus vibrational static polarizability (SF6's vibrational \
part is large: about 14 au of 44, hohm_2013). B_eps = B_OR + B_IR + B_R (Eq. 10): the \
orientation part (from the hexadecapole of SF6), the vibrational (infrared) induction \
part (B_IR = 24.2 cm^6/mol^2 for SF6, Birnbaum and Bose, Eq. 13) and the optical \
refractivity virial B_R, so B_eps is not an optical refractivity virial.

UNCERTAINTY. 'The uncertainties indicated are three standard deviations from the best \
least squares fit' (p. 4), for this work's values; the text's B_eps11 = 65.14 +- 1.80 is \
stored as '3 sigma'. The level of the literature reprints is not stated here.

TEXT VALUES (pp. 4-6). Pure SF6: 'Our value of B_eps11 = 65.14 +- 1.80 cm^6/mol^2, \
obtained from the intercept, agrees well with the literature values' (p. 4; the \
intercept at X = 0 of the mixtures' B_eps against the CO2 mole fraction, Eq. 3): \
recorded inline (B_eps_SF6). B_OR(SF6) = 18.24 +- 2.20 = 65.14 - 24.2 - 22.7 (p. 5), \
giving the SF6 hexadecapole moment 10.75 +- 0.75 e-42 esu cm^4 (abstract; Lennard-Jones \
(7-28) sigma = 0.468 nm, eps/k = 439 K; alpha(SF6) = 6.558e-24 cm^3). Reprinted from \
Achtermann et al. 1991 (Ref. 28; achtermann_1991): B_R = 22.7 +- 0.5 (SF6) and 1.9 +- \
0.2 cm^6/mol^2 (CO2), A_R = 6.644 +- 0.002 (CO2) and 11.323 +- 0.002 cm^3/mol (SF6) \
(pp. 5-6; not recorded again). Table II: alpha = 2.913 +- 0.002 (CO2, Ref. 10) and 6.558 \
+- 0.007 e-24 cm^3 (SF6, Ref. 4), the reprinted A_eps divided by 4 pi N_A/3 (7.350 -> \
2.9135, 16.543 -> 6.5576, computed 2026-09-26); Lennard-Jones (6-12) parameters eps/k \
218.8, 225.36, 222.06 K and sigma 3.819, 5.16, 4.489 Angstrom (CO2, SF6, mixed).

Not extracted (mixtures or no quantity): the mixture rows of Table I (X = 0.105-0.902, \
A_eps, B_eps, C_eps, B_p); B_eps12 + B_eps21 = 109.86 +- 2.40 cm^6/mol^2, B_p12 = \
-146.15 +- 6.33 cm^3/mol (Kielich: -151.70), B_R12 = 6.57 +- 0.42 (geometric mean), \
B_IR (mixture) = 6.49, B_OR = 90.23 +- 3.29 cm^6/mol^2; the CO2 quadrupole moment \
(4.48 +- 0.30) e-26 esu cm^2 and Table III's terms; the pure B_p (SF6 -229.12, \
extrapolated from Ref. 25; CO2 -102.37, from Ref. 24).

Hazards of the extraction: in Table I '±' extracts as '6' and a leading minus as '2' \
(e.g. '2205.2260.24' for -205.22 +- 0.24); fixed in the script for the cells used, \
checked against the image."""

