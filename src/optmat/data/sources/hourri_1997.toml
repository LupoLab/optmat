quantity = "molar_refractivity"
unit = "cm3/mol"
abscissa_unit = "nm"
use = "reproduced"
reproduced_from = ["hosticka_1974"]
notes = "Table I, mole fraction of CO2 0: A_eps = 16.543 +- 0.017 cm^3/mol (footnote a, Reference 4, Hosticka and Bose 1974 = hosticka_1974, re-pointed 2026-09-27): the static molar polarization of SF6, electronic plus vibrational; the original's 323.3 K value, digit for digit (checked). The '±' extracts as '6' (structural fix). The original's errors are three standard deviations: level corrected to '3 sigma'."
