citation = "G. Jansonas, R. Budriūnas, M. Vengris and A. Varanavičius, \"Interferometric measurements of nonlinear refractive index in the infrared spectral range\", Opt. Express 30, 30507 (2022)"
doi = "10.1364/oe.458850"
library = "Jansonas_2022_InterferometricMeasurementsNonlinear"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Mach-Zehnder interferometry of the fringe distortion caused by self-phase \
modulation: the sample sits in one arm, near-collimated (e^-2 beam diameter 0.62-0.94 mm, \
Rayleigh length > 100 mm), its exit face imaged (x5) onto a beam profiler \
(microbolometer camera at 2.2 and 3.2 um, CMOS at 1.03 um) where it interferes with the \
reference beam at about 1 degree. The 2-D Fourier-transform phase, less a low-energy \
reference, is fitted to the measured beam profile (Eq. 10) to give B_eff at each pulse \
energy; B_eff = s_E (E - E_ref) (Eq. 11); the time-averaging factor s_B = B_eff / B is \
simulated with the (X)FROG-measured pulses (Eq. 12, Fig. 2), and n2 = (lambda / 2 pi L) \
(s_E / s_B) J, J the integral of the measured normalized beam and pulse profiles (Eq. \
14). Sources: a Yb:KGW laser (Light Conversion Pharos), 1.03 um, and a home-built OPA at \
2.2 and 3.2 um (up to 40 uJ, 1 kHz); pulse durations about 230, 170 and 190 fs (FROG and \
XFROG, p. 30515), numerically propagated through the setup's transmissive optics before \
use. B stayed below about 1 rad and no self-focusing was seen (p. 30512)."""
notes = """Journal pages 30507-30524 = PDF pages 1-18. Identity checked against the first page. The \
Supplement 1 cited for Tables S1-S2 (peak intensities, E_ref) and Figs. S1-S24 is not in \
the library copy.

DEFINING RELATIONS (p. 30508): n(x, y, t) = n0 + n2 I(x, y, t) (Eq. 1); B = (2 pi / \
lambda) int_0^L n2 I0(z) dz (Eq. 2), = (2 pi / lambda) n2 I0 L for a thin sample (Eq. 3). \
One beam's self-phase modulation: coefficient 'self'. Linearly polarized light (Eq. 5). \
All tabulated n2 in 10^-14 cm^2/W (table notes, checked on the images).

EFFECTIVE AND KERR n2 (pp. 30516-30520). Tables 2 and 3 give n2_eff, the measured \
coefficient, which in a noncentrosymmetric crystal includes the nonlinear refraction of \
cascaded (phase-mismatched) second-harmonic generation, n2_casc = -(4 pi / (c eps0 \
lambda)) d_eff^2 / (n_omega^2 n_2omega Delta k) (Eq. 15, p. 30517; d_ij from Nikogosyan \
[55] and Refs. [56, 57], scaled by Miller's rule). The only centrosymmetric samples are \
Si, KRS-5, KRS-6 and UVFS (n2_eff has no cascaded part). Table 4 gives n2_Kerr = n2_eff - \
n2_casc for GaSe, AgGaS2, ZGP, KTA and LGS: the third-order (Kerr) coefficient, the quantity \
optmat models. For ZGP (e) at 3.2 um, Eq. (15) fails (small phase mismatch, pump \
depletion) and n2_casc was 'calculated numerically by simulating the propagation of the \
measured pulse' (Table 4 note b, p. 30520); for ZGP (o) n2_casc = 0 (d_eff = 0 for oo-e \
at phi = 0), so n2_Kerr = n2_eff. The cascaded part was NOT computed for ZnS, ZnSe and \
SBN-61 (polycrystalline or polydomain) nor for BGSe, GaAs and ZnTe (orientation \
incompletely known): their n2_eff may contain an unknown cascaded contribution. \
Decision: n2_Kerr (Table 4) datasets are 'primary'; the n2_eff datasets of the same five \
crystals are 'check' (the same measurement before the cascade correction); every other \
n2_eff dataset is 'primary', with its cascade status in its notes. part = 'unknown' \
throughout (170-230 fs pulses; the paper does not discuss the Raman response); the \
n2_eff datasets additionally include cascading where stated.

SPECIAL CASES. Si at 2.2 um: two-photon absorption (beta_2PA = 0.238 cm/GW, fitted, Eqs. \
16-17) was accounted for; the corrected n2_eff is about 0.5 x 10^-14 cm^2/W higher than \
without (p. 30521). GaAs at 2.2 um: B_eff(E) is not linear, the SPM reverses sign above \
about 5.5 GW/cm^2 (Fig. 8): no value (the '-' of Table 3). LGS (o) at 2.2 um: skipped, too \
close to phase-matched SHG (p. 30519). ZnS and ZnSe: second harmonic from random \
quasi-phase-matching seen, a few percent of the energy (p. 30516). Dispersion corrections \
of B (numerical integration of Eq. 2) for KTA, LGS, SBN-61, ZnS, ZnSe at 1.03 um and KTA, \
SBN-61 at 3.2 um (p. 30516).

UNCERTAINTY. The +- of this work is not defined (no level stated); the method's limits \
are discussed on p. 30515 (B_eff about 10 mrad the practical floor).

SAMPLES (Table 1, p. 30513; orientation, thickness): GaSe theta = 0, E || X, 0.56 mm; AgGaS2 \
theta = 39, phi = 45 deg, 0.98 mm; ZGP theta = 74, phi = 0, 0.72 mm; SBN-61 theta = 90, phi = \
0, 5.05 mm (polydomain); KTA theta = 45, phi = 0, 5.065 mm; LGS theta = 45, phi = 0, 8.195 \
mm; BGSe theta = 0, 1.785 mm; GaAs (100), 0.50 mm; Si unknown, 1.04 mm; ZnTe unknown, 0.63 \
mm; ZnS ('Cleartran', polycrystalline) 6.125 mm; ZnSe (polycrystalline) 2.04 mm; KRS-5 \
(TlBr-TlI) 4.01 mm and KRS-6 (TlBr-TlCl) 1.7 mm (mixed crystals); UVFS (SiO2) 20 mm. \
Axes: for the uniaxial GaSe (theta = 0), AgGaS2, ZGP and SBN-61 an o-wave is recorded as \
axis 'o'; an e-wave at theta = 39 or 74 deg is not along the e axis and is recorded as a \
polarization only; SBN-61 was measured with the o-wave only. KTA and LGS are biaxial: \
the paper's (o) and (e) are the two eigen-polarizations of the theta = 45, phi = 0 cut, \
recorded as polarizations, not axes. BGSe (theta = 0) polarization not stated.

LITERATURE COLUMNS. Tables 2 and 3: n2_eff of other works, each with its wavelength and \
reference, 'use = reproduced' (reproduced_from as printed in the reference list, or the \
curated id): [28] patwardhan_2021 (its 10^-20 m^2/W values, same numbers); [36] \
ensley_2019 (the +- here are Ensley's stated +-20 % at 2 um and +-25 % at 3.9 um); [50] \
milam_1998 (its recommended 1053 nm value). The superscript b of Table 2 ('Same value for \
both polarization modes') marks KTA [45,46] and [47] and LGS [47]: the literature gives \
one value for both, so those reproductions are not polarization-specific although filed \
under the (o) or (e) row. Not extracted: LGS (o) '<0.64 (1.03 um) [48]' (an upper bound, \
Namboodiri et al. 2021). The Si value of [32] is printed '≈ 10.4 +- 2 (2.2 um)'. Table 4's \
last column is not a reproduction: 'The last column of the table contains n2_Kerr values \
that we calculated using the data from other published works' (p. 30517), i.e. the \
authors' removal of the cascaded part from the cited n2_eff: 'use = check', \
reproduced_from the work whose n2_eff was used.

refractiveindex.info (Jansonas n2 pages, checked 2026-09-26): Si 7e-18 and 4.54e-18 \
m^2/W at 2.2 and 3.2 um (170 and 190 fs; orientation unknown), SiO2 (UVFS) 2.53e-20 m^2/W \
at 1.03 um (230 fs): the same values. The pages hold only Si and SiO2; none of the other \
13 materials, nor the n2_Kerr of Table 4, and they do not say that n2 here is n2_eff."""

