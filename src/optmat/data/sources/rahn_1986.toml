citation = "L. A. Rahn and R. E. Palmer, \"Studies of nitrogen self-broadening at high temperature with inverse Raman spectroscopy\", J. Opt. Soc. Am. B 3, 1164 (1986)"
doi = "10.1364/josab.3.001164"
library = "Rahn_1986_StudiesNitrogenSelf"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """High-resolution quasi-cw inverse Raman spectroscopy (pp. 1164-1165): a \
single-mode Ar-ion probe near 514.5 nm locked to an etalon, and a pump from a single-mode \
cw dye laser (1 MHz) pulse-amplified to about 1 MW (22 ns, about 45 MHz = 0.0015 cm-1 \
FWHM), crossed at a 100 um waist in a furnace (alumina tube, 99.99 % N2, Pt-Pt 13 % Rh \
thermocouple within 2 mm of the focus). Raman shifts to 0.001 cm-1 (wavemeter and a \
749-MHz etalon). N2 Q branch, v = 0 -> 1, J = 0-30, at 295-1500 K and 20-760 Torr; \
spectra at 1 atm (twice or more, once at 1000 K), and near the bandhead also at 0.23 and \
0.5 atm (500 K) and 0.5 atm (730 K). Each line fitted as an isolated line (with the \
wings of its neighbours) by a Galatry profile (Doppler and Dicke narrowing, soft \
collisions), the optical diffusion coefficient D chosen per temperature to make the \
coefficient independent of pressure (Fig. 3); the collisional width divided by the \
pressure gives the coefficient."""
notes = """Identity checked against the first page. Page numbers are journal pages \
(pdf pages 1-6 = pp. 1164-1169). Material: 14N2 (natural nitrogen, 99.99 %); no other \
isotopologue.

WIDTH CONVENTION. FULL widths. Table 1's caption (p. 1167): 'Collisional \
Self-Broadening Coefficients (FWHM) for the N2 Q Branch', column head '2 gamma_j (cm-1 \
atm-1)'; Fig. 3 caption (p. 1166): '2 gamma_j refers to broadening coefficients (FWHM) \
and gamma_ij refers to S-matrix elements'; Eq. (3) (p. 1167): 'the collisional-broadening \
portion of the linewidth Gamma_j (FWHM) for transition Q(j) is ... Gamma_j/2 = sum_{i != \
j} gamma_ij'. Per atm of pressure at the stated temperature (not per amagat): 'dividing \
the fitted collisional width by the gas pressure' (p. 1166). No Dicke term in the \
coefficient: the Doppler and Dicke effects are in the Galatry profile, and the \
coefficient is the high-pressure (collisional) limit (Fig. 3).

UNCERTAINTIES (pp. 1166-1167). 'The 1-sigma error estimates (parentheses in Table 1) for \
the present results are derived from multiple measurements and from the quality of the \
fit (chi^2). Systematic errors, however, are not included in these estimates. Errors \
due to the uncertainty in D are expected to be of the same order or smaller'; the \
Doppler-related uncertainty is 'of the order of the experimental reproducibility of +-3 \
%'; the isolated-line approximation may add error 'for slightly overlapping transitions \
at low J'. D was 66-80 % of the kinetic-theory mass diffusion coefficient at 1000 K and \
above, 'reproducible to only +-50 %' (1.6 cm2 s-1 at 1300 K, p. 1166).

THE 295 K COLUMN is not this paper's measurement: note a, 'From Ref. 6' = G. J. Rosasco, \
W. Lempert and W. S. Hurst, Chem. Phys. Lett. 97, 435 (1983) (rosasco_1983, which has a \
fourth author, A. Fein). Every value and error is exactly twice Rosasco et al.'s printed \
HWHM gamma_j (0.065(15) -> 0.130 (30), ..., 0.030(6) -> 0.060 (12); all 19 rows \
checked): Rahn and Palmer doubled Rosasco's half widths to full widths. Recorded as \
reproduced (table1_295K). 'Because the measurements at 295 K are in excellent agreement \
with the results of Rosasco et al., a detailed pressure-dependence study has not been \
performed at this temperature' (p. 1165).

TABLE 1 GAPS. A dash marks a J not measured at that temperature (500 K: J = 19; 730 K: \
J = 0, 1; 1000 K: J = 0, 1, 17, 25; 1500 K: J = 0, 1, 15, 23); blank cells lie beyond the \
measured range. Not values; not recorded.

THE SCALING LAW (Eqs. (1)-(3), p. 1167; recorded as the formula eq1_meg). The modified \
exponential-gap (MEG) law of Koszykowski et al. (Ref. 10; koszykowski_1987), with \
alpha = 0.023 +- 0.003 cm-1 atm-1, beta = 1.67 +- 0.15, delta = 1.26 +- 0.06 from their \
295 K fits, and the temperature exponent fitted here to Table 1: 'n = 1.346 +- 0.06 and \
T0 = 295 K' (p. 1167; the page image was checked at 300 dpi: '+- 0.06', one significant \
figure of error). koszykowski_1987 quotes this paper's n as '1.346 +- 0.006' (its p. 5): a \
tenfold smaller error than printed here. 'The scaling law does slightly underestimate the \
experimental values for 1500 K' (p. 1167). Note 32 (p. 1169) gives a replacement \
temperature function for T > 2000 K from tungsten-lamp CARS (formula note32_meg). Note 20 \
(pp. 1168-1169): 'The value for alpha based on the exponential-gap scaling law cited in this \
reference [Koszykowski, Farrow and Palmer, Opt. Lett. 10, 478 (1985)] should be divided \
by 2.'

FIG. 6 (not extracted): N2 Q-branch broadening in the post-flame gases of a lean \
methane-air flame at 1730 K (Ref. 5, figure only), slightly above the self-broadening \
prediction. The water-vapour broadening is announced, not given.

What this bears on: the N2 Q-branch widths in use (docs/raman.md: Koszykowski et al.'s \
MEG law with Rahn and Palmer's n = 1.346 'as they quote it', TC-492). Table 1 gives the \
measured per-J FWHM at 500-1500 K directly; the MEG law with the printed parameters \
reproduces it to 2-4 % rms at 500-1000 K and 7 % low at 1500 K (see the formula's \
check)."""

