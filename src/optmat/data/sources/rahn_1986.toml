[[formulas]]
id = "eq1_meg"
material = "N2"
equation = "Eqs. (1)-(3), p. 1167"
printed = "gamma_ji = alpha p (T0/T)^n [(1 + 1.5 E_i/kT delta)/(1 + 1.5 E_i/kT)]^2 exp(-beta Delta E_ij/kT) (i < j); gamma_ij = [(2J_i + 1)/(2J_j + 1)] gamma_ji exp(Delta E_ij/kT); Gamma_j/2 = sum_{i != j} gamma_ij"
variable = "p: pressure in atm; T in K, T0 = 295 K; E_i the rotational term energy of the lower level J_i, Delta E_ij = E_j - E_i, kT all in cm-1; alpha in cm-1 atm-1; Gamma_j the collisional FWHM of Q(j) in cm-1 (Gamma_j / p is Table 1's 2 gamma_j). 1.5 E_i/kT delta is read as 1.5 E_i/(kT delta), as koszykowski_1987 prints it"
state = "pure N2, self-broadening"
density = "unknown"
range = "295-1500 K (Table 1), J = 0-30; the rate law is for rotationally inelastic collisions, 'if vibrational dephasing is unimportant' (p. 1167)"
coefficients = { alpha = "0.023", alpha_error = "0.003", beta = "1.67", beta_error = "0.15", delta = "1.26", delta_error = "0.06", a = "1.5", n = "1.346", n_error = "0.06", T0 = "295" }
check = "Against Table 1 (scratch, 2026-09-27), summing the rates out of J over the levels of the same parity (J +- 2, +- 4, ...; nuclear-spin symmetry is conserved) to J = 80, with Bendtsen's B0 = 1.989574 and D = 5.76e-6 cm-1 (bendtsen_1974) and k = 0.6950348 cm-1/K: model/table - 1 is mean -2.9 %, rms 3.3 % at 295 K (Rosasco's column; -5.5 to +0.5 %); +1.7 %, rms 4.1 % at 500 K (worst Q(27) +13.6 %); -1.0 %, rms 2.3 % at 730 K; -0.3 %, rms 3.1 % at 1000 K; -7.0 %, rms 7.4 % at 1500 K (-2.7 to -10.7 %), as the paper says ('slightly underestimate ... for 1500 K'). The model at 295 K for Q(0), Q(2), Q(4) is 0.1264, 0.0991, 0.0916 cm-1/atm, which agrees with another extraction's evaluation of koszykowski_1987's law (126.3, 99.0, 91.6 x 1e-3)."
notes = "alpha, beta and delta are Koszykowski et al.'s (Ref. 10, fitted at 295 K); only n is fitted here (to Table 1, Fig. 5). The paper's n error is printed '+- 0.06' (koszykowski_1987 quotes '+- 0.006'). The 1.5 'includes N-N internuclear separation distances, characteristic collision interaction lengths, and reduced masses' (p. 1167). No nuclear-spin degeneracy factor appears in the rates; the parity restriction of the check is a physical constraint the paper does not state."

[[formulas]]
id = "note32_meg"
material = "N2"
equation = "Ref. note 32, p. 1169"
printed = "replace (T0/T)^n in Eq. (1) by f(T) = [(1 - e^-m)/(1 - e^(-m T/T0))] (T0/T)^0.5, m = 0.1487, with alpha = 0.023, beta = 1.67, delta = 1.21"
variable = "T in K, T0 = 295 K (from Eq. (1)); otherwise as eq1_meg"
state = "pure N2, self-broadening"
density = "unknown"
range = "'linewidths above 2000 K are better predicted' (tungsten-lamp CARS, Farrow, Trebino and Palmer, 'to be submitted to Appl. Opt., 1986'); also 'better overall agreement' with Fig. 5, 'especially those for 1500 K'"
coefficients = { alpha = "0.023", beta = "1.67", delta = "1.21", m = "0.1487", T0 = "295" }
check = "Against Table 1 as for eq1_meg (scratch, 2026-09-27): mean -0.0 %, rms 3.1 % at 295 K; +1.8 %, rms 5.5 % at 500 K; -1.6 %, rms 3.3 % at 730 K; +0.5 %, rms 4.3 % at 1000 K; -2.0 %, rms 3.7 % at 1500 K. The 1500 K bias of eq1_meg (-7 %) is removed, as the note says; T0 = 295 K is assumed (the note does not restate it)."
notes = "Announced in a note from later work (Farrow, Trebino and Palmer); not fitted in this paper. f(T0) = 1."
