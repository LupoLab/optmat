[[formulas]]
id = "cauchy_theory"
form = "alpha_series"
terms = { c = ["2.66080", "2.850", "4.932"] }
range_nm = [450.0, "inf"]
material = "Ne"
equation = "Eq. (3), p. 2, with Table IX (Total)"
printed = "alpha(omega) = alpha_0 + alpha_2 omega^2 + alpha_4 omega^4 + ...; alpha_0 = 2.66080(36), alpha_2 = 2.850(7), alpha_4 = 4.932(14)"
variable = "omega: photon energy (angular frequency) in atomic units (hartree); alpha in atomic units"
state = "none (per atom)"
density = "none"
range = "'well below the first atomic resonant frequency (omega about 0.6107 a.u.)'; the paper quantifies the truncation only at 633 nm (better than 1e-6). range_nm = [450, inf] is the extractor's choice (omega <= 0.1 a.u., as Lesiuk and Jeziorski 2023 state for argon), not the paper's: TC-64."
coefficients = { alpha_0 = "2.66080", alpha_2 = "2.850", alpha_4 = "4.932" }
check = "The Table IX budget rows sum to the three totals. At 632.9908 nm (omega = 0.0719811 a.u.) it gives 2.675699 (alpha_2 term 0.014767, alpha_4 term 0.000132); with Gaiser and Fellmuth's 2018 alpha_0 instead, 2.675956. No dynamic value is printed in the paper to compare with. Checked 2026-09-24."
notes = "The paper's own ab initio series. ELECTRIC polarizability: the magnetic susceptibility chi_0 = -8.484(19)e-5 a.u. (32 ppm of alpha_0) is not included; add it for the refractive index (Eq. (2))."
