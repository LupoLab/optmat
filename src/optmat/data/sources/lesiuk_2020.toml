citation = "M. Lesiuk, M. Przybytek and B. Jeziorski, Phys. Rev. A 102, 052816 (2020)"
doi = "10.1103/physreva.102.052816"
library = "Lesiuk_2020_TheoreticalDeterminationPolarizability"
identity = "VALIDATED"
kind = "theory"
technique = """Ab initio composite calculation of the static dipole polarizability alpha_0 \
and the dispersion (Cauchy) coefficients alpha_2, alpha_4 of the neon atom (20Ne, \
nuclear mass 36434.0 m_e), alpha(omega) = alpha_0 + alpha_2 omega^2 + alpha_4 omega^4 + \
... (Eq. (3)). Nonrelativistic clamped-nucleus part: all-electron linear-response \
(orbital-unrelaxed) CC3 in purpose-built Slater-type (wtccX) basis sets, extrapolated to \
the complete basis set with the X^-3 formula; post-CC3 full triples and quadruples \
(frozen 1s) for alpha_0 and a small-basis full-CI correction (50 % uncertainty) for all \
three. Relativistic: one-electron Breit-Pauli (mass-velocity + one-electron Darwin) by \
finite field/finite difference at CCSD(T) (alpha_0) and CC3 (alpha_2, alpha_4); \
two-electron Darwin and Breit for alpha_0. QED: leading-order one-electron term with \
the Bethe logarithm, Eq. (9); higher-order one-loop term, Eq. (10). Finite nuclear mass \
by reduced-mass scaling, Eqs. (12)-(13) (mass polarization neglected); finite nuclear \
size, Eq. (11). CODATA 2018 constants; c = 137.035999084 a.u."""
notes = """Atomic units throughout (polarizability in e^2 a0^2/Eh = 4 pi eps0 a0^3, omega in \
hartree). Corrections included in the Table IX totals: alpha_0 relativistic (one- and \
two-electron Breit-Pauli), leading and higher-order QED, finite nuclear mass (reduced \
mass) and size, all for 20Ne; alpha_2 and alpha_4 the one-electron relativistic, QED and \
finite-mass terms (the two-electron relativistic, post-CC3 triples/quadruples and \
nuclear-size terms not evaluated for them). 'The final error is obtained by summing the \
errors in the individual components quadratically' (p. 7), dominated by the full-CI \
correction; no confidence level stated. The budget rows sum to the totals (2.66080, \
2.850, 4.932; checked 2026-09-24).

Frequency range (p. 2): the expansion is used 'well below the first atomic resonant \
frequency (omega about 0.6107 a.u.)'; at 633 nm (omega about 0.072 a.u.) 'the inclusion \
of terms only up to omega^4 is sufficient to reach relative accuracy in alpha(omega) \
better than 10^-6'.

alpha is the electric polarizability only. The refractive index needs alpha + chi with \
the static magnetic susceptibility (Eq. (2), n - 1 = 2 pi rho (alpha + chi) at low \
density): chi_0 = -8.484(19) x 10^-5 a.u. (abstract, p. 10; -7.571(17) x 10^-6 cm^3/mol; \
nonrelativistic -8.483(8) x 10^-5, Eq. (16), with an estimated relativistic allowance), \
-32 ppm of alpha_0. The magnetic susceptibility is out of scope here and not extracted; \
it must be added to these alpha before comparison with refractivity data.

Table XI: the row labelled 'Kumar and Meath [29]' cites Kumar and Thakkar, J. Chem. \
Phys. 132, 074301 (2010) (Ref. 29, and the text p. 10), and its numbers are that \
paper's neon S(-2), S(-4), S(-6) (kumar_2010); the label is wrong, the values are \
right. The best earlier theoretical alpha_0, 2.6617(20) (Klopper et al. with Larsen et \
al.'s FCI correction, as combined in Gaiser and Fellmuth 2018, p. 10), is quoted in the \
text only and not extracted.

Not extracted: Tables I-VIII and X (helium test, CC3 by basis set, core, post-CC3, \
relativistic and <r^2> components)."""

