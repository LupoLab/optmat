[[errata]]
dataset = "table1_D2"
row = "3-1"
column = "value"
printed = "297.3"
corrected = "297.1"
reason = "The AVERAGE of the D2 3-1 line is printed 297.3, but the three plate values beside it (297.5, 297.5, 296.4) average 297.13, and the table's own DIFFERENCE column prints -0.6 against CALC. 297.7, i.e. an average of 297.1. Every other row's DIFFERENCE agrees with its printed AVERAGE to rounding."
evidence = "Table I (p. 763), table image checked (tbl_cd69d07ceea3.jpg): the printed cells are 297.5, 297.5, 296.4, 297.3, 297.7, -0.6. An internal inconsistency; the paper has no erratum."
