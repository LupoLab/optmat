[[formulas]]
id = "vibrational_terms_H2"
material = "H2"
equation = "p. 762 (the energy expression) and Table III, p. 764"
printed = "E/hc = omega_e (v + 1/2) - x omega_e (v + 1/2)^2 + y omega_e (v + 1/2)^3 - z omega_e (v + 1/2)^4 (+ the rotational terms, whose constants are not printed)"
variable = "v: the vibrational quantum number; E/hc in cm^-1 from the potential minimum"
range = "the first seven levels (v = 0-6), the Delta G values fitted"
coefficients = { omega_e = "4405.30", x_omega_e = "125.325", y_omega_e = "1.9473", z_omega_e = "0.11265" }
coefficient_units = { omega_e = "cm^-1", x_omega_e = "cm^-1", y_omega_e = "cm^-1", z_omega_e = "cm^-1" }
check = "Delta G_1 = omega_e - 2 x omega_e + 3.25 y omega_e - 5 z omega_e = 4160.415 cm^-1, which is Table II's T. & M. Q(0) 4160.4, against the measured 4160.2 +- 0.2 (checked 2026-09-26)."
notes = "Table III (p. 764), H2 column: a least-squares fit of the Delta G values of v = 0-6 (emission data of Jeppesen weight 1, Rasetti's Raman 3, this study 5; p. 763). Note the signs: + y omega_e, - z omega_e as printed."

