citation = "D. M. Bishop, J. Pipin and M. Rérat, \"Nonlinear optical properties of H2 and D2\", J. Chem. Phys. 92, 1902 (1990)"
doi = "10.1063/1.458072"
library = "Bishop_1990_NonlinearOpticalProperties"
identity = "VALIDATED_WITH_WARNINGS"
kind = "theory"
technique = """Sum-over-states (Orr-Ward, Eq. 12) evaluation of the electronic gamma \
components of H2 with explicitly correlated James-Coolidge-type wave functions \
(r12-dependent, elliptical coordinates; Sigma_g+, Sigma_u+, Pi_u, Pi_g and Delta_g \
states, Eqs. 13-20, the Pi and Delta basis sets enlarged over Bishop and Lam 1988) at \
seven internuclear distances R = 0.4-3.0 a0; combined to laboratory-frame gamma_par and \
gamma_perp, averaged over the rovibrational wave functions of the ground vibrational \
state and over a Maxwell-Boltzmann rotational distribution at 295 K; the pure \
vibrational contribution evaluated as in Bishop and Lam 1988. Also the dynamic \
field-gradient polarizabilities B and C (Eqs. 29-32) (pp. 1902-1906)."""
notes = """Identity checked against the first page (J. Chem. Phys. 92, 1902 (1990), \
received 15 September 1989). Page numbers are the journal's: pdf page 1 is the \
publisher's cover, so p. = pdf page + 1900. The paper that bishop_1991 takes its pure \
vibrational values from 'unchanged' (bishop_1991, p. 4847) and that bishop_1990, \
shelton_1990, sekino_1993, tammer_1990 and tammer_1992 cite as 'Bishop, Pipin and \
Rerat, J. Chem. Phys. 92, 1902 (1990)'. SUPERSEDED for the electronic part by bishop_1991 \
(extended Delta basis; its electronic values are 1.3-1.8 % higher, bishop_1991 p. 4851); \
the vibrational part is the one bishop_1991 reprints.

DEFINITIONS (pp. 1902-1903). mu_a = alpha_ab F_b + (1/6) gamma_abgd F_b F_g F_d + ... (Eq. \
1): the Taylor-series (T) convention of Buckingham, the same as bishop_1989 and \
bishop_1991. dc Kerr gamma_par = gamma_ZZZZ(-w; w, 0, 0), gamma_perp = gamma_XXZZ(-w; w, \
0, 0) (Eq. 4); ESHG gamma_par = gamma_ZZZZ(-2w; 0, w, w), gamma_perp = gamma_ZZXX(-2w; 0, \
w, w) (Eq. 6); THG gamma_par = gamma_ZZZZ(-3w; w, w, w) (Eq. 8), gamma_perp^THG = \
gamma_par^THG/3 exactly (not listed); 'par' and 'perp' refer to the static field \
parallel and perpendicular to the laser field; 'total' includes vibration, rotational \
contributions are excluded ('either insignificant or have been eliminated, by a \
temperature analysis, from the experimental data'). dc Kerr gamma^K = (3/2)[gamma_par - \
gamma_perp] (Eq. 9). Atomic units, 'gamma = e^4 a0^4 E_h^-3 = 6.23538 x 10^-65 C^4 m^4 \
J^-3' (p. 1903). The vibrational contribution is resonant where omega = omega_01 (Kerr), \
omega or 2 omega = omega_01 (ESHG) and 2 omega = omega_01 (THG), omega_01 = 0.01897 a.u. \
the first vibrational transition (p. 1904).

DATASETS: Tables II-VII (p. 1904-1906), per gas, process, component and part, split by \
the tables' two abscissae (hbar omega 0.00-0.05 a.u.; the lasers 10 640, 6943, 6328, 5900, \
5145, 4880 A: 60 datasets of 6 points); Table IX ratios S and T (theory, and the \
experimental values of Mizrahi and Shelton 1985, reproduced); Table X gamma^K; text: the \
experimental gamma^K of H2 (reproduced). The laser wavelengths are given without saying \
vacuum or air (the nominal lines; stored as vacuum; the difference, 3e-4 in lambda, is \
negligible for gamma). All theory values are use = check; no uncertainty is given for \
gamma, but the ratios carry estimated errors (R +-0.04, S +-0.01, T +-0.2, gamma^K +-10, \
Tables VIII-X).

ERRATA (the tables' own arithmetic, total = elec + vib, which every other entry obeys to \
+-0.1): (1) Table V, D2 dc Kerr gamma_perp(total) at 10 640 A printed 227.6, the sum \
222.0 + 55.7 = 277.7; Table X's gamma^K(D2, 10 640 A) = 655 = 1.5 (714.6 - 277.7) confirms \
it (227.6 would give 730). (2) Table III, H2 ESHG gamma_par(elec) at 5145 A printed \
931.9, where total - vib = 923.8 + 7.5 = 931.3: the total is confirmed by Table VIII (R = \
923.8/322.0 = 2.869, printed 2.869) and Table IX (T = 923.8/47.888 = 19.29, printed; 924.4 \
would give 19.30), the vib by bishop_1991's reprint (-7.5). (3) Table IV, H2 THG \
gamma_par(elec) at 10 640 A printed 774.4, where total - vib = 767.5 + 9.9 = 777.4: the \
vib is bishop_1991's reprint (-9.9), and 777.4 is what the smooth omega dependence \
requires (Table XI's fit, extrapolated from omega < 0.03 to 0.04282 a.u., gives 777.0; \
the table's own 0.04 and 0.05 a.u. values interpolate to about 777.5), and makes \
bishop_1991's improved 790.3 1.7 % higher, within its stated 1.3-1.8 % (774.4 would be \
2.1 %). Checked 2026-09-27.

OTHER CHECKS (2026-09-27). Table XI's fits (formulas) reproduce the elec columns at \
omega = 0.01-0.03 a.u. to within 0.05 a.u.; gamma^K of Table X = 1.5 (gamma_par - \
gamma_perp)(total) of Tables II and V to within 0.5 (rounding) except D2 at 10 640 A \
(erratum 1); T of Table IX = gamma_par^ESHG(total, H2)/[43.104 (1 + 2.189 w_L^2 + 3.602 \
w_L^4)] (Eq. 25, w_L^2 = 6 w^2) to the last digit at all four wavelengths; S = H2/D2 \
totals to the last digit.

REPRODUCTIONS ELSEWHERE (to be re-pointed; none of these records is from this \
extraction): bishop_1991's pure vibrational datasets (*_vib_*, 13 frequencies each) \
reprint Tables II-VII's vib columns digit for digit at the six laser wavelengths and \
at omega = 0.00, 0.03-0.05, but differ by 0.1 at five near-resonant entries: H2 dc Kerr \
gamma_par at 0.02 (-929.1 here, -929.0 there), D2 dc Kerr gamma_par at 0.01 (316.5, \
316.6) and 0.02 (-43.4, -43.3), D2 ESHG gamma_par at 0.01 (206.0, 206.1), D2 THG at \
0.01 (-153.7, -153.6); bishop_1991's 13 190 A row has no counterpart here. \
bishop_1990's Table X rows from 'Bishop, Pipin and Rerat 1990' (854.5 total static, \
and the 4880 A dc Kerr and ESHG values), shelton_1990, sekino_1993, tammer_1990 cite this \
paper by citation. tammer_1992's 'ref 5' gamma^K = 4.45 x 10^-62 C^4 m^4 J^-3 at 632.8 nm \
is this paper's Table X 714 au x 6.23538e-65 = 4.452e-62 (checked; re-pointed there).

NOT EXTRACTED: Table I (the molecular-frame gamma components at R = 1.4 a0 before \
averaging; its ESHG and THG blocks print a column 'gamma_xzzz' that the text calls \
gamma_xxzz); Table VIII, R = gamma_par^ESHG/gamma_perp^ESHG (total), theory (estimated \
error +-0.04) H2 2.880, 2.908, 2.901, 2.893, 2.869, 2.857 and D2 2.934, 2.925, 2.915, \
2.905, 2.878, 2.865 at 10 640-4880 A, against Mizrahi and Shelton's and Shelton and Lu's \
H2 2.891(7), 2.890(4), 2.867(2), 2.858(3) and D2 2.909(6), 2.881(3), 2.872(4) (the ratio \
of two components of one gas: no quantity); Tables XII-XIII, the field-gradient \
polarizabilities B_par, C_par (and the R = 1.4 a0 components) of H2 and D2 at 295 K (no \
quantity); Table XIV, the static R = 1.4 a0 components against Berns and Wormer, \
Diercksen and Sadlej, Maroulis and Bishop, Augspurger and Dykstra (alpha_zz 6.3875, \
alpha_xx 4.5786 a.u., gamma_zzzz 682.5, gamma_xxxx 558.4, gamma_xxzz 211.9). Vibrational \
averaging raises gamma_par(elec) and gamma_perp(elec) by about 11 % (p. 1908)."""


