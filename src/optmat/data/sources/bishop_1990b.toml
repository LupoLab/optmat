coefficients = { A = "6.504", A_prime = "30.47", B = "5.753", B_prime = "24.82", gamma_par_0 = "670.77", gamma_perp_0 = "223.59" }
check = "Reproduces Table II's elec columns at w = 0.01, 0.02, 0.03 a.u. to within 0.05 a.u. (e.g. gamma_par 674.27 against 674.3 at 0.02). Checked 2026-09-27."
notes = "Bishop's naming: A, A' for gamma_par, B, B' for gamma_perp (Shelton's A = Bishop's A / 219474.63^2 cm^2, B = A' / 219474.63^4 cm^4, for w_L in cm^-1). 'A is indeed constant for all processes', and B meets the ratios 1 : (1 + k/3) : (1 + k/6) for Kerr : ESHG : THG with k/6 = 0.13, or 1 : (4 + delta)/3 : (7 + delta)/6 with delta = -0.22 (p. 1905). Superseded by bishop_1991's electronic values."

