[[formulas]]
id = "table11_H2_kerr"
material = "H2"
equation = "Eqs. (27)-(28), p. 1905, with Table XI (tbl_630e3b7a8ddd), H2 Kerr"
printed = "gamma_par^w/gamma_par^0 = 1 + A w_L^2 + A' w_L^4; gamma_perp^w/gamma_perp^0 = 1 + B w_L^2 + B' w_L^4; H2 (note a: gamma_par^0 = 670.77 a.u., gamma_perp^0 = 223.59 a.u.), Kerr: A 6.504, A' 30.47, B 5.753, B' 24.82"
variable = "w_L^2 = w_s^2 + w1^2 + w2^2 + w3^2 in atomic units (hartree^2) (Eq. 26): here 2 w^2, w the laser photon energy in hartree. Electronic part only (295 K average), convention T; process dc_kerr."
