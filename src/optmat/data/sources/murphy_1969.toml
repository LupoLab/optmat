citation = "W. F. Murphy, W. Holzer and H. J. Bernstein, \"Gas phase Raman intensities: a review of 'pre-laser' data\", Appl. Spectrosc. 23, 211 (1969)"
doi = "10.1366/000370269774380824"
library = "Murphy_1969_GasPhaseRaman"
identity = "VALIDATED_WITH_WARNINGS"
kind = "compilation"
technique = """A review of the gas-phase vibrational Raman intensities measured with mercury-arc \
excitation (4358 A) and photoelectric detection before the laser (pp. 211-217): six \
low-pressure water-cooled Hg arcs around a multiple-reflection cell of about 10 litres, \
the incident light polarized perpendicular to the cell axis by a Polaroid sheet (Fig. 1, \
p. 211). The band intensities were measured relative to the A1 (2914 cm-1) band of \
methane, the standard; its 'absolute intensity' came from the ratio to the Rayleigh line \
or to the H2 rotational line J = 3 <- 1, whose cross sections are calculable (p. 216). \
The authors reduce every datum of the cited papers to one definition (the scattering \
activity, the depolarization ratio for natural light, the derivatives of the mean \
polarizability), recomputing from the original data the entries they bracket."""
notes = """Journal pages 211-218 = PDF pages 1-8 (page n of the PDF is p. 210 + n). \
Identity checked against the first page (title, authors, Appl. Spectrosc. 23, 211).

WHAT IS TAKEN. Table I, whose first part (tbl_ca70dea8e569, p. 212) holds every curated \
molecule: H2, D2, O2, N2, CO, CO2, CH4 and SF6, per band: the band position nu_j \
(raman_shift), I_j/I_1 (raman_cross_section_ratio, relative to methane's A1 band at \
4358 A), rho_nj (depolarization_ratio, natural light), the scattering activity \
g_j(45 a_j'^2 + 7 g_j'^2) (raman_scattering_activity), dalpha/dQ_j and dalpha/dr \
(polarizability_derivative, component mean; parameters.coordinate says which). The \
library cells merge the sub-lines of each row and lose some: the in-scope lines are \
transcribed from the table image in the script, which checks them against the cells \
(a structural fix; see tools/extract/murphy_1969.py). N2O is not in the table. The four \
continuation parts (tbl_30a71dee5856 p. 213, tbl_e29dfa66b07c p. 214, tbl_d8cdb7b2c9ab \
p. 215, tbl_92207413a7ff p. 216, in that page order) hold only molecules outside the \
scope and are not extracted: HCl, HBr, CS2, H2S, NH3, CD4, CF4, CCl4, SiF4, SeF6, TeF6 \
(first part), halomethanes (CH3Cl, CH3Br, CHF3, CHCl3, CF3Cl, CF3Br, CFCl3, CH2F2, \
CF2Cl2, CHF2Cl, CHFCl2, CHF2Br), CH3OH, CH3CN, C2H2, C2H4, C2H6, C2F6, CH3CH2Cl, \
CH3CH2Br, CH3CHF2, CH3CF2Cl, CF3CF2Cl, propane, n-butane, n-pentane, neopentane, \
n-hexane, cyclohexane, C6H6, 1,3-butadiene, vinyl acetylene, acetonitrile, t-butanol, \
C4F8.

ALL VALUES ARE REPRODUCTIONS. Every Table I entry comes from a cited paper (the Ref. \
column; none is in the library): unbracketed entries as the paper gave them, bracketed \
ones 'calculated from original literature data' by these authors, with data taken \
with unpolarized light 'transformed ... to values which conform to our definitions' \
(p. 217). The datasets are use = "reproduced" with the cited papers; the brackets are \
kept in each file's printed column, with the reference of the line. The row label \
names the reference; 'Q branch' marks an entry printed with Q ('Q branch only'), \
'band' the whole band. Key to the table (p. 212): [ ] calculated from original \
literature data; p photographic detection; n original data obtained with unpolarized \
incident light; Q Q branch only; alpha isotropic part only; gamma anisotropic part \
only; Gamma: see the reference for (dgamma/dQ_j)^2. Every in-scope reference carries \
the mark n.

NOT TRANSCRIBED. rho printed '6/7' (methane's 1306, 1535 and 3017 cm-1 bands): the \
theoretical value for a depolarized band, not a number measured. Methane's 1306 cm-1 \
I_j/I_1 '[<0.006]' (ref. 16): an upper limit. The 'Gamma' entries of methane's \
depolarized bands: a pointer to the references. Methane's A1 I_j/I_1 = 1: the \
standard, by definition.

UNITS. N in the column factors 'N x 10^-32' (activity, cm^4 g^-1) and 'N^(1/2) x \
10^-16' (dalpha/dQ, cm^2 g^-1/2), printed once in the H2 row, is Avogadro's number: \
the paper's own methane cross section (below) is reproduced only so. A printed \
activity is therefore exactly in angstrom^4/amu, a printed dalpha/dQ in \
angstrom^2/amu^(1/2); dalpha/dr is in cm^2 with the factor 1e-16 (so 1.75 is 1.75e-20 \
m^2). The polarizability is the volume polarizability (cm^3). The dalpha/dQ header \
exponent is printed -1/2 (image); the library cells read the N exponent as 1/4, the \
image shows 1/2. The p. 214 continuation's header prints the unit as cm^3 g^-1 (not \
used).

EXCITATION AND STANDARD. 4358 A (the Hg line, an air wavelength; p. 217), recorded as \
the abscissa (standard air). The reference band is methane's A1 band at 2914 cm-1, 'chosen \
as a standard for experimental convenience' (p. 217). 'For the A1 band of the \
reference substance methane, we have selected the value 205 x N x 10^-32 cm^4 g^-1 \
(+-5%) for the scattering activity. The differential cross section for this band as \
calculated by Eq. (2) for 4358-A irradiation is then (dsigma_1/dOmega)_4358 = 6.58 x \
10^-30 cm^2 (+-5%)' (p. 217): the inline datasets activity_CH4_nu1_selected and \
cross_section_CH4_nu1, the paper's own choice (use = "check"). Eq. (2), p. 216: \
dsigma_j/dOmega = [(2 pi)^4/45] {b_j^2 (nu_0 - nu_j)^4 / [1 - exp(-h nu_j c/kT)]} g_j(45 \
a_j'^2 + 7 g_j'^2), for observation perpendicular to the polarization of linearly \
polarized incident light, b_j = (h/8 pi^2 nu_j c)^(1/2) the zero-point amplitude \
(the page image shows the exponent 1/2; the library's text reads 3/2), nu in cm^-1. Checked 2026-09-26: with 205 angstrom^4/amu, nu_0 = 22938 \
cm^-1, nu_1 = 2914 cm^-1 and T = 295 K, Eq. (2) gives 6.60e-30 cm^2 against the \
printed 6.58e-30 (0.4 %; the Boltzmann factor is 1 to 1e-6). Eq. (2) with the \
tabulated activities also reproduces the I_j/I_1 column to within a few per cent \
(N2 24.5 -> 0.168, printed [0.17]; O2 19.7 -> 0.234, [0.24]; H2 147 -> 0.389, [0.40]; \
D2 73 -> 0.343, [0.35]; SF6 22.7 -> 0.639, 0.65; CH4 3017 cm-1 140 -> 0.646, [0.68]; \
CH4 1535 cm-1 9.1 -> 0.110, [0.115]), but for CO only to 8 % (23.1 -> 0.178 against \
[0.165]).

Eq. (7), p. 217, converts to another excitation wavenumber nu: dsigma_j/dOmega = \
(I_j/I_1)_4358 x (dsigma_1/dOmega)_4358 x ((nu - nu_j)/(22938 - nu_j)). The last \
factor is printed without an exponent (page image checked at 300 dpi); Eq. (2) makes it \
the fourth power. 22938 cm^-1 is the vacuum wavenumber of the 4358 A line.

THE DERIVATIVES (for review; solprop's N2, O2, CH4 and SF6 dalpha/dq come from \
here). a_j' = dalpha/dQ_j follows from the activity and rho (Eq. 3): with S = g(45 a'^2 \
+ 7 g'^2) and rho = 6 g'^2/(45 a'^2 + 7 g'^2), a' = [(S/g)(1 - 7 rho/6)/45]^(1/2). \
Checked 2026-09-26: N2 (S = 24.5, rho = 0.18) 0.656 (printed [0.66]); O2 (19.7, 0.33) \
0.519 ([0.52]); H2 (147, 0.070) 1.732 ([1.73]); D2 (73, 0.073) 1.218 ([1.22]); SF6 \
(22.7, 0) 0.710 ([0.71]); CH4 A1 (207, 0) 2.145 (2.15), (200, 0) 2.108 (2.10). The bond \
derivative, Eq. (4), p. 217, for a diatomic AB: 'dalpha/dQ = mu^(-1/2) dalpha_AB/dr_AB, \
where alpha_AB is the bond polarizability, r_AB is the internuclear distance, and mu is \
the reduced mass'; Eq. (5) 'for molecules of the type AB_n with n equivalent AB bonds: \
dalpha/dQ = (n/m_B)^(1/2) dalpha_AB/dr_AB, where m_B is the mass of the B atom'. \
Checked with mu in amu (2026-09-26): N2 1.75/7.0015^(1/2) = 0.661 ([0.66]); O2 \
1.46/7.9975^(1/2) = 0.516 ([0.52]); H2 1.23/0.504^(1/2) = 1.733 ([1.73]); D2 \
1.22/1.007^(1/2) = 1.216 ([1.22]); CO 1.50/6.856^(1/2) = 0.573 against the printed \
[0.58] (0.58 gives 1.52: a rounding or an input difference, not resolved); CH4 (n = 4, \
m_H = 1.008) 1.04 -> 2.07 (printed 2.08), 1.03 -> 2.05 (2.06), 1.08 -> 2.15 (2.15), \
but ref. 19's 1.08 against its 2.10 (2.10 gives 1.05); SF6 (n = 6, m_F = 18.998) \
Long and Thomas's 1.23 -> 0.691 against the bracketed [0.71] recomputed from the \
activity (0.71 gives 1.26): the 1.23 is the cited paper's own value, not Eq. (5) of \
this table's a'. solprop's values are these dalpha/dr in SI: N2 1.75e-20 m^2 = [1.75], \
O2 1.46e-20 = [1.46], CH4 1.04e-20 = ref. 17's 1.04 (Yoshino and Bernstein 1959; the \
other three references give 1.03, 1.08, 1.08), SF6 1.23e-20 = ref. 20's 1.23 (Long \
and Thomas 1963), all mean-polarizability derivatives per bond.

TABLE II (tbl_096099949b81, p. 217; notes only, no quantity fits a bond anisotropy): \
'Bond polarizability anisotropies, (alpha_par - alpha_perp)_CX, derived from scattering \
activity for the nu2 band of tetrahedral CX4 molecules', from Eq. (6), gamma_j'^2 = 8 \
gamma_AB/(m_B r_AB^2) as printed. CH4: nu2 1535 cm-1, gamma'^2 = 0.65 x N x 10^-32 \
cm^4 g^-1, (alpha_par - alpha_perp)_CH = 0.31 x 10^-14 cm^3 'from Eq. (6)' against \
0.21 x 10^-24 cm^3 'Literature' (Denbigh 1940, ref. 14). The 10^-14 is a misprint for \
10^-24 (the column's unit is cm^3; the image was checked) and Eq. (6) needs gamma_AB \
squared: gamma_AB = [gamma'^2 m_H r^2/8]^(1/2) with r_CH = 1.09 A gives 3.1e-25 cm^3, the \
printed 0.31 (checked 2026-09-26). CF4 (435 cm-1; 0.075; 0.56; ...) and CCl4 (221 cm-1; \
0.26; 1.89; 1.59) are out of scope.

UNCERTAINTY. 'Data for strong sharp bands are accurate to about +-5%-10%, while data for \
weak and broad bands are less accurate' (abstract, p. 211); 'For strong and narrow \
bands, it is estimated that the error in the scattering activity is less than 10%. The \
error in rho_nj is somewhat greater, due to the convergence errors' (p. 217); 'even the \
best available data are accurate only to about +-10%' (p. 218). The activities of the \
diatomics, SF6 and methane's A1 band carry 10 % as a bound; the weak and broad bands \
(CO2, methane's 1535 and 3017 cm-1) none. The temperature is not stated (room \
temperature).

ISOTOPOLOGUES. The molecules are the natural gases; nothing is said of isotopic \
composition. H2 and D2 are normal hydrogen and deuterium (no ortho:para statement). \
CD4 is out of scope."""

[[datasets]]
id = "activity_CH4_nu1_selected"
material = "CH4"
table = "text"
points = [["selected", "selected", "205"]]
quantity = "raman_scattering_activity"
unit = "angstrom4/amu"
abscissa = "label"
use = "check"
notes = "p. 217: 'For the A1 band of the reference substance methane, we have selected the value 205 x N x 10^-32 cm^4 g^-1 (+-5%) for the scattering activity' (N Avogadro's number: angstrom^4/amu). The paper's own choice between Table I's 207 (ref. 8) and 200 (ref. 19); the standard of every I_j/I_1."
[datasets.uncertainty]
relative = 0.05
level = "not stated"
[datasets.parameters]
mode = "nu1, the A1 C-H stretch at 2914 cm-1"

[[datasets]]
id = "cross_section_CH4_nu1"
material = "CH4"
table = "text"
points = [["4358", "4358", "6.58"]]
quantity = "raman_cross_section"
unit = "cm2/sr"
scale = 1e-30
abscissa_unit = "angstrom"
wavelength_medium = "standard_air"
use = "check"
notes = "p. 217: '(dsigma_1/dOmega)_4358 = 6.58 x 10^-30 cm^2 (+-5%)', calculated by Eq. (2) from the selected activity 205 (activity_CH4_nu1_selected), for observation perpendicular to the polarization of linearly polarized incident light. Printed in cm^2: a differential cross section, per steradian. Reproduced from Eq. (2) to 0.4 % (6.60e-30 at 295 K; the record's notes)."
[datasets.uncertainty]
relative = 0.05
level = "not stated"
[datasets.parameters]
transition = "nu1 (A1) band at 2914 cm-1, whole band"
geometry = "observed perpendicular to the polarization of linearly polarized incident light"

[[datasets]]
id = "shift_H2"
material = "H2"
file = "H2/murphy_1969__shift_H2.csv"
table = "tbl_ca70dea8e569"
quantity = "raman_shift"
unit = "cm-1"
abscissa = "label"
use = "reproduced"
reproduced_from = ["T. Yoshino and H. J. Bernstein, J. Mol. Spectry. 2, 213 (1958)", "D. M. Golden and B. Crawford, J. Chem. Phys. 36, 1554 (1962)"]
notes = "Table I (p. 212), nu_j. The band position as compiled from the cited paper(s), to 1 cm-1 (a band centre, not a line position). v=0-1 stretch (fundamental)."
[datasets.parameters]
transition = "v=0-1 stretch (fundamental): band position of the Raman band (as tabulated, to 1 cm-1)"

[[datasets]]
id = "ratio_H2"
material = "H2"
file = "H2/murphy_1969__ratio_H2.csv"
table = "tbl_ca70dea8e569"
quantity = "raman_cross_section_ratio"
unit = "1"
abscissa_unit = "angstrom"
wavelength_medium = "standard_air"
use = "reproduced"
reproduced_from = ["T. Yoshino and H. J. Bernstein, J. Mol. Spectry. 2, 213 (1958)"]
notes = "Table I, I_j/I_1: the integrated radiant intensity of the band relative to that of the A1 (2914 cm-1) band of methane at 4358 A, equal to the ratio of the differential cross sections of Eq. (2) (p. 217); rows by reference; 'Q branch' marks a value printed with Q (the Q branch only), 'band' the whole band. Values in brackets (kept in `printed`) were 'calculated from original literature data' by these authors; the others are the cited paper's (p. 217). Eq. (7) converts to another excitation frequency (see the record's notes on its printed exponent)."
[datasets.parameters]
transition = "v=0-1 stretch (fundamental) (per row: Q branch only, or the whole band)"
reference_material = "CH4"
reference_transition = "nu1 (A1) band at 2914 cm-1, whole band"
geometry = "integrated radiant intensity of the band at 4358 A, observed perpendicular to the polarization of linearly polarized incident light (Eqs. 1-2), multiple-pass cell"

[[datasets]]
id = "rho_H2"
material = "H2"
file = "H2/murphy_1969__rho_H2.csv"
table = "tbl_ca70dea8e569"
quantity = "depolarization_ratio"
