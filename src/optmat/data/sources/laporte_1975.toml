citation = "P. Laporte, N. Damany and H. Damany, \"High-density resonant shift of atomic lines of krypton and xenon in the wavelength range 118-150 nm\", Phys. Rev. A 12, 1944 (1975)"
doi = "10.1103/physreva.12.1944"
library = "Laporte_1975_HighDensityResonant"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Photographic absorption spectroscopy of pure Kr and Xe at 1-80 amagat and room \
temperature (Meudon): a variable-length cell with MgF2 windows (a convex plane of 0.25, \
1.0 or 4.0 m radius against a flat, so that the path is extremely short), optically \
conjugate with the film; the Baloffet-Romand-Vodar vacuum-spark continuum; a 1 m \
normal-incidence spectrograph, 2000 grooves/mm, 0.5 nm/mm; calibration lines from a \
low-pressure discharge. Gas: Air Liquide N35 (impurities below 0.05 %), up to 100 bar \
(Kr, 110 amagat) and 70 bar (Xe, 260 amagat); densities from Trappeniers et al.'s Kr \
isotherms and Beattie et al.'s Xe equation of state. The wavelength of the absorption \
maximum (transmission minimum) of each atomic line is read from microphotometer \
records."""
notes = """Journal pages 1944-1948 = PDF pages 1-5; the PDF is a scan. Identity checked \
against the first page.

WHAT IS MEASURED (pp. 1-3, Figs. 2-6): the red shift of the absorption maximum of the \
Kr 123.58 nm line (to 80 amagat) and of the Xe 146.96 nm (to 50 amagat), 129.56 nm (to \
35), 125.02 and 119.20 nm (to 25) lines, limited by the growth of the Kr2 and Xe2 \
molecular bands. The Kr 116.49 nm and Xe 117.04 nm lines were not studied (window and \
spectral limits). The amagat here is the real gas's density at 0 degrees C and 1 atm: \
1 amagat = 4.4927e-5 mol/cm^3 = 27.067e18 atoms/cm^3 for Xe, 4.4738e-5 mol/cm^3 = \
26.953e18 for Kr (footnote 1a, p. 5). Accuracy (p. 3): +-0.01 nm at low density \
(spectrograph), up to +-0.02 nm as the line broadens (the error bars of Figs. 2-6); \
selective reflection at the window can only lower the measured shift, by at most \
0.007 nm (the 146.96 nm line at 15 amagat).

NOT TRANSCRIBED: the shifts are given only in Figs. 2-6 (images), and the package has \
no quantity for the density shift of an absorption line (raman_line_shift is for \
Raman lines). Read by eye, not as data: Kr 123.58 nm about 0.13 nm at 80 amagat; Xe \
146.96 nm about 0.05 nm at 20 amagat and 0.12 nm at 41; each rising slightly faster \
than linearly. Fig. 1 (a Xe spectrum at 7 bar, 19 degrees C) is qualitative.

THE LORENTZ SHIFT (pp. 4-5). Eq. (1): omega_0'^2 = omega_0^2 - N f q_e^2/(3 m eps0); \
with the other resonances' index n_0 = n'(omega_0), Eq. (2) multiplies the term by \
(n_0^2 + 2)/3, and Eq. (3): Delta lambda = [lambda_0^3/(8 pi^2 c^2)] [N f q_e^2/(3 m \
eps0)] (n_0^2 + 2)/3 = 1.494e-16 lambda_0^3 N f (n_0^2 + 2)/3 (SI; the constant in m). \
Checked: q_e^2/(24 pi^2 m_e eps0 c^2) = 1.4950e-16 m (CODATA), the printed 1.494e-16 \
to 0.06 % (truncated). With the package's f (fit/Xe 0.2678, fit/Kr 0.2050) and n_0 from \
the fits' other terms, Eq. (3) gives 0.0034 nm per amagat for Xe 146.96 nm (0.070 nm \
at 20 amagat, 0.142 at 40) and 0.0016 nm per amagat for Kr 123.58 nm (0.131 nm at 80). \
Eq. (2) is exactly the displacement of the pole of the Lorentz-Lorenz \
susceptibility chi = 3y/(1 - y), y = N alpha/(3 eps0), of a line f/(omega_0^2 - omega^2) \
on a background y_0 = (n_0^2 - 1)/(n_0^2 + 2): the density-dependent index the package \
computes (Lorentz-Lorenz on the per-atom polarizability) carries this shift already \
(TC-714). The paper evaluates n_0 from Chashchina and Shreider's \
dispersion formula with Lorentz-Lorenz ('weak in our density range', Fig. 2) and \
notes (p. 4) that the equations give the shift of n kappa, whereas the observed \
absorption maximum (kappa_max) shifts equally only at low density and less at high \
density, by an amount that depends on the (undetermined) damping. The calculated \
curves use f values from Table I; apart from the Xe 125.02 nm line (f an order of \
magnitude smaller, observed shift much larger than calculated) they 'take into \
account the observed shifts' (p. 4).

DATASETS: Table I, the oscillator strengths of the five lines from 14 references \
(Refs. 32-45), all reproduced, none of whose originals is in the library: \
experimental_Kr, experimental_Xe, theoretical_Kr, theoretical_Xe. Rows name the \
reference (ref32 ... ref45; ref39_40 for 'Refs. 39 and 40'; a and b for the two values \
of Refs. 43 and 45 joined by a brace, which the paper does not explain) and, for xenon, \
the line. The column header prints 119.22 nm for the line the text calls 119.20 nm \
(the header is used as printed). No uncertainties are given. Gerardo & Johnson 1974 \
(gerardo_1974) attribute Kr 0.204 (123.6 nm) to Lewis 1967, where this table has \
Vaughan 1968 (Ref. 37)."""

