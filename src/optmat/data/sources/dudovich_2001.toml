citation = "N. Dudovich, B. Dayan, S. M. Gallagher Faeder and Y. Silberberg, \"Transform-limited pulses are not optimal for resonant multiphoton transitions\", Phys. Rev. Lett. 86, 47 (2001)"
doi = "10.1103/PhysRevLett.86.47"
