citation = "T. Lundeen, S.-Y. Hou and J. W. Nibler, J. Chem. Phys. 79, 6301 (1983)"
doi = "10.1063/1.445736"
library = "Lundeen_1983_NonresonantThirdOrder"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Broadband CARS (four-wave mixing): doubled Nd:YAG omega_1 at 532 nm (0.1 cm^-1, \
up to ten modes) and a broadband dye omega_2 centred on the H2 Q1 line at 683 nm (100 \
cm^-1 wide, 3 mJ), collinear, focused (100 or 300 mm) into a cell; nonresonant signals \
of each gas ratioed to 30 Torr N2 from the low-pressure (quadratic) regime; the absolute \
scale from the ratio chi_nr(N2)/chi_r0(H2 Q1) at 7000 Torr H2, 20 C, with chi_r0 \
computed from Raman cross sections and Owyoung's linewidths."""
notes = """Nonresonant ('electronic') third-order susceptibilities of gases from CARS at \
532 + 683 nm (omega_1 - omega_2 = 4155 cm^-1), with a compilation of other FWM, dcSHG, \
Kerr and THG values (Table I) and of hydrocarbons and halocarbons (Table II, of which \
only CH4 is curated and repeats Table I). NO, CS2, H2O, H2S, NH3 and SiF4 are not \
curated species (skipped).

Definition (p. 6301): 'Our definition of chi is based on the convention of Ward and \
co-workers', Eq. (1): P(w3) = K chi(-w3; w1, w1, -w2) E1^2 E2*, K = 3/4 for CARS, 1/4 \
for THG, 3/2 for dcSHG, 3 for the Kerr effect, so that all 'approach the same static \
limit': chi = gamma_T/6 per molecule, in cm^6/(erg molecule) (= esu per molecule; 'to \
convert to a volume susceptibility multiply by molecules/cm^3. To convert to SI units of \
C^4 m^4/J^3 multiply by 10^9/c^4 (c in m/s)', Table I note a). The compiled dcSHG, Kerr \
and THG values are in the same convention (identical to ward_1969, ward_1979 and \
Buckingham and Dunmur's gamma/6).

Reference standard (pp. 6301-6303): the resonant susceptibility of the H2 Q1 line, \
Eq. (2) chi_r = alpha_par^2 / 3 hbar (delta - i gamma) [printed '3 h'], Eq. (3) alpha_par^2 \
= (c/w2)^4 (d sigma/d Omega)/(1 + rho_l), with Schrotter's N2 Q-branch standard \
(schrotter_1979: 5.05e-48 cm^6/sr / (2 pi)^4 = 3.240e-51) \
alpha^2 = (3.24 +- 0.06) x 10^-51 cm^6/sr (Eq. (4)), H2/N2 ratio S_j = mean of 3.45 and \
3.64 (515, 488 nm) with 10 % uncertainty, Q1 fraction 0.664 at 20 C, rho_l = 0.036: \
alpha_par^2 = (7.36 +- 0.75) x 10^-51 cm^6/sr; Owyoung's linewidth Delta nu = A/rho + B \
rho (A = 301.6 +- 8.7 MHz amagat, B = 51.3 +- 0.6 MHz/amagat): at 7000 Torr, 20 C (8.53 \
amagat) 473.1 +- 6.1 MHz and |chi_r0| = (1.57 +- 0.16) x 10^-33 cm^6/(erg molecule); for \
Rado's 17.0 atm (15.68 amagat) 823.8 MHz and (0.899 +- 0.093) x 10^-33. Measured \
chi_nr(N2)/chi_r0(H2) = (6.88 +- 0.46) x 10^-5 (seven sets of 1000 shots), and (6.26 +- \
0.6) x 10^-5 from Rado's data scaled by the linewidths; their average gives chi(N2) = \
(102.9 +- 14) x 10^-39 at omega_1 - omega_2 = 4155 cm^-1 (p. 6303). Subtracting the \
calculated N2 vibrational Q-branch (-2.9) and rotational (+0.8) contributions gives the \
electronic (105 +- 14) x 10^-39, the reference of the whole FWM column c and, through \
N2, of columns d and e. Every FWM value is therefore scaled to a Raman-cross-section \
standard, uncertain by about 13 %; field-induced-absorption values of alpha_par^2 (7.8 to \
11.7, mean 9.6 x 10^-51) would raise all FWM entries by 30 % (p. 6305; 'the relative FWM \
values compiled here are easily rescaled'). (Shelton and Rice 1994 rescale Lundeen's \
values.)

Part (Table I note b): the rotational and vibrational Raman contributions at the \
experiment's omega_1 - omega_2 (columns 1-2, calculated from Raman and polarizability \
data) 'have been subtracted from the measured FWM values to obtain the electronic \
susceptibilities listed' (all FWM columns, and Table II): the FWM values are recorded \
electronic, the columns 1-2 as vibrational and rotational (use check). Nanosecond \
pulses; the subtraction is of the Raman-resonant terms at 4155 cm^-1 detuning, the 'subtraction of computed gamma^vR'. Doubt: the text gives N2's rotational \
contribution as 0.8 x 10^-39 but Table I prints 3 (image checked).

Uncertainties: column c 'relative uncertainties estimated at less than 5 % (15 % for \
He)' (note c), plus the 13 % of the N2 scale; helium in the text (p. 6304) 3.2 +- 0.7 \
('reflects that for chi_nr of N2 and also that of the chi_nr(He)/chi_nr(N2) \
measurement'). Rado's column: 'reproducibility of 10 % is cited' (note d); Hauchecorne \
et al.: 'original data given to only one or two significant figures' (note e). dcSHG and \
THG +-: relative (notes f, h); Kerr +-: absolute (note g).

The paper expects chi_Kerr < chi_dcSHG ~ chi_FWM(694) <~ chi_FWM(532) < chi_THG for Ar and \
Kr (p. 6304), doubts Buckingham et al.'s CO2 Kerr value and Rado's D2 (H2 impurity), and \
estimates He's FWM theory at about the dcSHG value 3.8 (DeMartini et al.'s FWM He is \
about seven times it)."""


