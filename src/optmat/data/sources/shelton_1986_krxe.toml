citation = "D. P. Shelton, J. Chem. Phys. 84, 404 (1986)"
doi = "10.1063/1.450152"
library = "Shelton_1986_HyperpolarizabilityDispersionMeasured_5d296f"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Gas-phase electric-field-induced second-harmonic generation (ESHG) with \
periodic phase matching (electrode spacing 2.69 mm, phase-match pressures 0.4-6 atm), \
cw dye or argon-ion laser at 650.0, 590.0, 514.5 and 488.0 nm; Kr and Xe measured \
against Ar; densities from pressure and temperature by the virial equation of state \
(Dymond and Smith); refractive indices at phase match from tables (Bogaard and Orr; \
Leonard 1974) (p. 405)."""
notes = """No datasets: the paper reports only hyperpolarizability data, the ratios \
gamma_Kr/gamma_Ar and gamma_Xe/gamma_Ar (Table I, 'accuracy of the ratios is about \
+-0.3 %', p. 405), the absolute gamma_Kr, gamma_Xe calibrated on gamma_Ar/gamma_He \
(Eq. (7), from Mizrahi and Shelton 1985) and Sitz and Yaris's gamma_He (Eq. (8)), and \
other processes' gamma values (Table II). The phase-match densities, which carry the \
linear dispersion, are neither tabulated nor quoted, and no density ratio or coherence \
length is given. The refractive indices used (from Leonard 1974 = leonard_1974, and \
Bogaard and Orr) only enter a small local-field correction.

Not extracted (third-order susceptibility, for later): Table I, gamma_Kr/gamma_Ar = \
2.359(6), 2.402(11), 2.477(7), 2.502(7) and gamma_Xe/gamma_Ar = 6.761(26), 7.128(21), \
7.704(29), 7.958(30) at 650.0, 590.0, 514.5, 488.0 nm; the fits gamma = A[1 + B nu^2], Kr A = \
1.397e-61 C^4 m^4 J^-3, B = 18.93e-10 cm^2; Xe A = 2.999e-61, B = 39.44e-10 cm^2 (Figs. 1, \
2 captions).

THIRD-ORDER DATA (added 2026-09-26; supersedes "No datasets" and "Not \
extracted" above). Theory (pp. 404-405): the single-resonance model gamma_zzzz(-omega_s; \
omega_1, omega_2, omega_3) = hbar^-3 K(-omega_s; omega_1, omega_2, omega_3) {S_1 P_1 - \
S_2 P_2} (Eq. 2), K the process factor, giving gamma(-omega_s; ...) = gamma(0; 0, 0, 0) \
[1 + C (omega_L/omega_0)^2 + ...] (Eq. 5) with omega_L^2 = omega_s^2 + omega_1^2 + \
omega_2^2 + omega_3^2 (Eq. 4): relative dispersion dc Kerr : ESHG : THG = 1 : 3 : 6 (p. \
407; Sitz & Yaris's He gives 1 : 3.1 : 6.1). gamma is the zzzz ESHG gamma of Shelton's \
series (Taylor convention, SI C^4 m^4 J^-3), on the old He calibration (Sitz & Yaris; \
Eq. 8 converts with 1 au = 6.2353e-65 C^4 m^4 J^-3, against 6.2360e-65 in \
shelton_1986_co2). Parts: atoms, electronic. 'The dispersion of gamma is large, \
yielding an optical hyperpolarizability about twice as large as the static value' \
(p. 406). Datasets: Table I ratios (check) and absolute gammas (primary), Table II other \
processes (reproduced), and Lehmeier's THG values from the note added in proof. The \
fits (formulas) are against nu^2 of the fundamental, not nu_L^2."""

