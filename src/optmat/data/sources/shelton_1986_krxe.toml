range = "488.0-650.0 nm (Table I)"
coefficients = { A = "1.397e-61", B = "18.93e-10" }
coefficient_units = { A = "C^4 m^4 J^-3", B = "cm^2" }
calibration = "old He (Sitz & Yaris) via Ar (Eqs. 7, 8)"
