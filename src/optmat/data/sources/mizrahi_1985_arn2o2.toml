[[errata]]
dataset = "ratio_Ar_over_He"
row = "600.0"
column = "value"
printed = "20.99"
corrected = "30.99"
reason = "A dropped first digit: the Ar ratios rise smoothly from 29.6 to 34.4 over the table, and 20.99 sits between 30.88 (610.0 nm) and 31.25 (590.0 nm)."
evidence = "Table image checked: it prints 20.99(16). The paper's own fit (Table II: 25.85 [1 + 7.11e-10 x 16662^2]) gives 30.95 at this line; shelton_1990 Table III(a) lists Ar at 600.0 nm as 90.05e-63 C^4 m^4 J^-3, which is 30.99 times Sitz & Yaris's gamma_He there (42.6 au x 1.0816 x 6.2353e-65 = 2.873e-63 C^4 m^4 J^-3; 30.99 x 2.873e-63 = 89.0e-63) scaled by the same 1.011 rescaling that shelton_1990 applies at the other lines (632.8 nm: 30.21 -> 87.09e-63), whereas 20.99 would give 60.3e-63. Checked 2026-09-26."

