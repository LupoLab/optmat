id = "table1_one_state_Ar"
material = "Ar"
file = "Ar/vanderhart_2007__table1_one_state_Ar.csv"
table = "tbl_2c7127524ab5"
quantity = "ionization_rate"
unit = "s-1"
abscissa = "intensity"
abscissa_unit = "W/cm2"
use = "check"
notes = "Table I, 'One-target': the cycle-averaged ionisation rate of Ar at 390 nm with the 3s2 3p5 2P target state of Ar+, s-1, against the intensity (printed in 1e14 W/cm2). 0.75e14 W/cm2 is on the 3s2 3p5 3d 1P/1F resonance. Agreement with R-matrix Floquet 'typically well within 10%' (p. 3)."
[datasets.parameters]
wavelength_nm = 390
polarization = "linear"
method = "time-dependent R-matrix, one Ar+ target state"

