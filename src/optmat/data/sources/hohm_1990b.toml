citation = "U. Hohm and K. Kerl, \"Interferometric measurements of the dipole polarizability alpha of molecules between 300 K and 1100 K. II. A new method for measuring the dispersion of the polarizability and its application to Ar, H2, and O2\", Mol. Phys. 69, 819 (1990)"
doi = "10.1080/00268979000100621"
library = "Hohm_1990_InterferometricMeasurementsDipole_d234f3"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """The Michelson twin interferometer of Part I (hohm_1990; sample cell of length \
L = l/2 about 0.5 m, quartz glass, 300-1100 K) illuminated simultaneously by four He-Ne \
lasers of vacuum wavelengths 632.99, 611.97, 594.11 and 543.51 nm. The cell is filled \
to p_max < 2.5e5 Pa, thermostated 5-10 min and evacuated in 5-15 min while a \
monochromatic (632.99 nm) and a polychromatic interferogram are recorded (about 20 000 \
points each). The 632.99 nm absolute measurement gives alpha(lambda_1) and the density \
of every point (Eq. 17); the Fourier transform of the polychromatic interferogram \
against density (Eqs. 12-15) has four peaks whose positions give alpha(lambda_k) (Eq. \
16). Three to five dispersion measurements per temperature, averaged per wavelength \
(pp. 820-824)."""
notes = """Part II of Hohm and Kerl. Part I (Mol. Phys. 69, 803, the monochromatic \
632.99 nm measurements of the noble gases, H2, N2, O2 and CH4) is hohm_1990; this is the \
dispersion paper that kerl_1992 cites as 'Mol. Phys. 69, 819' (its note b) and hohm_1991 \
as its ref. [4]. Identity: the first page and the running heads print Molecular Physics \
1990, 69:819-831 (the library's 'PDF date hint 2016' is the download date). Page numbers \
are the journal's (819-831): pdf page 1 is the publisher's cover, so p. = pdf page + 817.

REDUCTION (pp. 820-821). (n - 1) = 2 pi N_A alpha rho (Eq. 6, the low-density \
approximation of Lorentz-Lorenz, (n^2 - 1)/(n^2 + 2) ~ (2/3)(n - 1)); rho = rho_0 [1 - \
B(T) rho_0], rho_0 = p/RT, with the second thermodynamic virial coefficient B(T) of Kerl \
1986 (Eq. 11); the refractivity virial coefficient b_R is neglected (p. 821, and p. 829: \
'no experimental data are available for it at the temperatures used'). So alpha is the \
free-molecule polarizability volume alpha_SI/(4 pi eps0) (m^3; 10^-30 m^3 = angstrom^3), \
real-gas reduced, and needs no state. The wavelengths are vacuum wavelengths (p. 819: \
'the vacuum-wavelength range between lambda_1 = 632.99 nm and lambda_4 = 543.51 nm').

WHAT IS PRINTED. The measured alpha(omega_k, T) themselves are not tabulated here \
('tabulated in [3]', Hohm's 1989 Braunschweig dissertation, p. 828: missing). For each \
temperature the paper prints the fit of the four averaged alpha(omega_k, T) to the \
single-term Kramers-Heisenberg relation alpha(omega, T) = C0(T)/[C1(T) - omega^2] (Eq. \
18), with C0 = f0 e^2/(4 pi eps0 m) and C1 = (E0'/hbar)^2 (Eqs. 19-20) and the same fit in \
atomic units (Eq. 21: f0, omega0*), the extrapolated static alpha(0, T) = C0/C1, C6 = \
3 f0^2/(4 omega0*^3) and the fit's standard deviation 100 Delta alpha/alpha(0, T) = \
0.02-0.08 (Tables 1-3). 'To reproduce the measured polarizabilities with the given \
standard deviation, five decimal places have to be used for the fit parameters given in \
the first four columns' (p. 824). The fits are the formulas below (one per temperature); \
evaluated at the four wavelengths they are the measurements to within the stated \
standard deviation. The static alpha(0, T) are datasets (alpha0_T_<gas>, row = the \
temperature in K), use = check: a single-term extrapolation from 543.51-632.99 nm to \
omega = 0, which 'clearly limits the accuracy' (p. 826); for H2 and O2 (no infrared \
activity) the static limit of the electronic polarizability, for Ar the static \
polarizability. The temperatures carry their own uncertainty in parentheses ('295.60 \
(22)': not transcribed into the row id; in the printed column).

Uncertainty: none stated for alpha itself beyond the fit standard deviation; Part I \
states |Delta alpha/alpha| < 10^-3 for the method (hohm_1990, p. 809). The Tables 4-5 \
digits in parentheses (the 0 K extrapolations and alpha'_e) are uncertainties on the \
last digits, level not stated here (Part I: 'As usual, standard deviations are given in \
parentheses').

TEMPERATURE DEPENDENCE (pp. 826-830). No marked temperature dependence of f0, omega0* or \
C6 for any gas (p. 827). Ar: alpha(0, T) independent of T; mean alpha(0) = 1.6404(11) x \
10^-30 m^3 (p. 828, dataset mean_alpha0_Ar), against Bose and Cole's 1.64110(24) [19] \
(bose_1970: 3 A_eps/(4 pi N_A) with A_eps = 4.1397 cm^3/mol is 1.64108, checked) and \
Kumar and Meath's DOSD 1.64189 [18]. H2 and O2: the alpha(lambda_k, T) are analysed with \
Part I's Eqs. (11)-(12) (rotational stretching only; the vibrational part has no \
measurable effect), separately at each wavelength, giving the dynamic polarizability \
extrapolated to T = 0 K and the derivative alpha'_e(lambda) = r_e (d alpha(lambda)/d \
r)_e (r_e = 0.74144 angstrom for H2, 1.20752 angstrom for O2) (Tables 4-5). H2: \
alpha(infinity, 0) = 8.0320(57) x 10^-31 m^3 'shows a marked agreement' with Bishop and \
Cheung's 8.0306 (p. 828); this work is 0.02-0.06 % above Bishop et al. at every \
wavelength; mean alpha'_e = 1.06 x 10^-30 m^3 against 0.9 x 10^-30 from light scattering \
at 400-500 nm (Stansbury, Crawford and Welsh 1953; Knippers, van Helvoort and Stolte \
1985) (p. 828); the ratio a1/a2 to Adamov and Evarestov's calculation is 1.058-1.073 \
(1.125 at 611.97 nm, which the authors omit). O2: 'the data of O2 used do not have the \
same quality as those of H2' (p. 829); mean alpha'_e = 3 x 10^-30 m^3, 'considerably \
higher than the highly reliable one of alpha'_e = 1.76(7) x 10^-30 m^3 given by Buldakov \
et al.' (p. 829), since Eq. (11) of Part I neglects the degeneracy of the ground state \
and the low-lying 1Delta_g level; alpha''_e neglected. Rijks et al.'s ab initio \
dynamic polarizabilities are 'much too low' and are printed scaled up by 1.0831 to this \
work's alpha(infinity, 0) (p. 829), so their static value equals this work's by \
construction. The a1/a2 ratios (last column of Tables 4-5) are not extracted.

INTERNAL CHECKS (2026-09-27, each formula's check). In every row of Tables 1-3, C0/C1 \
reproduces the printed alpha(0, T), C0/(e^2/4 pi eps0 m) = C0/253.2638 m^3 s^-2 the \
printed f0, C1^(1/2) x 2.4188843e-17 s the printed omega0* and 3 f0^2/(4 omega0*^3) the \
printed C6, each to the last printed digit (1 in the last digit at most), with two \
exceptions: (1) Ar at 570.48 K prints omega0* = 0.617490 where C1 gives 0.617470; \
f0/omega0*^2 reproduces the printed alpha(0, T) = 1.64086 with 0.617470 (1.64086) and \
not with 0.617490 (1.64075): a misprinted omega0*, corrected in the formula \
(eq18_Ar_570.48); (2) H2 at 1006.72 K prints alpha(0, T) = 0.81227 where C0/C1 = \
3.75134e2/4.61631e32 = 0.81263 x 10^-30 m^3, and f0/omega0*^2 (1.48120/0.519712^2 = \
5.48388 au = 0.81263) and C6 = 3 alpha*^2 omega0*/4 (11.72 as printed needs 0.81263) \
agree with C0/C1: a misprinted alpha(0, T), corrected by an erratum. The Eq. (18) fits \
at 632.99 nm against Part I: Ar 1.66281 (295.60 K) against hohm_1990's 300-1100 K mean \
1.66276(59) (+0.003 %); H2 0.82181 (296.40 K) against hohm_1990's Eq. (18) at 296.40 K, \
0.82187 (-0.007 %); O2 1.59695 (296.78 K) against hohm_1990's Eq. (20), 1.59618 (+0.05 \
%).

TABLE 1-3 LITERATURE ROWS (reproduced). 'With the use of second thermodynamic virial \
coefficients [15] the given dispersion formulae [8, 16, 17] are converted to non-ideal \
behaviour' (p. 825): the rows [8] (K. Kerl, Z. Phys. Chem. Frankf. Ausg. 129, 129 \
(1982), measured 400-700 nm, 293.04-293.05 K), [16] (Cuthbertson and Cuthbertson, Proc. \
R. Soc. 84, 13 (1910) = cuthbertson_1910, argon, 480-671 nm) and [17] (C. Cuthbertson, \
Phil. Mag. 25, 592 (1913), H2 and O2; not in the library) are the authors' \
re-evaluations of those dispersion formulas at 273.15 K, recorded as reproduced \
formulas (and their alpha(0, T) as reproduced datasets). The authors find the argon and \
oxygen values of [8] 'slightly too high by the same amount' (p. 825). The rows with only \
a static value: [18] kumar_1985 (Ar, 11.08 au), [19] bose_1970 (Ar), [20] orcutt_1967 \
(H2, 0.80515: this corresponds to A_eps = 2.0310 cm^3/mol, not among orcutt_1967's \
printed H2 values 2.033(1), 2.0301(8), 2.036(3); unexplained), [21] zeiss_1977 (H2 5.428 \
au, O2 10.59 au: 0.80435 and 1.56928, checked), [22] bishop_1980 (H2, 0.80524). \
Bishop and Cheung's Table 4 column is their J = 0 (v = 0) polarizability, i.e. at T = 0 \
K: 5.4193 au = 0.80306 (static) and 5.5242 au = 0.81860 at 6328 A (checked; listed \
here at 632.99 nm); the 611.97, 594.11 and 543.51 nm values (0.81971, 0.82075, 0.82430) \
are not among bishop_1980's wavelengths and were presumably interpolated by Hohm and \
Kerl (not said). Adamov and Evarestov (Opt. Spectrosc. 19, 362 (1965)), Rijks, van \
Heeringen and Wormer (J. Chem. Phys. 90, 6501 (1989)) and Inoue, Matsushima and Iwata \
(Mol. Phys. 56, 1097 (1985)) are not in the library.

NOT EXTRACTED (no quantity): C6 (this work 55.98-57.25 a.u. for Ar, 11.44-11.77 for H2, \
43.88-44.86 for O2, 'always lower than the data given in the literature'; literature \
64.57 [18] Ar; 12.15 [23] Visser et al. 1985 and 12.11 [21] H2; 50.90 [23] and 62.01 \
[21] O2), f0 and omega0* beyond the formulas, the fits' standard deviations (in the \
formulas' printed strings), Figs. 1-5 (interferograms, the Fourier spectrum, alpha(lambda) \
of Ar, H2, O2 at 296 K against [8, 16, 17]).

REPRODUCTIONS ELSEWHERE: kerl_1992's Eq. (10) fits of Ar, H2 and O2 are fitted to these \
data (its note b; re-pointed 2026-09-27), and its H2 and O2 alpha(0, 0) (0.80320(57), \
1.5658(14)) are this paper's Table 4-5 extrapolations, digit for digit."""

