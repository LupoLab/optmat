citation = "M. Kübel, A. S. Alnaser, B. Bergues, T. Pischke, J. Schmidt, Y. Deng, C. Jendrzejewski, J. Ullrich, G. G. Paulus, A. M. Azzeer, U. Kleineberg, R. Moshammer and M. F. Kling, \"Strong-field control of the dissociative ionization of N2O with near-single-cycle pulses\", New J. Phys. 16, 065017 (2014)"
doi = "10.1088/1367-2630/16/6/065017"
library = "Kubel_2014_StrongFieldControl"
identity = "VALIDATED"
kind = "measurement"
technique = """Phase-tagged ion-ion coincidence momentum imaging (reaction microscope, \
REMI) of N2O in 4 fs, 750 nm pulses at 10 kHz; the carrier-envelope phase of every \
shot measured by a stereo-ATI phase meter; linear or circular polarisation set by \
broadband wave plates; extraction field about 60 V/m; about one event per shot. \
Non-coincident N+, O+, N2+ and NO+ momentum spectra (one half of the time-of-flight \
distribution, symmetrised) and the two coincident channels N2O2+ -> N+ + NO+ \
(denitrogenation) and N2O2+ -> O+ + N2+ (deoxygenation), selected by momentum \
conservation (pp. 4-5)."""
notes = """PDF page 1 is IOP's download cover; pdf pages 2-16 = article pages 1-15. \
Identity checked on pdf page 2 (title, authors, New J. Phys. 16 (2014) 065017, DOI). \
Material N2O for every dataset: the channels name the ion that dissociates.

INTENSITY. The paper prints one experimental intensity, in the caption of Fig. 5: KER \
spectra 'induced by linearly polarized pulses with an intensity of 1.5 x 10^14 W cm^-2' \
(p. 10). How it was calibrated is not stated. A semi-classical model of the \
recollision asymmetries matches the data 'for an instantaneous peak intensity of I = \
3.0 x 10^14 W cm^-2 and a pulse duration tau = 4.1 fs' (p. 7), a model parameter, not \
a measurement.

TEXT VALUES TAKEN (p. 9; TC-966): 'When analyzing the non-coincident channels, it is \
found that the N-N bond is 3.5 times more likely to break than the N-O bond. This \
yield ratio is, however, likely dominated by the dissociation of the N2O cation. In \
the coincident channels ... this trend is even more pronounced. For the conditions of \
our experiment, the denitrogenation yield is 6.2 times higher than the deoxygenation \
yield. At about twice the intensity, the ratio slightly increases to 6.7. For \
circular polarization (CP) a ratio of 13 is observed'. The KERs (p. 10): \
deoxygenation 'a peak around 5.8 eV and a pronounced shoulder at 7.2 eV', \
denitrogenation 'a narrow distribution round 6.8 eV'; in CP the deoxygenation KER \
distribution is 'slightly narrower' (no number).

STATE ASSIGNMENTS (p. 10): from the dication potentials of Taylor, Eland and Hochlaf, \
J. Chem. Phys. 124, 204319 (2006) (their Ref. 50, not in the library), the expected \
KERs 'read off from the diagram' are ~5.8 eV (3Sigma-) and 7.0 eV (3Pi) for \
deoxygenation, 6.8 eV and 11.4 eV for denitrogenation; Taylor et al. report that 3Pi \
dissociating along N-N decays first by fluorescence to 3Sigma-, so denitrogenation shows \
one peak. Electron recollision populates the higher states that give O+ with high KER. \
Fig. 1 (adapted from Ref. 50): the lowest dication limits 28.8 eV (denitrogenation) \
and 30.9 eV (deoxygenation), the 3Pi N-O limit 32.4 eV; N2O's single and double \
ionisation potentials 12.9 and 35.5 eV (p. 3). Reproduced values, not taken.

METASTABLE DICATION (p. 4): no stable N2O2+ is detected; a tail in the PIPICO spectrum \
of the denitrogenation shows a small fraction dissociating via metastable states with \
a lifetime estimated 'as a few 100 ns', in agreement with Field & Eland (1993); the \
deoxygenation shows no tail. Not taken (no number). The 3Pi state may dissociate on a \
time scale comparable to or longer than the rotational period of 39.77 ps (quoted, p. \
12).

LOW- AND HIGH-ENERGY FRAGMENTS (p. 7): each of N+, NO+, O+, N2+ shows a low-energy part \
(below 1 eV, non-coincident only, attributed to the dissociation of the cation into the \
ion and a neutral) and a high-energy part (the dication channels, plus for O+ and above \
all N2+ many non-coincident ions). No yields are printed.

NOT TAKEN: Table 1 (p. 8), the amplitudes A0 and phase offsets phi0 of the CEP \
asymmetry of the low- and high-energy parts of each fragment (A0 1.5-3.8 %), and the \
CEP results of the text (the 120 deg shift between single and double ionisation, about \
20 % asymmetry of N2O+, the 37 +- 7 deg shift of the deoxygenation): no quantity holds \
CEP asymmetries, and they do not bear on the products of a pulse averaged over the \
phase. Figures, all vector drawings: Fig. 4 (kinetic energy spectra of the four \
fragments, non-coincident and coincidence-scaled), Fig. 5(a) (the KER spectra of both \
coincident channels, maxima normalised to 1), Fig. 7(a) (angular distributions); none \
is digitised (TC-966)."""

[[datasets]]
id = "denitrogenation_over_deoxygenation_linear"
material = "N2O"
table = "text"
quantity = "fragmentation_branching_ratio"
unit = "1"
abscissa = "label"
use = "primary"
points = [
    ["I1", "the conditions of the experiment (1.5e14 W/cm2, Fig. 5)", "6.2"],
    ["I2", "about twice the intensity", "6.7"],
]
notes = """p. 9 (TC-966): the coincident denitrogenation yield over the coincident \
deoxygenation yield, linear polarisation, averaged over the CEP. Row I1 'for the \
conditions of our experiment', which we take as the one intensity the paper prints for \
linear pulses, 1.5e14 W/cm2 (Fig. 5's caption; calibration not stated); row I2 'at \
about twice the intensity'. No uncertainty is printed; Fig. 5(b)'s CEP modulation is a \
few per cent."""
[datasets.parameters]
channel = "N2O2+ -> N+ + NO+ (coincident pairs)"
reference = "N2O2+ -> O+ + N2+ (coincident pairs)"
excitation = "strong-field pulse"
wavelength_nm = 750
pulse_fs = 4
polarization = "linear"
detection_correction = "not stated (both channels are momentum-matched ion pairs)"
intensity = "I1: 1.5e14 W/cm2 (Fig. 5 caption, by our reading); I2: about twice I1"

