[[formulas]]
id = "gain_eq11"
material = "H2"
equation = "Eq. (11), p. 681"
printed = "gamma_g = 9.37 x 10^6 (52 rho/Delta nu) (K_B/0.658) (nu_p - 4155) (7.19 x 10^9 - nu_p^2)^-2"
variable = "nu_p: the pump frequency in cm^-1; rho: the density in amagat; Delta nu: the FWHM linewidth in MHz from Eq. (8); K_B: the Boltzmann population of J = 1 (0.658 at 298 K); gamma_g in cm/W"
state = "298 K as printed; other temperatures through Delta nu (Eq. 8) and K_B"
density = "ideal"
range = "pump 2000-190 nm, 1-100 amagat, 77-500 K (p. 681)"
coefficients = { C = "9.37e6", linewidth_hd_MHz_per_amagat = "52", KB_298 = "0.658", nu_R = "4155", nu_i2 = "7.19e9" }
check = "Reproduces Table 1's calculated column at all seven pump wavelengths to <= 0.25 % with nu_p = 1/lambda (e.g. 532 nm: 2.935 against 2.94; 308 nm: 7.046 against 7.06) (2026-09-26). The constant follows from Eqs. (4)-(5) with R = 0.99 as 9.43e6 (0.6 % high)."
notes = "The peak steady-state gain of the Q(1) line of normal H2; 'In the high-density limit, Delta nu = 52 rho MHz, and hence the peak Raman gain is independent of density' (p. 681). 7.19e9 = nu_i^2 of Eq. (5) (nu_i = 8.48e4 cm^-1). The paper's recommended formula: 'correct gain coefficients for use in modeling applications can be calculated from Eq. (11)' (p. 682)."

[[formulas]]
id = "cross_section_eq5"
material = "H2"
equation = "Eq. (5), p. 681"
printed = "dsigma/dOmega (90 deg) = A nu_s^4/(nu_i^2 - nu_p^2)^2, A = 8.74 x 10^-28 cm^2 sr^-1, nu_i = 8.48 x 10^4 cm^-1"
variable = "nu_s, nu_p: the Stokes and pump frequencies in cm^-1"
state = "298 K (the Q-branch thermal average)"
density = "unknown"
range = "200-600 nm (Bischel and Black's measurements, Ref. 20)"
coefficients = { A = "8.74e-28", nu_i = "8.48e4" }
reproduced_from = ["bischel_1983"]
check = "Enters Eq. (11) (with R = 0.99): see gain_eq11."
notes = "The wavelength dependence of the H2 Q-branch (4155 cm-1) cross section, fitted with a single resonance by the authors (Ref. 20, W. K. Bischel and G. Black, Excimer Lasers-1983, AIP, 1983 = bischel_1983, re-pointed 2026-09-27: A and nu_i are that paper's Table 1 H2 row, identical): the thermal average over the Q branch for linear pump polarization and no analyser (Eq. 7), multiplied by R = 0.99 to give the Q(1) cross section for parallel pump and Stokes polarizations (Eq. 6)."

[[formulas]]
id = "linewidth_eq8"
material = "H2"
equation = "Eq. (8), p. 681"
printed = "Delta nu = (309/rho) (T/298)^0.92 + [51.8 + 0.152 (T - 298) + 4.85 x 10^-4 (T - 298)^2] rho"
variable = "rho: the density in amagat; T: the temperature in K; Delta nu: the FWHM in MHz"
state = "T as the variable"
density = "ideal"
range = "rho < 100 amagat (the text); 1-50 amagat, 77-500 K (p. 682)"
coefficients = { A = "309", n_A = "0.92", B0 = "51.8", B1 = "0.152", B2 = "4.85e-4", T0 = "298" }
check = "At 298 K and 20 amagat gives 1051 MHz against the text's 1055 MHz at 20 amagat (p. 680); at 12.1 amagat 652 MHz against 'the true linewidth is 650 MHz' (p. 678) (2026-09-26)."
notes = "The Q(1) FWHM of normal H2 with the Dicke term, reproduced from Ref. 14 (bischel_1986, Phys. Rev. A 33, 3113), the original. The temperature exponent 0.92 applies to the Dicke term. Ottusch and Rockwell's H2 law (ottusch_1988 linewidth_H2) is this at 298 K."

[[formulas]]
id = "line_shift_eq9"
material = "H2"
equation = "Eq. (9), p. 681"
printed = "nu_r(rho) = nu_r(0) + C rho + D rho^2; nu_r(0) = 4155.25 +- 0.01 cm^-1; C = -96 MHz/amagat at 298 K; D = 0.174 MHz amagat^-2"
variable = "rho: the density in amagat"
state = "298 K"
density = "ideal"
range = "the second-order term needed above 100 amagat (p. 681)"
coefficients = { nu0_cm1 = "4155.25", C_MHz_per_amagat = "-96", D_MHz_per_amagat2 = "0.174" }
check = "Not a fit of this paper's data: its terms are quoted (nu_r(0) from Refs. 28-31, C from Ref. 14, D from Ref. 26)."
notes = "Reproduced: D from J. R. Murray and A. Javan, J. Mol. Spectrosc. 42, 1 (1972) (Ref. 26), curated as murray_1972 (2026-09-27). FINDING: 0.174 MHz amagat^-2 is Murray and Javan's quadratic-fit b of the Q_1(0) line (0.0058 x 10^-3 cm-1/amagat^2, their Table III); their Q_1(1) b is 0.0045 x 10^-3 = 0.135 MHz amagat^-2 (bischel_1986's Table II prints both, on their own lines). This Q(1) law therefore carries the Q(0) quadratic coefficient; at 100 amagat the difference is 390 MHz (0.013 cm-1)."

[[formulas]]
id = "line_shift_eq10"
material = "H2"
equation = "Eq. (10), p. 681"
printed = "C = [nu_r(rho) - nu_r(0)] rho^-1 = [-96.1 + 0.777 (T - 298) - 8.82 x 10^-4 (T - 298)^2]"
variable = "T: the temperature in K; C in MHz/amagat"
state = "T as the variable"
density = "ideal"
range = "densities below 100 amagat (p. 681); 77-500 K"
coefficients = { C0 = "-96.1", C1 = "0.777", C2 = "-8.82e-4", T0 = "298" }
check = "At 298 K gives -96.1 MHz/amagat, the text's C = -96 (2026-09-26)."
notes = "The temperature law of the Q(1) shift coefficient, reproduced from Ref. 14 (bischel_1986)."
