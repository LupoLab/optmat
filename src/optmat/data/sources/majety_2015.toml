citation = "V. P. Majety and A. Scrinzi, \"Static field ionization rates for multi-electron atoms and small molecules\", J. Phys. B: At. Mol. Opt. Phys. 48, 245603 (2015)"
doi = "10.1088/0953-4075/48/24/245603"
library = "Majety_2015_StaticFieldIonization"
identity = "VALIDATED"
kind = "theory"
technique = """Static-field ionisation rates from the hybrid anti-symmetrized coupled \
channels (haCC) method with exterior complex scaling (tRecX): the N-electron wave \
function is expanded in anti-symmetrized products of CI ionic states |I> (COLUMBUS, \
atom-centred Gaussian basis) and a numerical one-electron basis (finite elements \
radially, single-centre real spherical harmonics), plus the fully correlated CI neutral \
ground state (Eq. (1), p. 3). haCC(n): the lowest n ionic states (degenerate states \
counted separately). Fixed nuclei; the complex eigenvalue E = r - i Gamma/2 of the \
field-free ground state, followed adiabatically in F with ARPACK, gives the rate Gamma \
(pp. 3-4); scaling radius R0 = 25-40 au, nuclear and Hartree potentials switched off \
over 5-10 au before R0 (p. 4). Linear systems only: He, Ne, Ar, H2, N2, CO."""
notes = """Pages are pdf pages: pdf page 1 is the IOP download cover, so the article's \
own page number is one less (pdf p. 11 is the article's p. 10). Identity checked against \
pdf p. 2.

WHAT IS TAKEN. Tables 1-3 and A1-A2 (static-field rates, au, against F in au) and \
Tables 4-5 (vertical energies of the ionic states of N2 and CO, eV). Every table image \
was checked against the extracted cells (2026-09-26): they agree. Rates are \
wavelength_nm = inf, polarization = static. A cell printed '<10^-k' (He at F = 0.06 \
au; N2 and CO at F = 0.02 au) is an upper bound: kept in the file as 1e-k and excluded \
from its dataset. One structural fix in the script (Table A2's last row carries the \
continuation's header); no erratum.

WHAT THE RATES COUNT. Each rate is the total single-ionisation rate of the atom or \
molecule: the width Gamma of the complex-scaled N-electron ground state (p. 4), with \
all the ionic channels of the basis together, not a per-orbital rate. The paper cannot \
separate channels: 'This fact can only be established by calculating partial ionization \
rates corresponding to each channel. Such a channel analysis is not trivial in the \
current setup due to non-orthogonality' (p. 7). For comparison with single-electron \
(SAE) models the paper multiplies those by 2: Fig. 1 caption (p. 6), 'All single \
electron values include multiplication by a factor 2 for the double occupancy of the \
ionizing orbital.' So a haCC rate of Ne or Ar corresponds to twice a per-orbital SAE rate \
(the bearing on solprop's occupancy question, TC-439).

ANGLES. H2: Table 2 is the field parallel to the molecular axis (angle_deg = 0), Table \
3 perpendicular (90). N2 (Table A1) and CO (Table A2): the column angle is 'Angle \
between the molecular axis and the field vector' (table header). For CO, '0 deg when the \
field points from O atom to C atom' (Fig. 5 caption, p. 9, and p. 7); the rates are \
largest at 180 deg (field from C to O): 'maximum emission occurs when the field point \
from C to O which means the preferred emission end is toward the C atom' (p. 8). N2 is \
symmetric, so 0-90 deg covers it. The internuclear distances of N2 and CO are \
'equilibrium' (Tables A1, A2 captions), not printed; H2 is at 1.4 au (p. 4).

ACCURACY (quoted; the level of confidence is never stated). General: 'the haCC method \
can produce rates accurate on the level of 5%-10%' (p. 3); conclusions, 'the haCC scheme \
is capable of providing rates accurate on the level of 5%-10%' (p. 9). He (p. 4): 10 % \
below F = 0.1 au and 5 % above against the full-dimensional literature; haCC(5) within 1 \
% of [17] above 0.1 au. H2 parallel (p. 4): haCC(5) 'accurate below 4%' against [18]; \
perpendicular: 'converge systematically to less than a few percent'. N2 (p. 7): the \
one-electron parameters (R0, l_max) 'converged to 2%'; 'Changing the gaussian basis to \
a quadruple zeta basis however changes the rates by about 10% at low field strengths (F \
< 0.5 a.u), but only by less than 5% at higher field strengths' (0.5 as printed: the \
tabulated fields end at 0.14 au and Fig. 2 compares at 0.04, 0.08 and 0.12, so 0.05 is \
probably meant); 'we are only looking for rates accurate on the level of 10%', 'we limit \
our accuracy requirement to <~10%' (p. 6); adding the D 2Pi_g channel changes the rates by \
'less than 2% with respect to the haCC(5) scheme' (p. 7). CO (p. 7): 'The single \
electron parameters used are converged to below 10%'; 'the first four bound states are \
sufficient for convergence'; adding the 3 2Sigma+ channel changes the rates by 'less \
than 2% with respect to the haCC(6) scheme'. Recorded as the dataset uncertainty for the \
converged schemes only (He haCC(5) 10 %/5 %, H2 parallel haCC(5) 4 %, N2 haCC(5) and CO \
haCC(6) 10 %; level not stated); the lower schemes are convergence steps (use = check), \
and haCC(5)/(6) are marked primary as the paper's converged results (their role \
against the full-dimensional He and H2 benchmarks is decided at review). The \
limitation (p. 4): core polarization is restricted to ionic bound states; 'all \
continuum contributions to polarization are still missing'.

LITERATURE COLUMNS (reproduced): Table 1 [11] = parker_2009 (digit-identical), [17] = \
Scrinzi, Geissler and Brabec, Phys. Rev. Lett. 83, 706 (1999) (scrinzi_1999), [32] = Themelis, \
Mercouris and Nicolaides, Phys. Rev. A 61, 024101 (1999) (both also printed in \
parker_2009 Table 1, identical); Table 2 [18] = Saenz, Phys. Rev. A 61, 051402 (2000) (saenz_2000, which prints no rate); \
Tables 4-5: Svensson et al., Phys. Scr. 44, 184 (1991) [35] (the pdf itself prints the \
names 'Carlsson-Gthe' and 'Mrtensson', p. 11) and Baltzer et al., J. Phys. B 27, 4915 \
(1994) [36]. None of these originals is in the library. The ADK column of Table 1 is an \
unexplained formula evaluation, digit-identical to parker_2009's ADK column (use = \
check).

NOT TAKEN (figures only). Ne and Ar (Sect. 4, Fig. 1, p. 6): haCC(4) rates against F \
with ADK, E-ADK (Tong and Lin 2005) and three SAE \
models (Batishchev et al. 2010 = batishchev_2010, Fabrikant and Zhao 2015); no values in the text, only \
'results from the two schemes [haCC(3) and haCC(4)] differ by less than 2%' and E-ADK \
'still over-estimates by at least a factor 2' (p. 6). N2: Fig. 2 (convergence), Fig. 3 \
(rates and Stark shift against F, haCC(1)-(7), MO-ADK), Fig. 4 (polar plots, F = \
0.04-0.14 au). CO: Fig. 5 (polar plots, F = 0.03-0.09 au), Fig. 6 (the asymmetry \
parameter against intensity); each polar panel of Figs. 4 and 5 prints one number (a radial scale), not taken. Text values (p. 8): the yield asymmetry (Y_0 - Y_180)/(Y_0 \
+ Y_180) (printed with a minus in the denominator, a misprint of the definition given \
for the rates on p. 8) for cos^2 pulses at the parameters of Li et al. 2011 [22], -0.25 \
+- 0.02 (haCC(6); the 0.02 from a 10 fs pulse-duration uncertainty) against the measured \
-0.30; haCC(1) predicts a swap of the preferred direction near 1.0e14 W/cm^2 (p. 8). No \
quantity holds an asymmetry: notes only. Quasi-static yield formula Eq. (5), p. 8: Y = 1 \
- exp(-int dt Gamma(F(t))).

VERTICAL ENERGIES. Tables 4 (N2, p. 6) and 5 (CO, p. 8): computed with MRCIS ('the \
ionic and the neutral states were computed using the multi-reference CI singles level', \
p. 6), use = check; the experimental columns reproduced. As ionization_energy of the \
neutral (kind = vertical), the row label the final ionic state; the single-row pvqz \
dataset also states final_state. Against solprop (tests/data/solprop_ionisation.json): \
N2 potential_j 2.49639e-18 J = 15.581 eV, the Svensson X value 15.58 printed here; the \
paper's own 15.5 (tz) and 15.60 (qz). CO is not in solprop."""

[[datasets]]
id = "table1_hacc5_He"
material = "He"
file = "He/majety_2015__table1_hacc5_He.csv"
table = "tbl_f4022cb09486"
quantity = "ionization_rate"
unit = "au"
abscissa = "field"
abscissa_unit = "au"
use = "primary"
excluded_rows = { "0.06" = "printed '<10^-10': an upper bound, not a value (written 1e-10 for the record)" }
notes = "Table 1 (p. 5), haCC(5) column: the basis with the first- and second-shell He+ channels (1s, 2s, 2p) and the fully correlated neutral ground state. Rate of the atom (the width Gamma of the complex-scaled neutral ground state followed adiabatically in F; both electrons in the calculation), in au, against F in au. Accuracy (p. 4): 'For field strengths, F < 0.1 a.u, we obtain agreement with literature values on the level of 10%. Above 0.1 a.u, the agreement improves and the largest difference is on the level of 5%. Notably, above 0.1 a.u field strength, the haCC(5) rates differ from rates in [17] by less than 1%.' Recorded as 10 % below F = 0.1 au and 5 % from 0.1 au, level not stated."
[datasets.uncertainty]
relative = 0.10
relative_rows = { "0.10" = 0.05, "0.11" = 0.05, "0.12" = 0.05, "0.13" = 0.05, "0.14" = 0.05, "0.15" = 0.05, "0.16" = 0.05, "0.18" = 0.05, "0.20" = 0.05 }
level = "not stated"
[datasets.parameters]
wavelength_nm = inf
polarization = "static"
method = "haCC(5)"

