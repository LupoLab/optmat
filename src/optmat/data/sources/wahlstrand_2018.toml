notes = "Supplemental Material, Table 1 (SM p. 11; library supplement_01), row O2: the fit Y = c_1 I_0^m, Eq. (S1), to the measured ionisation yield of Fig. 3 (the formula yield_fit), I_0 the temporal peak intensity in TW/cm^2 of the 42 fs (FWHM of intensity), 800 nm pump. c_1, printed 9.6 x 10^-11 under the header 'c_1 [(cm^2/TW)^m]' (read on the table image; the text layer loses the superscripts), with m of yield_fit_m_O2: the unit depends on the fitted exponent m = 4.09, so that c_1 I_0^m is dimensionless with I_0 in TW/cm^2. It is as printed and is not converted. No uncertainty is given; 'The accuracy of the ionization yield measurement is set by the vertical scatter of the points, while the intensity accuracy is ~13%' (Fig. 3's caption, p. 3). The fitted range is not stated; the points of Fig. 3 span about 40-105 TW/cm^2 (read on the figure). A validator of yields over that range, not a rate model: nothing is fitted to it."
