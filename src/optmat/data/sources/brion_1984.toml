citation = "C. E. Brion and J. P. Thomson, \"Compilation of dipole oscillator strengths (cross sections) for the photoabsorption, photoionization and ionic fragmentation of molecules\", J. Electron Spectrosc. Relat. Phenom. 33, 301 (1984)"
doi = "10.1016/0368-2048(84)80027-4"
library = "Brion_1984_CompilationDipoleOscillator"
identity = "VALIDATED_WITH_WARNINGS"
kind = "compilation"
technique = """A compilation of the authors' groups' dipole (e,2e) and dipole (e,e+ion) \
coincidence measurements (fast-electron energy loss at zero angle, the equivalent of \
tuneable-energy photoelectron and photoionisation mass spectroscopy). The total \
photoabsorption df/dE comes from the zero-degree (e,e) energy-loss spectrum, made \
absolute by the Bethe-Born factor and Thomas-Reiche-Kuhn sum-rule normalisation, 'without \
making any absolute measurements' (p. 301); the partial photoionisation oscillator \
strengths partition it by the photoion branching ratios and the ionisation efficiency \
eta_i, often assumed 1 above 20 eV (pp. 301-302); the total photoionisation is the sum \
of the partials (p. 303). Resolution (FWHM) 0.5-1.0 eV for (e,e) photoabsorption, 1.5 \
eV for (e,2e), 0.5-1.0 eV for (e,e+ion) (p. 303)."""
notes = """Journal pages 301-331 = PDF pages 1-31 (page n of the PDF is p. 300 + n). \
Values per molecule; no density or state. Unit: df/dE in 10^-2 eV^-1 against photon \
energy (eV); 'sigma(Mb) = 109.75 (df_0/dE)(eV)^-1' (p. 303). Accuracy (p. 303): 'generally \
considered to be <= 5 % (photoabsorption) and <= 10 % (photoionization)', no \
confidence level; stored as relative 0.05 and 0.10, level not stated.

EVERY TABLE IS A REPRINT: each is headed by the journal reference of the original \
measurement (the tables are 'the details of the individual experiments are to be found \
in the literature references shown at the head of each table', p. 302). None of the \
originals is in the library, so these copies are 'reproduced' with the original's \
citation (the head's journal reference, with the authors from gallagher_1988's \
record or from this paper's reference list), and are the best copies available.

Extracted (the dipole (e,e+ion) tables of the curated species, which carry both totals): \
H2 (p. 318), CO (p. 319), N2 (p. 320), O2 (p. 321), CH4 (p. 326), N2O (p. 327), CO2 (p. \
328), SF6 (p. 331): the total photoabsorption as differential_oscillator_strength \
(absorption_<gas>) and the total photoionisation as photoionization_cross_section \
(ionization_<gas>), the latter with the paper's factor as its scale (printed x 1.0975 = \
Mb). The partial photoionisation channels (molecular and fragment ions, electronic \
states of the ion) are not extracted (no quantity; for later).

STRUCTURE (image checked, every cell of the eight tables agrees with the extraction): the \
title strips are separate one-cell tables; the SF6 strip is extracted as 'SF_5'; the \
CH4 (e,e+ion) strip of p. 326 is missing from the extraction (the page shows 'CH4 \
(e,e+ion) J. Phys. B 8 (1975) 3020-3033.'), and the CH4 strip the extraction has (p. \
313) heads the CH4 (e,2e)-type table of that page; the p. 305 (N2 (e,2e), J. Electron \
Spectrosc. 8, 367 (1976)) and p. 315 (N2O (e,2e), Chem. Phys. 34, 141 (1978)) strips \
are also missing. 'O_2^*' in the O2 and CO2 headers is O2+ (a superscript plus). The \
SF6 table prints three absorption values without their hundreds digit (errata).

Not extracted: the (e,2e) tables (pp. 304-317). Their total photoabsorption columns \
reprint the (e,e) data: CO (p. 304) and N2 (p. 305) from J. Phys. B 9, 675 (1976) (the \
same values as the (e,e+ion) tables here), O2 (p. 306) and CH4 (p. 313, note a J. Phys. \
B 8 3007, printed '(1978)' for 1975) likewise; CO2 (p. 314) and N2O (p. 315) instead \
print (e,e) data 'normalised on photoabsorption at 35 eV' to Lee et al. (J. Quant. \
Spectrosc. Radiat. Transfer 13, 1023 (1973)), a different normalisation (CO2 at 21.2 eV: \
33.44 there against 32.50 at 21 eV here). Their total photoionisation columns (sums of \
(e,2e) partials) differ from the (e,e+ion) ones by up to a few per cent (CH4 at 15 eV: \
36.80 against 36.79). NO, HF, HCl, HBr, H2O, NH3, COS and CS2 are not curated species.

Partial TRK sums (computed 2026-09-26, trapezoid over the printed points, df/dE in \
eV^-1): S(0) over the table's range against the electron count N (valence N_v): H2 \
10-70 eV 1.967 (N = 2); CO 18-69 eV 6.35 and N2 18-69 eV 6.19 (N = 14, N_v = 10; the \
discrete region below 18 eV is not tabulated); O2 5-75 eV 8.90 (N = 16, N_v = 12); CH4 \
14-80 eV 6.52 (N = 10, N_v = 8; nothing below 14 eV); N2O 8-74 eV 12.72 and CO2 8-80 eV \
12.88 (N = 22, N_v = 16); SF6 5-63 eV 30.03 with the errata (27.03 as printed; N = 70, \
N_v = 48). The tables stop far below the inner shells and (for most) the valence \
continuum's tail, so these are consistent with the TRK normalisation of the full \
original spectra but cannot test it. Partial S(-2) (au) over the same ranges: H2 5.34 \
(5.43 total static), O2 10.54, N2O 19.05, CO2 17.34, CH4 9.89 (below 14 eV missing), \
SF6 28.5 as printed (1.73 au of it from the doubtful 6.0 eV point, see absorption_SF6)."""

