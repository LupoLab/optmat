[[errata]]
dataset = "absorption_SF6"
row = "23.0"
column = "value"
printed = "20.80"
corrected = "120.80"
reason = "The hundreds digit is missing from the printed value: the table's five-character column drops it (the photoionisation column beside it prints six characters). At 23.0 eV the total photoionisation is 118.58, and the absorption cannot be six times smaller than the ionisation it contains; with 120.80 the ratio is 0.98, as at the neighbouring energies (22 eV 0.96, 26 eV 0.97)."
evidence = "Table image tbl_643f8c4f78a2.jpg (p. 331): the cell reads '20.80', right-aligned like its neighbours, beside '118.58' in the Total Photo-Ionization column; the absorption column's other values near the 23 eV shape resonance are 82.20 (22 eV) and 88.10 (26 eV). Only a leading 1 gives a physical ratio (a 2 would make the ionisation efficiency 0.54 above 20 eV, where the paper assumes about 1, p. 302). gallagher_1988's Fig. 95, as its record describes it, shows these data peaking at about 150 Mb near 23 eV; the corrected 24.0 eV value is 135.30 x 1.0975 = 148 Mb."

