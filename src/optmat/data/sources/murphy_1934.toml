citation = "G. M. Murphy and H. Johnston, \"The nuclear spin of deuterium\", Phys. Rev. 46, 95 (1934)"
doi = "10.1103/physrev.46.95"
library = "Murphy_1934_NuclearSpinDeuterium"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Photographic photometry of the alternating intensities in emission of the \
Delta v = 0 sequence of the D2 Fulcher bands (P, Q and R branches of the (0,0)-(4,4) \
bands), second order of a 21-foot concave grating (1.3 A/mm), H-type discharge tube \
(4100 V, 0.75 A), gas from electrolysis of water with more than 90 % deuterium; four \
plates calibrated with density marks (pp. 96-97)."""
notes = """The direct source for the D2 nuclear-spin weights (TC-105; raj_2018 \
uses 6 for even J and 3 for odd J). Page numbers are the journal's (95-98; pdf page 1 = \
p. 95, which begins with the end of the preceding article).

What the paper states: Abstract (p. 95): 'The average value of g_s/g_a obtained from 4 \
plates is 1.97 +- 0.03. This value agrees best with the theoretical ratio of 2 and a \
consequent nuclear spin of 1. Since the even rotational levels are more intense than \
the odd levels, the nucleus obeys Bose-Einstein statistics.' Method (p. 97): 'In the \
hydrogen molecule it is known that levels with even values of J are symmetric in the \
nuclei and those with odd J are antisymmetric', and the nuclear spin i follows from \
g_s/g_a = (i + 1)/i (Eq. 2) for Bose-Einstein statistics (i/(i + 1), Eq. 3, for \
Fermi-Dirac); g is 'the statistical weight due to nuclear spin' in I = C g w exp(-E/kT) \
(Eq. 1). Table II (p. 98) lists g_s/g_a per band, branch and plate (plate averages \
1.94 +- 0.05, 1.93 +- 0.06, 2.07 +- 0.05, 1.94 +- 0.05); 'Weighted average of 4 plates \
g_s/g_a = 1.97 +- 0.03'. Conclusion (p. 98): 'it immediately follows that the nuclear \
spin of deuterium is 1 and since the symmetric levels are more intense than the \
antisymmetric levels the nucleus obeys Bose-Einstein statistics. The value given for \
g_s/g_a is the weighted mean of the results for the 4 plates, and the deviation given \
is the probable error. With a nuclear spin of 1/2 or 3/2, the intensity alternation \
would be 3 : 1 or 1.66 : 1'.

So the paper states the ratio of the weights, even J : odd J = 2 : 1 (measured 1.97 +- \
0.03, probable error), and the spin 1 with Bose-Einstein statistics; it does not print \
the absolute weights 6 and 3. Those follow from i = 1 as (2i + 1)(i + 1) = 6 and (2i + \
1) i = 3, the standard counts of symmetric and antisymmetric spin states, which this \
paper's Eq. (2) expresses as their ratio. For the thermal average only the ratio \
matters, so the paper directly supports raj_2018's 6 : 3.

No refractive data: no datasets. Table I (log intensities of the (2,2) band lines) and \
Table II are spectroscopic intensity data, not extracted."""
