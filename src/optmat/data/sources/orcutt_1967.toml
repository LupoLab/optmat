citation = "R. H. Orcutt and R. H. Cole, \"Dielectric Constants of Imperfect Gases. III. Atomic Gases, Hydrogen, and Nitrogen\", J. Chem. Phys. 46, 697 (1967)"
doi = "10.1063/1.1840728"
library = "Orcutt_1967_DielectricConstantsImperfect"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Dielectric constants from three identical three-terminal parallel-plate \
capacitance cells (geometric capacitance 100.15 pF) and a transformer bridge (2e-5 pF \
sensitivity) against a thermostated 100 pF standard. B_eps from a modified Burnett \
(cyclic) expansion among the three cells to below 150 atm, the density ratio after \
three expansions (2/3)^3 known to second order (Eqs. 2-5); A_eps from separate runs \
below 7 atm with a quartz Bourdon gauge recalibrated against a pressure balance \
(0.03 %), f - B'(P/RT)^2 fitted linearly in P/RT with B' = B_eps - A_eps B_p from PVT \
data (p. 698). Matheson gases used as received (pp. 697-699)."""
notes = """Definitions (p. 697): f/d = (eps - 1)/((eps + 2) d) = A_eps + B_eps d + C_eps d^2 \
(Eq. 1), d the molar density, A_eps = 4 pi N_0 alpha/3 for nonpolar gases: A_eps is the \
package's molar refractivity in the static limit and B_eps its refractivity virial \
coefficient ('dielectric, for a static value'). The measurement is at the capacitance \
bridge's (unstated, audio) frequency: static.

Temperature: 'Final values of A_eps and B_eps for the six gases at 49 degrees C are \
listed in Table II' (p. 699; abstract: 49 degrees C), stored as 322.15 K; the \
apparatus section says the assembly 'was kept at 40.0 degrees C' (p. 698) and the \
figure captions say 50 degrees C, so the temperature is uncertain to a few degrees \
(49 taken as the authors' statement of the results). Table II's values include a \
correction for the pressure dependence of the cells' geometric capacitance (k = 0.19e-6 \
/atm): +0.0017 cm^3/mol to A_eps and +0.019 (He) to -0.094 (Kr) cm^6/mol^2 to B_eps \
(p. 699). Impurities (p. 698): He total 0.005 %; Ne He 44 ppm; Ar O2 3, N2 18 ppm; Kr \
O2 2, N2 15, Ne 12 ppm; H2 O2 0.5, N2 5 ppm, hydrocarbons 0.2 ppm; N2 O2 3, H2O 4 ppm. \
Precision: +-1 ppm in capacitance or +-0.02 % in eps - 1 (p. 699).

Not extracted: Table I (the per-run A_eps and B_eps before the capacitance \
correction; its cells merge the stacked runs: He 0.5174 +- 0.0007 and B -0.050 +- 0.05, \
-0.098 +- 0.05; Ne 0.9970 +- 0.0008, 0.9936 +- 0.0013 and B -0.32 +- 0.10; Ar 4.140 +- \
0.002, 4.142 +- 0.003 and B 0.40 +- 0.20; Kr 6.264 +- 0.003, 6.266 +- 0.003 and B 5.7 +- \
0.3; H2 2.031 +- 0.001 and B 0.22 +- 0.20, -0.15 +- 0.15, -0.02 +- 0.05; N2 4.388 +- \
0.002 and B 0.65 +- 0.30, 0.83 +- 0.20); Table II's quadrupole-induced contributions \
(H2 0.018, N2 2.4 cm^6/mol^2, with Q = 0.6e-26 and 1.9e-26 esu cm^2, p. 701); Table \
III's refractive-index virial coefficients averaged over 4471-6678 A (Ar 25 degrees C: \
A_n 4.257 +- 0.010, B_n -1.0 +- 1.0, Michels and Botzen 1949; N2 25 degrees C: 4.470 +- \
0.005, 0.8 +- 0.8, Michels et al. 1947; CO2 50 degrees C: 6.679 +- 0.006, 5.3 +- 0.9, and \
100 degrees C (4471-5876 A): 6.724 +- 0.010, 2.7 +- 1.4, Michels and Hamers 1937), which \
have no single wavelength ('extrapolations to infinite wavelength not being \
practical', p. 701); the B_n unit is printed cm^3/mole^2 (for cm^6/mole^2). Also: \
B_tf(CO2) = 7.6 and B_eps(CO2, 50 degrees C) = 43 cm^6/mol^2 (quadrupole effects, \
Ref. 4; p. 701); the low-pressure He slope B' = -8.5 vs -6.1 calculated, Kr +284 vs \
+274 (p. 699).

Table II's note defines a-d only: the N2 literature B marked e is unidentified. The \
A_eps are static and include no infrared or orientation contributions for these \
nonpolar gases beyond the (small) vibrational polarizability of H2 and N2. \
achtermann_1991 reproduces the He values (0.519 +- 0.001, -0.06 +- 0.04, 'at 323 K') and \
the H2 B_tf (0.036)."""

