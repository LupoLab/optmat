citation = "L. Pan, K. T. Taylor and C. W. Clark, \"Perturbation theory study of high-harmonic generation\", J. Opt. Soc. Am. B 7, 509 (1990)"
doi = "10.1364/josab.7.000509"
library = "Pan_1990_PerturbationTheoryStudy"
identity = "VALIDATED_WITH_WARNINGS"
kind = "theory"
technique = """Lowest- and next-lowest-order perturbation theory for harmonic generation by \
hydrogenic ions (Z scaling, Eq. 10): the q-th order susceptibility chi_q(-q omega; \
omega, ..., omega) as the sum over the q + 1 time orderings of the q-th order perturbed \
wave functions (Eqs. 1-5), solved as inhomogeneous equations in a Sturmian basis \
(Appendix A) with complex coordinate rotation above threshold; the next order \
chi_q^(2) (coefficient of F^(q+2)) gives critical intensities. Hydrogen 1s in a \
Nd:YAG (1064 nm) field, 3 <= q <= 33 (q <= 29 at next order)."""
notes = """Pages: PDF page n is journal page 508 + n (pp. 509-516). Identity checked \
against the first page (J. Opt. Soc. Am. B 7, No. 4, April 1990).

NOTHING TAKEN. The paper is about atomic hydrogen and harmonic generation; it prints \
no two-photon ionisation cross section of any gas. The 'Pan et al.' that McKenna and \
van der Hart cite for argon's two-photon cross section ('within 20% of 0.85 x 10^-50 \
cm4 s', mckenna_2004 p. 465) is a different paper by different authors: McKenna's \
reference list prints 'Pan C, Gao B and Starace A F 1990 Phys. Rev. A 41 6271' (C. Pan, \
B. Gao and A. F. Starace; mckenna_2004's notes), not in the library. This paper's \
first author is Liwen Pan, and it shares the year and the surname only.

WHAT IT HOLDS. Table 1 (p. 512, tbl_be7ea64a3db8, checked against the image): for H 1s \
at 1064 nm, |chi_q| (a.u.) for q = 3-33 (2.78(2) at q = 3 to 3.01(51) at q = 33), \
|chi_q^(2)| (a.u.) for q = 3-29, the critical intensities I_c(q) of Eq. 15 (q = 3-31) \
and I_c'(q) of Eq. 21 (q = 3-29). Fig. 1: chi_3 against the energy of the highest \
virtual state with the fit functions a(eps), b(eps) of Eqs. 11-13 (no coefficients \
printed); Fig. 2: |chi_21|^2 against the effective quantum number; Figs. 3-4: relative \
harmonic yields and I_c. Not taken: these are harmonic-generation susceptibilities of \
atomic hydrogen in the paper's own normalisation (Eq. 1: the bare sum over the q + 1 \
time orderings, no prefactor), not the Taylor-series gamma the third-order quantities \
use, and hydrogen's third-order response is not curated. Table 2 (p. 513, \
tbl_e9d1ec768f53), 'Ionization Potentials U, Static Polarizabilities alpha, and \
Low-Order Susceptibilities chi_q of Hydrogen and the Noble Gases at the Nd:YAG \
Frequency': He-Xe U to 0.1 eV, alpha (Miller and Bederson 1977, Ref. 14) and the \
noble-gas chi_3, chi_5, chi_7 (esu) 'reported in Ref. 2' (X. F. Li, A. L'Huillier, M. \
Ferray, L. A. Lompré and G. Mainfray, Phys. Rev. A 39, 5751 (1989), not in the \
library), with hydrogen's (chi_3 1.4e-37, chi_5 1.5e-49, chi_7 1.2e-60 esu): all but \
the hydrogen row reproduced, rounded; not taken.

INTERNAL INCONSISTENCIES (text against Table 1, as printed): p. 512 says 'the highest \
is I_c(31) = 2.77 x 10^14 W/cm^2', the table prints 3.77 (14); p. 513 says 'The lowest \
value among them is I_c(19) = 1.66 x 10^11 W/cm^2' of the next-order I_c'(q), the \
table prints I_c'(19) = 1.79 (11) and I_c'(21) = 1.66 (11). No values taken, so no \
errata.

FURTHER TWO-PHOTON DATA CITED: M. Fink and P. Zoller, Phys. Rev. A 39, 2933 (1989), \
'A quantum defect parameterization of perturbative two photon ionization cross \
sections' (Ref. 12, for the analytic structure of Eq. 11), not in the library."""
