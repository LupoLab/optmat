reason = "A misprinted leading digit: helium's first ionisation energy is 24.59 eV to the printed digits, and the same group gives it as 0.904 hartree (24.60 eV) in tong_2005 Table 2 and zhao_2010 Table I; Table II's other four atoms agree to the printed digits with the compiled values in the library (Ne 21.56, Ar 15.76, Kr 14.00, Xe 12.13 against hohm_2012's CRC values 21.56454, 15.759610, 13.99961, 12.12984). Which I_p entered the fit of He's C_l = 3.13 is not stated."
evidence = "Table II image (p. 3) prints 23.59 (checked 2026-09-26); hohm_2012 ip1_He 24.587387 eV (CRC Handbook), wang_2021 ip_expt_He 24.587 eV (Moore 1970), tong_2005 ip_He and zhao_2010 table1_expt_He 0.904 hartree."
