[datasets.uncertainty]
column = true
level = "not stated"

[[datasets]]
id = "ae_NOplus"
material = "N2O"
table = "text"
quantity = "appearance_energy"
unit = "eV"
abscissa = "label"
use = "primary"
points = [
    ["first_observed", "first observed, very weakly, ~839.5 A", "14.77"],
    ["threshold", "threshold with considerably greater intensity, ~828 A", "14.97"],
]
notes = """pp. 2742-2743 (TC-965): 'NO+ is first observed, very weakly, at ~ 839.5 A = \
14.77 eV, and with considerably greater intensity at a threshold of ~ 828 A = 14.97 eV. \
This is substantially above the thermochemical threshold for this process (14.19 eV)'. \
The paper's mechanism: autoionisation of Rydberg states to the slowly dissociating \
4A'' state, the ion surviving ~3e-7 s. The eV values are the paper's conversions of the \
approximate wavelengths; no uncertainty is stated. Photon resolution 0.14 A FWHM \
(Fig. 2(b))."""
[datasets.parameters]
fragment = "NO+"

[[datasets]]
id = "ae_Nplus"
material = "N2O"
table = "text"
quantity = "appearance_energy"
unit = "eV"
abscissa = "label"
use = "primary"
points = [["onset", "onset of the abrupt rise, 617.6 A", "20.075"]]
notes = """p. 2748 (TC-965): 'In the photoion yield curve for N+ (Fig. 5) we note a \
rather abrupt rise beginning at 617.6 A = 20.075 eV, well above the thermochemical \
threshold' (19.494 eV at 0 K, 636.0 A). The linear rise runs 617.60-616.85 A \
(20.075-20.199 eV) and levels off at 20.100 eV, just below the C 2Sigma+ limit 20.105 \
eV; the paper relates the width (0.025 eV, about kT) to rotational energy or the \
thermally populated (010) level. Weak N+ below the onset is attributed partly to \
collision-induced dissociation. No uncertainty is stated."""
[datasets.parameters]
fragment = "N+"

[[datasets]]
id = "t4_Oplus"
material = "N2O"
file = "N2O/berkowitz_1977__t4_Oplus.csv"
table = "tbl_130104e0aa54"
quantity = "fragmentation_branching_ratio"
unit = "1"
scale = 0.01
abscissa = "wavelength"
abscissa_unit = "angstrom"
use = "primary"
notes = """Table IV (p. 2745; TC-965): O+ intensity with N2O+ = 100, at the peak \
~798.3 A, the valley ~792 A and the peak ~782 A of the A-state autoionisation (the \
wavelengths printed with '~'). Scale 0.01: the printed numbers are per 100 N2O+. The \
paper: 'essentially all of the O+ intensity ... derives from autoionization', so a \
584 A measurement 'would strongly discriminate against O+' (p. 2745). No uncertainty \
is stated."""
[datasets.parameters]
channel = "O+ + N2"
reference = "N2O+ (the parent ion) = 100, as printed"
excitation = "photoionisation at the abscissa's wavelength (helium Hopfield continuum, 0.14 A FWHM)"
detection_correction = "none stated (quadrupole mass spectrometer, ion counting)"

