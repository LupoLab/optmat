points = [["1", "N2O", "16.388", "0.001"]]
notes = """p. 2742 (and Table I): the common limit of the Rydberg series converging on A \
2Sigma+ (000), 16.388 +- 0.001 eV. Level not stated."""
[datasets.parameters]
kind = "adiabatic"
final_state = "A 2Sigma+ (000)"

[datasets.uncertainty]
column = true
level = "not stated"

[[datasets]]
