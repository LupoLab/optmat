notes = """Table IV (p. 2745; TC-965): NO+ intensity, printed as '15NO+ + 14NO+' (NO+ \
'both mechanisms', p. 2745), with N2O+ = 100. The column's label suggests the sum was \
taken from the 14N15NO sample (1 m monochromator, ~0.7 A, magnetic mass spectrometer); \
