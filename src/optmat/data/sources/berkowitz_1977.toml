notes = """p. 2746 (and Table VI's caption): five Rydberg series 'all converging to \
20.105 +- 0.002 eV, the ionization potential of the C 2Sigma+ state'. The vibrational \
level of the limit is not stated (the series are assigned to the state, not to a \
