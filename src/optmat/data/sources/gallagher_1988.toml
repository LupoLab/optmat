O3 is not in the compilation (the 21 molecules are H2, N2, O2, CO, NO, CO2, N2O, H2O, \
NH3, CH4, HF, HCl, HBr, HI, H2S, CS2, OCS, SO2, SF6, Cl2, CCl4, p. 9), nor are the \
noble gases.

Partial photoionisation and fragmentation (for later; figures only): electronic \
partial cross sections, asymmetry parameters and fragment-ion cross sections are in \
