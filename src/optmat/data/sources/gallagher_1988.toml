citation = "J. W. Gallagher, C. E. Brion, J. A. R. Samson and P. W. Langhoff, \"Absolute cross sections for molecular photoabsorption, partial photoionization, and ionic photofragmentation processes\", J. Phys. Chem. Ref. Data 17, 9 (1988)"
