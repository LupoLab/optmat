H2 (Table 2, p. 30, tbl_cad1ba9400d3; Fig. 10, p. 31; not in the +-5 % list): Cook \
1964 (ref. 166; G. R. Cook and P. H. Metzger, J. Opt. Soc. Am. 54, 968 (1964); not the \
