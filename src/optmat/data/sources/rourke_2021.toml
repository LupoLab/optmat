quantity = "molar_refractivity"
unit = "cm3/mol"
abscissa_unit = "nm"
use = "check"
reproduced_from = ["puchalski_2016", "M. Puchalski, K. Szalewicz, M. Lesiuk, and B. Jeziorski, Phys. Rev. A 101, 022505 (2020)", "K. Pachucki and M. Puchalski, Phys. Rev. A 99, 041803(R) (2019)"]
notes = "Table 3: A_R = 0.52025565(5) cm^3/mol at 632.9908 nm (note a), assembled by Rourke: Puchalski et al.'s (2016) frequency dependence added to Puchalski et al.'s (2020) A_eps, with Pachucki and Puchalski's retardation correction (-0.140 ppm at 633 nm, no uncertainty) (p. 13). Includes A_mu (Eq. (3) with A_R in place of A_eps + A_mu). Derived from theory: a check."
[datasets.uncertainty]
column = true
level = "1 sigma"

