unit = "cm3/mol"
abscissa_unit = "nm"
use = "reproduced"
reproduced_from = ["gaiser_2018"]
notes = "Table 3: recommended static A_eps = 0.9947114(24) cm^3/mol, Gaiser and Fellmuth 2018 (DCGT)."
[datasets.uncertainty]
column = true
level = "1 sigma"

