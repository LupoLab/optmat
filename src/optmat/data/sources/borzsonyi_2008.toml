check = "As printed the formula fails: at 546.2258 nm, 0 degrees C, 1013.25 mbar n - 1 = 683.7e-6 against Leonard's 706.60 (-3.2 %), and at 800 nm, 1000 mbar, 19.9 degrees C SGDD = 1.17 against 87.42 +- 0.17 fs^2/m measured: with both poles below 24 nm the formula has almost no dispersion. With C1 = 12.75e-3 um^2 (the column factor 10^3, not 10^6): n - 1 = 707.09e-6 at 546.2258 nm (+0.07 % from Leonard), SGDD 88.54, SGD 2197.8 (2225.4 printed), STOD 42.6 (40 +- 12) (checked 2026-09-24; STOD corrected at the second read, 2026-09-25)."
notes = "Corrected form: C1 = 12.75e-3 um^2 (pole at 113 nm), the other coefficients as printed. The correction is established by the paper's own 800 nm measurements and Leonard's 546 nm value, which it reproduces; no other single change of one coefficient's power of ten does (C2 = 0.0561 gives SGDD 147; C1 = 12.75e-4 gives 9.3). Luna's PhysData.jl (read-only reference) uses C1 = 12750e-6, the same correction. Table 2 'Std. Dev.': 43.25e-8."

