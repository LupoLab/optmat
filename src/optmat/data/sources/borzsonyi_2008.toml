terms = { B = ["39209.95e-8", "18806.48e-8"], C = ["1146.24e-6", "13.476e-3"] }
range_nm = [400.0, 1000.0]
material = "N2"
equation = "Eq. (14), p. 7, with Table 2 (tbl_8d505c3d8e77)"
printed = "n^2(lambda, p, T) - 1 = (p/p0) (T0/T) [B1 lambda^2/(lambda^2 - C1) + B2 lambda^2/(lambda^2 - C2)]; B1 x 10^8 = 39209.95, C1 x 10^6 = 1146.24, B2 x 10^8 = 18806.48, C2 x 10^3 = 13.476"
variable = "lambda: vacuum wavelength in um"
state = { pressure_pa = 100000.0, temperature_c = 0.0 }
density = "ideal"
range = "fitted to three literature n values in the visible (Peck & Khanna 1966) and the SGDD at 800 nm; compared with the literature over 400-1000 nm (Fig. 5)"
coefficients = { B1 = "39209.95e-8", C1 = "1146.24e-6", B2 = "18806.48e-8", C2 = "13.476e-3" }
check = "At 546.2258 nm, 0 degrees C, 1013.25 mbar: n - 1 = 299.15e-6 (Peck & Khanna: 299.14e-6). At 800 nm, 1000 mbar, 19.4 degrees C: SGDD 19.67 fs^2/m against 18.04 +- 0.15 measured (9 % high), SGD 925.8 against 947.4 fs/m, STOD 4.9 against 10 +- 10 fs^3/m (checked 2026-09-24)."
notes = "Pressure and temperature enter as the ideal-gas density ratio (p/p0)(T0/T) on n^2 - 1 (derived from Eq. 6 with Z = 1). T0 is '273 K' in the text (p. 7) and '0 degrees C' in Table 2's caption; the difference is 0.05 %. Table 2's 'Std. Dev.' of the literature n from the fit: 5.46e-8."

