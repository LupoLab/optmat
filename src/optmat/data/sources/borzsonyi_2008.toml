citation = "A. Borzsonyi, Z. Heiner, M. P. Kalashnikov, A. P. Kovacs and K. Osvay, Appl. Opt. 47, 4856 (2008)"
doi = "10.1364/ao.47.004856"
library = "Borzsonyi_2008_DispersionMeasurementInert"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Spectrally and spatially resolved interferometry (Mach-Zehnder plus imaging \
spectrograph) with a Ti:sapphire oscillator (peak 767 nm, 115 nm wide at the 10 % \
level); the sample arm is a 4.5 m tube, double-passed (geometrical propagation length \
9.110 +- 0.003 m, p. 4). Gas pressure set at 18 points from 1 bar to 0.05 mbar \
(capacitance gauges), 'pressure up' and 'pressure down' series; nine interferograms \
per pressure, the extremes dropped and seven averaged (p. 4). Laboratory at \
19.7 +- 1 degrees C, stable to 0.2 degrees C within a series. Purity 99.999 % \
(Xe 99.996 %)."""
notes = """The phase derivatives are measured relative to the lowest pressure: linear \
fits in pressure of GD, GDD and TOD are assumed to vanish at 0.05 mbar (p. 5), and \
Table 1 gives the specific (per metre) values 'deducted for 1000 mbar' (p. 5) at 800 nm \
(omega0 = 2.35 fs^-1, a vacuum wavelength) and at the laboratory temperature of each \
measurement (Table 1, 19.4-20.8 degrees C, +-0.2). Table 1's caption says '800 nm, \
1000 mbars, and 20 degrees C'; the per-gas temperature column is used as the state. \
No reduction to another state is made, so the values refer to the real gas at that \
state (density = real); the paper's own theory (Eqs. 6-11) takes Z = 1. The stated \
errors are not defined for the table; each measured point's error is 'the standard \
deviation of these seven points from their averaged value' (p. 4). The paper claims \
SGD to 1 part in 1000 and SGDD to 1 in 400 (p. 5).

The SGD column is kept as a check, not fitted: every gas's SGD lies 22-39 fs/m above \
what its refractivity implies (the paper's own Sellmeier fits give, at the measured \
state, He 107.5 against 146.0 printed, Ne 207.1 / 241.7, N2 925.8 / 947.4, Ar 870.0 / \
895.2, Kr 1334.5 / 1366.2, Xe 2198 / 2225.4 fs/m, the Xe fit with its C1 corrected, \
see the formula). For helium the refractivity is known to 0.1 % and implies about \
108 fs/m, so the 146.0 +- 1.0 printed cannot be the excess group delay of helium; a \
common additive offset of about +30 fs/m (a 9 um path error over 9.11 m, or the air \
term SGD_air * dL of Eq. 5) is the likeliest cause, but the paper gives no way to \
check it. The SGDD column is kept as a validator (use = check; 2026-09-24, TC-45), because it too disagrees with the precise \
interferometric dispersion of the literature: Peck & Khanna's N2 formula (peck_1966, \
Eq. 3, scaled to 1000 mbar and 19.4 C) gives SGDD = 19.84 fs^2/m at 800 nm against \
18.04 +- 0.15 printed (9 % low), and Peck & Fisher's Ar formula (20.8 C) 18.38 \
against 17.98 +- 0.11 (2 % low); their shapes are known to about 1e-4 in n - 1. \
Whether these SGDD values enter fits should be decided at review. STOD is only an \
upper limit (p. 5) and kept as a check.

The Lorentz-Lorenz constants of Table 1 (m^3/kg, 'This Work' and 'Calc. from \
Literature') are not extracted: the paper does not say how they were obtained from \
the group-delay data, and a check with the known refractivities (2/3 (n - 1)/rho at \
20 degrees C, 1000 mbar) reproduces the noble-gas values within 1-4 % but not \
nitrogen's (1.47 against 1.627), so their definition is unclear. Air (Table 1 and \
Table 2) is not a curated species and is skipped. The gas-mixture results (Fig. 4) are \
figures only.

The Sellmeier fits (Table 2, Eq. 14) are formulas below. They were fitted to only \
'three refractive indices from the literature' per gas (Leonard 1974 for the noble \
gases, Peck & Khanna 1966 for N2, CRC for air; refs. 18, 23, 42) 'and the SGDD taken \
from our measurements' (p. 7): they are not independent refractivity data, and the \
visible/UV behaviour is that of the three literature points. The printed xenon \
coefficient C1 is wrong by a factor 1000 (see the formula)."""

