corrected = "12.75e-3"
reason = "Table 2's column factor for C1 (10^-6) is wrong for xenon by 10^3: with both poles below 24 nm the printed formula has almost no dispersion (SGDD 1.17 against 87.42 fs^2/m measured at 800 nm) and gives n - 1 = 683.7e-6 at 546.2 nm against Leonard's 706.60e-6."
evidence = "With C1 = 12.75e-3 um^2 the formula gives SGDD 88.54 fs^2/m (87.42 measured), n - 1 = 707.09e-6 at 546.2258 nm (Leonard 706.60), SGD 2197.8 and STOD 42.6 (40 +- 12; 41.5 before the second read of 2026-09-25); no other single power-of-ten change works (2026-09-24). Luna uses 12750e-6."

