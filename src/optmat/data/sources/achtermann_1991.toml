citation = "H. J. Achtermann, G. Magnus and T. K. Bose, \"Refractivity virial coefficients of gaseous CH4, C2H4, C2H6, CO2, SF6, H2, N2, He, and Ar\", J. Chem. Phys. 94, 5669 (1991)"
doi = "10.1063/1.460478"
library = "Achtermann_1991_RefractivityVirialCoefficients"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Two coupled grating interferometers at the vacuum wavelength 632.99 nm (He-Ne): \
interferometer I (two matched cells in series, with compensation chambers) counts the \
fringe change Delta K during an isothermal overflow expansion into an evacuated twin \
cell, which measures the departure of n - 1 from proportionality to density (Eqs. \
7-12); interferometer II (cells in parallel) gives the absolute fringe count K and \
controls the expansion; expansions in both directions cancel cell mismatch (Eq. 8). \
Pressures to 35 MPa (to twice the critical density); cell and compensation-chamber \
distortion corrected (Eqs. 17-19). A_R from separate absolute n(P, T) isotherms, the \
pressure from the refractive index of nitrogen calibrated against a piston gauge, \
extrapolated to zero density with the virial equation of state (Eqs. 13-16). CO2, H2, \
N2, He, Ar and CH4 at 323.15 K; CH4, C2H4, C2H6, SF6 at 373.15 K (pp. 5669-5675)."""
notes = """Definitions (p. 5669): R_m = (n^2 - 1)/((n^2 + 2) rho) = A_R + B_R rho + C_R rho^2 + \
D_R rho^3 (Eq. 1), rho molar density: A_R is the package's molar refractivity and B_R \
its refractivity_virial_coefficient. The measured function is (n - 1)/rho = A_n + B_n \
rho + ... (Eq. 2) with A_R = 2 A_n/3, B_R = 2 B_n/3 - A_n^2/9, C_R = 2 C_n/3 - 2 A_n \
B_n/9 - 4 A_n^3/27 (Eqs. 3-5). Accuracy (p. 5670): 'A rough estimate of the accuracy \
of the measured first refractivity virial coefficient is A_R, +-0.02 % and the accuracy \
of the higher-order coefficients, except for H2 and He, is B_R, +-2-5 %; C_R, +-3-5 %; \
and D_R, +-30-50 %'. The B_R, C_R, D_R uncertainties of Table II are 'three standard \
deviations from the least-squares fit as well as errors due to cell distortion and \
adsorption' (p. 5675); the level of the A_R uncertainties and of the literature values \
is not stated. R = 8.314471 J/(K mol). Gas purities (Table I): CH4 99.9995 %, CO2 \
99.995 %, SF6 99.998 %, H2 99.999 %, N2 99.9995 %, He 99.996 % (Linde; O2 < 5, N2 < 20, \
H2O < 5, Ne < 10 ppm), Ar 99.998 %.

Wavelengths (Table II caption): the refractivity virial coefficients are at the vacuum \
wavelength 632.99 nm 'except for the values of CH4 from Olson (Ref. 9), (lambda = \
546.2 nm), C2H6 from Sliwinski (Ref. 10), (lambda = 589.3 nm), H2 from Diller (Ref. \
8), (lambda = 546.2 nm), the theoretical value for H2 from Orcutt and Cole (Ref. 36), \
(lambda infinite), and the values of He from Orcutt and Cole (Ref. 36) and Kirouac and \
Bose (Ref. 55), (lambda infinite)'. The classical (dipole-induced-dipole) theoretical \
B_R rows carry no wavelength and are stored at 632.99 nm; Dacre's helium B_eps (Ref. \
59) is static and stored at infinity. 'Calculated values of A_R have been computed from \
Landolt-Boernstein Tables (Ref. 23)' (caption): the A_R of the Theory rows. Temperatures \
printed '...' are stored with the row id 'unknown' and no temperature parameter.

Extracted (OEP 4, the quantity's order 3 and 4), Table II, cm^9/mol^3 and \
cm^12/mol^4: CH4 C_R -324 +- 5 (323 K, this work), -317 +- 10 (373 K, this work), -326 \
+- 10 (Achtermann et al. 1986), -345 +- 15 (Montixi and Coulon), -320 (Olson); CO2 -287 \
+- 8 (this work), -224 +- 40 (Jaeschke); SF6 C_R -2783 +- 130 and D_R 37 800 +- 8000 \
(373 K, this work); H2 -13.7 +- 2.0 (this work); N2 -99.8 +- 2.8 (this work), -107 +- 5 \
(Achtermann et al. 1986), -85 +- 10 (Montixi et al.); He: Kirouac and Bose's C_eps -0.84 \
+- 1.20, and this work's bound -1.0 < C_R < 0.4 (p. 5680, from the fringe-count error); \
Ar -86.6 +- 2.0 (this work), -79 +- 10 (Coulon et al.). Ethylene and ethane (C2H4 \
C_R -1591 +- 84, D_R 5540 +- 2100; C2H6 C_R -2227 +- 75, D_R 12 400 +- 3500, at 373 K) \
are not species. Table III's B_OR = B_eps - B_R, B_FIR and B_IR (collision-induced \
absorption) are not refractive quantities; its B_R column repeats this work's values \
(and 'estimated' ones, note c) except CH4 at 323.15 K, printed 6.11 +- 0.10 against \
Table II's 6.08 +- 0.10 (unresolved; Table II is extracted).

Helium (pp. 5675-5676, 5680-5682): Delta K for He at 323.15 K (15.3-35.7 MPa, ten \
repetitions at 35.7 MPa: -0.58 +- 0.10 fringes against K = 1351, distortion \
correction 0.56) is 'practically zero', so B_n = C_n = 0 and B_R = -0.068 comes only \
from -A_n^2/9; without the distortion correction it would be -0.1. 'To the best of \
our knowledge, B_R of He has never been measured before.' Puchalski et al. (2016) find \
this work's helium A_R 'ten times larger than their uncertainty' off the ab initio \
value (the measured A_R is A_eps + A_mu at 323 K). Olson's reference is printed \
'J. D. Olsen' in the reference list."""

