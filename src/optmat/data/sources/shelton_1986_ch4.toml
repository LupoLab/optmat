citation = "D. P. Shelton, Phys. Rev. A 34, 304 (1986)"
doi = "10.1103/physreva.34.304"
library = "Shelton_1986_HyperpolarizabilityDispersionMeasured_37a53a"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """ESHG with periodic phase matching as in shelton_1985_sf6 (electrode spacing \
2.69 mm, 0.9-5.9 atm at 20-27 C), cw dye or argon-ion laser, 0.3-3.0 W; dye-laser \
wavelengths set with a 1 m spectrometer calibrated by Na and Ne lamps; sample CH4 \
(99.97 %) and reference N2 (99.999 %) in triplets ABA or coupled triplets; densities \
from the virial equation of state (p. 1)."""
notes = """The by-product ratio Delta alpha_CH4 / Delta alpha_N2 (Delta alpha = \
alpha(2 omega) - alpha(omega)) 'is just proportional to rho^-1, the inverse \
phase-match density' (p. 1): it is rho_N2 / rho_CH4, filed under N2 with CH4 as \
reference_material as in shelton_1990. Table I gives the air wavelength (note a) and the \
vacuum wavenumber (note b) of the fundamental; the wavenumber is the abscissa, the \
air wavelength the row id.

Uncertainty (p. 1): 'The accuracy of the polarizability dispersion ratio has been \
given as +-0.20%, a conservative estimate based on the absolute pressure-gauge \
accuracy of +-0.15%. If the gauge is linear, the dispersion ratio accuracy will \
instead be set by the +-0.03% density ratio reproducibility. The correct value for \
the error bar is probably intermediate'; Table I note c: 'The tabulated error bars \
may be too pessimistic by as much as a factor of 7.' The tabulated +- are kept as \
printed (level not stated).

The gamma values, the gamma fits (Fig. 1) and Table II (other processes) are \
hyperpolarizabilities and are not extracted. Refractive indices for the local-field \
factors were 'calculated from tables' (Landolt-Bornstein).

THIRD-ORDER DATA (added 2026-09-26; supersedes the remark above that the \
gamma values are not extracted). gamma is the ESHG <gamma>_zzzz (fields parallel) of \
Shelton's series (Taylor convention, SI C^4 m^4 J^-3), calibrated on the old He value \
(Sitz & Yaris, 42.6 au static) through Mizrahi & Shelton's N2/He ratio (Eqs. 2, 3, as \
in shelton_1986_co2); the A, B, C of the fits below are against nu^2 of the \
fundamental, not nu_L^2. The electronic dispersion of all processes is written \
gamma^e(-omega_s; omega_1, omega_2, omega_3) = gamma^e(0; 0, 0, 0)(1 + C omega_L^2) \
(Eqs. 4-5). Part: the author compares ESHG, dc Kerr, FWM and THG and, with Elliott & \
Ward's estimate that the vibrational part is '3% or less for dc Kerr and an order of \
magnitude smaller still for ESHG', concludes that 'the vibrational contribution to \
gamma_CH4 is negligible' (p. 307; shelton_1990 later finds the 1319 nm ESHG point 12 \
sigma below this curve, attributed to gamma^vR). No vibrational-overtone resonance is \
seen at the 0.1 % level, contrary to shelton_1982's suggestion (p. 307)."""

[[datasets]]
id = "density_N2_over_CH4"
material = "N2"
file = "N2/shelton_1986_ch4__density_N2_over_CH4.csv"
table = "tbl_9090f1c5cfc2"
quantity = "phase_match_density_ratio"
abscissa_unit = "cm-1"
wavelength_medium = "vacuum"
density = "real"
use = "primary"
notes = "Table I, Delta alpha_CH4 / Delta alpha_N2 = rho_N2 / rho_CH4 as printed, 12 fundamentals 476.5-671.7 nm (air), abscissa the printed vacuum wavenumber."
[datasets.uncertainty]
column = true
level = "not stated"
[datasets.parameters]
reference_material = "CH4"
harmonic = 2
process = "ESHG (electric-field-induced second-harmonic generation), periodic phase matching"
definition = "rho_gas / rho_reference_gas at equal wave-vector mismatch |Delta k| = (4 pi / lambda) |n(2w) - n(w)|; to first order in density = [alpha_ref(2w) - alpha_ref(w)] / [alpha_gas(2w) - alpha_gas(w)]; lambda = fundamental"
sample_gas = "CH4"
shelton_reference_gas = "N2"
printed_as = "Delta alpha_CH4 / Delta alpha_N2"

[[formulas]]
id = "ratio_fit"
material = "CH4"
equation = "Fig. 2 caption, p. 3"
printed = "Delta alpha_CH4 / Delta alpha_N2 = A (1 + B nu^2 + C nu^4); A = 2.1029, B = 0.916 x 10^-10 cm^2, C = 1.69 x 10^-20 cm^4"
variable = "nu: vacuum wavenumber of the fundamental in cm^-1"
range = "14883-20981 cm^-1 (476.5-671.7 nm)"
coefficients = { A = "2.1029", B = "0.916e-10", C = "1.69e-20" }
check = "As printed (page image checked) it lies 0.016 below the data at 14883 cm^-1 and 0.063 below at 20981 cm^-1, outside every error bar. With C = 16.9 x 10^-20 cm^4 it reproduces all twelve points to within 0.0018 (the error bars are 0.0043-0.0046): C is misprinted by a factor of 10 (read 16.9 x 10^-20). Checked 2026-09-25."
notes = "A fit of the dispersion ratio, not of the refractive index. A straight line in nu^2 also passes through all the error bars (p. 3)."

