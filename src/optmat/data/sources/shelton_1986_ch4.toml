[[formulas]]
id = "gamma_fit_quadratic"
material = "CH4"
equation = "Fig. 1 caption, p. 305"
printed = "gamma = A(1 + B nu^2 + C nu^4); A = 149.1 x 10^-63 C^4 m^4 J^-3, B = 14.70 x 10^-10 cm^2 and C = 89.1 x 10^-20 cm^4, where nu is given in cm^-1"
variable = "nu: vacuum wavenumber of the fundamental in cm^-1 (not nu_L^2)"
process = "eshg"
convention = "T"
part = "total"
range = "14883-20981 cm^-1 (476.5-671.7 nm, Table I column d)"
coefficients = { A = "149.1e-63", B = "14.70e-10", C = "89.1e-20" }
coefficient_units = { A = "C^4 m^4 J^-3", B = "cm^2", C = "cm^4" }
calibration = "old He (Sitz & Yaris) via N2 (Eqs. 2, 3)"
check = "Gives 204.17 at 14883 cm^-1 and 271.33 at 20981 cm^-1 against 204.1 +- 0.9 and 271.0 +- 1.8. Checked 2026-09-26."
notes = "Least-squares fit to the 12 present values; 'the scatter of data points about the quadratic curve is in better agreement with the statistical estimate of the measurement reproducibility' than a straight line (p. 305)."

