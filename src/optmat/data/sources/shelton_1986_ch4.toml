unit = "1"
abscissa_unit = "cm-1"
use = "check"
notes = "Table I (p. 305): gamma_CH4/gamma_N2 by ESHG as printed (Eq. 1 as in shelton_1986_co2), 12 wavelengths 476.5-671.7 nm (row: air wavelength; abscissa: vacuum wavenumber). 'The accuracy of the ratio is about +-0.3%, while the reproducibility is about +-0.1%' (p. 304). The raw measurement behind gamma_CH4."
[datasets.uncertainty]
column = true
