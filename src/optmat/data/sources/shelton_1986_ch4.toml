notes = "Table I column d (p. 305): gamma_CH4 in 1e-63 C^4 m^4 J^-3, 'Obtained using Refs. 13 and 19 for calibration' (Mizrahi & Shelton's gamma_N2/gamma_He = 20.30 [1 + 6.55e-10 nu^2] and Sitz & Yaris's gamma_He = 42.6 au [1 + 2.94e-10 nu^2], 1 au = 6.2360e-65; see shelton_1986_co2's formulas calibration_*). '+-0.4% due to the gamma_N2/gamma_He calibration' is included in the error bars; the ~1 % uncertainty of gamma_He is not (p. 305). The old He calibration; shelton_1990 Table III(c) reproduces these rescaled (e.g. 206.76 against 204.1 at 671.7 nm). Total ESHG gamma; the author concludes that 'the vibrational contribution to gamma_CH4 is negligible' (p. 307)."
[datasets.uncertainty]
