[[formulas]]
id = "n2_minus_1_He"
material = "He"
equation = "unnumbered, p. 428"
printed = "n^2 - 1 = 6.927 x 10^-5 (1 + 2.24 x 10^5/lambda^2 + 5.94 x 10^10/lambda^4 + 1.72 x 10^16/lambda^6 + ...)"
variable = "lambda: wavelength in Angstrom (medium not stated; the fitted data mix the 1910 air and the 1932 vacuum wavelengths, a difference of 3e-4 in lambda)"
state = "1atm_0C"
density = "ideal"
range = "the Cuthbertsons' visible and near-UV data; 'values in harmony with the available experimental data at all wavelengths' (p. 428)"
coefficients = { a = "6.927e-5", c2 = "2.24e5", c4 = "5.94e10", c6 = "1.72e16" }
check = "Static limit 1.3845 a.u. (Table 2: 1.384); n - 1 = 3.4897e-5 at 5462 A (Cuthbertson 1932: 3.489e-5). Lorentz-Lorenz at Loschmidt's number with a0^3 = 1.482e-25 cm^3. Checked 2026-09-24."
notes = "A Cauchy series in S(-2k); the paper's form of n^2 - 1 (Eq. 2), not n - 1. Truncated where printed ('...')."

