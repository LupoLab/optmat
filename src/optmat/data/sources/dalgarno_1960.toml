unit = "au"
scale = 1
abscissa = "order"
abscissa_unit = "1"
use = "check"
notes = "Table 1, helium S(0) 'exact' (from Dalgarno and Stewart's oscillator strengths; S(-1) from Pekeris), in Ry^0; scale 2^(0) gives atomic units."

