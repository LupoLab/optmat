citation = "A. Dalgarno and A. E. Kingston, Proc. R. Soc. London A 259, 424 (1960)"
doi = "10.1098/rspa.1960.0237"
library = "Dalgarno_1960_RefractiveIndicesVerdet"
identity = "VALIDATED_WITH_WARNINGS"
kind = "fit"
technique = """Semi-empirical: n^2 - 1 expanded in the Cauchy sums S(-2), S(-4), S(-6), ... \
(Eq. 2); S(-2) and S(-4) estimated from long-wavelength refractive indices of \
Cuthbertson and Cuthbertson (1911, 1932) and Korff and Breit (1932), the higher sums \
from the interpolation formula S(k) = {a + b/(2.5 - k) + c/(2.5 - k)^2}^k S(0) \
(Eq. 18) with a the first excitation energy (pp. 424-429)."""
notes = """Not independent data: the polarizabilities and dispersion formulas are derived \
from Cuthbertson and Cuthbertson's refractivities (cuthbertson_1910, cuthbertson_1932) \
and Korff and Breit's (1932) compilation. Energies are in rydbergs, so S(k) is in \
Ry^k: the datasets convert with scale 2^-k. Eq. (1) gives n^2 - 1 'at atmospheric \
pressure' with the prefactor 2.00e-4 (4 pi N a0^3 with Loschmidt's number, i.e. \
0 degrees C, 1 atm, ideal gas); the Cuthbertsons' data are for 0 degrees C, 760 mm.

Table 1's helium 'exact' S(k) are sums over Dalgarno and Stewart's (1960) oscillator \
strengths (S(-1) from Pekeris), the other column Eq. (18); atomic hydrogen's are not \
extracted (H is not a curated species). Table 3 (expectation values of (sum r_i)^2) \
and the Verdet-constant formulas (in microminutes, from Eq. 5) are not extracted: \
they are not dispersion data (the Verdet formulas are consequences of the n^2 - 1 \
series). The Kr n^2 - 1 formula has no element label in the library's Markdown; it \
is the fourth of the five (He, Ne, Ar, Kr, Xe order).

Consistency (checked 2026-09-24): the static limits of the n^2 - 1 formulas, converted \
with Lorentz-Lorenz at Loschmidt's number and the paper's a0^3 = 1.482e-25 cm^3, \
give He 1.384, Ar 11.084, Kr 16.737, Xe 27.29 (Table 2: 1.384, 11.080, 16.734, \
27.292) but Ne 2.668 against Table 2's 2.663 (0.2 %); not resolved. The He formula \
gives n - 1 = 3.4897e-5 at 5462 A, Cuthbertson and Cuthbertson's 3.489e-5."""

