citation = "C. Hosticka and T. K. Bose, \"Dielectric and pressure virial coefficients of imperfect gases: Hexadecapolar system\", J. Chem. Phys. 60, 1318 (1974)"
doi = "10.1063/1.1681197"
library = "Hosticka_1974_DielectricPressureVirial"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Static dielectric constants of SF6 in two three-terminal capacitance cells \
(Sutter and Cole) with a General Radio 1615A decade transformer bridge; cells in a \
circulating bath with a proportional controller, temperature to 0.05 degrees C (NBS \
thermometer), pressure 0-200 psi on a calibrated quartz Bourdon gauge. B_eps and C_eps \
from the two-cell cyclic expansion method (Eq. 3: Delta f_i = f_i - R^-1 f_(i+2), R the \
density ratio after two expansions, fitted linearly in f_i); A_eps and B_p from \
measurements at known pressures (Eq. 4, second-order polynomial in P/RT). 323.3, 348.3 \
and 373.9 K; Matheson research-grade SF6, minimum purity 99.8 % (air and CF4 the main \
impurities) (pp. 1318-1319)."""
notes = """Identity checked against the first page (J. Chem. Phys. 60, 1318 (1974), \
received 3 October 1973). Page numbers are the journal's: pdf page 1 is the publisher's \
cover, so p. = pdf page + 1316. The 'hexadecapolar gas' is SF6 only (no CF4 in this \
paper).

WHAT THE VALUES ARE (p. 1318). [(eps - 1)/(eps + 2)]/d = A_eps + B_eps d + C_eps d^2 + \
... (Eq. 1, d the molar density): A_eps is the static molar polarization, for \
non-polar SF6 the static polarizability including its large vibrational ('atomic') \
part (SF6's A_eps is 16.5 cm^3/mol against the optical A_R of about 11.3, \
achtermann_1991); B_eps and C_eps are the STATIC DIELECTRIC virial coefficients, B_eps \
= B_ind + B_or with the orientation term from dipoles induced by the hexadecapole \
moment of the partner. Stored as bose_1972 does: molar_refractivity (A_eps) and \
refractivity_virial_coefficient (order 2, 3) at infinite wavelength, use = check, \
never as optical values. 'The mean value of the polarizability determined from our A_eps \
values is alpha = 6.560 x 10^-24 cm^3 for SF6' (p. 1319; dataset alpha_mean_SF6; the \
three-temperature mean A_eps = 16.548 gives 6.5599e-24 with 3/(4 pi N_A), checked).

UNCERTAINTY: 'The error associated with our coefficients is three times the standard \
deviation' (p. 1319): '3 sigma'.

ERRATUM. Table I prints the 323.3 K C_eps as '6900 +- 899' (image checked: no minus \
sign), where the other temperatures give -6895 +- 541 and -6883 +- 1421 and the \
literature (Nelson and Cole, Ref. 1) -6400 at the same 323.3 K. C_eps is found from the \
slope of Delta f_i/f_i^2 against f_i (p. 1319), and Fig. 1 shows the three temperatures' \
lines parallel with one negative slope, so the 323.3 K C_eps has the sign of the others: \
the minus sign is lost in print. Corrected to -6900 by an erratum.

DISCUSSION VALUES (not extracted; no quantity). From B_eps against 1/T (Ref. 13, the \
method of bose_1972): B_ind = 28.04 cm^6/mol^2 ('rather crude', p. 1319). Hexadecapole \
moment Phi_eps = (5.40 +- 0.70) x 10^-41 esu cm^4 from B_or (Kielich's Eqs. 7, 9, \
Lennard-Jones eps/k = 155 K, sigma = 5.46e-8 cm, alpha = 6.560e-24 cm^3), Phi_p = (5.75 \
+- 0.30) x 10^-41 from B_p (Eqs. 10-15, Table II; per temperature 5.93, 5.73, 5.88, 5.71, \
5.80, 5.58, 5.64 at 273.2-523.2 K), against Rosenberg and Birnbaum's far-infrared value \
ten times smaller (pp. 1320-1321). hourri_1997 later gives 10.75 +- 0.75 x 10^-42.

PRESSURE VIRIAL COEFFICIENTS (equation-of-state quantities, not extracted). Table I B_p \
(cm^3/mol), this work: -218.80 +- 1.12 (323.3 K), -198.71 +- 3.52 (348.3), -156.40 +- \
0.92 (373.9); literature -236.4 and -232.4 [7], -243.3 [1], -216.9 [9, 10] at 323.3 K; \
-198.6, -195.6 [7], -191 [8] at 348.2 K; -162.8 [7], -159.2 [9, 10] at 373.2 K. Table II \
lists this work's 323.3 K value as -218.72 at 323.2 K (Table I: -218.80 at 323.3 K; a \
small inconsistency between the two tables, not resolved), and B_p of Refs. 7, 9, 10 at \
273.2-523.2 K.

LITERATURE ROW (reproduced): Ref. 1 = R. Nelson and R. H. Cole, J. Chem. Phys. 54, 4033 \
(1971), at 323.3 K: A_eps 16.478, B_eps 64.1, C_eps -6400 (no errors printed); 'The \
dielectric virial coefficient determined by Nelson and Cole at 50 degrees C agrees \
extremely well with ours' (p. 1321). Not in the library.

REPRODUCTIONS ELSEWHERE (re-pointed 2026-09-27): achtermann_1991's B_eps of SF6 at \
323.3, 348.3 and 373.9 K (63.31 +- 2.80 and 60.54 +- 1.45 digit for digit; at 373.9 K \
achtermann_1991 prints 58.84 +- 4.70 where this paper prints 58.89 +- 4.70: a \
transcription difference in the reprint), hourri_1997's A_eps (16.543 +- 0.017), \
st_arnaud_1979's A_eps (16.543 +- 0.017, listed there at 298 K although it is the 323.3 K \
value) and B_eps (63.3 +- 2.8 at 323 K, rounded). hohm_2013's SF6 dielectric mean cites \
this paper (its Ref. [228])."""

