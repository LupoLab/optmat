citation = "H. J. Achtermann, J. G. Hong, G. Magnus, R. A. Aziz and M. J. Slaman, \"Experimental determination of the refractivity virial coefficients of atomic gases\", J. Chem. Phys. 98, 2308 (1993)"
doi = "10.1063/1.464212"
library = "Achtermann_1993_ExperimentalDeterminationRefractivity"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Differential overflow interferometry at 632.99 nm (the Hannover apparatus of \
Achtermann et al. 1991): two expansions in opposite directions between matched cells \
cancel the cells' mismatch, and the refractive-index function is fitted to give B_n, \
C_n and D_n and hence the refractivity virial coefficients of He, Ne, Ar, Kr and Xe, \
with cell distortion and adsorption corrected. A_R from absolute isotherms."""
notes = """Identity VALIDATED_WITH_WARNINGS by the library. Printed pp. 2308-2318; Table II is \
on pdf p. 6.

TABLE II (image checked against the cells, 2026-10-01): this work's A_R (cm^3/mol), \
B_R (cm^6/mol^2) and C_R (cm^9/mol^3) at 632.99 nm (vacuum; the caption): He 303 K \
0.5213(2), -0.068(10); Ne 303 K 1.0012(2), -0.11(2); Ar 303 K 4.1955(3), 1.75(5), \
-85.4(2.0); Kr 303 K 6.414(1), 5.96(6), -275(10); Xe 303 K A_R 10.345(2), and at 348 K \
10.344(2), 28.5(5), -1802(50). Extracted as primary datasets. The C_R of Kr and Xe \
are 'presented for the first time'. The literature rows of Table II (Burns et al., \
Buckingham and Graham, Coulon et al., Orcutt and Cole, Kirouac and Bose, Huot and Bose, \
Bose and Cole, Bose, and the calculations of Dacre and of this work) are other \
sources' values and are not extracted here.

UNCERTAINTY: 'The quoted uncertainties for B_R, C_R, and D_R are obtained by taking \
three standard deviations from the least-squares fit in addition to errors due to cell \
distortion and adsorption' (level: 3 sigma). Xe's D_R (their Sec. IV) is not in \
Table II and is not extracted.

NEON (TC-744, TC-771): this work's optical B_R, -0.11(2) at 303 K, agrees with Huot and \
Bose's static B_eps, -0.12(6) at 323 K (huot_1991), and Garberoglio and Harvey's ab \
initio -0.101 at 633 nm, and not with Orcutt and Cole's -0.30(10), the package's \
present choice."""

[[datasets]]
id = "A_R_this_work_He"
material = "He"
file = "He/achtermann_1993__A_R_this_work_He.csv"
table = "tbl_d3914692b976"
quantity = "molar_refractivity"
unit = "cm3/mol"
abscissa_unit = "nm"
wavelength_medium = "vacuum"
use = "primary"
notes = "A_R (cm^3/mol) of Table II, this work, rows by temperature (K); 632.99 nm."
[datasets.uncertainty]
column = true
level = "not stated"

[[datasets]]
id = "B_R_this_work_303_He"
material = "He"
file = "He/achtermann_1993__B_R_this_work_303_He.csv"
table = "tbl_d3914692b976"
quantity = "refractivity_virial_coefficient"
unit = "cm6/mol2"
abscissa_unit = "nm"
wavelength_medium = "vacuum"
use = "primary"
notes = "B_R of Table II at 303 K, this work; 632.99 nm; three standard deviations with the distortion and adsorption errors."
[datasets.uncertainty]
column = true
level = "3 sigma"
[datasets.parameters]
order = 2
