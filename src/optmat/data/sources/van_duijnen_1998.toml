citation = "P. Th. van Duijnen and M. Swart, \"Molecular and Atomic Polarizabilities: Thole's Model Revisited\", J. Phys. Chem. A 102 (14) (1998)"
doi = "10.1021/jp980221f"
library = "VanDuijnen_1998_MolecularAtomicPolarizabilities"
identity = "VALIDATED_WITH_WARNINGS"
kind = "compilation"
technique = """Thole's modified dipole-interaction model: molecular polarizabilities \
built from isotropic atomic polarizabilities coupled by screened dipole-field tensors \
(linear and exponential charge distributions, Eqs. 1-9), the atomic polarizabilities \
and the screening length fitted to 'experimental' mean molecular polarizabilities of \
Thole's original learning set (16 molecules, control set 6) and of an extended set of \
52 molecules (control 18), and to CPHF, second-order and Unsoeld ab initio \
polarizabilities in six basis sets (HONDO 8.1)."""
notes = """Record UNVERIFIED in the library: title, authors, journal, volume and \
issue from the first page (pdf p. 1: 'J. Phys. Chem. A, Volume 102, Number 14, April 2, \
1998'; received November 14, 1997); the page range is not printed in the library text \
and is not given here. The DOI is inferred from the pdf's file name, jp980221f.pdf \
(the ACS manuscript number), not printed (TC-154).

The curated species appear only in the 'exp' columns, the experimental mean static \
polarizabilities (au) the model is fitted to. NO SOURCES ARE GIVEN for them, and their \
wavelength is uncertain: 'Experimental data are usually obtained from the \
Lorentz-Lorentz equation ... with the refractive index n (usually at 5893 A, sodium D \
line) ... an extrapolation of the refractive index to zero frequency (or infinite \
wavelength) should be made ... As a result of this extrapolation, the polarizabilities \
decrease within 2-4 %, which gives an estimate of the uncertainty in the experimental \
data. The values obtained at 5893 A are used throughout this article' (p. 4). They are \
stored at 5893 A (standard air, the sodium D line as usually quoted). Table 1's are \
Thole's original learning and control sets ('We started by repeating Thole's work, \
i.e., the same learning set and the same set of test cases', p. 5).

ALL EXCLUDED: values of unstated origin and wavelength, printed to four figures, no \
uncertainty; against the curated fits at 589.3 nm (air) they scatter by -4.0 % (H2), \
-0.33 % (N2), -0.04 % (O2), +0.19 % (CH4, Table 1) or +1.2 % (CH4, Table 11), -0.38 % \
(CO2), -0.57 % (SF6), +0.58 % (N2O) (fit/<gas> models, checked 2026-09-25). H2's 5.33 \
au is below even the static value (fit/H2: 5.43 au). Kept for the record. CO (added 2026-09-25, before the CO model): 13.16 au in Tables 1 and 11, 0.8 % above zhao_2026's \
static 13.059 au and about 1.5 % below that value plus Kumar and Meath's electronic \
dispersion to 589.3 nm (about 13.36 au, computed 2026-09-25 from zhao_2026's quoted \
S(-4), S(-6), S(-8)).

Methane is 17.68 au in Tables 1, 3 and 9 but 17.86 in Table 11 (image checked). Not a \
misprint in either table: Table 1's own deviations (linear model 17.46, '1.26 %') \
reproduce 17.68, and Table 11's alkane-group deviations (2.64 and 1.57 %) reproduce \
17.86 (2.53 and 1.46 % with 17.68): the extended fit used 17.86 (checked 2026-09-25). \
Both are stored.

Not extracted: the fitted atomic polarizabilities and screening lengths (Tables 2, 4, 6, \
7), the model and CPHF/SOP/Unsoeld columns (Tables 1, 3, 9, 11), the tensor components \
of Table 12, Tables 5 and 8 (percentages)."""

