[[errata]]
dataset = "shift_CH4"
row = "nu1 Q branch"
column = "value"
printed = "2986"
corrected = "2917"
reason = "Table 1 prints CH4 (nu1)'s Raman shift as 2986 cm-1, the D2 shift of the row above; the CH4 nu1 Q branch is at 2917 cm-1."
evidence = "The text lists the transitions studied as 'H2 (4156 cm-1), D2 (2986 cm-1), CH4 (2917 cm-1), N2 (2331 cm-1), and O2 (1555 cm-1)' (p. 181); the table image (tbl_377daa8e19f8) shows 2986 for both D2 and CH4. Every curated source puts CH4 nu1 at 2914-2917 cm-1 (fenner_1973 2914, danichkin_1981 2917, hanna_1986 2917). Checked 2026-09-27."

[[formulas]]
id = "single_resonance_H2"
material = "H2"
equation = "Table 1, p. 186 (Eq. 3, p. 184)"
printed = "dsigma/dOmega = A nu_s^4/(nu_i^2 - nu_p^2)^2; H2: Raman shift 4155 cm-1, A = 8.74 (x 10^-28) cm2 sr-1, nu_i = 8.48 (x 10^4 cm-1), lambda_i = 117.9 nm"
variable = "nu_p: the pump wavenumber, nu_s = nu_p - 4155: the Stokes wavenumber, nu_i: the effective intermediate state, all in cm-1 (nu_s^4/(nu_i^2 - nu_p^2)^2 is dimensionless); dsigma/dOmega: the absolute differential cross section of the whole vibrational Q branch in cm2 sr-1, per molecule, 90 deg scattering"
state = "room temperature (not stated); normal H2"
density = "unknown"
range = "pump 193-532 nm (the data; the title says 200-600 nm)"
coefficients = { A = "8.74e-28", nu_i = "8.48e4", lambda_i = "117.9", shift = "4155" }
check = "Scratch (2026-09-27), nu_p = 1/lambda_p: lambda_i = 1/nu_i = 117.92 nm (printed 117.9). At 532 nm 8.59e-31 cm2/sr (ottusch_1988 quotes 0.81e-30 for Q(1) from this paper: 6 % lower; with bischel_1986b's R = 0.99, 8.51e-31); at 248.0/248.4 nm 4.83/4.79e-29 (everall_1987 quotes 4.8e-29). The 193 nm resonance factor over 532 nm, [(nu_i^2 - nu_532^2)/(nu_i^2 - nu_193^2)]^2 = 2.30 (text: 'approximately 2.4'). bischel_1986b's Eq. (5) uses these A and nu_i, and its Eq. (11) reproduces that paper's Table 1 to 0.25 %."
notes = "The single-resonance form of Eq. (2) (p. 184), which assumes nu_p ~ nu_s; 'We expect small deviations (of order 10%) from the wavelength scaling given in Equation 2 only for H2 using pump lasers in the visible' (p. 184). The fit is of the Q-branch cross section; bischel_1986b (Eqs. 6-7) describes it as the thermal average over the Q branch for linear pump polarization and no analyser and multiplies by R = 0.99 for Q(1) with parallel polarizations. Uncertainty of the data +-10 % (p. 183); the absolute scale rests on Schroetter and Kloeckner's N2 cross section (ref. 2, +-5 %)."

