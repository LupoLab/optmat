citation = "W. K. Bischel and G. Black, \"Wavelength dependence of Raman scattering cross sections from 200-600 nm\", in Excimer Lasers-1983, C. K. Rhodes, H. Egger and H. Pummer, Eds., AIP Conf. Proc. 100, 181 (American Institute of Physics, New York, 1983)"
doi = "10.1063/1.34046"
library = "Bischel_1983_WavelengthDependenceRaman"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Spontaneous vibrational Raman scattering, collected at 90 deg with an off-axis \
elliptical mirror (f/1.4) into a Spex 1402 double monochromator with an RCA 31034A \
photomultiplier and a boxcar integrator; gases at 1-3 atm. Pumps: ArF (193 nm) and KrF \
(248 nm) excimer lasers, and a doubled or quadrupled Nd:YAG laser Raman-shifted in H2 \
for seven wavelengths between 217.8 and 532.0 nm. Detection efficiency calibrated with a \
tungsten-halogen lamp (250-700 nm) and a D2 lamp (200-400 nm), both traceable to NBS, \
agreeing to better than 10 % where they overlap; slit transmission from the signal \
against slit width. Absolute scale: the 532 nm signals ratioed to N2's, whose cross \
section (Schroetter and Kloeckner, ref. 2) 'is known to better than +-5%' (pp. 181-182)."""
notes = """AIP Conf. Proc. 100, pp. 181-187 (Excimer Lasers-1983); PDF page 1 is the \
publisher's cover, and PDF page n is p. 179 + n (Table 1 is on p. 186). The library's citation.bib lists \
spurious extra authors ('Test', 'Allman', ...): the paper's authors are W. K. Bischel \
and G. Black (SRI International), checked on the first page; the editors are C. K. \
Rhodes, H. Egger and H. Pummer (the cover page). The library's warnings (figures without \
captions, the table's caption not attached) are layout only: the figure titles are \
printed under the figures, and Table 1's caption and fitted form are printed above it \
(image checked).

WHAT IS MEASURED: the absolute differential cross sections of the vibrational Q \
branches of H2 (4156 cm-1), D2 (2986), CH4 nu1 (2917), N2 (2331) and O2 (1555 cm-1) \
against the pump wavelength, 193-532 nm (p. 181). The measured values are in Figures 1 \
(H2, with Huo's ab initio calculation dotted), 2 (H2 times lambda_s^4, normalized to one \
at 532 nm), 3 (D2, N2, O2, CH4) and 4 (the single-resonance fit, reduced cross section \
against the pump frequency squared, H2 and O2) only: not digitized. Figure 5 is the \
calculated steady-state gain of H2 Q(1) against wavelength.

TABLE 1 (p. 186, 'Single resonance fit to Raman scattering cross sections', dsigma/dOmega \
= A nu_s^4/(nu_i^2 - nu_p^2)^2; the library's unlabelled tbl_377daa8e19f8; CSV = image): \
per gas the Raman shift (cm-1), A (x 10^-28 cm2 sr-1), nu_i (x 10^4 cm-1) and lambda_i \
(nm) = 1/nu_i. The fits are the formulas below; the shifts are the datasets shift_* \
(check: the shifts that define nu_s, not measured here). 'We have fit our data to \
Equation 2 using a single effective intermediate state ... where the parameters A and \
nu_i are determined from the x intercept and slope ... The solid lines plotted in \
Figures 1 and 3 were calculated with these parameters and they fit our data to within \
our experimental uncertainty' (p. 184).

ERRATUM: Table 1 prints CH4's shift as 2986 cm-1, D2's value on the row above; the text \
gives 'CH4 (2917 cm-1)' (p. 181), the nu1 band (corrected below).

UNCERTAINTY: 'our error bars of +-10%' (p. 183); the lamps agree 'to better than 10%'; \
the N2 reference 'known to better than +-5%'. For H2: 'Except in the visible, our \
experimental values agree with the theoretical calculation [Huo] to better than our \
error bars of +-10% ... The discrepancy in the visible of approximately 10% is currently \
being studied' (p. 183). 'The results for visible pump wavelengths agree with previous \
experiments to better than 5%' (p. 182). No uncertainty is given for A and nu_i.

RESONANCE: 'at 193 nm, the [H2] cross section shows a resonant enhancement of \
approximately 2.4' over the lambda_s^4 scaling (normalized at 532 nm, Fig. 2); 'At 193 \
nm, the O2 cross section shows a resonant enhancement of 22 over than expected from the \
lambda_s^4 scaling law', near the Schumann-Runge bands (p. 183). The Eq. (1)-(2) \
reduction (nu_p ~ nu_s) is expected to be off by 'of order 10%' 'only for H2 using pump \
lasers in the visible' (p. 184).

OTHER TEXT VALUES (notes only): the H2 Rayleigh-to-Raman cross-section ratio (from Huo, \
ref. 4, W. Huo, private communication) 'for lambda_p = 600 nm, R = 155 and for lambda_p \
= 200 nm R = 50' (p. 186). The text cites 'recent Raman linewidth measurements made in \
our laboratory and elsewhere' as ref. 6 (p. 184), but the reference list ends at ref. 5: \
this paper holds no linewidth. Refs.: 2 = Schroetter and Kloeckner in Raman Spectroscopy \
of Gases and Liquids, A. Weber, ed. (Springer, 1979); 4 = W. Huo, private communication.

WAVELENGTHS: nu_p and nu_s are 'frequencies' in cm-1; the paper does not say whether the \
pump wavenumbers are vacuum (the laser wavelengths are nominal: 193, 248, 217.8-532.0 \
nm). The fits are checked below with nu_p = 1/lambda_p.

REPRODUCTIONS ELSEWHERE (re-pointed to this record 2026-09-27): ottusch_1988's dsigma_H2, \
dsigma_D2, dsigma_CH4 (532 nm), everall_1987's dsigma_CH4, dsigma_H2, dsigma_O2, \
dsigma_N2 (248 nm) and bischel_1986b's formula cross_section_eq5 (Ref. 20 there). Their \
values are formula evaluations or readings of the figures, not printed here: see the \
formulas' checks. hanna_1986 cites 'Bischel and Black 1983 with Owyoung 1983' for its \
H2 51 MHz/atm linewidth: this paper has no linewidth (ref. 6 above), so that citation \
can only be to Owyoung's part."""

