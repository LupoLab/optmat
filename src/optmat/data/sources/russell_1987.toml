notes = "Table I (p. 241), 'Murray & Javan', a, Q(1)-Q(3) (Q(0), Q(4) printed '-'); spontaneous Raman with a 0.053 cm-1 instrument width (p. 241). Tabulated under this paper's FWHM a, but smyth_1987 (Table III) prints the same values as HWHM, and the 'almost 100 %' disagreement the paper reports is that factor of 2. Their D_0 is 0.952 for every line. Re-pointed to murray_1972 (2026-09-27): its Table II prints D2 Q_1(1)-Q_1(3) 1.4 +- 0.15, 2.2 +- 0.2, 2.6 +- 0.5 x 10^-3 cm-1/amagat at 25 C (digit-identical, with delta 7, 7, 8 and D_0 = 0.952 from its p. 16), and calls all its widths FULL widths ('full width at half maximum', its pp. 2 and 7; its Fig. 5 marks the FWHM Doppler widths): width is now 'fwhm', the original's convention (was 'not stated'). The factor-of-2 disagreement with this paper and with smyth_1987 (which reads them as HWHM) is therefore unresolved: murray_1972's H2 widths agree with later FWHM measurements, its D2 widths with later HWHM ones (see murray_1972's DOUBT)."
