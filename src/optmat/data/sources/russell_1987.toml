unit = "cm-1/amagat"
scale = 1e-3
abscissa = "label"
use = "primary"
notes = "Table I (p. 241), 'This Study', a: the FWHM pressure-broadening coefficient of Eq. (1) (Dicke term fitted separately) of the D2 Q(0)-Q(4) lines (v = 0 -> 1), 10^-3 cm-1 per amagat, room temperature (no value in K). The +- is the fit error (level not stated). smyth_1987 quotes these halved as HWHM ('Roh (Ref. 33)')."
