citation = "D. A. Russell and W. B. Roh, \"High-resolution CARS measurement of Raman linewidths of deuterium\", J. Mol. Spectrosc. 124, 240 (1987)"
doi = "10.1016/0022-2852(87)90139-1"
library = "Russell_1987_HighResolutionCARS"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """High-resolution cw CARS (p. 240): a single-mode Ar-ion pump at 514.5 nm \
(effective linewidth about 0.0003 cm-1, which limits the resolution) and a single-mode \
ring-dye Stokes beam at 608 nm, collinear, focused into a cell of D2; anti-Stokes \
detection by photon counting; frequency markers from an etalon, calibration with a \
wavemeter and an iodine cell. D2 Q(0)-Q(4) of the fundamental band at room temperature, \
0.3-18 amagat (Q(4) below 10 amagat); each point the average of three measurements. \
Linewidth against density fitted with the Dicke (diffusion) law, Eq. (1), by linear \
least squares for a and D_0."""
notes = """Identity checked against the first page. Page numbers are journal pages \
(pdf pages 1-3 = pp. 240-242). Material: D2 as supplied (normal, ortho:para not \
stated; at room temperature). 'room temperature' is the only temperature given (Fig. 1 \
caption, p. 241); no value in K. 1 amagat 'is equal to the number density of gas at 1 \
atm at 273 K' (p. 240).

WIDTH CONVENTION. FULL widths. Eq. (1), p. 240: 'Delta nu = (4 pi nu^2/c)(D_0/rho) + a \
rho, where Delta nu is the linewidth (FWHM in cm-1), nu is the frequency of the \
vibrational Raman transition (in cm-1), rho is the gas density (in amagat), c is the \
speed of light (in cm/sec), a is the pressure broadening coefficient (in cm-1/amagat), \
and D_0 is the self-diffusion coefficient at 1 amagat.' Table I note: 'a in [10^-3 \
cm-1/amagat]; D_0 in [cm2-amagat/sec]; delta: rms error of the fit in [10^-3 cm-1]'. \
The law INCLUDES the Dicke term, (4 pi nu^2/c) D_0/rho (FWHM, cm-1), fitted (D_0 per J, \
formula eq1_dicke). Independent confirmation of FWHM: Smyth et al. (smyth_1987, Table \
III, HWHM) print 'Roh (Ref. 33)' values 2.90 +- 0.04, 1.32 +- 0.02, 1.96 +- 0.02, 2.06 +- \
0.04, 1.94 +- 0.04 for Q(0)-Q(4), which are this table's a and errors halved and \
rounded (5.79/2 = 2.895, 2.63/2 = 1.315, 3.91/2 = 1.955, 4.11/2 = 2.055, 3.87/2 = \
1.935).

UNCERTAINTIES. The +- on a and D_0 are the least-squares fit errors ('the fitting errors \
for the present measurement are more than five times smaller than those associated \
with Murray and Javan's measurements', p. 241); level not stated. delta, the rms error \
of the fit (10^-3 cm-1): 0.6, 1.2, 1.1, 1.1, 0.8 for Q(0)-Q(4). Q(4) is 'somewhat less \
reliable' (smaller density range, poor S/N, p. 241).

THE COMPARISON COLUMNS (p. 241, reproduced). Murray and Javan (J. R. Murray and A. \
Javan, J. Mol. Spectrosc. 42, 1 (1972), curated as murray_1972 since 2026-09-27; it \
calls its widths full widths): a = 1.4 +- 0.15, 2.2 +- 0.2, \
2.6 +- 0.5 (Q(1)-Q(3)), D_0 = 0.952 for each, delta 7, 7, 8. The paper says 'the present \
pressure-broadening coefficients deviate almost 100 % from those of Murray and Javan' and \
blames Murray and Javan's 0.053 cm-1 instrument width. But Smyth et al. 1987 (smyth_1987 \
Table III, 'half-width at half-maximum') print the same three numbers, 1.4 +- 0.15, 2.2 \
+- 0.2, 2.6 +- 0.5, as HWHM, in agreement with their own HWHM (1.33, 2.06, 2.13): the \
'almost 100 %' deviation is the factor of 2 between a half width and a full width. The \
original (murray_1972) says its widths are FWHM, so they are recorded as 'fwhm' (the \
original's word; this paper tabulates them under its FWHM a too, and Smyth et al. call \
them HWHM): the factor of 2 is then between Murray and Javan's D2 widths and every later \
D2 measurement, unresolved (murray_1972's notes). Robertson and Hunt (C. W. \
Robertson and R. H. Hunt, J. Chem. Phys. 55, 4149 (1971); electric-field-induced \
infrared absorption at 10-30 amagat, no D_0): 5.77 +- 0.2, 2.59 +- 0.10, 4.00 +- 0.10, \
4.22 +- 0.10, 4.14 +- 0.15, within 3 % of this study for Q(0)-Q(3) (p. 240); smyth_1987 \
prints exactly half of them as HWHM (2.89 +- 0.10, 1.30 +- 0.05, 2.00 +- 0.05, 2.11 +- \
0.05, 2.07 +- 0.08), so Robertson and Hunt's are FWHM, consistent with this table.

NOTE ADDED IN PROOF (p. 242): Rosasco's group's stimulated Raman gain widths 'appear to \
be in agreement with ours within approximately 6 %' (smyth_1987).

What this bears on: the D2 Q-branch width law in use is Ottusch and Rockwell's, FWHM = \
101/rho + 120 rho MHz (rho in amagat) for Q(2), cited to this paper and to smyth_1987 \
(ottusch_1988 linewidth_D2). Its 101 MHz amagat is this paper's Q(2) Dicke term, (4 pi \
nu^2/c) D_0 with D_0 = 0.901 and nu = 2987 cm-1 (Hanna et al.'s Q(2) shift): 3.370e-3 \
cm-1 amagat = 101.0 MHz amagat. Its 120 MHz/amagat is the mean of this paper's a(Q(2)) = \
3.91e-3 cm-1/amagat = 117.2 MHz/amagat and smyth_1987's 2 x 2.06e-3 = 123.5 MHz/amagat \
(mean 120.4): an inference from the numbers, not stated by Ottusch and Rockwell."""

