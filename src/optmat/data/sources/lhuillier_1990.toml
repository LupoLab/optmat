citation = "A. L'Huillier, X. F. Li and L. A. Lompre, J. Opt. Soc. Am. B 7, 527 (1990)"
doi = "10.1364/josab.7.000527"
library = "LHuillier_1990_PropagationEffectsHigh"
identity = "VALIDATED_WITH_WARNINGS"
kind = "theory"
technique = """Dynamic polarizabilities of Ar, Kr and Xe from zero to 2.5 Ry by many-body \
perturbation theory in the random-phase approximation (after Wendin), used for the \
phase mismatch Delta k = 2 pi q omega N / c [alpha(q omega) - alpha(omega)] of high \
harmonics of a 1.165 eV (Nd:YAG) laser."""
notes = """Table 1 (tbl_077a458eabca) gives the calculated phase mismatch Delta k (cm^-1, real \
and, above threshold, imaginary parts) for harmonics q = 3-33 in Ar, Kr and Xe at N = \
5e17 cm^-3 (15 Torr), and the free-electron contribution for a fully ionized medium; \
values in the resonance region, 'where the calculation might not be reliable', are in \
parentheses (e.g. Ar q = 11, 13; Kr q = 9, 11; Xe q = 7, 9). It is not extracted: the \
package has no phase-mismatch quantity, and Delta k/N gives only differences \
alpha(q omega) - alpha(omega) of a calculation that is itself described as \
unreliable near resonances (no spin-orbit coupling, autoionizing resonances to first \
order). The real parts could be turned into polarizability differences by a later \
format. Fig. 1 (Re and Im alpha from 0 to 2.5 Ry) is not digitised.

The text (p. 4) gives the static polarizabilities, experimental (Miller and Bederson, \
Ref. 39) and calculated, recorded below. The errata (J. Opt. Soc. Am. B 7, 2137 (1990), \
library LHuillier_1990_PropagationEffectsHigh_868757) correct Eqs. (10), (12), (13), \
(15), (16), (21), (24) and (25) only; no value used here is affected."""

[[datasets]]
id = "polarizability_experiment_Ar"
material = "Ar"
points = [["static", "inf", "1.64"]]
table = "text"
quantity = "polarizability"
unit = "cm3"
scale = 1e-24
abscissa_unit = "angstrom"
use = "reproduced"
reproduced_from = ["T. M. Miller and B. Bederson, Adv. At. Mol. Phys. 13, 1 (1977)"]
notes = "p. 4: 'The experimental static polarizabilities of Ar, Kr, and Xe are, respectively, 1.64 x 10^-24, 2.48 x 10^-24, and 4.04 x 10^-24 cm^3 (Ref. 39)'. A compiled value; the original is not in the library."

