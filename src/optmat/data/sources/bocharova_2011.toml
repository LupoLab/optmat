citation = "I. A. Bocharova, A. S. Alnaser, U. Thumm, T. Niederhausen, D. Ray, C. L. Cocke and I. V. Litvinyuk, \"Time-resolved Coulomb-explosion imaging of nuclear wave-packet dynamics induced in diatomic molecules by intense few-cycle laser pulses\", Phys. Rev. A 83, 013417 (2011)"
doi = "10.1103/PhysRevA.83.013417"
library = "Bocharova_2011_TimeResolvedCoulomb"
identity = "VALIDATED"
kind = "measurement"
technique = """Pump-probe Coulomb-explosion imaging with COLTRIMS (p. 2): Ti:sapphire \
amplifier, 800 nm, 35 fs, 1 kHz, compressed to about 8 fs in a Ne-filled hollow fibre \
and chirped mirrors; pump and probe from a Mach-Zehnder arrangement; peak intensities \
'varied from 8 x 10^14 to 5 x 10^15 W cm^-2', calibrated in situ by the method of \
Alnaser et al. (their ref. 18); polarisation horizontal, parallel to the \
time-of-flight axis. Ion pairs in coincidence, all symmetric and asymmetric channels of \
N2 (to N2 5+), O2 (to O2 4+) and CO (to CO 4+); KER against pump-probe delay. \
Classical (Coulomb-explosion of a particle on literature curves) and nuclear TDSE \
models of the traces (sections III, IV)."""
notes = """Journal article 013417 = pdf pages 1-17, cited by pdf page. Identity checked against pdf p. 1 \
(received 16 September 2010; published 31 January 2011). Curated 2026-10-09 (TC-963).

WHAT IS PRINTED. The KERs are features of time-dependent KER maps (Figs. 4-13, \
density plots) quoted approximately in the text; there are no tables. The one \
channel energy taken (use check) is the O2 2+ asymptote of the (2,2) map: 'the upper \
dissociation trace which converges to an asymptotic energy of about 11 eV after 200 fs \
can be assigned to some electronic states of the doubly charged molecular ion (only A \
3Sigma_u is shown in Fig. 15(b) but several other states lead to very similar traces)' \
(p. 10); the quantum model's 1 1Delta_u, B 3Sigma_u, W 3Sigma_u and 1 1Sigma_u states (as printed) \
of O2 2+ 'dissociate to the same KER of about 11 eV, which agrees very well with the \
corresponding features in the experimental spectra' (p. 11). At large delay the probe \
adds no Coulomb energy, so the asymptote is the KER of the intermediate's own \
dissociation, O2 2+ -> O+ + O+ (pp. 4-5).

NOT TAKEN (approximate, or not a channel's KER):
- O2 (2,2) lower trace: 'Two dissociative traces ... (around 7 and 11 eV at 200 fs)' \
(p. 9), assigned to excited O2+ (4Delta_g, p. 10); the quantum model's five O2+ states \
(2 4Pi_g, 1 2Sigma_g, d 4Sigma_g, f 4Pi_g, 4Delta_g) dissociate 'with about the same \
asymptotic kinetic energy release of 5-7 eV, which is observed in our experiments' \
(p. 11). A range, at a delay not stated to be asymptotic; notes only.
- O2 (1,1): a dissociative trace 'below 6 eV after 40 fs of delay and goes down to \
below 3 eV at 200 fs' (p. 9).
- N2: the descending traces 'start at about 25 eV for the (2,1) channel, 45 eV for \
(2,2), and 65 eV for (3,2)' at zero delay (p. 4); the (2,2) map's intermediates are \
assigned to (1,0), (1,1) and (2,1), whose asymptotes equal the peak KERs of the same \
channels in single-pulse spectra (p. 5), but no asymptotic energy is printed for N2. \
Of the N2 2+ curves tried, c 1Delta_g, A 3Sigma_g and A 1Pi_u fit the trace and D \
3Pi_g does not; of N2+, 2 2Sigma_g fits (pp. 6-7).
- The asymmetric (3,1) channels exist only for delays below 20 fs: N2, 'starting at \
around 36 eV at zero delay and going down to about 17 eV at 20 fs' (p. 7); O2, from \
'around 40 eV' to 'about 18 eV' (p. 10); read as electron localisation in the \
dissociating tri-cation at 'about 2.5 times the bond length' (pp. 8, 10).
- CO: traces near 7 eV (CO+ D 2Pi) and the CO 2+ b 1Pi assignment (p. 12); CO is outside \
this curation's scope.

INTENSITIES OF THE MAPS: pump (probe) 8 x 10^14 (17 x 10^14) W/cm^2 for N2 and O2 \
(Figs. 4-5, 12-13), 2 x 10^15 (1.6 x 10^15) for Fig. 6(a); 9 x 10^14 (14 x 10^14) for \
CO (Fig. 18); both pulses 8 fs FWHM.

FIGURES (not digitised; raster images): every result is a two-dimensional KER-delay \
map; nothing is a curve that a quantity holds."""

[[datasets]]
id = "ker_asymptotic_O2_O+O+"
material = "O2"
table = "text"
quantity = "kinetic_energy_release"
unit = "eV"
abscissa = "none"
use = "check"
points = [["O+/O+", "", "11"]]
notes = "pp. 10-11 (Figs. 13(c), 15, 17): the (2,2) KER-delay trace that 'converges to an asymptotic energy of about 11 eV after 200 fs', assigned to dissociating states of O2 2+ (A 3Sigma_u in the classical model; 1 1Delta_u, B 3Sigma_u, W 3Sigma_u, 1 1Sigma_u in the quantum model, as printed, all 'about 11 eV'). An approximate reading of a density plot by the authors; no uncertainty. The dissociating species is O2 2+, which is not a registered material: the dataset is filed under O2, the irradiated gas, with the parent in channel and state. Pump 8 fs at 8 x 10^14 W/cm^2, probe 8 fs at 17 x 10^14 W/cm^2."
[datasets.uncertainty]
level = "not stated"
[datasets.parameters]
channel = "O2 2+ -> O+ + O+"
kind = "asymptotic"
state = "O2 2+ (A 3Sigma_u and similar bound-then-dissociating states, as assigned by the authors' models)"
wavelength_nm = 800
pulse_fs = 8
polarization = "linear"
intensity_w_cm2 = 8e14
