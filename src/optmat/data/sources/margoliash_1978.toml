density = "none"
range = "photon energies up to 0.95 E0, E0 = 11.18 eV (H2 absorption bands 11.18-14.43 eV, Zeiss et al. 1977, p. 2085): 'ten pseudostates reproduce the dynamic polarizabilities alpha(E) for photon energies up to 0.95 and 0.99 E0 with a maximum error of 0.02% and 1.6%' (p. 1429); range_nm is hc/(0.95 E0) rounded up"
check = "Terms equal Table I (asserted by tools/extract/margoliash_1978.py against the library table; image checked). S_0 = 2.00000, S_-2 = 5.4279 against Zeiss et al.'s 2.000 and 5.428; alpha at 632.8 nm 5.5337, 0.13 % below the package's fitted H2 model (5.5409), 0.10 % at 250 nm (computed 2026-09-25)."
notes = "A ten-term pseudospectrum fitted (Gaussian quadrature, the theory of moments) to the sums S(0) ... S(-19) of the original DOSD of Zeiss et al. 1977 (zeiss_1977) and Zeiss & Meath 1977 (Refs. 1, 4); the printed mantissa(exponent) values are stored in e-notation, digits unchanged. The original DOSD was constrained to measured refractivities (zeiss_1977 notes), so this model is not independent of them. A published erratum to this paper (J. Chem. Phys., 'Erratum: Pseudospectral dipole oscillator strength distributions ...', listed on the article's cover page) is not in the library: the values may have been corrected."

