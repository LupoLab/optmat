citation = "D. J. Margoliash and W. J. Meath, J. Chem. Phys. 68, 1426 (1978)"
doi = "10.1063/1.435963"
library = "Margoliash_1978_PseudospectralDipoleOscillator"
identity = "VALIDATED_WITH_WARNINGS"
kind = "compilation"
technique = """Pseudospectral dipole oscillator strength distributions: n pairs \
(epsilon_i, f_i) reproducing 2n dipole sums S(k) = sum_i epsilon_i^k f_i, k = 0 ... \
-2n+1 (Eq. (2)), of constrained DOSDs built from photoabsorption, electron-scattering \
and refractivity data (Refs. 1-4: Zeiss & Meath 1977; Zeiss et al. 1977; Thomas & \
Meath 1977), by the theory of moments and generalized Gaussian quadrature; ten \
pseudostates per species listed (up to 19 constructed), Hartree atomic units \
(p. 1427)."""
notes = """Only the curated species are recorded: H2, N2, O2, N2O and CH4 (Li, N, O, \
NO, H2O and NH3 are skipped; H and He pseudostates are Johnson, Epstein and Meath's, \
not tabulated here). No S(k) are tabulated in this paper: the sums are those of the \
original DOSDs (zeiss_1977 holds H2, N2, O2 and N2O; CH4's are in Thomas & Meath 1977, \
curated since as thomas_1977). The pseudospectra are recorded as oscillator formulas; Tables II \
and III (C6 and W4 dispersion coefficients) are not refractive-index data.

Table I (p. 1427, JSON only, image checked) prints each number as mantissa(power of \
ten); the terms are stored in e-notation with the digits unchanged, and \
tools/extract/margoliash_1978.py asserts that every term equals the library table \
(it writes no data file).

Accuracy (p. 1429): 'ten pseudostates reproduce the dynamic polarizabilities alpha(E) \
for photon energies up to 0.95 and 0.99 E0 with a maximum error of 0.02% and 1.6%, \
respectively' (E0: the ultraviolet absorption threshold, Eq. (1)); 'The DOSDs \
reproduce accurate experimental refractivities ... to within a few tenths of a \
percent.' Checks: the pseudospectra of H2, N2, O2 and N2O reproduce Zeiss et al.'s \
Table 3 S_k for k = 0 to -14 to 0.05 % or better (the four printed figures; computed \
2026-09-25). S_0 is 2.00000, 13.99935, 16.00000, 22.00014 and 9.99999 for H2, N2, O2, \
N2O and CH4 (N2 alone is off by more than 1e-4 relative).

ERRATUM NOT IN THE LIBRARY: the article's cover page lists 'A correction has been \
published: Erratum: Pseudospectral dipole oscillator strength distributions ...'. It \
is not in the library; some of Table I may be corrected there."""

