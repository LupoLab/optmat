citation = "T. Matsui, A. S.-C. Cheung, K. W.-S. Leung, K. Yoshino, W. H. Parkinson, A. P. Thorne, J. E. Murray, K. Ito and T. Imajo, \"High resolution absorption cross-section measurements of the Schumann-Runge bands of O2 by VUV Fourier transform spectroscopy\", J. Mol. Spectrosc. 219, 45 (2003)"
doi = "10.1016/s0022-2852(03)00009-2"
library = "Matsui_2003_HighResolutionAbsorption"
identity = "VALIDATED"
kind = "measurement"
technique = """Vacuum-ultraviolet Fourier-transform spectroscopy (the Imperial College \
spectrometer) with synchrotron radiation (Photon Factory beam line 12B, predisperser \
2.5 nm wide at 177.5 and 180.0 nm), resolution 0.06 or 0.12 cm^-1; a 7.82 cm cell of O2 \
at 2.00, 4.00 and 10.00 Torr, 295 K (column densities 0.51, 1.02 and 2.56e18 cm^-2), \
capacitance manometer; lines fitted with Voigt profiles (GREMLIN), about 650 lines of \
the (12,0)-(17,0) bands, 175-182.5 nm (pp. 45-47). Line intensities from the 2.00 Torr \
spectra only (saturation at 4 and 10 Torr, p. 54)."""
notes = """Journal pages 45-57 = PDF pages 1-13. O2 only, 295 K. Only the band values \
are taken (Table 5); the line lists (Tables 1a, 1b: positions; Table 2: term values; \
Tables 4a, 4b: integrated line cross sections with branch totals) and the molecular \
constants (Table 3) are not extracted.

Band oscillator strength (Eq. 1, p. 55): f(v', v'') = (m c^2 / (pi e^2)) (1 / \
N(v'')) integral sigma(nu) dnu over all rotational lines of the band, N(v'') the \
fractional Boltzmann population of the lower level, from the extended total \
cross-sections of the principal branches (extrapolated to N'' = 41 with a Boltzmann \
distribution) and the observed totals of the satellite and forbidden branches. Table 5 \
also gives the total (observed) and extended integrated cross-sections in 10^-17 cm^2 \
cm^-1 (not extracted: no vocabulary quantity). Check (2026-09-25): the extended values \
times 1/(pi r_e) = 1.12958e12 cm^-1 give 2.372, 2.621, 2.700, 2.666, 2.395, 2.124e-5, \
the printed f to their rounding (N(0) = 1 to 0.1 % at 295 K).

Accuracy (p. 55): pressure (+-0.02 Torr), temperature (295 +- 2 K) and path (7.82 +- \
0.01 cm) give 'a random error of less than 2 %'; the noise is +-3e-20 cm^2 (3-4 % for \
the strong lines of 5-6e-19 cm^2 cm^-1, 10 % at 2.5e-19, 17 % at 1.0e-19); 'total \
errors on the integrated cross-sections are estimated to be less than 5 %'. The band \
values are line-by-line integrals at a resolution comparable to the Doppler widths, \
free of the blending of neighbouring bands that the authors think inflated the earlier \
low-resolution values (p. 56). The abstract's f values (2.38, 2.62, 2.70, 2.66, 2.40, \
2.12e-5) are Table 5's.

The five comparison columns are reproduced: LBC (Lewis et al. 1986, 1.4 cm^-1 \
resolution without pressure broadening, 'near the present results, but still a little \
larger'), YFEP (Yoshino et al. 1983, 0.40 cm^-1, (12,0) only, agreeing), GGMBL (Gies et \
al. 1981), HCMK (Huebner et al. 1975, electron energy loss, 'much smaller' than theirs) \
and Bethke (1959, bethke_1959). The Bethke column copies bethke_1959's Table I except \
(17,0), printed 2.95 for Bethke's 2.94 (erratum). This work is 15-28 % below Bethke \
((12,0) -15 %, (17,0) -28 %).

Band positions: the rows are indexed by v'. The band origins T(v) of Table 3 (cm^-1, \
relative to the hypothetical F2 N = J = 0 level of X(0); calibration uncertainty 0.03 \
cm^-1) are 55783.011 (v' = 12), 56083.695, 56338.380, 56548.168, 56716.53 and 56848.56 \
(v' = 17), about 179.3-175.9 nm (tbl_60e4f321647c, image checked; not extracted)."""

