reason = "The reproduction of Bethke's (17,0) band oscillator strength reads 2.95e-5; Bethke's Table I prints 2.94e-5, and his K_0 = 699 cm^-2 atm^-1 with his Eq. (2), 4.203e-8 K_0, gives 2.938e-5. The other five reproduced values equal Bethke's."
