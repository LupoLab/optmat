citation = "P. F. Egan, J. A. Stone, J. K. Scherschligt, and A. H. Harvey, J. Vac. Sci. Technol. A 37, 031603 (2019)"
doi = "10.1116/1.5092185"
library = "Egan_2019_MeasuredRelationshipBetween"
identity = "VALIDATED"
kind = "measurement"
technique = """Heterodyne laser refractometry in the MIRE triple-cell apparatus (NIST), \
He-Ne laser at 632.9908(2) nm, on the isotherm T_90 = 293.15 K (thermodynamic T = \
293.1529(13) K with T - T_90 = 2.9(4) mK). Pressure from transducers calibrated in \
situ against helium refractivity at a known temperature (the helium relation from ab \
initio theory), so the pressure is thermodynamic, not mechanical. Refractivity \
measured at 50-500 kPa in 30 kPa steps; p adjusted to the isotherm with (dp/dT)_rho \
from REFPROP; Eq. (3) p = c_1 (n-1) + c_2 (n-1)^2 + c_3 (n-1)^3 fitted by weighted \
orthogonal distance regression (ODRPACK); A_R = 2RT/(3 c_1) with R = k_B N_A (CODATA \
2017 values, exact in the 2019 SI) (pp. 4, 9-10). Gas grades: Ne 99.9995 %, Ar \
99.9999 %, Xe 99.9995 %, N2 99.9999 %, CO2 99.9995 %, N2O 99.9999 % (p. 12)."""
notes = """Page numbers are the library pdf pages (pdf page 1 is a publisher's cover). A_R is the zero-density molar refractivity (n^2 - 1)/((n^2 + 2) rho) at 632.9908 \
nm, 'A_R = (4 pi/3) N_A (alpha + chi)', i.e. it includes the magnetic susceptibility \
(p. 3). Wavelength: vacuum (632.9908 nm is the He-Ne vacuum wavelength; the paper does \
not say 'vacuum' but gives the value to 0.2 pm). Temperature 293.1529 K: only nitrogen's \
A_R is expected to depend on it (p. 13).

Uncertainty: Table II, relative standard uncertainty of A_R (x 10^-6): combined Ne \
16.0, Ar 15.1, Xe 15.5, N2 15.1, CO2 15.1, N2O 15.3, dominated by the pressure \
calibration (14.2-14.5); T 4.5, n - 1 (5.2 Ne ... 0.5 Xe), impurity (3.0 Xe, 2.5 Ne), \
regression (1.2-2.2). Table III's parenthesised values are these standard \
uncertainties; Table I's bracketed c_1, c_2, c_3 uncertainties are statistical only. \
A_R from Eq. (3) and from the exact Lorentz-Lorenz form agree to 8e-7 (p. 10); the \
zero-density intercept of the EOS analysis (Fig. 4) agrees within 1e-6 (2e-6 for Ne).

Checks (2026-09-25): 2RT/(3 c_1) with Table I's c_1 and T = 293.1529 K reproduces Table \
III's A_R to 4e-7 for all six gases; Egan et al.'s 2016 nitrogen c_1^303K = \
3.7764715e8 Pa at 302.919 K (p. 13) gives 4.446141, Table III's 4.446139(16).

Table III's literature values are extracted as reproduced datasets (stored at '633 nm', \
the caption's wording; the literature temperatures are not given, which matters for \
N2 only). Egan and Stone's 2011 values are printed adjusted by +19.3e-6 A_R (note a; \
check, see egan_2011). Egan et al. treat all tabulated uncertainties as standard \
uncertainties (Birch's converted from 99 % with k = 2.58); whether Achtermann et al.'s \
were one sigma is not discussed (achtermann_1991 states three standard deviations for \
its virial coefficients).

Text values: A_eps -> R of Ne 1.00028(6) and Ar 4.1956(6) cm^3/mol at 633 nm, derived by \
the authors from Gaiser and Fellmuth's (2018) static A_eps with Kumar and Thakkar's \
(2010) Cauchy moments and Barter et al.'s magnetic susceptibilities (p. 12; inline \
dataset, check). Egan et al. 2016 (N2, 302.919 K, p < 180 kPa): c_1 = 3.7764715e8 Pa \
(printed with an unmapped dot glyph over the last digits in the library text), c_2 = \
-2.982e8 Pa, c_3 = 1.24e10 Pa (p. 13; not extracted). Temperature dependence of \
N2's A_R (p. 13, not extracted: no quantity): Hohm and Kerl 78(47)e-7, Schmidt and \
Moldover 62(11)e-7 (static), Harvey and Lemmon 82e-7, Buldakov et al. 48(1)e-7 \
(optical, theory), Sharipov et al. 51e-7 (static, theory), a fit to Fig. 5's literature \
137e-7, this work with Egan 2016 33e-7 (cm^3/mol)/K.

Not extracted: the n - 1, p, T data (supplementary material, not in the library); Table \
II (budget, summarised above)."""

