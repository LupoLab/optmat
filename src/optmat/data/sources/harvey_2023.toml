notes = """Identity VALIDATED by the library. Pages are the report's pdf pages.

IDEAL GAS AND CONSTANTS (Table 1, p. 8; Eq. 3, p. 9): M = 4.002602 g/mol and R = \
8.314472 J/(mol K), which 'should be used' with the equation; the ideal-gas part is the \
monatomic gas's, c_p0 = (5/2) R. Range 2.1768-1500 K, 2000 MPa (p. 21).

AGAINST COOLPROP 8.0.0 (reference key OrtizVega-JPCRD-2019, computed 2026-09-30): the same \
M and c_p0 = (5/2) R with R = 8.3144598 J/(mol K), 1.47e-6 below the report's. The \
report is taken here as the published form of CoolProp's equation: CoolProp's own \
bibliography lists that one as unpublished (D. O. Ortiz-Vega, K. R. Hall, J. C. Holste, \
V. D. Arp, A. H. Harvey and E. W. Lemmon, 'Equation of state for Helium-4', 2019). Only \
the ideal part and M are used from it, where the two agree. optmat's c_p0 is (5/2) R \
with CODATA's R (optmat.gas.transport)."""
