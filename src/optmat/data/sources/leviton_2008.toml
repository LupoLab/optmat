citation = "D. B. Leviton and B. J. Frey, \"Temperature-dependent absolute refractive index measurements of synthetic fused silica\", arXiv:0805.0091 (2008)"
doi = "10.48550/arxiv.0805.0091"
library = "Leviton_2008_TemperatureDependentAbsolute"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Minimum deviation in CHARMS (the Cryogenic, High-Accuracy Refraction Measuring \
System, NASA Goddard), in vacuum: the absolute index. Five prisms (apex 59 degrees, \
refracting faces 38.1 mm, height 28 mm) from five cores taken around the perimeter of \
the 1 m Corning 7980 blank of the Kepler Schmidt corrector (serials 72, 144, 216, 288, \
360). Light: a quartz tungsten halogen lamp through a monochromator 'with a \
calibrated wavelength accuracy of 0.2 nm' (p. 3). Kepler study: all five prisms, 135-305 \
K, 18 wavelengths 0.4-1.15 um (p. 2). Extended study: two of the five, 'selected \
arbitrarily', 30-310 K, 0.4-2.6 um (p. 5). 'over 7600 individual, direct measurements' \
(p. 10). dn/dT from piecewise quadratic fits of n(T) per wavelength (p. 6)."""
notes = """PDF pages 1-11 (the arXiv preprint; no journal pagination). Identity checked \
against the first page. Section 5 is missing from the numbering (4 is followed by 6).

PUBLICATION. The library copy is arXiv:0805.0091 (submitted 2008), and it is cited as \
such. The paper itself prints no journal or proceedings: its latest reference is 2005 \
(and an undated SPIE Newsroom item), and the PDF was made on 7 May 2006 (its metadata \
title is that of the authors' SPIE 5904 paper, ref. 6). It is the preprint of Proc. SPIE \
6273, 62732K (2006), doi:10.1117/12.672853, now in the library as leviton_2006: the \
two texts are identical apart from the SPIE footnote, and all eight tables are \
identical number for number (compared 2026-09-27; see leviton_2006). franta_2017 cites \
Frey, Leviton and Madison, Proc. SPIE 6273, 62732J (2006), a neighbouring paper. The \
data are curated here, from this copy; leviton_2006 holds no datasets.

MEDIUM. The index is absolute (in vacuum) throughout: 'we have measured the absolute \
refractive index' (abstract). The paper does not say whether its wavelengths are vacuum \
or air values; the monochromator's calibration medium is not stated. The records take \
them as vacuum wavelengths (the default). At 0.45 um an air/vacuum wavelength \
difference (1.2e-4 um) would move n by about 1e-5 (dn/dlambda = -0.078/um, Table 5), \
the size of the stated uncertainty.

ACCURACY. 'absolute uncertainty of +-1 x 10^-5' (abstract); 'an accuracy level of 1 part \
in the fifth decimal place of index' (p. 10). Table 1 ('Worst case uncertainties', p. \
3; four partial errors, from the wavelength, temperature, apex-angle and \
deviation-angle uncertainties, 'combined in quadrature', p. 6), in units of 1e-6, at 30, \
80, 150, 250, 295 K: 0.5 um 11, 11, 11, 10, 10; 1.0 um 8, 9, 9, 8, 7; 1.5 um 9, 10, 10, 9, \
8; 2.0 um 14, 15, 14, 14, 14; 2.5 um 17, 18, 17, 17, 17 (larger beyond 2 um 'due to a \
dramatic increase in dispersion ... approaching the deep absorption feature at 2.75 \
microns'). The level is not stated. Prisms: 'the samples are indistinguishable in \
refractive index at any temperature to within our stated uncertainty' (p. 3): residuals \
of per-prism quadratic fits in T '< 2 x 10^-6 rms ... +9/-6 x 10^-6 on a peak-to-valley \
basis'; at 633 nm the rms departure of all measurements from the global fit is 4e-6, \
peak 1e-5 (p. 3). dn/dT: 'Statistical variations ... at the +-2 x 10^-8/K level' \
(abstract); peak deviation of any sample from the five-sample mean 5e-8/K, noise per \
sample about +-2e-8/K (p. 3).

TABLE 4 is computed from the Table 3 Sellmeier ('based on the three term, \
temperature-dependent Sellmeier fit described in Table 3', caption, p. 7): the fit \
reproduces all 208 cells to their printed five decimals (see the formula's check). \
Figure 4's caption calls the same values 'measured'. The measured points themselves are \
not tabulated.

TABLE 5 (dn/dlambda, 1/um, 15 wavelengths 0.45-2.5 um x 13 temperatures): 'computed by \
dividing differences in index value ... by corresponding differences in wavelength' on \
the regular grid (p. 6); no quantity for it, not transcribed. E.g. -0.0772 (30 K) to \
-0.0780 (300 K) at 0.45 um; -0.0128 at 1.0 um; -0.0190 at 2.5 um; 'Spectral dispersion \
appears to be a very weak function of temperature' (p. 10).

TABLE 6 (dn/dT) comes from the piecewise quadratic fits in T, not from the Sellmeier: \
the Sellmeier's T-derivative differs from it by up to 2.1e-6/K (a factor 2.7 at 0.4 um \
and 30 K: 3.4e-6 against 1.25e-6; 9.4e-6 against 9.70e-6 at 0.4 um and 295 K). Use Table \
6, not the formula's derivative, for dn/dT.

COMPARISON WITH MALITSON (bears on TC-323). 'the well-accepted dispersion law for \
synthetic fused silica in air of Malitson' (p. 3); 'we adjust the dispersion law to \
vacuum assuming the index of air at room temperature to be 1.00027. Our measurements \
agree with that dispersion law to generally well less than 1 x 10^-5 and typically to \
less than +-5 x 10^-6 until the absorption feature starting at about 2 microns is \
reached' (p. 3); the departure beyond 2.25 um is attributed to purity and to how \
refractometers treat absorbing regions. A Corning 7940 prism, measured earlier, 'agreed \
well with Malitson's dispersion law (corrected to vacuum)' at 2.9-3.75 um (p. 5). \
Malitson (1965) is described as 'minimum deviation in air' (p. 1), and 'room \
temperature data of Malitson (which are in air)' (p. 9). These are Leviton and Frey's \
readings of Malitson, who does not say (TC-323). Recomputed here (2026-09-26): the Table \
3 fit at 293.15 K minus 1.00027 x Malitson's Eq. (1) is within +1.4e-5 to -3.1e-6 from \
0.4 to 2.0 um (at 295 K, +3.2e-5 to +1.2e-5); with Malitson's wavelengths read as \
standard-air values and Edlen's dry air at 20 C and 101 325 Pa, the rms is 4.5e-6 (mean \
-3.2e-6) over 0.4-2.0 um; read as absolute (vacuum), Malitson is 3.8-4.0e-4 below.

WAXLER AND CLEEK (Table 7): 'While their measurements were made in vacuum, their results \
are reported in air' (p. 1); W&C 'appeal[ed] to room temperature data of Malitson \
(which are in air)' (p. 9); Leviton and Frey 'correct W&C's measurements to be in \
vacuum' (p. 9) and find them 'lower than those from CHARMS by several parts in the fifth \
decimal place of index at temperatures below 160 K' (p. 10). The original is \
waxler_1971 (Corning Code 7940; Table 1, 'refer[s] to air at 20 C'). Recomputed \
2026-09-27: its Table 1 times the index of dry air at 20 C and 101 325 Pa (Edlen), \
minus this paper's Table 3 formula at the lines' vacuum wavelengths, reproduces all 60 \
Table 7 differences within 1.1e-5 (57 within 0.8e-5), i.e. to their rounding.

MATSUOKA ET AL. (Table 8). The original is matsuoka_1991. Its 'photon energies' are \
hc/lambda of the Hg lines' air wavelengths (hc = 1239.852 eV nm); Table 8 is \
reproduced (12 of 15 values to the rounding, the others within 0.9e-5) only with this \
paper's formula evaluated at 1239.852/E nm taken as a vacuum wavelength, i.e. at the \
air wavelength. At the true vacuum wavelengths Matsuoka minus CHARMS is 0.6-1.2e-5 \
higher: -1.6 to -1.0 x 1e-5 at 0.546 um, -1.0 to +0.6 at 0.436 um, -0.8 to +0.6 at \
0.405 um (recomputed 2026-09-27; see matsuoka_1991).

OTHER STUDIES named (p. 1), not tabulated: Malitson (1965) '+-0.5 x 10^-5 for the \
visible to +-2 x 10^-5 in the infrared'; Wray and Neu (1969), Corning 7940 in vacuum, \
+-2e-4, 300-1100 K; Matsuoka et al. (1991), 108-356 K. PMIC's dn(T) (Figure 2) show \
'two knees' at -70 C and -35 C; PMIC's dn/dT at 633 nm is 'everywhere higher' than \
CHARMS's (Figure 3); spreads: PMIC 15e-8/K near 265 K up to 150e-8/K, CHARMS at most \
9e-8/K (p. 5).

FIGURES (not digitised): 1, index at 633 nm of the five prisms against the global fit; \
2, PMIC's dn(T); 3, dn/dT at 633 nm, PMIC and CHARMS, 140-305 K; 4-6, n, dn/dlambda, \
dn/dT; 7, the wavelength-temperature coverage of the studies."""

[[formulas]]
id = "sellmeier"
form = "n2_sellmeier_temperature"
# Table 3 as printed (image and text layer), each list ordered T^0 ... T^4 as printed.
# lambda_1 is printed negative; it enters squared.
terms = { S1 = ["1.10127E+00", "-4.94251E-05", "5.27414E-07", "-1.59700E-09", "1.75949E-12"], S2 = ["1.78752E-05", "4.76391E-05", "-4.49019E-07", "1.44546E-09", "-1.57223E-12"], S3 = ["7.93552E-01", "-1.27815E-03", "1.84595E-05", "-9.20275E-08", "1.48829E-10"], L1 = ["-8.90600E-02", "9.08730E-06", "-6.53638E-08", "7.77072E-11", "6.84605E-14"], L2 = ["2.97562E-01", "-8.59578E-04", "6.59069E-06", "-1.09482E-08", "7.85145E-13"], L3 = ["9.34454E+00", "-7.09788E-03", "1.01968E-04", "-5.07660E-07", "8.21348E-10"] }
range_nm = [400, 2600]
temperature_range_k = [30, 300]
# The paper's room-temperature column (Tables 1, 2 and 4).
reference_temperature_k = 295
index_medium = "vacuum"
material = "SiO2"
parameters = { grade = "Corning 7980" }
equation = "The equations of p. 6 (unnumbered) with Table 3 (p. 6)"
printed = "n^2(lambda, T) - 1 = sum_{i=1}^{3} S_i(T) lambda^2 / (lambda^2 - lambda_i^2(T)), S_i(T) = sum_{j=0}^{4} S_ij T^j, lambda_i(T) = sum_{j=0}^{4} lambda_ij T^j"
variable = "lambda: wavelength in um (the paper does not say vacuum or air; taken as vacuum, see the source notes); T: temperature in K"
range = "'30 K <= T <= 300 K; 0.4 um <= lambda <= 2.6 um' (Table 3 heading); the measurements extend to 310 K (abstract)"
check = "Reproduces all 208 cells of Table 4 (16 wavelengths x 13 temperatures) to their five printed decimals: largest difference 4.9e-6 (4.6e-6 at 295 K), i.e. within the rounding. Checked 2026-09-26 against the printed coefficients. Its T-derivative does not reproduce Table 6 (a different fit; see the source notes)."
notes = "Fitted to 'raw measured indices' (p. 6); 'our best statistical representation of the measured data over the complete measured ranges of wavelength and temperature'; the S_i and lambda_i 'no longer have direct physical significance' (p. 6). The second term is a weak pole just below the range: its constant terms are lambda_2 = 0.2976 um and S_2 = 1.8e-5, but at the tabulated temperatures lambda_2(T) lies between 0.267 and 0.344 um (0.277 um at 30 K, 0.267 um at 100 K, 0.342 um at 295 K), with S_2(T) = 1.1e-3, 1.6e-3 and 2.0e-4 there. The formula diverges at lambda_2(T) and must not be extrapolated below 0.4 um. Corning 7980, absolute index (in vacuum)."

