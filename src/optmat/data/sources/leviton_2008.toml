[[datasets]]
id = "matsuoka_minus_charms_108K"
material = "SiO2"
file = "SiO2/leviton_2008__matsuoka_minus_charms_108K.csv"
table = "tbl_bb97e696ab87"
quantity = "refractive_index_deviation"
abscissa_unit = "um"
use = "reproduced"
reproduced_from = ["matsuoka_1991"]
notes = "Table 8, 108 K: Matsuoka et al.'s absolute indices (Type III silica glass, Nippon Seiki Glass Company; minimum deviation in vacuum, 'reported precision of +-3 x 10^-6', 108-356 K, p. 1) minus CHARMS. The paper does not say which CHARMS values (Table 7's comparison uses the Table 3 Sellmeier, taken here as the reference). 'CHARMS indices appear to be systematically higher than those of Matsuoka by 1 to 2 parts in the fifth decimal place', attributed to the material (p. 10). The original is matsuoka_1991 (which prints the maker as 'Nippon Sekiei Glass Co.', about 1200 ppm OH): its energies are hc/lambda of the Hg lines' air wavelengths, and these differences are reproduced only when the Table 3 formula is evaluated at that air wavelength; at the true vacuum wavelengths they are 0.6-1.2e-5 higher (see the source notes)."
[datasets.parameters]
reference = "leviton_2008/sellmeier"
temperature_k = 108
grade = "Type III silica glass (Nippon Seiki Glass Company)"
form = "bulk"
technique = "minimum deviation"
index_medium = "vacuum"

