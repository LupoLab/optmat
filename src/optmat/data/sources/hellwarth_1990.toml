printed = "as formula_B_N2, omega_0 = 158 +- 5 (10^3 cm^-1); text p. 2774: 'the choice omega_0 = 161146 cm^-1 reproduced all the BL results to better than 10 % at omega_L = 2 omega_0/3, and to better than 3 % at omega_L = omega_0/2 ... In the limit of low frequencies, the asymptotic data were fit even better ... by omega_0 = 153009 cm^-1'"
variable = "omega: wavenumber in cm^-1"
state = "20 C, 760 Torr (c in 1e-19 esu)"
density = "ideal"
range = "omega_L < 2 omega_0 / 3"
coefficients = { omega_0 = "158e3", omega_0_uncertainty = "5e3", sigma = "1.76" }
check = "Not checked against Bishop and Lam (not in the library). Table VII's He values 1.83 (515 nm) and 1.80 (633 nm) = 1.76 x F^B_1221 'agree with the values calculated in BL ... to within 0.5 %' (footnote c)."
notes = "The He dispersion that justifies formula B; He's LWL c1122 = c1212 = c1221 = sigma/24 (A0 = B0 = 0)."
