citation = "R. W. Hellwarth, D. M. Pennington and M. A. Henesian, \"Indices governing optical self-focusing and self-induced changes in the state of polarization in N2, O2, H2, and Ar gases\", Phys. Rev. A 41, 2766 (1990)"
doi = "10.1103/PhysRevA.41.2766"
library = "Hellwarth_1990_IndicesGoverningOptical"
identity = "VALIDATED_WITH_WARNINGS"
kind = "compilation"
technique = """Analysis of published dc Kerr constants (Carusotto et al. 1985 at 515 nm, \
absolute and relative to He; older 633-nm values of Buckingham and co-workers) and \
ESHG ratios to He (Mizrahi and Shelton 1985) on Bishop and Lam's He theory, through the \
Born-Oppenheimer form of the third-order response (electronic sigma plus nuclear \
response functions a(t), b(t)), with two dispersion formulas (A: linear-index Sellmeier \
poles; B: one fitted nonlinear pole omega_0 per gas, tensor-component-specific), to give \
the long-wavelength (LWL) parameters and the degenerate four-wave-mixing c coefficients \
(self-focusing c1111, polarization change c1122) from 261 to 1053 nm (secs. III-VI). No \
new measurement."""
notes = """Journal pages 2766-2777 = PDF pages 1-12 (Table VII is on p. 2774). Identity \
checked against the first page. N2, O2, Ar, H2, He; air (0.78 N2 + 0.21 O2) is not \
curated: its rows are skipped.

UNITS AND DEFINITIONS (Gaussian esu throughout, p. 2766-2768). Eqs. (1)-(2): real fields \
E(r, t) = Re sum_i^+ E(r, omega_i) exp(-i omega_i t), P likewise (full complex \
amplitudes, 'some authors express the fields in terms of Fourier amplitudes which are \
one-half of the ordinary E and P amplitudes'); n = (1 + 4 pi chi)^(1/2). Eq. (4): P_alpha^NL \
(omega) = D c_(alpha beta gamma delta)(omega_i, omega_j, omega_k, omega_l) E_beta(omega_j) \
E_gamma(omega_k) E_delta(omega_l), omega_i + omega_j + omega_k + omega_l = 0, omega = \
-omega_i, 'The degeneracy factor D ... takes on the values 1, 3, or 6 when either all \
three, or any two, or none of the last three frequency arguments ... are equal' (the \
Maker-Terhune c tensor; 'sometimes denoted chi(3) ... and sometimes written 4 chi(3) when \
field conventions differ by a factor of 2'). Isotropic form, Eq. (8): c = d d c1122 + d d \
c1212 + d d c1221. Eq. (11): Delta n = n2 <E^2> = (1/2) n2 E*(omega).E(omega); Eq. (12): n2 \
= (12 pi / n) c1111(-omega, -omega, omega, omega) (self-focusing index, esu, per mean \
square field). ESHG: c1111(-2 omega, 0, omega, omega) (D = 3); dc Kerr: c1221(-omega, \
omega, 0, 0) (D = 3); THG: c1111(-3 omega, omega, omega, omega) (D = 1). Born-Oppenheimer \
form, Eq. (13): P^NL(t) = (1/2) sigma E(t) E^2(t) + int ds [a(t - s) E(t) E^2(s) + b(t - s) \
E(s) E(t).E(s)], sigma the electronic ('nuclei frozen'), a and b the isotropic \
(vibrational Raman) and anisotropic (rotational) nuclear responses, A_nu, B_nu their \
Fourier transforms (Eq. (14)). LWL relations: Eq. (15) c1111(-omega, -omega, omega, \
omega) = sigma/8 + (A0 + B0)/6; Eq. (16) A0 = -B0/3 (pure vibrational Q branch \
neglected); Eq. (17) c1122 = (sigma + 2 B0)/24, c1212 = (sigma + 2 A0 + B0)/24; Eq. (18) \
ESHG and THG c1111 = sigma/8; Eq. (19) (n_par - n_perp) / (2 pi E0^2) = 24 c1221(-omega, \
omega, 0, 0)/n (dc Kerr; Carusotto et al.'s K = (n_par - n_perp) rho E0^2 as printed, p. \
2768); Eq. (20) 24 c1221(-omega, omega, 0, 0)_LWL = sigma + B0. Eq. (21), p. 2769: '5.036 x \
10^-40 gamma_zzzz(omega_4, omega_1, omega_2, omega_3) a.u. = 24 rho^-1 \
c1111(omega_4, ...) esu' (Bishop and Lam's per-atom gamma in atomic units), and p. 2770: \
'When converted to esu, the gamma parameter of Ref. 16 [Boyle et al. 1966 = boyle_1966] equals 3 \
sigma/rho'. So sigma = rho gamma_T(esu)/3 with gamma_T the Taylor-series gamma, 1 au = \
5.036e-40 esu. Check (2026-09-26): He sigma = 1.76e-19 esu at 20 C, 760 Torr (ideal rho = \
2.5035e19 cm^-3) gives gamma = 41.9 au, Bishop and Lam's value; the Bishop-Pipin update \
raises it 2.9 % (note 15, p. 2776) to ~43.1; Ar sigma = 47.4 gives 1128 au (x 1.029 = 1161).

TABLE I (p. 2770; image checked; tools/extract/hellwarth_1990.py): dc Kerr \
(n_par - n_perp)/(2 pi E0^2) in 1e-19 esu at 20 C, 760 Torr; 'Values in parentheses are \
limits of error of last figures given by source. All other values have estimated error \
limits of +-10 %'. Footnotes: a, Carusotto et al.'s value divided by their He value; b, \
that ratio times the He theory (1.83 at 515 nm, 1.80 at 633 nm, g); c, Carusotto et al.'s \
absolute value (Nuovo Cimento 5D, 328 (1985); not in the library; 2-3 % errors, He +-7 %, \
their He 9 % above Bishop and Lam, p. 2770); d, Buckingham et al., Trans. Faraday Soc. 66, \
1548 (1970) (no He calibration); e, Buckingham and Dunmur (1968) = buckingham_1968, 'as \
quoted ... divided by the helium value also given there'; f, Buckingham and Orr, Proc. R. \
Soc. A 305, 259 (1968) (no He calibration); g, Bishop and Lam's per-atom value (ideal gas, \
~+-3 %). Average: c weighted three times b. ERRATUM: H2 'Normalized to He' printed 3.2; b \
= a x 1.83 holds for N2 (129 -> 236), O2 (281 -> 514), Ar (25.5 -> 46.7) and gives 59/1.83 = \
32.2 for H2. Checks: N2 average (236 + 3 x 257)/4 = 251.75 (252 printed), Ar 49.7, H2 62.8 \
(63); O2 (515 + 3 x 559)/4 = 548.0 against 549 printed (1 unit; not corrected).

TABLE II (p. 2771, CSV; image checked): sigma (1e-19 esu, 20 C, 760 Torr) = Mizrahi and \
Shelton's ESHG ratio to He, extrapolated to the LWL with Eq. (22) and multiplied by He's \
1.76 (Bishop and Lam); errors in parentheses (absolute: 36.5(1.4) = +- 1.4). Eq. (22): \
c1111(-2 omega, omega, omega, 0) = (sigma/8)(1 - 6 omega^2/omega_0^2)^-1, the MS data \
(700-450 nm) spanning 0.12-0.35 omega_0.

TABLES V AND VII (pp. 2772, 2774): sigma + B0 (= 24 c1221 LWL) from each Kerr value \
divided by F^A(-omega, omega, 0, 0) = (1 - omega^2/omega_s^2)^-2 (V) or F_1221^B = (1 - 13 \
omega^2 / 6 omega_0^2)^-1 (VII); parentheses = relative weights of the average (footnotes \
b of V, a of VII), not errors. Ar: the average (44.4, 42.9) is replaced in the \
calculations by 47.4, 'directly from sigma of Table II' (+-5 %) (row 'used'). Estimated \
uncertainty of these values '~+-10 %' (VII caption, V footnote c). Structural fixes in \
the script (averages misplaced in the cells of Table V; Table VII's H2 49.7(3) printed \
without its wavelength: 633 nm, it is 52.5/F_1221^B(633)).

TABLES VI AND VIII (pp. 2773, 2775): DFWM c coefficients (-omega, -omega, omega, omega), \
'omega(cm^-1) = lambda^-1', 1e-19 esu, 20 C, 760 Torr, from formula A (VI: F^A = (1 - \
omega^2/omega_s^2)^-4; c1122 = [2(sigma + B0) - sigma] F^A/24, c1111 = [(sigma + B0)/9 + \
sigma/72] F^A) and formula B (VIII: c1122 = [2(sigma + B0) - sigma] F_1122^B/24, c1212 = \
[(sigma + B0)/72 + sigma/36] F_1212^B, c1111 = c1122 + 2 c1212; notes a and b of Table \
VIII say 'Table VIII' for the sigma + B0 source, meaning Table VII). Uncertainty '+-10 %' \
(Kerr), Ar +-5 % (VIII caption); formula A 'at least +-10 %'. CHECK (2026-09-26, scratch \
script): with sigma (Table II), sigma + B0 (Table V averages, Ar 47.4) and omega_s (Table \
III), formula A reproduces all 20 curated entries of Table VI to <= 0.6 %; with Table \
VII's averages and omega_0 (Table IV), formula B reproduces Table VIII's c1122 and c1212 \
to <= 0.3 %, except Ar at 261 nm: c1212 printed 2.45 against 3.14 computed (and so c1111 \
9.74 against 11.11; the printed row is self-consistent, 4.84 + 2 x 2.45 = 9.74). Not \
corrected (no printed alternative); flagged in the dataset notes. O2 1053 nm c1111 printed \
58.2 against c1122 + 2 c1212 = 58.54 (and 58.52 computed): a 0.6 % inconsistency, not \
corrected. Air c1111 at 333 and 522 nm (104, 61.8) disagree with 0.78 N2 + 0.21 O2 (57.3, \
39.3): air skipped anyway.

CONVERSION CHECK (for the reader; not data): Ar c1111(1053 nm, VIII) = 6.09e-19 esu -> n2 \
= 12 pi c1111 = 2.30e-17 esu per <E^2>; with I = (c n / 8 pi)|E|^2 and Delta n = (1/2) n2 \
|E|^2 this is 4 pi n2 / c = 9.6e-20 cm2/W (x 1e7 from erg/s to W) at 20 C, 1 atm.

TEXT (notes only): air at 1053 nm and 20 C: c1122(-omega, -omega, omega, omega) = (24 +- 3) \
x 10^-19 esu (Eq. (33), formula A 23.86, B 23.8) and n2 = (1.2 +- 0.2) x 10^-16 esu (Eq. \
(34), B value 32.55 of c1111); Ar n2 5.4 times less than air's, its ICSP coefficient 11 \
times less; 1-ns pulses may see a c1221 of air ~20 % lower (Raman linewidths ~3 GHz) \
(p. 2776). Shimoji et al.'s 308-nm air n2 ~2.9e-16 esu per atm at 300 K against 1.6e-16 \
(A) and 3.9e-16 (B) at 333 nm."""

