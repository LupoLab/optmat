citation = "D. Franta, D. Nečas, L. Zajíčková and I. Ohlídal, \"Dispersion model of two-phonon absorption: application to c-Si\", Opt. Mater. Express 4, 1641 (2014)"  # codespell:ignore mater
doi = "10.1364/ome.4.001641"
library = "Franta_2014_DispersionModelTwo"
identity = "VALIDATED"
kind = "fit"
technique = """A dispersion model of two-phonon absorption (15 additive and subtractive \
branch combinations, each a piecewise function with 3D and 2D critical-point singularities \
between four critical points, Bose-Einstein thermal factors, Gauss-Dawson \
eps-broadening) fitted to Bruker Vertex 80v transmittance of float-zone c-Si (580 um \
slab, 450-1000 cm-1; 14 mm slab, 70-450 cm-1) at 300 K, and checked with Woollam \
IR-VASE ellipsometry at five temperatures, 300-500 K, 300-1000 cm-1 (back side \
aluminium-coated; only the thermal coefficient nu_T was fitted there) (p. 1650)."""
notes = """Journal pages 1641-1656 = PDF pages 1-16. Identity checked against the first page. \
Material: float-zone crystalline silicon (Si); no n or k is tabulated (the optical \
constants are Fig. 5 only, not digitised).

EQUATION MAP (journal pages). F_2ph = sum over branch pairs of F_(A+B) + F_(A-B) (Eq. \
(8), p. 1645); Eq. (14): F_(A+-B)(E, T) = f_(A+-B)(E, T) P_(A+-B)(E); critical-point \
energies Eq. (15), p. 1646: E_(t,A+-B) = h [nu_A(M_t) +- nu_B(M_t)] [1 + nu_T (T - 300)] \
nu_iso, nu_iso = 0.9982 for natural silicon; the 17 independent frequencies and their \
degeneracies, Eq. (16); auxiliary variables X, Y of regions I-III, Eqs. (17)-(18), p. \
1647; the ten critical-point contributions L_i (Table 1, p. 1647: 0 3D M0 sqrt(X_I); 1 3D M1 1 - \
sqrt(Y_I); 2 2D M1 -ln Y_I; 3 2D M1 -ln X_II; 4 3D M1 Y_II; 5 3D M2 X_II; 6 2D M1 -ln Y_II; 7 \
2D M1 -ln X_III; 8 3D M2 1 - sqrt(X_III); 9 3D M3 sqrt(Y_III)), P = H(E) sum_i A_i L_i \
(Eq. (19), p. 1648), the shape function H(E) with kappa_0..kappa_5, Eq. (20), and its \
properties Eq. (21); thermal factors Eqs. (22)-(23), f_(A+B) = 1 + f_BE(E_A) + f_BE(E_B), \
f_(A-B) = f_BE(E_B) - f_BE(E_A), with phonon energies interpolated linearly, Eq. (24); \
normalisation at 300 K, Eqs. (25)-(26), p. 1649; eps-broadening with the Gauss-Dawson \
kernel beta^(x) = -(sqrt(2)/(pi B)) D(x/(sqrt(2) B)) + i exp(-x^2/(2 B^2))/(sqrt(2 pi) B), \
Eq. (27) (franta_2014); B the rms and beta = 2 sqrt(2 ln 2) B/(h c) the FWHM in cm^-1, Eq. \
(28), used as the fitting parameter; eps^0_(A+-B) = beta^ * F^0/E, Eq. (29); combined TO+TA \
and LA+TA terms weighted by C, Eq. (30); eps_(A+-B) = alpha_(A+-B) N_Si eps^0_(A+-B), Eq. \
(31), N_Si the transition strength of the silicon nuclei (franta_2013); the two-phonon \
effective charge e*_2ph = Z_Si e sqrt(sum alpha), Eq. (32).

PARAMETERS (formulas below). Table 2 (p. 1650): phonon frequencies (THz) at the \
symmetry points at 300 K, fitted (A(Gamma) = 0 fixed); nu_T = -3.4e-5 K^-1 (p. 1654, from \
the ellipsometry); Table 5 (p. 1653): alpha, beta (cm^-1), C, A_0..A_9, kappa_0..kappa_5 \
for the 15 terms, daggers = fixed ('we fixed A_5 = 1', C_(A+-B(1)) = 1, and kappa_0, \
kappa_5 = 0 at Gamma-point M0/M3, p. 1650). Tables 3 and 4 (pp. 1651-1652) identify the \
critical points of each term as sums and differences of Table 2's frequencies, with \
the photon wavenumbers; they add no parameters. Checked: the THz sums reproduce Table \
2 (e.g. TO+TO M0 = 2 x 14.09 = 28.18); the wavenumber columns are the THz values over \
c to 0.1 cm^-1 within rounding (28.18 THz = 940.0 cm^-1, printed 939.9: the columns were \
evidently computed from unrounded frequencies).

LIMITS (p. 1654): good agreement at 300 K over 70-1000 cm^-1; above 300 K the model \
misses absorption at 750-850 cm^-1 (three-phonon processes, added in franta_2017); \
broadening independent of temperature over 300-500 K. The paper's Table 5 needs N_Si \
(franta_2013: N_n of Eq. (46)) to be used absolutely; franta_2017 supersedes this \
model for temperatures other than 300 K and gives new phonon frequencies at 0 and 300 \
K (its Table 4)."""

