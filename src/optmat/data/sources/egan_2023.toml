printed = "4.195735"
corrected = "4.1957363"
reason = "The authors' correction (egan_2024_correction, p. 2): the Gouy phase shift was treated incorrectly in the working equation (Eq. (1) of this paper), and the reported molar refractivities of argon and nitrogen were 'fractionally small by 0.3 x 10^-6 A_R'. The correction applied: 4.195735 x (1 + 0.3e-6) = 4.1957363 (computed; not a printed value). One tenth of the 3.1e-6 standard uncertainty (TC-724)."
evidence = "egan_2024_correction (library Egan_2024_CorrectionOptical90, pp. 1-2, text read 2026-09-29): the corrected Eq. (3) and the statement of the effect on A_R; the printed 4.195735(13) is on p. 11 of this paper."

