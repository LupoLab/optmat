citation = "A. S. Sharipov, B. I. Loukhovitski, and E. E. Loukhovitskaya, Influence of Internal Degrees of Freedom on Electric and Related Molecular Properties, SpringerBriefs in Molecular Science (Springer, Cham, 2022)"
