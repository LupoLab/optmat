[[formulas]]
id = "fit"
material = "SF6"
equation = "text, p. 319"
printed = "gamma = A (1 + B nu^2); A = (8.21 +- 0.09) x 10^-62 C^4 m^4 J^-3 and B = (8.44 +- 0.03) x 10^-10 cm^2, where nu is in cm^-1"
variable = "nu: vacuum wavenumber of the fundamental in cm^-1 (not nu_L^2: for ESHG nu_L^2 = 6 nu^2, so B corresponds to Shelton & Rice's A = B/6 = 1.41e-10 cm^2)"
process = "eshg"
convention = "T"
part = "total"
range = "457.9-694.3 nm (Table 1, including Ward & Miller's 694.3 nm point: 'the results are also presented graphically in fig. 1')"
coefficients = { A = "8.21e-62", B = "8.44e-10" }
coefficient_units = { A = "C^4 m^4 J^-3", B = "cm^2" }
calibration = "N2: Mizrahi & Shelton's smoothed gamma_N2 (ref [10]), on the old He calibration"
check = "Gives 9.753e-62 at 670.0 nm (14921 cm^-1 from the air wavelength) and 10.826e-62 at 514.5 nm against 9.75 +- 0.07 and 10.84 +- 0.04. Checked 2026-09-26."
notes = "Weighted least-squares straight line against nu^2; A and B uncertainties as printed. Superseded by shelton_1990's refit (gamma_0 = 89.10e-63, A = 0.500e-10, B = 2.124e-20 against nu_L^2, including 1064 and 1319 nm)."
