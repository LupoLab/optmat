notes = "Table 1 (p. 319): gamma_SF6 in 1e-62 C^4 m^4 J^-3, 'Obtained using the smoothed results given in ref. [10]' for gamma_N2 (Mizrahi & Shelton, then to be published; the N2 ESHG curve of mizrahi_1985_arn2o2, itself calibrated against He); 'The error bars given for gamma_SF6 include allowance for +-0.4% uncertainty in the calibration values of gamma_N2' (p. 319). Total ESHG gamma; 'The nu^2 dependence seen in these experiments substantiates the usual assumption that vibrational contributions to gamma are negligible at optical frequencies for ESHG' (pp. 319-320; shelton_1988 later finds gamma^v_ESHG ~ -3e-62, not negligible). shelton_1990 Table III(b) reproduces these on its new He calibration (e.g. 98.2e-63 against 9.75e-62 at 670 nm)."
[datasets.uncertainty]
