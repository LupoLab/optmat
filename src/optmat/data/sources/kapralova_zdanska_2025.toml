two-photon Rabi frequency from counter-rotating terms and complex (ionisation) \
widths; checked against full-dimensional complex-scaled Floquet calculations of He \
(exponentially tempered Gaussian basis ExTG5G, L_max = 2, singly excited bound and \
continuum states, scaling angles theta = 0.2-0.4) for linear polarisation near 120.3 nm \
and up to 7.5 TW/cm^2, fitted three ways (quasi-energy splits, Sec. III; resonant-beat \
laser parameters, Sec. IV B; diabatic quasi-energy surfaces, Sec. IV C)."""
