[[formulas]]
id = "damage_scaling"
material = "SiO2"
equation = "Eq. (4.1), p. 52"
printed = "F_{th}(U_g, t_p) = (c_1 + c_2 U_g) t_p^\\kappa, c_1 = -0.16 J cm^{-2} fs^{-\\kappa}, c_2 = 0.074 J cm^{-2} fs^{-\\kappa} eV^{-1}, \\kappa = 0.3"
variable = "U_g: band gap (eV); t_p: pulse duration (fs); F_th in J/cm2"
coefficients = { c1 = "-0.16", c2 = "0.074", kappa = "0.3" }
check = "Computed 2026-09-26 at t_p = 500 fs with Table 4.1's gaps: SiO2 (9.0 eV) 3.26, Al2O3 (9.9 eV) 3.69, YAG (6.5 eV) 2.07, CaF2 (10 eV) 3.74, LiF (13.6 eV) 5.46, BaF2 (9.1 eV) 3.31 J/cm2, against Table 4.2's 4.85, 5.36, 7.5, 5.17, 4.43, 2.91: the law, fitted to oxide films, does not reproduce these bulk single-shot surface values (ratios 0.3-1.2)."
notes = "Reproduced from [7] of Chap. 4: Mero, M., Liu, J., Rudolph, W., Ristau, D., Starke, K.: Scaling laws of femtosecond laser pulse induced breakdown in oxide films. Phys. Rev. B 71, 115109 (2005) (mero_2005, formula scaling_law: c1 = -0.16 +- 0.02, c2 = 0.074 +- 0.004, kappa = 0.30 +- 0.03, the same numbers). 'In the femtosecond range, the optical damage threshold scales with the material bandgap and input pulse duration t_p, which for oxides is expressed by the empirical relation' (p. 52). The material key is nominal: the law is for oxide films in general."
