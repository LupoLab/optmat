citation = "A. Dubietis and A. Couairon, Ultrafast Supercontinuum Generation in Transparent Solid-State Media, SpringerBriefs in Physics (Springer, Cham, 2019)"
doi = "10.1007/978-3-030-14995-6"
library = "Dubietis_2019_UltrafastSupercontinuumGeneration"
identity = "VALIDATED_WITH_WARNINGS"
kind = "compilation"
technique = """A monograph on supercontinuum generation in bulk solids: its material \
tables (Tables 4.1, 4.2, 5.1, 5.2) and a few values in the text compile band gaps, \
transmission ranges, n2, n0, zero-GVD wavelengths and damage fluences from the \
literature. It measures nothing itself."""
notes = """Book pages as printed in the running heads (the PDF page is the book page plus \
5-7: Table 4.1 is PDF page 56 = p. 50). Identity checked against the title page.

TABLES (checked cell by cell against the table images, 2026-09-26; all agree): \
Table 4.1, p. 50, 'Linear and nonlinear parameters of basic dielectric media used for \
supercontinuum generation. U_g is the energy bandgap, the transmission range is \
defined at 10% transmission level in a 1 mm thick sample, n0 and n2 are linear and \
nonlinear refractive indexes, respectively, and are given for lambda = 800 nm, lambda_0 \
is the zero GVD wavelength. Reproduced from [5] with permission' ([5] = Dubietis, \
Tamosauskas, Suminas, Jukna, Couairon, Lith. J. Phys. 57, 113-157 (2017), not in the \
library). Table 4.2, p. 52, 'Single-shot optical damage thresholds for some \
dielectric materials, measured with 500 fs pulses at 1030 nm [6]' ([6] = Gallais and \
Commandre, Appl. Opt. 53, A186 (2014), not in the library); the text calls them \
'single-shot surface damage threshold values' and adds that they 'do not account for \
the optical degradation of the materials (due to color center formation, etc.) exposed \
to multiple repetitive pulses' (p. 52). Table 5.1, p. 67, glasses, and Table 5.2, p. 82, \
semiconductors ('transmittance is defined at 10% transmission level of 1 mm thick \
sample'): U_g, transmittance, n2, lambda_0, with no source and no wavelength for n2; \
their values are recorded as check values, except the fused-silica and BK7 rows of \
Table 5.1, which repeat Table 4.1 and are marked reproduced like it.

NOT EXTRACTED (no quantity): the transmission ranges (um, 10 % in 1 mm) and the zero-GVD \
wavelengths lambda_0 (um). Table 4.1: LiF 0.12-6.6, 1.23; CaF2 0.12-10, 1.55; Al2O3 \
0.19-5.2, 1.31; BaF2 0.14-13, 1.93; SiO2 (FS) 0.18-3.5, 1.27; KDP 0.18-1.55, 0.98; YAG \
0.21-5.2, 1.60; beta-BBO 0.19-3.5, 1.49; BK7 0.3-2.5, 1.32; KGW 0.3-5, 2.2; YVO4 \
0.35-4.8, blank. Table 5.1: fused silica 0.18-3.5, 1.27; ZBLAN 0.25-6.9, 1.7; BK7 \
0.3-2.5, 1.32; La glass 0.3-3.6, 1.8; Te glass 0.38-6.15, 1.95; As2S3 0.59-13, 4.8. \
Table 5.2: ZnS 0.4-12.5, 3.6; ZnSe 0.5-20, 4.8; GaAs 0.9-17.3, 6.0; Si 1.1-6.5, '-'. \
Text: PbF2 0.29-12.5 um (p. 74); KRS-5 0.58-42 um, KRS-6 0.42-27 um (p. 86). Water \
(H2O, Table 4.1: 6.9 eV, 0.18-1.3 um, n2 5.7e-16 cm2/W, n0 1.33, lambda_0 1.0 um) is a \
liquid and is skipped. The critical powers of Fig. 4.1 (800 and 1030 nm, 'various \
dielectric materials', reproduced from [5]) are a figure only.

MATERIALS. 'SiO2 (FS)' and 'Fused silica' are SiO2 (glass). BK7 is recorded as BK7 as \
printed (whether the historical BK7 or N-BK7 is not said). The anisotropic crystals \
(Al2O3, KDP, beta-BBO, KGW, YVO4) have one n0 and one n2 with no axis or polarization \
stated. The band gaps' kind is not defined (recorded as 'optical'). 'La glass', 'Te \
glass', ZBLAN, As2S3, PbF2, diamond, KRS-5 and KRS-6 were registered for this record \
(identity only: the compositions of La and Te glass are not given).

TEXT VALUES (inline datasets): PbF2 U_g = 5 eV and n2 = 11.7e-16 cm2/W (p. 74, ref. \
[72] of Chap. 5); diamond U_g = 5.47 eV and calcite U_g = 5.9 eV (p. 86, near refs. \
[133], [134]); KRS-5 and KRS-6 U_g = 2.5 and 3.25 eV and n2 = 10.5e-15 and 5.4e-15 cm2/W \
'as evaluated from measurements of the nonlinear transmission' (p. 86, ref. [137]; the \
KRS-6 value, garbled in the extraction, read from the PDF text layer); sapphire's \
critical power 'P_cr ~ 3.3 MW' in the holographic filament study of ref. [18] of Chap. \
2 (p. 18). LiF's 13.6 eV is repeated on p. 74.

OTHER STATEMENTS (p. 50): the SC threshold K = <U_g/(hbar omega_0)> + 1 >= 3 (K the \
multiphoton order); 'In the near-infrared spectral range, the typical values of P_cr \
in wide bandgap dielectric media are of the order of several MW' (p. 51). The damage \
scaling law Eq. (4.1) is recorded as a formula."""

