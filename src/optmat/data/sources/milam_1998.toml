citation = "D. Milam, \"Review and assessment of measured values of the nonlinear refractive-index coefficient of fused silica\", Appl. Opt. 37, 546-550 (1998)"
doi = "10.1364/ao.37.000546"
library = "Milam_1998_ReviewAssessmentMeasured"
identity = "VALIDATED_WITH_WARNINGS"
kind = "compilation"
technique = """A review: 24 absolute measurements of the n2 (gamma) of fused silica at 248-1550 nm \
from 16 references (Table 1), selected by three criteria (all parameters of the \
calculation measured; an uncertainty assigned; not superseded by the same authors). \
Best values: an error-bar weighted average of eleven values at 1053-1064 nm (Table 2; \
three of them translated to 1064 nm with the PERT dispersion equation), then a PERT \
function with its resonance moved from 1.25e5 to 1.45e5 cm^-1 scaled through the \
1053-nm value and read at 527 and 351 nm."""
notes = """Journal pages 546-550 = pdf pages 1-5. Identity checked against the first page.

DEFINITION (p. 546): 'The defining relationship is n = n0 + gamma I. Here n0 is the \
linear refractive index and I is the intensity' (the paper's gamma is optmat's n2, the \
self coefficient; linear polarization is not stated but is the reviewed experiments' \
usual case). Units 1e-16 cm^2/W throughout (Table 1 footnote a; Figs. 1-2). The pdf's \
font maps the characters: '6' in the extracted text and tables is '+-', '2' in \
exponents is a minus (10216 = 10^-16), '~ !' are parentheses, 'y' is '/'.

TABLE 1 (p. 547) lists each value with its reference number; the rows are recorded as \
one reproduced dataset per reference (the originals are not in the library except \
white_1984 and desalvo_1996, both curated). Technique, pulse duration, polarization and \
the part of the response (electronic, Raman, electrostriction) are not given per row; \
part is 'unknown'. What each cited title says is in the dataset notes. Three data of \
Adair et al. 1992 (Opt. Mat. 1, 185; Ref. 8) were omitted 'on the recommendation of the \
authors ... concern about the accuracy of the Raman standard' (p. 547). The initial \
sorting 'eliminated a few of the values that have been propagated through general \
reviews' (Refs. 23-25: Chase and Van Stryland 1995; Azarenkov et al. 1993; Smith 1986).

TABLE 2 (p. 548), 'Values used in the first of the error-bar weighted averages at 1053 \
nm': the text calls them 'the assemblage of eleven 1064-nm values'. Recorded as one \
dataset at 1064 nm with the printed wavelength as the column measured_nm. The 804-, \
1319- and 1550-nm values are translated to 1064 nm with the PERT equation; the text \
(p. 548) says 'The required scalings were -3% for the 804-nm datum and +2% for the \
1550-nm datum' (the 1319 scaling is not stated); the printed values give 2.40/2.48 = \
0.968, 2.71/2.66 = 1.019, 2.87/2.79 = 1.029 (computed here), so the 1550-nm scaling is \
+2.9 %, not +2 %. The other eight rows repeat Table 1, except that the last 1064-nm \
row (2.14 +- 0.43) is attributed to Ref. 16 in Table 2 and to Ref. 4 (DeSalvo) in \
Table 1: Table 1 is right (DeSalvo's 1064-nm value converted to cm^2/W is 2.1; Ref. 16 \
has its own row, 3.3 +- 1.0). The reference numbers are not data columns, so this is \
recorded here and not as an erratum. Table 2 also confirms that Table 1's row 17 \
(1.73 +- 0.35, ref. 14) belongs at 1064 nm (erratum below).

BEST VALUES (the assessment; primary for this source). 'With all 11 data included, \
the average was gamma = (2.56 +- 0.3) x 10^-16 cm^2/W. Data that fell outside this \
uncertainty range were deleted, and the average was recalculated. The result was \
gamma = (2.74 +- 0.17) x 10^-16 cm^2/W' (p. 548). 'The weight of each datum was \
inversely proportional to its uncertainty. The uncertainty of the average was taken \
to be the root mean square of the individual uncertainties' (p. 548). The text calls \
this 'the best 1064-nm value' (p. 548) and the abstract and Section 4 the 1053-nm value; \
'it cannot distinguish values of gamma for 1053 and 1064 nm' (p. 548): recorded at 1053 \
nm, as the abstract. At 527 and 351 nm: 'gamma = (3.0 +- 0.35) x 10^-16 cm^2/W at 527 nm \
and gamma = (3.6 +- 0.64) x 10^-16 cm^2/W at 351 nm. The uncertainties were selected \
arbitrarily to be large enough to account for the majority of the data at nearby \
wavelengths' (p. 549), read from the PERT curve with the resonance at 1.45e5 cm^-1 \
(solid curve of Fig. 2). Four data were deleted before this (p. 548): 2.5 +- 1.2 at 351 \
nm and 3.3 +- 1.7 at 694 nm (uncertainties too large), and 1.7 +- 0.7 at 351 nm and \
'1.72 +- 0.34 at 351 nm' (negative dispersion); the last is Table 1's 532-nm row 11 \
(Fig. 2 has no ref.-14 point), so the text's '351 nm' is a slip for 532 nm.

DISPERSION (p. 547): the PERT equation (Adair, Chase and Payne 1992, Ref. 8; a single UV \
resonance, computed for silica at 1.25e5 cm^-1) and the Kramers-Kronig two-band model \
(Sheik-Bahae et al. 1991, Ref. 26). The PERT equation is not printed here (Santran et \
al. 2004, Eq. 20, print it; santran_2004), so it is not recorded as a formula. 'The PERT \
equation predicts that gamma decreases by approximately 5% between 804 and 1550 nm' \
(p. 548).

FIGURES. Fig. 1 (p. 547): the 24 values of Table 1 with error bars against wavelength, \
labelled by reference. Fig. 2 (p. 548): the values kept after the selection and the two \
PERT curves (resonances 1.45e5, solid, and 1.25e5 cm^-1, dashed). Not digitised.

REFRACTIVEINDEX.INFO. The SiO2 'Milam' n2 page (data/external/refractiveindex_info_solid.\
json) gives 3.6e-20, 3e-20, 2.74e-20 m^2/W at 0.351, 0.527, 1.053 um: the three best \
values, as here (no pulse or technique, correctly). Its SiO2 'DeSalvo' page (7.82e-20, \
2.41e-20, 2.24e-20, 2.14e-20 m^2/W at 266, 355, 532, 1064 nm) matches this review's \
ref.-4 rows (Milam's conversion), not the conversion with DeSalvo's own Table II n0 \
(2.21 and 2.10 at 532 and 1064 nm; see desalvo_1996).

REPRODUCTIONS. DeSalvo's four values (Ref. 4) are consistent with 40 pi n2(esu)/(c n0) \
applied to DeSalvo's Table I (28, 8.5, 7.8, 7.4 x 10^-14 esu): with DeSalvo's own \
n0 (Table II: 1.5, 1.48, 1.48, 1.48) the conversion gives 7.82, 2.41, 2.21, 2.10 \
(computed here); Milam's 2.24 and 2.14 imply n0 = 1.460 and 1.450 at 532 and 1064 nm, \
so Milam converted with his own silica indices. The uncertainties scale the same way \
(DeSalvo's +-6 at 266 nm gives +-1.68: the printed +-0.17 is a misprint, erratum)."""

