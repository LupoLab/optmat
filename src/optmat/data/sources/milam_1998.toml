quantity = "nonlinear_index"
unit = "cm2/W"
scale = 1e-16
abscissa_unit = "nm"
use = "primary"
notes = "The selected value (abstract, p. 546; p. 548): the error-bar weighted average of the Table 2 values after deleting those outside the first average's range; 'agrees with all the most precise data at 1064 nm and has been selected for use in the design in the NIF'. Uncertainty: the rms of the kept values' uncertainties (p. 548). An assessment, not a measurement; part unknown (the averaged experiments differ)."
[datasets.uncertainty]
column = true
level = "rms"
[datasets.parameters]
part = "unknown"
coefficient = "self"

