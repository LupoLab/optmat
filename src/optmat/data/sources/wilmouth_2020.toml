citation = "D. M. Wilmouth and D. S. Sayres, J. Quant. Spectrosc. Radiat. Transfer 255, 107224 (2020)"
doi = "10.1016/j.jqsrt.2020.107224"
library = "Wilmouth_2020_DeterminationRayleighScattering"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Broadband cavity-enhanced spectroscopy (BBCES), 264-297 nm: laser-driven Xe arc \
lamp, 35 cm cavity of two plano-concave mirrors (peak reflectivity 0.996655 at \
289.6 nm), 0.3 m spectrograph calibrated on Hg lines. Cavity filled with the pure gas \
at 1020-1060 hPa, static. Mirror reflectivity from N2 against He (N2 n-based cross \
section, +-1 %), then the sample's Rayleigh extinction against He (Eqs. 2-3). Purity \
99.999 % (He, N2, Ar), 99.99 % (CO2, CH4), 99.8 % (SF6)."""
notes = """The measured quantity is the Rayleigh scattering cross section (cm^2 per \
molecule), not the refractive index; it relates to n through Eq. (1), sigma = \
24 pi^3 nu^4 / N^2 ((n^2 - 1)/(n^2 + 2))^2 F_k, with the King factor F_k. The measured \
cross sections are shown only in figures (Figs. 1-3: 238 points per gas over \
264-297 nm, and the authors' 2019 UV-A data), never tabulated, so no dataset is \
extracted. The text gives the mean ratio of measured to n-based cross sections over \
264-297 nm (p. 5): Ar 1.008, CO2 0.990, SF6 0.959, CH4 0.775 (the n-based values from \
Table 1 of Wilmouth & Sayres 2019 and Sneep & Ubachs 2005); mean 1-sigma uncertainty \
3.1 % (Ar), 2.1 % (CO2), 1.9 % (SF6), 2.1 % (CH4), including 1.5 % from the path \
length (N2 reference cross section), 0.3 % temperature and 0.1 % pressure (p. 3). \
There is no vocabulary quantity for a Rayleigh cross section; one would be needed to \
curate such data (the He et al. 2021 values are tabulated).

The paper's own results are four dispersion formulas for SF6 and CH4 (Eqs. 4-7), \
derived by inverting Eq. (1) with F_k = 1 and fitting (n - 1) x 10^8 = A + B/(C - nu^2), \
nu the vacuum wavenumber in cm^-1, 'n is defined at 288.15 K and 101,325 Pa' with \
N = 2.5469e19 cm^-3 (Table 1 note a): an ideal-gas density. Eqs. 4 and 5 fit only the \
UV data (264-297 and 333-363 nm); Eqs. 6 and 7 also weight visible refractive-index \
measurements (Vukovic et al. 1996 for SF6; Watson & Ramaswamy 1936 and Cuthbertson & \
Cuthbertson 1920 for CH4) and are the recommended ones (Table 1, 250-650 nm). F_k = 1 \
for SF6 and CH4 (spherical tops) is an assumption, not a measurement.

Table 1 (tbl_02ae1202ecac, image checked) also reproduces the He, N2, Ar and CO2 \
formulas used for the reference and n-based cross sections; they are recorded as \
reproduced formulas. The library's CSV of Table 1 mangles the CO2 cell (its \
4.3244/(67837.7^2 - nu^2) term is rendered as a denominator); the image shows five \
additive terms inside the bracket, as recorded below, identical to He et al. (2021)'s \
Table 1."""

[[formulas]]
id = "SF6_uv"
material = "SF6"
equation = "Eq. (4), p. 5"
printed = "(n - 1) x 10^8 = 25850.9 + 7.8229 x 10^14 / (1.680 x 10^10 - nu^2)"
variable = "nu: vacuum wavenumber in cm^-1"
state = "1atm_15C"
density = "ideal"
range = "264-363 nm (the BBCES data of this work and Wilmouth & Sayres 2019)"
coefficients = { A = "25850.9", B = "7.8229e14", C = "1.680e10" }
check = "Against Eq. (6) the Rayleigh cross sections differ by 0.23-0.26 % on average and 0.46 % at most over 264-363 nm (the paper: 0.25 % and 0.49 %) (checked 2026-09-24)."
notes = "From Rayleigh cross sections with F_k = 1 (UV only). The equation image was checked."

