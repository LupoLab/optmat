state = "1atm_15C"
density = "ideal"
range = "264-363 nm (the BBCES data of this work and Wilmouth & Sayres 2019)"
coefficients = { A = "16873.2", B = "2.2970e14", C = "9.270e9" }
check = "Against Eq. (7) the cross sections differ by 0.40-0.47 % on average and 0.85 % at most over 264-363 nm (the paper: 0.44 % and 0.91 %) (checked 2026-09-24)."
notes = "From Rayleigh cross sections with F_k = 1. Extrapolated to the visible it lies above every direct refractive-index measurement beyond about 500 nm (3.7 % in cross section at 600 nm, p. 7)."

