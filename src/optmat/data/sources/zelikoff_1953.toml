citation = "M. Zelikoff, K. Watanabe and E. C. Y. Inn, \"Absorption coefficients of gases in the vacuum ultraviolet. Part II. Nitrous oxide\", J. Chem. Phys. 21, 1643 (1953)"
doi = "10.1063/1.1698636"
library = "Zelikoff_1953_AbsorptionCoefficientsGases"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Photoelectric absorption as in Watanabe et al. (1953, watanabe_1953): a \
Baird 1 m vacuum monochromator (entrance and exit slits 0.05 mm, band width 0.85 A), \
scanned at 20 A/min, a hydrogen discharge, a 47 mm cell with cleaved LiF windows; N2O \
purified by ten fractional distillations (impurities under about 0.05 %, mass \
spectrometer) at about 0.01-200 mm Hg; Beer's law held over a five- to tenfold pressure \
range in all regions; scattered light and LiF fluorescence corrected; a few hundred \
wavelengths one to five angstroms apart, 1080-2100 A (p. 1644)."""
notes = """Journal pages 1643-1647 = PDF pages 2-6 (page 1 is the publisher's cover; \
page 2 opens with the end of the preceding article). Identity checked against the page \
image (pdf 2): Zelikoff, Watanabe and Inn, 'Absorption Coefficients of Gases in the \
Vacuum Ultraviolet. Part II. Nitrous Oxide', J. Chem. Phys. 21, 1643, received 7 April \
1953. N2O only. The absorption coefficients are given only in Figs. 1-4 (1080-1220, \
1220-1380, 1380-1605, 1605-2100 A); what the text states is recorded as points.

Quantity (p. 1644): 'The absorption coefficient, k in cm^-1 is defined by I/I0 = \
exp(-kx) where x is the layer thickness of the absorbing gas in cm reduced to NTP' (NTP \
not defined further; 0 C and 1 atm assumed, as in watanabe_1953 and inn_1953). No \
conversion to cross sections is given; the datasets store k with scale = 1e18 / n0, n0 \
= 2.6867801e19 cm^-3 (ideal gas), to Mb. Temperature not stated. No accuracy \
statement (only Beer's law over a five- to tenfold pressure range); wave numbers of the \
diffuse bands 'at best only approximate' (p. 1645).

Four regions after Duncan: E-F 1080-1215 A (continuum with maximum 'probably near \
1080A', diffuse bands at 85350-91800 cm^-1, the strongest band at 84900 cm^-1), D \
1215-1380 A (a continuum with maximum k = 2465 cm^-1, a sharp band at 77400 cm^-1 that \
'probably contributes to the maximum value'), C 1380-1600 A (a continuum with maximum \
147 cm^-1 at 68940 cm^-1 under about twenty diffuse bands, the strongest at 68730 \
cm^-1) and B 1600-2100 A (weak continuum, maximum 3.82 cm^-1 at 1820 A). Abstract (p. \
1643): 'Four continua were observed with maxima at 1820, 1450, 1285, and 1080A having \
f values of 0.0015, 0.0211, 0.367, and 0.1'. The region D maximum's wavelength is the \
abstract's 1285 A (Duncan's 77900 cm^-1 = 1284 A, p. 1645).

Not extracted: Table I (p. 1645, image checked), the bands of transition C: N, \
calculated and observed wave numbers (Eq. 3, nu = 59590 + 1005 v' - 30.0 v'^2 + 0.53 \
v'^3) and relative intensities (0.06-102), band positions and relative strengths with \
no vocabulary quantity; Duncan's formula (Eq. 2) and the Rydberg series (Eq. 1, nu = \
102567 - R/(n - 0.92)^2) are spectroscopic, not dispersion formulas; the \
potential-energy diagram (Fig. 5). Reproduced: Romand and Mayence's (1949) maxima \
(dataset romand_mayence)."""

