[[errata]]
dataset = "table3_n_o_24C"
row = "1.00"
column = "value"
printed = "1.75554"
corrected = "1.75573"
reason = "Misprint: Table III is the formula rounded to five decimals (60 of 61 values), and the formula gives 1.7557300 at 1.00 um."
evidence = "Table III image (pdf p. 2) prints 1.75554 at 1.00 um. The Table I formula gives 1.75573 (checked 2026-09-27); the neighbours 1.75592 (0.99 um) and 1.75216 (1.20 um) and Table II's computed 1.75546 at 1.01398 um bracket 1.75573, while 1.75554 would fall 38e-5 in 0.01 um where the table falls 20e-5 per 0.01 um."
