[[formulas]]
id = "collision_width"
material = "N2"
equation = "text, p. 3"
printed = "delta = 0.027 rho^2 p (from delta = 2 pi N v rho^2)"
variable = "rho: the effective optical collision radius in A; p: pressure in atm; delta: the line width in cm-1; N2 at 27 C"
state = "pure N2 at 27 C"
density = "ideal"
range = "0-25 atm (the collision-broadening region for the rotational lines, p. 3)"
coefficients = { k = "0.027", rho_rotational_text = "3.3", rho_rotational_abstract = "3.9", rho_vibrational = "0.43" }
check = "Scratch, 2026-09-26: with rho_nu = 0.43 A, 0.0050 cm-1/atm, 0.25 cm-1 at 50 atm (Table II delta nu_col 0.2 at 27 C). With rho_omega = 3.3 A (text) 0.294 cm-1/atm and with 3.9 A (abstract) 0.41 cm-1/atm, whereas Table I's rotational widths rise by 0.164 cm-1/atm between 7 and 25 atm (4.7 cm-1 at 25 atm against 7.4 from the formula with 3.3 A): the rotational radius does not reproduce Table I. The 0.027 prefactor equals 2 pi N v rho^2 / c at 1 atm and 300.15 K (N = 2.445e19 cm-3) with v = 527 m/s, about the rms speed of N2 (517 m/s)."
notes = "Collision (impact) theory, p. 3, citing Sobel'man (Ref. 7); the width convention is not stated."
