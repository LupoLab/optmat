citation = "G. V. Mikhailov, \"The influence of temperature and pressure on the Raman spectrum of nitrogen\", Sov. Phys. JETP 9, 974 (1959) [Zh. Eksp. Teor. Fiz. 36, 1368 (1959)]"
library = "Mikhailov_1959_InfluenceTemperaturePressure"
identity = "ASSERTED"
kind = "measurement"
technique = """Spontaneous Raman spectra of N2 gas at 27 C and 7-114 atm (and at 200 C, and \
of the liquid at -190 C), excited by the Hg 4047 and 4358 A lines in a high-pressure \
illuminator with a multiple-reflection mirror system, photographed with a HUET V-III \
spectrograph (22.7 cm-1/mm at 4047 A, 36.2 cm-1/mm at 4358 A) on Agfa plates, 3-40 h \
exposures; microphotometer traces, three or four plates per pressure. 'the total width \
of the excitation line, of the slit, and of the apparatus function ... (~1.5 cm-1 for \
the gas ...) was excluded from the results' (p. 2)."""
notes = """IDENTITY. The library copy is the English translation, Sov. Phys. JETP 9, \
974-978 (1959), whose first page reads 'J. Exptl. Theoret. Phys. (U.S.S.R.) 36, \
1368-1373 (May, 1959)', 'Submitted to JETP editor December 7, 1958'; the library \
identity is ASSERTED (no DOI). jammu_1966 and herring_1986 (Ref. 4, 'G. V. Milahailov, \
Zh. Eksp. Teor. Fiz. 36, 1368 (1959) [Sov. Phys.-JETP 9, 974 (1959)]') cite this paper. \
Page numbers are pdf pages 1-5.

solprop's unverified 'Sov. Phys. JETP 36, 9 (1959)' for N2's 6 ps is this paper: 36 is \
the Russian volume and 9 the translation's volume of the same 1959 paper, the one the \
library's papers (jammu_1966, herring_1986) cite as Mikhailov 1959. What it supports: \
6 ps is 1/(pi Delta nu) for Delta nu = 1.77 cm-1 (solprop's 53.05e9 Hz), and this \
paper's width of the unresolved N2 Q branch at 27 C is 1.7-2.4 cm-1 at 15-114 atm \
(Table I) and 1.75 cm-1 calculated (1.8 +- 0.2 measured) at 50 atm (Table II), which \
give 6.1 ps and 5.9 ps. But that width is NOT a collisional dephasing width: 'the \
rotational splitting introduces a basic length into the observed width of the Q \
branch' (p. 4): delta nu_rot = 1.54 cm-1 of the 1.75 comes from the unresolved \
rotational structure (Q(J) spread by alpha J(J+1)), the collisional part being 0.2 \
cm-1 at 50 atm (Table II), about 0.005 cm-1/atm (formula collision_width with rho_nu = \
0.43 A). The pressure-independent part extrapolated to zero pressure is 1.6 cm-1 (p. \
4). So the 6 ps is the dephasing of the whole Q-branch envelope at room temperature, \
independent of pressure, and it is not a collision time.

WIDTH CONVENTION: not stated. The paper speaks only of 'line width' (delta omega, delta \
nu) measured on microphotometer traces after removing the apparatus width; whether it \
is the full width at half maximum or the half width is never said. Recorded as width = \
"not stated". jammu_1966 (Table II) \
lists this author's N2 coefficients as HWHM per atm, 47.5 and 26.5 x 10^-3 cm-1/atm \
below and above 25 atm, values that this paper's Table I does not give directly (the \
slopes of Table I's delta omega are about 0.16 cm-1/atm between 7 and 25 atm and 0.044 \
cm-1/atm between 25 and 80 atm): perhaps from the 1960 paper.

TABLE I (p. 2): 'the average width for the transitions with J = 0 - 15 is given for the \
rotational lines'; 'The average error in the measurements of the line widths comprised \
about 10 %' (p. 2). The rotational lines overlap from 20 atm and blend above 80 atm; the \
slope changes at 25 atm (Fig. 3). The 3 atm width is '~0.5' 'Measured by V. A. Iozenas, \
Moscow State University' (excluded: approximate, another observer). 'The frequency shift \
of the Raman scattering lines lies within the limits of the errors of measurement (~1 \
cm-1)' (p. 3).

TEXT (p. 3): at 200 C (the gas at 'p = 90 atmos, reduced to 27 C', i.e. the density of \
90 atm at 27 C), delta omega = 8.5 +- 2 cm-1 and delta nu = 5.4 +- 1.5 cm-1 (inline \
datasets). Table II prints the 200 C row at '50 atmos' at 27 C: the text and the table \
disagree on the density of the 200 C measurement (unresolved). Liquid N2 (-190 C): delta \
nu = 0.4 +- 0.2 cm-1, calculated 0.5 (0.45 + 0.05) at 0.5 g/cm3 (not extracted: not \
the gas).

CONSTANTS AND ERRORS. The Q-branch structure calculation (p. 4) uses 'B = 1.998 cm-1, \
alpha = 0.171 cm-1 and T = 300 K'. alpha is printed ten times too large: bendtsen_1974 \
(Table VIII) gives alpha = 0.017292 cm-1 for 14N2, and the paper's own delta nu_rot = \
1.54 cm-1 needs the intensity scale kT alpha/B of about 1.8 cm-1, i.e. alpha about \
0.017 (with 0.171 it would be 18 cm-1). Not recorded as data (an input of the \
calculation, uncited). The effective collision radius for the rotational lines is 3.9 A \
in the abstract but 3.3 A in the text (p. 3); neither reproduces Table I through the \
formula (see collision_width)."""

