citation = "K. Dzierżęga, U. Volz, G. Nave and U. Griesmann, \"Accurate transition rates for the 5p-5s transitions in Kr I\", Phys. Rev. A 62, 022505 (2000)"
doi = "10.1103/physreva.62.022505"
library = "Dzierzega_2000_AccurateTransitionRates"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Branching fractions of all 30 Kr I 5p-5s lines (556-1879 nm): a \
wall-stabilised arc (helium with < 0.3 % krypton, 50 A) and a 2 m Czerny-Turner \
monochromator with a CCD in the visible, measured in air; a high-current hollow-cathode \
lamp (copper cathode, neon or argon carrier) and the NIST 2 m Fourier-transform \
spectrometer in the near infrared, in a purged box; both calibrated against a tungsten \
strip standard lamp. Absolute scale from upper-level lifetimes: Schmitt et al.'s \
beam-gas-laser lifetimes for six levels and the authors' semiempirical \
intermediate-coupling lifetimes (LS-dependent transition moments fitted to those six) \
for 2p1, 2p2, 2p5 and 2p10."""
notes = """Identity: Physical Review A 62, 022505 (2000), 9 pages, K. Dzierżęga, U. Volz, \
G. Nave, U. Griesmann (NIST, Kraków, Kaiserslautern, Harvard-Smithsonian), "Accurate \
transition rates for the 5p-5s transitions in Kr I", received 20 January 2000, \
published 17 July 2000 (first page and running footer of the PDF's text layer). NIST \
ASD's Kr I 5s-5p transition probabilities cite this paper (its bibliographic key \
T7199, resolved 2026-10-09).

Taken (TC-1011's quantities): the transition rates of Table IV and the semiempirical \
lifetimes of Table II (dataset notes). The paper prints no oscillator strength and no \
gf (an f converted from A would be derived). Table IV's tau column is not taken: it is \
Schmitt et al.'s beam-gas-laser lifetimes (Table I column [2], the same strings) for \
six levels and Table II's for 2p1, 2p2, 2p5 and 2p10 (printed in italics; the same \
strings). Table I (p. 2, tbl_434d05fe1a09): other papers' lifetimes (WSA [6], PL [3, \
9, 10], BGLS [1, 2]) and the authors' best estimate (BE) of the non-BGLS ones: \
reproduced or evaluated, not taken.

Not taken: the branching fractions (Table IV; the A values carry them); Table V's \
columns of other papers (Refs. 3-8, 17, 18 length and velocity forms); Table III's \
LS-dependent transition moments sigma (a.u., e.g. 5p 3D -> 5s 3P 3.085 +- 0.001), a \
semiempirical model's radial integral sqrt(3) int u5p r u5s dr between LS terms (Eqs. \
4-5), not a state-to-state transition dipole moment; Table II's LS decomposition and \
far-IR (5p-4d) branch fractions (2p1-2p4: 0.246, 0.034, 0.106, 0.0045 %, +- 100 %, \
from Aymar and Coulombe's velocity-form rates). The extraction of Table II garbles \
the LS columns (2p2 reads 3, 4, 21, 44 for 1D 34, 3P 21, 3D 44) and reads "±" as \
"6"; the image was read.

Levels: the paper prints both notations, J_cK (Racah) nl[K]_J, primed for the 2P1/2 \
core (Fig. 1 caption), with the Paschen label in parentheses (Table IV): 1s5, 1s4, \
1s3, 1s2 = 5s[3/2]2, 5s[3/2]1, 5s'[1/2]0, 5s'[1/2]1; 2p1-2p10 = 5p'[1/2]0, 5p'[3/2]2, \
5p'[1/2]1, 5p'[3/2]1, 5p[1/2]0, 5p[3/2]2, 5p[3/2]1, 5p[5/2]2, 5p[5/2]3, 5p[1/2]1. \
NIST writes them (2P*<3/2>).5s or (2P*<1/2>).5s, term 2[K]* and J (5p: 2[K], no *). \
Every line was identified by its printed wavelength among NIST's level pairs (air \
wavelengths from NIST's levels, residual <= 0.005 nm at two decimals); every printed \
label agrees but one.

Misprint (a label; no value affected; corrected by the erratum below): Tables IV and V print the upper level of \
811.29 nm as 5p[3/2]_3 (2p9); it is 5p[5/2]_3 (J = 3 needs K = 5/2; Tables I and II \
print 5p[5/2]3 for 2p9; the text layer has "5p@3/2#3 (2p9)", so it is the print, not \
the extraction).

Doubt: for 2p7 the hollow-cathode branching fractions printed for 1286.19 nm (1s3, \
0.0031 +- 0.0002) and 1404.57 nm (1s2, 0.0023 +- 0.0001) give F/tau = 0.105 and 0.078 \
x 1e6 s-1, against the printed A 0.076 +- 0.005 and 0.106 +- 0.006: the F cells look \
interchanged. Every other row's A is F/tau within the rounding of a printed F (the \
arc's, the hollow cathode's, or their mean: 760.15, 819.01 nm). The printed A \
agree with Table V and with the order in all of Table V's comparison columns (A(1404) \
> A(1286) in Refs. 3, 17 and 18, both forms), and NIST holds them. Internal checks \
that hold: the sum of F per upper level is 0.999-1.001, and the sum of A per level is \
(1 - far-IR fraction)/tau within 0.15 % for all ten levels.

Comparison with NIST ASD (TC-983, Kr_I_lines_nir.tsv): NIST holds an A for 29 of the \
30 lines, all from this paper (T7199), each the printed value (ratio 1.0000 in all 29; \
mean and largest deviation 0); NIST has no A for 2p1-1s4 (557.468 nm vacuum), the \
paper's bound. NIST's grades run from AAA (811.29 nm, +- 0.25 %) to C (567.25, 587.09 \
nm). The agreement is NIST quoting this paper, not an independent check. For OEP 8's \
radiative widths: sum A per level (1e6 s-1) = 40.64 (2p1), 34.98, 35.63, 34.01, 43.25, \
36.57, 33.76, 31.21, 36.10, 26.22 (2p10)."""

[[datasets]]
id = "A_5p_5s"
material = "Kr"
file = "Kr/dzierzega_2000__A_5p_5s.csv"
table = "tbl_31985c0969ea"
quantity = "transition_probability"
unit = "1/s"
scale = 1e6
abscissa = "label"
use = "primary"
excluded_rows = { "557.31" = "printed <0.04 (branching fraction < 1e-3): an upper bound for 5p'[1/2]0-5s[3/2]1, not a value" }
notes = """Table IV (p. 5), 'Branching fractions F_ki and absolute transition rates A_ki \
for all 30 5p-5s transitions in neutral Kr', column A_ki (1e6 s-1) with its \
uncertainty: A = F / tau (Eq. 6), F from the wall-stabilised arc (visible) or the \
hollow-cathode lamp and Fourier-transform spectrometer (infrared), tau from Schmitt et \
al.'s beam-gas-laser lifetimes or Table II's semiempirical ones. The uncertainties \
'result from the estimated standard deviation of the branching fractions and the \
uncertainty of the lifetime data' (p. 7): one standard uncertainty. Rows are the \
printed air wavelengths ('measured in air', p. 4; 760.15 nm against NIST's vacuum \
760.364 nm); x is upper-lower in the paper's J_cK notation (the Paschen labels the \
cells add stay in printed: 2p1-2p10 = 5p'[1/2]0, 5p'[3/2]2, 5p'[1/2]1, 5p'[3/2]1, \
5p[1/2]0, 5p[3/2]2, 5p[3/2]1, 5p[5/2]2, 5p[5/2]3, 5p[1/2]1; 1s5, 1s4, 1s3, 1s2 = \
5s[3/2]2, 5s[3/2]1, 5s'[1/2]0, 5s'[1/2]1). Table V repeats the column (identical in \
all 30 rows). For 2p7, the printed F of 1286.19 and 1404.57 nm look interchanged; the \
A are taken as printed (record notes)."""

[datasets.uncertainty]
column = true
level = "1 sigma"

[datasets.parameters]
notation = "racah"

[[datasets]]
id = "lifetime_5p"
material = "Kr"
file = "Kr/dzierzega_2000__lifetime_5p.csv"
table = "tbl_bf6340c2979f"
quantity = "radiative_lifetime"
unit = "ns"
abscissa = "label"
use = "primary"
notes = """Table II (p. 3), 'Semiempirical lifetimes and decomposition in LS terms for the \
Kr I 5p states', column 'Lifetimes (ns) This work': intermediate coupling (Lilly's \
Slater and spin-orbit parameters, recalculated) with six LS-dependent transition \
moments (Table III) fitted to the six beam-gas-laser lifetimes of Schmitt et al. \
(2p3, 2p4, 2p6-2p9), the far-IR 5p-4d branches of 2p1-2p4 from Aymar and Coulombe \
(velocity form, +-100 %), and branching fractions for the 1S moment (Sec. II B). \
The six fitted levels agree with Schmitt et al. within 0.07 ns (2p4: 29.34 against \
29.402); the authors use \
Schmitt et al.'s values for them and these for 2p1, 2p2, 2p5 and 2p10 (Table IV). \
'The quoted standard uncertainties ... were obtained by Gaussian propagation of the \
uncertainties of the reference lifetimes, the uncertainties in the energy parameters \
..., and the uncertainties of the contributing branching ratios' (p. 3): one sigma. \
Rows are the Paschen labels, x the J_cK label; the extraction reads '±' as '6' \
('24.5860.85'), split by the script and checked on the image and the text layer."""

[datasets.uncertainty]
column = true
level = "1 sigma"

[datasets.parameters]
method = "semiempirical: intermediate coupling with LS-dependent 5p-5s transition moments fitted to six beam-gas-laser lifetimes"

[[errata]]
dataset = "A_5p_5s"
row = "811.29"
column = "x"
printed = "5p[3/2]3-5s[3/2]2"
corrected = "5p[5/2]3-5s[3/2]2"
reason = "The upper level of 811.29 nm is 2p9, 5p[5/2]3: a J = 3 level of 5p on the 2P3/2 core has K = 5/2 (K = 3/2 gives J = 1, 2). Tables IV and V print 5p[3/2]3; the text layer has '5p@3/2#3 (2p9)', so it is the print."
evidence = "Tables I and II print 2p9 as 5p[5/2]3; NIST's air wavelength of (2P*<3/2>).5p 2[5/2] J=3 - (2P*<3/2>).5s 2[3/2]* J=2 is 811.290 nm (vacuum 811.513 nm), no other Kr I 5p-5s pair within 0.85 nm; Table IV's lifetime 27.694 ns is Schmitt et al.'s for 2p9 (Table I)."
