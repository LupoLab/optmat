citation = "E.-A. Reinsch, J. Chem. Phys. 83, 5784 (1985)"
doi = "10.1063/1.449657"
library = "Reinsch_1985_CalculationDynamicPolarizabilities"
identity = "VALIDATED_WITH_WARNINGS"
kind = "theory"
technique = """Time-dependent perturbation theory for multiconfiguration SCF (MC-SCF) wave \
functions (a multiconfigurational time-dependent Hartree-Fock linear response, solved \
through the MC-SCF Hessian), nonrelativistic, clamped nuclei. He and H2: five-configuration \
MC-SCF in Huzinaga-based Gaussian basis sets; Ne, HF, H2O, NH3, CH4: 45-configuration \
MC-SCF (all double excitations from the four valence orbitals into the first four \
virtuals of the same symmetry) in Werner and Meyer's basis B with d sets; for Ne also an \
extended basis (one more s, p and d set, zeta = 0.055). CH4 at r_CH = 2.061 bohr. H2 at \
R = 1.2-1.6 bohr, with vibrational averaging by P. Botschwina (pp. 5788-5790)."""
notes = """omega is in hartree (Table I note a: 'all omega values in this paper are given \
in hartree', p. 5788), polarizabilities in atomic units (bohr^3). Electronic \
polarizabilities only (no vibrational contribution, no magnetic susceptibility). Journal \
pages 5784-5791 = pdf pages 2-9 (pdf page 1 is a cover sheet).

Accuracy (the author's): for He 'agreement within 1% up to omega = 0.65' with Chung's \
and Starkschall and Gordon's values; the correlation contribution at omega = 0 is 4.6 % \
(p. 5788). For the ten-electron systems the 45-configuration MC-SCF recovers 65-90 % of \
the correlation contribution at omega = 0 (Table VI); for Ne 'the error in the \
polarizability increases from 4% (omega = 0) to 7.5% (omega = 0.35)', reduced with the \
extended basis (p. 5790); 'the absolute accuracy for the latter case is in the range of \
4% to 9.5%' (abstract). All of this work's values are therefore stored as checks, not \
for fitting (the He MC-SCF column could be promoted).

Reproduced comparison values: He Chung (Ref. 6 as cited by Ref. 20), Starkschall and \
Gordon (Ref. 20, moment theory from experiment), 'Expt' as fitted by Pade approximants \
(Ref. 21, Langhoff and Karplus 1969 = langhoff_1969); Ne 'Expt' (Table III note a: 'as \
cited by Ref. 20', while the text p. 5790 says 'the experimental values for Ne as given \
by Langhoff and Karplus (Ref. 21)'); Ne static SCF, PNO-CI and CEPA of Werner and Meyer \
(Ref. 5; Table VI, 'without vibrational correction'); CH4 'Exp' computed by the author \
from Landolt-Bornstein's two-term fits C_1/(nu_1^2 - nu^2) + C_2/(nu_2^2 - nu^2) (Table \
V note c), so an evaluation of a dispersion formula, not measurements; CH4 PNO-CI/CEPA \
16.39/16.53 of Werner and Meyer (Table V note f).

H2 (Table II): the upper block gives alpha_parallel and alpha_perp at fixed \
internuclear distances R = 1.2-1.6 bohr (not extracted: tensor components at fixed R; \
anisotropies are for later). The lower block (the mean at R = 1.4 bohr, this work and \
Victor, Browne and Dalgarno; the vibrationally averaged alpha_parallel, alpha_perp and \
mean for v = 0, the mean for v = 1 and the 0-1 transition; experiment) is MISSING from \
the library's cells file; its values are entered inline, read from the table image and \
checked on the pdf page (p. 5789): the printed means equal (alpha_parallel + 2 \
alpha_perp)/3 of the printed components to the last digit (R = 1.4: 5.203, 5.392, \
6.061, 7.740; v = 0: 5.438, 5.646, 6.399, 8.370), which confirms the reading. Table II \
notes: b, c Kolos and Wolniewicz (Ref. 22) static alpha_parallel 6.3805 and alpha_perp \
4.5777 at R = 1.4; f their vibrationally averaged mean 5.414 (v = 0, static). Anisotropy \
kappa 0.125 against the experimental 0.128 (p. 5789).

Not extracted: HF, H2O, NH3 (not curated species); the He excitation energies and C_6 \
(p. 5789), the Ne C_6 6.158 (p. 5790)."""

