citation = "N. L. Boling, A. J. Glass and A. Owyoung, \"Empirical relationships for predicting nonlinear refractive index changes in optical solids\", IEEE J. Quantum Electron. QE-14, 601-608 (1978)"
doi = "10.1109/jqe.1978.1069847"
library = "Boling_1978_EmpiricalRelationshipsPredicting"
identity = "VALIDATED_WITH_WARNINGS"
kind = "compilation"
technique = """A model (the 'BGO formula'): a classical anharmonic (Duffing) oscillator with Wang's \
conjecture gamma = q alpha^2 and the Lorentz local field gives n2 from the linear index \
and its dispersion (Eq. 25, with the Clausius-Mossotti one-oscillator fit, Eq. 26), and \
in terms of n_d and the Abbe number (Eq. 38). Compared with n2 measured by others: \
ellipse rotation (Owyoung, Refs. 11-12; Table I) and time-resolved interferometry \
(Milam and Weber, Refs. 14-15; Table III). No measurement of its own."""
notes = """Journal pages 601-608 = pdf pages 1-8 (the pdf's page 8 continues with the start of \
an unrelated paper, Kawakami and Ikeda, 'Transmission characteristics of a two-mode \
optical waveguide', not extracted). Identity checked against the first page.

DEFINITIONS (Gaussian units). p = alpha E_l cos(wt) + (1/6) gamma (E_l cos wt)^3 (Eq. 1, \
p. 601); local field f = (n^2 + 2)/3 (Eq. 3); P(w) = chi(1) E + 3 chi(3)_1111(-w; w, w, -w) \
E^3 with chi(3)_1111 = (f^4/24) sum N gamma (Eqs. 5-6, pp. 601-602); (n^2 - 1)/4 pi = f sum \
N alpha (Eq. 7) and n2 = (12 pi/n) chi(3)_1111 = (f^4 pi/2n) sum N gamma (Eq. 8, p. 602). \
The n2 of the tables are in esu ('10^13 n2 (esu)'), for n = n0 + n2 <E^2> as used by \
Adair et al. 1989 (adair_1989, whose Eq. (6) is this paper's Eq. (38) with K = 68).

N2 IN ESU (datasets, nonlinear_index_field). The n2 columns of Tables I and III, in \
units of 1e-13 esu, converted to nothing: Table I (tbl_1104b7cc486c, p. 603), '10^13 \
n2 measured (esu)*', reproduced from Owyoung's ellipse rotation (Refs. 11, 12, 'by \
assuming that n2 is purely electronic in origin', part unknown), and '10^13 n2 \
calculated' (Eqs. 25-26 with gs = 3; check); Table III (tbl_6d8d3f9d443b, p. 606), 'n2 \
calc' (Eq. 38; check) and 'n2 exper' (Milam and Weber's TRI, Refs. 14-15, part total; \
reproduced) with +-. The paper never writes n = n0 + n2 <E^2>: it defines n2 = (12 pi/n) \
chi(3)_1111 (Eq. 8) with P(w) = chi(1) E + 3 chi(3)_1111 E^3 for the field E cos(wt) \
(Eqs. 1-5), which is n = n0 + n2 <E^2> with <E^2> = E^2/2 (derived here, not stated); \
Adair et al. 1989 (adair_1989) use the same n2 and Eq. (38). Fused silica: Table I n \
1.456, measured 1.00, calculated 0.91; Table III n_d 1.458, nu_d 70, calculated 0.87, \
measured 0.95 +- 0.10 (x 1e-13 esu). All cells checked against the table images \
(2026-09-26). Errata: Table III's header '10^23' for the calculated column is a \
misprint for 10^13 (a scale erratum per dataset; Eq. 38, in 10^-13 esu, reproduces the \
column, and Fig. 2's axis is 'n2 (10^-13) CALCULATED'); EV-1's '0.91 +- 0.9' is 0.91 +- \
0.09 (Fig. 2 draws its error bar from about 0.83 to 1.01). The silicate row's n_d \
prints as '1:769' in the image (a speck; 1.769). Fig. 2 also plots CaF2, LiF, MgF2 and \
KH2PO4, which Table III does not list (not digitised). Neither table states the \
wavelength of its n2 ('not stated'); adair_1989's Table III lists the same TRI \
references at 1.06 um.

PART. Table I's values assume a purely electronic n2; Hellwarth, Cherlow and Yang (Ref. \
16) found nuclear contributions of '29, 21, 15, 19, and 21 percent' for LaSF-7, SF-7, \
ED-4, LSO and fused silica, 'all to within +-3 percent', and 'the n2's of Table I should \
be multiplied by the factor (3 sigma + 4 A0 + 4 B0)/(3 sigma + 6 B0) to obtain the true \
values, including both nuclear and electronic components ... this factor is 0.98, 1.00, \
1.07, 1.08, and 1.16' for those glasses (p. 604). 'These interferometric measurements \
[Table III] yield total values of n2, including both electronic and nuclear components' \
(p. 606). The formula's constant gs = 3 was fitted to the ellipse-rotation values, so \
'our equation also partially accounts for the Raman component' (p. 606).

LINEAR INDICES (datasets). Table I's n (p. 603; wavelength not stated: the ellipse \
rotation experiments' index is presumably meant, but the paper does not say) and \
Table III's n_d (p. 606; at lambda_d = 0.58756 um, Eq. 32; 'the parameters customarily \
used in glass manufacture [22]', the Schott catalogue, 1972, cited generally). Both are \
inputs of the formulas: use 'check', assumed. Table III's Abbe numbers nu_d = (n_d - 1)/ \
(n_F - n_C) (Eq. 31; lambda_F = 0.48613, lambda_C = 0.65627 um) have no quantity: silicate \
27, EY-1 48, FR-5 52, ED-2 54, LHG-5 63, BK-7 64, LHG-6 66, EV-1 69, fused silica 70, \
FK-5 70, fluoro-phosphate 81, FK-51 84 (image checked). Whether the wavelengths are in \
air (as glass catalogues' are) is not said; the difference changes n_d by < 1e-5.

OSCILLATOR PARAMETERS (Table II, p. 604; no quantity: the densities are those of the \
dominant polarizable ion, not of particles available for ionisation). Columns N (10^22 \
cm^-3, 'Calculated from composition'), Ns (10^22 cm^-3, 'Calculated from \
Clausius-Mossotti equation') and s = Ns/N. a) oxide glasses and YAG, N = N_ox: fused silica 4.4, 13.2, 3.0; BK-7 4.5, 14.3, 3.1; LSO 3.9, 12.5, 3.2; FD-2 4.5, 13.4, 3.0; SF-7 4.1, 9.35, 2.3; YAG 5.5, 18.6, 3.4; EY-1 4.7, 14.1, 3.0. b) crystalline fluorides, N = N_F: LiF 6.12, 17.0, 2.78; NaF 3.67, 11.0, 3.00; MgF2 6.09, 18.0, 2.96; CaF2 5.24, 18.1, 3.45; BaF2 3.36, 17.1, 5.09; PbF2 4.05, 9.7, 2.40; SrF2 4.07, 18.0, 4.43 (image checked; 'FD-2' is printed in a) and appears nowhere else: ED-2 of Table III? Not decidable; registered as printed). 'For most of these materials, s ~ 3. Significant deviation is observed for the lead glass, SF-7' (p. 604); for oxide glasses g = 1 (gs = 3); for the fluorides 'most values of s were determined to lie between 3 and 4.5' and g = 1 'yielded an excellent fit' (Ref. 15). The omega0 of the fits are not given.

OTHER RELATIONS (notes, not formulas with numbers). Fournier and Snitzer (Ref. 17) used \
Wemple and DiDomenico's Sellmeier fits, n^2 - 1 = 4 pi (e^2/m) sN/(w0bar^2 - w^2) (Eq. \
27), whose resonance relates to the Clausius-Mossotti one by w0bar^2 = 3 w0^2/(n^2 + 2) \
(Eq. 28): 'For n = 1.5, this leads to values of n2 20 percent larger than those \
predicted by (25)'. Wang's expression (Eq. 29, Ref. 5) with g = 1.2 and s = 4 differs from \
Eq. (25) by the factor (n^2 + 2)^(3/2)/3.25 (Eq. 30), 2.7 for n = 1.5 (p. 605). Ns in terms \
of Wemple's parameters: Ns = (E_d E_0/R_y^2)/(16 pi r0^3) (Eq. 41; R_y = 13.6 eV, r0 = \
5.29e-11 m), with E_d E_0 ~ 150 eV^2 for most oxide glasses (p. 607). Accuracy claimed \
(p. 607): 'one can be fairly confident of a calculated value of n2 to within about +-20 \
percent for low dispersion, low index materials of cubic or amorphous structure'. \
Ellipse rotation 'measured with +-7 percent precision' (p. 603).

FIGURES. Fig. 1 (p. 603): measured against calculated n2 of Table I. Fig. 2 (p. 606): the \
same for Table III (Eq. 38). Fig. 3 (p. 607): measured n2 against Eq. (39). Not \
digitised.

REPRODUCTIONS. white_1984 predicts the 1064-nm gamma of BK-10 'from Eq. (38) of Ref. 10' \
(this paper) as 2.8 x 10^-16 cm^2/W. adair_1989 uses Eq. (38) as its Eq. (6) (K = 68, and \
refits K = 48). santran_2004 cites the formula. refractiveindex.info has no page for this \
source; its 'Milam' pages for BaF2, CaF2, LiF, MgF2 cite Milam, Weber and Glass (Appl. \
Phys. Lett. 31, 822 (1977)), this paper's Ref. 15."""

