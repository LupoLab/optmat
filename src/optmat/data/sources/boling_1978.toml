notes = "Table III, 'n2 exper x 10^13 dagger' with its +- (p. 606): 'Measured by interferometric technique [14],[15]' (footnote dagger), Milam and Weber's time-resolved interferometry, which 'yield total values of n2, including both electronic and nuclear components' (p. 606): part total. Wavelength not stated here (adair_1989's Table III gives the same TRI references at 1.06 um). The original is milam_1976 Table I (Schott FK 51, 0.69 +- 0.07 x 10^-13 esu at 1064 nm, 125-ps pulses, linear polarization): agrees with the printed 0.69 +- 0.07."
[datasets.uncertainty]
column = true
level = "not stated"
[datasets.parameters]
definition = "n2 = (12 pi/n) chi(3)_1111 for the field E cos(wt) (Eqs. 1-8, pp. 601-602); n = n0 + n2 <E^2> is implied, not written"
part = "total"
coefficient = "self"
technique = "time-resolved interferometry"

[[formulas]]
id = "bgo_oscillator"
equation = "Eqs. (25)-(26), p. 603"
printed = "n2 = (gs) (n^2 + 2)^2 (n^2 - 1)^2 / (48 pi n hbar omega0 (Ns)), with (4 pi/3) (n^2 + 2)/(n^2 - 1) = 1/(N alpha) = (omega0^2 - omega^2) / ((e^2/m) (Ns))"
variable = "n the linear index; omega0 and Ns the resonance frequency and the product of the number density and oscillator strength of the one dominant constituent, from a least-squares Clausius-Mossotti fit of the dispersion (Eq. 26); Gaussian units, n2 in esu"
coefficients = { gs = "3" }
check = "Not reproducible here: Table I's calculated column needs each glass's fitted omega0, which the paper does not give (Ns is in Table II for six of them) (checked 2026-09-26)."
notes = "gs = 3 'was determined to yield the best fit' to the oxide-glass ellipse-rotation n2 (p. 603); with s ~ 3 (Table II) this is g = 1. The n2 it gives is 'the electronic contribution', though the fitted gs absorbs part of the Raman one (p. 606)."

[[formulas]]
id = "bgo_abbe"
equation = "Eq. (38), p. 605"
printed = "n2 (10^-13 ESU) = 68 (n_d - 1) (n_d^2 + 2)^2 / ( nu_d [1.517 + (n_d^2 + 2)(n_d + 1) nu_d / (6 n_d)]^(1/2) )"
variable = "n_d the index at the d line (0.58756 um), nu_d = (n_d - 1)/(n_F - n_C) the Abbe number (Eqs. 31-32); n2 in 10^-13 esu"
coefficients = { K = "68", constant = "1.517" }
check = "Reproduces Table III's calculated column (p. 606) from its printed n_d and nu_d to within 0.4 % for eleven of the twelve glasses (e.g. FK-51 0.699 vs 0.70, silicate 8.305 vs 8.31); fused silica gives 0.833 against the printed 0.87 (-4.3 %): the printed nu_d = 70 does not reproduce it, a nu_d of about 68 would (computed 2026-09-26; which input the authors used is not known)."
notes = "The 'Abbe number formula', from Eq. (37) with the standard wavelengths and gs = 3 (Ref. 21, Glass, UCRL-50021-72, 1975). Adair et al. 1989 print it as their Eq. (6) with K = 68 and refit K = 48 for crystals (adair_1989); White et al. 1984 used it for BK-10 (white_1984). The general form, Eq. (37): n2 = (gs)(e^2/6m)/(omega_F^2 - omega_C^2) (n_d^2 + 2)^2 (n_d - 1)/(hbar nu_d) [omega_d^2 + (nu/6)(omega_F^2 - omega_C^2)(n_d^2 + 2)(n_d + 1)/n_d]^(-1/2)."

[[formulas]]
id = "empirical_39"
equation = "Eq. (39), p. 606"
printed = "n2 (10^-13 ESU) = 391 (n_d - 1) / nu_d^(5/4)"
variable = "n_d, nu_d as in Eq. (38); n2 in 10^-13 esu"
coefficients = { A = "391" }
check = "No value computed from it is printed (only Fig. 3). Against Table III's measured values it gives, e.g., fused silica 0.88 (measured 0.95 +- 0.10), BK-7 1.12 (1.24 +- 0.12), silicate 4.89 (4.4 +- 0.7) (computed 2026-09-26)."
notes = "'it is not difficult to generate, by simple examination of data, a function of nu_d and n_d involving only one constant that fits experimental data better than any of the derived expressions. One such function is' (p. 606): a fit, not a model."

