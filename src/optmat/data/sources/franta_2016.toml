citation = "D. Franta, D. Nečas, I. Ohlídal and A. Giglia, \"Optical characterization of SiO2 thin films using universal dispersion model over wide spectral range\", Proc. SPIE 9890, 989014 (2016)"
doi = "10.1117/12.2227580"
library = "Franta_2016_OpticalCharacterizationSiO"
identity = "VALIDATED"
kind = "measurement"
technique = """Combined spectrophotometry at near-normal incidence (reflectance from both sides, \
transmittance, their ratio) and variable-angle spectroscopic ellipsometry, 0.01-45 eV, \
all data fitted simultaneously in newAD2 with the Universal Dispersion Model (UDM) and a \
structural model (Rayleigh-Rice boundary roughness, thickness non-uniformity, a linear \
inhomogeneity found negligible). Table 2 (p. 2): Bruker Vertex 80v FIR spectrometry \
0.01-0.084 eV (80-680 cm-1, 11 and 0 deg) and MIR 0.046-0.93 eV (370-7500 cm-1); Perkin \
Elmer Lambda 1050 NIR 0.69-1.44 eV (860-1800 nm, 6 and 0 deg) and UVV 1.46-6.6 eV \
(187-850 nm, 6 deg); McPherson VUVAS 2000 VUV 3.3-10.8 eV (115-380 nm, 10 deg); Elettra \
BEAR EUV 3-45 eV (24.8-413 nm, 4 deg); Woollam IR-VASE 0.037-0.8 eV (300-6500 cm-1, 55-75 \
deg); Jobin Yvon UVISEL 0.6-6.5 eV (190-2066 nm, 55-75 deg); Jobin Yvon UVISEL2 VUV \
0.6-8.7 eV (143-2066 nm, 70 deg). The Lithosil Q2 plate's model was fitted to \
ellipsometry and photometry together with Schott's product-sheet index data (Fig. 20 \
caption) and, in the extreme ultraviolet, to the shape of Palik's (Philipp's) tables."""
notes = """Pdf pages 1-15. Identity checked against the first page. The paper prints the optical \
constants only in figures (Figs. 20-23: n in the transparent range; n and k in the \
electronic and phonon ranges; k of the OH vibrations and localised states); the \
datasets are the authors' published model tables from the newAD2 site, attached to \
the paper in the library with their URLs: 4001 rows of photon energy (eV), n and k, 0.01-100 eV on a \
logarithmic grid, kept as the files print them. The temperature is not stated (room \
temperature).

SAMPLES (Table 1, p. 2; image checked). Films on silicon single-crystal wafers, vacuum \
evaporated (Leybold Optics SYRUSpro DUV; prepared by Meopta), nominal thickness 800 nm \
from a quartz-crystal monitor (mass per area): X2546, 25 degrees C, 1 nm/s, optical \
thickness 878.4 nm, roughness sigma/tau 1.51/23.2 nm (AFM) and 1.51/20 nm (optical); \
X2551, 300 degrees C, 1 nm/s, 809.1 nm, 0.82/16.0 nm (AFM) and 0.30/20 nm (optical). The \
bulk sample is a Schott Lithosil Q2 fused-silica plate, 0.405 mm (the newAD2 file's \
description).

FINDINGS (pp. 11-14). Density ratio X2546/X2551 = 809.1/878.4 = 0.921 from the \
thicknesses (Eq. 2, same mass per area), but 1279/1220 = 1.048 from the valence-electron \
transition strengths N_ve = N_vc + N_vx + N_ut + N_loc (Eqs. 3-4); fused silica has N_ve \
= 1116 eV^2 and n_ve = N_ve/N_a = 7.788 effective valence electrons (N_a = 143.3 eV^2 for \
pure silica, Eq. 5). The films hold water (X2546: peak at 1600 cm-1 and band at \
2700-3700 cm-1, growing after exposure to air) and more OH than the plate; the plate is \
the densest O-Si-O network and the purest (sharpest Si-O modes at 1077, 802 and 458 \
cm-1, low absorption between 850 and 1000 cm-1); the films have a higher n in the \
transparent range and a smaller band gap. These sums reproduce from Table 3: 371 + 895 + \
13 + 0.048 = 1279, 367 + 836 + 17 + 0.221 = 1220, 367 + 735 + 14 = 1116, 1116/143.3 = \
7.788 (checked 2026-09-26).

TABLE 3 (p. 11; image checked). E_h (39.6 eV) and E_x (16.98 eV) are printed once, \
centred across the three columns: shared by the three models (the .par files agree); \
the library CSV puts them under X2551 only. Every Table 3 value is the rounded value of \
the .par files' (e.g. E_g 7.673434680526896, 7.939173356933603, 8.36270918663193 eV; N_loc \
of X2546 0.0169 + 0.0315 = 0.048 from its two localised-state terms).

RANGES. The fitted ranges are those the newAD2 site states: Lithosil Q2 \
80 cm-1 to 8.5 eV, the films 80 cm-1 to 45 eV. Above 8.5 eV the Lithosil Q2 table \
follows the model fitted to the shape of Palik's (Philipp's) tables ('the shape of \
absorption for fused silica corresponds to the Palik's tabulated data because the \
experimental data were not available in the extreme UV region', Fig. 21 caption): \
reproduced from philipp_1985, a separate dataset. Film rows above 45 eV are \
extrapolation and are not extracted. k is printed 0 where the model has no absorption \
(the transparent range).

COMPARISON. The refractiveindex.info page SiO2/Franta ('numerical data kindly provided \
by Daniel Franta') is the Lithosil Q2 table on another grid (0.0248-125 um, 3704 rows, \
to 50 eV): interpolated in log E, the Enk file agrees with it to a median 1.5e-6 in n and \
2e-7 in k, at most 7e-4 (n) and 4e-4 (k) at sharp phonon features (interpolation); the \
films' tables differ from it by up to 1.1 (checked 2026-09-26)."""

