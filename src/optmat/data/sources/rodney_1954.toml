reason = "The leading digit is misprinted: the index of silica at 0.70 um is near 1.455, and the row's neighbours are 1.45536 (25 C) and 1.45546 (35 C). Table 2's 1.455347 at 24 C plus 103e-7 x 6 K is 1.455409, which rounds to 1.45541."
evidence = "Page image (journal p. 188, pdf page 4, Table 3, last row): '0. 45541' in the t = 30 C column; the library cells agree. The rule stated on p. 189 (Eq. (1) plus the coefficient times the temperature change) reproduces 153 of the other 154 cells to the printed digit (0.60 um at 35 C differs by a rounding)."
