citation = "H. W. Schrötter and H. W. Klöckner, \"Raman Scattering Cross Sections in Gases and Liquids\", in Raman Spectroscopy of Gases and Liquids, A. Weber, ed., Topics in Current Physics 11 (Springer, Berlin, 1979), Chap. 4, pp. 123-166"
doi = "10.1007/978-3-642-81279-8"
library = "Weber_1979_RamanSpectroscopyGases"
identity = "VALIDATED_WITH_WARNINGS"
kind = "compilation"
technique = """A critical review of the Raman scattering cross sections of gases and liquids, \
with the authors' own laser measurements (Munich): photon counting behind a 1 m double \
monochromator (holographic gratings), argon-ion laser lines 351.1-514.5 nm, spectral \
sensitivity from a calibrated tungsten band lamp (p. 129). The absolute differential \
cross section of the N2 Q branch was measured against the pure rotational lines of H2 \
(J = 1 -> 3 at 587 cm-1, checked with J = 0 -> 2, 2 -> 4 and 3 -> 5), whose cross \
sections follow from the calculated anisotropy of H2 (Eqs. 4.10-4.11), with H2 as both \
internal and external standard (pp. 128-129); relative cross sections of other gases \
against N2 in mixtures at equal partial pressures (0.667 bar), through an analyser \
passing the component parallel to the exciting polarization, multiplied by 1 + rho \
(Eqs. 4.15-4.16), repeated with the pure gases in separate fills (pp. 133-134). The \
others' results are collected and converted to the same definitions (Tables 4.1-4.4)."""
notes = """BOOK AND CHAPTER. The library copy (Weber_1979_RamanSpectroscopyGases; \
Unverified_6d54463e97c7 until the library validated it, 2026-09-27: the same tables) is the whole book: 'Raman Spectroscopy of Gases and Liquids', edited by A. \
Weber, Topics in Current Physics 11, Springer-Verlag Berlin Heidelberg 1979 (copyright \
page: ISBN-13 978-3-642-81281-1, e-ISBN-13 978-3-642-81279-8, DOI \
10.1007/978-3-642-81279-8, the book's DOI; no chapter DOI is printed). Identity checked \
against the title page, the copyright page and the contents (pdf pp. 3-11). This record \
is Chapter 4, by H. W. Schrötter and H. W. Klöckner (Sektion Physik, Universität \
München), pp. 123-166 (contents p. VIII; pdf pages 133-176: book page = pdf page - 10). \
The other chapters used are separate records: weber_1979 (Chap. 3) and brodersen_1979 \
(Chap. 2).

DEFINITIONS (pp. 124-132). The absolute differential cross section of a Stokes \
vibrational band for 90 deg scattering, 'linearly polarized incident light, observation \
at 90 deg to both the polarization vector and the direction of incidence', both \
scattered polarization components (no analyser), Eq. (4.9): dsigma_j/dOmega = (2^4 \
pi^4/45) (nu_0 - nu_j)^4 b_j^2 g_j (45 a_j^2 + 7 gamma_j^2)/[1 - exp(-hc nu_j/kT)], \
b_j^2 = h/(8 pi^2 c nu_j); rho_j = 3 gamma_j^2/(45 a_j^2 + 4 gamma_j^2). 'The \
normalized cross sections obtained by division by the (nu_0 - nu_j)^4 factor' (p. 129; \
wavenumbers in cm^-1, so dsigma/dOmega (nu_0 - nu_j)^-4 is in cm^6/sr). The 'relative \
normalized differential Raman scattering cross section', Eq. (4.14): Sigma_j = \
[(dsigma_j/dOmega)/(dsigma/dOmega)_{Q,N2}] [(nu_0 - nu_j)^-4/(nu_0 - 2331 cm^-1)^-4] [1 - \
exp(-hc nu_j/kT)] = (2331 cm^-1/nu_j) g_j (45 a_j^2 + 7 x_j gamma_j^2)/(45 a_N2^2 + 7 \
x_N2 gamma_N2^2), 'independent of nu_0, as long as a_j^2 and gamma_j^2 can be regarded \
as constant, and of the temperature' (x_j: the fraction of the anisotropic scattering \
in the Q branch; N2's Boltzmann factor omitted as negligible). The reference is always \
the Q branch of the N2 fundamental at 2331 cm^-1. Sigma_j is therefore NOT the plain \
ratio of cross sections at one exciting line: for O2 at 488 nm the plain ratio is \
Sigma_j x (nu_0 - 1555)^4/(nu_0 - 2331)^4 = 1.18 Sigma_j. The Sigma_j datasets are \
recorded as raman_cross_section_ratio with parameters.normalization naming Eq. (4.14) \
(the vocabulary has no quantity for a normalised ratio; a model must apply Eq. 4.14 \
before comparing Sigma_j with a plain ratio).

WHAT IS TAKEN.
- Table 4.1 (p. 130): the absolute N2 Q-branch cross section per exciting line and \
reference (table4_1_*), and the chapter's two fits of the nu^4 law (formulas \
n2_q_absolute and n2_q_absolute_rotational).
- Table 4.2 (pp. 137-141, five parts; continuation order from the printed page numbers \
137-141): Sigma_j of the Q branches of O2, H2, D2, CO, CO2 (1285 and 1388 cm^-1), \
N2O (1285 and 2224 cm^-1), O3, CH4 and SF6, one dataset per molecule, band and \
reference letter (sigma_*); the N2 row (1 at every line, the definition) is not \
written.
- Table 4.4 (p. 149): CH4 per mode, the shifts, the depolarization ratios, Sigma_j \
(table4_4_*). SF6 is not in Table 4.4 (it is octahedral, in Table 4.2).
- Out of scope, not transcribed: in Table 4.2 F2, Cl2, Br2, I2 (not normalised with the \
temperature factor, note v), HF, HCl, HBr, HI, NO, ONF, H2O, H2S, SO2, NO2, C2H2, \
C2N2, NH3, ND3, C2H4, cis-C2H2Cl2, C2H3Cl, CH3OH, C2H6, C2H5I, C2H5OH, C3H6, CD4, CCl4, \
CH2Cl2, CHCl3, UF6, C3H8, C4H6, (CH3)2CO, C6H6, C6D6, C6H12; Table 4.3 (pp. 144-148, \
'Relative and absolute normalized differential Raman scattering cross sections \
measured with mercury arc excitation', converted by the chapter from scattering \
activities [4.10, 4.12]) holds no curated species (CS2, SeF6, TeF6, CH3OH, CH3CN, C2H2, \
the halogenated methanes and ethanes, alkanes, butadiene, vinyl acetylene, alcohols and \
halides); Table 4.4's other molecules (CD4, CF4, CCl4, SiF4, SiCl4, GeCl4, SnCl4, \
TiCl4, CH3D, CHD3, CHF3, CH3Cl, CHCl3, CDCl3, CH3Br, CF3Cl, CFCl3, CF3Br, CH2D2, \
CH2F2, CH2Cl2, CD2Cl2, CF2Cl2); Table 4.5 (p. 158, liquids: absolute normalised cross \
sections of C6H6, C6H5CH3, C6H5NO2, CS2, CCl4, CHCl3, C6H12 at 337-694 nm) and Table \
4.6 (p. 162, liquid/gas cross-section ratios Lambda and Lambda/L of CCl4, CHCl3, \
CDCl3, CH2Cl2, CD2Cl2, C6H6): liquids and out-of-scope molecules only. Figures 4.1 \
and 4.10-4.13 plot the tabulated values; nothing digitised. The text value for H2O \
(Murphy: dsigma_2/dOmega = (3.3 +- 0.8)e-32 cm^2/sr at 515 nm, p. 143) and the ethylene \
polarizability components (Hills and Jones, p. 143) are out of scope.

OWN AND REPRODUCED VALUES. The authors' laboratory's results are [4.45] (H. W. \
Klöckner, Dissertation, University of Munich (1977)) and [4.54] (J. G. Hochenbleicher, \
Dissertation, University of Munich (1977)): 'new results from our laboratory \
[4.54,45]' (p. 132); 'J.G. Hochenbleicher for many of the measurements' \
(acknowledgments, p. 163). Neither dissertation is in the library and this chapter is \
their publication, so they are use = "primary". Every other value is 'reproduced', \
with the citation as printed or the curated id: [4.10] murphy_1969, [4.21] fenner_1973, \
[4.22] hyatt_1973, [4.61] bermejo_1977. Murphy et al.'s ('a') Sigma_j are the \
chapter's conversion of their mercury-arc scattering activities.

N2 ABSOLUTE CROSS SECTION (pp. 127-130). The weighted average of Table 4.1's normalised \
column (all but Penney's 300 nm value, 'a deviation by a factor of 2 from the (nu_0 - \
nu_j)^4 dependence') is (5.05 +- 0.08)e-48 cm^6/sr (table; the text writes +- 0.1), \
'and can be used throughout the visible and in the uv to about 330 nm'; against the \
N2 rotational line J = 6 -> 8 at 488 and 514.5 nm [4.45]: (4.97 +- 0.2)e-48. 'The \
absolute Raman scattering cross section of the Q-branch of the vibrational band of N2 \
is now known with an accuracy of about 2% throughout the visible and near uv' (p. \
163). The H2 standard: the measured intensity ratios of the other H2 rotational lines \
to J = 1 -> 3 'differed from the calculated ratio by less than 2.6% in the visible and \
less than 10% in the uv', the estimate of the calibration uncertainty (p. 129). \
Spectroscopic temperature of H2 (299 +- 1) K at a room temperature of (296 +- 2) K \
(p. 129). Fenner et al. [4.21] at 488 nm: the lower value (33) by an absolute \
spectrometer calibration, the higher (43) against liquid benzene (p. 127).

ACCURACY OF Sigma_j (p. 136): 'The accuracy of the data from our laboratory and also \
from most other groups is +-10% for the visible exciting lines and +-15% in the near uv \
(LEVATTER et al. [4.40] claim +-5% at 337 nm)', recorded per dataset (level not \
stated). 'Relative cross sections for other gases have been determined with an accuracy \
varying from 5 to 15% and more' (p. 163).

WAVELENGTHS. Table 4.1 prints the laser and mercury lines (632.8, 514.5, 488.0, 457.9, \
435.8, 363.8, 351.1 nm, and 300 nm), taken as standard-air wavelengths (the \
conventional air wavelengths of these lines; the chapter does not say). Table 4.2's \
column heads are the same lines rounded to 1 nm (337 is the N2 laser, 347 the doubled \
ruby, 287 Penney's doubled dye laser); the medium is immaterial at that rounding and is \
recorded as standard air. The normalised column of Table 4.1 reproduces from the \
absolute one with nu_0 = 1/lambda_0 to its printed digits either way.

ISOTOPOLOGUES AND STATE. Natural gases at room temperature (296-299 K); H2 and D2 are \
normal hydrogen and deuterium (nothing else is said). The cross sections are per \
molecule; no density enters."""

[[formulas]]
id = "n2_q_absolute"
material = "N2"
equation = "The equation below Table 4.1, p. 130"
printed = "(dsigma/dOmega)_{Q,N2} = (5.05 +- 0.1) 10^-48 (nu_0 - 2331 cm^-1)^4 cm^6 sr^-1"
variable = "nu_0: the wavenumber of the exciting line in cm^-1 (1/lambda_0); the result in cm^2 sr^-1"
state = "room temperature (the Q branch as a whole); per molecule"
density = "unknown"
range = "'throughout the visible and in the uv to about 330 nm. Further extrapolation into the uv remains uncertain' (p. 130); the lines averaged are 632.8-351.1 nm"
coefficients = { C = "5.05e-48", sigma_C = "0.1e-48", nu_R = "2331" }
check = "Table 4.1's normalised column averaged with weights 1/sigma^2, the 300 nm value excepted, gives 5.048 +- 0.076 (printed 5.05 +- 0.08 in the table, +- 0.1 in the text); the formula reproduces the chapter's own absolute values to their digits (514.5 nm: 5.05e-48 x 17105.3^4 = 43.2e-32 cm^2/sr, printed 43.2 +- 0.8; 351.1 nm: 236e-32, printed 243 +- 30) (checked 2026-09-27)."
notes = "The absolute differential cross section of the N2 fundamental's Q branch for 90 deg scattering of linearly polarized light, both scattered polarization components (Eq. 4.9). The average includes the other groups' values of Table 4.1 (Fouche and Chang, Penney et al., Hyatt et al., Fenner et al., Murphy et al., Kamiyama et al.) with the authors' own [4.45]: it is a weighted mean of a compilation, not the authors' measurement alone. The reference of every Sigma_j of this record."

[[formulas]]
id = "n2_q_absolute_rotational"
material = "N2"
equation = "The second equation below Table 4.1, p. 130"
printed = "(dsigma/dOmega)_{Q,N2} = (4.97 +- 0.2) 10^-48 (nu_0 - 2331 cm^-1)^4 cm^6 sr^-1"
variable = "nu_0: the wavenumber of the exciting line in cm^-1; the result in cm^2 sr^-1"
state = "room temperature; per molecule"
density = "unknown"
range = "measured at 488 and 514.5 nm"
coefficients = { C = "4.97e-48", sigma_C = "0.2e-48", nu_R = "2331" }
check = "No tabulated value to reproduce; 1.6 % below n2_q_absolute, within the uncertainties, as the chapter says ('agrees well with the average given above')."
notes = "The authors' check [4.45]: the N2 Q branch measured against N2's own pure rotational line J = 6 -> 8 at the exciting lines 488 and 514.5 nm (p. 130), independent of the H2 standard."

