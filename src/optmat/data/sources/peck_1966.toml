citation = "E. R. Peck and B. N. Khanna, J. Opt. Soc. Am. 56, 1059 (1966)"
library = "Peck_1966_DispersionNitrogen"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Corner-reflector interferometer with a 24 cm gas cell in one arm and two \
light sources at once (a visible reference line and a second line), fringes counted \
as the gas is admitted and pumped out and interpolated to 0.001 order; refractivity \
ratios independent of cell length and density. Pressure by wide-bore mercury \
manometer (local g = 980.302 cm/s^2), temperature by thermocouple. Matheson N2, \
99.996 %, through a dry-ice cold trap."""
notes = """Identity: the library record is UNVERIFIED; the text is 'Dispersion of Nitrogen' \
by Edson R. Peck and Baij Nath Khanna (Northwestern University, received 3 December \
1965), file josa-56-8-1059.pdf, which matches the citation J. Opt. Soc. Am. 56, \
1059-1063 (1966) given for it by Griesmann (1999) and Peck & Huang (1977). No DOI is \
recorded (the library has none).

Reduction: to one atmosphere at T0 with the factor K of Eq. (2), the real-gas \
compressibility Z = 1 - p (317.60 - T) 1e-5 (Eq. 1, p in atm, from Hilsenrath's \
tables, 'developed under the old convention of 0 C = 273.16 K') and a small \
Lorentz-Lorenz correction: density = real. Wavelengths are vacuum (Table I heading).

Table I gives relative values: 'a nominal value of 10^8 (n - 1) = 28 352.40 at 15 C is \
taken for the mercury green line at vacuum wavelength 5462.258 A; other values of \
refractivity are expressed in terms of this as a standard' (p. 1060). The absolute \
measurement at 5462.258 A is 28 352.4 +- 1.6 at 15 C and 1 atm (statistical standard \
deviation of 22 sets of runs), 'significant only to about four digits'; with 'a \
realistic estimate of total error', 10^6 (n - 1) = 299.14 +- 0.10 at 0 C (p. 1060). \
The relative values are about two orders of magnitude more precise: the rms deviation \
of the 16 fitted points from Eq. (3) is 0.083e-8, 'considered to be a better \
representation of precision than the individual standard deviations' (p. 1061). \
Hence per point absolute = 0.083 (rms) and systematic_relative = 3.3e-4 (0.10 / \
299.14, the realistic total error, level not stated, taken as one sigma). The 0 C \
absolute value is the same measurement converted, so it is not a separate dataset.

Three points (5087.242, 7034.352, 13507.884 A) are printed in parentheses and were \
omitted from the fit as 'excessively far from the trend' (the 7034 A neon line has an \
unresolved weak neighbour, p. 1061). Table II gives the dispersion of the Verdet \
constant as ratios to its value at 5780 A (air wavelengths), computed from Eq. (3) \
and measured by Ingersoll & Liebenberg (1954); the computed column is a check of the \
formula, the measured one a reproduction. Other results: n_inf - 1 = 293.77e-6 at \
0 C from Eq. (4) (p. 1062; all formulas agree within 0.01e-6); Verdet factor \
r = 0.636 at 5462 A; the Rayleigh cross section 0.5182e-28 cm^2 at 30 degrees, \
6945.165 A in vacuo (p. 1063). Svensson's air formula (p. 1061) is skipped (air is \
not a species)."""

[[datasets]]
id = "experiment"
material = "N2"
file = "N2/peck_1966__experiment.csv"
table = "tbl_c2970086b7ad"
quantity = "refractivity"
scale = 1e-8
abscissa_unit = "angstrom"
wavelength_medium = "vacuum"
state = "1atm_15C"
density = "real"
use = "primary"
notes = "The 16 fitted points, standardised to 28352.40 at 5462.258 A (the absolute scale, +-3.3e-4, is the systematic uncertainty)."
[datasets.uncertainty]
absolute = 0.083
level = "rms"
systematic_relative = 0.00033

