[datasets.parameters]
reference_wavelength_nm = 578.0

[[datasets]]
id = "verdet_ratio_ingersoll_liebenberg"
material = "N2"
file = "N2/peck_1966__verdet_ratio_ingersoll_liebenberg.csv"
table = "tbl_029c38d597ef"
quantity = "verdet_constant_ratio"
unit = "1"
abscissa_unit = "angstrom"
wavelength_medium = "standard_air"
state = "1atm_15C"
density = "unknown"
use = "reproduced"
reproduced_from = ["L. Ingersoll and D. Liebenberg, J. Opt. Soc. Am. 44, 566 (1954)"]
notes = "Table II 'Ratio measured by Ingersoll and Liebenberg': V(lambda)/V(5780 A). The ratio to the dispersion formula (the factor r of the Becquerel-Serber relation) is constant within 4.4 % over 3635-9875 A (p. 1063); r itself is 0.636 at 5462 A, so these ratios constrain dn/dsigma only through an assumed constant r. The state is nominal (the ratio does not depend on it to first order)."
[datasets.parameters]
reference_wavelength_nm = 578.0

