notes = "Table 2 (p. 1245), 'Electronic chi_nr(3)' of N2, 8.5 +- 2 x 10^-18 (cm^3/erg)/amagat, note c: 'Ref. 9' (Farrow and Rahn 1985, whose Table 2 prints 8.5 +- 1.3 and whose text 8.5 +- 0.9; here +- 2). The calibration value of this paper's ratios (abstract: propane, n-butane and water 11.5 +- 1.4, 14.4 +- 1.8 and 2.2 +- 0.3 times N2). CARS at a 532 nm pump, per amagat (no state)."
