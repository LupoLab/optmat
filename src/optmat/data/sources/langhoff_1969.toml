[[formulas]]
id = "cauchy_He"
material = "He"
equation = "Eq. (29), p. 4, with Table I"
printed = "(n - 1) = 2 pi N_0 (alpha_0 + alpha_1 omega^2 + alpha_2 omega^4 + alpha_3 omega^6), 2 pi N_0 = 0.2502 x 10^-4"
variable = "omega: photon energy (angular frequency) in atomic units (hartree)"
state = "1atm_0C"
density = "ideal"
range = "fitted to 2753-5462 A; convergent only below omega_1 = 0.7797 au"
coefficients = { two_pi_N0 = "0.2502e-4", alpha_0 = "1.3838", alpha_1 = "1.550", alpha_2 = "2.066", alpha_3 = "2.95", omega_1 = "0.7797" }
check = "At 5462.258 A (vacuum, omega = 0.08342 au) it gives 34.895e-6, Leonard's (1974) recommended value to the digit. Checked 2026-09-24."
notes = "Four-term Cauchy fit constrained to be a Stieltjes series (Eqs. (5), (28), (A2)-(A7)); alpha_k = S(-2k-2), extracted as dataset cauchy_He. 2 pi N_0 = 0.2502e-4 is 2 pi N_L a_0^3 with Loschmidt's number (2.5016e-5), hence density 'ideal'."

[[formulas]]
id = "pade22f_He"
material = "He"
equation = "Eq. (30), p. 4, with Table II"
printed = "(n - 1) > 2 pi N_0 [2,2]_f = 2 pi N_0 [f_a/(omega_a^2 - omega^2) + f_b/(omega_b^2 - omega^2)], 2 pi N_0 = 0.2502 x 10^-4"
variable = "omega: photon energy (angular frequency) in atomic units (hartree)"
state = "1atm_0C"
density = "ideal"
range = "a lower bound to n - 1 below omega_1 = 0.7797 au; built from the Table I moments"
coefficients = { two_pi_N0 = "0.2502e-4", omega_a = "0.8227", omega_b = "1.485", f_a = "0.6097", f_b = "1.065" }
check = "Its four moments f_a/omega_a^(2k+2) + f_b/omega_b^(2k+2) reproduce Table I's alpha_0..alpha_3 to 0.1 %. No tabulated values (Fig. 5 only). Checked 2026-09-24."
notes = "The [2,2]_f Pade approximant (identical to [2,1]_alpha), a two-term Sellmeier form with fictitious transition frequencies and strengths; the paper suggests it 'is an accurate representation' for H2 (p. 7)."

