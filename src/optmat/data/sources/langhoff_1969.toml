citation = "P. W. Langhoff and M. Karplus, J. Opt. Soc. Am. 59, 863 (1969)"
doi = "10.1364/josa.59.000863"
library = "Langhoff_1969_PadeSummationCauchy"
identity = "VALIDATED_WITH_WARNINGS"
kind = "fit"
technique = """Four-term Cauchy coefficients (alpha_k = S(-2k-2)) fitted to measured \
refractivity by a least-squares procedure constrained to a convergent series of \
Stieltjes (CREEP program, projection method), then summed by upper- and lower-bounding \
Pade approximants ([n,n]_f, [n,n-1]_f, [n,n]_k, ...) to extrapolate n - 1 into the \
ultraviolet."""
notes = """All values at NTP (0 degrees C, 1 atm), n - 1 = 2 pi N_0 alpha(omega) with 2 pi \
N_0 = 0.2502e-4 (omega in atomic units): N_0 is Loschmidt's number, so the moments and \
predictions refer to the ideal-gas density (density 'ideal'). The refractivity data \
fitted are those of the Landolt-Boernstein compilation (Ref. 1) over the intervals of \
Table I (e.g. Ar 2894-20586 A); for N2 the data span 20 587-4679 A (p. 8). No \
uncertainties are given for the moments.

Table III's 'present results' are the [2,1]_alpha = [2,2]_f lower bounds 'in every case \
but the last two in each column', which are means of the [2,2]_f and [1,1]_k bounds \
(p. 6). Recomputing them (checked 2026-09-24) shows that for Ne only 1300 and 1200 A are \
means, for Ar every entry from 1800 A down and for Kr from 1800 A down differ from the \
lower bound by more than rounding (means), and for Xe all entries are lower bounds, as \
Tang and Poon 1974 found by repeating the calculation. Xe at 1600 A is misprinted \
(erratum). Table III's 'previous calculation' columns and Table IV's second column are \
Kingston's (1964) values; Table IV's measured column is Heddle et al.'s and Gill and \
Heddle's (1963) and Marmo's (via Liggett and Levinger 1968); Table V's measured column \
is Wilkinson's (1960) nitrogen data, not otherwise in the library. The Pade columns of \
Tables IV and V are extracted as checks; their +- is the spread over the \
measurement's wavelength band ('the uncertainties on the wavelength values correspond \
to the range used in the measurements', Table IV note b), not an uncertainty.

Table VI (H and H2 Cauchy coefficients for N = 2-5 terms, fitted to 15 exact H points \
or Kirn's 15 H2 measurements, with rms deviations) documents the convergence of the \
fit; its 'Final' H2 row is Table I's and nothing else is extracted. Atomic hydrogen \
(Tables I, II, VI) is not a species of the package."""

