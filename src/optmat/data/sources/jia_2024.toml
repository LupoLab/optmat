citation = "Y.-W. Jia, C. H. Yuen, W.-Q. Jing, Z.-Y. Zhou, C. D. Lin and S.-F. Zhao, \"Improved model for the dissociative sequential double ionization of nitrogen molecules by an intense few-cycle infrared laser pulse\", Phys. Rev. A 110, 023112 (2024)"
doi = "10.1103/PhysRevA.110.023112"
library = "Jia_2024_ImprovedModelDissociative"
identity = "VALIDATED"
kind = "theory"
technique = """The density-matrix model of sequential double ionisation (DM-SDI) of \
yuen_2022, Eqs. (1)-(4), with two additions: field couplings between the N2^2+ \
states (Table IV, calculated here) and the vibrational spread of the neutral's ground \
state. The model is solved at fixed R = 1.00, 1.05, 1.10, 1.15 and 1.20 angstrom with \
that geometry's vertical energies (Table I), structure parameters (Table II) and \
dipoles (Tables III-IV), averaged over isotropic alignment (Eq. 9), and the KER \
spectra are averaged over |phi_1(R)|^2 of the neutral's v = 0 level (Eq. 11; Fourier \
grid Hamiltonian, a modified Morse potential of Desai et al. 2020). MO-ADK rates \
(Tong et al. 2002; Zhao et al. 2011); C_l of the 3sigma_g, 1pi_u and 2sigma_u orbitals \
of N2 by the method of Zhao et al. (2010, 2017: an LB-alpha model potential, the \
orbitals solved with B-splines, the asymptotic part fitted), and the same C_l for the \
cation's orbitals. N2^2+ dipoles: SA-CASSCF with rotated multistate CASPT2 in \
OpenMolcas, ANO-L basis, 8 electrons in 11 orbitals, 9 singlet and 6 triplet states. \
Fourth-order Runge-Kutta with a fixed step."""
notes = """The library holds the accepted manuscript (CHORUS, 8 PDF pages; published 26 \
August 2024); pages are cited as PDF pages. Identity checked on PDF pp. 1-2 (Yan-Wen \
Jia, C. H. Yuen, Wen-Quan Jing, Zhong-Yao Zhou, C. D. Lin and Song-Feng Zhao; \
Northwest Normal University, Kennesaw State, Kansas State) on 2026-10-09. The register \
entry is TC-957.

THE PULSE OF THE MODEL (Eq. 5, p. 3): E(t) = E0 exp(-2 ln 2 t^2 / tau^2) cos(omega t), \
tau the FWHM, linear polarisation in the xz plane, the molecular axis along z. Fig. 2: \
1.2e15 W/cm^2, 8 fs FWHM, 800 nm, sigma = 0.28 eV. Fig. 4: (b) as Voss et al. 2004, \
1.2e15 W/cm^2, 8 fs, 800 nm, sigma = 0.03 KER; (c) as Wu et al. 2010, 7.5e14 W/cm^2, 8 \
fs, 780 nm, sigma = 0.05 KER; the measured spectra shifted by -0.20 eV and +0.37 eV to \
match the 7.43 eV peak.

TABLE I (p. 4): taken. 'The vertical ionization energies at different internuclear \
distances are obtained from Pandey et al. [32]' (J. Chem. Phys. 140, 034319 (2014)); \
limits from Iwayama et al. 2016 (states 10 and 11 from the curves of ref. 29). The \
KER are not tabulated: 'The KER values at different internuclear distances are the \
difference between vertical ionization energies and the dissociation limits' (p. 4). \
The text's peaks at R = 1.10 angstrom, 6.54 eV (state 5) and 10.03 eV (state 9) (p. 5), \
are Table I's 45.50 and 48.99 eV less 38.96 eV, the 3P + 3P limit implied by \
yuen_2022's Table I. Against yuen_2022's Table I (Bhattacharya et al. 2021, R = 1.09 \
angstrom) the values at 1.10 angstrom are 0.13 to 0.21 eV lower for states 1-10 and \
0.85 eV lower for state 11 (TC-957).

TABLE II (p. 5): taken. The LB-alpha binding energies, the 'C+M' (CASSCF+MRCI) \
energies of ref. 29 (Bhattacharya et al. 2021), the C_l ('For sigma orbitals, m = 0 \
and for pi orbital, m = 1') and alpha. alpha changes with R (1.15, 1.08, 1.13, 1.14, \
1.11) and is not explained; the LB-alpha energies and the C_l are not smooth in R \
(3sigma_g C_0m 3.11, 3.25, 2.99, 2.56, 2.89), which suggests alpha was set at each R \
(perhaps to an energy), but the paper does not say. At R = 1.10 the 3sigma_g C_l {2.99, \
1.48, 0.12} differ from zhao_2010's {2.68, 1.10, 0.06} (LDA + LB) and zhao_2017's \
{3.39, 1.40, 0.05} (LB-alpha, alpha = 1.12) at 1.098 angstrom; the 1pi_u {2.15, 0.37, \
0.00} and 2sigma_u {4.22, 0.55, 0.04} against zhao_2010's {1.89, 0.22, 0.01} and \
{3.72, 0.34, 0.01} (TC-957).

TABLE III (p. 5): taken; 'taken from Refs. [36, 37]' (Langhoff, Bauschlicher and \
Partridge 1987; Langhoff and Bauschlicher 1988), R in bohr.

TABLE IV (p. 6): taken, material N2++ (registered in TC-954). Transition dipoles (au) \
between N2^2+ states (Table I's numbering) at the five R, this paper's calculation: \
d(1-4), d(1-10), d(2-5), d(2-6), d(3-6), d(4-7), d(4-8), d(4-9), d(8-10), d(9-10), each \
along x or z as printed (the same axis at every R, checked by the script, and the one \
the states' symmetries allow). One dataset per pair, as Table III.

TEXT: the couplings between dication states raise the three KER peaks by factors 4.5, \
2.3 and 2.4 (p. 5); at R = 1.10 angstrom and 45 degrees they lower the final \
populations of states 1-4 by 41.1, 54.6, 51.2 and 66.2 % and raise those of states \
5-10 by about 16.1, 2.1, 2.8, 1.5, 3.3 and 22.7 times (p. 5). Model statements, not \
taken.

FIGURES (not digitised; vector drawings except Fig. 1, a tiled raster): Fig. 2, the \
alignment-averaged yields of the dissociative N2^2+ states at R = 1.10 angstrom with \
and without the dication couplings (800 nm, 8 fs, 1.2e15 W/cm^2), with the KER \
spectra; Fig. 3, the N2^2+ populations against time at 45 degrees; Fig. 4, |phi_1(R)|^2 \
and the R-averaged KER spectra against Voss et al. and Wu et al."""

