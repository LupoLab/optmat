citation = "E. Eva and K. Mann, Appl. Phys. A 62, 143 (1996)"
doi = "10.1007/bf01575711"
library = "Eva_1996_CalorimetricMeasurementTwo"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Laser calorimetry: 25 ns excimer pulses (Lambda Physik EMG202) at 351, \
248 or 193 nm, apertured and focused to a point behind the slightly tilted sample; \
transmitted energy by a pyroelectric detector (Ophir PE50), incident energy computed \
from the refractive index and the absorbed energy; temperature by two NTC resistors, \
calibrated electrically with a resistor glued at the laser spot. Irradiation 30 s at \
19-150 Hz, energy density H set by a variable attenuator, intensities 2-80 MW/cm2 \
(1/e^2 maximum 80 MW/cm2). Beam profile a flat Gaussian (intensity at 90 % of the \
maximum twice that at 1/e^2), at most 6 x 4 mm2 on 25 mm samples."""
notes = """Table 1 (p. 4) is transcribed in full. It is a wide table with a label \
column ('351 nm:', '248 nm:', '193 nm:') before each wavelength block; checked against \
the image row by row (see the extraction script): every value is in its column. Caption \
(verbatim): 'Absolute absorption coefficients of commercially available UV-grade \
substrates at 351, 248 and 193 nm (3.5/5/6.4 eV) (surface absorption not accounted for), \
absolute uncertainty is +-20 % for alpha and +-40 % for beta; beta_Lit. (measured at \
248 nm / 0.7 ps) and E_gap from [2] unless stated otherwise'. Ref. [2] is taylor_1988, \
[19] brimacombe_1989, [20] weinberg_1979. '-' is 'not measured'.

Definitions (p. 1): dI/dz = -alpha I - beta I^2 (Eq. 1), and the absorptance of a sample \
of thickness dz is A = dz (alpha + beta H / tau_pulse) (Eq. 2): alpha from the offset and \
beta from the slope of A against intensity, so alpha is a Napierian (base e) \
coefficient per length. A is the absorbed over the incident energy (Eq. 3); the \
incident energy inside the sample is computed with the refractive index, so front- \
surface reflection is removed, but surface absorption is included in alpha. For a \
flat-topped profile beta is the slope; for this beam 'a constant factor of 0.7 applies' \
(p. 2, stated for BaF2, from attenuation computed over ten areas of homogeneous \
intensity); whether it was applied to the other materials is not said.

Samples and grades: fused silica S1 and S2 are Suprasil 1 and Suprasil 2 (Heraeus; \
p. 2 and p. 5: Suprasil 2 'differs from Suprasil 1 only in optical homogeneity'; both \
high-OH). 'A CaF2 crystal (Korth Kristalle)' is named in Sec. 3.1 without saying which \
CaF2 row it is. The crystalline quartz is z-cut (p. 6): light along the optic axis, so \
its datasets are given axis 'o' (an inference from the cut). No other orientation is \
stated (MgF2's is not). Liquids: none.

Thicknesses dz (mm) as printed: S1 1, CaF2 2 and 5 (two rows), LiF 2, MgF2 2, S2 2, \
quartz 2, BaF2 5, CaF2 5 (the 193 nm row); kept in the files' printed column.

Text values (not tabulated): BaF2 at 248 nm, maximum absorptivity 2.1 % at 1.1 J/cm2, \
transmission loss (2 +- 0.8) %; linear fits for two samples consistent to +-6 % relative \
(p. 2); up to 24 % of the BaF2 slope may be intensity-dependent colour-centre \
absorption (transient, lifetime tau_life = 50 ms in the model of Eq. 4), 'then our value \
for beta must be too large' (p. 3). Suprasil 1 at 248 nm, 1.4 J/cm2, saturates at alpha = \
0.14/cm after 3e5 pulses (induced absorption, not an intrinsic value; p. 4). The fused-\
silica beta comes from absorptance extrapolated to zero pulses (Figs. 6-7); 'some of the \
slope (up to a third) might be due to transient, intensity-dependent color-center \
formation' (p. 5). CaF2 at 193 nm: 'as the sample was damaged at 420 mJ/cm2 already, \
only approximate coefficients could be derived' (p. 3); the authors conclude from the \
absence of two-photon absorption at 248 nm that the CaF2 gap exceeds 2 x 5.0 eV.

Formula: the degradation-rate fit of Suprasil 2 at 248 nm (below). The figures (2-10) \
are not digitised: absorptance against H or pulse number for CaF2 and MgF2 (Fig. 2), \
BaF2 (Figs. 3-4), Suprasil 1 and 2 (Figs. 5-9) and quartz (Fig. 10).

Reproductions: the E_gap column and the beta_Lit values come from taylor_1988 (the \
CaF2 .08 is Taylor's 8.3e-12 rounded; LiF and MgF2 '<= .01' are Taylor's <= 1.3e-12 \
bounds rounded), 2.1 from brimacombe_1989 (its 248 nm fibre value, 2.1e-4 cm/MW = \
2.1e-10 cm/W, measured with 9 ns pulses although the caption says 0.7 ps), and the \
quartz gap from weinberg_1979."""

[[formulas]]
id = "degradation_rate"
material = "SiO2"
equation = "Fig. 7 and p. 5"
printed = "Delta A / n = 0.056 ppm (H[J/cm^2])^3.14"
variable = "H: energy density per pulse in J/cm2; Delta A / n: initial absorptance increase per pulse, in ppm"
range = "Suprasil 2, 2 mm, 248 nm, 33 Hz; the four energy densities (>= 600 mJ/cm2) at which ageing took place"
coefficients = { a = "0.056", p = "3.14" }
check = "The paper's own prediction, 160 ppm after 200 000 pulses at 256 mJ/cm2 (p. 6), is reproduced: 0.056 x 0.256^3.14 x 2e5 = 155 ppm (checked 2026-09-26)."
notes = "Log-log regression of the initial degradation rates of Fig. 6; 'given the uncertainty and scarcity of the data points, a quadratic relationship cannot be ruled out' (p. 5). No change was seen at 250 mJ/cm2 over 200 000 pulses (a threshold the fit does not describe)."

