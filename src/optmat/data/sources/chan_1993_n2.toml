citation = "W. F. Chan, G. Cooper, R. N. S. Sodhi and C. E. Brion, \"Absolute optical oscillator strengths for discrete and continuum photoabsorption of molecular nitrogen (11-200 eV)\", Chem. Phys. 170, 81 (1993)"
doi = "10.1016/0301-0104(93)80095-q"
library = "Chan_1993_AbsoluteOpticalOscillator_6b574e"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Dipole (e,e) spectroscopy. Low resolution (about 1 eV FWHM, 8 keV, zero mean \
scattering angle): energy-loss spectra at 11-48, 48-100 and 100-200 eV in 0.5, 1 and 2 \
eV steps, Bethe-Born converted; the valence-shell fraction above 200 eV from a fit A \
E^-B to 90-200 eV (B = 2.283; 5.6 %); the whole TRK-normalised to 10.3 (10 valence \
electrons plus 0.3 for Pauli-excluded core transitions) (pp. 5-6). High resolution \
(0.048 eV FWHM, 3 keV): 12-22 eV, Bethe-Born converted and normalised at 20 eV to the \
low-resolution value; the partially resolved peaks at 12.4-14.9 eV deconvoluted with \
symmetric Voigt profiles at the energies and assignments of Geiger and Schroder \
(1969), unresolved pairs split with Stahel et al.'s calculated relative band strengths \
(pp. 8-9). Independent of optical data and target density; no line saturation. \
Background removed by quartering the sample pressure; energy scale from helium's \
21.218 eV line. Medigas N2, 99.0 % (p. 5)."""
notes = """Values per molecule; no density or state involved (room-temperature N2, not stated). \
The reference list gives this paper and its companion as 'Chem. Phys. 170 (1993) 81, \
111'; this record is pp. 81-97.

Table 1 (p. 7): the low-resolution df/dE, 11-200 eV, 177 points (sigma(Mb) = 109.75 \
df/dE(eV^-1)); 'in the discrete region the low resolution data ... represent an \
integral over the unresolved transitions' (p. 6). No uncertainty is stated for it. \
Good agreement with Samson and Haddad's photoabsorption; Cole and Dexter slightly \
lower; Denne (150-195 eV) about 50 % lower; the 1976 dipole (e,e) data of Ref. [49] \
(J. Phys. B 9, 675) are slightly lower at 18-35 eV and higher above 50 eV (p. 8). Sums \
computed from Table 1 (2026-09-27; trapezoid, with the A E^-B tail, B = 2.283, from \
the 200 eV point): S(0) = 9.721 over 11-200 eV and 10.332 with the tail (9.721/0.944 = \
10.30, the normalisation); S(-1) = 9.208, S(-2) = 11.654 au, S(-3) = 17.69, S(-4) = \
29.82, S(-6) = 100.4. Olney et al. (olney_1997 table1_N2) quote 11.54 au for the S(-2) \
of 'the originally published' spectrum, 1 % below this low-resolution table's value \
(they presumably used the high-resolution data in the discrete region). The paper \
prints no S(k).

Table 2 (p. 11): the present oscillator strengths of the discrete transitions at \
12.500-14.860 eV (energies and assignments from Geiger and Schroder), 45 values \
(dataset discrete_present). Four values are printed once for braced groups of \
unresolved transitions: 13.345 eV (b v' = 9 + o v' = 1), 13.760 and 13.785 eV (b' v' = \
10 + b v' = 14, row 13.760+), 14.230 eV (b' v' = 16 + c v' = 5 + c' v' = 5) and 14.720 \
eV (c v' = 7 + c' v' = 7). Rows printed '-' (no value): b v' = 8, 13, 15, 16, o v' = \
0, b' v' = 5, 13, e v' = 2. Uncertainty (p. 8): 'about 5-10% for the relatively strong \
and well separated peaks in the energy region 12.40-13.27 eV, and about 10-20% for the \
remaining peaks at higher energies'; the upper ends (10 % and 20 %) are stored. The \
Table 2 values sum to 1.0779.

Tables 3-7 (pp. 12-14): the same present values arranged by final state (b, b', c', c, \
o; the unresolved pairs split with Stahel et al.'s relative band strengths), with the \
literature values; rows and label v'. The present columns are checks (they repeat \
Table 2). They agree with Table 2 except b' v' = 23 and 24: 0.00897 and 0.00363 in \
Table 4 against 0.0102 and 0.00455 in Table 2 (images checked; Table 2's 0.00455 \
repeats its b' v' = 22 value). Table 8's b' total, 0.278, is the sum of Table 4's \
column (0.2777); with Table 2's two values it would be 0.2799. Not resolved: kept as \
printed in both. Table 8 (p. 15): the state totals (present, four experiments, six \
theories). Column sums against Table 8 (checked 2026-09-27): present b 0.2435 (0.243), \
b' 0.2777 (0.278), c 0.1451 (0.145), c' 0.2792 (0.279), o 0.0802 (0.080); Zipf and \
McLaughlin b' 0.3102 (0.310), c 0.1563 (0.156), c' 0.3172 (0.317), o 0.0921 (0.0921), \
but b 0.2601 against 0.283; James et al. b 0.1562 (0.156); Ajello et al. c' 0.2232 \
(0.223), but b' 0.3426 against 0.321 (their v' = 7 and 8 values, 0.003409 and \
0.022107, look out of line). Kept as printed.

Table 9 (p. 15): integrated oscillator strengths over 16 intervals, 14.92-16.91 eV \
(sum 0.456), where the transitions overlap too much to deconvolute. No uncertainty \
stated.

Text (p. 13, 15): Berkowitz's integrated oscillator strength below 15.56 eV, 1.153 \
(from Lassettre and Skerbele's data), and over 15.56-16.76 eV, 0.3299 (from Carter's \
data); the present values 1.173 and 0.319 (inline datasets). Table 2 plus Table 9 to \
15.54 eV give 1.180. Fig. 1 compares the present 12.4-13.2 eV spectrum with Gurtler et \
al.'s (1977, gurtler_1977) synchrotron Beer-Lambert spectrum: the relative and \
absolute band strengths differ dramatically (line saturation)."""

