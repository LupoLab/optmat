citation = "D. C. Hanna, D. J. Pointer and D. J. Pratt, \"Stimulated Raman scattering of picosecond light pulses in hydrogen, deuterium, and methane\", IEEE J. Quantum Electron. 22, 332 (1986)"
doi = "10.1109/jqe.1986.1072945"
library = "Hanna_1986_StimulatedRamanScattering"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Stimulated Raman scattering thresholds of about 100 ps pulses (mode-locked, \
Q-switched Nd:YAG at 1.06 um, about 70 ps at 0.53 um after doubling; also a \
mode-locked dye laser near 560 nm) in H2, D2 and CH4 at 30 atm, in 0.5 and 1 m cells \
(tight focusing) and in fused-silica capillaries of 200 um bore, 40 and 78 cm long \
(pp. 332-335). The measured quantities are threshold energies (1 % conversion, Tables \
II-III); the Raman parameters of Table I are calculated from published cross sections \
and linewidths (Eqs. 1-2, p. 332-333)."""
notes = """Journal pages 332-336 = PDF pages 1-5 (page n of the PDF is p. 331 + n). \
Identity checked on the first page (IEEE J. Quantum Electron. QE-22, No. 2).

NOTHING IN TABLE I IS MEASURED HERE. Table I (p. 333), 'Steady-state Raman gain g_R and \
dephasing time T2, both calculated at 30 atm pressure':
- dsigma/dOmega (m^2/sr, the intensity definition: 'defined here in terms of the ratio \
of scattered and incident intensities', p. 332; (dsigma/dOmega)_photons = (omega_p/ \
omega_s)(dsigma/dOmega)_intensity): for H2 and CH4 converted by Eq. (2) from Schrotter \
and Klockner's tabulated relative normalized cross sections [17] (curated as \
schrotter_1979, Table 4.2) to the pumps used, \
with a single intermediate level at nu_ig = 90000 cm-1 (H2, D2) or 70000 cm-1 (CH4) \
[18] (p. 333); for D2 '* Scaled from the measured value at 694nm reported by Devir \
[22]'. Reproduced (converted), use = "reproduced".
- g_R (m/W): calculated by Eq. (1), g_R = 16 pi^2 c^2 Delta N dsigma/dOmega/(n_s^2 hbar \
omega_s^3 Delta omega_R), Delta omega_R the FWHM linewidth (angular frequency), Delta N \
= N_tot (CH4, the Q branch unresolved at 30 atm), 0.66 N_tot (H2, J = 1) and 0.38 N_tot \
(D2, J = 2) [21] (p. 333). The paper's own calculation: use = "check".
- T2 (ps) = 2/Delta omega_R (p. 333), from the linewidths below at 30 atm: use = \
"check".
- the shifts (4155, 2987, 2917 cm-1) as printed, source not stated (use = "check"). \
solprop's D2 vibrational frequency cites this paper: 2987 cm-1.
The pump wavelengths are printed as 1.06 um (9,391 cm-1) and 0.53 um (18,782 cm-1), \
nominal Nd:YAG values; the abscissa is the printed um value (1/9391 cm = 1.0648 um).

LINEWIDTHS USED (p. 333, reproduced; quoted): 'Delta omega_R is the Raman linewidth \
(angular frequency, FWHM)' (p. 332). 'For CH4, Delta nu_R = 0.32 + 0.012p cm-1 where p is \
in atmospheres [19] (Taira, Ide and Takuma, Chem. Phys. Lett. 91, 299 (1982)); for H2 \
and D2 [Q(1) and Q(2) transitions, respectively] since we operate at pressures where \
the linewidth is proportional to pressure (>10 atmospheres) we use the line broadening \
coefficients of 51 MHz/atm [16], and 70 MHz/atm [20], respectively' ([16] Bischel and \
Black 1983 with Owyoung 1983; [20] Murray and Javan, J. Mol. Spectrosc. 42, 1 (1972)). \
The H2 and D2 coefficients are the datasets linewidth_H2 and linewidth_D2, the CH4 law \
the formula linewidth_CH4; all three are FWHM as this paper uses them (the cited papers \
are not in the library: their own FWHM/HWHM statements are unchecked). Temperature not \
stated (room temperature). Since 2026-09-27 [20] is curated (murray_1972): its widths \
are FWHM in its own words, and its D2 Q_1(2) coefficient, 2.2e-3 cm-1/amagat, does not \
give 70 MHz/atm (see linewidth_D2).

REPRODUCTION (2026-09-26, scratch): T2 = 2/Delta omega_R gives 208.0 ps (H2, 51 MHz/atm x \
30), 151.6 ps (D2, printed 150) and 15.6 ps (CH4, printed 16). Eq. (1) with n_s = 1 \
reproduces the printed g_R to 1-4 % (H2 0.960 and 1.019, D2 0.962 at 1.06 um, CH4 0.991 \
and 0.996 of the printed values) only with N_tot the density of 30 atm at 273.15 K (30 \
amagat); at 293-300 K the calculation falls 5-13 % below. The temperature is not stated: \
the state 30 atm, 273.15 K is this inference, not a printed statement. D2 at 0.53 um is \
off by a factor 10.5 with the printed cross section: see the erratum.

ERRATUM (D2, 0.53 um cross section): printed 8.0 x 10^-36, read 8.0 x 10^-35. Both D2 \
values are scaled from one Devir value by Eq. (2); the ratio of Eq. (2) between the two \
pumps is (15795/6404)^4 x [(1/71218 + 1/105795)/(1/80609 + 1/96404)]^2 = 37.0 x 1.064 = \
39.4, so 2.0e-36 at 1.06 um gives 7.9e-35 at 0.53 um; and Eq. (1) with the printed g_R = \
1.0e-11 m/W needs 8.4e-35 (at 30 amagat). The printed g_R ratio 0.53/1.06 um (2.7) \
matches H2's (2.85) and CH4's (2.6). The table image was checked: it prints 10^-36.

TABLES II AND III (pp. 334-335; notes only, no quantity): measured and calculated \
threshold energies (1 % conversion to the first Stokes) for tight focusing (Table II) \
and capillary waveguides (Table III), 30 atm, with the geometry (l/b, l, l_eff) and \
pulse length of each; measured and calculated agree to within a factor of two (p. 334). \
E.g. CH4 in a 0.78 m capillary at 0.53 um: measured 14 uJ (T_p = 67 ps), calculated 13 \
uJ. Dye-laser pumped CH4 (35 cm cell, l/b ~ 10): thresholds 120, 170 and 200 uJ at 30, 20 \
and 15 atm (p. 335). Fig. 2: D2 threshold energy against pressure (a figure only).

ISOTOPOLOGUES: natural H2 and D2 (normal hydrogen and deuterium: the J = 1 and J = 2 \
fractions 0.66 and 0.38 are room-temperature populations [21]); 12CH4."""

