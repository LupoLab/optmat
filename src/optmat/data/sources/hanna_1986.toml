row = "0.53 um pump"
column = "value"
printed = "8.0e-36"
corrected = "8.0e-35"
reason = "Both D2 values are scaled by Eq. (2) from one 694 nm value (Devir); Eq. (2) makes the 0.53 um value 39.4 times the 1.06 um one (2.0e-36 -> 7.9e-35), and Eq. (1) with the printed g_R = 1.0e-11 m/W needs 8.4e-35 m^2/sr. The exponent -36 is a misprint for -35."
evidence = "Table I image checked: '8.0x10-36*'. Ratio of Eq. (2) between the pumps: (15795/6404)^4 x [(1/71218 + 1/105795)/(1/80609 + 1/96404)]^2 = 37.0 x 1.064 = 39.4; H2's printed ratio (66) and CH4's (39) are of the same order, D2's printed 4.0 is not; the printed g_R ratio 0.53/1.06 um of D2 (2.7) matches H2 (2.85) and CH4 (2.6). Recomputed 2026-09-26."
