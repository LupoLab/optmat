citation = "Y. Tanaka, E. C. Y. Inn and K. Watanabe, \"Absorption coefficients of gases in the vacuum ultraviolet. Part IV. Ozone\", J. Chem. Phys. 21, 1651 (1953)"
doi = "10.1063/1.1698638"
library = "Tanaka_1953_AbsorptionCoefficientsGases"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Photoelectric absorption as in Part I (watanabe_1953): hydrogen discharge, 1 m \
vacuum monochromator, the absorption cell (4.7 cm, LiF windows) between the exit slit \
and the photomultiplier, so that photodissociation of the ozone is minimised. Ozone \
from liquid ozone purified by several fractional distillations, evaporated into the \
cell; pressure by an H2SO4 U-manometer (below 1 mm Hg by expansion); four or five \
pressures 0.2-25 mm Hg per region, each run limited to five minutes (about 100 A) \
because ozone decomposes; 1050-2200 A (pp. 1651-1652)."""
notes = """Identity checked against the first page (PDF page 2, journal p. 1651): Part IV \
of the series of Watanabe, Inn, Zelikoff and Tanaka (Part I watanabe_1953, Part III \
inn_1953). Journal pages 1651-1653 = PDF pages 2-4 (page 1 is the publisher's cover). \
O3 only.

The absorption coefficients are given only in figures: Fig. 1 (1050-2200 A, log scale, \
with O2 for comparison) and Fig. 3 (1060-1350 A, the bands on the continua). No table \
of k; the only table (p. 1653) lists continuum maxima (1725, 1450, 1330, 1215, 1120 A) \
with attempted Mulliken transitions, not optical data. What the text states is \
recorded as points (all images of pp. 1651 and 1653 checked).

Quantity: k in cm^-1 with the layer 'reduced to NTP' as in Part I (0 C, 1 atm; see \
watanabe_1953); scale = 1e18 / n0, n0 = 2.6867801e19 cm^-3, to the cross section in \
Mb. Wavelengths in A, vacuum. Temperature: room temperature (not stated further).

Purity and corrections (pp. 1651-1652): the sample was 90-95 % O3 by KI titration, \
nitrogen oxides under 0.05 % by mass spectrometry; the absorption itself showed 1-2 % \
CO2 (its 1088, 1119, 1129 A peaks), about 7 % O2 (the 1243 A O2 peak) and a few per \
cent CO (fourth-positive heads); the curve 'was obtained after corrections for O2, CO, \
and CO2' (image: the OCR reads 'O2, CO2 and CO2') using only the highest-pressure runs. \
'In view of all these uncertainties, it is estimated that the combined experimental \
error would be as high as 10 percent' (p. 1652; a bound). Vassy's (to 2020 A) and Ny \
and Choong's (to 2135 A) values are higher, by about 10 % at 2200 A and 40 % at 2020 A \
(Vassy); 'too small a correction' here 'may be responsible for about 10 percent' \
(pp. 1652-1653).

Ogawa and Cook (ogawa_1958) scale their whole table to 614 cm^-1 at Lyman alpha 'as \
estimated from Tanaka's graph': this paper's text gives no Lyman alpha value. Also \
stated, not optical data of O3: CO2's peaks k = 3600, 4400 and 2600 cm^-1 at 1088, \
1119 and 1129 A, O2's 960 cm^-1 at 1243 A, water vapour's 387 cm^-1 at Lyman alpha \
(reproduced from the series, not extracted)."""

[[datasets]]
id = "text"
material = "O3"
points = [
    ["minimum_2015", "2015", "8"],
    ["maximum_1725", "1725", "23"],
    ["1700", "1700", "20"],
    ["1600", "1600", "35"],
    ["maximum_1330", "1330", "420"],
]
table = "text"
quantity = "absorption_cross_section"
unit = "Mb"
scale = 0.037219272080
abscissa_unit = "angstrom"
wavelength_medium = "vacuum"
use = "check"
notes = "Abstract (p. 1651): 'a minimum (8 cm^-1) at about 2015A ... a weak maximum (23 cm^-1) at about 1725A and then rapidly to a strong maximum (420 cm^-1) at about 1330A. In the region 1050-1450A, the absorption intensity does not fall below the value 130 cm^-1' (the 130 floor is not a point, not extracted); p. 1653: 'Our absorption coefficient at 1600A is 35 cm^-1'; 'The absorption curves [of O3 and O2] cross at about 1700A (k = 20 cm^-1)'. k at NTP, scale = 1e18 / n0 to Mb. The extrema and the crossing are approximate readings of the authors' own curve ('about'), hence 'check'. 'Combined experimental error ... as high as 10 percent' (a bound)."
[datasets.uncertainty]
relative = 0.1
level = "bound"
