citation = "Z.-F. Zhao, Z.-L. Nie, J. Wang, and S.-M. Hu, \"Electric polarizabilities of CH4, CO, and O2 determined by an optical refractometer\", Metrologia 63, 025007 (2026)"
doi = "10.1088/1681-7575/ae4c90"
library = "Zhao_2026_ElectricPolarizabilitiesCH"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Fabry-Perot gas refractometer (USTC): 10 cm ULE cavity (mirror \
reflectivity ~99.9 %, FSR 1.5 GHz, mode linewidth ~0.4 MHz) in a vacuum chamber in a \
temperature-stabilised jacket at about 297.53 K (NIM-calibrated platinum resistance \
thermometer, 5 mK); a 1566 nm fibre laser (<10 kHz) Pound-Drever-Hall locked to a \
cavity mode, the absolute mode frequency counted against an ultra-stable reference \
laser (drift < 0.1 Hz/s). n - 1 = Delta nu/nu_f + Delta p (1/(3K) + d) (Eq. 1), the \
bulk modulus K = 3.0822e10 Pa and the mirror-deformation coefficient d = -2.0293e-13 \
Pa^-1 calibrated by measuring nitrogen's refractive index with A_eps(N2) = 4.38705(16) \
cm^3/mol (Nie et al. 2025, Ref. 12). Pressure from an Inficon CDGSci 1000 Torr \
capacitance gauge calibrated against a Fluke PG7601 piston gauge (11 ppm) and the \
optical pressure gauge, u = sqrt((20e-6 p)^2 + (1.5 Pa)^2) below 100 kPa. Gases CH4 \
and CO 99.999 %, O2 99.9995 %. Pressure points 2-100 kPa, several repeated runs; the \
molar polarization at each point from Eq. (2) with the B_T, B_eps and A_mu of Table 1; \
the weighted mean of the points (pp. 3-6)."""
notes = """Page numbers are the library pdf pages (pdf page 1 is the publisher's cover, \
paper page 1 is pdf page 2). CO (curated since 2026-09-25) is treated like CH4 below.

WHAT IS MEASURED AND WHAT IS PRINTED. The refractometer measures n - 1 at 1566 nm \
(vacuum wavelength: 'omega = 45.563 978 23/lambda, where lambda is the vacuum \
wavelength', p. 4). Eq. (2) (p. 4), p/RT = 2(n - 1)/(3(A_eps + A_mu)) + (n - 1)^2 [...] \
+ O(n - 1)^3, reduces it to the refractive molar polarization A_eps'(omega) + A_mu; \
the authors subtract A_mu (Table 1: CH4 -17.4(8)e-6, O2 3449(34)e-6 cm^3/mol, Refs. \
37-39) and convert the dynamic A_eps'(omega) to the static A_eps with Eq. (3), A_eps' = \
A_eps + (4 pi/3) N_A a0^3 (1 + m_e/m_w)^3 [S(-4) omega^2 + S(-6) omega^4 + S(-8) \
omega^6], using the dipole sums of Table 1 (CH4 from Olney et al. 1997, Ref. 29; O2 \
from Kumar and Thakkar 2011, Ref. 31, identical to kumar_2011's Table I 'This work' \
values; CO from Kumar and Meath 1994, Ref. 30). Only the static A_eps is printed \
(Table 3, abstract): the measured 1566 nm \
values are not. The datasets A_R_1566_* are therefore RECONSTRUCTED by \
tools/extract/zhao_2026.py, which inverts the authors' conversion exactly (A_R(1566) = \
A_eps + dispersion sum + A_mu; see the script for the constants, the omitted (1 + \
m_e/m_w)^3 factor, < 0.5 ppm, and the +-2 ppm from the nominal '1566 nm'). The \
dispersion sum is 0.019768 cm^3/mol for CH4 (0.31 %), 0.011080 for O2 (0.28 %) and \
0.015351 for CO (0.31 %).

WHAT THE STATIC VALUES INCLUDE. The conversion subtracts only the electronic \
dispersion (the S(k) are electronic dipole sums); it makes no vibrational \
correction. So the printed 'static' A_eps is the electronic static polarizability \
(vibrationally averaged, at 297.5 K) PLUS the vibrational (infrared) response at \
1566 nm, which is negative above the fundamentals: for CH4 about -0.029 au \
(-0.011 cm^3/mol, -0.17 %) from the HITRAN bands (optmat.gas.infrared); none for O2 (no \
dipole-allowed vibration). It does NOT include the static vibrational polarizability \
that a dielectric (DP) measurement sees (CH4: 0.240 au = 0.090 cm^3/mol by HITRAN). \
The authors say 'the RI method essentially measures the electronic part of the \
molecular polarizability' (p. 6) and correct the CO literature for Bishop and \
Cheung's vibrational contribution and for CO's orientation term, but compare CH4 with \
Hohm's DP value directly ('we consider the dynamic contribution from omega to be \
approximately zero', p. 5) without a vibrational correction. For O2 the DP value \
(May et al. 2008) is directly comparable (no infrared-active vibration; the DP \
measures epsilon, without A_mu). Temperature: CH4's A_eps depends on it by 'approximately \
5-10 ppm per K' (p. 6, citing Hohm).

UNCERTAINTY (Table 2, p. 5; relative, ppm, k = 1): T 16, P 25 (at 1 bar), S(i) 9 (CH4) / \
28 (O2), B (B_T and B_eps) 28 / 11, A_mu 0.6 / 8, statistical 14 / 17, gas purity 10 \
/ 5, outgassing 0.1 / 0.2, cavity thermal expansion < 0.1, optical frequency < 0.1; \
total 45 (CH4), 46 (O2) (CO 49). The table's CH4 total reproduces the root sum of \
squares (45.2); O2's is 46.5. The reconstructed A_R(1566) keeps all but the S(i) and \
A_mu lines: 44.3 ppm (CH4), 36.3 ppm (O2), 37.8 ppm (CO; CO's total, 48.9, is the \
root sum of squares of its column). Resonance check: 'both CO and CH4 have resonant \
absorption in the near-infrared region'; a 30 GHz laser offset changed CO's result by \
9e-5 cm^3/mol, 'less than 20 ppm' (p. 5).

CARBON MONOXIDE (section 3.2, pp. 6-7). As for CH4, the printed static 4.88146(24) \
cm^3/mol (49 ppm) is the 1566 nm value less the electronic dispersion of Kumar and \
Meath's sums (Table 1, reproduced here) and A_mu (-15.65e-6 cm^3/mol): it contains the \
electronic polarizability and the (negative) infrared response of CO at 1566 nm, not \
the static vibrational polarizability. The authors compare with literature values \
reduced to the electronic part: they subtract Bishop and Cheung's vibrational \
contribution, 20(1) x 10^-43 C^2 m^2 J^-1 (0.1213 au, 0.0453 cm^3/mol; Ref. 44 = \
bishop_1982) and, for the dielectric value of Tsankova et al. (2018, Ref. 10), the \
orientation term of mu_e = 0.107(1) D, interpolating their 255, 273, 293 and 313 K data \
to 297 K. The text does not say which literature values received the vibrational \
subtraction (the DP value certainly; the RI value should not need it). The RI \
(Hohm 2013) and DOSD (Kumar and Meath 1994) values print uncertainties of 0.26 and \
0.53 cm^3/mol (5 % and 11 %), implausibly large for those methods: possibly the \
digits 4.8826 and 4.8953 misread as value(uncertainty). Hohm 2013 (now \
curated, hohm_2013) prints CO 13.04 +- 0.07 au (RI mean) and 13.08 +- 0.15 au (DOSD, \
his Ref. 97, Jhanwar and Meath 1982), 4.874(26) and 4.889(56) cm^3/mol: both uncertainties here look one \
decade too large; taken as printed. In au the three are 13.055, 13.077 \
(DP) and 13.082 (DOSD), against this work's 13.059. Kumar and Meath 1994 is curated \
since (kumar_1994): its S(-2) = 13.08 gives 4.889 cm^3/mol, so the '4.8953' reading of \
4.89(53) is not supported; the sums of Table 1 equal its Table 1 (kumar_meath_1994_ \
moments_CO).

INCONSISTENCIES IN THE PAPER (not errata of extracted values): Table 3's caption \
and the text of p. 5 say 'CO2' for CO; sections 3.2 (CO) and 3.3 (O2) give the \
uncertainties as 46 and 49 ppm and cite figures 2(f) and 2(e), both swapped against \
Table 2, the abstract and the figure caption (CO 49 ppm, (e); O2 46 ppm, (f)); O2's \
printed 3.95819(20) is 50.5 ppm, not the 46 ppm of Table 2 (it would be (18)); Eq. \
(2)'s second-order bracket as printed, (A_eps^2 + 4B_eps + 6A_eps + A_mu), looks \
garbled (not used here).

Not extracted: Table 1's A_mu, B_T (a density virial: no quantity) and B_eps (CH4 \
7.29(32), O2 -0.305(28) cm^6/mol^2; 'B_eps values are from [34-36]', which reference \
for which gas and at what temperature is not said; CO 7.97(40), B_T -8.5(2) \
cm^3/mol); the per-pressure points (figure 2 only)."""

