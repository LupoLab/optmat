citation = "G. J. Rosasco and W. S. Hurst, Phys. Rev. A 32, 281 (1985)"
doi = "10.1103/physreva.32.281"
library = "Rosasco_1985_MeasurementResonantNonresonant"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """cw three-beam phase-modulated coherent Raman spectroscopy (a Raman-induced \
Kerr effect): a Kr-ion pump at 676.4 nm split into two orthogonally polarized, \
phase-modulated waves (6.45 MHz) and a tunable ring-dye probe, in a 45-pass cell; \
heterodyne detection. The nonresonant susceptibility of Ar and N2 is measured against \
the Q(3), Q(4) Raman resonances of a D2 internal standard (probe at 17756 cm^-1), whose \
amplitude is calibrated by cw stimulated Raman spectroscopy against the N2 Q branch \
(absolute Raman cross section of Schrotter and Klockner, curated as schrotter_1979); \
the pressure dependence of \
the baselines separates the gas from the multipass-mirror contribution. Densities in \
amagat from the ideal-gas law."""
notes = """Nonresonant optical (ac) Kerr constants of Ar (electronic) and N2 (electronic \
plus molecular reorientation) at 1 amagat and 296 K, and a comparison of electronic \
hyperpolarizabilities from CARS (TWM), FISHG (ESHG), dc Kerr and THG for Ar, N2, He, D2, \
H2, O2, CH4 and SF6, all rescaled to one convention (Table IV).

Defining equations, exactly (the conversions depend on them):
- Eq. (1), p. 282, and Appendix A (A1), p. 295: P_0,i(3) = D chi_ijkl(-w0, wa, wb, wc) \
E_a,j E_b,k E_c,l with D = 6, 3, 1 for nondegenerate, doubly and triply degenerate \
frequencies, and fields F(w) = 1/2 [F0 delta(w - w0) + F0* delta(w + w0)] (the E/2 \
amplitude convention).
- Eq. (2), p. 282 (Hellwarth, Born-Oppenheimer): 24 chi_ijkl(-w, w1, w2, w3) = [sigma + \
2A(w2 + w3) + B(w1 + w2) + B(w1 + w3)] delta_ij delta_kl + (two permutations); sigma is \
'the real electronic hyperpolarizability' (including two-photon contributions), A and B \
the Fourier transforms of the nuclear (vibrational; rotational/orientational) response.
- The measured nonresonant background is the ac Kerr constant [2 sigma + 2 B(0)]/24 \
(Eq. (3), Table I 'chi^N'); for Ar B = 0. For CARS, Eq. (A2): chi_1111(-w_as, w_L, w_L, \
-w_s) = 3 sigma/24 + 4A/24 + 4B/24, and (A3) P_as = 3 chi_1111 E_L^2 E_s*.
- (A19): sigma = N gamma/3 with gamma the second electronic hyperpolarizability of \
Buckingham and Pople's Kerr formula (A16) and of Shelton and Buckingham's FISHG (A21: \
P_2w = (1/6) K N gamma E_w^2 E_0, K = 3/2), i.e. gamma = gamma_T (Taylor): (A23) (1/6)(3/2) \
N gamma = 3 (2 x 3 sigma/24). Hence 3 sigma/24 = N gamma_T/24 and 2 sigma/24 = N \
gamma_T/36.
- (A4)-(A7): the CARS literature's chi^CARS, with P(w_as) = (1/4) chi^CARS E_L^2 E_s* \
(Druet and Taran), is 12 chi_1111, so chi_nr^CARS = 3 sigma/2 (per volume).
- (A24)-(A28): Lundeen et al.'s per-molecule chi^LHN (P = N K chi E_L^2 E_s*, K = 3/4): 3 \
N chi^LHN = chi^CARS = 12 chi_1111, (1/4) N chi_nr^LHN = 3 sigma/24, and 6 chi_nr^LHN = \
gamma.
- 'At 1 amagat': N0 = 2.687 x 10^19 molecules/cm^3 (Eq. (C4)); the values are \
per-amagat susceptibilities (the 296 K only labels the measurement temperature, which \
matters for N2's orientational B(0), Eq. (16)).

Results (Secs. IV-V, pp. 290-293):
- Ratios to the D2 Q-branch amplitude A_0 N_0: Ar (in the 0.0253 D2 mixture) (0.98-1.31) \
x 10^-2 (Eq. (28)), best 1.15 x 10^-2 +- 6 % (Eq. (31)); N2 (4.30-4.71) x 10^-2 (Eq. \
(30)), best 4.48 x 10^-2 +- 3 % (Eq. (32)); the +- are 1 sigma statistical for the \
mid-range mirror phase slope m_theta = -0.14 rad/atm; the ranges come from m_theta = -0.14 \
+- 0.06.
- D2 calibration: A_R0(D2)/A_R0(N2) = 2.75 (+-10 %, 1 sigma, nine spectra, Eq. (34)); \
[a(N2)]^2 = 3.085e-51 cm^6 (Eq. (42), from Schrotter and Klockner's 5.05e-48 cm^6/sr), \
[a(D2)]^2 = 8.26e-51 cm^6 (Eq. (43)), A_0 = 1.717e-36 esu (Eq. (47)); D2 Q-branch cross \
section 1.33e-47 cm^6/sr against 1.31e-47 from H2 (Eqs. (44), (45)).
- Eq. (48): chi_0^N(X) = 0.531e-18 esu (the Ar:D2 mixture); Eq. (49): chi_0^N(N2) = 2.07e-18 \
esu; with chi_0^N(D2) = 0.717e-18 (Eq. (55), from Eqs. (51), (54)) Eq. (56): (2 sigma/24)_Ar \
= 0.526e-18 esu. Table III (p. 293) lists Ar 0.526 and N2 2.09 (Eq. (49) 'with ~1 % \
correction for contribution of far off-resonance Raman modes').
- Comparison (Eqs. (50)-(54), from Appendix C and Bridge and Buckingham's anisotropies \
gamma_0 = 0.696e-24 cm^3 for N2 and 0.299e-24 cm^3 for D2, Proc. R. Soc. London A 295, \
334 (1966), not in the library; no wavelength stated, so not recorded as datasets): \
Rado reevaluated (2 sigma/24) Ar 0.517, D2 0.434, N2 0.451; reorientation [2B(0)/24] N2 \
1.752, D2 0.283 (Eq. (16) at 1 amagat, 296 K). Predicted N2 ac Kerr constant 2.20, 2.18 \
after the 1 % Raman correction (Eq. (57)); the measured 2.07 is '~5 % low'.
- Appendix C (p. 298): Rado's reference chi^R of the H2 Q(1) line recomputed as 9.694e-14 \
esu (Eq. (C6)), 46 % below Rado's 2.1e-13; Rado's values rescaled: (3 sigma/24) Ar \
0.776, D2 0.651, N2 0.676 (Eqs. (C7)-(C9)); Lundeen et al.'s |chi^LHN| = 0.899e-33 gives \
9.47e-14 (Eq. (C11)), within 2 %.

Uncertainties (p. 295): the mirror background dominates; 'we have reduced the systematic \
errors associated with the mirror background to less than 5 %'; for N2 'a 5 % \
uncertainty in the nonresonant ac Kerr constant leads to a 25 % uncertainty in the \
electronic contribution'. Table IV values 'typically ... are uncertain by at least 10 %' \
(p. 293; note a: 10 % except the normalization references in parentheses).

Part: Ar electronic (2 sigma/24). N2's ac Kerr constant is electronic plus the full \
(adiabatic, cw) orientational term B(0), with the far-off-resonance vibrational Raman \
contribution removed (Table III): recorded total. Table IV's entries are all 'electronic \
hyperpolarizabilities' (3 sigma/24) as the paper derived them from each technique.

Wavelengths: the paper's own measurement uses the 676.4 nm pump and the 17756 cm^-1 \
(563.2 nm vacuum) probe; 676.4 nm is the Kr-ion line in standard air (the paper also \
gives the pump as 14779 cm^-1, p. 291, i.e. 676.64 nm in vacuum), recorded as \
standard_air. Table IV prints no wavelengths; the dataset wavelengths are those of \
the original experiments where another curated record states them (Rado and \
Hauchecorne et al. 694 nm pump, lundeen_1983; Lundeen 532 nm; Shelton and Buckingham \
514.5 nm, shelton_1982; Buckingham and Dunmur 632.8 nm, buckingham_1968; THG 694.3 nm, \
ward_1969) and otherwise the ruby line of the column's reference, marked in the notes.

Not curated: none (all Table IV gases are curated). Table II (molecular constants) is \
not third-order data."""


[[datasets]]
id = "ac_kerr_Ar"
material = "Ar"
table = "tbl_4d9e8f070c47"
points = [["2sigma/24", "676.4", "0.526"]]
quantity = "nonlinear_susceptibility"
unit = "esu (per amagat)"
scale = 1e-18
abscissa_unit = "nm"
wavelength_medium = "standard_air"
use = "primary"
notes = "Table III (p. 293) and Eq. (56) (p. 293): the optical (ac) Kerr constant of Ar, (2 sigma/24)_Ar,1 amagat,296 K = 0.526 x 10^-18 esu ('involves ~1 % correction for chi_0^N(D2) calculated from literature values'): the nonresonant chi(-w, w, W, -W) measured with the 676.4 nm pump and the 17756 cm^-1 (563.2 nm) probe, per amagat (N0 = 2.687e19 cm^-3; no state), Hellwarth's convention (2 sigma/24 = N gamma_T/36). Uncertainty: the ratio (Eq. (31)) is +-6 % (1 sigma, statistical), within a range -15 %/+14 % from the mirror model (Eq. (28)); mirror systematics 'less than 5 %' (p. 295). Electronic (B = 0 for an atom). Not converted: Table IV's 'this work' 0.788 is 3 sigma/24 = 1.5 x this."
[datasets.uncertainty]
relative = 0.06
level = "1 sigma"
[datasets.parameters]
process = "kerr"
convention = "rosasco_1985_hellwarth"
part = "electronic"
probe_nm = 563.2

[[datasets]]
id = "ac_kerr_N2"
material = "N2"
table = "tbl_4d9e8f070c47"
points = [["2sigma/24+2B(0)/24", "676.4", "2.09"]]
quantity = "nonlinear_susceptibility"
unit = "esu (per amagat)"
scale = 1e-18
abscissa_unit = "nm"
wavelength_medium = "standard_air"
use = "primary"
notes = "Table III (p. 293): the optical (ac) Kerr constant of N2, (2 sigma/24 + 2 B(0)/24) at 1 amagat and 296 K = 2.09 x 10^-18 esu, Eq. (49)'s 2.07 'with ~1 % correction for contribution of far off-resonance Raman models of N2'. The nonresonant chi(-w, w, W, -W) (676.4 nm pump, 563.2 nm probe), per amagat, Hellwarth's convention. The first measurement of the nonresonant optical Kerr effect in a gas (p. 281). Uncertainty: +-3 % (1 sigma statistical, Eq. (32)), range -4 %/+5 % (Eq. (30)); '~5 % low' against the predicted 2.18. Part: electronic 2 sigma/24 (0.451, from Rado reevaluated) plus the cw orientational term 2B(0)/24 (1.752 computed at 296 K), vibrational Raman removed: total (the orientational part depends on temperature as 1/T, Eq. (16))."
[datasets.uncertainty]
relative = 0.03
level = "1 sigma"
[datasets.parameters]
process = "kerr"
convention = "rosasco_1985_hellwarth"
part = "total"
probe_nm = 563.2
temperature_k = 296

