citation = "S.-F. Zhao, C. Jin, A.-T. Le, T. F. Jiang and C. D. Lin, \"Determination of structure parameters in strong-field tunneling ionization theory of molecules\", Phys. Rev. A 81, 033423 (2010)"
doi = "10.1103/PhysRevA.81.033423"
library = "Zhao_2010_DeterminationStructureParameters"
identity = "VALIDATED"
kind = "theory"
technique = """Single-active-electron model potentials for linear molecules from density \
functional theory, exchange-only LDA plus the van Leeuwen-Baerends (LB) gradient \
correction (alpha = 1.0, beta = 0.05, Eqs. (1)-(12)), built from GAMESS or GAUSSIAN \
Hartree-Fock orbitals and iterated once so that the potential has the right -1/r tail \
(p. 3, Fig. 1); the one-electron Schrodinger equation solved in a one-centre expansion \
(l_max = 40) with B-splines (Eqs. (13)-(18)); the asymptotic radial functions fitted \
to Eq. (20) for the MO-ADK coefficients C_lm."""
notes = """Journal pages 033423-1 to -11 = PDF pages 1-11. Authors checked on the first \
page. solprop's default MO-ADK parameters (moadk_zhao2010, for 'D2/H2', N2 and O2) are \
this paper's Table III.

THE ERRATUM. Phys. Rev. A 82, 049903(E) (2010) (zhao_2010_erratum, one page, image \
checked) corrects two things only: 'In Table V, the C_2m of the HOMO-1 (1 pi) of CO \
molecule should be 0.014' (printed 0.14; applied here as an erratum of \
table5_homo1_CO), and 'In Table VI, the binding energies of 2p pi_g and 2p pi_u of H2+ \
should be 0.2267 and 0.4288, respectively' (printed the other way round; Table VI is \
in these notes only, corrected below). Nothing else changes: Tables I-IV, Table III's \
C_lm of every molecule (so solprop's H2, D2, N2 and O2 rows), and Table V's other \
rows stand as printed. solprop's statement that the erratum 'leaves these neutral \
rows unchanged' is confirmed.

EXTRACTED. Table I (p. 4): rare-gas ionisation energies (au), this work's LDA + LB \
orbital energies, Banerjee and Harbola's (ref. 26) for He, Ne, Ar, and the \
experimental values (Emsley, ref. 27). Table II (p. 4): R (angstrom), the LDA + LB \
HOMO energy and the 'experimental vertical ionization potentials' (eV) of H2+, the \
hydrogen molecule (printed 'D_2/H_2'), N2, O2, CO and CO2. Table III (p. 4): the newly \
fitted C_lm and the earlier values the table reprints ([9] = tong_2002, [30] = \
awasthi_2008, [17] = Le et al. 2007), one dataset per molecule and row. Table IV (p. \
6): HOMO, HOMO-1 and HOMO-2 binding energies (N2, O2, CO2; HOMO and HOMO-1 for CO): \
LDA + LB, LB-alpha (refs. 29 and 6) and experimental vertical (refs. 43-45). Table V \
(p. 6): C_l of HOMO-1 and HOMO-2 of N2, O2, CO2 and of HOMO-1 of CO (the HOMO rows \
repeat Table III, checked by the script). Not curated, not taken: F2, S2, NO, SO, C2H2, \
HF, HCl, HCN. Every C_l file carries Table II's R as the column internuclear_distance.

THE COEFFICIENTS (p. 3). Eq. (19): psi_n^(m)(r) = sum_l F_lm(r) Y_lm(theta, phi); \
'In the MO-ADK theory, the radial functions in the asymptotic region are fitted to \
the following form', Eq. (20): F_lm(r) = C_lm r^((Z_c/kappa) - 1) e^(-kappa r), 'where \
Z_c is the asymptotic charge and kappa = sqrt(2 I_p), I_p is the ionization energy' \
(Tong et al. 2002's convention). m: 'For sigma orbital, m = 0 and pi orbital, m = 1' \
(Table V caption). The fitting range of r is not stated anywhere in the paper, nor an \
accuracy of the coefficients. Which I_p enters kappa in the fit is not stated either; \
for the rates the paper says 'we \
always use experimental binding energy' (p. 4) and 'one should always use the \
experimental vertical ionization energy since the tunneling ionization rate depends \
exponentially on the ionization potential' (p. 4).

THE RATES. The alignment-dependent rates are Tong et al.'s analytic formula \
(tong_2002, its Eqs. (7)-(10)) with these C_lm, per orbital; 'probabilities in Fig. 2 \
from MO-ADK include ionization from the HOMO only' (p. 5), while TDDFT shows inner \
orbitals contributing. For a heteronuclear molecule the static rate differs for the \
two orientations AB and BA along the field, and 'MO-ADK-S' averages theta and pi - \
theta (p. 7). CO: the on-axis ratio (2.32 + 1.62)/(2.32 - 1.62) = 5.6 gives a rate \
ratio of 32 (p. 6). H2 parallel:perpendicular rate ratio 1.45 with the new \
coefficients, 1.15 with the old (p. 9).

THE IONISATION ENERGIES. Table I's experimental and Table II's I_p columns are the \
values used for the rates. Table II's I_p agree digit for digit (and with R) with \
tong_2002's Table I for all ten molecules the two share, and are reproduced from it \
(the identity is this record's inference: Table II cites no source). The caption calls \
them 'experimental vertical', but tong_2002's text says its Table I values for D2 and \
O2 are about 0.88 and 0.33 eV below the vertical energies it used; kind is \
recorded as the caption says. Table IV's experimental O2 HOMO energy (12.3 eV, Baltzer \
et al.) differs from Table II's 12.03. CO2's 13.78 eV (Table II) and 13.8 (Table IV) \
are not in tong_2002.

THE HYDROGEN ROW is printed 'D_2/H_2' in Tables II and III and is used for H2 in the \
figures (Fig. 2(e), Fig. 6(c), Staudte et al.'s H2 data). Recorded as H2; the fixed- \
nuclei orbital at a given R does not depend on the nuclear masses, and solprop uses \
the row for H2 and D2 alike (TC-439). The reprinted Tong row [9] was printed 'D_2' by \
Tong.

TABLE VI (p. 10, notes only): H2+ at R = 2.0-4.0 a.u.: binding energies (au) \
'Present' and 'Exact' and C_l of the 1s sigma_g, 1s sigma_u, 2p pi_g and 2p pi_u \
states. The 1s sigma_g ground state at R = 2.0 (equilibrium): 1.1025 and 1.1026 \
hartree, C_0m, C_2m, C_4m = 4.52, 0.62, 0.03, identical to Table III's H2+ row \
(checked by the script), which is the dataset. The other rows are excited states or \
stretched geometries: 1s sigma_g at R = 2.5, 3.0, 3.5, 4.0: 0.9937/0.9938, \
0.9107/0.9109, 0.8463/0.8466, 0.7958/0.7961 hartree; C_0m 4.25, 4.10, 4.00, 3.96; C_2m \
0.81, 1.04, 1.31, 1.60; C_4m 0.05, 0.08, 0.12, 0.19. 1s sigma_u at R = 2.0: \
0.6674/0.6675, C_1m 1.89, C_3m 0.08, C_5m 0.00; 2p pi_g at 2.0: 0.4288/0.4288, C_2m \
0.11, C_4m 0.002; 2p pi_u at 2.0: 0.2267/0.2267, C_1m 0.90, C_3m 0.02 (the library \
merges two coefficients per cell; read on the image). The 2p pi_g and 2p pi_u binding \
energies above are as printed; the erratum (zhao_2010_erratum) swaps them: 2p pi_g \
0.2267, 2p pi_u 0.4288 (the bonding pi_u state is the more deeply bound). The table \
image also prints 1s sigma_u at R = 2.5, 3.0, 3.5, 4.0 (0.6920/0.6921, 0.7012/0.7014, \
0.7009/0.7012, 0.6952/0.6956; C_1m 2.18, 2.48, 2.79, 3.13; C_3m 0.15, 0.25, 0.37, \
0.53; C_5m 0.00, 0.01, 0.02, 0.04), untouched by the erratum.

FIGURES (not digitised): Fig. 1 effective charges of Ne and CO2; Fig. 2 normalised \
alignment dependence for N2, O2 (1e14 W/cm^2), F2, H2+ (5e14), H2 (2.3e14), C2H2 \
against TDDFT and TDSE; Fig. 3 HOMO, HOMO-1, HOMO-2 rates against angle for N2 (1.5e14), \
O2 (1.3e14), CO2 (1.1e14), C2H2; Fig. 4 CO (4e14) and HCl; Fig. 5 CO2 against Spanner \
and Patchkovskii and Smirnova et al.; Fig. 6 against the measurements of Pavicic et al. \
(N2, O2; linear), Staudte et al. (H2) and Akagi et al. (HCl; circular); Figs. 7-8 \
H2+."""

