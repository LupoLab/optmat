[[formulas]]
id = "zhang_N2"
form = "dn_sigma2"
terms = { scale = "1e-8", A = "8736.28", B = ["2398095.2"], C = ["128.7"] }
range_nm = [740.0, 860.0]
material = "N2"
equation = "Eq. (18), p. 5; Table 1"
printed = "(n_N2 - 1)_s x 10^8 = 8736.28 + 2,398,095.2/(128.7 - 1/lambda^2)"
variable = "lambda: wavelength in micrometers (vacuum)"
state = "1atm_20C"
density = "real"
range = "740-860 nm"
coefficients = { A0 = "8736.28", A1 = "2398095.2", B1 = "128.7" }
check = "Gives 2759.850e-7 at 800 nm and 2773.798e-7 at 632.99 nm, Table 2's values to the printed digits. Checked 2026-09-24."
notes = "B1 fixed at 128.7, 'to be consistent with our air measurement results' (p. 5)."

[[formulas]]
id = "zhang_O2"
form = "dn_sigma2"
terms = { scale = "1e-8", A = "15532.45", B = ["456402.97"], C = ["50.0"] }
range_nm = [740.0, 860.0]
material = "O2"
equation = "Eq. (22), p. 5; Table 1"
printed = "(n_O2 - 1)_s x 10^8 = 15,532.45 + 456,402.97/(50.0 - 1/lambda^2)"
variable = "lambda: wavelength in micrometers (vacuum)"
state = "1atm_20C"
density = "real"
range = "740-860 nm (extended to 630 nm for the comparison with Birch, p. 5)"
coefficients = { A0 = "15532.45", A1 = "456402.97", B1 = "50.0" }
check = "Gives 2495.496e-7 at 800 nm and 2514.008e-7 at 632.99 nm, Table 2's values. At 633 nm it gives 1.000251401, the value Kren 2011 quotes. Checked 2026-09-24."
notes = "B1 fixed at 50.0, 'corresponding to the third term in the air dispersion formula'. Kren 2011 shows its dispersion between 633 and 800 nm (1851 ppb) disagrees with the air formula and Lorentz-Lorenz summation (1683 ppb) and attributes it to fitting across the O2 A band (near 760 nm)."

