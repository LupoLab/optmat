state = "1atm_20C"
density = "real"
range = "740-860 nm"
coefficients = { A0 = "12236.13", A1 = "1232158.1", B1 = "90.7" }
check = "Gives 2605.925e-7 at 800 nm and 2620.551e-7 at 632.99 nm, Table 2's values. Checked 2026-09-24."
notes = "Table 1 prints the numerator as '12,32158.1' (a misplaced thousands separator; image tbl_0bfec498fd89.jpg); Eq. (26) prints 1,232,158.1, which is the value that reproduces Table 2. B1 fixed at 90.7, 'corresponding to a strong absorption of Ar at 105 nm'."

