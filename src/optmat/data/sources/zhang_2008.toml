citation = "J. Zhang, Z. H. Lu and L. J. Wang, Appl. Opt. 47, 3143 (2008)"
library = "Zhang_2008_PrecisionRefractiveIndex"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Mach-Zehnder interferometer with a Ti:sapphire frequency comb (800 nm, 50 nm \
bandwidth) and a 30 m multipass cell in a temperature-stabilized box (0.6 mK rms); \
spectral phase from frequency-domain interferograms (optical spectrum analyzer) with \
the cell filled and evacuated, cell length calibrated with standard dry air; pressure \
by a PTB-calibrated gauge (2 Pa); 50 measurements per gas near 1e5 Pa."""
notes = """The library record is unverified; the citation is from the article's own \
footer ('Appl. Opt. 47, 3143', OSA code 0003-6935/08/173143-09, published 2 June \
2008) and Kren 2011's reference 1 ('Appl. Opt. 47, 3143-3151 (2008)'); no DOI is given \
here. Values are reduced to 'standard conditions (20 degrees C, 101 325 Pa) with the \
help of gas density factors ... calculated through the gas compressibility factor' \
(NIST database; for O2 the older NBS tables), Eqs. (15)-(29): a real-gas reduction. \
Sensitivity 5.6e-9, uncertainty limit 7.7e-9 including temperature and pressure (p. 8). \
Dispersion formulas valid 740-860 nm; lambda in micrometers, taken as vacuum \
wavelengths (the comb is referenced in frequency; the Edlen-type form uses the vacuum \
wavenumber). Standard dry air (Table 1, Eqs. (10)-(14), (31)) is skipped: air is not a \
species of the package. The library reports no warnings for this record.

Table 1 also prints Old et al.'s CO2, Peck and Khanna's N2 and Peck and Fisher's Ar \
formulas 'after conversion to the standard conditions' (recorded below as reproduced \
formulas) and Bonsch and Potulski's air formula (skipped). Table 1 prints the CO2 \
formula with its two resonance terms in the opposite order to Eq. (30) (the same \
formula). Kren 2011 argues that the O2 formula is distorted by fitting across the \
oxygen A band (760 nm) and derives another (kren_2011)."""

