citation = "R. Thalman, K. J. Zarzana, M. A. Tolbert and R. Volkamer, J. Quant. Spectrosc. Radiat. Transfer 147, 171 (2014); erratum J. Quant. Spectrosc. Radiat. Transfer 189, 281 (2017)"
doi = "10.1016/j.jqsrt.2014.05.030"
library = "Thalman_2014_RayleighScatteringCross"
identity = "VALIDATED"
kind = "measurement"
technique = """Two cavity methods at Boulder (630 Torr ambient), room temperature. (1) Cavity \
ring-down spectroscopy (CRDS) of N2 at 405.8 and 532.2 nm (mirrors R = 0.99993 and \
0.99998): the loss rate 1/(tau c) against density over pressure steps of 80-100 % of \
ambient, whose slope is the absolute cross section; 'a limited number of sets of \
data' (p. 5). (2) Broadband cavity-enhanced spectroscopy (BBCES), 350-700 nm, six \
mirror sets (365, 405, 455, 532, 580, 630 nm), 87 cm cavity, LED sources, Acton 2300i \
spectrometer: the mirror reflectivity from the N2-He difference (Eq. 3) with the \
n-based N2 cross section and Washenfelder's He fit, then Ar, O2 and air against N2 \
(Eq. 4), each at a single density. O2 and air only between the O4 (O2-O2) bands."""
notes = """The PDF in the library carries the paper (pp. 171-177, PDF pages 1-7) and the \
authors' erratum (JQSRT 189, 281-282 (2017), PDF pages 8-10); both are cited here, the \
erratum's corrections applied as [[errata]] (TC-711).

Cross sections per molecule, from Eq. (1), sigma = 24 pi^3 nu^4 / N^2 ((n^2 - 1)/(n^2 \
+ 2))^2 F_k(nu), as Sneep & Ubachs. Table 2 (tbl_576e4a7df80e) prints, at 370.0, 405.8, \
532.2 and 660.0 nm ('selected wavelengths' of the continuous BBCES data), the n-based \
('Theory') and measured ('Exp') values of N2, Ar, O2 and air in 10^-27 cm^2 (the \
caption's 'cm^-3 x 10^27' is corrected to cm^2 by the erratum). Note c: 'Number in () \
is the 1-sigma error in the reported value of the last digit for BBCES and the range for \
CRDS'. Wavelengths are vacuum: Table 2's corrected Theory values are reproduced to the \
printed digits from Table 1 with nu = 1/lambda(vacuum) (with standard-air wavelengths \
they would be 0.1 % lower).

Uncertainty (pp. 4, 6-7): BBCES 'measurement uncertainty of +-1.3 % at the center of the \
mirror and +-2 % at the far extremes' (pressure 0.1 %, temperature 0.3 %, cavity length \
87 +- 0.1 cm, the N2 (+-1 %) and He (+-5 %) reference cross sections); the Ar data \
agree with n-based theory to 0.2 +- 0.4 % (the mean over all cavities, Fig. 5; the \
per-cavity biases UV -0.64 %, near-UV +0.865 %, blue +0.3 %, red, amber, green within \
0.2 %, p. 5); O2 within 1 % outside the O4 bands (370-420 nm, 660 nm), < 4 % between \
adjacent bands; air within 1 %. The BBCES values are relative to the n-based N2 cross \
section (Table 1), not independent absolute measurements (p. 3): Ar, O2 and air share \
that scale.

Table 1 (tbl_e8dbeaabf242; the erratum's reprint tbl_03101fb7ffc0) gives the \
(n - 1) x 10^8 = A + B/(C - nu^2) and F_k formulas behind the Theory columns: Sneep & \
Ubachs's (sneep_2005 n2_eq10, n2_eq11 (Bates), ar_eq9 (Peck & Fisher), o2_eq23 with \
Bates's F_k), N = 2.546899e19 cm^-3 for N2, Ar and He, 2.68678e19 cm^-3 for O2; air \
from Bodhaine et al. (1999) at 288.15 K and 1013.25 hPa with 360 ppm CO2. Not recorded \
as formulas: they are sneep_2005's. The erratum corrects them (p. 9): the second N2 \
branch's B is 307.43305 x 10^12 (printed 307.4335 x 10^13), and both N2 King factors \
are 1.034 + 3.17 x 10^-12 nu^2 (printed '... nu'); the reprint also prints the O2 King \
factor's constant 1.096 (the 2014 table: 1.09) without saying so, and adds, for nu < \
18315 cm^-1, the O2 branch A = 21351.1, B = 2.18567 x 10^13 (Bates). With these (and \
only these) the corrected Theory column reproduces: N2 23.7092, 16.1455, 5.2998, \
2.2099; Ar 20.3614, 13.8807, 4.5633, 1.9038; O2 21.2685, 14.3728, 4.6600, 1.9378 \
(computed 2026-09-29).

Air (not a registered material; not extracted): Theory 23.183, 15.765, 5.159, 2.148 and \
BBCES 23.0(3), 15.7(2), -, 2.15(3) at 370.0, 405.8, 532.2, 660.0 nm (1 sigma).

Not extracted: the continuous BBCES spectra (Figs. 3-5, figures only; Table 2 prints \
the selected values) and the He comparison (Fig. 4A, literature only)."""

