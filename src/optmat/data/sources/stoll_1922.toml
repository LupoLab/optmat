[[formulas]]
id = "o2"
material = "O2"
equation = "p. 21"
printed = "(n0 - 1) 10^7 = 2650,86 + 20,074 / lambda^2"
variable = "lambda: air wavelength in micrometres"
state = "1atm_0C"
density = "real"
range = "4388-9224 A"
coefficients = { A = "2650.86", B = "20.074" }
check = "With the Table II wavelengths it reproduces Table V's calculated column to 0.03 except at 4713 A (2741.23 against the printed 2741.28) and 7273 A (2688.81 against 2688.99; the printed difference -0.09 follows the printed value). Checked 2026-09-25."

