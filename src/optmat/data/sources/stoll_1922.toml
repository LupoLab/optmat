use = "primary"
notes = "Table V, mean of 4-6 determinations, electrolytic oxygen (absolute count at 5875.64 A: 210.77 fringes at 743.78 mm, 19.98 C). Koch's values (1909, cylinder oxygen) are about 14 units lower at 4360-6708 A, which Stoll attributes to hydrogen in electrolytic gas (p. 23)."
