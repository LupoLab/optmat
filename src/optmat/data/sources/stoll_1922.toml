citation = "E. Stoll, Ann. Phys. (Leipzig) 374 (4. Folge 69), 81 (1922)"
doi = "10.1002/andp.19223741802"
library = "Stoll_1922_DieDispersionDer"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Jamin refractometer (Hilger) with two tubes of length L = 499.96 mm, in the \
spectrally resolved method of Puccianti and Koch: an absolute fringe count at the He \
line 5875.64 A (and Ar 7067 A for the infrared) and, from photographs of the spectrally \
dispersed interference pattern (white light plus He or Ar line spectra), the fractional \
fringe shifts at every line, so that one photograph gives the whole dispersion \
(pp. 5-13). Gas filled from vacuum to about atmospheric pressure (p0 reduced to 0 C, \
717-765 mm Hg), tube temperature 18-20 C to 0.02 C. Wavelengths 4388-9224 A (He and \
Ar lines; the infrared on dicyanin plates). Zurich (text in German)."""
notes = """Reduction (p. 5): (n0 - 1) 10^7 = N lambda / (p0 L) 760 (1 + alpha t_i), N the \
number of fringes, lambda the vacuum wavelength, p0 the manometer reading reduced to \
0 C, t_i the tube temperature and alpha the gas's own expansion coefficient (air and \
O2 0.003670 after Jolly, N2 0.003675 after Jolly, CO2 0.003716 after Chappuis): the \
values are for 0 C and 760 mm Hg with the real gas's thermal expansion and a linear \
pressure scaling over at most 6 %: state 1 atm, 0 C, density real. The text defines \
(n0 - 1) 'fur Luft von 0 C und 750 mm Hg' (p. 5, page image checked), a misprint for \
760 (the formula, Table IIIa and IIIb say 760). The gas tables label the lines by \
rounded air wavelengths; the extraction gives each its Table II wavelength (air, \
International Angstrom), and the Cauchy formulas use those air wavelengths (they \
reproduce the calculated columns only so).

Accuracy (pp. 28-30): maximum error of a single absolute determination 5e-8 in \
n0 - 1; 'die erhaltenen Resultate sind richtig bis auf 4-5 Einheiten in der achten \
Dezimale'; for relative values (dispersion) at most 2.9e-8, 0.01 %; summary: about \
0.02 % absolute, 0.01 % relative. Per-point: 0.01 % as a bound; scale: the 0.02 % as \
a bound, 0.0115 % one sigma.

Gases: electrolytic oxygen, freed from ozone, 2 L reservoir (Table V); oxygen from a \
cylinder, 96 % O2 and 4 % N2 by the maker's analysis and the mixing rule (Table VI); \
nitrogen from a cylinder purified over pyrogallol and hot copper into a gasometer \
(Table VII); nitrogen straight from a cylinder, 99.5-99.9 % (99.5 % N2 and 0.5 % O2 by \
the mixing rule), 1.3 units below Table VII (Table VIII); carbon dioxide from a \
cylinder (Table IX). The cylinder O2 and N2 are excluded as impure. Air (Tables I-IV, \
IIIa, IIIb) is not a curated species and is skipped; argon appears only as a line \
source.

NITROGEN IS EXCLUDED: its dispersion is inconsistent. Between 4388 and 9224 A \
Stoll's N2 falls by 91.1 x 10^-7 (3024.89 to 2933.80), against 65.7 x 10^-7 for \
peck_1966's 0 C formula (3021.93 to 2956.23; Stoll is +0.10 % at 4388 A, -0.37 % at \
5876 A, -0.76 % at 9224 A). His own air contradicts it: the Cauchy dispersion \
coefficient of air (16.170, Table IIIb) is below those of both his N2 (22.65) and his \
O2 (20.074), impossible for a mixture mostly of the two; peck_1966's N2 has an \
effective coefficient of 16.4 over the same range. Wilkinson (wilkinson_1960) \
notes that Stoll's N2 'differs by as much as 0.7% in n-1' from all other observers. \
Scheel's (1907) N2 formula, which Stoll finds parallel to his, has the same large \
dispersion (22.47). O2 and CO2 agree with the Cuthbertsons' formulas in dispersion \
to about 3 % and 1 %.

Misprints in the single determinations (not extracted; the means are consistent): \
Table V 7383 A, columns 1-5 printed 2686.xx where the mean 2687.72 and the formula \
need 2687.xx; Table VII 7030 A column 3 '3953,12' and 8265 A column 1 '9240,42' \
(2953.12, 2940.42). Table IX's printed differences at 7635 A (+0.25) and 9224 A \
(-0.23) do not match mean - calc (+0.27, -0.29); the means match their single values. \
The library misread two cells (see the extraction script).

Koch's four CO2 values (p. 27, 'ebenfalls sehr zuverlassigen Messungen von J. Koch') \
are extracted as reproduced; the 'Stoll' column beside them is Stoll's formula at \
Koch's wavelengths. The columns computed from Cuthbertson's and Scheel's formulas in \
Tables V, VII and IX are not extracted; their formulas are recorded."""

