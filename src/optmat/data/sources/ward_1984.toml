citation = "J. F. Ward and D. S. Elliott, J. Chem. Phys. 80, 1003 (1984)"
doi = "10.1063/1.446825"
library = "Ward_1984_OpticalThirdHarmonic"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Third-harmonic generation of a ruby laser (694 nm, 1 MW, 40 ns) focused \
(b = 6.1 mm) near a glass/gas interface; the harmonic generated in the gas interferes \
with that of the absorbing glass. S(Omega) measured at ten normalized densities Omega \
= rho Delta k_0 b/2 (0-1.5, rho in amagat), alternating with helium; S(0) and \
S(infinity) fitted with the Gaussian-beam integral Q (Eqs. (4)-(7)); binary mixtures fix \
the sign ambiguity."""
notes = """THG coefficients of CH4 and SF6 (and of CH3F, CH2F2, CHF3 and CF4, which are \
not curated species and are skipped), compared with dcSHG and Kerr coefficients.

Definitions (pp. 1003-1004): chi is 'the third-harmonic coefficient' of Ward and New \
(Ref. 1 = ward_1969), i.e. chi = gamma_T/6 (Ward's K = 1/4 for THG, per molecule). \
Eq. (9): chi_He = 4.00 x 10^-39 esu/atom (Sitz and Yaris), and Eq. (10): chi_X = chi_He \
(Delta k_0)_X/(Delta k_0)_He [1 - (S_X(inf)/S_X(0))^1/2]/[1 - (S_He(inf)/S_He(0))^1/2]: \
every chi is a measured ratio to helium times 4.00. Delta k_0 = 3w [n^w(rho) - \
n^3w(rho)]/(c rho) per amagat (Eq. (3)) 'are known' (Ref. 15, Elliott and Ward, to be \
published). The comparison columns are dcSHG chi(-2w; 0, w, w) and Kerr chi(-w; w, 0, 0) \
in the same (Ward) convention: checked for column b, Shelton and Buckingham's gamma \
(shelton_1982 Table II, 10^-63 C^4 m^4 J^-3, Taylor) x 8.0888e24 / 6 = CH4 334.6 \
(printed 333), SF6 144.3 (144), CF4 103.7 (103), CHF3 146.9 (146), CH3F 217 (216).

Uncertainties: the parentheses are in units of the last digit; the text (p. 1005) \
says the fits' dependence on z_I = 10 +- 2 mm changes chi by 'never more than 5 %'. \
Error flags are standard deviations of the mean; the level of Table I's parentheses is \
not stated.

The sign ambiguity of Ward and New 1969 is resolved (p. 1004): q = -1 for He and SF6 by \
fit quality and, through mixtures, for all gases here and 'for all gases studied in \
Ref. 1' (Ward and New's set (i)).

Part: THG is nearly electronic; the paper (p. 1005) finds chi > chi(dcSHG) > chi(Kerr) \
for CH4, as electronic dispersion predicts, but not for CF4 and SF6, which 'indicates the \
existence of significant vibrational contributions' (Ref. 13, Elliott and Ward, Mol. \
Phys., to be published). THG values recorded total. The 694 nm is printed as such (ruby)."""


