[[errata]]
dataset = "dcshg_shelton_buckingham_CH4"
row = "chi"
column = "x"
printed = "541"
corrected = "514.5"
reason = "Table I footnote b prints 'Reference 7, 541 nm' (page image checked); Reference 7 (Shelton and Buckingham, Phys. Rev. A 26, 2787 (1982)) measured its hyperpolarizabilities at 514.5 nm (its Table II caption), and its gamma values divided by 6 reproduce this column (CH4 248.2e-63 -> 334.6, SF6 107e-63 -> 144.3, x 10^-39 esu with 8.0888e24 esu per SI unit): 541 is a transposition of 514."
evidence = "shelton_1982, Table II (tbl_09cd9a18fa27): 'Hyperpolarizabilities and phase-matching densities of several molecules, measured at 514.5 nm'; the conversion checked 2026-09-26."

