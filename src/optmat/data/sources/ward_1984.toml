table = "tbl_67cee6b847af"
quantity = "hyperpolarizability"
unit = "esu"
scale = 1e-39
abscissa_unit = "nm"
use = "primary"
notes = "Table I (p. 1004), chi x 10^39 (esu/molecule), column a: this work's THG chi(-3w; w, w, w) at 694 nm, relative to helium normalized to 4.00 x 10^-39 esu (Eq. (9)); Ward's convention (gamma_T/6). Total (THG has no rotational part; the vibrational one is not separated)."
[datasets.uncertainty]
column = true
level = "not stated"
[datasets.parameters]
