citation = "M. G. Payne, C. H. Chen, G. S. Hurst, S. D. Kramer, W. R. Garrett and M. Pindzola, \"Resonance ionization spectroscopy schemes for Ar, Kr and Xe\", Chem. Phys. Lett. 79, 142 (1981)"
doi = "10.1016/0009-2614(81)85306-7"
library = "Payne_1981_ResonanceIonizationSpectroscopy"
identity = "VALIDATED_WITH_WARNINGS"
kind = "theory"
technique = """Proposed resonance-ionisation (2 + 1) schemes for Ar, Kr and Xe: two-photon \
excitation of an np5 n'p [1/2]0 level (one or two lasers, plane polarised) followed by \
one-photon ionisation of the excited level. The excitation rate R = alpha^2 M(delta, \
t) / 2 from rate equations for a broadband laser modelled as many independent-phase \
modes with a Gaussian spectrum (Eqs. 1-9); the two-photon matrix element by closure \
with an average intermediate frequency (Eq. 10), in a single-configuration jl-coupling \
estimate |<1|P_z^2|0>| = (2/3) R_2 with R_2 the radial integral of r^2 (Eq. 11), \
averaged over Hartree-Fock, Hartree-Fock-Slater, l-averaged Hartree-Fock and parametric \
potential wave functions; ionisation yields and effective volumes for focused beams \
(Eqs. 13-19, Table 1)."""
notes = """Chem. Phys. Lett. 79(1), 142-148 (1 April 1981) = PDF pages 1-7 (journal page = \
PDF page + 141); a scan with a poor text layer (decimal points lost: '1576 3' for \
1576.3, '15763' in Table 1). Identity checked against the first page (journal, \
volume, number, date, title, authors). Every number taken was read on the rendered \
pages (pp. 145, 146).

WHAT IS TAKEN: the photoionisation cross sections sigma_I of the two-photon-excited \
levels that the text quotes, inline (text) points: Ar 3p5 4p[1/2]0 'At 1576 A, one has \
sigma_I ~ 1 x 10^-18 cm2' (p. 145); Kr 4p5 6p[1/2]0 'another photon [of the 1927.48 A \
excitation light] can ionize with sigma_I ~ 5 x 10^-19 cm2 [9]' (p. 145); Kr 4p5 \
5p[1/2]0 'At 3262 A we have sigma_I = 10^-18 cm2' (p. 146); Xe 5p5 6p[1/2]0 at 2496 A, \
'Theory [9] gives sigma_I ~ 3 x 10^-18 cm2' (p. 146). Ref. 9 is 'M. Pindzola, \
unpublished'; the Ar and Kr 5p values cite nothing. One-figure estimates, all use = \
check, no uncertainty stated. The levels are J = 0, so the cross section does not \
depend on the alignment the polarised excitation gives.

WAVELENGTHS: vacuum. Twice 1e8 / 1927.48 A is 103 762.4 cm^-1, NIST's Kr 4p5 6p[1/2]0 \
level is 103 761.63 cm^-1 (data/external/nist_asd/Kr_I_levels.tsv; vacuum 1927.50 A, \
in air 1926.9 A); twice 1e8 / 2496 A is 80 128 cm^-1 against Xe 6p[1/2]0 at 80 118.96 \
(vacuum 2496.3 A). The Ar scheme 1576.3 + 2292.8 A sums to 107 054.5 cm^-1 against \
NIST's 3p5 4p[1/2]0 107 054.27 (computed 2026-10-09).

COMPARISONS. Xe: pindzola_1981 (Pindzola's published calculation for this level, Phys. Rev. \
A 23, 201, January 1981; whether it is Ref. 9's is not stated) gives at 4.97 eV (249.5 nm) totals from 1.32 \
(Hartree-Fock velocity) to 3.05 x 10^-18 cm2 (Dirac-Fock length): the 3 x 10^-18 here is \
its largest form. The text says 'A cross section of this magnitude was confirmed \
experimentally' (Chen et al., Ref. 1, Chem. Phys. Lett. 75, 473 (1980): chen_1980). Kr 6p: 'A cross section of this \
magnitude has been measured by Bokor et al.' (bokor_1980: (3.2 +- 2.0) x 10^-19 cm2, \
but for 6p[3/2]2 at 193.49 nm, not 6p[1/2]0).

NOT TAKEN. (1) The radial integrals R_2 (Ar 1.7, Kr 6p 0.9, Kr 5p 3, Xe 7 e^2 a0^2; 'a \
factor of two in their uncertainty'): no quantity. (2) The two-photon rate \
coefficients k (R = k I^2) and k' (R = k' I1 I2), s^-1 W^-2 cm^4, for the stated laser \
bandwidths: Ar k' ~ 1.0 x 10^-9 (1576.3 + 2292.8 A), Kr k ~ 1.2 x 10^-12 (1927.48 A, \
0.8 A bandwidth), Kr k' = 5 x 10^-9 (5p[1/2]0), Xe k = 1.3 x 10^-9 (2496 A, 0.08 A) \
against Chen et al.'s observed k ~ 2 x 10^-9 (Ref. 1, 0.05-0.1 A); the Xe two-photon \
Rabi frequency Omega_2 = 6.1 I (W/cm2). A rate per squared intensity that depends on \
the laser bandwidth (Eq. 12, R ~ 7 L_2^2 I^2 / Delta_1/2) is not \
two_photon_excitation_cross_section (frequency-integrated); it is not converted here. \
(3) Table 1 (p. 147, tbl_7b9c48e5b576): laser parameters, saturation parameters S and \
T and effective volumes Delta V: instrument-specific. No measured two-photon number of \
argon is in this paper: hattig_1998b's 'experimental value of 2.05 x 10^-51 cm4 s' for \
argon's 4p J = 2 levels (TC-887), which cites this paper among four sources, is not \
here (the paper treats only the J = 0 level 4p[1/2]0 of argon, in theory).

ODDITY. p. 145 cites 'a scheme by Hawkins et al. [9]'; Hawkins et al. are Ref. 10 (Ref. \
9 is Pindzola, unpublished, and the reference list prints [10] before [9]).

FURTHER TWO-PHOTON DATA CITED: C. H. Chen, G. S. Hurst and M. G. Payne, Chem. Phys. \
Lett. 75, 473 (1980) (chen_1980; Xe 6p[1/2]0, observed k); Ref. 7, 'M. G. Payne, W. R. \
Garrett and M. Pindzola, in preparation' (the atomic-structure calculations; \
pindzola_1981b, Pindzola, Payne and Garrett, Phys. Rev. A 24, 3115 (1981), may be it: \
not established); J. Bokor, J. \
Zavelovich and C. K. Rhodes, Phys. Rev. A 21, 1453 (1980) (bokor_1980); R. T. Hawkins, \
H. Egger, J. Bokor and C. K. Rhodes, Appl. Phys. Lett. 36, 391 (1980) (not in the \
library); G. S. Hurst, M. G. Payne, S. D. Kramer and J. P. Young, Rev. Mod. Phys. 51, \
767 (1979) (not in the library)."""

