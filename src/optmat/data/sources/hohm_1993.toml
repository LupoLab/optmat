[[formulas]]
id = "cauchy_CH4"
material = "CH4"
equation = "Eq. (13) with Table 2, pp. 934 and 937"
printed = "alpha(omega) = a_0^(2) + a_1^(2) omega^2 + a_2^(2) omega^4; CH4: a_0^(2) = 17.2585(21), a_1^(2) = 62.72(47), a_2^(2) = 349(19)"
variable = "omega: photon energy in hartree; alpha in au (vacuum wavelengths 325.13-632.99 nm)"
range = "325.130-632.990 nm (the data fitted), 294.47 K"
coefficients = { a0 = "17.2585", a1 = "62.72", a2 = "349", a0_rms = "0.0021", a1_rms = "0.47", a2_rms = "19" }
check = "Reproduces Table 1's CH4 row to 4e-4 au (-0.00006, +0.00030, -0.00041, +0.00001, +0.00006 at 633 ... 325 nm), within its printed 0.0017 au. Checked 2026-09-26."
notes = "The Gaussian least-squares parameters with their 'r.m.s. error' (p. 936); a_k is not S(-2k-2) (Eq. 10), the moments of moments_CH4 are its iterated correction. A formula of the free molecule's electronic polarizability at 294.47 K; not to be extrapolated far below 325 nm."
