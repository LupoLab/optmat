citation = "U. Hohm, \"Experimental determination of the dispersion in the mean linear dipole polarizability alpha(omega) of small hydrocarbons and evaluation of Cauchy moments between 325 nm and 633 nm\", Mol. Phys. 78, 929 (1993)"
doi = "10.1080/00268979300100621"
library = "Hohm_1993_ExperimentalDeterminationDispersion"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Michelson twin interferometer, gas cell of length l/2 about 0.5 m, pressure \
below 3e5 Pa, illuminated simultaneously by four He-Ne lasers (vacuum wavelengths \
632.990, 611.971, 594.096 and 543.516 nm, from Rowley and Gill's frequencies) and a \
He-Cd laser (325.130 nm). The cell is evacuated in about 20 isothermal steps (pressure \
to 50 Pa, temperature to 10 mK) while a monochromatic (632.99 nm) and the polychromatic \
interferogram are recorded; the polychromatic one is Fourier transformed over the \
density, and each peak position gives alpha(omega_j) (Eq. 5; peak centre to <= 5e-6, of \
the order of the lasers' relative wavelength accuracy). Gas purity of CH4 99.995 % \
(pp. 931-932)."""
notes = """Page numbers are the journal's (929-941); pdf page 1 is the publisher's \
cover, so p. = pdf page + 927. Only CH4 is a curated species: C2H6, C3H8, n-C4H10, \
neopentane, C2H4, C3H6 and cyclo-C3H6 are not transcribed.

Reduction (Eq. 1, p. 930): (n^2 - 1)/(n^2 + 2) = 4 pi N_A [a0^3 alpha(omega, T)] rho_0 \
[1 + sum_k B_k* rho_0^k]/3, rho_0 = p/RT the ideal-gas molar density; alpha is the \
polarizability of the free molecule (zero density), in atomic units, so it needs no \
state. The wavelengths are vacuum wavelengths (p. 931 and Table 1 note a). The text \
prints omega_2 = '0.7445345 a.u.' (p. 931), a misprint for Table 1's 0.07445345 (the \
value of 611.971 nm); no dataset uses it.

Uncertainty: the paper does not say what the parenthesised digits of Table 1 are \
(level not stated; the same 0.0017 au at all five wavelengths, 1e-4 of alpha). 'The \
uncertainty in the relative dispersion ... is mostly determined by the uncertainty in \
the frequency of the radiation sources used' (p. 929); the fit parameters of Table 2 \
carry their 'r.m.s. error' (p. 936).

Table 1 (p. 935): CH4 at 294.47(1) K, this work (b) and alpha from Thomas and Meath's \
DOSD Cauchy moments (c [26], S(-2) ... S(-16), p. 936). 'Very good agreement', and the \
relative dispersion Delta alpha/Delta omega is 15.14 (this work) against 15.02 [26] \
(p. 936). The 'latest experimental value' alpha(omega_1) = 17.5922(54) au at 323 K is \
Achtermann et al.'s ([41], achtermann_1991; p. 936). Reprinted as hohm_1994b/alpha_CH4 \
(Table 1 row h there).

Table 2 (p. 937): a_0-a_2 of the quadratic fit in omega^2 (Eq. 13), recorded as the \
formula cauchy_CH4, and the Cauchy moments: S(-2k) of this work, obtained from a_k by \
the iteration of Eqs. (12) and (17) (M = 7, about 200 steps, p. 936), with Thomas and \
Meath's (b [26]) and Spackman's TDHF (e [13]) values. The moments are refraction-derived \
over 325-633 nm: 'S(-2) only reflects the electronic part of the static polarizability, \
excluding polarization effects resulting from vibrations' (p. 939), and S(-6), S(-8) \
rest on the estimate (17) of the higher moments; use = 'check'. The mean deviations \
Delta_1, Delta_2 from Meath's moments over six hydrocarbons (Table 2's last rows: S(-2) \
0.10(0.24) %, S(-4) -0.7(1.0) %, S(-6) -1.4(4.8) %, S(-8) 9.4(9.1) % for Delta_1) are \
not extracted. Spackman's row mixes his two basis sets: S(-2) = 15.895 is his ELP value \
(Spackman 1991 Table I; 6-31G(+sd+sp) 15.771), S(-4) = 50.07 and S(-6) = 199.11 his \
6-31G(+sd+sp) values (ELP 50.68, 204.05).

Table 3 (p. 939): B_2*(omega, T) = b_R(omega, T) - B(T) in cm^3/mol, a fit parameter \
that is not a vocabulary quantity (it contains the thermodynamic virial B): CH4 \
48.58(1.20) at omega_1, 49.17 and 49.00 at omega_4 and omega_5, 'uncertainty ... about \
0.15 [omega_3, omega_4], ... 0.1 cm^3 mol^-1 [omega_5] relative to B_2*(omega_1, T)'. \
hohm_1994b turns them into B_R with Burns et al.'s reference (hohm_1994b/B_R_CH4).

Elsewhere: he_2021's O2 formula (O2_table1) lists 'Hohm (1993)' among its sources; this \
paper has no O2 (the O2 dispersion is hohm_1994b's)."""

