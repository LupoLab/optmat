table = "tbl_90f137181bd7"
quantity = "polarizability"
unit = "au"
abscissa_unit = "nm"
wavelength_medium = "vacuum"
use = "primary"
notes = "Table 1 (p. 935), CH4 this work (b), 294.47(1) K; the parenthesised last digits in the sigma column, level not stated."
