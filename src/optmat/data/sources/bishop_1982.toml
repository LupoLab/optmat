citation = "D. M. Bishop and L. M. Cheung, \"Vibrational Contributions to Molecular Dipole Polarizabilities\", J. Phys. Chem. Ref. Data 11, 119 (1982)"
doi = "10.1063/1.555658"
library = "Bishop_1982_VibrationalContributionsMolecular"
identity = "VALIDATED_WITH_WARNINGS"
kind = "compilation"
technique = """Static vibrational polarizabilities of about a hundred molecules in the \
vibrational ground state, computed from experimental infrared band intensities: \
alpha = (2/3) sum_n g_n mu_n^2/(h c omega_n) over the fundamentals (Eq. 1), the \
transition moments from the absolute integrated intensities A_n (Eqs. 2, 3), and \
alpha = 3 eps0 P/N_A = 0.441 P x 10^-40 C^2 m^2 J^-1 with P in cm^3/mol (Eq. 4). \
Harmonic approximation (overtones and combination bands 'discarded as being \
inconsequentially small'), closure over rotation, excited vibrational states \
unpopulated (pp. 119-120). Intensity survey to the end of 1980, 'a major source' Pugh \
and Narahari Rao (1976) [9]."""
notes = """First page checked (pdf page 2; pdf page 1 is the publisher's cover): J. Phys. \
Chem. Ref. Data 11, No. 1, 1982; page numbers here are journal pages (pdf page + 117). \
This is the 'Bishop and Cheung' of zhao_2026 (Ref. 44) and sharipov_2017 (Table 2).

WHAT THE VALUES ARE. The pure vibrational (formerly 'atomic') static dipole \
polarizability alpha_vib, the infrared response that a dielectric measurement sees \
and an optical one does not; not a total polarizability, and without the orientation \
term of polar molecules. Units 10^-40 C^2 m^2 J^-1 (1 au = 1.64878e-41 C^2 m^2 J^-1 \
with the package's constants).

NO DATASETS: the vocabulary has no quantity for a vibrational contribution to the \
polarizability (the same format gap as sharipov_2017; reported). Storing these as \
'polarizability' would make them total polarizabilities. Instead each curated \
molecule's bands (omega_n, A_n, P_n) and total alpha are recorded as a formula entry \
(co, co2, n2o, o3, ch4, sf6), the printed numbers as strings, each checked against \
Eqs. (1)-(4): every P_n recomputes from A_n and omega_n as P_n = 1e5 A_n/(3 pi^2 \
omega_n^2) (cm^3/mol, A in km/mol, omega in cm^-1; the degeneracy cancels) to the \
printed digits, and every total as 0.441 sum P_n. Table images checked (Tables 1, 2, \
4, 6; the library's Table 4 cells shift columns across the page break, and the totals \
of Tables 2, 4 and 6 sit on a separate line in the images).

THE DIRECT CHECK OF THE HITRAN INFRARED TERMS (optmat.gas.infrared.static_infrared_\
polarizability_au, computed 2026-09-25): Bishop and Cheung against HITRAN, au: CO2 \
1.759 / 2.121 (-17 %), N2O 1.092 / 1.186 (-8 %), CH4 0.2305 / 0.2401 (-4 %), SF6 \
15.16 / 13.94 (+8.7 %); CO 0.1213 and O3 0.788 have no HITRAN bands in \
data/external/hitran yet. H2, D2, N2, O2 and the noble gases have no infrared-active \
fundamentals and are not listed.

ACCURACY. Error classes from the authors' stated intensity errors: (a) <= 5 %, (b) \
5-10 %, (c) > 10 % (p. 120) - but the footnote letters are not the same in every \
table (Tables 1, 2: b 5 %, c 5-10 %, d > 10 %; Table 4: d 5 %, e 5-10 %, f > 10 %; \
Table 6: b 5 %, c 5-10 %). 'It is almost certainly true that the error limits on the \
intensities ... are unduly optimistic ... it is not unusual for the results from two \
different laboratories to differ by 100%'; realistic classes are (a) <= 10 %, (b) \
10-50 %, (c) > 50 % (p. 120), and 'these estimates should be at least doubled' (p. \
120). Curated: CO 5 %, CO2 5-10 %, N2O 5 %, O3 none given, CH4 5 %, SF6 5 % (as \
stated; double them).

Not recorded: the non-curated molecules (about a hundred), the isotopologues (CD4, \
CH3D, ...; not curated species), the anisotropic contributions (derivable from the \
per-band P_n)."""

[[formulas]]
id = "co"
material = "CO"
equation = "Eqs. (1)-(4), pp. 119-120, with Table 1, p. 121"
printed = "CO: omega 2143 [9], A 61.2 [12] km/mol, P 0.045 cm^3/mol, alpha 0.020^b x 10^-40 C^2 m^2 J^-1"
variable = "omega_n: harmonic band frequency in cm^-1 (as printed, the observed fundamentals); A_n: absolute integrated band intensity in km/mol; P_n: molar vibrational polarization in cm^3/mol; alpha: static isotropic vibrational polarizability in 10^-40 C^2 m^2 J^-1. Only static values are printed; a dispersion model (not in the paper) would take one harmonic oscillator per band, alpha_vib(omega) = sum_n (3 eps0 / N_A) P_n omega_n^2 / (omega_n^2 - omega^2)"
state = "none (per molecule, vibrational ground state)"
density = "none"
range = "static (the paper treats static fields only, p. 119); the oscillator form extends it below the electronic resonances"
coefficients = { omega = "2143", A = "61.2", P = "0.045", alpha = "0.020" }
check = "P = 1e5 A/(3 pi^2 omega^2) (Eqs. 1-4, A in km/mol, omega in cm^-1) gives 0.04501 (printed 0.045); alpha = 0.441 P = 0.0198 (printed 0.020). Checked 2026-09-25."
notes = "Error class b (Table 1): 'The estimated error is 5%' (the authors' own class; 'these estimates should be at least doubled', p. 120). Intensity from Varanasi and Sarangi, JQSRT 15, 473 (1975) [12]; frequency from Pugh and Narahari Rao [9]. 0.020e-40 = 0.1213 au (1 au = 1.64878e-41 C^2 m^2 J^-1): the value zhao_2026 quotes as '20(1) x 10^-43'; christiansen_1998's CCSD(T) pure vibrational mean is 0.1246 au (+3 %). HITRAN's CO bands are not yet in data/external/hitran."

