citation = "H. E. Watson and K. L. Ramaswamy, Proc. R. Soc. London A 156, 144 (1936)"
doi = "10.1098/rspa.1936.0140"
library = "Watson_1936_RefractiveIndexDispersion"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Zeiss Rayleigh interferometer with a 1 m all-glass tube, cadmium-mercury arc \
(Cd 6440.24, 5087.23, 4801.25 A; Hg 5462.25, 4359.56 A, vacuum wavelengths), near \
25 degrees C (tube uniform to 0.02 C). One filling per gas: the fractions of a band at \
five lines read at successive pressures while the green bands are counted down to a \
few mm, so that density, compressibility and dispersion come from the same sample \
(pp. 3-7). The same gas samples served for the authors' dielectric-coefficient \
measurements (Proc. Roy. Soc. A 132, 569 (1931); 143, 558 (1934); and the preceding \
paper)."""
notes = """State: every refractivity of the authors' own is (mu - 1) at 25 degrees C and \
760 mm 'which the gas would have if it obeyed the simple gas law' (p. 7): the \
compressibility L of each gas (Table IV) was measured and the band count \
n = f p (1 + L p / 760) reduced to the ideal gas (pp. 3, 5): state 1 atm, 25 C, \
density ideal. 'The values at 0 degrees C may be calculated by multiplying by \
298/273' (p. 7); Tables V and VI do so with 1.09157. Wavelengths 'reduced to a \
vacuum' (p. 3); frequencies with c = 2.9986e10 cm/s.

Accuracy: 'band readings, even in the red and violet where the errors were greatest, \
could usually be considered accurate to 0.1 band' (pp. 5-7); with the 1 m tube that \
is about 0.06 x 10^-6 in mu - 1 (the per-point uncertainty given: a reading \
precision, not an accuracy). Purity limits the accuracy: compared with other \
observers (Table V) 'the agreement is by no means good, except for methane, which is \
easily purified. The discrepancies are almost certainly due to impurities in the \
gases' (p. 11). 'The accuracy of B is of the order of 1%, or rather less for gases \
with low refractive index and dispersion' (p. 10). The green-line values of Table III \
(N2O, N2) were measured without the dispersion and 'may not be so accurate' (p. 10).

Table II gives 23 gases at five lines; only CH4, SF6 and CO2 are curated species. \
Under three of the five values the table prints the difference calculated - observed \
x 10^8 for the one-term formula mu - 1 = A / (B - n^2) (n the frequency), whose A and \
B are 'calculated throughout from the values for the mercury green and violet lines' \
(p. 7); the differences are not extracted (the formulas are recorded). Table III \
gives the green-line values of CO, O2, NO, N2O, N2, NH3 by the authors and by \
Cuthbertson ('recalculated' to 25 C with the compressibility correction Cuthbertson \
omitted, p. 10), and A computed with Cuthbertson's B. Table V compares other \
observers at 0 C (the authors' rows are their Table II values x 1.09157); Table VI \
reduces the remaining Table II/III values to 0 C. The authors' 0 C values are \
extracted as checks (not independent).

Table VII gives the molar polarizations (cm^3 per mole of ideal gas, M/d = 24465 at \
25 C): P_A + P_E from the dielectric coefficient (for gases without a dipole moment \
'deduced directly from the dielectric coefficient', corrected for the revised \
compressibilities, p. 12), P_E = (mu_inf^2 - 1)/(mu_inf^2 + 2) M/d from the formula's \
zero-frequency limit, and their difference P_A. P_A + P_E is the static molar \
polarizability (A_epsilon), extracted as a molar_refractivity at wavelength inf; the \
values are the authors' dielectric results of the earlier papers of the series \
(reproduced, revised; those papers are not in the library). For the rare gases the \
refractive indices behind P_E are other observers' ('those of Damkohler' for Ar, Kr, \
Xe, p. 13) and 'the determinations were made with different gas samples'. P_E and P_A \
(derived) are not extracted. Against curated values the dielectric P_A + P_E are He \
0.54 (puchalski_2016 0.5173, 4 % higher), Ne 1.00 (gaiser_2010 0.9947), Ar 4.11 \
(orcutt_1967 4.142), Kr 6.26 (orcutt_1967 6.267), H2 2.05 (orcutt_1967 2.033), N2 \
4.39 (orcutt_1967 4.39).

Table VI prints N2O at 0 C as 507.4, which is neither the authors' 463.4 x 1.09157 = \
505.8 nor Cuthbertson's 464.6 x 1.09157 = 507.1 (CO2, N2, CO and NO agree with their \
25 C values x 1.09157 to the last digit); it corresponds to 464.8 at 25 C. No \
correction is made (the dataset is a check); flagged.

Not extracted: Table I (the acetylene example), Table IV (compressibilities 100 L at \
25 C: H2 -0.06, CH4 0.20, SF6 1.15, CO2 0.50, O2 0.08, N2O 0.55, N2 0.04, Ar 0.08, \
Kr 0.07, Xe 0.12, CO 0.04; the rare-gas values 'taken from the paper of Damkohler'), \
the B values of Table V, and every non-curated gas (hydrocarbons, silanes, fluorides, \
HCN, C2N2, NO, NH3).

Carbon monoxide (Tables III, VI, VII): the authors' green-line value 307.9 (dispersion \
not measured), Cuthbertson's 1920 value recalculated (cuthbertson_1920's 3364 x 10^-7 \
at 0 C, ideal-gas reduced, / 1.09157 = 308.18, and / (1 + 0.0004) for CO's \
compressibility 100 L = 0.04 gives 308.06, printed 308.1: consistent), the 0 C value \
336.1 (= 307.9 x 1.09157) and P_A + P_E = 4.98 cm^3 (P_E 4.89 recomputes from \
(mu - 1)_inf = 299.56e-6 as 4.886). CO has a small dipole moment; for polar gases \
P_A + P_E 'is obtained by assuming Debye's equation and extrapolating to very high \
temperatures' (p. 12), so the value excludes the orientation term if the authors \
treated CO as polar, which is not said. Only the formula of Table III is given for CO, \
with Cuthbertson's B."""

