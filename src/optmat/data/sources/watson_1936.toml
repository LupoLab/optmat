[[formulas]]
id = "ch4"
material = "CH4"
equation = "Table II, p. 8, with the formula of p. 7"
printed = "mu - 1 = A / (B - n^2); 10^6 A/B = 395.38, A x 10^-23 = 45895, B x 10^-26 = 116078"
variable = "n = c/lambda, frequency in s^-1, lambda the vacuum wavelength in cm, c = 2.9986e10 cm/s"
state = { pressure_atm = 1.0, temperature_c = 25.0 }
density = "ideal"
range = "436-644 nm (A and B from the 5462.25 and 4359.56 A values)"
coefficients = { A = "45895e23", B = "116078e26" }
check = "Does not reproduce its own table: it gives 412.180 at 4359.56 A (printed 412.18) but 405.919 at 5462.25 A against the printed 405.90, and the differences calc - obs x 10^8 at 6440.24, 5087.23, 4801.25 A come out -3.5, +3.0, +3.9 against the printed -7, -2, +3. A and B recomputed from the printed green and violet values (45751e23, 115728e26) give -6.3, +1.6, +2.9. No single misprint explains both the green value and the printed differences; 405.90 is the value used in Table V (x 1.09157 = 443.07). A/B = 395.38 agrees with the printed A and B. Checked 2026-09-25."

