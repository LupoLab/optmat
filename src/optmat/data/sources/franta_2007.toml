[[formulas]]
id = "pdos_sio2_like"
material = "SiO2-like_film_HMDSO"
equation = "Eqs. (5), (9), (10), (24), (25), pp. 16239-16241; Table 3 (p. 16240)"
printed = "eps_i(E) = (sgn(E)/E^2) [int_{-inf}^{0} N_xi(S) N_xi*(S + |E|) dS + sum_i G(A_delta_i, B_delta_i, E_delta_i) + G(A_p, B_p, E_p)] (Eq. 25), N_xi and N_xi* from Eqs. (9)-(10) with Q_xi, E_g, E_h; G(A, B, E_delta) = A/(sqrt(2 pi) B) {exp[(E - E_delta)^2/(2 B^2)] - exp[(E + E_delta)^2/(2 B^2)]} (Eq. 24, printed without the minus signs in the exponents: see notes)"
variable = "E: photon energy (eV); Q_xi in eV^(3/2); A_delta, B_delta, A_p, B_p, E_p printed in meV, E_g, E_h, E_delta in eV"
range = "1.2-6.5 eV (the ellipsometric and reflectance data)"
coefficients = { Q_xi = "74.8", E_g = "7.05", E_h = "25.9", A_delta1 = "29.0", B_delta1 = "440", E_delta1 = "5.20", A_delta2 = "190", B_delta2 = "414", E_delta2 = "6.70", A_p = "4.72", B_p = "100", E_p = "300" }
fixed = ["B_p", "E_p"]
parameters = { form = "film" }
check = "No value is printed to reproduce. Evaluated numerically (2026-09-27) with the corrected Eq. (24) (exp[-...]) and every meV parameter converted to eV (A read as 1e-3 of its printed value, the unit that keeps eps_i dimensionless with E in eV): eps_r = 2.070 at 1.5 eV, 2.084 at 2 eV, 2.174 at 4 eV, 2.443 at 6.4 eV; the defect terms give eps_i = 0.99e-3 at 5.1 eV and the total 3.45e-3 at 6.4 eV. Fig. 7 shows eps_r rising from about 2.07 at 1.2 eV to 2.45 at 6.5 eV and a defect peak near 1.0e-3 at about 5.1 eV (by eye): consistent. With the printed Eq. (24) the defect term at 5 eV is of order -1e100. Eq. (9) integrates to Q (Eq. (8)). The interband part equals the UDM's symmetric interband term with N = 30 Q^2 C_N / (E_h - E_g)^5 = 30 x 74.8^2 x 5069 / 18.85^5 = 357 eV^2 in the UDM's units (see the record's notes)."
notes = "SiO2-like film, 1.13 um on c-Si, 'prepared similarly as in [11]' (Zajickova et al., Plasma Process. Polym. 4, S287 (2007): HMDSO/O2 plasma), measured by ellipsometry and reflectometry at 1.2-6.5 eV. B_p and E_p 'could not be determined because the absorption lay too far outside the measurement range and, therefore, these two parameters were fixed' (p. 16241); the phonon Gaussian is 'an average contribution' of the Si-O-Si, silanol, water and hydrocarbon bands. Fig. 7 compares the result with Palik's fused silica (philipp_1985): the film's eps_r lies slightly below it in the visible and meets it near 6.4 eV."
