citation = "D. Franta, D. Nečas and L. Zajíčková, \"Models of dielectric response in disordered solids\", Opt. Express 15, 16230 (2007)"
doi = "10.1364/oe.15.016230"
library = "Franta_2007_ModelsDielectricResponse"
identity = "VALIDATED_WITH_WARNINGS"
kind = "theory"
technique = """Two dispersion models of disordered (amorphous and polycrystalline) solids \
built on the electronic structure: PDOS, which parameterises the densities of states of \
the initial and final bands and convolves them numerically (Eqs. (1)-(25)), and PJDOS, \
which parameterises the joint density of states directly so that the real part has a \
closed form (Eqs. (26)-(39)); Kramers-Kronig integration by an adaptive quadrature \
(Appendix A), the elliptic integrals of the square-root DOS (Appendix B). Applied \
(PDOS) to films fitted to ellipsometry and reflectance: diamond-like carbon films of \
ref. [15] (as deposited and annealed), a typical a-Si:H film (with a Rayleigh-Rice \
rough surface and a native oxide), and an SiO2-like film (1.13 um on c-Si, like those \
of ref. [11], measured by ellipsometry and reflectometry at 1.2-6.5 eV, with surface \
roughness, a transition layer and the monochromator's spectral width taken into \
account) (pp. 16236-16241)."""
notes = """Journal pages 16230-16244 = pdf pages 1-15 (the reference list is on pp. \
16230-16231). Identity (three authors) checked against the first page. A model paper: \
no optical constants are tabulated (Figs. 4, 6 and 7 show eps of the DLC, a-Si and \
SiO2-like films, Figs. 3 and 5 the fitted DOS; not digitised). The three parameter \
tables are the formulas below, checked cell by cell against their images; the band-gap \
parameters are also band_gap datasets (kind 'effective').

EQUATION MAP (E photon energy in eV; S the electron energy, E_F = 0):
- Eq. (1)/(4), p. 16230-16232: eps_i from the sum over band pairs of |p_jk|^2 times the \
convolution of the occupied DOS N_j(S) and the empty DOS N_k(S + E); Eq. (3) the JDOS; \
Eq. (5) the Kramers-Kronig real part; Appendix A, Eqs. (40)-(45), its numerical form \
(checked 2026-09-27: Eq. (43) with the PJDOS eps_i of Eq. (30) reproduces Eq. (31) to \
1e-11).
- PDOS, DLC (Section 2.1, pp. 16233-16235): Eq. (6) (stepwise Fermi-Dirac, sigma and pi \
bands), Eq. (7) the 'unnormalized DOS' N_j, Eq. (8) its integral Q_j (proportional to \
the concentration of j electrons, times the unknown |p|), Eqs. (9)-(10) the symmetric \
square-root DOS of the valence and conduction bands between E_g/2 and E_h/2, Eq. (11) \
eps_i = (1/E^2) sum_j (32 Q_j / (pi (E_hj - E_gj)^2))^2 e_j(E), e_j the elliptic \
integral of Appendix B (Eqs. (46)-(53)); Eq. (12) the older parameter A_j = 32 Q_j / (pi \
(E_hj - E_gj)^2) of refs. [12]-[16]. Eqs. (13)-(17): the pi-to-sigma ratio alpha = \
Q_pi / (kappa Q_sigma), with kappa = |p_pi| / |p_sigma| = 0.5736 found by matching \
Eqs. (15) and (16) for the annealed films (p. 16237), and the sp3/sp2 ratio.
- PDOS, a-Si (Section 2.2, pp. 16237-16238): Eq. (18) the Tauc edge; Eq. (19) eps_i with \
the extended-extended and the (doubled) localized-extended terms; Eqs. (20)-(22) the \
extended DOS, A_xi C(S) sqrt(...)sqrt(...), with C(S) = 1 + two Gaussians in |S| \
(A_1, B_1, E_1/2; A_2, B_2, E_2/2); Eq. (23) the localized (Urbach) DOS A_lambda \
exp(-||S| - E_g/2| / E_lambda) inside the gap.
- PDOS, SiO2-like (Section 2.3, pp. 16239-16241): Eqs. (9)-(10) for the extended \
states (j = xi), Eq. (24) Gaussian two-level defect terms G(A, B, E_delta) and one \
Gaussian for the infrared phonons, all inside the bracket of Eq. (25), which divides \
them by E^2. MISPRINT: Eq. (24) prints both exponents without the minus sign, \
exp[(E - E_delta)^2 / (2 B^2)] - exp[(E + E_delta)^2 / (2 B^2)] (page image, p. \
16239), which diverges; exp[-(E - E_delta)^2 / (2 B^2)] - exp[-(E + E_delta)^2 / (2 \
B^2)] is meant: with it the model reproduces Fig. 7 (formula pdos_sio2_like, check).
- PJDOS (Section 3, pp. 16241-16242): Eq. (26) the unnormalised JDOS, Eq. (27) its \
integral Q_j^2, Eq. (28) eps_i = J(E)/E^2, Eq. (29) J proportional to (E - E_g)^2 (E - \
E_h)^2, Eq. (30) eps_i = 30 Q^2 (E - E_g)^2 (E - E_h)^2 / ((E_h - E_g)^5 E^2) on (E_g, \
E_h), Eqs. (31)-(35) its closed-form real part, Eqs. (36)-(38) limits. MISPRINT: \
Eq. (37), the E -> 0 limit, prints '- 3(E_h^2 - E_g^2)/2' in the bracket; the limit of \
Eq. (31) is 60 Q^2 / (pi (E_h - E_g)^5) [(E_h^2 + E_g^2 + 4 E_g E_h) ln(E_h/E_g) - \
3(E_h^2 - E_g^2)] (series expansion; numerically, with Q = 74.8, E_g = 7.05, E_h = 25.9: \
Eq. (31) at 1e-3 eV gives 1.1046, the corrected limit 1.1046, the printed one 42.94). \
Eq. (33) (D, with the /2) is right. No PJDOS parameters are given here (the DLC and UNCD \
fits are in refs. [17] and [26]).

COMPARISON WITH THE LATER FRANTA MODELS (franta_2013, franta_2013b, franta_2015b, \
franta_2016 and optmat.solid.udm):
- The PJDOS term, Eqs. (30)-(35), is exactly the symmetric valence-to-conduction \
interband term of the universal dispersion model (franta_2015b Eqs. (4)-(12); \
udm._interband): the same (E - E_g)^2 (E - E_h)^2 / E^2 shape and the same X(E), \
Y(E) in the real part. Only the normalisation differs: here the integral of E^2 eps_i \
is Q^2 (Eq. (27)); in the UDM the Thomas-Reiche-Kuhn integral of E eps_i is the \
strength N (eV^2), with C_N = (E_h^2 - E_g^2)(E_h^2 + E_g^2 - 8 E_g E_h)/12 + E_g^2 \
E_h^2 ln(E_h/E_g). So N_vc = 30 Q^2 C_N / (E_h - E_g)^5 (checked 2026-09-27: \
udm._interband scaled so reproduces Eqs. (30)-(31) to 1e-14 at 1-30 eV; for the \
SiO2-like film's Q, E_g, E_h this is N = 357 eV^2).
- The PDOS square-root DOS convolution (Eqs. (9)-(11)) is not in the UDM; the \
PJDOS form replaced it as its analytic stand-in (Section 3). franta_2013b's 'PDOS' \
model column cites this paper (its ref. [24]).
- The 2007 Gaussians (Eq. (24)) sit inside the JDOS bracket and are divided by E^2 \
(Eq. (25)), with an amplitude A/(sqrt(2 pi) B); the UDM's Gaussian peaks (franta_2015b \
Eqs. (41)-(43), udm._gaussian) are in eps_i itself, normalised to unit sum-rule strength \
(1/(sqrt(pi) s E_p)). Not the same line shape.
- The Urbach tail here is a localized DOS (Eq. (23)) convolved with the conduction band; \
the UDM's Urbach term (franta_2013b Eq. (12), franta_2015b Eqs. (32)-(40)) is an \
exponential JDOS joined to the interband edge. Different constructions.
- No sum rule: Q_j carries the unknown |p_jk| (Eq. (8)), so the strengths are not \
electron densities; the later papers (franta_2013 on) normalise every term to the \
Thomas-Reiche-Kuhn sum rule, which makes N a density of electrons.

TABLE 1'S OTHER ROWS (notes only; no quantity): the thickness ratio d_f(t)/d_f(0) \
1.021-1.114, alpha (pi-to-sigma) 0.043-0.133, beta* (Eq. (15)) and beta† (Eq. (16)), \
the ERDA hydrogen fraction X_H 0.38, 0.36, 0.37, 0.34, 0.30, 0.25, and the sp3/sp2 \
ratio 4.23-0.96, for the six films (the formulas' checks reproduce them). The films are \
those of ref. [15] (Franta et al., Diamond and Related Materials 14, 1795 (2005)), which used the \
A_j parameterisation (p. 16235); whether Table 1 is a refit in Q_j or a conversion of \
[15]'s values is not stated. Text values: SiO2-like films of ref. [11], band gap 7.4-8.2 \
eV and defect transition energy 4.6-5.4 eV depending on the deposition; EELS of \
amorphous SiO2 (ref. [25]) has defect states at 5.5 and 7.2 eV (p. 16240)."""

