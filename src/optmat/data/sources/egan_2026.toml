citation = "P. F. Egan, Meas. Sci. Technol. 37, 255003 (2026)"
doi = "10.1088/1361-6501/ae6e94"
library = "Egan_2026_TwoColorMeasurements"
identity = "VALIDATED"
kind = "measurement"
technique = """Fabry-Perot cavity refractometer (Yang et al.'s apparatus) interrogated \
simultaneously at 0.6329908 and 1.542383 um (vacuum), both lasers referenced to a \
frequency comb; pressure from a dimensionally characterized piston gauge (1.9e-6 p), \
ITS-90 temperature by a capsule SPRT in a borehole of the vessel lid (1e-6 T); cavity \
compression calibrated with helium. Nine isotherms from 20 to 100 C up to 0.5 MPa per \
gas, regressed to p = (n - 1) A [1 + (n - 1) B + (n - 1)^2 C] + eps_p (Eq. 4), A = \
2RT/(3 A_R) (pp. 3-4). Baseline relative standard uncertainty 2.3e-6."""
notes = """Measured gases: CO2, O2, two N2 + O2 mixtures, natural dry air (Niwot Ridge) and \
water vapour. The mixtures, air and water are not curated species and are skipped \
(water's refractivity ratio 0.97569(8) at 1542/633 nm, 100 C, and the adjusted Voronin \
and Zheltikov Sellmeier of Table 5 included). All uncertainties are one standard \
uncertainty (p. 6).

Molar refractivity A_R (the zero-density Lorentz-Lorenz coefficient, Eq. 2) at 303 K, \
with a linear temperature dependence A_R(T) = A_303 [1 + A_theta (T/K - 303)] (Eq. 5); \
the parenthesised figures after A_303 are statistical only, the combined standard \
uncertainties are CO2 4.6e-6 A_303 and O2 7.2e-6 A_303 (pp. 6, 8). A_theta: CO2 \
4.22(9)e-6 at 633 nm and 4.13(9)e-6 at 1542 nm (combined u 8.0 %); O2 2.11(4)e-6 and \
2.02(5)e-6 (combined u 9.4 %) (pp. 4, 7-8). ITS-90 nonlinearity (up to 9 mK) limits \
A_theta and leaves up to 2.7e-5 relative error in A_R(T).

Comparisons (pp. 5, 10): Birch's A_R at 0.633 um, CO2 6.6418(5) and O2 4.0278(3) \
cm^3/mol (birch_1991); Zhang et al.'s (zhang_2008) O2 at 0.800 um is 4.5e-4 (n - 1) \
below Eq. (8) and their CO2 is also discrepant; Kren's inferred O2 Sellmeier \
(kren_2011) is within 8e-5 at 0.633 um and 1.7e-4 at 1.542 um of Eq. (8).

Second density virial coefficients B_rho (Tables 1, 2, 4) and the N2-O2 cross virial \
(Table 3) are equation-of-state quantities, not refractive ones, and are not extracted \
(the vocabulary's refractivity_virial_coefficient is B_R). They were derived with the \
second refractivity virial coefficients b_R(sigma, T) (B_R = A_R b_R) recorded below as \
formulas.

Table 6 (tbl_15c8e9be0440, image checked) gives beta, the slope of the refractivity \
ratio (n_633 - 1)/(n_1542 - 1) against n_1542 - 1 at 30 C (Eq. 15), which measures the \
dispersion of b_R (Eq. 18); the format has no quantity for it and it is not extracted. \
Values x 10^-3 (this apparatus; He, Ne, Ar, N2 from Yang, Stone and Egan, Phys. Rev. Appl. 23, 064041 (2025), ref. 15): He -1.20(25), \
Ne -0.70(25), Ar 2.62(25), N2 2.17(25), O2 4.73(25), CO2 4.83(25); Keeling's \
ultraviolet values reduced by 4.95: Ar 2.99, N2 2.71, CO2 4.21; Hohm's heuristic: He \
-0.18, Ne 0.20, Ar 2.81, N2 2.25, O2 3.21, CO2 4.29; ab initio (Garberoglio and \
Harvey): He -1.20, Ne -0.67, Ar 1.93."""

