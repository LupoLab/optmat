[[formulas]]
id = "o2_sellmeier"
form = "dn_sigma2"
terms = { scale = "1e-8", A = "0", B = ["5627886.8", "197258.6"], C = ["281.0", "45.4"] }
range_nm = [254.0, 1542.4]
material = "O2"
equation = "Eq. (8), p. 9"
printed = "10^8 (n_os - 1) = 5627886.8/(281.0 - sigma^2) + 197258.6/(45.4 - sigma^2)"
variable = "sigma = um/lambda, lambda the vacuum wavelength"
state = { pressure_pa = 100000.0, temperature_c = 20.0 }
density = "real"
range = "fitted to Ladenburg and Wolfsohn's (1932) visible-ultraviolet data, Hohm's five visible points (offset -2.1e-3 (n - 1)), this work's 0.633 and 1.542 um values and Keeling et al.'s 0.436/0.254 um ratio (1.097922)"
coefficients = { B1 = "5627886.8", C1 = "281.0", B2 = "197258.6", C2 = "45.4" }
check = "With the package's real-gas density at 20 C and 100 kPa (CoolProp) and Lorentz-Lorenz, Eq. (8) gives A_R = 4.027691 cm^3/mol at 0.6329908 um and 3.968977 at 1.542383 um, 6.3e-6 and 3.4e-6 below this work's A_303 (within its 7.2e-6). A_R carried to 293.15 K with A_theta would be 2.1e-5 lower (4.027632), which suggested that Eq. (8) takes A_303 at 20 C without the temperature dependence; that is not established: with the paper's own density virial (-17.0 cm^3/mol), refractivity virial and A_theta, Eq. (8) is +1.8e-6 and +4.4e-6 off, both within 7.2e-6, and the package has no refractivity virial for O2 (an 8.6e-6 effect) (second reading, 2026-09-25; TC-157). Checked 2026-09-25."
notes = "At 'standard conditions 20 C and 100 kPa' (n_os after Ciddor). 'Consistent within 1e-6 (n - 1) of the two-color measurement of this work and the Keeling et al ratio'; the fit is not robust in the ultraviolet (a Cauchy alternative differs by 7.7e-6 (n - 1) at zero frequency). Not valid at microwave frequencies (the 60 GHz O2 band adds 2.7e-3 (n - 1)); the 0.76 um A band perturbs n locally at 1e-5 (n - 1). The reproduced data it rests on are not in this record (Ladenburg and Wolfsohn 1932, Hohm, Keeling et al.)."

[[formulas]]
id = "co2_b_R"
material = "CO2"
equation = "p. 5"
printed = "b_R / (cm^3 mol^-1) = (0.291 + 0.00575 sigma^2) [1 - 3.2 x 10^-3 (T/K - 303)]"
variable = "sigma = um/lambda (vacuum); T in K; B_R = A_R b_R"
range = "0.633-1.542 um, 293-373 K"
coefficients = { b_eps = "0.291", b_R2 = "0.00575", b_theta = "-3.2e-3" }
reproduced_from = ["achtermann_1991"]
check = "Not checked (the reference value is Achtermann et al.'s B_R at 323 K and 0.633 um; the sigma^2 and T dependences are this work's beta analysis). At 0.633 um and 303 K, B_R = 6.64337 x 0.30535 = 2.029 cm^6/mol^2 (computed here)."
notes = "The second refractivity virial coefficient b_R = B_R / A_R (Eq. 2), 'this work recommends'; assumed 10 % uncertainty (p. 6)."

