citation = "R. A. Burns, C. J. Peters and P. M. Danehy, \"Unseeded velocimetry in nitrogen for high-pressure, cryogenic wind tunnels: part I. Femtosecond-laser tagging\", Meas. Sci. Technol. 29, 115302 (2018)"
