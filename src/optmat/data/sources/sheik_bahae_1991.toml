citation = "M. Sheik-Bahae, D. C. Hutchings, D. J. Hagan and E. W. Van Stryland, \"Dispersion of bound electronic nonlinear refraction in solids\", IEEE J. Quantum Electron. 27, 1296-1309 (1991)"
doi = "10.1109/3.89946"
library = "SheikBahae_1991_DispersionBoundElectron"
identity = "VALIDATED_WITH_WARNINGS"
kind = "compilation"
technique = """Theory and measurement. Theory: a two-parabolic-band model of the nondegenerate \
nonlinear absorption Delta alpha(omega1; omega2) (two-photon absorption, electronic Raman, \
linear and quadratic ac Stark effects; 'dressed' Volkov-type states, S-matrix, dipole \
A.p interaction, both beams linearly polarized in the same direction), and n2 by a \
nonlinear Kramers-Kronig transform of it, the infrared divergent term subtracted \
(pp. 1297-1304). Measurement: the authors' own single-beam Z-scan of n2 in semiconductors \
and some wide-gap crystals at 1.06 and 0.53 um (Nd:YAG) and of Ge at 10.6 um with a \
picosecond CO2 laser (pp. 1297, 1304-1305); pulse durations, beam parameters and \
uncertainties are not given in this paper (Refs. [1], [10]). Table III adds the n2 of \
Adair et al. [6] (three-wave mixing, 1.06 um), Ross et al. [39] (silica, 249 nm) and \
LaGasse et al. [40] (AlGaAs, femtosecond time-division interferometry)."""
notes = """Journal pages 1296-1309 = PDF pages 1-14 (journal page = 1295 + PDF page). The \
title printed on the paper is 'Dispersion of Bound Electronic Nonlinear Refraction in \
Solids' (the library's metadata drops 'ic'). Identity checked against the first page.

WHAT IS HERE. Table III (tbl_1be7b7bfe319, p. 1305; 40 rows; checked cell by cell against \
the image): material, wavelength (um), band gap (eV), linear index, n2(Exp.), n2(Pred.) \
and n2(Pred.)* in units of 1e-13 esu. Extracted by tools/extract/sheik_bahae_1991.py: per \
registered material the measured n2 (own: primary; Adair's and Ross's: reproduced), the \
two predicted columns (check), the gap (band_gap, assumed input, check) and the index \
(refractive_index, assumed input, check). Tables I and II (the nondegenerate absorption \
F2(x1; x2) and the degenerate dispersion G2(x) by contribution) are recorded as formulas \
with Eqs. (24)-(26), (28) and (44).

DEFINITIONS (p. 1296, Eq. 1): Delta n(omega) = gamma(omega) I_omega = n2(omega) \
|E_omega|^2 / 2, 'with I_omega and E_omega being the irradiance and electric field at \
frequency omega'; 'gamma and n2 are related by n2 (esu) = c n0 gamma / 40 pi (SI)'. So \
Table III's n2 is the esu n2 of n = n0 + n2 <E^2> (<E^2> = |E|^2 / 2, the field amplitude \
|E|), as DeSalvo et al. (desalvo_1996) and Adair et al. (adair_1989) define it: \
nonlinear_index_field. beta: 'beta(omega) = 2 hbar omega Delta W I_1^-2' (p. 1300), the \
degenerate 2PA coefficient; no beta is tabulated here. n2 is 'the bound electronic \
nonlinear refractive index'; pulse durations are not stated for the Z-scan values \
(picosecond: the DFWM check 'time resolution limited by the 30 ps pulsewidth', p. 1297), \
so part = 'unknown' for the own values. Adair's values keep that record's part \
(electronic_vibrational: nanosecond three-wave mixing). The 1994 paper of the same group \
(sheik_bahae_1994, p. 251) states that the interference factor of two between \
degenerate and nondegenerate index changes 'was ignored in calculating the n2 \
coefficient' here, and DeSalvo et al. (desalvo_1996, p. 1328) halve K' to 7.33e-9 for the \
same reason: the constant K', not the measured values, is affected.

PROVENANCE OF THE MEASURED COLUMN (the table is printed in four blocks separated by \
blank lines, lost in the extraction; text p. 1304, Fig. 5 legend). (1) Rows 1-14, Ge to \
BaF2 at 0.53 um: the authors' own Z-scan values ('The values for semiconductors \
(squares) were obtained from Z-scan measurements at 1.06 and 0.53 um [1], [10] ... \
Included in these data are some new measurements', p. 1304; Ge at 10.6 um 'which we \
measured with a picosecond CO2 laser', p. 1305). (2) Rows 15-21, AlGaAs: LaGasse et al. \
[40], M. J. LaGasse, K. K. Anderson, C. A. Wang, H. A. Haus and J. G. Fujimoto, Appl. \
Phys. Lett. 56, 417-419 (1990) (not in the library). (3) Rows 22-39, CdS at 1.06 um to \
LiF: Adair et al. [6] = adair_1989, each value Adair's Table IV value to two figures \
(checked material by material; see the datasets). (4) Row 40, SiO2 at 0.249 um: Ross et \
al. [39] (not in the library; milam_1998 and dragomir_2002 also reproduce it).

TWO ROWS THAT ARE NOT WHAT THEY SAY. 'KDP' (0.7; 6.95 eV, n0 1.60) and 'KH_2PO_4' (0.8; \
7.12 eV, n0 1.50) are one crystal, KDP = KH2PO4: Adair's KDP (o) 0.72 and (e) 0.78. Both \
are recorded under KDP (datasets ..._KDP and ..._KH2PO4). The 1.06-um 'SiO_2' row (1.1) is \
Adair's crystal quartz (o) 1.12, not his fused silica 0.85: recorded as SiO2_quartz. \
'CaCo_3' is printed so (calcite, CaCO3). These are the paper's labels, not errata: no value \
is changed.

ROWS NOT EXTRACTED (materials not registered; values as printed, x 1e-13 esu: wavelength \
um, gap eV, index, Exp., Pred.): CdTe 1.06, 1.44, 2.84, -2000, -2100; CdSe 1.06, 1.74, \
2.56, -90, 180 (own; 'excluding CdSe at 1.06 um whose n2 could not be measured with any \
degree of accuracy because of the 2PA-induced band-filling refractive nonlinearity', p. \
1304); CdS0.5Se0.5 1.06, 1.93, 2.45, 1000, 720; SBN (composition not stated) 1.06, 3.3, \
2.4, 30, 51, Pred.* 29 (all own); AlGaAs (composition not stated; LaGasse) at 0.850, \
0.840, 0.830, 0.825, 0.820, 0.815, 0.810 um, gap 1.57, index 3.30, Exp. -2000, -4000, \
-7000, -10000, -14000, -20000, -26000, Pred. -2800, -3300, -3900, -4300, -4900, -5900, \
-7300. jansonas_2022 reproduces the SBN value as 'SBN-61 (o)' (0.524e-14 cm2/W, = 40 pi \
x 30e-13 / (c x 2.4)); this paper names neither the composition nor the axis.

TEXT VALUES (p. 1305): n2 'from 2.5 x 10^-14 esu for a material such as MgF2 at 1.06 um \
to -2.6 x 10^-9 esu for AlGaAs at 810 nm [40] and 2.7 x 10^-10 esu for Ge at 10.6 um': \
Table III's 0.25, -26000 and 2700 (x 1e-13), not separate data. 'For the semiconductor \
measurements at 1.06 and 0.53 um (excluding CdSe ...), we find an average difference of \
less than 30% between the measured and predicted values. Including the measurements for \
dielectrics, the average difference was less than a factor of 2 ... the measured n2 for \
these wide-gap solids are consistently smaller than the predicted values' (p. 1304): a \
comparison, not an uncertainty. The paper states no uncertainty for any value.

CONSTANTS (p. 1300, 1304). K = 1940 (Eq. 26, the two-band theory; beta in cm/GW, E_g and \
E_p in eV), K = 3100 (the fit to the 2PA data of Ref. [11]), K = 5200 (Weiler's four-band \
calculation); E_p = 21 eV 'for most direct gap semiconductors'. K' = 1.50e-8 (from K = \
3100), 0.94e-8 (from K = 1940), 0.86e-8 (fitted to the wide-gap n2, the dashed line of \
Fig. 5(a) and the * column), n2 in esu with E_g and E_p in eV. Check: Eq. (26) with CODATA \
Gaussian constants gives K = 1943 cm/GW eV^(5/2); K' = K hbar c^2 / (40 pi) (from Eqs. 40, \
44 and the esu relation of Eq. 1) gives 1.459e-8 for K = 3100 and 0.913e-8 for K = 1940, \
2.7-3.0 % below the printed 1.50e-8 and 0.94e-8 (same ratio for both).

FIGURES (not digitised). Fig. 1: scaled n2 n0 E_g^4 / K' against hbar omega / E_g from \
the PRL [2]; Fig. 2: scaled beta against E_g (log-log, slope -3) from [9]; Fig. 3: F2 \
spectra for hbar omega2 / E_g = 0.4, 0.6; Fig. 4: the contributions to G2; Fig. 5(a), (b): \
the Table III n2 scaled, with G2 and the K' = 0.86e-8 curve; Fig. 6: log-log near the \
edge, slope -3/2; Fig. 7: n2 scaled by n0 and G2 against E_g (slope -4); Fig. 8: the \
switching figure of merit |2 pi gamma / beta lambda| (Eq. 47) with semiconductor data.

REPRODUCTIONS OF THIS PAPER ELSEWHERE: jansonas_2022 (SBN, ZnS, ZnSe at 1.06 um, converted \
to cm2/W with the table's n0: 0.524, 0.84, 2.87 x 1e-14, all agree); patwardhan_2021 \
(band gaps of ZnSe 2.58, Al2O3 7.3, CaF2 9.92, MgF2 11.27 and fused silica 7.8 eV agree \
with Table III; its ZnS 3.2 eV is not this paper's 3.54, so comes from its other \
references; its theory column uses this paper's wide-gap K' = 0.86e-8)."""

[[formulas]]
id = "beta_two_band"
equation = "Eqs. (24)-(26), p. 1300"
printed = "beta(omega) = K sqrt(E_p) / (n0^2 E_g^3) F2(hbar omega / E_g); F2(x) = (2x - 1)^(3/2) / (2x)^5; K = (2^9 pi / 5) e^4 / (sqrt(m0) c^2)"
variable = "x = hbar omega / E_g (degenerate 2PA; F2 = 0 for x < 1/2); beta in cm/GW with E_g and E_p in eV; n0 the linear index; Gaussian units in Eq. (26)"
coefficients = { K_theory = "1940", K_fit = "3100", K_weiler = "5200", E_p = "21" }
check = "Eq. (26) with CODATA Gaussian constants (e = 4.80320e-10 esu, m0 = 9.10938e-28 g, c = 2.99792458e10 cm/s, 1 eV = 1.602177e-12 erg; beta x 1e16 for cm/GW) gives K = 1943 cm/GW eV^(5/2): the printed 'K = 1940' (checked 2026-09-27). F2 of Eq. (25) is the degenerate limit x1 = x2 of Table I's 2PA term, (x1 + x2 - 1)^(3/2) / (2^7 x1 x2^2) (1/x1 + 1/x2)^2 = (2x - 1)^(3/2) / (2x)^5 (checked algebraically)."
notes = "The two-parabolic-band 2PA of a direct-gap semiconductor, p_vc parallel to k (angular factor 1/5; the Kane heavy-hole case gives 2/15, p. 1299). E_p = 2 |p_vc|^2 / m0, the Kane energy, '~21 eV for most direct gap semiconductors' (p. 1300). 'The best fit to the data of [11] using (24) and (25) gave K = 3100 ... Weiler's second-order perturbation calculation for a four-band model gave K = 5200' (p. 1300). beta = 2 hbar omega Delta W / I^2 (p. 1299-1300)."

[[formulas]]
id = "f2_nondegenerate"
equation = "Eqs. (28)-(38) and Table I, pp. 1300-1302"
printed = "Delta alpha(omega1; omega2) = 2K sqrt(E_p) / (n1 n2 E_g^3) F2(hbar omega1 / E_g; hbar omega2 / E_g) I2; F2 = F2PA + F2RAM + F2LSE + F2QSE with F2PA = (x1 + x2 - 1)^(3/2) / (2^7 x1 x2^2) (1/x1 + 1/x2)^2; F2RAM = (x1 - x2 - 1)^(3/2) / (2^7 x1 x2^2) (1/x1 - 1/x2)^2; F2LSE = -(x1 - 1)^(3/2) / (2^6 x1 x2^2) (1/x2^2); F2QSE = -1 / (2^10 x1 x2^2 (x1 - 1)^(1/2)) [1/(x1 - x2) + 1/(x1 + x2)]"
variable = "x1 = hbar omega1 / E_g (the probe whose absorption changes), x2 = hbar omega2 / E_g (the pump, below the gap); each (...)^(3/2) term is zero when its argument is negative; n1, n2 the linear indices at omega1, omega2; I2 the pump irradiance"
coefficients = { K = "1940", E_p = "21" }
check = "Table I checked against its image (2026-09-27): it agrees with Eqs. (29), (33), (38). Eq. (30) in the text prints the Raman numerator as (x1 - x2 - 1)^(3/2) - (-x1 + x2 - 1)^(3/2); Table I keeps only the first term, which is the whole for x2 < 1 and x1 > 0 (the second needs x2 > x1 + 1, a pump above the gap, excluded here). The degenerate 2PA limit is Eq. (25) (formula beta_two_band). The KK transform of these terms, with the divergent term removed, is Table II (formula g2_degenerate), which reproduces Table III."
notes = "The quadratic Stark term here has two terms; sheik_bahae_1994 (Table I) adds two more (the conservation of states), which 'contribute less than 10% to the degenerate n2(omega) for hbar omega1 / E_g < 0.95' and 'were ignored in [5]' (sheik_bahae_1994, p. 250). The linear Stark (self-coupling) term only cancels the omega^-4 divergences of the 2PA and Raman terms (p. 1303)."

[[formulas]]
id = "g2_degenerate"
equation = "Eqs. (39)-(44) and Table II, pp. 1302-1304"
printed = "n2(esu) = K' sqrt(E_p) / (n0 E_g^4) G2(hbar omega / E_g); gamma = K hbar c sqrt(E_p) / (n0^2 E_g^4) G2 (Eq. 40); G2(x2) = (2/pi) int_0^inf F2(x1; x2) dx1 / (x1^2 - x2^2) (Eq. 41). Table II: G2PA = (2x)^-6 [-(3/8) x^2 (1 - x)^(-1/2) + 3x (1 - x)^(1/2) - 2(1 - x)^(3/2) + 2 Theta(1 - 2x) (1 - 2x)^(3/2)]; G2RAM = (2x)^-6 [-(3/8) x^2 (1 + x)^(-1/2) - 3x (1 + x)^(1/2) - 2(1 + x)^(3/2) + 2(1 + 2x)^(3/2)]; G2LSE = (2x)^-6 [2 - (1 - x)^(3/2) - (1 + x)^(3/2)]; G2QSE = (2^10 x^5)^-1 [(1 - x)^(-1/2) - (1 + x)^(-1/2) - (x/2)(1 - x)^(-3/2) - (x/2)(1 + x)^(-3/2)]; divergent term = (2x)^-6 [-2 - 35x^2/8 + (x/8)(3x - 1)(1 - x)^(-1/2) - 3x (1 - x)^(1/2) + (1 - x)^(3/2) + (x/8)(3x + 1)(1 + x)^(-1/2) + 3x (1 + x)^(1/2) + (1 + x)^(3/2)]"
variable = "x = hbar omega / E_g < 1 (degenerate self-refraction); E_g and E_p in eV; n2 in esu of Delta n = n2 |E|^2 / 2 (Eq. 1); Theta the step function"
coefficients = { K_prime_fit = "1.50e-8", K_prime_theory = "0.94e-8", K_prime_wide_gap = "0.86e-8", E_p = "21" }
check = "G2 = G2PA + G2RAM + G2LSE + G2QSE - divergent term ('we treat such a divergence as unphysical and subtract it', p. 1303) reproduces both predicted columns of Table III, including the unregistered rows: all 40 'Pred.' cells (K' = 1.50e-8) and all 22 'Pred.*' cells (K' = 0.86e-8) within 3.4 %, 49 of the 62 to the printed rounding and the other 13 within 0.2-3.4 % (largest: MgO 1.654 against 1.6, AlGaAs at 0.840 um -3250 against -3300, KBr 2.955 against 2.9), with hbar omega = 1.23984 eV um / lambda, the table's gap and index, E_p = 21 eV, and lambda = 0.532 um for the rows printed 0.53 (with 0.53 exactly, CdS gives -1360 against -1200). The Ge row uses the daggered direct gap 0.87 eV. G2(0.01) = 0.0140 (the divergent 2PA, Raman and linear Stark pieces cancel the -x^-5 of the quadratic Stark piece); G2 changes sign at x = 0.688 ('at about hbar omega / E_g = 0.7', p. 1308). Computed 2026-09-27 (scratch script)."
notes = "K' = 1.50e-8 is 'using the value of K obtained from the fit to 2PA in semiconductors (3100)'; 'Using the value of K predicted by theory (no fitting) gives K' = 0.94 x 10^-8'; 'a good fit to the n2 data [of the wide-gap solids] can be obtained by using a smaller value for the constant K' = 0.86 x 10^-8' (p. 1304). K' = K hbar c^2 / 40 pi gives 1.459e-8 and 0.913e-8 (2.7-3.0 % below the printed values). The interference factor of two was ignored here (sheik_bahae_1994, p. 251; desalvo_1996 uses K' = 7.33e-9 for K = 3100). The Table II caption refers to '(44)' and prints 'hbar omega / E_R' for hbar omega / E_g. sheik_bahae_1994 notes that Fig. 4 here removed the divergences of the individual contributions incorrectly ('thus suppressing the bandgap resonance of the electronic Raman effect'); the total G2 is unaffected (its footnote 1, p. 253). The switching criterion, Eq. (47): (hbar omega / E_g) |G2| / F2 > 2 pi c_sw (p. 1306)."

