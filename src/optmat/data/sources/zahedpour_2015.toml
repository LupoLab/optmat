citation = "S. Zahedpour, J. K. Wahlstrand and H. M. Milchberg, \"Measurement of the nonlinear refractive index of air constituents at mid-infrared wavelengths\", Opt. Lett. 40, 5794 (2015)"
doi = "10.1364/OL.40.005794"
library = "Zahedpour_2015_MeasurementNonlinearRefractive"
identity = "VALIDATED"
kind = "measurement"
technique = """Single-shot supercontinuum spectral interferometry with a tunable pump: an OPA \
(1100-2600 nm; 1250, 1650, 2200, 2400 nm used) or the 800-nm Ti:sapphire (and 400 nm) \
pump, 500 Hz; supercontinuum probe and reference (500-700 nm, from 2 atm Xe; chirped to \
~1.5 ps), crossing the pump at 2 degrees in a backfilled chamber (interaction length L ~ \
2 mm); probe parallel or perpendicular to the pump. Absolute n2 WITHOUT density or \
intensity measurements: the electronic phase is referenced to the rotational phase of \
N2 and O2, whose size is fixed by Delta alpha (wahlstrand_2012, 800 nm); Ar is \
referenced to N2 (pp. 5794-5796)."""
notes = """Journal pages 5794-5797 = PDF pages 1-4. Identity checked against the first page. \
Air is not curated (the title's 'air constituents' are N2, O2, Ar).

DEFINING EQUATIONS (Gaussian). Separation, Eq. (1), p. 5795: Delta phi_elec = 3(Delta \
phi_par + 2 Delta phi_perp)/5, Delta phi_rot = 2(Delta phi_par - 3 Delta phi_perp)/5. The \
probe index (p. 5795): 'Delta n_p(x, t) = 2 n2 I(x, t) + int R(t - t') I(x, t') dt'', \
'where I is the pump intensity; n2 is the electronic Kerr coefficient, which depends on \
the probe and pump wavelengths': n2 is the SELF coefficient. Eq. (2), p. 5795: Delta \
phi_elec = 2 n2 I0 f(x, t) k_p L; Delta phi_rot = (2 pi N k_p L / n0) Delta alpha(lambda_p) \
(<cos^2 theta>_t - 1/3) = (2 pi N k_p L / n0) Delta alpha(lambda_p) [Delta alpha(lambda_e) \
I0 / (c hbar)] int g(t - t') f(x, t') dt', g the rescaled rigid-rotor impulse response; \
the fit gives mu1 = Delta alpha(lambda_p) Delta alpha(lambda_e) N L I0 and then mu2 = n2 \
(Delta alpha(lambda_p) Delta alpha(lambda_e))^-1 (p. 5796). Kerr coefficient wanted \
(p. 5796): 'n2(omega_e) = (12 pi^2 / n0^2 c) N gamma(3)(omega_e; omega_e, -omega_e, \
omega_e)'; measured: 'n2(omega_e, omega_p) proportional to gamma(3)(omega_p; omega_e, \
-omega_e, omega_p)'. Dispersion, Eq. (3), p. 5796: gamma(3)(omega_s; omega1, omega2, \
omega3) = gamma0 (1 + a omega_L^2 + b omega_L^4 + ...), omega_L^2 = omega_s^2 + omega1^2 + \
omega2^2 + omega3^2; for the pump-probe case omega_L^2 = 2 omega_e^2 + 2 omega_p^2; the \
difference n2(omega_e, omega_p) against n2(omega_e) is < ~6 % for pump and probe longer \
than ~500 nm and at 400/600 nm (p. 5796).

DELTA ALPHA DISPERSION (p. 5796): Delta alpha(omega) ~ Delta alpha(0) + C omega^2 \
(Spackman 1991); Alms et al.'s light scattering for N2 is 'well fit by Delta alpha(0) = \
6.6 x 10^-25 cm3 and C = 3.8 x 10^-57 cm3 s2', rescaled so that Delta alpha(800 nm) \
equals wahlstrand_2012's value; Delta alpha(800)/Delta alpha(0) ~ 1.03, Delta \
alpha(400)/Delta alpha(0) ~ 1.13. Table 1 note b: N2 adjusted for this dispersion; note \
c: not adjusted (Delta alpha(800 nm) of [22] used at all wavelengths) - N2 both ways, O2 \
unadjusted; note d: Ar referenced to the N2 measurements (which N2 column is not \
stated). Neglecting the dispersion changes N2 by at most ~10 % near 400 nm and < 2 % \
elsewhere.

REFERENCE STATE: 'Scaled to Atmospheric Pressure' (Table 1 caption), no temperature: \
101325 Pa, 293.15 K assumed. Note the absolute scale is that of wahlstrand_2012's Delta \
alpha (itself on the ~291-K N2 flow calibration, TC-281).

UNCERTAINTY (p. 5796): the residual of the mu1 fits (standard deviation over x), laser \
power drift, and the propagated uncertainty of Delta alpha from [22]; larger at 2400 nm \
(phase shifts <= ~30 mrad). Level not stated.

PULSES. 40 fs at 800 nm (p. 5795); the OPA pulse durations are not stated (the 2200-nm \
envelope is 'longer and more complex', Fig. 3). Probe central wavelength 600 nm (p. \
5795). Short pulses (< ~50 fs) see mainly the electronic response in N2 and O2, long ones \
(> ~150 fs) mainly the rotational one (p. 5796).

THE [32] COLUMN (Shelton and Rice; computed with Eq. (3) and the ESHG gamma0, a, b of \
[33] = shelton_1990). Check (2026-09-26): Shelton 1990 Table IV's gamma0, A, B \
(library table, N2 57.20, 1.003, 1.852; O2 60.03, 1.112, 4.603; Ar 72.75, 1.066, 2.033) \
with a = A/(2 pi c)^2, b = B/(2 pi c)^4, omega_L^2 = 2 omega_e^2 + 2 omega_p^2 (probe 600 \
nm) reproduce all 18 printed values to +-0.5 % (the printed precision) with one common \
factor, n2 = 0.133 x gamma(10^-63 C^4 m^4 J^-3) x 10^-20 cm2/W; this equals N gamma / (8 \
eps0^2 c) with N the ideal-gas density at 101325 Pa and 293.15 K (0.1331). The self-Kerr \
omega_L^2 = 4 omega_e^2 does not reproduce the 400-nm values (-12 to -16 %). So the \
column is n2(omega_e, omega_p) of the T-convention gamma at 1 atm and ~293 K. use = \
'check'.

PRINTED COEFFICIENTS (formulas below): 'a = 1.8 x 10^-33, 3 x 10^-33 s^2, b = 1.5 x 10^-65, \
1.6 x 10^-65 s^4, and gamma0 = 7.7 x 10^-30, 9.8 x 10^-30 cm^6 W^-1 s^-1 for N2 and Ar'. From \
Shelton's A, B: a(N2) = 2.83e-33 s^2 (printed 1.8e-33: misprint, 2.8 intended - the [32] \
column is only reproduced with 2.83e-33), a(Ar) = 3.00e-33, b(N2) = 1.47e-65, b(Ar) = \
1.61e-65 s^4. The printed gamma0 are in the ratio of Shelton's (0.786), but with the \
paper's n2 = (12 pi^2 / n0^2 c) N gamma they give n2 ten times the [32] column \
(7.6e-19 against 7.6e-20 cm2/W for N2 at 1 atm, 293 K): the gamma0 values or their unit \
are off by a factor 10 (TC-281); not corrected here."""

