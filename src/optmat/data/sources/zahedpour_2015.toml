[[formulas]]
id = "bishop_dispersion_N2"
material = "N2"
equation = "Eq. (3), p. 5796, with the coefficients in the text below it"
printed = "gamma(3)(omega_s; omega_1, omega_2, omega_3) = gamma_0 (1 + a omega_L^2 + b omega_L^4 + ...), omega_L^2 = omega_s^2 + omega_1^2 + omega_2^2 + omega_3^2; 'a = 1.8 x 10^-33 ... s^2, b = 1.5 x 10^-65 ... s^4, and gamma_0 = 7.7 x 10^-30 ... cm^6 W^-1 s^-1 for N2'"
variable = "omega: angular frequencies in s^-1; pump-probe case omega_L^2 = 2 omega_e^2 + 2 omega_p^2; self Kerr 4 omega^2"
state = "gamma per molecule; n2(omega_e) = (12 pi^2 / n0^2 c) N gamma (p. 5796)"
density = "none"
range = "below electronic resonance; used here 400-2400 nm pump, 600 nm probe"
coefficients = { gamma0 = "7.7e-30", a = "1.8e-33", b = "1.5e-65" }
check = "The coefficients are shelton_1990's ESHG gamma0, A, B rescaled to angular frequency (a = A/(2 pi c)^2, b = B/(2 pi c)^4): b reproduces (1.47e-65 from B = 1.852e-20 cm^4), a does not (2.83e-33 from A = 1.003e-10 cm^2; printed 1.8e-33). The paper's own [32] column is reproduced to +-0.5 % only with a = 2.83e-33 (checked 2026-09-26): the printed 1.8 is a misprint for 2.8. gamma0 is 10 times too large for the printed n2 formula (source notes)."
notes = "Reproduced and rescaled from shelton_1990 (Table IV, ESHG fit to gamma^e, He calibration of that paper); Bishop's (1989) form. Not an independent result. Corrected form: a = 2.83e-33 s^2 (from Shelton's A); gamma0 unresolved (factor 10)."

