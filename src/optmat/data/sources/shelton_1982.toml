notes = "Table III (p. 2793): gamma_CH4 by ESHG at the six argon-ion lines 514.5-457.9 nm (the 514.5 nm value is also Table II's). Calibrated against gamma_He = 2.950e-63 C^4 m^4 J^-3 at 514.5 nm, and at each wavelength the calculated gamma_He of the same table (table3_He_calc), 'Calculated value from Ref. 18' (Sitz & Yaris 1968; Table II note d); 'Error estimates exclude the uncertainty of gamma_He used for calibration' (note a), 'thought to be about 1%' (p. 2792). Shelton & Rice 1994 rescale such values to Bishop & Pipin's He. Note c: 'Error estimates exclude the uncertainty of gamma_He'. The authors see a resonance-like feature at 20140 cm^-1 (width ~200 cm^-1, Fig. 5), attributed tentatively to the Delta v = 8 CH-stretch overtone (20520 cm^-1 expected): measured Delta gamma^res/gamma^nonres = +5e-2 against a calculated 1e-10 (pp. 2795-2796). Later ESHG work (shelton_1986_ch4) is the reference for CH4's dispersion."
[datasets.uncertainty]
