citation = "Z. El Helou, S. Churassy, G. Wannous, R. Bacis and E. Boursey, \"Absolute cross sections of ozone at atmospheric temperatures for the Wulf and the Chappuis bands\", J. Chem. Phys. 122, 244311 (2005)"  # codespell:ignore bacis
doi = "10.1063/1.1937369"
library = "Helou_2005_AbsoluteCrossSections"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Fourier-transform absorption (BOMEM DA03, 4 cm^-1 resolution, 600 scans; \
silicon-avalanche detector, and a liquid-nitrogen-cooled InGaAs detector for the \
three lowest Wulf bands) of pure ozone in two White multipass cells: the LASIM \
low-temperature cell (131.3 cm per pass, 4 to 20 passes, 300 to 77 +- 0.5 K, mirrors \
outside the gas) and the Reims cell (99.9 cm per pass + 18 cm, down to 223-225 K). \
Cross section sigma = absorbance x 23844.948 x T / (L p) for a perfect gas (Eqs. 5-8), \
the ozone pressure taken as the mean of the initial and final pressures during the \
decomposition 2 O3 -> 3 O2 (Eqs. 1-4; decomposition kept below 1 % per record). \
Chappuis band 15 500-18 500 cm^-1 at 293, 223, 175 and 144 K (LASIM) and 291 and 225 K \
(Reims); Wulf bands 9000-13 700 cm^-1 at 294, 222 and 150 K (pp. 2-4, 7)."""
notes = """Identity checked on the first page (PDF page 1): the five authors of the \
citation, J. Chem. Phys. 122, 244311 (2005); PDF pages 1-9 = article pages 244311-1 to \
-9. The library copy is the authors' PDF from the Bremen ozone archive (acquisition \
provenance: 'different front-page DOI'); title, authors and journal reference on the \
first page agree. O3 only.

Every value is read from the paper's tables, which give the cross section at the five \
He-Ne laser lines of the Chappuis band and at eight Wulf-band maxima, 'deduced from \
data displayed in' the figures (Table I caption). The spectra themselves are shown \
only in figures (Figs. 5, 6, 8-11): not digitised.

Uncertainty: the bracketed values, '+-0.82 %' for the LASIM cell and '+-0.71 %' for the \
Reims cell + FTS (Ref. 20: their own JQSRT paper, then in press); 'an overall \
uncertainty of about 0.8 %' (p. 8). Level not stated. Anderson's values are '+-1 SD' \
(Table IV, Table VII).

Wavenumbers: FTS wavenumbers, vacuum. The He-Ne lines 15798.01, 16336.12, 16534.93, \
16827.63 and 18393.61 cm^-1 are 632.99, 612.14, 604.78, 594.26 and 543.67 nm in vacuum.

Temperature dependence (the paper's finding): the Chappuis cross section falls as the \
temperature falls, by 1.5-4.1 % from 293 to 223 K and 4.2-6.7 % from 293 to 144 K \
(Tables I, V); the Wulf bands rise, by +91 % at the (0,0) origin and +2 % to -2 % near \
13 000 cm^-1 from 294 to 150 K (Table VIII). The Reims cell confirms the Chappuis fall \
(1.6-3.6 % from 291 to 225 K, Table III).

Misprints (no data affected): Table III labels both rows 'T=225 K'; the first is the \
291 K row (Table IV, and the table's own '(291-225 K)' line). Table II gives the Reims \
cell temperature as 295 K, Tables III-IV as 291 K; the 291 K of Table IV is recorded. \
Table II's reference numbers ('Ref. 14', 'Ref. 13') do not match the reference list \
(Ref. 13 is Inn and Tanaka, Ref. 14 Orphal); the caption names Brion et al. (Ref. 8) \
and the LASIM cell paper (Ref. 20). Table VII's column head prints lambda for sigma.

Repeated rows (checked equal by the extraction): Tables I, II (FTS row), III and VI \
repeat rows of Table IV; Table VIII repeats Table VII's 294 and 150 K columns (its last \
row prints the uncertainties 0.35, Table VII 0.36).

Register: TC-972."""

