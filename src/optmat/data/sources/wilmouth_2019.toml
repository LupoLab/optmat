citation = "D. M. Wilmouth and D. S. Sayres, J. Quant. Spectrosc. Radiat. Transfer 234, 32 (2019)"
doi = "10.1016/j.jqsrt.2019.05.031"
library = "Wilmouth_2019_RayleighScatteringCross"
identity = "VALIDATED"
kind = "measurement"
technique = """Broadband cavity-enhanced spectroscopy (BBCES), 333-363 nm: laser-driven Xe arc \
lamp (Energetiq EQ-99X-FC), 35 cm cavity of two plano-concave mirrors (peak reflectivity \
0.998732 +- 0.000017 at 349.1 nm), 0.3 m Czerny-Turner spectrograph with CCD, calibrated \
on Hg lines. Pure gas filling the cavity, static, 1020-1060 hPa. Mirror reflectivity \
from N2 against He (Eq. 2, the n-based N2 cross section, +-1 %), then each sample's \
extinction against He (Eq. 3). Purity 99.999 % (He, N2, Ar), 99.99 % (CO2, CH4), 99.8 % \
(SF6)."""
notes = """The first of the authors' two BBCES papers: this one covers 333-363 nm, \
wilmouth_2020 (JQSRT 255, 107224) 264-297 nm with the same apparatus and method. They \
are different papers and different data; wilmouth_2020's Eqs. (5) and (7) for CH4 and \
(4) and (6) for SF6 are fitted to both papers' data together, so they are not \
independent of this record's Eq. (4) and of its ratios.

The measured cross sections are shown only in figures (Fig. 2b, 218 wavelengths over \
333-363 nm per gas; Fig. 3, as 1-nm moving averages and as ratios to the n-based values; \
Fig. 4a, CH4's n from them), never tabulated. The text prints (p. 37) the mean ratio of \
the measured to the n-based cross section over 333-363 nm, the n-based values from \
Table 1: Ar 0.998, CO2 0.990, SF6 0.978, CH4 0.778; and (p. 35) the mean 1-sigma \
uncertainty 2.5 % (Ar), 1.9 % (CO2), 1.6 % (SF6), 1.6 % (CH4): the root sum of squares \
of the run-to-run standard deviation, the effective path length (1.3 %, mostly the N2 \
reference cross section), temperature (0.3 %) and pressure (0.1 %). These are common to \
all four gases (one N2 reference) and to wilmouth_2020. The SF6 cross sections were \
raised by 0.1 % (and their uncertainty by 0.1 %) for the 99.8 % purity (air and CF4 \
impurities, p. 35). F_k = 1 for Ar, CH4 and SF6 (spherical, Bridge and Buckingham); CO2 \
F_k = 1.1364 + 2.53e-11 nu^2 (Table 1).

Table 1 (tbl_309d15b8e0de, image checked) gives the n-based formulas at N = 2.5469e19 \
cm^-3 (288.15 K, 101325 Pa, ideal): He, N2 (Bates's UV branch, F_k 1.034 + 3.17e-12 \
nu^2), Ar (Peck & Fisher), CO2 (Bideau-Mehu with Alms's F_k, the corrected 10^3 scale of \
Sneep & Ubachs's Eq. 13), CH4 46662 + 4.02e-6 nu^2 and SF6 71517 + 4.996e-6 nu^2 \
(Sneep & Ubachs's Eqs. 18 and 21). Identical to wilmouth_2020's Table 1, where they \
are recorded as reproduced formulas; not repeated here. The authors correct 'typographical \
errors in several papers in the literature' in them (p. 33) without naming them.

RECONSTRUCTED, NOT PRINTED: the datasets below are band-centre cross sections at 348.0 \
nm, each the printed mean ratio times the n-based cross section of Table 1 at 348.0 nm \
(nu = 28735.6 cm^-1), computed here (2026-09-29): n-based Ar 2.6300e-26, CO2 7.8390e-26 \
(F_k 1.1573), SF6 1.9887e-25, CH4 8.6833e-26 cm^2. They assume the ratio is flat across \
the 30 nm band; for CH4 the ratio of Eq. (4)'s cross section to the n-based one runs \
0.781-0.775 over 333-363 nm (mean 0.778, as printed), so the centre value stands for the \
band to 0.4 %; Eq. (4) itself gives 6.7552e-26 at 348.0 nm against the reconstruction's \
6.7556e-26. They are checks (validators), never fitted (TC-712)."""

