check = "Through Eq. (1) (N = 2.5469e19 cm^-3, F_k = 1) its cross sections are 0.7780 of Table 1's CH4 n-based ones on average over 333-363 nm (0.781-0.775): the printed mean ratio 0.778 (p. 37). Against wilmouth_2020's Eq. (5) (UV only) the cross sections differ by -0.6 to +0.4 %, against its Eq. (7) by -1.1 to -0.4 % (computed 2026-09-29). Equation image eq_44add8785b39 checked."
notes = "The authors' fit, A + B nu^2 by non-linear least squares (R^2 = 0.993), to n from their CH4 cross sections, Eq. (1) solved for n with F_k = 1, 'scaled to 288.15 K and 101,325 Pa' (p. 37): an ideal-gas density (N = 2.5469e19 cm^-3, Table 1 note a). A scattering-derived n, not a refractive-index measurement. Superseded for 250-650 nm by wilmouth_2020's Eq. (7), which includes these data. 'We recommend using the dispersion relation derived in this work (Eq. (4)) for CH4 in the UV-A spectral region' (p. 39); uncertainty about 1.6 % in cross section."
