citation = "K. P. Birch, \"Precise determination of refractometric parameters for atmospheric gases\", J. Opt. Soc. Am. A 8, 647 (1991)"
doi = "10.1364/JOSAA.8.000647"
library = "Birch_1991_PreciseDeterminationRefractometric"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """NPL automatic fringe-counting air refractometer at 633 nm (He-Ne laser; \
632.99 nm in the Table 2 caption) with a dual-compartment Pyrex cell in a stirred \
water bath (four calibrated platinum resistance thermometers), quadrature signals \
analysed by Heydemann's method; each gas flowed through the cell and was measured \
repeatedly near atmospheric pressure (99.8-103.7 kPa) at about 14.66 and 19.5 degrees \
C; pressure from a Ruska DDR6000 barometer; the refractometer checked against Edlen's \
equation with dry air before each gas (pp. 647-648)."""
notes = """Reduction (p. 648): the density d = p m/(Z R T) (Eq. 2.1) with the \
compressibility factor Z from Dymond and Smith's compilation of virial coefficients \
(real gas; the virial contribution to the uncertainty 'of the order of 4 parts per \
1e5'), molar masses from the BIPM; the molar refraction [R] = R' M from the \
Lorentz-Lorenz formula (Eqs. 2.2-2.3), printed in 1e-30 m^3, i.e. per molecule (M the \
molecular mass): [R] = N_A alpha/(3 eps0) / N_A; alpha-bar = 3 [R]/(4 pi) (Eq. 2.4) is \
a polarizability volume in 1e-30 m^3 = A^3. 'The uncertainty at the 99 % level in the \
values given for density, molar refraction, and molecular polarizability was calculated \
to be <= +-2.0 parts per 1e4 for all the gases except for nitrous oxide, for which it \
was found to be +-2.5 parts per 1e4' (p. 648). Table 2's n - 1 at 101 325 Pa and 15 \
degrees C follow from Eq. (2.5) with the same densities, 'shown with the estimated \
uncertainty at the 99 % level' (p. 649). Wavelength: 632.99 nm, a vacuum wavelength \
(the He-Ne line); refractivities are not reduced with Edlen's air formula.

Checks (2026-09-24): every run's [R] follows from its printed n - 1 and density to 1e-4 \
or better except helium, whose printed densities 0.17071 and 0.17070 kg/m^3 give [R] \
0.8671 and 0.8675 instead of the printed 0.8666 and 0.8670; the printed [R] follow \
from densities 0.17081 and 0.17080, which is also what the ideal gas with B = 11.9 \
cm^3/mol gives at the run's p and T. So the helium density column is probably \
misprinted (1e-4 kg/m^3) and [R] right; the density is not extracted (printed cells \
only). The means and alpha-bar follow from the runs; Table 2's own values follow from \
the means with virial densities to within the rough second virial coefficients used \
for the check (1-3e-4). The first CO2 run's pressure is printed '10 1188.6' (image), \
i.e. 101 188.6 Pa.

Helium: Birch's [R] = 0.8668e-30 m^3 (A_R = 0.52200 cm^3/mol) is 3.4e-3 above the ab \
initio value (puchalski_2016: 0.52026369 cm^3/mol at 632.99 nm), '1.1e-7 in n at 1 \
atm' (stone_2004, which calls it 'seriously inconsistent'); puchalski_2016 reproduces \
it as 0.5220(3) with an uncertainty it assumes. Neon: 'the range of the derived values \
for the molar refraction of neon was larger than that expected ... may have been \
attributable to a low-level contamination' (p. 649). The paper gives no refractivity \
virial coefficients (none are measured). N2O: [R] 12.4506 vs the additive estimate 10.7 \
(p. 649, discussion only). The CO2 correction to air refractivity, 1.45 (measured) and \
1.48 (Edlen) x 1e-10 per ppm of excess CO2 (p. 649). Air (Table 3: specific \
refraction 1.5040e-4 m^3/kg, molar refraction 7.2338e-30 m^3; the composition table) is \
not a curated species; the Lorentz-Lorenz formula and additivity are found valid for \
air at 20-115 kPa, 10-30 degrees C."""

