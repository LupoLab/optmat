abscissa_unit = "eV"
use = "check"
notes = "Text, p. 4656: epsilon_2 of silver at 'the 4.5-eV maximum' is 3.77 (Kramers-Kronig analysis of this paper's reflectance with Weaver's absorptance below 2.8 eV; which sample, film or crystal, is not said). The energy is the paper's round label of the maximum, not a measured abscissa: a check on the height of silver's interband maximum near 4.5 eV, not a point to fit. (Johnson and Christy's Table I gives 2nk = 3.75 at 4.49 eV and 3.79 at 4.61 eV.)"
[datasets.parameters]
technique = "Kramers-Kronig analysis of synchrotron reflectance (3.5-30 eV)"
