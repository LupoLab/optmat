citation = "O. Kittelmann and J. Ringling, Opt. Lett. 19, 2053 (1994)"
doi = "10.1364/ol.19.002053"
library = "Kittelmann_1994_IntensityDependentTransmission"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Intensity-dependent energy transmission at 193 nm: linearly polarized \
1.5 mJ, 0.8 ps pulses (sech^2, Delta lambda = 0.25 nm FWHM) from an ArF gain module, \
< 10 % ASE, through a 5 mm aperture and focused by a 60 cm MgF2 lens; the samples are \
the output windows of an evacuated tube placed behind the focus (to avoid \
self-focusing damage), and the intensity (1 to 300 GW/cm2) is varied by the tube \
length. Energies by pyroelectric detectors, normalised by a 10 % reflection from a \
MgF2 beam splitter; beam radius by knife-edge scans in dry nitrogen. Every point is \
an average of 20 shots within a +-10 % energy window."""
notes = """Table 1 (p. 2) is transcribed in full: probe (sample) thickness, band gap, \
beta at 193 nm fitted for a flat-topped and for a Gaussian beam profile, and beta at \
248 nm 'taken from Ref. 3' (taylor_1988), for MgF2, CaF2, BaF2 and fused silica. The \
table is published with merged header cells (JSON only); checked against the image: \
all cells agree. Sample thicknesses (cm): MgF2 0.5, CaF2 0.5, BaF2 0.3, fused silica \
0.4 (kept in the files' printed column). Grades, suppliers and crystal orientations \
are not stated.

Definition of beta (p. 2): dI(z,r,t)/dz = -alpha I - beta I^2, with alpha neglected \
('the linear absorption in this spectral range is very small', from spectrophotometer \
measurements). The energy transmission, 'taking into account reflection losses R at \
the surface of the sample', for a Gaussian spatial profile (1/e^2 radius w) and a sech^2 \
pulse of FWHM tau is Eq. (1): T = (1 - R) pi w^2 / (2 beta L E_in) int dt ln[A sech^2(1.76 \
t/tau) + 1], A = 1.76 beta L E_in (1 - R)/(pi w^2 tau); so reflection losses are removed. \
Footnote a: 'Assuming a sech^2 temporal pulse shape, the data were fitted both for a \
flat-topped and a Gaussian beam profile.' The knife-edge scans showed a 'nearly \
Gaussian' radial profile with no noticeable flattening (p. 2), so the Gaussian fit is \
the paper's result (primary here) and the flat-topped fit a check (it is the profile \
Taylor et al. assumed at 248 nm). The B integral was 'well below 1' and no spectral \
broadening was seen.

Uncertainty (p. 3 and footnote b): 'The absolute uncertainty in beta is approximately \
50 %' (the flattening of the pulse in the input window, ~10 %, which makes the values \
'somewhat too high'; the beam radius, 20 %; the pulse duration, 10 %; the detector \
calibration, 10 %), 'whereas the relative uncertainty should be lower than 20 %'. \
Levels not stated.

The band gaps are not attributed; they equal taylor_1988's Table 1 values for the same \
four materials (11.8, 10.0, 9.1, 7.8 eV) and are marked reproduced from it (an \
inference). The text quotes a band gap of 'approx 6 eV' for CdF2 when recalling Liu et \
al.'s result (p. 3); CdF2 is not registered and nothing is taken for it.

Other statements (p. 3): the fused-silica beta agrees with Mizunami and Takagi's \
fibre value at 219 nm (Opt. Lett. 19, 463 (1994); not in the library); the CaF2 beta \
is about ten times that of Mossavi et al. at 193 nm (Opt. Lett. 18, 435 (1993)); a \
MgF2 output window showed an optical-density increase of 0.03 at 193 nm after long \
use (colour centres). Two-photon-excited self-trapped-exciton luminescence of BaF2 \
(~280 nm) and CaF2 (~310 nm) is quadratic in intensity up to ~10 GW/cm2 (Fig. 3; \
figure only, not digitised)."""

