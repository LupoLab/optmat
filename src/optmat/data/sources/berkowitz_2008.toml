quantity = "absorption_cross_section"
unit = "Mb"
abscissa_unit = "angstrom"
wavelength_medium = "vacuum"
use = "check"
notes = "p. 8: the Hartley band 'has a high cross section between 2100 and 3000 A with a maximum of 11.73 Mb at 2555 A (4.85 eV)'. No source, temperature or medium stated; vacuum is assumed (hc/4.85 eV = 2556 A; the air/vacuum difference, 0.8 A, is below the precision of a band maximum). A quoted value with no source cited: 'check'."

