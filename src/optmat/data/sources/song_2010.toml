id = "qct_predissociation_O2"
material = "O2"
table = "text"
quantity = "dissociation_time"
unit = "fs"
abscissa = "none"
use = "check"
points = [["predissociation", "", "100"]]
notes = "p. 3093 (Fig. 8a): the quasi-classical trajectories on the Morse curve of O2**((O2+ b 4Sigma_g-) 4p pi_u, 3Pi_u), started at 1.21 A with zero mean velocity, reach the crossing with the dissociating curve in 'about 100 fs' (the average moving time). Morse curves built from the ion cores' constants and NIST atomic limits (section 3.3.2). No uncertainty."
[datasets.uncertainty]
level = "not stated"
[datasets.parameters]
channel = "O2**((O2+ b 4Sigma_g-) 4p pi_u, 3Pi_u) -> crossing to the dissociating superexcited curve"
kind = "calculated"
method = "quasi-classical trajectories on empirical Morse curves"

