use = "primary"
notes = "p. 1584: the recommended A_eps,273K = 2.03065 +- 0.00017 cm^3/mol (one standard uncertainty; 'the uncertainty bound we assign to these recommended values encompasses the standard uncertainties obtained by each method'), the weighted average of Method 1 (2.03075) and Method 2 (2.0307 at the 273 K isotherm), referred to 273.16 K. Static (2 kHz-7.2 GHz), dielectric: the electronic polarizability of normal H2 averaged over its rotational populations at 273.16 K. Relative to helium's ab initio A_eps. Row = temperature in K."
