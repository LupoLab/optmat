[[formulas]]
id = "eq9_method1"
material = "H2"
equation = "Eq. (9), p. 1582, with the Method 1 parameters, p. 1583"
printed = "(eps_r^calc - 1)/(eps_r^calc + 2) = A_eps,273K rho (1 + b_eps rho + c_eps rho^2) + A_tau rho (T/273.16 K - 1); A_eps,273K = 2.03075 +- 0.00001 cm^3 mol^-1, b_eps = 0.0636 +- 0.0015 cm^3 mol^-1, A_tau = 0.00599 +- 0.00017 cm^3 mol^-1 (c_eps = 0, not significant)"
variable = "rho: molar density in mol/cm^3 from Leachman et al.'s equation of state for normal H2 (REFPROP 8.0); T in K; static (2 kHz-7.2 GHz) relative permittivity"
range = "273.203 and 293.213 K, 0.1-6.5 MPa (Table 1)"
coefficients = { A_eps_273K = "2.03075", A_eps_273K_sigma = "0.00001", b_eps = "0.0636", b_eps_sigma = "0.0015", A_tau = "0.00599", A_tau_sigma = "0.00017", c_eps = "0" }
check = "Reproduces Table 1's epsilon_r - 1 to 1-90 ppm at 1.0 MPa (273.203 K), 225-240 ppm at 1.5 MPa (293.213 K), about 400 ppm at 2.5 MPa, and 0.04-0.14 % at 0.1 MPa (the four printed digits), with densities from p = rho RT(1 + B rho), B = 13.87 + b_eps and 14.31 + b_eps cm^3/mol (the paper's Method 2 B - b_eps): the rise with pressure is the third density virial coefficient the check leaves out. Checked 2026-09-27."
notes = "The authors' recommendation for representing the epsilon_r(p, T) of Table 1 (p. 1584). The uncertainties are statistical; the parameters depend on the equation of state (with Kunz et al.'s GERG-2004: A_eps,273K = 2.03042, b_eps = 0.0650 +- 0.0019, A_tau = 0.00627 +- 0.00017 cm^3/mol, p. 1583), on the number of free parameters and on the objective function. b_eps is relative to A_eps (Eq. 1): B_eps = A_eps b_eps."

[[formulas]]
id = "eq9_recommended"
material = "H2"
equation = "Eqs. (1), (9), p. 1582, with the recommended values, pp. 1584-1585"
printed = "A_eps(T) = A_eps,273K + A_tau (T/273.16 K - 1); A_eps,273K = 2.03065 +- 0.00017 cm^3 mol^-1, A_tau = 0.0061 +- 0.0014 cm^3 mol^-1; b_eps = 0.03 +- 0.05 cm^3 mol^-1 over 273 to 293 K"
variable = "T in K; A_eps the zero-density molar polarizability; b_eps the second dielectric virial coefficient relative to A_eps (Eq. 1)"
range = "273-293 K"
coefficients = { A_eps_273K = "2.03065", A_eps_273K_sigma = "0.00017", A_tau = "0.0061", A_tau_sigma = "0.0014", b_eps = "0.03", b_eps_sigma = "0.05" }
check = "At 293.213 K gives A_eps = 2.03110, Method 2's 2.0311 +- 0.0001; A_tau/(273.16 K x A_eps) = 1.10e-5 K^-1, the abstract's dalpha_e/dT = alpha_e x (1.1 +- 0.3) x 10^-5 K^-1; with Eq. (9) it reproduces Table 1 as eq9_method1 does to within 60 ppm more (computed 2026-09-27). One standard uncertainty (the bound encompassing both methods)."
notes = "The recommended molecular properties (weighted average of Methods 1 and 2): 'for the purpose of estimating the molecular properties of H2' (p. 1584). b_eps = 0.03 +- 0.05 cm^3/mol corresponds to B_eps = A_eps b_eps = 0.06 +- 0.10 cm^6/mol^2 (computed, not printed), 'a property that has not yet been calculated' (abstract)."
