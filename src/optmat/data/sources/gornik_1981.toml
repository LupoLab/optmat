photons = 2
frequency_scale = "transition"
width = "not stated"
frequency_variable = "ordinary"
perturber = "self"
pressure_range = "1e-3 to 1.5 bar (Fig. 6)"
method = "slope of the observed linewidth against pressure (Fig. 6), not deconvolved from the laser profile"
