notes = "p. 72: 'the pressure dependence of the linewidth in Fig. 6 (~25 MHz/Torr)', 1S0 -> 6p[1/2]0, the observed width (laser 18 GHz, not deconvolved; the authors decline to give the broadening parameter 2 gamma / N); approximate. A check: it agrees with hawkins_1980's 25 +- 15 MHz/Torr, as the paper says."
[datasets.uncertainty]
