use = "primary"
notes = "Table II, low-resolution (1 eV FWHM) dipole (e,e) absolute df/dE, 24.6-180 eV (153 rows), in 1e-2 /eV; TRK-normalized, independent of optical measurements. Uncertainty not stated (see the source notes for Samson et al.'s comparison)."

