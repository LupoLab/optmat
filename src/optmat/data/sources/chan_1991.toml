citation = "W. F. Chan, G. Cooper and C. E. Brion, \"Absolute optical oscillator strengths for the electronic excitation of atoms at high resolution: Experimental methods and measurements for helium\", Phys. Rev. A 44, 186 (1991)"
doi = "10.1103/PhysRevA.44.186"
library = "Chan_1991_AbsoluteOpticalOscillator"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Dipole (e,e) electron-energy-loss spectroscopy at negligible momentum transfer: \
a low-resolution spectrometer (8000 eV impact energy, 0 degrees, 1 eV FWHM, known \
Bethe-Born factor) gives the absolute df/dE of helium from 20 to 180 eV by Bethe-Born \
conversion and Thomas-Reiche-Kuhn normalization to S(0) = 2 (4.65 % above 180 eV \
estimated from a fit A E^-B, B = 2.5583, to 72-180 eV); a high-resolution double \
hemispherical spectrometer (3000 eV, 0.048-0.270 eV FWHM), with its relative Bethe-Born \
factor fitted to the ratio with the low-resolution data at 28-60 eV (Eq. 19) and \
extrapolated below 25 eV, normalized at 30 eV (and at 75 eV for the resonance region), \
gives the discrete oscillator strengths 1 1S -> n 1P, n = 2-7, by peak integration \
(pp. 195-201)."""
notes = """Energies are energy losses (photon energies) in eV; the 1 1S -> 2 1P line at \
21.218 eV calibrates the scale (p. 196). No photon flux or target density is measured: \
the absolute scale rests on the TRK sum rule. The low-resolution table is cited in the \
text as 'Table I' (p. 196), a misprint for Table II. The low-resolution df/dE at 1 eV \
FWHM near threshold (24.6-25.5 eV) may contain unresolved high-n discrete lines; the \
2snp resonances near 60 eV are smeared (60.0 eV: 1.61e-2 /eV). No uncertainty is stated \
for Table II. Samson et al. (1994, samson_1994): Chan's data 'tend to lie within 2 to 5 % \
of the present data from threshold to 75 eV', within +-2 % at 67-110 eV, 'Towards \
higher energy their results tend to be too high'. Conversion: 1 Mb = 1.0975e-2 /eV of \
df/dE (p. 187).

Discrete oscillator strengths (Table III, p. 200): 'The uncertainties quoted represent \
the scatter in the measurements made at different resolutions. The absolute \
uncertainty is estimated to be ~5 %.' The total to the ionization threshold, 0.431, is \
printed with '(0.0006)' (probably a misprint: its n = 2 term alone carries 0.007; \
Samson et al. quote 0.431 +- 0.02); it and the totals of Dalgarno and Parkinson (0.424) \
and Backx et al. (0.421) are not extracted (not lines). The table gives no transition \
energies; the rows use the principal quantum number n as the index (as berkowitz_1997, \
which reproduces the present column and prints the energies). Autoionizing resonance \
maxima (sp,2n+) 1P, n = 2-5: 60.150, 63.655 (printed '63,655'), 64.465, 64.820 eV (p. \
202; figures only otherwise). No sum rules S(k) other than the TRK normalization S(0) = \
2 are given.

Errata (Table III, theory rows): Green, Johnson and Kolchin's 7 1P value and Schiff and \
Pekeris's 2 1P and 3 1P values are misprinted (see the errata)."""

