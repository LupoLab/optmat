[[formulas]]
id = "eq3_molar_mass"
equation = "Eqs. (2)-(4), p. 150, with Table 1"
printed = "M_a = sum x_i M_i / sum x_i (Eq. 3) = 28.96546 x 10^-3 kg mol^-1; with a measured x_CO2: M_a = [28.96546 + 12.011 (x_CO2 - 0.0004)] x 10^-3 kg mol^-1 (Eq. 4); x_O2 + x_CO2 = 0.20979 mol mol^-1 = S (Eq. 2)"
variable = "x_CO2: mole fraction of carbon dioxide in dry air (mol/mol); M_a: molar mass of dry air"
range = "dry air of the Table 1 composition, x_CO2 near 0.0004"
coefficients = { M_a = "28.96546e-3", dM_dxCO2 = "12.011e-3", x_CO2_ref = "0.0004", S = "0.20979" }
check = "Table 1's x_i and M_i give sum x_i M_i/sum x_i = 28.965456 x 10^-3 kg/mol (sum x_i = 0.9999971), the printed 28.96546; 12.011 = M_CO2 - M_O2 = 44.01 - 31.9988 = 12.0112 (checked 2026-09-27)."
notes = "The molar mass of the CIPM-2007 dry air; Eq. (4) moves CO2 against O2 at fixed S (Eq. 2). Air is not a material: this formula is recorded for review (solprop's air)."

[[formulas]]
id = "eq5_density"
equation = "Eqs. (1), (5a), (5b), pp. 150-151"
printed = "rho_a = (p M_a/(Z R T)) [1 - x_v (1 - M_v/M_a)] (Eq. 1); rho_a/(10^-3 kg m^-3) = [28.96546 + 12.011 (x_CO2 - 0.0004)]/8.314472 x (p/(Z T)) (1 - 0.3780 x_v) (Eq. 5a) = [3.483740 + 1.4446 (x_CO2 - 0.0004)] (p/(Z T)) (1 - 0.3780 x_v) (Eq. 5b); R = 8.314472(15) J mol^-1 K^-1; M_v = 18.01528(17) x 10^-3 kg mol^-1; 1 - M_v/M_a = 0.3780"
variable = "p: pressure in Pa; T = 273.15 + t/degrees C, the thermodynamic temperature in K; x_v: mole fraction of water vapour (Appendix A, formula appendix_a); Z: compressibility factor (Appendix A); rho_a in 10^-3 kg m^-3 as written (i.e. g m^-3 for p in Pa)"
range = "600-1100 hPa, 15-27 degrees C (Appendix A.3)"
coefficients = { M_a = "28.96546", dM_dxCO2 = "12.011", R = "8.314472", R_sigma = "0.000015", c0 = "3.483740", c1 = "1.4446", x_CO2_ref = "0.0004", water = "0.3780", M_v = "18.01528" }
check = "28.96546/8.314472 = 3.483740 (5b's constant, checked); 12.011/8.314472 = 1.4446; 1 - 18.01528/28.96546 = 0.37803 (0.3780 printed). At 20 degrees C, 101 325 Pa, x_v = 0, x_CO2 = 0.0004, with appendix_a's Z = 0.99964: rho_a = 1.20456 kg/m^3 (computed; the paper prints no worked example). Checked 2026-09-27."
notes = "Combined relative standard uncertainty of the formula itself 22e-6 (Table 2), to which the measured inputs' uncertainties are added with Eq. (6)'s sensitivities. The coefficient 0.3780 is treated as constant; the missing term is about 0.26 rho_a x_v (0.0004 - x_CO2) (p. 152). The density of moist air, not an optical quantity: recorded for the air model."

[[formulas]]
id = "appendix_a"
equation = "Eqs. (A1.1)-(A1.4), Appendix A, pp. 153-154"
printed = "p_sv = 1 Pa x exp(A T^2 + B T + C + D/T), A = 1.2378847 x 10^-5 K^-2, B = -1.9121316 x 10^-2 K^-1, C = 33.93711047, D = -6.3431645 x 10^3 K (A1.1); f = alpha + beta p + gamma t^2, alpha = 1.00062, beta = 3.14 x 10^-8 Pa^-1, gamma = 5.6 x 10^-7 K^-2 (A1.2); x_v = h f(p, t) p_sv(t)/p = f(p, t_d) p_sv(t_d)/p (A1.3); Z = 1 - (p/T)[a0 + a1 t + a2 t^2 + (b0 + b1 t) x_v + (c0 + c1 t) x_v^2] + (p^2/T^2)(d + e x_v^2), a0 = 1.58123 x 10^-6 K Pa^-1, a1 = -2.9331 x 10^-8 Pa^-1, a2 = 1.1043 x 10^-10 K^-1 Pa^-1, b0 = 5.707 x 10^-6 K Pa^-1, b1 = -2.051 x 10^-8 Pa^-1, c0 = 1.9898 x 10^-4 K Pa^-1, c1 = -2.376 x 10^-6 Pa^-1, d = 1.83 x 10^-11 K^2 Pa^-2, e = -0.765 x 10^-8 K^2 Pa^-2 (A1.4)"
variable = "T in K, t in degrees C, p in Pa; h the relative humidity (0-1), t_d the dew-point temperature"
range = "600-1100 hPa, 15-27 degrees C (Appendix A.3)"
coefficients = { A = "1.2378847e-5", B = "-1.9121316e-2", C = "33.93711047", D = "-6.3431645e3", alpha = "1.00062", beta = "3.14e-8", gamma = "5.6e-7", a0 = "1.58123e-6", a1 = "-2.9331e-8", a2 = "1.1043e-10", b0 = "5.707e-6", b1 = "-2.051e-8", c0 = "1.9898e-4", c1 = "-2.376e-6", d = "1.83e-11", e = "-0.765e-8" }
check = "No worked values are printed. Computed (2026-09-27): p_sv(20 degrees C) = 2339 Pa; Z(20 degrees C, 101 325 Pa, x_v = 0) = 0.999643. The constants are unchanged from CIPM-81/91 (p. 153); not checked against a printed value."
notes = "The interpolating formulas for x_v and Z of the CIPM-81/91 equation, 'listed here for completeness' (p. 153). Z's uncertainty is dominated by the second virial coefficient of dry air (15e-6, Table 2)."
