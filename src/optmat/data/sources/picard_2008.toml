citation = "A. Picard, R. S. Davis, M. Gläser and K. Fujii, \"Revised formula for the density of moist air (CIPM-2007)\", Metrologia 45, 149 (2008)"
doi = "10.1088/0026-1394/45/2/004"
library = "Picard_2008_RevisedFormulaDensity"
identity = "VALIDATED_WITH_WARNINGS"
kind = "compilation"
technique = """The CIPM-2007 equation of state for moist air, approved by the 96th CIPM \
meeting (November 2007): the CIPM-81/91 equation with two constants amended, the mole \
fraction of argon (from the KRISS mass-spectrometric and LNE gas-chromatographic \
determinations against gravimetric standards) and the molar gas constant (CODATA), and \
an uncertainty evaluation following the GUM. The composition of dry air is a reference \
(conventional) composition, the mole fractions of the US Standard Atmosphere 1976 with \
new argon, the default carbon dioxide and the oxygen that follows from it (pp. \
149-151)."""
notes = """Identity checked against the first page (Metrologia 45 (2008) 149-155, \
published 18 February 2008). Page numbers are the journal's: p. = pdf page + 148.

THE COMPOSITION (Table 1, p. 151; image checked digit by digit). Mole fractions of the \
twelve constituents of dry air, recorded as mole_fraction datasets with \
parameters.mixture = 'dry air (CIPM-2007)', one per constituent (all twelve are \
registered gases; no material is registered for air, which is a mixture, TC-543). N2 \
0.780848, O2 0.209390, Ar 0.009332, CO2 0.00040, Ne 18.2e-6, He 5.2e-6, CH4 1.5e-6, Kr \
1.1e-6, H2 0.5e-6, N2O 0.3e-6, CO 0.2e-6, Xe 0.1e-6. Every printed contribution x_i M_i \
is reproduced by the printed x_i and M_i to the last digit (e.g. 0.780848 x 28.0134 = \
21.874207), which confirms each digit of the major fractions; sum x_i = 1 - 2.9e-6, as \
the paper says (p. 150: 'presumably due to minor rounding errors in [12]', hence the \
normalisation in Eq. 3); M_a = sum x_i M_i/sum x_i = 28.96546 g/mol, as printed \
(computed 2026-09-27). Which values are whose: N2, O2, CO2 and Ar are set by this paper \
(Ar measured by KRISS and LNE, N2 the remainder, CO2 the conventional default, O2 = S - \
x_CO2); the eight minor constituents are the US Standard Atmosphere 1976's, unchanged \
(reproduced). Water vapour is not a constituent of dry air: moist air enters through x_v \
(Eq. 1, Appendix A).

THE MOLAR MASSES of Table 1 (10^-3 kg/mol: N2 28.0134, O2 31.9988, Ar 39.948, CO2 44.01, \
Ne 20.18, He 4.0, CH4 16.0, Kr 83.8, H2 2, N2O 44, CO 28, Xe 131) are IUPAC 2005's [17], \
'rounded for convenience' from CO2 on (p. 150); no quantity, kept here and in the \
formula eq3_molar_mass.

UNCERTAINTY (Table 2, p. 152, standard uncertainties per the GUM, assuming x_CO2 known \
exactly). Parameter, standard uncertainty (1e-6 of its unit), relative contribution to \
u(rho_a)/rho_a (1e-6): R, 15 (in 8.314472), 1.7; M_N2, 200 (in g/mol), 5.4; M_O2, 300, \
2.2; M_Ar, 500, 0.2; M_CO2, 500, 0.0; x_Ar, 3 umol/mol, 1.2; S = x_O2 + x_CO2, 60 \
umol/mol, 8.3; Delta x_O2, 60, 8.3 (type A); Delta x_CO2, 60, 8.3 (type A); Z, 15 (1e-6), \
15. Quadratic sums 18.2 (type B), 11.7 (type A); combined standard uncertainty of the \
formula itself 22e-6 relative. Only x_Ar has a standard uncertainty of its own (the \
dataset x_Ar); the oxygen components are in x_O2's notes. The sensitivities to the \
measured inputs (Eq. 6, p. 152): +1e-5 Pa^-1 u(p), -4e-3 K^-1 u(T), -9e-3 u(h), -3e-4 \
K^-1 u(t_d), +0.4 u(x_CO2) (relative).

THE DENSITY FORMULA (Eqs. 1-5, p. 150-151; Appendix A, pp. 153-154) is recorded as \
formulas without a form: the composition's molar mass (Eqs. 3-4), the density (Eqs. \
5a/5b), and Appendix A's saturation vapour pressure (A1.1), enhancement factor (A1.2), \
water-vapour mole fraction (A1.3) and compressibility factor (A1.4), valid for 600-1100 \
hPa and 15-27 degrees C (Appendix A.3). R = 8.314472(15) J/(mol K), 'recommended by \
CODATA 2006 [15]' (p. 150; the reference list's [15] is Mohr and Taylor's CODATA 2002, \
whose R is the same number). The formula omits a term of about 0.26 rho_a x_v (0.0004 - \
x_CO2) (p. 152). CIPM-2007 against CIPM-81/91 (3.48349 in Eq. 5b): +72e-6 relative, from \
x_Ar (+67.7e-6) and R (+4.6e-6) (p. 152); 3.483740/3.48349 - 1 = 71.8e-6 (computed).

OTHER VALUES (notes only): the gravimetric-minus-formula air density difference that \
prompted the revision, 6.4e-5 with standard uncertainty 1.2e-5 (p. 149; Picard et al. \
2004, Euromet project 144, Madec et al. 2007)."""


[[datasets]]
id = "x_N2"
material = "N2"
file = "N2/picard_2008__x_N2.csv"
table = "tbl_b2ed47a88f5d"
quantity = "mole_fraction"
unit = "1"
abscissa = "none"
use = "primary"
notes = "Table 1 (p. 151): x_N2 = 0.780848 mol/mol in the reference composition of dry air of the CIPM-2007 equation. N2: 'not directly measured. It is simply determined as the remainder when the mole fractions of all other components of dry air have been subtracted from 1' (p. 150); it changed with the new argon value. No uncertainty of its own is given (Table 2 budgets S, x_Ar and the molar masses)."
[datasets.parameters]
mixture = "dry air (CIPM-2007)"

[[datasets]]
id = "x_O2"
material = "O2"
file = "O2/picard_2008__x_O2.csv"
table = "tbl_b2ed47a88f5d"
quantity = "mole_fraction"
unit = "1"
abscissa = "none"
use = "primary"
notes = "Table 1 (p. 151): x_O2 = 0.209390 mol/mol in the reference composition of dry air of the CIPM-2007 equation. O2: x_O2 = S - x_CO2 with S = x_O2 + x_CO2 = 0.20979 mol/mol (Eq. 2, p. 150; Appendix B), the value of S accepted from CIPM-81 and -81/91 [1, 2], so 0.209390 = 0.20979 - 0.00040 (checked). Uncertainty (Table 2, Appendix B): u(S) = 60 umol/mol ('each determination is within 50 umol/mol of the accepted value for S', KRISS's two air samples of different continents and elevations, each with u = 60 umol/mol) and a further u(Delta x_O2) = 60 umol/mol for oxygen changes not anticorrelated with CO2 (standard uncertainties; the earlier estimate of 170 umol/mol rested on unconfirmed nineteenth-century data). No single u(x_O2) is printed: not recorded as the dataset's uncertainty."
[datasets.parameters]
mixture = "dry air (CIPM-2007)"

[[datasets]]
id = "x_Ar"
material = "Ar"
file = "Ar/picard_2008__x_Ar.csv"
table = "tbl_b2ed47a88f5d"
quantity = "mole_fraction"
unit = "1"
abscissa = "none"
use = "primary"
notes = "Table 1 (p. 151): x_Ar = 0.009332 mol/mol in the reference composition of dry air of the CIPM-2007 equation. Ar: 'x_Ar = 9.332(3) mmol/mol' (pp. 150, 153), the new value of CIPM-2007: 'A weighted average gives essentially the KRISS result' (KRISS 2002, Park et al. [11]: 9.332(3) mmol/mol by mass spectrometry; LNE 2006, Sutour et al. [14]: 9.330(16) by gas chromatography; both calibrated with gravimetric synthetic standards). CIPM-81 and -81/91 used 9.17 mmol/mol; atmospheric science had kept Moissan's 1903 9.34. The change raises the CIPM air density by 67.7e-6 (p. 152). Standard uncertainty 3 umol/mol (Table 2, the GUM evaluation)."
[datasets.uncertainty]
absolute = 0.000003
level = "standard"
[datasets.parameters]
mixture = "dry air (CIPM-2007)"

