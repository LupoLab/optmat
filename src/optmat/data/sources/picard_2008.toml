notes = "Table 1 (p. 151): x_CO2 = 0.00040 mol/mol in the reference composition of dry air of the CIPM-2007 equation. CO2: 'the average mole fraction of carbon dioxide in laboratory air, x_CO2, has a default value of 0.00040' (p. 150), 'as in the previous CIPM formulas': a conventional reference value, not a measurement. The formula is to be used with a measured x_CO2 where available (Eq. 4); otherwise an uncertainty for the assumption must be added (Eq. 6, 0.4 u(x_CO2) relative in density): Euromet project 503 found 440 umol/mol on average among twelve laboratories, with maxima averaging 660 and reaching 1000 umol/mol (p. 152). No uncertainty given for the default."
[datasets.parameters]
