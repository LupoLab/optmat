[[errata]]
dataset = "alpha_N2"
row = "5148"
column = "x"
printed = "5148"
corrected = "5145"
reason = "The argon-ion line used is 5145 A (p. 3, 'Depolarization ratios were measured at 4579, 4880, and 5145 A'); every other molecule of Table I prints 5145 in that row."
evidence = "Table I image checked: nitrogen's row reads 5148. The 3 A difference changes the Landolt-Bornstein alpha by about 4e-5 A^3 (not 4e-4, (second reading, 2026-09-25; TC-157)), below its printed precision."
