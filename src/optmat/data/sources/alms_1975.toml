unit = "angstrom3"
abscissa_unit = "angstrom"
wavelength_medium = "standard_air"
use = "reproduced"
reproduced_from = ["Landolt-Bornstein, Zahlenwerte und Funktionen (Springer, Berlin, 1962), Vol. 2, Pt. 8, p. 871"]
excluded_rows = { "inf" = "zero-frequency extrapolation of the optical values (electronic only, without the vibrational part; method not stated)" }
notes = "Table I, alpha column. Uncertainty: the paper's range 0.5-2.0 % (p. 3), its upper end taken as a bound."
[datasets.uncertainty]
relative = 0.02
level = "bound"

