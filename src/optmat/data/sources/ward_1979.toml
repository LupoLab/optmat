file = "H2/ward_1979__chi3_H2.csv"
table = "tbl_d1cb8fd65ca1"
quantity = "hyperpolarizability"
unit = "esu"
scale = 1e-39
abscissa_unit = "nm"
use = "primary"
notes = "Table III (p. 829), chi_parallel(3) in 10^-39 esu/molecule, the paper's ESHG chi_par(3)(-2w; 0, w, w) at 694.3 nm (ruby), Ward's convention chi = gamma_T/6, normalized to helium's 3.79 x 10^-39 esu (Eq. (10)); +- one standard deviation (p. 828). Nonpolar: chi^e = chi(3), measured at room temperature (~20 C) and the optimum density (Table I, the same value); total (electronic plus the small vibrational ESHG part)."
