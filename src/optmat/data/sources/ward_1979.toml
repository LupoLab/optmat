citation = "J. F. Ward and C. K. Miller, Phys. Rev. A 19, 826 (1979)"
doi = "10.1103/physreva.19.826"
library = "Ward_1979_MeasurementsNonlinearOptical"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """dc-electric-field-induced second-harmonic generation (dcSHG, ESHG) of a \
1 MW Q-switched ruby laser (694.3 nm -> 347.2 nm) in gases at the density of maximum \
harmonic (Loschmidt units), dc fields 21-58 esu on the beam axis, room temperature \
(~20 C) for the nonpolar molecules and 293-419 K scans for the polar ones. Signals \
alternated with helium; absolute scale from Sitz and Yaris's calculated helium value. \
Delta k_0 from two-quartz-plate interference with real-gas (virial) densities."""
notes = """ESHG hyperpolarizabilities of H2, N2, O2, CO2, SF6 (Table I, nonpolar) and CO \
(Table II, polar), and Table III's comparison. NO, H2S, NH3, H2O, (CH3)2O and CH3OH are \
not curated species (skipped).

Defining equations, exactly (pp. 826-827; conventions 'discussed in Refs. 4 and 5', \
Ward and New 1969 and Orr and Ward 1971):
- Eq. (1): p_F^2w (bar, the average induced dipole amplitude per molecule at 2w) = \
(3/2) chi^e_FGHM(-2w; 0, w, w) E^0_G E^w_H E^w_M, 'the E's are electric-field \
amplitudes' (Ward's complex amplitudes with the 1/2 convention: K(-2w; 0, w, w) = \
3/2, as K(-w; w, 0, 0) = 3 and K(-3w; w, w, w) = 1/4 in ward_1969). So chi = \
gamma_T/6, the Ward and New convention: per molecule in Taylor terms p(2w) = \
(gamma_T/4) E0 E_w^2 = (3/2)(gamma_T/6) E0 E_w^2.
- parallel = FGHM YYYY (optical field parallel to the dc field), perpendicular = YYXX.
- Eq. (2): chi^e = chi(3)(-2w; 0, w, w) + (mu/9kT) chi(2)(-2w; w, w): the \
orientational (dipolar) term, temperature dependent, removed for polar molecules by \
the T^-1 -> 0 limit (Table II). Eqs. (3)-(6): orientational averages; R(3) = \
chi_par(3)/chi_perp(3) = 3 without dispersion (Eq. (12)).
- Eq. (8): S = const x |chi^e/Delta k_0|^2 at the optimum density; ratios to helium.
- Eq. (10): absolute scale chi_par^e(He) = chi(3)(-2w; 0, w, w) = 3.79 x 10^-39 \
esu/atom (Sitz and Yaris, 'thought to be good to 1 %'); sign from helium's (positive) \
calculated value. Every value here is therefore a measured ratio to helium times \
3.79 x 10^-39 esu. (Shelton and Rice rescale these to a later helium value.)
- chi_par(3) of a gas is the orientational average of the molecular tensor, i.e. the \
isotropic gamma_T/6 (for an isotropic medium with R = 3).

Uncertainties: 'The uncertainties listed for Delta k_0, chi^e, and R^e are standard \
deviations' (p. 828). They do not include the 1 % of the helium calibration.

Part: ESHG has no rotational part for a nonpolar molecule (the paper: chi^e 'do not \
depend on temperature for these molecules', p. 828) and a small vibrational one, not \
separated: recorded total. CO's chi(3) is the infinite-temperature limit, which removes \
the dipolar orientational term: recorded electronic_vibrational.

Other tables (not datasets): Table I -Delta k_0 at Loschmidt density (cm^-1, 694.3 -> \
347.2 nm, virial densities: H2 1.27 +- 0.01, N2 1.89 +- 0.02, O2 2.41 +- 0.02, CO2 3.36 \
+- 0.03, SF6 3.47 +- 0.03), E_0, rho_opt and R^e (H2 2.86 +- 0.03, N2 3.00 +- 0.06, O2 \
2.97 +- 0.07, CO2 2.81 +- 0.06, SF6 2.97 +- 0.07); Table II for CO: T_0 = 293 K, \
rho_opt 1.05, -Delta k_0 = 3.35 +- 0.03 cm^-1, lim chi_par^e = 144 +- 4, d chi_par^e/dT^-1 = \
+11.6 +- 1.2 x 10^-36 esu K, R^e(T_0) = 2.94 +- 0.03 (chi_perp not measurable for CO); \
Table III R(3): H2 2.86 +- 0.03, N2 3.00 +- 0.06, O2 3.12 +- 0.07 (Table I's R^e for O2 \
is 2.97 +- 0.07, which for a nonpolar molecule should equal R(3): one of the two is \
misprinted, unresolved), SF6 2.97 +- 0.07, CO2 2.81 +- 0.08 (R^e +- 0.06), CO 2.92 +- \
0.15 (derived assuming R(2) = 3.0 +- 0.3); Table IV: CO mu = 0.112 +- 0.005 D, \
chi_par(2) = +129 +- 14 x 10^-33 esu/molecule (second order, not curated here). The \
-Delta k_0 values are linear-dispersion data for the refractive phase (phase mismatch at \
694.3/347.2 nm per Loschmidt density)."""


[[datasets]]
id = "chi3_H2"
