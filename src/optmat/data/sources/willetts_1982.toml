citation = "D. V. Willetts and M. R. Harris, J. Phys. D: Appl. Phys. 15, 51 (1982)"
doi = "10.1088/0022-3727/15/1/007"
library = "Willetts_1982_InvestigationIntoOrigin"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Interferometer at 10.59 um with a 1.0 m cell terminated in KCl windows, \
fringes counted with a pyroelectric detector as gas was removed from or admitted to \
the cell (p. 10); part of a study of the frequency sweeping of a hybrid TEA CO2 laser."""
notes = """Table 2 (p. 10, image checked) gives the refractivity and the Gladstone-Dale \
constant K of He, N2, CO2 and He:N2:CO2 mixtures at 10.59 um. The state is the text's \
(p. 10): 'for p = 103 kPa, T = 19 C'; the caption's '1.03 kPa' is a misprint (the \
refractivities are of order the 1 atm values; TC-149). The density reduction is not \
stated; at this precision (2.5-6 %) the difference between ideal and real gas is \
immaterial, and ideal is recorded. The wavelength is the CO2 laser's 10.59 um, taken \
as vacuum (the air-vacuum difference, 3e-4, is below the precision). The mixtures \
(a check of additivity; three calculated) and K are not extracted. The uncertainties \
are the printed +-, level not stated."""

[[datasets]]
id = "measured_He"
material = "He"
file = "He/willetts_1982__measured_He.csv"
table = "tbl_5618cf9a9efd"
quantity = "refractivity"
scale = 1e-6
abscissa_unit = "um"
wavelength_medium = "vacuum"
state = { pressure_pa = 103000.0, temperature_c = 19.0 }
density = "ideal"
use = "check"
notes = "Table 2 (a), the pure gas (volumetric ratio 1:0:0): (n - 1) x 10^6 at 10.59 um. A check: its 2.5-6 % uncertainty is far larger than the other data's."
[datasets.uncertainty]
column = true
level = "not stated"

