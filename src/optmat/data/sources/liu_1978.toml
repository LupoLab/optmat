citation = "P. Liu, W. L. Smith, H. Lotem, J. H. Bechtel, N. Bloembergen, and R. S. Adhav, \"Absolute two-photon absorption coefficients at 355 and 266 nm\", Phys. Rev. B 17, 4620-4632 (1978)"
doi = "10.1103/physrevb.17.4620"
library = "Liu_1978_AbsoluteTwoPhoton"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Absolute two-photon absorption by energy transmission against intensity (Sec. III, \
pp. 4622-4624): single 30-ps FWHM pulses (average duration) from a passively \
mode-locked, amplified YAlG:Nd (Nd:YAG) laser, Gaussian in space and time, \
frequency-tripled (355 nm: CDA doubler, KDP mixer; 1/e radius d = 0.78 mm) or \
quadrupled (266 nm: ADP doubler; d = 0.68 mm); a fused-silica lens (24.7 cm at 355 nm) \
raises the intensity, the samples sitting >= 2 cm (many Rayleigh lengths) behind its \
focus; each shot on a fresh site. The transmitted energy fraction T against peak input \
intensity I_p is fitted with Eq. (10) (Gaussian beam and pulse, Eq. 9, surface \
reflectivity R and linear absorption alpha included), starting from the slope Eq. \
(12), lim d(1/T)/dI_p = beta l/[2^(3/2)(1 - R)]. Shot-to-shot pulse duration and area \
from the harmonic energies (the tau-A technique, Eq. 14, with (tau A)_2 from the second \
harmonic). Energy from a photodiode calibrated against a thermopile and a pyroelectric \
meter. Relative measurements (RbBr and RbI against KI) by a two-channel method (Fig. \
1b, Eqs. 15-16). Samples: alkali halides from Harshaw; KDP and ADP (266 nm) from \
Cleveland Crystals; KDP and its isomorphs (355 nm) from Quantum Technology; fused \
silica from Amersil (Ref. 33). Room temperature (not stated)."""
notes = """Journal pages 4620-4632 = pdf pages 1-13 (journal page = 4619 + pdf page). \
Identity checked against the first page.

DEFINITION OF beta (p. 4621): the N-photon coefficient gamma_N with gamma_1 = alpha and \
gamma_2 = beta, the transmitted intensity for one- and two-photon absorption being Eq. \
(5), I(l) = (1 - R)^2 I(0) exp(-alpha l)/[1 + beta (1 - R) I(0)(1 - exp(-alpha l))/ \
alpha], i.e. dI/dz = -alpha I - beta I^2 inside the sample with the reflection losses \
removed (R explicit; multiple reflections neglected). I is the intensity (Eq. A5: I = \
(n0 c/8 pi) E0^2 for linear, Eq. A6: (n0 c/4 pi) E0^2 for circular polarization). Eq. \
(6): beta = (32 pi^2 omega/n0^2 c^2)[3 chi''_xxxx(-w, w, w, -w)] for light polarized \
along [100] of a cubic crystal (Maker and Terhune convention, degeneracy factor 3); \
Eq. (7) for [110] and Eq. (8) for circular polarization (derived in Appendix A). beta \
is in cm/MW throughout (Tables I, II).

UNCERTAINTY (p. 4624 and the footnote d of both tables): 'The uncertainty of the \
relative value of beta ... The main contribution ... is the uncertainty in the \
experimental value of tau A. On the average this introduces an uncertainty of +-15%. \
The scattering of the data points gives on the average another +-10%. The individual \
uncertainty for each sample is listed in Tables I and II. The systematic error in the \
absolute determination of beta, an uncertainty which should be added to the previous \
one, is +-7% in absolute energy calibration, +-28% in the average value of tau A at low \
intensity, and +-8% caused by the +-1.5-mm uncertainty in the determination of the \
focal length ... Thus, the absolute uncertainty sums up to +-43%.' Footnote d: 'The \
total uncertainty in beta is the sum of the relative uncertainty (listed in the table \
for each material) and the systematic uncertainty of the experiment estimated to be \
+-43%.' Recorded: relative = the row's printed %, systematic_relative = 0.43, level not \
stated (the paper adds the two linearly and states no confidence level; the 43 % is a \
linear sum of 7 + 28 + 8). The relative measurements beta(RbBr)/beta(KI) = 0.305 and \
beta(RbI)/beta(KI) = 0.668 'agree within 10% with the absolute values in Table I' \
(p. 4627): Table I gives 0.333 and 0.697 (computed).

TABLES (images checked; every extracted cell agrees). Table I (tbl_16c90fa7a1af, p. \
4625): 355 nm; Table II (tbl_c0af8ebd30c9, p. 4626): 266 nm. Footnotes (both): a \
'Energy band gap E_g, self-focusing critical power P_cr, and refractive index n are \
given whenever available'; b 'All measurements were done normal to the crystal \
surface'; c 'E/|E| is the direction of the laser polarization'; d (above); Table I e-h \
name ADA, KDA, RDA, RDP; Table II e (m*/m). One dataset per row for beta \
(two_photon_absorption_coefficient; the rows of a material that differ in \
polarization, sample length or colouring are separate datasets, the first row primary \
and the others check), and per material for E_g (band_gap, kind not stated), P_cr \
(critical_power, check), n (refractive_index, per ray, check) and m*/m (effective_mass, \
check). Upper bounds ('<') are kept and excluded. Table I prints sapphire 'A2O3' (a \
misprint of the label). The KDP-isomorph rows are '45° z cut' with E 'z axis' \
(extraordinary wave at 45 degrees to the optic axis; parameters.axis = 'e') or '⊥z axis' \
(ordinary; 'o'); sapphire and quartz 'C axis' rows propagate along the optic axis \
(ordinary, 'o'). Deuterated CDA: 'The value of beta with the beam polarized in the x-y \
plane is larger, by a factor of 1.8, than that obtained when the E field is parallel \
to z axis' (p. 4627).

FUSED SILICA AND QUARTZ AT 266 NM. Both print 4.5 x 10^-5 cm/MW without an \
uncertainty; liu_1979 (Appl. Opt. 18, 1015, p. 1017) remeasured fused silica: '1.7 x \
10^-5 +- 20% cm/MW. Previously it was reported to be on the verge of the earlier \
detection limit of 4.5 x 10^-5 cm/MW'. Both are recorded as check: limits, superseded \
for fused silica by liu_1979. The m*/m = 50 fitted to them is correspondingly \
uninformative.

KELDYSH FORMULA (Eqs. 3-4, p. 4621) and its fitted masses: formula keldysh_gamma_n. \
FINDING (computed 2026-09-27): in the weak-field limit (Delta = E_g), Eq. (4) with Table \
II's E_g, m*/m and n reproduces Table II's 266-nm beta to 0.2-0.7 % for NaCl, KCl, \
KBr, KI, RbCl, RbBr, RbI, CaCO3 and Al2O3 only if the printed factor (8 pi/n0)^N is \
read as (8 pi/(n0 c))^N (E^2 = 8 pi I/(n0 c), Eq. A5): as printed the result is c^2 = \
9.0e20 times larger. With that reading KDP gives +6 %, ADP +8 %, NaBr -41 % and fused \
silica -35 % against the printed beta, so the NaBr and silica fits used inputs other \
than the printed ones (not decidable).

OTHER VALUES. RbI at 355 nm: chi''_xxxx : chi''_xxyy : chi''_xyyx = 1 : 0.455 : 0.09, \
chi''_xxxx = 2.72 x 10^-13 cm^3/erg (p. 4627; no quantity). 'For the materials measured \
with band gaps greater than 2 hbar omega, the transmission T is practically constant to \
intensity up to 20 GW/cm^2' (p. 4627). Comparisons (p. 4628, reproduced in notes only): \
Mollenauer et al.'s KCl beta = 2.36e-3 cm/MW; Reintjes' deuterated KDP (2.7 +- 0.7)e-5 \
and ADP (1.1 +- 0.3)e-4 cm/MW (at 266 nm, Ref. 30); Frohlich and Park's values 'about \
a factor of 5' larger. Breakdown (Sec. V, Eq. 18): a free-electron heating estimate \
with tau = 5e-16 s (Ref. 12) and the fitted m*; Fig. 9 compares the resulting \
threshold fields of KDP and fused silica with experiment (figure only). Example (p. \
4629): with beta = 6e-6 cm/MW and I = 2e12 W/cm2 the loss per 100 um is 12 %. Eq. (B1): \
B = (8e7) pi^2 n2(esu)/lambda int I dz.

FIGURES (not digitised). Fig. 1: set-ups. Fig. 2: the tau-A ratio against input \
intensity. Fig. 3: 1/T against intensity with and without the tau-A correction. Fig. \
4 (p. 4624): 1/T against peak intensity for NaBr (beta = 2.5e-3 cm/MW curve) and for a \
large-gap material. Fig. 5: the relative (two-channel) KI-KI test. Fig. 6 (p. 4628): \
Keldysh gamma_4, gamma_3, gamma_2 of NaCl against photon energy (m*/m = 1). Fig. 7: \
beta against m* and E_g. Fig. 8 (p. 4629): beta of KI, RbBr and RbI against photon \
energy with the Keldysh curves. Fig. 9: breakdown fields of KDP and fused silica \
against wavelength.

REPRODUCTIONS OF THIS PAPER: taylor_1988 (the 266-nm column, footnote b, with \
liu_1979), brimacombe_1989, dragomir_2002, couairon_2005 (Nathan et al.'s compilation \
with the Liu papers)."""

[[formulas]]
id = "keldysh_gamma_n"
equation = "Eqs. (3)-(4), p. 4621"
printed = "\\gamma_N = \\frac{2}{9\\pi} N \\hbar \\omega^2 \\left(\\frac{8\\pi}{n_0}\\right)^N \\left(\\frac{m^* \\omega}{\\hbar}\\right)^{3/2} \\Phi\\left[\\left(2N - 2\\frac{\\Delta}{\\hbar\\omega}\\right)^{1/2}\\right] \\exp\\left[2N\\left(1 - \\frac{e^2 E^2}{4 m^* \\omega^2 E_g}\\right)\\right] \\left(\\frac{e^2}{16 m^* \\omega^2 E_g}\\right)^N, \\quad \\Delta = E_g + e^2 E^2/4 m^* \\omega^2"
variable = "Gaussian units: omega the laser angular frequency, E_g the band gap, m* the reduced electron-hole mass, n0 the index, E the peak field; Phi(z) = exp(-z^2) int_0^z exp(y^2) dy (Dawson); gamma_2 = beta"
range = "the multiphoton (high-frequency) limit of Keldysh's rate for parabolic bands; N the smallest integer with N hbar omega > E_g"
coefficients = { prefactor = "2/(9 pi)", field_factor = "8 pi/n0", exponent = "2N" }
check = "Weak field (Delta = E_g), N = 2, 266 nm, Table II's E_g, m*/m and n (computed 2026-09-27): as printed, beta is c^2 (8.99e20) times Table II's; with (8 pi/(n0 c))^N it reproduces NaCl 3.52e-3 (printed 3.5e-3), KCl 1.71e-3 (1.7e-3), KBr 2.01e-3 (2.0e-3), KI 3.76e-3 (3.75e-3), RbCl 1.025e-3 (1.02e-3), RbBr 2.19e-3 (2.18e-3), RbI 2.50e-3 (2.49e-3), CaCO3 2.41e-4 (2.4e-4), Al2O3 2.71e-4 (2.7e-4); KDP 2.87e-4 (2.7e-4), ADP 2.59e-4 (2.4e-4), NaBr 1.46e-3 (2.5e-3), fused silica 2.94e-5 (4.5e-5)."
notes = "Eq. (3), the rate per unit volume W, has the same structure with <Delta/hbar omega + 1> for N. The printed (8 pi/n0)^N lacks the 1/c^N that converts E^2 to intensity (I = n0 c E^2/8 pi, Eq. A5); the check shows the fitted masses were computed with it. liu_1979 prints the same formula (its Eq. 3) with exp[2N(2 - Delta/E_g)] in place of exp[2N(1 - e^2E^2/4m*omega^2E_g)] (equal to first order in E^2) and the same (8 pi/n0)^N."

