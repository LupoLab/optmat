range = "300-600 K (Table 1)"
coefficients = { N_a_300K = "108.2", U = "1.0002735", n_K = "1.55", n_L = "8.33", n_ve = "4.12", n_vx = "0.24", n_vc = "3.88", n_idt_300K = "0.50", n_idt_400K = "0.61", n_idt_500K = "0.72", n_idt_600K = "0.84", n_dt_300K = "3.38", n_dt_400K = "3.27", n_dt_500K = "3.16", n_dt_600K = "3.04", n_fc_300K = "3.23e-12", n_fc_400K = "1.01e-9", n_fc_500K = "3.42e-8", n_fc_600K = "3.76e-7", n_mph_300K = "1.16e-7", n_mph_400K = "1.48e-7", n_mph_500K = "1.84e-7", n_mph_600K = "2.22e-7", n_2ph_300K = "1.00e-7", n_2ph_400K = "1.26e-7", n_2ph_500K = "1.52e-7", n_2ph_600K = "1.79e-7", n_3ph_300K = "1.51e-8", n_3ph_400K = "2.08e-8", n_3ph_500K = "2.84e-8", n_3ph_600K = "3.78e-8", n_4ph_300K = "1.09e-9", n_4ph_400K = "1.91e-9", n_4ph_500K = "3.17e-9", n_4ph_600K = "5.01e-9", alpha_A2u = "0.1914", alpha_A2u_A1g_300K = "0.0025", alpha_1ph = "0.0172", nu_A2u = "1107", nu_A2u_A1g = "1721" }
check = "Table 1 cells compared with the image (2026-10-14); 'a × 10^-b' printed, written here as ae-b. The sums of the caption hold (see notes). N_a_300K, U and the alphas are from the text (pp. 492-494); nu in cm-1."
notes = "Table 1 rows above E_g (n_K, n_L, n_ve, n_vx, n_vc) are printed once, 'Const.' in T; n_idt, n_dt, n_mph and n_2ph are marked 'Lin.', n_3ph 'Quad.', n_4ph 'Cubic', n_fc 'Exp.' (Eq. (29)). Pure (oxygen-free) c-Si for the phonon rows (p. 493). The model's phonon, free-carrier and electronic formulas are not given; the values cannot be turned into n or k."
