[[formulas]]
id = "eq5_levels"
material = "O2"
equation = "Eqs. (5)-(10), pp. 373-374; Tables I and III, pp. 376, 378"
printed = "E(v, J, N = J) = nu_v + B_v J(J+1) - D_v J^2(J+1)^2 + H_v J^3(J+1)^3 + (2/3) lambda_v + (2/3) lambda_v' J(J+1) + (2/3) lambda_v'' J^2(J+1)^2 - mu_v - mu_v' J(J+1) - mu_v'' J^2(J+1)^2 + mu_v'''; E(v, J, N = J +- 1) = nu_v + B_v (J^2+J+1) - D_v (J^4+2J^3+7J^2+6J+2) + H_v (J^6+3J^5+18J^4+31J^3+33J^2+18J+4) - (1/3) lambda_v - (1/3) lambda_v' (J^2+J+4) - (1/3) lambda_v'' (J^4+2J^3+13J^2+12J+8) - (3/2) mu_v - (1/2) mu_v' (7J^2+7J+4) - (1/2) mu_v'' (11J^4+22J^3+39J^2+28J+8) + (1/2) mu_v''' (2J^2+2J+5) +- F(v, J); F^2 = A^2 + J(J+1) D^2; A = (2J+1)[B_v - 2D_v(J^2+J+1) + H_v(3J^4+6J^3+13J^2+10J+4) - mu_v/2 - (mu_v'/2)(J^2+J+4) - (mu_v''/2)(J^4+2J^3+13J^2+12J+8) + (3/2) mu_v'''] - [lambda_v + (lambda_v'/3)(7J^2+7J+4) + (lambda_v''/3)(11J^4+22J^3+39J^2+28J+8)]/(2J+1); D = 2[lambda_v + lambda_v'(J^2+J+1) + lambda_v''(J^4+2J^3+7J^2+6J+2)]/(2J+1); E(v, J = 0, N = 1) = nu_v + 2B_v - 4D_v + 8H_v - (4/3) lambda_v - (8/3) lambda_v' - (16/3) lambda_v'' - 2 mu_v - 4 mu_v' - 8 mu_v'' + 4 mu_v'''"
variable = "v, N (odd), J = N, N +- 1 of 16O2 X 3Sigma_g-; the + sign of F for N = J + 1, the - sign for N = J - 1 (the sign that reproduces Table II); energies in cm-1 with nu_0 = 0; the coefficients are Tables I (v = 0) and III (v = 1), this work, with the fixed values"
state = "16O2 X 3Sigma_g-, the free molecule"
density = "unknown"
range = "v = 0, 1; N up to 27 (the Raman data) and the microwave data"
coefficients = { nu_1 = "1556.38991", B_0 = "1.437676476", D_0 = "4.84256e-6", H_0 = "2.8e-12", lambda_0 = "1.984751322", lambda1_0 = "1.94521e-6", lambda2_0 = "1.103e-11", mu_0 = "-8.425390e-3", mu1_0 = "-8.106e-9", mu2_0 = "-4.7e-14", mu3_0 = "0", B_1 = "1.42186454", D_1 = "4.8418e-6", H_1 = "2.8e-12", lambda_1 = "1.989578940", lambda1_1 = "2.10924e-6", lambda2_1 = "1.103e-11", mu_1 = "-8.445771e-3", mu1_1 = "-8.264e-9", mu2_1 = "-4.7e-14", mu3_1 = "0" }
check = "Scratch (2026-09-27): Table II's Obs. - calc. reproduced to within 1.0e-4 cm-1 (the printed O - C are rounded to 1e-4 and the constants to their printed digits): SS(1,2), SS(1,1), SS(1,0), SS(3,4), SS(3,3), SS(3,2) give -6.2, -10.1, -4.6, -3.9, -4.3, -2.3 against -7, -10, -5, -4, -5, -3 (x 1e-4); SS(11,12)-SS(11,10) +2.2, +2.1, +0.2 against 3, 3, 1; SS(25,26) +5.4 against 6; OO(3,4), OO(3,3), OO(3,2) +4.2, +8.7, +1.8 against 5, 9, 2; OO(21,22), OO(21,20) +3.2, -1.2 against 4, -2. Table IV's 'This work (calc.)' QQ lines reproduced exactly to the printed 1e-4 (1556.2021, 1556.2034, 1556.1966, 1547.6612, 1547.6653, 1547.6595, 1542.6374)."
notes = "lambda1, lambda2 are lambda', lambda''; mu1, mu2, mu3 are mu', mu'', mu''' (suffix _v: the level). The fixed values (H_1, lambda_1'', mu_1'' = the v = 0 values; mu''' = 0) as in the tables. The per-constant datasets table1_this_work_* and table3_this_work_* hold the same fitted numbers with their standard deviations."

[[formulas]]
id = "eq11_q_branch"
material = "O2"
equation = "Eq. (11), p. 379; Table VI, p. 381"
printed = "E(v, J = N) = nu_v + B_v J(J+1) - D_v J^2(J+1)^2 + H_v J^3(J+1)^3 (the spin ignored); fitted: nu_10 = 1556.38820(21) cm-1, (B_1 - B_0) = -0.01581008(31) cm-1, nu_21, nu_32, (B_2 - B_1), (B_3 - B_2); D_v - D_(v-1) and H_v fixed to zero"
variable = "N (odd, written J in Eq. 11 and Table V); Q(N) = nu_(v,v-1) + (B_v - B_(v-1)) N(N+1) for the v - (v-1) band; wavenumbers in cm-1"
state = "16O2 X 3Sigma_g-"
density = "unknown"
range = "the Q branches of Table V: N = 1-55 (1-0), 1-39 (2-1), 1-11 (3-2)"
coefficients = { nu_10 = "1556.38820", nu_10_sigma = "0.00021", dB_10 = "-0.01581008", dB_10_sigma = "0.00000031", nu_21 = "1532.86724", nu_21_sigma = "0.00026", nu_32 = "1509.5275", nu_32_sigma = "0.0012", B_1 = "1.42186454", B_2 = "1.4061199", B_3 = "1.390425" }
check = "Scratch (2026-09-27): Q(N) = nu + (B_v - B_(v-1)) N(N+1) reproduces Table V to within 0.003 cm-1: 1-0 with the text's nu_10 and dB_10, O - C = -0.0030, +0.0010, +0.0004, -0.0001, -0.0009, +0.0018 for N = 1, 3, 11, 23, 39, 55; 2-1 with dB = B_2 - B_1 = -0.01574464, -0.0017, +0.0009, +0.0002, +0.0001 for N = 1, 11, 25, 39; 3-2 with B_3 - B_2, +0.0031, +0.0009 for N = 1, 11. The low-N residuals are the unresolved spin structure the model ignores."
notes = "The B_2 - B_1 and B_3 - B_2 differences are not printed; Table VI gives B_2 and B_3 built from them and this paper's B_1 (note a), so dB_21 = B_2 - B_1 and dB_32 = B_3 - B_2 follow from the coefficients above."

