citation = "G. Rouille, G. Millot, R. Saint-Loup and H. Berger, \"High-resolution stimulated Raman spectroscopy of O2\", J. Mol. Spectrosc. 154, 372 (1992)"
doi = "10.1016/0022-2852(92)90215-a"
library = "Rouille_1992_HighResolutionStimulated"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """High-resolution quasi-cw stimulated Raman spectroscopy (Dijon; pp. 374-375): \
a pulsed pump (a single-mode ring dye laser amplified by a PDA pumped at 532 nm, 7 ns, \
25 Hz, about 350 kW) and a 1 MHz single-mode krypton-ion probe, collinear, same \
polarisation, in a 25-pass cell; frequencies from a Michelson wavemeter referenced to \
an iodine-stabilised He-Ne (3 MHz) and a Fabry-Perot marker. O2 at room temperature \
(295 K, Fig. 2) and 30 Torr for the 1-0 band's ^SS and ^OO triplets, each fitted with a \
Voigt profile; the Q branches of the fundamental and the first two hot bands in a \
furnace cell (Ref. 15, Millot et al. 1992), without the multipass cell. Constants from \
weighted least-squares fits of the Hamiltonian, Eqs. (1)-(10), with microwave data \
(Refs. 5, 6), and of Eq. (11) (spin ignored) for the Q branches."""
notes = """Identity checked against the first page. PAGES: pdf page n is journal p. \
371 + n (Table I p. 376, Table II p. 377, Table III p. 378, Table IV p. 379, Tables V \
and VI p. 381). MATERIAL: 16O2 (the material O2), X 3Sigma_g-; only odd N exist (the \
16O nuclear spin is zero, p. 374). Room temperature; the ortho/para question does not \
arise.

CONVENTIONS (pp. 372-374). H = H_vib + H1 + H2 + H3 (Eqs. 1-4): H1 = B_v N^2 + (2/3) \
lambda_v (3 S_z^2 - S^2) + mu_v N.S; H2 = -D_v N^4 + (2/3) lambda_v' N^2 (3 S_z^2 - S^2) + \
mu_v' N^2 N.S + mu_v''' (N.S)^2; H3 = H_v N^6 + (2/3) lambda_v'' N^4 (...) + mu_v'' N^4 \
N.S, Hund's case (b). mu_v is the spin-rotation constant (gamma in yu_2012), lambda_v \
the spin-spin constant (yu_2012 tabulates 4 lambda). D_v is positive. The level \
energies are Eqs. (5)-(10) (formula eq5_levels). Lines are labelled ^{Delta N}{Delta \
J}(N, J) with N and J of the lower level: SS(N,J), OO(N,J), QQ(N,J) here. Wavenumbers \
in vacuum cm-1 (Table II's caption: 'Vacuum Wavenumbers'); the Zink-Mizushima MHz \
converted with c = 299 792 458 m/s (p. 375).

UNCERTAINTIES. Tables I (this work), III and VI: 'Numbers in Parentheses Are One \
Standard Deviation in Units of the Last Digit Quoted' (captions; Table I's applies to \
'our results' only). Table V: 'Numbers in Parentheses Indicate Experimental Precision'. \
Table II: no per-line error; all Raman lines were weighted with 'the same absolute \
precision, 1 x 10^-3 cm-1' and the fit's standard deviation is 5 x 10^-4 cm-1 for the \
Raman data, 7 x 10^-7 cm-1 for the microwave data (p. 378); the v = 0 fit's is 1 x \
10^-6 cm-1 (Table I).

WHAT IS FIXED (not taken). Table I: mu_0''' = 0 ('arbitrarily fixed'). Table III: H_1 \
= H_0 = 2.8e-12, lambda_1'' = lambda_0'' = 1.103e-11, mu_1'' = mu_0'' = -4.7e-14 (note \
a; freed, they gave lambda_1'' 7.6(55)e-12 and mu_1'' -8.6(52)e-13 cm-1, p. 379), mu_1''' \
= 0 (note b); Endo and Mizushima's D_1 = 4.96560e-6 (fixed, note b). Table VI: H_v, \
lambda_v'', mu_v'' and mu_v''' of v = 2, 3 are the v = 0 values or 0. The Q-branch fit \
(Eq. 11, spin ignored) gives nu_10 = 1556.38820(21) and B_1 - B_0 = -0.01581008(31) cm-1 \
(text, p. 379; the Table I and III constants give B_1 - B_0 = -0.01581194 and nu_10 = \
1556.38991), 'in good agreement ... in spite of the difference between the models'; \
D_v - D_(v-1) and H_v were fixed to zero there (formula eq11_q_branch).

THE DISAGREEMENT WITH Ref. 5 (p. 375): refitting Zink and Mizushima's data gives H_0 = \
2.8(16)e-12, 'not in good agreement with Ref. (4)' (Welch and Mizushima 1972), and a D_0 \
uncertainty two orders of magnitude smaller than theirs; 'since we could not explain \
these discrepancies' the v = 0 constants of this work were used.

LINEWIDTHS. None tabulated: Fig. 2 (the SS(11) triplet at 295 K, 30 Torr) is fitted \
with a Voigt profile, widths not given. The O2 collisional widths are in millot_1992 \
(Ref. 15). Figures (not digitised): Fig. 2 the SS(11) triplet; Fig. 3 the Q branches of \
the three bands.

TABLE IV (p. 379): the calculated QQ(N,J) triplet components of this work (from Tables \
I and III; use check) and of Dang-Nhu et al. (Ref. 14, magnetic-dipole predictions from \
literature constants; reproduced), against the unresolved Q(N) of Table V: 'differences \
greater than 0.08 cm-1 appear for N = 29' for Ref. 14. The observed column repeats Table \
V (not written twice).

RELATION TO OTHER RECORDS. yu_2012's global Dunham fit includes this paper's 1-0 lines \
and the 2-1, 3-2 Q-branch data (its Sec. IV B). Against yu_2012's Table III (MHz / \
29979.2458, checked 2026-09-27): B_0 43100.44712 MHz = 1.43767616 cm-1 (this work \
1.437676476); 4 lambda_0 238005.3746 MHz gives lambda_0 = 1.98475119 (1.984751322); \
gamma_0 -252.586311 MHz = -0.00842537 (mu_0 -0.00842539); B_1 42626.4203 MHz = \
1.42186433 (1.42186454): agreement to 3e-7 cm-1. hajigeorgiou_2013's Table I B_v (from \
yu_2012's Dunham fit) for v = 2, 3: 1.40611975 and 1.39042517, against Table VI's \
1.4061199(12) and 1.390425(20): within 2e-7 cm-1."""

