citation = "M. A. Green, \"Self-consistent optical parameters of intrinsic silicon at 300 K including temperature coefficients\", Sol. Energy Mater. Sol. Cells 92, 1305-1310 (2008)"  # codespell:ignore mater
doi = "10.1016/j.solmat.2008.06.009"
library = "Green_2008_SelfConsistentOptical"
identity = "VALIDATED"
kind = "compilation"
technique = """A self-consistent evaluation, not a new measurement. A curve of the \
reflectance R of silicon against photon energy, from below 0.005 eV to above 29 keV, was \
assembled from the literature (Section 3, p. 1307), its phase found by the \
Kramers-Kronig relation (Eq. 1) and n and k computed from R and the phase (Eqs. 2-3). The \
reflectance: 1-6 eV, the ellipsometric tabulation of Herzinger et al. (J. Appl. Phys. \
83, 3323 (1998)) as the baseline, adjusted (multiplier within 0.2 % of unity over most \
of the range) for Jellison (Optical Materials 1, 41 (1992)), Philipp (J. Appl. Phys. 43, 2835 \
(1972)) and Aspnes and Studna (Phys. Rev. B 27, 985 (1983)); below 1 eV, R from Eq. 4, \
n = 3.4164 + 0.085818 E^2 + 0.010149 E^4 (E in eV), fitted to the indices of Salzberg \
and Villa (1957), Lukes (1959), Primak (1971) and Icenogle et al. (1976) corrected to \
300 K and assumed valid to zero energy, merged with the 1-6 eV baseline over 0.8-1.5 \
eV; 6-20 eV, Philipp's reflectance as recalculated from Aspnes's tabulated n, k (Hunter's \
also considered); 20-29 eV, Hunter's; 29 eV-30 keV, Henke et al. (updated by Soufli and \
Gullikson); above 30 keV a power law. A multiplier of 0.945 on R above 29 eV brought the \
phase at 0.85-1.16 eV to 0 +- 0.00008 rad (p. 1307). Above 0.5 um (below 2.5 eV) k was \
instead computed from measured absorption coefficients and n from that k and the fitted \
R (p. 1308); the alpha measurements of Weakliem and Redfield (J. Appl. Phys. 50, 1491 \
(1979)), MacFarlane et al. (Phys. Rev. 111, 1245 (1958)), Keevers and Green (Appl. Phys. \
Lett. 66, 174 (1995)), Trupke et al. (J. Appl. Phys. 94, 4930 (2003)) and Reece et al. \
(unpublished, 2001) 'were given highest weighting from 0.47 to 1.45 um'. The two \
routes agreed from 0.46 to 0.6 um. The temperature coefficients were 'calculated from \
cited and additional data sets [32]' (Jellison and Modine, elevated temperatures) \
(p. 1308). Values at 300 K (27 C); intrinsic silicon."""
notes = """Journal pages 1305-1310 = PDF pages 1-6; Table 1 is on pp. 1306-1307 (PDF pp. \
2-4, three library tables). Identity checked against the first page.

WHAT IS TABULATED. Table 1 ('Optical properties of intrinsic silicon at 300 K including \
normalised temperature coefficients'): against the free-space wavelength lambda, \
0.25-1.45 um at 0.01 um steps (121 rows), the absorption coefficient alpha (/cm, three \
significant figures), n (three decimals), k (three decimals, printed only to 1.00 um; an \
en dash from 1.01 um), and the normalised temperature coefficients C_n = (1/n)(dn/dT) \
and C_k,alpha = (1/k)(dk/dT) in 10^-4/K ('alpha has an identical coefficient to k'). \
alpha = 4 pi k / lambda (p. 1305); lambda (um) = 1.23984190 / E (eV), 'for standard dry \
air, wavelengths will be about 0.03% shorter' (p. 1305): the wavelengths are vacuum \
wavelengths. Checked (2026-10-14): k agrees with alpha lambda / (4 pi) in every row \
within the rounding of the two printed columns. epsilon_2 = 2nk at 0.29 um is 46.05, \
the paper's 46.1 +- 0.9 at 290 nm (p. 1308).

ACCURACY (p. 1308, Section 5, quoted): 'Error limits on tabulated k and alpha are \
estimated to increase from +-0.3% at 0.25 um to +-4% beyond 0.46 um, +-10% beyond 1.2 um \
and to become even larger beyond 1.4 um. For n, estimated accuracy is better than \
+-0.1% beyond 1.0 um, increasing to about +-0.5% at shorter lambda except below 0.3 um \
where it increases to +-1%.' Recorded as relative_rows, level 'bound' (the paper's \
'error limits'): alpha and k 0.3 % at 0.25 um, 4 % at 0.47-1.20 um, 10 % at 1.21-1.40 \
um; n 1 % at 0.25-0.29 um, 0.5 % at 0.30-1.00 um, 0.1 % at 1.01-1.45 um. The paper \
states no number for alpha and k at 0.26-0.46 um (where the limit rises from 0.3 to 4 \
%) or beyond 1.40 um ('even larger'): those rows carry no uncertainty. k's printed \
resolution (0.001) exceeds the 4 % limit wherever k <= 0.012 (lambda >= 0.68 um), and \
at 0.94-1.00 um k = 0.001 is alpha rounded by up to a factor of two. Comparisons at two \
laser lines (p. 1308): Taft's (4.088 +- 0.003) - i(0.0314 +- 0.0016) at 546.1 nm, \
Geist's 3.874 - i(0.0159 +- 0.0004) at 633.0 nm (both extrapolated to 300 K), against \
the table's (4.090 +- 0.003) - i(0.0289 +- 0.0012) and (3.874 +- 0.002) - \
i(0.0162 +- 0.0006); and Gatesman's n = 3.4170 +- 0.0001 at 236.6 um, 0.04 % above \
Eq. 4 at 22 C.

TEMPERATURE COEFFICIENTS (p. 1308, Eqs. 6-10). c_p = (1/p) dp/dT = d(ln p)/dT, for p = \
n, k or alpha, at 300 K; the paper's preferred use is the power law p(T) = p(T0) \
(T/T0)^b with b = C_p(T0) T0 (Eqs. 9-10), shown for alpha against Weakliem and \
Redfield, MacFarlane et al. and Trupke et al. at 249, 363 and 473 K (Fig. 2). They are \
normalised coefficients, not dn/dT, and are not recorded as thermo_optic_coefficient: \
they stay in each row's printed cells. dn/dT = n C_n, from 2.9e-4 n at 0.25 um to \
0.6e-4 n (2.1e-4 /K) at 1.04-1.45 um, printed to one or two significant figures.

WHAT IT IS BUILT FROM. Every value is the paper's own Kramers-Kronig evaluation of a \
reflectance curve it assembled from others' measurements (above), with k above 0.5 um \
from others' alpha weighted together: no column reproduces one source's values, but \
n depends mostly on Herzinger et al. (1-6 eV) and on Eq. 4's prism indices below 1 eV, \
and alpha above 0.47 um on Weakliem and Redfield, MacFarlane et al., Keevers and Green, \
Trupke et al. and Reece et al. The datasets are therefore checks, never fitted beside \
those measurements. Schinke et al. (2015, schinke_2015) find good agreement in alpha \
except beyond 1200 nm (their Fig. 16).

REFRACTIVEINDEX.INFO. main/Si/nk/Green-2008.yml (data/external/refractiveindex_info) \
holds n and k from this table, with k from 0.45 um recomputed from alpha; see the \
register entry for the comparison."""

