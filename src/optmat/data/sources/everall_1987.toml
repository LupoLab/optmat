quantity = "raman_cross_section"
unit = "cm2/sr"
scale = 1e-29
abscissa_unit = "nm"
use = "reproduced"
reproduced_from = ["bischel_1983"]
notes = "Table (p. 396), dsigma/dOmega at the 248 nm KrF pump, used in Eq. (2); the table note: 'Cross sections for CH4, H2, N2 and O2: ref. [15]'. Polarization and definition not stated. Ref. [15] is bischel_1983 (re-pointed 2026-09-27), which prints no value at 248 nm: its single-resonance fit (Table 1) gives 15.7e-29 (248.0 nm) and 15.5e-29 (248.4 nm), 2-3 % above this 15.3."
[datasets.parameters]
transition = "nu1 Q branch (the band is not named in the paper)"

