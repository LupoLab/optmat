notes = "Table (p. 396), dsigma/dOmega at the 248 nm KrF pump, used in Eq. (2); the table note: 'extrapolated from data in ref. [16] assuming nu^4 scaling'. Polarization and definition not stated. Ref. [16] is Schrotter and Klockner's Chap. 4 (curated as schrotter_1979). NOT REPRODUCED: with the chapter's own definitions, dsigma/dOmega = Sigma_j x 5.05e-48 cm^6/sr x (nu_0 - 775 cm^-1)^4 at 248 nm (nu_0 = 40323 cm^-1) is 4.1-4.9e-29 cm^2/sr for SF6's Sigma_j of 3.3-3.96 (sigma_SF6_*); the printed 6.0e-29 needs Sigma_j = 4.86, 23 % above the largest (3.96 at 515 nm, Clark and D'Urso). Scaling an absolute 514.5 nm value by (nu_0/nu_0')^4 instead gives 4.5e-29. Kept as printed."
[datasets.parameters]
transition = "nu1 (the band is not named in the paper)"

