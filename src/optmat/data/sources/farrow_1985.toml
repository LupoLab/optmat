[[datasets]]
id = "table1_Ar"
material = "N2"
file = "N2/farrow_1985__table1_Ar.csv"
table = "tbl_da579f77cd0b"
quantity = "raman_linewidth"
unit = "cm-1/atm"
scale = 1e-3
abscissa = "label"
use = "primary"
excluded_rows = { "Q(0)" = "printed '55^a', note a 'Extrapolated' (the paper's extrapolation, not a measurement)", "Q(1)" = "printed '46^a', note a 'Extrapolated' (the paper's extrapolation, not a measurement)" }
notes = "Table 1 (p. 904), 'Argon Collisional-Broadening Coefficients for Nitrogen Q-Branch Transitions (HWHM x 10^3 cm^-1)': the HALF width at half maximum of the N2 Q(J) lines (v = 0 -> 1) per unit pressure of Ar, 'pressure-broadening coefficients' (p. 904). The caption prints only 'cm^-1'; per atm is inferred: the text (p. 906) gives HWHM 'of the order of 0.015 cm^-1' for 1-5 % N2 in Ar at 300 Torr (0.395 atm), i.e. about 0.038 cm^-1/atm, as the table's mid-J values. Measured by high-resolution inverse Raman spectroscopy (Ref. 8) in a 25 % N2-in-Ar mixture, 'correcting for the nitrogen-nitrogen broadening using the nitrogen self-broadening coefficients reported by Rosasco' (Ref. 9: Rosasco, Lempert, Hurst and Fein, Chem. Phys. Lett. 97, 435 (1983) = rosasco_1983, whose Table 1 gives the N2 self-broadening HWHM per atm at 298 K, J = 0-18; curated 2026-09-27), p. 904. The IRS temperature is not stated (the CARS measurements are at 297 K). The '(n)' is the error in the last digit, its level not stated. J = 0, 1 are extrapolated (excluded). Added 2026-09-26 (TC-439)."
[datasets.uncertainty]
column = true
level = "not stated"
[datasets.parameters]
transition = "Q(J), v = 0 -> 1, per row"
width = "hwhm"
perturber = "Ar"
