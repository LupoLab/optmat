citation = "R. L. Farrow and L. A. Rahn, J. Opt. Soc. Am. B 2, 903 (1985)"
doi = "10.1364/josab.2.000903"
library = "Farrow_1985_InterpretingCoherentAnti"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Crossed-beam, polarization-resolved CARS with a frequency-doubled Nd:YAG pump \
(532 nm; single axial mode <= 0.01 cm^-1, or multimode 0.7 cm^-1) and a pulsed dye \
probe (Stokes, <= 0.03 cm^-1); fully resolved N2 Q-branch spectra in 1.00 % N2 in Ar \
and the O(18) line of pure N2, 297 K, 200-1000 Torr, fitted with theoretical spectra \
(Schrotter and Klockner's Q-branch cross section, argon-broadened linewidths measured \
by inverse Raman spectroscopy, Table 1) to find the nonresonant susceptibility \
relative to the N2 resonant one."""
notes = """Nonresonant CARS susceptibilities of Ar and N2 referenced to the N2 Raman \
resonance (the paper's main subject is the convolution of CARS spectra with multimode \
pumps; Table 3's concentration errors are not extracted). Table 1's N2-Ar \
collisional-broadening coefficients are the Raman dataset table1_Ar (added 2026-09-26, \
TC-439; see its notes).

Definition: Table 2's caption: 'chi_nr measurements expressed using the definition of \
relation (1)', Yuratich's expression, relation (1), p. 903: I_4 proportional to the \
integral of |sum_j K_j L_j(w1 - w3) + chi_nr|^2 I_1 I_2 I_3, with L_j = gamma_j/(w_j - w + \
w_3 - i gamma_j) and K_j = c^4 Delta N_j (d sigma/d Omega)_j / (hbar w_3^4 gamma_j), i.e. \
the CARS-literature susceptibility per unit volume, chi^CARS (Rosasco and Hurst's Eq. \
(A4), whose P(w_as) = (1/4) chi^CARS E_L^2 E_s*, Eq. (A5), with the E/2 amplitude \
convention). The paper does not print the density; the values are per amagat \
(2.687e19 cm^-3): Table 2's Ref. 13 column equals 3 x Lundeen et al.'s per-molecule \
chi x 2.687e19 (Ar 131e-39 -> 10.56, N2 105e-39 -> 8.46, N2 +-14 -> +-1.13, printed 10.6, \
8.5 +- 1.1) and its Ref. 12 column equals 12 x Rosasco and Hurst's 3 sigma/24 at 1 amagat \
(Ar 0.788 -> 9.46, printed 9.5), as Rosasco and Hurst's (A6)-(A7) and (A26)-(A28) \
require (checked 2026-09-26). Hence chi^CARS = 12 chi_1111 = 3 sigma/2 = N0 gamma_T/2 at \
1 amagat: gamma_T = 2 chi^CARS/N0 (1e-18 cm^3/erg per amagat = 7.443e-38 esu = 147.8 au). \
These are nonlinear susceptibilities per amagat, without a state (unit recorded as \
cm3/(erg amagat), as Farrow et al. 1987 and Hahn and Lee 1995 print it; this paper \
prints only 'cm^3/erg').

Results (p. 904): fitting the resolved spectra required reducing Hall and Eckbreth's \
chi_nr (Rado rescaled: Ar 11.6, N2 10.1, Figs. 1, 2) by 17 % for Ar (+-6 % from the fit) \
and 16 +- 8 % for N2: chi_nr = 9.6 +- 1.0 (Ar) and 8.5 +- 0.9 (N2) x 10^-18 cm^3/erg in \
the text, but Table 2 prints N2 8.5 +- 1.3 (image checked): the uncertainties disagree, \
unresolved; the table's is recorded. The N2 value comes from the O(18) line (linewidth \
0.05 +- 0.007 cm^-1 HWHM at 1000 Torr, inferred from the CARS spectrum), the Ar value \
from the Q branch of 1 % N2 in Ar with IRS-measured widths. 'Our error bounds for the \
chi_nr of nitrogen arise predominantly from uncertainties in linewidth, the dependence \
of chi_r on the Raman depolarization ratio as well as the cross section, and the \
moderate temperature sensitivity of the J = 18 state' (p. 904).

Part: the CARS nonresonant background; for Ar electronic; for N2 the background near \
its Raman lines, i.e. electronic plus small off-resonant Raman contributions not \
separated (Lundeen et al. compute -3 and +3 of 105 for the vibrational and rotational \
tails at 4155 cm^-1): recorded electronic, with that caveat. The orientational term \
does not enter CARS at these detunings."""


