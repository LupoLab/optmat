notes = "p. 11: A_eps from Eq. (18) at each isotherm (273.20, 293.21, 323.18 K; rows are the temperatures as printed, '273 K', '293 K', '323 K'), one standard uncertainty. The 293 and 323 K values carry the temperature dependence (A_tau = 0.0026 +- 0.0011 cm^3/mol per unit T/273.16 K - 1). zhao_2026's may_2008_O2 reproduces the 293 and 323 K values. The dataset's temperature_k is the first isotherm; the rows differ."
[datasets.uncertainty]
