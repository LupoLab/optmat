notes = "Fig. 11 (p. 3948), solid line ('random-phase approximation', LDRPA): p / I^2 of two-photon ionisation of He, 10^-16 s^-1 W^-2 cm^4, against the photon energy in Ry (unshifted LDA thresholds: 0.57 Ry two-photon, 1.13 Ry one-photon), read from the page image (the record's notes): 0.67-1.02 Ry (4.98 falling to 2.51 at 1 Ry, an upturn to 2.53 at the end), 1.20-1.28 Ry (1.12-1.08), 1.55-1.78 Ry (0.54-0.27). Below 0.90 Ry the curve is not ionisation in reality (the authors' region (i)); 1.13-1.81 Ry averages over the real 1s -> np resonances (region iii). 0.05 absolute (in 10^-16 units): the digitising uncertainty (the record's notes); the paper states none."
