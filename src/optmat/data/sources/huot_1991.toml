citation = "J. Huot and T. K. Bose, \"Experimental determination of the dielectric virial coefficients of atomic gases as a function of temperature\", J. Chem. Phys. 95, 2683 (1991)"
doi = "10.1063/1.461801"
library = "Huot_1991_ExperimentalDeterminationDielectric"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Capacitance (dielectric) measurements on He, Ne, Ar, Kr and Xe at 77.4, 242.95, \
303.15, 323.15 and 407.6 K up to about 400 bar, by the expansion method: the second and \
third dielectric virial coefficients B_eps and C_eps from the slope and curvature of \
the combined expansion curves (Eq. 12)."""
notes = """Identity VALIDATED_WITH_WARNINGS by the library. Printed pp. 2683-2687; Table I is \
on pdf p. 5.

TABLE I (image checked against the cells, 2026-10-01): B_eps (cm^6/mol^2) and C_eps \
(cm^9/mol^3), static, per gas and temperature; cells printed '...' are absent. \
Extracted, one dataset per coefficient and temperature, as \
refractivity_virial_coefficient of order 2 and 3 at the static limit. No confidence \
level is stated for the '+-' values (level: not stated). The text gives A_eps of neon, \
0.9969(3) cm^3/mol at 323.15 K, not extracted.

These are dielectric (static) coefficients: for the atoms the optical B_R differs from \
B_eps by the dispersion of the pair term, a few per cent (OEP 4, section 4.1)."""

