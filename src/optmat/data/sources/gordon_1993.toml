[[datasets]]
id = "anomalous_H2"
material = "H2"
file = "H2/gordon_1993__anomalous_H2.csv"
table = "tbl_c084e004c082"
quantity = "refractivity"
scale = 1e-4
abscissa_unit = "angstrom"
wavelength_medium = "vacuum"
state = "1atm_0C"
density = "ideal"
use = "check"
notes = "Table II, H2 n_3 - 1 at eight HCl rotational lines 1107.593-1110.223 A, among the H2 B-X (0-0) lines (anomalous dispersion: 2.0 to 9.2 x 10^-4 within 3 A); R(4) and R(2) of HCl gave no or irreproducible modulation (footnote a) and have no value. For comparison with a rotationally resolved model (the paper's Eqs. (7)-(8)), not for a smooth fit. The +- are single standard deviations."
[datasets.uncertainty]
column = true
level = "1 sigma"

