notes = "Table I, H2, n_3 - 1 at 1119.65, 1127.85 and 1150.32 A, away from the B-X (0-0) band (origin 1108.61 A), with n_1 from Zeiss et al.'s DOSD. The 1109.45 A H2 row ('see Table II') is in anomalous_H2."
[datasets.uncertainty]
