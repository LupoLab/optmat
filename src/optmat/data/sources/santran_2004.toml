[[formulas]]
id = "two_band_kramers_kronig"
material = "SiO2"
equation = "Eq. (19), p. 2187"
printed = "n2(esu) = K' sqrt(E_p) / (n0 E_g^4) G2(hbar omega / E_g), with G2(x) = (1/(2 x^6)) [ -(3/8) x^2 (1 - x)^(-1/2) + 3 x (1 - x)^(1/2) - 2 (1 - x)^(3/2) + 2 theta(1 - 2x) (1 - 2x)^(3/2) ]"
variable = "x = hbar omega / E_g; E_p = 2 |p_vc|^2 / m0 (p_vc the interband momentum matrix element, m0 the free-electron mass); E_g the gap energy; theta the step function"
coefficients = { K_prime = "a constant that takes different values according to the material" }
check = "Not checkable: no values of K', E_p or E_g are given for the Fig. 7 fit (checked 2026-09-26)."
notes = "The two-parabolic-band scaling of Sheik-Bahae et al. (Ref. 17), as printed here (the same G2 as DeSalvo et al.'s Eqs. 3-4 in closed form). n2 in esu, of an unstated definition (see the record's notes on Eq. 15)."

[[formulas]]
id = "pert"
material = "SiO2"
equation = "Eq. (20), p. 2187"
printed = "n2(x)/n2(0) = [n(0)/n(x)] [ (n(x)^2 + 2)/(n(0)^2 + 2) ]^4 [1/(1 - x^2)] [ (1 - x^2)/(1 - 4 x^2) + (1/(2K)) ( (1 - x^2)/(1 - 4 x^2) - (1 + x^2/3)/(1 - x^2) ) ]"
variable = "x: printed 'x is in inverse centimeters' (presumably the photon wavenumber over the resonance's, a ratio; the paper does not define the resonance here); n(x) the linear index"
coefficients = { K = "0.5" }
check = "Not checkable: the resonance and n2(0) of the Fig. 7 fit are not given (checked 2026-09-26)."
notes = "The PERT equation of Adair, Chase and Payne (Optical Materials 1, 185 (1992), Ref. 13), which Milam 1998 used (milam_1998). 'K is the kurtosis electron distribution, which has a value close to 0.5 for widebandgap glasses' (p. 2187): K = 0.5 is the paper's typical value, not a fit."
