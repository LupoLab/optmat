unit = "cm2/W"
scale = 1e-16
abscissa_unit = "nm"
use = "primary"
notes = "Table 2 (p. 2186), sample 'Heraeus S300': n2 at 800 and 400 nm. Relative accuracy between samples < 1 %; absolute accuracy 10-28 % (800 nm) and 12-34 % (400 nm), per sample quality (source notes)."
