table = "tbl_b47536f1a05a"
quantity = "mixture_compressibility_factor"
unit = "1"
abscissa = "pressure"
abscissa_unit = "atm"
use = "primary"
notes = "Table I (p. 530): Z of the 49.4 mole % He-Ne mixture at +40 C, two Burnett runs (rows run1_k, run2_k in the printed order); sigma_z printed x 10^5, written in units of Z."
[datasets.parameters]
