citation = "V. Milosavljević, A. R. Ellingboe and S. Djeniže, \"Measured Stark widths and shifts of the neutral argon spectral lines in 4s-4p and 4s-4p' transitions\", Spectrochim. Acta B 61, 81 (2006)"
doi = "10.1016/j.sab.2005.11.004"
library = "Milosavljevic_2006_MeasuredStarkWidths"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Plasma (Stark) widths and shifts of seven Ar I 4s-4p and 4s-4p' lines \
(696.543-772.376 nm, air) in a linear low-pressure pulsed arc (quartz tube 5 mm, 7.2 \
cm plasma, 14 uF at 1.5 kV) in 72 % Ar + 28 % He (133 Pa) or 97 % Ar + 3 % H2 (67 and \
133 Pa); end-on, Zeiss PGS-2 spectrograph (0.73 nm/mm, 8 pm instrumental FWHM) with \
a photomultiplier scanned in 7.3 pm steps; electron density by He-Ne laser \
interferometry (7 %), temperature from Ar I/Ar II line ratios assuming LTE (11 %); \
the electron and ion parts of the width and shift, the ion parameters A, D, E and the \
plasma N, T separated by the authors' line-profile deconvolution (Secs. 2-3, Table \
1). Self-absorption corrected for 751.465 and 763.511 nm."""
notes = """Context only, no datasets. Spectrochim. Acta B 61, 81-87 (2006), PDF \
pages 1-7 = journal pp. 81-87. Identity checked on the first page: journal, volume, \
pages, authors, title, received 12 July 2005, accepted 27 November 2005, online 10 \
January 2006. The library's identity is VALIDATED_WITH_WARNINGS (one unmapped glyph).

WHAT THE PAPER PRINTS. Table 1 (p. 83, rotated): three discharges a, b, c with N_exp \
6.7, 7.0, 7.1 x 10^22 m^-3 (+-7 %) and T_exp 15.6, 16.0, 16.2 x 10^3 K (+-11 %), and \
the deconvolved N_D, T_D (+-12 %). Table 2 (p. 84, 4s-4p: 751.465, 763.511, 772.376 \
nm) and Table 3 (p. 85, 4s-4p': 696.543, 727.294, 706.722, 738.398 nm): per line and \
discharge the FWHM W_t,s+d, W_t,st, W_e, W_i,st (pm), A, D, the shifts d_t,s+d, \
d_t,st, d_e, d_i,st (pm) and E, 'within 12% accuracy' (Table 2 note), with other \
authors' values below (reproduced). Electron widths W_e 41.0-70.6 pm, electron shifts \
d_e 6.4-34.4 pm, A 0.057-0.084, all at N about 7 x 10^22 m^-3 and T about 16 000 K; \
not normalised to a density in the tables.

LEVEL LABELS. Rows are labelled by the multiplet [K]_J - [K]_J (no configuration) and \
the air wavelength; each wavelength is NIST's line (data/external/nist_asd/\
Ar_I_lines_nir.tsv, vacuum, within 0.06 nm after conversion to air): 751.465 = 4s \
2[3/2]* J = 1 - 4p 2[1/2] 0; 763.511 = 4s 2[3/2]* 2 - 4p 2[3/2] 2; 772.376 = 4s \
2[3/2]* 2 - 4p 2[3/2] 1; 696.543 = 4s 2[3/2]* 2 - 4p' 2[1/2] 1; 727.294 = 4s 2[3/2]* \
1 - 4p' 2[1/2] 1; 706.722 = 4s 2[3/2]* 2 - 4p' 2[3/2] 2; 738.398 = 4s 2[3/2]* 1 - \
4p' 2[3/2] 2 (unprimed (2P*<3/2>), primed (2P*<1/2>) core). Table 3 prints the 727.294 \
upper level as '[1/2]_1^o' (a stray odd-parity mark; 4p' is even).

NOT TAKEN (no quantity fits; Data rule 7). pressure_line_coefficient (TC-1040) holds \
collisional broadening or shift of a bound line by a perturber gas per unit pressure \
or density in the impact regime. These are plasma Stark widths and shifts, by \
electrons and (quasistatic and dynamic) ions, at stated N and T, in pm, not \
normalised; the ion parameters A, D and E are line-shape parameters. No new quantity \
is proposed: OEP 8's argon pressure broadening is by neutral argon.

CHECKED (2026-10-12). Tables 2 and 3 against the table images. For every 'Tw' row \
W_t,st = W_e + W_i,st and d_t,st = d_e + d_i,st within 0.1 pm, except 706.722 nm row \
b (47.2 printed, 43.6 + 3.4 = 47.0) and 738.398 nm row c (13.3 printed, 10.6 + 2.5 = \
13.1). The printed Table 3 itself shifts the second 696.543 nm row one column to the \
right (the wavelength sits in the T column, 16.0 under N, and the d_e and d_i \
values '9.6' and '2.4' share a cell); read in order, the row is T 16.0, N 7.0, W \
58.0, 47.8, 43.6, 4.2, A 0.084, D 3.43, d 21.0, 12.0, 9.6, 2.4, E 4.73, and the sums \
above hold for it. The ref. 9 rows are schinkoth_2000's half widths doubled and its A \
(7.42, 7.42, 6.78, 6.6, 7.06 pm FWHM at 10.0 x 10^3 K and 10^22 m^-3; A 0.044, 0.044, \
0.042, 0.044, 0.044), exactly.

FINDINGS. (1) Against schinkoth_2000: W_e/N here, per 10^22 m^-3 at about 16 000 K, \
divided by Schinkoth's FWHM at 10 000 K, is 1.31 (751.465 and 763.511), 1.45 \
(772.376), 0.96 (706.722) and 1.11 (738.398), each the mean of the three discharges, \
without a temperature correction (the paper itself calls the comparison difficult, \
p. 86). (2) Against werbowy_2026 (TC-1007): its Table 1 column 'From the ion \
broadening A, Ref. [23]' (this paper) gives Delta alpha_0 = 160, 160, 160, 160 and \
130 kHz/(kV/cm)^2 for 706.722, 738.398, 751.465, 763.511 and 772.376 nm; the 696.543 \
and 727.294 nm lines measured here are not quoted there. Werbowy's Eq. 4 relates A \
and W_e to Delta alpha_0; the values were not recomputed here.

FOR OEP 8. Nothing direct: plasma broadening at 16 000 K and 7 x 10^22 m^-3, not \
neutral-gas broadening of the 4p levels.

FURTHER DATA CITED AND NOT IN THE LIBRARY (argon Stark widths): Jones, Musiol and \
Wiese, Spectral Line Shapes 2, 125 (1983); Sohns and Kock, JQSRT 47, 325 (1992); \
Djeniže, Skuljan and Konjević, JQSRT 54, 581 (1995); Dimitrijević, Skuljan and \
Djeniže, Phys. Scr. 66, 77 (2002); Vitel and Skowronek, J. Phys. B 20, 6477 (1987); \
Griem, Spectral Line Broadening by Plasmas (1974)."""
