citation = "S. Carusotto, E. Iacopini, E. Polacco, F. Scuri, G. Stefanini and E. Zavattini, \"Measurement of the Kerr constant of He, A, O2, N2, H2 and D2\", Nuovo Cimento D 5, 328 (1985)"
doi = "10.1007/bf02451253"
library = "Carusotto_1985_MeasurementKerrConstant"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Absolute dc Kerr effect at 514.5 nm (200 mW argon-ion laser) and room \
temperature, mostly at about 1 atm: a Kerr cell with stainless-steel electrodes 498.8 \
mm long, 10.33 mm apart, field sinusoidally modulated at 39.0675 Hz; a quarter-wave \
plate converts the ellipticity to a rotation, a glass Faraday cell modulated at 418.663 \
Hz acts as carrier, an air Faraday cell calibrates the conversion; heterodyne detection \
with two phase-sensitive detectors and a Fourier analysis of 500 s records (the \
ellipsometer of Carusotto et al., J. Opt. Soc. Am. B 1, 635 (1984)). K from Eq. (12) with \
G1 G2 = 1537 +- 2 and Phi_M = (349.0 +- 3.5) x 10^-6 rad; pressure from a Bourdon gauge \
(1 %), temperature by a thermocouple (0.2 %) (pp. 329-335)."""
notes = """Pages are the journal's (328-338; p. = pdf page + 327). The library copy has no \
validation warnings; Tables I and II agree with their images.

DEFINITION (p. 328): 'In a gas, the Kerr constant K is defined as Delta n = n_par - n_perp \
= K rho E^2 (Eq. 1), where rho is the gas density', in amagat ('the density is given in \
amagat, i.e. in moles per molar volume', p. 329), E in statV/cm; unit of K 'StatV^-2 cm^2 \
amagat^-1' (Table I note). The measured K is the total dc Kerr response (for the \
molecules the orientation term included). Stored as kerr_constant with the unit \
cm2/statV2 amagat, as carusotto_1992.

UNCERTAINTY. Table I: 'The error quoted for K is the statistical error obtained by \
performing several independent measurements of 500 s each'; Table II: 'The errors quoted \
in this table include the systematic contributions due to the uncertainty in the \
density, in the electric-field integral and in the value of Phi_M. We have estimated \
the systematic errors to be 2.5% of the signal' (p. 336). Levels not stated. \
carusotto_1992 later says of this measurement that it 'showed errors due to the \
uncertainty in the density of gases, in the electric field integral and in the Faraday \
modulation'.

UNIT MISPRINT: Table II's header prints 'K x 10^17 (StatV^-1 cm^2 amagat^-1)' (image \
checked), Table I's note 'StatV^-2 cm^2 amagat^-1', which Eq. (1) requires. The unit is a \
record field, not a data column, so no erratum can hold it: every dataset is recorded in \
cm^2 statV^-2 amagat^-1 (FORMAT GAP: no erratum for a unit).

STATES DISAGREE: Table II gives He at 8 atm and the others at 1 atm (Ar 1-2 atm), all at \
293 K, but Table I's densities are 7.84 and 7.75 amagat for He (8.3-8.4 atm at 293 K; 8 \
atm would be 7.46 amagat) and 1.05-1.07 amagat for O2 and N2, 1.30 for H2 and D2 (1 atm \
at 293 K is 0.932 amagat). The per-amagat K does not depend on which is right, and \
Table I's densities are what K was reduced with. The datasets' states are Table II's.

DISCUSSION (p. 337): 'since all the measurements have been performed at frequencies \
much smaller than the one of the first gas absorption line, the dispersion effect \
should be negligible'; agreement with Buckingham's group 'quite good for helium, argon \
and nitrogen'; hydrogen higher than Buckingham & Orr's, ascribed to 'a wrong value of \
B_k' in their fit (Eq. 16, K = A_k + B_k rho).

Reproductions elsewhere (re-pointed to this record): carusotto_1992/kerr_*_ref3 (N2 \
17.3, H2 4.32, D2 4.42); hellwarth_1990 (the kerr_carusotto_* values and ratios); \
bishop_1989 and shelton_1994 (the He row 'ref 19', 47.3 +- 3 au, a conversion to gamma); \
bishop_1991/expt_dc_kerr_H2 (820 +- 49 au at 5145 A, a conversion); tammer_1990 Table 2 \
(transferred to 632.8 nm); hattig_1998 (N2)."""

