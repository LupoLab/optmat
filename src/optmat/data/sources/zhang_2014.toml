unit = "au"
scale = 2
abscissa = "field"
abscissa_unit = "au"
columns = { intensity = "W/cm2" }
use = "primary"
notes = "Table X (p. 3), column 'Gamma/2: GSZ': the half static ionisation rate of Ar+ in the Green-Sellin-Zachor potential, Eq. (6), Table II, computed by complex scaling (theta = 0.4) of the single-active-electron Hamiltonian Eq. (4) in a static field, against the field amplitude (au) over 0.075-0.395 au (2.0e14-5.5e15 W/cm^2); the intensity printed beside each field is the column intensity. 'Half': the complex eigenvalue is E_r - i Gamma/2, 'the imaginary part gives one-half of the ionization rate' (p. 3), so the table prints Gamma/2 and the rate is Gamma; scale = 2 turns the printed Gamma/2 into Gamma (au). That Gamma, not Gamma/2, is the rate Eq. (8) fits is confirmed by the Ar check (tableXI_Ar). What the rate counts: one active electron in the SAE potential; the rate of that one electron (Eq. (1) takes m = 0), with no occupation factor. 'the multielectron effects beyond the SAE approximation on ionization have not been included' (p. 4). No accuracy is stated. The values are transcribed from the table image and checked against the library's scrambled text layer and its OCR reading (the script)."
[datasets.parameters]
wavelength_nm = inf
polarization = "static"
potential = "GSZ"

