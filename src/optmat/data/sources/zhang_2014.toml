citation = "Q. Zhang, P. Lan and P. Lu, \"Empirical formula for over-barrier strong-field ionization\", Phys. Rev. A 90, 043410 (2014)"
doi = "10.1103/PhysRevA.90.043410"
library = "Zhang_2014_EmpiricalFormulaOver"
identity = "VALIDATED"
kind = "theory"
technique = """Static-field ionisation rates of Ar and Ar+ (and He, Ne, Kr, Xe in the \
figures) from the complex eigenvalue of the single-active-electron Hamiltonian Eq. (4) \
in a dc field, by complex scaling (rotation angle theta = 0.4, the stationary point, \
p. 2), in three model potentials: Tong and Lin's (Eq. (5), Table I), Green, Sellin and \
Zachor's (GSZ, Eq. (6), Table II) and Muller's (Eq. (7), Table III); bound-state \
energies of each potential (Tables IV-VIII). A parabola in E/E_b is fitted to the \
logarithm of the ratio of these rates to the ADK rate, Eq. (1), giving the modified \
empirical formula Eq. (8) and its coefficients (Table XI), valid for E/E_b = 0.5-4.5."""
notes = """Journal pp. 043410-1 to -7 = pdf pages 1-7. Identity checked against pdf p. 1 \
(Qingbin Zhang, Pengfei Lan and Peixiang Lu). solprop's BSI_ZHANG_COEFFICIENTS (He, Ne, \
Ar, Kr, Xe) are this paper's Table XI, digit for digit (checked against the image, \
2026-09-27); solprop drops the leading minus sign of Eq. (8) (TC-439), and that reading \
is right (below).

EXTRACTED. Table XI (p. 4): a_1, a_2, a_3 for He, Ne, Ar, Kr, Xe and Ar+ (H, the \
hydrogen atom, not curated: 0.11714, -0.90933, -0.06034). Tables IX and X (p. 3): Gamma/2 \
of Ar and Ar+ against the field amplitude, one dataset per potential (the rate is Gamma \
= 2 x the printed value: scale 2). Tables I-III (p. 2): the parameters of the three \
potentials (H skipped). Structural fixes in the script (the a_2/a_3 rows of Table XI \
merged character by character; Tables IX and X scrambled in the text layer), each value \
transcribed from the image and checked against the library's cells; no misprint of a \
value is corrected. Two cells of Table IX (F = 0.12177 au, Muller and Tong-Lin) are \
excluded as inconsistent (the datasets say why).

THE FORMULAS (pp. 2-4, atomic units). Eq. (1), ADK: W_ADK(E) = C_l^2/(2^|m| |m|!) \
(2l + 1)(l + |m|)!/(2 (l - |m|)!) kappa^-(2Z_c/kappa - 1) (2 kappa^3/E)^(2Z_c/kappa - |m| \
- 1) exp(-2 kappa^3/3/E), 'm = 0 in our calculation', kappa = sqrt(2 I_p), 'C_l is the \
coefficient that describes the electron wave function in the asymptotic region and its \
expression can be found in [27]' (ref. 27 is Corkum, PRL 71, 1994 (1993), which gives no \
C_l; the Ar check below shows that C_l = 2.44 of tong_2002 Table II was used). This is \
tong_2005's Eq. (3). Eq. (3), Tong and Lin: W_TL = exp[-alpha (Z_c^2/I_p)(E/kappa^3)] \
W_ADK. E_b = I_p^2/4/Z_c (p. 1), 'the barrier-suppression strength'. Eq. (8): W_M(E) = \
exp[-(a_1 E^2/E_b^2 + a_2 E/E_b + a_3)] W_ADK(E) as printed (formula eq8). Eq. (9): Error \
= (W - Gamma)/Gamma. Eq. (10): P = 1 - exp^(int W[E(t)] dt) as printed (the minus sign \
of the exponent is missing: P = 1 - exp(-int W dt)).

THE SIGN (AND THE BASE) OF EQ. (8). As printed, the factor is exp[-(a_1 x^2 + a_2 x + \
a_3)], x = E/E_b; with Table XI's a_2 < 0 it exceeds one and grows with x (Ar: e^1.02 at \
x = 1). The paper's own numbers say the factor is exp[+(a_1 x^2 + a_2 x + a_3)], the \
reading solprop adopted (TC-439):
- Table IX against Eq. (8) for Ar (Tong-Lin potential, Table XI's Ar coefficients, I_p = \
15.7596 eV, C_l = 2.44 of tong_2002, l = 1, m = 0, Gamma = 2 x the printed Gamma/2): \
W_M/Gamma = 1.04, 0.955, [1.20], 1.02, 1.02, 1.01, 1.01, 1.01, 1.00, 0.999, 0.997, \
0.993, 0.990, 0.988, 0.989 over the fifteen fields (E/E_b = 0.64-3.76; the bracketed \
row is the excluded cell). With the printed minus sign the same ratio is 3.2 at the \
first field and 439 at the last. With 10^(+poly) it is 0.49 to 0.019; with Gamma taken \
as the printed Gamma/2, exactly 2 throughout (2.07-1.98).
- A free parabola fitted to ln(2 x Gamma/2 / W_ADK) of Table IX's Tong-Lin column gives \
a_1 = 0.168, a_2 = -1.511 against Table XI's 0.16178, -1.50441; fitted to log10 it gives \
0.073, -0.656. So the coefficients fit the natural logarithm with a positive sign, and \
the constant a_3 absorbs C_l^2 = 2.44^2: the implied C_l is 2.40-2.50 at every field \
(checked 2026-09-27, a scratch script).
- Tong and Lin's alpha = 9 for Ar (tong_2005) gives W_TL/Gamma = 0.94, 0.95, [1.20], \
1.01, 0.98, 0.93, 0.88, 0.83, 0.78, 0.72, 0.68, 0.60, 0.53, 0.47, 0.41: right to about \
2 E_b and too low beyond, which is the paper's finding (p. 5).
- Figs. 1 and 2 label their ordinate 'log10(Gamma/W_ADK)', but the values plotted (Ar: \
-1.0 at E/E_b = 1, -2.0 at 2, -2.75 at 3, -3.15 at 4.5; Ar+: -0.1 at 0.6, -2.8 at 2, \
-4.6 at 4.5) are a_1 x^2 + a_2 x + a_3 itself, which the Table IX check shows is \
ln(Gamma/W_ADK): the axis label is a second slip, and it cannot be the basis of a \
10^(poly) reading, which fails Table IX by factors of 2 to 50.
The correction is recorded on the formula (eq8's leading_sign). Occupancy: W_M, like \
Gamma, is the rate of the one active electron (m = 0), with no factor for the other \
electrons of the shell.

TABLES IV-VIII (p. 2, notes only): bound-state energies (hartree) of He, Ne, Ar, Ne+ and \
Ar+ in the GSZ, Muller and Tong-Lin potentials, against 'NIST' (ref. 32: 'The atomic \
spectra includes the multielectron effect ... We show only one or two values for each \
eigenstate'). The ground states: He 1s -0.91724 (GSZ), -0.90337 (Muller), -0.90382 \
(Tong-Lin), -0.90395 (NIST); Ne 2p -0.79466, -0.79892, -0.79331, -0.79281; Ar 3p \
-0.57830, -0.58052, -0.57858, -0.57940; Ne+ 2p -1.53671 (GSZ), -1.50522 (Tong-Lin), \
-1.50641 (NIST), no Muller; Ar+ 3p -1.02093, -1.01212, -1.01494, -1.01583. Tables V, VI \
and VIII are scrambled in the library; these were read on the images. Excited states \
(2s-3d, 4s-4p) are printed too and not taken.

TEXT VALUES (notes only). SAE models: 'When the intensity is lower than 1 x 10^15 \
W/cm^2, the relative deviation [of the Tong-Lin potential's rates from the other two] \
is about 10%. It gradually decreases to 5% at 2 x 10^15 W/cm^2 and finally decreases to \
1% at 3 x 10^15 W/cm^2' (p. 4). Validity: 'The relative errors are less than 0.2 for He, \
Ne, Ar, Kr, and Xe atoms. For the Ar+ ion, the relative errors are less than 0.15 if 0.7 \
< E/E_b < 4.5, but slight larger if E/E_b < 0.7'; Tong and Lin's Eq. (3) for He: \
relative error 0.02 at E/E_b = 1.5, 0.29 at 2.5 and 0.74 at 4.5 (p. 5). Ar in a 2 fs \
pulse (Fig. 6): saturation (99 % ionisation) at 3.47 E_b (2.98 x 10^15 W/cm^2) with \
Tong-Lin and 4.06 E_b (4.08 x 10^15 W/cm^2) with Eq. (8) (p. 6). 5 x 10^15 W/cm^2 is \
4.5 E_b for Ar (p. 1). Figures (not digitised): Figs. 1-2 the log ratio for Ar and Ar+ \
with the linear and parabolic fits; Figs. 3-4 the rates of Ar and Ar+ from ADK, WFAT, \
Tong-Lin, Eq. (8) and the Schrodinger equation; Fig. 5 the relative errors of Eqs. (3) \
and (8) for He, Ne, Ar, Kr, Xe, Ar+; Fig. 6 Ar ionisation probability in a 2 fs pulse."""

[[formulas]]
id = "eq8"
material = "Ar"
equation = "Eq. (8), p. 4"
printed = "W_M(E) = exp[-(a_1 E^2/E_b^2 + a_2 E/E_b + a_3)] W_ADK(E)"
variable = "E: static field (au); E_b = I_p^2/(4 Z_c), the barrier-suppression field (au); W_ADK: Eq. (1), with the C_l of tong_2002 Table II and m = 0; a_1, a_2, a_3: Table XI (the datasets tableXI_<target>)"
range = "E/E_b = 0.5-4.5 ('the upper limit of applicable field strength for this formula is determined to be 4.5 E_b', p. 6)"
coefficients = { leading_sign = "-1" }
check = "With the leading sign corrected to +1, Table XI's Ar coefficients, C_l = 2.44 and Gamma = 2 x Table IX's Tong-Lin Gamma/2, W_M/Gamma = 0.955-1.04 at the fourteen consistent fields, E/E_b = 0.64-3.76 (checked 2026-09-27; the record's notes give every ratio). As printed, W_M/Gamma = 3.2-439. The material is nominal: the formula takes each target's own a_1-a_3 (He, Ne, Ar, Kr, Xe, Ar+)."
notes = "Printed with a leading minus sign inside the exponential; the paper's own Table IX, Figs. 1-2 and Table XI require exp(+(a_1 x^2 + a_2 x + a_3)), a factor below one that falls with E (the correction below). The a_i are fitted to the natural logarithm of Gamma/W_ADK, Gamma the full static rate (twice the tabulated half rate)."

[[formulas.corrections]]
term = "leading_sign"
printed = "-1"
corrected = "+1"
reason = "The minus sign printed before the parenthesis of Eq. (8) makes the correction factor exceed one (Ar: 2.8 at E = E_b, 21 at 3.8 E_b), where the paper says the ADK rate 'significantly overestimates the ionization rate' (p. 5) and the factor must lie below one; Table XI's coefficients fit ln(Gamma/W_ADK) with a positive sign."
evidence = "Eq. (8) as printed on p. 4 (page image checked 2026-09-27). With +1: Table IX's Ar rates (Tong-Lin potential, Gamma = 2 x Gamma/2) are reproduced to 0.955-1.04 with C_l = 2.44 (tong_2002 Table II), and a parabola fitted to ln(Gamma/W_ADK) from Table IX returns a_1 = 0.168, a_2 = -1.511 against the printed 0.16178, -1.50441; Figs. 1-2 plot a_1 x^2 + a_2 x + a_3 falling from -1 to -3.2 (Ar). solprop reads it the same way (TC-439)."

