citation = "W. R. Garrett, W. R. Ferrell, M. G. Payne and J. C. Miller, \"Influence of third-harmonic fields on multiphoton ionization of noble gases in unfocused laser beams\", Phys. Rev. A 34, 1165 (1986)"
doi = "10.1103/physreva.34.1165"
library = "Garrett_1986_InfluenceThirdHarmonic"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Multiphoton ionization of xenon near its three-photon resonances (6s, 6s', \
5d, 7s J = 1; Kr 5s') with unfocused, linearly polarized dye-laser beams (excimer \
pumped; 1-15 mJ, 10-12 ns, 1.5 cm^-1, or 1-8 mJ, 4 ns, 0.3 cm^-1), single-pass and \
counterpropagating, detected by proportional counters calibrated at every pressure \
against 55Fe x rays (11.5 cm counting length). In Xe-Ar and Xe-Kr mixtures the \
ionization at the frequency where the third harmonic is phase matched on the blue \
(negatively dispersive) side of a Xe resonance mimics the third-harmonic output; the \
phase-matching detuning and the width of the profile, analysed with the theory of \
Payne, Garrett and Ferrell (Phys. Rev. A 34, 1143 (1986)), give the oscillator strength, \
the dimer absorption coefficient and n(3 omega) of the buffer gas."""
notes = """Journal pages 1165-1177 = PDF pages 1-13 (page 14 repeats Fig. 1). Identity \
checked against the first page.

WHAT THE PAPER GIVES FOR DISPERSION. The phase-matching condition in a mixture of an \
active gas A (Xe) and a buffer B (Ar or Kr), Eq. (9)-(12), pp. 1169-1170: Delta k = \
3 k_omega - k_3omega = (3 omega / c)[n(omega) - n(3 omega)] = Delta k_0 + kappa / \
Delta_r, with kappa = 2 pi omega_r N_A |D_01|^2 / (hbar c) = pi N_A (e^2 / m c) F_01 \
the resonant part, Delta_r = 3 omega - omega_r, and Delta k_0, nearly frequency \
independent, the buffer's part (proportional to P_B). Delta k = 0 at the detuning \
Delta_m = -kappa / Delta k_0, i.e. a wavelength shift Delta lambda_m = C P_A / P_B, C \
'a slowly varying function of lambda' (Eq. (12)). With F_01 known, Delta_m gives \
n_B(omega) - n_B(3 omega) (p. 1174). This is the Delta k = 0 condition of a MIXTURE, \
N_A Delta alpha_A + N_B Delta alpha_B = 0 with Delta alpha = alpha(3 omega) - \
alpha(omega), so N_A / N_B = -Delta alpha_B / Delta alpha_A. The package's \
phase_match_density_ratio is Shelton's equal-mismatch ratio, rho_gas / rho_ref = \
Delta alpha_ref / Delta alpha_gas (positive): the printed (positive) mixture ratios \
are its negative and cannot be stored in it, and no other quantity holds them. They \
are recorded here (TC-717):
- p. 1171 and Fig. 7: 6.8 Torr Xe + 800 Torr Ar (P_Xe / P_Ar = 0.0085, printed), \
phase matched at 439.62 nm, Delta lambda = -1.26 nm from the 6s [3/2] J = 1 \
three-photon resonance at 440.88 nm (laser wavelengths; harmonic 146.54 nm); laser \
bandwidth 0.013 nm. Theory inputs: sigma = 0.3e10 s^-1, F_01 = 0.28 (Chashchina and \
Shreider), beta = 1.3e-4 P_Xe P_Ar (cm^-1, Torr).
- Fig. 6 (p. 1170), printed in the figure: P_Xe = 1.1 Torr, kappa = 2.48e14 P_Xe \
(rad s^-1 cm^-1, Torr), Delta k_R = -0.057 P_Ar (cm^-1, Torr): the argon mismatch at \
the 6s phase-matching wavelengths (about 146.5 nm; temperature not stated). With the \
case above they give Delta lambda_m = -1.27 nm (computed), against the printed -1.26. \
The peaks for P_Ar = 95-179 Torr are not digitised: their positions on the raster \
axis do not follow Eq. (12) with these constants (for 179 Torr the peak lies near \
439.6 nm, where the constants predict 440.0 nm).
- p. 1176, Fig. 11: P_Xe = 0.76 Torr, P_Ar = 202.2 Torr: the phase-matching peak \
coincides with the 4f [3/2] J = 2 resonance at 440.3 nm (laser), so Delta k = 0 at \
440.3 nm for P_Xe / P_Ar = 0.00376 (computed); the wavelength is printed to 0.1 nm.
- p. 1172, Fig. 8: P_Xe / P_Ar = 0.0198 (P_Xe = 2.64 Torr, 133 Torr Ar), Delta \
lambda_m = -1.004 nm from the 5d [3/2]_1 level (whose wavelength is not printed; 10.401 \
eV in chan_1992's table, i.e. 357.61 nm laser, 356.61 nm phase matched, harmonic \
118.87 nm).
- p. 1174, Fig. 10: P_Xe = 4.04 Torr, P_Ar = 701 Torr, 5d [3/2]_1, FWHM 0.0079 nm. \
The text prints Delta lambda_m = -2.47 nm, the caption -0.247 nm. The caption is \
right: Eq. (12) scales Delta lambda_m with P_Xe / P_Ar, and -1.004 nm at 0.0198 gives \
-0.29 nm at 0.00576 (the text's value would need a C ten times larger); -0.247 nm \
places the harmonic at 119.12 nm, the wavelength of ferrell_1987's argon point \
(119.120 nm). Not a dataset, so recorded as a finding, not an erratum.
- p. 1173, Fig. 9: Xe with Kr buffer, Delta lambda = -1.64 nm from the 6s resonance \
(harmonic 146.41 nm); the pressure ratio is not printed. Its analysis (p. 1175) gives \
F_01 = 0.26 for Xe 6s (J = 1), 2 beta = 1e-4 P_Xe P_Kr (cm^-1, Torr), and the krypton \
refractivity per atom at 146.4 nm (the dataset below).

The text's '[n_Kr(3 omega) - 1]/N_Kr = 2.61 x 10^-23 cm^-3' (p. 1175) has the unit \
misprinted as in Ferrell et al. (1987): the quantity is in cm^3 (a Kr refractivity of \
7.0e-4 at 2.69e19 cm^-3). The 'more complete study' announced there (Ref. 19) is \
ferrell_1987, whose krypton point at 146.413 nm (2.607e-23) is this value to more \
digits, and whose argon points at 146.542 and 119.120 nm come from the Xe-Ar \
conditions above: this paper's numbers are the same determinations, never to be fitted \
beside ferrell_1987's.

Third-order data (checked 2026-09-29): none. The three-photon Rabi frequency and the \
sum alpha(omega) of Eq. (19) are symbolic; no chi(3) or gamma value is printed, and \
Omega_3 is 'not measured' (p. 1168). No third-order dataset."""

[[datasets]]
id = "experiment_Kr"
material = "Kr"
points = [["146.4", "146.4", "2.61e-23"]]
table = "text"
quantity = "refractivity_per_density"
unit = "cm3"
abscissa_unit = "nm"
wavelength_medium = "vacuum"
state = "1atm_0C"
density = "unknown"
use = "check"
notes = "p. 1175: 'we obtained for krypton an index of refraction per atom of [n_Kr(3 omega) - 1]/N_Kr = 2.61 x 10^-23 cm^-3 at lambda_3omega = 146.4 nm' (unit misprinted: cm^3), from the fit of theory to the Xe-Kr phase-matching data of Fig. 9 (Delta lambda = -1.64 nm from the Xe 6s resonance at 440.88 nm, harmonic 146.41 nm), with n_Kr(omega) taken as known. No uncertainty stated. Per atom, so the state is nominal (0 C, 1 atm). The same determination as ferrell_1987/experiment_Kr (2.607e-23 at 146.413 nm), reported there to more digits: a check, never fitted beside it."
