citation = "W. F. Chan, G. Cooper and C. E. Brion, \"Absolute optical oscillator strengths for the photoabsorption of molecular oxygen (5-30 eV) at high resolution\", Chem. Phys. 170, 99 (1993)"
doi = "10.1016/0301-0104(93)80096-r"
library = "Chan_1993_AbsoluteOpticalOscillator_374fef"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """High-resolution dipole (e,e) spectroscopy: electron energy-loss spectra at 3 keV \
impact energy and zero mean scattering angle, 0.048 eV FWHM, 6-30 eV energy loss (the \
title says 5-30 eV), multiplied by the spectrometer's Bethe-Born factor and normalised \
at 26 eV (smooth continuum) to the TRK-sum-rule-normalised low-resolution (1 eV FWHM) \
dipole (e,e) df/dE of Brion, Tan, Van der Wiel and Van der Leeuw (1979): independent \
of optical measurements, photon flux and density, and free of line saturation (pp. \
2-3). Integrated oscillator strengths over energy ranges by integrating the \
high-resolution df/dE. Background gases and non-spectral electrons removed by \
quartering the sample pressure; energy scale from helium's 21.218 eV line admitted \
with the sample. Medigas O2, 99 % (p. 3)."""
notes = """Values per molecule; no density or state involved (room-temperature O2, not stated). \
Uncertainty: 'The uncertainties in the presently reported absolute oscillator \
strengths are estimated to be +-5%' (p. 3). The paper tabulates no df/dE: the 5-30 eV \
spectrum is in Figs. 1-3 only (with Brion et al.'s 1979 low-resolution points and \
Samson and Haddad's double-ion-chamber data above 18 eV). The Schumann-Runge bands \
below 7 eV were too weak to be observed (p. 3).

Table 1 (p. 7, 'Absolute optical oscillator strengths ... 9.75-11.89 eV'; its last row \
reaches 12.07 eV): the diffuse bands between the Schumann-Runge continuum and the \
first ionisation potential (12.071 eV), integrated over the printed ranges: present \
work, Huebner et al. (electron impact, 100 eV, 0.02 rad) and Ogawa and Ogawa (their \
Beer-Lambert data integrated over the same ranges), as interval datasets; Lewis et \
al.'s two values (isotopic O2) and three theories' band strengths (Buenker et al., \
Yoshimine et al., Li et al.) as band datasets with rows E0-E2 (E 3Sigma_u-, v' = 0-2) \
and Pi0-Pi2 (2 3Pi_u, v' = 0-2; Buenker et al.'s assignments, note a, peaks at 9.96, \
10.28, 10.57 eV and 10.90, 11.24, 11.55 eV). Table 2 (p. 9): intervals 12.070-18.287 \
eV (present work, 39; Huebner et al. 12.070-14.056, 16).

Text values (inline datasets, pp. 5-9): the Schumann-Runge continuum, 6.56-9.46 eV: \
present 0.169, Lassettre and Skerbele (corrected GOS extrapolation) 0.179; 9.46-10.7 \
eV: present 0.0185, Lassettre and Skerbele 0.020; the total up to the first ionisation \
potential (12.07 eV): present 0.198; 12.10-14.04 eV: present 0.151, Huebner et al. \
0.181; 12.07-16.53 eV: present 0.578, Berkowitz's 0.724 from Matsunaga and Watanabe's \
tabulated data, Chan et al.'s re-integrations of Matsunaga and Watanabe (0.587 from \
their digitised Figs. 1-2, 0.685 from their Table 1, which holds only a third of their \
data) and of Huffman et al.'s figures (0.685); below 18 eV: 1.13 (present, high \
resolution) and 1.12 (Brion et al. 1979, low resolution). Huebner et al.'s \
Schumann-Runge continuum value, 0.161 (p. 5), and their total to the IP, 0.198 (p. 8), \
are not extracted: the ranges they integrate are not given.

Checks (2026-09-27): the Table 2 present intervals from 12.070 to 14.056 eV sum to \
0.1511 (text: 0.151 for 12.10-14.04 eV) and Huebner et al.'s to 0.1804 (text: 0.181); \
from 12.070 to 16.481 and 16.581 eV to 0.569 and 0.586 (text: 0.578 for 12.07-16.53 \
eV); the Table 1 present column sums to 0.0281, and 0.169 (6.56-9.46 eV) + 0.0281 = \
0.197 (text: 0.198 to the IP, the remainder 9.46-9.75 eV); the Table 1 intervals \
9.75-10.71 eV sum to 0.0175 (text: 0.0185 for 9.46-10.7 eV). Table 2 continues to \
18.287 eV (sum 12.070-18.287: 0.985).

Relations: Brion et al. (1979), the absolute scale here, is reprinted in brion_1984 \
(O2 table). kumar_2011_supplement's O2 DOSD takes its intervals j = 4, 7-11 and 15-17 \
from this paper (integrated by Kumar and Thakkar, not reprinted). Olney et al. \
(olney_1997) refined this spectrum with Brion et al.'s (1979) for their O2 dipole \
sums."""

