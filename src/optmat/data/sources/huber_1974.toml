citation = "M. C. E. Huber and G. Tondello, J. Opt. Soc. Am. 64, 390 (1974)"
doi = "10.1364/josa.64.000390"
library = "Huber_1974_RefractiveIndexHe"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Wavelength shifts of about 30 emission lines (argon ringing discharge) in a \
windowless 3 m normal-incidence spectrograph filled with helium near 700 Torr and \
evacuated in turn, measured against first-order standards; more than 70 measurements \
of some 30 lines between 919 and 1910 A."""
notes = """Table I lists values read from the best-fit curve through the measurements, \
not the individual measurements (which are shown only in Fig. 1). Pressure (about \
700 Torr, +-0.03 %) and temperature (about 290 K, +-0.07 %) were measured and the data \
'reduced to normal pressure and temperature (NPT)'; the paper does not say how, so the \
density convention is unknown (for helium the real and ideal densities at 0 degrees C \
differ by 5e-4, far below the 3 % uncertainty). The standards' wavelengths in helium \
were computed from Mansfield & Peck's dispersion formula (valid down to about 250 nm)."""

[[datasets]]
id = "experiment"
material = "He"
file = "He/huber_1974__experiment.csv"
table = "tbl_6b16f76840f9"
quantity = "refractivity"
scale = 1e-5
abscissa_unit = "angstrom"
wavelength_medium = "vacuum"
state = "1atm_0C"
density = "unknown"
use = "primary"
notes = "Smoothed best-fit values at 92-190 nm; 'probable error in the best-fit curve smaller than +-3 %' (p. 391)."
[datasets.uncertainty]
relative = 0.03
level = "probable error"

