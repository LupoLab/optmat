citation = "I. D. Petrov, V. L. Sukhorukov, M.-W. Ruf, D. Klar and H. Hotop, \"Near-threshold photoionization from the excited mp5(m + 1)p J = 0-3 levels of Ar, Kr and Xe (m = 3-5)\", Eur. Phys. J. D 62, 347-359 (2011)"
doi = "10.1140/epjd/e2011-10667-5"
library = "Petrov_2011_NearThresholdPhotoionization"
identity = "VALIDATED"
kind = "theory"
technique = """Calculated one-photon photoionisation cross sections of the ten levels mp5 \
(m+1)p, J = 0-3 (Paschen 2p1-2p10) of Ar, Kr and Xe, total and partial (into the \
2P3/2 and 2P1/2 ion), near threshold, including the autoionising mp5(2P1/2) ns', nd', \
ng' resonances between the two thresholds, in the configuration interaction \
Pauli-Fock approach with core polarisation (CIPFCP): Pauli-Fock orbitals with the \
relativistic compression of the core, initial- and final-state configuration \
interaction (scheme (2): intershell 4p4 n/epsilon l, 4s 4p6 epsilon l, 4p5 p/f, and \
the coupling of the channels and resonances) in second-order perturbation theory, the \
Slater integrals scaled by the factors of Table 1. Length and velocity gauges agree \
(Fig. 2); the length gauge is shown. Selected autoionisation spectra (Ar, Kr) are \
compared with atomic-beam measurements (cw two-step laser excitation of metastables, \
ion detection), convolved with the experiment's 0.4-1 cm-1 resolution."""
notes = """Eur. Phys. J. D 62(3), 347-359 (2011) = PDF pages 1-13 (journal page = PDF page \
+ 346). Identity checked on the first page (PDF p. 1: journal, volume, pages, DOI, \
title, authors, Rostov-on-Don and Kaiserslautern, received 22 November 2010, final form \
4 February 2011, published online 17 May 2011) on 2026-10-12. Table 2 checked cell by \
cell against the table image; Figs. 3-5 read from the vector drawing and inspected as \
overlays (below).

LEVELS. The paper names each level by its Paschen label and its jK label (pair-coupling \
nl[K]J, a prime for the 2P1/2 core); NIST's configuration, term and J follow from the \
jK label directly (src/optmat/data/external/nist_asd/<X>_I_levels.tsv), and each \
dataset's initial_level gives both. The figures' panels carry each gas's own Paschen \
label: Kr 2p2 = 5p'[3/2]2 and 2p3 = 5p'[1/2]1, Xe 2p8 = 6p[5/2]3 and 2p9 = 6p[5/2]2, \
the reverse of Ar (Table 2's footnote e), as NIST's energies order them (Kr 5p'[3/2]2 \
97945.17 above 5p'[1/2]1 97919.15 cm-1; Xe 6p[5/2]3 78403.06 above 6p[5/2]2 78119.80). \
Table 2's rows carry Ar's Paschen labels with one jK column, and its values for Kr and \
Xe belong to the jK label: the curves at threshold match Table 2 by jK within 0.06 Mb \
(Kr [3/2]2' 15.82 against 15.81 and [1/2]1' 16.13 against 16.09; by the Paschen label \
they would miss by 0.27 and 0.32 Mb; Xe [5/2]3 6.78 against 6.77, [5/2]2 7.58 against \
7.58, by Paschen 0.8 Mb), so the datasets are named by jK (pp12_0 = p'[1/2]0, p52_3 = \
p[5/2]3 and so on) and their rows keep Table 2's printed Paschen label.

ENERGY AXIS (a decision of this record). Figs. 3-5 and Table 2 give the cross sections \
against the 'relative (photon) energy' omega_1/2 above the level's mp5 2P1/2 ionisation \
threshold (pp. 350-351), 0 to 6 eV; at omega_1/2 = 0 the photoelectron of the 2P3/2 channel \
has Delta_FS, that of the 2P1/2 channel none. The quantity is held against the photon \
energy, so the scripts add the level's 2P1/2 threshold, E(2P3/2 limit) + Delta_FS - \
E(level), from NIST's levels (the paper's energies are experimental, Fig. 1's caption, \
ref. 55): Ar 2.4572 (4p'[1/2]0) to 3.0301 eV (4p[1/2]1), Kr 2.4089 to 3.3620, Xe \
2.2950 to 3.8561 (each dataset's notes). Delta_FS (NIST, Ar_II, Kr_II, Xe_II_levels.tsv) \
is 0.17749, 0.66581 and 1.30642 eV; the paper prints 0.178, 0.666 and 1.306 (p. 349) \
and 177.5 meV for Ar (p. 353) (script check). Nothing is shifted beyond this \
conversion; the printed omega_1/2 of each vertex is kept in printed.

RANGE AGAINST OEP 8's DRIVES. 0-6 eV above the 2P1/2 threshold covers every drive: Ar \
4p'[1/2]0 at 184.0 nm (6.738 eV) is omega_1/2 = 4.28 eV, 4p[1/2]0 at 186.8 nm 3.97 eV, \
4p[3/2]2 at 188.3 nm 3.82 eV, 4p[5/2]2 at 189.4 nm 3.70 eV (the third photon of the \
two-photon drive; photoelectron about 3.9-4.1 eV above the 2P3/2 threshold); Xe \
6p[1/2]0 at 248 nm (5.0 eV) 1.50 eV; Kr 5p[1/2]0 at 212.6 nm (5.83 eV) 2.83 eV. Read \
off the curves (linear interpolation of the vertices): Ar 2p1 2.39 Mb at 184.0 nm, 2p5 \
2.03 at 186.8 nm, 2p6 2.31 at 188.3 nm, 2p8 2.55 at 189.4 nm; Xe 6p[1/2]0 3.35 Mb at \
248 nm and 1.47 at 193 nm, 6p[3/2]2 2.70 and 1.21; Kr 5p[1/2]0 3.03 Mb at 212.6 nm. \
These are bound-free continuum values: the autoionising resonances lie between the \
2P3/2 and 2P1/2 thresholds (omega_1/2 < 0), below every drive.

WHAT IS TAKEN (tools/extract/petrov_2011.py). Per gas and level (30 levels, 120 \
datasets): (1) Table 2 (p. 352), sigma_tot^0 (tot_*), sigma_3/2^0 (s32_*) and \
sigma_1/2^Delta_FS (s12_*), one point each, channel total, '2P3/2 ion', '2P1/2 ion', \
use primary (the paper's own calculation; no uncertainty stated). No unit is printed \
in Table 2; it is Mb, the figures' unit, with which the totals agree. The ratio column \
r(Delta_FS) = sigma_1/2^DFS / sigma_3/2^0 is derived (checked by the script for all 30 \
rows to the rounding) and not taken. (2) Figs. 3-5 (p. 351), the total sigma_tot \
against the photon energy, every vertex of the drawn line inside the frame (42-61 per \
level, omega_1/2 from 0 or 0.02-0.05 eV, where the drawn lines start, to 5.5-6.0 eV, \
where the frame clips them), fig_*, digitised vector, use check (data rule 8). The \
drawn lines begin at omega_1/2 = -0.02 to 0.05 eV and there equal Table 2's \
sigma_tot^0 within 0.06 Mb for all 30 levels (script check); the ticks lie on their \
scales within 0.05 pt. Uncertainty 0.1 Mb absolute, not stated by the paper: the \
drawing's reproduction of the printed threshold values (0.06 Mb) with margin; the line \
is 0.85 pt wide, 0.23-0.34 Mb on the three y scales (Ar 14.5 pt per 4 Mb, Kr 12.1, Xe \
9.9). Overlays inspected: the extracted vertices drawn back on the rendered page lie on \
the black lines of all 30 panels (overlays made at curation, not archived).

NOT TAKEN. The partial curves sigma_3/2 (blue) and sigma_1/2 (dashed red) of Figs. 3-5: \
Table 2 prints their threshold values, the total is drawn and read, and several \
partial curves are drawn x10 (marked by arrows) and dashed. Figs. 2 and 6-8 (lineshapes \
of the autoionising resonances between the thresholds, against binding energy) and \
Figs. 9-12 (comparisons with experiment, relative units): resonance structure below \
the 2P1/2 threshold, not near OEP 8's drives; nothing in them is printed as a number. \
Table 1 (scaling factors of the Slater integrals): method parameters. The text's \
reduced widths of the nd'[5/2]3 series (81, 9501, 5955, 3796 cm-1 for Ne, Ar, Kr, Xe, \
p. 353) and r(J = 3) of Ne: no quantity.

FINDINGS (comparison with the held excited-state cross sections; Petrov read at the \
photon energy of each). Ar 4p at 248 nm: the (2J+1)-weighted mean of the ten levels \
4.72 Mb, 2p5 (4p[1/2]0) 4.31, 2p1 4.18; duzy_1980 (configuration average) 5.4, \
chang_1982 (4p 1S, J = 0) 4.8, hyman_1977 (J-averaged, 248.6 nm) 4.3 Mb. payne_1981's \
Ar 4p[1/2]0 '~1 x 10^-18 cm2' at 157.6 nm: Petrov 1.18 Mb. Kr 5p at 248 nm: mean 4.51 \
Mb; duzy_1980 5.2, chang_1982 4.5. payne_1981's Kr 5p[1/2]0 '10^-18 cm2' at 326.2 nm: \
Petrov 7.02 Mb, seven times larger. Xe 6p at 308 nm: mean 5.81 Mb; duzy_1980 7.6, \
chang_1982 6.9. Xe 6p[1/2]0 (2p5): kroll_1990 (measured) 4.3 +- 0.7 Mb at 248 nm and \
1.9 +- 0.7 at 193 nm against Petrov 3.35 and 1.47 (both within 1.4 sigma, low); \
pindzola_1981 Dirac-Fock length 3.05 at 4.97 eV and 1.85 at 6.20 eV against 3.40 and \
1.71, Hartree-Fock velocity 1.32 at 4.97 eV; payne_1981's '3 x 10^-18' at 249.6 nm \
against 3.41. Xe 6p[3/2]2 (2p6): kroll_1990 3.7 +- 0.7 and 1.8 +- 0.5 Mb against 2.70 \
and 1.21 (1.4 and 1.2 sigma low). The single-electron calculations (duzy_1980, \
chang_1982) lie 0-31 % above Petrov's level means; Petrov says its totals agree with \
them 'in general behaviour' (p. 352).

TWO-PHOTON DATA CITED, NOT IN THE LIBRARY: M. Stellpflug, M. Johnsson, I. D. Petrov, \
T. Halfmann, Eur. Phys. J. D 23, 35 (2003) (ref. 56: Xe 2p1 and 2p5 two-photon \
excited from the ground state, autoionisation spectra above them and the 5p6 \
admixture of the J = 0 levels). The single-electron calculations it compares with, \
Duzy and Hyman (ref. 65) and Chang and Kim (ref. 66), are duzy_1980 and chang_1982."""

