[[formulas]]
id = "static_fit"
material = "He"
equation = "Eq. (8), pp. 8-9"
printed = "Gamma(E) = (1/E^2) exp(-1/(1.47 x 10^-5 + 0.577 E)) + 6.183 (E - 0.1755)^4 Step(E - 0.1755)"
variable = "E: static field in au (E < 0.4 au); Gamma in au; Step(x) = 1 for x > 0, else 0"
range = "E < 0.4 au"
coefficients = { c0 = "1.47e-5", c1 = "0.577", A4 = "6.183", E0 = "0.1755" }
check = "Reproduces Table 1 'Present work' within 2.6 % at 24 of 26 fields; +7.3 % at 0.05 au and -6.5 % at 0.067 au; +0.2 % at 0.3773 au (computed 2026-09-26)."
notes = "'the E^4 model is based on only five data points' (p. 9). Times 0.146 I^0.25 (I in 1e14 W/cm^2, I = 14.0484 (E/0.2)^2) it gives the cycle-averaged static rate of Fig. 1 for I < 50e14 W/cm^2 (p. 9)."

[[formulas]]
id = "laser_fit"
material = "He"
equation = "Eq. (7), p. 7"
printed = "Gamma(Ibar, R) = exp(-R / sqrt(a0 + a1 Ibar)); 780 nm (R = 2.0): a0 = 0.0009882, a1 = 0.001485; 390 nm (R = 1.0): a0 = 0.0009900, a1 = 0.001630; 195 nm (R = 0.5): a0 = 0.0009800, a1 = 0.001750"
variable = "R: wavelength in units of 390 nm; Ibar = I R^2, I the (cycle-averaged) intensity in 1e14 W/cm^2; Gamma in au"
range = "Ibar < 16 (390 and 780 nm), Ibar < 8 (195 nm); fails at 195 nm below I = 1.0e14 W/cm^2 (p. 7)"
coefficients = { a0_780 = "0.0009882", a1_780 = "0.001485", a0_390 = "0.0009900", a1_390 = "0.001630", a0_195 = "0.0009800", a1_195 = "0.001750" }
check = "Not checkable: the laser-driven rates are in figures only."
notes = "Fits (the dashed lines of Figs. 3-5) to the non-resonant trend of the TDSE rates; resonances smoothed away. 'Over higher intensity ranges, the curves given in equation (5) of [1] may be used' (parker_2007)."
