citation = "M. L. Martin, R. D. Trengove, K. R. Harris and P. J. Dunlop, \"Excess Second Virial Coefficients for Some Dilute Binary Gas Mixtures\", Aust. J. Chem. 35, 1525 (1982)"
doi = "10.1071/ch9821525"
library = "Martin_1982_ExcessSecondVirial"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Pressure change on mixing (the method of Knobler et al.) in a Loschmidt \
mixing cell: equal volumes (c. 200 cm^3) of two pure gases at identical initial \
pressures P_1, very close to 190.0 kPa, mixed by forming an unstable boundary with the \
heavy gas on top; the final pressure P_inf read with a calibrated Texas Instruments \
quartz spiral gauge, and E computed from Delta P = P_inf - P_1 by Eq. (3) with the pure \
gases' B (and, for a small correction, their third virial coefficients) from Dymond and \
Smith's compilation. Water bath held to +-1 mK; 290, 300 and 320 K only (the cell's \
two lightly greased surfaces). Gas purities above 99.9 % (CF4 99.7 %) (p. 1528)."""
notes = """Identity: the PDF prints no DOI; the library found one work whose title, first \
author and year agree with the first page (Aust. J. Chem., 1982, 35, 1525-9; manuscript \
received 10 March 1982). Page numbers are the journal's: p. = pdf page + 1524.

WHAT THE VALUES ARE (p. 1525). E = B_12 - (B_11 + B_22)/2 (Eq. 2), which the authors \
call the excess interaction second virial coefficient, and the interaction (cross) \
coefficient B_12. Their footnote distinguishes it from the excess second virial \
coefficient of a mixture, B_m^E = B_m - (x_1 B_11 + x_2 B_22) = 2 x_1 x_2 E. E is what \
was measured (from Delta P, Eq. 3); B_12 follows from E and the compiled pure B's \
(Table 1, Dymond and Smith 1980), and 'may need to be recalculated when more accurate \
B_11 and B_22 data become available' (p. 1528). So E is primary, B_12 a check, and \
Table 1 reproduced. E is symmetric in the pair: a pair is filed under the first \
species in sorted order whatever the printed order. No mole fraction applies (E does \
not depend on composition; the cell mixes equal volumes at equal pressure).

TABLES EXTRACTED (all on p. 1526): Table 1, the pure B's used (He, Ne, Ar, H2, N2, O2, \
CH4, CO2; reproduced); Table 2, the two runs per temperature for Ar-N2 (P_1, Delta P, E, \
B_12; E and B_12 as checks); Table 3, E and B_12 of the twenty pairs at 290, 300 and \
320 K. Each grid was compared with its table image cell by cell (2026-10-01): no \
differences. The library attaches Table 2's caption to Table 1 and the label 'Table 3' \
to Table 2's grid; the page image fixes which is which.

SKIPPED. The three pairs with CF4 (Ar+CF4, CH4+CF4, CF4+Ne) and CF4's pure B (CF4 is \
not an optmat gas). In Table 3, CH4+CF4 at 300 K prints E = 17.9 and B_12 = -47.5, \
where Eq. (2) with Table 1 gives -46.45: a misprint of one of them, not resolved here. \
Table 4 (p. 1527), Brewer's E for Ar-N2, Ar-H2 and N2-He interpolated from his report \
(Brewer 1967, not in the library), and Fig. 1, the same comparison over a wider \
range, are other work: the values are in the dataset notes. Table 5 (p. 1527), the \
excess molar enthalpies of equimolar mixtures at 300 K and 190 kPa computed from E by \
Eq. (1) (each +-1.0 J/mol), has no quantity in the vocabulary.

CHECKS. (1) B_12 = E + (B_11 + B_22)/2 with Table 1 reproduces every printed B_12 of \
the seventeen extracted pairs within 0.10 cm^3/mol, the rounding of E and B_12 to 0.1 \
(51 cells: 48 within 0.05, 3 at 0.10). (2) Eq. (3) as printed, without the \
third-virial correction, with R = 8.314 J/(mol K), Table 1's B and Table 2's P_1 and \
Delta P, gives E = -0.645, -0.658 (290 K), -0.599, -0.599 (300 K), -0.666, -0.519 \
(320 K) cm^3/mol for the six Ar-N2 runs, which round to the printed -0.6, -0.7, -0.6, \
-0.6, -0.7, -0.5. (3) Table 3's Ar+N2 row is the mean of Table 2's runs (B_12 -7.2 at \
320 K from -7.3 and -7.1).

UNCERTAINTY. 'We believe the accuracy of the E values to be approximately +-0.2 \
cm^3 mol^-1' (p. 1528): recorded as absolute 0.2, level not stated. The runs' Delta P \
is printed to 0.1 Pa (a subscript guard digit); 0.1 Pa in Delta P is about 0.014 \
cm^3/mol in E at 190 kPa and 300 K. No uncertainty is given for B_12 or for Table 1.

DOUBTS. The temperatures are nominal (290, 300, 320 K; the bath is held to +-1 mK \
but its absolute temperature is not stated). The third-virial correction ('a small \
correction', ref. 4) is not given, so Eq. (3) can be checked only to the printed \
rounding."""

