method = "many-body perturbation theory (Brueckner-Goldstone diagrams), explicit sum over HF V^(N-1) bound (ten or so per l, then the n^-3 rule) and continuum (76-point k mesh, radial cut-off R = 20.365 bohr; 90.0 bohr for the 5s, 6s, 3d, 4d length elements near the 5s and 3d resonances) intermediate states; experimental (Moore) bound excited-state energies and 3p ionisation energy 0.579 a.u. (15.755 eV); photoelectron energy k^2/2 = epsilon_3p + 2 omega (Eq. 26); second order plus third-order intrashell ground-state correlations (Figs. 5(a), 5(b)) and the intrashell intermediate-state diagram of Fig. 5(c) with l'' = 0, which brings in the 4s and 5s 1P resonances"
definition = "sigma/F, the cross section of Eq. 24 (sigma proportional to the photon flux F = nc) over F, printed in 10^-18 cm^2 per atomic unit of flux; times 1e-18 cm^2 a0^2 t0 = 6.7736e-52 it is the generalised cross section in cm4 s, W = (sigma/F) F^2 with F in photons cm^-2 s^-1 (the record's notes)"
channel = "3p5 kf 1D"
