citation = "C. H. Yuen, P. Modak, Y. Song, S.-F. Zhao and C. D. Lin, \"Modeling the sequential dissociative double ionization of O2 by ultrashort intense infrared laser pulses\", Phys. Rev. A 107, 013112 (2023)"
doi = "10.1103/PhysRevA.107.013112"
library = "Yuen_2023_ModelingSequentialDissociative"
identity = "VALIDATED"
kind = "theory"
technique = """The density-matrix model of sequential double ionisation (DM-SDI; Yuen and \
Lin 2022, yuen_2022) extended to O2, Eqs. (1): MO-ADK rates (Tong et al. 2002) from \
O2 to the O2+ X 2Pi_g, a 4Pi_u and b 4Sigma_g- states and from these to eight O2^2+ \
states (Table II); the a and b states coupled by the field, and, new here, couplings \
between the dication states (Table IV); fixed nuclei at R = 1.21 angstrom, isotropic \
alignment average, KER spectra convolved with Gaussians of 0.4 eV resolution. Where \
one orbital leads to several dication states of one configuration (states 1-3, \
states 4-5), one effective binding energy is used, the multiplicity-weighted mean of \
the state energies (E_b = dE1/2 + dE2/4 + dE3/4; dE4/3 + 2 dE5/3), with rate weights \
(p. 3). Electronic structure: SA-CASSCF/CASPT2 with the ANO-L basis in OpenMolcas \
at R = 1.21 angstrom, 1sigma_g and 1sigma_u frozen, active space 2sigma_g, 2sigma_u, \
3sigma_g, 1pi_u, 1pi_g and 3sigma_u; SA3-CASSCF(11,8) for the O2+ a-b dipole, SA8- \
and SA6-CASSCF(10,8)/CASPT2 for the triplet and singlet O2^2+ states. Structure \
parameters by the method of Zhao et al. 2010 (zhao_2010)."""
notes = """Journal pages 013112-1 to -10 = PDF pages 1-10; the library copy is the version \
of record. Identity checked on PDF p. 1 (C. H. Yuen, P. Modak, Yan Song, Song-Feng \
Zhao and C. D. Lin; received 19 October 2022, published 24 January 2023) on \
2026-10-09. The register entry is TC-956.

THE PULSE OF THE MODEL (p. 4): 'a linearly polarized Gaussian laser pulse with peak \
intensity at 1.2 x 10^15 W/cm2, central wavelength of 800 nm, and pulse duration of 8 \
fs' (Fig. 2, against Voss et al. 2004 and Wu et al. 2010, the latter's spectrum \
shifted by 0.8 eV; Wu et al. used 780 nm, 1e15 W/cm^2). The pulse form is that of \
yuen_2022 (the duration an intensity FWHM). Also 564 and 1675 nm (Fig. 7), aligned and \
antialigned distributions (Fig. 8), intensities around 12 x 10^14 W/cm^2 and a volume \
average (Figs. 9-10). 'the ratios between the peaks could vary by about +-20% when the \
peak intensities vary also by +-20%' (p. 8).

TABLE I (p. 2): taken. I_p 'Experimental vertical ionization potential ... to the O2+ \
states [36]' (Baltzer et al. 1992): 12.3, 16.7 and 18.2 eV, the same as zhao_2010's \
Table IV (also Baltzer et al.); a copy, not fitted beside it. The C_lm are captioned \
'structure parameters of the O2 orbitals for MO-ADK tunnel ionization rates [37]' \
(ref. 37 = Zhao et al. 2010) but are not zhao_2010's printed values (TC-956): HOMO \
1pi_g {0.69, 0.06} against zhao_2010's {0.52, 0.03} (Table III) and zhao_2017's {0.64, \
0.04}; 1pi_u {1.86, 0.36, 0.02} against {2.04, 0.33, 0.01}; 3sigma_g {3.49, 2.06, \
0.25} against {3.05, 1.59, 0.08} (Table V). The ratios differ by orbital and by l, so \
it is not a change of normalisation. They are recorded as this paper's (use = check).

TABLE II (p. 2): taken. Calculated vertical I_p to the O2^2+ states with two valence \
holes; 'The zero of energy is set to be the zero-point energy of O2', and 'The \
calculated energies were systematically shifted such that the B 3Pi_g state has I_p = \
43.46 eV' (the value of Bao et al.'s fit of the O2 normal Auger spectrum, p. 4); states \
1 and 2 agree with Bao et al.'s 43.05 and 44.2 eV (p. 4). 'The indexes are arranged \
according to the KER, which are obtained by subtracting the I_p by the dissociation \
limit': I_p - KER is 35.68 eV for O+(4S) + O+(2D) and 32.35 eV for O+(4S) + O+(4S) \
(checked by the script); the limits' energies are not printed, so no \
dissociation_energy dataset is made. Fig. 1's caption: 'dissociation limits of states \
2 and 4-7 are different from Table II since these states dissociate through spin-orbit \
interactions with other states'; Table II's limit is the one each state reaches. The \
parent O2+ states of each row are in the printed cells.

TABLE III (p. 3): taken. 'Effective binding energies of the spin-up orbitals of the X \
state and its structure parameters, assuming the remaining electron in the 1pi_g \
orbital is spin down'; the same C_lm 'were also used for ionization from the a and b \
states, as well as for the spin-down orbitals' (p. 3). The binding energies are model \
inputs (multiplicity-weighted means), so ionization_model_parameter, not \
ionization_energy.

TABLE IV (p. 4): taken, material O2++ (registered in TC-954). Calculated transition \
dipoles (au) between O2^2+ states, all along x (perpendicular to the axis): W 3Delta_u \
- B 3Pi_g, B 3Sigma_u- - B 3Pi_g, A 3Sigma_u+ - B 3Pi_g, 1 1Sigma_u- - 1 1Pi_g ('the \
dipole moment between W 3Delta_u and B 3Pi_g is double counted since both states are \
doubly degenerate').

TEXT VALUES (taken as points): the O2+ a-b transition dipole, '0.29 x atomic units' \
(SA3-CASSCF(11,8)/CASPT2, p. 4, agreeing 'with the result from Ref. [35]', Marian et \
al. 1982), with the calculated a-b excitation energy 1.42 eV against the experimental \
1.5 eV; the quintet states 1 5Sigma_g+ and 1 5Pi_u at 45.5 and 46.9 eV (SA3-CASSCF(10,8) \
/CASPT2) with KER 13.2 and 11.2 eV to O+(4S) + O+(4S) and O+(4S) + O+(2D) (p. 5); \
footnote 41 (p. 10): 'The binding energies for the 1pi_g orbital of the a and b state \
are 26.2 and 25.3 eV. Their structure parameters C_lm are {1.83, 0.23} and {1.72, \
0.24}'. Not taken: the two lowest 2Pi_u states of O2+, 5.56 and 6.98 eV above X (p. 4, \
unreachable by tunnelling, no state energy needed by any model here).

FIGURES (not digitised; all vector drawings): Fig. 3, the populations of the O2^2+ \
states 0-7 left by the 800 nm, 8 fs, 1.2e15 W/cm^2 pulse with the KER spectrum; Fig. 9, \
the angle-averaged yield of states 0-3 and 6 against peak intensity; Fig. 7, the \
yields at 800, 564 and 1675 nm; Figs. 2, 4-6, 8, 10, KER spectra. Fig. 1 (potential \
curves) from Refs. 25 and 34."""

