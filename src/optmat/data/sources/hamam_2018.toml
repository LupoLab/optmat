[[formulas]]
id = "keldysh_parameter"
material = "SiO2"
equation = "Eq. (1), p. 726"
printed = "gamma = omega (eps_eff m' / (I Z0 e^2))^(1/2)"
variable = "omega: laser angular frequency; eps_eff the effective band gap; m' the electron reduced mass; I the intensity; Z0 = 377 Ohm; SI units"
coefficients = { eps_eff = "9.0 eV", m_prime = "~m/2", Z0 = "377 Ohm" }
check = "Table 1's gamma are sqrt(2) times this formula with m' = m/2, i.e. equal to it with m' = m_e, to 4 digits, except one cell (2.05E-12 s, NA 0.225: 7.696 printed, 7.97 computed) (checked 2026-09-26)."
notes = "gamma > 1 is taken as multiphoton ionization, gamma < 1 as tunnelling (p. 726)."

[[formulas]]
id = "keldysh_rate"
material = "SiO2"
equation = "Eqs. (3)-(4), pp. 726-727"
printed = "W_MPI = (2 omega/9 pi) (m' omega/(hbar gamma gamma_1))^(3/2) Q(gamma, Delta) exp{-Gamma pi <Delta + 1>}; gamma_1 = (1 + gamma^2)^(-1/2); Delta = [2 eps_eff E'(gamma_1) / (pi hbar omega gamma gamma_1)]; eps_eff = eps_g + Z0 e^2 I/(4 m' omega^2) = eps_g [1 + 1/(4 gamma^2)]; Gamma = [K(gamma gamma_1) - E(gamma gamma_1)] / E(gamma_1); Q(gamma, Delta) = sqrt(pi/(2 K(gamma_1))) sum_n exp(-pi n Gamma) Phi(sqrt(pi^2 (2<Delta + 1> - 2 Delta + n)/(2 K(gamma_1) E(gamma_1)))); Phi(x) = int_0^x exp(y^2 - x^2) dy"
variable = "E~ and K~: printed 'E~ and K~ are the complete elliptic integral of the first and second kinds' (in that order, the reverse of the usual K first kind, E second); <x> the integer part; Phi Dawson's integral"
coefficients = { eps_eff = "9.0 eV" }
reproduced_from = ["L. V. Keldysh, Sov. Phys. JETP 20, 1307 (1965)", "A. Tien et al., Phys. Rev. Lett. 82, 3883 (1999)"]
check = "Not reproduced: the extraction of Eq. (3) is garbled in places (gamma_1 and Delta are typeset inline), and the paper prints no rate value to compare with."
notes = "Transcribed as rendered in the library text; compare the forms in couairon_2005 (Eqs. 7-8) and jing_2012 (Eq. 3), which differ in the arguments of the elliptic integrals and in the effective gap (jing_2012 prints E_g[1 + 1/(2 gamma^2)])."

[[formulas]]
id = "rate_equation"
material = "SiO2"
equation = "Eqs. (2), (5)-(7), pp. 726-727"
printed = "dn/dt = dn/dt|MPI + eta_AVI n - D n - R n^2 (2); eta_AVI = e^2 tau_m(eps) I(t) / (c n_r m' eps0 eps_g (omega^2 tau_m^2 + 1)) - m' omega^2 tau_m(eps) / (M (omega^2 tau_m^2 + 1)) (5); D = (tau_m eps_g/(3 m')) [(2.4/w0)^2 + (1/z_R)^2], z_R = n_r pi w0^2/lambda0 (6); tau_rec = R^-1 = 1.5 x 10^-13 s (7)"
variable = "n: conduction-electron density; tau_m the electron-phonon momentum relaxation time; M ~ 9.98e-26 kg; w0 the beam radius; z_R the Rayleigh length"
coefficients = { inverse_tau_m = "1e14 - 1e16 s^-1", M = "9.98e-26 kg", tau_rec = "1.5e-13 s", n_cr = "1.45e19 cm^-3" }
check = "No rate values printed to reproduce."
notes = "Eq. (2) writes the recombination loss as R n^2 while Eq. (7) defines tau_rec = R^-1 (a linear-loss time); as printed. The pulse is I(t, r, z) = I_max exp(-4 ln 2 (t - tau_p)^2/(4 tau_p^2)) exp(-2(r^2/w0^2 + z^2/z_R^2)) with 2 tau_p the pulse width (Eq. 8)."
