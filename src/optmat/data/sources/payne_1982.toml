technique = """Review of resonance ionisation spectroscopy (RIS) for atomic and molecular \
physics: rate-equation theory of N-photon excitation by broadband lasers (Sec. II); \
two-photon excitation of Ar, Kr and Xe np5 n'p[1/2]0 levels with closure estimates of \
the two-photon matrix element (Sec. III.B, after Payne et al. 1981 (payne_1981)); \
proposed measurements of excited-state photoionisation cross sections, lifetimes, \
collisions and radiation trapping (Sec. III.C, D); estimates of three-photon \
excitation of He and Ne (Sec. III.E); RIS with pulsed supersonic beams, isotope-selective \
detection of 14C16O, laser-induced collisions (Sec. IV)."""
notes = """DATE. The volume page (p. 229) prints 'Copyright (c) 1981 by Academic Press', and \
the papers that cite it give 1981 (hattig_1998b, mccann_1988: 'Adv. At. Mol. Phys. 17, \
229 (1981)'); the publisher's registry (Crossref, via the library's metadata) gives \
1982. The record id follows the library (1982); the citation gives both.

Adv. At. Mol. Phys. 17, 229-274 = PDF pages 1-46 (journal page = PDF page + 228); a \
scan with a text layer. Identity checked against the first page (series, volume, \
title, authors, the table of contents with pages 229-272). No DOI is printed; the DOI \
is the registry's.

NOTHING TAKEN. What the review prints is either reproduced from other papers or not a \
quantity of the vocabulary:
(1) Xe two-photon excitation (pp. 246-247, Fig. 2): the fit to Chen et al.'s (1980) \
ionisation signal at 2496 A, K = 2 x 10^-9 s^-1 W^-2 cm^4 (R = K I^2) and sigma_1 = 3 x \
10^-18 cm2 for 5p5(2P3/2) 6p[1/2]0. Chen, Hurst and Payne's measurement (Chem. Phys. \
Lett. 75, 473 (1980); chen_1980), \
reproduced: not taken. 'Theoretical calculations using R_2 = 7 e^2 a0^2 and a laser \
linewidth of 0.08 A yielded 1 x 10^-9' for K (p. 247); payne_1981 (p. 146) prints k = \
1.3 x 10^-9 for the same R_2 and linewidth. 'Very little experimental information \
exists on the two-photon excitation of inert gases' (p. 246): the review reports no \
other measured two-photon rate, and none for argon. hattig_1998b (TC-887) cites this \
review (as 'Adv. At. Mol. Phys. 17, 229-274 (1981)') among four sources for an \
'experimental value of 2.05 x 10^-51 cm4 s' for argon's 4p J = 2 levels; it is not here. \
Of argon the review gives only scheme (a), 1576.3 + 2292.8 A to 3p5 4p[1/2]0, with the \
estimate R_2 = 1.7 e^2 a0^2 (p. 245).
(2) The closure rate formula K ~ 14 L_2^2 / [Delta^2(1) + Delta^2(2)]^(1/2) (Eq. 45, \
p. 246) and the radial integrals R_2 (Ar 1.7, Kr 3, Xe 7 e^2 a0^2; p. 245) are \
payne_1981's: not repeated. A bandwidth-dependent rate per squared intensity is not \
two_photon_excitation_cross_section.
(3) Figs. 5-7 (pp. 252-254): multiplet-averaged photoionisation cross sections of the \
excited ns, np and nd levels of Ne-Xe 'taken from Duzy and Hyman (1980)' (Phys. Rev. A \
22, 1878; not in the library), raster; reproduced, not digitised.
(4) Sec. III.E (pp. 261-262): order-of-magnitude three-photon excitation probabilities \
for He (2 x 1576.3 A + ~2260 A) and Ne (3 x 2208 A), with an unknown L_3 'typically \
1 <= L_3 <= 100': no value of a quantity. (mccann_1988's notes ascribe 'calculated \
two-photon and three-photon schemes' to payne_1981; the three-photon estimates are \
here, not there.)
(5) Table I (tbl_60839f23d26c): the radiation-trapping function H(y) of Eq. (65), a \
mathematical function. Table II (p. 268, tbl_498ff24a8fc6, image checked): \
rovibronic term values (cm^-1) of X, A and B of 12C16O, 14C16O and 12C18O, source not \
stated; isotopologue level energies have no quantity and only 12C16O (CO) is \
registered. DOUBT: 12C18O A, v = 1, J = 1 prints 67 759.75 between 67 256.69 (J = 0) and \
the step of +2.95 to +3.20 cm^-1 from J = 0 to 1 in every other A-state row; 67 \
259.75 is evidently meant (a misprinted digit). Not taken, so no erratum.

