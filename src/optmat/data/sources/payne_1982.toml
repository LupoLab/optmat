J. Bokor, J. Zavelovich and C. K. \
Rhodes, Phys. Rev. A 21, 1453 (1980) (bokor_1980, the Kr excited-state photoionisation \
cross section at one wavelength); M. Pindzola, Phys. Rev. A 23, 201 (1981) \
(pindzola_1981)."""
