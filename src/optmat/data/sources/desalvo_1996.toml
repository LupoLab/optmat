[[formulas]]
id = "beta_scaling"
equation = "Eqs. (1) and (2), p. 1327"
printed = "beta(omega) = K sqrt(E_p) / (n0^2 E_g^3) F2(hbar omega / E_g); F2(x) = (2x - 1)^(3/2) / (2x)^5"
variable = "x = hbar omega / E_g; beta in cm/GW, E_p and E_g in eV; n0 the linear index (Table II)"
coefficients = { K = "3100", E_p = "21" }
check = "With Table II's n0 and E'_g of Table I, Eqs. (1)-(2) give beta(266 nm) = 0.049 (BaF2, measured 0.06), 0.049 (SiO2, 0.05), 0.088 (Al2O3, 0.09); beta(532 nm) = 0.36 (LiNbO3, 0.38), 0.066 (KTP, 0.10), 0.73 (Te glass, 0.62). They reproduce the text's numbers exactly: BBO with E_g = 6.8 eV gives 0.765 at 266 nm and 0.066 at 355 nm ('beta = 0.77 cm/GW rather than ... 0.9' and '0.066 cm/GW rather than ... 0.01', p. 1329); with 6.45 eV, 0.905 at 266 nm (the beta fit); calcite with 8 eV gives 0.331 at 266 nm ('predicted to be 0.33 cm/GW', p. 1330) and with 6.8 eV 0.803 at 266 nm ('excellent agreement'). hbar omega = 1239.84 eV nm / lambda. Computed 2026-09-26."
notes = "The two-parabolic-band 2PA scaling (second-order perturbation theory, Refs. [18], [19]). K ~ 3100 from 'Fitting the semiconductor data of [19]' (p. 1327-1328); E_p, the Kane momentum parameter, 'has not been measured for the materials we study here, and we assume it has this same value of 21 eV' (p. 1327). beta vanishes for hbar omega < E_g/2."

[[formulas]]
id = "n2_scaling"
equation = "Eq. (3), p. 1328"
printed = "n2(esu) = K' sqrt(E_p) / (n0 E_g^4) G2(hbar omega / E_g)"
variable = "hbar omega / E_g; E_p and E_g in eV; n2 in esu (n = n0 + n2<E^2>)"
coefficients = { K_prime = "7.33e-9", E_p = "21" }
check = "Not reproduced: G2 for the two-parabolic-band model is not printed here (Refs. [6], [9])."
notes = "'With E_p and E_g in eV, a value of K = 3100 gives a value of K' = 7.33 x 10^-9 which is the value used throughout this paper. In [6], a value two times larger, K' = 1.5 x 10^-8, was given. There, the factor of two difference between degenerate and nondegenerate index changes was not properly accounted for (see [9] for corrections)' (p. 1328). Note: ensley_2019 (p. 37942) uses K' = 1.5e-8 with E_p = 21.4 eV."

[[formulas]]
id = "g2_kramers_kronig"
equation = "Eq. (4), p. 1328"
printed = "G2(x2) = (2/pi) int_0^inf F2(x1; x2) / (x1^2 - x2^2) dx1"
variable = "x_i = hbar omega_i / E_g; F2(x1; x2) the nondegenerate nonlinear absorption spectrum (2PA, electronic Raman, AC Stark), given in Refs. [6], [9]"
check = "Not reproducible from this paper alone (F2(x1; x2) not printed)."
notes = "The Kramers-Kronig relation giving the degenerate n2 dispersion from the nondegenerate absorption change."
