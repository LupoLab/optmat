citation = "R. DeSalvo, A. A. Said, D. J. Hagan, E. W. Van Stryland and M. Sheik-Bahae, \"Infrared to ultraviolet measurements of two-photon absorption and n2 in wide bandgap solids\", IEEE J. Quantum Electron. 32, 1324-1333 (1996)"
doi = "10.1109/3.511545"
library = "DeSalvo_1996_InfraredUltravioletMeasurements"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Single-beam Z-scan (open and closed aperture; closed/open division at 266 \
nm) at the four harmonics of a Q-switched, mode-locked Nd:YAG laser, TEM00, single \
pulses switched out; harmonics by KD*P crystals. Beam waists w0 (HW1/e^2M) and pulse \
widths tau_p (FWHM): 35 um and 30 ps at 1064 nm, 24 um and 22 ps at 532 nm, 19 um and \
17 ps at 355 nm, 16 um and 15 ps at 266 nm (p. 1326), pulse width by second-order \
autocorrelation; f ~ 150 mm best-form lenses; energies calibrated against a Laser \
Precision RJ-7620 / RJP-735 pyroelectric meter; pulse-width and energy windows \
(+-10 %); thin-sample approximation. 'All irradiances are quoted within the sample, \
i.e., I0 = (1 - R) I' (p. 1326)."""
notes = """Journal pages 1324-1333 = PDF pages 1-10 (p. 1326 = PDF p. 3). Identity \
checked against the first page.

WHAT IS HERE. Table I (tbl_9572f7715e3f, p. 1326; JSON only): E_g, E'_g, n2 (x 1e-14 \
esu) at 1064/532/355/266 nm and beta (cm/GW) at 532/355/266 nm for 11 materials. \
Table II (tbl_87c9f8dcbfd0, p. 1326): the linear index used. Both checked cell by cell \
against the table images (agree, including the quoted "6.8" and "8.0"). Extracted: \
E_g (kind optical, assumed input) and E'_g (kind assumed) as band_gap, beta as \
two_photon_absorption_coefficient, Table II as refractive_index (use check, assumed), \
Table I's n2 as nonlinear_index_field, and the two n2 values the text prints in cm2/W (BaF2, p. 1327) as nonlinear_index (check).

DEFINITIONS (p. 1327): 'In this paper we define the nonlinear index by n = n0 + \
n2<E^2>, where <> denotes a time average and n0 is the linear index. The relation \
between n2 in esu and in m^2/W is given by, n2(esu) = (c n0/40 pi) n2(MKS). The values \
of the linear indexes used are given in Table II.' beta: 2PA coefficient; the paper \
does not write the propagation equation, but beta is the coefficient of the Z-scan \
analysis of its Ref. [13] (dI/dz = -alpha I - beta I^2), in cm/GW, with irradiances \
inside the sample. Measured n2 is 'the bound electronic nonlinear refractive index' \
(abstract); with 15-30 ps pulses the Raman (nuclear) response is fully included \
(the curators' rule), and the paper does not separate it: part = 'total' for every n2.

N2 IN ESU (Table I). n2 of n = n0 + n2<E^2> in units of 1e-14 esu, recorded as \
nonlinear_index_field (one dataset per material; KTP per sample axis), converted to \
nothing. Layout: row 0 header 'n_2 \\times 10^{-14} esu' spanning columns 3-6, row 1 the \
wavelengths 1064/532/355/266 nm, rows 2-12 the materials; cells 'v±s'; 'NM' = not \
measured (KBr 355/266; LiNbO3, KTP, Te glass 355/266). The cells agree with the image \
(checked again 2026-09-26). Fused silica: 7.4±1.5, 7.8±1.6, 8.5±1.7, 28±6 (x 1e-14 \
esu) at 1064, 532, 355, 266 nm. With Table II's n0 and c = 2.99792458e8 m/s, 40 pi \
n2/(c n0) gives for SiO2 2.10, 2.21, 2.41, 7.82 (x 1e-16 cm2/W; sigma 0.42, 0.45, 0.48, \
1.68). Milam 1998 (milam_1998, Table 1, ref. 4) reproduces these as 2.14, 2.24, 2.41 and \
7.8 (+-0.43, 0.46, 0.48, and '0.17', corrected there to 1.7): Milam used an n0 other \
than Table II's 1.48 at 1064 and 532 nm (2.14 implies n0 = 1.4495, 2.24 implies 1.4596). \
Other cm2/W copies of this table: ensley_2019 (letter b, LiF with n0 ~ 1.39), \
van_der_linden_2025 (KBr at 1064 nm, 7.87, implying n0 ~ 1.545). The BaF2 text values \
(2.1e-16 at 532, 3.1e-16 cm2/W at 266 nm) are the authors' own conversions of Table \
I's 7.5 and 11 (dataset n2_BaF2_text, check).

UNCERTAINTY (p. 1326): 'The overall experimental uncertainty is approximately +-20 %. \
The primary uncertainties originate from the determination of the irradiance \
distribution'. Table I prints a +- per value (about 20 %); level not stated. \
Anisotropy: 'The orientation dependence (i.e., anisotropy) of the nonlinear \
coefficients is generally small, being less than +-25 %' (p. 1327).

'~0' CELLS: beta printed as '≅0' (no nonlinear absorption observed; e.g. BaF2 'No \
nonlinear absorption was observed at these wavelengths using open aperture Z-scans', \
p. 1326) are left out of the files: they are not numbers. LiF and MgF2 have no beta \
dataset (all '~0'); KBr '~0' at 532 nm, NM elsewhere.

THE MODEL (Section III): Eqs. (1)-(4), recorded as formulas. K ~ 3100 (beta in cm/GW, \
E_p and E_g in eV), fitted to semiconductor data of Ref. [19]; E_p = 21 eV assumed \
('It has not been measured for the materials we study here, and we assume it has this \
same value of 21 eV', p. 1327); K' = 7.33e-9 (n2 in esu), 'In [6], a value two times \
larger, K' = 1.5 x 10^-8, was given. There, the factor of two difference between \
degenerate and nondegenerate index changes was not properly accounted for' (p. 1328). \
G2 of the two-parabolic-band model is not printed here (given in Refs. [6], [9]).

FIGURES (not digitised): Figs. 1-2 Z-scans of BaF2 (1064/532/355 nm; 266 nm open, \
closed and divided); Fig. 3 scaled n2 vs hbar omega/E_g with G2; Fig. 4 earlier n2 data \
from Ref. [21] (Chase and Van Stryland, CRC Handbook 1994) scaled the same way; Fig. 5 \
log-log scaled n2 vs E_g; Fig. 6 scaled beta vs hbar omega/E_g; Figs. 7-8 the same with \
E'_g.

Samples: BaF2, MgF2, LiF supplied by LLNL (R. Adair); BBO and LiNbO3 by Crystal \
Technology; KTP by DuPont; tellurite glass by E. Vogel (Bellcore) and S. Aitchison \
(University of Glasgow); KBr from Infrared Optical Products of New York (footnotes 1, \
2 and acknowledgment). The footnote prints 'LiF_2' for LiF.

REFRACTIVEINDEX.INFO. The n2 pages 'DeSalvo' (Al2O3 'e', BaF2, LiF, MgF2 'o', SiO2) are \
Table I's esu values converted to m2/W with n0 values other than Table II's: they \
reproduce 40 pi n2/(c n0) with implied n0 of 1.4495-1.5009 (SiO2), 1.388-1.421 (LiF, \
where Table II prints 1.3, so the page is 7-9 % below a conversion with Table II), \
1.373-1.397 (MgF2), 1.466-1.512 (BaF2), 1.747-1.826 (Al2O3). The page's Al2O3 'e' axis \
is not in the paper (only 'E parallel to a crystallographic axis'); MgF2 'o' agrees \
with footnote 1. Pulse durations on the pages (15/17/22/30 ps) agree."""

[[datasets]]
id = "n2_BaF2_text"
material = "BaF2"
table = "text"
points = [["532", "532", "2.1", "0.4", "22000"], ["266", "266", "3.1", "0.6", "15000"]]
columns = { pulse_fs = "fs" }
quantity = "nonlinear_index"
unit = "cm2/W"
scale = 1e-16
abscissa_unit = "nm"
use = "check"
notes = "Text, p. 1327: at 532 nm, I0 ~ 103 GW/cm2, 'a fit to the data gives n2 ~ (2.1 +- 0.4) x 10^-16 cm/W or (7.5 +- 1.5) x 10^-14 esu' (the unit printed 'cm/W' is cm2/W: the esu value is Table I's); at 266 nm, 'The fit gives a value of n2 ~ (3.1 +- 0.6) x 10^-16 cm2/W or (1.1 +- 0.2) x 10^-13 esu' from the closed-aperture Z-scan with beta ~ 0.06 cm/GW (I0 ~ 72 GW/cm2), without subtraction of a linear background dip. The authors' own conversions of Table I's esu values (n2_BaF2, primary), hence use = check: never to be fitted beside Table I. BaF2 k || [100], E || [010]. n = n0 + n2 I implied by the unit (the paper's own definition is n = n0 + n2<E^2>, p. 1327). pulse_fs: FWHM at that harmonic."
[datasets.uncertainty]
column = true
level = "not stated"
[datasets.parameters]
part = "total"
coefficient = "self"
technique = "Z-scan (closed aperture)"
form = "bulk"

