citation = "P. R. Blazewicz and J. C. Miller, \"Nonlinear optical processes in xenon and krypton studied by two-color multiphoton ionization\", Phys. Rev. A 38, 2863 (1988)"
doi = "10.1103/PhysRevA.38.2863"
