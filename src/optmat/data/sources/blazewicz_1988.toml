kind = "measurement"
technique = """Two XeCl-pumped dye lasers (10 ns) focused from opposite sides into a \
stainless-steel ionisation cell: laser one (about 1 mJ uv, about 5 x 10^8 W/cm2) \
three-photon resonant with Kr 5s[3/2]1 (370.6 nm) or Xe 6s'[1/2]1 (388.6 nm) and \
generating its third harmonic; laser two (about 10^9 W/cm2) tuned to the one-photon \
transitions to higher even-parity levels (Kr 6p, Xe 5f). Electrons collected on a \
biased wire (gated integrator); the vuv third harmonic detected by photoionising NO \
in a second cell behind a MgF2 window. Xe 5-25 Torr (25 Torr with 150 Torr of Ar), Kr \
4 Torr (pp. 2864-2867)."""
notes = """No datasets. Identity checked on the first page: Blazewicz and Miller, Phys. \
Rev. A 38 (No. 6, 15 September 1988), 2863-2870; PDF pages 1-8 = journal pp. 2863-2870.

WHAT IT SHOWS (qualitative). At the three-photon J = 1 resonances (Kr 5s[3/2]1, Xe \
6s'[1/2]1) the third harmonic generated to the blue of the resonance (Delta k < 0) \
cancels the three-photon excitation (one- and three-photon paths interfere); the \
upper levels are then reached mainly by one third-harmonic photon plus one laser-two \
photon, which favours the J = 2 levels two-photon-allowed from the ground state (Xe \
5f[5/2]2 and 5f[3/2]2, Figs. 6-11), and by dissociation of collision complexes ('At 1 \
Torr, approximately 10 % of the molecules are best represented as such collision \
complexes' within the 10 ns pulse, p. 2864). Coupling to the four-photon level by laser \
two changes the third-harmonic phase matching, Delta k = Delta k0(delta1) / [1 - \
|Omega12|^2 / delta1 (delta2 + i Gamma2)] (p. 2870, after Payne and Garrett, \
unpublished): ionisation peaks turn into dips near optimum phase matching, and \
third-harmonic generation is enabled on the red side.

WAVELENGTHS. The printed 370.6 nm (Kr 5s[3/2]1; Fig. 4 caption 370.7 nm) and 388.6 nm \
(Xe 6s'[1/2]1) are air wavelengths: NIST (TC-983 levels) gives 3/80916.768 cm^-1 = \
370.75 nm and 3/77185.041 cm^-1 = 388.68 nm in vacuum, 370.65 and 388.57 nm in air. \
Fig. 10's caption puts laser one '0.5 A' to the red of 6s', the text '0.05 nm' (the \
same).

NOT TAKEN (no quantity): everything. The ion and third-harmonic yields are spectra in \
arbitrary units, in scanned (raster) figures; the paper prints no cross section, \
transition strength, Rabi frequency, n2 or chi(3) value. For OEP 6, Q2: the paper has \
no krypton two-photon ionisation data at all (no table, no vector or raster figure of \
a cross section). For OEP 8: nothing bears on the 6p[1/2]0 strength; the cancellation \
it shows needs a one-photon path to the resonant level, which the even-parity \
two-photon levels lack.

Register: TC-1000."""
