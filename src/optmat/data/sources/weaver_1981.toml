citation = "J. H. Weaver, C. Krafka, D. W. Lynch and E. E. Koch, Optical Properties of Metals, Part II: Noble Metals, Aluminum, Scandium, Yttrium, the Lanthanides and the Actinides (0.1 <= hv <= 500 eV), Physik Daten / Physics Data Nr. 18-2 (Fachinformationszentrum Energie, Physik, Mathematik, Karlsruhe, 1981), ISSN 0344-8401"
library = "Weaver_1981_OpticalPropertiesMetals"
identity = "ASSERTED"
kind = "compilation"
technique = """A data compilation (the companion volume, Nr. 18-1, has the transition metals \
Ti-Ni, Zr-Pd, Hf-Pt). For each element: a survey table of the published work \
(authors, energy range, technique, temperature, sample: film, crystal or bulk and its \
preparation, data presentation, remarks), a survey figure of the energy ranges, figures \
comparing the reflectance, epsilon_1, epsilon_2 and the absorption coefficient from \
the literature, and one table of the authors' choice of 'most reliable' optical \
constants: E (eV), epsilon_1, epsilon_2, n, k, Im(-1/epsilon) and R(phi = 0). \
ALUMINIUM (pp. 79-86): 'publication by E. Shiles, T. Sasaki, M. Inokuti, and D.Y. Smith \
in Phys. Rev. B 22, 1612 (1980) based on the following tabulation', i.e. Shiles et \
al.'s Kramers-Kronig analysis of compiled data with sum-rule tests (shiles_1980). GOLD \
(pp. 64-69): 'Unpublished reflectance data for electropolished Au(110) by J.H. Weaver \
(0.2 <= hv <= 4 eV) and C.G. Olson and D.W. Lynch (~4 <= hv <= 30 eV). Optical \
constants determined by Kramers-Kronig analysis.'"""
notes = """IDENTITY AND LIBRARY. original/source_01 (Cover-2.pdf, 28 pdf pages) is the \
front matter: title pages (pdf pp. 1-2), acknowledgements, preface, the introduction \
(Definitions; Methods of Measurement and Errors; Use and Misuse of the Data; pdf pp. \
5-24), its 67 references (pdf pp. 25-27) and Table 1, the abbreviations (pdf p. 28). \
source_02 Ag.pdf (11 pages ending with the table on book pp. 52-53; supplement_01), source_03 Al.pdf (pp. \
70-86; supplement_02), source_04 Au.pdf (pp. 54-69; supplement_03), source_05 \
Bibliography-2.pdf (pp. 239-256; supplement_04, text only). The copper chapter is not \
in the library (J. C. Travers's scan, pp. 32-42, is described below). The citation is \
the library's asserted BibTeX (no DOI; ISSN 0344-8401 and 'Nr. 18 - 2', 1981, from pdf \
p. 1). Page numbers below are the book's printed page numbers ('-79-').

WHAT THE INTRODUCTION SAYS (source_01 pdf pages). Range 25 A <= lambda <= 25 um, ~0.05 \
<= hv <= 500 eV, hv (eV) = 12398/lambda (A) (pdf p. 5). Convention exp(-i omega t), \
epsilon = epsilon_1 + i epsilon_2, N = n + ik = sqrt(epsilon), epsilon_1 = n^2 - k^2, \
epsilon_2 = 2nk, R = ((n - 1)^2 + k^2)/((n + 1)^2 + k^2) at normal incidence, mu = 4 pi \
k / lambda, loss function Im(-1/epsilon) = epsilon_2/(epsilon_1^2 + epsilon_2^2) (pdf pp. \
8, 13-14). Kramers-Kronig of the reflectance: 'the extrapolation errors affect the \
magnitude of epsilon_1 and epsilon_2 much more than they affect the positions and \
shapes of spectral structures'; for Mo their dispersion-integral results over 0.1-30 \
eV agree with photometric and ellipsometric data 'to within 10%, while an error \
analysis yields an estimate of possible errors of up to 50%' (pdf p. 17). \
Electropolishing leaves 'a smooth, strain-free surface, but one with an overlayer of \
oxide', which 'causes little error in the infrared reflectance, but above about 6 eV \
the 2p electrons of oxygen absorb and cause errors' (pdf p. 20). The tabulated data \
'were measured with bulk samples' and are less suitable than film data for modelling \
evaporated films (pdf p. 21). UNCERTAINTY: 'We believe that the data tabulated are good \
to within +-10% in most cases (except near places where epsilon_1 crosses zero, for \
which a relative error is meaningless)' (pdf p. 22), recorded as relative 0.10, level \
not stated, on the n and k datasets of both metals. The anomalous skin effect was \
ignored in obtaining epsilon (pdf p. 23). 'We have presented room temperature or liquid \
helium temperature data only' (pdf p. 23).

ALUMINIUM TABLE (pp. 79-86; datasets n_Al, k_Al primary, eps1_Al, eps2_Al check). \
Supplement_02 tables tbl_41f659cbf54e (p. 79), tbl_41f03578c473 (80), tbl_550bc2056f85 \
(81), tbl_6b7f728e7af0 (82), tbl_5937497d4313 (83), tbl_7ae05093ee33 (84), \
tbl_b1243e5e0609 (85), tbl_bd839bc39e50 (86): the page order is the pdf order, each page \
continuing the last (0.190/0.195, 1.460/1.480, 14.400/14.500, 25.500/26.000, \
72.400/72.500, 111.000/112.000, 340.000/350.000 eV). 447 rows, 0.040-1551.000 eV, \
energies as printed (1049.999, 1099.999 ...; 0.002 eV steps at 0.04-0.1 eV growing to \
0.05 eV at 0.6-1.2 eV, 0.02 eV over the 1.5 eV interband peak, 0.05 eV at 14.5-16 eV \
around the plasma edge, 0.1 eV at 72-74 eV at the L edge, 10-50 eV above 200 eV and 1-2 \
eV again at 1540-1551 eV), E, epsilon_1, epsilon_2, n, k, Im(-1/epsilon) to three \
decimals and R to four; the loss function and R are kept in printed. Each page was \
compared with its image. PROVENANCE: the book is where this tabulation was first \
printed: shiles_1980 (the analysis) says its full tabulation 'will be given \
elsewhere', citing Ref. 12, 'E. Shiles and D. Y. Smith (unpublished)'; so the datasets \
are this record's, with no reproduced_from, and shiles_1980 is the analysis (compiled \
reflectance, ellipsometry and absorption data joined by Kramers-Kronig and sum-rule \
tests, with kappa above the L edge reduced ad hoc by 14 % to satisfy the f-sum rule: \
see that record). ordal_1983's Shiles block is a reproduction of this table \
(reproduced_from shiles_1980 and this record); rakic_1995 took Shiles et al.'s k above \
14.9 eV through Palik's Handbook (Smith, Shiles and Inokuti), which is why it agrees \
with this table from ~35 eV. CHECKS (2026-09-28): in every row epsilon = N^2 holds within the bound set \
by the printed rounding (worst 0.97 of it, 0.650 eV), Im(-1/epsilon) from epsilon \
within its bound (worst 0.99, 1.280 eV) and R from N within 0.0016 (all within the \
bound) once three library misreadings are fixed in the script against the images \
(1.700 eV R .8977 for .8972; 27.000 eV epsilon_1 0.700 for 0.706; 134.000 eV \
Im(-1/epsilon) 0.036 for 0.038), and one misprint is corrected by erratum (17.500 eV k \
printed 0.036 for 0.038). k = 0.000: from 500 eV k prints 0.000 in all 47 rows \
(500-1551 eV; and epsilon_2 0.000 from 600 eV, Im(-1/epsilon) 0.000 from 600 eV): kept \
as printed, but these rows carry no absorption information (k < 0.0005 only; k = 0 \
cannot be used for an absorbing model): the range is cut at review. Above ~350 eV n \
also rounds to 0.996-1.000 (delta = 1 - n to one or two figures only).

ALUMINIUM COMPARISONS (2026-09-28; interpolated in this table). ordal_1983's Shiles \
block (26 points, 323-16100 cm-1, 0.040-2.0 eV, three figures): n within 0.85 % and k \
within 0.41 % (medians 0.01 % and 0.05 %), its rounding: a faithful copy. ordal_1988 \
(40 points, 0.043-1.86 eV, their own Kramers-Kronig with the cavity data, which uses \
Shiles et al. above 320 cm-1): n 2.1 % higher (median; up to 3.0 % at 1.61 eV), k 1.1 % \
higher (up to 1.35 %); e.g. 1.0 eV 1.233 + 12.61i against 1.212 + 12.46i. rakic_1995 \
(film data to 14.9 eV, Shiles et al.'s k above): 0.05 eV 68.5 + 164.8i against 75.0 + \
172.2i (n -9 %, k -4 %), 1.0 eV 1.316 + 12.24i against 1.212 + 12.46i, 2.0 eV 1.366 + \
7.405i against 1.304 + 7.479i, 5-10 eV within 1-5 % in k, at the plasma edge (15 eV) n \
0.151 against 0.125 and k 0.110 against 0.153, from ~35 eV the same to this table's \
three decimals. mcpeak_2015's film (200-1700 nm) against this table: |epsilon| 21-31 % \
smaller (31 % at 200 nm, 24 % at 500 nm, 21-22 % at 800-1700 nm; 1550 nm: -197.9 + 38.1i \
against -252.6 + 46.1i).

GOLD TABLE (pp. 64-69; datasets n_Au, k_Au primary, eps1_Au, eps2_Au check). \
Supplement_03 tables tbl_e1aa4a8fd3ac (p. 64, 49 rows), tbl_0099904bfe57 (65, 57), \
tbl_3b6da8494ea6 (66, 57), tbl_c59b9057cc82 (67, 57), tbl_22fe363af672 (68, 57), \
tbl_e323eaae89b9 (69, 7), in page order. 284 printed rows, 0.10-30.00 eV (0.05 eV steps \
to 1 eV, 0.1 eV to 2 eV, 0.05 eV to 2.3 eV, 0.02-0.03 eV to 3 eV, 0.05 eV to 5 eV, 0.1 eV \
to 16 eV, 0.2 eV to 30 eV), E, epsilon_1, epsilon_2, n, k, Im(-1/epsilon) to two \
decimals and R to three (epsilon also two decimals when large, e.g. -6794.55 at 0.10 \
eV). The book is now the printed source, so its rows are the primary data (n, k to two \
decimals: at 1-1.7 eV n = 0.13-0.08 carries only one or two figures; epsilon is the more \
precise there). CHECKS (2026-09-28): the library's cells were compared one by one with \
an independent transcription of the page images (made before the pages entered the \
library, from J. C. Travers's scans): they agree except four library misreadings, \
fixed in the script against the images (2.20 eV R .980 for .880; 2.50 eV epsilon_1 \
-1.96 for -1.86; 19.40 eV k 0.76 for 0.78; 28.80 eV epsilon_2 0.65 for 0.85). Then \
epsilon = N^2 holds in every row within the printed rounding (worst 0.93 of the bound, \
15.50 eV) and Im(-1/epsilon) within its (worst 0.97, 1.90 eV). The printed R is not \
the R of the printed n, k: from about 2.7 eV up, |(N - 1)/(N + 1)|^2 exceeds the \
printed R by up to 0.0064 (24.20 eV: .119 against 0.125), and falls below it by up to \
0.0049 elsewhere; R is presumably the measured reflectance the analysis started from \
(not stated). THE BOOK'S MISPRINTS (errata; register entries for review): the energy \
after 6.50 eV is printed '6.50' again (p. 66; the sequence and the workbook have 6.60; \
row id '6.50 (repeat)'), '26.50' is printed for 26.60 (p. 68); the 8.40 eV row is \
printed twice, identically (p. 66): the repeat, row id '8.40 (repeat)', is excluded. \
So 283 rows are used.

THE WORKBOOK'S COPY OF THE GOLD TABLE (datasets sheet_n_Au, sheet_k_Au, sheet_eps1_Au, \
sheet_eps2_Au, all check). J. H. Weaver's website workbook, the file behind babar_2015 \
(optical-constantsCuAgAu.xlsx, sheet 'JHW-Au-ZAED', fetched 2026-09-28 and attached \
to babar_2015's paper in the library): 217 rows, 0.1-30 eV, E (eV), R, n, k, e1, e2 \
(no loss function), on a grid of 0.1 eV to 1 eV, 0.2 eV to 2 eV, 0.1 eV to 4.4 eV, 0.2 \
eV to 6 eV, 0.1 eV to 16 eV and 0.2 eV to 30 eV (it leaves out 66 of the book's rows, \
all below 6 eV). Its e1, e2 are the book's (five figures where |epsilon| >= 1000, e.g. \
-6794.6 for -6794.55) and its n, k are sqrt(e1 + i e2) of them to five figures (to \
6.4e-5 relative), not the book's two-decimal n, k. Against the book, now settled on the \
library's cells and the images: the SHEET is wrong at 12.2 eV (e2 2.02; the book 2.03), \
17.6 eV (e1 0.86, copying the 17.8 eV row; the book 0.85) and 21.4 eV (e1 0.23; the book \
0.27, which with the book's n = 1.03, k = 0.88 is consistent; the sheet's n, k there, \
1.0135, 0.8929, are off by 1.6 %), and at 11.4 eV (R 0.11 for the book's .111). No book \
erratum follows from them: they are copying errors of Babar and Weaver's sheet. \
Otherwise the sheet's n, k round to the book's except at 27 rows (by at most 0.0071: \
the book's n, k were computed from unrounded epsilon) and the book's loss function \
agrees with the sheet's epsilon but for rounding (11 rows, 0.009 or less). The \
sheet's energies 6.6 and 26.6 confirm the two energy errata. Against ordal_1983's copy \
(Table 3's Weaver block, 21 rows, 807-16100 cm-1, reproduced_from this record): the \
same to its three figures (k within 0.14 at 41.7, 0.3 %).

GOLD: SAMPLE, TEMPERATURE. Electropolished Au(110) single crystal (p. 64 heading), \
bulk. The Au survey table (p. 57, 'Au-4') lists 'We Unpl, 0.26-4.2 eV, Refl, 4.2 K, \
X-tal, EP, A, absorptivity measured by calorimetry'; the bibliography (p. 255) gives \
'We Unpub: J.H. Weaver, Unpublished'. So the 0.2-4 eV part of the table MAY BE \
LIQUID-HELIUM-TEMPERATURE ABSORPTIVITY (4.2 K), not room temperature. The table's \
heading does not state a temperature, and 'OL Unpub' (C. G. Olson and D. W. Lynch, ~4-30 \
eV) has neither a survey-table entry nor a bibliography entry (the bibliography has OL81, \
Olson and Lynch on rare-earth trifluorides, not this). parameters.temperature_k is \
therefore not set; this should be decided before using the table as room-temperature \
gold below 4 eV (babar_2015 used this reflectance for its room-temperature Au analysis, \
its Fig. 3). Figs. 13-15 (pp. 60-62: R, epsilon_1, epsilon_2 to 30 eV) show 'We Unpub \
(~0.2-4 eV) and OL Unpub (~4-30 eV)' as the solid line among the other authors' data.

