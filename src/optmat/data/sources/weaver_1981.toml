SILVER (Ag.pdf, supplement_01; not extracted). Survey table and figures, then pp. \
52-53 (tbl_495baf394146, tbl_2489ab9aa2d9): 'Silver: publication by H.J. Hagemann, W. \
Gudat, and C. Kunz in J. Opt. Soc. Am. 65, 742 (1975) based on the following \
tabulation', 93 rows, 0.10-100.00 eV, two decimals (R three). It is a two-decimal \
reprint of the DESY report's silver table (hagemann_1974, Table 4: three figures, 5 meV \
to 50 keV, with the absorption coefficient, reflectance, loss function and n_eff) on \
a subset of its energies, so it adds nothing over hagemann_1974 and is not extracted. \
Against the workbook's HGK sheet (Hagemann et al.'s silver, 61 common energies, 0.1-30 \
eV): the same to the book's rounding except 11.00 eV (epsilon_1 2.00 against 2.08, n \
1.52 against 1.543), 13.00 eV (epsilon_1 2.33 against 2.392) and 21.50 eV (epsilon_1 \
1.23 against 1.28), and at the edges of rounding elsewhere. The library misreads four \
cells of this table (0.20 eV epsilon_2 '200.00' for 260.00; 3.50 eV epsilon_2 '0.00' \
for 0.60; 4.00 eV n '1.01' for 1.61; 10.00 eV k '0.50' for 0.56; checked on the image). \
The comparison with hagemann_1974 itself is another extraction's.

