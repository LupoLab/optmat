citation = "A. Kumar and W. J. Meath, \"Reliable isotropic and anisotropic dipole properties, and dipolar dispersion energy coefficients, for CO evaluated using constrained dipole oscillator strength techniques\", Chem. Phys. 189, 467 (1994)"
doi = "10.1016/0301-0104(94)00309-2"
library = "Kumar_1994_ReliableIsotropicAnisotropic"
identity = "VALIDATED_WITH_WARNINGS"
kind = "compilation"
technique = """Constrained anisotropic dipole oscillator strength distributions: the recommended \
isotropic CO DOSD of Jhanwar and Meath (1982, jhanwar_1982) split into perpendicular \
(Sigma -> Pi) and parallel (Sigma -> Sigma) components, df^z/dE = (1 + a_i^z) df/dE in \
each interval (Eq. (20)), the a_i^z fixed by constrained least squares to: S_2 and S_1 \
components from Mulder and Meath's calculated anisotropy ratios with the isotropic \
DOSD values (Eqs. (21)-(22)); S_0 = 14 each; S_-1^perp = 9.025 and S_-1^par = 11.13 \
(adjusted so that the isotropic S_k and L_k agree with the isotropic DOSD, Eq. (24)); \
and alpha^perp = 12.15 and alpha^par = 15.74 a0^3 at 6328 A (Eq. (25)), from Bridge \
and Buckingham's depolarization ratio (0.4800, error <= 1 %) and the isotropic DOSD's \
alpha(6328 A). Thresholds E_perp = 8.0278 and E_par = 8.0028 eV (Huber and Herzberg) \
(pp. 469-470). The properties are integrals over the component DOSDs (Eqs. (1)-(10))."""
notes = """Values per molecule, atomic units unless stated (alpha and gamma in a0^3); electronic \
only, not vibrationally or rotationally averaged. Isotropic P = (2 P^perp + P^par)/3 \
(Eq. (6)); gamma = alpha^par - alpha^perp (Eq. (5)). The DOSD is constrained to \
refractivity (through jhanwar_1982) and to Bridge and Buckingham's depolarization \
ratio: its results are checks against those data, not independent of them.

Table 1 (p. 471): S_k for k = 2, 1, 0, -1/2, -1, -3/2, -2, -3, -4, -5, -6, -8. \
Isotropic (this work and Ref. [22] = jhanwar_1982) extracted. The components have no \
quantity in the vocabulary (a format need) and are given here as printed: \
perpendicular 1.380(4)b, 1.417(2)b, 1.400(1)b, 9.718, 9.025b, 9.836, 1.189(1), \
2.146(1), 4.661(1), 1.139(2), 3.014(2), 2.458(3); parallel 1.376(4)b, 1.381(2)b, \
1.400(1)b, 1.093(1), 1.113(1)b, 1.270(1), 1.546(1), 2.628(1), 5.156(1), 1.136(2), \
2.757(2), 2.009(3) (b: constraints); so alpha^perp(0) = 11.89 and alpha^par(0) = 15.46 \
a0^3. Errors (note a): <~3 % for k = 2, <~2 % for k = 1, <~1 % for -4 <= k < 1, \
increasing slowly for k < -4. The isotropic S_-6 and S_-8 differ from jhanwar_1982 by \
1.2 % and 3.3 % (292.9 / 296.5, 2308 / 2387; the paper: 'appreciable (about 2-3%) only \
for the S_k for k = -6, -8 and 2').

Table 2 (p. 471): L_k and I_k (k = 2 ... -2) components and isotropic, with Ref. \
[22]'s isotropic: no quantity, not extracted (errors <= 1 %, L_-1 <~2 %). Relative \
anisotropies X(I_1) = 8 %, X(S_1) = -2.6 %, X(I_0) = -20 % (p. 472).

Table 3 (p. 473): alpha(lambda) and gamma(lambda) at 24 wavelengths (infinity and \
8000-1850.7 A), this work (errors <~0.5 % for alpha, <~1 % for gamma), with SOPPA \
values of Oddershede and Svendsen (Ref. [49]) and Jorgensen et al. (Ref. [50]) and \
experiment (note b: 'Ref. [41] for gamma = infinity' (sic: lambda), 'Ref. [16] all \
other wavelengths': Watson and Ramaswamy's static 13.08 and Smith, Huber and \
Parkinson's (smith_1976) UV values, converted by Kumar and Meath; Smith et al.'s error \
+-0.1 % above 2000 A and +-0.6 % below, p. 472). The wavelengths are vacuum (epsilon = \
hc/lambda; Smith et al.'s are vacuum). Text values (p. 472): gamma(0) of Wolf et al. \
6.57 (from their S_-2^perp = 10.97, S_-2^par = 17.54), Sunil and Jordan 3.79, Amos \
3.78 (CI; SCF 3.32), Werner and Meyer 3.91, Rijks and Wormer 3.15 (TDCHF) and 5.26 \
(MBPT), Hettema et al. 4.43, Diercksen and Sadlej 3.57; static isotropic S_-2: Watson \
and Ramaswamy 13.09, Wolf et al. 13.16, Hettema et al. 13.27, Sunil and Jordan 13.06, \
Werner and Meyer 13.05, Amos 13.01, Rijks and Wormer 13.64 (MBPT) and 12.25 (TDCHF); \
averaging raises S_-2 by about 0.6 % (Amos). Bogaard et al.'s measured gamma at 4880, \
5145 and 6328 A (3.797, 3.772, 3.590) and Amos's experimental estimate gamma(0) = 3.65 \
+- 0.06 are inline datasets.

Table 4 (p. 474): the total depolarization ratio for vertically polarized light, \
rho_v^T = 3 gamma^2/(45 alpha^2 + 4 gamma^2) (Eq. (9)), printed as 100 rho, and the \
Rayleigh cross section Q = 128 pi^5/(9 lambda^4) [3 alpha^2 + (2/3) gamma^2] (Eq. \
(10)) in 1e-27 cm^2, at 18 wavelengths 6328-1854.6 A. Checked (2026-09-27) with Table \
3's alpha and gamma: Q(6328 A) = 3.233 (printed 3.234), Q(2754 A) = 109.0 (1.090(2)); \
at 1854.6 A Eq. (10) with alpha about 18.3 and gamma about 3.49 gives about 815, but \
the table prints 2.159(2) = 215.9 (below the 794.0 at 1862.7 A): a misprint whose true \
digits cannot be recovered, so the row is excluded; its rho (0.2433) is consistent \
(0.242 from Eq. (9)). The text (p. 473) quotes Bridge and Buckingham's '0.4800 +- \
0.005' and Baas and Van den Hout's '0.48 +- 0.02 and 0.49 +- 0.02' (as 100 rho, like \
the table), Bogaard et al.'s 0.517 +- 0.007 (5145 A) and 0.521 +- 0.007 (4880 A) and \
Rodwell et al.'s 0.59 (4880 A) as 'much too high' (inline datasets). Errors: rho <= 1 \
% at 6328 A rising to <= 1.5 % at 1854 A; Q '<= 0.5% for lambda < 2754 A [sic, \
probably >], increasing to <= 1% at lambda = 1854 A'.

Table 5 (p. 474): the Becquerel (r = 1) Verdet constants V_N (microminutes per oersted \
cm, Eq. (8)) from the DOSD and SOPPA, and r = V/V_N with Ingersoll and Liebenberg's \
measured V (ingersoll_1956), 9875-3635 A; mean r = 0.6679: not extracted (the density \
behind V_N is not stated; V_N is a model quantity). Tables 6-8 (p. 475): C_AB, \
Gamma_AB, Delta_AB dispersion coefficients for CO with CO, H2, N2 and the rare gases: \
no quantity, not extracted (C_CO-CO = 81.31).

Table 9 (p. 475): ten-term perpendicular and parallel pseudo-DOSDs (formulas, no form: \
each is one component, not the isotropic polarizability; the isotropic alpha is (2 \
alpha^perp + alpha^par)/3)."""

