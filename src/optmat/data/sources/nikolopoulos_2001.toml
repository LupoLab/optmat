citation = "L. A. A. Nikolopoulos and P. Lambropoulos, \"Multichannel theory of two-photon single and double ionization of helium\", J. Phys. B: At. Mol. Opt. Phys. 34, 545-564 (2001)"
doi = "10.1088/0953-4075/34/4/304"
library = "Nikolopoulos_2001_MultichannelTheoryTwo"
identity = "VALIDATED_WITH_WARNINGS"
kind = "theory"
technique = """Lowest non-vanishing order of perturbation theory (LOPT) for two photons, \
with multichannel two-electron wavefunctions of He in a discretised basis: LS-coupled \
antisymmetrised products of one-electron He+ (Z = 2) target functions expanded in \
B-splines in a spherical box, the continuum channels obtained by the free-boundary \
method and normalised by matching each channel to its asymptotic Coulomb solutions \
(effective charge 1 for single, 2 for double ejection; pp. 548-553); the intermediate \
states the L = 1 manifold, with the pole of the above-threshold sum treated by Eq. \
(3.2) (p. 554). 'a box of radius 40 au and 62 B-splines' (p. 556); with R = 40 au \
'five bound intermediate states', and calculations with R = 100 au 'do not change \
significantly' (p. 554). The ground-state energy is -78.467 eV, 'to be compared with \
the exact value E = 79.002 eV calculated by Pekeris (1962)' (p. 553). Single \
ionisation sums the final channels with the ion bound (He+ 1s, 2s, 2p, ...), double \
ionisation those with both electrons in the continuum (Eqs. A.9, A.16). Linearly \
polarised light: final states L = 0 and 2 (p. 553). The dipole operator is defined in \
the velocity and the length gauge (p. 550); which one the figures use is not stated, \
and 'tests on the accuracy of the results through calculations in other gauges' are \
left for future work (p. 560)."""
notes = """Journal pp. 545-564 = PDF pages 2-21 (PDF page 1 is the IOPscience download \
banner, its only image); journal page = PDF page + 543. Identity checked on the first \
page (PDF p. 2): J. Phys. B: At. Mol. Opt. Phys. 34 (2001) 545-564, L A A \
Nikolopoulos and P Lambropoulos, FORTH-IESL and University of Crete, Heraklion, and \
Max-Planck-Institut fur Quantenoptik, Garching; received 3 July 2000, in final form 15 \
November 2000 (checked 2026-10-08). The paper begins on p. 545, as \
cited.

THE CROSS SECTION (p. 562, Eq. A.9): sigma_N^+ = 2 pi (2 pi alpha)^N omega^N sum_mu \
|D^(N)(mu)|^2, the generalised N-photon cross section in atomic units, summed over \
the final channels of single ionisation; Eq. A.16 the same over the double-ionisation \
channels. The figures give it in cm4 s, and the text turns it into yields as Y_2 ~ \
sigma_2 (I_0 / (2 pi alpha hbar omega))^2 tau_2 (p. 558): the rate is sigma_2 F^2 \
with F the photon flux (photons cm^-2 s^-1), as uiterwaal_1998 and saenz_1999 define \
it. 'He+' and 'He++' in the figures are the final ion of He's two-photon single and \
double ionisation, not ions irradiated: every dataset here is the neutral atom's \
(material He).

FIG. 4'S UNIT IS MISPRINTED: its y axis reads 'Twophoton cross section (cm^2 s)' \
(p. 557). The values are cm4 s: the paper defines the generalised two-photon cross \
section in cm4 s (p. 558), Fig. 3 (the D wave, same page) and Fig. 5 label their axes \
'(cm^4 s)', and Fig. 4's D wave lies within 30 % of Fig. 3's on the same decades \
(1e-52 to 1e-51). The record states the unit cm4 s; no printed value is wrong, so \
there is no erratum.

THE ENERGY AXES. The photon energy as drawn; the paper says nothing of shifting it. \
Its ground state is 0.535 eV above Pekeris's (p. 553). Fig. 4's two curves peak at the \
1s2p 1P resonance at 20.950 eV, Fig. 3's D wave at 21.200 eV, and saenz_1999's (on \
its shifted axis) at 21.25 eV: Fig. 3 lies 0.25 eV above Fig. 4, about half the \
ground-state error (0.27 eV, the shift that puts a two-photon threshold right), within \
the grids' 0.1 eV. Whether Fig. 3 was shifted to be compared with Saenz and \
Lambropoulos, or computed differently, the paper does not say; nothing is shifted \
here.

EXTRACTED (tools/extract/nikolopoulos_2001.py). The paper prints no table and no \
supplement exists: the cross sections are in figures, all vector drawings, read from \
the PDF by data rule 8 (TC-699): Fig. 3 (p. 557), the D wave from 12.75 to 23.70 eV, \
'He+, this work, R = 40 a.u.' (100 vertices); Fig. 4 (p. 557), the S and D waves from \
12.35 to 38.00 eV (236 and 225 vertices); Fig. 5 (p. 558), the total single- and \
double-ionisation cross sections from 42.73 to 46.54 eV (17 markers each). Each curve \
is one stroked polyline; every vertex is taken, less two of Fig. 4's D wave on the frame's \
bottom edge, where the dip after the 1s2p resonance is clipped (21.17 and 21.18 eV). Fig. 5's markers are the calculation's points (the joining lines pass through \
their centres, checked); they lie 0.238 eV apart, not at round energies, as drawn. \
Axes calibrated from the drawing's own tick marks (every tick on the fitted scale): \
worst residuals 0.074/0.085 pt (Fig. 3, x/y), 0.001/0.083 (Fig. 4), 0.063/0.076 (Fig. \
5), the drawing quantised in steps of about 0.15 pt. The extracted values, mapped \
back through the calibrations and overlaid on the rendered pages, follow every drawn \
line and marker (inspected 2026-10-08).

FIG. 3 IS NOT FIG. 4'S D WAVE DRAWN AGAIN: the energy grids differ, the resonance is \
0.25 eV higher (above), and off resonance Fig. 4's D wave is 0.74 to 1.30 times Fig. \
3's at Fig. 3's vertices (1.06 at 13 eV, 0.76 at 19 eV, 0.75 at 22.5 eV). Both are \
taken.

THE CHECKS (the script fails if one is missed): 'for the two-photon He+ ionization \
cross section we obtain sigma_2(He+) ~ 1.2 x 10^-53 cm4 s' at 45 eV (p. 558): Fig. 5 \
reads 1.267e-53 there (the markers either side 1.271 and 1.264e-53; the text's \
figure is cut, not rounded, or approximate); 'the He2+ cross section is about 10% of \
the He+ cross section' (p. 558): 5.0 to 13.5 % across Fig. 5. The text's 1.2e-53 is \
also taken as text (dataset text_sigma2_single_45eV).

SATO ET AL. (2011) QUOTE THIS CALCULATION (Table 2, 'Theory (LOPT) [12]', ref. [12] \
this paper) at 61.4, 58.4 and 56.0 nm (20.19, 21.23, 22.14 eV) as 8.0, 360 and 2.7 x \
10^-52 cm4 s (Sato et al., J. Phys. B 44, 161001 (2011), in the library as \
Sato_2011_DeterminationAbsoluteTwo; checked on its table; a secondary quotation, not \
taken). They are Fig. 3's D wave: it reads 1.043, 0.971 and \
1.011 times them; Fig. 4's S + D reads 0.96, 0.027 and 0.78 times them (on the 1s2p \
resonance at 21.23 eV Fig. 4's curve is already 0.28 eV past its peak).

DIGITISING UNCERTAINTY: the tick residuals (up to 0.085 pt) and half the drawing's \
quantum (0.075 pt) are each about 0.7 % of a value at 24 pt per decade (Figs. 3 and 4; \
Fig. 5 73 pt per decade), so 1 % is taken for the value at a drawn vertex or marker; \
in photon energy 0.009 eV (Fig. 4, 9.2 pt per eV), 0.004 eV (Fig. 3), 0.0015 eV (Fig. \
5; a circle's box, from its Bezier outline, is centred 0.08 pt left of the line's \
vertex, 0.0013 eV). On a resonance's flank the value at a given energy is uncertain by \
the slope times that, and the calculation's grid (about 0.11 eV in Figs. 3 and 4) does \
not resolve the resonances' shapes or heights. The paper states no uncertainty; it \
expects the calculation 'to be reliable for a total kinetic energy of the two \
electrons of greater than 2 eV' (p. 554) and calls Fig. 5's range 'the energy range \
for which we have converged results' (p. 558); the artificial (pseudo-) resonances \
of the discretised continuum, the (+) points of Fig. 5, 'have been simply replaced \
through linear interpolation over energies contributing to the main curve' (p. 558).

NOT TAKEN: the curve of Saenz and Lambropoulos in Fig. 3 (red dotted; saenz_1999's own \
Fig. 1(b) is taken there); the markers of Bachau, Lambropoulos and Tang, Phys. Rev. A \
42, R5801 (1990) and Proulx and Shakeshaft, J. Phys. B 26, L7 (1993) in Fig. 4 (He \
two-photon single ionisation, other papers', neither in the library); the (+) \
pseudoresonance points of Fig. 5 (the authors' rejected values); Figs. 1 and 2 \
(single-photon double and single ionisation, tests of the basis against Lambropoulos \
et al 1998, J. Phys. B 28, L571 (1995) and Venuti et al 1996); the one-photon cross \
section 'sigma_1(He+) ~ 1.1 x 10^-19 cm2' at 45 eV and the yields (p. 558), outside \
this record's two-photon scope; the comparisons the text quotes from other papers \
(p. 559): Crance and Aymar, J. Phys. B 18, 3529 (1985), double ionisation 2.05, 1.74, \
1.73 x 10^-55 cm4 s at 43.5, 45, 46.25 eV; Kornberg and Lambropoulos, J. Phys. B 32, \
L603 (1999), 3.25e-17 cm4 W^-2 s at 45 eV, converted by the authors to 3.54e-54 cm4 s; \
Pindzola and Robicheaux, J. Phys. B 31, L823 (1998), yields at 45 eV. None of these \
is in the library."""

