unit = "cm4 s"
abscissa_unit = "eV"
use = "check"
notes = "Fig. 3 (p. 557), black line ('He+, this work, R = 40 a.u.'): the generalised two-photon single-ionisation cross section of He to the 1D (L = 2) final states, cm4 s (the axis prints sigma_2^+ (cm^4 s)), against the photon energy as drawn, 12.75 to 23.70 eV, below the N = 2 threshold: every vertex of the drawn line, 100 vertices (the dip after the resonance, 2.5e-55 at 21.42 eV, lies above the frame's bottom). 1.2e-51 at 14 eV, 0.79e-51 at 19 eV; the 1s2p resonance peak at 21.200 eV (1.5e-49). Not Fig. 4's D wave drawn again: 0.25 eV higher in its resonance and up to a third higher off it (the record's notes). Sato et al. (2011)'s values for this calculation agree with it within 4 %. 1 %: the digitising uncertainty (the record's notes); the paper states none."
