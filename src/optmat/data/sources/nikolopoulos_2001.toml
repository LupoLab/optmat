polarization = "linear"
final_symmetry = "1D (L = 2)"
final_state = "He+ (single ionisation, the ion in any bound state)"
gauge = "not stated"
method = "LOPT, multichannel two-electron B-spline basis (box R = 40 au, 62 B-splines), free-boundary continuum normalised channel by channel"
definition = "sigma_2 = 2 pi (2 pi alpha)^2 omega^2 sum_mu |D^(2)(mu)|^2 (Eq. A.9, atomic units), in cm4 s; the rate sigma_2 F^2 with F the photon flux in photons cm^-2 s^-1"
energy_axis = "photon energy as drawn; no shift stated; the 1s2p peak 0.25 eV above Fig. 4's (the record's notes); ground state 0.535 eV above Pekeris's"

