[[formulas]]
id = "two_band_theory"
equation = "Table 1 note a and p. 1827"
printed = "Theoretical value is calculated using two-band model theory in [1] ... (with K' = 0.86 x 10^-8, E_P = 21 eV [1])"
variable = "photon energy over the band gap, hbar omega / E_g (the model of Sheik-Bahae et al. 1991)"
coefficients = { K_prime = "0.86 x 10^-8", E_P = "21 eV" }
check = "Not reproduced: the paper names the model and its two constants but prints neither the dispersion function G2 nor the linear indices n0 it used (checked 2026-09-26). K' = 0.86e-8 differs from DeSalvo et al.'s 7.33e-9 and from the 1.5e-8 of Sheik-Bahae et al. 1991 (desalvo_1996, p. 1328). Added 2026-09-27, from the original (sheik_bahae_1991, p. 1304): 0.86e-8 is Sheik-Bahae et al.'s own fit to the wide-gap solids (its Table III '*' column), and its G2 (formula sheik_bahae_1991/g2_degenerate, which reproduces that table) makes this column computable once n0 is chosen; ZnSe, sapphire, CaF2, MgF2 and fused-silica gaps here equal that table's, the ZnS gap (3.2 eV) does not (3.54 eV there)."
notes = "The Theory columns of Table 1 are this model's values; recorded as use = 'check' datasets."
