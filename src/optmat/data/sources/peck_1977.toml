citation = "E. R. Peck and S. Huang, J. Opt. Soc. Am. 67, 1550 (1977)"
doi = "10.1364/josa.67.001550"
library = "Peck_1977_RefractivityDispersionHydrogen"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Corner-reflector interferometer, two 24 cm cells (96 cm total path), one \
filled and one evacuated; two wavelengths at once (a Hg or Cd visible reference line \
on a photomultiplier and a red/infrared line on PbS detectors, infrared monochromator \
pass band up to 3-4 nm), giving refractivity ratios to about 10 ppm; whole fringes \
counted, fractions read to 0.001 fringe. Pressure by quartz manometer, temperature by \
calibrated thermocouples; 441 absolute determinations averaged. Matheson \
ultra-high-purity H2 (99.999 mol% He-free; 50 ppm He), a uniform impurity correction \
of +0.0040 in 10^6 (n - 1) applied."""
notes = """Refractivities are reduced to 0 C and 760 Torr with the real-gas density ratio \
rho0/rhom = (Zm/Z0) p0 Tm / (pm T0) (Eq. 1), Z from Goodwin et al.'s second virial \
coefficient (Eq. 2: Z - 1 = (0.255/T - 23.9/T^2) p, p in atm), plus 'a very small \
correction from the Lorenz-Lorentz formula' (p. 1550): density = real. Wavelengths are \
vacuum (Table I heading). Natural (normal) hydrogen at room temperature.

Accuracy: the absolute value at 0.5462252 um is (139.304 +- 0.017) x 10^-6, the \
standard deviation of the mean of 441 determinations (Eq. 3, p. 1551); systematic \
pressure and temperature errors 'may be estimated at 1 part in 5000' each, together \
about +-0.04e-6 (p. 1551). The other values of Table I are that absolute value times \
the measured refractivity ratios (precision about 10 ppm). Table I's caption: \
'Absolute accuracy is not claimed to this precision'. The rms deviation of the 15 \
fitted points from Eq. (4) is 0.0018 (p. 1551). Hence per point absolute = 0.0018 (rms) \
and systematic_relative = 3.1e-4 (0.017 and 0.04 in quadrature over 139.3, taken as \
one sigma). The value is 0.25 % below Koch (1912) and Kirn (1921) and the ICT value, \
20 times its standard deviation; the authors attribute the difference to the samples \
(p. 1551) and show that, bridged by Koch and Kirn, their data agree with Smith, Huber & \
Parkinson's UV data to 0.01 %.

The abstract and p. 1551 speak of 'eighteen' wavelengths; Table I has 17 rows (image \
checked: no row is lost), 15 fitted and two, in parentheses, excluded for probable \
spectral impurity (0.7247163 and 1.3626384 um).

Table II reproduces older refractivities at 0.5462 um after Cuthbertson & Cuthbertson \
(1933); Table IV gives polarizabilities (a0^3): this work's by Eq. (13), \
alpha/a0^3 = 4.00003e4 (n - 1), from Eq. (4) (a derived check), Kirn's from his \
formula (reproduced, derived), and the theoretical values of Kolos & Wolniewicz (1966, \
converted from 0.8045 A^3) and Ford & Browne (1973), which 'take account of the \
dynamic behavior of the molecule at room temperature' (p. 1552). Table III \
(percentage differences of Koch and Kirn from Eqs. 4 and 6) is derived and not \
extracted. The Verdet-constant ratio gamma = 0.9519 +- 0.0019 and Rayleigh-scattering \
comparisons (p. 1553) are not refractive-index data."""

