citation = "A. Tünnermann, K. Mossavi and B. Wellegehausen, \"Nonlinear-optical processes in the near-resonant two-photon excitation of xenon by femtosecond KrF-excimer-laser pulses\", Phys. Rev. A 46, 2707 (1992)"
