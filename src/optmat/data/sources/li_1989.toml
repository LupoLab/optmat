table = "tbl_8884f312bffe"
quantity = "saturation_intensity"
unit = "W/cm2"
abscissa_unit = "nm"
use = "check"
reproduced_from = ["A. L'Huillier, L. A. Lompré, G. Mainfray and C. Manus, J. Phys. B 16, 1363 (1983)"]
