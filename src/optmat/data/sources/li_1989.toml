citation = "X. F. Li, A. L'Huillier, M. Ferray, L. A. Lompré and G. Mainfray, \"Multiple-harmonic generation in rare gases at high laser intensity\", Phys. Rev. A 39, 5751 (1989)"
doi = "10.1103/PhysRevA.39.5751"
library = "Li_1989_MultipleHarmonicGeneration"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Harmonic generation in a pulsed rare-gas jet (Xe, Kr, Ar, Ne, He; 15 Torr, \
about 5 x 10^17 cm^-3, 1 mm wide, 0.5 mm from the nozzle) by a mode-locked Nd:YAG laser \
(1064 nm, 36 ps 'bandwidth limited' pulses, up to 1 GW, 10 Hz, linearly polarised) \
focused by a 200 mm lens (R = 18 um, b = 4.2 mm); the intensity calibrated against the \
saturation intensities of singly charged ions measured earlier with the same apparatus \
(Ref. 12); the VUV analysed by a grazing-incidence toroidal-grating monochromator (10-350 \
nm) and detected by photomultipliers or an electron multiplier, with manufacturers' \
spectral efficiencies ('of the order of a factor of 5' relative uncertainty between \
frequencies). Third- and fifth-order susceptibilities from the low-intensity yields \
through the lowest-order perturbative propagation formula (Eq. 7) with a computed \
phase-matching factor, normalised to Lehmeier et al.'s Xe THG value."""
notes = """Phys. Rev. A 39(11), 5751-5761 (1 June 1989) = PDF pages 1-11 (journal page = \
PDF page + 5750); a scan with a text layer. Identity checked against the first page \
(journal, volume, number, date, title, authors). Every cell taken was checked against \
the table images (2026-10-09).

WHAT IS TAKEN (tools/extract/li_1989.py).
(1) Table I (p. 5752), 'Saturation intensities for the rare gases (Ref. 12). The \
experimental uncertainty is +-50 %': Xe 1.2 x 10^13, Kr 2.5 x 10^13, Ar 3 x 10^13, Ne \
1.9 x 10^14, He 2.8 x 10^14 W cm^-2, at 1064 nm with the 36 ps pulses: 'The saturation \
intensity, at which the ionization probability becomes equal to unity, is determined \
by studying the laser intensity dependence of the number of singly charged ions' (p. \
5752). The values are those of Ref. 12 (A. L'Huillier, L. A. Lompré, G. Mainfray and \
C. Manus, J. Phys. B 16, 1363 (1983); not in the library), whose note here says 'The \
saturation intensities for He and Ne had been overestimated by a factor of 2': He and \
Ne are revised, the others reproduced. They also calibrate this paper's intensities. \
use = check, reproduced_from Ref. 12.
(2) Table II (p. 5754), chi^(3) (esu), Kr, Ar, Ne and He: the third-harmonic \
susceptibilities 'extracted from the experimental results and normalized to chi_0^(3) \
in Xe. They are given within +-50 %'; from the third-harmonic yields at low intensity \
(slope 3 +- 0.1, Fig. 8), Delta k_3 of Table II and the phase-matching factor of a \
Lorentzian jet (Fig. 2b), through Eq. (7) (p. 5757). The definition is Eq. (2), P_q = \
N chi^(q) E_1^q / 2^(q-1); the caption: Lehmeier et al.'s values were 'multiplied ... \
by a factor of 4, to be consistent with our definition', so chi^(3) here is 4 x \
Lehmeier's gamma(3) = Ward's per-atom chi (lehmeier_1985 Table 2 note b): convention \
ward_1969. Per atom, electronic (atoms, THG). Xe's chi^(3) is chi_0^(3) by the \
normalisation and is not taken; the others are measured relative to it (the absolute \
scale is Lehmeier's Xe at 1.055 um). use = check.

CHECKED (the script). Table II's chi_0^(3) row (Lehmeier's values times 4) against \
lehmeier_1985's own esu values (gamma_thg_esu_<gas>, 10^-39 esu) times 4: 6.88, 2.336, \
0.856, 0.0656, 0.03656 x 10^-37 against the printed 6.9[-37], 2.3[-37], 8.6[-38], \
6.5[-39], 3.6[-39]; Ne and He are truncated, not rounded (6.56 and 3.656 printed 6.5 \
and 3.6), within one unit of the last figure. Against those, this paper's chi^(3) is \
0.98 (Kr), 1.07 (Ar), 0.70 (Ne) and 0.63 (He) times Lehmeier's, inside the stated \
+-50 %.

NOT TAKEN. (1) Table II's chi_0^(3) row: lehmeier_1985's values times 4, reproduced \
(lehmeier_1985 holds them). (2) chi^(5) (Table II: Xe 8 x 10^-48, Kr 1.4 x 10^-49, Ar \
2.1 x 10^-50, Ne 4.6 x 10^-51 esu) and Ar's chi^(7) = 2 x 10^-60 esu (p. 5758): no \
quantity holds a fifth- or seventh-order susceptibility. (3) Delta k_3 and Delta k_5 \
(Table II, cm^-1, at 15 Torr, 'deduced from experimentally measured refractive \
indices', Leonard's compilation, Ref. 22): a mismatch at one density from others' \
indices; phase_mismatch_per_density would need it divided by a density the paper \
gives only roughly (N = 5 x 10^17). Xe's Delta k_3 prints '2.[-1]' (image) and '2[-1]' \
(CSV). (4) The harmonic distributions (Figs. 4-7), intensity and pressure dependences \
(Figs. 8-11), the emission spectra (Figs. 12, 13), raster: yields in arbitrary or \
estimated units (conversion efficiencies 10^-8 (Xe) and 10^-10 (Ar) for the third \
harmonic at 10^13 W cm^-2, 10^-11 and 10^-13 for Ar's 25th and 33rd; p. 5760), not \
quantities; the slopes (7.2 +- 0.5 for Ar's 7th, 8.2 +- 0.5 and 12 +- 1 for the 21st \
and 33rd) are not quantities.

FURTHER DATA CITED, NOT IN THE LIBRARY: Ref. 12 (above); J. F. Ward and G. H. C. New, \
Phys. Rev. 185, 57 (1969) (printed 'Phys. Rev. A 185'); G. C. Bjorklund, IEEE J. \
Quantum Electron. QE-11, 287 (1975); A. Lago, G. Hilber and R. Wallenstein, Phys. Rev. \
A 36, 3827 (1987). In the library: lehmeier_1985 (Ref. 29), Leonard 1974 (Ref. 22, \
Leonard_1974_RefractiveIndicesVerdet). No two-photon data."""

