citation = "U. Hohm, \"Frequency-dependence of second refractivity virial coefficients of small molecules between 325 nm and 633 nm\", Mol. Phys. 81, 157 (1994)"
doi = "10.1080/00268979400100111"
library = "Hohm_1994_FrequencyDependenceSecond"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Michelson interferometer with a sample cell of length 0.5 m, illuminated \
simultaneously by four He-Ne lasers (vacuum wavelengths 632.990, 611.971, 594.096 and \
543.516 nm) and a He-Cd laser (325.130 nm). The cell is evacuated from at most 3e5 Pa \
while the superposed interferogram I(rho_0) is recorded; Fourier transformation with \
respect to rho_0[1 + B*(omega_1, T) rho_0] gives the dispersion of the polarizability of \
the free molecule, and with respect to rho_0 the dispersion of B*(omega, T) and hence \
of B_R relative to a fixed reference value B_R^(0)(omega_1, T) (Eqs. 7-13, pp. 159-161). \
Room temperature, 292-299 K (p. 157, Tables 1-2)."""
notes = """Page numbers are the journal's (157-168); pdf pages 1-2 are the publisher's \
cover, so p. = pdf page + 154. The paper that hohm_1994 (Chem. Phys. 179, 533) cites as \
'U. Hohm, Mol. Phys. (1993); in press' (its ref. [29]): its O2, N2O and CO2 inputs are \
this paper's Table 1 rows, digit for digit.

Reduction (Eqs. 7-9, p. 159): (n^2 - 1)/(n^2 + 2) = sum_k A_k(omega, T) rho_0^(k-1) with \
the ideal-gas density rho_0 = p/RT; A_1 = N_A alpha_0(omega, T)/(3 eps0) is the \
polarizability of the free molecule (zero density), so the Table 1 values need no \
state. Atomic units of polarizability. The wavelengths are vacuum wavelengths (p. 159; \
Table 1 note a prints 632.99 nm, the text 632.990 nm).

Table 1 (p. 160): mean polarizabilities at the five wavelengths, with the gas \
temperature. Rows marked b are this work, h are 'already given elsewhere [4]' (Hohm, \
Mol. Phys. 78, 929 (1993), hohm_1993; p. 160): among the curated gases, CH4. The second \
row of each gas is 'calculated using Cauchy moments' of a DOSD (note b: c [21] Kumar \
and Meath 1985, d [22] Zeiss et al. 1977, e [23] Thomas and Meath 1977, j [28] Jhanwar \
and Meath 1982; f [24], g [25], i [27] belong to out-of-scope molecules). The digits in \
parentheses are the uncertainty of the last digits; the paper does not say what they \
are (level not stated). They are the same at all five wavelengths of a gas (0.0020 au \
for argon, 1.8e-4 of alpha), which suggests the uncertainty of the absolute level; the \
dispersion itself is claimed to about 1e-5 relative to alpha(omega_1) (hohm_1994, p. \
536, 'Delta alpha(omega)/alpha(omega) ~ 10^-5 with respect to a reference value'; this \
paper states no figure). 'Overall, there is a very good agreement between the \
dispersion [alpha(omega_5) - alpha(omega_1)] ... measured in this work and the values \
given in the literature' (p. 161). Xe and N2O have no measurement at 611.971 nm.

Table 2 (p. 162): B_R(omega_k, T) in 1e-12 m^6 mol^-2 (= cm^6/mol^2). Only the \
dispersion of B*(omega) = A_2/A_1 is measured; B_R(omega_k) follows from Eqs. (12)-(13) \
with a reference value B_R^(0)(omega_1, T) (the omega_1 column): from Burns et al. 1986 \
(note a, [8]) for Ar, Kr, Xe, CO2 and CH4; estimated by Hohm's heuristic extrapolation of \
Buckingham's theory (note b, [12], U. Hohm, Z. Naturforsch. A 48, 505 (1993)) for O2 and \
N2O, whose absolute B_R is 'estimated for the first time' (p. 164). So the omega_3-omega_5 \
values are this work relative to the reference and not independent of it. 'The \
uncertainties of B_R(omega_k>1, T) are given relative to B_R(omega_1, T)' (caption); \
Delta B* ~ 1e-7 m^3/mol (pp. 166-167); 'However, the full uncertainty in B_R might be \
approximately twice the error given above' (p. 167), since the two CO2 runs do not \
overlap. The datasets keep the printed uncertainties; the full one is about twice. \
(1) and (2) are two independent measurements (Xe, CO2). The last column, 10^6 B*(omega_1) \
in m^3/mol, is a fit constant (not extracted); for CH4 it is Hohm 1993's B_2*(omega_1) = \
48.58(1.20) cm^3/mol, and the CH4 B_R(omega_4), B_R(omega_5) follow from that paper's \
Table 3 B_2* (49.17, 49.00) by Eq. (13) with Burns's 7.76 (checked: 11.72, 11.14). \
Footnotes (checked on the image, p. 162): c 'lambda = 688 nm, [29]' (NH3; the text, p. \
165, says 668 nm), d 'T = 373 K, [9]' (the library renders it as T approximately 373 K), \
f the Kr B_R(omega_2) = 6.46(54) x 10^-12 m^6 mol^-2 (the library renders the unit as \
mol^-1; the image has mol^-2). Xe shows anomalous dispersion of B_R, doubted by the \
author (p. 163, Bulanin's private communication).

Checks against optmat's fits (2026-09-26): argon's measured shape alpha(omega_k)/ \
alpha(omega_1) departs from fit/Ar (ab initio moments with refractometry) by +26, -5, \
-6 and -70 ppm at 612, 594, 544 and 325 nm, several times the 1e-5 claimed for the \
dispersion (hohm_1994, p. 536); its absolute level is +117 ppm (within the printed \
0.0020 au). The absolute levels are +0.20 % (Kr), +0.47 % (Xe), +0.21 % (O2), +0.16 % \
(N2O), +0.04 % (CO2) and +0.04 % (CH4) against the fits at 633 nm; the 325 nm shape \
departs by +260 (Kr), +158 (Xe) and +157 ppm (CH4), the others within 55 ppm.

Not extracted: NH3, C2H4, C2H6, C3H6 and cyclo-C3H6 (not curated species); B* and the \
figures (B_R dispersion curves against the heuristic estimate); the discussion of the \
expansion technique's fitting bias (Eqs. 14-16)."""

