notes = "p. 9-10: 'the experimentally determined indexes in krypton are (n - 1)/N = 2.607 x 10^-23 cm^-3 at 146.413 nm and ... 2.654 x 10^-23 at 146.550 nm', 11 % and 2.7 % above the paper's calculation, which the authors attribute to their resonant approximation at large detuning. The two disagree in direction with normal dispersion (the longer wavelength has the larger value, by 1.8 %); the 146.413 nm value agrees with Bideau-Mehu et al.'s krypton data interpolated between 140.4 and 152.5 nm (about 700e-6 at STP). Kept as a check."

