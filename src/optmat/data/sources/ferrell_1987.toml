citation = "W. R. Ferrell, M. G. Payne and W. R. Garrett, Phys. Rev. A 35, 5020 (1987)"
doi = "10.1103/physreva.35.5020"
library = "Ferrell_1987_DeterminationOpticalConstants"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Multiphoton ionization detection of phase-matched third-harmonic generation in \
Xe-Ar and Xe-Kr mixtures near the Xe 6s, 6s', 5d, 7s and Kr 5s' three-photon \
resonances (unfocused and mildly focused dye-laser beams, proportional counter): the \
width and detuning of the phase-matching profile give the resonance oscillator \
strength, the absorption coefficient and n(3 omega) of the buffer gas, using its known \
n(omega) (Eq. (11))."""
notes = """All values in the text (no table of refractivities). The buffer-gas \
refractivities are given as (n - 1)/N 'at STP', printed with the unit 'cm^-3'; the \
quantity has the unit cm^3 (n - 1 = 5.47e-4 for argon at 119 nm divided by 2.69e19 \
cm^-3 is 2.04e-23 cm^3; Fig. 10 plots 10^25 [n(omega) - 1]/N), so the values are \
stored as refractivity per density in cm^3. The paper states no uncertainty for them; \
the argon points 'vary by only 2 % from the calculated indexes' of its Sellmeier \
analysis (p. 9), the krypton points by 11 % and 2.7 % (p. 10), attributed to the \
approximation of the xenon index by its nearby resonance term at large detuning. \
Wavelengths are vacuum wavelengths (the 3 omega wavelengths of the experiment).

The oscillator strengths of Table I (Xe 6s 0.260 +- 0.05, 6s' 0.19 +- 0.04, 5d 0.370 +- \
0.07, 7s 0.088 +- 0.01, Kr 5s' 0.180 +- 0.027, with others' values) are not extracted: \
the paper prints no transition wavelengths, and the package keys an oscillator strength \
to its wavelength. The absorption coefficients (e.g. 2 beta = 1.0e-4 P_Xe P_Ar at \
146.4 nm, pressures in Torr) are not a quantity of the package.

The text quotes other authors' values (pp. 9-10): Chashchina et al. for argon (140, 130, \
120, 118.2 and 121.57 nm) and krypton (228.8 nm), Chashchina and Shreider for xenon \
(148.3 nm and a point 'on the blue side of the 6s'), Mahon et al.'s calculation and \
Chopra and Heddle's Rayleigh value at Lyman alpha for argon (1.92e-23, 1.90e-23; \
recorded in mahon_1979, which quotes the same numbers), Bideau-Mehu et al. and Smith et \
al. at 228.8 nm (Kr) and Bideau-Mehu et al. at 148.3 nm (Xe; in bideau_mehu_1981). \
Misprints in the text: '30 nm' for Chashchina's 130 nm value (erratum); Bideau-Mehu's \
xenon value at 148.3 nm printed as 1.895e-23 is 1.895e-22 (their 5091e-6 divided by \
2.687e19; the neighbouring 1.823e-22 and 1.829e-22 are printed correctly); the point \
'on the blue side' is not given a wavelength, but Bideau-Mehu's value quoted for it, \
2.433e-23, is their 140.4 nm value (653.8e-6 / 2.687e19).

At 121.6 nm in krypton (blue of the 123.58 nm resonance, n - 1 negative) the text quotes \
Mahon et al.'s -5.58e-24 (phase matching in pure Kr), Gladushchak et al.'s -3.35e-24, \
Chopra and Heddle's +3.28e-23 (Rayleigh scattering, which gives (n - 1)^2 only), Mahon's \
calculation -7.75e-24 and 'the present calculation' printed as -4.632e-23 (probably \
-4.632e-24 by comparison, unverified). Negative refractivities cannot be datasets; they \
are recorded here only.

Third-order data (checked 2026-09-26): none. The paper uses \
phase-matched, near-resonant third-harmonic generation only as a probe of oscillator \
strengths, buffer-gas refractivities and absorption; it prints no third-order \
susceptibility or hyperpolarizability (Eqs. (1)-(8) are written in terms of the \
resonant phase mismatch and the Rabi frequency, and no chi(3) value appears in the \
text, the table or the figure captions). No third-order dataset is added."""

