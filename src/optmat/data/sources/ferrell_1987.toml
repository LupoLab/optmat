notes = "p. 9: 'the three experimental points in argon at STP are (n - 1)/N = 2.037 x 10^-23 cm^-3 (119.120 nm), ... 1.637 x 10^-23 (129.309 nm), and ... 1.427 x 10^-23 (146.542 nm)' (unit misprinted: cm^3). Argon was the buffer gas at 3 omega near the Xe 5d, 6s' and 6s resonances. No uncertainty stated; within 2 % of the paper's Sellmeier curve."

