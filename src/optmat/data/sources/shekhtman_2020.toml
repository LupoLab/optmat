[[errata]]
dataset = "qd_basis2"
row = "6p[3/2]2"
column = "value"
printed = "9.85e-35"
corrected = "2.26e-35"
reason = "Table 6 prints the 204.196 nm cell (9.85 x 10^-35, two rows below) at 193.494 nm: the row's own sigma^(2) = 7.42 x 10^-46 cm4 s and normalised ratio 0.084 (= 7.42e-46 / 8.86e-45) give sigma_o^(2) = sigma^(2) / g(193.494 nm) = 2.26e-35, where g is Eq. (9)'s Gaussian peak times the mean ratio sigma^(2) / (sigma_o^(2) g) = 1.008 of the 52 regular cells of Tables 5-7 and 9 (their spread, 1.0045 to 1.0125, makes the correction good to +-0.01 in the last figure); the printed value gives a ratio of 0.232."
evidence = "Table 6 image and the PDF's text layer both read 9.85 x 10^-35 in the 193.494 and the 204.196 nm rows of the Quantum-Defect column; checked by tools/extract/shekhtman_2020.py (checks)."

[[errata]]
dataset = "single_path"
row = "5p[3/2]2"
column = "value"
printed = "8.54e-35"
corrected = "8.54e-36"
reason = "The row's own sigma^(2) = 3.05 x 10^-46 cm4 s (and its normalised ratio 0.318 = 3.05e-46 / 9.57e-46) gives sigma^(2) / (sigma_o^(2) g) = 0.101 with the printed sigma_o^(2), and 1.010 with 8.54 x 10^-36, inside the 1.0045 to 1.0125 of the regular cells: the power of ten is misprinted."
evidence = "Table 9 image and the PDF's text layer both read 8.54 x 10^-35; checked by tools/extract/shekhtman_2020.py (checks)."
