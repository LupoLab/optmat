material = "O2"
file = "O2/brown_1992__table1_observed.csv"
table = "tbl_ad5d63e4a91f"
quantity = "raman_shift"
unit = "cm-1"
abscissa = "label"
use = "check"
notes = "Table I (p. 486), 'Observed': the CARS peak maxima, shifted from the true line positions by the triplet interference (up to 0.003 cm-1, p. 490): check, beside table1_corrected."
[datasets.uncertainty]
absolute = 0.005
level = "not stated"
[datasets.parameters]
transition = "S(J,N): v = 0, Delta N = Delta J = +2, per row"

[[formulas]]
id = "eq2_levels"
material = "O2"
equation = "Eqs. (1)-(2), pp. 485-486"
printed = "H_rot = B (J - S)^2 + 2 lambda (S_z^2 - S^2) + gamma (J - S).S; F1(N) = F2(N) + B_0 (2N + 3) - lambda - gamma/2 - [lambda^2 - 2 lambda (B_0 - gamma/2) + (2N + 3)^2 (B_0 - gamma/2)^2]^(1/2); F2(N) = B_0 N(N + 1) - D_0 N^2 (N + 1)^2; F3(N) = F2(N) - B_0 (2N - 1) - lambda - gamma/2 + [lambda^2 - 2 lambda (B_0 - gamma/2) + (2N - 1)^2 (B_0 - gamma/2)^2]^(1/2)"
variable = "N the rotational quantum number (odd for 16O2); F1, F2, F3 the term values of J = N + 1, N, N - 1 in cm-1; B_0, D_0, lambda (spin-spin) and gamma (spin-rotation) of v = 0; the S(J,N) line = F_i(N + 2) - F_i(N) with the same i"
state = "16O2 X 3Sigma_g-, v = 0"
density = "unknown"
range = "v = 0, N = 1-21 (the lines of Table I)"
coefficients = { constants = "not printed: 'the microwave constants suggested by Johns and Lepard (14)'" }
check = "Scratch (2026-09-27), with rouille_1992's v = 0 constants (B_0 1.437676476, D_0 4.84256e-6, lambda 1.984751322, gamma = mu_0 -8.42539e-3 cm-1) in place of the unprinted Johns-Lepard ones: the Corrected - calculated column is reproduced to +-0.0005 cm-1 for S(1,1)-S(20,19) (e.g. S(4,3) +0.0026 against +0.003, S(20,19) +0.0061 against +0.006, S(9,9) -0.0003 against 0.000). EXCEPTION: F3(1) (N = 1, J = 0) as printed is wrong by 1.085 cm-1 (S(0,1) comes out 15.167 against 16.252): for N = 1, (2N - 1)(B_0 - gamma/2) < lambda, and the square root must be taken as -(lambda - B_0 + gamma/2); rouille_1992's special-case Eq. (10) gives 16.2529, the printed difference -0.001. Brown et al.'s own calculation evidently treated it correctly."
notes = "The Hamiltonian's spin-spin term 2 lambda (S_z^2 - S^2) differs from the (2/3) lambda (3 S_z^2 - S^2) of rouille_1992 only by a constant, so lambda has the same meaning in both; gamma is rouille_1992's mu."
