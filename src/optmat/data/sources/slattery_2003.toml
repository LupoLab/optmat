citation = "S. A. Slattery and D. N. Nikogosyan, Opt. Commun. 228, 127 (2003)"
doi = "10.1016/j.optcom.2003.09.086"
library = "Slattery_2003_TwoPhotonAbsorption"
identity = "VALIDATED"
kind = "measurement"
technique = """Transmittance against irradiance at 211 nm (2-40 GW/cm2): the fifth \
harmonic of a Twinkle Nd:glass laser (Light Conversion), made by non-collinear sum-\
frequency mixing of 1055 and 264 nm pulses in a 0.2 mm BBO crystal, ~100 uJ at 27 Hz, \
energy stability ~15 %; pulse duration 250 +- 20 fs taken from Dubietis et al. (same \
laser system); Gaussian beam of 2.2 +- 0.1 mm FWHM (from aperture transmission), \
focused by a 424 mm CaF2 lens, the sample always well before the focus (no self-\
focusing or filamentation seen). Energies by Ophir PE10 detectors; the curves are \
fitted with the theory of their Ref. [6] after correcting the focal shift in the \
sample (Ref. [1], dragomir_2002). Room temperature. Low-intensity transmittance by an \
HP8453 spectrophotometer."""
notes = """Tables 1 and 2 (pp. 3-4) are transcribed in full; checked against the \
images (the wrapped material names of Table 1 and the spanned material and E_g cells \
of Table 2 are handled in the script). Total uncertainty of beta 'about 16 %' (p. 2); \
the uncertainties are printed per value, level not stated.

Samples (p. 3): 'two samples of Suprasil fused silica glass (Heraues [sic], Germany), \
as well as samples of crystalline quartz (cut perpendicular to the optic axis), \
calcium fluoride and barium fluoride (all from former Soviet Union, unknown \
manufacturers)'. The quartz is printed '(||c)': light along the optic axis, so its \
datasets are given axis 'o' (an inference). Its length, 1.380 cm, is that of the \
quartz of dragomir_2002 (1.38 cm), probably the same sample. Table 1's lengths l (cm): \
1.000, 1.005, 1.380, 0.250, 0.815 (kept in the printed column). The beta of fused silica \
is one value for the two Suprasil samples.

Definition: the paper does not write the propagation equation; it uses the theory and \
fitting of its Refs. [1] and [6], i.e. dragomir_2002's dI/dz = -alpha I - beta I^2 with \
(1 - R) at the entrance face (Eqs. 3-7 there): reflection losses are removed (Table 1's \
(1 - R)^2) and alpha is Napierian (exp(-alpha l)). Table 1's alpha is 'experimentally \
determined linear absorption coefficient alpha (at 211 nm, deduced from total \
absorbance minus optical density, corresponding to the reflection losses, for details \
see [1])'; the words absorbance and optical density are decadic, and the paper does not \
say whether the difference was converted to a Napierian coefficient (a doubt; base 'e' \
is recorded as in dragomir_2002).

Table 1's refractive index is 'calculated from dispersion relations, given in [12]' \
(Nikogosyan's handbook) and (1 - R)^2 is in per cent. For BaF2 and CaF2, (1 - R)^2 \
follows from n with R = ((n - 1)/(n + 1))^2 (91.02 and 92.50, reproduced). For the \
Suprasil samples n = 1.5275 gives 91.48, not the printed 91.23, which needs n = 1.537; \
Malitson's formula (malitson_1965, Eq. 1) gives n = 1.5373 at 211 nm. For quartz \
n = 1.6347 gives 88.73, not 88.57, which needs n = 1.641. The printed n of fused silica \
and quartz is therefore inconsistent with the paper's own reflection loss (checked \
2026-09-26); those two index datasets are excluded, the others reproduced.

Reproductions (Table 2, 'Literature data for TPA coefficients together with our \
results at 211 nm'; 'only picosecond and femtosecond data are considered'): [17] is \
kittelmann_1994 (its Gaussian-profile values; the +- is 70 % of the value, Kittelmann's \
50 % absolute plus 20 % relative), [20] taylor_1988 (the +- is 65 %, Taylor's 50 % + \
15 %; CaF2's 0.8 is 8.3e-12 rounded), [1] dragomir_2002 (fused silica 1.7 +- 0.2 is \
Dragomir's Suprasil, the smallest of its six glasses; quartz 1.2 +- 0.2), [18] Schenker \
et al. 1995 and [19] Gurzadyan and Ispiryan 1992 (not in the library; footnote a: \
'Only relative uncertainty is mentioned in publications'). The band gaps come from \
[15] weinberg_1979 (fused silica 9.3 eV) and [16] eva_1996 (quartz ~9, BaF2 9.1, CaF2 \
10 eV), which took them from weinberg_1979 and taylor_1988. The text (p. 4) says 'for \
fused silica, crystalline quartz and BaF2 E_g is about 9 eV, and for CaF2 it equals 10 \
eV'. The paper judges Kittelmann's 193 nm values for fused silica and BaF2 \
'underestimated'. The abstract's range '26-59 x 10^-11 cm/W' is this work's."""

