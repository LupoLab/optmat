citation = "D. P. Shelton, \"Vibrational contributions to the hyperpolarizabilities of homonuclear diatomic molecules\", Mol. Phys. 60, 65 (1987)"
doi = "10.1080/00268978700100051"
library = "Shelton_1987_VibrationalContributionsHyperpolarizabilities"
identity = "VALIDATED_WITH_WARNINGS"
kind = "theory"
technique = """Perturbation theory (Orr & Ward's expression for gamma, Eq. 1) for the \
off-resonance vibrational hyperpolarizability gamma^v of a homonuclear diatomic molecule, \
with each pair of electronic sums replaced by the static Raman transition polarizability \
(Eqs. 3-4; exact in the static limit, underestimating gamma^v at optical frequencies by \
about 4 %, p. 67), the isotropic and rotational averages done with spherical tensors \
(Eqs. 5-17), and a simplified form (Eq. 18) for the ground vibrational state, J-averaged \
transition polarizabilities, neglected rotational frequencies and J >> 1. Evaluated for \
H2, D2 (ab initio transition polarizabilities of Hunt, Poll & Wolniewicz 1984), N2 and O2 \
(Raman intensities and depolarisation ratios) (pp. 66-74)."""
notes = """Pages are the journal's (65-76); pdf page 1 is the publisher's cover, so p. = \
pdf page + 63. The library's validation notes an unmatched figure (the cover) and a \
table without caption (Table 3, whose caption, 'Table 3. Calculated values of the \
static gamma^v at 293 K', and unit line are extracted as text before it); the tables \
agree with their images, except that Table 2's D2 row mark (a double dagger on the \
image) is read as a dagger.

DEFINITIONS. gamma^v is 'the sum of all terms which may exhibit vibrational resonances' \
(p. 66), the pure vibrational part (not the zero-point vibrational averaging of gamma^e, \
which is part of the observed gamma^e, p. 67). The gamma of Orr & Ward, in the \
convention p = ... + gamma E^3/6 used by Shelton & Rice (shelton_1994 Table VIII \
reproduces these values in au: static N2 81 = 0.506e-62/6.2354e-65). The lab-frame \
components are those of the isotropic (orientation-averaged) tensor: gamma_xxxx is the \
parallel (mean) gamma, recorded as component 'parallel'; the dc Kerr gamma is \
3/2[gamma_xxxx - gamma_xyyx](-w; 0, 0, w) (Eq. 23), component 'K'. Units C^4 m^4 J^-3 \
(the SI unit of gamma in optmat).

TABLE 2 (p. 72), 'Molecular parameter values used to evaluate gamma^v': nu_01 and \
B_0/2 pi c (datasets), the nuclear-spin weights g_ns(J) for J even/odd (H2 1/3, D2 2/1, \
N2 2/1, O2 0/1) and the Raman transition polarizabilities ((alpha_par + 2 alpha_perp)/3)_01 \
and (alpha_par - alpha_perp)_01 in 10^-42 C^2 m^2 J^-1: H2 12.21 and 10.09, D2 10.18 and \
8.28, N2 6.13 and 4.04, O2 5.89 and 5.89. The transition polarizabilities are not stored \
as datasets: no quantity of the vocabulary holds a Raman transition polarizability (a \
matrix element <0|alpha|1>, not a derivative; FORMAT GAP). Sources: H2 'Ab initio values \
for the J = 1 state', D2 'for the J = 2 state', from Hunt, Poll & Wolniewicz, Can. J. \
Phys. 62, 1719 (1984); N2 and O2 'From Raman intensity measurements of [11] (Klöckner & \
Schrötter 1979, curated as schrotter_1979) and depolarization ratios of [21] (Murphy, \
Holzer & Bernstein 1969)'.

TABLE 3 (p. 72): static gamma^v_xxxx at 293 K from Eq. (17) and Eq. (18) (datasets); \
the ratio Eq. (18)/Eq. (17) (0.993, 0.994, 1.000, 1.000: 'a measure of the size of \
quantum effects'), the ratio (4/45)(alpha_par - alpha_perp)_01^2/((alpha_par + 2 \
alpha_perp)/3)_01^2 (0.061, 0.059, 0.039, 0.089) and gamma^v/gamma^e static (0.292, \
0.286, 0.094, 0.141; gamma^e from Mizrahi & Shelton 1985) are in these notes only. \
Checked (2026-09-26): Eq. (21) with Table 2 reproduces the Eq. (18) column: 1.149, \
1.109 (printed 1.110), 0.506, 0.734, and the ratio column 0.061, 0.059, 0.039, 0.089.

TABLE 4 (p. 74): gamma^v at nu_1 = 15800 cm^-1 ('lambda = 633 nm'; a wavenumber, so \
vacuum) for the dc Kerr effect, DFWM (the Kerr effect gamma(-w; w, w, -w)), CARS at nu_2 \
= nu_1 - 2500 cm^-1, ESHG and THG, from Eq. (18); 'For comparison, gamma^e ~ 5 x 10^-62 \
C^4 m^4 J^-3 for the molecules considered'. ERRATA: 'Table 4 of Ref. 9 contains several \
numerical errors. Line 2 should read D2, 2988, +0.007*, +0.737, +2.464, -0.031, -0.010. \
Column 6 should read ESHG, -0.064, -0.031, -0.008, -0.005' (Shelton, Phys. Rev. A 36, \
3461 (1987), ref. 10 = shelton_1987b; page image checked). Corrected by errata below: \
D2 CARS, and the four ESHG values; D2's nu_01, printed 2998 in Table 4 (2988 in Table \
2), is not stored from Table 4. CHECKED (2026-09-26) by recomputing Table 4 from Table \
2 with Eqs. (21)-(23) at nu_1 = 15800 cm^-1: dc Kerr -0.032, +0.007, +0.003, +0.038; \
DFWM 0.759, 0.736, 0.336, 0.489; CARS 1.194, 2.462 (2.464 with Table 3's 1.110), -2.245 \
(printed -2.231, 0.6 %, the CARS difference frequency being 170 cm^-1 from N2's \
resonance), -0.309; ESHG -0.0637, -0.0308, -0.0084, -0.0054; THG -0.0202, -0.0100, \
-0.0028, -0.0018. So the corrected values are right; the printed ESHG column is not \
reproduced by any single factor, and the printed D2 CARS 2.426 is what nu_01 = 2998 \
gives (2.416-2.427): the misprinted frequency was used. The Eq. (17) dc Kerr values of \
note * are the text_dc_kerr_eq17_<gas> datasets.

Reproductions elsewhere: shelton_1994 Table VIII gives the N2 and O2 gamma^v in au 'with \
corrections given in ref 133' (shelton_1987b): static 81 and 118, dc Kerr 0.5 and 6.1, \
DFWM 54 and 78 at 632.8 nm (= this paper's 0.506, 0.734, 0.003, 0.038, 0.336, 0.489 x \
10^-62 / 6.2354e-65), ESHG -1.6 and -1.0 and THG -0.6 and -0.4 at 694.3 nm (Eq. 22 at \
694.3 nm gives -1.63 and -1.04, -0.54 and -0.34 au: recomputed at the other wavelength). \
H2 and D2 in that table come from another calculation (its note e)."""

