[[formulas]]
id = "eq21_static"
equation = "Eq. (21), p. 72"
printed = "gamma^v_xxxx(0; 0, 0, 0) = (6/(hbar omega_01)) [(4/45)(alpha_par - alpha_perp)_01^2 + ((alpha_par + 2 alpha_perp)/3)_01^2]"
variable = "omega_01 = 2 pi c nu_01, the fundamental vibrational frequency; (alpha)_01 the static Raman transition polarizabilities (Table 2)"
process = "static"
convention = "T"
part = "vibrational"
range = "the static limit; H2, D2, N2, O2 with Table 2's inputs"
coefficients = { nu01_H2 = "4156", nu01_D2 = "2988", nu01_N2 = "2331", nu01_O2 = "1555", mean01_H2 = "12.21", mean01_D2 = "10.18", mean01_N2 = "6.13", mean01_O2 = "5.89", aniso01_H2 = "10.09", aniso01_D2 = "8.28", aniso01_N2 = "4.04", aniso01_O2 = "5.89" }
coefficient_units = { nu01 = "cm^-1", mean01 = "1e-42 C^2 m^2 J^-1 ((alpha_par + 2 alpha_perp)/3)_01", aniso01 = "1e-42 C^2 m^2 J^-1 (alpha_par - alpha_perp)_01" }
check = "Reproduces Table 3's Eq. (18) column (checked 2026-09-26): 1.149, 1.109 (printed 1.110), 0.506, 0.734 x 10^-62 C^4 m^4 J^-3 for H2, D2, N2, O2."
notes = "The static limit of Eq. (18), for the four molecules of Table 2 (the formula applies to each; the coefficients are Table 2's). Its D^2 (anisotropy) terms carry the approximations of Eq. (18) (+8, +5, +0.5, +0.3 % against Eq. (17), p. 73)."

[[formulas]]
id = "eq22_optical"
equation = "Eq. (22), p. 73"
printed = "gamma^v_xxxx(-2 omega_1 + omega_2; omega_1, omega_1, -omega_2) = gamma^v_xxxx(0; 0, 0, 0) (1/3){2 [1 - ((omega_1 - omega_2)/omega_01)^2]^-1 + [1 - (2 omega_1/omega_01)^2]^-1}"
variable = "omega_1, omega_2 the optical frequencies (CARS as written; ESHG: omega_2 = 0; THG: omega_2 = -omega_1; DFWM: omega_2 = omega_1); omega_01 the vibrational frequency; gamma^v(0) from Eq. (21)"
process = "other"
convention = "T"
part = "vibrational"
range = "frequencies well below electronic resonance; not for the dc Kerr effect (Eq. 23)"
check = "With Table 2 and Eq. (21), reproduces Table 4's DFWM, CARS and THG columns and the corrected ESHG column of shelton_1987b ref. 10 at nu_1 = 15800 cm^-1 (checked 2026-09-26; N2 CARS -2.245 against the printed -2.231)."
notes = "The classical-limit (Eq. 18) frequency dependence of gamma^v for every process whose frequencies pair as written; Table 4's source."

[[formulas]]
id = "eq23_dc_kerr"
equation = "Eq. (23), p. 73"
printed = "gamma^v_dcKerr = (3/2)[gamma^v_xxxx(-omega; 0, 0, omega) - gamma^v_xyyx(-omega; 0, 0, omega)] = (6/(hbar omega_01)) {((alpha_par - alpha_perp)_01^2/45) [3 + [1 - (omega/omega_01)^2]^-1] + ((alpha_par + 2 alpha_perp)/3)_01^2 [1 - (omega/omega_01)^2]^-1}"
variable = "omega the optical frequency; omega_01 the vibrational frequency; (alpha)_01 as in Table 2"
process = "dc_kerr"
convention = "T"
part = "vibrational"
range = "below electronic resonance; 'particularly sensitive to the approximations' of Eq. (18): use Eq. (17) for an accurate value (p. 73)"
check = "With Table 2, reproduces Table 4's dc Kerr column at nu_1 = 15800 cm^-1 (checked 2026-09-26): -0.032, +0.007, +0.003, +0.038."
notes = "A small difference of large terms; at optical frequencies the anisotropy term dominates (p. 73). The Eq. (17) values are in note * of Table 4 (text_dc_kerr_eq17_<gas>)."

