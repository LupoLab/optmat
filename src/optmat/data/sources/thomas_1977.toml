citation = "G. F. Thomas and W. J. Meath, \"Dipole spectrum, sums and properties of ground-state methane and their relation to the molar refractivity and dispersion energy constant\", Mol. Phys. 34, 113 (1977)"
doi = "10.1080/00268977700101561"
library = "Thomas_1977_DipoleSpectrumSums"
identity = "VALIDATED_WITH_WARNINGS"
kind = "compilation"
technique = """Constrained dipole oscillator strength distribution (DOSD): measured photoabsorption \
and fast-electron inelastic-scattering data for CH4 above 2.36 nm (Table 1's \
references), the mixture rule sigma(CH4) = sigma(C) + 2 sigma(H2) with Henke and \
Ebisu's and Millar and Greening's carbon data below 17.71 nm where CH4 data were \
missing or unreliable, and the non-relativistic Stobbe formula below 0.05 nm; the \
initial data, weighted by their errors, adjusted by least squares to satisfy the TRK \
sum rule S(0) = 10 and the molar refractivity at two wavelengths (0.5462 and 0.2302 \
um, from the refractivity data of several authors normalised to Watson and Ramaswamy's \
at 0.5462 um, with a virial density from Dymond and Smith's second virial \
coefficient). The recommended DOSD is the one of least total adjustment. Sums by \
numerical integration (linear interpolation between data points to 0.05 nm, \
Gauss-Legendre below) (pp. 115-119)."""
notes = """PDF pages 1 (a download cover sheet) and 2-14 = journal pages 113-125. Identity \
checked on the first page. Values per molecule; electronic transitions only (the \
'atomic' (infrared) contribution is excluded from Eqs. (2)-(6), footnote p. 115, and \
discussed in Section 5).

Dipole sums S(k) = integral of df/dE (E/2R)^k dE (Eq. (4), 2R = 1 hartree), atomic \
units; S(-2) is the static electronic polarizability in a0^3. Table 2 (p. 120) gives \
S(-1), S(-2), S(-4) of the recommended DOSD (10.86, 17.27, 62.41) with other DOSDs' \
and with S(-2), S(-4) that Thomas and Meath fitted to four sets of normalised \
refractivity data with the Cauchy series Eq. (3) (the S(-4) spread about +-4 %). The \
text (p. 121) gives the other sums: S(-6) = 2.983(2), S(-8) = 1.714(3), S(-10) = \
1.122(4), S(-12) = 8.064(4), S(-14) = 6.190(5), S(-16) = 4.980(6), S(-3) = 3.140(1) \
and S(-3/2) = 1.339(1) (mantissa(power of ten)), stored in e-notation with the digits \
unchanged. S(0) = 10 is the constraint (the Table 1 regions sum to 9.9995). The \
logarithmic sums L(-2) = -9.374, L(-1) = -3.905, L(0) = 4.259, L(1) = 1.474(2), L(2) = \
1.921(4) and the mean excitation energies I_0 = 41.66 eV, I_1 = 497.1 eV, I_2 = \
1.087e4 eV, I_-2 = 15.81 eV (pp. 121-122) have no quantity: not extracted. Accuracy \
(p. 122): for S(k), k >= -8, about 0.5 % (k = 2) to 1 % (k = -8); for k < -8 from \
about 1.5 % (k = -10) to 4 % (k = -16); L(k) below 1 %; 'only valid if the \
refractivity data used to constrain the DOSDs is reliable to a few tenths of a per \
cent'. So the S(k) are not independent of the refractivity data (as kumar_1985): \
checks.

Table 1 (p. 118): the recommended DOSD integrated over 17 spectral regions (nm), \
dataset dosd; threshold to 49.59 nm holds 4.98 (p. 119, checked: 4.982). The \
'unmodified experimental data' column (several references per cell) is not extracted. \
Marks: (c) the mixture rule from 10.33 nm down, with the Stobbe formula in the last \
region; (d) only relative measurements at 4.43-4.08 nm.

Eq. (8) (p. 121): the recommended eight-term Cauchy formula for the molar refractivity \
(formula cauchy_molar_refractivity), R(lambda) in m^3/mol; 'For the spectral region \
lambda > 0.2 um the results for R(lambda) obtained from the DOSD and (2) are \
reproduced to within approximately 5.4, 1.7, 0.61, 0.24, 0.10, 0.04 and 0.02 per cent, \
respectively, if from two to eight terms are retained'.

Section 5 (pp. 122-123): C6(CH4-CH4) = 129.6 hartree bohr^6 (Table 3, with eight \
approximate formulas, 106.7-152.2), and combination-rule C6(CH4-B) for H2, N2, O2, \
NH3, H2O, NO, N2O, He = 39.6, 97.0, 89.0, 107.4, 76.6, 94.7, 154.7, 13.2: no quantity \
(dispersion coefficients), not extracted. The infrared (atomic) polarizability from \
band intensities, minimum 3.304e-32 and maximum 4.467e-32 m^3, against 3.17e-32 m^3 \
from Watson and Ramaswamy's electronic 2.5590e-30 m^3 and Watson, Rao and Ramaswamy's \
total 2.5907e-30 m^3 (p. 123; datasets). A footnote (p. 123) notes CH4's \
centrifugal-distortion dipole moment (about 1e-36 C m), assumed zero here.

REPRODUCTIONS: margoliash_1978's CH4 pseudospectrum is fitted to this DOSD's sums; \
olney_1997 (thomas_1977_CH4) and zhao_2026 quote its S(k) (see those records). Olney \
et al. print S(-6) = 289.3 for this DOSD; the original prints 2.983(2) = 298.3 (p. \
121)."""

[[datasets]]
id = "dosd"
material = "CH4"
file = "CH4/thomas_1977__dosd.csv"
table = "tbl_df5a5473a0a4"
quantity = "interval_oscillator_strength"
abscissa_unit = "nm"
columns = { x_upper = "nm" }
use = "check"
notes = "Table 1 'Recommended oscillator strengths': the constrained DOSD integrated over each spectral region, from the threshold (145.86 nm) to 0.00 nm, 17 regions; x the long-wavelength edge, x_upper the short one (nm, as printed; the last region's 0.00 nm edge is infinite photon energy); row = the region. Constrained to the TRK sum and two refractivities (source notes): a check. Sums to 9.9995 (S(0) = 10)."

