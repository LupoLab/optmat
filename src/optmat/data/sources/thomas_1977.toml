[[formulas]]
id = "cauchy_molar_refractivity"
material = "CH4"
equation = "Eq. (8), p. 121"
printed = "R(lambda) x 10^6 = 6.454 + 4.843 x 10^-2/lambda^2 + 4.805 x 10^-4/lambda^4 + 5.733 x 10^-6/lambda^6 + 7.792 x 10^-8/lambda^8 + 11.62 x 10^-10/lambda^10 + 18.52 x 10^-12/lambda^12 + 30.94 x 10^-14/lambda^14"
variable = "lambda: wavelength in um (vacuum, as the DOSD's photon energies); R(lambda) the molar refractivity in m^3 mol^-1 (the printed left side is R x 10^6)"
state = "none (per mole of molecules: R = (4 pi/3) N_A alpha(lambda), Eq. (2))"
density = "none"
range = "lambda > 0.2 um (p. 121: the eight-term series reproduces the DOSD's R(lambda) there to about 0.02 %)"
coefficients = { c0 = "6.454", c1 = "4.843e-2", c2 = "4.805e-4", c3 = "5.733e-6", c4 = "7.792e-8", c5 = "11.62e-10", c6 = "18.52e-12", c7 = "30.94e-14" }
check = "Each coefficient is (4 pi/3) N_A a0^3 S(-2l) (hc/(2R))^(2(l-1)) x 10^6 with the paper's S(-2l) (Eq. (3)): with 2018 constants the eight terms come out 6.4556, 4.8432e-2, 4.8057e-4, 5.7325e-6, 7.7904e-8, 11.624e-10, 18.523e-12, 30.938e-14, within 3.3e-4 of the printed ones (the paper used 1973 constants). R(0.5462 um) = 6.622e-6 m^3/mol, against 6.620e-6 from watson_1936's (n - 1) = 405.90e-6 at 25 C and 760 mm with the ideal-gas density (Thomas and Meath used a virial density) (computed 2026-09-27)."
notes = "The recommended Cauchy formula built from the DOSD's S(-2) ... S(-16); the electronic molar refractivity only (no infrared part). Not independent of the refractivity data that constrain the DOSD."
