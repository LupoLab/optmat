notes = """The library record is unverified (no DOI found); the citation is from the page's \
own footer (0003-6935/11/356486-01, Appl. Opt. 50, issue 35, published 2 December \
2011) and its reference list. It replies to Kren's comment (kren_2011) on Zhang, Lu \
and Wang, Appl. Opt. 47, 3143 (2008) (zhang_2008).

It holds no values and no corrected coefficients: nothing is extracted. What it \
says (p. 1): the synthetic-air, N2 and O2 dispersions are consistent 'if the oxygen \
concentration of the synthetic air is just slightly above the value given by the \
vendor'; 'the oxygen data are less reliable since we use the older National Bureau of \
Standards (NBS) compressibility factor'; 'our results in principle are only valid \
between 740 nm and 860 nm. They are extrapolated to 633 nm so that we can compare with \
Birch's results'; the possible effect of oxygen absorption near 760 nm 'could not \
[be observed] with our apparatus at that time'. These cautions bear on zhang_2008's \
oxygen formula and its use outside 740-860 nm."""
