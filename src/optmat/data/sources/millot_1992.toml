density = "unknown"
range = "295-1350 K, N 1-55 (the data fitted)"
coefficients = { alpha = "16.70", alpha_error = "0.20", N = "1.32", N_error = "0.01", delta = "1.32", delta_error = "0.03", beta = "1.45", beta_error = "0.03", a = "1.5", sigma = "0.99", T0 = "295" }
