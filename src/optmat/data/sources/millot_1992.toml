citation = "G. Millot, R. Saint-Loup, J. Santos, R. Chaux, H. Berger and J. Bonamy, \"Collisional effects in the stimulated Raman Q branch of O2 and O2-N2\", J. Chem. Phys. 96, 961 (1992)"
doi = "10.1063/1.462116"
library = "Millot_1992_CollisionalEffectsStimulated"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Stimulated Raman gain spectroscopy (Dijon, p. 2): a frequency-stabilised \
single-mode Kr-ion probe (1 MHz jitter) and a narrow-band cw dye pump pulse-amplified \
to 750 kW, polarizations parallel; absolute frequencies by a Michelson wavemeter; a \
second (reference) cell recorded simultaneously for the differential line-shift \
measurement. Fundamental Q branch (v = 0 -> 1) of 16O2 at 295-1350 K and 150-1550 Torr \
(Table I); O2-N2 from dry air taken as 79 % N2, 21 % O2 (p. 5). Each spectrum fitted \
with Eq. (8): a sum of Galatry profiles with Rosenkranz first-order line mixing \
(Eq. (7)), the Dicke parameter fixed by Eq. (9), the apparatus function (a Gaussian of \
HWHM 1.1e-3 cm-1) neglected; the broadening coefficient of each Q(N) from a linear \
regression of the collisional widths over pressures >= 300 Torr."""
notes = """Identity checked against the first page (the pdf has a publisher cover page: \
page numbers here are pdf pages, 2-12 = journal pp. 961-971). Material: 16O2, X \
3Sigma_g-, rotational levels labelled by N (odd only); each triplet (J = N, N +- 1) is \
treated as one line (the 1Sigma approximation; the minimum pressure chosen so that the \
error is small, p. 3). No isotopologue is measured.

WIDTH CONVENTION. Every width is a HALF width at half maximum per atm: p. 4, 'Gamma_N \
the collisional half-width at half-maximum (HWHM)', p. 5, 'gamma_N = Gamma_N/p \
represents the line broadening coefficient expressed in cm-1 atm-1'; Tables II, III, \
VI and VII: 'HWHM in 10^-3 cm-1 atm-1'. Per atm at the stated temperature (not per \
amagat), except Table IV's mean shifts, 'in density units (mk amagat-1)', 1 mk = 1e-3 \
cm-1. The Dicke effect is in the line shape (Galatry), not in the coefficients: the \
coefficients are the collisional (Lorentzian) part only. The polarized Q branch widths \
are taken as purely isotropic widths (depolarization ratios 1.8-4.9 %, p. 3).

UNCERTAINTIES. Tables II and III: 'The uncertainties correspond to twice the standard \
deviation' (captions, p. 7; also p. 6). Table IV: 'one standard deviation'. The \
theoretical Tables VI-VIII have none. The printed errors of the reproduced columns of \
Table II (Ouazzany et al.) are as printed.

O2-N2 (Table III and the O2-N2 columns of Table IV) is derived from the air \
measurements by Eq. (10), gamma_N = C_O2 gamma_N(O2-O2) + C_N2 gamma_N(O2-N2), with the \
O2-O2 values (p. 6); the reference cell of the shift measurement held pure O2 at its \
partial pressure, so the O2-N2 shift is measured directly (p. 7).

TABLE I (p. 6), recording conditions (as the image shows; the extraction shifts the \
temperature cells): O2-O2 295 K 150-460 Torr N 1-9 and 150-1500 Torr N 11-23; 446 K \
240-920 Torr N 1-21; 769 K 300-900 Torr N 3-19; 990 K 760-1520 Torr N 1-21; 1317 K \
900-1530 Torr N 3-29; 1350 K 760 Torr N 39-55; O2-N2 295 K 740 Torr, 446 K 740 Torr, \
990 K 740-1550 Torr, N 1-21.

TABLE IV. Its caption is extracted as a table note ('Experimental line shifting \
coefficients (in 1e-3 cm-1 atm-1) for O2-O2 and O2-N2 measured at low pressure. The \
uncertainties correspond to one standard deviation.') and the running head as the \
caption; identified by the image and the text (p. 7, 'The results are reported in Table \
IV'). The shift is negative (to lower Raman frequency); 'of the order of -3.5e-3 cm-1 \
atm-1 for O2 at 295 K' (p. 3).

TABLE V (p. 9, not in the extracted tables: a 'code' block; page image checked): the \
inputs of the semiclassical calculation, reproduced from Refs. 33-38 (not extracted): \
atom-atom e_OO = 0.26e-10 erg A^6/molecule, d_OO = 0.25e-7 erg A^12/molecule, e_NN = \
0.25e-10, d_NN = 0.29e-7; Lennard-Jones eps(O2) = 120 K, sigma(O2) = 3.55 A, eps(N2) = \
97 K, sigma(N2) = 3.73 A; quadrupole moments Q(O2) = -0.39 D A, Q(N2) = -1.4 D A; \
vibrational parameters of O2 (1/alpha) d alpha/d xi = 1.32, (1/Q) dQ/d xi = -2, \
<1|xi|1> - <0|xi|0> = 0.826e-2, a_01 = 1.09e-2, b_01 = -3.3e-2. The semiclassical \
shifts use an adjustable y = 2 (p. 10).

OTHER TEXT VALUES. The collisional reorientation contribution gamma_elas^ori is about \
4e-3 cm-1 atm-1 at room temperature (average over N, p. 7). The Q(N) depolarization \
ratios (1.8 % for N = 1 to 4.9 % for N = 11) and R = 0.717 are Hill et al.'s (p. 3). \
For O2, D_m0 = 0.189 cm2 s-1 at 1 atm and 273.15 K (Jost), D = (2/3) D_m and alpha = \
1.5 are assumed (p. 5).

FORMULAS (Table IX, p. 10). The fits were checked by recomputing Table II and Table III \
from Eq. (12), gamma(N) = -sum_{N' != N} W_{N'N}, with the O2 levels E_N = B N(N+1), B \
= 1.438 cm-1 (shelton_1987 Table 2; D neglected), odd N to 119, downward rates by \
detailed balance (scratch, 2026-09-26): see each formula's check. Eq. (16) as printed, \
with exp[(E_N' - E_N>)/kT], violates detailed balance (rho_N W_N'N is not symmetric) \
and gives widths two to three times Table II's at 295 K (N = 7: 138 against 45.3 \
mk/atm, ECS-P); with exp[(E_N - E_N>)/kT] (E_N the \
initial level) it is symmetric and reproduces the tables (see the ECS formulas): the \
printed E_N' is probably a misprint for E_N. The adiabatic factor Omega is not defined \
in the paper ('the adiabatic factor proportional to l_c'); the checks assume De \
Pristo's form Omega_N = [1 + (omega_{N,N-1} l_c/v)^2/6]^-1 with omega_{N,N-1} = 2 pi c \
(E_N - E_{N-1}) and v the mean relative speed (8kT/pi mu)^(1/2); with omega from the \
N -> N-2 spacing, or without the 2 pi, the reproduction is 2-8 times worse.

solprop: its O2 vibrational width, 2933389355.65 Hz/amagat FWHM, is Table II's Q(7) at \
295 K, 45.3 +- 0.8 (2 sigma) x 1e-3 cm-1/atm HWHM, doubled and converted with 1 atm = \
0.92593 amagat at 295 K (ideal gas): 2 x 45.3e-3 x 29.9792458e9 / 0.92593 = 2.9334e9. \
The HWHM-to-FWHM doubling is right."""

