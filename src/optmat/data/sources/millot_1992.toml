variable = "T in K, T0 = 295 K; E_N the rotational energy of the (lower) level N, E_N'N = |E_N' - E_N|; a = 1.5 (the paper's choice, p. 10); alpha in mk/atm (1 mk = 1e-3 cm-1): the rates and the HWHM gamma(N) in 1e-3 cm-1 per atm; downward rates by detailed balance"
