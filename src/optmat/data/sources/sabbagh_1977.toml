citation = "J. Sabbagh and N. Sadeghi, \"Experimental transition probabilities of some Xe(I) lines\", J. Quant. Spectrosc. Radiat. Transfer 17, 297-301 (1977)"
doi = "10.1016/0022-4073(77)90108-X"
library = "Sabbagh_1977_ExperimentalTransitionProbabilities"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Absorption of a 132Xe probe lamp (0.5 Torr 132Xe in 4.5 Torr He, RF \
excited, 1 mm bore) by the metastable 6s[3/2]2 and resonant 6s[3/2]1 atoms in the \
afterglow of a pulsed discharge in 0.2 Torr isotopic 132Xe (cell 38 mm by 300 mm, \
current below 10 mA), read on a 0.6 m monochromator with photomultipliers (3500-11000 \
Angstrom) and a multichannel analyser (5 us resolution). Ratios of the absorption rates \
of two lines from the same lower level (each below 5 %, Doppler profiles, Eqs. 1-2) give \
ratios of f, and with the Ladenburg formula (Eq. 3) of A; absolute values by \
normalising to the reference lines 8819 Angstrom (6p[5/2]3-6s[3/2]2, A = (30 +- 0.5) x \
10^6 s-1) and 8280 Angstrom (6p[1/2]0-6s[3/2]1, (34 +- 2.5) x 10^6 s-1), the means of \
the literature values of Table 1, not measured here."""
notes = """J. Quant. Spectrosc. Radiat. Transfer 17(3), 297-301 (1977) = PDF pages 1-5 \
(journal page = PDF page + 296). Identity checked on the first page (PDF p. 1: journal, \
volume 17, pp. 297-301, Pergamon 1977, title, authors, Grenoble) on 2026-10-09. Table 2 \
(p. 300, tbl_a841626f3146) and Table 1 (p. 298, tbl_730574616f21) checked cell by cell \
against the table images.

TAKEN (transition_probability, TC-1011; extraction script tools/extract/ \
sabbagh_1977.py): Table 2, column 'Present work', all 25 rows, in three datasets: the \
19 lines to the metastable 6s[3/2]2 measured against 8819 Angstrom (A_6s2_Xe, \
primary), the 4 lines to the resonant 6s[3/2]1 measured against 8280 Angstrom \
(A_6s1_Xe, primary), and the two reference lines (A_reference_Xe, check: their values \
are the means of Table 1's literature values, 'we have arrived at mean value of ...', \
p. 298, not measurements of this paper). Rows are the transitions in the paper's \
Racah notation, x the printed air wavelength. The library cell \
'6p[1/2]_6-6s[3/2]_1' is the image's 6p[1/2]0-6s[3/2]1 (the script labels it so; \
the cell is kept in printed). Uncertainties as printed, per row, 'include, besides \
uncertainties in the transition probabilities of the reference lines 8819 and 8280 \
Angstrom (see Table 1), the uncertainties in our absorption-ratio measurements' (p. \
301), level not stated: each line's value carries its reference line's scale \
(1.7 % for 8819, 7.4 % for 8280) in common with the others of its group.

NOT TAKEN: the ratio A(7642 Angstrom, 6p'[1/2]1-6s'[1/2]0) / A(8206 Angstrom, \
6p'[3/2]1-6s'[1/2]0) = 1.11 +- 0.13 (p. 301; theory 1.734, Chen and Garstang, and \
1.594, Aymar-Fehrenbach), a ratio no quantity holds; Table 1's literature values and \
Table 2's comparison columns (Chen and Garstang; Aymar-Fehrenbach, intermediate and \
jl coupling; Malakhov; Karimov and Klimkin), reproduced and superseded by NIST; Figs. \
1-2 (absorption against time).

LEVELS. The paper uses Racah (jl) notation, 6p[5/2]3 = 5p5(2P*3/2)6p 2[5/2], J = 3 in \
NIST's notation; the primed levels have the 2P*1/2 core. Wavelengths are in air \
(8819 Angstrom = NIST 882.18 nm vacuum, 881.941 nm air; every row's wavelength \
matches NIST's air wavelength of the named transition to within 0.4 Angstrom, 0.05 \
Angstrom for the rows printed to 0.1 Angstrom, which fixes the mapping). Every row, \
upper level -> NIST (src/optmat/data/external/nist_asd/Xe_I_levels.tsv): 6p[1/2]1, \
6p[5/2]2, 6p[5/2]3, 6p[3/2]1, 6p[3/2]2, 6p[1/2]0 = 5p5.(2P*<3/2>).6p 2[K] J; 6p'[3/2]1, \
6p'[3/2]2, 6p'[1/2]1 = 5p5.(2P*<1/2>).6p 2[K] J; 7p[1/2]1, 7p[5/2]2, 7p[5/2]3, \
7p[3/2]2, 8p[5/2]2, 8p[5/2]3, 8p[3/2]2, 9p[5/2]3, 9p[3/2]2 = 5p5.(2P*<3/2>).np 2[K] J; \
4f[3/2]2, 4f[5/2]3, 5f[5/2]3 = 5p5.(2P*<3/2>).nf 2[K] J; lower levels 6s[3/2]2 and \
6s[3/2]1 = 5p5.(2P*<3/2>).6s 2[3/2]* J = 2 and 1 (K and J as in the label).

FINDING (NIST, src/optmat/data/external/nist_asd/Xe_I_lines_nir.tsv, TC-983). Of the \
20 lines to 6s[3/2]2, 16 have NIST A values equal to this paper's (to NIST's printed \
digits; NIST tp_ref T3269), so NIST evidently adopts this paper: 8819 (3.00e7, A+), \
9800 (3.11e7, B+), 9045 (1.24e7), 8409 (3.06e6), 8232 (2.86e7), 4691 (2.8e5), 4524.7 \
(4.6e5), 4501 (1.46e6), 3974.4 (1.4e5), 3967.5 (5.3e5), 3951 (5.6e5), 3693.5 (3.1e5), \
3686 (4.5e5), 4203.7 (1.1e5), 4193.5 (2.20e5), 3796.3 (1.6e5). The four 7p lines \
differ (NIST T8608): 4792.6, 0.15 against NIST 0.12 (x 1.25); 4697, 0.57 against 0.736 \
(x 0.77); 4671, 2.84 against 2.49 (x 1.14); 4624, 2.18 against 2.42 (x 0.90). The \
five lines to 6s[3/2]1 are all 0.904-0.944 times NIST's (8280: 34 against 36.9; \
10838.3: 1.70 against 1.8; 9923.2: 12.0 against 13.0; 9162.6: 21.7 against 24; \
8952.2: 7.50 against 8.1; NIST tp_ref 'T3269n, T6714'): NIST's values are this \
paper's times 36.9/34 = 1.085, to NIST's rounding, i.e. renormalised to a reference A \
of 3.69e7 s-1 for 8280 Angstrom instead of the paper's 34e6. The ratio A(7642)/A(8206) \
= 1.11 +- 0.13 against NIST's 2.1e7/2.0e7 = 1.05.

FINDING (bruce_1990). Sabbagh and Sadeghi state that the 6p[1/2]0 level decays \
practically only by 8280 Angstrom (p. 298), so A(8280) = 1/tau(6p[1/2]0). Bruce et \
al.'s radiative lifetime 26.8 +- 0.8 ns gives 3.73e7 s-1, 10 % above the adopted 34 +- \
2.5 x 10^6 s-1 and consistent with NIST's renormalised 3.69e7.

FINDING (gornik_1981). Gornik et al.'s Table I gives 'Experimental f values (Ref. 19) \
6s|3/2|1 -> 6p' of 0.12, 0.15 and 0.30 for 6p[1/2]0, 6p[3/2]2 and 6p[5/2]2, Ref. 19 \
being this paper. This paper prints no f values; its A values of the lines to \
6s[3/2]1, 34, 7.50 and 12.0 x 10^6 s-1 at 8280, 8952.2 and 9923.2 Angstrom, give by \
its own Eq. (3) (absorption f from the lower level, g_u/g_l = 1/3, 5/3, 5/3) f = 0.1165, \
0.1502 and 0.2953: Gornik et al.'s values are these, rounded. NIST's absorption f of \
the same lines are 0.127 (B), 0.163 (C+) and 0.321 (B+), 8-9 % higher (the \
renormalisation above). In Gornik et al.'s single-path estimate the product f(1S0 - \
6s[3/2]1) f(6s[3/2]1 - 6p) enters; with their 0.28 (matthias_1977) it is 0.0336, \
0.0420 and 0.0840, and with NIST's 0.265 and the NIST values above 0.0337, 0.0432 and \
0.0851: the two differences cancel to within 0.2, 2.8 and 1.3 %.

The paper quotes 'the radiative lifetime of the level 6s[3/2]1 is 3.8 nsec' (p. 299, \
its Ref. 12, Anderson 1965, whose value is 3.79 +- 0.12 ns in matthias_1977's Table 2)."""

