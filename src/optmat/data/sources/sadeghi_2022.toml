citation = "N. Sadeghi, R. Magnan and F. Massines, \"Pressure broadening of 772.376 and 772.421 nm argon lines and kinetics of argon metastable atoms\", J. Quant. Spectrosc. Radiat. Transfer 288, 108264 (2022)"
doi = "10.1016/j.jqsrt.2022.108264"
library = "Sadeghi_2022_PressureBroadening772"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Time-resolved tunable diode laser absorption (DFB diode, < 10 MHz, scanned \
by temperature in 2.180 +- 0.025 pm steps calibrated by a 375.0 MHz FSR confocal \
Fabry-Perot and the 44.66 pm gap between the lines; unshifted positions from a \
low-pressure argon reference cell) on the metastable atoms Ar*(1s5) and Ar*(1s3) of a \
20 kHz plane-to-plane glow dielectric barrier discharge in flowing Ar + 200 ppm NH3 at \
312, 455, 678, 816 and 1000 mbar, gas temperature about 310 K (the Gaussian width at \
312 mbar; N2 second positive band at 1 atm, 305 K). The blended profiles of the \
772.376 nm (1s5-2p7) and 772.4207 nm (1s3-2p2) lines are fitted with two Voigt \
profiles; the Lorentzian FWHM and shift are fitted linearly in pressure through the \
origin (Fig. 7)."""
notes = """J. Quant. Spectrosc. Radiat. Transfer 288, 108264 (2022). The library holds the \
HAL deposit hal-03782652v1 (submitted 21 September 2022; 25 PDF pages: a HAL cover, \
then the authors' manuscript numbered 1-24, manuscript page = PDF page - 1), not the \
journal's typeset version; page numbers below are the manuscript's. Identity checked on \
the HAL cover and manuscript p. 1 (title, authors Sadeghi, Magnan and Massines, LIPhy \
and LTM Grenoble, PROMES Perpignan; the cover's citation gives journal, volume, article \
number and DOI) on 2026-10-12. The values were read on the rendered pages 1 and 11 and \
Table 1's image (p. 17). The version of record was not seen: its numbers could differ.

ONE-PHOTON 4s-4p LINES, NOT OEP 8's COHERENCE. These are one-photon absorption lines \
from the metastable 4s levels to 4p levels, broadened and shifted by ground-state \
argon (van der Waals; neither level is connected to the ground state, p. 12). OEP 8 \
needs the dephasing of the ground-to-4p two-photon coherence by argon; the width of a \
4s-4p line contains the 4s level's broadening as well, so nothing for the two-photon \
coherence is derived from these values.

LEVELS (Paschen, the paper's; NIST Ar_I_levels.tsv and Ar_I_lines_nir.tsv). 772.376 \
nm: 1s5 = 4s[3/2]2 = 3p5(2P*3/2)4s 2[3/2]* J = 2 (93143.76 cm-1) - 2p7 = 4p[3/2]1 = \
3p5(2P*3/2)4p 2[3/2] J = 1 (106087.26); 772.4207 nm: 1s3 = 4s'[1/2]0 = 3p5(2P*1/2)4s \
2[1/2]* J = 0 (94553.67) - 2p2 = 4p'[1/2]1 = 3p5(2P*1/2)4p 2[1/2] J = 1 (107496.42). \
The printed wavelengths are air wavelengths: NIST's vacuum 772.5887 and 772.6333 nm \
divided by the index of air (about 1.000275) give 772.376 and 772.421 nm. The upper \
level 2p2 is one of baig_2008's photoionised levels; neither upper level is one of OEP \
8's two-photon (J = 0, 2) levels.

TAKEN (inline, the abstract, p. 1): 'w1=28.3+-2.0 pm (14.2+-1.0 GHz) and s1=11.5+-0.8 \
pm (-5.8+-0.4 GHz) for 772.376 nm line and w2=36.3+-0.5 pm (18.2+-0.3 GHz) and \
s2=12.8+-0.7 pm (-6.4+-0.4 GHz) for 772.4207 nm line, at 1 bar and 300 K'. The \
frequency values are held: a width in GHz at 1 bar is the same number in MHz/mbar (1 \
GHz/bar = 1 MHz/mbar exactly), so unit MHz/mbar with the printed numbers. w is the FWHM \
of the Lorentzian component (p. 11), in ordinary frequency; s is a red shift in pm, \
printed negative in GHz, which is the vocabulary's sign (positive to the blue). \
Perturber self: argon with 200 ppm NH3. The 300 K values are the authors' scaling of \
the measured slopes at about 310 K by T^-0.7 (p. 11); temperature_k = 300. \
Uncertainties: '2 sigma of the fit +1.3% uncertainty from the wavelength gap between \
steps' (p. 11). use primary.

CHECKED (2026-10-12). The GHz values against the pm values: Delta nu = c Delta lambda / \
lambda^2 with the air wavelengths gives 14.23, 5.78, 18.25 and 6.43 GHz for 28.3, 11.5, \
36.3 and 12.8 pm (the printed 14.2, 5.8, 18.2, 6.4); the uncertainties 1.00, 0.40, 0.25 \
and 0.35 GHz (printed 1.0, 0.4, 0.3, 0.4). Table 1 (p. 17, image) prints the same pm \
values. The measured slopes at about 310 K (p. 11): w1 = 27.7 +- 2, s1 = 11.3 +- 0.8, w2 = \
35.5 +- 0.5, s2 = 12.5 +- 0.7 pm/bar ('pm.bar' for s2 in the library text; the page \
image prints pm.bar^-1); times (310/300)^0.7 = 1.0232 they give 28.34, 11.56, 36.32 and \
12.79, the printed 28.3, 11.5, 36.3 and 12.8: s1 would round to 11.6, a 0.06 pm \
difference well inside its +-0.8 (not an erratum; the slopes are printed to 0.1 pm).

FINDINGS. The paper's own van der Waals estimates (Table 1): 25.8 and 31.0 pm (Eq. 3, \
the Physicist's Desk Reference / NIST form) and 29.4 and 35.2 pm (Eq. 7, its corrected \
factor 3.41) against the measured 28.3 and 36.3. The Einstein A values used for the \
densities (p. 14), 5.18 x 10^6 and 1.17 x 10^7 s-1 'taken from' NIST (ref. 45), are \
NIST's 5.2e6 and 1.17e7 (Ar_I_lines_nir.tsv) and are not taken.

NOT TAKEN. The measured 310 K slopes in pm/bar (above; the vocabulary has no wavelength \
per pressure unit, and the 300 K frequency values are what the paper gives in \
frequency). Table 1's comparison columns: Williamson et al.'s width (ref. 58), 40 pm, \
derived by the authors from a 2.1 GHz Lorentzian width at 100 Torr and 410 K; \
Moussounda and Ranson's shifts (ref. 28), 13.5 and 14.5 pm, scaled by the authors from \
about 2000 K; the shift/width ratios 0.4 and 0.35. The metastable densities, the \
three-body and two-body quenching coefficients of Ar*(1s5) and Ar*(1s3) quoted from ref. \
50 (1.1 +- 0.4 and 0.83 +- 0.3 x 10^-44 m6 s-1; 2.1 and 5.3 x 10^-21 m3 s-1) and the \
derived transfer coefficients (4s levels, not the 4p levels of OEP 8; quoted), Table 2 \
(discharge voltages and E/N) and the figures. No two-photon data."""

