citation = "P. Bejot, E. Cormier, E. Hertz, B. Lavorel, J. Kasparian, J.-P. Wolf and O. Faucher, Phys. Rev. Lett. 110, 043902 (2013)"
doi = "10.1103/physrevlett.110.043902"
