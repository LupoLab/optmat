corrected = "1.1"
reason = "The printed coefficient is the cross-Kerr index the probe sees (twice the self coefficient for n2), not the single-beam Kerr index n = n0 + n2 I the paper presents it as."
evidence = "The authors' erratum, Opt. Express 18, 3011 (2010) (loriot_2010), Table 1: n2(N2) = 1.1 +- 0.2 x 10^-7 cm^2/TW, obtained by dividing each n_2j by (j + 1) (p. 1); checked on its table image. Also loriot_2011 p. 7 (n2^cross = 2 n2) and Wahlstrand et al. 2013 Table I (11 +- 2 x 10^-20 cm^2/W)."

