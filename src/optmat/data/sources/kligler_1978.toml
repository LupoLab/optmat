notes = "Table I (p. 2222), xenon, 1930 Angstrom (ArF*), excited product Xe+: the estimated sigma/I in cm^4/W (rate per atom (sigma/I) I^2 / hbar omega, Eq. 1; sigma_2 = (sigma/I) hbar omega = 1.03e-52 cm4 s at 193.0 nm), energy denominator 16 x 10^3 cm^-1, linewidth ~10^9 MHz, mu_1^2 = mu_2^2 = 1 D^2. One significant figure; an order-of-magnitude estimate. Equal to bischel_1979's later copy of the same estimate. Eq. (2) with these inputs gives 1.0e-33 for a 10^9 MHz Lorentzian normalised in the ordinary frequency, ten times the printed value (record notes)."
