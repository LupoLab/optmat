citation = "A. S. Alnaser, M. Zamkov, X. M. Tong, C. M. Maharjan, P. Ranitovic, C. L. Cocke and I. V. Litvinyuk, \"Resonant excitation during strong-field dissociative ionization\", Phys. Rev. A 72, 041402(R) (2005)"
doi = "10.1103/PhysRevA.72.041402"
