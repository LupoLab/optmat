[[formulas]]
id = "propagation_model"
material = "SiO2"
equation = "Eqs. (1)-(3), p. 013817-2"
printed = "dz E = (i/(2k0)) T^-1 nabla_perp^2 E + i D E - i (k0/(2 n0^2 rho_c)) T^-1 rho E - (sigma/2) rho E - U_i W(I)(rho_nt - rho)/(2I) E + i (omega0/c) n2 T int R(t - t')|E(t')|^2 dt' E (1); R(t) = (1 - g) delta(t) + g theta(t) [(1 + omega_R^2 tau_R^2)/(omega_R tau_R^2)] exp(-t/tau_R) sin(omega_R t) (2); dt rho = W(I)(rho_nt - rho) + sigma rho I/U_i - rho/tau_rec (3)"
variable = "E: envelope with I = |E|^2; T = 1 + (i/omega0) dt; D = sum_{n>=2} (k^(n)/n!)(i dt)^n; rho_c ~ 1.11e21/lambda0^2[um] cm^-3; W(I) the Keldysh rate for crystals"
coefficients = { U_i = "7.8 eV", reduced_mass = "0.635", rho_nt = "2.1e22 cm^-3", tau_rec = "150 fs" }
check = "P_cr and sigma of Table I checked (see the datasets); W(I) is not printed."
notes = "The input pulse is a second-order supergaussian in x and y with I0 = 2 pi P_in/[P_cr Gamma^2(5/4)] (Eq. 4)."

[[formulas]]
id = "clamping_estimate"
material = "SiO2"
equation = "Eq. (10), p. 013817-5"
printed = "W(I) = 2 rho_c n0 n2 I / (Delta T rho_nt)"
variable = "Delta T: the duration of the pulse after the first ionization front; I the clamping intensity"
coefficients = { rho_nt = "2.1e22 cm^-3" }
check = "Not reproduced: W(I) is not printed."
notes = "The balance of Kerr focusing and plasma defocusing used to estimate the clamping intensity and peak density."
