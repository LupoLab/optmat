citation = "L. Berge, S. Mauger and S. Skupin, \"Multifilamentation of powerful optical pulses in silica\", Phys. Rev. A 81, 013817 (2010)"
doi = "10.1103/physreva.81.013817"
library = "Berge_2010_MultifilamentationPowerfulOptical"
identity = "VALIDATED"
kind = "theory"
technique = """3D numerical simulations of multiple filamentation in fused silica at 355 and \
1550 nm (extended nonlinear Schrodinger equation with delayed Raman-Kerr response, \
Keldysh ionization of crystals, Drude plasma, avalanche and recombination, Eqs. 1-3), \
with a plane-wave modulational-instability analysis (Eqs. 5-9). No measurements."""
notes = """Journal pages 013817-1 to -10 = PDF pages 1-10. Identity validated.

EVERY VALUE IS A SIMULATION INPUT (recorded assumed, use = check), p. 013817-2: 'Values \
for glass dispersion are taken from Ref. [20]' (Agrawal, Nonlinear Fiber Optics, 3rd ed., \
2001); 'The nonlinear Kerr response includes a Raman-delayed contribution with ratio g \
varying with the laser wavelength [20,22]' (Agrawal; Zozulya et al., Phys. Rev. Lett. 82, \
1430 (1999)); 'The Keldysh rate for crystals is employed to model ionization in glass \
[23], using a reduced (electron-hole) mass of silica equal to 0.635 and considering the \
ionization potential U_i = 7.8 eV. The initial density of SiO2 molecules is rho_nt = 2.1 x \
10^22 cm^-3 and the electron recombination time is set to tau_rec = 150 fs. Besides \
dispersion coefficients and the constituents of the overall Kerr response Eq. (2), other \
physical parameters such as the avalanche cross sections sigma have been recalled in Table \
I.' Table I's caption: 'Kerr indices are taken from Refs. [20,24]' (ref. 24 is Milam, \
Appl. Opt. 37, 546 (1998) = milam_1998). The reduced mass, U_i, rho_nt and tau_rec are \
not attributed.

TABLE I (p. 013817-2, tbl_3463a4cb91f2, image checked): k'', k''', n0, n2, P_cr, g, tau_R, \
omega_R^-1, sigma at 355 and 1550 nm. The k''' row prints 'fs2/cm' (image confirmed), \
dimensionally the unit of k''; a third-order dispersion is in fs3/cm, recorded so (a \
misprinted unit, not a value: no erratum mechanism exists for a unit; see the dataset). \
CHECKS (2026-09-26): P_cr = lambda0^2/(2 pi n0 n2) gives 0.379 MW at 355 nm (printed \
0.37) and 12.07 MW at 1550 nm (printed 12). The Drude inverse-bremsstrahlung cross \
section sigma = e^2 tau_c/(m_e n0 eps0 c (1 + omega0^2 tau_c^2)) (the form of \
couairon_2005 Eq. 5 and gulley_2012) reproduces both printed sigma with the same \
collision time, tau_c = 23.13 fs (n0 from Table I, m = m_e); the paper does not state \
tau_c. The critical density rho_c ~ 1.11 x 10^21/lambda0^2[um] cm^-3 is omega0^2 eps0 \
m_e/e^2 to 0.4 %.

RAMAN RESPONSE, Eq. (2): R(t) = (1 - g) delta(t) + g theta(t) [(1 + omega_R^2 \
tau_R^2)/(omega_R tau_R^2)] exp(-t/tau_R) sin(omega_R t); in the modulational \
instability analysis the Raman part is 'limited to only 18% of the overall Kerr \
nonlinearity' (p. 013817-2). Note that at 355 nm tau_R = 50 fs, at 1550 nm 32 fs.

MODEL RESULTS (not extracted): clamping intensities 15-20 TW/cm2 and peak densities \
~4e19 cm^-3 (355 nm, 1 ps), 5.5 TW/cm2 and 5e19 (355 nm, 50 fs), ~20 TW/cm2 and 6e18 \
(1550 nm, 1 ps), 26-30 TW/cm2 and 7.6-8.8e18 (1550 nm, 50 fs), from Eq. (10); fluences \
~2.5 J/cm2 (355 nm, 1 ps), 0.32 (355 nm, 50 fs), 1.5-3 and 0.43 J/cm2 at 1550 nm, compared \
with 'damage thresholds of dielectrics' (refs. 27-28: Tamura et al. 1990; stuart_1996), \
pp. 013817-3 and -5. Literature quoted in the introduction (not extracted: plasma \
densities and index changes of other works): 4e19 cm^-3 and 0.4e-3 for 248 nm, 450 fs \
[17]; 5e-3 at 800 nm; 1.2e-3 at 1558 nm, 870 fs [19].

The Keldysh 'rate for crystals' itself is not printed; W(I) enters Eqs. (1) and (3)."""

