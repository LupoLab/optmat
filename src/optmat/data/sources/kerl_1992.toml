notes = "Data of Hohm and Kerl, Ber. Bunsenges. Phys. Chem. 95, 36 (1991) (note d) = hohm_1991 (re-pointed 2026-09-27; with hohm_1990's 300-1100 K data, not independent of either). Note g as for H2."

