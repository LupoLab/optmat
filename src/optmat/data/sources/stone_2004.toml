citation = "J. A. Stone and A. Stejskal, Metrologia 41, 189 (2004)"
doi = "10.1088/0026-1394/41/3/012"
library = "Stone_2004_UsingHeliumAs"
identity = "VALIDATED"
kind = "theory"
technique = """Helium: the refractive index computed ab initio (Lorentz-Lorenz with the \
molar polarizability from Bhatia and Drachman's dynamic polarizability, its static \
term replaced by Lach, Jeziorski and Szalewicz's QED value, plus the density and \
refractivity virial coefficients). Nitrogen: measured with two Fabry-Perot \
refractometers (Zerodur spacers of 452 and 94 mm, lasers locked to transmission \
maxima at 633 nm), their pressure distortion calibrated with helium's calculated \
index (pp. 189-194)."""
notes = """Formulas (pp. 191-192): Eq. (5) alpha(omega) in reduced atomic units, Eq. (6) \
A_R = 0.37395692 alpha (cm^3/mol, 4He, 2002 CODATA), Eq. (7) omega = 91.13919792/lambda \
(lambda in nm), Eq. (8) A_R(lambda), Eq. (9) B(T) (Hurly and Moldover), Eq. (10) B_R \
near 633 nm, Eq. (12) n = 1 + 3z/2 + 3z^2/8 with z = (n^2-1)/(n^2+2) = A_R rho + B_R \
rho^2. The paper's A_R is (4 pi/3) N_A alpha in Gaussian units, i.e. the package's \
molar refractivity. Wavelengths are vacuum wavelengths (omega from lambda through \
a0 and the fine-structure constant). The uncertainty of Eq. (8) is 'an estimated \
relative uncertainty of 1e-6 at optical frequencies' (p. 191), dominated by an \
arbitrary allowance for QED in the dynamic terms.

The paper argues (p. 191) that the two direct He measurements (Achtermann et al. \
1991, Birch 1991) are 'seriously inconsistent' with the theory, high by 7e-8 and \
1.1e-7 in n at 1 atm, and that indirect evidence (dielectric-constant measurements, \
Mansfield and Peck's and Velsko and Eimerl's dispersion) supports the theory to \
4e-9 at 633 nm.

Nitrogen (p. 195): two sets, 105-109 kPa at 19.97 degrees C and 97-101 kPa at 23.4 \
degrees C, reduced to the molar refractivity 'from our measurements, plus known values of the \
virial coefficients B(T) [15] and B_R [10]' (the paper's [15] is Hurly and Moldover's \
helium calculation; for nitrogen this looks like a wrong reference); 'expanded (k = 2) \
uncertainty (0.0007 cm^3 mol^-1) arises primarily from the measurement of the \
pressure and temperature'. Nitrogen of 99.9993 % purity (Scott)."""

