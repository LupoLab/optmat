[[formulas]]
id = "eq5"
material = "He"
equation = "Eq. (5), p. 191"
printed = "alpha = 1.3831916 + 0.385530216 omega^2 + 0.12753895 omega^4 + 0.04573114 omega^6"
variable = "omega: photon energy in reduced Rydberg units, omega = 91.13919792/lambda with lambda the vacuum wavelength in nm (Eq. 7); alpha in reduced atomic units (4He)"
state = "none (per atom)"
density = "none"
range = "visible and near infrared (the series in omega^2 is for omega well below the first resonance; checked by the authors at 532-1064 nm)"
coefficients = { a0 = "1.3831916", a2 = "0.385530216", a4 = "0.12753895", a6 = "0.04573114" }
check = "With Eqs. (6) and (7) its four terms become 0.51725407, 1197.5410, 3.290677e6 and 9.800874e9, Eq. (8)'s coefficients to all printed digits. Checked 2026-09-24."
notes = "Static term from Lach, Jeziorski and Szalewicz (QED included); the dynamic terms from Bhatia and Drachman, Phys. Rev. A 58, 4470 (1998). Reduced units carry the (1 + m_e/m_alpha) factors of Eqs. (6)-(7)."

