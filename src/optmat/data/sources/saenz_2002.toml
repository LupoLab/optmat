[[formulas]]
id = "madk"
material = "H2"
equation = "Eqs. (1)-(2), p. 2"
printed = "Gamma^MADK = Z (2F)^(1/3) D^2 / (2 (n*)^2) {[Ai'(k)]^2 - k Ai^2(k)}, D = (4 e Z^3/(F (n*)^4))^(n*), k = (Z/n*)^2 (2F)^(-2/3), n* = Z/sqrt(2 I_p)"
variable = "F: static field (au); Z: the charge seen by the escaping electron; I_p: ionisation potential (au); Ai, Ai': the Airy function and its derivative; Gamma in au"
range = "not stated; meant to cover the barrier-suppression regime"
coefficients = {}
reproduced_from = ["V. P. Krainov, J. Opt. Soc. Am. B 14, 425 (1997)"]
check = "Not checkable: the MADK rates are in figures only (Figs. 3-5)."
notes = "Krainov's modified ADK [4]. 'Note the error in Eq. (15) in Ref. [4] where instead of the derivative of the Airy function the Airy function occurs twice' (p. 2): the form here is Saenz's correction of Krainov's printed formula. 'In Eq. (1) the original main quantum number n has been substituted by an effective value n* = Z/sqrt(2 I_p)' (p. 2)."
