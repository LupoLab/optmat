citation = "A. Saenz, \"Behavior of molecular hydrogen exposed to strong dc, ac, or low-frequency laser fields. II. Comparison of ab initio and Ammosov-Delone-Krainov rates\", Phys. Rev. A 66, 063408 (2002)"
doi = "10.1103/physreva.66.063408"
library = "Saenz_2002_BehaviorMolecularHydrogen"
identity = "VALIDATED"
kind = "theory"
technique = """Static (dc) field ionisation rates of H2 oriented parallel to the field \
from a three-dimensional, fully correlated ab initio method (paper I of the series): \
nonrelativistic Born-Oppenheimer, explicitly correlated basis in prolate spheroidal \
coordinates, energies and widths by complex scaling at each internuclear distance R; \
the rotationless nuclear Hamiltonian solved in a B-spline basis. Vibrational motion \
enters through limits: frozen nuclei (the R-dependent width averaged over the field-free \
vibrational wave function), fully adiabatic (vibrational states of the complex in-field \
potential curve), fixed nuclei (R = 1.40 a0). Compared with the ADK rate (Eq. (1) of \
Walsh et al. 1993, walsh_1993) and Krainov's modified ADK (MADK, Eqs. (1)-(2)) (pp. \
1-2)."""
notes = """The citation first requested was Phys. Rev. A 66, 063407; the paper and its \
DOI are Phys. Rev. A 66, 063408 (2002), part II of a series; part I, the 'preceding \
paper' that describes the method, is not in the reference list and not in the library. Pages are pdf pages (1-9 = \
063408-1 to -9).

WHAT IS TAKEN. Table I (p. 7), 'Ionization rates (in a.u.) of different vibrational \
states v of H2 exposed to an electric field', F = 0.05338, 0.06, 0.08, 0.10, 0.12 and \
0.18 au (0.05338 au is 1.0e14 W/cm^2), v = 0, 1, 2, 4, 9, 14; four rows per entry, \
one dataset per row type and v (24 datasets): (a) 'the result obtained in the \
frozen-nuclei limit using the ab initio ionization rates'; (b) 'the corresponding \
results obtained with the ADK model' (frozen-nuclei average of the ADK rate with the \
R-dependent ionisation potential I_P(R) = E_0,H2+(R) - E_0,H2(R), pp. 2-3, 6); (c) 'the \
fully adiabatic limit, using the complex ab initio energies'; (d) 'the ADK model with the \
corresponding R-independent ionization potential', 'the (field-free) energy difference \
between the corresponding vibrational state of H2 and the rovibrational ground-state \
energy of H2+' (p. 6). 'Values in brackets indicate the power of 10'. Blank (c) cells: \
no bound vibrational state in that limit ('No data point is given for F = 0.18 a.u. in \
the fully adiabatic limit, because for that field the adiabatic potential curve does not \
support any bound vibrational states anymore', p. 6). Image checked; no erratum, no \
structural fix beyond the spanned field cell.

ORIENTATION AND WHAT THE RATE COUNTS. The molecule is oriented parallel to the field \
(angle_deg = 0, p. 1); the paper argues for, but did not compute, a nearly isotropic \
rate (Sect. VII, pp. 7-8). The rate is the width of the two-electron state of the \
molecule (the whole molecule, both electrons), in au, rotationless (J = 0); rotational \
excitation would raise the frozen-nuclei rates (p. 8). The ADK rows use the one-electron \
ADK formula of Walsh et al. (walsh_1993 Eq. (1), the Ilkov-modified form, ilkov_1992 Eq. (7); l is not \
stated); no occupancy factor is mentioned. For review: majety_2015 Table 2's \
benchmark [18] (Saenz 2000, fixed nuclei at R = 1.4 a0; saenz_2000 prints it in no table, its rates being in figures only) is 3.36e-5 au at F = 0.06, \
against 5.248e-5 here for v = 0 frozen nuclei: the vibrational average raises the rate \
by 56 % at 0.06 au (the fixed-nuclei rates are in Fig. 4 only).

USE. (a) v = 0 is primary (the frozen-nuclei limit is the one for a laser whose field \
peaks quickly compared with nuclear motion: 'the with respect to ionization rates \
equivalent non-moving-nuclei limit is, e.g., valid in the case of a linearly polarized \
low-frequency laser field', p. 4); (c) and the excited states v > 0 are check; (b) and \
(d) are formula evaluations (use = check). ACCURACY: no number is stated. 'the ab \
initio calculation has problems to accurately predict the small ionization rates, due to \
the numerical difficulties discussed in the preceding paper. The small wiggles seen on \
the calculated curves give an indication of the numerical precision' (p. 3, about the \
R-dependent rates of Figs. 1-2). Uncertainty left unstated.

FORMULA. MADK, Eqs. (1)-(2) (p. 2), recorded below; the ADK rows use Walsh et al.'s \
formula (walsh_1993 record). Text values (not taken, not H2 in a molecular state): 'The \
ab initio ionization rate of a hydrogen atom at F = 0.08 a.u. is about 1.85 x 10^14 s^-1 \
(using the width given in Ref. [25])' (Scrinzi 2000), two H atoms 3.7e14 s^-1, H2 at \
large R about 3.5e14 s^-1, ADK about 6e14 s^-1 (p. 3). The tunnel-to-barrier-suppression \
field F_BSI = I_P^2/4 (p. 4): 0.0625 au for hydrogenic Ip, 0.0775 au for I_P(R = 1.80 \
a0) = 0.556 au (p. 3). 'Using the experimental ionization potential (15.4 eV) in the \
MADK calculation leads to much higher ionization rates' (p. 4); Figs. 1-5 (R-dependent \
rates at F = 0.06 and 0.08 au; He and H2 against F/F_BSI; fixed- against frozen-nuclei; \
fully adiabatic) are figures only. The one-centre expansion of the H2 ground state at \
equilibrium has 'more than 88%' l = 0 (p. 8)."""

