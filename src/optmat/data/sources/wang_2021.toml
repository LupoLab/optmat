citation = "K. Wang, X. Wang, Z. Fan, H.-Y. Zhao, L. Miao, G.-J. Yin, R. Moro and L. Ma, Eur. Phys. J. D 75, 46 (2021)"
doi = "10.1140/epjd/s10053-021-00054-2"
library = "Wang_2021_StaticDipolePolarizabilities"
identity = "VALIDATED"
kind = "theory"
technique = """Coupled-cluster CCSD(T) with a Hartree-Fock reference and the aug-PC-4 / PC-4 \
basis sets, finite-field static dipole polarizabilities of the atoms H-Ca and their \
ions; basis quality benchmarked on first ionisation potentials (Table 1)."""
notes = """Only He, Ne and Ar are curated species here (H is atomic hydrogen, not H2). \
Table 2 (p. 4 of 11) gives, per atom, the paper's HF and CCSD(T) values and other \
authors' calculations ('Calc.') and experiments ('Expt.') with footnoted references; \
the footnotes gg-jj are missing from the library's Markdown and were read on the page \
image. The paper's own CCSD(T) values are 'check' (He 1.3821 is 0.1 % below the \
accurate theory); the quoted values are reproduced, one dataset each. Uncertainties \
are as printed ('+-'), of unstated level.

Units: atomic units, but the quoted helium values appear to differ in convention: \
1.38319 (Yan et al. 1996; Pachucki and Sapirstein) matches the reduced-unit static \
value of stone_2004's Eq. (5), 1.3831916, and 1.38376 (Lach et al. 2004) matches it \
times stone_2004's Eq. (6) factor (1 + m_e/m_alpha)^3 = 1.000411, i.e. 1.383760, the \
value for physical 4He (checked 2026-09-24; TC-19). The 'Expt.' 1.383746 +- 0.000007 attributed to Newell and \
Baird (1965) and Grohmann and Luther (1992) has a precision (5e-6) implausible for \
those works and is close to modern theory; kept as printed, TC-19. The 'Expt.' neon \
value 2.663 is Dalgarno and Kingston (1960), a semi-empirical analysis (dalgarno_1960).

The other atoms are not curated and are not extracted.

ADDED 2026-09-26 (ionisation, TC-439/TC-440). Table 2's HF column (hf_*, 'check') and \
the numerical Hartree-Fock column NHF (nhf_*, reproduced from Stiehler and Hinze 1995, \
Ref. [64]) for He, Ne, Ar. Table 1 (p. 4): the first ionisation potentials (eV) of He, \
Ne, Ar at the CCSD(T)/aug-PC-4 level and the experimental values it compares (from \
Moore 1970, Ref. [63], reproduced). Table 3 (pp. 5-7, 'Comparison of calculated and \
experimental (Expt.) polarizabilities of free ions'; the library splits it into three \
tables, the continuation captioned 'Table 3 continued' and the last part unlabelled; \
all three images checked): the cations He+, Ne+ and Ar+ (now materials, TC-440), the \
paper's HF and CCSD(T) ('Ours.') values and the quoted CHF, Calc. and Expt. values; \
'The uncertainties in the last digits are given in parentheses' (caption). ECC (CCSD(T) \
- HF) is not extracted. Kr and Xe and their ions are beyond the paper's H-Ca.

SOLPROP'S SIX NUMBERS (checked 2026-09-26). solprop cites Wang et al. 2021 for the \
neutral polarizabilities He 1.3207, Ne 2.376, Ar 10.762 au and the cation \
polarizabilities He+ 0.2811, Ne+ 1.2417, Ar+ 6.807 au. All six are the HF column: \
Table 2's HF for the atoms (hf_He, hf_Ne, hf_Ar), and Table 3's HF row for the ions \
(hf_He+, hf_Ne+, hf_Ar+). The paper's own correlated (CCSD(T)) values are He 1.3821, Ne \
2.662, Ar 11.084 and He+ 0.2811, Ne+ 1.3110, Ar+ 6.834; the HF values are 4.4 % (He), \
10.7 % (Ne) and 2.9 % (Ar) below them for the atoms, 0, 5.3 % and 0.4 % for the ions. \
For He+, a one-electron ion, HF is exact within the basis (ECC 0.0000), and the quoted \
Tang et al. (2012) value is 0.28119.

Numbers are broken by spaces in the first Table 3 part's cells ('0. 281 1'); the image \
prints 0.2811 (structural fix in the script). The Ar+ Calc. footnote reads 'ijj' in \
the cells file and 'jjj' (Ref. [96], Medved et al.) on the page. Table 1's cells file \
has lost the header rows of its second and third blocks into the experimental cells \
above them ('24.587F'); the script reads the atoms from those suffixes."""

