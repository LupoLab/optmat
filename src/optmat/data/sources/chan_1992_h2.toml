[[formulas]]
id = "transition_moment_lyman"
material = "H2"
equation = "Eq. (6), p. 11"
printed = "|R_e(r_v'0)| = 0.142 + 1.117 r_v'0"
variable = "r_v'0: the r centroid of the v'' = 0 -> v' transition in angstrom; |R_e| in atomic units (Fig. 5's axes)"
state = "none (per molecule)"
density = "none"
range = "0.63-0.96 A (the fitted Lyman data, v' = 0-22)"
coefficients = { a = "0.142", b = "1.117" }
check = "With r_0 = 0.741 A and Eq. (8), D_e(r_0) = G |R_e(r_0)|^2 with G = 1 gives 0.9403, the Table 4 present value 0.94 (checked 2026-09-27; two digits)."
notes = "A least-squares straight line through the present |R_e(r_v'0)| of the Lyman band (Fig. 5), derived from Table 1 with Allison and Dalgarno's Franck-Condon factors and r centroids digitised from Allison's curves (p. 11). Not a dispersion formula: recorded for the dipole strength."

