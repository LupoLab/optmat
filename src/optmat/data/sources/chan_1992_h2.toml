citation = "W. F. Chan, G. Cooper and C. E. Brion, \"Absolute optical oscillator strengths (11-20 eV) and transition moments for the photoabsorption of molecular hydrogen in the Lyman and Werner bands\", Chem. Phys. 168, 375 (1992)"
doi = "10.1016/0301-0104(92)87171-5"
library = "Chan_1992_AbsoluteOpticalOscillator_095875"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """High-resolution dipole (e,e) spectroscopy: electron energy-loss spectra at 3 keV \
impact energy and zero mean scattering angle, 0.048 eV FWHM, 11-20 eV energy loss, \
multiplied by the spectrometer's Bethe-Born factor to give a relative optical \
oscillator-strength spectrum, normalised at 18 eV (smooth ionisation continuum) to the \
low-resolution dipole (e,e) absolute df/dE of Backx et al. (J. Phys. B \
9, 315 (1976)), whose scale rests on the TRK sum rule S(0) = 2: 'completely \
independent of any direct optical measurement' and of photon flux or density (p. 4). \
Band oscillator strengths from fits of asymmetric (rotationally broadened) peak \
profiles convolved with the resolution (Fig. 2). Energy scale calibrated on helium's \
1 1S -> 2 1P line (21.218 eV) admitted with the sample. Linde H2, 99.95 %; 2e-5 Torr \
(p. 4)."""
notes = """Values per molecule; no density or state involved. Room-temperature normal H2 \
(not stated); the band strengths are from v'' = 0 and sum the rotational structure.

Tables 1 and 2 (pp. 7-8): oscillator strengths f(v'' = 0 -> v') of the Lyman (B \
1Sigma_u+, v' = 0-22) and Werner (C 1Pi_u, v' = 0-6) bands. No transition energies are \
tabulated (the positions of Figs. 1-2 are Dieke's (1958) and Namioka's (1964)): the \
rows and label abscissa are v'. Uncertainty (p. 6): '+-5% for fully resolved peaks, \
and +-7-15% for the partially resolved peaks because of the additional errors in the \
deconvolution procedures'; which peaks are partially resolved is not said. The Lyman \
v' = 14 and 20 values are interpolated (note a; overlapping bands), and the Werner v' \
= 3 value has the underlying Lyman v' = 14 component (itself interpolated) subtracted \
(note a; p. 6). Each table's literature columns are reproduced datasets.

Sums (checked 2026-09-27): the present Lyman column sums to 0.30117 (text and Table 3: \
0.301); the present Werner column to 0.3218 (text: 0.322), plus Allison and \
Dalgarno's calculated v' = 7-13, 0.019, gives the Table 3 total 0.341 (p. 9): the \
Werner total is therefore not wholly measured. Allison and Dalgarno's Table 1 column \
sums to 0.3016 (their Table 3 total over all v' is 0.311), and their Table 2 column to \
0.3287 (+0.019 = 0.348; their total 0.356).

Text values (p. 8-9), inline datasets: the B' 1Sigma_u+ v' = 0 band at 13.702 eV, f = \
0.00384 (present), against Glass-Maujean's calculated transition probability 0.238e8 \
s^-1, 'corresponds to an absolute oscillator strength of 0.00292' (Chan et al.'s \
conversion); and the total oscillator strength below the first ionisation potential \
(15.43 eV), 0.836 (p. 9). Arrighini et al.'s TDA and RPA state sums below the IP, \
0.926 and 0.862, were added up by Chan et al. (p. 9) and are not extracted.

Transition moments (Section 3.2): |R_e(r_v'0)| derived from the present f with \
Allison and Dalgarno's Franck-Condon factors, Dieke and Namioka's energies and r \
centroids digitised from Allison's curves (p. 11): figures only (Figs. 5-6), and two \
straight-line fits, Eqs. (6) and (7) (formulas). Table 4, the dipole strengths \
D_e(r_0) = G |R_e(r_0)|^2 (au) at r_0 = 0.741 A (present 0.94 Lyman, 1.08 Werner; \
Wolniewicz 0.96, 1.10; Rothenberg and Davidson length 0.91, 1.06, velocity 0.92, 1.18; \
Miller and Krauss 1.00, 1.08; Peek and Lassettre 0.97, 0.81; Browne length 0.78, \
velocity 1.04; Ehrenson and Phillipson 0.85; Shull (printed 'Skull') 0.60, 1.33; \
Mulliken and Rieke (printed 'Milliken') 0.77, 1.21; Fabian and Lewis 0.96, 0.92; \
Geiger and Schmoranzer 0.98, 0.89; Geiger and Topschowsky 0.95, 0.92; Geiger 0.84, \
1.03), has no quantity in the vocabulary: not extracted. No continuum df/dE is \
tabulated (Fig. 1 only, 11-20 eV) and no S(k) is given.

The library's identity check flags PDF date hints (2001, 2002) against 1992: the \
download stamp, not the paper (the first page and citation are 1992)."""

