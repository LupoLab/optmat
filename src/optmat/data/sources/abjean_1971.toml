[[errata]]
dataset = "fit_Kr"
row = "1807"
column = "value"
printed = "507.7"
corrected = "570.7"
reason = "Transposed digits: the row's own difference column prints meas. - calc. = 0.0 with meas. = 570.7, and the krypton formula gives 570.74 at 1807 A (570.68 at 1807.3 A)."
evidence = "Table image tbl_00feebf8a634.jpg shows 507.7 in the calc. column and 0.0 in the difference column; formula evaluated 2026-09-25."

# The formulas (p. 46), lambda in um. Their numerators are 100 times the oscillator
# strengths (the text gives 0.187 and 0.193 for krypton's two resonance lines, printed
# 18.7 and 19.3), so the printed prefactor 1.2055 x 10^-6 is 100 times too small: the
# prefactor that goes with f itself is 1.2055 x 10^-2 (bideau_mehu_1981).

[[formulas]]
id = "sellmeier_Xe"
material = "Xe"
equation = "unnumbered, p. 46"
printed = "n - 1 = 1.2055 x 10^-6 (-25.60/(46.301 - lambda^-2) + 23.80/(59.578 - lambda^-2) + 522.3468/(112.74023 - lambda^-2))"
variable = "lambda: vacuum wavelength in um"
form = "dn_sigma2"
terms = { scale = "1.2055e-6", B = ["-25.60", "23.80", "522.3468"], C = ["46.301", "59.578", "112.74023"] }
state = "1atm_0C"
density = "unknown"
range_nm = [180.7, 253.7]
check = "With both corrections, reproduces Table 1's calc. column to 0.4e-6 at the rounded line labels (813.26, 856.82, 895.16, 973.04, 1029.80, 1062.81 against 813.2, 856.7, 895.1, 972.9, 1029.4, 1062.5; closer at the lines' vacuum wavelengths, see the source notes) and Table 3's 'present work' column to 0.05e-6 at all eight round wavelengths. Checked 2026-09-25."
notes = "The first two terms carry Anderson's oscillator strengths of the 1469 A and 1295 A resonance lines, as adopted by Chashchina and Shreider (p. 46); the third is fitted to the paper's own data. The range is the measured one."
[[formulas.corrections]]
term = "scale"
index = 0
printed = "1.2055e-6"
corrected = "1.2055e-4"
reason = "The numerators are 100 f (krypton's are the text's f = 0.187, 0.193 times 100), so the prefactor of the Bideau-Mehu form, 1.2055e-2 per unit f, becomes 1.2055e-4; as printed the formula gives n - 1 = 8.1e-6, a hundred times the measured values."
evidence = "With 1.2055e-4 (and B1 = +25.60) the formula gives 813.26e-6 at 2537 A against Table 1's calc. 813.2 and all eight of Table 3's 'present work' cells to 0.05e-6 (818.59 ... 1068.91 against 818.6 ... 1068.9). Checked 2026-09-25."
[[formulas.corrections]]
term = "B"
index = 0
printed = "-25.60"
corrected = "25.60"
reason = "The equation image (equations/eq_af918dee2bd1.jpg) shows a dash before the first fraction, which the library reads as a minus sign; a negative strength of the 146.9 nm resonance line is unphysical, and with it the formula gives 613e-6 at 2537 A against 813.2 in Table 1."
evidence = "With +25.60 the formula reproduces Tables 1 and 3 (see check); with -25.60 it is 200e-6 low everywhere. Checked 2026-09-25."

[[formulas]]
id = "sellmeier_Kr"
material = "Kr"
equation = "unnumbered, p. 46"
printed = "n - 1 = 1.2055 x 10^-6 (18.7/(65.474 - lambda^-2) + 19.3/(73.645 - lambda^-2) + 500.0255/(163.9919 - lambda^-2))"
variable = "lambda: vacuum wavelength in um"
form = "dn_sigma2"
terms = { scale = "1.2055e-6", B = ["18.7", "19.3", "500.0255"], C = ["65.474", "73.645", "163.9919"] }
state = "1atm_0C"
density = "unknown"
range_nm = [180.7, 253.7]
check = "With the prefactor corrected, reproduces Table 2's calc. column to 0.1e-6 (491.22, 507.30, 520.70, 545.69, 562.00, 570.74 against 491.2, 507.2, 520.6, 545.6, 561.9, 570.7 after the 1807 A erratum) and Table 4's 'present work' column to 0.05e-6. Checked 2026-09-25."
notes = "FITTED TO THE WITHDRAWN KRYPTON DATA (bideau_mehu_1976): about 4 % high; kept for the record, not for use. The first two terms carry Griffin and Hutcherson's oscillator strengths, 0.187 and 0.193, of the 1236 A and 1165 A resonance lines (p. 46)."
[[formulas.corrections]]
term = "scale"
index = 0
printed = "1.2055e-6"
corrected = "1.2055e-4"
reason = "The numerators are 100 f (the text's f = 0.187 and 0.193 are printed 18.7 and 19.3), so the prefactor is 1.2055e-4, not 1.2055e-6; as printed the formula gives 4.9e-6, a hundredth of the tabulated values."
evidence = "With 1.2055e-4 the formula gives 491.22e-6 at 2537 A against Table 2's calc. 491.2, and all of Table 4's 'present work' cells to 0.05e-6. Checked 2026-09-25."
