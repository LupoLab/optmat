citation = "R. Abjean, A. Mehu and A. Johannin-Gilles, \"Interferometric determination of xenon and krypton refractive indices in the ultraviolet region\", Opt. Commun. 3, 45 (1971)"
doi = "10.1016/0030-4018(71)90211-2"
library = "Abjean_1971_InterferometricDeterminationXenon"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Fabry-Perot interferometry at the lines 2537 A (Hg I), 2288 A (Cd I), \
2139 A (Zn I), 1942 A (Hg II), 1849 A (Hg I) and 1807 A (S I), 'according to an \
experimental technique previously used for nitrogen, argon, helium and neon' (p. 45, \
refs. 5, 6: the Comptes Rendus papers of 1970, not in the library). Air Liquide \
krypton N 35 and xenon N 35 (impurities stated p. 45); each value the average of about \
twenty measurements."""
notes = """State (p. 45): 'The index n is given at the standard conditions (0 degrees and \
760 mm)'; how the reduction was made is not stated (density unknown). The same \
laboratory's later papers reduce with van der Waals relations (bideau_mehu_1976, \
bideau_mehu_1981).

Uncertainty (p. 45): 'The experimental error essentially originates in the appreciation \
of the fractional part of the fringes, the other errors being unimportant compared to \
the latter (< 1/20). Each of the values given is the average of about twenty \
measurements. The statistical standard deviation for krypton is about 3 x 10^-6 for \
the wavelength 1807 A and 1.5 x 10^-6 for 2537 A. Likewise, for xenon it varies by \
about 2 to 6 x 10^-6 for the various wavelengths.' The datasets take the largest stated \
value as one standard deviation for every row (whether it is the scatter of single \
measurements or of the mean is not said).

Wavelengths: the rows are the lines' labels to 1 A; the paper does not say whether \
they are vacuum or air wavelengths. The calculated columns of Tables 1 and 2 are \
reproduced best at the lines' vacuum wavelengths (the formulas at the rounded labels \
give 856.82 and 1029.80 against the printed 856.7 and 1029.4 at 2288 and 1849 A; at \
2288.7 and 1849.5 A, vacuum wavelengths of the Cd I and Hg I lines quoted from \
memory, not from a library source, they give 856.7 and 1029.4): vacuum. The \
difference is below 0.4e-6, a tenth of the stated scatter.

KRYPTON WITHDRAWN: the krypton values are about 4 % above every other measurement and \
calculation (Table 4, p. 46; the paper attributes the difference to gas purity, p. 47). The \
authors withdrew them in bideau_mehu_1976 (p. 3: 'we may conclude that our previous \
values were incorrect'; a xenon contamination of 4.3 % would explain them) and \
replaced them by new measurements. Every krypton dataset of this paper is excluded.

Tables 3 and 4 compare the paper's formula values at round wavelengths with Kronjager \
(ref. 1, Z. Physik 98, 17 (1935)), Koch (ref. 2, Kgl. Fysiograf. Sallskap. Lund. Forh. \
19, 15 (1949)), Chashchina and Shreider (ref. 3, Opt. Spectry 27, 161 (1969)), \
Kingston (ref. 9, kingston_1964) and Langhoff and Karplus (ref. 10, langhoff_1969). \
Only the cells marked 'a) Experimental values' of refs. 1-3 are extracted; the others \
are extrapolations of those authors' formulas. The Kingston columns agree with \
kingston_1964's Tables (xenon 872.4 ... 1059.5, krypton 495.4 ... 551.4); the \
Langhoff-Karplus krypton column agrees with langhoff_1969 (492.4 ... 547.2), but its \
xenon column (868.3 ... 1021.7) does not: langhoff_1969's Table III gives 879.5 at \
2200 A and 1105.8 at 1800 A (TC-166).

Reproductions elsewhere: bideau_mehu_1981's experiment_Xe rows 253.7-180.7 nm are \
Table 1's measured column (812.7 ... 1063.0) under nm labels; tang_1974's \
abjean_1971_Xe (Table VI, 2200-1800 A) is Table 3's formula column; \
bideau_mehu_1976's 'Abjean et al. (old values)' krypton column."""

