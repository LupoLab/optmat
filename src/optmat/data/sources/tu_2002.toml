citation = "S. J. Tu and J. B. Nee, \"Absorption spectrum of ozone in the 105-200 nm wavelength region\", Surf. Rev. Lett. 9, 125 (2002)"
doi = "10.1142/s0218625x02002099"
library = "TU_2002_ABSORPTIONSPECTRUMOZONE"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Photoabsorption with synchrotron radiation (SRRC, Hsinchu) dispersed by a 1 m \
Seya monochromator, resolution 0.08 nm, through a stainless-steel absorption tube \
(Lee and Nee 2000). O3 from an O2 discharge trapped on silica gel and pumped at \
methanol-slush temperature to remove O2; 'a small amount of oxygen was always present \
and affected the absorption measurement. The absorption due to O2 was later removed by \
comparing with the previous data' (pp. 125-126). 105-200 nm (Fig. 1 shows 4-11.7 eV, \
105-300 nm)."""
notes = """Journal pages 125-128 = PDF pages 1-4. Vacuum wavelengths (105-200 nm, a \
vacuum monochromator). Temperature not stated. 'The accuracy of the cross section was \
estimated to be about +-15 %' (p. 126).

The cross sections are in figures only (Fig. 1, 4-11.7 eV; Fig. 2, 140-105 nm), not \
digitised. The text gives four approximate values, recorded as inline points of the \
dataset text_values ('about' as printed: a check). The paper's subject is the Rydberg \
assignment of the 105-140 nm bands.

Table 1 (p. 126, tbl_db6630bdbb1a, image checked; not extracted, no quantity): the \
Rydberg transitions 6a1 -> 3s, 4s, 5s, 3p, 4p and 4b2 -> 3s, 4s, 3p with quantum \
defects, band wavelengths (137.2, 112.4, 106.1, 123.8, 109.4, 130.3, 108, 117 nm) and \
symmetries, against Mason et al. (1996, mason_1996), Thunemann et al. (1978) and Padial \
et al. (1981). The Padial column prints '11.5' nm for 6a1 -> 3p (the image confirms \
it): not a wavelength in the region (the column's other values are 107.8-138 nm), \
presumably a misprint (121.5, 111.5 and 115.1 are all possible; 121.5 is already the \
4s entry): not corrected. The text calls the quantum defects 'Table 2' (p. 127); there \
is no Table 2. Quantum defects are computed with ionisation energies 12.52 eV (IE1) and \
13.03 eV (IE2); the introduction quotes the adiabatic ionisation energy 12.52 eV and \
vertical energies 12.75, 13.03, 13.57 eV from the photoelectron literature (refs. \
3, 6-11; not extracted, reproductions). Vibrational spacings: about 650 cm^-1 (137-130 \
nm, six peaks; the individual spacings 660, 382, 427, 826 cm^-1), about 630 cm^-1 \
(127-117 nm), about 600 cm^-1 (112-105 nm; the abstract says 622 cm^-1). The \
reference list prints ref. 18 as 'P. Jeffrey and T. H. Dunning, Jr., J. Chem. Phys. \
67, 2290 (1977)', the same journal reference as ref. 14 (Hay and Dunning)."""

[[datasets]]
id = "text_values"
material = "O3"
table = "text"
points = [["176.2", "176.2", "1"], ["137-130", "not stated", "15"], ["121.1", "121.1", "30"], ["121.6", "121.6", "20"]]
quantity = "absorption_cross_section"
unit = "Mb"
abscissa_unit = "nm"
use = "check"
notes = "Approximate text values, as printed: 'The first continuum lies at 6.2-7.5 eV, with a maximum cross section of about 1 Mb at 176.2 nm' (p. 126); 'The absorption cross sections are high in 137-130 nm, with a maximum value of about 15 Mb' (p. 126; no wavelength stated for the maximum, so the row's wavelength is 'not stated' and its id the range); 'a strong structured continuum with a peak cross section reaching 30 Mb (at 121.1 nm)' (p. 127, the 127-117 nm band); 'Such a process may be important at 121.6 nm. Based on our absorption spectrum, a cross section of 20 Mb is found here' (p. 127). Peak values read from the authors' own spectrum at 0.08 nm resolution, with the O2 absorption subtracted; +-15 % (p. 126). Temperature not stated."
[datasets.uncertainty]
relative = 0.15
level = "not stated"
