notes = "Table 1 (both parts), 'Relative dn/dt in Nitrogen (1013.25 hPa), (x 10^-6/C)', Measured, with the Uncertainty column as sigma (level not stated): 69 vacuum wavelengths. From the indices near 20 and 25 C by Eq. (2); temperature_k is the midpoint, 22.5 C. RELATIVE to nitrogen at 1013.25 hPa and the prism temperature: the absolute dn/dT is about 1.3e-6/K lower (see the source notes). Negative above 173 nm, positive below."
