citation = "T. N. Olney, N. M. Cann, G. Cooper and C. E. Brion, \"Absolute scale determination for photoabsorption spectra and the calculation of molecular properties using dipole sum-rules\", Chem. Phys. 223, 59 (1997)"  # codespell:ignore cann
doi = "10.1016/s0301-0104(97)00145-6"
library = "Olney_1997_AbsoluteScaleDetermination"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Dipole sums of the group's published absolute photoabsorption spectra from \
dipole (e,e) spectroscopy (fast-electron energy-loss spectra at zero angle converted \
with the spectrometer's Bethe-Born factor): high resolution (3 keV, 0.05 eV FWHM) in \
the valence discrete and near-edge region matched at 15-25 eV to low resolution (8 keV, \
about 1 eV FWHM) in the continuum, usually to about 200 eV (H2, HD, D2: high resolution \
to 60 eV). The original absolute scales came from the valence-shell TRK sum rule \
(VTRK, Eq. (4), with Pauli-excluded corrections), or for H2, Ar, Kr and Xe from \
single-point normalisation to optical photoabsorption (pp. 64-66). For Table 3 each \
spectrum was renormalised to a static or dynamic polarizability (refractive-index or \
dielectric data, mostly Hohm's), then S(u) = integral (E/E_H)^u df/dE dE (Eq. (1)) and \
L(u) (Eq. (2)) were evaluated (Section 3.3, p. 78)."""
notes = """Journal pages 59-98 = PDF pages 1-40 (page n of the PDF is p. 58 + n); pages \
below are journal pages. Values per atom or molecule, atomic units; no density or state.

Curated species present: He, Ne, Ar, Kr, Xe, H2, D2, N2, O2, CO, CO2, N2O, CH4 (no SF6, \
no O3). The other 44 species (HD, NO, NO2, H2O, H2S, SO2, the alkanes C2-C8, CH3OH, \
HCHO, CH3CHO, (CH3)2CO, the hydrogen halides, Cl2, Br2, I2, the methyl halides, CF4 and \
the Freons, CCl4, BrCN, NH3 and the methylamines, SiH4, SiF4, PH3, PF3, PF5, PCl3) are \
not transcribed.

THE REFINEMENT (Table 3 note a, p. 82; Section 3.3, p. 78). 'The original dipole (e,e) \
oscillator strength scales ... have been refined by renormalizing ... to dynamic \
(alpha_lambda) or static (alpha_infinity) dipole polarizabilities [95,100,101,133,79,78,\
67,102,81,103,96,97,123]. The alpha_lambda or alpha_infinity values used for this \
renormalization correspond to the static polarizability given by the first entry for \
each atom or molecule in this column' (S(-2)); 'in almost all cases this refinement \
changes the oscillator strength (df/dE) scale by <= 3 %' (p. 78). Hence each Table 3 \
'Expt' S(-2) is a reproduction of the polarizability it was renormalised to (the \
s-2_<gas> datasets: He, Ne, N2 hohm_1990 [79]; Ar, Kr, O2, CO2, N2O hohm_1994b [81]; \
Xe Hohm and Trumper 1994 [102]; H2 hohm_1994 [103]; D2 Newell and Baird [123] as \
printed, see s-2_D2; CO watson_1936 [100]; CH4 hohm_1993 [67]), and the other sums of \
the row share that scale (the moments_<gas> datasets, use = check): S(-4), S(-6), ... \
test the shape of the (e,e) spectrum, not an independent absolute scale. Which gases \
were renormalised to a dynamic and which to a static value is not said per gas. To \
recover the sums of the unrefined spectra, scale by Table 1 column 2 over Table 3's \
S(-2) (p. 82): e.g. 1.383/1.407 = 0.982 for helium (p. 78).

ACCURACY (quoted). The (e,e) spectra are 'estimated to have an overall accuracy of \
better than +-5 %' (p. 64) and 'within +-5 %' (p. 65); polarizabilities are 'typically \
+-1-2 %' (p. 78). 'The S(u) sum-rule moments for u <= -2 can all be effectively summed \
up from spectra that are recorded from the excitation threshold up to 50 eV' (He and Ne \
need 200 eV); 'the accuracy of S(-1) and L(-1) dipole sums is expected to be lower than \
for u <= -2' and they are 'generally slightly lower than the previously reported values \
from DOSD or theoretical studies' because the DOSDs include inner-shell contributions \
the (e,e) data omit (pp. 82-83). The sums 'agree, in almost all cases, with the DOSD \
derived moments reported by Meath and co-workers to better than +-5 % for the moments \
u = -1 to -10' (p. 87); the helium sums are within 2 % of Thakkar's (p. 83). No \
uncertainty is printed for any sum, so none is stored.

Table 1 (pp. 70-73), column 2 'From dipole (e,e) This work': S(-2) of the published \
spectra before the refinement (the table1_<gas> datasets, check). They are 'within 3.5 %' \
of the other experimental values for the noble gases and H2 (p. 67) and 'up to 3 % lower \
than the literature values in all but five cases (He, Ar, H2O, N2O, C2H2) where they \
are up to 3 % higher' (p. 69), the low values attributed to the polynomial \
extrapolation of the VTRK normalisation, Eq. (8). CO: the published spectrum (Ref. \
[8]) had its low-resolution energy scale 0.25 eV too high; corrected, S(-2) = 13.18 \
(note aa) instead of 12.64, and the published df/dE of Ref. [8] 'should be decreased \
by 2.5 %' (p. 69). The other columns of Table 1 (refractive index, dielectric \
constant, DOSD, theory, additivity) reprint other authors' values, mostly through the \
compilations of Stuart, Maryott and Buckley, Teachout and Pack, and Watson and \
Ramaswamy: not extracted.

FINDINGS. (1) CH4: the Thomas and Meath [50] DOSD row prints S(-6) = 289.3, where Hohm \
1993 (Table 2) and Spackman 1991 (Table I) both print Thomas and Meath's S(-6) as \
298.3. Thomas and Meath (thomas_1977, curated since) print 2.983(2) = 298.3 (p. 121): \
289.3 is Olney et al.'s transposition (not corrected here: an erratum is a decision \
for review). Olney et al.'s own CH4 S(-6) is 295.0. (2) D2's S(-2) is attributed to \
Newell and Baird [123], who measured no D2 (s-2_D2). (3) The comparison rows \
reproduce, digit for digit, the curated kumar_1985 (Ne, Ar, Kr, Xe), zeiss_1977 (H2, \
N2, O2, N2O), langhoff_1969 (H2, N2, O2) and Hohm 1993 (CH4) values, and (checked \
2026-09-27) kumar_1994 (CO), jhanwar_1982 (CO2) and thomas_1977 (CH4, except S(-6), \
finding (1)). (4) Table 1's S(-2) of the published spectra, recomputed here from the \
low-resolution tables of the curated originals (trapezoid plus the published \
high-energy tails, 2026-09-27): CO 12.66 (table1_CO_published 12.64), N2 11.65 \
(11.54), CO2 16.88 (16.92), but N2O 19.32 (20.23, 4.7 % higher) and CH4 17.06 (16.52, \
3.2 % lower); Olney et al. may have used the high-resolution spectra below 20 eV or a \
different tail; the N2O and CH4 differences are not explained.

Not extracted: Table 3 parts 3 and 4 (tbl_ca4fabc433cb, tbl_569d65b53314: no curated \
species); the unlabelled Table 2 (p. 74, static polarizabilities of HBr, HI, Cl2, Br2, \
I2, CH3Br, CH3I used for S(-2) normalisation); Table 4 (L(u), u = -1 ... -6, pp. 84-86: \
no quantity); Table 5 (C6(A,A) and C6(A,B) against DOSD, refractivity and theory, pp. \
88-91; its caption is detached in the extraction, the page-88 part is 'unlabelled') and \
Table 6 (C6(A,B) pairs where Eq. (15) differs by more than 0.75 %, p. 93): dispersion \
coefficients, no quantity; their accuracy is 'better than +-10 %' (p. 94). The normal \
Verdet constant, Eqs. (10)-(11) (p. 92), is V_N = (N_A a0^3) 2 epsilon^2 (S(-4) + 2 \
epsilon^2 S(-6) + 3 epsilon^4 S(-8) + ...), in notes only. The df/dE spectra \
themselves (Chan et al. 1992-1994, Au et al. 1993, and the authors' then unpublished H2 \
and D2 spectra) are not in this paper; curated: chan_1991 (He), chan_1992_neon, \
chan_1992 (Ar, Kr, Xe), chan_1993_n2 (N2), chan_1993_o2 (O2, high resolution only; the \
low-resolution O2 spectrum is Brion et al. 1979, reprinted in brion_1984), chan_1993_co \
(CO), chan_1993_co2 (CO2), chan_1994 (N2O), au_1993 (CH4); chan_1992_h2 is the H2 \
Lyman and Werner bands only."""

[[datasets]]
id = "moments_He"
material = "He"
file = "He/olney_1997__moments_He.csv"
table = "tbl_e403ff88c1f4"
quantity = "cauchy_moment"
unit = "au"
abscissa = "order"
abscissa_unit = "1"
use = "check"
notes = "Table 3 'Expt' row: S(u), u = -1, -3, -4, -5, -6, -8, -10, of the refined dipole (e,e) spectrum (Ref. [5], Chan et al. 1991 = chan_1991), after renormalising its scale to the polarizability of the s-2_He dataset (hohm_1990): the scale of these sums is not independent of it; their shape is the (e,e) spectrum's, originally estimated accurate to 5 % (pp. 64-65). S(-1) is less accurate (high-energy tail, p. 82). No uncertainty printed."

