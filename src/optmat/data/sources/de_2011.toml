citation = "S. De, M. Magrakvelidze, I. A. Bocharova, D. Ray, W. Cao, I. Znakovskaya, H. Li, Z. Wang, G. Laurent, U. Thumm, M. F. Kling, I. V. Litvinyuk, I. Ben-Itzhak and C. L. Cocke, \"Following dynamic nuclear wave packets in N2, O2, and CO with few-cycle infrared pulses\", Phys. Rev. A 84, 043410 (2011)"
doi = "10.1103/PhysRevA.84.043410"
library = "De_2011_FollowingDynamicNuclear"
identity = "VALIDATED"
kind = "measurement"
technique = """Pump-probe velocity-map imaging of fragment ions (p. 1): two 'nominally \
8-fs' pulses of 800 nm 'at intensities between 1 and 3 x 10^14 W/cm^2', delays up to \
2000 fs; the charge-to-mass ratio selected by time-of-flight gating, the momentum \
image inverted (Abel); polarisation along the detector plane's y axis (linear). One \
fragment is detected, the partner's charge inferred from the momentum. KER against \
delay, and power spectra (Fourier transforms over delay) against KER and beat \
frequency. A two-state (a 4Pi_u / f 4Pi_g) nuclear TDSE for O2+ with GAMESS curves and \
dipoles, for a 15 fs, 3 x 10^14 W/cm^2 probe (section IV)."""
notes = """Journal article 043410 = pdf pages 1-13. Identity checked against pdf p. 1 \
(received 30 May 2011; published 10 October 2011). Curated 2026-10-09 (TC-962).

TAKEN: Table II's O2+ a 4Pi_u block (calculated KERs), and the asymptotic KER of the \
dissociating O2+ in the Coulomb model of Fig. 2 (text).

TABLE II (p. 6): 'Calculated oscillation frequencies and KER values for selected \
states in the cation and dication of O2 and CO ... For the cation states, the KER \
values are calculated on the assumption of single-photon absorption'; for O2+ a 4Pi_u \
v = 0-15 from the potential of Marian et al. 1982 (ref. 38; not in the library), the \
KER of O+ + O after one 800 nm photon promotes the level to f 4Pi_g (the bond-softening \
crossing, near v = 11; Fig. 6). Rows v = 0-10 print negative KERs (the level plus one \
photon lies below the O+ + O limit): kept in the file and excluded from the dataset. \
The CO+ B 2Sigma+ (v = 6-12, ref. 30) and CO++ X 3Pi and 1Pi (v = 0-6, 'fitting the \
energies given by Lundqvist et al. [31]') blocks are not taken: CO+ and CO++ are not \
registered materials. The nu_n column (THz) has no quantity.

TABLE I (p. 5) lists omega_0 (eV), the anharmonicity x, nu_0, T_osc and T_revival for \
N2+ X and A, N2++ X, a and A, O2+ a and A, CO+ X, A and B and CO++ states, from \
Langhoff et al. 1987 (N2+), Dawber et al. 1994 (N2++), Huber and Herzberg 1979 (O2+), \
Wannberg et al. 1988 (CO+) and Lundqvist et al. 1995 (CO++): reproduced spectroscopic \
constants for which optmat has no quantity (vibrational_term_value holds G(v), not \
omega_e and x); not taken.

TEXT VALUES (p. 3, Fig. 2). In the Coulomb model of the KER-delay stripes, 'the only \
adjustable parameter in the calculation is the asymptotic KER of the parent ion': for \
O2, '(1) dissociating states of the cation to O+/O with an asymptotic KER of 1 eV' \
(taken, use check) and '(3) dissociating states of the dication to O+/O+ with an \
asymptotic KER of 7.5 eV [14]'; for N2, the dication to N+/N+ 'with a KER of 7.5 eV \
[14]'. The two 7.5 eV values cite Voss et al., J. Phys. B 37, 4239 (2004), not in the \
library: not taken (data rule 6). Nitrogen (p. 4): the N2++ fragment's 20 (+-1) eV band \
oscillates with a period near 18 fs and revives near 1200 fs, assigned to N2+ A 2Pi_u \
(expected revival 1100 fs; Table I); the X 2Sigma_g+ wave packet does not oscillate. \
Oxygen (p. 5): low-KER O+ (below 2 eV) with an energy spacing of about 0.12 eV and \
period about 34 fs, assigned to a 4Pi_u by one- (or two-) photon promotion to f 4Pi_g. \
The 8 fs pulses may carry 'a pedestal of a few percent ... which could easily extend \
to 30 fs or more' (p. 10). No KER of a channel is printed for N2.

FIGURES (not digitised; raster images): the KER-delay maps and power spectra (Figs. \
2, 4, 5, 7, 10, 12, 13) are density plots, not curves; Fig. 5(b), the low-KER O+ \
spectrum with the a 4Pi_u combs, is the only one-dimensional measured curve for \
O2."""

[[datasets]]
id = "ker_a4Piu_O2+"
material = "O2+"
file = "O2+/de_2011__ker_a4Piu_O2+.csv"
table = "tbl_a5247d8a13ea"
quantity = "kinetic_energy_release"
unit = "eV"
abscissa = "label"
use = "check"
excluded_rows = { "0" = "negative KER: one photon does not reach the O+ + O limit", "1" = "negative KER: one photon does not reach the O+ + O limit", "2" = "negative KER: one photon does not reach the O+ + O limit", "3" = "negative KER: one photon does not reach the O+ + O limit", "4" = "negative KER: one photon does not reach the O+ + O limit", "5" = "negative KER: one photon does not reach the O+ + O limit", "6" = "negative KER: one photon does not reach the O+ + O limit", "7" = "negative KER: one photon does not reach the O+ + O limit", "8" = "negative KER: one photon does not reach the O+ + O limit", "9" = "negative KER: one photon does not reach the O+ + O limit", "10" = "negative KER: one photon does not reach the O+ + O limit" }
notes = "Table II (p. 6): the KER of O+ + O when the vibrational level v (the row) of O2+ a 4Pi_u absorbs one 800 nm photon (1.55 eV) and dissociates through f 4Pi_g, 'deduced simply from energy conservation' (p. 6) with the levels of Marian et al. (ref. 38). Calculated, not measured: the authors find the measured low-KER O+ structure follows these loci in slope and spacing, but the predicted frequencies are lower than the observed ones (pp. 6-7; their TDSE of section IV is about 25 % low too, p. 11). The extraction checks each step against the printed frequencies (TC-962). No uncertainty."
[datasets.uncertainty]
level = "not stated"
[datasets.parameters]
channel = "O2+ (a 4Pi_u, v) + one 800 nm photon -> f 4Pi_g -> O+ + O"
kind = "calculated"
state = "O2+ a 4Pi_u, the vibrational level v of the row"
photon_nm = 800

