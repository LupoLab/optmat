# The empirical temperature fits of the molecules at 632.99 nm (pp. 811-814), valid over
# the measured 300-1100 K; not dispersion formulas, so no form.

[[formulas]]
id = "alpha_T_H2"
material = "H2"
equation = "Eq. (18), p. 811"
printed = "10^31 alpha(T)/m^3 = 8.190(18) + 1.5(1.0) x 10^-4 (T/K) - 2.4(1.7) x 10^-7 (T/K)^2 + 2.05(88) x 10^-10 (T/K)^3"
variable = "T: temperature in K; alpha: polarizability volume at 632.99 nm (vacuum)"
range = "300-1100 K (the measurements, Fig. 2)"
coefficients = { c0 = "8.190", c1 = "1.5e-4", c2 = "-2.4e-7", c3 = "2.05e-10", unit = "1e-31 m^3" }
check = "Gives +1.4 % from 0 to 1000 K (8.305 at 1000 K), as the text states ('of the order of 1.4 per cent per 1000 K'). Checked 2026-09-25."
notes = "The authors' least-squares polynomial of the part-I data (squares in Fig. 2); the standard uncertainties of the coefficients in parentheses. Its constant, 8.190(18)e-31 m^3, is an extrapolation to 0 K."

[[formulas]]
id = "alpha_T_N2"
material = "N2"
equation = "Eq. (19), p. 813"
printed = "10^30 alpha(T)/m^3 = 1.7636(14) + 3.1(1.9) x 10^-6 (T/K)"
variable = "T: temperature in K; alpha: polarizability volume at 632.99 nm (vacuum)"
range = "300-1100 K (the measurements, Fig. 3)"
coefficients = { c0 = "1.7636", c1 = "3.1e-6", unit = "1e-30 m^3" }
check = "Gives +0.18 % per 1000 K; the text says 0.2 per cent. Checked 2026-09-25."
notes = "Linear fit of data with an unexplained 'great scattering' (p. 813), N2 purity better than 99.999 %."

[[formulas]]
id = "alpha_T_O2"
material = "O2"
equation = "Eq. (20), p. 813"
printed = "alpha(T) = a [exp(bT) - bT - cT^2]; a = alpha(omega, 0 K) = 1.5959 x 10^-30 m^3, b = 3.264 x 10^-4 K^-1, c = 5.301 x 10^-8 K^-2"
variable = "T: temperature in K; alpha: polarizability volume at 632.99 nm (vacuum), m^3"
range = "300-1100 K (the measurements, Fig. 4)"
coefficients = { a = "1.5959e-30", b = "3.264e-4", c = "5.301e-8" }
check = "Gives +0.66 % from 0 to 1000 K; the text says 0.7 per cent per 1000 K. Checked 2026-09-25."
notes = "Chosen to rise monotonically with zero slope at 0 K; above about 700 K the data rise faster than the Eq. (11) theory (p. 814)."

[[formulas]]
id = "alpha_T_CH4"
material = "CH4"
equation = "Eq. (20), p. 814"
printed = "alpha(T) = a [exp(bT) - bT - cT^2]; a = alpha(omega, 0 K) = 2.6049 x 10^-30 m^3, b = 2.723 x 10^-4 K^-1, c = 2.903 x 10^-8 K^-2"
variable = "T: temperature in K; alpha: polarizability volume at 632.99 nm (vacuum), m^3"
range = "300-1100 K (the measurements, Fig. 5)"
coefficients = { a = "2.6049e-30", b = "2.723e-4", c = "2.903e-8" }
check = "Gives +1.17 % from 0 to 1000 K; the text says 'about 1.2 per cent per 1000 K'. Checked 2026-09-25."
