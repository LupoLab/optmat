citation = "U. Hohm and K. Kerl, \"Interferometric measurements of the dipole polarizability alpha of molecules between 300 K and 1100 K. I. Monochromatic measurements at lambda = 632.99 nm for the noble gases and H2, N2, O2, and CH4\", Mol. Phys. 69, 803 (1990)"
doi = "10.1080/00268979000100611"
library = "Hohm_1990_InterferometricMeasurementsDipole"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Evacuated high-temperature Michelson twin interferometer (a gas-measuring and \
an evacuated reference interferometer), quartz-glass sample cell of effective length \
about 1 m, He-Ne laser at 632.99 nm. Absolute method: the cell is filled to below \
1.5e5 Pa, thermostated 0.5-3 min, evacuated isothermally in 5-10 min while the fringe \
shift N* is counted; n - 1 = N* lambda/l(T) (Eq. 17). Pressure to 10 Pa, temperature to \
0.1 K; 300-1100 K. Gas purity better than 99.95 % (pp. 808-809)."""
notes = """Page numbers are the journal's (803-817); pdf page 1 is the publisher's cover, so \
p. = pdf page + 801.

Reduction (pp. 807-808, Eqs. 13-16): (n^2 - 1)/(n^2 + 2) = (4 pi N_A/3) alpha(omega, \
T, 0) rho_0 (1 - B(T) rho_0), rho_0 = p/RT, second virial coefficients B(T) from Kerl \
(1986); the refractivity virial b_R is neglected. The values are the free-molecule \
polarizability volumes alpha = alpha_SI/(4 pi eps0) in 10^-30 m^3 (angstrom^3). The \
wavelength is 632.99 nm, a vacuum wavelength.

Uncertainty (p. 809): |Delta rho_0/rho_0| = 3e-4, |Delta(n - 1)/(n - 1)| = 4e-4, 'the \
polarizability may be determined with a precision of |Delta alpha/alpha| < 10^-3 in \
the whole temperature range'. Table 1 (p. 811): 'As usual, standard deviations are \
given in parentheses. The relative statistical error ... ranges from 0.03 per cent \
(argon) to 0.11 per cent (neon)' (p. 810).

Noble gases (pp. 809-810): no temperature dependence between 300 and 1100 K beyond \
fluctuations of +-0.2 %; Table 1 gives the mean over all temperatures (helium below \
700 K only: above it helium permeates the quartz cell). These results contradict the \
authors' earlier 1 %-per-100 K increase (Hohm and Kerl 1986, Kerl and Hausler 1984). \
The authors find their Kr and Xe values 'somewhat higher than the values given by \
Burns et al.', closer to Koch's (p. 810).

MOLECULES: the temperature-dependent polarizabilities of H2, N2, O2 and CH4 are shown \
only in Figs. 2-5 (3-6 measurements per temperature, pp. 810-814); what the paper \
prints are the empirical fits of alpha(T), 'without any physical meaning' (p. 810), \
recorded as formulas (Eqs. 18-20): H2 +1.4 %, N2 +0.2 %, O2 +0.7 %, CH4 +1.2 % per \
1000 K. The Eq. (11) theory curves and Table 2's spectroscopic inputs (Huber and \
Herzberg; the alpha' and alpha'' derivatives from other authors) are not extracted. \
Text values not extracted as data (p. 811): H2 extrapolated to 0 K, 8.190(18)e-31 \
m^3 (the constant of Eq. 18), against Bishop and Cheung's ab initio 8.186e-31 m^3 at \
632.8 nm (bishop_1980).

Table 1's literature rows are reproduced datasets: Burns et al. (burns_1986: 3 A_R/(4 \
pi N_A), 0.20622 from A_R = 0.5202 cm^3/mol), Kerl (Z. phys. Chem. 129, 129 (1982), a \
dispersion formula; its helium 0.2106 is 2 % above every other helium value and looks \
like a transposition of 0.2061, not checkable here), Koide, Meath and Allnatt (J. Phys. \
Chem. 86, 1222 (1982), ab initio), Buckingham and Graham (Proc. R. Soc. A 336, 275 \
(1974)), Koch (1949, a dispersion formula), Kumar and Meath (kumar_1985, DOSD) and \
Bridge and Buckingham (J. Chem. Phys. 40, 2733 (1964)). The paper says 'the other \
data ... are determined at lambda = 632.8 nm, if not stated otherwise' (p. 810); all \
are stored at the caption's 632.99 nm.

Reproductions elsewhere: egan_2019/hohm_kerl_1990_Ne (A_R = 1.001(0.001) cm^3/mol, this \
paper's neon)."""

