[[formulas]]
id = "ne_cauchy"
material = "Ne"
equation = "Eq. (4), p. 2, with Table I, p. 6"
printed = "A_R(nu) = A_eps + A_2 nu_bar^2 + A_4 nu_bar^4 + A_6 nu_bar^6 + A_mu; Ne this work: A_eps 0.994709(8) cm^3/mol, A_2 2.46000(8) x 10^-4 cm^3/mol"
variable = "nu_bar = nu/(10^14 Hz), nu the optical frequency; A_R in cm^3/mol"
state = "none (molar, zero density)"
density = "none"
range = "the two measurement frequencies, 194.4 and 473.6 THz (1542-633 nm), about 303 K"
coefficients = { A_eps = "0.994709", A_2 = "2.46000e-4" }
check = "A_2 corresponds to S(-4) = 2.84906 au, against lesiuk_2020's alpha_2 = 2.850(7) (0.03 %); the theory row of Table I prints A_2 = 2.461(5) x 10^-4 (2.85022 au). A_4, A_6 and A_mu are not printed: the formula is incomplete without the authors' assumed values (Lesiuk et al. 2020). Checked 2026-09-25."
notes = "The measurement result is the pair (A_eps, A_2) with the theoretical A_4, A_6 and A_mu; A_eps is extracted as the dataset A_eps_Ne."

