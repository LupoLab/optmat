notes = "Table I 'Experimental [23]': 4.3877(2) cm^3/mol, Schmidt and Moldover's cross-capacitor dielectric value (level as this paper's table, 'standard uncertainty'). The original (schmidt_2003, Table V) prints no 4.3877: its two N2 fits give 4.38782 (18) (two parameters; the text's '4.3878 +- 0.0009') and 4.38748 (15) at 273.16 K (with A_tau), whose mean 4.38765 rounds to 4.3877, as does hohm_2013's 11.7379 au (the same mean). So this is the mean of the two fits, not a printed value; the original states no level for its parenthesised fit uncertainties, and its full budget is about 2.7e-4 cm^3/mol (schmidt_2003 notes). Use the original."
[datasets.uncertainty]
