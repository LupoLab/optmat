citation = "Y. Yang, J. A. Stone and P. F. Egan, \"Demonstration of dispersion gas barometry\", Phys. Rev. Appl. 23, 064041 (2025)"
doi = "10.1103/z9zz-lqzh"
library = "Yang_2025_DemonstrationDispersionGas"
identity = "VALIDATED"
kind = "measurement"
technique = """Two-colour Fabry-Perot refractometry (NIST; the apparatus of Egan and Yang \
2023): a 15 cm titania-silicate cavity near 303 K, mirrors dual-coated for 633 and \
1542 nm, interrogated synchronously by a He-Ne laser at 473.61187 THz and an ECDL at \
194.36862 THz against comb-locked references; 100 quadruplets (two refractivities, \
pressure from a piston gauge, temperature from a capsule SPRT) per isotherm, 0.05-0.5 \
MPa. For helium, the cavity distortion and a pressure-calibration parameter are solved \
from the two refractivities with ab initio helium dispersion (the 'optical-pressure \
scale', epsilon_p = (2.2 +- 5.7) x 10^-6); for Ne, Ar, N2, A_eps and A_2 of Eq. (4) are \
solved at each quadruplet with that distortion (pp. 2-5)."""
notes = """Identity VALIDATED; first page checked (pdf page 1: Phys. Rev. Applied 23, \
064041 (2025), published 17 June 2025). Page numbers are the article pages 1-7 (= pdf \
pages). Uncertainties are standard uncertainties (Table I caption).

THE MODEL (Eq. 4, p. 2): A_R(nu) = A_eps + A_2 nu_bar^2 + A_4 nu_bar^4 + A_6 nu_bar^6 + \
A_mu with nu_bar = nu/(10^14 Hz), A_eps = (4 pi/3) N_A alpha(0), A_mu = (4 pi/3) N_A \
chi. The two laser frequencies are 473.61187 and 194.36862 THz (vacuum wavelengths \
632.9919 and 1542.3912 nm, computed). A_4, A_6 and A_mu are assumed (theory for Ne, \
Ar; Kumar and Meath's DOSD sums for N2); only A_eps and A_2 are solved, so the \
measurement's information is the pair (A_eps, A_2) of Table I. The raw data are in \
the NIST repository (doi 10.18434/mds2-3695), not in the library.

DATASETS: the A_eps column of Table I (static, 'inf'): this work (primary, Ne, Ar, \
N2), and the literature rows (reproduced). A_2 has no quantity: recorded as the \
formulas ne_cauchy, ar_cauchy, n2_cauchy, he_A2 (this work) with the literature A_2 in \
their notes. In atomic units A_2 = (4 pi/3) N_A a0^3 S(-4) (2 pi 10^14 Hz / E_h/hbar)^2, \
i.e. S(-4) = A_2 / (0.3738031 cm^3/mol x 2.30988e-4) (computed with the package's \
constants): Ne 2.84906 (lesiuk_2020 alpha_2 2.850(7)), Ar 27.9486 (lesiuk_2023 \
27.976(15), 1.0e-3 above), N2 30.1086 (nie_2025's Olney 30.11(9); Kumar and Meath's \
25.70 gives 29.765), He 1.543206 (theory's A_2 gives 1.543203).

ACCURACY (p. 6): A_eps 'chiefly dominated by the measured (optical) pressure', 5.7e-6 \
from helium dispersion theory, temperature 2.5e-6, neon impurity 4.0e-6 and kappa \
3.3e-6; plus an A_mu discrepancy 'corresponding to about 2 x 10^-6 A_eps'. A_2: about \
3.5e-5 A_2 for Ne and Ar (statistics and A_4, A_6), 2.0e-4 A_2 for N2 (A_4, A_6 from \
the DOSD). 'The A_2 values deduced from this work are 66 and 16 times more accurate \
than ab initio theory of neon and argon'. For helium, A_eps is fixed to theory and the \
measured A_2 = 1.332468(6) x 10^-4 validates the retardation-corrected theory \
(1.332465(5)).

All values refer to about 303 K (the isotherms 'near 303 K'); the exact temperatures \
are in the supplemental material, not in the library."""

[[datasets]]
id = "A_eps_Ne"
material = "Ne"
file = "Ne/yang_2025__A_eps_Ne.csv"
table = "tbl_ca4a321ccfce"
quantity = "molar_refractivity"
unit = "cm3/mol"
abscissa_unit = "nm"
use = "primary"
notes = "Table I 'This work': A_eps = 0.994709(8) cm^3/mol, the static term of the two-frequency Cauchy fit (473.61187 and 194.36862 THz), with A_4, A_6 from Lesiuk et al.'s theory and A_mu ab initio assumed; on the optical-pressure scale (helium dispersion theory). 2.4 ppm below gaiser_2018 (0.3 sigma). The authors: 'capacitance measurements that directly access A_eps will be more reliable than the derived values of this work' (p. 6). About 303 K."
[datasets.uncertainty]
column = true
level = "1 sigma"
[datasets.parameters]
temperature_k = 303.0

