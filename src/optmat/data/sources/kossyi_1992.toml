table = "text"
quantity = "dissociative_recombination_rate_coefficient"
unit = "cm3/s"
scale = 1e-7
abscissa = "none"
use = "reproduced"
reproduced_from = ["K. Smith and R. Thomson, Computer Modeling of Gas Lasers (Plenum, New York, 1978)"]
points = [["1", "", "2.8"]]
notes = "Reaction (38), p. 209: 'N2+ + e => N + N, k38 = 2.8 x 10^-7 x (300/T_e)^1/2 cm^3 s^-1 [22]'. The products' states are not given (the second channel, (39), names N(2D))."
[datasets.parameters]
products = "N + N (states not given)"
law = "power_law"
reference_temperature_k = 300.0
exponent = 0.5

