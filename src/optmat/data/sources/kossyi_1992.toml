citation = "I. A. Kossyi, A. Yu. Kostinsky, A. A. Matveyev and V. P. Silakov, \"Kinetic scheme of the non-equilibrium discharge in nitrogen-oxygen mixtures\", Plasma Sources Sci. Technol. 1, 207 (1992)"
doi = "10.1088/0963-0252/1/3/011"
library = "Kossyi_1992_KineticSchemeNon"
identity = "VALIDATED_WITH_WARNINGS"
kind = "compilation"
technique = """A kinetic scheme for a non-equilibrium discharge in N2-O2 mixtures, for \
cold (200-500 K), vibrationally unexcited gas: rate constants selected from reviews and \
recent papers for electron-impact excitation, dissociation and ionisation, associative \
ionisation, electron-ion recombination, attachment and detachment, neutral chemistry, \
ion conversion and ion-ion recombination, with a model calculation of a pulsed \
discharge in air (pp. 207-219). No measurements."""
notes = """Identity checked on the first article page (PDF page 2 = journal p. 207; \
PDF page 1 is a cover sheet): Kossyi, Kostinsky, Matveyev and Silakov, Plasma Sources \
Sci. Technol. 1, 207-220 (1992). PDF page n = journal page 205 + n (the page image of \
PDF page 4 is numbered 209).

Curated: only the dissociative recombination coefficients of the registered molecular \
ions (Section 2.3, pp. 209-210; page images checked at 220 dpi, the text extraction \
garbles the equation numbers). Each is printed as k = A x (300/T_e)^n cm^3 s^-1, with \
'the electron temperature T_e ... the quantity (2 epsilon_e)/(3k) (epsilon_e is the mean \
electron energy); T_e is in kelvin' (p. 209): a power law with T_ref = 300 K. Every \
coefficient is taken by the authors from another work, cited in brackets, none of \
which is in the library: [20] M. H. Bortner and T. Baurer (eds), Defense Nuclear Agency \
Reaction Rate Handbook, 2nd ed., DNA 1948H (1978), ch. 24; [22] K. Smith and R. \
Thomson, Computer Modeling of Gas Lasers (Plenum, 1978) (printed 'Tomson'); [24] S. I. \
Kozlov, V. A. Vlaskov and N. V. Smirnova, Sov. Space Res. 26, 738 (1988). No \
uncertainty and no range of T_e is given. The selection favoured 'fundamental review \
articles containing a critical analysis' where possible (p. 208).

NOT REGISTERED, NOTES ONLY (p. 209): the cluster ions, (29) N4+ + e -> N2 + N2, \
k29 = 2 x 10^-6 (300/T_e)^1/2; (30) O4+ + e -> O2 + O2, 1.4 x 10^-6 (300/T_e)^1/2; (31) \
NO+.NO + e -> NO + NO, 1.3 x 10^-6 (300/T_e)^1/2, all from [21] B. M. Smirnov, Complex \
Ions (Nauka, 1983); (32)-(34) NO+.N2, NO+.O2 and O2+.N2 + e set equal to k31; (37) N3+ + \
e -> N2 + N, set equal to k35 ('according to [23] there should be fulfilled an \
inequality k37 << 3 x 10^-6 cm^3 s^-1'). Three-body electron-ion recombination (p. 210) \
for A+ = N2+, O2+, NO+, N+, O+ and M = N2, O2: (43) e + e + A+, k43 = 10^-19 \
(300/T_e)^4.5 cm^6 s^-1 [25]; (44) e + A+ + M, k44 = 6 x 10^-27 (300/T_e)^1.5 cm^6 s^-1 \
[26]. The rest of the scheme (excitation, attachment, ion conversion, neutral \
chemistry, ion-ion recombination) is not taken: plasma kinetics is outside optmat's \
scope except as data (TC-954).

Register: TC-976."""

