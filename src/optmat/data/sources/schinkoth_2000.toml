citation = "D. Schinköth, M. Kock and E. Schulz-Gulde, \"Experimental Stark broadening parameters for near-infrared Ar I and Kr I lines\", J. Quant. Spectrosc. Radiat. Transfer 64, 635 (2000)"
doi = "10.1016/S0022-4073(99)00155-7"
library = "Schinkoth_2000_ExperimentalStarkBroadening"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Plasma (Stark) broadening of 15 Ar I 4s-4p and 12 Kr I 5s-5p \
near-infrared lines in an atmospheric-pressure wall-stabilised arc (4 mm channel, \
35-70 A) run in neon, argon or krypton with about 1:10 admixtures of the gas under \
study, kept optically thin; end-on emission through a 2 m Czerny-Turner monochromator \
(415 pm/mm, Gaussian instrument function 10 pm HWHM at 632.8 nm) and a CCD; electron \
density from the continuum emission (about 5 %), temperature from the Ar II 480.6 nm \
or Kr II 457.7 nm line (2 %), assuming LTE; Voigt (argon) or generalised asymmetric \
Stark profiles with Holtsmark ion microfields (krypton) fitted to the profiles (Secs. \
2-4). With neon as carrier gas only relative widths (n_e T^(1/6) scaling)."""
notes = """Context only, no datasets. J. Quant. Spectrosc. Radiat. Transfer 64, \
635-643 (2000), PDF pages 1-9 = journal pp. 635-643. Identity checked on the first \
page: journal, volume, pages, authors, title, received 28 September 1998, accepted 6 \
July 1999. The library's identity is VALIDATED_WITH_WARNINGS.

WHAT THE PAPER PRINTS. Table 1 (p. 641, Ar I) and Table 2 (p. 642, Kr I): per line \
(Racah labels, air wavelength to 0.1 nm) the Stark constant C4 in 10^-22 m^4 s^-1 \
(this work, with Refs. 2-5 for argon and Ref. 1 for krypton, reproduced), the \
Lorentzian half width at half maximum Delta lambda_HWHM (pm) and the ion broadening \
parameter A, both 'given for n_e = 10^22 m^-3 and T = 10^4 K', with Griem's \
calculated half widths and A (Refs. 17, 18) for argon. Uncertainty of C4 (probable): \
10 % for argon (15 % for the values marked a, from the neon-carrier relative \
measurements), 12 % for krypton (19 % marked a); maximum errors 14 and 17 % (p. 639). \
Argon C4 1.03-1.63, HWHM 3.30-5.08 pm, A 0.042-0.047; krypton C4 1.18-2.04, HWHM \
3.99-5.66 pm, A 0.043-0.049. The C4 here is the line's quadratic Stark constant, set \
by the difference of the upper and lower levels' polarisabilities; the widths are \
electron-impact widths in a plasma.

LEVEL LABELS. Every argon row's label is NIST's 3s2.3p5 4s or 4p level pair \
(data/external/nist_asd/Ar_I_lines_nir.tsv; unprimed = (2P*<3/2>), primed = \
(2P*<1/2>)), the air wavelength matching NIST's vacuum one converted to air within \
0.06 nm, except the last row: '4s[3/2]1-4p'[3/2]1 738.4' is NIST's 738.6014 nm (vac) \
4s 2[3/2]* J = 1 - 4p' 2[3/2] J = 2 (upper level 107 289.700 cm^-1); the 4s[3/2]1 - \
4p'[3/2]1 line is near 747.1 nm (air). The upper J is misprinted 1 for 2 (no value is \
taken, so no erratum). Two argon rows are both '772.4': 4s[3/2]2-4p[3/2]1 (NIST \
772.5887 vac) and 4s'[1/2]0-4p'[1/2]1 (772.6333 vac). All 12 krypton labels match \
NIST's Kr I lines (Kr_I_lines_nir.tsv) by wavelength and Racah label. Some odd-parity \
superscripts are missing on the page (e.g. 4s'[1/2]1 in two argon rows).

NOT TAKEN (no quantity fits; Data rule 7). pressure_line_coefficient (TC-1040) is \
collisional broadening or shift of a bound line by a perturber gas ('self or a gas'), \
per unit pressure or density, in MHz/torr, MHz/mbar, GHz/amagat, cm-1/amagat or \
cm3/s. These widths are plasma Stark widths: the perturbers are free electrons (and \
ions, through A) at T = 10^4 K, the width is quoted at a reference electron density \
in pm, and the ion part is quasistatic, not impact. C4 is a line's quadratic Stark \
constant, the difference of two levels' polarisabilities (a line Stark coefficient; \
declined, TC-1011). No new quantity is proposed: a plasma electron-impact width is \
not an input of OEP 8, whose argon pressure broadening is by neutral argon.

CHECKED (2026-10-12). Table 1 and Table 2 cells against the page images (p. 641 is \
printed rotated; its footnote a and the n_e, T reference are on the page, not in the \
extracted table). Milosavljevic et al. (milosavljevic_2006, their ref. 9) quote this \
paper's widths as FWHM at 10.0 x 10^3 K and 1 x 10^22 m^-3: 7.42, 7.42, 6.78, 6.6 and \
7.06 pm and A 0.044, 0.044, 0.042, 0.044, 0.044 for 751.465, 763.511, 772.376, \
706.722 and 738.398 nm, exactly twice the HWHM here (3.71, 3.71, 3.39, 3.30, 3.53) \
and the same A.

FINDING AGAINST werbowy_2026 (TC-1007). Werbowy's Table 1 column 'From the ion \
broadening A, Ref. [2]' (this paper) lists the same 15 argon lines, single values or \
ranges in kHz/(kV/cm)^2. Each range spans this paper's C4 'This work' and the \
reproduced C4 of Refs. 2-5 in the same row, times about 127 (any factor from 125 to \
130 reproduces 14 of the 15 entries to the printed 10; 772.376 nm, printed 170, gives \
136 and 127). Werbowy states Delta alpha_0 = 2 C4 (its p. 3); 2 C4 with C4 in angular \
frequency gives 154 per 10^-22 m^4 s^-1, and in ordinary frequency 965; neither is \
127, and Werbowy does not give the conversion. These are reproduced comparison values \
in werbowy_2026 (not taken there).

