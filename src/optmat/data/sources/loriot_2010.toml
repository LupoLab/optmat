technique = "Erratum (2 pages) to loriot_2009: no new measurement; the published coefficients are reinterpreted and rescaled."
notes = """No datasets: the erratum's corrected n2 values are applied to loriot_2009's \
n2 datasets as [[errata]] (the paper's own correction), so that the measurement is \
recorded once.

The correction (p. 1): 'The signal observed in [1] results from cross-coupling between \
two laser beams, i.e. pump and probe, propagating along different directions. The \
coefficients of the nonlinear refractive index introduced in Eqs. (5) and (6) \
describe therefore the cross-Kerr refractive index experienced by the probe beam.' The \
single-beam (Kerr, self) values follow 'by comparing the number of permutations \
between distinguishable fields in the case of one- and two-beam experiments', valid \
when the intrapulse molecular alignment is negligible: 'The extrapolation results in \
dividing each cross-Kerr coefficient n_2j reported in [1] by (j + 1).' The \
alignment contribution to n2 of N2 at 45 TW/cm^2, computed from the hyperpolarizability \
tensor, is 'less than 2%' (p. 1). The occurrence of the sign inversion is unaffected, \
so the authors keep the 2009 conclusions.

Table 1 (tbl_4a652954902a; checked against the image; units 10^-7 cm^2/TW, 10^-9 \
cm^4/TW^2, 10^-10 cm^6/TW^3, 10^-11 cm^8/TW^4, 10^-14 cm^10/TW^5; 'two standard \
deviations of the fitted values'): n2 N2 1.1 +- 0.2, O2 1.60 +- 0.35, Ar 1.00 +- 0.09, air \
1.2 +- 0.3; n4 N2 -0.53 +- 0.26, O2 -5.16 +- 0.53, Ar -0.36 +- 1.03, air -1.5 +- 3.0; n6 N2 \
1.40 +- 0.15, O2 4.75 +- 0.50, Ar 4.0 +- 0.5, air 2.10 +- 0.22; n8 N2 -0.44 +- 0.04, O2 \
-2.10 +- 0.14, Ar -1.72 +- 0.10, air -0.80 +- 0.06; n10 Ar 8.83 +- 0.50; I_inv N2 43, O2 \
25, Ar 34, air 34 TW/cm^2. Every entry is the 2009 Table 2 entry divided by j + 1 \
(2, 3, 4, 5, 6) to the printed digits (checked: -1.55/3 = -0.517 is printed -5.16 x \
10^-9, the only last-digit difference), and the inversion intensities rise because \
the orders are scaled differently. The higher-order coefficients are recorded here \
only; they are refuted as a Kerr response (see loriot_2009's notes: Wahlstrand et al. \
2013 attribute the negative birefringence to a plasma grating; Wahlstrand et al. 2012 \
and 2018 find the bound-electron response linear in I up to and beyond ionisation).

Fig. 1 caption: 'room temperature and 1 atm' (the measurement tables of loriot_2009 \
say 1 bar)."""
