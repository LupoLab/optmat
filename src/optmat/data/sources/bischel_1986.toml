citation = "W. K. Bischel and M. J. Dyer, \"Temperature dependence of the Raman linewidth and line shift for the Q(1) and Q(0) transitions in normal and para-H2\", Phys. Rev. A 33, 3113 (1986)"
doi = "10.1103/PhysRevA.33.3113"
library = "Bischel_1986_TemperatureDependenceRaman"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """cw stimulated Raman gain spectroscopy (SRGS, p. 2): a single-frequency \
argon-ion probe at 488 nm (the Stokes wave; drift < 10 MHz per scan) and an \
electronically tunable single-frequency ring dye pump at 612 nm (< 1 MHz), amplitude \
modulated at 100 kHz, in a multipass cell (up to 50 passes) at 77-500 K and up to 500 \
psi, followed by a double-pass reference cell at 298 K for the line shifts. Forward \
scattering. Density from a Baratron gauge and a thermocouple by the perfect-gas law \
('the density calculated using the second virial coefficient deviates from this \
calculation by less than 1 % at the maximum density of 12 amagats', p. 2). Lorentzian \
fits give FWHM widths; widths at each temperature fitted to Eq. (1) over densities \
above the cutoff rho_c (Table III), about 1-25 amagat. Normal H2 (ortho:para 3:1) and \
para-enriched H2 (1:7.7, stored boil-off from liquid H2)."""
notes = """Identity checked against the first page. Page numbers are pdf pages (1-11 = \
journal pp. 3113-3123). Material H2 is the main isotopologue; the paper has no other.

WIDTH CONVENTION (the key hazard). All widths are FULL widths: p. 3, 'A Lorentzian \
line-shape function was used to determine the full width at half maximum (FWHM) Raman \
linewidth'; Eq. (1), p. 3: 'Delta nu_FWHM = A/rho + B rho, where A is a coefficient \
proportional to the self-diffusion coefficient, rho is density, and B is the \
density-broadening coefficient'; Table I's A in MHz amagat and B in MHz/amagat; Eq. \
(8), p. 8: 'B is the FWHM linewidth in MHz/amagat given in Table I'; Figs. 3 and 4 are \
labelled FWHM. The law INCLUDES the Dicke (collisional-narrowing) term A/rho, A in MHz \
amagat, valid above the cutoff density rho_c (Table III, about 1 amagat); below it the \
hard-collision model applies (Fig. 7). The amagat densities are perfect-gas densities \
(p. 2), i.e. rho = (p/p0)(273.15/T) with the gas at T, not a real-gas amagat. The \
coefficients are self-broadening of H2 by H2 of the stated ortho:para ratio.

ORTHO:PARA. 3:1 is normal H2 (the room-temperature equilibrium mixture), the material \
H2; the 81 K data at 3:1 are normal H2 cooled without conversion. 1:7.7 is a \
para-enriched mixture (not normal H2): the datasets that use it say so in \
parameters.ortho_para. n(J,T) of Table IV is the relative population of level J.

TABLE I (p. 4): Q(0) and Q(1), T = 81, 298, 474 K. 'We believe that the current value \
is correct to better than 5 % due to the high resolution afforded by our experimental \
technique' (p. 4, of the 298 K Q(1) value). The +- are not otherwise described \
(level not stated). The 'Previous work' column (the Q(1) measurements 'at 295 K', p. \
4, printed in the 298 K rows): Owyoung (Ref. 9, SRGS) A 302 +- 9, B 51.3 +- 0.6; Murray \
and Javan (Ref. 22, murray_1972) B 66.0 +- 5.0 (Q(0)), 45.0 +- 3 (Q(1)); Allin et al. (Ref. 6) 70, \
42; Hunt et al. (Ref. 8) 83.0 +- 3.0, 55.0 +- 2.0; Foltz et al. (Ref. 5) 53.1 (Q(1)); \
Lallemand and Simova (Ref. 7) 63 (Q(1)): reproduced datasets. The authors: 'our \
measurements agree almost exactly with the data of Owyoung ... those measurements of \
the other authors differ by 15-20 %'; Lallemand and Simova's 'linewidths are 30 % \
larger than ours' (p. 4).

TABLE II (p. 5): line shift nu_R(rho) = nu_R(0) + C rho + D rho^2 (Eq. (3)); C only, \
except at 474 K where the quadratic term was fitted (D = 0.51 +- 0.07 MHz/amagat^2). \
The 81, 298 and 474 K Q(1) and the 81 K para Q(0) shifts are from the two-cell \
technique; the others from successive scans (p. 5). Previous work: May et al. / Looi et \
al. (Ref. 11), Murray and Javan (Ref. 22), Lallemand and Simova (Ref. 7). The sign: \
negative C is a shift to lower Raman frequency with density (Fig. 2: the 81 K line lies \
2 GHz above the 298 K reference in the dye-laser frequency, i.e. at lower Raman shift). \
Zero-density position 4155.25 cm-1 (Fig. 2 caption); the text (p. 5) quotes Stoicheff \
4155.207 (stoicheff_1957's Q_1(1) 4155.201 at 1-2 atm, extrapolated to zero density \
with this paper's Eq. (4)), Foltz et al. 4155.259 and Brannon et al. 4155.240 +- 0.02 cm-1 (reproduced \
values, not extracted; the note added in proof says FT-Raman now fixes them to better \
than 0.001 cm-1). 'The ratio of the shift coefficient ... to the broadening coefficient \
... reaches a maximum value of 7.3 at 77 K' (p. 6; 81 K in the abstract and Fig. 2).

TABLE III (p. 6): Doppler FWHM for forward scattering (Eq. (5), with k_e = 2 pi nu_R, \
Eq. (6)), the self-diffusion coefficient D_0 (cm2 amagat s-1) from A by Eq. (7), \
Delta nu_FWHM = D_0 k_e^2/(pi rho), and the cutoff density rho_c (amagat) at X = 3.33. \
D_0 and rho_c have no quantity; as printed: 81 K Q(0) 3:1 D_0 0.871, rho_c 1.10; 81 K \
Q(0) 1:7.7 0.350, 0.45; 81 K Q(1) 3:1 0.493, 0.63; 298 K Q(0) 3:1 1.19, 0.79; 298 K \
Q(1) 3:1 1.42, 0.92; 474 K Q(1) 3:1 2.34, 1.23. D_0 of Q(1) follows T^0.92 (p. 9) \
against the theoretical T^0.72 above 65 K.

TABLE IV (p. 8): at 81 K both theories print '< 2' MHz/amagat for all three rows \
(not extracted: upper bounds). n_J as printed: 81 K 0.25 (Q(0), 3:1), 0.89 (Q(0), \
1:7.7), 0.75 (Q(1)); 298 K 0.130, 0.658, 0.117, 0.090 (J = 0-3). The 'Vibrational \
contribution' column (Table IV minus Van Kranendonk's beta, Eq. (8)) as printed: 81 K \
29.0 +- 1.0, 45.4 +- 0.8, 41.5 +- 0.6; 298 K '0-9', '28-34', '0-2 +- 11', '21-29 +- 28' \
(ranges; notes only).

TABLE V (p. 9): formulas eq8_* and eq9_* below. The 81 K alpha_i is printed '23 +-' \
with no number after the sign (image checked; the text, p. 8, gives 'alpha_i = 23 \
MHz/amagat and alpha_c = 25 MHz/amagat'). Previous line-shift coefficients (Eq. (9)) as \
printed, reproduced and not extracted: May et al. (Ref. 11) experiment a_i -261 (81 K), \
-60 (298 K), a_c -42, -51; their theory a_i -260, -60, a_c -63, -63; Lallemand and \
Simova (Ref. 7) experiment 298 K a_i -45, a_c -68. Gray and Welsh (Ref. 35) proposed \
alpha_c = 42 MHz/amagat.

solprop: its H2 vibrational linewidth (FWHM in Hz = 309e6/n + 52.2e6 n, n in amagat) \
is exactly Table I's Q(1), 298 K, 3:1 A = 309 MHz amagat and B = 52.2 MHz/amagat."""

