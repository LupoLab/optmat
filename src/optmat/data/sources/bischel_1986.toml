[[formulas]]
id = "eq2_linewidth"
material = "H2"
equation = "Eq. (2), p. 4"
printed = "Delta nu(rho) = (309/rho)(T/298)^0.92 + [51.8 + 0.152 (T - 298) + 4.85 x 10^-4 (T - 298)^2] rho"
variable = "rho: density in amagat (perfect gas, p. 2); T: temperature in K; Delta nu: the FWHM Raman linewidth of Q(1) in MHz"
state = "normal H2 (ortho:para 3:1), self-broadened"
density = "ideal"
range = "77-500 K, 1-50 amagat, ortho:para 3:1 (p. 4)"
coefficients = { A298 = "309", A_exponent = "0.92", B0 = "51.8", B1 = "0.152", B2 = "4.85e-4", T0 = "298" }
check = "Against Table I's Q(1), 3:1 (scratch, 2026-09-26): B(81) = 41.65 (table 41.5 +- 0.6), B(298) = 51.8 (52.2 +- 0.5), B(474) = 93.58 (94.0 +- 2.0); A(81) = 93.2 (107 +- 20), A(298) = 309 (309), A(474) = 473.6 (508 +- 29). B agrees to within the table's errors (0.4 MHz/amagat); A is the 'best power law that can be obtained for the three points' (T^0.92, p. 9) and misses 474 K by 1.2 sigma. FWHM."
notes = "'a phenomenological second-order fit to the Q(1) linewidth' (p. 4) including the Dicke term; the Fig. 4 solid line. Eq. (2) is FWHM in MHz ('Here Delta nu is the FWHM Raman linewidth in MHz')."

