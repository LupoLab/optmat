citation = "Q. He, Z. Fang, O. Shoshanim, S. S. Brown and Y. Rudich, Atmos. Chem. Phys. 21, 14927 (2021)"
doi = "10.5194/acp-21-14927-2021"
library = "He_2021_ScatteringAbsorptionCross"
identity = "VALIDATED"
kind = "measurement"
technique = """Broadband cavity-enhanced spectroscopy (two channels, 307-350 and 338-725 nm, \
0.8 nm resolution; 94.0 +- 0.1 cm cavity), calibrated with He and N2 (n-based cross \
sections of Table 1), plus cavity ring-down spectroscopy at 404 and 662 nm. Pure CO2, \
N2O, SF6; O2 + He and CH4 + He mixtures (10-100 %). About 295 K and 1020 hPa."""
notes = """The measured quantity is the extinction (Rayleigh scattering plus absorption) \
cross section, related to the refractive index by Eq. (1), sigma = 24 pi^3 nu^4 / N^2 \
((n^2 - 1)/(n^2 + 2))^2 F_k(nu). Overall 1-sigma uncertainty 'within 1.7 %' (p. 6), \
mostly the N2 reference cross section (1 %); mean 1.2-1.3 % (CO2), 1.2-1.7 % (N2O), \
1.2-1.4 % (SF6) (p. 6). The BBCES and CRDS results agree within 0.9 % (p. 6).

Table 2 (tbl_7b887ae8ae76, JSON only, image checked) gives the measured ('Exp') and \
n-based cross sections (10^-27 cm^2) of CO2, SF6, N2O, O2 and CH4 at 330, 404, 532, \
660 and 710 nm. They are NOT extracted: the package has no quantity for a Rayleigh \
(or extinction) cross section, and converting them to refractive indices would be a \
transformation of printed values. A 'rayleigh_cross_section' quantity (with the King \
factor F_k as a parameter) is needed; the extraction is then direct. For CH4 above \
about 400 nm and O2 in its bands the 'Exp' values include absorption (pp. 5, 9). The \
refractive indices the paper derives from the cross sections are shown only in \
Fig. 9.

Refractive indices (and the formulas below) refer to 288.15 K and 1013.25 hPa with \
N = 2.546899e19 cm^-3 (an ideal-gas density), except O2's reproduced formula at \
273.15 K and 1013.25 hPa with N = 2.68678e19 cm^-3 (Table 1 footnote, read from the \
original PDF: the library truncates it to '8678 x 1019 molec. cm-3'). F_k = 1 for \
SF6 and CH4.

Check of the reproduced Table 1 formulas: with Eq. (1) and the Table 1 F_k they \
reproduce the n-based column of Table 2 exactly for O2 and 0.10-0.15 % high for CO2, \
SF6, N2O and CH4 at all five wavelengths (a uniform offset, as if a density 0.07 % \
higher had been used), which confirms the transcription of the formulas (checked \
2026-09-24)."""

[[formulas]]
id = "CH4_uv"
material = "CH4"
equation = "Eq. (7), p. 10"
printed = "(n_CH4 - 1) x 10^8 = 5476 + 4.1579 x 10^14 / (1.1568 x 10^10 - nu^2)"
variable = "nu: vacuum wavenumber in cm^-1"
state = "1atm_15C"
density = "ideal"
range = "fitted to this work's extinction data at 307-400 nm, where CH4 absorption is negligible"
coefficients = { A = "5476", B = "4.1579e14", C = "1.1568e10" }
check = "With F_k = 1 it gives 85.19, 36.09, 11.52, 4.773, 3.547 x 10^-27 cm^2 at 330, 404, 532, 660, 710 nm against the Exp column 85.3, 35.9, 11.3, 4.68, 3.47 (absorption above 400 nm is not in the formula) (checked 2026-09-24)."
notes = "Used by the paper to separate CH4 scattering from absorption; superseded by Eq. (10) as the dispersion relation."

