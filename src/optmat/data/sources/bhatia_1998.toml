[[formulas]]
id = "eq12"
material = "He"
equation = "Eq. (12), p. 4471"
printed = "Delta alpha(omega) = -8.0029 x 10^-5 - 8.1516 x 10^-6 omega^2 + 3.006 x 10^-7 omega^4"
variable = "omega in reduced Rydberg units; Delta alpha in reduced atomic units (4He)"
state = "none (per atom)"
density = "none"
range = "visible light (omega/(E_p - E_0) <= 0.2)"
coefficients = { C0 = "-8.0029e-5", C1 = "-8.1516e-6", C2 = "3.006e-7" }
check = "alpha_1 + C0 = 1.383160981, gamma_1 + C1 = 0.3855302164 and epsilon_1 + C2 = 0.1275389496 give Eq. (13)'s coefficients (checked 2026-09-24)."
notes = "The Breit-Pauli alpha^2 correction to the dynamic polarizability (Eqs. 9-11)."

[[formulas]]
id = "eq13"
material = "He"
equation = "Eq. (13), p. 4471"
printed = "alpha_rel(omega) = 1.383 160 981 + 0.385 530 216 omega^2 + 0.127 538 95 omega^4 + 0.045 731 14 omega^6"
variable = "omega: photon energy in reduced Rydberg units, omega = 911.391 98/lambda with lambda in A (Eq. 14); alpha in reduced atomic units a_mu^3 (4He)"
state = "none (per atom)"
density = "none"
range = "visible light (omega/(E_p - E_0) <= 0.2, p. 4471)"
coefficients = { c0 = "1.383160981", c2 = "0.385530216", c4 = "0.12753895", c6 = "0.04573114" }
check = "Equals the generalized polarizabilities plus Eq. (12) (the omega^6 term unchanged: eta_1 = 0.045 731 135 rounded). Converted with (1 + m_e/m_alpha)^3 for a0^3 and Eq. (14) for omega it gives Puchalski's BD column 1.3837299, 3.2036675e5, 8.8032341e10, 2.621934e16 (checked 2026-09-24)."
notes = "The series Stone and Stejskal (2004) use for their dynamic terms. No form: alpha_series is in atomic, not reduced, units (a reduced-unit variant with the mass ratio as a parameter would take it; the equivalent atomic-unit series is c_k 4^k (1 + m_e/m_alpha)^(3+2k) omega_au^(2k))."

[[formulas]]
id = "eq15"
material = "He"
equation = "Eq. (15), p. 4472"
printed = "alpha(lambda) = 1.383 729 930 + 3.204 546 x 10^5/lambda^2 + 8.822 907 x 10^10/lambda^4 + 2.624 092 x 10^16/lambda^6 a0^3"
variable = "lambda: vacuum wavelength in A; alpha in a0^3"
state = "none (per atom)"
density = "none"
range = "visible light (as Eq. 13)"
coefficients = { A0 = "1.383729930", A2 = "3.204546e5", A4 = "8.822907e10", A6 = "2.624092e16" }
check = "Does not follow from Eq. (13): the correct conversion gives A2 = 3.2036675e5, A4 = 8.8032341e10, A6 = 2.621934e16 (Puchalski et al. 2016, Table VI, BD column; reproduced here). The printed A2 and A6 are Eq. (13) times (1 + m_e/m_alpha)^(3+2k) with k = 1, 3; A4 is a misprint (the same wrong conversion would give 8.80806e10). Checked 2026-09-24."
notes = "Corrected coefficients (no form takes this lambda^-2 series in A, see puchalski_2016 table6_total): A0 = 1.383729930, A2 = 3.2036675e5, A4 = 8.8032341e10, A6 = 2.621934e16 (Puchalski's correctly converted values; printed evidence: puchalski_2016 Table VI notes c-e). Nonrelativistic + alpha^2 only, no QED: superseded by puchalski_2016."

[[formulas]]
