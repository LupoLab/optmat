citation = "A. K. Bhatia and R. J. Drachman, \"Optical properties of helium including relativistic corrections\", Phys. Rev. A 58, 4470 (1998)"
doi = "10.1103/PhysRevA.58.4470"
library = "Bhatia_1998_OpticalPropertiesHelium"
identity = "VALIDATED_WITH_WARNINGS"
kind = "theory"
technique = """Variational (Hylleraas-basis pseudostate) calculation of the helium \
dynamic polarizability as a series in omega^2 (Eq. 6) from generalized dipole \
polarizabilities (Eq. 5), with the Breit-Pauli alpha^2 corrections to the first three \
coefficients from third-order perturbation theory (Eqs. 8-12); converted to a series \
in lambda^-2, to n - 1 through Lorentz-Lorenz at Loschmidt's density and to the \
Verdet constant (Eqs. 13-18), pp. 4470-4472."""
notes = """Units (p. 4470): the Hamiltonian is in reduced Rydberg units with lengths in \
reduced Bohrs, K = 2 m_e/(M + m_e) = 2.741 493e-4 for 4He; the polarizabilities of \
Eqs. (5), (12), (13) are in reduced atomic units (a_mu^3) and omega in reduced Rydberg \
units. Eq. (15) onwards is in a0^3 with lambda in A (vacuum wavelengths: omega = 4 pi \
a0/(alpha (1 - K/2) lambda), Eq. 14). No QED; the relativistic terms are for the 4He \
reduced mass (Puchalski et al. 2016 show that their mass dependence is not the true \
recoil correction). No uncertainties are given for the coefficients ('it is not clear \
that they are all accurate', p. 4471).

Generalized polarizabilities for 4He in reduced atomic units (p. 4471; the first five \
'calculated recently with high accuracy' in Bhatia and Drachman, Can. J. Phys. 75, 11 \
(1997), the last two new here): alpha_1 = 1.383 241 01, beta_1 = 0.707 521 493, \
gamma_1 = 0.385 538 368, delta_1 = 0.218 735 026, epsilon_1 = 0.127 538 649, zeta_1 = \
0.075 827 657, eta_1 = 0.045 731 135 (the sums of <0|Z|p><p|Z|0>/(E_p - E_0)^j, j = \
1..7, Z = 2(z_1 + z_2), energies in reduced Rydbergs). They are not extracted as Cauchy \
moments: the conversion to atomic units, S(-2k-2) = c_k 4^k (1 + m_e/m_alpha)^(3+2k) for \
alpha_1, gamma_1, epsilon_1, eta_1 (checked: it gives Puchalski's converted BD values \
of Table II, e.g. 4 gamma_1 (1 + 1/7294.2995)^5 = 1.543 210 9), is not expressible \
as one dataset scale; Puchalski et al. 2016 print alpha_0..alpha_6 so converted \
(puchalski_2016 dataset cauchy_bhatia_drachman) and 1e3 to 1e5 times more accurate \
values.

Unit-conversion errors (Puchalski et al. 2016, Table VI notes c-e; confirmed here): \
Eq. (15)'s lambda^-2 and lambda^-6 coefficients carry (1 + m_e/m_alpha)^(3+2k) \
instead of (1 + m_e/m_alpha)^3 (with omega already scaled by (1 - K/2) in Eq. 14): \
3.204 546e5 and 2.624 092e16 are reproduced that way from Eq. (13), while the correct \
conversion gives 3.2036675e5 and 2.621934e16 (Puchalski's BD column); the lambda^-4 \
coefficient 8.822 907e10 is reproduced by neither (correct: 8.8032341e10), a \
typographical error. Eqs. (17) and (18) inherit the errors: Eq. (17) as printed gives \
34.88646 and 34.81673 (the printed values), the corrected coefficients 34.88638 and \
34.81667 (x 1e-6), i.e. 2.3 and 1.7 ppm lower (computed here). Eq. (13) and Stone \
and Stejskal's use of it (stone_2004 Eq. 5: the same dynamic coefficients 0.385530216, \
0.12753895, 0.04573114, with its static term replaced by Lach et al.'s QED value) are \
unaffected; stone_2004's Eq. (8) lambda^-2 coefficient 1197.5410 agrees with \
Puchalski's nonrelativistic + relativistic A_2 converted to cm^3/mol to 4e-7 \
(checked 2026-09-24).

Comparisons in the text (p. 4472): Leonard's recommended (n - 1) x 1e6 = 34.895 +- \
0.01 at 5462.258 A (which is Leonard's value derived from theory, see leonard_1974 \
recommended_He) and Achtermann et al.'s (1993) 34.887 +- 0.007 at 6329.9 A, 'differ by \
10 times the standard deviation' from Eq. (17); Verdet constants from Leonard's table \
(Ingersoll and Liebenberg), 0.637 at 5000 A and 0.246 at 8000 A. Pendrill (1996), cited \
for the comparison, is not in the library."""

[[datasets]]
id = "alpha_static"
material = "He"
table = "text"
points = [["static", "inf", "1.383729930"]]
quantity = "polarizability"
unit = "au"
abscissa_unit = "angstrom"
wavelength_medium = "vacuum"
use = "check"
notes = "Eq. (15), p. 4472: the constant term 1.383 729 930 a0^3, the 4He static polarizability with the alpha^2 relativistic correction (-8.0029e-5 in reduced units, Eq. 12), no QED; Eq. (13) gives it in reduced units as 1.383 160 981. Puchalski et al. (2016) quote 1.383729929; their recommended total is 1.38376077(14), 22 ppm higher, mostly QED. Superseded: a check."

[[datasets]]
id = "refractivity_theory"
material = "He"
table = "text"
points = [
  ["5462.258", "5462.258", "34.88646"],
  ["6329.9", "6329.9", "34.81673"],
]
quantity = "refractivity"
scale = 1e-6
abscissa_unit = "angstrom"
wavelength_medium = "vacuum"
state = "1atm_0C"
density = "ideal"
use = "check"
notes = "p. 4472: Eq. (17) evaluated, '34.886 46 +- 0.000 02' at 5462.258 A and '34.816 73 +- 0.000 01' at 6329.9 A, (n - 1) x 1e6 at Loschmidt's density (Eq. 16: 0 degrees C, 1 atm, ideal gas); the +- is 'the value of the last term included', not an uncertainty, and is not stored. Eq. (17) as printed reproduces both; with the corrected coefficients they are 34.88638 and 34.81667 (see the source notes). A check."

