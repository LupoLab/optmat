citation = "W. L. Wiese, J. W. Brault, K. Danzmann, V. Helbig and M. Kock, \"Unified set of atomic transition probabilities for neutral argon\", Phys. Rev. A 39, 2461 (1989)"
doi = "10.1103/physreva.39.2461"
library = "Wiese_1989_UnifiedSetAtomic"
identity = "VALIDATED_WITH_WARNINGS"
kind = "compilation"
technique = """Critical evaluation of the Ar I 4s-4p and 4s-5p transition probabilities: \
4s-4p scaled to Quadfasel and Helbig's laser-induced-fluorescence lifetimes of the ten \
4p levels, the individual lines the average of Nick and Helbig's branching ratios and \
Shumaker and Popenoe's emission data (Chang and Setser's branching ratios where Nick \
and Helbig have none); 4s-5p from three wall-stabilised-arc emission sets normalised \
to A(430.010 nm) = 3.77e5 s-1. The scale of the 4s-5p array set by the authors' own \
measurement: branching ratios of all 16 lines from 5p[5/2]2 (Fourier-transform \
spectrometer, hollow-cathode lamp, 400-6100 nm) with its LIF lifetime."""
notes = """Identity: Physical Review A, volume 39, number 5, 1 March 1989, pp. \
2461-2471, W. L. Wiese (NIST), J. W. Brault, K. Danzmann, V. Helbig, M. Kock, "Unified \
set of atomic transition probabilities for neutral argon" (first page of the scanned \
PDF; no text layer). NIST ASD's Ar I transition probabilities cite this paper (its \
bibliographic key T5223, resolved 2026-10-09).

Taken (TC-1011's quantities): the transition probabilities of Tables IV, VI and I \
(dataset notes) and the adopted lifetime of 5p[5/2]2. A file's row is the printed air \
wavelength (nm; unique in each table; standard air: 811.531 nm against NIST's vacuum \
811.754 nm); x is the transition in the paper's Racah notation, lower-upper \
(4s[3/2]2-4p[5/2]3: nl[K]J, a prime for the 2P1/2 core, the parity mark dropped), as \
printed; the misprinted labels are corrected by errata. The paper prints no oscillator \
strength, no gf and no statistical weights (an f converted from A would be derived).

NOT TAKEN: Table II (p. 2465, tbl_c3d2bc60d69f), the ten 4p lifetimes of other papers \
(Quadfasel and Helbig, Chang and Setser, Shumaker and Popenoe renormalised by 0.85, \
Musiol et al., Lilly's theory): reproduced, and Table IV carries their scale. The \
authors' own LIF lifetime of 5p[5/2]2, 152 +- 7 ns (p. 2463), enters the adopted \
153 ns, which is taken. Table I's branching ratios 100R: its A carry them.

Not taken: Table III (4s-4p A of five lines by Nick and Helbig, Nubbemeyer, Shumaker \
and Popenoe, 1e5 s-1), Table V (4s-5p emission sets of Wende, Bues et al., Jones and \
Wiese), Table VII (ratios of A between 4s-4p and 4s-5p lines), Fig. 2 (A(430.010) of \
15 emission experiments): other papers' values, and Table I's level energies \
(reproduced; NIST holds the levels).

Levels: the paper's Racah (jK) labels nl[K]_J, primed for the 2P1/2 core, are NIST's \
configuration (2P*<3/2>).nl or (2P*<1/2>).nl, term 2[K] (with * for the odd 4s, 3d, \
5s levels) and J. Paschen: 1s5, 1s4, 1s3, 1s2 = 4s[3/2]2, 4s[3/2]1, 4s'[1/2]0, \
4s'[1/2]1; 2p1-2p10 = 4p'[1/2]0, 4p'[1/2]1, 4p'[3/2]2, 4p'[3/2]1, 4p[1/2]0, 4p[3/2]2, \
4p[3/2]1, 4p[5/2]2, 4p[5/2]3, 4p[1/2]1 (descending energy; Table II lists the levels \
in this order and the text gives 2p4's lifetime, 29.3 ns, as Table II's 4p'[3/2]1; \
"5p[5/2]2 (3p8 in Paschen notation)", p. 2462). Every line of Tables I, IV and VI was \
identified by its printed wavelength among NIST's level pairs (air wavelengths from \
NIST's levels; residual <= 0.0006 nm in Tables IV and VI but 750.384 nm, 0.0028).

Misprints (labels and level energies; no A affected; the labels of taken rows are \
corrected by the errata below): Table IV prints 4p[1/2]1 for \
696.543 nm (4p'[1/2]1, as Table III) and 4p'[3/2]2 for 763.511 nm (4p[3/2]2); Tables \
II, IV and VI print every [5/2]2 level primed (4p'[5/2]2 at 978.450, 842.465 and \
801.479 nm; 5p'[5/2]2 at 462.844, 430.010 and 419.071 nm), which cannot exist (K = 1/2, \
3/2 on the 2P1/2 core) and the text writes 5p[5/2]2; Table VI prints 5p[1/2]1 for \
394.898 nm (5p'[1/2]1; the 4s[3/2]2 group would list 5p[1/2]1 twice). Table I prints \
5s[5/2]2 for 5s[3/2]2 (2831.415 nm), 5s[1/2]1 for 5s'[1/2]1 (4938.586 nm), E_i \
"99 143.80" for 93 143.80 (4s[3/2]2: only 93 143.80 gives the printed 419.071 nm) and \
"114 716.61" for 113 716.61 (3d[5/2]3: only 113 716.61 gives 3045.369 nm). Table IV's \
750.384 nm is 750.387 in Table III and from NIST's levels. Table V's footnote d gives \
the lifetime-branching-ratio A of 462.844 nm as 0.0383 "(see Table II)": Table I has \
0.0396, and 0.0383 is Table VI's recommended value, which footnote a says includes it.

Comparison with NIST ASD (TC-983, Ar_I_lines_nir.tsv, vacuum wavelengths): NIST holds \
29 of Table IV's lines with an A (all but the <0.001 one), 28 from this paper (T5223) \
and 1148.811 nm from Shumaker and Popenoe renormalised (T1242n, 1.9e5 s-1, the same \
as Table IV's 0.19e6). Ratio Table IV / NIST: mean 0.9996, mean |deviation| 0.17 %, \
largest 1.1 % (750.384 nm, 44.5 against 4.5e7): every difference is NIST's rounding to \
two or three digits. NIST's grades follow the paper's uncertainties (+-5 % B+, +-8 % \
and +-10 % B, +-15 % C+). Table VI against NIST: 28 lines, mean 0.9987, largest 1.1 %, \
all within NIST's rounding. The agreement is NIST quoting this paper, not an \
independent check. The radiative widths sum A per 4p level give 1/sum A = 22.35 (2p1), \
28.39, 28.93, 30.17, 24.88, 29.04, 29.70, 31.01, 30.21, 39.22 ns (2p10), within 3 % \
of Quadfasel and Helbig's lifetimes (Table II) the scale was set by (the 4p levels \
decay only to 4s, p. 2464). The cells were checked against the table images one by \
one (2026-10-09); tools/extract/wiese_1989.py checks the labels against NIST's levels."""

