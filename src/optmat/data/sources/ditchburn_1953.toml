abscissa_unit = "cm-1"
wavelength_medium = "vacuum"
use = "primary"
notes = "Table 1 columns 4-6: the mean wave number and mean alpha (cm^-1 at 1 atm, 0 C) of 21 groups of neighbouring lines (both paths), the points of Fig. 4; scale = 1e18 / 2.705e19 (the paper's N) to Mb. sigma is the printed +- (probable error, 'certainly correct within a factor of 2'; see the record's notes: the printed errors are about 80 n^-1/2, not the stated 60 n^-1/2). The group ending at 63810 cm^-1 (printed 64108, 277 +- 16) does not reproduce from its lines (63919, 291.8): kept as printed, doubt queued. Temperature not stated (room temperature)."
