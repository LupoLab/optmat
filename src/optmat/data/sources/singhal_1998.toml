WHY NOTHING IS TAKEN. The new measurements are in figures only, both raster images: \
Fig. 1, the ratio of NO2+ to NO+ yields against intensity at 750 and 375 nm, 90 fs \
('There is no dependence of the ratio on laser intensity for 750 nm. For 375 nm, the \
ratio shows a modest increase with intensity and reflects the onset of NO saturation'); \
Fig. 2, the same ratio against pulse duration (90 fs to 1.5 ps) at 750 nm, rising \
'systematic[ally] and large[ly]' as the pulse shortens. Fig. 3 shows CO2 spectra (90 fs \
against 35 ps). The numbers in the text are not fragmentation ratios:
- 'For 90 fs pulse width the ratio NO2+/NO+ shows little or no dependence on laser \
intensity ... However, the parent-ion yield is about 10 times larger at 750 nm than it \
is at 375 nm' (p. 644); whether the factor 10 is of the ratio or of the NO2+ yield is \
not said (Fig. 1 plots the ratio).
- For 90 fs, 'the intensity dependence of both NO and NO2 ion production [is] 3.0-3.5 \
for 750 nm and 2.2-2.9 for 375 nm' (p. 644; log-log slopes; no quantity holds them).
- The intensity range: 'up to 2.3 x 10^14 W cm^-2' (abstract) and 'up to 2.5 x 10^14' \
(p. 644), as printed.

QUOTED, NOT TAKEN: Vijayalakshmi et al.'s slopes of NO2+/NO+, n = 2.4 (532 nm) and 5.5 \
(590 nm), and from them n = 8.4 for NO2+ with He & Becker's NO slope 2.9 (pp. 643-644); \
Keldysh parameters of their data 4.30, 3.88 and 2.15 at 532, 590 and 1064 nm (p. 645, \
computed with the printed formula gamma = [E_i / (1.87e-13 I lambda^2)]^(1/2), E_i in \
eV, I in W/cm2, lambda in um). The paper argues that in the multiphoton regime NO2 is \
ionised before it dissociates in a 90 fs pulse, so short pulses keep the parent ion, \
and that the intensity dependence of the ratio in Vijayalakshmi et al.'s picosecond \
data cannot come from ionisation followed by dissociation.

FIGURES FOR LATER (TC-968; raster): Fig. 1 (NO2+/NO+ against intensity, 750 and 375 nm, \
90 fs) and Fig. 2 (against pulse duration, 750 nm). The intensity is not calibrated in \
this comment."""
