citation = "W. F. Chan, G. Cooper, X. Guo, G. R. Burton, and C. E. Brion, Phys. Rev. A 46, 149 (1992)"
doi = "10.1103/physreva.46.149"
library = "Chan_1992_AbsoluteOpticalOscillator"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Dipole (e,e) spectroscopy: fast-electron energy-loss spectra at zero scattering \
angle (optical limit) converted to relative optical oscillator strengths with the \
spectrometer's Bethe-Born factor. Low resolution (about 1 eV FWHM, 8 keV impact \
energy): Ar 10-500, Kr 8-380, Xe 7-398 eV. High resolution (0.048 eV FWHM, 3 keV; also \
0.072 and 0.098 eV): the discrete spectra and the ms autoionising resonances, peaks \
fitted where unresolved. Absolute scales by single-point normalisation to Samson and \
Yin's (1989) photoabsorption cross sections at 21.218 eV (Ar, Kr) and 16.848 eV (Xe), \
in smooth continuum; no line-saturation effects (pp. 150-151). Energy scales calibrated on \
11.828 eV (Ar), 10.033 eV (Kr), 8.437 eV (Xe) (low resolution) and the He 21.218 eV \
line admitted with the sample (high resolution)."""
notes = """Part III of the series (journal pages 149-171 = PDF pages 1-23) (He: Chan et al. 1991, Ne: Chan et al. 1992, Phys. Rev. A \
45, 1420, curated as chan_1992_neon). Values per atom; no density or state involved.

Continuum (Tables I-III): df/dE in 10^-2 eV^-1 at photon energy E (eV), 'uncertainties \
... estimated to be ~5%' (p. 151); sigma(Mb) = 109.75 df/dE(eV^-1) (table notes). The \
first rows (16.0 eV Ar, 14.7 eV Kr, 13.5 eV Xe) are just above the first ionisation \
potential; the 1 eV resolution smooths the autoionising structure (shown at high \
resolution in Figs. 14-16 only, not tabulated). Argon Table I (continued) prints \
'208.0' for 308.0 eV (erratum).

Discrete lines (Tables IV-IX): the present oscillator strengths with their estimated \
uncertainties in parentheses (5 % for the resonance lines, 10 % for the others), and \
the literature values the tables compare, each extracted as a reproduced dataset per \
source and gas (one file per source combining the two tables of a gas; energies are \
the table headers' transition energies from Moore's tables). Resonance lines: Ar a_1 \
= 4s 11.624 eV, a_2 = 4s' 11.828 eV; Kr b_1 = 5s 10.033, b_2 = 5s' 10.644 eV; Xe c_1 = \
6s 8.437, c_2 = 6s' 9.570 eV. The 'Oscillator strength ratio' columns (a_1/a_2 etc.) \
are derived and not extracted; every printed ratio agrees with its row's values to \
0.001 except Lewis's xenon row (see its dataset). Upper limits are not extracted: \
present work Xe '<0.001' at 10.979, 11.495 and 11.583 eV; Geiger [83] Ar '<0.0025' at \
13.864 eV. Summed theory values (note b, a_1 + a_2 etc.) and the 'Total to ionization' \
column are separate datasets with an index abscissa. The text gives the present sums \
a_1 + a_2 = 0.331 and b_1 + b_2 = 0.407 (pp. 163, 166), and the totals 0.859 (Ar), 1.126 (Kr), \
1.606 (Xe), compared with 0.82 (Lee), 0.827 (Natali et al.), 1.10 (Natali et al.), 1.640 \
(Geiger), and Eggarter's (1975) 0.793 for Ar (pp. 165-168, text only, not extracted).

Transition labels: the header underlines distinguish nd[3/2] from nd[1/2] (Tables V, \
VII, IX note a); the library cells lose the underline, so labels such as '(2P3/2)6d' \
repeat. The row ids are the energies, which are unique; the labels are kept in the \
printed column.

Erratum: the authors' erratum, Phys. Rev. A 48, 858 (1993) (chan_1993_erratum), reprints \
Tables V, VII and IX whole because 'some values ... were incorrectly positioned': three \
rows printed one value for an unresolved group of lines under every line of the group \
(present work Ar 7s + 5d-underlined; Geiger [82] Kr 5d-underlined + 7s and 6d-underlined \
+ 8s; Delage and Carette [81] Xe 9s + 5d' and 8d + 8d-underlined + 10s). The files keep \
the 1992 printing; each group's value is kept once, at the row of the group's strongest \
line in the present work (for the unresolved Ar pair, in Natali et al.'s resolved values), \
and the repeats are excluded_rows (TC-710).

Sums of the discrete tables are not sum-rule checks: the tables stop below the 2P_3/2 \
threshold and omit higher members. Not extracted: the autoionising-region spectra \
(Figs. 14-16, figures only)."""

