citation = "J. A. R. Samson, Z. X. He, L. Yin and G. N. Haddad, \"Precision measurements of the absolute photoionization cross sections of He\", J. Phys. B: At. Mol. Opt. Phys. 27, 887 (1994)"
doi = "10.1088/0953-4075/27/5/008"
library = "Samson_1994_PrecisionMeasurementsAbsolute"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Total absorption cross sections from a double ion chamber, sigma = (1/nL) \
ln(i1/i2) (Eq. 1), with a 6 kV spark-discharge line source and a 2.2 m grazing-incidence \
monochromator (discrete lines 10-120 eV, free of higher orders and scattered light); \
pressure from a calibrated capacitance manometer (0.5 %), picoammeters interchanged to \
cancel their calibration; each point the average of 5-12 measurements (pp. 887-888). \
Above 120 eV an extrapolation fitted to Watson's (1972) and Denne's (1970) data, and \
above 280 eV predicted values interpolated to Bearden's (1966) attenuation data \
corrected for N2 impurity and for Rayleigh and Compton scattering (pp. 892-896)."""
notes = """Below the double-ionization threshold these absorption cross sections are the \
photoionization cross sections (the paper uses the terms interchangeably); 'Below 1.5 \
keV the cross sections can be considered to be equal to the photoionization cross \
sections' (p. 894); above, scattering was subtracted. Photon energies in eV (the \
ionization threshold 24.587 eV).

Accuracy (pp. 887-889): '+-1 % to +-1.5 % from threshold to about 60 eV and ... +-2 % \
from 60 to 120 eV' (p. 887); 'Each data point has an accuracy of +-1 %' between 24.6 \
and 48 eV (p. 888); '+-1 % and +-1.5 %' in the 45-75 eV resonance region (p. 889); \
'estimated error of +-2 % between 67 and 120 eV' (p. 889). The values of Table 1 are \
the best fit to the data (the resonance rows 60.19-65.40 eV are measured points in the \
2snp autoionizing region: 0.55 Mb at 60.19 eV is the window of the first resonance), \
extrapolated above 120 eV. The predicted 280-8000 eV values: 'the absolute error of \
these cross sections are estimated to be less than +-10 % assuming equation (3) to be \
valid' (p. 895). Comparisons (pp. 889-896): Chan et al. (1991, chan_1991) within 2-5 % \
to 75 eV and +-2 % at 67-110 eV, too high above; Marr and West (1976) up to 26 % low at \
170 eV; Henke et al. (1993, henke_1993) 10-30 % above the predicted values at 1-8 keV; \
Bell and Kingston within 5 % at 240-700 eV.

Table 3 (not extracted: oscillator strengths of energy ranges, not a vocabulary \
quantity), p. 897: 24.6-120 eV 1.4194 +- 0.021; 120-280 eV 0.1053 +- 0.003; 280 eV-inf \
0.0249 +- 0.0025; discrete lines (Chan et al. 1991) 0.4310 +- 0.020; total 1.981 +- \
0.047 against the Thomas-Reiche-Kuhn value 2. A trapezoidal integration of Tables 1 \
and 2 (df/dE = sigma/109.76 Mb eV; computed here) gives 1.394 (1.410 without the 60.19 \
eV window point), 0.113 and 0.023: the 120-280 eV entry of Table 3 is not reproduced \
(7 % lower than the tabulated cross sections imply), the total continuum (1.53 vs \
1.55) agrees to 1.5 %."""

