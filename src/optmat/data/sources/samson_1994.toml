state = "none (per atom)"
density = "none"
range = "140-280 eV ('with an accuracy of +-1 %')"
coefficients = { a = "403", p = "-3.05" }
check = "Gives 0.1620, 0.05460 and 0.01956 Mb at 140, 200 and 280 eV against Table 1's 0.160, 0.0550 and 0.0194 (+1.3 %, -0.7 %, +0.8 %; checked 2026-09-24)."
notes = "A power law for the photoionization cross section; no form in the vocabulary (cross-section formulas are not dispersion forms)."

[[formulas]]
id = "eq3"
material = "He"
equation = "Eq. (3), p. 894"
printed = "sigma (b) = 410 E (keV)^-3.5"
variable = "E: photon energy in keV; sigma: photoionization cross section in barns"
state = "none (per atom)"
density = "none"
range = "the photoionization cross sections derived from Bearden's and McCrary et al.'s attenuation data, about 3-8 keV"
coefficients = { a = "410", p = "-3.5" }
check = "Gives 8.767, 1.467 and 0.2831 b at 3, 5 and 8 keV against Table 2's 8.77, 1.47 and 0.28 (checked 2026-09-24). The paper: Bell and Kingston's velocity form gives 5.74 b at 3.5 keV against 5.11 b from Eq. (3), 12 % (p. 895)."
notes = "With Bearden's uncorrected data the constant would be 510 (480 in Samson et al. 1993, p. 894)."

