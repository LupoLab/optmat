notes = "Table 2 (p. 5359), last cell, '(0.96 +- 0.13)^d': 'Uncorrected average. The error refers to a combination of random errors and systematic errors (8 % in F, 6 % in [N2O5], 6 % in sigma(N2O5), and 6 % in the absorption cross section of NO3 at 662 nm)' (page image checked); level not stated. The same 0.96 +- 0.13 on p. 5358. 250-355 torr N2, 298 K. The random-only averages are 0.958 +- 0.060 (all runs) and 0.955 +- 0.064, 0.961 +- 0.062 (the two pressures), 2 sigma. Harwood et al.'s re-evaluation with a later NO3 cross section is 0.77 +- 0.13; harwood_1998 measured 0.64 +- 0.10 (TC-975)."
