notes = "Table 1 (p. 5356), last column 'Phi +- Accuracy': the O(3P) yield at 248, 266, 286.9 and 288.9 nm, 75 torr N2, 298 K. The accuracy includes the systematic error (~20 %, p. 5358); its level is not stated. The 266 nm value averages two sets of runs (0.36 +- 0.05 and 0.42 +- 0.06, 2 sigma; footnote g); the 286.9 and 288.9 nm values are corrected for O(3P) from NO2 (footnote h; uncorrected 0.21-0.28 and 0.16-0.19)."
