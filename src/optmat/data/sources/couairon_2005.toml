use = "primary"
notes = "p. 125435-5: n2 = lambda0^2/(2 pi n0 P_cr) with n0 = 1.45 and the measured P_cr = 1.98 MW (source notes); used in the simulations. PART: the model's Kerr term is n2 [(1 - f_R)|E|^2 + f_R int R |E|^2] with f_R = 0.18, and for the 160-fs pulses 'max P~_in(t) = 1.002 P_in ... due to the rather long pulse durations compared to the characteristic response time for the delayed component': the value includes the Raman (delayed) part, recorded as total. No uncertainty stated. Grade of the fused silica not stated."
[datasets.parameters]
part = "total"
coefficient = "self"
pulse_fs = 160
technique = "shift of the nonlinear focus (damage-track position) against peak power, fitted with the extended Marburger formula, Eqs. (9)-(12)"
