check = "Gives k'' = 361.38 fs2/cm at 800 nm (printed 361) and n = 1.45331. The coefficients are the refractiveindex.info SiO2/Malitson page's (0.6961663, 0.0684043, 0.4079426, 0.1162414, 0.8974794, 9.896161) rounded to four decimals; n differs from the unrounded formula by -2.7e-5 at 0.3 um, -5.8e-6 at 0.8 um, -3.8e-6 at 3 um (checked 2026-09-26)."
notes = "Uncited in the paper; recorded without a form because it prints the resonance wavelengths lambda_m, not C = lambda_m^2, and is a rounded copy of Malitson's formula (malitson_1965, curated in another extraction), which is the original to build."

[[formulas]]
id = "propagation_model"
material = "SiO2"
equation = "Eqs. (1)-(6), pp. 125435-2 to -3"
printed = "U dE/dz = i[nabla_perp^2/(2k) + (U + L/(2k)) L] E + i N(E) (2); N(E) = k0 n2 T^2 [(1 - f_R)|E(t)|^2 + f_R int_-inf^t dtau R(tau - t)|E(tau)|^2] E(t) - (sigma/2)(1 + i omega0 tau_c) rho E - (T/2) W_PI(|E|^2) U_i E / |E|^2 (4); sigma = k e^2/(n0^2 omega0^2 eps0 m) x omega0 tau_c/(1 + omega0^2 tau_c^2) (5); d rho/dt = W_PI(|E|) + (sigma/U_i) rho |E|^2 - rho/tau_r (6)"
variable = "E: envelope (|E|^2 an intensity); T = 1 + (i/omega0) d/dt; U(omega) = 1 + omega/(k v_g); L(omega) = n(omega) omega/c - k - omega/v_g"
coefficients = { n0 = "1.45", n2 = "3.54e-16 cm^2/W", f_R = "0.18", tau_d = "32 fs", tau_s = "12 fs", tau_c = "1e-14 s", U_i = "9 eV", tau_r = "150 fs", m = "0.64 m_e", rho_at = "2.1e22 cm^-3" }
check = "The Drude sigma of Eq. (5) peaks at omega0 tau_c = 1 (tau_c = 0.425 fs at 800 nm); at tau_c = 1e-14 s it is 1.32e-18 cm2 with m = m_e and n0 = 1.45 (not printed; computed 2026-09-26)."
notes = "The input pulse E(r, t, 0) = E0 exp(-r^2/w0^2 - t^2/t_p^2 - i k r^2/(2f)), P_in = E_in/(t_p sqrt(pi/2)), E0^2 = 2 P_in/(pi w0^2) (Eq. 1). The recombination term is a single exponential 'valid only for the description of an electron-hole plasma' (p. 125435-6)."

[[formulas]]
id = "keldysh_rate"
material = "SiO2"
equation = "Eqs. (7)-(8), p. 125435-3"
printed = "W_PI(|E|) = (2 omega0/(9 pi)) (omega0 m/(hbar sqrt(Gamma)))^(3/2) Q(gamma, x) exp(-alpha <x + 1>); Gamma = gamma^2/(1 + gamma^2), Xi = 1/(1 + gamma^2); Q(gamma, x) = sqrt(pi/(2 K(Xi))) sum_{n=0}^inf exp(-n alpha) Phi(sqrt(beta (n + 2 nu))); alpha = pi (K(Gamma) - E(Gamma))/E(Xi), beta = pi^2/(4 K(Xi) E(Xi)); x = (2/pi)(U_i/(hbar omega0)) E(Xi)/sqrt(Gamma), nu = <x + 1> - x"
variable = "gamma = omega0 sqrt(m U_i)/(e E) the adiabaticity parameter; K, E the complete elliptic integrals of the first and second kind with parameter X (Abramowitz and Stegun), <.> the integer part, Phi Dawson's function"
coefficients = { U_i = "9 eV", m = "0.64 m_e" }
reproduced_from = ["L. V. Keldysh, Sov. Phys. JETP 20, 1307 (1965)"]
check = "gamma = 1 at I = 3.5e13 W/cm2 reproduced (0.999) with m = 0.64 m_e, U_i = 9 eV and I = n0 c eps0 |E|^2/2, n0 = 1.45 (checked 2026-09-26). The printed W_PI = 1.6e32 cm^-3 s^-1 at that intensity (dataset keldysh_rate) is the value to reproduce; not yet done here."
notes = "The authors note (p. 125435-3) that Keldysh's Eq. (39) contains K(X^1/2) and E(X^1/2) where Eqs. (7)-(8) contain K(X) and E(X) (the Abramowitz-Stegun parameter convention), and that their beta is divided by 4 where Keldysh's is divided by 2, 'in agreement with these definitions and with Ref. 42'."

[[formulas]]
id = "nonlinear_focus"
material = "SiO2"
equation = "Eqs. (9)-(12), pp. 125435-4 to -5"
printed = "z_nf = 0.367 z_R / sqrt([(max_t P~_in(t)/P_cr)^(1/2) - 0.852]^2 - 0.0219) (9); P~_in(t) = P_in [(1 - f_R) exp(-2(t/t_p)^2) + f_R int R(tau - t) exp(-2(tau/t_p)^2) dtau] (10); delta = f^2/(f + z_nf) (11); sqrt(P_in/P_cr*) - 1 = -0.148 + sqrt(0.148^2 + 0.367^2 d delta^2/(f (f - delta)^2)) (12)"
variable = "z_R: Rayleigh length; f the lens focal length; delta the shift of the nonlinear focus; P_cr* = P_cr/1.002 for 160-fs pulses"
coefficients = { a = "0.367", b = "0.852", c = "0.0219" }
reproduced_from = ["J. H. Marburger, Prog. Quantum Electron. 4, 35 (1975)", "A. Couairon, Eur. Phys. J. D 27, 159 (2003)"]
check = "max P~_in = 1.002 P_in for 160 fs (printed); not recomputed. The intercept sqrt(P_in) = 1.4 MW^(1/2) gives 1.964 MW, P_cr printed 1.98 MW (2026-09-26)."
notes = "Marburger's formula extended to a Kerr medium with a delayed (Raman) component (ref. 50)."
