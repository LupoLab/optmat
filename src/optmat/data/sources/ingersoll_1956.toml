citation = "L. R. Ingersoll and D. H. Liebenberg, J. Opt. Soc. Am. 46, 538 (1956)"
doi = "10.1364/josa.46.000538"
library = "Ingersoll_1956_FaradayEffectGases"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Photoelectric Faraday-rotation method of the first paper (ingersoll_1954): a \
20 m folded (White) path in a 175 cm solenoid (about 300 Oe), polaroid chopper and \
phototube, rotations of a fraction of a second of arc; interference filters, among \
them new multilayer filters of 13 and 70 A band width (wavelength probable error \
about 3 A with those, of the order of 10 A otherwise); zero error (empty chamber) \
measured, 0.09 min at 3635 A to 0.008 min at 9875 A; scale by comparison with the \
Verdet constant of water, redone for this paper; about 17 C, pressures near 1 atm \
(pp. 1-3)."""
notes = """The Verdet constant is in microminutes of arc per oersted-centimeter 'calculated \
for 76 cm mercury absolute pressure, at 0 C' (p. 2), with the perfect-gas law (first \
paper): state 1 atm, 0 C, density ideal. 'The values listed have all been taken from \
smoothed curves. The departures of the actual measurements from these curves average \
about 1/2%' (p. 2); the over-all probable error is not 'much below the 1% already \
given' (p. 1). The per-point uncertainty is the 1/2 % (level not stated) and the \
scale uncertainty the 1 % probable error as one standard deviation (1.48 %). \
Wavelengths are the filters' effective wavelengths; whether air or vacuum is not \
said, and air is assumed as in leonard_1974 (3e-4 relative, far below the accuracy).

The water recalibration shows that 'the former scale is almost 1% low and that the \
Verdet values in the earlier paper should be multiplied by 1.0094' (p. 1): this \
paper's values for He, Ne, H2, D2, N2 and O2 supersede ingersoll_1954's (with 'certain \
very minor corrections' besides; the 1954 values times 1.0094 agree with these to \
0.2 %, 1 % for helium at 9000 A).

Each table gives V at four common wavelengths (upper part) and the dispersion \
relative to 5780 A at 17 wavelengths (lower part). The format has no relative \
Verdet constant: the lower part is stored as printed with the dataset scale set to \
the printed V(5780) of the upper part (the product is what leonard_1974 Table V \
lists for the noble gases); the upper part is kept as a check.

leonard_1974's datasets verdet_ingersoll_liebenberg_{He,Ne,Ar,Kr,Xe} are these \
values (V(5780) times the relative dispersion, Leonard's Refs. 56, 57), now \
reproductions of this record.

Table IV (the ratio r of V to the Becquerel relation with the Cuthbertsons' (1932) or \
NBS-derived C and nu_0) is derived, not extracted; its C and nu_0 are \
cuthbertson_1932's (halved constants) or computed. Methane: Ramaseshan's r = 0.84 +- \
0.02 and nu_0 = 3.19e15 (p. 4, private communication). Not curated and skipped: \
ethane, acetylene, propane, cyclopropane, ethylene, n-butane, isobutane, freon-12. \
Carbon monoxide (curated since 2026-09-25; Table III): the sample was 93.7 % CO (CO2 0.2, \
O2 0.2, H2 3.5, N2 2.4 % by volume) and 'correction has been made ... for the \
impurities in CO' (p. 2); its dispersion departs most from the inverse square of the \
wavelength, with xenon, acetylene and ethylene (p. 1). Carbon dioxide's relative value at 9000 A, 0.373, is excluded \
(see the dataset)."""

