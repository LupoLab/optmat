quantity = "verdet_constant"
unit = "micro-arcmin/(Oe cm)"
scale = 0.474
abscissa_unit = "angstrom"
wavelength_medium = "standard_air"
state = "1atm_0C"
density = "ideal"
use = "primary"
notes = "Table I, lower part: the Faraday dispersion relative to 5780 A, from smoothed curves; scale = V(5780 A) = 0.474 from the same table's upper part (dataset absolute_He), so that the values are Verdet constants. Measured at about 194 cm (reduced to 0 C) and 17 C. Helium's 9875 A value is not printed. Leonard (leonard_1974, verdet_ingersoll_liebenberg_He) reproduces these values multiplied out."
