variable = "p: pressure in Pa; T: temperature in K; lambda = 632.8 nm (He-Ne, medium not stated)"
state = "any p, T in range (ideal gas assumed)"
density = "ideal"
range = "288.15-323.15 K, 0-110 kPa, 632.8 nm"
coefficients = { mu = "762.0e-9" }
check = "mu x 101325/293.15 = 263.38e-6; Table 5 prints 263.3 +- 0.8 (truncated). The mean of the supplement's 24 Ar runs as printed there (762.0, confidence interval 1.2, std dev 2.2). Checked 2026-09-26."
notes = "+- 1.2 is the confidence interval of the mean of 24 runs (2.576 std dev/sqrt(24): a 99 % interval; level not stated). The Gladstone-Dale and ideal-gas assumptions are the authors' (p. 1)."

