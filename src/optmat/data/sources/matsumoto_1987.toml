notes = "Table 2 (p. 148), column (n - 1)_m x 10^6: CO2 on the 10.4 um band's P(20) line (10.6 um as printed) at its centre (v0) and 25 MHz either side (v0-dv, v0+dv), each R of Table 1 times Koch's visible refractivity at 101325 Pa and 20 degrees C (417.0e-6, implied). A check: the three rows are one line, and their 2 % is larger than Marchetti and Simili's 0.3-0.7 %."
