check = "No index is printed with it. Against malitson_1962's one extraordinary index, 1.74794 at 1.01398 um (24 C, the 1959 sample): this formula gives 1.74754 there, 4.0e-4 lower, where the ordinary rays of the two differ by 5.2e-5 (Malitson's extraordinary index was measured on another sample, presumably). Birefringence 0.0091 at 0.3 um to 0.0056 at 5 um. Checked 2026-09-28."
