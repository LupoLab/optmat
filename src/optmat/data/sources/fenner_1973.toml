citation = "W. R. Fenner, H. A. Hyatt, J. M. Kellam and S. P. S. Porto, \"Raman cross section of some simple gases\", J. Opt. Soc. Am. 63, 73 (1973)"
doi = "10.1364/josa.63.000073"
library = "Fenner_1973_RamanCrossSection"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Spontaneous Raman scattering of the 488.0 nm argon-ion line (typically 500 mW, \
single pass, Brewster-window cell) at 90 deg, collected by an f/0.95 lens into a Spex \
1400 double monochromator with photon counting (EMI 6256S); the geometries z(x,x)y and \
z(x,z)y (laser polarization, scattered polarization analysed). Spectrometer response \
calibrated against an NBS standard lamp for polarized and unpolarized light. Each gas \
measured at 1, 3/4, 1/2 and 1/4 atm, the slope of count rate against pressure giving the \
cross section relative to the N2 Q branch (2331 cm-1). The absolute N2 cross section \
from the calibrated spectrometer (Eq. 6) and, separately, against the 992 cm-1 line of \
liquid benzene. Room temperature, 22 C (pp. 73-75)."""
notes = """Journal pages 73-77 = PDF pages 1-5 (page n of the PDF is p. 72 + n). Identity \
checked on the first page. The library's identity is VALIDATED_WITH_WARNINGS only \
because the PDF prints no DOI. The paper studies N2, O2, H2, CO, NO, CO2, SO2, N2O, H2S, \
NH3, ND3, CH4, C2H6 and C6H6; NO, SO2, H2S, NH3, ND3, C2H6 and C6H6 are not curated \
species and are not transcribed. SF6, D2 and O3 are not in the paper. H2 is normal \
hydrogen (room-temperature equilibrium; the paper does not say otherwise).

EXCITATION WAVELENGTH: every value is at 488.0 nm, the argon-ion line; the paper does not \
say air or vacuum. It is recorded as standard air (the line's laboratory wavelength); the \
difference, 0.14 nm, changes a nu^4 scaling by 0.1 %, far below the stated uncertainties.

TABLE I (p. 2, 'Pertinent properties of molecules studied'; image checked): the \
vibrational shift ('Vib. freq.', cm-1) and the rotational constant (cm-1) of each \
molecule, with the Raman wavelength of the line (nm), symmetry and point group. No \
source is given for the shifts or the constants and they are not measured here: the \
datasets table1_shift_* and table1_B_* are use = "check". Whether the constants are \
B_e or B_0 is not said. Table I prints CO's point group as C_inf h (it is C_inf v): not \
a value, no erratum. The Raman wavelengths (N2 550.6, O2 528.1, H2 612.3, CO 545.1, CO2 \
523.5 and 520.7, N2O 520.6 and 547.4, CH4 568.9 nm) follow from 488.0 nm and the shifts \
and are not stored.

TABLE II (p. 3, 'Ratios of differential Raman cross sections of various vibrational \
lines to that of the nu1 vibration in N2 at 488.0 nm. Other workers' results adjusted to \
488.0 nm using an assumed frequency dependence of nu_R^4'; image checked): this paper's \
column (datasets ratio_*, primary) and the other workers' columns (datasets \
ratio_*_others, reproduced; rows labelled by the column: F & C = Fouche and Chang, \
refs. 3 and 4; M, H, B = Murphy, Holzer and Bernstein, ref. 2 = murphy_1969; S, C, W = \
Stansbury, Crawford and Welsh, ref. 1; P, G, L = Penney, Goldman and Lapp, ref. 5). The \
other workers' values are not their printed numbers: Fenner et al. rescaled them to \
488.0 nm with nu_R^4. N2's row (1.0 in every column) is the reference and is not \
stored. 'We found the reproducibility of our relative ratios to be +-10% for three sets \
of measurements, each set being at a different time and with altered scattering \
dimensions' (p. 3): recorded as a relative uncertainty of 0.10, level not stated. The \
other workers' uncertainties are 'usually +-10%' (p. 4), not per value. 'H2 (sum)' is \
the sum over the Q branch, 'H2 (Q(1))' the Q(1) line alone (not defined further). \
Geometry: the paper does not say whether Table II's ratios are of the parallel component \
(z(x,x)y) or of both polarizations; Table IV's absolute value is 'for orthogonal \
scattering geometry z(x,x)y and a depolarization ratio of zero. Corrections for finite \
depolarization are typically a few percent' (p. 4). The ratios are per molecule of the \
gas (count-rate slopes against pressure).

TEXT (p. 4): the ratios obtained a second way, from the measured Rayleigh-to-Raman ratio \
of each linear molecule and the Rayleigh cross section computed from refractive indices \
(ref. 10-11: dsigma/dOmega_Ray = (3/8 pi) sigma_tot, sigma_tot = 128 pi^5 alpha^2/(3 \
lambda^4), no depolarization): 'The vibrational cross section of these molecules \
relative to the 2331-cm-1 line gave values 1.1, 1.5, 1.0, and 1.4 for molecules: O2, \
Q(1) of H2, CO, and nu1 vibration of CO2, respectively. These values are in good \
agreement with those determined by direct measurement' (datasets ratio_*_rayleigh, \
check). The Rayleigh-to-vibrational ratios themselves are not printed.

TABLE III (p. 3, 'Ratio of Raman cross sections of the rotational lines of certain \
molecules to that of the Q-branch of the nu1 vibration of the same molecule. The \
rotational cross section is the differential cross section for both polarizations at \
90 deg. All lines refers to the sum of all Stokes and anti-Stokes rotational lines; peak \
refers to the strongest Stokes line. Data taken at 22 C'; notes: H2 'Referred to Q(1) \
vibrational line', CO2 'Referred to nu1 vibrational line'; image checked): datasets \
rotational_* (peak line and all lines) and vibrot_N2, vibrot_O2 (the 'vib-rot' rows: \
'the vibrational-rotational cross section of all lines relative to the Q branch nu1 \
vibration for nitrogen and oxygen', p. 4, i.e. the O and S branches of the vibrational \
band), primary. The peak line is printed '0(J)' (N2 0(6), O2 0(7), H2 0(1), CO 0(6), \
CO2 0(16)), kept as printed: by the caption it is the strongest Stokes line (Delta J = \
+2) from level J. The peak and total are not the measured intensities themselves: the \
rotational intensities were fitted to Eq. (7), (dsigma/dOmega)_J = K C(lambda_R) nu_R^4 \
S_J exp(-hcBJ(J+1)/kT) with the Placzek-Teller S_J (3(J+1)(J+2)/(2(2J+3)) Stokes, \
3(J-1)J/(2(2J-1)) anti-Stokes), whose fitted T 'in all cases, agreed with the measured \
ambient temperature, 22 C'; 'The intensities of the strongest rotational line and the \
sum of all lines (both Stokes and anti-Stokes) were then determined from Eq. (7) and \
the least-squares value of K' (p. 4). No uncertainty is stated for Table III.

TABLE IV (p. 3, 'Absolute differential Raman cross section of the vibrational line in \
N2 at 488.0 nm. Results of other authors were adjusted using a nu_R^4 frequency \
dependence', cm2/ster-mol, i.e. cm2 sr-1 per molecule; image checked): \
- 'This paper - calibrated spectrometer' 3.3 +- 1.1 x 10^-31 (dataset absolute_N2, \
primary): 'We believe the result using the calibrated spectrometer to be our most \
accurate' (p. 4). 'Our value 3.3 x 10^-31 cm2/sr-mol represents the statistical mean of \
six individual determinations ... The average deviation from the mean value for these \
determinations was +-0.2 x 10^-31 cm2/sr or +-5%. However, the correct percentage \
numerical uncertainty (+-35%) was determined by estimation of the uncertainty of each of \
the eight independent parameters in Eq. (6) and application of standard error analysis' \
(p. 4). The printed +-1.1 is that estimate (level not stated). \
- 'This paper - comparison with nu2 of C6H6' 4.3 x 10^-31 (absolute_N2_benzene, check), \
with the benzene standard 3.25 x 10^-29 cm2/ster-mol of Kato and Takuma (ref. 12, J. \
Opt. Soc. Am. 61, 347 (1971)); 'subject to more experimental uncertainty' (p. 4). \
- Others (absolute_N2_others, reproduced): P, G, & L (ref. 5) 5.5 +- 0.3; F & C (ref. \
4) 5.6 +- 2.2; M, H, & B (ref. 2, murphy_1969) 5.5; S, C, & W (ref. 1) 4.8, all x \
10^-31 and rescaled to 488.0 nm by the authors. \
The geometry of the absolute values: z(x,x)y, i.e. the component polarized parallel to \
the laser, with a depolarization ratio taken as zero (p. 4). The authors' own later \
value is hyatt_1973 (5.4 +- 0.3 x 10^-31 at 488.0 nm, against the H2 rotational line), \
64 % above this paper's 3.3; Danichkin et al.'s survey recommends \
5.5 +- 0.2 (danichkin_1981).

ABSOLUTE CROSS SECTIONS OF OTHER LINES follow from Tables II-IV (p. 4); none is printed.

DEPOLARIZATION: no depolarization ratio is tabulated. The primary lines 'are of A1 \
symmetry with very small depolarized component' (p. 1); the rotational lines are \
depolarized.

REPRODUCTIONS ELSEWHERE: danichkin_1981 cites this paper as its ref. [12] in its Table 1 \
ratios (O2, H2, CO, CO2, N2O, CH4) and Table 2 (the two absolute values), converted by \
Danichkin et al. to their system (both polarization components, per molecule of the \
lower level): see that record."""

