citation = "D. Daumont, J. Brion, J. Charbonnier and J. Malicet, \"Ozone UV spectroscopy I: Absorption cross-sections at room temperature\", J. Atmos. Chem. 15, 145 (1992)"
doi = "10.1007/bf00053756"
library = "Daumont_1992_OzoneUVSpectroscopy"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Absorption with monochromatic light (to limit photodissociation): a 1.5 m \
Czerny-Turner monochromator (Jobin-Yvon THR 1500, 2400 lines/mm) with an Amici-prism \
premonochromator or a narrow-band filter, deuterium lamp below 300 nm and tungsten above, \
Hamamatsu R929 photomultiplier; quartz cells of 3.285 +- 0.001 cm (195-335 nm, 1-600 \
Torr O3) and 81.50 +- 0.05 cm (320-350 nm, 20-200 Torr) at 295 K (methanol circulation, \
stable to 0.05 K); pressures by a precalibrated MKS Baratron; 15 nm regions with 5 nm \
overlap, 10 scans each (Table I, p. 151). Ozone concentration by two new methods: \
method 1, the continuous pressure measurement p_O3 = 2[(p_O2)_i - p_T] during the \
spontaneous decomposition 2 O3 -> 3 O2 (Eqs. 4-6), used for the whole range; method 2, \
the vapour pressure of liquid ozone at the boiling point of liquid argon (Mauersberger \
et al. 1985), for the strong absorption near 254 nm only (pp. 147-149)."""
notes = """Identity checked against the first page (PDF page 1, journal p. 145): Daumont, \
Brion, Charbonnier and Malicet, J. Atmos. Chem. 15, 145-155 (1992), 'Ozone UV \
Spectroscopy I'. Journal pages 145-155 = PDF pages 1-11. O3 only.

Facts for the data files (Brion/Daumont/Malicet, 'BDM'):
- The spectrum: 'New measurements based on the method of the continuous pressure \
measurements (method 1) have been obtained at room temperature for the entire 195-345 \
nm range, by steps of 0.01 nm. They extend and slightly change the values of a \
preliminary work (Malicet et al., 1984). A complete set of data ... is available on \
floppy disk ... on request from the authors' (p. 151). This paper's data are the 295 K \
BDM set (later extended and superseded by the temperature series, malicet_1995, and the \
Reims files); Figs. 1-3 only, no table of the spectrum.
- Temperature: 295 K (Table I; cell regulated to 0.05 K).
- Wavelengths: AIR. 'The wavelength calibration in air is obtained by the reference \
lines of an iron hollow cathode and mercury and cadmium lamps. The precision is better \
than 0.005 nm' (p. 150). Table III's Hg I lines are air wavelengths (253.65 nm).
- Sampling 0.01 nm (p. 151); the spectral resolution (slit width) is not stated.
- Absolute scale: method 1 (pressure during decomposition); checked at 253.65 nm \
against method 2 (dew point) and Mauersberger et al.'s mass-spectrometric value (below); \
not normalised to anything.
- Uncertainty (Table II, image checked, p. 152): optical path 0.05 %, ozone pressure \
0.1 %, temperature 0.02 %, absorbance (lambda < 335 nm) 1 %, impurities < 0.1 %, \
wavelength (Delta lambda = 0.005 nm) 0-0.05 % (Hartley) and 0-0.8 % (Huggins); total \
error 1.3 % (Hartley band) and 1.3-2.5 % (Huggins band); random errors (RMS) 0.9-2.2 %. \
Text (p. 151): 'the accuracy of the measurements is about 1-1.5% in the Hartley band \
and 1-3% in the Huggins bands'. Level not stated. Internal consistency over a 1:20 \
pressure ratio and 3.3 and 80 cm paths 'below the uncertainty values (1 to 2%)' (p. 152).

254 nm (p. 152): method 1 (113.05 +- 1.1) x 10^-19 cm^2 (printed '113.0_5', the 5 \
subscript), method 2 (112.6 +- 2.0) x 10^-19, Mauersberger et al. (1987) (113.6 +- 0.5) \
x 10^-19 ('we suggest taking it as a new standard', abstract); Hearn's (1961) (114.7 +- \
2.4) x 10^-19 used by Bass and Paur is 'about 1% too high' (p. 146, p. 148).

Comparisons (p. 153): below 225 nm within 1 % of Molina and Molina; Inn and Tanaka \
(inn_1953_ozone) 3-7 % lower there, 'inaccurate'; above 225 nm Molina and Molina 1-3 % \
higher on average (4-6 % locally above 325 nm); Bass and Paur 0-2 % higher, within 1 % \
once renormalised to Mauersberger's 254 nm value, but shifted in wavelength by up to \
0.05 nm in the Huggins bands (Molina and Molina red-shifted 0.04-0.06 nm from Bass and \
Paur).

Datasets: Table III (image checked). The columns carry no unit; the text's 253.65 nm \
value (113.05 x 10^-19 cm^2) fixes it: scale = 1e-19 to cm^2. The present values are \
points of this paper's own spectrum (the BDM data file), so they are 'check' (checks on the data files; primary beside the file would count them twice)."""

