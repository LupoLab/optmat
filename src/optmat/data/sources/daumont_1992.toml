notes = "Table III 'Present work': method 1 at five Hg I lines (air wavelengths; the medium is laboratory air, converted as standard air), 295 K. 1.3 % total error in the Hartley band, 1.3-2.5 % in the Huggins band (Table II; 2.5 % given to 334.15 nm, the Huggins band); the 253.65 nm value is quoted +-1.1 (1 %) in the text. Points of the BDM spectrum: a check."
