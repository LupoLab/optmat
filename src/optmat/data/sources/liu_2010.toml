citation = "J. Liu, D. Sprecher, C. Jungen, W. Ubachs and F. Merkt, \"Determination of the ionization and dissociation energies of the deuterium molecule (D2)\", J. Chem. Phys. 132, 154301 (2010)"
doi = "10.1063/1.3374426"
library = "Liu_2010_DeterminationIonizationDissociation"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Each ionisation energy is a sum of three intervals (Fig. 1, Table III): \
X -> EF 1Sigma_g+ (v = 0, N = 0 or 1), from Hannemann et al. 2006 (their Ref. 5); EF \
-> an np Rydberg state below the ionisation threshold (29p2_1(0) for ortho-D2, \
52p1_2(0) for para-D2), measured here by (2 + 1') resonant three-photon excitation \
(201 nm pulsed, 396 nm cw-seeded Ti:Sa amplified) with counterpropagating 396 nm beams \
to cancel the Doppler shift, delayed pulsed-field ionisation, I2 calibration against a \
comb-measured line; and the Rydberg state's binding energy from multichannel \
quantum-defect theory, checked against survey spectra (Table I) (pp. 2-6)."""
notes = """PDF pages 1-12 (page 1 is the publisher's cover sheet; PDF page 2 = \
154301-1; pages cited are PDF pages). Identity checked on the first page. The library \
flags unmapped glyphs (brackets and parentheses rendered as other characters) on most \
pages: every number taken was read on the table images (Tables III and IV) or checked \
in the page text against its context.

NOMENCLATURE: in D2 the ortho levels have even N, so ortho-D2's ionisation energy is \
the conventional one, E_i(D2) = E_i(ortho-D2) = X+ 2Sigma_g+ (v+ = 0, N+ = 0) - X \
1Sigma_g+ (v = 0, N = 0); para-D2's is X+ (0, N+ = 1) - X (0, N = 1) (Table III). \
'These values correspond to the energy separations between the centers of gravity of \
the hyperfine structure' of the levels (p. 6).

EXTRACTED:
- Table III (p. 7, tbl_fcc4c6682cca, image checked): (4) E_i(ortho-D2) = \
124 745.394 07(58) cm^-1 and (8) E_i(para-D2) = 124 715.003 77(75) cm^-1 (also \
abstract p. 2, text p. 6). The precision is 17 and 22 MHz (p. 6). Uncertainties: the \
EF -> Rydberg intervals (2), (6) carry 'the linear summation of the statistical and \
systematic uncertainties' (p. 6; Table II, p. 7: totals +-17 and +-22 MHz), and 'the \
overall uncertainties in the ionization energies ... are determined as quadrature \
summation of the uncertainties of all energy intervals' (p. 6). The binding \
energies' uncertainties are one standard deviation (p. 5). The confidence level of the \
totals is not named. In eV (not printed; hc = 1.239841984e-4 eV cm): 15.4664577 and \
15.4626898 eV.
- Table IV (p. 8, tbl_e28c58907bc7, image checked): E_i(D2) (ortho) of earlier \
determinations, reproduced, one dataset per row with the references as the paper's \
list prints them (p. 12). The 2010 row is Table III (4) and is not repeated. The \
theoretical values 'were reported without uncertainties' (Fig. 5 caption, p. 8). \
Footnote a (1975): 'A correction of -1.0 cm^-1 was included to account for the \
pressure shift (see Ref. 33)'.
- Text p. 2: the ionisation energy of H2 from the authors' previous work (Ref. 3, \
Liu et al., J. Chem. Phys. 130, 174306 (2009) = liu_2009), 124 417.491 13(37) cm^-1, \
reproduced (the levels are not stated here; liu_2009 defines it as the N = 0 -> N+ = 0 \
(para-H2) interval).

NOT EXTRACTED (notes only; no quantity or out of scope):
- Table III, other rows (cm^-1): (1) EF (0, 0) - X (0, 0) 99 461.449 08(11) [5]; (2) \
29p2_1(0) - EF (0, 0) 25 240.712 10(57); (3) X+ (0, N+ = 0) - 29p2_1(0) 43.232 89(3); \
(5) EF (0, 1) - X (0, 1) 99 433.716 38(11) [5]; (6) 52p1_2(0) - EF (0, 1) \
25 240.735 16(74); (7) X+ (0, N+ = 1) - 52p1_2(0) 40.552 23(3); D0(D2+) \
21 711.583 34(35) (Moss, 'slightly modified', App. B); E_i(D) 109 708.614 552 99(10) \
[15]; D0(D2) = 36 748.362 86(68) cm^-1 (the table prints the relation with '+ E_i(D)' \
in the extracted text; the image and Eq. (1) have '- E_i(D)'); (9) the ortho-para \
separation of D2+ 29.3910(1) [8]; (10) the ortho-para separation of D2, X (v = 0, \
N = 1 - 0), 59.781 30(95) cm^-1 (against 59.7805(16) from McKellar & Oka's constants, \
p. 6).
- D0(D2) (abstract, p. 6, p. 8): 36 748.362 86(68) cm^-1, against theory 36 748.3633(9) \
(Piszczatowski et al. 2009) and the previous experiment 36 748.343(10) cm^-1 (Zhang et \
al. 2004). For H2 (p. 2): D0 = 36 118.069 62(37) cm^-1 (experiment, Ref. 3) and \
36 118.0695(10) (theory).
- Table I (p. 5): MQDT binding energies of np Rydberg states; Table II (p. 7): error \
budget in MHz; Table V (p. 10): the re-evaluation of D0(D2+) with relativistic and \
radiative corrections (Appendix B)."""

[[datasets]]
