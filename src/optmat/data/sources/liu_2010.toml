table = "tbl_fcc4c6682cca"
quantity = "ionization_energy"
unit = "cm-1"
abscissa = "label"
use = "primary"
notes = """Table III (4) = (1) + (2) + (3), p. 7: E_i(D2) = E_i(ortho-D2) = X+ (v+ = 0, \
N+ = 0) - X (v = 0, N = 0), 124 745.394 07(58) cm^-1 (17 MHz), between the centres of \
gravity of the hyperfine structures. The conventional (rotationless) ionisation \
energy of D2. Confidence level of the total not named (record notes)."""
[datasets.parameters]
