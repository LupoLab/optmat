citation = "M. A. Ordal, R. J. Bell, R. W. Alexander, Jr., L. A. Newquist and M. R. Querry, \"Optical properties of Al, Fe, Ti, Ta, W, and Mo at submillimeter wavelengths\", Appl. Opt. 27, 1203-1209 (1988)"
doi = "10.1364/AO.27.001203"
library = "Ordal_1988_OpticalPropertiesAl"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Angle-averaged absorptance P(omega) of each metal measured at room temperature \
from 30 to 300 cm-1 in a nonresonant cavity (a cylinder with plane end caps, its axis at \
4 deg to the end plates; one removable end plate of the sample, the body and the other \
plate of the aluminium reference), from the ratio of the transmissions with the sample \
and the reference plate (Eq. 1, after Pinkerton and Sievers); P from the exact expression \
Eq. (2) with xi = 1 (N = n(1 + i)) for the sample, giving the real part r(omega) of the \
normalised surface impedance z = r + ix. The aluminium reference's n and k had been \
calibrated earlier against Brandli and Sievers's gold foil and the authors' Ni foil (Ref. \
7). Samples: thin sheets or foils epoxied to 0.95 cm aluminium-alloy plates, polished \
with 1-um diamond abrasive (p. 1204). For aluminium (Sec. III.A, pp. 1204-1205): the \
cavity r(omega) was combined with r(omega) calculated from Shiles et al.'s optical \
constants (tabulated in Weaver et al.'s Physics Data compilation, the paper's Ref. 2) \
from 320 to 7e6 cm-1 and with a Drude low-frequency wing (omega_tau = 408 cm-1, omega_p = \
92,700 cm-1); the whole was Kramers-Kronig analysed for x(omega), and epsilon_1, \
epsilon_2, n, k and the reflectance R calculated from r and x."""
notes = """Journal pages 1203-1209 = PDF pages 1-7; Table I is on p. 1204 (PDF page 2). \
Identity checked against the first page (the library flags warnings on the bibliographic \
record only).

WHICH TABLE IS ALUMINIUM. Checked on the page images, not only the captions: Table I \
('Optical Constants of Aluminum') is printed directly under its caption on p. 1204 in the \
aluminium section, and its values are aluminium's (the interband dip of R to 0.868 at \
12000 cm-1, 1.49 eV; the Drude wing of omega_p ~ 9.5e4 cm-1). Tables II-VI are Fe \
(tbl_4c8e652448d0, p. 1205), Ti (tbl_02164fe7771a, p. 1206), Ta (tbl_d039cd70ef5e, p. \
1207), W (tbl_c1b7f2599a6b, p. 1208) and Mo (tbl_8157c2da3b49, p. 1209): each table's \
low-frequency n and k match its own section's Drude wing (e.g. Fe at 50 cm-1: n, k = \
183.4, 260.4 printed, 192, 263 from omega_p = 29,500, omega_tau = 156 cm-1; Ti: 120.0, \
148.4 against 120, 137). Fe, Ti, Ta, W and Mo are not registered materials and are not \
transcribed: Fe 35-15000 cm-1 (52 rows), Ti 50-15000 (51), Ta 80-15000 (49), W \
50-15000 (51), Mo 65-15000 (50), each omega, n, k, -epsilon_1, epsilon_2, R; their \
epsilon columns agree with n and k in every row (checked 2026-09-27), unlike \
aluminium's.

WHAT IS TABULATED (Al). Table I: 51 wavenumbers, 50-15000 cm-1 (200-0.667 um), with n, \
k, -epsilon_1, epsilon_2 and R to eight significant figures; R has no quantity (kept in \
printed). n, k and epsilon come from one Kramers-Kronig analysis, so the epsilon \
datasets repeat n and k (epsilon_1 = n^2 - k^2, epsilon_2 = 2nk) and are recorded as \
checks. The fourth column's header is '-epsilon_1' (checked on the image): its values \
are stored as printed with scale = -1, so the dataset holds epsilon_1. Only 30-300 cm-1 \
is measured here; 320 cm-1 and above follow Shiles et al.'s data (Weaver et al.'s \
compilation, not in the library), below 30 cm-1 the Drude wing. The paper gives no \
uncertainty for Table I; Fig. 1 shows the cavity r(omega) with error bars.

ERRATA (Table I, -epsilon_1 and epsilon_2). Every value of 1000 or more in the two \
epsilon columns is printed ten times too small, the decimal point one place to the left \
(-epsilon_1 at 50-3000 cm-1, 28 rows; epsilon_2 at 50-1750 cm-1, 23 rows): at 50 cm-1 the \
row's n = 436.98909, k = 485.19932 give k^2 - n^2 = 44458.912 and 2nk = 424053.61, \
printed 4445.8912 and 42405.361. The corrected values agree with n and k to all eight \
printed digits in every row, the rows below 1000 need no correction, and Fig. 2 (log \
scale) shows -epsilon_1 near 4e4 and epsilon_2 near 4e5 at 50 cm-1. The n, k and R \
columns are consistent with each other (R = |(N - 1)/(N + 1)|^2 to 1e-6).

DRUDE PARAMETERS (Al; p. 1205). The wing used below the cavity data: omega_tau = 408 \
cm-1, omega_p = 92,700 cm-1. 'In a previous paper (Ref. 3), we fit the above data \
without the nonresonant cavity datum to a Drude model with omega_p = 119,000 cm-1 and \
omega_tau = 660 cm-1. The surface resistance measured with the nonresonant cavity is \
better fit with omega_p = 95,400 cm-1 and omega_tau = 424 cm-1.' Ref. 3 is Ordal et al., \
Appl. Opt. 24, 4493 (1985) (ordal_1985), and Ref. 9 Ordal et al., Appl. Opt. 22, 1099 \
(1983) (ordal_1983). The Drude formula itself is not printed in this paper; the formulas \
below use epsilon = 1 - omega_p^2 / (omega^2 + i omega omega_tau), omega in cm-1, the \
form of Refs. 3 and 9 (their Eq. (2), epsilon_inf - omega_p^2 / (omega^2 + i omega \
omega_tau), with epsilon_inf taken to be unity), which reproduces the table's epsilon_2 \
at 50 cm-1 (see the checks). Other metals' Drude parameters (text, pp. 1205-1208): Fe \
wing 156/29,500, fits 147/33,000 (Ref. 3) and 213/32,900 (cavity); Ti wing 372/25,000, \
fits 382/20,300 (Ref. 3) and 243/20,900; Ta wing 470/50,000, cavity fit 704/66,200; W \
wing 250/50,000 (the cavity data are 'not well fit with a Drude model'); Mo wing \
412/60,200, cavity fit 417/58,600 (omega_tau/omega_p in cm-1). The Ref. 3 values quoted \
for Al, Fe, Ti and Mo (and the Mo wing) are those of ordal_1985's Table I (checked \
2026-09-28).

REFRACTIVEINDEX.INFO. solprop's aluminium table (physdata/data/aluminium_stitched.csv) \
takes 1.82-200 um from the database's Al/Ordal page (published 0.667-200 um, i.e. this \
table's n and k); see the curators' notes for the comparison."""

[[formulas]]
id = "drude_wing_Al"
material = "Al"
equation = "Text, p. 1205 (Sec. III.A); the Drude form is not printed in this paper"
printed = "A Drude model with omega_tau = 408 cm-1 and omega_p = 92,700 cm-1 was used for a low-frequency wing correction."
variable = "omega: wavenumber in cm-1; epsilon = 1 - omega_p^2 / (omega^2 + i omega omega_tau), the form of Refs. 3 and 9 (ordal_1985 and ordal_1983, Eq. (2) with epsilon_inf = 1)"
range = "Below the cavity data (below 30 cm-1): the Kramers-Kronig analysis's low-frequency extrapolation"
coefficients = { omega_p = "92,700", omega_tau = "408" }
check = "With that form: at 50 cm-1, epsilon_2 = 415,007 against the table's 424,053.61 (2nk; printed 42405.361, see the errata), -2 %; -epsilon_1 = 50,858 against 44,458.9 (+14 %); at 300 cm-1, epsilon_2 = 45,569 against 46,497, -epsilon_1 = 33,506 against 33,656 (-0.4 %). The wing was matched to the cavity data, not to the table (which is the Kramers-Kronig result). Checked 2026-09-27."
notes = "A model input of the Kramers-Kronig analysis (the paper's choice for the extrapolation), not a fit result."

[[formulas]]
id = "drude_cavity_Al"
material = "Al"
equation = "Text, p. 1205 (Sec. III.A); the Drude form is not printed in this paper"
printed = "The surface resistance measured with the nonresonant cavity is better fit with omega_p = 95,400 cm-1 and omega_tau = 424 cm-1."
variable = "omega: wavenumber in cm-1; epsilon = 1 - omega_p^2 / (omega^2 + i omega omega_tau), the form of Refs. 3 and 9 (ordal_1985 and ordal_1983, Eq. (2) with epsilon_inf = 1)"
range = "30-300 cm-1 (the cavity measurements)"
coefficients = { omega_p = "95,400", omega_tau = "424" }
check = "With that form: at 50 cm-1, epsilon_2 = 423,412 against the table's 424,053.61 (-0.15 %) and -epsilon_1 = 49,930 against 44,458.9 (+12 %); at 300 cm-1, epsilon_2 = 47,680 against 46,497 (+2.5 %) and -epsilon_1 = 33,735 against 33,656 (+0.2 %); at 1000 cm-1 (outside the fitted range) epsilon_2 = 3,271 against 4,687. Checked 2026-09-27."
notes = "A fit to the measured surface resistance r(omega), not to the tabulated epsilon."

[[formulas]]
id = "drude_ordal_1985_Al"
material = "Al"
equation = "Text, p. 1205, quoting Ref. 3 (Ordal et al., Appl. Opt. 24, 4493 (1985): ordal_1985, Eq. (2) and Table I)"
printed = "In a previous paper (Ref. 3), we fit the above data without the nonresonant cavity datum to a Drude model with omega_p = 119,000 cm-1 and omega_tau = 660 cm-1."
variable = "omega: wavenumber in cm-1; epsilon = 1 - omega_p^2 / (omega^2 + i omega omega_tau), the form of Refs. 3 and 9 (ordal_1985 and ordal_1983, Eq. (2) with epsilon_inf = 1)"
range = "The shorter-wavelength data (Shiles et al.), as fitted in Ref. 3"
coefficients = { omega_p = "119,000", omega_tau = "660" }
check = "With that form: at 1000 cm-1, epsilon = -9,863 + 6,510i against the table's -7,562.9 + 4,687.1i; at 50 cm-1, epsilon_2 = 426,672 against 424,054 (+0.6 %). Checked 2026-09-27. The values are those of ordal_1985's Table I, Al: 10^-2 omega_tau = 6.60 and 10^-4 omega_p = 11.9 cm-1, i.e. 660 and 119,000 (checked 2026-09-28)."
reproduced_from = ["ordal_1985"]
notes = "Reproduced from Ordal et al. 1985 (Ref. 3; ordal_1985/drude_Al), not this paper's result. 'The above data' are Shiles et al.'s, but the 1985 fit follows Bennett and Bennett's Drude curve (ordal_1983's Al block, omega_tau 663 cm-1) to 1-2 % and lies 15-40 % from Shiles et al.'s values at 1000-5000 cm-1 (ordal_1985/drude_Al's check)."

