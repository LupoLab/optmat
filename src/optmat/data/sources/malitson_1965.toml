citation = "I. H. Malitson, \"Interspecimen Comparison of the Refractive Index of Fused Silica\", J. Opt. Soc. Am. 55, 1205 (1965)"
doi = "10.1364/josa.55.001205"
library = "Malitson_1965_InterspecimenComparisonRefractive"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Minimum deviation on 60-degree prisms (faces about 4.5 cm square) of optical-quality \
fused silica from three makers, four production runs each: Corning code 7940, Dynasil \
high-purity synthetic fused silica and General Electric type 151 (p. 1205). Three \
prisms, one per maker, were measured at 60 wavelengths, 0.2139-3.7067 um (emission \
lines and absorption bands, Table I), on the NBS instrument of Rodney and Spindler \
(1954), at 'controlled room temperatures near 20 degrees C', with a single Golay cell \
(CaF2 window) as detector; Table II's note calls it the Gaertner spectrometer. All \
twelve prisms were measured at 20 degrees C at 18 wavelengths, 0.4047-1.08 um, on a \
Wild precision spectrometer with an infrared image converter (pp. 1207-1208). dn/dT \
from repeated measurements at 30 degrees C on the General Electric prism (p. 1209)."""
notes = """Journal pages 1205-1209 are pdf pages 1-5. Identity checked against the first page.

WAVELENGTHS. Table I lists each line with its source (Zn, Cd, Hg, H, He, Na, Cs, and \
absorption bands of 1,2,4-trichlorobenzene (TCB) and polystyrene (Poly) in the \
infrared). The wavelengths are the lines' standard-air wavelengths: Hg 0.546074 um is \
the green line whose vacuum wavelength, 546.2258 nm, the gas records use (e.g. \
peck_1966, borzsonyi_2008). They are recorded as standard air (TC-326). In the \
infrared, beyond about 2.2 um, 'the wavelength accuracy is not exactly known since \
atmospheric water-vapor bands were superposed on the absorption spectra of the \
wavelength standards' (p. 1207). At 0.226747 um the residual 'would change to +28 x \
10^-6 if the wavelength used was 0.226624 u', the average of the Cd line 0.226502 u and \
the assigned wavelength (p. 1207).

INDEX. The paper does not say whether the index is relative to air (the minimum \
deviation was measured in air) or reduced to vacuum; it gives no air correction. \
Presumably relative to air at 20 degrees C, the convention of glass catalogues; to be \
settled (TC-326).

ACCURACY. 'an average absolute residual of 10.5 x 10^-6 indicates that values of index \
may be interpolated by means of the dispersion equation to five significant decimal \
places' (p. 1207); the largest residuals are at both ends of the range (wide slits in \
the ultraviolet; wavelength identification in the infrared). The Wild measurements: \
'+-5 x 10^-6 for 14 visible lines and +-20 x 10^-6 for 4 near infrared wavelengths' \
(pp. 1207-1208), level not stated. Index gradients of the material: 0.9-1.6 x 10^-5 \
cm^-1 (5 cm x 5 cm x 1 cm samples, p. 1205).

TABLE I. The 'C-D-G.E.' column is the residual of an 'arithmetical-mean table of values \
compiled from experimental data of Corning (C), Dynasil (D), and General Electric \
(G.E.)' (footnote a), to which Eq. (1) was fitted. It is not the average of the three \
specimen columns printed beside it: at 0.213856 um it is -27 against -29, -42, -31 \
(average -34); at 0.237833 um +1 against +13, +23, +19; at 1.81307 um +21 against -7, -7, \
+6 (a finding; the paper does not say how the mean table was compiled). Averages of the \
absolute residuals (last row, not extracted): 10.5 (mean), 11.9 (Corning), 12.2 \
(Dynasil), 11.7 (General Electric). The library cells read the Corning column's header \
factor as 10^9; the image prints 10^6 (structural fix in the extraction script).

TABLE II. Residuals (units of 1e-6; measured minus Eq. (1)) of the twelve prisms at 9 of \
the 18 wavelengths. 'Av. Delta n', the average over all 18 wavelengths, per prism \
(Corning 1-4: 13.5, 24.9, 20.0, 21.6; Dynasil 1-4: 3.5, 27.4, 20.4, 20.5; General \
Electric 1-4: 11.3, 12.9, -9.6, 13.2) and the nu-values (67.77-67.88) are not per \
wavelength and are kept here only. Specimen 1 of each brand is the Table I prism, \
measured again on the Wild spectrometer: 'This accounts for differences in residuals \
between tables.' 'the maximum index variation for specimens from the same source is 11, \
24, and 23 units in the sixth decimal place for Corning, Dynasil, and General Electric' \
(p. 1207); the lower indexes 'suggest that the variations are caused mainly by small \
temperature gradients which exist during the annealing', not impurities (p. 1208).

FIGURES (not digitised). Fig. 1: n against wavelength, 0.2-4 um, dashed over 2.4-3.2 um \
where the OH band prevents measurement. Fig. 2: the relative dispersion \
(-dn/dlambda)/(n - 1), minimum near 1.3 um, and its reciprocal. Fig. 3: dn/dT for \
20-30 degrees C (mean 25 degrees C), General Electric prism: 'about 15 x 10^-6/degree C \
at 0.21 u to about 10 x 10^-6/degree C at 0.4 u', constant through the visible, 'about \
12 x 10^-6/degree C at 2.0 u, then decreases to 10 x 10^-6/degree C at 3.7 u' (p. 1209). \
Fig. 4: Rodney and Spindler's (1954) values, adjusted to 20 degrees C, minus Eq. (1): \
+8e-5 at 0.34 um, +2e-5 from 0.56 to 1.4 um, +8e-5 at 3.5 um (p. 1209). Transmission \
(p. 1205): about 92 % from near 0.2 um to 3.5 um for 1 mm, OH band at 2.7 um (minimum \
about 10 %), overtones at 2.2 and 1.4 um; cutoffs near 0.16 and 4.5 um for 1 cm."""

[[formulas]]
id = "sellmeier"
form = "n2_sellmeier_wavelength"
terms = { B = ["0.6961663", "0.4079426", "0.8974794"], L = ["0.0684043", "0.1162414", "9.896161"] }
# The variable is the standard-air wavelength of Table I (TC-323).
wavelength_medium = "standard_air"
# The index is relative to the room air of the measurement, 20 degrees C, pressure not
# stated (Leviton & Frey 2008 read it so and agree to 1e-5; TC-399).
index_medium = "air"
air_temperature_k = 293.15
# The vacuum wavelengths of the first and last of Table I's air wavelengths (213.856 and
# 3706.7 nm in standard air).
range_nm = [213.92, 3707.72]
material = "SiO2"
equation = "Eq. (1), p. 1207 (also the abstract, p. 1205)"
printed = "n^2 - 1 = 0.6961663 lambda^2/[lambda^2 - (0.0684043)^2] + 0.4079426 lambda^2/[lambda^2 - (0.1162414)^2] + 0.8974794 lambda^2/[lambda^2 - (9.896161)^2]"
variable = "lambda: wavelength in um, the standard-air wavelengths of Table I (see notes)"
range = "0.2139-3.7067 um (the 60 wavelengths fitted), 20 degrees C; 'valid for interpolation to five decimal places over the measured wavelength range' (Fig. 1 caption)"
coefficients = { B1 = "0.6961663", lambda1 = "0.0684043", B2 = "0.4079426", lambda2 = "0.1162414", B3 = "0.8974794", lambda3 = "9.896161" }
check = "Reproduces Table I's computed index at all 60 wavelengths to within 8.3e-7 (six decimals printed; the differences of 5-8e-7 follow from the rounding of the printed coefficients). Checked 2026-09-26."
notes = "Printed with the resonance wavelengths lambda_i, kept as printed (form n2_sellmeier_wavelength, C_i = L_i^2). Fitted by least squares (Sutton and Stavroudis) to the arithmetical-mean table of the three prisms; average absolute residual 10.5e-6. The index is relative to the room air of the measurement: the paper does not say so, but Leviton & Frey (leviton_2008, pp. 3, 9) read it as 'in air' and, so converted, agree with their absolute indices to 'well less than 1e-5' (TC-326, TC-399). tan_1998 finds its interferometric n at 3-6.7 um 'exactly equal' to the formula's extrapolation (errors within +-5e-4 in the 3-3.7 um overlap, ~1e-3 overall); kitamura_2007 and arosa_2020 reproduce the coefficients (Arosa rounded to four digits)."

