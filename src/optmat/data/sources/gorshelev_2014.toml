citation = "V. Gorshelev, A. Serdyuchenko, M. Weber, W. Chehade and J. P. Burrows, \"High spectral resolution ozone absorption cross-sections - Part 1: Measurements, data analysis and comparison with previous measurements around 293 K\", Atmos. Meas. Tech. 7, 609 (2014)"
doi = "10.5194/amt-7-609-2014"
library = "Gorshelev_2014_HighSpectralResolution"
identity = "VALIDATED"
kind = "measurement"
technique = """Two double-jacketed quartz cells (140 cm long, 5 cm bore; paths 5 cm across the \
middle, 135 and 270 cm, and about 2000 cm with White multipass optics), cooled by \
flowing ethanol (Haake cryostats, 293-193 K, stable to +-0.3 K; internal and Pt-100 \
sensors agree to 1 K); an echelle spectrometer (ESA 4000, ICCD; 0.018-0.02 nm) and a \
Bruker HR120 Fourier-transform spectrometer (1 cm^-1, 2 cm^-1 in the NIR, boxcar \
apodisation); deuterium, xenon and tungsten lamps. Absolute measurements with pure O3 \
(trapped from an O2/O3 flow in liquid nitrogen, about 50 mbar) in the Huggins band \
(310-335 nm, 135 cm) and the Chappuis band (450-780 nm, 270 cm), the O3 pressure from \
the total pressure during decay, p(t) = 3 p_i - 2 p_total(t) (Eq. 3), corrected for the \
decay during filling; relative measurements with O2/O3 mixtures in 213-310 nm (O3 left \
on the optics after evacuation), 335-350, 350-450 and 780-1100 nm, concatenated to the \
absolute ones by scaling and offset in their overlaps (Table 1; pp. 611-613)."""
notes = """Identity checked against the first page (PDF page 1, journal p. 609): Gorshelev, \
Serdyuchenko, Weber, Chehade and Burrows, Atmos. Meas. Tech. 7, 609-624 (2014), Part 1 \
(the 293 K measurement; Part 2 is serdyuchenko_2014). Journal pages 609-624 = PDF pages \
1-16. O3 only.

Facts for the data files (the Bremen 'Serdyuchenko/Gorshelev' set):
- Range and temperatures: 213-1100 nm at eleven temperatures 193-293 K in 10 K steps \
(abstract); this paper analyses 293 K.
- Resolution (Table 1, pp. 612-613): echelle 0.018 nm (213-310 nm) and 0.02 nm \
(350-450 nm), FWHM 'from about 0.015 nm in the UV to 0.025 nm in the visible' (Hg-Cd \
lines); FTS 1 cm^-1 (310-350 and 450-780 nm) and 2 cm^-1 (780-1100 nm): 'about 0.01 nm \
in the Huggins band, 0.02-0.06 nm in the Chappuis band, and 0.12-0.24 nm in the Wulf \
band'. Sampling: echelle 0.01 nm; FTS 0.005 nm/point (near UV), 0.01-0.03 nm/point \
(visible), about 0.1 nm/point (NIR). The published cross sections 'were linearly \
interpolated onto an equidistant wavelength grid in steps of 0.01 nm for the spectral \
range from 213 to 1100 nm' (one to three interpolated points between measured ones in \
450-750 nm, up to nine in the NIR, Fig. 2) (p. 613).
- Wavelengths: VACUUM. 'The echelle spectrometer delivers data on air wavelength scale, \
which was converted into vacuum wavelength scale using Edlen's equation (Edlen, 1966) \
... Wave number scale delivered by FTS was converted into the vacuum wavelength scale' \
(p. 613). Calibration accuracy 0.005 nm (abstract, p. 613). The comparisons were made \
'on the same grid of vacuum wavelengths in steps of 0.01 nm' (p. 617).
- Absolute scale: pure-O3 pressure measurements (above) in the Huggins and Chappuis \
bands; the Hartley band, the 350-450 nm minimum and the Wulf band are relative, scaled \
to the absolute spectra in the overlaps (pp. 611-612, 621). Not normalised to any other \
data set.
- Uncertainty (Table 2, image checked, p. 615; 'upper estimations' for the absolute \
measurements at 50 mbar, 293 K): systematic 1.3 % (pressure sensor 0.5 %, temperature \
sensor 0.3 %, temperature non-uniformity 0.3 %, leaks 0.1 %, cell length 0.04-0.07 %, O2 \
impurity 0.005 %); statistical (RMS) 1-3 % (ozone decay 1 %, light-source stability \
0.28-2.8 % at OD 1, pressure 0.08 %, temperature 0.1 %). 'The absolute accuracy is \
better than three percent for most parts of the spectral region' (abstract); 'uncertainty \
of our dataset (2-3 % for most of the spectral regions)' (p. 614); in weak absorption \
the statistical uncertainty 'can reach up to 20 % or more' (p. 614); 'greater than 30 %' \
near 385 nm and at 1020 nm (p. 619); 'about 30 % or more' around 1000 nm (p. 621). \
Levels not stated.
- The published file: 'made available from the website of the molecular spectroscopy \
laboratory of the Institute of the Environmental Physics, University of Bremen' (p. \
622), with technical documentation.

Band-integrated cross sections (Table 3, image checked, p. 617; cm^2 molecule^-1 nm, \
293-298 K; Orphal's limits): Hartley 245-340 nm (x 10^-16) Orphal 3.55 +- 0.6 %, this \
work 3.53, Brion 3.52, Burrows 3.57, Bogumil 3.56; Huggins 325-340 nm (x 10^-20) 8.30 \
+- 0.7 %, 8.29, 8.30, 8.33, 8.31; Chappuis 410-690 nm (x 10^-19) 6.38 +- 1.6 %, 6.22, \
6.29, 6.45, 6.40; Wulf 633-1000 nm (x 10^-19) this work 1.04, Bogumil 1.10. Not \
extracted: no vocabulary quantity for a cross section integrated over wavelength \
(format need). The Wulf limits are printed 633-1000 nm in Table 3 but '663-1000 nm \
(Banichevich et al., 1993)' in the text (p. 616).

Comparisons (pp. 616-621): agreement with BMD about 1 % and better; within 1 % of all \
datasets in the Hartley and Huggins bands, 1-4 % in the Chappuis and 6 % in the Wulf \
band (integrated); several per cent below the satellite sets and BP near 255 nm; in \
323-340 nm lower by 2-3 % than BMD and 2-7 % than BP; wavelength shifts: BP_exp +0.026 \
+- 0.002 nm, BP_calc +0.023, BP_HITRAN +0.008, Voigt +0.005, Bogumil +0.006 nm; a \
non-linear BMD calibration (different shifts in 323-330 and 332-340 nm). The MPI (Mainz) \
BP and BMD data are on AIR wavelengths (p. 617).

Datasets: Tables 4-7 (images checked), one per source column; 'This work' at 293 K is \
a set of points of the data file: 'check'. The other columns are other data sets \
evaluated by these authors at vacuum wavelengths ('in some cases data were \
interpolated', p. 620): reproduced. Captions: Tables 4, 6 and 7 'at 295 +- 3 K'; Table \
5 the same with typical FWHM in brackets. Attribution check: Table 6's 'Anderson and \
Mauersberger (1992)' column (3.075, 4.569, 5.125, 4.633, 3.383) is brion_1998's, which \
supports brion_1998 against burrows_1999's Table 2 labels (see burrows_1999)."""

