citation = "P. J. Leonard, At. Data Nucl. Data Tables 14, 21 (1974)"
doi = "10.1016/s0092-640x(74)80028-8"
library = "Leonard_1974_RefractiveIndicesVerdet"
identity = "VALIDATED_WITH_WARNINGS"
kind = "compilation"
technique = """Critical compilation of the interferometric refractive indices (absolute values \
and dispersion), vacuum-ultraviolet values by other techniques (Rayleigh scattering, \
Cerenkov threshold, hook method), displacement-interferometry kappa values, Verdet \
constants and static polarizabilities of He, Ne, Ar, Kr and Xe, recalculated by the \
compiler to a common standard state with modern PVT data."""
notes = """STP is 273.16 K and 1 standard atmosphere (1.01325e6 erg cm^-3), pressures \
corrected to standard gravity; 'for reduction from experimental to standard density it \
is sufficient in all cases to use accurate second virial coefficients' (p. 2): a \
real-gas reduction (state 273.16 K, 1 atm, density real). Table I gives each author's \
absolute value at 5462.258 A (vacuum) recalculated to this STP, with Leonard's \
reassessed probable errors, and the recommended value per gas (underlined). Table II \
gives the dispersion data of each author with 'all values of (n-1) 10^6 adjusted to \
the recommended values in TABLE I, so that the TABLE agrees in all cases with the \
measured dispersion relative to those values' (legend, p. 11): the absolute level of \
every Table II dataset is the recommended value, which is therefore not independent. \
Table II wavelengths are in air at 15 degrees C (MIT Wavelength Tables, 'for \
convenience in identifying the spectral line'); values in parentheses are 'discrepant \
or low-accuracy', and the authors whose reference is printed in parentheses are \
excluded datasets here.

One dataset per original author and gas (Table II), per gas (Tables I and VI) or per \
reference (Tables III-V); Leonard's reference numbers are in the dataset notes. Values \
reproduced from papers in the library (Peck and Fisher 1964; C. and M. Cuthbertson \
1910a/b, 1932; Heddle et al. 1963; Gill and Heddle 1963) name those sources, others \
their citation as printed. The Table II values are Leonard's rescaled versions, not \
the originals' numbers.

Structural problems of the library tables (merged cells, braces, lost markers, lost \
wavelength 4861.327 A in the argon half, a garbled Table III header, missing captions of \
Table III(b)-(d)) are handled in the extraction script, with the image readings.

Misprints noticed in the text, not affecting the data: 'the earliest measurements 31,35' \
(p. 5) must be Refs. 34, 35; 'Measurements by Shardanand 12' (p. 5) is Ref. 42; \
'Perv-Thorne 41' (p. 5) is Pery-Thorne, Ref. 44; the Verdet relation cites '18' for \
van Vleck, Ref. 48; Table VI cites Ref. 42 (Shardanand) for its refractive-index \
extrapolations, probably meaning Leonard's thesis, Ref. 47. The 'Quoted' column of \
Table I (each author's value in his own convention) is not extracted.

The formulas are Chashchina et al.'s three-term Sellmeier fits to their smoothed \
line-shift data, 'after making the same adjustments as were made to the data of Koch \
and Larsen' (pp. 4-5); Leonard includes none of their points in Table II and warns \
that for Kr and Xe they are 'only a rough guide' and that 'in no case can the formulae \
be used outside the range of the experiments'."""

[[formulas]]
id = "chashchina_Ar"
form = "dn_sigma2"
terms = { scale = "120.625e-6", B = ["14.0", "14.0", "430.63"], C = ["87.892", "91.011", "217.6"] }
range_nm = [110.0, 270.0]
material = "Ar"
equation = "Eq. (Ar), p. 5"
printed = "(n - 1) 10^6 = 120.625 (14.0/(87.892 - lambda^-2) + 14.0/(91.011 - lambda^-2) + 430.63/(217.6 - lambda^-2))"
variable = "lambda: wavelength in 10^-6 m (vacuum; the fit covers the vacuum ultraviolet)"
state = { pressure_atm = 1.0, temperature_k = 273.16 }
density = "real"
range = "about 2700-1100 A (Chashchina, Gladushchak and Shreider's line shifts, fitted together with Larsen's data)"
coefficients = { scale = "120.625", f1 = "14.0", c1 = "87.892", f2 = "14.0", c2 = "91.011", f3 = "430.63", c3 = "217.6" }
check = """Leonard prints no values from it. Compared with Chashchina et al.'s smoothed values \
as reproduced (unadjusted, 0 degrees C) by Bideau-Mehu et al. 1981 (Table 3, 140.4-253.7 \
nm), the formula is 0.05-0.08 % higher throughout, consistent with a small rescaling; at \
5462.258 A it gives 281.69, 0.28 % below the recommended 282.4655 (outside its range). \
Checked 2026-09-24 against bideau_mehu_1981/chashchina_1968_Ar."""
notes = """Reproduced (with Leonard's adjustment) from G. I. Chashchina, V. I. Gladushchak and \
E. Ya. Shreider, Opt. Spectrosc. 24, 542 (1968), not in the library. The resonance \
oscillator strength 0.28 derived by the authors is split equally between the first two \
terms, 'whereas the ratio is known to be nearer 10:1' (p. 5); fitted to n - 1, not to \
the Lorentz-Lorenz function. Stated fit deviation 1.2 % (p. 4)."""

[[formulas]]
id = "chashchina_Kr"
form = "dn_sigma2"
terms = { scale = "120.884e-6", B = ["17.2", "18.9", "427.13"], C = ["65.474", "73.645", "146.305"] }
range_nm = [130.0, 270.0]
material = "Kr"
equation = "Eq. (Kr), p. 5"
printed = "(n - 1) 10^6 = 120.884 (17.2/(65.474 - lambda^-2) + 18.9/(73.645 - lambda^-2) + 427.13/(146.305 - lambda^-2))"
variable = "lambda: wavelength in 10^-6 m (vacuum)"
state = { pressure_atm = 1.0, temperature_k = 273.16 }
density = "real"
range = "about 6200-1330 A (Chashchina and Shreider's line shifts to 1330 A fitted together with Koch's data)"
coefficients = { scale = "120.884", f1 = "17.2", c1 = "65.474", f2 = "18.9", c2 = "73.645", f3 = "427.13", c3 = "146.305" }
check = """Compared with Chashchina and Shreider's values as reproduced by Bideau-Mehu et al. \
1981 (Table 4, 0 degrees C), the formula is 0.14-0.30 % higher (0.89 % at 213.9 nm, \
where the reproduced value itself looks low against its neighbours). At 5462.258 A it \
gives 427.16, 0.85 % below the recommended 430.84; at 2302 A 0.6 % above Koch's value, \
matching Leonard's description of a systematic deviation from -0.3 % to +0.8 % (p. 4). \
Checked 2026-09-24."""
notes = """Reproduced (adjusted) from G. I. Chashchina and E. Ya. Shreider, Opt. Spectrosc. \
27, 79 (1969) (cited by Leonard as 25, 79 (1968)), not in the library. The resonance \
pair's oscillator strengths and energies were imported, leaving two adjustable \
constants; stated fit deviation 1.9 %; 'only ... a rough guide, giving results a \
little too high near 2300 A and probably considerably too low near 1300 to 1500 A' \
(p. 4)."""

