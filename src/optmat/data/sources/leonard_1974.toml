printed = "7425.113"
corrected = "7245.166"
reason = "Peck and Fisher measured at 7247.163 A in vacuum (the Ne line, Peck 1964 Table I), which is 7245.166 A in standard air; every other Peck-Fisher wavelength of Table II is the air equivalent of one of theirs, and 7425.113 A is not. The value 280.2792 belongs to 7247.163 A (vacuum): Peck and Fisher's 0 degrees C formula gives 280.279 there, but 280.143 at 7425.113 A (air)."
evidence = "Table image tbl_b21803ae40ad.jpg prints 7425.113 (7245 with two digits transposed). 7245.166 is Peck's 7247.163 A converted from vacuum to standard air with the package's Edlen conversion (2026-09-24)."

[[errata]]
