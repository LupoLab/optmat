reproduced_from = ["L. R. Ingersoll and D. H. Liebenberg, J. Opt. Soc. Am. 44, 566 (1954)", "L. R. Ingersoll and D. H. Liebenberg, J. Opt. Soc. Am. 46, 538 (1956)"]
notes = "Table V, Verdet constants 'V in micro-min cm^-1 oersted^-1' (microminutes of arc per cm per oersted). The table does not state the gas state; taken as Leonard's STP. Wavelengths are nominal (Hg lines for 4360, 5460, 5780 A; round values otherwise); the medium is not stated and taken as air (3e-4 relative, far below the accuracy). Ingersoll and Liebenberg's smoothed curves (Refs. 56, 57). Leonard: they lie about 2 % below the Verdet constants predicted by differentiating the refractive index, and the smoothing (unknown function) gives the wrong limit E^-2 V as E -> 0 (p. 6); 'the differentiated results are probably more reliable than the direct measurements'."

