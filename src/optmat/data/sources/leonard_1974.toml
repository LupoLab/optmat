density = "real"
use = "reproduced"
reproduced_from = ["C. E. Bennett, Phys. Rev. 37, 262 (1931); ib. 58, 263 (1940)"]
notes = "Table IV, Bennett's displacement interferometry, 'reproducible to within +-0.15 %'; differentiating Leonard's curve gives values 0.3 % higher (p. 6). The only kappa data Leonard reduced carefully to STP. Printed factor 'kappa x 10^6' is a misprint for 10^4 (see kappa_Ar_ref45): scale 1e-4. 4359, 5461 and 5780 A are the Hg lines in air (5780: the mean of the yellow pair)."
[datasets.uncertainty]
column = true
level = "not stated"

