[[datasets]]
id = "kappa_Ar_ref45"
material = "Ar"
file = "Ar/leonard_1974__kappa_Ar_ref45.csv"
table = "tbl_ef7f5e3531dc"
quantity = "dispersion_kappa"
scale = 1e-4
abscissa_unit = "angstrom"
wavelength_medium = "vacuum"
state = { pressure_atm = 1.0, temperature_k = 273.16 }
density = "unknown"
use = "reproduced"
reproduced_from = ["G. Wolfsohn, Z. Physik 85, 366 (1933)"]
notes = "Table IV, displacement interferometry: kappa = -lambda^2 d/dlambda[(n - 1)/lambda] = (n - 1) - lambda dn/dlambda, 'derived by working back from' Wolfsohn's results (p. 6); reproducibility only +-2 %, and Chashchina et al.'s curve gives a value 3 % higher. Not carefully reduced to STP ('only that of Bennett was sufficiently accurate', p. 6). The column is headed 'kappa x 10^6', but kappa is n - 1 plus a small positive term (2.9e-4 for argon at 5461 A; differentiating Peck and Fisher's formula gives 2.927e-4, 0.4 % above Bennett's 2.915, as Leonard says of his own curve), so the printed factor must be 10^4: scale 1e-4. Vacuum wavelength (1850 A)."
[datasets.uncertainty]
column = true
level = "not stated"

[[datasets]]
id = "kappa_Ar_ref46"
