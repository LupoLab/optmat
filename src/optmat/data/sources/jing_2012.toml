[[formulas]]
id = "keldysh_rate"
material = "SiO2"
equation = "Eqs. (3)-(5), pp. 4742-4743"
printed = "W_PI = (2 omega/9 pi) (omega m_e*/(sqrt(gamma_1) h))^(3/2) Q(gamma, x) exp{-pi <x + 1> [K(gamma_1) - E(gamma_1)]/E(gamma_2)} (3), gamma = omega sqrt(m_e* E_g)/(eE), m_e* = m_e m_h/(m_e + m_h), gamma_1 = gamma^2/(1 + gamma^2), gamma_2 = 1/(1 + gamma^2); W_multpt = (2 omega/9 pi)(m_e* omega/hbar)^(3/2) Phi(sqrt(2 <E'_g/hbar omega + 1> - 2 E'_g/hbar omega)) exp{2 <E'_g/hbar omega + 1> (1 - 1/(4 gamma^2))} (1/(16 gamma^2))^<E'_g/hbar omega + 1> (4), E'_g = E_g [1 + 1/(2 gamma^2)]; W_tunnel = (2 E_g/(9 pi^2 hbar)) (m_e* E_g/hbar^2)^(3/2) (hbar omega/(E_g gamma))^(5/2) exp{-(pi/2)(E_g gamma/hbar omega)(1 - gamma^2/8)} (5)"
variable = "K, E: complete elliptic integrals of the first and second kinds; <.> the integer part; Phi the Dawson function; E the field amplitude"
coefficients = { E_g = "9 eV", m_e_star = "0.635 m_e" }
reproduced_from = ["L. V. Keldysh, Sov. Phys. JETP 20, 1307 (1965)"]
check = "gamma = 1 at 3.5e13 W/cm2 with I = c n0 eps0 E^2/2, n0 = 1.46 (0.999, 2026-09-26); the rate values (dataset keldysh_rate) are the reference to reproduce. Eq. (3) prints h (not hbar) under the root and the definition of Q is only partly legible in the library text (the Dawson integral is rendered, Q is not)."
notes = "Compare couairon_2005 Eqs. (7)-(8) and hamam_2018 Eqs. (3)-(4); the effective gap in Eq. (4) differs from hamam_2018's by a factor 2 in the 1/gamma^2 term (source notes)."

[[formulas]]
id = "avalanche_models"
material = "SiO2"
equation = "Eqs. (6)-(9), p. 4743"
printed = "W_Av_Stuart = alpha I(t), alpha ~ 0.01 cm2 ps^-1/GW (6); W_Av_Sparks = 0.693 e^2 E^2 tau_c/(m_e* E_g (1 + omega^2 tau_c^2)) - 0.693 hbar omega_p/(E_g tau_L) (7); W_Av_Thornber = (v_s e E/E_g) exp{-E_I/(E (1 + E/E_phonon) + E_kT)} (8); W_Av_Drude = (sigma/E_g) I(t), sigma = (e^2/(c eps0 n0 m_e*)) tau_c/(1 + omega^2 tau_c^2) (9)"
variable = "E: field; tau_c the mean collision time; I(t) = (1/2) c n0 eps0 |E(t)|^2"
coefficients = { tau_c_sparks = "1.36e-15 s", tau_L = "8.77e-16 s", hbar_omega_p = "0.025 eV", v_s = "2e7 cm/s", E_I = "30 MV/cm", E_phonon = "3.2 MV/cm", E_kT = "0.01 MV/cm" }
reproduced_from = ["stuart_1996", "M. Sparks and C. J. Duthler, Fifth Tech. Rep., Xonics Inc. (1975)", "K. K. Thornber, J. Appl. Phys. 52, 279 (1981)"]
check = "Nothing numeric printed to reproduce beyond the constants."
notes = "The dc-to-optical scaling E_th^ac(omega) = E_th^dc (1 + omega^2 tau_c^2)^(1/2) accompanies Thornber's rate (p. 4743)."

[[formulas]]
id = "rate_equation_and_collision_time"
material = "SiO2"
equation = "Eqs. (1), (2), (10), (11), pp. 4742-4744"
printed = "n_cr = eps0 m_e* omega^2/e^2 (1); dn_e/dt = W_PI(I(t)) + W_Av(I(t)) n_e(t) - W_rel (2); tau_c = 16 pi eps0^2 sqrt(m_e* (0.1 E_g)^3)/(sqrt(2) e^4 n(t)) (10); W_rel = n(t)/tau_r (11)"
variable = "n(t): conduction-electron density; tau_r the relaxation time"
coefficients = { tau_r = "100 fs", n_cr = "1.1e21 cm^-3" }
reproduced_from = ["K. Starke, D. Ristau, H. Welling, T. V. Amotchkina, M. Trubetskov, A. A. Tikhonravov and A. S. Chirkin, Proc. SPIE 5273, 501 (2004)"]
check = "Eq. (10): 3.52 fs at 5e19 cm^-3 (printed ~3.5 fs); Eq. (1): 1.106e21 cm^-3 with 0.635 m_e at 800 nm (printed 1.1e21) (checked 2026-09-26)."
notes = "Eq. (10) is Starke et al.'s inverse-bremsstrahlung estimate (ref. 27); the Gaussian pulse I = I0 exp[-4 ln(2)(t/tau_p)^2], fluence (pi/ln 2)^(1/2) I0 tau_p/2."
