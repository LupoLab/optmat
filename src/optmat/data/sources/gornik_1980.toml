citation = "W. Gornik, S. Kindt, E. Matthias, H. Rinneberg and D. Schmidt, \"Off-resonant E2 transition observed in two-photon absorption in Xe I\", Phys. Rev. Lett. 45, 1941-1944 (1980)"
doi = "10.1103/PhysRevLett.45.1941"
library = "Gornik_1980_OffResonantE2"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Two-photon excitation of xenon (30 Torr) by a frequency-doubled, nitrogen-laser \
pumped dye laser-amplifier (200 W, linearly polarised, 240-250 nm, bandwidth 'Delta \
nu_L ~ 15 GHz', 4 ns), focused to 'I_0 ~ 5 MW/cm^2'; the VUV fluorescence (110-190 nm, \
solar-blind photomultiplier, single-photon counting) as the measure of the absorption \
rate; linear pressure dependence (Fig. 3) and a power-law slope 2.0 +- 0.1. Rates \
estimated by second-order perturbation theory with E1-E2 and E2-E1 paths (Eqs. 1-5), a \
Gaussian laser spectrum of FWHM Delta omega_L >> Doppler width."""
notes = """Phys. Rev. Lett. 45(24), 1941-1944 (15 December 1980) = PDF pages 1-4 (PDF \
page 4 continues into the next article; journal page = PDF page + 1940). Identity \
checked on the first page (PRL, volume 45, number 24, title, authors, Freie \
Universität Berlin; received 3 September 1980) on 2026-10-09. The numbers below were \
read on the rendered pages 1942-1943.

THE TWO-PHOTON RESULTS (NOT TAKEN; no quantity). Dipole-forbidden (Delta J = 3) \
two-photon excitation of 5p5 5d[5/2]3 and 5d[7/2]3 (jl notation; NIST 5p5(2P*3/2)5d \
2[5/2]* J = 3 at 82430.204 cm^-1 and 2[7/2]* J = 3 at 80970.438, whose two-photon \
vacuum wavelengths 242.63 and 247.01 nm are the paper's 242.6 and 247.0 nm): \
experimental rates 'of 0.03 and 0.02 sec^-1, respectively', 'in error by at most a \
factor of 3', at I_0 ~ 5 MW/cm^2 and 15 GHz (p. 1942); the single-path estimates \
W(E1-E2) = 0.03 and W(E2-E1) = 0.02 s^-1 for 5d[5/2]3, 0.14 and 0.05 s^-1 for \
5d[7/2]3 (p. 1943); signals 'weaker by about four orders of magnitude' than the \
dipole-allowed 6p J = 0 and 2 lines. A rate at one intensity and one bandwidth is not a \
quantity of the vocabulary (as gornik_1981, TC-922). The reduced quadrupole matrix \
elements, |<6s[3/2]1||r^2 C(2)||5d[5/2]3>| = 43 a0^2 / sqrt(5) (Coulomb approximation) \
and |<6p[3/2]2||r^2 C(2)||5p6 1S0>| = (3 +- 1) a0^2 (from a two-photon rate), the \
one-electron |<5p||r^2||6p>| ~ 8 a0^2 and the quoted <5p||r^2||5p> = 6.45 a0^2 (Ref. \
18): no quantity holds a quadrupole matrix element.

TAKEN (oscillator_strength, inline, use = check, assumed = true: model inputs the \
paper quotes, p. 1943): 'The dipole oscillator strength (f_abs = 0.28) is taken from \
the measured lifetime of the 5p5 6s[K = 3/2]J=1 state' (Ref. 16 = matthias_1977, \
TC-1002), and 'The calculated oscillator strength is f_abs = 0.232' for 5p5 6p[3/2]2 \
-> 5p5 5d[5/2]3 (Ref. 17: M. Aymar and M. Coulombe, At. Data Nucl. Data Tables 21, 537 \
(1978), not in the library).

FINDINGS. (1) The resonance f = 0.28 is the Ladenburg conversion of matthias_1977's \
lifetime, 3.46 ns -> 0.281 (matthias_1977's own printed f is 0.263; TC-1002 traced the \
same 0.28 in gornik_1981); NIST's 146.96 nm line (A+, T7227) gives f = 0.265, 5 % \
lower. (2) NIST's 6p[3/2]2 -> 5d[5/2]3 line, 3107.77 nm (Xe_I_lines_nir.tsv, TC-983), \
has f = 0.15 (A = 7.3 x 10^5 s^-1, accuracy C, T796n, T7944): Aymar and Coulombe's \
0.232 is 1.55 times NIST's. (3) gornik_1981 (TC-922, the paper's Ref. 13, 'to be \
published'): the E1-E1 rate 'of 3.5 x 10^3 sec^-1' to 6p[3/2]2 'by using a laser \
power density I_0 = 1.8 MW/cm^2 and a bandwidth Delta nu_L ~ 2.8 GHz' quoted here \
equals gornik_1981's p. 70 measurement and conditions. (4) Eq. (2)'s factor (2 pi ln \
2)^(1/2) / Delta omega_L is pi times the peak of a Gaussian two-photon profile of FWHM \
sqrt(2) Delta omega_L, normalised in angular frequency, (2 ln 2 / pi)^(1/2) / Delta \
omega_L: the line shape gornik_1981 states (Delta omega^2 = 2 Delta omega_L^2 + Delta \
omega_D^2) with the Doppler term dropped, as the text says (Delta omega_L >> Delta \
omega_D). (5) For OEP 8 (Q1): 5d[7/2]3 (247.0 nm) lies 455 cm^-1 above the two-photon \
energy at 248.4 nm, as 6p[1/2]0 lies 396 cm^-1 below it; dipole-forbidden and four \
orders weaker than the 6p lines, it does not bear on the 6p[1/2]0 strength. No 6p[1/2]0 number is given.

NOT TAKEN (no quantity): the detunings (27000 and 38000 cm^-1, Fig. 1), Figs. 2-3 \
(excitation spectra and pressure dependence, arbitrary units).

TWO-PHOTON DATA CITED, NOT IN THE LIBRARY: R. Guccione and J. Van Kranendonk, Phys. \
Rev. Lett. 14, 583 (1965) and P. Lambropoulos, G. Doolen and S. P. Rountree, Phys. Rev. \
Lett. 34, 636 (1975) (multipole contributions to multiphoton transitions); M. \
Lambropoulos, S. E. Moody, S. J. Smith and W. C. Lineberger, Phys. Rev. Lett. 35, 159 \
(1975) (three-photon E1-E2-E1 ionisation of Na); K. Aron and P. M. Johnson, J. Chem. \
Phys. 67, 5099 (1977) (multiphoton ionisation of Xe); G. Grynberg and B. Cagnac, Rep. \
Prog. Phys. 40, 791 (1977) (review)."""

