ionisation of xenon); X. Tang, A. L'Huillier and P. Lambropoulos, \
Phys. Rev. Lett. 62, 111 (1989), and M. H. R. Hutchinson and K. M. M. Ness, Phys. Rev. \
Lett. 62, 112 (1989) (the xenon line shapes and collisional dephasing); B. Dai and P. \
Lambropoulos, Phys. Rev. A 36, 5205 (1987) and G. Alber and P. Zoller, Phys. Rev. A \
27, 1713 (1983) (q parameters of Na and Cs)."""
