citation = "J. P. Burrows, A. Richter, A. Dehn, B. Deters, S. Himmelmann, S. Voigt and J. Orphal, \"Atmospheric remote-sensing reference data from GOME-2. Temperature-dependent absorption cross sections of O3 in the 231-794 nm range\", J. Quant. Spectrosc. Radiat. Transfer 61, 509 (1999)"
doi = "10.1016/s0022-4073(98)00037-5"
library = "BURROWS_1999_ATMOSPHERICREMOTESENSING"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """The GOME flight-model satellite spectrometer (four-channel Si-diode-array grating \
spectrometer, 231-794 nm) with a coolable White-type cell, absorption path 985-1465 \
cm, at 293, 273, 241, 221 and 202 K; O3 from a silent discharge in O2 (99.99 %), mostly \
in a flow of synthetic air, a few fillings to atmospheric pressure; exposure 1.125-36 s; \
dark current, stray light (uniform per channel) and lamp drift corrected; wavelength \
calibration by a fourth-order polynomial on the lines of a Pt/Cr-Ne hollow-cathode lamp \
(known to +-0.0002 nm from Fourier-transform spectra), verified against FTS spectra of \
NO2 and O3 to better than 0.03 nm; optical densities ln(I0/I) scaled and concatenated \
over 231-794 nm (pp. 509-510)."""
notes = """Identity checked against the first page (PDF page 1, journal p. 509): Burrows, \
Richter, Dehn, Deters, Himmelmann, Voigt and Orphal, JQSRT 61, 509-517 (1999), 'GOME-2' \
in the title is the second paper of the series 'reference data from GOME', not the \
GOME-2 instrument. Journal pages 509-517 = PDF pages 1-9. O3 only.

Facts for the data files (the GOME flight-model O3 set):
- Temperatures: 293, 273, 241, 221 and 202 K (p. 510).
- Resolution: 'about 0.2 nm below 400 nm and of about 0.3 nm above 400 nm' (abstract, p. \
509), 'slightly lower (up to 0.6 nm) ... between 312 and 321 nm' (footnote, p. 509); the \
instrumental line shape was 'accurately determined' (GOME Users Manual). Sampling not \
stated (diode-array pixels).
- Wavelengths: the medium is not stated. The calibration uses the Pt/Cr-Ne lamp's line \
positions from FT spectra; the tables label points by the Hg and laser lines as the \
other works do (253.65 nm; 543.516-632.816 nm, the lines of brion_1998's Table II). \
Recorded as standard air for the table points; the data file's medium must be taken \
from its header (TC-187).
- Absolute scale (pp. 510-511): the O3 concentration was not measured during the GOME \
runs. At 293 K, 300-480 nm, the cross sections were remeasured in Bremen with the same \
cell and gas system and an ARC-500 diode-array spectrometer, the O3 titrated to NO2 with \
NO (five cycles, RMS below 1 %), the NO2 from the cross sections of Ref. 2 (the GOME NO2 \
paper). The GOME 293 K optical densities were scaled to these in 300-330 nm. At the other \
temperatures the integrated optical density over 231-794 nm was scaled to the 293 K \
integrated cross section (assumed temperature-independent).
- Uncertainty: 'an overall experimental uncertainty of 2.6% for the O3 cross sections in \
the maximums of the Hartley and Chappuis bands', larger where the cross sections are \
small ('small lamp drifts ... always less than 2%'; a word is missing in print: 'In \
regions where the O3 cross sections are the experimental uncertainty becomes larger') \
(p. 510); the assumption of temperature-independent integrated cross sections adds an \
error 'estimated to be smaller than 2%' (p. 511). Level not stated.
- The published file: 'Tables of the O3 cross sections recorded with the GOME FM can be \
obtained as ASCII files upon request to the authors' (p. 516). No spectrum is printed.

Temperature effects (pp. 513-516): at 253.65 nm an increase of 1.6 % from 293 to 202 K \
(Bass and Paur, Molina and Molina and Daumont et al. report 0.9-1.0 %, Yoshino et al. \
none); the Hartley cross sections rise with temperature below 260 nm and fall above; \
strong in the Huggins bands (hot bands above 340 nm); in the Chappuis band the \
integrated cross section increases with decreasing temperature, up to 3.6 % at 202 K, \
except 241 K (-1.0 %, possibly lamp drift), against Burkholder and Talukdar's 1.2 % \
decrease at 220 K (400-750 nm); about 3 % increase near 612 nm between 298 and 202 K. \
Agreement with Bass and Paur better than 2 % up to 310 nm (Fig. 4).

Datasets: Tables 1 and 2 (images checked). Table 1 in 10^-20 cm^2 (scale 1e-20), Table 2 \
in 10^-24 cm^2 (scale 1e-24). Each temperature is its own dataset (per-row temperatures). \
'This work' values are points of the GOME spectrum at 0.2-0.3 nm resolution: 'check'.

Attribution conflict (TC-187): Table 2's 'Ref. 27' (Burkholder and Talukdar 1994) row, \
3075, 4569, 4633, 3383, is exactly the column that brion_1998's Table II attributes to \
Anderson and Mauersberger (1992) (3.075, 4.569, 4.633, 3.383 x 10^-21), with +- values; \
this paper's 'Ref. 26' (Anderson and Mauersberger) row differs (3092, 4674, 4427, \
3313). gorshelev_2014's Table 6 gives Anderson and Mauersberger (1992) the same values as \
brion_1998 (3.075, 4.569, 5.125, 4.633, 3.383) and Burkholder and Talukdar (1994) \
3.11, 4.66, 4.52, 3.37 at these lines (vacuum 543.67-632.99 nm): so this paper's Ref. \
26 and Ref. 27 labels are most likely swapped (its Ref. 26 row is not Gorshelev's \
Burkholder and Talukdar either: 4427 against 4.52 at 612 nm). Neither original is in \
the library; the datasets keep the printed labels. The Anderson and Mauersberger citation differs too: 'Geophys. Res. Lett., \
1992, 19, 923' here, '19, 933' in brion_1998."""

