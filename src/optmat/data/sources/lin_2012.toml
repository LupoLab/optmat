citation = "Z. Lin, X. Jia, C. Wang, Z. Hu, H. Kang, W. Quan, X. Lai, X. Liu, J. Chen, B. Zeng, W. Chu, J. Yao, Y. Cheng and Z. Xu, \"Ionization Suppression of Diatomic Molecules in an Intense Midinfrared Laser Field\", Phys. Rev. Lett. 108, 223001 (2012)"
