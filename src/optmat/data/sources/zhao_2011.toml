abscissa = "none"
use = "check"
notes = "Table 1, 'I_p (eV)', 'the experimental vertical ionization energies' (caption); no reference is given. Kind as the caption says; the value is near the adiabatic threshold (berkowitz_1987, 12.61 eV), about 1 eV below the vertical maxima of the 1t2 band (heilbronner_1977: 13.6, 14.4, 15.0 eV); see the record's notes."
