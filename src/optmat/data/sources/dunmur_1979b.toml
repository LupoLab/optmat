citation = "D. A. Dunmur, D. C. Hunt and N. E. Jessup, \"The influence of intermolecular interactions on the Kerr effect in gases. II. Experimental results for spherical top molecules\", Mol. Phys. 37, 713 (1979)"
doi = "10.1080/00268977900103141"
library = "Dunmur_1979_InfluenceIntermolecularInteractions_0bb7bb"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Electric-field-induced birefringence by a modulation technique (Buckingham and \
Dunmur 1968; Boyle et al. 1966) at 633 or 458 nm, relative to a fluorobenzene Kerr \
cell calibrated by the Senarmont method. 2-100 bar: a stainless-steel cell with \
parallel electrodes 205 mm long, 4.9 mm apart, in a thermostatted tank (Budenberg test \
gauge); below 2 bar: a pyrex cell with 2.965 m nickel-plated electrodes 4.98 mm apart \
(20-40 degrees C only, mercury manometer). (n_par - n_perp)/E^2 extrapolated to zero \
field at each temperature and pressure; molar volumes from Dymond and Smith's virial \
coefficients; the Kerr virial coefficients from a least-squares fit of Eq. (2) in \
V_m^-1 and T (Eqs. 6-8). Gases: Ar 99.9997 %, Kr 99.97 %, Xe 99.997 % (British Oxygen), CH4 \
99.98 % (Matheson), CF4 > 99.7 %, SF6 > 98 % (ICI), neopentane 99.99 % (pp. 714-716)."""
notes = """Part II of Dunmur and Jessup; Part I (the statistical theory, Mol. Phys. 37, 697) \
is dunmur_1979, whose Table 2 and Table 4 'expt [19]' rows reprint this paper (to be \
re-pointed; checked below). Identity checked against the first page (Mol. Phys. 37, \
713-724 (1979), received 12 May 1978). Page numbers are the journal's: pdf page 1 is the \
publisher's cover, so p. = pdf page + 711. Scope: Ar, Kr, Xe, CH4 and SF6; CF4 (Table 7) \
and 2,2-dimethylpropane (neopentane, Table 6) are not curated species (values in notes).

DEFINITIONS (pp. 715-716, 719). mK = lim_(E -> 0) 6 n (n_par - n_perp) V_m/[(n^2 + 2)^2 \
(eps + 2)^2 E^2] (Eq. 1) = A_K + B_K V_m^-1 + C_K V_m^-2 + ... (Eq. 3); the data \
[(n_par - n_perp)/E^2]_(E=0) = a0 V_m^-1 + (b0 + b1/T + b2/T^2) V_m^-2 + c0 V_m^-3 (Eq. \
2, the temperature dependence empirical; c0 omitted for the rare gases, where it \
worsened the fit), so A_K = 2 a0/27 (Eq. 6), B_K = (2/27)[b0 + b1/T + b2/T^2 - a0 (2 \
A_eps + A_r/2)] (Eq. 7), C_K Eq. (8), with Part I's polarizabilities (Eq. 9). A_K = N_A \
gamma-bar/(81 eps0), gamma-bar = (1/10)[3 gamma_abab(-w; w, 0, 0) - gamma_aabb(-w; w, 0, 0)] \
(Eq. 10, p. 719): the dc Kerr gamma^K in the Taylor-series (T) convention (as \
buckingham_1969's A_K = N gamma/81 eps0); checked, 81 eps0 A_K/N_A reproduces Table 8 \
from Tables 1-5 (7.38, 19.17, 19.17, 11.91; Xe 48.8 from the printed A_K = 41 against \
Table 8's 49.2). A_K is temperature independent for atoms and spherical tops without a \
vibrational contribution (neopentane's Kerr constant constant to +-0.5 % over 20-40 \
degrees C at fixed low density, p. 715). S.I. units as printed: A_K in C^2 m^5 J^-2 per \
mole, B_K in C^2 m^8 J^-2, C_K in C^2 m^11 J^-2, gamma in C^4 m^4 J^-3. The density \
ranges of Tables 1-7 are printed as '10^-2 V_m^-1/m^-3' (i.e. V_m^-1 in units of 10^2 mol \
m^-3); not extracted.

WAVELENGTHS: 458 nm for Ar, Kr, Xe and CH4 (Tables 1-3, 5), 633 nm for SF6 (Table 4) \
except its 297 K low-density row, which is marked 'Measured at a wavelength of 458 nm': \
so SF6's A_K and hence its gamma (Table 8) are 458 nm values. shelton_1994's Table XII \
note aa says 'dc Kerr at 633 nm except CH4 at 458 nm' (its table12_SF6_dc_kerr row 'ref \
22' is stored at 632.8 nm): for SF6 that is not what this paper prints. The He-Ne and \
argon-ion laser lines, stored as standard-air wavelengths (not said).

UNCERTAINTY (p. 716). 'In all our experiments the precision of the measurements \
exceeded their absolute accuracy, and the errors quoted for the first Kerr virial \
coefficients, except the low density result for tetrafluoromethane, represent \
calibration uncertainties'; the B_K errors estimate the accuracy from the difference \
between the global fit and fits at each temperature. Level not stated. 'The close \
agreement around room temperature between our experimental results for B_K and those \
calculated using equation (15) ... suggests that the accuracy of our results is in fact \
higher than that claimed' (p. 723). C_K are 'tentative' (abstract).

TABLE 8 LITERATURE (p. 720; reproduced datasets gamma_<process>_lit_<gas>, row = \
reference number). dc Kerr: [3] Buckingham and Dunmur 1968 (buckingham_1968: its \
0.59(4), 1.4(1), 3.9(3), 1.2(1) x 10^-36 esu of Ar, Kr, Xe, SF6 x 1.23799e-25 = 7.30(50), \
17.3(12), 48.3(37), 14.9(12) x 10^-62: all as printed here except Ar's error, 0.6 where \
0.50 converts), [5] Buckingham and Orr 1969 (buckingham_1969: 0.180(9) x 10^-60 = \
18.0(9), as printed); three-wave mixing ('TWM', process other): [22] Hauchecorne, \
Kerherve and Mayer 1971 (with Kielich 1969), [23] Rado 1967; ESHG: [24] Finn and Ward \
1971, [25] Ward and Bigio 1975, [22]; THG (printed 'gamma_TMG'): [26] Ward and New 1969 \
(ward_1969). The wavelengths of the literature values are not given here; the \
conversions to gamma-bar in C^4 m^4 J^-3 are this paper's. 'The hyperpolarizabilities \
obtained from harmonic generation experiments for krypton, xenon and tetrafluoromethane \
differ from the Kerr effect values', attributed for Kr and Xe to dispersion (p. 719). \
Out of scope: CF4 7.7 +- 0.6 (this work), 9.3 +- 0.5 [5], ESHG 6.8 +- 0.2 [25]; \
neopentane 110 +- 6, n-pentane 114 +- 36 [21].

NOT EXTRACTED (no quantity): the ratios B_K^expt/B_K^DID of Tables 1-7 and the Table 9 \
averages (Ar 0.65 +- 0.11, Kr 0.63 +- 0.09, Xe 0.67 +- 0.12, CH4 1.40 +- 0.2, SF6 2.5 +- \
0.4, CF4 1.10 +- 0.1, neopentane 3.9 +- 0.3, against Kerr and depolarized-light-scattering \
literature); Table 10, the empirical pair-anisotropy parameters x1/R0^3 (Ar -0.34, Kr \
-0.37, Xe -0.32, CH4 0.30, SF6 0.95) and x2/R0^3 (rejected), and alpha/(4 pi eps0 R0^3) \
(Eq. 13); McTague et al.'s argon parameters mu = 7.2e29 m^-3, lambda = 8e9 m^-1 (Eq. 15); \
Figs. 1-2. CF4 (Table 7, 633 nm; 296 K row at 458 nm): A_K 6.5 +- 0.4 (6.5 +- 1.3 at low \
density), B_K 54-39 x 10^-33, C_K -200 +- 200 x 10^-38 at 269-332 K; neopentane (Table 6, \
633 nm; 300 K at 458 nm): A_K 93 +- 5, B_K 4050-3010 x 10^-33, C_K -1700 +- 1000 x 10^-36.

REPRODUCTIONS ELSEWHERE (checked 2026-09-27; none of these records is from this \
extraction except shelton_1994): dunmur_1979's table2_expt_<gas> (B_K: Ar 3.8 at 305 \
K, Kr 16 at 303, Xe 98 at 302, CH4 37 at 302, SF6 470 at 303: all as in Tables 1-5) and \
table4_expt_CH4 (-450 x 10^-38 at '300 K': Table 5's 302 and 312 K value) and \
table4_expt_SF6 (-10000 x 10^-38 = -100 x 10^-36, Table 4); shelton_1994's \
table12_CH4_dc_kerr and table12_SF6_dc_kerr rows 'ref 22' (3079 +- 160 au = 19.2(10) x \
10^-62/6.23538e-65, and 1908 +- 133 au = 11.9 x 10^-62, whose 0.8 converts to 128, not \
133; re-pointed there); hattig_1998's expt_dc_kerr_Ar row at 457.9 nm, 1187 +- 96 au \
(7.39(60) x 10^-62 converts to 1185(96); 1187 is 7.40)."""


