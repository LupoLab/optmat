[[formulas]]
id = "rate_equation"
equation = "Eq. (1), p. 4078"
printed = "\\frac{dn}{dt} = \\alpha I(t) n(t) + \\sigma_k I^k"
variable = "n: free-electron density (cm^-3); I(t): laser intensity (TW/cm^2 with sigma_k's unit); k: the smallest integer with k hbar omega >= Delta; breakdown when n reaches n_th = 1e21 cm^-3"
range = "fitted to tau >= 20 fs; for shorter pulses the perturbative MPI term 'tends to fail' as the Keldysh parameter approaches 1 (dotted curves of Fig. 3)"
coefficients = { alpha_FS = "4 cm^2/J", sigma_6_FS = "6 x 10^(8 +- 0.9) cm^-3 ps^-1 (cm^2/TW)^6", alpha_BBS = "1.2 cm^2/J", sigma_3_BBS = "7 x 10^(17 +- 0.5) cm^-3 ps^-1 (cm^2/TW)^3", n_th = "1e21 cm^-3" }
check = "Solved for a Gaussian pulse of the stated FWHM with the peak fluence (computed 2026-09-27): F_th(FS) = 1.58 J/cm^2 at 10 fs (the text: ~1.5 J/cm^2 for tau <= 10 fs); photoionised fraction at threshold 4.7e-4 and 1.8e-7 at 50 and 500 fs (printed 1.5e-4 and 4e-8) for FS and 0.40 and 0.073 (printed 0.35 and 0.09) for BBS: order-of-magnitude agreement (source notes)."
notes = "The rate equation of Stuart et al. (stuart_1996, Ref. 6); no recombination term."

