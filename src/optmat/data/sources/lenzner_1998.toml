abscissa_unit = "nm"
use = "primary"
notes = "p. 4078: 'sigma_6 = 6 x 10^(8 +- 0.9) cm^-3 ps^-1 (cm^2/TW)^6 for FS': the six-photon term of Eq. (1), a generation rate per unit volume (no atom density), = 6.0e-52 cm^-3 s^-1 (cm^2/W)^6. The uncertainty is in the exponent (a factor 10^0.9 = 7.9 either way), from a factor-2 increase of chi^2; the format cannot express it as a sigma. Six orders of magnitude below the Keldysh rate (m_eff = 0.5 m)."
[datasets.parameters]
