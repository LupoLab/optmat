unit = "cm2/J"
abscissa_unit = "nm"
use = "primary"
notes = "p. 4078: 'alpha_bbs = (1.2 +- 0.4) cm^2/J', fitted with sigma_3 to the BBS (Corning 7059) thresholds for tau >= 20 fs; the error as for alpha_fs."
[datasets.uncertainty]
column = true
level = "not stated"
[datasets.parameters]
