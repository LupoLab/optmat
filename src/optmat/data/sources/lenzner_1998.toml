unit = "cm-3 ps-1 (cm2/TW)3"
abscissa_unit = "nm"
use = "primary"
notes = "p. 4078: 'sigma_3 = 7 x 10^(17 +- 0.5) cm^-3 ps^-1 (cm^2/TW)^3 for BBS': the three-photon term of Eq. (1), per unit volume, = 7e-7 cm^-3 s^-1 (cm^2/W)^3. Uncertainty a factor 10^0.5 = 3.2 either way (not expressible as a sigma). 'more than 2 orders of magnitude smaller' than the Keldysh rate (m_eff = m)."
[datasets.parameters]
