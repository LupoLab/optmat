citation = "X. Zhao, X. Yu, X. Xu, Z. Yin, J. Yu, X. Li, P. Ma, D. Zhang, C. Wang, S. Luo and D. Ding, \"Ultrafast dissociation dynamics of singly and doubly ionized N2O in strong laser fields\", Phys. Rev. A 101, 013416 (2020)"
doi = "10.1103/PhysRevA.101.013416"
library = "Zhao_2020_UltrafastDissociationDynamics"
identity = "VALIDATED"
kind = "measurement"
technique = """Strong-field pump-probe Coulomb explosion imaging of N2O in a COLTRIMS: an \
800 nm, ~35 fs, 1 kHz pump, linear, 1.0 x 10^14 W/cm2, and an elliptical probe \
(epsilon ~ 0.7, 3.5 x 10^14 W/cm2), roles exchanged at negative delay; delays -2 to 6 \
ps in 33.3 fs steps, cross-correlation 90 fs FWHM. Only the three-body channel N2O3+ \
-> N+ + N+ + O+ is analysed (momentum-sum condition < 3 a.u.) (p. 2)."""
notes = """PRA 101, 013416, pages 013416-1 to -7 = pdf pages 1-7. Identity checked on pdf \
page 1 (title, authors, journal line, DOI). The same group and apparatus as zhao_2023, \
which takes the two-body channels and gives their KERs.

WHY NO DATASETS (TC-970). Every KER printed here is the Coulomb-explosion energy of the \
triply charged ion the probe makes, a probe of the geometry at the delay, not the \
energy released by a dissociation of the pulse's products:
- the KER bands (p. 2): 17-25 eV, delay independent (triple ionisation by one pulse); \
1.5-7 eV (the low band, assigned to N2O+ ionised further) and 7-16 eV (the high band, \
N2O2+ ionised further); the low band falls fast in the first 500 fs and slowly over the \
next few ps, the high band falls to 'around 8 eV in the first 200 fs' and stays \
constant (p. 2). No time constant is fitted.
- fragment energies in the probe's explosion (pp. 4-6): O+ around 4 eV from the first \
step N2O2+ -> N2+ + O+, constant with delay; N+ around 5 eV from N2O2+ -> N+ + NO+; the \
explosion of NO^2+ (NO+ ionised by the probe) about 9.5 eV in total (N+ \
around 5, O+ around 4.5 eV); the O+ of the three-body N+ + N+ + O channel falls from 1.5 \
eV at 400 fs to 0.5 eV at 1500 fs; in the N + N+ + O+ channel the ion from the neutral \
atom has about 1.5 eV and the other two share about 7.5 eV at 400 fs.

STATES AND CHANNELS (assignments, pp. 1-3, 5-6): the low KER band's fast fall is \
assigned to dissociation on N2O+ B 2Pi, with significant bending before it dissociates \
(Dalitz plots, Fig. 3), and with the concerted breakup dominant and the sequential \
breakup growing with delay. N2O2+: X 3Sigma-, 1 1Delta and 1 1Sigma+ dissociate to N+ \
+ NO+, the higher 1 3Pi and 1 1Pi to N2+ + O+ by coupling to other states (quoted from \
their Refs. 21, 31, 39); two two-body (N+ + NO+, N2+ + O+) and two three-body (N+ + N + \
O+, N+ + N+ + O) channels of the dication are identified.

QUOTED LIFETIMES (p. 1, not taken; the originals are not in the library): N2O+ A \
2Sigma+ vibrational levels 'tens to hundreds of nanoseconds' (their Refs. 20-22); B \
2Pi 30 fs from two-photon absorption spectroscopy (Ref. 23); C 2Sigma+ ~2 ps from \
ion-electron coincidence (Ref. 24). The fast decay of the low band is 'a little longer \
than the estimated lifetime of B 2Pi (~30 fs)' (p. 2; no number).

FIGURES FOR LATER (TC-970): Fig. 2(a), the KER against delay (a raster map with vector \
axes), if a time constant of the B 2Pi dissociation is wanted; the delay-resolved \
correlations (Figs. 4-6, vector) are not relevant to the products."""
