check = "Tables 2-4 checked cell by cell against their images (2026-09-26); Table 3's extraction splits '7 +- 2' into two columns, the image is unambiguous. Not evaluated: the exciton convention (Eq. (16) against franta_2015b Eqs. (26)-(27)) is ambiguous (TC-387), and no n, k table is printed to compare with."
notes = "Units: N in eV^2; E_g, E_ex, B_ex, E_h, E_x, E_u, E_loc, B_loc in eV; nu_ph and beta_ph (FWHM) in cm^-1 (converted as franta_2015b Eq. (46)). The *_sigma keys are the printed least-squares standard deviations. Table 2 marks A_0 (0 +- 2), A_ex1 (1), E_h (20 +- 3) and E_x (12 +- 2) '(fixed)'; the text (p. 9111) says only A_ex,1 was fixed and (p. 9116) that E_h and E_x were fixed from first-principles estimates. A fixed parameter printed with a standard deviation is contradictory (TC-387); the values are recorded as printed. No loc peak count other than one; four phonon peaks."
