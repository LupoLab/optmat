citation = "C. Cuthbertson and M. Cuthbertson, Proc. R. Soc. London A 84, 13 (1910)"
doi = "10.1098/rspa.1910.0052"
library = "Cuthbertson_1910_RefractionDispersionArgon"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Jamin refractometer (as in Cuthbertson and Metcalfe 1908), Lowry's arc with \
cadmium-silver poles (and a silver-lithium electrode for Li 6707.85 A in the later \
experiments); 300-550 bands read at the green mercury line. Argon: the refractivity \
at 5461 A is the mean of seven absolute experiments (1.00028183 to 1.00028258, mean \
1.00028230), the dispersion relative to it at seven lines. He, Ne, Kr, Xe: dispersion \
only, relative to absolute 5461 A values 'not redetermined, but taken from our \
previous measurements' (printed in large type in Table II) (pp. 13-15)."""
notes = """All values of the paper's own are doubled refractivities, 2 (mu - 1), 'in order \
to facilitate comparison with the diatomic gases' (p. 13); the datasets' scales \
include the factor 1/2, and the formulas are for 2 (mu - 1). The earlier-work table \
(Rayleigh ... Ahrberg) is not doubled.

State: not stated in this paper. The companion neon paper (cuthbertson_1910b, p. 149) \
gives its refractivity 'at 0 degrees C. and 760 mm', and the absolute values here are \
taken from the earlier papers, so 1 atm, 0 degrees C is assumed, with the density \
convention unknown.

Wavelengths: the printed 6707.85 (Li), 6438.5 (Cd), 5790.5, 5769.5, 5460.7 (Hg), \
5209.1 (Ag), 5085.8, 4799.9 (Cd) A are the air wavelengths of those lines (5461 A in \
the text), so the medium is taken as standard air (1910 air, the difference is \
negligible here).

Formulas: mu - 1 = C/(n0^2 - n^2), n = V/lambda. With V = 3e10 cm/s and the printed \
(air) wavelengths the Table III constants reproduce the calculated columns to within \
0.7 printed units (He 0.06), except krypton at 6707.85 A (formula 85052.5, printed \
85055); with V = 2.99796e10 they do not (argon off by 0.9-1.5). Checked 2026-09-24.

Accuracy (p. 14): argon's 'relative refractivities for different wave-lengths can \
generally be trusted to one or two points in the fifth significant figure', the \
discrepancies corresponding to 'less than one-fiftieth of an interference band'; for \
the other gases 'the discrepancies between the observed and calculated results are of \
the same order'. The per-point uncertainties below are the rms of the paper's obs - \
calc differences (Ar 2.2, He 0.36, Ne 1.0, Kr 5.2, Xe 0.79 printed units); the argon \
scale uncertainty is the spread of its seven absolute values (+-0.13 %).

The helium value printed at 5769.5 A (6963.8) is set aside: it is 19.7 below the \
formula (6983.5), below the 6438.5 A value (6972.6), which normal dispersion forbids, \
while every other helium row agrees with the formula to 0.7. It is either a misprint \
for 6983.8 (one digit) or a miscount by one band (with about 349 bands at 5461 A one \
band is about 1/349 of the value, 20.0 printed units); both give about 6983.8, but \
which it is cannot be decided, so the point is excluded, not corrected. The same line \
is the one the authors rejected for argon."""

[[datasets]]
id = "experiment_Ar"
material = "Ar"
file = "Ar/cuthbertson_1910__experiment_Ar.csv"
table = "tbl_7e2ecfe6276e"
quantity = "refractivity"
scale = 5e-9
abscissa_unit = "angstrom"
wavelength_medium = "standard_air"
state = "1atm_0C"
density = "unknown"
use = "primary"
notes = "Table I, observed, doubled (x 10^8 per the image; the library header's 10^9 is a misreading). The 5460.7 A value is the absolute one."
[datasets.uncertainty]
absolute = 2.2
level = "rms"
