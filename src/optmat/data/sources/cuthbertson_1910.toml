id = "he_1910"
material = "He"
equation = "Table III, p. 15"
printed = "mu - 1 = C/(n0^2 - n^2); C x 10^-27 = 2.42476, n0^2 x 10^-27 = 34991.7 (maximum number of bands read 349)"
variable = "n = V/lambda, frequency in s^-1, lambda the air wavelength in cm, V = 3e10 cm/s (implied)"
state = "1atm_0C"
density = "unknown"
range = "480-644 nm"
coefficients = { C = "2.42476e27", n0_squared = "34991.7e27" }
check = "Gives the doubled refractivity 2 (mu - 1): reproduces Table II's calculated helium column to within 0.06e-8. Checked 2026-09-24."
notes = "For 2 (mu - 1); cuthbertson_1932 Table I quotes it halved (C = 1.21238e27)."

