citation = "J. W. Schmidt and M. R. Moldover, \"Dielectric Permittivity of Eight Gases Measured with Cross Capacitors\", Int. J. Thermophys. 24, 375 (2003)"
doi = "10.1023/A:1022963720063"
library = "Schmidt_2003_DielectricPermittivityEight"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Relative dielectric permittivity eps(p, T) from a four-ring toroidal cross \
capacitor (superinvar electrodes, sapphire-ball insulators; the capacitor, bridge, \
thermometers and pressure instruments of Moldover and Buckley 2001, 'MB'), eps_expt = \
[C_x(p)/C_x(0)](1 + k_T p/3) with the measured superinvar compressibility k_T = (9.43 +- \
0.38)e-12 Pa^-1 (Eq. 4); capacitance ratios with sub-ppm resolution (a commercial \
bridge). The deformation model is tested absolutely against the ab initio eps(p, T) of \
helium (<eps_expt - eps_theory> = (-0.05 +- 0.21)e-6, Fig. 3), and argon was measured \
simultaneously with a 16-rod stainless-steel cross capacitor (<eps_rod> - <eps_ring> = \
(0.161 +- 0.025)e-6 (p/MPa), 3e-5 A_eps of argon; Sect. 4). Isotherms at 0, 23, 29.3 \
and 40 degrees C (and MB's 50 degrees C data, included in the fits), pressures to 7 MPa \
in 1 MPa steps up and down, 3 to 7 h per step; temperatures within 2 mK (ITS-90), \
pressure uncertainty 3e-5 p + 84 Pa. Densities from the reference equations of state: \
Tegeler et al. 1999 (Ar), Span et al. 2000 (N2), Schmidt and Wagner 1985 (O2), \
Setzmann and Wagner 1991 (CH4), Span and Wagner 1996 (CO2) (pp. 3-19)."""
notes = """Identity checked against the first page (the pdf is an author copy titled \
'EightGasEpsValues'; journal pages 375-403 = pdf pages 1-29). Page numbers below are \
pdf pages.

WHAT A_eps IS. Molar polarizability wp = [(eps - 1)/(eps + 2)]/rho = A_eps(1 + b rho + \
c rho^2 + ...) (Eq. 5); the fits use Eq. (9): (eps - 1)/(eps + 2) = A_eps,273 rho (1 + b \
rho + c rho^2) + A_tau rho (T/273.16 K - 1) + q rho^2 (273.16 K/T - 1), 'at most four \
coefficients' per fit, all data weighted equally (p. 18). A_eps,273 is the zero-density \
molar polarizability at 273.16 K where A_tau is fitted, and a temperature-independent \
A_eps over 0-50 degrees C where it is not. It is the static (bridge-frequency) value: \
for Ar, N2 and O2 (no infrared-active vibration, no dipole) the electronic \
polarizability; for CH4 and CO2 it includes the static vibrational polarizability \
(hohm_2013 subtracts 0.23 au from CH4 and 2.18 au from CO2, i.e. 0.086 and 0.81 \
cm^3/mol). b, c, A_tau and q are dielectric virial and temperature coefficients whose \
uncertainties 'from the equations of state are much larger than the indicated \
uncertainties' (Table V caption); b is 'determined via subtraction: b ~ B - A_eps + \
a_2/(3 A_eps)' and its uncertainty 'is dominated by the uncertainty of B' (p. 20). They \
are recorded only in the formulas (no quantity holds b, a virial per unit A_eps; \
B_eps = A_eps b).

UNCERTAINTY (pp. 19-20, 25). Table V caption: 'For the more satisfactory fits, the \
uncertainty of the last two digits of each coefficient is shown in parentheses. The \
uncertainty of A_eps,273 from the elastic properties of the capacitor is 1.1e-4 \
cm^3 mol^-1.' No level is stated for the parentheses (fit uncertainties); stored as the \
sigma column, level 'not stated'. The accuracy is larger: 'the uncertainty of \
A_eps,273 is the quadrature sum of three terms: delta x A_eps,273, 1e-6 \
A_eps,273/(eps_max - 1), and 1.1e-4 cm^3 mol^-1' with delta ~ 3e-5 from the pressure \
measurements (p. 19), and for N2 (p. 25) 'The error from the fit must be augmented by \
the three contributions ... 1.3e-4 cm^3 mol^-1 from pressure measurements, 1.1e-4 from \
capacitance measurements, and 1.1e-4 from the deformation of the ring capacitor'. \
Computed here from that budget (not printed; eps_max from the 0 degrees C column of \
Table IV): the three terms add in quadrature to about 1.9e-4 (Ar, O2), 2.0e-4 (N2) \
and 2.4e-4 cm^3/mol (CH4); with the printed fit uncertainty, about 2.7e-4 (Ar), \
2.7e-4 (N2, two-parameter fit), 2.1e-4 (O2, A_tau fit), 3.9e-4 cm^3/mol (CH4, \
four-parameter fit), i.e. 50-65 ppm. The p. 25 text gives N2 'A_eps = (4.3878 +- \
0.0009) cm^3 mol^-1 where our uncertainty is from the two-parameter fit in Table V', \
five times Table V's (18) in the last digits: unexplained (0.0009 is also not the \
budget above). Temperature dependence: 'the three parameters A_eps,273, A_tau and b in \
Eq. (9) are of interest to theory' (p. 19); A_tau of O2 0.0065 cm^3/mol (Younglove's \
-0.0059 inconsistent, p. 22), of N2 0.0017 (lowers sigma from 0.91 to 0.69), of CH4 \
~6e-3 (four parameters) or ~11e-3 with a fifth parameter b_tau, bracketing Wong et al.'s \
calculated 8.4e-3 and below Bose et al.'s (1972) 17e-3 (p. 22).

PREFERRED FITS. N2: the text quotes the two-parameter value (p. 25). O2: the A_tau fit \
(Fig. 5d; 'This is evidence that A_eps is temperature-dependent', p. 21). CH4: the \
four-parameter fit ('All four parameters are statistically significant', p. 22). \
CO2: the four-parameter fit with q (Fig. 7b; 'a temperature-dependent A_eps was much \
less significant than a rho^3 term', p. 25). Every A_eps is recorded, use = check.

COMPARISONS (pp. 25-27). Ewing and Royal (2002), N2 at 300 K: A_eps = 4.3921 +- \
0.0019, differing by 0.0043 +- 0.0021 cm^3/mol, 'the known uncertainties are too small \
to explain the small inconsistency'. Straty and Goodwin's CH4 wp lies 0.11-0.17 % below; \
Malbrunot et al. A_eps +- 0.002; Bose et al. (bose_1972) at 280, 323, 373 K; CO2's q \
agrees with Bose and Cole's B_eps decrease of 6.9 +- 1.3 cm^6/mol^2 from 29.4 to 49.7 \
degrees C ('our value for the decrease is 6.5'). Oxygen agrees with Younglove within \
scatter (Fig. 9).

Not extracted (no quantity, or not a curated species): Tables I-IV, the raw 100(eps - 1) \
against p (kPa): He at 29.3 and 0.019 degrees C (Table I, the helium test), propane and \
ethane (Table II), and CH4, N2, CO2, Ar, O2 at 29.3 degrees C (Table III, whose Methane \
and Nitrogen columns are merged into shared cells in the CSV, with N2's two extra \
points 3244.67/1.71409 and 2269.70/1.19627 merged into the last row) and 0.019 degrees C \
(Table IV). They are used below only to check the Eq. (9) formulas. The propane, ethane \
and CO2 three-parameter rows of Table V; the propane dipole term (Eq. 10, mu = 0.0848 D). \
Helium: no A_eps is fitted here (MB's recommended helium values are used for the \
theory comparison, p. 9).

Reproductions of this paper: may_2008 (schmidt_moldover_2003_O2, its alpha_e 1.7461e-40 \
F m^2 = 3 eps0 A_eps/N_A of the O2 A_tau fit, 3.95875) and yang_2025 \
(schmidt_moldover_2003_N2, 4.3877(2)) cite it. May et al. (2008) also REFIT these O2 \
eps(p, T) data together with theirs (their Eq. 19): may_2008's recommended O2 value is \
not independent of the O2 rows here (double-counting risk). hohm_2013 cites it for N2 \
(11.7379 au, the mean of the two N2 fits, 4.38765 cm^3/mol), O2 (with may_2008), CO2 \
(19.652 au = 7.34590) and CH4 (in a mean)."""

