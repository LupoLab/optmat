material = "H2"
file = "H2/wahlstrand_2015__n2_elec_H2.csv"
table = "tbl_64c4c34f908d"
quantity = "nonlinear_index"
unit = "cm2/W"
scale = 1e-20
abscissa_unit = "nm"
state = { pressure_pa = 101325.0, temperature_k = 290.9 }
use = "primary"
notes = "Table I, n2,elec^s 'This expt.': the electronic self coefficient at 1 atm (290.9 K, the density of the N2 flow calibration, as wahlstrand_2012; TC-316), pump 800 nm, probe 600 nm; vibrational part separated by resonant two-beam coupling, rotational part by its delay."
