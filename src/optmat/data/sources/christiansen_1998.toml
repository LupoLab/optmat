[[formulas]]
id = "co_cauchy"
material = "CO"
equation = "Eq. (7), p. 4752, with Table VII, p. 4753"
printed = "alpha_XY(-omega, omega) = sum_{k>=0} S_XY(-2k-2) omega^(2k); CO: S_xx(-2) 11.837, S_zz(-2) 15.666, S_xx(-4) 46.4, S_zz(-4) 49.2, S_xx(-6) 315, S_zz(6) 194, S_xx(-8) 0.3x10^4, S_zz(8) 0.8x10^3"
variable = "omega: photon energy in hartree (atomic units); alpha in atomic units, per component; the mean is (2 alpha_xx + alpha_zz)/3"
state = "none (per molecule)"
density = "none"
range = "'accuracy of 0.01 a.u. for omega < 0.02 a.u.' for N2 and HF 'and < 0.01 a.u. for CO' (p. 4752, as printed; the text is garbled, and Table X uses the series up to 457.9 nm, omega = 0.0995)"
coefficients = { Sxx_m2 = "11.837", Szz_m2 = "15.666", Sxx_m4 = "46.4", Szz_m4 = "49.2", Sxx_m6 = "315", Szz_m6 = "194", Sxx_m8 = "0.3e4", Szz_m8 = "0.8e3" }
check = "The k > 0 moments added to the estimate 1 static mean (13.066) reproduce Table X's electronic CO values at 457.9, 488.0, 514.8 and 632.8 nm (as vacuum wavelengths) to within 0.004 a.u.: 13.5638, 13.5010, 13.4547, 13.3191 against 13.56, 13.50, 13.45, 13.32. Mean moments: S(-4) 47.33, S(-6) 274.7, S(-8) 2267 (computed; zhao_2026 quotes Kumar and Meath's 48.26, 292.9, 2308). Checked 2026-09-25."
notes = "Unrelaxed CCSD/aug-cc-pVQZ, fitted to vibrationally averaged polarizabilities at several frequencies (a fit, not an analytic moment calculation). Printed headers S_zz(6) and S_zz(8) are S_zz(-6) and S_zz(-8) (lost minus signs; image checked). S(-2) here is CCSD/aug-cc-pVQZ, not the final estimate; Table X combines the final static value with these k > 0 moments."

