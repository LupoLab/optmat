citation = "O. Christiansen, C. Hattig and J. Gauss, \"Polarizabilities of CO, N2, HF, Ne, BH, and CH+ from ab initio calculations: Systematic studies of electron correlation, basis set errors, and vibrational contributions\", J. Chem. Phys. 109, 4745 (1998)"
doi = "10.1063/1.477086"
library = "Christiansen_1998_PolarizabilitiesCON2"
identity = "VALIDATED"
kind = "theory"
technique = """Coupled-cluster linear response (CCS, CC2, CCSD, CC3, CCSDT; orbital-relaxed \
and unrelaxed; CCSD(T) static polarizabilities analytically, CC3 and CCSDT by finite \
field) with correlation-consistent basis sets up to d-aug-cc-pV5Z (326 functions), \
DALTON and ACES II. Correlation benchmark at aug-cc-pVTZ against CCSDT (Table III); \
basis-set study at the unrelaxed CCSD level (Table IV); fixed bond lengths R_CO = \
2.132 a.u., R_NN = 2.068 a.u. Vibrational averaging over v = 0 and the pure \
vibrational polarizability from CC potential and property curves (aug-cc-pVQZ; \
nuclear Schrodinger equation by the 'renormalized Numerov-Cooley approach', spline \
interpolation of the property curves, sum over vibrational states), Tables V, VI, \
VIII (pp. 4746-4748). The isotropic polarizability is (alpha_xx + alpha_yy + \
alpha_zz)/3 (p. 4748)."""
notes = """The library identity is VALIDATED (DOI 10.1063/1.477086); first page checked \
(pdf page 2: J. Chem. Phys. 109, No. 12, 22 September 1998, p. 4745; pdf page 1 is the \
publisher's cover). Page numbers here are journal pages (pdf page + 4743). Only CO, N2 \
and Ne are curated; HF, BH and CH+ are skipped.

WHAT IS COMPUTED. 'Electronic' polarizabilities are the static or dynamic responses of \
the electrons at fixed nuclei; 'vibrationally averaged' ones are averaged over the \
ground vibrational state (v = 0); the 'pure vibrational' polarizability is the \
response through the infrared transitions (Eq. 8, oscillators of Table VIII). \
Rotation is not treated (no orientation term). All values are in atomic units.

FINAL STATIC ELECTRONIC VALUES (Table IX, p. 4754), tensor components at the fixed \
R_e. Estimate 1 = CCSD(T)/aug-cc-pVQZ + basis-set correction (unrelaxed CCSD \
d-aug-cc-pV5Z minus aug-cc-pVQZ) + CCSDT(r) - CCSD(T) correlation correction; estimate \
2 = CCSD(u)/d-aug-cc-pV5Z + CCSDT(u) - CCSD(u). Final estimate (their average): CO \
alpha_xx 11.83, alpha_zz 15.41; N2 10.15, 14.70; Ne 2.66 (every sum and average \
checked, 2026-09-25). 'The polarizability components are accurate within a few \
hundredth of an a.u.' (p. 4754). Vibrationally averaged, estimate 1: CO 11.85, 15.49; \
N2 10.20, 14.88; with the pure vibrational term: CO 11.85, 15.86 (N2 unchanged). The \
isotropic means of these (2 alpha_xx + alpha_zz)/3 are printed in Table X and \
extracted from there. Basis-set limits (Table IV, CCSD(u)): the aug-cc-pVQZ values \
lie within 0.05 a.u. of d-aug-cc-pV5Z for CO and N2 and 0.07 a.u. for Ne (p. 4750); \
d-aug-cc-pV5Z: CO 11.790, 15.569; N2 10.085, 14.516; Ne 2.668 (the benchmark tables \
III and IV, method by method and basis by basis, are not extracted). Also in Table IX: \
previous calculations (MCSCF, SOPPA, MP2, CCSD(T) of Refs. 40-48; the MP2 and CCSD(T) \
rows are printed shifted one pair of columns to the left, image checked: MP2 is CO \
11.97, 15.60 and N2 10.12, 14.29) and Kumar and Meath's DOSD values (Refs. 50, 51: CO \
11.89, 15.46; N2 10.21, 14.80), not extracted. BH's printed estimate 2, 20.090, is not \
21.042 - 0.133 = 20.909 (a misprint; BH is not curated).

VIBRATIONAL CONTRIBUTIONS (Table VI, aug-cc-pVQZ, p. 4752). Vibrational averaging \
raises CO by 0.02 (xx) and 0.11 (zz, CCSD(T)), N2 by 0.03 and 0.09. The pure \
vibrational static polarizability of CO is alpha_zz = 0.37 (CCSD(T); 0.36 CCSD, 0.68 \
CCS, 0.07 CC2: 'rather dramatic variations', p. 4752), i.e. 0.12 a.u. in the mean \
(0.1246 from Table VIII's CCSD(T) oscillators, computed here), against Bishop and \
Cheung's 0.1213 a.u. (bishop_1982, Table 1: 0.020 x 10^-40 C^2 m^2 J^-1). N2 has none. At optical \
frequencies the pure vibrational term is small and negative (Table X 'Vibrational', \
mean alpha of CO -0.001, -0.001, -0.002, -0.002 a.u. at 457.9, 488.0, 514.8, 632.8 nm; \
not extracted: a contribution, not a polarizability). 'Such extrapolations [of optical \
data to zero frequency] do not - or only partially - include the vibrational \
contribution' (p. 4754).

TABLE X (p. 4755), the extracted values: isotropic alpha (a.u.). 'Electronic' static = \
the vibrationally averaged estimate 1; its frequency dependence from the Cauchy \
moments of Table VII (k > 0, CCSD/aug-cc-pVQZ); the pure vibrational term from Table \
VIII (CCSD(T)). All checked: estimate 1's mean (CO 13.066, N2 11.762) plus the moment \
series reproduces every dynamic value to 0.005 a.u. (N2 at 488.0 nm: 12.016 against \
12.01), with the wavelengths as vacuum wavelengths. The CO 'Electronic+Vibrational' \
static 13.18 is 0.01 below 13.066 + 0.1246 = 13.191 (rounding in the paper; its \
anisotropy 4.01 checks). Wavelengths are the argon-ion and He-Ne lines as printed \
(nm); the medium is not stated. The theory rows are recorded as vacuum wavelengths \
(the calculation is at the frequency; the 0.03 % air-vacuum difference changes alpha \
by < 1e-4 of itself); the experimental rows as standard air, as alms_1975 records \
these lines. The anisotropies Delta alpha (CO 3.64 static electronic, 4.01 with the \
vibrational term, 3.65 at 457.9-632.8 nm; experiment 3.59 at 632.8 nm, Bridge and \
Buckingham) are not extracted (later phase).

EXPERIMENTAL VALUES IN TABLE X, reproduced: b 'Extrapolated from refractive index in \
Ref. 36' (Werner and Meyer 1976, a theory paper quoting it); c Ref. 58 (Bridge and \
Buckingham 1966); d Ref. 55 (Alms et al. 1975 = alms_1975); f Ref. 57 (Muenter 1972, \
the HF Stark-effect paper: implausible as the source of neon's 2.669, see the \
dataset); g Ref. 49 (Kumar and Meath 1985) on N2's anisotropy 4.69, which the text \
attributes to Ref. 56 (Buckingham et al. 1970; footnote h is printed but not used in \
the table): the footnote letters are inconsistent. The paper's accuracy statement for \
the comparison: 'For the isotropic part the values obtained in this way agrees within \
0.05 a.u. with the given estimates for the electronic contributions' (p. 4755).

FORMULAS. Table VII's Cauchy moments (components) are recorded as the formulas \
co_cauchy and n2_cauchy; Table VIII's vibrational oscillators of CO as co_vibrational. \
Printed misprints: Table VII's headers S_zz(6) and S_zz(8) lack the minus signs of \
S_zz(-6), S_zz(-8) (image checked; the sums require k < 0); Table VIII's CCSD(T) CO \
omega_1 is printed 0.09785 for 0.009785 (see co_vibrational).

THIRD-ORDER DATA (2026-09-26). The paper has no hyperpolarizability (gamma) \
values: nothing of that kind is added. The polarizability ANISOTROPIES of Table X (the \
columns Delta alpha = alpha_zz - alpha_xx, p. 4755), needed to separate the rotational \
(orientational) Kerr and Raman responses, are now extracted for CO and N2 \
(anisotropy_* datasets, quantity polarizability_anisotropy, a.u.): electronic \
(vibrationally averaged, static and 457.9-632.8 nm; CO 3.64 static, 3.65 optical; N2 \
4.68, 4.83-4.75), CO electronic + pure vibrational static 4.01 (N2's equals its \
electronic value and is not written again), and the experimental values as reproduced: \
N2 footnote d (Alms et al. 1975 = alms_1975: 4.45 static, 4.89, 4.85, 4.82, 4.69 at \
457.9-632.8 nm), N2 footnote g (4.69 static; see the footnote inconsistency above: Ref. \
49 Kumar and Meath 1985, or Ref. 56 Buckingham et al. 1970 per the text), and footnote \
c (Bridge and Buckingham 1966, 632.8 nm: CO 3.59, N2 4.70). The pure vibrational \
anisotropy of CO at optical frequencies (-0.004 to -0.007) is a contribution, not \
extracted. Accuracy: 'a few hundredth of an a.u.' for the components (p. 4754)."""

