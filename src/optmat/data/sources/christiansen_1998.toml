[[formulas]]
id = "co_vibrational"
material = "CO"
equation = "Eq. (8), p. 4753, with Table VIII (CCSD(T) row), p. 4754"
printed = "<<X,Y>>^v_omega = sum_k f_k^XY/(omega^2 - omega_k^2); CO, CCSD(T): omega_1 0.09785, f_1 0.3572x10^-4, omega_2 0.01954, f_2 0.299x10^-6, omega_3 0.02917, f_3 0.50x10^-8, omega_4 0.03868, f_4 0.1x10^-11"
variable = "omega: photon energy in hartree; the pure vibrational alpha_zz = -<<z,z>> = sum_k f_k/(omega_k^2 - omega^2) in atomic units (alpha_xx has none); the mean is alpha_zz/3"
state = "none (per molecule)"
density = "none"
range = "static to optical; the poles are the fundamental and overtones of CO's ground state (v = 0 -> k)"
coefficients = { omega1 = "0.09785", f1 = "0.3572e-4", omega2 = "0.01954", f2 = "0.299e-6", omega3 = "0.02917", f3 = "0.50e-8", omega4 = "0.03868", f4 = "0.1e-11" }
check = "omega_1 is misprinted (image checked: 0.09785): with it the static alpha_zz^v is 0.0045, not Table VI's 0.37, and the optical values change sign. With omega_1 = 0.009785 (half of omega_2 less anharmonicity, and the CCSD omega_1 is 0.01006) the static alpha_zz^v is 0.3739 (Table VI: 0.37) and alpha_zz^v at 457.9, 488.0, 514.8, 632.8 nm is -0.0037, -0.0042, -0.0047, -0.0071, the mean -0.0012, -0.0014, -0.0016, -0.0024: Table X's 'Vibrational' Delta alpha -0.004, -0.004, -0.005, -0.007 and alpha -0.001, -0.001, -0.002, -0.002. Read omega_1 = 0.009785 (2147.6 cm^-1). The CCSD row (omega_1 0.01006, f_1 0.3623e-4, ...) gives a static 0.3585 (Table VI: 0.36). Checked 2026-09-25."
notes = "The pure vibrational polarizability of CO at aug-cc-pVQZ; the static mean 0.1246 a.u. compares with Bishop and Cheung's 0.1213 a.u. (bishop_1982). The CCSD row: omega 0.01006, 0.02000, 0.02984, 0.03957; f 0.3623e-4, 0.218e-6, 0.12e-8, 0.5e-11 (image checked)."
