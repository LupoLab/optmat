coefficient_units = { gamma0 = "au", A = "au", B = "au" }
reproduced_from = ["H. J. Aa. Jensen, P. Jorgensen, H. Hettema and J. Olsen, Chem. Phys. Lett. 187, 387 (1991)"]
check = "A = 2.55 au = 0.5294e-10 cm^2, B = 5.94 au = 0.2560e-20 cm^4: shelton_1994 Table VII's 0.529 and 0.256 (with gamma_0 = 99, Jensen et al.'s adjusted best static value). Checked 2026-09-26."
notes = "Fitted to Jensen et al.'s CASSCF curve (Ref. [4]). 'The best static value given by Jensen et al. [4] includes an adjustment based on the estimated effect of adding more correlating orbitals; the difference between their stated best static value of gamma [99 +- 6 au] and the static intercept of the dispersion curve given in table 2 and fig. 1 is due to this adjustment' (pp. 4-5)."

