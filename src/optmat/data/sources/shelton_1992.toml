citation = "D. P. Shelton and E. A. Donley, Chem. Phys. Lett. 195, 591 (1992)"
doi = "10.1016/0009-2614(92)85568-u"
library = "Shelton_1992_HyperpolarizabilityDispersionNeon"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """ESHG with periodic phase matching relative to He, as in shelton_1990 and \
Shelton & Lu 1988: argon-ion laser (514.5, 488.0 nm), 2-3 W at the sample, confocal \
parameter 20 cm, beam polarised parallel to the static field; electrode array with \
2.69 mm spacing and 150 pairs (Ne phase match at 29 and 24 atm, 26 C), and a coarser \
array (5.08 mm, 82 pairs) at half the density; sample and reference in 2-3 coupled \
triplets; 99.999 % gases; pressures with a Paroscientific 1003K gauge (+-0.02 atm) \
(p. 2)."""
notes = """The corrected neon hyperpolarizability: 'the anomalous hyperpolarizability \
dispersion previously observed for neon is spurious' (abstract). The earlier visible \
data (Shelton & Lu 1988) are discarded (electrical breakdown in neon went unnoticed, \
p. 3); the new visible points and shelton_1990's infrared points give gamma_0 = 108 +- 2 \
au and A = 2.47 au (omega_L^2 in au), against shelton_1990's 119 au and negative A. \
Supersedes shelton_1990's Ne fit (table4_Ne) and shelton_1989's anomaly.

Definitions: gamma is the ESHG hyperpolarizability gamma(-2w; w, w, 0), the same \
quantity and convention as shelton_1990 (Taylor series; shelton_1994 reproduces this \
fit), per atom, in au with the Ne reduced-mass factors (1 au = 219469 cm^-1 for omega, \
6.23656e-65 C^4 m^4 J^-3 for gamma, p. 3). Dispersion: gamma = gamma_0 (1 + A omega_L^2 \
+ B omega_L^4), omega_L^2 = 6 omega^2 for ESHG, omega and gamma in au (Table 2 \
caption). Calibration: Bishop & Pipin's ab initio gamma_He (bishop_1989) through \
shelton_1990's fit; 'note that table 2 of ref. [1], which gives the fit coefficients, \
has a misprint: 10^-31 in the last line should be 10^-32' (p. 3; recorded on \
shelton_1990's formula table2_He_si). No separation of parts is needed (atom: \
electronic). Pair interactions: theory predicts gamma_Ne/gamma_He overestimated by 0.3 \
% at the highest density; the half-density measurement bounds the pair contribution \
below about +-1 %; the tabulated gamma_Ne include a 0.0 +- 0.3 % correction (p. 4).

Other experiments (Table 1 caption): 'The only other measurements of gamma_Ne are from \
one dc Kerr effect experiment and two third harmonic generation experiments (error \
bars +-8%-17%, see ref. [2] for discussion)'. The dc Kerr value and the ab initio best \
estimates are recorded from the text (p. 4-5). A comparison with He: 'The dispersion is \
only slightly larger for gamma_Ne than for gamma_He (A = 2.5 au versus A = 2.191 au)' \
(p. 4). Figure 1 (the dispersion plot) is not digitised. The library's validation shows \
no findings; the two tables' CSV cells agree with their images."""

[[formulas]]
id = "table2_expt"
material = "Ne"
equation = "Table 2, p. 4"
printed = "gamma = gamma_0 (1 + A omega_L^2 + B omega_L^4), omega_L^2 = 6 omega^2 for ESHG, omega and gamma in au; expt.: gamma_0 = 108.1, A = 2.47, B = 5.50"
variable = "omega_L^2 = 6 omega^2, omega the laser angular frequency in au (1 au = 219469 cm^-1 for Ne, p. 3)"
process = "eshg"
convention = "T"
part = "electronic"
range = "omega = 0.0-0.1 au; data 1319-488.0 nm (the first four rows of Table 1)"
coefficients = { gamma0 = "108.1", A = "2.47", B = "5.50" }
coefficient_units = { gamma0 = "au", A = "au", B = "au" }
calibration = "He: Bishop & Pipin (bishop_1989), through shelton_1990 Table II"
check = "At the data: 121.97 (514.5 nm) and 123.69 (488.0) against 122.2 +- 0.4 and 123.5 +- 0.5; 110.04 (1319) and 111.11 (1064) against 111.0 +- 0.8 and 109.9 +- 0.5 (the infrared scatter the text mentions). In cm units (1 au = 219469 cm^-1): A = 0.5128e-10 cm^2, B = 0.2371e-20 cm^4, shelton_1994 Table VII's 0.513 and 0.237. At 632.8 nm for dc Kerr (omega_L^2 = 1.036e-2 au) 110.93, the text's 111. Checked 2026-09-26."
notes = "'The B coefficient in the fit to the experimental measurement is arbitrarily set to a value between the values given by the electron-correlated calculations (fitted A depends only weakly on B: +-0.5 in B gives +-0.03 in A) ... The statistical uncertainties in the experimental fit coefficients are +-1% for gamma_0 and +-10% for A' (Table 2 caption). The recommended Ne ESHG dispersion (shelton_1994 Table VII)."

