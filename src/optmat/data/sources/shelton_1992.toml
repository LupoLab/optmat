notes = "Uncorrelated (Ref. [3]); 'including correlations increases gamma_0 to 1.6 times the SCF result but only increases A by 5%' (p. 4). Note d cites ref. [17] (Maroulis & Thakkar 1989) for the 70.0 au SCF limit."

