process = "eshg"
convention = "T"
part = "electronic"
range = "omega = 0.0-0.1 au"
coefficients = { gamma0 = "110.4", A = "2.40", B = "5.33" }
coefficient_units = { gamma0 = "au", A = "au", B = "au" }
reproduced_from = ["rice_1992"]
check = "A = 2.40 au = 0.4983e-10 cm^2 and B = 5.33 au = 0.2297e-20 cm^4, shelton_1994 Table VII's 0.498 and 0.230 (whose gamma_0 = 110 is the CCSD(T) static value). Checked 2026-09-26."
notes = "Fitted by the authors to the MP2 calculation of Ref. [3] (J. E. Rice, J. Chem. Phys., in press = rice_1992)."

[[formulas]]
