citation = "K. S. Jammu, G. E. St. John and H. L. Welsh, \"Pressure broadening of the rotational Raman lines of some simple gases\", Can. J. Phys. 44, 797 (1966)"
doi = "10.1139/p66-068"
library = "Jammu_1966_PRESSUREBROADENINGROTATIONAL"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Spontaneous pure rotational Raman spectra excited by the Hg 2537 A line \
(Rayleigh line absorbed by mercury vapour in the spectrograph, Rasetti's method), in a \
fused-quartz high-pressure tube (water-cooled at about 15 C, multiple-reflection \
mirrors) at 7-43 atm, photographed with a grating spectrograph of 11.2 cm-1/mm \
(practical resolution 0.6 cm-1, spectral slit 0.3 cm-1); photographic photometry. \
Line widths corrected for overlap of the four neighbouring Lorentzian lines \
(procedure (a), Eqs. (2)-(5); procedure (b), Eq. (6), for CO2); the corrected full \
width X plotted against pressure, X = 2 Delta nu_1/2, whose slope gives Delta \
nu_1/2/p (p. 10). Foreign-gas broadening: 3 atm of O2 or N2 with 15-42 atm of Ar or He \
added."""
notes = """Identity checked against the first page (Can. J. Phys. 44, 797-814 (1966); \
the library copy is an NRC Research Press download). Page numbers are pdf pages (1-18). \
Materials: 16O2, 14N2, 12C16O2, 12C16O as the natural gases; no isotopologue is \
resolved.

WIDTH CONVENTION (the key hazard). Footnote, p. 2: '*Throughout this paper Delta nu_1/2 \
means one half of the width of the line at the point where the intensity is one half \
of the peak intensity.' p. 10: 'The slopes of the straight lines in Fig. 6 allow us to \
define a broadening coefficient, Delta nu_1/2/p, with X = 2 Delta nu_1/2' (X the \
corrected full width). Every coefficient here is therefore a HALF width at half maximum \
(HWHM) per atm, in 10^-3 cm-1/atm. Pressure in atm, not density; the temperature is \
'room temperature' (abstract), the tube being water-cooled at about 15 C (p. 4): the \
gas temperature is not stated. The widths extrapolate to X(p = 0) = 0.5 cm-1 (the \
apparatus function), which the slope excludes (p. 10). The widths assume no line \
mixing ('statistically independent lines', p. 5).

TABLES. Only O2 is tabulated line by line (Table I, K = 3-19, K the rotational \
quantum number of the initial level, N in modern notation; two exposure times, 'the \
average difference is only 2 %', p. 10; the K = 1 line, affected by the spin satellites \
and the Rayleigh wing, is only in Figs. 5-7). N2 (J = 2-16; no reliable J = 0, 1), CO \
(7-31 atm) and CO2 (5 and 9 atm, J >= 4; J = 4, 6 corrected for the Rayleigh wing) \
self-broadening, and the Ar and He broadening of O2 and N2, are in Figs. 9-13 only (not \
digitised); Table II gives, for each pair, only 'the extreme values observed' over the \
lines (note *), recorded as rows 'largest' (lowest J) and 'smallest' (highest J), the J \
of each not stated. For O2 the extremes are the mean of Table I's K = 3 (46.5) and K = \
19 (28.35 -> 28.4) values. No uncertainty is stated for any coefficient.

OTHER VALUES. Stoicheff (1950, Ph.D. thesis, Toronto), N2: 'Delta nu_1/2/p = 0.043 \
cm-1/atm, as the average for several lines near the maximum of the rotational \
spectrum' (p. 2; dataset text_stoicheff_N2). Van Kranendonk's (1963) theory, revised \
by Gray (1965), is 18-30 % above the N2 data (Fig. 9, p. 17); not tabulated. Mikhailov \
'obtained two values ... for nitrogen, 47.5e-3 cm-1/atm up to 25 atm and 26.5e-3 for \
the higher pressures' (p. 17): see mikhailov_1959, whose Table I does not give these \
slopes directly. The 1964 Opt. Spectrosc. N2 values of Table II are 'some 15 % lower' than these (p. 16).

herring_1986 Table II prints this paper's N2 values (Ref. 3) as FWHM in MHz/amagat, \
S(2)-S(16) 3370 -> 2080, i.e. read from Fig. 9 and converted (x 2 x 29979 MHz / 0.926 \
amagat per atm at about 295 K: 3370 <-> 0.0521 cm-1/atm, 2080 <-> 0.0321; Table II \
here: 52.4 -> 31.3).

solprop: the '2.6e9 Hz/amagat' N2 figure solprop mentions equals 2 x 0.043 cm-1/atm x \
29.98 GHz = 2.58e9 Hz per atm (Stoicheff's average HWHM made a FWHM, per atm not per \
amagat), or this paper's mid-J N2 values (HWHM about 0.043-0.045 cm-1/atm near J = \
6-8 in Fig. 9) likewise converted."""

