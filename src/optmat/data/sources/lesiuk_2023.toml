material = "Ar"
file = "Ar/lesiuk_2023__cauchy_Ar.csv"
table = "tbl_cb5cfdf665dc"
quantity = "cauchy_moment"
unit = "au"
abscissa = "order"
abscissa_unit = "1"
use = "primary"
notes = "Table XI 'Total': alpha_0, alpha_2, alpha_4 = S(-2), S(-4), S(-6), rows by moment order k. Electric polarizability only (add chi_0 = -2.30e-4 a.u. for refractive-index comparisons; source notes). Also Table XII 'This work' and the abstract. The sum of the budget rows reproduces the totals (checked 2026-09-24)."
[datasets.uncertainty]
column = true
level = "not stated"

