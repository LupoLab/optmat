citation = "M. Lesiuk and B. Jeziorski, Phys. Rev. A 107, 042805 (2023)"
doi = "10.1103/physreva.107.042805"
library = "Lesiuk_2023_FirstPrinciplesCalculation"
identity = "VALIDATED"
kind = "theory"
technique = """Ab initio composite calculation of the static dipole polarizability alpha_0 \
and the dispersion (Cauchy) coefficients alpha_2, alpha_4 (and alpha_6) of the argon \
atom (40Ar, 39.962 383 Da), alpha(omega) = alpha_0 + alpha_2 omega^2 + alpha_4 omega^4 + \
... (Eq. (6)). Nonrelativistic clamped-nucleus part: Hartree-Fock in a 40s40p40d basis, \
then frozen-core coupled-cluster increments CCSD, CC3, CCSDT, CCSDTQ, CCSDTQP, CCSDTQPH \
(orbital-unrelaxed linear response) in purpose-built basis sets up to nonuple zeta \
(X = 9, triply augmented), extrapolated to the complete basis set with a Riemann-zeta \
formula (Eq. (8)); core-core and core-valence correlation (all-electron CC3, CCSDT, \
CCSDTQ). Relativistic corrections: one-electron by DKH2 (checked against Breit-Pauli \
mass-velocity + Darwin), two-electron Darwin and Breit (Breit for alpha_2, alpha_4 at \
the Hartree-Fock level, Appendix), second-order spin-orbit estimated from four-component \
Dirac-Coulomb Hartree-Fock (alpha_0 only). QED: leading-order one-electron term, Eq. (24), \
with the Bethe logarithm ln k_0 = 8.7610, and the one-loop 1/c^4 term, Eq. (27). Finite \
nuclear size (Eq. (29), negligible) and finite nuclear mass (diagonal Born-Oppenheimer \
correction, MP1, alpha_0 only). CODATA constants; c = 137.035999084 a.u."""
notes = """Atomic units throughout (polarizability in e^2 a0^2/Eh = 4 pi eps0 a0^3, omega in \
hartree). All corrections are included in alpha_0 (relativistic 1/c^2 incl. Breit and \
two-electron Darwin, spin-orbit, QED incl. one-loop 1/c^4, finite nuclear size and mass \
for 40Ar); alpha_2 and alpha_4 include the same except the two-electron Darwin, \
spin-orbit and finite-mass terms, judged negligible (pp. 9-11). Uncertainties are the \
authors' estimates for each contribution (typically twice the spread of the basis-set \
extrapolations, 10-50 % for small corrections) combined in quadrature ('the standard \
error propagation formulas under the assumption that all contributions ... are \
independent', p. 13); no confidence level is stated. alpha_6 = 382.5 (Eq. (36)) is from \
Hartree-Fock + valence CCSD + valence CC3 only, 'relative error no larger than 10%' \
(p. 13).

The authors claim 'accuracy of around 10 ppm for wavelengths above roughly 450 nm' \
(omega <= 0.1 a.u.) when their dispersion coefficients are combined with Gaiser and \
Fellmuth's (2018) measured static polarizability (abstract, pp. 3-4); the first \
resonance is at omega about 0.42 a.u. (Minnhagen 1973, their Ref. 36). Their own \
alpha_0 = 11.0775(19) agrees with Gaiser and Fellmuth's 11.077183(27).

alpha here is the electric dipole polarizability only. For the refractive index the \
paper uses the Lorentz-Lorenz form (n^2-1)/(n^2+2) = (4 pi/3)(alpha + chi_0) rho \
(Eq. (3)), with the static magnetic susceptibility chi_0 = -2.30(2) x 10^-4 a.u. (Eq. \
(39); -2.3004(6) x 10^-4 from <r^2> = 25.9193(64), Eq. (35), nonrelativistic only, 1 % \
allowed for missing corrections). The package's polarizability recovered from a \
refractivity is alpha + chi_0: the chi_0 term (-21 ppm of alpha_0) must be added to \
these alpha values before they are compared with refractive-index data. The magnetic \
susceptibility itself is not a quantity of the package and is not extracted (Table \
XIII, the chi_0 comparison, likewise).

Conversion used by the authors (p. 2): 1 cm^3/mol = 11.205 872 a0^3, i.e. their molar \
polarizability is N_A alpha (polarizability volume), not the molar refractivity \
(4 pi/3) N_A alpha.

Not extracted: Tables I-X (individual contributions by basis set and their CBS limits), \
Table XI's contribution rows (components of the Total row), Table XIII (chi_0). The \
budget rows of Table XI sum to its totals (11.0775, 27.9755, 95.0182; quadrature \
0.00194, 0.0154, 0.106; checked 2026-09-24)."""

