[[formulas]]
id = "cauchy_theory"
form = "alpha_series"
terms = { c = ["11.0775", "27.976", "95.02", "382.5"] }
range_nm = [450.0, "inf"]
material = "Ar"
equation = "Eq. (6), p. 3, with Table XI (Total) and Eq. (36)"
printed = "alpha(omega) = alpha_0 + alpha_2 omega^2 + alpha_4 omega^4 + ...; alpha_0 = 11.0775(19), alpha_2 = 27.976(15), alpha_4 = 95.02(11), alpha_6 = 382.5"
variable = "omega: photon energy (angular frequency) in atomic units (hartree); alpha in atomic units"
state = "none (per atom)"
density = "none"
range = "wavelengths above roughly 450 nm (omega <= 0.1 a.u.; first resonance at about 0.42 a.u.)"
coefficients = { alpha_0 = "11.0775", alpha_2 = "27.976", alpha_4 = "95.02", alpha_6 = "382.5" }
check = "The Table XI contributions sum to the totals (checked 2026-09-24). At omega_E = 0.0719811 a.u. (632.9908 nm) it gives alpha = 11.225055 with alpha_6 (11.225002 without); with chi_0 = -2.3004e-4 added and alpha_6 omitted, 11.224772: 0.00032 above Eq. (38) (the difference of the two alpha_0 values, 11.0775 against 11.077183) and 0.00046 (41 ppm) above Egan et al.'s 11.22431(17), within the theory's 0.0019 uncertainty. Checked 2026-09-24."
notes = "The paper's own ab initio series (all corrections included, source notes). ELECTRIC polarizability: it omits the magnetic susceptibility chi_0 = -2.30(2)e-4 a.u. that the Lorentz-Lorenz relation for the refractive index needs (Eq. (3)); a refractivity computed from this model is low by 21 ppm unless chi_0 is added. alpha_6 has a 10 % uncertainty and contributes 4e-4 a.u. (37 ppm) at 450 nm."

[[formulas]]
id = "recommended"
form = "alpha_series"
terms = { c = ["11.077183", "27.976", "95.02"] }
range_nm = [450.0, "inf"]
material = "Ar"
equation = "Eq. (6) with Table XI and Gaiser and Fellmuth's alpha_0, as used for Eq. (38), p. 14"
printed = "alpha(omega) = alpha_0 + alpha_2 omega^2 + alpha_4 omega^4, alpha_0 = 11.077183(27) (Gaiser and Fellmuth), alpha_2 = 27.976(15), alpha_4 = 95.02(11); plus chi_0 = -2.3004(6) x 10^-4 for refraction"
variable = "omega: photon energy (angular frequency) in atomic units (hartree); alpha in atomic units"
state = "none (per atom)"
density = "none"
range = "wavelengths above roughly 450 nm, 'accuracy of around 10 ppm' (abstract)"
coefficients = { alpha_0 = "11.077183", alpha_2 = "27.976", alpha_4 = "95.02", chi_0 = "-2.3004e-4" }
check = "With chi_0 added: 11.224455 at 632.9908 nm, Eq. (38)'s 11.22445(11); Egan et al.'s measured 11.22431(17) lies 1.4e-4 (12 ppm) below, 'within their combined uncertainty' (p. 14). Checked 2026-09-24."
notes = "The combination the paper recommends (Sec. IX): the measured static polarizability with the calculated dispersion coefficients. As structured (terms c) it is the electric polarizability; chi_0 (Eq. (35), -2.3004(6)e-4 a.u.) is NOT in the terms and must be added for the refractive index (n from Lorentz-Lorenz with alpha + chi_0). alpha_6 is omitted as in Eq. (38) (it adds 5e-5 a.u. at 633 nm)."
