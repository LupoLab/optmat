notes = "Fig. 3, top panel (p. 6): the total 5p cross section in nonrelativistic LOPT (HF; red dash-dot), length form, linear polarisation, 7.04 to 10.96 eV: every vertex of the dashes inside the frame (277). Resonances (drawn) 6s at 8.87 eV ('the 6s and 6s' resonances have equal energy' in a nonrelativistic calculation, p. 7), another at 10.18 eV, and 5d and 7s at 10.595 and 10.69 eV (Fig. 3, bottom). 2 %: the digitising uncertainty of a drawn vertex (the record's notes); the paper states none for this approximation."
