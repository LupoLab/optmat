citation = "R. Adair, L. L. Chase, and S. A. Payne, \"Nonlinear refractive-index measurements of glasses using three-wave frequency mixing\", J. Opt. Soc. Am. B 4, 875-881 (1987)"
doi = "10.1364/josab.4.000875"
library = "Adair_1987_NonlinearRefractiveIndex"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Nearly degenerate three-wave mixing (NDTWM) at 1.06 um (Sec. 3, pp. 877-878): \
omega_1 = the 1.064-um fundamental of a Q-switched Nd:YAG laser (attenuated to <= 5 mJ, \
spatially filtered; its pulse duration is not stated), omega_2 = 1.071 um from the \
second harmonic-pumped R6G dye laser (0.567 um) Stokes-shifted twice in H2 at 3e4 Torr, \
0.1 mJ, 3-ns pulse; Delta = omega_1 - omega_2 ~ 60 cm^-1. Both beams vertically \
polarized (parallel linear polarizations), combined, focused with 100-cm lenses to a \
400-um spot, zero-degree phase matching; the 2 omega_1 - omega_2 signal of the sample \
and of a 1-cm CS2 reference cell detected through a double monochromator by S-1 \
photomultipliers and boxcars, the sample signal normalised shot by shot to the \
reference (200 shots, then 50 background shots, five times; only shots within half a \
standard deviation of the mean reference used). n2 of an unknown from its signal \
relative to a standard by Eqs. (6a)-(6b), [chi1111]_u = [chi1111]_s (I_u/I_s)^(1/2) \
(n_u/n_s)^2 (l_s/l_u) C^2, and Eq. (3), n2(LP) = (12 pi/n0) chi1111. The relative values \
were put on an absolute scale by 'equating our average value of n2 for those samples to \
theirs' for the seven glasses measured by time-resolved interferometry by Weber et al. \
(Ref. 13) (pp. 878-879). Bulk samples several mm thick, of moderate optical quality. \
Room temperature (not stated)."""
notes = """Journal pages 875-881 = pdf pages 1-7 (journal page = 874 + pdf page). Identity \
checked against the first page (title, authors, J. Opt. Soc. Am. B 4, 875). Table 2 \
(p. 879) is the only data table; Table 1 (p. 878) lists the compositions (mol %) and \
makers, which the material registry entries quote.

DEFINITIONS (Gaussian esu, quoted). p. 875: 'The nonlinear refractive index is defined \
by n = n0 + n2 <E^2>, where n0 is the linear refractive index and E is the optical \
electric field.' Eq. (1): P_crit = c lambda^2/(32 pi^2 n2). Eq. (2): P1^(3)(r, omega_a) = \
3 chi1111^(3)(-omega_a; omega_1, omega_1, -omega_2) E(omega_1)^2 E(omega_2)* for parallel \
polarizations in an isotropic material (Bloembergen's convention). Eq. (3): n2(LP) = \
(12 pi/n0) chi1111^(3)(-omega; omega, omega, -omega), 'where LP stands for linearly \
polarized'. No circular-polarization value is given. The n2 of Table 2 are for linear \
polarization (esu; the paper converts nothing to cm2/W).

PART (p. 876). Eq. (4): n2 = n2(electronic) + n2(nuclear) + n2(electrostrictive) + \
n2(thermal). 'Using R = 200 um and V = 5 x 10^5 cm/sec, we find that R/V = 40 nsec. Our \
effective measurement time is of the order of the reciprocal of the frequency difference \
Delta^-1 ~ 5 x 10^-13 sec. Because of this extremely large difference in time scale, we \
ignore the latter two effects. We consider only the electronic and nuclear \
contributions.' With Hellwarth's curves for fused quartz, Re(A + B) = 5.9e-15 cm^3/erg \
at Delta = 0 and 6.0e-15 at 60 cm^-1 (Im 0.0 and 0.5e-15): 'the nuclear contribution \
changes little from Delta = 0 to Delta = 60 cm^-1'; 'the nuclear contribution, on the \
average, accounts for only 25% of the total n2' (Refs. 24-26) (p. 877). Hence part = \
electronic_vibrational for the measured values (Raman included, electrostriction and \
thermal not), as for adair_1989.

ACCURACY (p. 879): 'We believe that our experimental method provides results that are \
accurate to within 15%.' Level not stated; recorded as relative 0.15. The absolute \
scale is Weber et al.'s: any error of their seven TRI values is carried (the \
reproduced datasets weber_1978_*). FINDING (computed 2026-09-27): the printed \
calibrated values of the seven standards average 1.356e-13 esu against 1.286e-13 for \
Weber et al.'s (the mean of the ratios is 1.064), so the stated equal-average \
calibration is not reproduced by the printed numbers (5 % high); the paper gives no \
other detail. The sample-length dependence (Eq. 5, I_a proportional to l^2) was checked \
with CS2 cells of several lengths (Fig. 2).

TABLE 2 (tbl_cd009634988d, image checked: every cell agrees). Columns: 'n2 meas. a' \
(this work: datasets n2_*, primary), 'n2 meas.' with footnote c (Ref. 13, Weber, \
Milam and Smith 1978: datasets weber_1978_*, reproduced) or d (Ref. 7, Moran, She and \
Carman 1975: datasets moran_1975_*, reproduced), and 'n2 calc. b' (Ref. 31, Stokowski, \
Saroyan and Weber 1981, LLNL report M-95: datasets calc_*, reproduced). The literature \
values are weber_1978 Table 1 converted to esu with its n_D by its Eq. (18) (computed \
2026-09-27: LHG-5 1.158, LHG-6 1.009, Q-88 1.140, FR-5 2.092, ED-2 1.414, fused silica \
0.950, BK-7 1.241, all equal to the printed cells to the printed digits; ED-2 is \
Weber's reference-a value 3.77, not his reference-d 4.05). The two Moran values (C2828 \
2.077, SF-6 9.129) are the same conversion of Weber's asterisked entries, i.e. Moran's \
CS2-relative values scaled by Weber et al. to ED-2 = 4.05e-20 m2/W. 'The glasses are \
grouped by types' (Table 1 footnote a): the Type column labels each group once. \
Glass-name discrepancies between the tables (images checked): Table 1 'K-133' against \
Table 2 'E-133' (registered as E-133: the other Owens-Illinois glasses of the group are \
E-115, E-131, E-132; the NBS glasses are K-1172, K-1261), Table 1 'SF6' against \
Table 2 'SF-6'. Table 1's BK-7 composition sums to 102.9 % with '4 Nd2O3' (see the \
dataset notes).

FORMULA. Eq. (10a) (Boling et al., Ref. 28) with K = 68 and the constant 1.52 (Boling \
et al. and adair_1989 print 1.517): recorded as bgo_10a. The paper uses Ref. 31's \
calculated values rather than computing its own. Eq. (12): n2 = (L^4 pi/2n) N gamma \
with L = (n^2 + 2)/3, and Eq. (13), n^2 - 1 = 4 pi L N alpha (p. 880); Eq. (11), gamma = \
Q alpha^2. Eq. (14), alpha = s e^2/m(omega_0^2 - omega^2).

TEXT VALUES. The fluorophosphates 'have the lowest n2 values of 0.6 to 0.8 x 10^-13 \
esu' and E-115 'the largest n2 value of 0.80' (p. 880); fused silica 0.85 and ED-8 1.69 \
(p. 880): all repeat Table 2. The lowest VUV bands of fused quartz at 10.3 and 11.3 eV \
(Philipp; p. 880), quoted, not recorded.

FIGURES (not digitised). Fig. 1 (p. 877): the apparatus. Fig. 2 (p. 878): square root \
of the TWM signal against CS2 cell length (linear). Fig. 3 (p. 879): calculated against \
measured n2 of the Table 2 glasses (SF-6 and the tellurites divided by 15).

REPRODUCTIONS OF THIS PAPER. adair_1989 cites it (Ref. 19) for the method only. \
ensley_2019 reproduces its BK-7 value (Ensley's reference m); refractiveindex.info's \
BK7 'Adair' n2 page is from this paper (adair_1989 notes)."""

[[formulas]]
id = "bgo_10a"
equation = "Eqs. (10a)-(10b), p. 877"
printed = "n_2 (10^{-13} esu) = 68 (n_d - 1)(n_d^2 + 2)^2 / ( \\nu_d [1.52 + (n_d^2 + 2)(n_d + 1) \\nu_d / (6 n_d)]^{1/2} ), \\nu_d = (n_d - 1)/(n_F - n_C)"
variable = "n_d: the index at 5876 A; nu_d the Abbe number with lambda_F = 4861 A and lambda_C = 6563 A; n2 in 10^-13 esu (n = n0 + n2 <E^2>)"
range = "glasses and fluoride crystals with one dominant polarizable constituent (p. 880: SF-6 and the tellurites violate it)"
coefficients = { K = "68", constant = "1.52" }
check = "Not reproducible from this paper, which prints neither n_d nor nu_d (Table 2's calculated column is Ref. 31's). With boling_1978's fused silica n_d = 1.458 and nu_d = 70 it gives 0.833 (Table 2: 0.83); with milam_1976's BK 7 (1.517, 64) 1.153 against Table 2's BK-7 1.18, and with ED-2 (1.567, 54) 1.729 against 1.60, so Ref. 31's n_d and nu_d differ from Milam's (computed 2026-09-27)."
notes = "The Boling-Glass-Owyoung Abbe-number formula (boling_1978 Eq. 38, whose constant is 1.517; adair_1989 Eq. 6). The derivation assumes one polarizable constituent and gamma = Q alpha^2, 'There is no rigorous justification for this assumption' (p. 877)."

