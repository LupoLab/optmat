points = [["1475", "1475", "14"], ["1335", "1335", "18.5"]]
table = "text"
quantity = "absorption_cross_section"
unit = "Mb"
scale = 0.037219272080
abscissa_unit = "angstrom"
wavelength_medium = "vacuum"
use = "primary"
notes = "p. 1970: 'The continuum itself has at least two maxima of about 14 cm^-1 and 18.5 cm^-1 at 1475A and 1335A, respectively' (the continuum under the diffuse bands). scale = 1e18 / n0 (NTP assumed) to Mb. Approximate ('about'); uncertainty not stated. The same group's full CO2 paper (inn_1953) places the maxima at about 1475 and 1332 A but gives k only in figures, so these are the only printed values: primary, preliminary (to confirm against inn_1953's Fig. 1)."
