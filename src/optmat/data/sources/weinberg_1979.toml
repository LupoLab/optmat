notes = "Earlier photoconductivity gaps as the paper states them (pp. 3107-3108). DiStefano and Eastman: 'an interband gap of 9.0 eV by fitting their photoconductivity spectra (performed on a 5000-A thermally grown SiO2 film) to a parabolic absorption-edge characteristic of an indirect gap' (the paper finds the fit unreliable because of interference, p. 3112). Trukhin: photoconductivity of crystalline quartz, fused silica and thermally grown films, 'a direct band gap of 12 eV and a lowest band gap of 9.5 eV'; the paper judges these spectra erroneous (LiF-covered samples, inadequate shielding, p. 3113)."
