citation = "Z. A. Weinberg, G. W. Rubloff and E. Bassous, \"Transmission, photoconductivity, and the experimental band gap of thermally grown SiO2 films\", Phys. Rev. B 19, 3107 (1979)"
doi = "10.1103/physrevb.19.3107"
library = "Weinberg_1979_TransmissionPhotoconductivityExperimental"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Thermally grown amorphous SiO2 on (100) silicon (dry O2 at 1000 degrees C, dry O2 \
with 4.5 % HCl, or wet oxidation at 800 degrees C). Transmission 7-14 eV through free \
membranes (436, 1100 and 5110 A; Si3N4-protected anisotropic etching of the substrate; \
thickness +-1 % by ellipsometry), McPherson 225 monochromator with an H2 lamp, 8 A \
resolution, sodium-salicylate detector; the absorption coefficient from the exact \
thin-film transmission formula (Appendix), iterated from Philipp's k with Philipp's n \
fixed. Photoconductivity of Al-SiO2-Si capacitors (575-3500 A; Al 160 A thick, a masked \
and shielded contact), its spectrum and its dependence on the field at fixed photon \
energy (2.6-11.1 eV). Diodes under 450-1350 A oxide for photoluminescence and excitons \
(pp. 3109-3115)."""
notes = """Pages 3107-3117 are pdf pages 1-11. Identity checked against the first page.

BAND GAP (the paper's result). 'we associate the change in curvature seen in Fig. 9 with \
the SiO2 band gap and deduce that E_g ~ 9.3 eV. This association and the 9.3-eV value \
are, obviously, subject to a more detailed modeling of the problem' (p. 3114): the \
transition energy in the field dependence of the photocurrent (yield against field, \
curvature change as for internal photoemission over a barrier), proposed as 'the most \
direct experimental estimate of the band gap' of thermally grown (amorphous) SiO2, \
direct or indirect not specified (p. 3115). Band-structure values the paper cites for \
alpha-quartz: indirect 9.2 eV and lowest direct 9.8 eV (Chelikowsky and Schluter); 9.8 \
eV direct for idealised beta-cristobalite (Ciraci and Batra) (p. 3107): theory, notes only.

ABSORPTION EDGE (figures only; not digitised). Fig. 3 transmission of the three \
membranes; Fig. 4 the absorption coefficient 7-14 eV of the 436-A film against Philipp's \
Kramers-Kronig alpha (shifted by +0.075 eV to align the first peak, at 10.45 eV) and \
Powell and Morad's 580-A film; Fig. 5 the tail with Appleton et al.'s points. 'The \
accuracy of alpha in our data is estimated to be better than +-2% for the region where \
T < 0.2, which applies from about 9.2 eV for the 5110-A film to about 11.3 eV for the \
436-A film. Above 11.3 eV the scattered light correction becomes appreciable and the \
error could be as high as 10%. The reproducibility of alpha among membranes ... has been \
within +-5%' (p. 3111); reliable only above ~9.2 eV (p. 3111). The tail 'extends down to \
at least 8.4 eV' and is 'approximately exponential ... in the range ~9.2 eV < h nu < \
~10.2 eV, corresponding to about 2 decades in alpha' (Urbach-like; p. 3115). Philipp's \
Table X k at 0.11-0.13 um is taken from this work (philipp_1985/weinberg_k, the only \
tabulation). Figs. 6-9: photoconductivity spectra (575, 1015, 2310 A; field 2e6 V/cm) and \
the field dependence at 2.6-11.1 eV. Photoluminescence yield upper limit ~1e-4 at 10.2 eV \
(p. 3115). Barriers: Al Fermi level to SiO2 conduction band 3.15 eV; Si to SiO2 \
conduction band 3.1-3.2 eV (pp. 3107, 3114).

REVIEW OF EARLIER VALUES (pp. 3107-3108, 3115), as the paper states them. Those with a \
single value and a clear material and kind are the reproduced datasets below; the others \
are recorded here only:
- Goodman: hole photoemission from Si into thermal SiO2, 4.9 eV to the SiO2 valence band, \
with the 3.1-3.2 eV conduction-band offset 'a band gap of 8.0-8.1 eV' (a range, and \
photoemission: the vocabulary's band-gap kinds have no photoemission).
- DiStefano and Eastman: besides the 9.0 eV photoconductivity gap (dataset), '8.9 +- 0.2 \
eV from photoemission of electrons from SiO2 into vacuum' (threshold 10.2 eV); 'revised \
upward to 9.3 eV if one assumes that the valence-band edge of SiO2 lies at 10.6 eV below \
vacuum' (Ibach and Rowe).
- Williams: 8 eV, estimated from an early absorption measurement 'in quartz' (Ref. 16) to 8.44 \
eV (crystalline or fused not said).
- Powell and Derbenwick: besides the ~9 eV edge (dataset), 'a band gap of 8.8 eV from \
their measurements of hole trapping in thermally grown SiO2 films illuminated by vuv \
photons' (a charging threshold; no kind fits).
- Stephenson and Binkowski (XPS): limits 5.55-7.8 eV (alpha-quartz), 5.05-7.3 eV (fused \
silica), up to 8.3 eV (OH-rich silica); criticised (defects from vacuum milling).
- Zakis et al.: electron-hole creation 'above 12 eV'.
- Appleton et al. (alpha-quartz and vitreous SiO2), following Mott: 'a direct band gap of \
10.6 eV with the possibility of a lower indirect band gap of about 9 eV' (a suggestion).
- Mott: first 'about 10.6 eV', later 'about 9 eV', indirect, with 10.45 eV a direct-gap \
exciton (review).
- Kaminow et al.: the absorption edge of their dry silica 0.2 eV above that of wet silica."""

