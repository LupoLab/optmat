citation = "C. M. Herzinger, B. Johs, W. A. McGahan, J. A. Woollam and W. Paulson, \"Ellipsometric determination of optical constants for silicon and thermally grown silicon dioxide via a multi-sample, multi-wavelength, multi-angle investigation\", J. Appl. Phys. 83, 3323-3336 (1998)"
