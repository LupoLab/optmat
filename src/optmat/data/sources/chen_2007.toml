notes = "p. 11355: 'the rotational constant that best fits the Fourier-transformed response is B_H2 = 61.8 cm^-1'. An effective constant of the j = 0 -> 2 beat (omega_2,0 = 12 pi c B, no centrifugal distortion), from alignment revivals in 7.8 atm H2 at room temperature over ~3 T; no uncertainty stated. 4.6 % above the B_eff = 59.1 cm^-1 that teal_1935's S(0) line implies."
