citation = "A. Dragonmir [Dragomir], J. G. McInerney and D. N. Nikogosyan, Appl. Opt. 41, 4365 (2002)"
doi = "10.1364/ao.41.004365"
library = "Dragonmir_2002_FemtosecondMeasurementsTwo"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Transmittance against irradiance at 264 nm (4-30 GW/cm2): the fourth \
harmonic of a Twinkle Nd:glass laser (Light Conversion), ~200 uJ at 27 Hz, energy \
stability ~10 %, Gaussian in time and space (manufacturer's information); pulse length \
220 +- 10 fs from a TPA autocorrelator (four measurements; a thin fused-silica plate), \
beam w_0 = 2.56 +- 0.03 mm (3.01 +- 0.04 mm FWHM) from aperture transmission; a 454 mm \
fused-silica lens, the sample moved along the beam always well before the focus (no \
self-focusing, break-up or filamentation), incident and transmitted energies by Ophir \
PE10 detectors. beta from the linear approximation (Eq. 12; fused silica, quartz) or \
from the full expression (Eq. 6; sapphire, BBO), with the focal-shift correction of \
Eq. 15. Linear absorption alpha_sp by an HP8453 spectrophotometer (BBO: with the laser, \
in a reference beam of 0.4-0.7 GW/cm2). Room temperature."""
notes = """The paper prints the first author as 'Dragonmir'; he is Adrian Dragomir \
(so cited by slattery_2003). Tables 1-7 (solids) are transcribed in full; Tables 8-10 \
are liquids and are skipped: water, heavy water (D2O), methanol, ethanol, hexane, \
cyclohexane, 1,2-dichloroethane and chloroform (beta 34-95 x 1e-11 cm/W at 264 nm, and \
Table 10's literature values). Every table was checked against its image; the spanned \
cells of Tables 1, 3, 5, 6 and 7 are handled in the script.

Definition (p. 3): I_l = I_inc (1 - R)^2 exp(-alpha l) / {1 + (beta/alpha) I_inc (1 - R) \
[1 - exp(-alpha l)]} (Eq. 3), from dI/dz = -alpha I - beta I^2, with R = ((n - 1)/(n + \
1))^2 at normal incidence (Eq. 4): reflection losses are removed, I_0 is the peak on- \
axis intensity incident on the sample (Eq. 1), and alpha is Napierian (T_0 = (1 - R)^2 \
exp(-alpha l), Eq. 7). In the linear approximation beta = 2 sqrt(2) (dT/dI_0) / (l (1 - \
R) T_0) for alpha l << 1 (Eq. 14).

Pulse length: 'tau = 220 +- 10 fs' (p. 5), called the FWHM of the fitted Gaussian of Eq. \
(18), although A exp[-((t - t_max)/tau)^2] makes tau a 1/e half-width, and Eq. (1) \
defines tau_p at the 1/e level; slattery_2003 quotes it as '220 +- 10 fs at 1/e level'. \
Recorded as pulse_fs = 220 (a doubt on its definition).

Uncertainty (p. 5): absolute ~6 % (length 0.5 %, energy calibration 3 %, pulse width \
4.5 %, beam area 2.3 %), 'total (relative + absolute) ... ~10 %'. Footnote a of Tables \
3, 5, 7: 'Absolute error (6 %) was added to the averaged beta values.' Checked \
(2026-09-26): the printed +- of all eleven beta averages is reproduced, to its \
rounding, by the standard error of the mean of the tabulated curves plus 6 % of the \
mean, added linearly (e.g. Suprasil: 0.113 + 0.099 = 0.21, printed 0.2; sapphire: 0.59 + \
0.56 = 1.15, printed 1.2); the +- of the alpha averages is the standard error alone \
(e.g. KU-1 0.0094, printed 9e-3). The means reproduce the printed averages except BBO \
x-cut ordinary: the seven curves average 65.47, printed 66 (also in the text); not \
corrected. The text gives sapphire as '(9.4 +- 0.2)' (p. 7) against 9.4 +- 1.2 in Table \
5 and the abstract, and refers to 'Table 4' for the sapphire literature (Table 6), \
'Ref. 32' for the BBO value of Ref. 34, and 'Corning 7040' (Fig. 4 text) for 7940. The \
fit values printed in the captions of Figs. 4-6 are rows of Tables 3, 5 and 7.

Samples: fused silica KU-1 (former Soviet Union), Corning 7940 (USA), SQ \
(Quarzschmelze Ilmenau, Germany), and Heraeus's Suprasil, Herasil and Infrasil, 'with \
OH contents of <= 1000, ~150, and <= 8 parts in 10^6, respectively' (p. 5). Crystalline \
quartz 'electrochemically grown in the former Soviet Union' (its cut is not stated \
here; its 1.38 cm length is that of slattery_2003's c-cut quartz, and n = 1.5928 is \
presumably ordinary: no axis is recorded); sapphire from Laser Components, UK \
(orientation not stated); BBO grown in Novosibirsk, 6 x 6 x 3 mm, z-cut (light along \
the optic axis: ordinary) or x-cut (ordinary or extraordinary beam). BBO low-intensity \
transmittances T_0 = 0.845 (z-cut), 0.839 (x-cut, ordinary), 0.867 (x-cut, \
extraordinary) (p. 8). Sample lengths and 1 - R are kept in the printed column; 1 - R \
follows from n by Eq. (4) for every sample (checked).

Refractive indices (Tables 2 and 4) are not measured: fused silica 'taken from Refs. 30 \
and 31' (malitson_1965 and a Heraeus datasheet; Malitson's formula gives 1.50056 at \
264 nm, the printed 1.5007 is 1.4e-4 higher; Herasil and Infrasil 1.5022, presumably \
from the datasheet), quartz and sapphire from the dispersion relations of Refs. 32 \
(Sosman) and 33 (Malitson 1962), BBO from Ref. 36 (Kato). They are reproduced \
datasets.

Literature (Tables 1 and 6), one dataset per reference and pulse length. Table 1: \
'the TPA coefficient values measured at 248 nm by eight groups ... differ by as much as a \
factor of 18.5', and ns excitation gives higher values (colour centres). Ref. 16 \
(Schenker et al., 213 nm, pulse '?') is printed as a range, '35-52' x 1e-11 cm/W, \
+-25 % relative: not extracted (slattery_2003 gives it as 43 +- 18). The Ref. 14 value \
at 193 nm is misprinted by a factor of 10 (erratum below). Other text values (p. 8): \
BBO alpha = 0.04-0.15 cm-1 at 266 nm (Ref. 3, Nikogosyan's handbook) and alpha < 0.01 \
cm-1 at 264 nm (Ref. 34, called 'unrealistic'); the Hellma cuvette's Suprasil < 0.001 \
cm-1 (p. 8). The paper also lists crystals with anisotropic TPA from the literature \
(GaAs, ZnS, ZnSe, ZnTe, CdGa2S4, AgGaSe2, KTiOPO4) without values.

Reproduced by slattery_2003 (fused silica 1.7 +- 0.2, the Suprasil value; quartz 1.2 +- \
0.2)."""

[[errata]]
dataset = "brimacombe_1989_5ns_SiO2"
row = "193"
column = "value"
printed = "20"
corrected = "200"
reason = "Table 1 attributes to Ref. 14 (brimacombe_1989) beta = 20 x 1e-11 cm/W at 193 nm; Brimacombe et al. print alpha_1 = 2.0 +- 0.8 x 10^-3 cm/MW, which is 2.0e-9 cm/W = 200 x 1e-11 cm/W. The 248 nm value of the same reference is converted correctly (2.1e-4 cm/MW = 21 x 1e-11), and the +-40 % matches."
evidence = "brimacombe_1989 Table II (tbl_b42460a7da40, image checked): '2.0 +- 0.8 x 10^-3' at 193 nm; its Fig. 9 plots the 193 nm point near 2e-3 cm/MW, and its text says the values 'differ by four orders of magnitude' from 193 to 308-351 nm (4.6e-7), which holds only for 2e-3."

