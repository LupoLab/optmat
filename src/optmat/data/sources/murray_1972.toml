citation = "J. R. Murray and A. Javan, \"Effects of collisions on Raman line profiles of hydrogen and deuterium gas\", J. Mol. Spectrosc. 42, 1 (1972)"
doi = "10.1016/0022-2852(72)90139-7"
library = "Murray_1972_EffectsCollisionsRaman"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Spontaneous vibrational Raman scattering, forward and backward (pp. 5, \
11-16): a frequency-stabilised single-mode argon-ion laser at 488.0 nm (50 mW; \
long-term linewidth 0.003 cm-1), a 30 cm grazing-incidence fused-quartz capillary cell \
(0.5 mm bore) collecting light scattered within 0.05 rad of the forward or backward \
direction, a pressure-scanned Fabry-Perot (free spectral range 0.787 cm-1, finesse 25-30; \
instrumental width 0.025-0.036 cm-1 for H2, 0.053 cm-1 for D2), a tandem monochromator \
isolating one line, photon counting on a chart recorder; Lorentzians fitted by eye to \
the recordings (p. 16). Line shifts from two cells recorded together, one held at 35 \
amagat, the other at 5-90 amagat (p. 10). Pressures from Bourdon gauges (2 %), reduced \
to densities with the NBS tables; D2 assumed to follow H2's equation of state (p. 16). \
Room temperature, 25 +- 2 C. Gases: Airco prepurified H2 (> 99.95 %), Matheson D2 \
(99.5 %, 0.5 % H2)."""
notes = """Identity checked against the first page. Page numbers are journal pages (pdf \
page n = p. n). Materials: H2 and D2 as supplied (normal; the ortho:para ratio is not \
discussed). Lines: the Q_1(n) lines of the 1-0 band, v = 0 -> 1 (n = J). Wavenumbers \
'where 1 cm-1 = 30 GHz'; densities in amagat, 'rho amagat = (density/density at 1 atm \
pressure and 0 C)' (p. 3).

WIDTH CONVENTION: FULL WIDTHS. 'Figure 1 shows the predicted behavior of the line width \
(full width at half-maximum) of the Q_1(1) Raman scattering line' (p. 2); 'In this \
figure and in the remainder of the paper linewidths are expressed in wavenumbers' (p. \
3); 'Figure 5 shows the measured full width at half maximum of the Q_1(1) line of \
hydrogen, with instrumental linewidth subtracted' (p. 7), and 'A least-mean-squared \
deviation fit of the forward-scattering data of Figure 5 to a straight line gives a \
collision-broadening coefficient for the Q_1(1) line of 1.5 x 10^-3 cm-1/amagat with an \
estimated error in the coefficient of less than 0.1 x 10^-3 cm-1/amagat' (p. 7): the \
Table II value. Confirmed from Fig. 5 itself: its marked forward and backward Doppler \
widths, about 0.037 and 0.32 cm-1, are the FWHM Doppler widths of H2 Q_1(1) at 298 K \
(0.036 and 0.320 cm-1 computed), and its forward line reaches 0.153 cm-1 at 100 \
amagat. Fig. 8 (the other lines, forward) plots the widths on the same axis, instrument \
width retained (0.025 cm-1 for H2, 0.053 cm-1 for D2, p. 10). The appendix's 'halfwidth' \
(Eqs. A.14 and the broadening Lorentzian, pp. 20, 25) is the HWHM of the model \
profiles, not the tabulated coefficients. So Table II's coefficients are FWHM per \
amagat. The forward widths were fitted with a straight line (the Dicke term, small in \
forward scattering, not modelled).

DOUBT: THE D2 COEFFICIENTS (a finding for review). As FWHM, this paper's H2 values \
agree with later FWHM measurements within about 15 % (bischel_1986's 298 K Q(1) 52.2 \
MHz/amagat = 1.74e-3 cm-1/amagat against 1.5; Q(0) 76.6 = 2.56e-3 against 2.2), but its \
D2 values (1.4, 2.2, 2.6 for Q_1(1)-Q_1(3)) are half of the later FWHM ones (russell_1987 \
2.63, 3.91, 4.11; ottusch_1988 Q(2) 120 MHz/amagat = 4.0e-3) and equal to the later \
HWHM ones (smyth_1987 1.33, 2.06, 2.13). smyth_1987 prints these D2 values as HWHM and \
russell_1987 as FWHM ('deviate almost 100 %'). The paper itself treats all its widths \
alike as FWHM; no statement singles out D2. Either the D2 coefficients are low by a \
factor 2 or they are half widths despite the paper's convention: not settled here. \
Recorded as FWHM, the paper's words.

UNCERTAINTIES. Table II and III +- not described beyond the Q_1(1) 'estimated error' \
(level not stated); delta = the rms deviation of the points from the fit (10^-3 cm-1), \
in printed. The Q_1(1) forward coefficient is 10 % below what the backward data need \
('a 10 % increase in the broadening coefficient as determined for forward scattering \
gives a much better fit to the backward-scattering data', p. 9), unexplained.

SHIFT SIGN. Table III, 'Frequency shift with density': a negative a is taken to lower \
the Raman shift (the paper gives no sign convention in words; the H2 values have the \
sign of May et al.'s and of bischel_1986's C = -96 MHz/amagat, a shift to lower Raman \
frequency). Quadratic term b positive.

NARROWING (Table I, Figs. 1-7; notes only). The backward Q_1(1) widths show Dicke \
narrowing to below the Doppler width; three strategies (Table I, p. 8) fit the hard- \
and soft-collision models with D_0 fixed at the gas-kinetic 1.36 (Table I; 1.346 in \
the text, p. 16) or free: 'the data lie between the hard- and soft-collision models ... \
The hard-collision model gives a better fit under all strategies' (p. 8). The fitted \
D_0 of strategy c is shown only in Figs. 6-7 (not digitised). The diffusion constants \
are in formula diffusion_D0.

REPRINTS (re-pointed 2026-09-27 to this record): bischel_1986 Table I B (66.0, 45.0 \
MHz/amagat = 2.2, 1.5 x 29.98) and Table II C and D (-65, -90 MHz/amagat and 0.174, \
0.135 MHz/amagat^2 = the QUADRATIC fit's a and b of Q_1(0), Q_1(1) converted), and \
Table IV's average; bischel_1986b's D = 0.174 MHz/amagat^2, which is the Q_1(0) b (the \
Q_1(1) b is 0.0045e-3 cm-1 = 0.135 MHz): Bischel and Dyer's H2 Q(1) shift law uses \
the Q(0) coefficient; ottusch_1988 (the same 0.17 for Q(1), and D2 Q(2) -50 MHz/amagat \
= the linear -1.7e-3 cm-1 = -51.0 MHz/amagat); russell_1987 and smyth_1987 (the D2 \
coefficients, digit-identical); hanna_1986's D2 Q(2) 70 MHz/atm does not follow from \
2.2e-3 cm-1/amagat (66.0 MHz/amagat, 60.4 MHz/atm at 25 C)."""

