[[formulas]]
id = "diffusion_D0"
material = "H2"
equation = "Eq. (A.14), p. 20; Appendix 1f, p. 16; Table I, p. 8"
printed = "S(omega) = K / [(omega - omega_0)^2 + (k_0^2 D)^2], a Lorentzian of halfwidth k_0^2 D; D_0 = D rho; D_0 = 1.346 cm2/amagat sec at 25 C (H2); D_0 for D2 = 0.952"
variable = "omega in rad/s; k_0 the effective wavevector |k_e| of the Raman scattering in rad/cm (forward: k_r = 2 pi nu_Raman; backward: k_a + k_s); D the diffusion parameter in cm2/s; rho the density in amagat; the halfwidth k_0^2 D_0/rho is a HWHM in angular frequency (the diffusion, high-density limit of the narrowing)"
state = "H2 and D2 at 25 C"
density = "unknown"
range = "the diffusion limit, mean free path << lambda/2 pi (above about 12 amagat in backward scattering, p. 16)"
coefficients = { D0_H2 = "1.346", D0_H2_table_I = "1.36", D0_D2 = "0.952", D_harteck_schmidt = "1.396", D_harteck_schmidt_error = "0.0025", pressure_torr = "785", temperature_c = "20" }
check = "Scratch (2026-09-27): D_0(D2) = 1.346/sqrt(2) = 0.9518, the printed 0.952 (the reduced-mass scaling, p. 16). D_0(H2) from Harteck and Schmidt's D = 1.396 at 785 Torr and 20 C: rho = (785/760)(273.15/293.15) = 0.9624 amagat gives D_0 = 1.3436 at 20 C, and the stated T^(1/2) scaling to 25 C gives 1.355, not the printed 1.346 (nor Table I's 1.36): the text's number is not reproduced to its third digit. smyth_1987 used 0.950 (mass diffusion) for D2."
notes = "The diffusion constants are inputs, not measurements: H2's from Harteck and Schmidt (Ref. 22, Z. Phys. Chem. B 21, 447 (1933), para into normal H2), D2's by the reduced-mass scaling, 'accurate to perhaps 10 %' (Amdur and Beatty, p. 16). D_0 varies by 0.7 % over 25 +- 2 C (neglected, p. 16). The hard- and soft-collision line shapes (Eqs. A.23, A.27-A.29) reduce to this limit at high density."
