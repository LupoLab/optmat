citation = "M. Dörr, R. M. Potvliege and R. Shakeshaft, \"Atomic hydrogen irradiated by a strong laser field: Sturmian basis calculations of rates for high-order multiphoton ionization, Raman scattering, and harmonic generation\", J. Opt. Soc. Am. B 7, 433 (1990)"
