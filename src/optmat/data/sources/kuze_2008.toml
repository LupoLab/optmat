citation = "H. Kuze, T. Sato, T. Kambe, S. Hayashida and Y. Tatsumi, \"Isotope-selective photodissociation of ozone molecules induced by infrared laser irradiation\", Chem. Phys. Lett. 455, 156 (2008)"
doi = "10.1016/j.cplett.2008.02.080"
library = "Kuze_2008_IsotopeSelectivePhotodissociation"
identity = "VALIDATED"
kind = "measurement"
technique = """Narrow-band DFB diode laser (and a high-power external-cavity diode laser) \
tuned to single rotational lines of the Wulf band 3A2 <- 1A1 (v2 = 1-0) near 10 080 \
cm^-1 (about 992 nm), irradiating ozone (about 16 vol % in O2/N2, below 30 kPa total) \
of natural or 18O-enriched composition for 16-36 h in a 5.7 m single-pass cell (960 \
cm^3, -15 to 30 C); decomposition followed by second-derivative (2f) absorption of \
isotopologue lines (reproducibility +-0.002 cm^-1) and by the cell pressure \
(pp. 156-158)."""
notes = """Context only, no datasets. Identity checked on the first page: Kuze, Sato, \
Kambe, Hayashida and Tatsumi, Chem. Phys. Lett. 455, 156-158 (2008).

What it shows: single-photon, isotope-selective predissociation of O3 in the Wulf band \
near 1 um. The decomposition of the irradiated isotopologue is 'nearly proportional to \
the laser power' with 'no apparent threshold' (Fig. 4b), so a one-photon process \
through rotationally resolved lines of 3A2 <- 1A1 (v2 = 1-0), not multiphoton \
absorption (abstract, p. 158). Irradiating the 666 line at 10081.30 cm^-1 (AL3) \
decomposed about 15 % of 666 ozone in 36 h; the 668 isotopologue's own decomposition \
follows mostly from line overlap (p. 157).

Why nothing is taken: the paper gives decomposition volumes and peak-height decays in \
figures only, under cell-specific conditions (wall decomposition, irradiation times), \
with no cross section or quantum yield. Line positions (AL1 10074.61, AL2 10080.68, AL3 \
10081.30, AL4 10074.42 cm^-1; the 666 band origin 10082.0 cm^-1 from Bouvier et al. \
2001) and the isotopologue fractions are not curated quantities. The 'absorption \
cross-section ... on the order of 10^-23 cm^2' (p. 156) is an order of magnitude only \
(el_helou_2005 measures the (1,0) band maximum, 3.80 x 10^-23 cm^2 at 294 K). The \
statement that 3A2 lies 0.13 eV above the dissociation limit is quoted from ab initio \
work (refs. 4, 5: Xie et al. 2001; grebenshchikov_2007).

Register: TC-980."""
