citation = "D. Vukovic, G. A. Woolsey and G. B. Scelsi, J. Phys. D: Appl. Phys. 29, 634 (1996)"
doi = "10.1088/0022-3727/29/3/023"
library = "Vukovic_1996_RefractivitiesWavelengths632"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Lee-Woolsey polarization interferometer (prisms only), gas in a thermally \
insulated invar tube of internal length 486.42 mm, He-Ne laser at 632.99 nm or a \
1300 nm laser diode (wavelength known to 0.03 %). Fringe shift (to 0.01 fringe at \
632.99 nm, 0.05 at 1300 nm; over 100 fringes in total) recorded against pressure \
(Vaisala PTB200, to 15 Pa) from 60 to 110 kPa on filling and on pumping out, at \
20-25 degrees C (to 0.1 K); n - 1 = A (p/RT) + B(T) (p/RT)^2 (Eq. 3) fitted \
(pp. 3-4). SF6 99.9 % pure."""
notes = """n - 1 = m lambda0 / L (Eq. 6), lambda0 the vacuum wavelength: the wavelengths \
are vacuum (632.99 nm He-Ne; 1300 nm nominal). The refractivity 'at 101 325 Pa' at \
the measurement temperature and the value 'converted to 25 degrees C and 1 atm' with \
Eq. (3) (B(T) held constant, an error of 2.5e-7, p. 4) refer to the real gas at that \
pressure and temperature: density real. A_R = 2 A / 3 (Eq. 4) is the first \
refractivity virial coefficient (the package's molar refractivity; 10^-6 m^3/mol = \
cm^3/mol).

Which values are independent: all three (refractivity at T, at 25 C, and A_R) come \
from one fit per wavelength. The 25 C refractivities are taken as primary: they are \
the paper's comparison values and agree with Eq. (3) and the printed A and B (632.99 \
nm: 703.00 against 702.96; 1300 nm: 693.8 against 694.0). The values at the \
measurement temperature and A_R are checks. The 1300 nm value 'at 21.8 C', 698.7, is \
inconsistent with the printed A and B at 21.8 C (they give 701.4) but consistent \
with them at 22.9 C (698.75), the temperature of the 632.99 nm measurement; either \
the temperature or the value is misprinted, which cannot be decided, so no correction \
is made (that dataset is a check).

Uncertainty (p. 4-5): 'the interferometric contributions to uncertainties are less \
than 0.01% and 0.05%'; the laser-diode wavelength 0.03 %; tube length 0.01 %; \
pressure 0.03 %; temperature 0.03 %; the tabulated +- (level not stated) are 0.5 and \
1 x 10^-6. B(T) is uncertain 'as high as 100%' and not used here. B_R is not given for \
this work (it depends on B_p, which varies by more than 10 % between authors).

Table 3 compares SF6 at 632.99 nm with Buckingham and Graham (1974), Watson and \
Ramaswamy (1936, curated as watson_1936; 699.39 at 644.024 nm, an ideal-gas value, \
compared here with a real-gas one) and St-Arnaud and Bose (1979). Their A_R and B_R \
are extracted as reproduced values; the same values are reproduced by achtermann_1991 \
(which prints Buckingham and Graham's B_R as 29 +- 5, here 29 +- 3). Table 3's A_R \
header reads 10^-5 m^3/mol, a misprint for 10^-6 (the values are Table 1's). The \
refractivity 704.005 and A 1.701, 1.7022 'calculated' by the authors from others' \
A_R, B_R with Hamann et al.'s B_p = -284.45e-6 m^3/mol are derived and not extracted.

Thionyl fluoride (SOF2) is not a curated species and is skipped."""

