citation = "P. L. Smith, M. C. E. Huber and W. H. Parkinson, \"Refractivities of H2, He, O2, CO, and Kr for 168 <= lambda <= 288 nm\", Phys. Rev. A 13, 1422 (1976)"
library = "Smith_1976_RefractivitiesH2He"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Mach-Zehnder interferometer in vacuo with fused-silica optics (so lambda >= \
167 nm), a 117.18 +- 0.01 cm test cell in a water jacket, a molecular-hydrogen \
continuum source with Si I, Si II, N I and H2 emission lines as wavelength markers. \
The cell was filled to about 1 atm + 5 Torr at a fixed wavelength, the wavelength \
scanned at constant pressure (fringes counted photoelectrically; photographed below \
about 250 nm), and the cell evacuated at fixed wavelength; corrections for 'quartz' \
fringes and drift (pp. 1422-1425). Pressure by Baratron and mercury barometer \
(+-0.053 %), temperature by thermistors (+-0.067 %). Airco gases (He grade 6, H2 \
grade 6, O2 grade 4.7, Kr grade 4.5), analyses in Table I."""
notes = """Identity unverified by the library: observed title 'Refractivities of H2, He, \
O2, CO, and Kr for 168 <= lambda <= 288 nm', P. L. Smith, M. C. E. Huber, W. H. \
Parkinson, received 18 November 1975; the citation (Phys. Rev. A 13, 1422 (1976)) is the curators', not confirmed by the paper. No DOI recorded. Page numbers are counted from 1422 on the pdf.

Reduction (p. 1424, Eq. 4): to T0 = 273.15 K, P0 = 760 Torr with Mansfield and Peck's \
Lorentz-Lorenz form and compressibilities from Hilsenrath (NBS Circ. 564) or virial \
coefficients from Sengers, Klein and Gallagher: a real-gas reduction; measurements \
were made near standard conditions, so the correction terms are small. Wavelengths \
are vacuum wavelengths (Moore's air wavelengths above 200 nm converted with Coleman, \
Bozman and Meggers; lines marked * in Table IV computed from a polynomial fit, \
+-0.02 nm).

Uncertainties (Table III, p. 1427, '90% confidence limit'): He 1.1 % below and 0.65 % \
above 220 nm at 1 atm, 0.58 % and 0.35 % at 2 atm; the helium discussion (p. 1433) \
quotes 'about +-0.6% at short wavelengths to +-0.35% at longer wavelengths', so the \
2 atm values are used. H2 0.22 / 0.17 %. O2 0.24 / 0.11 %, and 1.0 % below 197 nm \
(191.85 and 184.30 nm, pressure from Eq. 3a, about 250 Torr, in windows of the \
Schumann-Runge bands). Kr 0.11 / 0.10 %, 0.13 % below 190 nm at 1 atm (0.3 % for the \
0.25 atm photographic run, normalised to the 1 atm data at 197-244 nm). For a given \
gas, ratios are better: 'given essentially by the uncertainties in the fringe counts' \
(the Delta N/N columns of Table III). A check against Edlen's standard air (p. 1428) \
agrees to 0.048 %, and the authors think their results 'probably more accurate than \
is indicated'. Helium values are typically the average of two measurements, mean \
absolute deviation 0.27 % (p. 1431).

The krypton values supersede Smith, Parkinson and Huber, Opt. Commun. 14, 374 (1975) \
('slight changes ... from an improved calculation of the drift correction', p. 1433), \
which bideau_mehu_1981 reproduces. The paper's two-term Sellmeier interpolations \
(H2, Kr) are tabulated but their coefficients are not printed: no formulas. CO \
(Table VII, grade 4): below 220 nm fringes could not be obtained at 1 atm 'because of \
absorption by the bands of the fourth positive system'; photographic measurements at \
about 100 Torr were 'put onto the absolute scale' as for Kr (p. 1425); uncertainty \
0.10 % above and 0.58 % below 220 nm (Table III, 90 % confidence), 'from +-0.1% to \
+-0.6%' (p. 1433); a three-term Lagrange interpolation, not a Sellmeier, was fitted \
(p. 1429). Table IV's Delta (%) for the \
'other measurements' has the sign of theory minus measurement, against its footnote."""

