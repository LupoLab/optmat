citation = "A. Kumar, G. R. G. Fairley and W. J. Meath, \"Dipole properties, dispersion energy coefficients, and integrated oscillator strengths for SF6\", J. Chem. Phys. 83, 70 (1985)"
doi = "10.1063/1.449794"
library = "Kumar_1985_DipolePropertiesDispersion"
identity = "VALIDATED_WITH_WARNINGS"
kind = "compilation"
technique = """Constrained dipole oscillator strength distribution (DOSD): measured SF6 \
photoabsorption and electron-energy-loss oscillator strengths (Hitchcock and Van der \
Wiel 5.0-63.0 eV; Simpson et al. 10.1-32.0; Blechschmidt et al. 10.1-49.0 and 150-250; \
Hitchcock et al. 13.66-226.0; Sasanuma et al. 15.1-39.0; Lee et al. 16.76-68.88; \
Zimkina and Fomichev 164.1-300.0 eV), the mixture rule sigma(SF6) = sigma(S) + 6 \
sigma(F) with Veigele's atomic cross sections from 250 eV to 100 keV (Eq. (1)), and \
the non-relativistic Stobbe formula above 100 keV; each region's df/dE scaled by (1 + \
a_i) (Eq. (2), N = 50 regions) so that the DOSD satisfies the TRK sum rule (Z = 70) \
and Watson and Ramaswamy's molar refractivity at 6440 A; the adopted DOSD has the \
smallest spread (STD about 3) of some 13 000 constructed. The total DOSD adds Pack's \
infrared oscillator strengths (from Fox and Person's and Person and Overend's IR data) \
and is constrained also to S_0(total) = 70.018 (with the nuclear-motion correction) \
and S_-2(total) = 44.21 (Tipton et al.'s microwave polarizability, via Pack) (pp. \
70-72)."""
notes = """PDF page 1 is a download cover sheet; PDF pages 2-9 = journal pages 70-77. Values per \
molecule, rotationally averaged (isotropic). Sums S_k = integral of (E/2R)^k df/dE \
(Eq. (3)), atomic units; S_-2 is the static polarizability in a0^3 (UV: electronic; \
total: with the infrared part). Powers of ten are printed in parentheses, 7.437(-2); \
stored in e-notation, digits unchanged.

Constraint (p. 72): Watson and Ramaswamy's R(6440 A) = 11.4057 and R(4360 A) = 11.5212 \
cm^3/mol could not both be imposed (their difference is of the order of the \
refractivity error); the adopted DOSD uses 6440 A only. It gives R(4359.6 A) = 11.6474 \
cm^3/mol, 1 % above experiment, and a DOSD constrained at 4359.6 A instead gives \
R(6440 A) = 11.2843, 1 % below (p. 75): 'an uncertainty of about 1% in the \
experimental refractivity results'. With that alternative DOSD the UV S_k are lower by \
about 0.3, 0.5, 0.8, 1, 1.3, 1.5, 1.9 and 2.2 % for -k = 0.5, 1, 1.5, 2, 2.5, 3, 4, 6, \
the I_k higher by <= 0.5 %, C6(SF6-SF6) lower by 1.5 %; 'most of the dipole properties \
... are probably slightly high' (pp. 75-76). Uncertainties (p. 75), assuming reliable \
refractivities: UV S_k about 2 % for k = 1, <= 1 % for -4 <= k < 1, <= 3 % for k > 0 \
(dominated by the high-energy data), increasing substantially below k = -5; the \
infrared part matters only for k <= -3/2 and the total S_k for k < -2 are less \
reliable. So the sums are not independent of Watson and Ramaswamy's refractivity: \
checks.

Table I (p. 71): the adopted UV DOSD integrated over 27 regions (dataset dosd_SF6; \
sums to 69.996, checked 2026-09-27). The caption gives the infrared oscillator \
strengths (E in units of 2R): Pack's initial (0.0027999, 1.327(-5)) and (0.0043190, \
2.264(-4)), adjusted to f1 = 1.331(-5) and f2 = 2.317(-4) (inline datasets); and the \
absorption edges '-164.1' (sic: 164.1, S L2,3), 228.5 (S L1), 2472 (S K) and 648.7 eV \
(F K; Table I's region edge is 684.7). The initial-data columns are not extracted; the \
text (p. 73) notes that Blechschmidt et al.'s and Sasanuma et al.'s data over \
13.6-39.0 and 15.1-39.0 eV are about 33 % and 30 % above the adopted strengths (about \
16).

Table II (p. 72): the adopted S_k, k = 2, 1, -1/2, -1, -3/2, -2, -5/2, -3, -4, UV and \
total (datasets). The text (p. 73) adds S_-6 = 982.1 (UV) and quotes Pack's Cauchy-fit \
S_-2 = 3.038(1) +- .02, S_-4 = 3.26(1) +- 4.9 and S_-6 = 680 +- 310 (from Watson and \
Ramaswamy's refractivities), Tipton et al.'s total S_-2 44.21 +- 0.05 (via Pack), \
Hosticka and Bose's 44.27 +- 0.07, and Lazzeretti et al.'s coupled Hartree-Fock S_-2 = \
22.76 (inline datasets). The mean excitation energies I_k (Table II, eV: UV I_2 = \
4.553(4), I_1 = 1.674(3), I_0 = 1.284(2), I_-1 = 3.679(1), I_-2 = 2.302(1); total \
4.553(4), 1.674(3), 1.283(2), 3.637(1), 4.196(0)) have no quantity: not extracted.

Table III (p. 74): ten-term UV and twelve-term total (two IR + ten UV) pseudo-DOSDs, E \
in units of 2R (hartree) (formulas). They reproduce Table II's integer-k sums; at k = \
-1/2 they give 40.43 (UV) and 40.46 (total) against Table II's 40.34 and 40.37 (the \
half-integer sums are not constrained in the fit, Eq. (6)).

Table IV (p. 74): C6(SF6-B) for 19 partners, UV and total, with Pack's Pade values and \
uncertainties (C6(SF6-SF6) = 578.2 UV, 585.8 total); C9(SF6,SF6,SF6) = 1.202(5) (UV), \
1.237(5) (total) (p. 75): no quantity, not extracted."""

