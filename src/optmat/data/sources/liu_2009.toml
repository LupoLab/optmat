citation = "J. Liu, E. J. Salumbides, U. Hollenstein, J. C. J. Koelemeij, K. S. E. Eikema, W. Ubachs and F. Merkt, \"Determination of the ionization and dissociation energies of the hydrogen molecule\", J. Chem. Phys. 130, 174306 (2009)"
doi = "10.1063/1.3120443"
library = "Liu_2009_DeterminationIonizationDissociation"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """The ionisation energy of ortho-H2 as a sum of intervals (Fig. 1, Table II): \
X (v = 0, N = 1) -> EF 1Sigma_g+ (v = 0, N = 1), from Hannemann et al. 2006 (their Ref. \
5); EF (0, 1) -> the 54p1_1(0) Rydberg state, measured here; and the 54p1_1(0) \
binding energy relative to the centre of gravity of the X+ (v+ = 0, N+ = 1) hyperfine \
structure, from Osterwalder et al. 2004 (Ref. 6) and Karr et al. 2008 (Ref. 25). The \
measurement: a skimmed pulsed supersonic H2 beam (2 bar stagnation), two-step \
excitation, a nonresonant two-photon step at 202 nm (pulsed dye laser, ~0.4 cm^-1 \
bandwidth, exciting all Doppler components) and a 397 nm step (second harmonic of a \
cw-seeded pulsed Ti:Sa amplifier, ~20 MHz bandwidth, delayed by 50 ns), with \
co- and counterpropagating 397 nm beams to cancel the first-order Doppler shift; \
delayed pulsed-field ionisation; calibration against Doppler-free I2 lines (comb-measured \
positions) and an etalon; the amplifier's frequency shift measured by heterodyne (pp. \
2-4). The para-H2 (conventional) value adds the X (0, 1) - X (0, 0) interval (Jennings \
et al. 1984, Ref. 8) and subtracts the X+ (0, 1) - X+ (0, 0) interval (Korobov, Refs. \
9-11) (p. 6)."""
notes = """PDF pages 1-9 (page 1 is the publisher's cover sheet; PDF page 2 = \
174306-1; pages cited are PDF pages). Identity checked on the first page (PDF p. 2). \
The library flags unmapped glyphs on every page (parentheses rendered as other \
characters): every number taken was read on the table images (Tables II and III) or on \
the rendered page (the equations under Table II, p. 6).

NOMENCLATURE: in H2 the para levels have even N, so E_i(H2) = E_i(para-H2) = X+ \
2Sigma_g+ (v+ = 0, N+ = 0) - X 1Sigma_g+ (v = 0, N = 0) is the conventional \
(rotationless) ionisation energy; E_i(ortho-H2) = X+ (v+ = 0, N+ = 1, centre of \
gravity of the hyperfine structure) - X (v = 0, N = 1) (Table II; p. 5: 'This value \
corresponds to the center of gravity of the hyperfine structure components of the N+ = \
1 level of H2+'). The hyperfine splittings of X (0, 1) (< 500 kHz) and EF (0, 1) are \
neglected (p. 5).

EXTRACTED:
- ie_ortho_H2 (inline; p. 6, the equation under Table II): E_i(ortho-H2) = (2) + (3) - \
(4) + (5) + (6) = 124 357.237 97(36) cm^-1. Table II's intervals reproduce it to \
1e-5 cm^-1 (the sum with (4) taken as the mean of its three hyperfine components, \
4.791 89, is 124 357.237 979; the paper does not say how it averaged). 'The overall \
uncertainty ... is determined as quadrature summation of the uncertainties of all \
energy level intervals' (p. 5): sqrt(0.18^2 + 0.29^2 + 0.10^2) = 0.36 (1e-3 cm^-1) \
reproduces the (36).
- ie_para_H2 (Table III, 'This work' row, tbl_c65377ced290; also abstract p. 2, text \
p. 6 and p. 7): E_i(H2) = E_i(para-H2) = (1) + E_i(ortho-H2) - (7) = 124 417.491 \
13(37) cm^-1 (the table's year column prints 2008). The intervals give 124 417.491 \
144, 1.4e-5 cm^-1 above the printed value (well inside the uncertainty); the \
quadrature sum with (1)'s 0.10 gives 0.37. In eV (not printed; hc = 1.239841984e-4 eV \
cm): ortho 15.4183325, para 15.4258029 eV.
- Table III (p. 8, tbl_c65377ced290, image checked): E_i(H2) as determined 1969-2002, \
reproduced, one dataset per row, with the references as the paper's list prints them \
(p. 9). Theoretical values are printed without uncertainties. The 1993 rows citing \
'revised in 41' are shiner_1993's two H2 values (identical); the 1993 theory row (Ref. \
40) is the Kolos & Rychlewski number shiner_1993 prints.

UNCERTAINTIES: the EF (0, 1) -> 54p1_1(0) interval is 25 209.997 56 +- (0.000 \
22)statistical +- (0.000 07)systematic cm^-1 (p. 5), 'by adding the statistical and \
systematic errors' 25 209.997 56(29); the statistical part is one standard deviation \
(p. 5: 'the number in parentheses represents one standard deviation in the unit of the \
last digit', of the mean of 16 pairs of measurements on 4 days, 2 x 12 604.998 80(10) \
cm^-1 fundamental). Error budget (Table I, p. 5, tbl_db58936e3055; MHz on the \
fundamental, x 2 on the UV): statistical, line centres of I2 +-0.36 x 2 and H2 +-3.0 \
x 2, ring-laser nonlinearity < +-1.1 x 2, residual Doppler < +-0.32 x 2, sum in \
quadrature +-6.5; systematic, FSR +-0.012 x 2, I2 reference lines < +-0.1 x 2, \
Ti:Sa amplifier shift (-4.76 +- 0.60) x 2, doubling crystal < +-0.35, ac Stark (-1.27 \
+- 0.64) x 2, dc Stark (+0.77 +- 0.39) x 2, pressure < +0.10 +- 0.05; sum -10.4 +- 2.0 \
MHz. The confidence level of the totals is not named.

COMPARISON: holsch_2019's ortho-H2 value 124 357.238 003(11) cm^-1 is 3.3e-5 cm^-1 \
above this paper's 124 357.237 97(36) (0.1 sigma of this paper's uncertainty). \
Hölsch et al. (their Ref. 19) describe their result as a 30-fold improvement over this \
'2009 result'.

NOT EXTRACTED (notes only; no quantity):
- Table II (p. 6, tbl_335e888b87cd; cm^-1): (1) X (0, 1) - X (0, 0) 118.486 84(10) \
[8]; (2) EF (0, 1) - X (0, 1) 99 109.731 39(18) [5]; (3) 54p1_1 (S = 0, centre) - EF \
(0, 1) 25 209.997 56(29) [this work]; (4) 54p1_1 (S = 0), F = 1, 0, 2 - 51d1_1 (G+ = \
1/2), F = 0: 4.791 80, 4.791 91, 4.791 96 [6]; (5) X+ (0, 1, G+ = 1/2), F+ = 1/2 - \
51d1_1 (G+ = 1/2), F = 0: 42.270 539(10) [6]; (6) X+ (0, 1, centre) - X+ (0, 1, G+ = \
1/2), F+ = 1/2: 0.030 379 61 [25]; (7) X+ (0, 1, centre) - X+ (0, 0): 58.233 675 1(1) \
[9-11]. The 54p1_1(0) binding energy -(4) + (5) + (6) is 37.509 03 (the text, p. 2, \
quotes 37.509 02(2) from Ref. 6). The library's CSV of this table lost the \
parentheses ('118.486 8410-'); its OCR alternative and the image agree with the values \
above.
- The dissociation energy (Eqs. (12)-(14), p. 7): D0(H2) = 36 118.069 62(37) cm^-1 \
(para, N = 0), a 'hybrid experimental-theoretical determination' (abstract), limited \
entirely by E_i(H2). Against the theory of Wolniewicz 1995 (36 118.069) and the \
experiment of Zhang et al. 2004 (36 118.062(10)) (p. 7). Recalculated inputs (CODATA \
2006 constants): E_i(H) = 109 678.771 742 6(10) cm^-1 (Eq. (9), the hyperfineless \
1 2S1/2 ground state; Eqs. (6)-(8): Dirac -109 679.043 564 75(73), recoil -0.000 794 \
340 7, Lamb shift 0.272 616 53(67)); E_i(H2+) = 131 058.121 975(49) cm^-1 (Eq. (10), \
Korobov's formulae, uncertainty from neglected higher-order terms); D0(H2+) = 21 379.350 \
232(49) cm^-1 (Eq. (11); Moss 21 379.3501(1)). These are calculations (H is not a \
curated material; H2+'s ionisation energy is a theoretical value in a measurement \
record), so they stay in notes.
- The earlier values quoted in the introduction (p. 2): E_i(H2)exp = 124 417.476(12) \
(de Lange et al. 2002, Table III's 2002 row), D0(H2)exp = 36 118.062(10) (Zhang et al. \
2004), and theory 124 417.491 and 36 118.069 (Wolniewicz 1995, Table III's 1995 row).
- Figs. 2-4 (the field-ionisation spectra, the calibration, the distribution of the \
measurements) and Figs. 5-6 (the potential diagram; E_i(H2) against year): figures, \
not digitised."""

[[datasets]]
id = "ie_ortho_H2"
material = "H2"
table = "text"
quantity = "ionization_energy"
unit = "cm-1"
abscissa = "label"
use = "primary"
points = [["1", "ortho-H2", "124357.23797", "0.00036"]]
notes = """p. 6 (174306-5), the equation printed under Table II: E_i(ortho-H2) = (2) + (3) \
- (4) + (5) + (6) = 124 357.237 97(36) cm^-1, from X (v = 0, N = 1) to the centre of \
gravity of the hyperfine structure of X+ (v+ = 0, N+ = 1). Quadrature sum of the \
intervals' uncertainties; level not named (record notes). Superseded in precision by \
holsch_2019/ie_ortho_H2 (124 357.238 003(11))."""
[datasets.parameters]
kind = "adiabatic"
final_state = "X+ 2Sigma_g+ (v+ = 0, N+ = 1), centre of gravity of the hyperfine structure"
initial_state = "X 1Sigma_g+ (v = 0, N = 1), ortho-H2"

[datasets.uncertainty]
column = true
level = "not stated"

