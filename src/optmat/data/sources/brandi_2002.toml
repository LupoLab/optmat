citation = "F. Brandi, W. Hogervorst and W. Ubachs, \"High-resolution vacuum-ultraviolet and ultraviolet photoionization spectroscopy of krypton\", J. Phys. B: At. Mol. Opt. Phys. 35, 1071 (2002)"
doi = "10.1088/0953-4075/35/4/329"
library = "Brandi_2002_HighResolutionVacuum"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Resonance-enhanced photoionisation of krypton in a skimmed, collimated \
atomic beam crossed by the laser beams (collision-free), the ions mass-resolved by \
time of flight so that all six stable isotopes are recorded: 1VUV + 1UV to 5d[1/2]1 \
(96.3 nm) and 6s[3/2]1 (100.1 nm), the VUV the third harmonic in a xenon jet of the \
doubled output of a pulsed dye amplifier (6 ns, 10 Hz) seeded by a cw ring dye laser; \
2UV + 1UV to 5p[1/2]0 (212.6 nm), 5p[3/2]2 (214.8 nm) and 5p[5/2]2 (216.7 nm), the UV \
the amplifier's third harmonic (KD*P doubling, BBO type-I mixing, about 1 mJ), \
unfocused for the spectroscopy and focused by a 1 m lens for the ac Stark shift \
(Table 1, Sec. 2). Absolute frequencies from the cw seed against I2 saturation lines \
(the 't' hyperfine components, 1 MHz) and a stabilised confocal etalon, times 6; the \
amplifier's chirp is the main systematic error (30 MHz allowed, Sec. 3.2)."""
notes = """J. Phys. B: At. Mol. Opt. Phys. 35, 1071-1084 (2002) = PDF pages 1-14 \
(journal page = PDF page + 1070). Identity checked against the first page (journal, \
volume, pages, authors, title, received 15 November 2001, published 13 February 2002). \
Level labels: the paper uses jl coupling without the core, all its levels having the \
2P3/2 core; NIST's (data/external/nist_asd/Kr_I_levels.tsv) are 5d[1/2]1 = \
4s2.4p5.(2P*<3/2>).5d 2[1/2]* J = 1, 6s[3/2]1 = 4s2.4p5.(2P*<3/2>).6s 2[3/2]* J = 1, \
5p[1/2]0 = 4s2.4p5.(2P*<3/2>).5p 2[1/2] J = 0 (also the 5p[3/2]2 and 5p[5/2]2 of the \
isotope shifts = (2P*<3/2>).5p 2[3/2] J = 2 and 2[5/2] J = 2). The mapping is the \
energy and J: each Table 4 energy is within 0.008 cm^-1 of the NIST level so named; the \
nearest other NIST levels are 40 cm^-1 (6p 2[1/2] J = 0, even, below 5d[1/2]1), 248 \
cm^-1 (4d 2[3/2]* J = 1, below 6s[3/2]1) and 970 cm^-1 (5p 2[3/2] J = 2, below \
5p[1/2]0) away. The 5p levels of the isotope shifts carry no energy here.

WHAT IS TAKEN (tools/extract/brandi_2002.py). Table 4 (p. 1079): the energies of \
5d[1/2]1, 6s[3/2]1 and 5p[1/2]0 of 86Kr above the ground level, cm^-1, three \
level_energy datasets (one file each). The 5p[1/2]0 energy is the two-photon \
transition (2 x 212.55 nm), measured unfocused (at most 0.2 MW cm^-2, where the ac \
Stark shift below is 0.15 MHz). The uncertainties (12-14 in the last digits, 36-42 \
MHz) combine the statistical standard deviation, a residual chirp of 30 MHz, a Doppler \
allowance of 20 MHz and the etalon's free spectral range (p. 1078-1079); their level \
is not stated. The text, p. 1079 and the abstract: the ionisation energy of 86Kr, \
'E86 = 112 914.516(14) cm-1', inline, use = check: it is Yoon and Glab's Rydberg-series \
limit (112 914.500(14), J. Phys. B 27, 4133 (1994), not in the library) moved by this \
paper's correction of their 5p[3/2]1,2 initial energies (+0.012) and the 84Kr-86Kr \
shift of those levels (about 0.004, from Kaufman 1993): a derived value, isotope \
specific.

CHECKED (the script). The text's mean and standard deviation of the three differences \
from Kaufman and Humphreys (-0.0558 and 0.0005 cm^-1) from the printed differences \
(-0.0559, -0.0553, -0.0563). Against NIST's Kr I levels, which name no isotope: the \
86Kr energies lie 0.0073 (5d[1/2]1), 0.0043 (6s[3/2]1) and 0.0047 cm^-1 (5p[1/2]0) \
above NIST's 103 801.7929, 99 894.0485 and 94 092.8626; moved to 84Kr by the paper's \
own isotope shifts (Table 2, Delta^{84,86} = -206, -112, -138 MHz) they are 103 \
801.7933, 99 894.0491 and 94 092.8627, within 0.0004, 0.0006 and 0.0001 cm^-1 of NIST \
(the script requires 0.001). NIST's values are therefore those of 84Kr (natural Kr, 57 \
% 84Kr) on this paper's calibration; NIST gives these three levels no bibliographic \
key or uncertainty in the held file. NIST's ionisation limit, 112 914.433(16) cm^-1 \
(the file's Limit row; nist_asd_2026 ie_Kr_I, 13.9996055 eV), is 0.083 cm^-1 below \
this paper's 86Kr value and 0.067 below the 112 914.50(2) of Klar et al. (J. Phys. B \
34, 1549 (2001), not in the library) that the paper calls consistent with it (p. \
1079): the difference exceeds both uncertainties; the isotope shift of the limit \
(about 0.008 cm^-1 per two mass units, Kaufman, p. 1079) does not explain it. All \
cells taken were checked against the table images; the text values on the PDF's text \
layer (pp. 1071, 1079, 1081, 1082).

ALSO TAKEN (light_shift_coefficient, TC-1011; inline, text values). (1) ls_5p12_0: \
the ac Stark shift of the two-photon 4p6 - 5p[1/2]0 transition of 84Kr (Sec. 3.3, p. \
1081; abstract; conclusions): 'a slope of 0.75(48) Hz (W cm-2)-1, where 50% \
uncertainty on the actual power density is considered', a blue shift of the \
transition (2UV) frequency, linear for power densities up to about 260 MW cm^-2 (Fig. \
4, a weighted linear fit); sub-linear at 2.6 GW cm^-2 with an asymmetric line (FWHM \
about 2.3 GHz, tail to the blue). The power density (p. 1080) is that of the UV pulse \
focused by a 1 m lens to about 90 um diameter (Gaussian beam assumed): 'about 2.6 GW \
cm-2 at 1 mJ/pulse energy' with the 6 ns pulses, 50 % uncertainty 'related to possible \
hot spots'; the confocal parameter (6 cm) exceeds the Kr beam (a few mm), so the \
intensity is taken as uniform. use = primary (the paper's own measurement). The \
abscissa is the photon's vacuum wavelength, 212.55 nm (p. 1072; 2 x 212.556 nm from \
Table 4's 94 092.8673 cm^-1). The polarisation is not stated (the UV is the type-I \
BBO mixing product, p. 1074). (2) ls_5p12_0_stoicheff: the Stoicheff group's '2.6(1.1) \
Hz (W cm-2)-1' (p. 1082), from resonance-enhanced THG in a jet of natural Kr, which \
the paper calls 'not completely compatible with our finding, although of the same \
order of magnitude': use = reproduced, from Balakrishnan, Smith and Stoicheff, Phys. \
Rev. Lett. 68, 2149 (1992) and Phys. Rev. A 48, 2460 (1994) as the reference list \
prints them (not in the library); their intensity definition is not given here.

NOT TAKEN (no quantity; declined, TC-1011): (1) the isotope shifts of Table 2 (p. \
1076, MHz, Delta^{84,A} = nu^84 - nu^A for A = 86, 83, 82, 80, 78 on all five \
transitions, 1 sigma; 83Kr relative to the hyperfine centre of gravity), with the \
text's Delta_{5p[3/2]2, F=13/2}^{84,83} = 1083(14) MHz and Delta_{6s[3/2]1, \
F=11/2}^{84,83} = 786(10) MHz (p. 1076). The 'from [23]' and 'from [7]' rows are \
Kaufman's (J. Res. NIST 98, 717 (1993)) and Trickl et al.'s (Phys. Rev. A 39, 2948 \
(1989)) values, reproduced. (2) The hyperfine constants of 83Kr 5p[5/2]2, A = \
-155.6(1.2) MHz and B = -428(25) MHz (p. 1076; Cannon and Janik's -156.49(8) and \
-407.7(13) reproduced).

NOT TAKEN (not a quantity of a gas): Table 3 (p. 1077), the King-plot slopes, \
intercepts and the field- and mass-shift factors F_i and M_i (nuclear-structure \
analysis on Cannon and Janik's 760 nm line); Table 1, the wavelengths and dyes; the \
line widths (Gaussian FWHM about 400 and 350 MHz, the laser bandwidth, p. 1074; 630 \
MHz at 260 MW cm^-2, power broadened, p. 1081): instrumental. The 5p[1/2]0 energies \
the paper derives at others' intensities (94 092.89(2) at 8e8 W cm^-2 against \
Balakrishnan et al.'s THG value 94 093.00(4); 94 092.90(2) at 4e9 W cm^-2 against \
Hollenstein, Palm and Merkt's 94 092.91 (Rev. Sci. Instrum. 71, 4023 (2000)), p. \
1082) and the intercept 23.377(44) GHz of Fig. 4 (relative to the I2 line): light \
shifted or relative, not level energies. Fig. 3 (spectra at three power densities) \
and Fig. 4 (the shifts, log-log; the slope is printed): not digitised. Kaufman and \
Humphreys's energies (J. Opt. Soc. Am. 59, 1614 (1969)) follow from Table 4 by \
subtraction and are not taken. No pressure shift, collisional width, lifetime or \
two-photon cross section is measured (a collision-free beam).

FOR OEP 8. ls_5p12_0 is the only measured Kr 5p light shift found. In OEP 8's \
convention (Eq. 6-7, I = 2 eps0 c |E+|^2) a transition shift of +0.75(48) Hz per W \
cm^-2 is Re alpha_f - alpha_g = -16(10) au at 212.55 nm, the power density taken as \
the intensity (a derived number, not recorded as data).

FURTHER TWO-PHOTON DATA CITED: the Stoicheff group's THG calibration and light shift \
of 5p[1/2]0 (Balakrishnan et al. 1992, 1994, above); Hollenstein et al. 2000 (above, \
line width 0.12 cm^-1 at about 4e9 W cm^-2); Miyazaki, Sakai and Sato, Appl. Opt. 28, \
699 (1989) and Marangos, Shen, Hutchinson and Connerade, J. Opt. Soc. Am. B 7, 1254 \
(1990), resonance-enhanced THG and mixing on 5p[1/2]0; Dorman, Kucukkara and Marangos, \
Phys. Rev. A 61, 013802 (1999), EIT-enhanced mixing via 5p[1/2]0; Camparo and \
Lambropoulos, J. Opt. Soc. Am. B 9, 2163 (1992) and Opt. Commun. 137, 413 (1997), and \
Pindzola, Glasser and Payne, Phys. Rev. A 30, 1800 (1984), ac Stark line shapes of \
two-photon transitions; Plimmer et al., J. Phys. B 22, L241 (1989), cw two-photon \
excitation of Xe. None is in the library (checked by folder name; the library's \
Trickl_1989 is a different paper, on N2)."""

