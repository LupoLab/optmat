citation = "D. Cotter, \"Conversion from 3371 to 1124 Å by nonresonant optical frequency tripling in compressed krypton gas\", Opt. Lett. 4, 134 (1979)"
doi = "10.1364/ol.4.000134"
library = "Cotter_1979_Conversion33711124"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Nonresonant third-harmonic generation of a nitrogen laser (337.1 nm, 1 MW, \
3.2 ns, beam 7 x 15 mm) focused by 25-150 mm lenses into an 8 mm krypton cell (fused \
quartz entrance, LiF exit window), 112.4 nm output through a 0.3 m vacuum monochromator \
to a solar-blind photomultiplier, absolute energy from a 10 Torr NO ionization chamber; \
output against Kr pressure (0-11 bar) for three lenses; preliminary tripling of a \
p-terphenyl dye laser pumped by KrF."""
notes = """Journal pages 134-136 = PDF pages 1-3. Identity checked against the first page. \
Wavelengths are printed in angstrom (3371, 1124 A); the fundamental is the N2 laser line \
envelope (0.78 A wide). No Xe, Ar or He output was detected (p. 134).

DISPERSION (no dataset; TC-718). The paper's only number for the refractive \
index is CALCULATED, not measured: 'we estimate that Delta k = -140 p in units of \
cm^-1, where p is the gas pressure in atmospheres' (p. 135), Delta k = 6 pi (n_3 - n_1) \
/ lambda_1, from an eleven-term Sellmeier formula of Kr (ten resonance lines with the \
oscillator strengths of Wilkinson, Gruzdev, Griffin and Hutcherson, Leonard and Barker, \
and Delage and Carette, frequencies from Moore, and one lumped term fitted to visible \
and ultraviolet indices: Chashchina and Shreider, Leonard, Bideau-Mehu et al., Smith et \
al.). The temperature of the per-atmosphere value is not stated, so it is not a \
mismatch per atom; the package has no quantity for a mismatch per pressure.

The measurements constrain the dispersion only qualitatively: (i) an optimum pressure \
exists for each lens, rising as the focusing tightens ('3-5 atm' with the shorter \
lenses, p. 134; Fig. 1, not digitised), which with Bjorklund's optimum b Delta k = -4 requires Delta k < 0 \
at 112.4 nm; b is not measured (the beam is far from Gaussian: 'a more-quantitative \
comparison is not possible', p. 135), so no Delta k follows; (ii) tripling of the dye \
laser gave output from 111.6 to 116.5 nm, 'closely' the range where the calculated \
Delta k is negative (p. 135), and in the note added in proof 110.0 to 116.5 nm \
('continuously tunable', up to 12 W, 3e-5 efficiency), with wavelength-dependent \
optimum focusing and pressure. Whether the short-wavelength edge is set by the phase \
matching or by the dye laser's tuning is not stated. Fig. 1's axis is in bar, the text's \
optimum pressures in atm.

Third-order data (checked 2026-09-29): none. The conversion efficiencies (up to 1e-6; \
0.7-0.9 W from 1 MW) are not reduced to a susceptibility, and the beam is not \
characterised well enough to do so."""
