[[formulas]]
id = "hk_II_Ar"
material = "Ar"
equation = "Eq. (3), p. 386, constants p. 387 and Tabelle 6 ('diese Arb. II')"
printed = "nu_0 - 1 = C / (n_0^2 - n^2); C = 4,216 x 10^27, n_0^2 = 15177 x 10^27 (Tabelle 6: 2C x 10^-27 = 8,4321, n_0^2 x 10^-27 = 15 177, (nu_0 - 1)_inf 10^7 = 2778)"
variable = "n: frequency in s^-1, n = c/lambda with c = 3 x 10^10 cm/s and lambda as printed in cm (implied: it reproduces the table; not stated); C in s^-2"
state = "1atm_0C"
density = "ideal"
range = "546.1-6763.2 nm (the five fitted values)"
coefficients = { C = "4.216e27", n0_squared = "15177e27", two_C_table6 = "8.4321e27" }
check = "With n = 3e10/lambda (lambda: 6763.2, 656.30, 579.05, 576.95, 546.10 nm as printed) it gives 2778.2, 2816.7, 2827.9, 2828.3, 2834.2 x 10^-7, Tabelle 5/7 'ber. II' exactly (c = 2.99796e10 changes the visible values by 0.1). Static limit C/n_0^2 = 2777.9 x 10^-7, Tabelle 6's 2778. Checked 2026-09-24."
notes = "The Helmholtz-Ketteler formula for one resonance, fitted by least squares to all five argon values; a single-oscillator form n - 1 = C/(nu_0^2 - nu^2) in frequency (Hz) that fits none of the package's forms without converting the printed coefficients (with s = 1/lambda in um^-1, B = C/(c^2 1e8) and C' = n_0^2/(c^2 1e8) in dn_sigma2). The fitted resonance lies at n_0 = sqrt(15177e27) = 3.896e15 s^-1, lambda_0 = c/n_0 = 77.0 nm (computed). Tabelle 6 prints 2C (doubled 'with Cuthbertson, to compare with diatomic gases')."

[[formulas]]
id = "hk_I_Ar"
material = "Ar"
equation = "Eq. (3), p. 386, with Tabelle 6 ('diese Arb. I'), p. 388"
printed = "nu_0 - 1 = C / (n_0^2 - n^2); Tabelle 6: 2C x 10^-27 = 9,0942, n_0^2 x 10^-27 = 18 348, (nu_0 - 1)_inf 10^7 = 2781"
variable = "n: frequency in s^-1, n = c/lambda with c = 3 x 10^10 cm/s and lambda as printed in cm; C = (2C)/2 in s^-2"
state = "1atm_0C"
density = "ideal"
range = "546.1-656.3 nm (the four visible values; 'the constants valid for the visible region, labelled I', p. 389)"
coefficients = { two_C = "9.0942e27", n0_squared = "18348e27" }
check = "As printed it does not reproduce: C/n_0^2 = 4.5471/18348 = 2478 x 10^-7 against the printed (nu_0 - 1)_inf = 2781, and 2520 at 546.1 nm against 'ber. I' 2833.8. With n_0^2 = 16348e27 it gives 2781.4 (static) and 2781.8, 2817.5, 2827.9, 2828.2, 2833.8 at the five wavelengths, Tabelle 7 'ber. I' exactly. Checked 2026-09-24."
notes = "Fitted to the visible values only; used in Tabelle 7 to show that formula (3) fails beyond a small range (Delta I = -3.8 x 10^-7 at 6.76 um). The printed n_0^2 = 18 348 is a misprint for 16 348 (one digit, 6 read or set as 8); corrected below."

[[formulas.corrections]]
term = "n0_squared"
index = 0
printed = "18348e27"
corrected = "16348e27"
reason = "Tabelle 6 prints n_0^2 x 10^-27 = 18 348 for 'diese Arb. I'; with 2C = 9.0942e27 this gives a static refractivity of 2478 x 10^-7, not the printed 2781 in the same row, and 'ber. I' values 11 % too low. 16 348 reproduces both."
evidence = "Tabelle 6 image tbl_3de15b358ae0.jpg prints 18 348; Tabelle 7 (tbl_1f78cf25d43e) 'ber. I' (2781.8, 2817.5, 2827.9, 2828.2, 2833.8) and Tabelle 6's (nu_0 - 1)_inf = 2781 are reproduced to the printed digit with 16 348 (computed 2026-09-24)."

