citation = "M. Rusch, Ann. Physik (4) 70, 373 (1923)"
doi = "10.1002/andp.19233750504"
library = "Rusch_1923_UberLichtbrechungGasen"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Michelson interferometer (Hilger, fluorite optics) and the pressure-change \
method (Loria and Patkowski): the fringes passing while the pressure in one of two \
fluorite-windowed tubes (double gas length L = 1052.8 mm) is changed by Delta p, read \
to 0.05 mm Hg on a microscope manometer. Visible: Hg 5461.0, 5769.5, 5790.5 and H 6563.0 \
A lines from a Geissler tube, fringes counted on a Zeiss monochromator. Infrared: the \
reststrahlen of four calcite plates cut perpendicular to the optic axis (Nernst \
filament), fringes on a vacuum thermocouple; in the infrared the product n lambda was \
replaced by the measured double mirror displacement 2s (Eq. (1)). Argon: raw gas from \
Linde (about 1 % O2, 14 % N2) purified in the apparatus (Ca + 5 % Ca3N2 at 350 C for N2, \
glowing Cu for O2, CuO for H2, absorbers for CO2, PH3, hydrocarbons, NH3, H2O, P2O5) until \
spectroscopically pure but for a trace of H2 (pp. 384-386). 15 single measurements per \
wavelength for argon, 12 (visible) and 9 (infrared) for air. Dissertation, Breslau \
(1922); measurements helped by B. Quarder."""
notes = """Only AIR and ARGON were measured ('Als Versuchsgase wurden Luft und Argon gewählt', \
p. 374); air is not a curated species and is skipped (Tabellen 3, 4, 7 first part, 8, 9). \
No H2, N2, O2 or CO2 values are in this paper (it discusses J. Koch's infrared H2 and O2 \
work only). Wavelengths are printed as lambda x 10^7 cm, i.e. in nm; German decimal \
commas.

Reduction (p. 381-382, translated): the refractive index follows from Loria's formula \
nu_0 - 1 = n lambda / (L Delta p) x 760 x (1 + alpha t) (Eq. (2)), 'derived on the \
assumption of the validity of the Gladstone-Dale formula (nu - 1)/d = const (d = \
density) and of the ideal gas equation'. 'nu_0 is the refractive index at 760 mm Hg \
pressure and 0 deg C, n the number of fringes that passed, lambda the wavelength used, \
for vacuum, L twice the length of the gas column in the tube R_2, Delta p the pressure \
change in mm Hg reduced to 0 deg C and 45 deg latitude, t the temperature of the gas in \
R_2, alpha the pressure coefficient of the gas.' 'For alpha the pressure coefficient of \
the gases was used; earlier work [V. v. Lang, Benoit, Walker] showed that a value \
alpha* somewhat different from the pressure coefficient must be taken; but the \
corrections disagree not only in size but even in sign' (p. 383). Hence state 1 atm, \
0 C with an ideal-gas (Gladstone-Dale) reduction: density 'ideal'.

Accuracy (p. 384, translated): 'With 1/10 fringe-width accuracy the error in n was \
below 0.1 % in each single measurement, in Delta p below 0.05 %, in the factor (1 + alpha \
t) likewise below 0.05 %. Since errors that could affect the results only in one \
direction, such as errors in L, in lambda, in reducing Delta p to 45 deg latitude, were \
pressed below 0.01 %, the error limit of the means must be taken as 0.02 %.' Argon \
(p. 387): 'the refractive indices averaged from 15 single measurements each (the \
probable errors are 0.3 to 0.4)' in units of 10^-7.

Why the argon values 'cannot be properly corrected to STP' (Leonard 1974, p. 4): the \
paper reports only the reduced nu_0, obtained with the ideal-gas law and Gladstone-Dale \
and with the pressure coefficient alpha in place of the disputed alpha*, and gives \
neither the gas temperature t nor the absolute pressures at which the pressure changes \
were made (only L, the precision of Delta p and the error budget). A real-gas (second \
virial) reduction, which needs the actual pressures and temperature, therefore cannot \
be redone; argon's non-ideality at 1 atm (about 0.1 %) is five times Rusch's stated \
0.02 % limit. The same applies to his visible values. In addition, the infrared \
wavelength is uncertain (below).

Infrared wavelength (pp. 377-381): the centroid of the calcite reststrahlen band, \
lambda_K = Sum(m lambda_m)/Sum(m) = 6763.2 mu mu +- 0.4 (mean error), from three \
series at room-temperature plates (Tabelle 1; the band has 7-8 partial maxima). The \
vacuum correction is included in the mirror-displacement calibration: 'A correction to \
vacuum need no longer be applied here, since it was already made in the calibration \
curve of the mirror displacement, and the dispersion of air between 546 and 6763 mu mu \
need not be considered, as the error it causes is below 0.01 %' (footnote, p. 377): a \
VACUUM wavelength. But the centroid grows when the plates are heated by continuous \
irradiation (Tabelle 2: five series 6.779-6.822 um, qualitative only, p. 381), and the \
refraction measurement irradiates the plates continuously; the infrared result was \
obtained from the measured 2s, independent of lambda, and is assigned to 6763.2 nm. \
The effective wavelength may lie up to about 0.06 um higher; argon's dispersion there \
is negligible (the formula changes n - 1 by < 0.01 x 10^-7). Leonard's Table II lists \
this point at 67628.5 A in standard air, which is not Rusch's 6763.2 nm (vacuum) \
converted; unexplained.

Visible wavelengths: the lines are printed as 546.10, 576.95, 579.05, 656.30 nm (text: \
'Hg grün 5461,0 A, Hg gelb1 5769,5, Hg gelb2 5790,5, H2 rot 6563,0', p. 383), the \
customary air wavelengths rounded (Hg 546.07, 576.96, 579.07, H-alpha 656.28 nm in air); \
recorded as standard air. Eq. (2) is said to use the vacuum wavelength; which values \
were actually inserted is not stated.

Tabelle 5 repeats the observed and 'ber. II' argon columns and prints the Hg yellow line \
as '567,95' for 576,95 (image checked; not extracted, see the extraction script). The \
dispersion constants (Tabelle 6, formula (3)) are recorded as formulas; Tabelle 6 \
prints n_0^2 = 18 348 for 'diese Arb. I', a misprint for 16 348 (below).

Comparison (computed 2026-09-24): with the ideal-gas density at 1 atm, 0 C the \
infrared value corresponds to alpha = 11.104 a.u., 0.24 % above 11.078 (Gaiser and \
Fellmuth's static value with Lesiuk and Jeziorski's dispersion and chi_0, lesiuk_2023 \
formula 'recommended'), and the 546.1 nm value (546.25 nm vacuum) to 11.327 a.u., 0.45 % \
above 11.276. Both are high, as Leonard found for the Breslau absolute values; Rusch's \
ratio (n - 1)(546 nm)/(n - 1)(6.76 um) = 1.0201 exceeds the modern 1.0179 by 0.2 %: \
his visible values are further from the modern scale than his infrared one, which \
Leonard calls "in excellent agreement with other work".

Not in the library: Rusch's erratum, Ann. Physik (4) 85, 581 (1928), cited by Leonard; \
it may correct these values."""

[[datasets]]
id = "experiment_Ar"
material = "Ar"
file = "Ar/rusch_1923__experiment_Ar.csv"
table = "tbl_1f78cf25d43e"
quantity = "refractivity"
scale = 1e-7
abscissa_unit = "nm"
wavelength_medium = "standard_air"
state = "1atm_0C"
density = "ideal"
use = "primary"
notes = "Tabelle 7 (argon, 'beob.'), also Tabelle 5 column 2: (nu_0 - 1) x 10^7 at the H-alpha and Hg lines, means of 15 measurements. Probable errors 0.3-0.4 (x 1e-7, p. 387), error limit of the means 0.02 % (p. 384). Leonard (1974) finds the Breslau absolute values hard to reconcile with others (Rusch at 5462 A about 0.3 % above his recommended value) and uses only their dispersion (leonard_1974/rusch_1923_Ar, rescaled): the scale of this dataset is doubtful."
[datasets.uncertainty]
absolute = 0.4
level = "probable error"
systematic_relative = 0.0002

