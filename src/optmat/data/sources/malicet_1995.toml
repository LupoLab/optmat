material = "O3"
file = "O3/malicet_1995__t228.csv"
table = "tbl_418f10b3b9e9"
quantity = "absorption_cross_section"
unit = "cm2"
scale = 1e-19
abscissa_unit = "nm"
wavelength_medium = "standard_air"
use = "check"
notes = "Table IV 'Present work': 13 wavelengths 238.20-344.25 nm at 228 K (points of the 228 K spectrum). Total systematic error 1.5 % in the Hartley band (to 310 nm) and up to 3.5 % in the Huggins band (315-344 nm; Table II, level not stated). Table IV's 253.65 nm row (113.5) is Table III's 228 K value."
[datasets.uncertainty]
relative = 0.015
level = "not stated"
relative_rows = { "315.13" = 0.035, "322.07" = 0.035, "334.15" = 0.035, "344.25" = 0.035 }
[datasets.parameters]
temperature_k = 228.0

