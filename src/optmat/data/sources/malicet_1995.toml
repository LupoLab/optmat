citation = "J. Malicet, D. Daumont, J. Charbonnier, C. Parisse, A. Chakir and J. Brion, \"Ozone UV spectroscopy. II. Absorption cross-sections and temperature dependence\", J. Atmos. Chem. 21, 263 (1995)"
doi = "10.1007/bf00696758"
library = "Malicet_1995_OzoneUVSpectroscopy"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """As daumont_1992 (method 1: the ozone partial pressure P_O3 = 2[(P_O2)_i - P_T] \
from the total pressure during decomposition, Eq. 1, at constant temperature and \
volume): monochromatic light from a Jobin-Yvon THR 1500 or HR 640 spectrometer through \
the cell onto a Hamamatsu R 925 photomultiplier, a second photomultiplier monitoring the \
source; MKS Baratron; a two-stage cryostat and a double-walled cell with methanol \
circulation, platinum sensors (accuracy 0.1 K; gradient along the cell at most 0.3 K, \
stability 0.05 K over 3 h); O3 (about 92 %) prepared as Griggs (1968); impurities \
(H2O, CO, CO2, N2O) below 0.1 % by FTIR; cells of 3.285 +- 0.001 cm (195-320 nm at \
213-273 K, 195-335 nm at 295 K) and 99.90 +- 0.05 cm (310-350 nm, 213-273 K) or 81.50 \
+- 0.05 cm (320-350 nm, 295 K); spectral bandwidth 0.01-0.02 nm; optical density 0.5-2.0; \
each spectrum the average of 10 recordings (Table I, pp. 264-265)."""
notes = """Identity checked against the first page (PDF page 1, journal p. 263): Malicet, \
Daumont, Charbonnier, Parisse, Chakir and Brion, J. Atmos. Chem. 21, 263-273 (1995), \
'Ozone UV Spectroscopy. II'. Journal pages 263-273 = PDF pages 1-11. O3 only.

Facts for the data files (the Brion/Daumont/Malicet 'BDM' temperature set):
- Temperatures: 295, 273, 243, 228 and 218 K; 195-345 nm, except 273 K, 300-345 nm \
only (p. 272). The 295 K spectrum is daumont_1992's; the low-temperature ones were \
first reported by Brion et al. (1992, 1993: brion_1993) (p. 266).
- Resolution: 'Spectral bandwidth Delta lambda = 0.01-0.02 nm' (Table I); 'determined \
under high resolution' (abstract). Sampling not restated here (daumont_1992: 0.01 nm \
steps).
- Wavelengths: the medium is not stated in this paper; the method and calibration are \
daumont_1992's, 'in air' (recorded as standard air). Wavelength uncertainty \
0.005-0.015 nm (Table II; the HR 640 is 'slightly less precise in wavelength than the \
THR 1500', p. 265).
- Absolute scale: the pressure method (Eq. 1), not normalised; at 253.65 nm compared \
with Barnes and Mauersberger (Table III: -0.26 to -0.48 %).
- Uncertainty (Table II, image checked, p. 266): absorbance 1 %, optical path 0.05 %, \
ozone pressure 0.1 %, temperature 0.02-0.15 %, impurities < 0.1 %, wavelength \
0.005-0.015 nm; total systematic error 1.3-1.5 % (Hartley band) and 1.3-3.5 % (Huggins \
band); random errors (RMS) 0.3-2.0 % (lambda < 340 nm). Level not stated. 'the \
standard deviation calculated with 10 scans stays underneath total error estimations' \
(p. 265).
- The published file: 'All these data have been gathered together on a floppy disk, \
available on request' (p. 267); the paper prints no spectrum (Figs. 2-4 only).

Temperature dependence (pp. 267-270): weak in the Hartley band (at 253.6 nm the cross \
section decreases by 1.0 % from 218 to 295 K; 1.15 % by the dew-point method of \
Malicet et al. 1989; 0.8 % Molina and Molina); none in the 210 nm window; strong in the \
Huggins bands (more than 50 % towards long wavelengths; sigma_218/sigma_295 about 0.4 \
in the minima and 0.9 at the band tops), with a red shift of the structure below 0.06 \
nm from 218 to 295 K. Parametrisation (p. 269): sigma = C0 + C1 theta + C2 theta^2, \
theta the temperature in C, fitted per wavelength ('a 4-coefficient polynomial making \
no significant improvement'); the coefficients are not printed (not a formula entry).

Comparisons (p. 271): Molina and Molina (226 K) within 1 % below 240 nm, 1.5-3 % higher \
above; Yoshino et al. (1993) 0-5 % too low below 254 nm; Bass and Paur within 1.5 % in \
the Hartley band at 298, 243, 228 and 218 K, but their Huggins structure shifted by \
+0.05 nm (and -0.1 nm more at 218 K in 313-318 nm); Cacciani et al. (339-345 nm) agree \
in the mean, with shallower band contrast.

Datasets: Tables III and IV (images checked), in 10^-19 cm^2 (headers 'sigma x 10^19 \
cm^2'); scale 1e-19 to cm^2. This work's values are points of the BDM spectra: 'check' \
(the checks on the data files). Each temperature is its own dataset (a dataset has one \
temperature). The relative-difference columns are derived and not extracted."""

