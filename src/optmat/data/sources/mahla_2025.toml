notes = "Table I (p. 5), column Experimental, footnote b, 'Pulsed-field-ionization (PFI). Reference 75'; rows labelled by the final ionic state as the table assigns them. The caption calls every value vertical; a pulsed-field-ionization measurement locates the threshold of the state's lowest level, so this value is likely an adiabatic threshold rather than a band maximum (an inference: the paper does not say). The original (tonkyn_1989/ie_O2, curated separately) confirms it: 97348 +- 2 cm^-1 = 12.0696 eV, defined as the transition O2+ X 2Pi_g F1 (v = 0, J = 1/2) <- O2 X 3Sigma_g- F2 (v = 0, J = 1), an adiabatic, rotationally resolved threshold; 12.070 is its rounding."
[datasets.parameters]
kind = "vertical"
final_state = "the row label (the ionic state)"

