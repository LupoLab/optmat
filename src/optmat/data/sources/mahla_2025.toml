citation = "S. Mahla and B. Mehnen, \"Photoionization dynamics of O2 and O3 for atmospheric and astrophysical applications\", J. Chem. Phys. 163, 234312 (2025)"
doi = "10.1063/5.0307721"
library = "Mahla_2025_PhotoionizationDynamicsO2"
identity = "VALIDATED"
kind = "theory"
technique = """Molecular R-matrix photoionisation (close coupling) of O2 and O3 \
at the fixed equilibrium geometries of the neutrals (R(OO) = 2.282 a0 for O2, 2.415 a0 \
for O3, from NIST's CCCBDB), target ions from full-valence CAS-CI (O2: CAS of five, \
1844 neutral and 3692 ion configuration state functions), R-matrix radius 10 a0: \
total and partial-channel photoionisation cross sections, asymmetry parameters and the \
vertical ionisation potentials of the ionic states."""
notes = """PDF pages 1-11 (pages cited are PDF pages). Authors checked on the first page.

EXTRACTED. Table I (p. 5), 'Vertical ionization potentials of O2 and O3 (in eV)': the \
R-matrix values (this work) for six states of O2+ (X 2Pi_g, a 4Pi_u, A 2Pi_u, b \
4Sigma_g-, B 2Sigma_g-, 3 2Pi_u) and three of O3+ (2A1, 2B2, 2A2, the 6a1, 4b2 and \
1a2 holes), and the experimental values the table quotes, one dataset per footnote \
(reproduced: a Baltzer et al. PES; b Tonkyn et al. PFI; c Edqvist et al. PES; d \
Katsumata et al., Wiesner et al., Couto et al. PES; e Brundle, Frost et al., Dyke et \
al. PES; f Willitsch et al. PFI-ZEKE; '12.75^{e,f}' belongs to both). Kind: vertical, as \
the caption says for the whole table (the PFI values are flagged in their notes). The \
final state is each row's label.

ACCURACY. No uncertainty is stated. The R-matrix energies differ from experiment by \
up to 1.3 eV (O2's X state 10.993 against 12.307 and 12.070; O2's b state 20.133 \
against 18.171) because 'unshifted, or raw, theoretical term energies' are used and \
'the calculated IP values reflect the small, state-dependent errors in the target \
description', with the fixed-nuclei approximation neglecting relaxation (p. 5): check \
values only.

NOT EXTRACTED. The total and partial photoionisation cross sections of O2 (seven \
ionic states, Figs. 1-2, against Brion et al., Samson et al., Zammit et al., the Leiden \
database and PHIDRATES) and O3 (Figs. 3-4, CAS-4 and CAS-5 convergence) and the \
asymmetry parameters are figures only; no table prints them. The ordering of O3+'s \
first three states, 2A1 < 2B2 < 2A2 (11.846, 12.086, 14.066 eV), is discussed on p. 6."""

[[datasets]]
id = "rmatrix_O2"
material = "O2"
file = "O2/mahla_2025__rmatrix_O2.csv"
table = "tbl_0127e8228e7c"
quantity = "ionization_energy"
unit = "eV"
abscissa = "label"
use = "check"
notes = "Table I (p. 5), column R-matrix: 'The present IP values correspond to the cross-section thresholds obtained for each final ionic state', the 'unshifted, or raw, theoretical term energies' of the full-valence CAS-CI ion at the neutral's fixed equilibrium geometry (p. 5); the state assignments are taken from experiment, 'as the R-matrix method does not inherently assign them'. Rows labelled by the final ionic state. The method 'is specialized to provide accurate cross-sections', not energies (p. 5)."
[datasets.parameters]
kind = "vertical"
final_state = "the row label (the ionic state)"

