technique = """The authors' correction to egan_2023 (Fabry-Perot cavity refractometry of Ar \
and N2 at 632.9908 nm): the treatment of the Gouy phase shift, and so the refractometer \
working equation, Eq. (1) of the original; no new measurement is described."""
notes = """Two pages (published online 28 November 2024); identity VALIDATED_WITH_WARNINGS \
in the library (the title's math is garbled in the metadata; DOI, journal, authors and \
the DOI of the corrected article printed on p. 1 agree). Read in full (2026-09-29).

WHAT IT CORRECTS (pp. 1-2): the original stated that the cavity beam waist stays \
constant when the refractive index rises; by Kogelnik and Li's Eqs. (1)-(2) the waist \
depends on the wavelength in the medium, so the Gouy phase shift does not depend on \
the index. The corrected working equation, Eq. (3): n - 1 = (Delta f + kappa Delta p \
nu_gas) / [nu_gas (1 - kappa Delta p) + eps_tau (nu_gas - nu_c)], without the factor \
(1 + eps_d) in the denominator, valid for constant L/r under uniform pressure.

THE EFFECT (p. 2): 'The reported molar refractivities for argon and nitrogen were \
fractionally small by 0.3 x 10^-6 A_R', an order of magnitude below their combined \
standard uncertainty (3.1e-6). Applied as [[errata]] of egan_2023's A_R_Ar and A_R_N2 \
(4.195735 -> 4.1957363, 4.446175 -> 4.4461763 cm^3/mol; the correction's factor \
applied, not printed values). A_theta (N2's temperature coefficient) and the helium \
compressibility calibration are not addressed: a relative scale factor common to all \
isotherms leaves A_theta unchanged to first order, but the correction does not say so.

NOT CHECKED: whether yang_2025 (same laboratory and cavity, published June 2025) used \
the corrected working equation, and whether lang_2026's reproduced Egan-Yang value \
(egan_yang_303K) is the corrected one (TC-724)."""
