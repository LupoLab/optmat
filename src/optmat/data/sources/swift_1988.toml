citation = "K. M. Swift, L. A. Schlie and R. D. Rathge, Appl. Opt. 27, 4377 (1988)"
doi = "10.1364/ao.27.004377"
library = "Swift_1988_DispersionGasesAtomic"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Mach-Zehnder interferometer with a 51.5 cm stainless-steel test cell (49 cm \
quartz for I2, ICl), fringes counted (to 1/8 fringe) while gas flowed slowly into the \
evacuated cell; Ar+ laser lines, He-Ne 6328 A and a cw photolytic atomic iodine laser \
at 1.315 um. Pressure by Wallace & Tiernan gauges (2 %), temperature by thermocouple \
(1 K); alpha from the slope of fringe count against pressure. Ozone density from its \
absorption at 3021.5 A (cross section 1.24e-19 cm^2), the O2 contribution subtracted \
(pp. 4377-4380)."""
notes = """Values are the polarizability volume alpha in 1e-24 cm^3 per molecule, from \
Delta n = 2 pi alpha N (Eq. 2) with the number density from the measured pressure and \
temperature (ideal gas, no Lorentz-Lorenz; the gases near room temperature; 'all the \
interferometric data had the proper temperature compensation'). The Gladstone-Dale \
constants in parentheses, beta = 2 pi alpha N_s with N_s = 2.68e19 cm^-3 (Eq. 5), are \
alpha times a constant for every curated gas (checked 2026-09-24) and are not \
extracted. Uncertainty: the last column, 'the maximum uncertainty in the \
polarizability data' (2 %, O3 10 %), read as a bound; the number density was 'accurate \
to ~2%' (p. 4380). The values are 'averages of several interferometric measurements'.

Wavelengths are the nominal laser lines as printed in A (4579, 4880, 5145 Ar+, 6328 \
He-Ne, 13150 iodine), conventionally air values for the visible lines; the medium is \
taken as standard air (the difference, 3e-4 in wavelength, is immaterial at 2 %). \
H2O, Cl2, ICl, CF3I, I2 and n-C3F7I are not curated species and are skipped; Table II \
(laser-device mixtures) holds no new data."""

[[datasets]]
id = "experiment_He"
material = "He"
file = "He/swift_1988__experiment_He.csv"
table = "tbl_98326ad22a2d"
quantity = "polarizability"
unit = "cm3"
scale = 1e-24
abscissa_unit = "angstrom"
wavelength_medium = "standard_air"
use = "primary"
notes = "Table I."
[datasets.uncertainty]
relative = 0.02
level = "bound"

