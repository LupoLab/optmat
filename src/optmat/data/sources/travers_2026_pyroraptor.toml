citation = "J. C. Travers, TDSE calculations of helium's strong-field ionisation with pyroraptor: both electrons active, haCC and one active electron, unpublished (2026)"
kind = "theory"
technique = """Numerical solution of the time-dependent Schrodinger equation of helium with \
J. C. Travers's code pyroraptor, three ways. (1) Both electrons active: coupled \
angular channels (l1, l2, L) with total M = 0 and L <= 17, admitted when one electron \
has l <= 2 ('inner = 2', 'square = 2'), the other capped at l <= 15; multipole order 4 \
(the space of travers_2026_trecx's |m| <= 1, Lshape[3;5] basis lies between inner = 1 \
and inner = 2); finite elements of 4.75 bohr beyond 2 bohr (order 12) to R0 = 40, 59, \
78 or 97 bohr, an exterior element of order 20, exterior complex scaling (angle 0.15) \
from R0, the one-electron spectrum cut at 100 au, RK4 with the step 0.0088 au; the \
initial state's energy -2.902737 au. (2) haCC, the hybrid \
anti-symmetrised coupled channels method (Majety, Zielinski and Scrinzi, New J. Phys. \
17, 063002 (2015)): the neutral's closed-box configuration-interaction states \
('neutral squares', up to 6) and frozen He+ ion states (1s, 'haCC(1)', or the five \
n <= 2 states, 'haCC(5)') times one free electron in finite elements to R0 = 40 bohr \
(390 nm) or 80 to 140 bohr (800 nm), lMax 40 to 70, mixed gauge (length gauge inside \
the gauge radius 20 bohr, velocity gauge outside), exterior complex scaling; ground energy -2.9036457 au. (3) One \
active electron in Tong and Lin's helium potential (tong_2005 Table 1), m = 0, \
ionisation energy 0.9038011 au. Populations are read by projecting on the field-free \
bound states with the ECS transpose (dual) pairing, the principal quantum number of a \
state n = round(1/sqrt(-2E)) with E its energy above the He+(1s) threshold."""
notes = """UNPUBLISHED CALCULATIONS OF J. C. TRAVERS, TIER 3: validators only (use = \
'check'), below published calculations and measurements. Curated 2026-10-16 (TC-1092). \
The run records and the tables made from them are archived in \
data/external/pyroraptor (PROVENANCE.md there: pyroraptor's repository at \
f9b35142, the records' sha256, the converter); the data files are written from the \
tables by tools/extract/travers_2026_pyroraptor.py.

AT 390 NM, in the pulse of travers_2026_trecx's two-electron helium (A2's 6 fs \
Gaussian on the vector potential at 390 nm, 3.684031e14 and 5.68981e14 W/cm2, then 1000 \
au without field): the population above the bound shells n <= 4 (above4: ionisation plus \
excitation to n >= 5) and n <= 5 (above5) of each calculation, 1000 au after the pulse. \
Unlike the norm-loss (travers_2026_trecx's twoelectron_normloss_*), these are converged \
in the box: the two-electron above4 changes by 0.03 % (3.684e14) and 0.01 % from R0 = 78 \
to 97 bohr, while its plain 1 - P(bound) falls by 3.6 % as each larger box binds another \
Rydberg shell; haCC's above4 and above5 agree to 0.01 % at R0 = 40, 60 and 80 bohr. At \
3.684e14 W/cm2 a resonance fills 1s4f (2.9e-4 at R0 = 78 bohr, about a third of \
above4), which above4 does not count. The two-electron values are at inner = 2: an \
inner-arm ladder of the absorbed norm-loss at 3.684e14 W/cm2 (inner 2 -> 3 -> 4: -0.97 \
% and -0.67 %, extrapolated geometrically) puts the angular limit 3.1 % below them, \
which is their uncertainty (an excess, not a spread); the ladder was not run at \
5.69e14, nor on above4. above5 of the two electrons at R0 = 97 still moves by 0.3 % \
(3.684e14) from R0 = 78.

AT 800 NM, in Sato et al.'s six-cycle sin^2 pulse (sato_2016, Eq. 27; 4, 8 and 14e14 \
W/cm2): haCC's 1 - P(both electrons inside 20 bohr) at the end of the pulse, Sato et \
al.'s measure, against which sato_2016's fig6_casscf_He_800nm (MCTDHF) is compared.

The runs' reports of 10 and 14 October called haCC's above5 'ionisation plus n >= 5' \
and compared it with the two-electron and one-electron above4; pyroraptor corrected \
this on 17 October 2026 (merged at 295a255b), withdrawing the haCC deficit at 390 nm \
it had reported. Here each measure is compared with its own (TC-1092)."""

