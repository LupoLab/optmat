[[datasets]]
id = "supplement_tableI_yield_Kr"
material = "Kr"
file = "Kr/wallace_2016__supplement_tableI_yield_Kr.csv"
table = "tbl_2cab2b41f725"
quantity = "ionization_yield"
unit = "arb. units"
abscissa = "intensity"
abscissa_unit = "W/cm2"
columns = { intensity_estimated = "W/cm2" }
use = "check"
notes = "Supplemental Material, Table I (SM p. 7; library supplement_01): 'Actual experimental Y_Kr+ data as a function of I_est taken with our apparatus. This data can be used to check the implementation of our intensity calibration procedure.' 37 points, the rows numbered in the order printed (rising intensity). The abscissa is the column I_0, the peak intensity calibrated on the yield of atomic hydrogen, printed in 10^14 W/cm^2 with two decimals (1.31 to 4.72; trailing zeros are not printed: '2.8', '3.3', '3.9'); the column intensity_estimated is I_est, the intensity estimated from the laser's parameters (Eq. (2)), 2.04 to 7.36. I_0/I_est is 0.639 to 0.643: I_0 = eta I_est with eta = 0.641 to the decimals printed; the supplement's own fit of this table gives eta_2 = 0.638 +- 0.008 (SM p. 6). The yield Y is in arbitrary units (the scale is free) and sigma is its absolute error as printed, 'abs. error', 2.7 % of Y at the lowest intensity and 0.9 % at the highest; its level of confidence is not stated in the table (the Letter's ref. 27 states 1 sigma for I_c). The error budget (SM pp. 2-4): baseline subtraction, short-term drift (Allan deviation), long-term drift, 'the dominant error source'. The yield is that of Kr+ for a 5.5 fs pulse (FWHM of intensity) at 800 nm, carrier-envelope phase not stabilised, averaged over the two transverse dimensions of the focus ('the cylindrically symmetric geometry of the interaction region negates the need for focal-volume averaging (FVA) along the propagation direction of the laser', SM p. 6): not a single-atom probability. The point at I_0 = 3.49e14 W/cm^2 (row 27, Y = 6.9126) is 17 % above the smooth trend of its neighbours (5.3139 at 3.41e14, 6.0803 at 3.56e14): kept as printed, and not excluded. The intensity's uncertainty is that of the hydrogen calibration, 1.5 % for krypton through I_c (tableI_Ic_Kr); it is common to all points and is not in sigma."
