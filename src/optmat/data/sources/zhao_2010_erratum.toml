notes = """One page (journal p. 049903-1). Identity and authors checked against the page \
image (2026-09-27).

WHAT IT CORRECTS (the whole text): 'There are several errors in Tables V and VI of our \
article. In Table V, the C_2m of the HOMO-1 (1 pi) of CO molecule should be 0.014. In \
Table VI, the binding energies of 2p pi_g and 2p pi_u of H2+ should be 0.2267 and \
0.4288, respectively.'

- Table V, CO 1 pi (HOMO-1), C_2m: printed 0.14 (zhao_2010 Table V image, p. 6), \
corrected to 0.014. Applied as an [[errata]] entry of zhao_2010's dataset \
table5_homo1_CO (row l = 2).
- Table VI, H2+ at R = 2.0 au: printed 2p pi_g 0.4288 and 2p pi_u 0.2267 (both the \
'Present' and the 'Exact' columns), corrected to 2p pi_g 0.2267 and 2p pi_u 0.4288: \
the two rows' binding energies were swapped. Table VI is in zhao_2010's notes only \
(no dataset), and the notes there now say so. The coefficients of those rows are not \
corrected.

WHAT IT LEAVES UNCHANGED. Tables I-IV, all of Table III (the HOMO C_lm of H2+, H2, N2, \
O2, CO, CO2 and the reprinted rows) and the other rows of Tables V and VI. So the \
MO-ADK coefficients solprop uses (Table III's 'D2/H2', N2 and O2 rows; \
tests/data/solprop_ionisation.json, 'erratum doi:10.1103/PhysRevA.82.049903 leaves \
these neutral rows unchanged') are unaffected: solprop's statement is confirmed. Nothing \
is taken here as a dataset; the correction lives in zhao_2010."""
