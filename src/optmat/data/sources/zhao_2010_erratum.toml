citation = "S.-F. Zhao, C. Jin, A.-T. Le, T. F. Jiang and C. D. Lin, \"Erratum: Determination of structure parameters in strong-field tunneling ionization theory of molecules [Phys. Rev. A 81, 033423 (2010)]\", Phys. Rev. A 82, 049903(E) (2010)"
