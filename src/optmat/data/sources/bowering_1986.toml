dataset = "k_2p6_Xe"
row = ""
column = "scale"
printed = "0.01"
corrected = "1e-12"
reason = "Table II's caption prints 'State-to-state reaction rate constants (10^-2 cm3 s-1)' (checked on the rendered page, PDF p. 4); the rates are in 10^-12 cm3 s-1."
evidence = "The text compares their sums with 'the total rates of Table II, paper II' (p. 712), printed there in 10^-12 cm3 s-1 (bowering_1986b: 5.9, 92.2, 86.8 against the sums 6.6, 87, 77); 10^-2 cm3 s-1 would make them 10^7 to 10^9 times a gas-kinetic rate (about 3e-10 cm3 s-1); ku_1986's state-to-state rates for the same transfers are 10^-12 to 10^-11 cm3 s-1 (2p6 -> 2p8 2.1e-11 against 22.4e-12)."

