citation = "N. Böwering, M. R. Bruce and J. W. Keto, \"Collisional deactivation of two-photon laser excited xenon 5p5 6p. I. State-to-state reaction rates\", J. Chem. Phys. 84, 709-714 (1986)"
doi = "10.1063/1.450567"
library = "Bowering_1986_CollisionalDeactivationTwo"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Two-photon excitation of Xe 6p[1/2]0, 6p[3/2]2 and 6p[5/2]2 (Paschen 2p5, \
2p6, 2p9) from the ground state by a frequency-doubled dye laser near 250 nm (4 ns, 20 \
GHz) in purified xenon at 5-100 Torr; time-integrated laser-induced infrared \
fluorescence of the 6p -> 6s lines (Table I) of the excited and of the collisionally \
populated levels, through a 1 m Jobin-Yvon monochromator in second order onto cooled RCA \
8852 and Hamamatsu R632 photomultipliers, the relative efficiencies calibrated with an \
NBS-traceable tungsten lamp; the VUV excimer fluorescence monitored to hold the laser \
on resonance. The state-to-state rate constants follow from the intensity ratios by \
Eq. (4), with Horiguchi et al.'s branching fractions (Ref. 10) and paper II's \
(bowering_1986b) lifetimes and total rates (for 2p7, 2p8 and 2p10 the weighted mean \
lifetimes of Refs. 10 and 11). Temperature not stated (paper II: 296 K)."""
notes = """J. Chem. Phys. 84(2), 709-714 (15 January 1986) = PDF pages 2-7 (PDF page 1 is \
the AIP download cover; journal page = PDF page + 707); a scanned (raster) PDF with an \
OCR text layer. Identity checked on the first page of the article (PDF p. 2: title \
'Collisional deactivation of two-photon laser excited xenon 5p5 6p. I. State-to-state \
reaction rates', N. Böwering, M. R. Bruce and J. W. Keto, University of Texas at \
Austin, received 24 May 1985, accepted 17 September 1985, footer J. Chem. Phys. 84 (2), \
15 January 1986, 709) on 2026-10-09. Tables I-III checked cell by cell against the \
table images and Table II's caption on the rendered page.

LEVELS. Table I gives Paschen and Racah names ('used here interchangeably'); NIST \
(src/optmat/data/external/nist_asd/Xe_I_levels.tsv): 2p5 = 6p[1/2]0 = \
5p5(2P*3/2)6p 2[1/2], J = 0 (80118.962 cm-1); 2p6 = 6p[3/2]2 = (2P*3/2)6p 2[3/2], J = \
2 (79212.465); 2p7 = 6p[3/2]1 = 2[3/2], J = 1 (78956.031); 2p8 = 6p[5/2]3 = 2[5/2], J = \
3 (78403.061); 2p9 = 6p[5/2]2 = 2[5/2], J = 2 (78119.798); 2p10 = 6p[1/2]1 = 2[1/2], J \
= 1 (77269.145); 1s2 = 6s'[1/2]1 = 5p5(2P*1/2)6s 2[1/2]*, J = 1 (77185.041); 6s[3/2]2 \
and 6s[3/2]1 = (2P*3/2)6s 2[3/2]*, J = 2 and 1 (67067.547, 68045.156). Evidence: Table \
I's ten wavelengths (828.0 to 1083.8 nm) are air wavelengths and equal NIST's vacuum \
wavelengths of those transitions (Xe_I_lines_nir.tsv, TC-985) converted to air within \
0.05 nm (script check); and the 2p10 - 1s2 gap, 'only 84 cm-1' (p. 713), is NIST's \
84.104 cm-1.

TAKEN (collisional_quenching_rate_coefficient, TC-1011; extraction script \
tools/extract/bowering_1986.py): Table II (p. 711), the state-to-state rate constants by \
xenon (perturber self, order 2) from the three two-photon excited levels, one dataset \
per product level (the channel), the rows the reactants: into 6p[3/2]2 (k_2p6_Xe), \
6p[3/2]1 (k_2p7_Xe), 6p[5/2]3 (k_2p8_Xe), 6p[5/2]2 (k_2p9_Xe), 6p[1/2]1 (k_2p10_Xe) and \
6s'[1/2]1 (k_1s2_Xe), 0.069 to 46 x 10^-12 cm3/s, primary; and the row Sigma_j nu_ij, \
the sum of the observed channels (k_sum_Xe, check). Uncertainty level not stated (no \
'standard deviation' in the paper; paper II's figure errors are 2 sigma). 'b' (no \
fluorescence detected: 6p[3/2]2 and 6p[5/2]2 into 6p[1/2]0, 6p[1/2]0 and 6p[3/2]2 into \
6p[1/2]1) are not values; 'formation rates for the Xe 6p[1/2]0 state were too weak to \
be observed' (p. 711). The rates were 'independent of, or only weakly dependent upon \
pressure. In the latter case, the low pressure limit was taken' (p. 711). The \
6s'[1/2]1 channel is seen through its coupling to 6p[1/2]1 (980 nm), with 1/A_j = \
tau_2 = 110 ns (p. 712); for 6p[5/2]2 the 980 nm signal was split into components I \
(-> 2p10) and II (-> 1s2) by paper II's appendix, component III (-> 1s3) too small to \
evaluate.

ERRATUM: Table II's caption prints the unit as '(10^-2 cm3 s-1)'; it is 10^-12 cm3 \
s-1 (scale errata on all seven datasets).

NOT TAKEN: Table I's branching ratios ('From Ref. 10', Horiguchi, Chang and Setser \
1981; reproduced, and no quantity holds a branching fraction); Table III's measured \
fractions (ratios of Table II's rates, script check) and the statistical model's \
predictions (Eq. 7, a model); Figs. 1-4 (schematics and potentials).

FINDING (Table I's branching ratios against NIST, TC-985; A over the sum of A from the \
level): 2p6 0.700 / 0.300 (NIST 0.779 / 0.221); 2p7 0.084 / 0.915 (0.113 / 0.887); \
2p9 0.363 / 0.637 (0.488 / 0.512); 2p10 0.917 / 0.093 (0.945 / 0.055); 2p5 0.998 and \
2p8 1.000 (NIST has A only for the one line). The 2p9 split differs most (NIST's two A \
values are both B+).

FINDING (against ku_1986's Table III, the same transfers in xenon, 10^-11 cm3/s; this \
paper's in brackets): 2p6 -> 2p7 1.3 +- 0.2 (0.64 +- 0.15), -> 2p8 2.1 (2.24 +- 0.31), \
-> 2p9 2.8 (2.65 +- 0.69), -> 2p10 < 0.2 ('b'); 2p9 -> 2p8 1.1 +- 0.2 (0.86 +- 0.33), \
-> 2p10 4.5 +- 0.2 (4.6 +- 1.8). They disagree on 6s'[1/2]1: here 2p6 -> 1s2 3.2 +- 1.4 \
and 2p9 -> 1s2 2.2 +- 0.8, where Ku and Setser put 2p9 -> 1s2 < 0.2 and assign 1.9 and \
4.0 to '1s3 or Xe(6s)'; both papers infer this channel from the slow 980 nm components.

DOUBTS (printed inconsistencies; no taken value is corrected): Table III's 6p[5/2]2 \
column (1.4e-3, 7.1e-3, 0.18, 0.84; sum 1.03) does not reproduce from Table II (0.069, \
0.34, 8.6, 46 over their sum 55.0: 1.3e-3, 6.2e-3, 0.16, 0.84), while the other two \
columns do within 0.006 (script check). Table I's 2p10 branching ratios sum to 1.010.

TWO-PHOTON DATA CITED, NOT IN THE LIBRARY: G. Inoue, J. K. Ku and D. W. Setser, J. \
Chem. Phys. 81, 5760 (1984) (lifetimes and Ar/Ne quenching of Xe 6p, 6p', 7p, 6d, \
laser-excited from 6s: the independent 6p' lifetimes that would test bruce_1990 against \
NIST); H. Horiguchi, R. S. F. Chang and D. W. Setser, J. Chem. Phys. 75, 1207 (1981) \
(Xe 6p lifetimes and Ar quenching, branching fractions); L. Allen, D. G. C. Jones and D. \
G. Schofield, J. Opt. Soc. Am. 59, 842 (1969); N. Sadeghi and J. Sabbagh, Phys. Rev. A \
16, 2336 (1977) (6s' -> 2p10 transfer); P. Laporte, J. L. Subtil and M. C. Castex, in \
Spectral Line Shapes, Vol. 2 (de Gruyter, 1983), p. 583 (Xe2 potentials from line \
shapes). Held: raymond_1984 (Ref. 12)."""

