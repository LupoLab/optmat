id = "table1_N2"
material = "N2"
file = "N2/rosasco_1983__table1_N2.csv"
table = "tbl_ee3e296d7c2c"
quantity = "raman_linewidth"
unit = "cm-1/atm"
abscissa = "label"
use = "primary"
notes = "Table 1 (p. 438), N2 column gamma_j: HWHM self-broadening coefficient of the Q(J) lines (v = 0 -> 1), cm-1 per atm, 298 K, J = 0-18 (HWHM from Eq. (6): see the source notes). Fitted with Eq. (6) (line mixing included) to 0.2 and 0.6 atm spectra. Error in the last digits, level not stated. rahn_1986 prints these doubled as its 295 K FWHM column."
[datasets.uncertainty]
