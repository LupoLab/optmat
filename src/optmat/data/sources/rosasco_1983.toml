[[formulas]]
id = "eq6_N2"
material = "N2"
equation = "Eqs. (6)-(7), p. 436; Table 1 (tbl_ee3e296d7c2c), p. 438"
printed = "chi3''(omega) = (n/24 hbar) sum_j alpha_j^2 Delta rho_0j p [gamma_j - (omega - omega_j) Y_j] / [(omega - omega_j)^2 + (p gamma_j)^2]; Y_j = 2 sum_{j' != j} (alpha_j'/alpha_j) W_j'j / (omega_j' - omega_j)"
variable = "omega = omega_a - omega_b the Raman frequency, omega_j the Q(j) line position (in cm-1, as gamma_j); p: pressure in atm; gamma_j = W_jj the HWHM broadening coefficient in cm-1 atm-1 (dataset table1_N2); Y_j the first-order line-mixing coefficient in atm-1; n the number density; alpha_j = <v1|alpha_0|v0> (all equal); Delta rho_0j the thermal population difference of the 0 and 1 levels at J"
state = "pure N2, 298 K"
density = "unknown"
range = "fitted to 0.2 and 0.6 atm; 'good agreement with the data up to 2.0 atm' (p. 437); first order in density"
coefficients = { Y_Q0 = "0.46", Y_Q1 = "0.6", Y_Q2 = "0.21", Y_Q3 = "0.05", Y_Q4 = "0.04", Y_Q5 = "0.04", Y_Q6 = "0.03", Y_Q7 = "0.03", Y_Q8 = "-0.03", Y_Q9 = "0.03", Y_Q10 = "-0.03", Y_Q11 = "0.03", Y_Q12 = "0.03", Y_Q13 = "-0.03", Y_Q14 = "0.03", Y_Q15 = "0.03", Y_Q16 = "0.03", Y_Q17 = "0.03", Y_Q18 = "0.03", Y_error_J0_3 = "20 %", Y_error_J4_18 = "50 %" }
check = "No printed spectrum value to reproduce (Figs. 1-2 are figures). Sum rule (scratch, 2026-09-27): detailed balance, rho_j W_j'j = rho_j' W_jj', makes Eq. (7) satisfy sum_j rho_j Y_j = 0 (all alpha_j equal), separately for even and odd J in N2, whose collisions conserve the nuclear-spin symmetry. With 298 K Boltzmann populations (B = 1.99 cm-1, even:odd weights 2:1) the printed Y_j give sum_j rho_j Y_j = +0.046 atm-1 against sum_j rho_j |Y_j| = 0.060 (even J +0.025, odd J +0.021): the printed N2 values do NOT satisfy the sum rule. The CO values do, nearly: -0.010 against 0.084 (B = 1.92). The N2 column is badly printed (the signs of J = 8, 10, 13 are faint dashes; image checked at 400 dpi); lost minus signs at high J are a possible cause, not established."
notes = "The line-mixing coefficients Y_j of Table 1's N2 column, as printed (the marks a) and b) on J = 0 and J = 4 dropped: they are the error notes, +-20 % for J = 0-3 and +-50 % for J = 4-18). 'No values of Q branch line-mixing coefficients have been reported in the literature' (p. 438). Line mixing is not modelled yet (TC-492)."

