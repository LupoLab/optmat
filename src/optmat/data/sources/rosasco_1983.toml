unit = "cm-1/atm"
abscissa = "label"
use = "primary"
notes = "Table 1 (p. 438), CO column gamma_j: HWHM self-broadening coefficient of the Q(J) lines (v = 0 -> 1), cm-1 per atm, 298 K, J = 0-18 (HWHM from Eq. (6): see the source notes). Fitted with Eq. (6) to 0.2 and 0.5 atm spectra. Error in the last digits, level not stated. 'in excellent agreement with the recently reported [32] widths of P- and R-branch lines in the infrared vibrational overtone spectrum' (p. 438)."
[datasets.uncertainty]
