citation = "G. J. Rosasco, W. Lempert, W. S. Hurst and A. Fein, \"Line interference effects in the vibrational Q-branch spectra of N2 and CO\", Chem. Phys. Lett. 97, 435 (1983)"
doi = "10.1016/0009-2614(83)80524-7"
library = "Rosasco_1983_LineInterferenceEffects"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """High-resolution cw stimulated Raman (Raman loss) spectroscopy (p. 435): a \
single-mode Kr-ion pump (< 20 MHz) and a tunable ring-dye probe (about 1 MHz), \
copropagating, parallel linear polarisations, pump modulated at 5.4 MHz, multipass cell \
(about 50-fold); frequency precision about 30 MHz (0.001 cm-1) over a Q branch. Pure N2 \
and pure CO, v = 0 -> 1 Q branches, self-broadened, about 20-200 kPa (0.2-2.0 atm), 298 \
K. Line overlap described by a relaxation-matrix model; the first-order (in density) \
solution, Eq. (6), fitted to spectra at 0.2 and 0.6 atm (N2) and 0.2 and 0.5 atm (CO) \
gives gamma_j and Y_j (p. 437)."""
notes = """Identity checked against the first page. Page numbers are journal pages \
(pdf pages 1-6 = pp. 435-440). Materials: 14N2 and 12C16O (natural gases); no other \
isotopologue.

WIDTH CONVENTION. HALF widths. The paper never writes 'HWHM' against Table 1; the \
convention follows from Eq. (6) (p. 436): chi3''(omega) = (n/24 hbar) sum_j alpha_j^2 \
Delta rho_0j p [gamma_j - (omega - omega_j) Y_j] / [(omega - omega_j)^2 + (p \
gamma_j)^2], 'with ... p the pressure, gamma_j = W_jj the line-broadening coefficient'. \
A Lorentzian gamma/(x^2 + (p gamma)^2) has its half width at half maximum at x = p \
gamma: p gamma_j is the HWHM, and gamma_j the HWHM per atm. Independent confirmation: \
Rahn and Palmer (rahn_1986, Table 1, 'FWHM', note a 'From Ref. 6' = this paper) print \
exactly twice these values and errors for N2 (all 19 rows), and Farrow and Rahn \
(farrow_1985) label their comparable Ar coefficients 'HWHM'. Per atm of pressure at 298 \
K ('Line-broadening and mixing-coefficients at 298 K', Table 1 caption, p. 438), not per \
amagat. The isolated-line study behind the method (Ref. 6, Spectral Line Shapes Vol. 2, \
not in the library): Voigt at 0.05 atm, Dicke narrowing with rising pressure, Lorentzian \
above 0.2 atm; 'The collision component Gamma(p) is extracted using the known Doppler \
(about 80 MHz) and diffusion (about 6 MHz at 1.0 atm) contributions', and Gamma(p) = p \
gamma holds to 2.0 atm (p. 437).

UNCERTAINTIES. gamma_j: the parenthesised digits (last decimal) are not described (level \
not stated). Y_j: the table's notes, poorly printed, read 'a) +-20 %, J = 0-3' and 'b) \
+-50 %, J = 4-18' (the 'a' note's '+-20 %' is inferred from the partly legible scan, \
'-20 .,', and the legible 'b) +-50 %'), marked on J = 0 and J = 4 of each column.

THE LINE-MIXING COEFFICIENTS Y_j (atm-1) have no quantity in the vocabulary. They are \
recorded as the coefficients of Eq. (6) in the formulas eq6_N2 and eq6_CO. Definition, \
Eq. (7) (p. 436): Y_j = 2 sum_{j' != j} (alpha_j'/alpha_j) W_j'j / (omega_j' - \
omega_j), W the relaxation matrix (Eq. (5)); 'first order in density'; all alpha_j equal \
in the paper's normalisation. Eq. (6) with Table 1 'yields good agreement with the data \
up to 2.0 atm' (p. 437).

TEXT VALUES (notes only). N2 line shifts 'less than 0.001 cm-1 atm-1' (Ref. 6); CO Q(14) \
shift about 0.0045(9) cm-1 atm-1 (sign not printed); CO B1 - B0 from -0.017511(6) cm-1 \
(0.2 atm) to -0.017495(8) cm-1 (1.0 atm) (p. 438). Fitting the pure Lorentzian model \
with free T gives temperatures 'about 40 K too low' at 1 atm (p. 437). Eq. (8) (p. 438), \
the state-to-state rate law used to model gamma_j and Y_j (power law about 0.5 with N_x \
= N_c at low j, exponential gap with N_0 at high j; results in Fig. 3 for CO only): no \
fitted constants are printed.

What this bears on: the N2 Q-branch self-broadening at room temperature (the N2 Q \
widths in use, TC-492) and line mixing, which is not yet modelled (docs/raman.md, \
'Line mixing'). This is the source of Rahn and Palmer's 295 K column and of Farrow and \
Rahn's self-broadening correction (farrow_1985)."""

