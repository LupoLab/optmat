check = "Sum rule as for eq6_N2 (scratch, 2026-09-27; all J mix, one sum): sum_j rho_j Y_j = -0.0097 atm-1 against sum_j rho_j |Y_j| = 0.084 at 298 K with B = 1.92 cm-1: zero to 12 % of the scale, within the stated +-20-50 %. Fig. 3b compares the Y_j with the rate-law predictions (figure only)."
