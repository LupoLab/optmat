[[formulas]]
id = "co2_1920"
material = "CO2"
equation = "formula below Table I, p. 3"
printed = "(mu - 1)_{n.t.p.} = 6.2144 x 10^27 / ((14097) 10^27 - n^2)"
variable = "n = V/lambda, frequency in s^-1, lambda the air wavelength in cm, V = 3e10 cm/s (implied)"
state = "1atm_0C"
density = "real"
range = "480-671 nm"
coefficients = { C = "6.2144e27", n0_squared = "14097e27" }
check = "With V = 3e10 cm/s and the printed wavelengths it gives Table I's calculated column only to within 1.6 printed units (x 10^-8; 5461 A 45047.5 against 45049, 5209 A 45145.4 against 45147, 4800 A 45339.5 against 45341); V = 2.99796e10 or the exact line wavelengths do worse. No single coefficient correction explains it: the best one-pole fit to the calculated column itself leaves +-1.2 units, so the printed column is not an exact evaluation of any such formula. Checked 2026-09-25."
notes = "Labelled (mu - 1)_{n.t.p.} but it gives the observed column 2 (0 degrees C, 76 cm), not the hydrogen-density column 5. lambda_0 = 799 A (p. 3)."

[[formulas]]
