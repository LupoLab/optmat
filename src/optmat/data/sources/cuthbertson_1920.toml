variable = "n = V/lambda, frequency in s^-1, lambda the air wavelength in cm, V = 3e10 cm/s (implied)"
state = "1atm_0C"
density = "unknown"
range = "480-671 nm"
coefficients = { C = "5.02763e27", n0_squared = "11689.3e27" }
check = "With V = 3e10 cm/s and the printed wavelengths it reproduces Table III's calculated column to within 0.7 printed units (x 10^-8). Checked 2026-09-25."
notes = "lambda_0 = 877 A (p. 6)."

