citation = "C. Cuthbertson and M. Cuthbertson, Proc. R. Soc. London A 97, 152 (1920)"
doi = "10.1098/rspa.1920.0020"
library = "Cuthbertson_1920_RefractionDispersionCarbon"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Jamin refractometer, as in the authors' earlier work (measured in 1914). The \
absolute refractivity at the green mercury line (5461 A) from 'double experiments' \
(pressure increasing and diminishing), at room temperature (about 17.5 degrees C for \
CO2) and 30-50 cm Hg; the dispersion relative to it at eight lines (Li 6708, Cd 6438, \
Hg 5790, 5770, 5461, Ag 5209, Cd 5085, 4800 A) by counting 500-800 bands (pp. 1-5)."""
notes = """The refractivities are mu - 1 itself, NOT the doubled 2 (mu - 1) of the \
Cuthbertsons' 1910 noble-gas tables (cuthbertson_1910): Table I's 45,050 x 10^-8 at \
5461 A is the text's mean absolute value (mu - 1) 10^7 = 4505 for CO2 (p. 1), and \
Table III's 44,150 x 10^-8 the methane mean 4415 (p. 5). The formulas are likewise for \
mu - 1.

Carbon dioxide: 'at 0 degrees C. and 76 cm.', eight absolute values 4500-4509 x 10^-7, \
mean 4505; reduced for temperature with Chappuis's coefficient (1 + 0.00371 t) and for \
pressure with Leduc's formula P0 V0 / PV - 1 = 102 x 10^-6 (P - P0) (p. 1): a \
real-gas reduction (state 1 atm, 0 degrees C, density real). About 0.1 % of unabsorbed \
gas (assumed air) was allowed for. 'Had we used Walker's temperature coefficient (1 + \
0.0038 t), our result would have been 4512' (p. 2). Table I's column 5 reduces the \
observed values to the number density of hydrogen at 0 degrees C and 76 cm \
((mu - 1) D / d0 76 = 0.0004471 at 5461 A, p. 2); it is column 2 times a constant \
(0.99246) and is not extracted, nor column 6 (two values of column 3 so reduced).

Methane: five absolute values 4412-4417 x 10^-7, mean 4415 (p. 5). The paper states \
neither the state nor the reduction for methane; 1 atm, 0 degrees C is assumed (the \
CO2 and CO values are at 0 degrees C and 76 cm), density unknown. The gas was purified \
from hydrogen by Campbell and Parker's method.

Wavelengths: the lines rounded to 1 A (6708 for Li 6707.85, 5790 and 5770 for Hg \
5790.7 and 5769.6, 4800 for Cd 4799.9), air wavelengths: standard air. The rounding \
moves no value by more than 0.2 printed units.

Uncertainty: not stated. The per-point uncertainties are the rms of the paper's \
calc - obs differences (CO2 2.2, CH4 0.71, CO 1.2 printed units x 10^-8); the scale \
uncertainty the half-range of the absolute determinations (CO2 0.10 %, CH4 0.057 %, \
CO 0.045 %).

Earlier work: the CO2 values of six observers at 5461 A (p. 2; no references given in \
the paper, except Koch's, cited for methane on p. 5) are extracted as reproduced \
datasets; 'the discrepancies are, no doubt, largely due to the use of different \
coefficients of pressure and temperature in the reduction'. The earlier methane \
values (St. Loria 4468, Kessler 4435, Koch 4407, x 10^-7) state no wavelength and are \
not extracted; 'these values are not concordant, probably owing to the difficulty of \
purifying the gas'. The lambda_0 comparisons (pp. 3, 5, 6) are derived numbers, not \
extracted.

Carbon monoxide (pp. 3-5): made from formic acid and concentrated sulphuric acid, \
dried, condensed in liquid air and fractionated; 'on testing by explosion with oxygen \
no impurities were found'. Four double experiments at 5461 A gave (mu - 1) 10^7 = \
3362, 3365, 3364, 3364, mean 3364, 'reduced by the formula' (mu - 1) 76/P T/273 (p. 4): \
an ideal-gas reduction to 0 degrees C and 76 cm (density ideal), unlike the CO2 \
reduction. Dispersion from ten experiments of nearly 600 bands each (Table II, p. 4). \
The earlier values at 5461 A (Mascart, Perreau, Koch, Grueschke; no references given) \
are extracted as reproduced datasets; 'our value agrees well with that of the last \
three'. Their lambda_0 values (p. 5) are derived and not extracted. The 'carbon atom' \
formula 'from carbon monoxide' (p. 7) is not recorded, as for CO2.

The 'carbon atom' formulas of p. 7 (CO2 minus O2 and so on) are not gas properties \
and are not recorded; the hydrogen, oxygen and nitrogen formulas quoted on p. 7 from \
the authors' 1909 paper (Proc. R. Soc. 83, 151, not in the library) are recorded as \
reproduced formulas."""

[[datasets]]
id = "experiment_CO2"
material = "CO2"
file = "CO2/cuthbertson_1920__experiment_CO2.csv"
table = "tbl_475eaffb74ab"
quantity = "refractivity"
scale = 1e-8
abscissa_unit = "angstrom"
wavelength_medium = "standard_air"
state = "1atm_0C"
density = "real"
use = "primary"
notes = "Table I, observed (seven experiments, nearly all counting 800 bands). The 5461 A value is the absolute one."
[datasets.uncertainty]
absolute = 2.2
level = "rms"
systematic_relative = 0.001

