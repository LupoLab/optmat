citation = "J. Tkaczuk, I. H. Bell, E. W. Lemmon, N. Luchier and F. Millet, \"Equations of State for the Thermodynamic Properties of Binary Mixtures for Helium-4, Neon, and Argon\", J. Phys. Chem. Ref. Data 49, 023101 (2020)"
doi = "10.1063/1.5142275"
library = "Tkaczuk_2020_EquationsStateThermodynamic"
identity = "VALIDATED_WITH_WARNINGS"
kind = "fit"
technique = """Fit: multi-fluid Helmholtz-energy models for the binary mixtures He-Ne, He-Ar and \
Ne-Ar, with the Kunz-Wagner reducing functions (four parameters per pair, F_ij = 1) \
and an eight-term departure function per pair, fitted to vapour-liquid equilibrium \
and density (p-rho-T) data of the mixtures; second virial coefficients collected and \
compared, not fitted. The pure fluids are the reference equations of state."""
notes = """The library copy is the accepted manuscript (12 pages, 'Dated: 12 March 2020'), \
cited as the journal article 023101; page numbers are the manuscript's, which are its \
pdf pages. Identity VALIDATED_WITH_WARNINGS by the library.

THE MODELS (checked by a reader against the rendered pages, 2026-09-30): the reducing \
functions are Kunz and Wagner's (Eqs. 3, 5-7; Table 2, p. 2). Table 6 (p. 6) gives \
beta_T, gamma_T, beta_v, gamma_v: He-Ne 0.793, 0.728, 1.142, 0.750; He-Ar 1.031, 1.113, \
1.048, 0.862; Ne-Ar 1.033, 0.967, 0.919, 1.035. Departure coefficients, Table 7 (p. 8). \
These are the pairs CoolProp names `Tkaczuk-JPCRD-2020`. Not transcribed: they are \
model parameters, used through CoolProp.

DEVIATIONS NEAR AMBIENT (Tables 3-5, pp. 4-5, average absolute deviations of the \
density over each whole data set; the library's text drops Table 4's AAD column on \
p. 4, read from the rendered page): He-Ne: Kestin et al. 1981, 298 K, 0.2-12.2 MPa, \
0.20 %; Kestin and Nagashima, 293-303 K, 0.24 %; Vogl and Hall, 233-313 K, \
0.1-3.6 MPa, 0.081 %; Holborn and Otto, 273-673 K, 0.26 %. He-Ar: Blancett et al., \
223-323 K, 0.3-73 MPa, 0.72 %; Vidal et al. 1986, 298 K, 0.1-800 MPa, 1.5 %; Kosov, \
293-353 K, 29-59 MPa, 2.2 %; Popov, 293-673 K, 1.3 %. Ne-Ar: Kestin et al. 1981, 298 K, \
0.4-13.7 MPa, 0.43 %; Vidal, 298 K, 1.6 %; the only other density set is at \
102-121 K. §3.1 (p. 6): the He-Ar model 'has errors of 0.5% - 2.5% for 95% of data \
points used in the EOS development', and Ne-Ar 'errors of 3% for 90% of density \
data', both for the fitted data below 10 MPa, which mix cryogenic and ambient \
isotherms. Low-pressure deviations are called 'comparable with the measurement \
uncertainties' (p. 6); no model uncertainty is stated. The conclusions say the Ne-Ar \
model's errors 'degenerate in the single phase' (p. 10).

SECOND VIRIAL COEFFICIENTS (p. 5, Tables 3-5): 'collected ... they were not fitted'; \
the text notes that the mixing rule makes the cross coefficient composition dependent. \
Sets (none used; AAD of the mixture's B): He-Ne: Brewer and Vaughn 1969 (148-323 K, \
3.9 %), Vogl and Hall 1972 (233-313 K, 3.6 %), Holborn and Otto 1924 (8.8 %), Knobler \
et al. 1959 (90 K), and two sets at 15-20 K; He-Ar: Blancett 1970 (223-323 K, 21.0 %), \
Brewer and Vaughn (148-323 K, 11.0 %), Kalfoglou and Miller 1967 (303-773 K, 16.9 %), \
Martin et al. 1982 (290-320 K, 5.9 %), Tanner and Masson 1930 (298 K, 18.9 %), Knobler \
(90 K); Ne-Ar: Brewer and Vaughn (123-323 K, 9.7 %), Knobler (90 K). Citations as \
printed include J. Brewer and G. W. Vaughn, J. Chem. Phys. 50, 2960 (1969); M. L. \
Martin et al., Aust. J. Chem. 35, 1525 (1982); W. F. Vogl and K. R. Hall, Physica 59, \
529 (1972); N. K. Kalfoglou and J. G. Miller, J. Phys. Chem. 71, 1256 (1967); C. M. \
Knobler, J. J. M. Beenakker and H. F. P. Knaap, Physica 25, 909 (1959). These are \
independent of the fits, and the candidates for OEP 4's validation of the default \
pairs (not in the library).

DOUBTS: the text cites 'Fig. 4' for all three pairs (Figs. 3-5 are meant); it gives \
He-Ar data to '573 K' where Popov reaches 673 K, and Ne-Ar densities to '55 MPa' and \
'100 MPa' where Table 5 lists Vidal to 800 MPa. None affects a parameter."""
