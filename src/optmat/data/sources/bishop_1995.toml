notes = """Identity checked on the page (pdf page 2; pdf page 1 is the publisher's cover): \
the erratum to bishop_1989, J. Chem. Phys. 103, 5868 (1995). The same printed page \
carries an unrelated erratum (R. Brown, molecular dynamics of fluorescence shifts), \
ignored.

What it corrects: 'The correction of a programming error leads to some minor changes \
to the values of B(omega) in Table VI. For convenience, the full correct Table is \
shown here.' Only the dipole-quadrupole polarizability B(omega) changes (image \
checked, tbl_763b9fafd37e: B(0) = -7.326 71 unchanged; -7.383 51 at 0.05 a.u. against \
the original -7.379 56; -42.4800 at 0.60 against -40.675 60; the estimates near the \
2 1P resonance become (-78), (-207), (-1630)); C(omega) is reprinted unchanged. The \
library's text rendering prints the minus signs as '2' ('27.326 71'); the image shows \
minus signs.

NOTHING IS EXTRACTED: the erratum does not touch the second hyperpolarizability gamma \
(Tables II-V of bishop_1989 stand as published), and B and C are field-gradient \
polarizabilities with no quantity in the vocabulary (not needed for the Kerr or \
third-harmonic coefficients)."""
