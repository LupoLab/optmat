citation = "A. Bideau-Mehu, Y. Guern, R. Abjean and A. Johannin-Gilles, \"Measurements of refractive indexes of gases extended in the vacuum ultraviolet and revised values for krypton\", Opt. Commun. 16, 186 (1976)"
doi = "10.1016/0030-4018(76)90081-x"
library = "BideauMehu_1976_MeasurementsRefractiveIndexes"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Fabry-Perot interferometer in a vacuum chamber with LiF windows, followed by a \
Romand-Vodar vacuum monochromator; the fringe pattern scanned by a slow uniform gas \
leak, photomultiplier detection. Iodine electrodeless lamp for 164 and 170 nm (MgF2 \
etalon plates coated Al + MgF2, matched to lambda/80); the other lines from the \
sources of the earlier papers (SiO2 plates). Pressure by Hg manometer, temperature \
near 290 K stabilised to +-0.025 K by thermocouple (pp. 186-187)."""
notes = """Page numbers are counted from 186 on the pdf (p. 186 = pdf page 1).

State (p. 186): 'The refractive indexes are given at standard conditions (0 C, 760 \
torr) using the Van der Waals relations and Hilsenrath's tables for compressibility \
corrections': a real-gas reduction. Wavelengths are the vacuum-ultraviolet and \
ultraviolet lines' labels in nm (vacuum, as in bideau_mehu_1981).

Uncertainty (p. 187): 'The main error lies in the evaluation of the fractional part of \
the fringes. The total relative error for (n - 1) varies from about 0.5% for helium to \
0.1% for xenon.' Level not stated. Ne, Ar, N2 and Kr are given the helium value as the \
bound of the stated range. Table 1 lists the gas purities and the relative error each \
major impurity induces (He 2e-4, Ne 5e-4, Ar 3e-6, N2 6e-5, Kr 5e-5, Xe 2e-4).

Text values not extracted (p. 187): helium, Huber and Tondello 37.4e-6 (huber_1974) and \
Langhoff et al.'s calculated 37.67e-6 at 170.2 nm; neon at 164.1 nm, the authors' \
extrapolated 73.81e-6 and Dalgarno and Kingston's 73.17e-6; argon at 164.1 nm, the \
extrapolated 351.2e-6 and Chashchina et al.'s 352.2e-6; nitrogen at 164.1 nm, Wilkinson \
384e-6 (wilkinson_1960) and Koch's extrapolated 373.4e-6; xenon at 170.2 nm, the \
extrapolated 1181.4e-6 and Chashchina and Shreider's 1182.8e-6.

KRYPTON (Sec. 4, pp. 187-188): the authors' earlier krypton values (abjean_1971) were \
about 4 % above all other work; Smith et al. (1975) confirmed Kronjager and Koch and \
concluded that they were incorrect, and the new measurements (Table 3) 'confirm the \
conclusions of Smith et al.' A mixture of 4.3 % xenon in krypton would explain the old \
values: 'we may conclude that our previous values were incorrect'. The new data 'are \
less than 0.2% higher than those of Smith et al. This difference is within the range \
of our experimental uncertainty.' The 'old values' column prints 563.3 at 184.4 nm and \
528.8 at 206.2 nm, wavelengths abjean_1971 did not measure (its Table 2 has 562.4 at \
1849 A and no value near 206 nm): they are not the 1971 table's values.

Reproductions elsewhere: bideau_mehu_1981's experiment columns reproduce every value \
of this paper under the same wavelengths: experiment_Kr rows 228.8-164.1 nm (489.0 ... \
597.3), experiment_Ne and experiment_Ar rows 170.2 and 164.1 nm, experiment_Xe row \
170.2 nm (1186.7). Only bideau_mehu_1981's 152.5 and 140.4 nm rows (and the 253.7-180.7 \
nm rows of Ne and Ar, from the Comptes Rendus papers of 1970, not in the library) are \
new there. The bideau_mehu_1981 krypton formula, which does not reproduce its own \
'our formula' column, is 0.2-0.8 % below these same revised values (0.81 % at 170.2 \
nm) and 0.15-0.28 % below Smith et al.'s column of Table 3, so the revision does not \
explain that discrepancy (checked 2026-09-25)."""

