citation = "R. Ladenburg and C. C. Van Voorhis, \"The continuous absorption of oxygen between 1750 and 1300A and its bearing upon the dispersion\", Phys. Rev. 43, 315 (1933)"
doi = "10.1103/physrev.43.315"
library = "Ladenburg_1933_ContinuousAbsorptionOxygen"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Photographic-photometric absorption with a Cario-Schmidt-Ott fluorite \
vacuum spectrograph and a water-cooled capillary hydrogen discharge (many-line \
spectrum; CO lines for the longer wavelengths); intensity scale from five diaphragms of \
known open area (1.000-0.062, within 2 %); absorption tube 12.3 cm long (some \
exposures with the spectrograph filled, path 34.5 cm, agreeing within the errors); O2 \
from electrolysis at 0.079-1.86 mm Hg, the larger 425 cc volume always connected to \
limit the photochemical 'clean up' of O2; Eastman 3-0 plates, a photoelectric \
densitometer; the continuous background (scattered and fluorescence light) subtracted \
line by line (pp. 315-319). 1334-1670 A measured."""
notes = """Journal pages 315-321 = PDF pages 1-7 (PDF page 8 repeats Fig. 3). Identity \
checked against the first page: Ladenburg and Van Voorhis, Phys. Rev. 43, 315, \
received 3 January 1933. O2 only.

Absorption: beta is defined by I = I0 exp(-beta p l), p in cm Hg at 20 C, l in cm \
(Eq. 1, p. 318); the results, 'reduced to N.P.T.', are the absorption coefficients \
alpha of Fig. 5 (figure only, 1750-1300 A, p. 319). N at N.P.T. is 2.706e19 cm^-3 \
(footnote 15, p. 320, with e = 4.770e-10, e/mc = 1.76e7, c = 2.998e10). 'we estimate \
that the error of the beta values obtained may be as much as 5-10 percent' (p. 319). \
The worked examples of p. 319 (one plate: beta = 5.28 at 1469 A and 4.36 at 1496 A, \
per cm Hg at 20 C) illustrate the background correction and are not results; not \
extracted. Text values: the maximum at nu = 69000 cm^-1, lambda = 1450 A (p. 319; the \
abstract prints 6.8e4 cm^-1 with 1450 A, p. 315), 'about 490 cm^-1' (abstract), and a \
layer of 0.0014 cm at N.P.T. halves the light there (p. 319; ln 2 / 0.0014 = 495 \
cm^-1, consistent). Between 1300 and 1100 A O2 at 0.25 mm is 'practically transparent \
in a layer of 4 m length' (p. 319). Oscillator strength (Eq. 2, p. 320): integral alpha \
dnu = pi N f e^2 / m c^2 = 2.38e7 f (cm^-2; reproduced with the footnote's constants, \
2.3805e7), giving f = 0.193. Temperature of the absorption measurements not stated \
beyond the 20 C of Eq. 1.

Dispersion (p. 315 and 'Added in proof', pp. 320-321): Ladenburg and Wolfsohn (Z. Phys. \
79, 42 (1932), not in the library) described O2's dispersion from the visible to 1920 \
A by three resonances (formula lw_1932). This paper adds the continuum's contribution \
G(nu) = (1 / 2 pi^2) integral_a^b alpha(omega) d omega / (omega^2 - nu^2), a = 56000, b \
= 78000 cm^-1, computed by F. Seitz from Fig. 5 (Eq. 4), and fits the remainder H = (n \
- 1) - G by one term I (formula continuum_plus_one_term). Table I (x 10^7; image \
checked): G at 55000, 52084, 51020, 50000, 45000, 40000, 35000, 30000, 25000 cm^-1 = \
1612, 1277, 1193, 1125, 907, 768, 680, 618, 573; H = 2312, 2315, 2316, 2288, 2268, \
2241, 2220, 2202 and I = 2330, 2323, 2317, 2288, 2262, 2240, 2222, 2206 at the eight \
wave numbers 52084-25000. H = (n - 1) - G exactly in every row (checked 2026-09-25). \
G, H and I are not extracted: partial refractivities and a fit have no vocabulary \
quantity (format need reported; G is the check on a Kramers-Kronig integral of the \
Schumann-Runge continuum). 'The possible error of the G-values is at least ten times \
that of the dispersion values which are accurate to within one unit' (p. 320). The \
authors conclude (p. 321) that the usual formula with isolated resonances is a good \
approximation, the weak Schumann-Runge bands having no appreciable influence down to \
1920 A.

Reproduced here, not in the library: Ladenburg and Wolfsohn's dispersion (dataset \
lw_refractivity, formula lw_1932); Koch's (1912) resonance at 1421 A from the \
dispersion of air (footnote 16, p. 320; air is not curated). Fig. 5 is a figure only; \
Ditchburn and Heddle (1953, ditchburn_1953, Fig. 4) replot Ladenburg and Van \
Voorhis's points. Comparisons: watanabe_1953 (380 cm^-1 at about 1420 A) and \
metzger_1964 (402 +- 20) are lower; ditchburn_1953 agrees (490 cm^-1 at 1450 A)."""

[[datasets]]
id = "lw_refractivity"
material = "O2"
file = "O2/ladenburg_1933__lw_refractivity.csv"
table = "tbl_0010b8557526"
quantity = "refractivity"
scale = 1e-7
abscissa_unit = "cm-1"
wavelength_medium = "vacuum"
state = "1atm_0C"
use = "reproduced"
reproduced_from = ["R. Ladenburg and G. Wolfsohn, Zeits. f. Physik 79, 42 (1932)"]
notes = "Table I column (n(nu) - 1) x 10^7: 'the values of the dispersion of oxygen (n(nu) - 1) measured by Ladenburg-Wolfsohn (L-W)', at eight round wave numbers 52084-25000 cm^-1 (1920-4000 A): at round wave numbers, so probably smoothed or interpolated, not the measured lines. 'accurate to within one unit' (1e-7, p. 320; recorded as a bound). State: N.P.T. (the paper's formulas refer n - 1 to N at N.P.T., footnote 15; L-W's own reduction is not described here; 1 atm, 0 C assumed); density unknown. The wave numbers are 1/lambda (vacuum or air not stated; the difference, 7 cm^-1 at 25000 cm^-1, moves n - 1 by under 0.1e-7). The original is not in the library: this reproduction is the best copy available (missing-O). The three-term formula lw_1932 reproduces the column to 3e-7 with C 0.30 % larger than the footnote's constants give."
[datasets.uncertainty]
absolute = 1
level = "bound"

