wavelength_medium = "vacuum"
use = "primary"
notes = "Abstract (p. 315) and p. 319: the maximum absorption coefficient of the Schumann-Runge continuum 'reduced to N.P.T. is about 490 cm^-1', at nu = 69000 cm^-1, lambda = 1450 A (the abstract's '6.8 x 10^4 cm^-1' is the rounded position; 1450 A is 68970 cm^-1), read from the smooth curve of Fig. 5. scale = 1e18 / 2.706e19 (the paper's N at N.P.T.) to Mb: 18.1 Mb. 10 % from the stated error of the beta values ('as much as 5-10 percent', p. 319), recorded as a bound. The only printed value of the measured curve (Fig. 5 is a figure)."
[datasets.uncertainty]
relative = 0.10
level = "bound"

