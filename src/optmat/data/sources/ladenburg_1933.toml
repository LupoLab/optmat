abscissa = "label"
use = "check"
notes = "Abstract and p. 320: f = 0.193 from integral alpha(nu) dnu = 2.38e7 f (Eq. 2, N = 2.706e19) over the absorption curve of Fig. 5 (range not stated; G uses 56000-78000 cm^-1), 'compared with 0.202 calculated from the dispersion measurements'. Index abscissa: an integrated strength. Compare ditchburn_1953 (0.215 +- 0.020), watanabe_1953 (0.161), metzger_1964 (0.142). A check."

[[formulas]]
id = "lw_1932"
material = "O2"
equation = "p. 315 (quoted from Ladenburg and Wolfsohn 1932); Eq. (3) without the integral, p. 320"
printed = "n(nu) - 1 = C Sigma_s f_s / (nu_s^2 - nu^2), C = N e^2 / 2 pi m c^2; lambda_1 = 1899A, lambda_2 = 1468A, lambda_3 = 544A, f_1 = 4.0 x 10^-5, f_2 = 0.202, f_3 = 5.93"
variable = "nu: wave number in cm^-1 (nu_s = 1 / lambda_s); N = 2.706e19 cm^-3 at N.P.T."
state = "1atm_0C"
density = "unknown"
range = "visible to 1920 A (the L-W data, 1920-4000 A in Table I)"
coefficients = { lambda_1 = "1899", lambda_2 = "1468", lambda_3 = "544.4", f_1 = "4.04e-5", f_2 = "0.202", f_3 = "5.928" }
check = "With C from footnote 15's constants (N e^2 / 2 pi m c^2 = 1.2060e6 cm^-2) the formula gives 0.28-0.38 % less than Table I's (n - 1) column (3576.0 against 3589 at 52084 cm^-1, 2765.7 against 2775 at 25000); with C = 1.2096e6 cm^-2 (0.30 % larger, the value that reproduces Table I's I column, see continuum_plus_one_term) it reproduces the column to within 3e-7 (3505.0 against 3508 at 51020 cm^-1, the others within 2.4e-7). The source of the 0.30 % is not identified. Checked 2026-09-25."
notes = "Reproduced from R. Ladenburg and G. Wolfsohn, Z. Phys. 79, 42 (1932), not in the library. Coefficients as printed on pp. 320-321 (lambda_3 = 544.4 A, f_3 = 5.928, f_1 = 4.04e-5); p. 315 prints them rounded (544 A, 5.93, 4.0e-5). lambda_1 is ascribed to the Schumann-Runge band (5, 0), lambda_2 to the Schumann-Runge continuum. The authors call the lambda_1 term physically unmeaningful once the continuum is allowed for (p. 321)."

[[formulas]]
id = "continuum_plus_one_term"
material = "O2"
equation = "Eq. (4) and Table I, p. 320"
printed = "n(nu) - 1 = C Sigma_s f_s / (nu_s^2 - nu^2) + (1 / 2 pi^2) integral alpha(omega) d omega / (omega^2 - nu^2); one term: f_s = 7.143, lambda_s = 1 / nu_s = 501.3A"
variable = "nu: wave number in cm^-1; alpha(omega): the measured absorption coefficient at N.P.T. (Fig. 5), integrated over 56000-78000 cm^-1"
state = "1atm_0C"
density = "unknown"
range = "1920-4000 A (the L-W data of Table I)"
coefficients = { f_s = "7.143", lambda_s = "501.3" }
check = "The one term C f_s / (nu_s^2 - nu^2) with footnote 15's constants (C = 1.2060e6 cm^-2) gives 0.29-0.32 % less than Table I's I column at all eight wave numbers (2323.2 against 2330 at 52084 cm^-1); with C = 1.2096e6 cm^-2 it reproduces I to 0.5e-7 in every row. H = (n - 1) - G exactly. The integral term G is tabulated only (Table I) and rests on Fig. 5. Checked 2026-09-25."
notes = "The paper's generalised dispersion formula with the Schumann-Runge continuum as a distributed absorption (Kramers-Kronig with the measured alpha) and one line for everything above it, fitted to H = (n - 1) - G: 'the values f_s = 7.143 and lambda_s = 501.3A instead of f_3 = 5.928 and lambda_3 = 544.4A' (p. 320). Not a closed form: needs G (Table I, in the record's notes) or the absorption curve."
