citation = "R. M. Waxler and G. W. Cleek, \"Refractive Indices of Fused Silica at Low Temperatures\", J. Res. Natl. Bur. Stand. 75A, 279 (1971)"
doi = "10.6028/jres.075a.026"
library = "Waxler_1971_RefractiveIndicesFused"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Fizeau interferometry of the change of optical path with temperature (after \
Austin and Pierce): a plate of Corning Code 7940 fused silica about 0.3 cm thick, \
half-silvered on the front and fully silvered on the back, viewed in reflection with \
collimated light; fringe shifts photographed for several lines at once (He 471.3, 501.6, \
587.6, 667.8 nm; Cd 467.8, 480.0, 508.6, 643.8 nm; Hg 404.7, 435.8 nm) as the specimen, \
in a liquid-nitrogen cryostat, was cooled in plateaus of about half an hour from +20 to \
about -192 C (copper-constantan thermocouple; sensitivity 0.02 C at room temperature, \
0.5 C at the lowest). Delta n = Delta N lambda/(2 t Delta T) - n Delta t/(t Delta T), Eq. \
(2), with the thermal expansion of Scheel and Heuse; the Delta n fitted by a cubic in T \
and printed every 10 C, added to Malitson's 20 C indices (pp. 279-280)."""
notes = """Journal pages 279-281 are pdf pages 1-3. Identity checked against the first page.

MEDIUM. 'These increments were added to the initial values of refractive index, and the \
results which refer to air at 20 C are shown in table 1' (p. 280): every row is relative \
to air at 20 C (the medium of Malitson's initial values; malitson_1965 is read as \
relative to room air at 20 C, TC-399), not to air at the sample's temperature. The \
datasets say index_medium = 'air' with air_temperature_k = 293.15 (pressure not \
stated). The paper does not say what gas, if any, was in the cryostat; leviton_2006 (p. \
1) says 'While their measurements were made in vacuum, their results are reported in \
air'. The wavelengths are the lines' air wavelengths, printed to 0.1 nm (He 587.6 is \
the 587.56 nm air line), recorded as standard air.

ACCURACY. 'shifts could be measured to one-tenth of an interference fringe, and \
calculations showed that this meant that the sensitivity of measurement was about \
+-2 x 10^-5 in Delta n'; 'The standard deviation of each value of the original data was \
within +-1 x 10^-5' (p. 280). The datasets carry +-2e-5 (level not stated). The \
absolute level is Malitson's 20 C index (malitson_1965), whose own uncertainty adds to it.

TABLE 1 CHECKS (2026-09-27). The +20 C row is within 0.75e-5 of Malitson's Eq. (1) \
(malitson_1965/sellmeier) at the printed wavelengths as air wavelengths. Every column \
falls monotonically with temperature, by 2-9 x 1e-5 per 10 C, except 480.0 nm at +10 C, \
printed 1.46431 between 1.46350 (+20 C) and 1.46332 (0 C): a transposition of 1.46341 \
(erratum). Dispersion: n(404.7) - n(667.8) is 0.01343 at -200 C and 0.01355 at +20 C \
(p. 281), as the table gives.

TABLE 2 (-Delta n x 10^4 from +18 to -160 C; no quantity, not extracted): this study \
12.1, 12.2, 12.7, 12.8 at 667.8, 587.6, 501.6, 471.3 nm; Austin and Pierce (Physics 6, 43 \
(1935)) 11.8 at 587.6 nm; Rinne (Neues Jahrb. Mineral. Beil. 39, 388 (1914), via Sosman) \
10, 11, 12, 14 (p. 281). The 18 C values of this study come from the computer run and are \
not in Table 1.

dn/dT (text and Fig. 1 only; not recorded as data): 'Values of the thermal coefficient \
of refractive index were found to be positive and varied from about 9 x 10^-6/C at room \
temperature to 3 x 10^-6/C at liquid nitrogen temperature' (abstract). Fig. 1: dn/dT at \
587.6 nm against temperature, -200 to +20 C, the smoothed curve of the cubic and the \
Delta n/Delta T of adjacent plateaus (points), decreasing continuously to the lowest \
temperature. dn/dT follows from Table 1's differences (at 587.6 nm, 8e-6/K between +10 \
and +20 C, 2e-6/K between -200 and -190 C; relative to air at 20 C, a fixed medium, so \
these are absolute changes to within n_air).

REPRODUCTIONS. leviton_2006 and leviton_2008 (the same paper; Table 7) print 'adjusted \
refractive indices of Waxler and Cleek ... minus refractive indices from CHARMS' at the \
ten lines (wavelengths rounded to 1 nm) and -200, -150, -100, -50, 0 and +20 C (73-293 \
K), corrected 'to be in vacuum' by an unstated method. Recomputed here (2026-09-27) as \
Table 1 times the index of dry air at 20 C and 101 325 Pa (Edlen), minus Leviton and \
Frey's Table 3 formula at the lines' vacuum wavelengths: all 60 printed differences are \
reproduced within 1.1e-5 (57 within 0.8e-5), i.e. to their rounding to 1e-5."""

