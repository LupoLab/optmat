citation = "H.-J. Hagemann, W. Gudat and C. Kunz, \"Optical constants from the far infrared to the x-ray region: Mg, Al, Cu, Ag, Au, Bi, C, and Al2O3\", DESY report SR-74/7 (Deutsches Elektronen-Synchrotron DESY, Hamburg, May 1974)"
doi = "10.3204/pubdb-2018-00701"
library = "Hagemann_1974_OpticalConstantsFar"
identity = "VALIDATED_WITH_WARNINGS"
kind = "compilation"
technique = """Transmittance of thin evaporated films of Mg, Al, Cu, Ag, Au, Bi, C and \
Al2O3 measured from 13 to 150 eV with the DESY synchrotron, a fixed-exit-slit grazing \
incidence monochromator (resolution about 1:500, energy calibration to 0.3 eV) and a \
two-beam optical densitometer (rotating mirror beam splitter, KCl-coated open \
photomultipliers; the reference beam through an empty mesh or a carbon film), with Al, Pr \
and Sb filters against stray light and higher orders (report pp. 7-8, PDF pp. 11-12). \
Films (section 2.1, pp. 6-7): 'below 100 A to 600 A' thick, vacuum-evaporated at about \
5e-7 Torr from resistance-heated boats (Mg, Cu, Ag, Au, Bi) or an e-gun (Al, C, Al2O3), \
10-50 A/s, onto collodion on a copper mesh (34 um spacing, 75 % transmission), the \
collodion dissolved afterwards; oxidizing or very thin films sandwiched between 50 A \
carbon layers in situ; thickness from a quartz monitor calibrated by Tolanski \
interferometry (nominal error about 1.5 %; for Au also by weighing and visible \
transmittance). Al was remeasured on films evaporated in situ onto carbon at about 1e-9 \
Torr (thickness not measurable; mu fitted to a general curve at one energy). A \
constant error found late (a drift of the relative detector efficiencies) was removed \
by subtracting a constant X x 10^5 cm-1 from mu, fixed by earlier absorption data at \
120-150 eV ('mu(T)-X', p. 13). These data were joined to other authors' reflectance, \
ellipsometry, Drude parameters and x-ray attenuation (Hubbell's compilation, Compton and \
pair terms removed) into a complete absorption spectrum from 1e-3 to 1e6 eV, and the \
refractive index n followed by Kramers-Kronig analysis of mu (Eq. 3); where only \
reflectance was available the phase came from Eq. (1) first; for Au and Ag (high \
reflectance at 13-50 eV) mu came from the transmittance with the reflection at the film \
faces included (Eqs. 4-5, after Nilsson; an iterative correction mu_1 = 2 mu_0 + (1/d) \
ln T(n_0, k_0) converged at the first step) (section 3, pp. 9-11). All the optical \
functions (epsilon, n, k, mu, R, the loss function) were then calculated from n and k \
and tabulated (Tables 1-9)."""
notes = """PDF pages 1-96; the report's printed page numbers are PDF page - 4 (report \
p. 14 = PDF p. 18). The numerical tables (PDF pp. 37-61) are unnumbered line-printer \
pages labelled in the margin 'Table N, page M'. Identity checked against the title page \
and the errata sheet (the library flags warnings on the bibliographic record only). The \
Letter hagemann_1975 (J. Opt. Soc. Am. 65, 742 (1975)) summarises this report and cites \
it as its Ref. 1.

WHAT IS TABULATED (PDF p. 36: 'Numerical values of the optical functions from the \
Kramers-Kronig-analysis of absorption data, N-EFF according to Eq. 6. Table 6 gives in \
addition the results of the Kramers-Kronig-analysis of the measured reflectivity of Au \
which has been extrapolated to higher energies'). Each table has nine columns: ENERGY \
(eV), EPSILON1, EPSILON2, N, K, ABSCOEFF (mu = 2 omega k / c, cm-1: it equals 2 E k / \
(hbar c) to the printed rounding, which fixes the unit), REFLECT% (normal-incidence \
reflectance, percent), ENERGYLOSS (-Im 1/epsilon) and N-EFF (Eq. 6, the effective \
number of electrons per atom or molecule below the energy). On the last page of each \
metal's table (from 122 eV for Al, 65 eV for Cu, 90 eV for Ag, 84.5 eV for Au Table 5, \
91 eV for Table 6) the second and fourth columns are '1.-EPSL1' and '1.-N', printed to \
three decimals. The n and epsilon_1 datasets stop there; '1.-N' continues them as the \
delta datasets (refractive_index_decrement, delta = 1 - n as printed; added to the \
vocabulary for this record, 2026-09-28), and '1.-EPSL1', which has no quantity, stays \
in printed; k, epsilon_2 and mu continue. At three decimals delta is coarse: above \
about 1 keV it is printed between -0.003 and +0.002, and it is negative at 33 energies \
in all (e.g. Ag -0.003 at 40 keV, -0.007 at 370 eV): a few units of the last printed digit, which \
should be read as the resolution of the printout (the report itself could not evaluate \
the sum rule on n - 1, Eq. 10, for the same reason, p. 23), not as n > 1. Table 9 \
(Al2O3) prints N and EPSILON1 throughout. R, the loss function and N-EFF have no \
quantity: printed only. The first rows of Table 3 (Cu, 2 meV) and Table 5 (Au, 1 meV) \
leave EPSILON1 and N blank. No uncertainty is given for any tabulated value.

DATASETS: one per table and quantity: n (refractive_index) and k (extinction_coefficient) \
are the analysis's own results (k from the absorption spectrum mu, n from its \
Kramers-Kronig transform, Eq. 3) and are primary for Tables 2-5 and 9; epsilon_1, \
epsilon_2 and mu are computed from n and k and are checks. Table 6 (the alternative \
gold) is recorded as check throughout; which gold to use is decided at review (below). \
delta has the use of its table's n. The energies are the row ids, stored as printed \
with 'E 05' written 'E+05' (printed keeps the row as the page prints it). THE DECISION \
AT REVIEW (2026-09-28): the noble metals' n below 3.5 eV (Ag) and 2.4 eV (Au), where \
the report's k is Johnson and Christy's and its n the Kramers-Kronig transform of the \
composite absorption (2-5 times Babar and Weaver's n; see the comparisons), stays \
primary in this record because it is what the report prints, but it will not be used.

EXTRACTION. The library's reading of these faint line-printer pages is poor: \
tools/extract/hagemann_1974.py reads the zeros the library takes for letters and \
corrects 396 further cells, each checked on the 300-dpi page image (every cell of the 17 \
pages was compared; the Cu 78 eV '1.-EPSL1' cell, 0.048 where the 300-dpi render \
suggests 0.043, settled at 600 dpi: the row's glyphs have faded left halves); every row is then checked against its redundant columns \
(epsilon_1 = n^2 - k^2, epsilon_2 = 2nk, R from n and k, the loss from epsilon, mu = 2 \
E k / (hbar c)) to the printed rounding within 3 %, energies increasing, N-EFF \
non-decreasing. 25 rows fail on the page itself, as printed (listed in the script): \
the first rows of the Drude extrapolation (Au 5 meV: epsilon_1 10 %, loss 20 % off n \
and k; Cu 2 meV: mu 13 %; Ag 25 meV: epsilon_2 4 %), the plasma edges (Al 14-16 eV and \
Ag 3.8 eV: loss or R 4-10 %), Al2O3 at 6 eV (the absorption edge; loss 28 %, mu 17 %) \
and 250-500 eV (mu 3-8 % below 2 E k / (hbar c)), and Al at 72.9-80 eV, where the \
ABSCOEFF and ENERGYLOSS cells are typed in another typeface (pasted in after the \
printout): mu there is 4-13 % below 2 E k / (hbar c) from the printed k, while k and \
epsilon_2 agree with each other. Worst rows within 3 % (relative excess beyond the \
printed rounding): Table 2 epsilon_1 1.2 % (3.00 eV); Table 3 epsilon_2 2.3 % (0.1 eV); \
Table 4 mu 3.9 % (1.5 keV, listed); Table 6 loss 1.8 % (2.2 eV), all else under 0.2 %. \
On the last page of Table 4 (PDF p. 48) some N-EFF digits are illegible and are written \
'?' in printed.

METHOD PER METAL (section 4, pp. 12-21, PDF pp. 16-25): the construction of the \
absorption spectrum as the report tabulates it, 'a (B)': a the type of data (R, k, mu, \
mu/rho, sigma, epsilon), B the method (DrP Drude parameters from reflectance, mu from the \
'elementary Drude formulas'; R near-normal reflectance; T transmittance; KrKr published \
Kramers-Kronig results; R(alpha_i) reflectance at several angles; Ell ellipsometry; EL \
electron energy loss; cp Hubbell's compilation, Ref. 4). References as printed (pp. \
25-28):
- Al (Table 2, Figs. 7-10; pp. 14-15): 1e-3-0.155 eV mu(DrP) Ref. 44 (H. E. Bennett and \
J. M. Bennett, in Optical Properties and Electronic Structure of Metals and Alloys, p. \
175 (Abeles, 1966)); to 0.8 eV interpolated according to 44; to 2.0 eV epsilon(Ell) Ref. \
20 (A. G. Mathewson and H. P. Myers, Physica Scripta 4, 291 (1971); UHV); to 13.5 eV \
approximately mu(DrP) estimated according to 44; to 36 eV k(R(alpha_i),T) Ref. 19 (R. W. \
Ditchburn and G. H. C. Freeman, Proc. Roy. Soc. A 294, 20 (1966)); to 74 eV mu(T) \
present work (UHV films, absolute values fitted at 74 eV); to 150 eV mu(T) Ref. 45 \
(H.-J. Hagemann, Diplomarbeit, Hamburg 1974), 'experimental procedure similar to present \
work'; to 300 eV mu(T), shape from Refs. 29 (C. Gahwiller and F. C. Brown, Phys. Rev. B \
2, 1918 (1970)) and 30 (R. Haensel et al., J. Appl. Phys. 40, 3046 (1969)), absolute \
values fitted to Ref. 28 (V. A. Fomichev and A. P. Lukirskii, Opt. Spectrosc. 22, 432 \
(1967)); above 300 eV sigma(cp). Remarks: the computed reflectivity agrees with measured \
normal-incidence reflectance (Ref. 31); the loss peak at 15.0 eV against 14.9 eV from \
electron energy loss (Ref. 32); between 15 and 72.6 eV the transmittance varied with \
preparation, attributed to implanted oxide, hence the UHV films; 73-150 eV the authors \
differ by 8 % at most; 200-500 eV 'may be less accurate', which could explain n_eff 0.5 \
above 13.
- Cu (Table 3, Figs. 11-14; p. 15-16): 1e-3-0.5 eV mu(DrP) Ref. 5 (P. B. Johnson and R. \
W. Christy, Phys. Rev. B 6, 4370 (1972)); to 6.5 eV k(R,T) Ref. 5; to 13 eV k(R,Kr) Ref. \
12 (H. Ehrenreich and H. R. Philipp, Phys. Rev. 128, 1622 (1962)) and k(R(alpha_i)) Ref. \
11 (L. R. Canfield and G. Hass, J. Opt. Soc. Am. 55, 61 (1965)), 'interpolated curve, \
absolute values fitted to Ref. 11'; to 150 eV mu(T)-0.8 present work; to 450 eV mu(T) \
Ref. 47 (B. Sonntag, DESY-F41/1 (1969)), compare Ref. 9 (R. Haensel, C. Kunz, T. Sasaki \
and B. Sonntag, Appl. Opt. 7, 301 (1968)); above 450 eV sigma(cp).
- Ag (Table 4, Figs. 15-18; pp. 16-17): 1e-3-0.5 eV mu(DrP) Ref. 5 (Johnson and \
Christy); to 3.5 eV k(R,T) Ref. 5; to 11 eV k(R,Kr) Ref. 18 (G. B. Irani, T. Huen and F. \
Wooten, J. Opt. Soc. Am. 61, 128 (1971); UHV); to 16 eV an interpolated segment, helped \
by Refs. 11, 12 and the present work; to 110 eV mu(T)-0.7 present work (from Eqs. 4-5); \
to 300 eV mu(T) Ref. 9; above 300 eV sigma(cp). Remarks: up to 3.5 eV the k of Ref. 5 \
were taken; 'On the basis of the total absorption curve chosen the n-data given in \
Ref. 5 are not Kramers-Kronig-consistent (see Fig. 17)'; loss peaks at 19, 27.5 and 35 \
eV lie above the electron energy-loss peaks (Refs. 6, 38); reflectance 16.5 % at 23.5 \
eV, hence Eq. 4.
- Au (Tables 5 and 6, Figs. 19-22; pp. 17-18): 1e-3-0.6 eV mu(DrP) Ref. 5; to 2.4 eV \
k(R,T) Ref. 5; to 10.5 eV k(R,Kr) Ref. 18 (UHV); to 20 eV a fitted segment, shape from \
Ref. 10 (L. R. Canfield, G. Hass and W. R. Hunter, J. de Physique 25, 124 (1964); \
reflectance); to 117 eV mu(T)-1.4 present work (Eqs. 4-5); to 300 eV mu(T) Ref. 48 (R. \
Haensel, K. Radler, B. Sonntag and C. Kunz, Sol. State Comm. 7, 1495 (1969)); above 300 \
eV mu(T), shape to 500 eV interpolated from Ref. 9, absolute values fitted for a smooth \
join at 300 and 500 eV. THE TWO GOLD TABLES (pp. 3-4, 18): joining the reflectance data \
(Ref. 10) to the transmission results between 12 and 40 eV was not possible 'without \
appreciable arbitrariness': at 22.5 eV the reflectance is 16 % measured directly and 26 \
% from the Kramers-Kronig analysis of the transmission. 'Therefore we give two \
alternative versions of the o.c. of gold: the first one (Table 5) follows from fitting \
the adjacent values to our transmission results, the second one (Table 6) from \
extrapolating the measured reflectance data. The first alternative is leading to the \
correct value of 79 effective electrons, the second one reproduces the \
energy-loss-spectra (Refs. 6, 38) more closely.' Table 6 is headed 'OPTICAL CONSTANTS \
OF AU FROM REFLECTIVITY-DATA FITTED TO CANFIELD ET AL (10)' and runs 1.5-350 eV (N-EFF \
18.584 at 350 eV, against 29.895 in Table 5); at 22.5 \
eV its R is 16.0 % (Table 5: 26.1 %). The report introduction (pp. 3-4) calls the \
alternative set 'of large technical importance of gold as a reflecting coating'.
- Al2O3 (Table 9, Figs. 31-34; p. 21): 'evaporated amorphous Al2O3' (e-gun films); 5.5-10 \
eV k(R(alpha_i)) Ref. 36 (G. Hass, W. R. Hunter and R. Tousey, J. Opt. Soc. Am. 47, \
1070 (1957)), interpolated between two experimental points; to 20 eV k(R(alpha_i)) Ref. \
46 (W. R. Hunter, J. Opt. Soc. Am. 54, 15 (1964)), shape interpolated by the \
transmission data; to 150 eV mu(T)-0.6 present work; to 500 eV mu(T) Ref. 33 (V. A. \
Fomichev and A. S. Parobets, Opt. Spectrosc. 21, 419 (1966); 12 measured points); \
above 500 eV sigma(cp), 'calculated by superposition of Aluminum- and oxygen-data', \
'probably overestimating the oscillator strength' near the O K edge. Table 9 is printed \
from 6.00 eV to 1.60 keV only (two pages, the second labelled 'Table 9, page 2'; N-EFF \
45.09 at 1.6 keV), while Table 10 gives n_eff = 50.2-50.6 for the whole spectrum: the \
analysis went further than the printed table; no third page is in this copy (PDF p. 62 \
is a figure).

SUM RULES (section 5, pp. 22-24; Eqs. 6-10). Eq. 6: B int_0^w0 omega epsilon_2 domega = \
n_eff; Eq. 7 with c mu; Eq. 8 with -Im 1/epsilon; Eqs. 9-10: int mu (n - 1) and int (n - \
1) tend to zero; B = m A / (2 pi^2 e^2 rho L) (A atomic weight, rho density, L \
Avogadro's number). N-EFF in Tables 1-9 is Eq. 6. The densities used are not printed: \
no atomic, mass or electron density of Al, Cu, Ag, Au or Al2O3 appears anywhere in the \
report (text, sum-rule section, tables and Table 10 searched), so there is no \
atom_density dataset; the only one is carbon's mass density, rho = 1.5 g cm-3 (p. 20, \
PDF p. 24); the electron counts Z are those of Table \
10 (Mg 12, Al 13, Cu 29, Ag 47, Au 79, Bi 83, C 6, Al2O3 50). Fig. 43 shows Eqs. 9-10 for \
Ag; Eq. 10 'could not be achieved' numerically. The K-shell contribution is about 30 % \
below 2 electrons on average (p. 24). TABLE 10 (missing from the report; printed on \
the back of the errata sheet, PDF p. 3; tbl_7ffa99e81efc, image checked): n_0, Delta \
n_cond, Delta n_K, Z, and n_eff from epsilon_2, mu and Im(1/epsilon) with the deviation \
from Z: Mg 2, 2.2, 1.3, 12; 12.2 (+1.7 %), 12.6 (+5 %), 12.6 (+5 %). Al 3, 2.8, 1.5, 13; \
13.4 (+3 %), 13.6 (+4.5 %), 13.6 (+4.5 %). Cu 1, 0.6, 1.2, 29; 27.6 (-5 %) in all three. \
Ag 1, 0.9, 1.3, 47; 47.5 (+1 %), 47.7 (+1.5 %), 47.6 (+1.3 %). Au 1, 0.9, 1.3, 79; 78.9 \
(-0.1 %), 79.0 (+-0 %), 79.0 (+-0 %). Bi -, -, 1.25, 83; 82.3 (-1 %) in all three. C -, \
-, 2.0, 6; 6.1 (+1.7 %), 6.1 (+1.7 %), 6.2 (+3.3 %). Al2O3 Z = 50; 50.6 (+1.2 %), 50.3 \
(+0.6 %), 50.2 (+0.4 %). Identical, value for value, to hagemann_1975's Table I. The \
last printed N-EFF of each table: Al 13.495 (120 keV), Cu 27.505 (50 keV), Ag 47.506 \
(500 keV), Au (Table 5) 78.465 (150 keV); n_eff has no quantity (notes only).

ERRATA SHEET (PDF p. 2, image checked), as the report states it: '1) Table 10 "Summary \
of numerical evaluation of sum rules" is missing in the report, see back of this sheet. \
2) Table 8, page 1: "Optical constants of Carbon". The first 13 energy values should \
have a negative exponent' (Table 8, PDF p. 58, prints 1.00E 02, 1.50E 02 ... for \
1.00E-02 ...; carbon is not extracted, so no erratum entry is needed). No other printed \
correction was found; the pasted-in cells of Table 2 at 72.9-80 eV (above) are the \
report's own amendment of the printout and are extracted as they stand.

TABLES NOT EXTRACTED: Table 1 Mg (PDF pp. 37-39, 7.0E-02 to 5.0E+04 eV; Mg is not \
registered), Table 7 Bi (pp. 55-57, 0.2 eV to 5.0E+05 eV; not registered), Table 8 C \
(pp. 58-59, glassy carbon: 'our values have not been used for constructing the \
universal curve', the Williams and Arakawa glassy-carbon data were; rho = 1.5 g cm-3; \
not registered as a material). FIGURES (not digitised): Figs. 1-2 the apparatus and \
filter tests; Figs. 3-34 the optical functions of each substance against photon energy \
on a logarithmic scale with other authors' measurements; Figs. 35-42 the sum-rule \
integrals against energy; Fig. 43 Eqs. 9-10 for Ag.

MATERIALS. Table 9 is 'evaporated amorphous Al2O3', recorded as Al2O3_amorphous (not \
sapphire). The metals are evaporated films in the 13-150 eV range, and the other \
authors' samples elsewhere (Johnson and Christy's evaporated films, Irani et al.'s UHV \
films, Mathewson and Myers's UHV Al ...): each table is a composite, not one sample.

COMPARISONS (2026-09-28; report, not edit). WEAVER'S REPRINT of Table 4 (J. H. Weaver, \
C. Krafka, D. W. Lynch and E. E. Koch, Physics Data 18-2 (1981), pp. 52-53, 'publication \
by H.J. Hagemann, W. Gudat, and C. Kunz in J. Opt. Soc. Am. 65, 742 (1975) based on the \
following tabulation'; J. C. Travers's scan, not in the library): 0.10-100 eV, epsilon \
to two decimals, with n, k, the loss and R recomputed from those epsilon (e.g. 0.10 eV: \
n, k = 9.91, 90.27 from -8050 + 1790i, where the report prints 9.936, 90.2); rows below \
0.1 eV and some others (37, 39 eV ...) omitted. Its epsilon agree with this table to the \
last digit everywhere except 11 eV (epsilon_1 2.00 against 2.080), 36 eV (epsilon_2 0.78 \
against 0.732) and 70 eV (epsilon_1 0.65 against 0.698), each a slip of the reprint (the \
report's rows agree with their own n and k), and one unit at 22.5 and 100 eV. The \
reprint independently confirms many of the script's cell corrections (e.g. 3.50 eV \
epsilon_2 0.60, 3.90 eV, 4.00 eV epsilon_2 1.94, 17 eV epsilon_1 1.02, 25 eV epsilon_2 \
1.57, 48 eV 0.55, 85 eV 0.19). BABAR AND WEAVER (babar_2015, single crystals, 0.1-6 eV): \
k agrees to 1-7 % from 0.5 to 6 eV for all three metals, but below about 3.5 eV \
Hagemann's n (the Kramers-Kronig n of the absorption, with Johnson and Christy's k below \
3.5 eV for Ag, 2.4 eV for Au, 6.5 eV for Cu) is 2-5 times larger (Ag at 1 eV: 0.278 + \
9.02i against 0.098 + 8.98i; epsilon_2 5.04 against 1.76), which the report itself \
anticipates for Johnson and Christy's n (not Kramers-Kronig-consistent with the chosen \
absorption). At 6 eV: Cu 1.036 + 1.590i against Babar's 1.020 + 1.597i (1.6 %, 0.4 %); \
Ag 1.339 + 1.280i against 1.079 + 1.247i; Au Table 5 1.618 + 1.300i, Table 6 1.412 + \
1.330i, against 1.243 + 1.151i. WERNER ET AL.'S REELS (werner_2009, 20-70 eV): rms \
differences in epsilon of 0.10 (Cu), 0.28-0.49 (Ag), 0.40-0.80 (Au Table 5) and 0.26-0.32 \
(Au Table 6); the worst at the 20-25 eV structure (Au at 20 eV: epsilon_1 1.374 against \
0.240); Table 6 is the closer to REELS, as the report says it is to the energy-loss data. \
ORDAL ET AL. (ordal_1988, Al, 50-15000 cm-1): k agrees to 1-8 % from 0.01 to 1.8 eV; n \
is 20-40 % below Ordal's at 0.2-1.3 eV (Al 1 eV: 0.949 + 12.2i against 1.233 + 12.61i), \
+26 % at 0.05 eV: Hagemann's infrared is Bennett and Bennett's Drude parameters and \
Mathewson and Myers's ellipsometry, Ordal's is Shiles et al.'s analysis."""

