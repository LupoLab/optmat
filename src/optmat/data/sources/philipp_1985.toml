citation = "H. R. Philipp, \"Silicon Dioxide (SiO2) (Glass)\", in Handbook of Optical Constants of Solids, E. D. Palik, ed. (Academic Press, 1985), pp. 749-763"
doi = "10.1016/b978-0-08-054721-3.50040-x"
library = "PHILIPP_1985_SiliconDioxideSiO2"
identity = "VALIDATED_WITH_WARNINGS"
kind = "compilation"
technique = """A critical compilation of the optical constants of SiO2 glass at room temperature \
from 2000 eV (6.2 A) to 0.00248 eV (500 um), each range from a different original \
(pp. 750-752): values computed from Henke's atomic scattering factors; reflectance \
against angle of incidence (Rife and Osantowski; Hunter); Kramers-Kronig analyses of \
normal-incidence reflectance (Philipp, Lamy; Philipp 1979 in the infrared); thin-film \
and bulk transmission (Weinberg et al., Appleton et al., Kaminow et al., Drummond, \
Philipp 1979); minimum-deviation prism data (Malitson, through Brixner's Sellmeier \
fit); far-infrared interferometry (Randall and Rawcliffe)."""
notes = """Chapter pages 749-763 are pdf pages 1-15; the text is pp. 749-752, Table X pp. \
753-763 (pdf pp. 5-15), Fig. 10 (log-log plot of n and k against wavelength, 0.05-500 um, \
figure only) p. 753. The library's pdf is the Elsevier reprint (the DOI's ISBN, file \
name 'philipp_1997'); the chapter is the 1985 Handbook's. Identity checked against the \
first page.

WHAT TABLE X HOLDS. For every row: photon energy (eV), the wavenumber (cm-1, infrared \
rows only), the wavelength (angstrom to 490 A, micrometre from 0.04959 um: the unit \
switches inside the p. 9 part), n, k, and from p. 12 on k_ABS, 'obtained from \
transmission measurements' (table footnote a). A reference tag in brackets names the \
original of a value and of the values below it in the same column; the ranges by tag \
(text pp. 750-752, pdf pp. 2-4) are the datasets below. 'The wavelength and index of \
refraction n values are given to four places, and the extinction coefficient k values \
are given to three places ... The accuracy of these values does not, in general, \
warrant this precision' (p. 749). Every k printed as a bare mantissa inherits the power \
of ten of the cell above (see the extraction script); the powers were checked on the \
table images, in two full passes, and against the smoothness of k (the only jumps of \
more than a factor 1.6 between neighbouring inherited values are the silicon K edge at \
1815-1860 eV and the oxygen K edge at 529-542 eV).

CROSS-CHECK. eV x wavelength agrees with hc to within the rounding of the printed digits \
on all 442 rows but one, the 22.96 eV row, whose wavelength is printed 0.540 um for \
0.0540 um (erratum below). The wavenumber column agrees with the wavelength on every \
row; at 6.0 eV the printed 0.2066 um is 1e4/48,390 = 0.20665 rounded down (rounding).

RANGES AND STATED ACCURACY (quotes, text pp. 750-752):
- 2000-154 eV (6.199-80.51 A) [17]: 'we have calculated n and k based on the results of \
Henke et al. in the region 80.5-6.1 A by assuming the atomic scattering factors of Si \
and O in appropriate mixture ... The agreement in the overlap region near 82 A with \
data of Rife and Osantowski is remarkable'; the same values would hold for alpha-quartz \
of the same density. No accuracy stated. The density assumed is not stated.
- 82-290 A [16]: 'data of Rife and Osantowski for a high-silica glass with 7.5% TiO2' \
(reflectivity against angle of incidence, synchrotron radiation). NOT PURE SiO2: the \
sample is a titania-silica glass; Philipp uses it as silica. Its two datasets are \
filed under that glass (material SiO2-TiO2), not SiO2. The original is curated \
(rife_1980): the 150-260 A rows are in fact Rife and Osantowski's other sample, the \
Cer-Vit glass ceramic (glass A), moved up by 2 A (see the datasets' notes).
- 300-600 A [15]: Hunter's unpublished reflectivity-against-angle data ('private \
communication of unpublished data (1983)'), which 'show good overlap with the data of \
Philipp and Lamy'. Printed at 300-490 A and 0.0500-0.0600 um.
- lambda <= 0.11 um [9, 10]: 'a smooth curve drawn through both sets of data' (Philipp's \
and Lamy's Kramers-Kronig results; Lamy's using Platzoder and Steinmann's reflectance \
below 0.1 um). 'The deviations of each set of data points from the smoothed curve is \
generally less than 5%. This does not attest to their absolute accuracy, however, \
because in both cases the KK evaluations are based on somewhat arbitrary \
extrapolations of the reflectance for lambda < 0.05 um ... In addition, the reflectance \
values themselves may be in error.' In the overlap with Hunter (0.0496-0.0600 um) the \
two sets differ: at 0.04959 um n = 0.733, k = 0.325 [9, 10] against 0.803, 0.300 at \
0.0500 um [15]; at 0.06199 um 0.859, 0.585 against 0.862, 0.497 at 0.0600 um.
- 0.1107-0.2066 um n [9]: Philipp's n, preferred to Lamy's above 0.11 um because \
Philipp's k at 0.11-0.12 um agrees with Weinberg et al.'s transmission; 'This agreement \
was accomplished with a slight modification of Philipp's results as described in \
Weinberg et al.' (weinberg_1979 shifts Philipp's data by +0.075 eV to align the first \
peak, p. 3111 there).
- 0.1107-0.1291 um k [12]: 'The k values given in the table for 0.11 um <= lambda <= \
0.13 um are taken from' Weinberg et al. (thermally grown films).
- 0.1305-0.1590 um k [12-14]: 'obtained from a smooth curve drawn through the \
transmission results of Weinberg et al., their thickest sample, those of Appleton et al. \
and those of Kaminow et al., sample B2. Care should be taken in using the k values for \
lambda >~ 0.13 um because they may have a component of impurity absorption (especially \
OH) and defect absorption in them. For this reason, no k values are given for lambda >= \
0.163 um.'
- 0.213856-3.7067 um n [7]: Malitson's prism data 'fitted to three- and four-term \
Sellmeier equations, and the values generated by Brixner are given in the table'; 'the \
very precise Sellmeier-equation fits ... are not very reliable for wavelengths outside \
the fitted range'. No k in this range: above ~0.6 um the measured absorption is \
dominated by OH; below, Keck et al.'s intrinsic limit is 'questionable'.
- 3.846-40 um n, and 7.692-26.67 um k [2]: Philipp 1979, Kramers-Kronig analysis of \
reflectance augmented by absorption measurements. 'In the regions of strong infrared \
absorption (k >~ 0.5), the values for n and k given in the table should be reasonably \
good (+-15%) ... In the regions of weak infrared absorption, the k values as given by KK \
analysis are not reliable.'
- k_ABS 3.636-7.407 um [4]: Drummond's absorption spectrum (lambda <~ 7.5 um), \
'duplicated for the most part by Galeener and Lucovsky in the 3.7-7.5 um region, with \
alpha roughly 20% larger'; k 'must be carefully examined for wavelengths below 7.634 um, \
where impurity absorption, especially that associated with OH bonding, can mask \
intrinsic SiO2 absorption'.
- k_ABS 7.692-40 um [2]: Philipp 1979's absorption data: 'perhaps better than the KK \
derived values, they should also be treated as unreliable', because of impurities and \
defects in the samples.
- 100-500 um [1]: Randall and Rawcliffe, interferometric; 'The n values appear to be \
reasonably precise, while the k values may be in error by as much as +-30%.' At 500 um \
the printed k (7.96e-3) is larger than at 250 um (6.96e-3), against the trend of the \
column; kept as printed (no evidence of a misprint).

USE. Philipp's own ranges ([2], [9], the [9, 10] curve) and Hunter's otherwise \
unpublished data are primary. Every other range reproduces another work and is \
'reproduced'; none of those originals is in the library with tabulated values, so they \
remain the best copies available. The temperature is 'room temperature' (p. 749) \
throughout, except Malitson's 20 degrees C. Wavelengths are vacuum values except the \
Malitson rows, which keep Malitson's standard-air line wavelengths."""

