citation = "U. Hohm, \"Experimental static dipole-dipole polarizabilities of molecules\", J. Mol. Struct. 1054-1055, 282 (2013)"
doi = "10.1016/j.molstruc.2013.10.003"
library = "Hohm_2013_ExperimentalStaticDipole"
identity = "VALIDATED_WITH_WARNINGS"
kind = "compilation"
technique = """A compilation of the static (zero-frequency) mean electronic polarizability \
alpha_el(0) of 174 molecules from gas-phase (low-density or single-molecule) \
measurements only: dielectric permittivity (DP; the Clausius-Mossotti value, from which \
the orientation term mu^2/3kT is removed by extrapolation to 1/T -> 0 and the \
vibrational part alpha_vib, usually from infrared intensities (Bishop and Cheung 1982), \
is subtracted), refractive index (RI; Lorentz-Lorenz, extrapolated to zero frequency \
with Kramers-Heisenberg or Cauchy-type equations), molecular-beam deflection, \
electron-molecule scattering, matter-wave interferometry, and semi-experimental dipole \
oscillator strength distributions (DOSD, from photoabsorption and refractivity data). \
Hohm re-evaluates the originals with the CODATA 2010 constants and, where needed, the \
virial coefficients of Dymond et al. (2002) (pp. 1-3)."""
notes = """Identity checked against the first page (version of record, 11 pdf pages = \
journal pp. 282-292). Page numbers are pdf pages. All values in atomic units of \
polarizability (4 pi eps0 a0^3).

WHAT IS TABULATED. Eq. (2), p. 1: alpha(omega) = alpha_el + alpha_vib + alpha_or. The \
tables give alpha_el(0) ('the static electronic part', p. 1); for DP rows also the \
measured alpha_el + alpha_vib and the alpha_vib subtracted (with its reference), \
alpha_el being Hohm's difference. 'Generally all of the available experimental data \
are displayed. One exception is the case of H2, N2, and O2 ... where experimental \
reference values are available. Other exceptions are those favourable cases where all \
of the experimental data do not deviate by more than 0.5 %. Then only a statistical \
mean of at least three values is given. If there is more than one experimental \
investigation available I recommend to use the data point marked with [dagger]. This \
choice in some cases reflects my personal opinion on the experimental results. It is \
unbiased by recent theoretical findings' (pp. 3-4). 'Most of the measurements were \
performed at room temperature' (p. 3); no temperatures are given per value.

HOW THE VALUES ARE RECORDED. Each value Hohm takes from a cited reference is use = \
reproduced with that reference (a curated id where there is one); note that Hohm \
re-evaluates it (zero-frequency extrapolation of RI data, alpha_vib subtraction, \
modern constants), so the number is often not printed in the original. The values \
Hohm forms himself, the 'Mean value' rows and the alpha_el of DP rows (his \
differences), are this source's, use = check: they average or combine data optmat \
already holds (smith_1976, cuthbertson_1920, watson_1936, burns_1986, hohm_1993, \
hohm_1994b, bideau_mehu_1973, stoll_1922, schmidt_2003, bose_1972, st_arnaud_1979, \
kirouac_1973), so fitting them beside those would double count. alpha_vib is recorded \
as polarizability_correction (part pure_vibrational), reproduced from its reference. \
Row ids are the references as printed; a derived alpha_el is named '[ref of the \
total]-[ref of alpha_vib]'. The dagger (recommended) is stated in each dataset's notes.

UNCERTAINTY. The +- of every value is printed without any statement of its level or \
meaning anywhere in the paper: level 'not stated' throughout. The abstract: 'For some \
molecules like H2, N2, and O2 very precise experimental data exist with an uncertainty \
of better than 0.1 %. In general however, the experimental error is much higher.'

TEMPERATURE (p. 2): 'The measured polarizability depends on the temperature due to \
vibrational and rotational excitation of the molecule [40, 41]. Fortunately this \
effect is small and lies in the range of 0.5-1 % per 1000 K [42, 43].' Also (p. 3): \
the remarks CT and HT mark cryogenic (T < ~100 K) or high-temperature (T > ~500 K) \
experiments (none in the curated rows).

TABLES AND EXTRACTION. Tables 1 (homonuclear diatomics), 2 (heteronuclear), 3 \
(triatomics), 5 (penta-atomics) and 7 (hepta-atomics: SF6) are used; the library \
detaches the captions (Table 1's caption sits in the text of p. 2; the unlabelled \
tables are identified by their molecules and the text's table numbers; Tables 6 and 7 \
carry the next table's caption as a footnote). Table 3's body was re-read by OCR \
('all 229 numbers agree with the text layer'); every in-scope row was checked against \
the images. Reference [43] is missing from the extracted reference list (and [116]; \
[187] is out of order); the pdf text shows '[43] E.F. May, M.R. Moldover, J.W. Schmidt, \
Mol. Phys. 107 (2009) 1577-1585' (= may_2009, in the library since 2026-09-27).

NOT EXTRACTED. O3 (Table 3): '18.68 - 19.67 [85]', DOSD, Kumar and Thakkar 2011: a \
range, not a value with an uncertainty (kumar_2011 holds the distributions). Every \
molecule not curated (HF, NO, HCl, H2O, NH3, CF4, the alkali dimers, the other \
polyatomics; 174 molecules in all). The conclusion (p. 8): for polar molecules RI \
results are preferable 'due to their higher accuracy'; for non-polar ones DP 'may \
have the same or even a better accuracy as it is demonstrated for the homonuclear \
diatoms H2, N2, and O2'.

FINDINGS (computed 2026-09-26, 1 au = 0.373802 cm^3/mol as a molar polarizability): \
N2 11.7379 au is the mean of schmidt_2003's two N2 fits (4.38765 cm^3/mol), not a \
printed value; O2 10.587 au is may_2008's recommended 3.9576 cm^3/mol; CO2 19.652 au \
is schmidt_2003's 7.34590; N2O 20.45 au is kirouac_1973's 3.03e-24 cm^3; CH4's DP mean \
17.496 lies between bose_1972 (6.541 = 17.499 au) and schmidt_2003 (17.508-17.517). \
Hohm's alpha_vib for CO, CO2, N2O, CH4 [16] are bishop_1982's to rounding (0.1213, \
1.759, 1.092, 0.2305 au); for CO2 he prefers Thomas et al.'s 2.18 (HITRAN 2.121), and \
for SF6 Pack's 13.83 or Bulanin's 13.73 (HITRAN 13.94; Bishop and Cheung 15.16). CH4: \
the DP electronic value 17.266 +- 0.045 exceeds the RI mean 17.240 +- 0.026 by 0.15 %.

Reproductions: zhao_2026's hohm_2013_* datasets cite this paper (re-pointed there)."""

