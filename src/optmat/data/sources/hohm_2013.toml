unit = "au"
abscissa_unit = "nm"
use = "reproduced"
reproduced_from = ["may_2009"]
notes = "Table 1: alpha_el = 5.4324 +- 0.0005 au, recommended (dagger), DP (dielectric permittivity), 'More data available'; ref. [43], missing from the extracted reference list: the pdf prints [43] E. F. May, M. R. Moldover, J. W. Schmidt, Mol. Phys. 107 (2009) 1577-1585 = may_2009 (re-pointed 2026-09-27). It is may_2009's recommended alpha_e = (8.9568 +- 0.0008) x 10^-41 F m^2 at 273.16 K in atomic units (8.9568/1.648778 = 5.43239, 0.0008 -> 0.00049; checked): normal H2, the static electronic polarizability averaged over the rotational populations at 273.16 K (alpha_vib = 0). The original's uncertainty is one standard uncertainty: level corrected from 'not stated' to '1 sigma'."
[datasets.uncertainty]
