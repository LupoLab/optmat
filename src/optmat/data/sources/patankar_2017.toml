citation = "S. Patankar, S. T. Yang, J. D. Moody, G. F. Swadling, A. C. Erlandson, A. J. Bayramian, D. Barker, P. Datte, R. L. Acree, B. Pepmeier, R. E. Madden, M. R. Borden and J. S. Ross, \"Two-photon absorption measurements of deep UV transmissible materials at 213 nm\", Appl. Opt. 56, 8309-8312 (2017)"
doi = "10.1364/AO.56.008309"
library = "Patankar_2017_TwoPhotonAbsorption"
identity = "VALIDATED"
kind = "measurement"
technique = """Intensity-dependent energy transmission at 213 nm. A mode-locked Nd:YAG \
laser (EKSPLA PL2230) at its 5th harmonic, 60 +- 2.5 uJ, 24 +- 2 ps FWHM (TPA \
autocorrelation in fused silica, Gaussian assumed, deconvolution factor 1.41), 1 Hz; \
the 3 mm beam focused by a 25.4 mm fused-silica lens (effective F/265) to a Gaussian \
spot of 100 um (1/e^2) with a 69 mm Rayleigh range (constant through the samples); \
intensities up to 5.5 GW/cm2; energy varied with a waveplate and polarizer; horizontal \
linear polarization, normal incidence. Energy: an Ophir PD10-C photodiode sensor \
cross-calibrated against six Gentec QE12LP-S-MB pyroelectric sensors; each point \
averaged over 30 shots, the sample removed to measure the input energy. Analysis: \
dI/dz = -alpha I - beta I^2 (Eq. 1), the transmission of a Gaussian beam and pulse \
(Eq. 2, after Sutherland; Eq. 3 q0 = beta (1 - R) I0 (1 - exp(-alpha L)) / alpha), with R \
and alpha measured independently with a spectrophotometer, beta fitted by least chi^2 \
(Eq. 4) (pp. 8309-8311)."""
notes = """Journal pages 8309-8312 = PDF pages 1-4. Identity checked against the first \
page. validation.json flags unmapped glyphs on pp. 8309-8310 (the '+-' of '60 +- 2.5 \
uJ' and '24 +- 2 ps', the '~' of '~1 eV'): text only, checked against the sense; the \
tables are not affected.

WHAT IS HERE. Table 1 (tbl_c8b5daab8ce4, p. 8310): material, manufacturer, thickness, \
band gap with its reference, n0 at 213 nm. Table 2 (tbl_8426527ad90f, p. 8311): \
material, manufacturer, thickness, alpha (cm^-1), beta (cm/GW). Both checked cell by \
cell against the images (2026-09-27): no misread cell. Extracted by \
tools/extract/patankar_2017.py: beta (two_photon_absorption_coefficient, primary, the \
printed +- as sigma), alpha (absorption_coefficient, base e, primary), the band gap \
(reproduced from the cited references, check) and n0 (assumed input, check), one dataset \
per sample; the four fused-silica grades are separate datasets (parameters.grade).

NOT EXTRACTED. LiF beta printed '<0.001' cm/GW, an upper limit ('MgF2 and LiF do not \
show any significant loss in transmission with increasing laser intensity', p. 8311; \
and LiF shows no measurable TPA, p. 8312); LiF's gap (13.6 eV) exceeds the two-photon \
energy (11.8 eV). Sample thicknesses (7, 16.6, 10, 4.5, 6.2, 10.1 mm) are in each \
dataset's notes. Figures (not digitised): Fig. 2(a) the focal spot, 2(b) the \
autocorrelation; Fig. 3 transmission against intensity for all samples; Fig. 4 the \
chi^2 fits for MgF2 and FS—1AK. The abstract's range '0.004 and 0.82 cm/GW' differs from \
the Table 2 note and conclusions ('0.004 cm/GW to 0.86 cm/GW'; BaF2 0.86 is the largest).

UNCERTAINTY. 'The accuracy of the relative transmission measurement was limited by small \
shifts in laser energy to ~0.5%' (p. 8310). 'At 213 nm, the uncertainty in the absolute \
energy value is not defined due to lack of traceable standards [13]; therefore, we use \
the uncertainty value at 248 nm (+-5% at 2 sigma)' (p. 8310). 'Uncertainties in the \
absolute value of the intensity are used to generate error bars for the TPA \
coefficient' (Table 2 note): the +- (about 10 %) has no stated level.

LITERATURE QUOTED (p. 8312), as reproduced datasets where the value is printed: \
Slattery and Nikogosyan [4] at 211 nm, CaF2 0.26 +- 0.05, BaF2 0.58 +- 0.09, fused \
silica 0.50 +- 0.08 cm/GW (slattery_2003: its beta_211 datasets print 26 +- 5, 58 +- 9, \
50 +- 8 x 1e-11 cm/W: agree); Kittelmann and Ringling [3] MgF2 at 193 nm 0.19 cm/GW \
(kittelmann_1994: its Gaussian-fit value 1.9e-10 cm/W: agrees); Taylor et al. [16] 'place \
an upper limit of 0.0013 cm/GW for MgF2' at 248 nm (taylor_1988; a limit, not \
extracted). 'We note that their result for CaF2 ... agrees with the value we measure, \
but the values for BaF2 ... and FS ... are lower than our measurements' (p. 8312). \
Materials not in this list (the nonlinear crystals of Refs. [1], [2]) are only named.

GRADES. The fused silica samples are 'DUV grades of fused silica (FS) designed for ArF \
(193 nm) and KrF (248 nm) lasers' (p. 8309), 'identified by their commercial names': \
FS—1AK (Heraeus; 'SupraSil—1AK' in the Fig. 4 caption), FS—7980 (ArF) (Corning), FS—8655 \
(Corning), FS—312 (Heraeus). 'different grades of fused silica performed near \
identically for two-photon absorption; however, there are differences in linear losses \
associated with purity' (abstract)."""

