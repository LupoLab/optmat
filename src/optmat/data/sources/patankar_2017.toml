notes = "Table 2, 'beta cm/GW' (p. 8311), fused silica, 10.1 mm thick. dI/dz = -alpha I - beta I^2 (Eq. 1), fitted (least chi^2) to the energy transmission against intensity with Eq. (2) for a Gaussian beam and pulse, with the measured reflectivity and alpha (reflection losses removed, (1 - R) in Eqs. 2-3). 24 +- 2 ps FWHM pulses at 213 nm (the 5th harmonic of Nd:YAG), 1 Hz, F/265 focus of ~100 um (1/e^2), up to 5.5 GW/cm2, horizontal linear polarization, normal incidence. 'The error allocated to the best-fit value of beta originates from uncertainties in the absolute laser intensity at focus. The statistical errors associated with the fitting are negligible' (p. 8311); the energy scale is taken as +-5 % at 2 sigma (the 248-nm calibration, p. 8310); the level of the printed +- is not stated. Grade printed 'FS—312', manufacturer Heraeus."
