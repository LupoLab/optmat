notes = "Ar 3p, m = 0 (the orbital along the field) in Tong and Lin's potential, one active electron: the chi-loss 1 - <chi[0,20]> at the end of the run (t = +3 FWHM = 744.14 au): the population beyond 20 bohr, which includes bound excited (Rydberg) population out there and misses slow electrons still inside. Runs ar_scan_NN, NN the row; 800 nm, a Gaussian envelope on the vector potential of 6.0 fs full width at half maximum of the intensity envelope, linear polarisation, carrier-envelope phase 0 (the field's largest maximum at the peak of the envelope); BOX = 80 bohr, angle 0.3, step 0.015 au. The abscissa is the peak intensity, 1.6881e13 to 8.4407e14 W/cm^2 over the ten rows, that of a continuous wave with the peak field's amplitude. The yield of ONE electron in this orbital, not of the atom. From data/external/trecx (PROVENANCE.md there), the numbers as the result table has them. No uncertainty is stated: no convergence runs are retained (the record's notes)."
