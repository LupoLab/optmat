citation = "J. C. Travers, single-active-electron TDSE calculations of the ionisation yields of Ar and He with tRecX (A. Scrinzi, Comp. Phys. Comm. 270, 108146 (2022)), unpublished (2026)"
kind = "theory"
technique = """Numerical solution of the time-dependent Schrodinger equation of one \
active electron in a model potential (Tong and Lin's, tong_2005 Table 1: Ar 3p with m = \
0 and with m = 1, He 1s) with tRecX: velocity gauge, linear polarisation, 30 associated \
Legendre functions in the polar angle (l up to 29 for m = 0), finite elements in r \
(orders 14 and 12 on [0, 2], [2, 20] and [20, BOX] bohr, BOX = 80 for Ar and 80-180 for \
He), infinite-range exterior complex scaling from BOX (angle 0.3 for Ar, 0.15 for He), \
fixed-step RK4 (0.015 au for Ar, 0.0283-0.0129 au for He). Pulses at 800 nm with the \
envelope on the vector potential, A(t) = (E0/omega) g(t) sin(omega t), g a Gaussian or \
cos^8, both of 6.0 fs full width at half maximum of the intensity envelope g^2; the \
field's largest maximum E0 is at the peak of the envelope (carrier-envelope phase 0). \
Ten peak intensities per target, 1.69e13-8.44e14 W/cm^2 (Ar) and 1e14-5e15 W/cm^2 \
(He). The yield is read at the end of the pulse in three ways (the notes)."""
notes = """UNPUBLISHED CALCULATIONS OF J. C. TRAVERS, TIER 3: validators only (use = \
check), ranked below published calculations and measurements; nothing is fitted to \
them (as the curators' notes set out). There is no paper and no library entry: the \
result tables, the scripts that made them, the 51 inputs as run and the runs' READMEs \
are archived in data/external/trecx, whose PROVENANCE.md gives the code's version, the \
date of the runs (11 June 2026), the sha256 of every file, what was checked and the \
caveats. The data files are written from ar_results.csv and he_results.csv there by \
tools/extract/travers_2026_trecx.py, the numbers kept as the tables' strings (four \
significant digits).

THE CODE. tRecX (A. Scrinzi, Comp. Phys. Comm. 270, 108146 (2022), \
doi:10.1016/j.cpc.2021.108146, as the code's README cites it), upstream master fd6da402 \
(30 June 2025) with two local commits of J. C. Travers's; the executable was built \
from the first of them (05f9cdea) with uncommitted changes of pulse.cpp, pulse.h and \
run_trecx.cpp, presumably those committed ten minutes later as 96bc605d ('arbitrary \
field loading'); not checked to be identical. The pulse each run used was checked on \
the field it wrote.

THE MODEL. One electron in Tong and Lin's potential; the ionisation energy is the \
model's, the energy of the initial state: Ar 3p 0.579689 au (15.774 eV; NIST 15.7596 \
eV), He 1s 0.903801 au (24.594 eV; NIST 24.5874 eV). No other electron, no \
polarisation of the core, no spin-orbit splitting. A yield here is the probability \
that the one electron of the one orbital (one m) has left. It is NOT the yield of the \
atom: that needs a rule for the two 1s electrons of He, or the two m = 0 and four |m| = \
1 electrons of Ar 3p, which is a model and is not part of this record.

THE PULSE AND THE INTENSITY. 'I' is the intensity of a continuous wave with the \
amplitude E0 of the field's largest maximum, E0 = sqrt(I / 3.50945e16 W/cm^2) au. The \
envelope is on the vector potential, so the field is not E0 g(t) cos(omega t) (the \
difference is up to 7 % of E0 in the wings of this 2.25-cycle pulse). pulse_fs = 6 is \
the full width at half maximum of the intensity envelope g(t)^2, for the Gaussian and \
for cos^8 alike (cos^8 has the support -666.65 to 666.65 au). One carrier-envelope \
phase only: a few-cycle yield depends on it, and no average over it was made.

THE THREE YIELDS. chi-loss: 1 - <chi[0,20]>, the population beyond 20 bohr at the end \
of the run; it counts bound excited (Rydberg) population beyond 20 bohr as ionised and \
misses slow electrons still inside. norm-loss: 1 - <norm>, what the complex scaling \
absorbed beyond BOX by the end of the run. iSurff: the integral of the photoelectron \
spectrum of a cos^8 run (the continuum only; tRecX's iSurff needs a pulse of finite \
support). In the tables the iSurff yield is 0.64-0.96 of the chi-loss of the same run \
and the norm-loss 0.71-1.00 of it, the differences largest at the low yields: the \
spread of the three is the least uncertainty of 'the yield'. The propagation ends with \
the pulse (Gaussian: at 3 FWHM, the field 2e-6 of its peak). The iSurff yield is biased \
low, not only spread: these runs keep the potential's Coulomb tail at the tSurff \
surface, which tSurff assumes free of potential (TC-703).

UNCERTAINTY: NOT STATED, AND NOT KNOWN. No convergence runs are retained (one \
discretisation per run); the runs' READMEs state that iSurff changes by less than 1 % \
from 30 to 40 angular functions, and that the He yield at 5e15 W/cm^2 is 96.5 % with \
BOX = 160 and 96.2 % with 180, without files to show it. What the tables show: the \
chi-loss of the cos^8 and the Gaussian runs agree to 1.6 % for yields above 1e-7 and \
to 7 % at 1e-8.

EXCLUDED ROWS. (1) The noise floor of the chi- and norm-loss, each 1 minus a number \
close to 1: He at the two lowest intensities (rows 0 and 1) and Ar m = 1 at the lowest \
(row 0). (2) The two highest He intensities (rows 8 and 9), whose runs warn 'norm>1, \
possible instability' 1973 and 2902 times, the norm reaching 3.16 and 3.41 during the \
pulse. The datasets give the numbers. The iSurff yields have no such floor and none is \
excluded, but the smallest (He 1.2e-09, Ar m = 1 1.1e-10) have nothing to check them \
against.

NOT CURATED: the chi- and norm-loss of the cos^8 runs (they duplicate the Gaussian \
runs' to the figures above), the shell and m-averaged combinations of ar_results.csv \
(a model of the atom), and the auxiliary runs of aux_runs.csv (10 fs cos^8 pulses and \
fields from files; not archived).

THE 42 FS ARGON RUNS (September 2026; TC-702). Ar 3p, m = 0, the same model and \
discretisation, in Wahlstrand et al.'s pulse: a Gaussian of 42 fs full width at half \
maximum of the intensity on the vector potential, 17 peak intensities from 4.0e13 to \
1.35e14 W/cm^2, then 1500 au without field; a later build of tRecX that adds the \
bi-orthogonal populations of the field-free bound states (PROVENANCE.md, which also \
gives the checks). The yield curated is the ionised fraction, 1 - (ground + bound \
states up to n = 10) at the end of the pulse, which separates the continuum from the \
excited states (1.2 to 30 % of it); unlike the 6 fs yields it has convergence runs \
(angular functions, radial elements and order, box, step, ECS angle, cutEnergy, \
operator threshold) at three intensities, whose largest change is its stated \
uncertainty. It is one-sided low by about 3 % at 4.0e13 and 1.5 % at 7.8e13 W/cm^2 \
(cutEnergy, converging) and may be high by up to 0.7 % (the n = 11 shell). The \
ionisation energy is the model's, 0.579689 au, as for the 6 fs runs.

THE 6 FS RUNS AGAIN (September 2026; TC-812). The three 6 fs Gaussian scans repeated \
with the build of the 42 fs runs, the pulse from a file, 1000 au without field after \
it and cutEnergy 100 (He rows 0 to 7 only): ionised_gauss6_Ar_m0, ionised_gauss6_Ar_m1 \
and ionised_gauss6_He, the ionised fraction as for the 42 fs runs, with convergence \
runs at three or four intensities per family (0.05 to 1.8 %). They supersede the \
June datasets above as the 6 fs yield: the chi-loss is 1.0 to 1.46 times the ionised \
fraction, the norm-loss 1.0 to 1.10 times and iSurff 0.82 to 1.02 times, and June's He \
rows 0 to 2 are mostly numerical loss. The June datasets are kept as published.

THE STATIC RATES (September 2026; TC-813). static_Ar_m0 and static_Ar_m1: the rate \
-2 Im E of the complex-scaled resonance of the same argon electron in a static field, \
at Zhang et al.'s fields up to 0.2 au, with convergence (0.006 to 7.7 %).

AT 400 NM (October 2026; TC-824). ionised_gauss10_400nm_Ar_m0 and _m1: the A2 set-up
with a 10 fs Gaussian at 400 nm, ten intensities from 3e13 to 1.5e15 W/cm^2, the
ionised fraction with convergence runs (0.05 to 0.32 %).

AT 1030 NM (October 2026; TC-826). ionised_gauss10_1030nm_Ar_m0 and _m1: the same 10 fs
Gaussian at 1030 nm, ten intensities from 1e13 to 5e14 W/cm^2, the ionised fraction
with convergence runs (0.22 to 4.2 % above the floor; rows below it excluded).

AT 800 NM WITH THE 10 FS PULSE (October 2026; TC-830). ionised_gauss10_800nm_Ar_m0 and
_m1: the same 10 fs Gaussian at 800 nm (3.75 cycles), ten intensities from 1.5e13 to
8e14 W/cm^2, so that the three wavelengths share one pulse; convergence 0.096 to 2.3 %.

WALLACE ET AL.'S PULSE (October 2026; TC-836). ionised_wallace_cep0_Ar_m0, _m1 and
ionised_wallace_cep90_Ar_m0, _m1: a 5.5 fs Gaussian at 800 nm (Wallace et al. 2016's
pulse), carrier-envelope phases 0 and pi/2, twelve intensities from 5e13 to 6e14
W/cm^2; convergence 0.33 to 1.5 % (phase 0's, for both).

ATOMIC HYDROGEN (October 2026; TC-843). ionised_gauss15_400nm_H and _800nm_H: H 1s in
the bare Coulomb potential, a 15 fs Gaussian at 400 and 800 nm, ten intensities from
5e13 to 3e14 W/cm^2; convergence 0.002 to 0.06 %.

A 30 FS PULSE AT 400 AND 1030 NM (October 2026; TC-844). ionised_gauss30_400nm_Ar_m0,
_m1 and ionised_gauss30_1030nm_Ar_m0, _m1: the 400 and 1030 nm set-ups and intensities
with a 30 fs Gaussian; convergence 0.14 to 4.1 % above the floor.

KRYPTON AND XENON (October 2026; TC-845). ionised_gauss6_Kr_m0 and _Xe_m0: Kr 4p and Xe
5p (m = 0, one active electron) in zhang_2014's potentials, A2's 6 fs pulse and ten
intensities at 800 nm; static_Kr_m0 and static_Xe_m0, their static rates at 0.03 to
0.10 au. Convergence 0.1 to 1.5 %.

KRYPTON IN WALLACE ET AL.'S PULSE (October 2026; TC-846). ionised_wallace_cep0_Kr_m0
and _cep90_Kr_m0: Kr 4p, m = 0, in the potential of ionised_gauss6_Kr_m0, Wallace et
al.'s 5.5 fs pulse at phases 0 and pi/2 and twelve intensities from 5e13 to 6e14
W/cm^2; convergence 0.27 to 0.73 %.

THE ARGON ATOM IN HACC AND ONE ELECTRON AT ITS IONISATION ENERGY (October 2026; TC-847).
hacc_normloss_gauss6_Ar_c4 and _c3: the norm-loss of the argon atom (all electrons,
antisymmetrised; haCC with the Ar_qz data set, 4 or 3 ion channels, mMax 0) in A2's 6
fs pulse at three intensities. normloss_ipmatched_* and ionised_ipmatched_*: one
electron in Tong and Lin's potential scaled to haCC's ionisation energies (0.560275 and
0.563940 au), the same pulse and intensities, m = 0 and m = 1.

XENON IN WALLACE ET AL.'S PULSE (October 2026; TC-849). ionised_wallace_cep0_Xe_m0
and _cep90_Xe_m0: Xe 5p, m = 0, in the potential of ionised_gauss6_Xe_m0, the same pulse,
phases and intensities; convergence 0.03 to 1.2 %. 23 of the phase-0 runs were
continued from their checkpoints after a time limit.

ONE ELECTRON IN PUBLISHED SIN^2 PULSES (October 2026; TC-858). outside20_sin2_* and
ionised_sin2_*: argon (Tong and Lin's and Pathak et al.'s Muller-Kooiman potentials),
krypton and helium in the pulses of Pathak et al. 2020 and 2022 and Sato et al. 2016 and
2018, read with their measure (the probability outside 20 au at the end of the pulse)
and as the ionised fraction; m = 0 and m = 1; convergence 0.09 to 1.3 %.

THE ARGON ATOM AT 20 FS (October 2026; TC-861). hacc_normloss_gauss20_Ar_c3 and
hacc_normloss_gauss6_Ar_c3m1: haCC's argon (3 channels) in a 20 fs pulse, and with mMax
1 at 6 fs; normloss_ and ionised_ipmatched_c3_* and _c3_20fs_*: one electron at the
3-channel set-up's own ionisation energy in both pulses.

HELIUM WITH TWO ACTIVE ELECTRONS AT 390 NM (October 2026; TC-1050). twoelectron_normloss_*:
the whole atom in A2's 6 fs pulse at 390 nm, 5.69e14 and 3.68e14 W/cm^2 (and BOX 60, |m|
<= 2 at 5.69e14); hacc_normloss_gauss6_390nm_He: haCC's helium in the same pulse;
normloss_ and ionised_ipmatched_390nm_*: one electron at three ionisation energies.
Convergence: two electrons 5.9 % (the box), haCC 2.1 %, one electron 1.7 % (ionised
fraction) and 5 % (norm-loss, the box). The norm-loss of two electrons depends on the
box by construction (each larger box keeps another Rydberg shell bound), while haCC's
does not (its bound states are converged at 40 bohr): the two measure different things,
and the two-electron basis lies about 3 % above its angular limit. The matched,
box-converged measures are travers_2026_pyroraptor's (TC-1092).

XENON IN RMT'S PULSE (part N; October 2026; TC-1093). ground_survival_rmtpulse_m{0,1}_Xe
and _unscaled: the 5p population at 3000 au of one electron in hartmann_2022's field, at
its seven intensities (the RMT ground state's energy, -0.444 au, and part G's own,
-0.4448129 au, at three); hartmann_2022's measure, for the atom against one electron."""

