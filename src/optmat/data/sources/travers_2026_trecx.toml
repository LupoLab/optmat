orbital = "3p"
m = 0
electrons = "one active electron"
potential = "Tong and Lin 2005, Table 1, Ar: V = -(1 + 16.039 exp(-2.007 r) - 25.543 r exp(-4.525 r) + 0.961 exp(-0.443 r))/r"
