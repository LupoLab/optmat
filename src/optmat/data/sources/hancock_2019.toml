interferometry (TG-SSSI) in a 500 um fused-silica witness plate."""
notes = """This is not the paper requested, which was the measurement of absolute n2 of the air \
constituents at 2.5-11 um by Zahedpour, Hancock and Milchberg. The library copy is Hancock, Zahedpour, Goffin & Milchberg, 'Free-space \
propagation of spatiotemporal optical vortices', Optica 6, 1547 (2019) (first page and \
DOI checked): a paper on STOVs with no gas nonlinear data. Its reference list gives the \
paper the request meant: ref. 21, 'S. Zahedpour, S. W. Hancock, and H. M. Milchberg, \
Ultrashort infrared 2.5-11 um pulses: spatiotemporal profiles and absolute nonlinear \
response of air constituents, Opt. Lett. 44, 843-846 (2019)' (DOI 10.1364/OL.44.000843), \
not in the library.

No datasets. The only nonlinear medium is the fused-silica witness plate, whose \
transient-grating chi(3) response is used as a diagnostic without a value; gases are \
mentioned only through the STOVs of femtosecond filamentation in air (the delayed \
rotational response of N2 and O2, ref. 15, Wahlstrand et al. 2012)."""
