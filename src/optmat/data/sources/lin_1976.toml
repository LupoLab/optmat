quantity = "polarizability_anisotropy"
unit = "cm3"
scale = 1e-25
abscissa_unit = "nm"
use = "reproduced"
reproduced_from = ["J. O. Hirschfelder, C. F. Curtiss and R. B. Bird, Molecular Theory of Gases and Liquids (Wiley, New York, 1954)"]
notes = "Table I, Delta alpha (1e-25 esu = cm3), footnote b (Hirschfelder, Curtiss and Bird). Wavelength not stated. The table's temperature column (300 K) is that of the n2 calculation, not of the anisotropy."

