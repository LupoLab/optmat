citation = "D. P. Shelton and J. E. Rice, Chem. Rev. 94, 3 (1994)"
doi = "10.1021/cr00025a001"
library = "Shelton_1994_MeasurementsCalculationsHyperpolarizabilities"
identity = "VALIDATED_WITH_WARNINGS"
kind = "compilation"
technique = """Review of gas-phase measurements (dc Kerr, ESHG, THG, ac Kerr, CARS, DFWM) \
and ab initio calculations of the first and second hyperpolarizabilities beta and gamma \
of atoms and small molecules, with the authors' recommended dispersion fits and a few \
calculations of their own (Table VIII notes h, i: vibrational and rotational gamma in \
the full quantum and classical limits). Experimental values calibrated against He are \
rescaled by the authors to Bishop & Pipin's ab initio He (ref 100 = bishop_1989)."""
notes = """Almost every value here is reproduced from an original paper (named per \
dataset); only the Table VIII values under notes h and i are the review's own. Page \
numbers are the journal's (the PDF page plus 2).

DEFINITIONS (Section II.A, pp. 3-5), the Taylor-series ('T') convention. Eqs 1-3 \
(p. 3): mu_a(nu_s) = alpha_ab(-nu_s; nu_1) E_b(nu_1) + (1/2) K^(2) beta_abc(-nu_s; \
nu_1, nu_2) E_b(nu_1) E_c(nu_2) + (1/6) K^(3) gamma_abcd(-nu_s; nu_1, nu_2, nu_3) \
E_b(nu_1) E_c(nu_2) E_d(nu_3), 'the terms of the Taylor series for the molecular dipole \
mu ... linear, quadratic, and cubic in the amplitudes of the monochromatic components \
of the applied field'; each term is 'an induced dipole fluctuating at the sum \
frequency nu_s = sum_i nu_i'. 'The factors K^(n) are required in order that all \
hyperpolarizabilities of the same order have the same static limit.' The field is \
written E = E_o + E_omega cos(omega t) (p. 6), so the amplitudes are those of \
cos(omega t) and the factors K^(n) 'are essentially the combinatoric and \
trigonometric factors in the multinomial expansion of the n-th power of the sum of \
applied fields' (Table I note a). Table I (p. 4), third order, (-nu_s; nu_1, nu_2, \
nu_3) and K^(3): static (0; 0, 0, 0), 1; dc Kerr (-nu; 0, 0, nu), 3; ac Kerr (-nu_2; \
nu_1, -nu_1, nu_2), 3/2; CARS (-2nu_1 + nu_2; nu_1, nu_1, -nu_2), 3/4; DFWM (-nu; nu, \
nu, -nu), 3/4 ('also called nonlinear refractive index or intensity dependent \
refractive index'); ESHG (-2nu; nu, nu, 0), 3/2; THG (-3nu; nu, nu, nu), 1/4. In the \
static limit all these gamma coincide. Measured gas quantities (p. 4): gamma_par = \
(1/15) sum_{xi,eta} {gamma_xixietaeta + gamma_xietaetaxi + gamma_xietaxieta} (eq 5, \
<gamma>_zzzz, all fields parallel); gamma_perp = (1/15) sum {2 gamma_xietaetaxi - \
gamma_xixietaeta} (eq 7, <gamma>_zxxz); dc Kerr measures gamma_K = (3/2)(gamma_par - \
gamma_perp); statically gamma_par = 3 gamma_perp and gamma_K = gamma_par (= gamma_o). \
'gamma' in the tables is gamma_par, or gamma_K for dc Kerr. ESHG measures {gamma + mu \
beta/3kT} (eq 8, p. 5). dc Kerr measures the molar Kerr constant A_K = (N_A/81 eps_o) \
{gamma + 2 mu beta/3kT + (3/10)[(sum alpha_xieta alpha^(0)_xieta - alpha \
alpha^(0))/kT] + [mu^2 (alpha_zz - alpha)/(kT)^2]} (eq 9), for a homonuclear diatomic \
{gamma + Delta alpha Delta alpha^(0)/5kT}. The paper gives no relation to chi(3) or n2.

UNITS (Table II, p. 5; 1986 CODATA): gamma, 1 au = 1 e^4 a_o^4 E_h^-3 = 6.235 377 x \
10^-65 C^4 m^4 J^-3 (SI) = 7.042 3 x 10^-54 m^5 V^-2 ('SI alternative', 'obtained when \
the right-hand sides of eqs 1-3 are multiplied by eps_o') = 5.036 7 x 10^-40 cm^5 \
statvolt^-2 (esu = cm^6 erg^-1). omega = 1 au is nu = 219 474.630 7 cm^-1, 'where nu \
is the reciprocal of the vacuum wavelength ... (note that experimental wavelengths \
differ slightly from 1/nu since they are measured in air)': the nm column headings \
(632.8, 694.3, 514.5, 1055, 532, 458) are laser lines in air (standard_air here).

DISPERSION (p. 11): below the first electronic resonance gamma_par(-nu_s; nu_1, nu_2, \
nu_3) = gamma_par(0; 0, 0, 0) [1 + A nu_L^2 + B nu_L^4 + C nu_L^6 ...] (eq 18), nu_L^2 \
= nu_s^2 + nu_1^2 + nu_2^2 + nu_3^2 (eq 19), 'where the coefficient A is independent of \
nu_s, nu_1, nu_2, nu_3, but B, C, etc. are not'; nu_L^2 = 2 nu^2, 4 nu^2, 6 nu^2, 12 \
nu^2 for dc Kerr, DFWM, ESHG, THG. gamma_par/gamma_perp = 3 [1 + A' nu_L^2 + ...] (eq \
20), A' = r (1 - 6a) (eq 21), a = (nu_s nu_3 - nu_1 nu_2)/nu_L^2 (eq 22): A' in the \
ratios -1:2:1:0 for dc Kerr, DFWM, ESHG, THG. The relations 'are in fact also valid \
for the electronic hyperpolarizabilities of molecules' but not for gamma^v and gamma^R \
(pp. 11, 14). For H, 'at nu_L^2 = 20 x 10^8 cm^-2 ... the dispersion curves for dc \
Kerr, DFWM, ESHG, and THG ... differ by no more than 0.7%' (p. 11-12). Table VII and \
Table X give the fits (formulas below); they are fitted up to nu_L^2 = 6 nu^2 = 30 x \
10^8 cm^-2, and 'The fitted value of B so obtained will be somewhat sensitive to the \
frequency range of the data used in the fit, but the fitted value of A should be \
reliable' (p. 12).

PARTS (pp. 6-7, 14-17). gamma = gamma^e + gamma^v + gamma^R (Born-Oppenheimer). 'The \
contribution due to vibrational and rotational terms tends to increase in the order THG \
< ESHG < DFWM, ac Kerr, CARS, dc Kerr' (p. 4). For ESHG and THG gamma^R 'will be reduced \
by a typical factor (omega_R/omega)^2 ~ 10^-5 and will be negligible'; for dc Kerr, ac \
Kerr and DFWM 'gamma^R at optical frequencies will be comparable to the static value'; \
in the high-frequency limit gamma_par^R for ac Kerr and DFWM are 2/3 and 8/9 of gamma_K^R \
for dc Kerr, and the static gamma_K^R is 4/3 of its optical value; M-sublevel \
redistribution 'accounts for about 1/4 of gamma^R for the dc Kerr effect' (eqs 31-32, \
p. 14). The experimental gamma^e of H2, D2, N2, O2 (Tables IX, X) are ESHG values with \
calculated gamma^vR subtracted, then extrapolated to the static limit; for H2 the \
subtracted gamma^v may be uncertain by up to +-6 % (+-1 au) in the infrared, 'although \
the actual error is thought to be much smaller' (pp. 16-17). The polyatomic \
experimental values are gamma^ev (Table XII), except CARS with 'vibrational \
contributions of alpha^2 type subtracted'. For CO2 (ESHG) the vibrational \
contribution is 'about 6%' (p. 20).

ACCURACY. 'The reported accuracy of gas-phase hyperpolarizability measurements ...: \
dc Kerr (0.5-100%), ESHG (0.1-20%), THG (3-20%), ac Kerr, CARS and DFWM (5-100%)'; \
'local field corrections are usually much smaller than 1%' (p. 4). The He calculation \
of Bishop & Pipin 'is thought to be better than 0.1%' (p. 11). Reduced-mass \
corrections 'increase the calculated static values of gamma [by] 0.382%, 0.191%, \
0.096%, and 0.019%' for H, D, He and Ne (p. 10); Table IV is without, Tables VI, VII \
with them (He: 43.104 against 43.145). Relativistic corrections reduce gamma by less \
than 1 % for Kr and Xe (p. 10). Intermolecular (pair) effects in the H2 ESHG \
measurements 'are at the 0.1% level' (p. 16, ref 35 = donley_1993). For polyatomics: \
'For the five molecules where there is a pair of independent ESHG measurements at the \
same wavelength ... the average experimental error bar is +-1.3% and the independent \
measurements tend to agree to within their joint uncertainty (reduced chi^2 = 1.3)' \
(p. 20). Measurements of Ne by Shelton & Lu (ref 37) 'have been shown to be invalid' \
(Fig. 3 caption): the anomalous Ne dispersion is 'now discredited' (see shelton_1992).

NOT TABULATED, from the text: local-density static gamma_0 of He, Ne, Ar, Kr, Xe, 88, \
211, 1860, 3950 and 9160 au, and with partial self-interaction corrections 35, 86, 1330, \
3200 and 8350 au (ref 105a,b; p. 9-10), 'values which differ markedly from the \
CCSD(T) results and from experiment': not extracted (inadequate method, per the \
authors). Two-electron scaling gamma_o = 2420 x (Z - 0.5)^-10 au (He to Ne8+, +-3 %, \
p. 10). Figures 1-7 (dispersion plots) are not digitised.

ERRATA IN REFERENCES (not values). Table VII note d attributes the static CCSD(T) Ne \
value to ref 171 and notes k and m the Ar, Kr, Xe values to ref 170; Table IV, Table V \
note a and the Figure 3 and 4 captions give the opposite (170 = Rice et al. 1992, \
'Connected triple excitations ... neon', 171 = Rice et al. 1991, the heavier noble \
gases). The records follow Table IV. Table IX prints O2's static gamma^e as 962 +- 6 \
and Table X as 963 for the same fit (shelton_1990: 60.03e-63 / 6.235377e-65 = \
962.7 au). The library's text of this paper omits references 34 and 35 and 128 and 131 \
(column breaks); read from the PDF page images: (34) Shelton, D. P. Phys. Rev. A 1990, \
42, 2578 (= shelton_1990); (35) Donley, E. A.; Shelton, D. P. Chem. Phys. Lett. 1993, \
215, 156 (= donley_1993); (128) Malik, D. J. J. Chem. Phys. 1988, 88, 2624; (131) \
Bishop, D. M.; Lam, B. Chem. Phys. Lett. 1988, 143, 515.

SPECIES. Only curated species are extracted: He, Ne, Ar, Kr, Xe, H2, D2, N2, O2, CO, \
CO2, CH4, SF6. Skipped: H, H-, the two- to twelve-electron ions and Li to F, Mg, Ca \
(Table IV); H2+, HF (Table VIII); Li2, F2, Cl2, Br2, LiH, BH, CH+, OH+/-, NeH+, HF, HCl, \
NO (Table IX); NH3, H2O (Table XI); CF4, CCl4, C(CH3)4, the halomethanes, HCN, C2H2, \
C4H2, CS2, NH3, CH3CN, C3H6, C6H6 and the other hydrocarbons, H2O, H2S, SO2, CH3OH, \
(CH3)2O (Table XII); all beta values (Tables VIII, IX, XII(a), XIII: first \
hyperpolarizabilities). N2O and O3 do not appear.

DUPLICATE. The library's second copy \
(Shelton_1994_MeasurementsCalculationsHyperpolarizabilities_058fee, same DOI, a \
different PDF file) has the same fourteen tables; every number in every table agrees \
with this copy's (compared 2026-09-26). This copy is used."""

# ---- Table VII: ESHG dispersion of the atoms (p. 12) ------------------------------

[[formulas]]
id = "table7_He_calc"
material = "He"
equation = "Eqs 18-19, p. 11; Table VII, p. 12"
printed = "gamma_par(-nu_s; nu_1, nu_2, nu_3) = gamma_par(0; 0, 0, 0) [1 + A nu_L^2 + B nu_L^4 + C nu_L^6 ...]; Table VII: gamma_o,calc = 43.145 au, A_calc = 0.455 0 x 10^-10 cm^2, B_calc = 0.145 8 x 10^-20 cm^4, C_calc = 0.060 4 x 10^-30 cm^6"
variable = "nu_L^2 = nu_s^2 + nu_1^2 + nu_2^2 + nu_3^2, the vacuum wavenumbers in cm^-1; for ESHG nu_L^2 = 6 nu^2 (nu of the fundamental)"
process = "eshg"
convention = "T"
part = "electronic"
range = "nu_L^2 up to 6 nu^2 = 30 x 10^8 cm^-2 (Table VII note a)"
coefficients = { gamma0 = "43.145", A = "0.4550", B = "0.1458", C = "0.0604" }
coefficient_units = { gamma0 = "au", A = "1e-10 cm^2", B = "1e-20 cm^4", C = "1e-30 cm^6" }
reproduced_from = ["bishop_1989"]
check = "The same coefficients as shelton_1990 Table II in SI (4.550e-11 cm^2, 1.458e-21 cm^4, and C = 6.043e-32 cm^6 once that table's misprinted 10^-31 is corrected), where gamma_0 = 43.104 au without the reduced-mass factor; 43.104 x 1.00096 = 43.145 (the 0.096 % correction, p. 10). Evaluated for THG at 1055 nm (air; nu = 9476 cm^-1, nu_L^2 = 12 nu^2) it gives 45.34 au against Table VI's 45.338, and for dc Kerr at 632.8 nm (nu_L^2 = 2 nu^2) 44.14 against 44.211 (B, C differ by process). Checked 2026-09-26."
notes = "Note c: 'Reference 100, CI-Hylleraas (this dispersion curve is used for calibration of the ESHG experiments; note the misprint for C in SI units in Table II of ref 34)': shelton_1990 Table II prints C = 6.043e-31 cm^6 where 0.0604e-30 = 6.04e-32 is right (shelton_1992: '10^-31 in the last line should be 10^-32'; 6.748 au / 219444.5^6 = 6.043e-32). 'The coefficients given for H and He are estimates of the leading coefficients of the infinite order power series expansion based on the limited ab initio results' (p. 12). Includes the reduced-mass correction (note a). Used by Shelton and co-workers to calibrate every ESHG ratio."

