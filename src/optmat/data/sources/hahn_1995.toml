citation = "J. W. Hahn and E. S. Lee, J. Opt. Soc. Am. B 12, 1021 (1995)"
doi = "10.1364/josab.12.001021"
library = "Hahn_1995_MeasurementNonresonantThird"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Nonlinear interferometry of CARS: two gas cells in series (argon reference, \
sample), with a phase-shifting unit of sliding BK-7 wedges between them; the \
fringe amplitude of the summed CARS signal against the sample pressure (up to 2 bar, \
transducer calibrated to 0.1 %) gives the sample's nonresonant susceptibility \
relative to argon's. BOXCARS phase matching, injection-seeded single-mode Nd:YAG pump \
at 532 nm (< 100 MHz, 7-8 ns) and a single-mode pulsed dye Stokes (about 500 MHz), \
Raman shift 2157 cm^-1 (2334 cm^-1 for CO, CF4, H2), parallel polarizations; \
shot-by-shot normalization to propane's nonresonant CARS."""
notes = """Nonresonant CARS susceptibilities relative to argon, for C2H2, CO2, CH4, N2, O2, \
C3H8, CO, CF4 ('Freon') and H2; acetylene, propane and CF4 are not curated species \
(skipped).

Definitions: the CARS susceptibility of the CARS literature, Eq. (14), p. 1025 (after \
Druet and Taran): chi_CARS(3) = (N/hbar) sum (rho_aa - rho_bb) c^4/(w1 w2^3) (d sigma/d \
Omega) / (w_ba - w1 + w2 + i gamma_ba), N the number density; the off-resonant Raman \
part, Eq. (15), neglects i gamma. Values per amagat, 10^-18 cm^3/(erg amagat). The \
absolute scale is argon's 9.46 x 10^-18 cm^3/(erg amagat) 'reported by Rosasco and \
Hurst' (Table 1 note b): rosasco_1985's 3 sigma/24 = 0.788 x 10^-18 esu times 12 \
(their chi^CARS = 12 chi_1111), the same convention as farrow_1985: chi^CARS = N0 \
gamma_T/2 at 1 amagat, gamma_T = 2 chi^CARS/N0 (1e-18 per amagat = 147.8 au). Eqs. \
(1)-(13) (pp. 1022-1023) model the interference: I ~ 1 + eta^2 + 2 eta cos(...), eta = \
chi_s P_s phi / (chi_r P_r); the fringe amplitude is linear in the sample pressure.

Results: Table 1 (p. 1025) ratio of fringe slopes to argon's (uncertainty 'usually about \
2-3 % and ... no larger than 5 %', p. 1025) and effective chi_NR (ratio x 9.46); Table 2 \
(p. 1025) the off-resonant Raman terms computed from Eq. (15) with Schrotter and \
Klockner's (curated as schrotter_1979) and Martin's cross sections; Table 3 (p. 1026) the electronic chi_NR = \
effective minus off-resonant (checked: CO2 10.8 + 0.35 + 0.62 = 11.77, CH4 26.9 - 4.17 = \
22.73, N2 10.2 - 2.30 = 7.90, O2 7.31 + 0.67 = 7.98, CO 10.3 + 2.03 = 12.33, H2 6.66 - \
0.77 = 5.89 against 5.90 printed). 'The uncertainties of the absolute values of the \
electronic susceptibility ... are estimated to be 10 %' (Table 3 note a); 'overall \
uncertainty ... is less than 5 %' (abstract, conclusion; the relative measurement). \
Check measurement (p. 1026): O2 at 2334 cm^-1, effective 7.28 +- 0.18, off-resonant \
-0.53, electronic 7.81 x 10^-18, 2.1 % from the 2157 cm^-1 value.

Part: the effective values contain the off-resonant vibrational Raman tails at the \
measurement's Raman shift (recorded total); the electronic values subtract the \
computed tails (the subtraction of computed gamma^v; no orientational term \
enters CARS at these detunings). The library text of this paper has glyph errors \
(10^-18 as '10218', cm^-1 as 'cm21', minus signs as '2'); every value was read against \
the table images."""


[[datasets]]
id = "electronic_CO2"
material = "CO2"
file = "CO2/hahn_1995__electronic_CO2.csv"
table = "tbl_c1933c977eba"
quantity = "nonlinear_susceptibility"
unit = "cm3/(erg amagat)"
scale = 1e-18
abscissa_unit = "nm"
use = "primary"
notes = "Table 3 (p. 1026), 'This Experiment': the electronic chi_NR(3), Table 1's effective value minus Table 2's computed off-resonant Raman term, per amagat, at the 532 nm pump and Raman shift 2157 cm^-1; argon's 9.46 (Rosasco and Hurst) is the scale. Uncertainty 10 % absolute (note a). CARS chi^CARS convention (gamma_T = 2 chi/N0)."
[datasets.uncertainty]
relative = 0.1
level = "not stated"
[datasets.parameters]
process = "cars"
convention = "chi_cars_per_amagat"
part = "electronic"
raman_shift_cm1 = 2157

