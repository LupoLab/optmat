citation = "K. T. Tang and K. K. Poon, J. Opt. Soc. Am. 64, 1582 (1974)"
doi = "10.1364/josa.64.001582"
library = "Tang_1974_ContinuedFactorizationMethod"
identity = "VALIDATED_WITH_WARNINGS"
kind = "theory"
technique = """Continued-factorization series for the dynamic polarizability giving upper and \
lower bounds on n - 1 from Cauchy moments and excitation energies, compared with the \
Pade approximants of Langhoff and Karplus (1969); bounded estimates of oscillator \
strengths from the moments."""
notes = """All refractivities at NTP (0 degrees C, 1 atm) with n - 1 = 2 pi N_0 alpha(omega), \
2 pi N_0 = 0.2502e-4 (Tables II-VI, note a): ideal-gas density. Wavelengths are nominal \
vacuum wavelengths. The bounds are rigorous for the moments used, which are \
themselves fits (Langhoff and Karplus's for Tables II-V); the paper shows that for Xe \
those moments are incompatible with Kingston's calculation and the measurements and \
recommends another set (Table I, row 2), used in Table VI. All computed columns are \
checks; the columns reproduced from other papers name them.

Tables VII and VIII (atomic hydrogen) are not extracted (hydrogen atoms are not a \
species of the package); Tables X and XI (argon oscillator-strength bounds) are \
summarised by their converged values, taken from the text. The figures (argon \
refractivity between the resonance lines, Figs. 3-6) are not digitised."""

