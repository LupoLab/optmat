table = "text"
quantity = "oscillator_strength"
abscissa_unit = "hartree"
use = "check"
notes = "p. 6: the continued-factor bounds on the oscillator strengths of argon's two resonance lines from Table IX's moments and Moore's energies (epsilon_1 = omega_1 = 0.4272 au from Table I, epsilon_2 = 0.4347 au from the text): '[f1]_n,2 and [f1]_n,3 have converged to 0.1385 from opposite directions. The value to which f2 converges is 0.1418'; their sum 0.2803 matches Chashchina et al.'s 0.28 +- 0.02 from Wolfsohn's method. Tables X and XI (the bounds for n = 1-18 moments) are not extracted. Derived from Chashchina et al.'s Sellmeier fit: a check."

[[errata]]
dataset = "kingston_1964_table6_Xe"
row = "1900"
column = "value"
printed = "9.984"
corrected = "9.884"
reason = "Kingston's calculated xenon value at 1900 A is 9.884; Tang and Poon's Table VI misreproduces it as 9.984."
evidence = "Kingston 1964, Table I (image tbl_368145603687.jpg) prints 9.884; Tang and Poon's own Table V (previous calculation, same source) prints 9.884; Langhoff and Karplus 1969, Table III, print 9.884. With 9.884 the column's increments grow steadily (0.289, 0.372, 0.499, 0.711, 1.118 from 2200 A down); 9.984 would make them 0.599 then 0.611. Table image tbl_f64c046e444d.jpg shows 9.984."
