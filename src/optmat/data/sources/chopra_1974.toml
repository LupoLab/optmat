citation = "P. D. Chopra and D. W. O. Heddle, J. Phys. B: Atom. Mol. Phys. 7, 2421 (1974)"
library = "Chopra_1974_PolarizationFreeMeasurements"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Rayleigh scattering of H Lyman alpha (1216 A) from a microwave discharge in \
He-H2 (2:1), dispersed by a 1 m Seya monochromator (8 A pass band), through a \
multicapillary gas barrier and a LiF window into a stainless-steel scattering chamber at \
pressures up to atmospheric. The scattered light was observed at 54 deg 44' to the \
incident beam in a plane at 45 deg to the vertical, equally inclined to the principal \
polarisation axes of the grating light, so that the observed intensity is the true \
average and the total cross section follows without a polarisation correction \
('polarization free', Samson 1969). Photomultipliers with sodium salicylate. The \
pressure gradient of (S_p - S_0)/I was compared for pairs of gases in four sequences \
of 6-10 runs of about seven pressures each (H2-Ar, H2-N2, N2-Kr; N2-Xe); water vapour \
removed with a cooled copper-turnings trap (pp. 2422-2423)."""
notes = """Identity unverified by the library; the PDF's cover and header give 'P D Chopra and \
D W O Heddle 1974 J. Phys. B: Atom. Mol. Phys. 7 2421', received 12 June 1974. No DOI \
recorded. Journal pages: PDF page 2 is p. 2421.

The measurement is RELATIVE (Table 1, 'Relative cross sections', p. 2423): argon/hydrogen \
2.40 +- 0.02, nitrogen/hydrogen 2.34 +- 0.02, krypton/nitrogen 3.05 +- 0.06. The format \
has no quantity for a ratio of scattering cross sections, so Table 1 is recorded here \
only. The absolute values of Table 2 are NORMALISED to the hydrogen Rayleigh cross \
section calculated by Dalgarno, Ford and Browne (1971), 2.28 barn at 1216 A, 'believed \
accurate to <1% and takes account of the anisotropy of the molecular polarizability' \
(p. 2423). Shardanand and Mikawa (1967) normalised to a calculated helium value (Chan \
and Dalgarno 1965); Gill and Heddle (1963) to Heddle et al.'s (1963) nitrogen \
refractivity (p. 2425).

Consistency (checked 2026-09-24): argon 2.40 x 2.28 = 5.47, as printed; nitrogen 2.34 x \
2.28 = 5.34 against the printed 5.37 (abstract and Table 2); krypton 3.05 x 5.34 = 16.3 \
as printed (3.05 x 5.37 would be 16.4), but molecular xenon (3.18 x 10^6) x 5.37 = 17.1 \
Mb as printed (x 5.34 gives 17.0). The nitrogen value used is therefore not the same \
in the krypton and xenon results; which is right is not decidable from the paper. Kept \
as printed: TC-69.

Refractivity from Rayleigh scattering (p. 2426): for an atom (rho_n = 0), (n - 1)^2 = 3 \
lambda^4 N_0^2 sigma / 32 pi^3 = 4.8 x 10^16 sigma at 1216 A ('atmospheric pressure \
refractivity'; the constant implies N_0 = 2.69 x 10^19 cm^-3, Loschmidt's number, so \
the state is 1 atm, 0 degrees C, ideal gas). Rayleigh scattering gives (n - 1)^2 only: \
THE SIGN OF n - 1 IS NOT MEASURED. For argon (first resonance 11.62 eV, above Lyman \
alpha's 10.20 eV) n - 1 is positive. For krypton Lyman alpha lies between the \
4p^5 5s (10.03 eV) and 5s' (10.64 eV) resonance lines, beyond the first resonance: the \
paper's own estimate of the contributions (Table 5: -10.3 from the 5s line, +3.9 from \
5s', +2 to +7 from nd, +0.5 Beutler lines, +3.7 continuum, x 10^-4) 'account for at most \
half of the observed value' (8.8 x 10^-4), and the sum can be of either sign. The \
authors suspect contributions to d orbitals or a systematic error from other lines in \
the 8 A pass band or Kr2 molecules (p. 2427).

Xenon: the scattered signal is quadratic in pressure, dominated by Xe2 molecules \
(k = -B = 2.16 x 10^-25 mole^-1 at 298 K; P_Xe2 = 7.0 x 10^-6 P_Xe^2, Torr): sigma(Xe2)/sigma(N2) \
= (3.18 +- 0.15) x 10^6, sigma(Xe2) = 17.1 Mbarn; atomic xenon scattering could not be \
separated. Xe2 is not a species; not extracted. Attenuation cross sections of xenon at \
1216 A (Table 3): atomic sigma_1 = 530 barn, molecular sigma_2 = 18.7 Mbarn (Shardanand \
1967: 500 barn, 18.5 Mbarn), 'less accurate than the results of the scattering \
experiments'; the format has no quantity for a total attenuation (absorption) cross \
section below the ionisation threshold, so they are not extracted.

Wavelength: Lyman alpha, printed '1216 A' throughout (a vacuum wavelength; the line is \
at 1215.67 A); the rows keep 1216 as printed."""

[[datasets]]
id = "rayleigh_Ar"
material = "Ar"
file = "Ar/chopra_1974__rayleigh_Ar.csv"
table = "tbl_6ff9e885d7c3"
quantity = "rayleigh_cross_section"
unit = "cm2"
scale = 1e-24
abscissa_unit = "angstrom"
wavelength_medium = "vacuum"
use = "primary"
notes = "Table 2 'Present work', 5.47 barn at 1216 A (also the abstract): the measured ratio to hydrogen, 2.40 +- 0.02 (Table 1), times Dalgarno et al.'s calculated 2.28 barn. relative = 0.02/2.40; systematic 1 % from the hydrogen normalisation ('<1%')."
[datasets.parameters]
king_factor = 1.0
[datasets.uncertainty]
relative = 0.0083
systematic_relative = 0.01
level = "not stated"

