[[formulas]]
id = "rayleigh_refractivity"
material = "Ar"
equation = "unnumbered, p. 2426, from Eqs. (1) and (2)"
printed = "(n - 1)^2 = 3 lambda^4 N_0^2 sigma / 32 pi^3 = 4.8 x 10^16 sigma, for lambda = 1216 A"
variable = "sigma: Rayleigh scattering cross section in cm^2; lambda = 1216 A; N_0 the number density at atmospheric pressure (not printed; the constant implies 2.69e19 cm^-3)"
state = "1atm_0C"
density = "ideal"
range = "1216 A only; atoms (rho_n = 0)"
coefficients = { constant = "4.8e16" }
check = "3 (1216e-8 cm)^4 (2.687e19)^2 / (32 pi^3) = 4.77e16, the printed 4.8e16. With it, krypton's 16.3 barn gives 8.85e-4 (printed 8.8e-4) but argon's 5.47 barn gives 5.12e-4, not the printed 5.2e-4 (erratum on refractivity_Ar; Mahon 1979 quotes n - 1 = 1.90e-23 N for Chopra and Heddle's argon, i.e. 5.1e-4 at N_0). Checked 2026-09-24."
notes = "Not a dispersion model: a conversion from a Rayleigh cross section to |n - 1| at one wavelength, valid for an isotropic atom (Eq. (1) with rho_n = 0 and Eq. (2), (n^2 - 1) = 4 pi alpha N ~ 2 (n - 1)). Applies equally to krypton (and argon); recorded once. It gives the magnitude only."

[[errata]]
dataset = "refractivity_Ar"
row = "1216"
column = "value"
printed = "5.2"
corrected = "5.1"
reason = "Table 4's 'present work' is derived from the argon cross section with the paper's own relation (n - 1)^2 = 4.8 x 10^16 sigma: sqrt(4.8e16 x 5.47e-24) = 5.12e-4 (5.11e-4 with the unrounded constant), which rounds to 5.1, not 5.2. The same relation reproduces the krypton value (8.85e-4, printed 8.8e-4)."
evidence = "Table image tbl_d63bbf88a338.jpg prints 5.2; Table 2 (image) prints argon 5.47 barn; Mahon et al. (1979, mahon_1979/chopra_heddle_1974_Ar) quote Chopra and Heddle's argon as n - 1 = 1.90 x 10^-23 N, i.e. 5.11e-4 at 2.687e19 cm^-3. Computed 2026-09-24."
