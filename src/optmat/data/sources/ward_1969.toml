citation = "J. F. Ward and G. H. C. New, Phys. Rev. 185, 57 (1969)"
doi = "10.1103/physrev.185.57"
library = "Ward_1969_OpticalThirdHarmonic"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Third-harmonic generation (6943 A -> 2314 A) by a focused, Q-switched ruby \
laser (30 ns, 1-3 MW) in gases at 0-6 atm, behind a glass (or quartz) entrance window; \
the ratio S_H/S_0 of the harmonic signal at high and zero gas pressure gives \
(X/Delta k) of the gas relative to glass, and literature Delta k gives X relative \
between gases. One absolute calibration (helium, uncertain by a factor of 3) from the \
glass signal. Gaussian-beam theory of harmonic generation (Sec. III)."""
notes = """Third-harmonic coefficients chi(-3w; w, w, w) of He, Ne, Ar, Kr, Xe, H2, CO2 \
and N2 at 6943 A (Table III), with the theories and Kerr and dc hyperpolarizabilities \
the paper compares. Ethylene (CH2)2 and Cl2 are not curated species; O2 has only \
(X/Delta k) relative to glass (Table II: S_H/S_0 = 0.34 +- 0.09, 0.41 +- 0.08 (i)), no \
chi, because no Delta k was available; air (not a curated species) has X = 86 +- 17 \
(i), 97 +- 5 (ii) in Table II's relative units (He = 4.0).

Defining equations, exactly (Appendix A, pp. 69-70):
- (A.1) E(r, t) = E^0(r) + sum_i 1/2 [E^wi(r) exp(-i w_i t) + c.c.]; (A.3) P likewise: \
complex amplitudes with the 1/2 (E/2) convention, so E^w is the real amplitude of a \
cosine.
- (A.5) P^ws = K(-ws; w1, w2 ...) X(-ws; w1, w2 ...) E^w1 E^w2 ..., with K = 1 for \
the dc hyperpolarizability (0; 0, 0, 0), 1/4 for THG (-3w; w, w, w), 3 for the Kerr \
effect (-w; w, 0, 0) and 1/2 for SHG (A.8), chosen so that every X of one order tends \
to X(0; 0, 0 ...) as the frequencies go to zero.
- (A.10)-(A.11) X = N [L(ws) L(w1) ...] chi; all L set to 1 for these gases (below \
10 atm): X = N chi, chi per atom or molecule (Eq. (IV.3) p. 68: 'Microscopic \
coefficients chi are obtained by dividing X by the number density').
- (A.12) 'X(-ws; w1, w2, w3) = 1/6 gamma(-ws; w1, w2, w3)', where gamma is the \
coefficient of physical chemistry, 'The factor 1/6 arises from expanding the energy of \
the system as a Taylor series' (page image checked: 1/6; the library text reads 1/8). \
The printed X is the macroscopic symbol; per molecule it means chi = gamma/6.
- Hence chi (Ward) = gamma_T / 6 for every process, with Shelton and Rice's K factors \
(THG: the 3w amplitude is (1/4) chi E^3 = gamma_T E^3 / 24; Kerr: 3 chi E0^2 E = \
gamma_T E0^2 E / 2). Lehmeier et al. 1985 print these values divided by 4 (their \
gamma(3) = gamma_T/24). Checked on the Kerr column: Buckingham and Dunmur's gamma \
(their table, 10^36 gamma = 0.027, 0.051, 0.59, 1.4, 3.9 esu for He-Xe) divided by 6 \
gives 4.5, 8.5, 98, 233, 650, as printed here.
- (III.7) P^(q)(r) = 2^(1-q) X^(q) [E1(r)]^q: the same K = 1/4 for q = 3.
- (IV.4) p. 69: chi^0 ~ chi^K / (1 + 5 w1^2 / (2 wn^2)) ~ chi / (1 + 15 w1^2 / wn^2), \
with wn an effective excitation frequency (Table III column 6, 10^3 cm^-1: He 170, Ne \
130, Ar 93, Kr 80, Xe 67). 'chi derived' (Table III column 5) applies it to chi^K and \
chi^0. It does not reproduce the printed derived values exactly with w1 = 14403 cm^-1 \
(6943 A): He from 4.5 gives 4.90 (printed 4.9), Ne from 8.5 9.77 (9.8), Ar from 98 \
125.7 (127), Kr from 233 320 (317), but He from 3.66, 3.58, 3.59 gives 3.98, 3.97, \
3.98 (printed 3.88, 3.87, 3.88), Ne from 10.4 12.3 (12.0), Ar from 194 264 (250), Xe \
from 650 987 (962): 1-6 % off (computed 2026-09-26).

Uncertainties: 'Absolute uncertainties are large (x 3^+-1) but ratios are good to about \
20 %' (p. 69, conclusion). Table III's +- (not defined further) are the ratio \
uncertainties; Table II's X (arbitrary units, scaled to He = 4.0, same values) prints \
smaller ones (Ne +-1.0, Ar +-12, Kr +-57, Xe +-150, H2 +-7, CO2 +-13, N2 +-11) and the \
abstract mixes the two (Xe +-150 and N2 +-11 from Table II, the rest from Table III). \
The absolute helium value is 7 x 3^+-1 (i) or 24 x 3^+-1 (ii) (Eq. (IV.3), p. 68), from \
(eta X/Delta k)_glass = 1.1e-18 esu (IV.1) and (X/Delta k)_He = 5e-19 (i) or 17e-19 \
(ii) esu (IV.2); it was 'refined and reduced by 30 % since publication in Ref. 3' \
(New and Ward 1967, Table III caption).

The sign ambiguity of Eq. (III.50) gives two sets, (i) and (ii); binary mixtures rule \
out mixed choices, and 'set (i) represents the correct resolution' (p. 69): set (ii) \
is recorded as excluded. Ward and Elliott 1984 (ward_1984, p. 1004) later establish \
rigorously, with helium among their gases, that q = -1 (set (i)) 'for all gases \
studied in Ref. 1'. Every value other than helium's is 'normalized to chi_He = \
4.0 x 10^-39 esu/atom', the Sitz and Yaris theory (Table III caption and p. 69): they \
are measured ratios to helium times 4.0, not absolute measurements. Dawes's theory \
values are 'similarly normalized'.

Densities: Delta k at STP from the literature (Table II: Cuthbertson 1932 for He and Ne, \
Quarder 1924 for Ar, Koch 1949 for Kr and Xe, International Critical Tables for H2, \
CO2, N2, air); the relative X are at STP, so ratios of chi at equal density. The \
wavelength 6943 A is the ruby line as printed."""


