citation = "S. Marchetti and R. Simili, Infrared Phys. Technol. 47, 263 (2006)"
doi = "10.1016/j.infrared.2004.12.005"
library = "Marchetti_2006_AccurateMeasurementRefractive"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Differential Fabry-Perot interferometry at 10.57 um: a pulsed, single-mode, \
tunable RF-excited CO2 laser (linewidth < 13 MHz) probes two equal 222.4 cm resonators, \
one containing a 208.9 cm gas cell with ZnSe Brewster windows; the fringe shift is \
counted while the pressure changes and then measured differentially between two \
extreme pressures at the same temperature. Table temperature to 0.1 degrees C; air \
drift of the reference resonator corrected (0.35 FD per degree C) (pp. 263-265)."""
notes = """Values are pressure coefficients alpha_P with n = 1 + alpha_P P, 'measured at \
23 degrees C' (Table 1, captioned '@ 296 °C', i.e. 296 K), in 1e-4 per atm; the \
uncertainty in the last digits is printed under each value. The abstract claims 'alpha_P \
has been measured with 5e-3 accuracy' (true for CO2, N2, O2; helium's 0.326(12) is \
3.7 %). The level of the uncertainties is not stated. Here each alpha_P is the \
refractivity at 1 atm and 296 K, with the ideal-gas density (the paper converts with \
the perfect-gas relation, Eq. 3, and uses no virial correction).

Table 2's alpha_rho = (n - 1)/rho in cm^3/mol (not the Lorentz-Lorenz molar \
refractivity, which is about 2/3 of it) is Table 1 times R T for this work, and \
compares Simmons (1978; 10.59 and 0.633 um), Achtermann et al. (1991; 0.633 um) and \
theory: Edlen (1966) and Old, Gentili and Peck (1971) for CO2, 'as reported in' \
Ciddor (2002), and Ciddor (1996) for air. The datasets store it as a refractivity per \
density with scale 1/N_A = 1.6605390671738466e-24 (cm^3 per molecule), at the state \
1 atm, 296 K (ideal gas): the conversion is linear, so the state matters only \
through Lorentz-Lorenz. The authors think Simmons's values 'instrumentally \
overestimated' (p. 266). Air is not a curated species and is skipped; the paper's \
'synthetic air' 0.19 O2 + 0.81 N2 agrees with its air value.

Wavelengths: 10.57 um (the laser line; the medium is immaterial at this precision), \
10.59 and 0.633 um as printed."""

[[datasets]]
id = "alpha_p_CO2"
material = "CO2"
file = "CO2/marchetti_2006__alpha_p_CO2.csv"
table = "tbl_fcf07d146f15"
quantity = "refractivity"
scale = 1e-4
abscissa_unit = "um"
wavelength_medium = "vacuum"
state = { pressure_atm = 1, temperature_k = 296 }
density = "ideal"
use = "primary"
notes = "Table 1, alpha_P of CO2 at 10.57 um, 23 degrees C, as the refractivity at 1 atm."
[datasets.uncertainty]
column = true
level = "not stated"

