material = "H2"
file = "H2/buckingham_1968b__table1_A_K_H2.csv"
table = "tbl_4157737602db"
quantity = "molar_kerr_constant"
unit = "esu"
scale = 1e-14
abscissa = "temperature"
abscissa_unit = "K"
use = "check"
notes = "Table 1 (p. 263): the first Kerr virial coefficient A_K (the zero-density molar Kerr constant, per mole, e.s.u.) of H2 for 17 sets at 245.4-332.4 K, 25-85 atm, 6328 A. Includes the orientation term. Reproducibility better than +-2 %; uncertainty (calibration) 'could be +-5 %' (p. 264), recorded as a relative 5 % (level not stated). Superseded by tammer_1990/tammer_1992."
[datasets.uncertainty]
relative = 0.05
level = "not stated"
[datasets.parameters]
