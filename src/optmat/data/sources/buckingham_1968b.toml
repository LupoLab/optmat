citation = "A. D. Buckingham and B. J. Orr, \"Electric birefringence in molecular hydrogen\", Proc. R. Soc. Lond. A 305, 259 (1968)"
doi = "10.1098/rspa.1968.0117"
library = "Buckingham_1968_ElectricBirefringenceMolecular"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Absolute dc Kerr effect of H2 (British Oxygen high purity, > 99.9 %) at 6328 A \
(Spectra-Physics 125 He-Ne laser) with the phase-sensitive apparatus of Boyle et al. \
1966 and Buckingham & Dunmur 1968, the Kerr cell jacketed and thermostatted (-30 to +60 \
C, +-0.2 C, electrodes 46 cm); 25-85 atm, fields 7-9 kV/cm; over 220 measurements in 17 \
sets, one temperature each. mK0 = (2/27) V_m (n_Z - n_X)/F_Z^2 fitted per set to mK0 = \
A_K + [B_K + A_K(2 A_eps + A_r/2)] V_m^-1 (Eq. 11), molar volumes from Michels & \
Goudeket's virial coefficients, A_eps = 2.02 and A_r = 2.06 cm^3. D2 (Matheson, > 99.5 \
%) at 12 atm only, ten temperatures from -30 to +32 C (pp. 262-263)."""
notes = """Pages are the journal's (259-269); pdf page 1 is the JSTOR cover, so p. = pdf \
page + 257. Not to be confused with buckingham_1968 (Buckingham & Dunmur, the inert \
gases). The library's validation notes a table without caption (the B_0 table of p. 262) \
and an unmatched figure (Fig. 1); Tables 1 and 2 agree with their images.

THEORY (pp. 260-262): the quantum theory of the Kerr effect of a dilute gas of 1Sigma \
diatomic molecules. pi_ab = alpha_ab + beta_ab,c F_c + (1/2) gamma_ab,cd F_c F_d (Eq. 2; \
the Taylor-series convention); gamma = (1/10)(3 gamma_ab,ab - gamma_aa,bb) (Buckingham's \
dc Kerr gamma_K); mK = (2/27) V_m lim (n_Z - n_X)/F_Z^2 (Eq. 7); for non-dipolar \
molecules mK = (4 pi N/405){5 gamma + (kT)^-1 (alpha_par^(0) - alpha_perp^(0))(alpha_par \
- alpha_perp)(1 - sigma_0 + (8/15) sigma_0^2 + ...)} (Eq. 9), sigma_0 = hcB_0/kT: the \
quantum correction factor is 0.76 for H2, 0.87 for D2, 0.99 for N2 at 300 K (p. 262, B_0 \
= 59.34, 29.91, 2.00 cm^-1). Appendix Eq. (A9) gives the form with nuclear-spin \
statistics. shelton_1987b later finds the optical-frequency orientation term 3/4 of this \
classical form ('Buckingham's ansatz ... is only valid in the static limit').

RESULTS. Table 1 (p. 263): A_K and B_K per set; 'It is estimated from table 1 that A_K \
can be determined with a reproducibility better than +-2 %. However, the uncertainty of \
the measurements, which is dependent on the calibration of voltmeters and the nulling \
Kerr cell, could be +-5 %' (p. 264). gamma (p. 264): from each A_K with Eq. (9), \
(alpha_par^(0) - alpha_perp^(0)) = 0.300 A^3 (Kolos & Wolniewicz 1967), (alpha_par - \
alpha_perp) = 0.314 A^3 at 6328 A (Bridge & Buckingham 1966), hcB_0/k = 85.37 K: Table \
2; 'Their mean value is 0.277 e.s.u. and their standard deviation +-0.008 e.s.u. The \
absolute error, due to calibration uncertainties, is not greater than +-0.03 e.s.u.' \
(abstract: (0.28 +- 0.03) x 10^-36 e.s.u.). In au (5.0367e-40 esu): 550 +- 60. The gamma \
term is only about 45 % of A_K and depends on the assumed anisotropies. D2 (pp. 264-265): \
A_K 'calculated by assuming that B_K for deuterium equals that of hydrogen ... Their \
average value is (5.9 +- 0.6) x 10^14 e.s.u.' (misprinted exponent, erratum below); \
gamma(D2) '0.24 +- 0.05 e.s.u.' (10^-36), 'less than 10^36 gamma for H2 by 14 %', more \
than the 1 % expected. B_K(H2) = (1.34 +- 0.2) x 10^-12 e.s.u. over the range, no trend \
detected; calculated from the pair anisotropy 6 alpha^2/R^3 and a Lennard-Jones \
potential (29.2 K, 2.87 A): 0.50, 0.58, 0.66 at 332, 284, 245 K, 'considerably smaller \
than the experimental result' (p. 266). Slope dA_K/dT^-1: experiment (8.0 +- 2) x \
10^-12 e.s.u. deg against the quantum 6.8 x 10^-12 at 284 K and the classical 12.75 x \
10^-12 (p. 266). Fig. 1: the A_K points scatter +-1.3 % about the curve from the mean \
gamma (p. 266). Other values quoted, not stored: Bruce 1933's upper limit 10^14 mK0 < \
8.5 e.s.u. (82 atm, 4550 A) against this work's 6.2 at 35 C and 82 atm; Guillien's liquid \
H2 mK; J. F. Ward's THG 10^36 gamma_thg = 0.45 +- 0.05 e.s.u. at 6943 A (personal \
communication); McLean & Yoshimine's calculated static gamma_3333 = 0.20 x 10^-36; the H \
atom's 0.6714 x 10^-36 (Sewell 1949).

SUPERSEDED: tammer_1990 (and tammer_1992, after its field calibration) measured the \
same quantity ten times more precisely; tammer_1990 Table 2 lists this paper as 3.43(37) \
x 10^-62 C^4 m^4 J^-3 (H2) and 3.0(6) (D2), i.e. 0.277 and 0.24 x 10^-36 esu, and finds \
its B_K^(4) twice its own. All datasets here are use = 'check'.

Reproductions elsewhere: bishop_1991/expt_dc_kerr_H2 (row buckingham_orr_1968, 550 +- 60 \
au), tammer_1990/table2_literature_* ('ref 3'), carusotto_1992 notes (3.81 and 3.31 x \
10^-17 cm^2 statV^-2 amagat at 245 and 332 K: not values printed here, a conversion of \
Table 1), hellwarth_1990/kerr_buckingham_orr_H2. Not edited here, citing this paper: \
lundeen_1983, rosasco_1985, ward_1979, ward_1969."""

[[datasets]]
