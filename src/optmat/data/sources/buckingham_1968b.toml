[[errata]]
dataset = "text_A_K_D2"
row = ""
column = "scale"
printed = "100000000000000.0"
corrected = "1e-14"
reason = "p. 264 prints the D2 average A_K as '(5.9 +- 0.6) x 10^14 e.s.u.'; a molar Kerr constant of 10^14 e.s.u. is impossible, and Table 1 gives H2's as '10^14 A_K (e.s.u.)' = 5.5-6.3, i.e. A_K = 5.5-6.3 x 10^-14 e.s.u.; D2's must be of the same order (the orientation term is somewhat larger and gamma similar)."
evidence = "Page image of p. 264 checked: '(5·9 ± 0·6) × 10^14 e.s.u.' is printed, not an extraction error. Table 1 (p. 263, image checked) heads the H2 column '10^14 A_K (e.s.u.)'. Checked 2026-09-26."
