coefficients = { N_a = "122.0", f_H = "0.11", n_K = "1.55", E_K = "1842", n_L = "8.33", E_L = "103", E_g = "1.723", E_h = "22", E_c = "3.455", B_c = "1.180", alpha_x = "0.221", E_x = "8", alpha_u = "0.025", E_u = "0.05", alpha_loc_1e6 = "13.2", E_loc = "0.597", B_loc = "0.353" }
