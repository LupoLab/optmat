notes = "PJDOS-EX: four free parameters for the valence excitations; E_h and E_x fixed at 22 and 8 eV from Kang's tight-binding and Jochym's DFT calculations (p. 238). Fit quality (Table 2): chi = 1.173 (all data), chi_E = 4.450, chi_R = 1.418, chi_T = 1.657, chi_IRT = 0.967; mass density rho = 2348 kg m^-3 (from N_a and f_H, Eq. (38)). A separate fit adding an offset eps_inf gave eps_inf = 1.012, chi = 1.173 (Table 2, last rows; eps_inf is incompatible with the sum rule and is used only as a diagnostic, p. 239). 'The values are rounded according to their estimated statistical errors' (caption). Fixed values (footnote a) are listed in fixed. Phonon terms: the formula phonons. The same Urbach tail (Eq. (12)), core terms (Eqs. (13)-(15)), phonon Gaussians (Eqs. (16)-(19)) and localized-state Gaussian in all six models (p. 237)."

