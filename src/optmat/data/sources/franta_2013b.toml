citation = "D. Franta, D. Nečas, L. Zajíčková, I. Ohlídal, J. Stuchlík and D. Chvostová, \"Application of sum rule to the dispersion model of hydrogenated amorphous silicon\", Thin Solid Films 539, 233 (2013)"
doi = "10.1016/j.tsf.2013.04.012"
library = "Franta_2013_ApplicationSumRule"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Three a-Si:H films (#1654, #1655, #1656; 540, 53 and 212 nm) by plasma-enhanced \
CVD from pure silane (25 Pa, 30 sccm, 13.56 MHz, 0.06 W cm^-2, substrate at 220 C) on \
double-side polished c-Si (p. 237). Ellipsometry 0.6-8.9 eV (Jobin Yvon UVISEL, \
0.6-6.5 eV, 55-75 degrees; Woollam VUV-VASE, 4-8.9 eV, 65 and 75 degrees), near-normal \
(6 degrees) reflectance 1.13-6.5 eV and transmittance 1.13-1.38 eV (Perkin Elmer Lambda \
45), IR transmittance 0.046-0.93 eV (Bruker VERTEX 80v) (p. 237). All data fitted \
together (multi-sample) with six dispersion models built on the sum rule; structural \
model: c-Si substrate, homogeneous film with a rough overlayer (Rayleigh-Rice) on the \
front and a smooth one on the back; overlayers taken as fused silica from Palik's \
handbook (philipp_1985); c-Si from the authors' own unpublished model (p. 237)."""
notes = """Journal pages 233-244 = pdf pages 1-12. Identity (six authors) checked against \
the first page. The companion theory paper is franta_2013 (ref. [16], 'Application of \
Thomas-Reiche-Kuhn sum rule to construction of advanced dispersion models'); this paper \
applies it to a-Si:H. All values refer to films (form = film).

EQUATION MAP, for the implementation (E photon energy in eV; each term is a normalised \
dielectric function of unit transition strength, Eq. (3), times N_t, Eq. (4)):
- Eq. (6), p. 234: eps_r^0 by Kramers-Kronig from F^0; eps_i^0 = F^0/E.
- Eq. (7), p. 234: the valence-to-conduction interband term with an asymmetric, \
Lorentz-modified JDOS, eps_i,vc^0 = sgn(E) (|E| - E_g)^2 (E_h - |E|)^2 / (C_N E^2 [(|E| - \
E_c)^2 + B_c^2]) on (E_g, E_h): franta_2013's Eq. (59) with kappa = 2, nu = 1. It is NOT \
implemented in optmat.solid.udm (whose interband term is the symmetric one, Eq. (56) \
there). Appendix A (p. 242) gives its C_N and real part in closed form. Checked \
here (2026-09-26) with the PJDOS-EX parameters (E_g 1.723, E_h 22, E_c 3.455, B_c 1.180 \
eV): Appendix A's C_N = 855.9099 equals the quadrature of Eq. (7)'s numerator times E to \
double precision, and its real part equals the numerical Kramers-Kronig transform to \
about 1e-12 at 0.5-30 eV. (An earlier reading had found the same.)
- Eqs. (9)-(11), p. 234: the higher-energy valence term, E_xi = E_g/2 + E_x; the same as \
the implemented term (udm._higher).
- Eq. (12), p. 235: the Urbach tail (four parts), with 'E_m = E_g/2 + E_h/2', the mean \
energy of the interband transitions, as SPIE 9628 (franta_2015b) Eq. (33) defines it. \
Appendix B (pp. 242-243): its real part and C_N. The functional form is udm._urbach's; \
optmat calls it with E_h in place of E_m, following the authors' later program (TC-321, \
finding 1). Which of the two this paper's fits used is not stated.
- Eqs. (13)-(15), p. 235: core (K, L) terms, replaced by the constant 2/(3 pi E_zeta^2), \
E_zeta = E_K + E_g/2 or E_L + E_g/2; E_K = 1842 eV, E_L = 103 eV; n_K = 1.55 and n_L = \
8.33, Shiles et al.'s values for aluminium (p. 236).
- Eqs. (16)-(19), p. 235: phonon Gaussians with the Dawson-integral real part; E_p = h c \
nu_p, B_p = h c beta_p / (2 sqrt(2 ln 2)) (beta_p the FWHM). The same as the \
implemented term (udm._gaussian). Hazard: the library's LaTeX of Eq. (19) reads '2 \
sqrt(2) ln 2'; the page image has the root over '2 ln 2'.
- Section 2.6, p. 235: localized-state transitions, one Gaussian (E_loc, B_loc, N_loc).
- Eqs. (20)-(23), p. 236: the alternative interband forms (Tauc-Lorentz, Campi-Coriasso, \
Cody-Lorentz, and the two-exciton extension). Appendix C (Tauc-Lorentz real part and \
C_N, three branches) is scrambled in the library's Markdown (its lines interleave with \
Appendix B's): use the page image (pdf page 11, p. 243).
- Eqs. (24)-(35), pp. 236-237: the total strength N = N_e + N_Si + N_H, N_e = (14 - 13 \
f_H) N_a, N_Si = 0.003829 (1 - f_H) N_a, N_H = 0.000545 f_H N_a; N_K = n_K (1 - f_H) N_a, \
N_L = n_L (1 - f_H) N_a; N_TO = alpha_TO N_Si, N_p = alpha_p N_H; N_ve = N - N_K - N_L - \
N_ph; N_vx = alpha_x N_ve, N_u = alpha_u N_ve, N_loc = alpha_loc N_ve; N_vc the rest. The \
library's Markdown reads 'F_a' in the parameter list (p. 237); the PDF prints N_a.

DENSITY (not a vocabulary quantity for the mass density; notes only). With the \
PJDOS-2EX value N_a = 118.3 eV^2 and f_H = 0.11 (p. 237): atomic density 5.462e28 m^-3 \
(Eq. (36), the dataset atom_density), electron density 6.866e29 m^-3 (Eq. (37)), mass \
density 2277 kg m^-3 (Eq. (38)); Menna's flotation value for similar films is 2300 kg \
m^-3, and 2200-2300 kg m^-3 is taken as the expected range, a criterion for the models \
(pp. 237-238). Table 2 gives rho per model (1898-2391). c-Si has N_e = 6.991e29 m^-3 \
(p. 241). f_H = 0.11 was fixed from earlier IR analysis of similar films (p. 237). \
franta_2013's Table 1 gives a-Si:H N_a = 122.9 eV^2 and 5.674e28 m^-3 'determined from \
optical data', not from this paper's Table 2.

OTHER VALUES (notes only): Table 1 (p. 237), deposition time 40, 4, 16 min; film \
thickness 540, 53, 212 nm; overlayer thickness 2.38, 2.12, 2.52 nm; rms roughness 0.52, \
0.47, 0.50 nm; autocorrelation length 2.18 nm (all three) for #1654, #1655, #1656. Eq. \
(42) alpha_H = 0.381, Eq. (43) alpha_Si = 2.8e-4, Eq. (45) effective charges e*_H/e = \
0.617, e*_Si/e = 0.23 (p. 241); for c-Si (unpublished) alpha_Si = 3.14e-5, e*_Si/e = \
0.0784 (Eq. (46), p. 241). Section 4.5 (pp. 241-242): eps_K(0) = 1.2e-5 and eps_L(0) = \
0.0204, so a Tauc-Lorentz eps_inf should be fixed at 1.02 (Eq. (47)); Eqs. (48)-(49) give \
N_a from TL parameters with n_ve ~ 4.12. The Urbach tail and localized-state results 'are \
not reliable because both effects are weak and the samples were composed of substrates \
and films optically similar in the transparent region' (p. 240). Figures 3-6 (eps of the \
films, fits, DOS/JDOS comparison, n and k of a-Si:H and c-Si): not digitised.

refractiveindex.info has no page for this paper (checked in data/external)."""

