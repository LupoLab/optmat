citation = "T. D. Raymond, N. Böwering, C.-Y. Kuo and J. W. Keto, \"Two-photon laser spectroscopy of xenon collision pairs\", Phys. Rev. A 29, 721-734 (1984)"
doi = "10.1103/PhysRevA.29.721"
