reproduced_from = ["M. N. Shneider, A. M. Zheltikov and R. B. Miles, Phys. Plasmas 18, 063509 (2011)"]
notes = "Table 2 (p. 8), R13: 'e + O2+ -> O + O, 2 x 10^-13 (300/T_e) [m^3 s^-1]'; the value of kossyi_1992/dr_O2+."
