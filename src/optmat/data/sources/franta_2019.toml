check = "Generated from the library JSON cells by a scratch script (value and parenthesised uncertainty split) and compared with the table image (2026-10-14). The column '4-th fit in [12]' is franta_2018's 4th fit rounded, and confirms that franta_2018 Table I prints its e_j without the factor 1e-4 (franta_2018 -1.748, 33.153, 18.635). e_0 from Eq. (21): -2.33e-4 (1st-3rd fits), -2.45e-4 from the rounded '4-th fit in [12]' (franta_2018 prints -2.3741e-4); e(293.15 K) = -1.77e-5 for the three new fits."
