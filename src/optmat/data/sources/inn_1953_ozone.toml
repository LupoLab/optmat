material = "O3"
points = [["weak continuum 4000-7500 A", "1", "2e-5"]]
table = "text"
quantity = "oscillator_strength"
abscissa = "label"
use = "check"
notes = "p. 872: 'Underlying the broad bands in this region we note a weak continuum starting from about 4000A and extending beyond 7500A. The f value calculated for this absorption continuum was about 2 x 10^-5' (printed '2 x 10^-5', approximate). The continuum under the Chappuis bands, not the Chappuis band total. Index abscissa. A check."
