quantity = "oscillator_strength"
abscissa = "label"
use = "check"
notes = "p. 872: 'The oscillator strength or f value of this continuum was calculated to be 0.088' (the continuum underlying the Hartley bands, Region 1, 2000-3000 A; how it was integrated is not stated). Index abscissa: an integrated strength over the band, not a line. Compare kumar_2011's interval strength of the 4.35-5.39 eV interval (0.079). A check."

