citation = "W. F. Chan, G. Cooper, X. Guo, and C. E. Brion, Phys. Rev. A 45, 1420 (1992)"
doi = "10.1103/physreva.45.1420"
library = "Chan_1992_AbsoluteOpticalOscillator_ec241a"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Dipole (e,e) spectroscopy (part II of the series whose part III is chan_1992). \
Low resolution (about 1 eV FWHM, 8 keV impact energy, zero scattering angle): \
electron-energy-loss spectra 15.7-250 eV (steps 0.1, 0.5, 1 and 2 eV in 15.7-25, 25-50, \
50-120, 120-250 eV) converted to relative optical oscillator strengths with the \
spectrometer's Bethe-Born factor; the part above 250 eV from a fit A E^-B to 120-250 eV \
(B = 1.959; 17.6 % of the valence-shell total); the absolute scale by Thomas-Reiche-Kuhn \
normalisation of the whole area to 8.34 (eight valence electrons plus 0.34 for Pauli-excluded \
transitions), independent of any optical measurement (pp. 3, 6). High resolution (0.048 eV \
FWHM, 3 keV; also 0.072 and 0.098 eV): spectra 16-26 eV converted with the averaged \
Bethe-Born factor B_HR and normalised at 25 eV to the low-resolution data; peaks above 19 eV \
deconvoluted, nd[1/2] and nd[3/2] of the 2P_3/2 series fitted as one peak (p. 10). Energy \
scale: the 3s' peak at 16.850 eV (Moore) at low resolution, the He 21.218 eV line admitted \
with the sample at high resolution (p. 6). Matheson neon, 99.99 %."""
notes = """Part II of the series (neon); part III (argon, krypton, xenon) is chan_1992, \
part I (helium) chan_1991. Values per atom; no density or state involved. Page numbers are the library pdf pages (journal page = pdf page + 1419).

Continuum (Table I): df/dE in 10^-2 eV^-1 at photon energy E (eV), 21.6-250 eV, from the \
low-resolution spectrometer. The paper states no uncertainty for these values. The 45.0 eV \
point (7.45) sits on the 2s -> 3p autoionising resonance (maximum at 45.550 eV, p. 12). \
The high-resolution 40-55 eV autoionising spectrum (Fig. 3) and the 16-26 eV discrete \
spectrum (Fig. 2) are figures only and not extracted; the text gives the resonance \
energies 44.999 (2p^-2 3s3p), 45.550, 47.127, 47.677, 47.975 eV (2s -> np, n = 3-6) and a \
peak X at 43.735 eV (p. 12), not extracted.

Discrete lines (Tables II-IV): the present oscillator strengths with their estimated \
uncertainties in parentheses ('~5% for the lower energy resolved transitions and <= 10% \
for those such as 6s, 6s', 5d, and 5d'', p. 10), and the literature values the tables \
compare, one dataset per source (and variant) as in chan_1992. The column headers name \
the transitions but, unlike part III, print no energies; the text gives only the \
resonance lines: 'the 16.671 eV (f_1) and 16.848 eV (f_2) resonance lines' (p. 2). The \
low-resolution calibration quotes the 3s' state at 16.850 eV (Moore, p. 6): 2 meV from \
the 16.848 eV of p. 2; the p. 2 values are used. So each source has up to three \
datasets: '<source>_Ne' (the resonance lines, eV), '<source>_higher_Ne' (Tables III, IV, \
rows by transition label, index abscissa 1 = 4s, 2 = 4s', 3 = 3d, 4 = 3d', 5 = 5s, 6 = \
5s', 7 = 4d, 8 = 4d', 9 = 6s, 10 = 6s', 11 = 5d, 12 = 5d') and '<source>_sum_Ne' (the \
summed nl + nl' values of note a, rows by pair, 1 = 3s+3s', 2 = 4s+4s', 3 = 3d+3d', 4 = \
5s+5s', 5 = 4d+4d', 6 = 6s+6s', 7 = 5d+5d'). FORMAT NEED: the higher lines need their \
transition energies (Moore's tables, Ref. [66], not in the library) before they can be \
used as lines; until then the index datasets hold the values and labels only.

Text values not extracted: the present summed f_1 + f_2 = 0.171 (p. 11; 0.0118 + 0.159); \
the dipole-forbidden 3p and 4p peaks at 18.96 and 20.38 eV, 'all less than 0.3% of the \
f_2 peak' (p. 10); West and Marr's total discrete sum 0.4 (p. 12, 'would seem to be too \
high'). Table labels printed differently from the reference list (the data are not \
affected): 'Amusy'ya' (Table III), 'Bhaskar and Luiro' (Ref. [37]: Lurio), 'Lawrence and \
Liszt (1960)' (Table III; Ref. [33] is 1969), 'Klose (1970) [34]' (Ref. [34] is Phys. Rev. \
188, 45 (1969)), 'Jongh and Eck' (De Jongh and Van Eck). The uncertainty Lewis prints for \
f_2, (0.002) on 0.168 (1.2 %), is small beside his (0.002) on 0.012 for f_1; kept as \
printed (as for his argon value in chan_1992).

S(k): the paper prints no Cauchy moments or dipole sums (only the TRK normalisation to \
8.34). Lesiuk et al. (2020, Table XI, lesiuk_2020/chan_1992_Ne) quote S(-4) = 2.938 and \
S(-6) = 5.137 as 'Chan et al.', citing this paper; those numbers are not in it, and Lesiuk et al. do not say how they were obtained.
"""

[[datasets]]
