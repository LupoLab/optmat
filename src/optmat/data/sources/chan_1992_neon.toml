material = "Ne"
file = "Ne/chan_1992_neon__continuum_Ne.csv"
table = "tbl_66ad40730b41, tbl_b252935d2cb5"
quantity = "differential_oscillator_strength"
unit = "1/eV"
scale = 1e-2
abscissa_unit = "eV"
use = "primary"
notes = "Table I and its continuation: df/dE (10^-2 eV^-1) at 21.6-250 eV, 220 points, rows by photon energy in reading order (column by column). Low-resolution dipole (e,e), TRK-normalised to 8.34. No uncertainty stated."

