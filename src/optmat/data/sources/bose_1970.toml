citation = "T. K. Bose and R. H. Cole, \"Dielectric and Pressure Virial Coefficients of Imperfect Gases. II. CO2-Argon Mixtures\", J. Chem. Phys. 52, 140 (1970)"
doi = "10.1063/1.1672658"
library = "Bose_1970_DielectricPressureVirial"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Static (audio-frequency) dielectric constants of CO2, Ar and five CO2-Ar \
mixtures in the three-terminal parallel-plate capacitance cells of Orcutt and Cole (in \
stainless-steel bombs) with Sutter and Cole's instruments. B_eps/A_eps^2 and C_eps \
from the cyclic expansion method (Delta f_i = f_i - R^-1 f_(i+3) after a cycle of three \
expansions of known density ratio R, f = (eps - 1)/(eps + 2)); A_eps and B_eps - A_eps \
B_p from low-pressure runs against P/RT (Eq. 4, below 7 atm). CO2 at 29.4 and 49.7 \
degrees C (starting pressures up to 150 atm with a pressure intensifier), Ar and the \
mixtures at 49.7 degrees C (one mixture at 47.7). Matheson prepurified Ar (99.98 % \
minimum); Matheson research-grade CO2 (O2 10 ppm, H2 10 ppm, N2 50 ppm) (pp. 140-141)."""
notes = """Identity checked against the first page (J. Chem. Phys. 52, 140 (1970), \
received 9 April 1969). Page numbers are the journal's: pdf page 1 is the publisher's \
cover, so p. = pdf page + 138. Part II of the series whose Part V is bose_1972.

WHAT THE VALUES ARE (p. 140). [(eps - 1)/(eps + 2)]/C = A_eps + B_eps C + C_eps C^2 + ... \
(Eq. 1, C the molar density): A_eps is the static molar polarization, for these \
non-polar gases the static polarizability (N_A alpha/(3 eps0)): for argon the \
electronic polarizability, for CO2 the electronic plus the vibrational ('atomic') part \
(CO2 is infrared active; 9 % above the optical A_R, st_arnaud_1979). B_eps and C_eps are \
the STATIC DIELECTRIC second and third virial coefficients: for CO2, B_eps = B_ind + B_or \
is dominated by the orientation of dipoles induced by the quadrupole moment of the \
partner (Eqs. 6-11, pp. 142-146), so it is not the optical refractivity virial B_R (CO2 \
B_R is about 1.9 cm^6/mol^2 at 323 K, achtermann_1991); for argon B_eps is the induction \
term alone (the optical B_R at zero frequency). Stored, as bose_1972 does, as \
molar_refractivity at infinite wavelength (A_eps) and refractivity_virial_coefficient \
(order 2 and 3, at infinite wavelength, use = check), never as optical values. \
Temperatures are printed in degrees Celsius (29.4, 49.7; the rows of the A_eps datasets); \
T = t + 273.15 in the parameters.

UNCERTAINTY. 'The only criteria for precision of the mixed virial coefficient values are \
consistency as indicated by the error estimates listed in Table I, which are three \
standard deviations of the coefficients for best least-squares fit' (pp. 141-142); \
Table II's errors of this work come from the same fits and are recorded as '3 sigma' \
(the paper does not restate the level for Table II; the same group states three \
standard deviations in bose_1972 and hosticka_1974). The C_eps are 'given as an \
indication of the degree of fit ... the number and precision of the values is \
inadequate' (p. 141). B_p is 'uncertain by perhaps 2-3 cm^3/mole' (p. 141).

DISCUSSION VALUES (not extracted; no quantity). Ar: B_ind = 2.02 cm^6/mol^2 from Kirkwood's \
fluctuation theory with Lennard-Jones viscosity parameters at 322.8 K, 'considerably \
larger than our experimental value 0.72'; Heinrichs's 1.00 at 298 K agrees (p. 143). CO2: \
B_ind = 9.3 (Eq. 9, 298 K); with Birnbaum's far-infrared B_or = 55.2 at 298 K and 'our \
extrapolated value B = 59.2 at this temperature', B_ind = 4.0; B_or = 53.6 at 29.4 and \
46.7 at 49.7 degrees C (pp. 143-144). Quadrupole moment of CO2 (Table V, p. 146): 4.32e-26 \
esu cm^2 from CO2-CO2, 4.13e-26 from CO2-Ar (the authors' best), 4.3e-26 in the abstract \
(Buckingham-Disch's birefringence gives 4.3e-26).

MIXTURES' DIELECTRIC COEFFICIENTS (Table I, p. 141; the vocabulary has no quantity for \
a mixture's dielectric virials: notes only). Mole fraction X of CO2, \
A_eps, B_eps, C_eps at 49.7 degrees C (the 0.3131 mixture at 47.7): 0.1255: 4.5425 +- \
0.0021, 2.81 +- 1.23, -70 +- 237; 0.2196: 4.8446 +- 0.0012, 5.54 +- 0.8, -184 +- 146; \
0.2655: 4.9920 +- 0.0009, 6.55 +- 0.85, -179 +- 143; 0.3131: 5.1447 +- 0.0006, 8.20 +- \
1.1, -246 +- 210; 0.4192: 5.4854 +- 0.0009, 12.96 +- 0.32, -525 +- 14.5 (image checked). X \
is computed from A_eps by Eq. (2). The cross coefficient B_eps12 = 14.3 cm^6/mol^2 \
(intercept of Eq. 5, Fig. 2; individual mixtures within 1.4, p. 142), (B_ind)12 = 2.4 \
assumed, (B_or)12 = 11.9 at 322.8 K (p. 144). Eqs. (3) and (5) print the cross term as \
B_eps12 X(1 - X), without the factor 2 of the pressure virial's 2 B_p12 X(1 - X) \
(pp. 140-141, images checked): as printed, B_eps12 is twice a cross coefficient defined \
by B = sum_st x_s x_t B_st (the 0.4192 mixture of Table I gives 15.6 with Eq. (3) as \
printed, near the fitted 14.3). The pressure virials of Tables III and IV are extracted \
(below).

PRESSURE VIRIALS (Tables III and IV; added 2026-10-01). B_p is the pressure second \
virial coefficient of PV/nRT = 1 + B_p C + ... (p. 140), from the linear term of Eq. (4) \
in the low-pressure runs (below 7 atm) that also give A_eps. Table III (p. 142), this \
work: pure Ar -15.8 +- 1.0 and pure CO2 -109.3 +- 4.4 cm^3/mol (B_p_Ar, B_p_CO2), and the \
five mixtures at X(CO2) = 0.126, 0.217, 0.266, 0.313, 0.419: -19.1 +- 2.8, -26.7 +- 1.5, \
-29.1 +- 1.3, -34.0 +- 1.0, -38.6 +- 1.1, all at 49.7 degrees C except X = 0.313 at 47.7 \
(footnote b). A mixture is filed under Ar (the first of the pair in sorted order) with \
partner CO2 and Ar's mole fraction, converted from the printed CO2 fraction as 1 - X: \
0.874, 0.783, 0.734, 0.687, 0.581. Table IV (p. 143), experimental column: B_p12 = -30.1 \
cm^3/mol for CO2-Ar at 49.7 degrees C (B_p12_Ar_CO2), from 'a fit of our B_p values by \
the equation B_p = B_p11(1-X)^2 + 2B_p12 X(1-X) + B_p22 X^2', with B_p11 = -15.8 and \
B_p22 = -109.3 fixed (pp. 141-142): a check, since it is derived from the mixture values \
with the pure ones fixed. Both tables and the text were compared with the page images \
(2026-10-01): no differences.

Not extracted: Table III's literature column (Ar -11.3, from NBS Circ. 564 (1955); CO2 \
-103.9, interpolated from data cited by Spurling and Mason) and its calculated column \
(-13.4, -20.6, -26.7, -30.3, -34.3, -42.9, -109.0, from Lennard-Jones parameters derived \
from viscosity with combining rules); Table IV's potential parameters and calculated \
B_p and B_p12 (-39.5 from viscosity, -40.0 from virial parameters). These are other \
sources' values or the authors' model, not measurements.

UNCERTAINTY OF B_p. Table III prints +- errors without saying what they are (the same \
group's Table I errors are three standard deviations of the fits; not restated for Table \
III): recorded as a column, level not stated. Beyond them, 'Our data for pressures below \
7 atm are insufficient to determine statistically significant contributions of the \
third virial coefficient C_p, and the derived values of B_p are uncertain by perhaps 2-3 \
cm^3/mole as a result' (p. 141), a systematic effect common to the points and not in the \
column. No uncertainty is stated for B_p12.

CHECKS AND DOUBTS OF THE PRESSURE VIRIALS. (1) The printed fit does not reproduce exactly: \
a least-squares fit of the five mixtures of Table III with B_p11 = -15.8 and B_p22 = \
-109.3 fixed gives B_p12 = -32.3 (unweighted; -32.9 weighted by the printed errors; -30.8 \
leaving out the 47.7 degrees C mixture), against the printed -30.1; the per-mixture \
values are -24.0, -34.9, -32.9, -36.8, -28.9. The authors' alternative with the \
literature B_p11 for argon, 'use of the literature value -11.5 cm3/mole ... gives B_p12 = \
-38.0' (p. 142), is reproduced (-37.9). The fitting procedure is not described; the \
difference is within the stated 2-3 cm^3/mol. (2) The text's literature value for argon, \
-11.5, differs from Table III's -11.3 (both read on the page image). (3) Table III's \
X = 0.217 is not Table I's 0.2196 rounded (0.220; the other four agree with Table I to \
the printed digits). Eq. (2) with the A_eps of Tables I and II gives 0.2196. Table III's \
calculated column there (-26.7) is what 0.217 gives (-26.8; 0.2196 gives -27.0), so \
the authors used 0.217 for the B_p analysis; the dataset keeps it (Ar 0.783; with Table \
I's X, 0.7804). (4) This work's B_p of argon is 4.5 cm^3/mol below the literature value \
it quotes; the authors attribute the discrepancy in B_p12 to it (p. 142) and note that \
the measured effect determining B_p for Ar is small (p. 141).

LITERATURE ROWS OF TABLE II (reproduced): Ref. 1 = Orcutt and Cole, J. Chem. Phys. 46, \
697 (1967) (orcutt_1967; Ar at 49 degrees C: A_eps 4.142 +- 0.002 as in orcutt_1967, \
B_eps 0.39 +- 0.60 where orcutt_1967 prints 0.39 +- 0.20, three times smaller: \
presumably Bose and Cole's conversion to three standard deviations, though the A_eps \
error is reprinted unchanged); Ref. 3 = Orcutt and Cole, Physica 31, 1779 (1965) (CO2); \
Ref. 4 = Johnston and Cole, J. Chem. Phys. 36, 318 (1962) (CO2, no errors printed); Ref. \
5 = Johnston, Oudemans and Cole, J. Chem. Phys. 33, 1310 (1960) (Ar at 33 degrees C). \
'The values of B_eps for CO2 agree well with the early results of Johnston and Cole, but \
are somewhat higher than those of Orcutt and Cole' (p. 141); for argon 'the earlier \
values ... agree with our value 0.72 to within 0.3 cm^6/mole^2' (p. 141).

REPRODUCTIONS ELSEWHERE (re-pointed 2026-09-27): achtermann_1991 (B_eps of CO2 at 302.6 \
and 322.9 K: 57.6 +- 0.9 and 50.7 +- 0.9, the errors rounded from 0.90 and 0.93), \
hourri_1997 (CO2 A_eps, B_eps, C_eps at 49.7 degrees C, digit for digit), st_arnaud_1979 \
(CO2 A_eps 7.350 +- 0.006, listed there at 298 K although it is the 49.7 degrees C value, \
and B_eps 50.7 +- 0.9 at 323 K), buckingham_1974 (Ar A_eps 4.1397(6), B_eps 0.72(12) at \
322.9 K), copeland_1976 (Ar A_eps printed 4.1396 +- 0.0006, one in the last digit below \
this paper's 4.1397, and B_eps 0.72 +- 0.12); hohm_1990b's Ar alpha(0) = 1.64110(24) \
x 10^-30 m^3 is this paper's A_eps (3 A_eps/(4 pi N_A) = 1.64108); hohm_2013's CO2 \
dielectric mean cites it (its Ref. [130]); schmidt_2003 compares its CO2 B_eps."""

