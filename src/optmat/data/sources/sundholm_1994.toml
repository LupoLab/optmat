notes = "pp. 4933-4934: 'In the CAS calculation it became 0.3358 a.u.' (the 1Se to 1Po transition, the lowest 1Po level, 3p5 4s; LS coupling, no spin-orbit), computed; 2 omega mu^2 with Table I's CAS 1Po energy (95 301 cm-1) and Table II's mu = 0.6218 gives 0.3358. Reproduced in hattig_1998b's Table II as 'CAS'."
