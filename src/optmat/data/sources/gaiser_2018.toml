citation = "C. Gaiser and B. Fellmuth, Phys. Rev. Lett. 120, 123203 (2018)"
doi = "10.1103/physrevlett.120.123203"
library = "Gaiser_2018_PolarizabilityHeliumNeon"
identity = "VALIDATED"
kind = "measurement"
technique = """Dielectric-constant gas thermometry (DCGT) at PTB, at the triple point of \
water (isotherm temperatures 273.149-273.161 K, Table II): the relative capacitance \
change gamma of a gas-filled 10 pF capacitor measured against pressure, scaled to mu = \
gamma/(gamma + 3) and fitted by p = A_1 (mu + A_2 mu^2 + A_3 mu^3 + ...) (Eq. (1)), with \
A_1 = (A_eps/(RT) + kappa_eff/3)^-1 (Eq. (2)); kappa_eff the independently determined \
effective compressibility of the capacitor. Two setups: DCGTk, three tungsten-carbide \
capacitors TC1-TC3 and pressure balances up to 7 MPa; DCGT2, two copper-beryllium \
capacitors C1, C2 up to 0.3 MPa; 8 to 10 isotherms per capacitor; autotransformer ratio \
bridge (pp. 1-2). A_eps/R converted to A_eps with the CODATA 2017 k and N_A (the values \
fixed by the 2019 SI) (p. 3). Very low measuring frequency: the static polarizability."""
notes = """The molar polarizability A_eps = N_A alpha_0 / (3 eps0), the package's molar \
refractivity (cm3/mol) at zero frequency. It is the ELECTRIC polarizability only \
(dielectric constant): for the refractive index the magnetic susceptibility must be \
added (see lesiuk_2020, lesiuk_2023). A density-independent quantity: the virial terms \
are in A_2, A_3, which the paper does not report.

Uncertainty: Table I gives the budgets in ppm of A_eps/R per capacitor ('Sum', the root \
sum of squares) and of the weighted means, 1.7/1.9/1.8 ppm without and 1.9/2.4/2.4 ppm \
(He/Ne/Ar) with the correlations between capacitors and setups; the Table III \
uncertainties are standard uncertainties (caption) and equal the correlated ones (He \
10/5172544 = 1.9 ppm, Ne 2.4, Ar 2.4 ppm; checked 2026-09-25).

Consistency (checked 2026-09-25): Table II's weighted means A_eps/R = 6.221140(12), \
11.96363(28), 49.80100(12) x 10^-8 m^3 K/J times R = k N_A (8.31446261815324 J/(mol K)) \
give 0.51725436, 0.99471154, 4.14068553 cm^3/mol, Table III's values to 0.15 ppm. In \
atomic units (3 A_eps/(4 pi N_A a0^3), CODATA 2018): He 1.3837616, Ne 2.6610571, Ar \
11.0771845; Lesiuk et al. quote Ne 2.661057(7) (2020) and Ar 11.077183(27) (2023). The \
isotope effect is negligible except for neon (0.08 ppm from the natural-composition \
spread, p. 3).

Table III compares literature values (plotted in Fig. 2), extracted as reproduced \
datasets. The text adds: the Ne theory value 0.99503(75) is Klopper et al.'s CCSD \
with relativistic corrections benchmarked on Larsen et al.'s FCI, 2.6617(20) a.u. \
(details in gaiser_2010); the Ar theory value 4.140(11) is Lupinetti and Thakkar's \
nonrelativistic 11.065(3) a.u. (bounds turned into a standard uncertainty with a \
rectangular distribution) plus a relativistic correction +0.01(1) a.u. from three \
calculations (Refs. [20-22]), 11.075(30) a.u. (p. 4). Orcutt and Cole's values in Table \
III are their low-pressure data without the compressibility correction (p. 4). The \
reference list prints Orcutt and Cole's volume as '446' (for 46); not a data issue.

Not extracted: Table I (budgets; the per-capacitor sums are used as uncertainties of \
per_capacitor), Table II's T, kappa_eff and A_1 rows (inputs), and the weighted-mean \
A_eps/R row (restated in Table III as A_eps)."""

[[datasets]]
id = "molar_polarizability_He"
material = "He"
file = "He/gaiser_2018__molar_polarizability_He.csv"
table = "tbl_a15621c7c166"
quantity = "molar_refractivity"
unit = "cm3/mol"
abscissa_unit = "nm"
use = "primary"
notes = "Table III 'This work': A_eps = 0.5172544(10) cm^3/mol, static, the correlated weighted mean of TC1-TC3 (standard uncertainty 1.9 ppm)."
[datasets.uncertainty]
column = true
level = "1 sigma"

[[datasets]]
id = "molar_polarizability_Ne"
material = "Ne"
file = "Ne/gaiser_2018__molar_polarizability_Ne.csv"
table = "tbl_a15621c7c166"
quantity = "molar_refractivity"
unit = "cm3/mol"
abscissa_unit = "nm"
use = "primary"
notes = "Table III 'This work': A_eps = 0.9947114(24) cm^3/mol, static, the correlated weighted mean of TC2, TC3, C1, C2 (standard uncertainty 2.4 ppm). Supersedes gaiser_2010 (0.994727(11); 1.6e-5 higher, within the expanded combined uncertainties, p. 4)."
[datasets.uncertainty]
column = true
level = "1 sigma"

