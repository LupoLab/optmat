file = "He/gaiser_2018__per_capacitor_He.csv"
table = "tbl_ec04560e1d2e"
quantity = "molar_refractivity"
unit = "cm3/mol"
scale = 0.0831446261815324
abscissa_unit = "nm"
use = "check"
notes = "Table II: A_eps/R x 10^8 (m^3 K/J) per capacitor (rows TC1-TC3), whose correlated weighted mean is molar_polarizability_He: a check, not fitted beside it. scale = 1e-8 x R x 1e6 with R = k N_A = 8.31446261815324 J/(mol K) (the CODATA values the paper uses, exact in the 2019 SI) turns A_eps/R into A_eps in cm^3/mol. Per-row relative standard uncertainties are Table I's 'Sum' (ppm); the mu, T, p and p_head components are fully correlated between capacitors. relative = 4.0e-6 is the largest row, a fallback."
[datasets.uncertainty]
relative = 4.0e-6
level = "1 sigma"
relative_rows = { "TC1" = 4.0e-6, "TC2" = 2.4e-6, "TC3" = 2.9e-6 }

