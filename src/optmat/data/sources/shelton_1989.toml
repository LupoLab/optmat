citation = "D. P. Shelton, Phys. Rev. Lett. 62, 2660 (1989)"
doi = "10.1103/physrevlett.62.2660"
library = "Shelton_1989_AnomalousHyperpolarizabilityDispersion"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Gas-phase electric-field-induced second-harmonic generation (ESHG) with \
periodic phase matching, as in Shelton and Lu (1988), with a cw Nd:YAG laser Q-switched \
at 5 kHz (1 kW pulses) at 1064 and 1319 nm; electrode spacing increased 6 or 9 times to \
keep the phase-match pressures below 60 atm (Ne) and 110 atm (He reference); Ne \
measured against He (pp. 2660-2661)."""
notes = """Table I gives, besides hyperpolarizability ratios, the linear-dispersion \
ratios Delta alpha_Ne / Delta alpha_He with Delta alpha = alpha(2 nu) - alpha(nu), \
'determined from phase-match density measurements, except for the result given by Ref. \
18 which was calculated from refractive index data in the literature' (caption). At \
equal phase mismatch, rho_He / rho_Ne = Delta alpha_Ne / Delta alpha_He to first order \
in density, so the printed ratio is stored as phase_match_density_ratio of He with \
reference gas Ne without inversion (the convention of shelton_1990, TC-27). The \
second-harmonic process is ESHG (harmonic 2). Densities from pressure and temperature \
by the virial equation of state (as in Shelton's other work; not restated here).

Abscissa: the vacuum wavenumber nu of the fundamental (cm^-1), printed beside lambda. \
The lambda column's '488.8' is inconsistent with nu = 20487 cm^-1 and nu_L^2 = 25.183e8 \
(= 6 nu^2), which belong to the 488.0 nm argon line (lambda in air); the wavenumbers are \
used, so no correction of the data is needed. The other lambdas (1319, 1064, 694.3, \
594.5, 514.5) are consistent with nu as air wavelengths.

The present-work values (1319 and 1064 nm) are identical to Shelton (1990) Table I \
(shelton_1990/density_He_over_Ne, 1.853(4) and 1.850(7)), the 'more complete account' \
announced here as Ref. 16: the same measurements. They are kept here as a check so as \
not to count them twice (the other record could be made primary). The \
Shelton and Lu (1988) values are reproduced (the original, Phys. Rev. A 37, 3813, is not \
in the library, so this copy is the best available). The Finn and Ward (1971) value is \
calculated from literature refractive indices, not measured: excluded.

Uncertainties: the +- of Table I, level not stated. The ratio 'shows the expected slow \
monotonic increase with nu' and rules out significant sample impurities (p. 2661).

Not extracted (not refractive data): the gamma_Ne/gamma_He ratios and the fit A = \
2.753, B = -2.251e-10 cm^2, C = 6.609e-20 cm^4 (Fig. 1 caption), gamma_Ne = 115.8 a.u. \
static.

THIRD-ORDER DATA (added 2026-09-26; supersedes the "Not extracted" paragraph \
above). The gamma_Ne/gamma_He ratios of Table I by source and process, the Fig. 1 fits \
(formulas) and the static values of the text. THE ANOMALY IS SPURIOUS: shelton_1992 shows \
that the Shelton & Lu (1988) visible ESHG ratios behind the non-monotonic curve were \
corrupted by an unnoticed electrical breakdown in neon; they are excluded here, and the \
fits and the static 116 au are kept for the record only. gamma is the ESHG gamma of \
Shelton's series (Taylor convention); gamma_Ne in au uses 1 au = 6.23538e-65 C^4 m^4 \
J^-3 (Fig. 1 caption) and Bishop & Lam's ab initio gamma_He (Ref. 8: Phys. Rev. A 37, 464 \
(1988)). The processes are compared at nu_L^2 = nu_s^2 + nu_1^2 + nu_2^2 + nu_3^2 \
(4.992 for dc Kerr at 632.8 nm, 6 nu^2 for ESHG, 12 nu^2 for THG, as printed). Parts: \
atoms, electronic."""

[[datasets]]
id = "present_He_over_Ne"
material = "He"
file = "He/shelton_1989__present_He_over_Ne.csv"
table = "tbl_96462ca3eb80"
quantity = "phase_match_density_ratio"
abscissa_unit = "cm-1"
density = "real"
use = "check"
notes = "Table I, present work (a): Delta alpha_Ne / Delta alpha_He = rho_He / rho_Ne at 7581 cm^-1 (1319 nm) and 9395 cm^-1 (1064 nm). Identical to shelton_1990/density_He_over_Ne (same measurements, source notes): a check."
[datasets.uncertainty]
column = true
level = "not stated"
[datasets.parameters]
reference_material = "Ne"
harmonic = 2
process = "ESHG (electric-field-induced second-harmonic generation), periodic phase matching"
definition = "rho_gas / rho_reference_gas at equal wave-vector mismatch; to first order in density = [alpha_ref(2w) - alpha_ref(w)] / [alpha_gas(2w) - alpha_gas(w)] = Delta alpha_Ne / Delta alpha_He as printed; wavenumber = fundamental (vacuum)"
sample_gas = "Ne"
shelton_reference_gas = "He"

