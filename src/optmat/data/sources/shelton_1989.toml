[[formulas]]
id = "ratio_fit"
material = "Ne"
equation = "Fig. 1 caption, p. 2661"
printed = "gamma_Ne/gamma_He = A[1 + B nu_L^2 + C nu_L^4]; A = 2.753, B = -2.251 x 10^-10 cm^2, and C = 6.609 x 10^-20 cm^4, where nu_L is given in cm^-1"
variable = "nu_L^2 = nu_s^2 + nu_1^2 + nu_2^2 + nu_3^2 in cm^-2 (6 nu^2 for ESHG)"
process = "eshg"
convention = "T"
part = "electronic"
range = "the five ESHG measurements of the author's laboratory (1319 nm to 488.0 nm)"
coefficients = { A = "2.753", B = "-2.251e-10", C = "6.609e-20" }
coefficient_units = { A = "1", B = "cm^2", C = "cm^4" }
check = "Gives 2.561 (1319 nm, nu_L^2 = 3.448e8) and 2.476 (1064 nm, 5.296e8) against 2.534 +- 0.019 and 2.487 +- 0.011 (1.4 and 1.0 sigma), and 2.225, 2.283, 2.346 at the three Shelton & Lu points (2.20, 2.28, 2.36). Checked 2026-09-26."
notes = "SUPERSEDED (spurious anomaly, see the record notes): fitted to the present infrared points and Shelton & Lu's three visible points, which shelton_1992 discards."

[[formulas]]
id = "gamma_fit"
material = "Ne"
equation = "Fig. 1 caption, p. 2661"
printed = "gamma_Ne = A*[1 + B* nu_L^2 + C* nu_L^4], where A* = 115.8 a.u., B* = -1.923 x 10^-10 cm^2, and C* = 6.924 x 10^-20 cm^4 (one atomic unit equals 6.23538 x 10^-65 C^4 m^4 J^-3 for gamma). The curve for gamma_Ne has a minimum of 100.4 a.u. at nu_L^2 = 13.9 x 10^8 cm^-2"
variable = "nu_L^2 in cm^-2 (6 nu^2 for ESHG)"
process = "eshg"
convention = "T"
part = "electronic"
range = "as ratio_fit"
coefficients = { gamma0 = "115.8", B = "-1.923e-10", C = "6.924e-20" }
coefficient_units = { gamma0 = "au", B = "cm^2", C = "cm^4" }
calibration = "He: Bishop & Lam (Phys. Rev. A 37, 464 (1988))"
check = "Minimum at nu_L^2 = 1.923e-10/(2 x 6.924e-20) = 13.89e8 cm^-2, value 115.8 (1 - 0.1335) = 100.3 au, as stated (100.4). Checked 2026-09-26."
notes = "SUPERSEDED (spurious anomaly): shelton_1992's refit gives gamma_0 = 108.1 au with positive dispersion."
