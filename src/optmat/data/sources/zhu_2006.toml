unit = "1"
abscissa = "none"
use = "check"
points = [["405", "", "3"]]
notes = """p. 1187 (TC-967): at 405 nm 'NO+ becomes about threefold stronger than the \
parent ion, while tiny O+ is observed' (Fig. 1(b)); NO+ 'always dominate[s] the mass \
spectra' at 405 nm (p. 1188). Printed as 'about threefold'; no uncertainty. The pulse \
duration at 405 nm is not stated (similar to 810 nm's 60 fs, p. 1186)."""
