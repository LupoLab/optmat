notes = "Table 2 (p. 705): the second Kerr virial coefficient B_K of Ar calculated with the dipole-induced-dipole pair polarizability and a Lennard-Jones 6-12 potential (Eq. 28; inputs alpha = 1.827 [7, Orcutt & Cole 1967], a = 1.850 [44, Dalgarno & Kingston 1960] x 10^-40 C^2 m^2 J^-1, u0/k = 119.8 K, R0 = 0.3405 nm [41]), 250-330 K. Theory, no uncertainty stated; the DID model is known to fail at short range (see the record's notes). The measured value of Part II is table2_expt_Ar."
