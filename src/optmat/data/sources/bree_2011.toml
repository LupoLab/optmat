table = "tbl_3d9fe63acf83"
quantity = "nonlinear_index"
unit = "cm2/W"
scale = 1e-20
abscissa_unit = "nm"
state = "1atm_0C"
density = "ideal"
use = "check"
notes = "Table I, Z = 1 (800 nm) and n2(w -> 0) (static) columns, 10^-8 cm^2/TW = 10^-20 cm^2/W, at rho_nt = 2.7e19 cm^-3 ('standard conditions', read as 1 atm and 0 C with the rounded Loschmidt number). Kramers-Kronig model, not a measurement. The model's 800 nm row is repeated (rounded) in bree_2012 Table I."
[datasets.parameters]
part = "electronic"
coefficient = "self"

