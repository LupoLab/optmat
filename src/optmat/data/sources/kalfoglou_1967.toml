'Mixtures' columns of Tables III and IV (He at 30 C, 4.61 against 4.63).

UNCERTAINTY: 'the errors given for the virial coefficients are probable errors \
determined from the least-squares fit of the observed B_mix values to the Lennard-Jones \
and Cook equation (eq 4)' (p. 1258); the dataset takes them as printed, level probable \
