DOUBTS (computed 2026-10-01):
- The level: the standard errors of the fit above are 0.070, 0.031, 0.053, 0.059, 0.036 \
and 0.046 x 10^-4 atm^-1 against the printed 'probable errors' 0.07, 0.03, 0.05, 0.05, \
