1256-1264 (pdf pages 1-9).

TABLE II (p. 1258, image checked against the cells file, 2026-10-01, every cell \
agreeing): B_He-Ar, present work, at 30-500 C in atm^-1 x 10^4 and in cc/mole, each \
with its probable error, and Tanner and Masson's 18.50 (graphical interpolation) and \
