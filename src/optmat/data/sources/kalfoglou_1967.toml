citation = "N. K. Kalfoglou and J. G. Miller, \"Compressibility of Gases. V. Mixtures of Spherically Symmetric Molecules at Higher Temperatures. The Helium-Argon and Helium-Tetrafluoromethane Systems\", J. Phys. Chem. 71, 1256 (1967)"
