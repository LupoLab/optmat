technique = """Burnett method (University of Pennsylvania; the apparatus of Witonsky and \
Miller 1963, their ref. 4), the volumes outside the principal bath thermostated at 30 C, \
an oil manometer in parallel with a Ruska 2406 diaphragm indicator for the final \
balance (pressures reproducible to 1 part in 20 000 down to 5 atm), the gas mixed in \
the first chamber by a magnetically driven steel ball. He (99.99 % by weight) and Ar \
(99.998 %) from Matheson. Isotherms at 30, 100, 200, 300, 400 and 500 C, nine equally \
spaced compositions including the pure gases, 3-80 atm in 11 expansions for He-Ar. Each \
run reduced by Harper and Miller's method (their ref. 2): Z = exp(alpha p + beta p^2), \
with a delta p^4 term for pure Ar at 30 C, so that the pressure-series B = alpha \
(atm^-1). B_He-Ar from a least-squares fit of each isotherm's nine B_mix to Eq. (4), \
B_mix = B_11 x_1^2 + 2 B_12 x_1 x_2 + B_22 x_2^2."""
notes = """Identity VALIDATED_WITH_WARNINGS by the library: the DOI was asserted by the \
curator, and the library's title check failed only because the observed title was cut \
at the first line. The page (pdf page 1, image checked) prints the full title as in the \
