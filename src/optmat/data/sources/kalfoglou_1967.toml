with the partner He (Ar sorts first). The atm^-1 column is the pressure-series \
coefficient B/(RT), a unit the vocabulary does not hold; Tanner and Masson's values are \
another source's (Proc. Roy. Soc. A126, 268 (1930), their ref. 10, not in the library).

NOT EXTRACTED, for want of a unit in the vocabulary: Table I (p. 1258), B_mix x 10^4 \
(atm^-1) and C_mix x 10^7 (atm^-2) of He-Ar at nine helium mole fractions and six \
temperatures (image checked; the mixture data proper), and Tables III and IV (p. 1259), \
the pure-gas B of He and Ar in atm^-1 (pure gas, and the intercepts of Eq. (4)). The \
paper prints no Z. The helium-tetrafluoromethane system (Tables V-VII, XI) is not \
extracted: CF4 is not an optmat gas. Tables VIII-X are fitted potential parameters.

REPRODUCED (computed 2026-10-01): the cc/mole column from the atm^-1 column times RT \
(R = 82.0574 cm^3 atm/(mol K), T = t + 273.15 K): 18.766, 19.734, 20.259, 20.449, \
