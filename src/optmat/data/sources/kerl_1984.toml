[[formulas]]
id = "A_R_T_Ar"
material = "Ar"
equation = "Eq. (3.5) with Table 3, p. 995"
printed = "A_R/cm^3 mol^-1 = c_0 + c_1 T; Ar: K = 4, |s| = 0.0057, r = 0.67, c_0 = 4.159(57), 10^4 c_1/K^-1 = 2.2(1.8), 10^4 (c_1/c_0)/K^-1 = 0.53"
variable = "T: temperature in K; A_R: molar refractivity at 546.226 nm (vacuum), cm^3/mol"
range = "299-345 K (the four unbracketed Table 1 isotherms)"
coefficients = { c0 = "4.159", c0_sigma = "0.057", c1 = "2.2e-4", c1_sigma = "1.8e-4" }
check = "A least-squares line through Table 1's four unbracketed Ar values gives c_0 = 4.1588, c_1 = 2.22e-4, r = 0.67, s = 0.0057: Table 3 to its printed digits. Checked 2026-09-26."
notes = "The slope is not significant (1.2 sigma) and hohm_1990 found none for argon at 300-1100 K; a check only."

[[formulas]]
id = "A_R_T_CH4"
material = "CH4"
equation = "Eq. (3.5) with Table 3, p. 995"
printed = "A_R/cm^3 mol^-1 = c_0 + c_1 T; CH4: K = 5, |s| = 0.019, r = 0.91, c_0 = 6.23(11), 10^4 c_1/K^-1 = 12.6(3.3), 10^4 (c_1/c_0)/K^-1 = 2.03"
variable = "T: temperature in K; A_R: molar refractivity at 546.226 nm (vacuum), cm^3/mol"
range = "299-366 K (Table 1's five CH4 isotherms)"
coefficients = { c0 = "6.23", c0_sigma = "0.11", c1 = "12.6e-4", c1_sigma = "3.3e-4" }
check = "A least-squares line through Table 1's five CH4 values gives c_0 = 6.2270, c_1 = 12.64e-4, r = 0.91, s = 0.0188: Table 3 to its printed digits. Checked 2026-09-26."
notes = "c_1/c_0 = 2.0e-4 per K (20 % per 1000 K), about 17 times the rise of hohm_1990's CH4 alpha(T) (1.2 % per 1000 K) and of kerl_1992's Eq. (10): not borne out by the group's later work. The first CH4 point (299.44 K, the new cell) is 0.67 % below the second (301.47 K, the old cell); without it the slope is still about 9e-4 cm^3/mol per K."
