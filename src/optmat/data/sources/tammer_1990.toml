citation = "R. Tammer and W. Hüttner, \"The anisotropy of the second hyperpolarizability of molecular hydrogen from the pressure and temperature dependence of the Kerr effect\", Chem. Phys. 146, 155 (1990)"
doi = "10.1016/0301-0104(90)90014-z"
library = "Tammer_1990_AnisotropySecondHyperpolarizability"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Absolute dc Kerr effect of H2 and D2 at 632.8 nm (25 mW He-Ne laser): a \
temperature-stabilised Senarmont-type ellipsometer whose Faraday compensator current, \
held at null by a PID loop with 600 Hz Faraday modulation and phase-sensitive detection, \
measures the phase difference; Kerr condenser of two stainless-steel plates 0.03 x 0.63 \
m, 6.00 +- 0.01 mm apart on glass-ceramic spacers, in a pressure cell to 125 bar, +-0.1 C \
from -100 to 200 C; about 12 kV; 0.5 % edge correction (pp. 157-158). H2 (99.999 %) at \
199 (p, T) settings at 13 temperatures, 196.1-411.7 K, pressures to 120 bar; D2 (99.7 %) \
at 65 pressures, 3-16 bar, 24.9 C. Densities from the Beattie-Bridgeman relation; K = a \
rho + b rho^2 per temperature (Eq. 12); molar Kerr constants with two local-field \
functions and extrapolation to zero density, mK = A_K + B_K N (Eqs. 3-4) (pp. 158-159)."""
notes = """SUPERSEDED CALIBRATION. The field integral of this apparatus was wrong ('a \
machining fault in manufacturing the Kerr plates', tammer_1992 p. 154); Tammer, Löblein, \
Peting & Hüttner (tammer_1992) calibrated it by the Stark effect of OCS and state that \
'all values K, mK, and A_K given in ref. [3] should be multiplied by' 1.0637 +- 0.0031, \
re-evaluating this paper's Table 1 in their Table 1 (the refit is not a uniform factor: \
see tammer_1992). Every value here is therefore recorded as printed with use = 'check' \
(or 'reproduced' for other authors' values): the H2 gamma of this paper, 4.15(12) x \
10^-62, is 4.68(14) x 10^-62 after the correction. The D2 value was not re-evaluated \
in tammer_1992; with the same factor its A_K would be 7.802 x 10^-29 and gamma about \
4.17 + 0.0637 x 7.335 x 1.1909 = 4.73 x 10^-62 (computed here, not a value of either \
paper). Pages are the journal's (155-163; p. = pdf page + 154).

DEFINITIONS (pp. 155-156). gamma = (1/10) sum (3 gamma_ghgh - gamma_gghh) = (3/2)(gamma_zzzz \
- gamma_xxzz) = (3/2)(gamma_par - gamma_perp) (Eq. 1), the anisotropy of the \
hyperpolarizability, with the field-induced polarizability (1/2) sum gamma_ghij E_i E_j \
(p. 155): Buckingham's gamma_K in the Taylor-series convention. Delta n = n_z - n_x = \
lambda K E^2 (Eq. 2); K = (27/2)(f(n, eps)/(lambda n)) mK N (Eq. 3), N in mol per \
volume; mK = A_K + B_K N (Eq. 4); A_K = (N_A/(81 eps0))[gamma + (Delta alpha Delta \
alpha^0)_eff / 5 k_B T] (Eq. 5), with the quantum statistical average over rotational \
states of Eqs. (6)-(8) (spin weights 1:3 for H2, 2:1 for D2; hG(H2) = 59.340 cm^-1, \
hG(D2) = 29.908 cm^-1, Table 1 note a). Local-field functions f^(2) = ((n^2 + 2)/3)((eps \
+ 2)/3) (Eq. 13) and f^(4) = ((n^2 + 2)/3)^2((eps + 2)/3)^2 (Eq. 14); 'A_K as a function \
of temperature was found unaffected by the choice of the local-field function while two \
different sets of B_K were obtained' (p. 159). gamma is A_K minus the orientation term \
computed from the J-dependent ab initio anisotropies (Rychlewski 1980, 1983; Bishop & \
Cheung 1980): an electronic plus vibrational gamma_K.

UNCERTAINTY (p. 158): reproducibility after reassembly 'better than +-0.5%' (compensation \
current calibration included); 'An additional systematic error caused by the combined \
uncertainties in determining p, T, and E of at most +-1.1% must be taken into account in \
the mK and A_K values'. Table 1: 'The errors given in parentheses in units of the least \
significant figures are standard deviations'. Mean gamma = (4.149 +- 0.013) x 10^-62 SI \
('the error means one standard deviation', Eq. 15, p. 159); with the 1.1 % systematic \
part of A_K the final 4.15(12) of Table 2 (the systematic contribution '+-0.11 x 10^-62 \
SI', p. 162). D2: 'one standard deviation and an additional systematic error of 1.6% in \
A_K(D2)' (p. 159). Fitting B_K = a0 + a1/T + a2/T^2 (Eq. 24) with gamma to the original \
data gave gamma = 4.160(15) x 10^-62 SI (p. 163).

TABLE 1 (p. 160). Taken: A_K, B_K^(4), B_K^(2), gamma (H2, 13 temperatures; D2 at \
298.1 K: A_K and gamma only). Not taken: 10^19 a (C^2 m^4 J^-2 kg^-1) and 10^21 b (C^2 \
m^7 J^-2 kg^-2) of Eq. (12), and 10^29 Delta 'Delta = A_K - K_K^calc' (note b: K_K^calc \
is a slip for A_K^calc) with A_K^calc from Eq. (5) and the mean gamma. Footnote c: 'The \
mean value is gamma = 4.149(13) x 10^-62 C^4 m^4 J^-3'. The 376.8 K row is printed \
376.5 K in tammer_1992.

TABLE 2 (p. 161): 'Comparison of hyperpolarizability anisotropies of H2 and D2 obtained \
in this work with literature values', with an esu column ('1 esu corresponds to 1.2379 \
x 10^-25 C^4 m^4 J^-3', note a; not taken). Rows: this work (note b: 'Error includes one \
standard deviation (see table 1) and systematical contributions'); [3] Buckingham & Orr \
1968 (buckingham_1968b; 3.43(37) = its 0.277 esu for H2); [4] Carusotto et al. 1985 \
(carusotto_1985), 'Transferred to lambda = 632.8 nm, see text' (note c): the authors \
subtracted the orientation terms from Carusotto's room-temperature A_K and moved gamma \
from 514.5 to 632.8 nm with Bishop, Pipin & Rérat's electronic dispersion and \
vibrational terms (p. 161); [1] Bishop, Pipin & Rérat 1990 ab initio (note d: 'Error is \
estimated'). 'They all refer to 632.8 nm.' The authors' result is 6.8 % below theory \
(p. 161).

TEXT (pp. 162-163): ESHG and ac Kerr results transferred to the dc Kerr gamma at 632.8 \
nm. From Mizrahi & Shelton's ESHG ratio (Eq. 20, fitted by Shelton & Lu 1988) and Bishop \
& Pipin's He: Eq. (21) gamma_par,ESHG^e and Eq. (22) gamma^e (formulas), plus the \
vibrational correction -0.045 x 10^-62 SI for He-Ne light: 'gamma = (4.42 +- 0.03) x \
10^-62 SI' (the 0.6 % experimental error of Mizrahi & Shelton); from Rosasco & Hurst's \
ac Kerr (4.92 +- 0.24) x 10^-62 SI at 676.6 and 563.3 nm: gamma^e = (4.57 +- 0.23) and \
gamma = (4.52 +- 0.23) x 10^-62 SI (text_transferred_H2). B_K^(4) are 'smaller by a \
factor of two than those found by Buckingham and Orr [3], but have the same (positive) \
sign' (p. 162).

Reproductions elsewhere: bishop_1991/expt_dc_kerr_H2 (row tammer_huttner_1990, 666 +- 19 \
au = 4.15(12) x 10^-62 / 6.2354e-65) and expt_dc_kerr_D2 (669 +- 26 au = 4.17(16)); \
shelton_1993/gamma_R_tammer (685.3 au: Shelton & Rugar's evaluation of this paper's \
orientation expression, Eq. 6, not a value printed here). The library copy has no \
validation warnings (identity reviewed: title, first author and year agree)."""

