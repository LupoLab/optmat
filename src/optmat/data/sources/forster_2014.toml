citation = "J. Förster, Y. V. Vanne and A. Saenz, \"Ionization behavior of molecular hydrogen in intense laser fields: Influence of molecular vibration and alignment\", Phys. Rev. A 90, 053424 (2014)"
doi = "10.1103/physreva.90.053424"
library = "Forster_2014_IonizationBehaviorMolecular"
identity = "VALIDATED"
kind = "theory"
technique = """Full-dimensional two-electron time-dependent Schrodinger equation for H2 \
in the fixed-nuclei approximation (configuration interaction from H2+ B-spline orbitals \
in prolate spheroidal coordinates, velocity gauge, cos^2 vector-potential pulses): \
ionisation yields at fixed R (FNA, R = 1.4 a0) and averaged over the vibrational \
ground state ('frozen nuclei', FROZ, Eq. (3)), for parallel, perpendicular and random \
alignment (Eq. (4)); compared with ADK and a new frequency-corrected ADK (FC-ADK, Eq. \
(9)) (pp. 1-3)."""
notes = """Pages are pdf pages (1-9 = 053424-1 to -9). Identity checked against pdf p. \
1. UNMAPPED_GLYPHS on pp. 2, 5, 6, 7 (the parallel sign, Gamma in Gamma_ADK, square \
roots in footnote 3); not on any value taken, since none is.

WHY NOTHING IS TAKEN. H2 only (H2+ the final state); every yield is in a figure: Fig. 2 \
(p. 3), yield against omega for parallel H2, 10 fs, 1e12 W/cm^2 (with the full and \
LOPT results of Palacios et al. and Sanz-Vicario et al.); Figs. 3-5 (pp. 4-5), \
R-dependent yields and alignment, same laser; Fig. 6 (p. 6), Y(R) at 800 nm, 20-cycle \
pulses, 2-13 x 10^13 W/cm^2; Fig. 7 (p. 7), FNA and FROZ yields against peak intensity \
(800 nm, 20 cycles, parallel and perpendicular) with ADK and FC-ADK, and the ratio \
Y_FROZ/Y_FNA; Figs. 8-9 (pp. 7-8), Y(R) at 800 nm for 40-cycle pulses at 1e13-1e14 \
W/cm^2 and 6-cycle pulses at 3.5-10.6 x 10^13 W/cm^2 (the TDSE of Awasthi and Saenz \
2006 [18]). No table.

NUMBERS IN THE TEXT (the paper's own; not taken): at 4 x 10^13 W/cm^2 (800 nm, 20 \
cycles) Y_FROZ/Y_FNA = 6.3 (parallel) and 2.5 (perpendicular) (p. 6); the parallel and \
perpendicular TDSE yields agree within a factor of 3 (FNA) or 2 (FROZ) (p. 6); \
cycle-averaged against static rates differ by 'below 1.3%' (p. 6); the ADK-to-TDSE \
scaling factors of [18] for the 6-cycle pulses, corrected (footnote 3, p. 7: [18] had an \
extra prefactor sqrt(pi kappa^3/(3F))), are 75, 14, 5 and 2.5 at 3.5, 5.4, 7.8 and 10.6 \
x 10^13 W/cm^2. The 800 nm range is quoted as 'gamma = 0.67-2.6' (pp. 5, 6), which Figs. \
8-9 (gamma 1.2 at 1e14, 1.1 at 1.06e14 W/cm^2) and gamma = omega sqrt(2 I_p)/F (Eq. \
(5)) do not bear out at the low end (about 1.0 at 1.3e14 W/cm^2): probably a misprint.

FORMULA (for review; not recorded as an entry). FC-ADK, Eq. (9) (p. 6, checked against \
the equation image): Gamma_FC-ADK = N_e sqrt((3F_e/(pi kappa^3))(2/kappa - \
1)) (F_e/(8 pi)) (4e kappa^3/((2/kappa - 1) F_e))^(2/kappa) exp[-(2 kappa^3/(3F_e)) \
g(gamma)], with g(gamma) = (3/(2 gamma)){(1 + 1/(2 gamma^2)) arcsinh gamma - sqrt(1 + \
gamma^2)/(2 gamma)} (Eq. (8)), gamma = kappa omega/F_e, kappa = sqrt(2 I_p(R)); 'N_e = 2 is \
the number of active electrons' and 'In the limit gamma << 1 Eq. (9) reduces to the \
standard atomic ADK rate multiplied with the number of active electrons N_e' (p. 6). It \
starts from Eq. (7) of Ilkov, Decker and Chin (1992) (ilkov_1992/eq7_ground_state). The factor N_e = 2 for H2 bears on \
solprop's occupancy question (TC-439). Eq. (6): \
Y_ADK(R) = 1 - exp{-int Gamma_ADK[F_e(t), I_p(R)] dt}."""
