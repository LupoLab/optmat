[[errata]]
dataset = "table4_n_24C"
row = "0.36"
column = "value"
printed = "1.44548"
corrected = "1.44543"
reason = "Misprint of the last digit: Table IV is the formula truncated to five decimals (83 of its 84 values), and the formula gives 1.445432 at 0.36 um."
evidence = "Table IV image (pdf p. 3) prints 1.44548. The Table III formula gives 1.4454317 at 0.36 um (checked 2026-09-27), whose truncation is 1.44543; the neighbouring differences with 1.44543 (-0.00232 from 0.34 um, -0.00194 to 0.38 um) follow the printed -dn/dlambda (0.1272 at 0.34, 0.1056 at 0.36, 0.0888 at 0.38 um), while 1.44548 gives -0.00227 and -0.00199."
