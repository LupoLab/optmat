citation = "D. M. Bishop, J. Pipin and S. M. Cybulski, \"Theoretical investigation of the nonlinear optical properties of H2 and D2: Extended basis set\", Phys. Rev. A 43, 4845 (1991)"
doi = "10.1103/physreva.43.4845"
library = "Bishop_1991_TheoreticalInvestigationNonlinear"
identity = "VALIDATED_WITH_WARNINGS"
kind = "theory"
technique = """Sum-over-states (Orr-Ward) evaluation of the electronic gamma components of H2 \
with explicitly correlated (r12-dependent, elliptical-coordinate) wave functions for \
the Sigma, Pi and Delta intermediate states, with new 'primed' Delta geminals that pass \
closure tests; 14 internuclear distances R = 0.6-3.0 a0, averaged over the rovibrational \
levels of the ground vibrational state with a Maxwell-Boltzmann rotational population at \
295 K; the pure vibrational contributions taken unchanged from Bishop, Pipin and Rerat, \
J. Chem. Phys. 92, 1902 (1990) (pp. 4845-4847, 4851)."""
notes = """Identity: journal pages 4845-4853 = pdf pages 1-9 (page = pdf page + 4844). \
H2 and D2 only.

DEFINITIONS (p. 4846, Eq. 1): gamma_abgd(-w_s; w1, w2, w3) = hbar^-3 sum over the 24 \
permutations of (mu_a, -w_s), (mu_b, w1), (mu_g, w2), (mu_d, w3) of the Orr-Ward terms \
(Buckingham's and Bogaard and Orr's definitions): the Taylor-series (T) convention, the \
same as bishop_1989 (whose He values these papers use as the reference; T = H2/He \
below). Processes (p. 4850): dc Kerr w1 = w, w2 = w3 = 0; ESHG w1 = 0, w2 = w3 = w; \
THG all w. The laboratory-frame gamma_par and gamma_perp are the isotropic averages 'for \
radiation transmitted parallel and perpendicular to the applied electric field' (p. \
4851), Shelton's gamma_par and gamma_perp; the dc Kerr gamma^K = (3/2)[gamma_par^Kerr - \
gamma_perp^Kerr] (Eq. 19). 'We do not list the gamma_perp^THG values since they are \
exactly one-third of gamma_par^THG.' Atomic units: 'gamma = e^4 a0^4 E_h^-3 = 6.23538 x \
10^-65 C^4 m^4 J^-3' (p. 4845), the standard unit (the Born-Oppenheimer calculation has \
no reduced-mass rescaling).

PARTS. elec: the electronic gamma, rovibrationally averaged (v = 0) over a 295 K rotational \
population (overline gamma), recorded as part 'electronic' with parameters.temperature_k \
= 295. vib: the pure vibrational contribution of Bishop, Pipin and Rerat (1990), part \
'vibrational'; near omega = 0.01-0.02 a.u. it passes the vibrational resonance (H2 \
fundamental about 0.019 a.u.), where the values are large and of either sign. total = \
elec + vib ('electronic_vibrational'); no rotational (orientational) term is included \
(p. 4847). 'The values of gamma_par^ESHG(vib) are very similar to the values of gamma^vR \
reported in Table III(a) of Ref. 4' (Shelton 1990; p. 4851).

DATASETS: Tables VI-XI (H2 dc Kerr, ESHG, THG; D2 the same), 30 datasets x 13 omegas; \
Table XIV ratios S (H2/D2) and T (H2/He), theory, experiment (reproduced) and 'fitted \
experiment'; Table XVI gamma^K(total) of H2 and D2 at seven wavelengths. Checks: \
gamma^K(H2, 6328 A) = 1.5 (786.6 - 302.5) = 726.15 (printed 726); T(13 190 A) = 661.1 / \
43.788 = 15.098 (15.10); T(6943 A) = 798.1 / 45.647 (bishop_1989 Table II) = 17.484 \
(17.48); S(13 190 A) = 661.1 / 669.1 = 0.988 (checked 2026-09-26). The wavelengths of \
Table II pair omega and lambda as vacuum values (0.03454 a.u. = 13 190 A).

NOT EXTRACTED: Table IV (the molecular-frame components gamma_xxxx ... gamma_zzzz of H2 \
at R = 1.4 a0, before averaging; the ESHG and THG blocks print a column 'gamma_xzzz', \
evidently gamma_xxzz), Table III (alpha), Tables V and XII (B, C), Table XIII (the ratio R \
= gamma_par/gamma_perp of ESHG, theory against Mizrahi and Shelton 1985 and Shelton and \
Lu 1988, e.g. H2 at 5145 A 2.873 against 2.867(2)). The electronic values rose by 1.3-1.8 \
% from Bishop, Pipin and Rerat (1990) (p. 4851).

TEXT VALUES (datasets below): He ESHG gamma_par 'calculated expressly for this work' at \
13 190, 10 640 and 5900 A (p. 4851); experimental dc Kerr gamma^K of H2 and D2 (p. \
4852); the ac Kerr estimate and experiment (p. 4853); Shelton's static electronic H2 \
686 +- 4 and D2 669 (pp. 4845, 4852)."""

