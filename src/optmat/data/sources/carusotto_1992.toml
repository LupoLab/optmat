citation = "S. Carusotto, F. Perrone and E. Polacco, J. Chem. Phys. 97, 7979 (1992)"
doi = "10.1063/1.463420"
library = "Carusotto_1992_MeasurementKerrConstant"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Absolute dc Kerr effect of N2, H2 and D2 at 295 K (+-0.5 K) and ~1 atm \
(piezometric gauge, 0.1 %), 632.8 nm frequency-stabilised He-Ne laser (0.5 mW): a Kerr \
cell (electrodes 498.8 mm long, 5.37 mm apart, field at 45 deg to the polarisation, \
sinusoidal at 512.100 Hz, ~12 kV) followed by a Pockels cell whose dc ellipticity acts \
as a carrier and whose small ac ellipticity is the reference; heterodyne lock-in \
detection (sensitivity 5e-8 rad Hz^-1/2); K from Eq. (11); 86 runs (H2) and 50 runs (D2) \
of 1000 s (pp. 7979-7981)."""
notes = """DEFINITIONS (pp. 7979, 7980, 7983): 'The electrically induced optical \
birefringence, or Kerr effect, is described by the Kerr constant K, defined as Delta n = \
n_par - n_perp = K rho E^2' (Eq. 1), rho the gas density in amagat, E the field in \
statV/cm; K in cm^2/statV^2 amagat (called esu). Ellipticity eps_k ~ Phi/2 = (pi K \
rho/lambda) integral |E x z|^2 dz (Eq. 2). Theory (Buckingham & Orr's form for diatomic \
nondipolar molecules): K = (2 pi N_Av / 15 V_mol)(5 gamma + eta Delta alpha Delta \
alpha_0 / k_B T) (Eq. 12), eta = 1 - sigma_0 + (8/15) sigma_0^2 + ..., sigma_0 = h c B_0 \
/ k_B T, the quantum correction for rotation and nuclear-spin statistics (Table II: eta \
= 0.75 for H2, 0.87 for D2, with B_0 = 60.85 and 30.44 cm^-1 from Huber & Herzberg; these \
are the equilibrium B_e of H2 and D2, the ground-state B_0 being about 59.3 and 29.9 \
cm^-1: a slip, not affecting the stored values). The measured K includes the \
orientational (rotational) term: the stored Kerr constants are total; the gamma of \
Table II is only an input to Eq. (12).

RESULTS (pp. 7981-7982): K(N2) = (15.64 +- 0.10 +- 0.15), K(H2) = (4.150 +- 0.042 +- \
0.041), K(D2) = (4.297 +- 0.031 +- 0.043) x 10^-17 cm^2/statV^2 amagat (statistical, \
systematic); compactly K(H2) = (4.150 +- 0.059), K(D2) = (4.297 +- 0.053) x 10^-17 esu; \
Delta K = K(D2) - K(H2) = (0.147 +- 0.052 +- 0.001) x 10^-17. Table I's column heading \
prints '10^17' where the text has x 10^-17 (the values are the same): read as 10^-17. \
Table I also swaps H2's two uncertainties (0.041, 0.042): corrected by an erratum to the \
text's statistical 0.042 (0.39/sqrt(86) = 0.042).

EARLIER VALUES in Table I, not stored as datasets (high pressure or temperature \
ranges, reproduced): Ref. 5 (Buckingham, Bogaard, Dunmur, Hobbs & Orr 1970): N2 at 100 \
atm, 248 K, 18.7; at 334 K, 15.3. Ref. 2 (Buckingham & Orr 1968): H2 at 25-85 atm, 245 K, \
3.81 +- 0.19; at 332 K, 3.31 +- 0.17; D2 at 12 atm, 243-305 K, 3.56 +- 0.18 (all 1e-17 \
cm^2/statV^2 amagat). The table image's spacing places the H2 245 K row with the Ref. 5 \
block, but the text attributes the H2 and D2 values to Ref. 2 ('Buckingham and co-workers \
studied the birefringence of H2 and D2 in the density region of 22-90 amagat'). The \
authors see 'satisfactory' agreement of the recent measurements. Pages are the \
journal's (the PDF page plus 7977; the first PDF page is the publisher's cover). The \
library notes two unmatched captions (the cover page); the tables agree with their \
images."""

[[datasets]]
id = "kerr_N2"
material = "N2"
file = "N2/carusotto_1992__kerr_N2.csv"
table = "tbl_bd417c3b63d6"
quantity = "kerr_constant"
unit = "cm2/statV2 amagat"
scale = 1e-17
abscissa_unit = "nm"
wavelength_medium = "standard_air"
state = { pressure_atm = 1.0, temperature_k = 295.0 }
use = "primary"
notes = "Table I (p. 7983) and text (pp. 7981-7982): the dc Kerr constant K of N2, Delta n = n_par - n_perp = K rho E^2 (Eq. 1), rho in amagat, E in statV/cm, measured at 295 K and ~1 atm (the state) with the 632.8 nm He-Ne line; K is per amagat, so the state only records the conditions. Printed as (15.64 +- 0.10 +- 0.15) x 10^-17 cm^2/statV^2 amagat in the text, 'the former uncertainty gives the statistical error, whilst the latter one takes into account systematical effects' ('Systematic errors can be reasonably estimated to be <1% of the measured effect'): sigma = the statistical error, the systematic one as systematic_relative (1 %, a bound). N2 was measured first as a check of the apparatus (voltage and pressure linearity, Figs. 2-3); total dc Kerr constant, dominated by the orientational term."
[datasets.uncertainty]
column = true
level = "1 sigma"
systematic_relative = 0.01
[datasets.parameters]
temperature_k = 295.0

