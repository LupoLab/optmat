unit = "cm2/statV2 amagat"
scale = 1e-17
abscissa_unit = "nm"
wavelength_medium = "standard_air"
state = { pressure_atm = 1.0, temperature_k = 295.0 }
use = "primary"
notes = "Table I (p. 7983) and text (pp. 7981-7982): the dc Kerr constant K of H2, Delta n = n_par - n_perp = K rho E^2 (Eq. 1), rho in amagat, E in statV/cm, measured at 295 K and ~1 atm (the state) with the 632.8 nm He-Ne line; K is per amagat, so the state only records the conditions. Printed as (4.150 +- 0.042 +- 0.041) x 10^-17 cm^2/statV^2 amagat in the text, 'the former uncertainty gives the statistical error, whilst the latter one takes into account systematical effects' ('Systematic errors can be reasonably estimated to be <1% of the measured effect'): sigma = the statistical error, the systematic one as systematic_relative (1 %, a bound). 86 runs of 1000 s; Gaussian fit mean 4.15e-17 esu, standard deviation 0.39e-17 (p. 7981). The table prints the uncertainties in the order +-0.041 +-0.042 while the text gives +-0.042 (statistical) +-0.041 (systematic); 0.39/sqrt(86) = 0.042: erratum on the sigma. Theory (Eq. 12, Table II) 4.145e-17 esu (text_kerr_theory)."
[datasets.uncertainty]
column = true
level = "1 sigma"
systematic_relative = 0.01
[datasets.parameters]
temperature_k = 295.0

