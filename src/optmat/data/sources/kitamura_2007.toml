citation = "R. Kitamura, L. Pilon and M. Jonasz, \"Optical constants of silica glass from extreme ultraviolet to far infrared at near room temperature\", Appl. Opt. 46, 8118 (2007)"  # codespell:ignore pilon
doi = "10.1364/ao.46.008118"
library = "Kitamura_2007_OpticalConstantsSilica"
identity = "VALIDATED_WITH_WARNINGS"
kind = "compilation"
technique = """A critical review of the published complex index of silica glass near room \
temperature, 30 nm to 1000 um (Table 1, Figs. 1-5, 7), and a new model for 7-50 um: \
the dielectric function as a sum of eight Gaussian absorption bands and their \
Kramers-Kronig transforms (Meneses et al.'s simplified Gaussian model), fitted with the \
FOCUS program to the normal reflectance computed from Popova et al.'s (1972) n and k \
(pp. 8129-8131)."""
notes = """Pages 8118-8133 are pdf pages 1-16. Identity checked against the first page. A \
review: secondary for every value except its model (the formula below). It tabulates no \
optical constants; the data it collects are shown in Figs. 1-5 (30 nm-1 um, 1-15 um, \
15-100 um, 100-1000 um) and the residuals in Figs. 6-7 (figures, not digitised). 'The \
data collected and presented in this study are available in digital form online' \
(Ref. 79, p. 8132).

TABLE 1 (pp. 8121-8122; the library's OCR of it was rejected, read from the page \
images). The studies reviewed, with range, method, data, temperature, thickness, type \
and sample: [11] Steyer et al., 7.14-25 um, R, T and KK, n, k, RT, type I (Vitreosil); \
[12] Henning and Mutschke, 2-500 um, R and KK, 300/200/100/10 K, type III (Suprasil); \
[13] Koike et al., 7-300 um, T; [15] Randall and Rawcliffe, 110-550 um, interferometric, \
2.1409 mm, type I (Infrasil); [16] Tan (tan_1998), 3-6.7 um, interferometric, 0.23 mm, \
type III (Suprasil 2, ~1000 ppm OH); [23] Malitson (malitson_1965), 0.21-3.71 um, \
minimum deviation, 20 degrees C, type III (Corning 7940, Dynasil, GE 151); [25] Bogdan, \
0.80-2.60 um, k from T (Eq. 14), 298 K, 1.6 mm; [26] Sviridova and Suikovskaya, 0.19-0.42 \
um, k from T, 298 K, 2 mm; [27] Ellis et al., 0.05-0.7 um, R and KK, type III (Suprasil \
UV grade); [28] Tan 1999, 7.19-9.06 um, interferometric, 0.1956 mm, type IV (Suprasil \
W2); [29] Khashan and Nassif, 0.2-3 um, R and T, 24 degrees C; [30] Reitzel, 16.7-25 um, \
R; [44] Rodney and Spindler, 0.35-3.51 um, minimum deviation, 24 degrees C (GE, Heraeus, \
Nieder Fused Quartz, Corning); [45] Tan and Arndt, 1.44-4.77 um, interferometric, 23.5-481 \
degrees C, 0.1994 mm, type IV (Suprasil W2); [49] Popova et al., 7.14-50 um, R and KK, \
types II and IV (KU, KI, impurity <= 0.007 %); [50] Philipp (philipp_1985), 0.0006-500 um, \
compilation; [51] Drummond, 1.00-7.5 um, T, 5 um to 3.06 m; [54] Lamy (lamy_1977), 0.10-0.16 um, R \
and KK (Electro-Quartz); [55] Tan and Arndt, 1.35-4.85 um, interferometric, 23.5 degrees \
C, 0.2345 mm, type IV; [56] Boeckner, 8.13-9.63 um, R; [57] Girin et al., 7.84-12.9 um, R; \
[58] Wray and Neu, 0.23-3.37 um, minimum deviation, 26, 471 and 828 degrees C, type III \
(Corning 7940); [59] Zolotarev, 7.14-11.11 um, R, T and KK (KU, KV, KI, Infrasil); [60] \
Simon and McMahon, 7.14-14.29 um, R; [61] Herzberger and Salzberg, 0.5-4.5 um, minimum \
deviation (GE low-water); [62] Yamamuro et al., 0.37, 0.44, 0.55, 1.01 and 1.53 um, minimum \
deviation, 294, 240, 180 and 120 K; [63] Bach and Neuroth, 0.06-40 um; [64] Beder et al., \
0.2-3.5 um, T, RT-1500 degrees C, 0.953 mm, types I and III (GE 105, GE 151, Vycor 7905); \
[65] Gillespie et al., 2.00-6.00 um, k from T, 25 and 400 degrees C, 2.8 mm (GE 105); [66] \
Calingaert et al., 0.31-3.97 um, k from T, 5.45 mm; [67] Heath and Sacher, 0.16-0.30 um, k \
from T, 2.04-3.29 mm (Corning 7940, Dynasil); [68] Grenis and Matkovich, 1.00-4.62 um, k \
from T, 3.18 mm; [69] Saidov and Bernstein, 7.69-11.11 um, R and KK, 1.0 mm (KU, optical \
grade fused quartz, KI); [70] Efimov, 7.41-50 um, R and dispersion analysis (KI); [71] \
Bogens and Zhukov, 60-560 um, T and R, 0.258-25 mm; [72] Parker et al., 83.3-500 um, T, \
300 K, 1.340 mm; [73] Zhilinskii et al., 50-1000 um, R and T; [74] Bagdade and Stolen, \
100-1000 um, T (GE 101, 106); [75] Tan, Lemon and French, 0.029-1.77 um, T, R and KK, type \
III (Suprasil I); [76] Wong and Whalley, 100-667 um, T, 100 and 300 K (GE 101); [77] \
Mamedov et al., 7.69-11.1 um, internal reflection and KK (KU-1, broken surface); [78] \
Miler, 2-35 um, R and KK.

STATED UNCERTAINTIES AND GRADE EFFECTS (quotes). Abbe and Pulfrich refractometers: \
'within +-2 x 10^-3 and +-5 x 10^-5, respectively' (p. 8119). k from transmission or \
emittance 'sometimes leads to negative values, particularly in the spectral region from \
0.2 to 4.0 um where silica glass is very weakly absorbing' (refs. 25, 26), where 'the \
uncertainty for k is very large and k effectively vanishes' (p. 8119). 'data reported \
by Ellis et al. strongly disagree with all other data between 60 nm and the visible'; \
the extrema of n of Tan 1999, Khashan and Nassif, and Reitzel are inconsistent with the \
rest; data below 9 um agree well, 9-50 um 'considerably less', beyond 50 um fewer n but \
in fair agreement (p. 8122); 'differences larger than 0.5 among reported refractive \
index data in the spectral range between 9 and 10 um' (p. 8131). Discrepancies in k are \
attributed to impurities (OH, alkali, metals), inclusions, bubbles, point defects, \
surface preparation and retrieval (p. 8122). Types (p. 8118): I electric-melted natural \
quartz (metallic impurities; Infrasil, IR-Vitreosil, Pursil, GE 105), II flame-fused \
quartz powder (KU, Herosil, Homosil, Vitrasil, OG Vitreosil), III synthetic from SiCl4 \
in a hydrogen-oxygen flame (high water; KU-1, KV, Suprasil I, Tetrasil, Spectrosil, \
Corning 7940), IV synthetic in a water-free plasma (KI, Suprasil W, Spectrosil WF, \
Corning 7943); Types III and IV have better UV transmission, Type III water peaks near \
2.2 and 2.7 um. OH bands at 2.73-2.85, 3.5 and 4.3 um; Si-O-Si bands at 9-9.5, 12.5 and \
21-23 um (p. 8128). The UV edge (~160 nm) moves with composition, impurities (Fe3+, \
Cr3+, Ti3+ toward the visible), alkali content, point defects and temperature, and lies \
slightly shorter in crystal quartz (pp. 8122, 8128). The fictive temperature is not \
discussed.

REPRODUCED. Eq. (20) is Malitson's Sellmeier equation (malitson_1965/sellmeier; \
'Tan [16] confirmed the validity of Eq. (20) for wavelengths up to 6.7 um', p. 8128), \
recommended for 0.2-7 um; not recorded again. Rodney and Spindler's formula (0.347-3.508 \
um, 31 degrees C) and Tan and Arndt's (1.44-4.77 um, 23.5-481 degrees C) are mentioned, not \
printed.

COMPARISON. The refractiveindex.info page SiO2/Popova (200 rows, 7-50 um) is this \
model's evaluation, not Popova's data: with the corrected prefactor (below) the model \
agrees with it to 1e-3 in n and k (relative 8e-4); with the printed prefactor it differs \
by up to 0.6 (checked 2026-09-26)."""

[[formulas]]
id = "gaussian_ir"
material = "SiO2"
equation = "Eqs. (21)-(24), pp. 8129 and 8131, with Table 2 (tbl_8b4a391ae01b) and its footnote a (p. 8129)"
printed = "eps(eta) = eps'(eta) + i eps''(eta) = eps_inf + sum_j [g_cj^kkg(eta) + i g_cj(eta)] (21); g_cj(eta) = alpha_j exp[-4 ln2 ((eta - eta_0j)/sigma_j)^2] - alpha_j exp[-4 ln2 ((eta + eta_0j)/sigma_j)^2] (22); g_cj^kkg(eta) = (2 alpha_j/pi) [D(2 sqrt(ln2) (eta + eta_0j)/sigma_j) - D(2 sqrt(ln2) (eta - eta_0j)/sigma_j)] (23); D(x) = exp(-x^2) int_0^x exp(t^2) dt (24); n + i k = sqrt(eps) (Eq. 16); eps_inf = 2.1232"
variable = "eta: wavenumber in cm-1 (eta = 1/lambda, Eq. 2); alpha_j amplitude, eta_0j peak position (cm-1), sigma_j full width at half maximum (cm-1)"
range = "7-50 um ('used to interpolate ... for wavelengths between 7 and 50 um'; 'should be used with care when applied outside the spectral range from 0.2 to 50 um', p. 8131)"
coefficients = { eps_inf = "2.1232", kkg_prefactor = "2/pi", alpha_1 = "3.7998", eta0_1 = "1089.7", sigma_1 = "31.454", alpha_2 = "0.46089", eta0_2 = "1187.7", sigma_2 = "100.46", alpha_3 = "1.2520", eta0_3 = "797.78", sigma_3 = "91.601", alpha_4 = "7.8147", eta0_4 = "1058.2", sigma_4 = "63.153", alpha_5 = "1.0313", eta0_5 = "446.13", sigma_5 = "275.111", alpha_6 = "5.3757", eta0_6 = "443.00", sigma_6 = "45.220", alpha_7 = "6.3305", eta0_7 = "465.80", sigma_7 = "22.680", alpha_8 = "1.2948", eta0_8 = "1026.7", sigma_8 = "232.14" }
check = "With the corrected prefactor 2/sqrt(pi) the model reproduces the paper's own statement of the residuals of Philipp's compilation (philipp_1985, Table X [2], 7-50 um): k from -0.246 (20.83 um) to +0.365 (21.74 um), printed -0.25 to 0.37; n up to +0.186 (10.26 um), printed 0.19; n down to -0.372 (21.28 um) where the paper prints -0.42 (not reproduced; the paper does not say at which wavelengths it compared). With the printed 2/pi, those ranges are -0.63 to +0.54 (n) and -0.17 to +0.59 (k). Checked 2026-09-26."
notes = "The eight Gaussian terms were fitted to Popova et al.'s n and k (Opt. Spectrosc. 33, 444 (1972); Table 2 footnote b), through R(eta) (Eq. 25). Residuals from Popova's data 'less than 0.06 except near 9 and 22.5 um, where they reach up to 0.3 around 9 um and 0.14 around 22.5 um'; from all the data of Table 1, 'less than 0.3 except at ~9.0 and 22.5 um' (p. 8131). Room temperature. Table 2 cells checked against the table image (the library selected an OCR body that agrees with the text layer); eps_inf from the page image (the library's footnote text is garbled). Below 7 um the paper recommends Malitson's Eq. (20)."

[[formulas.corrections]]
term = "kkg_prefactor"
printed = "2/pi"
corrected = "2/sqrt(pi)"
reason = "Eq. (23) must be the Kramers-Kronig transform of Eq. (22) ('the above simplified model satisfies the Kramers-Kronig relation', p. 8131). The transform of alpha exp(-x^2) is (2 alpha/sqrt(pi)) D(x), D the Dawson function of Eq. (24); with 2/pi the real part is too small by sqrt(pi)."
evidence = "A numerical principal-value Kramers-Kronig integral of Eq. (22) with Table 2's parameters gives eps' - eps_inf = -2.4436, 4.2287 and -0.9397 at 500, 1000 and 1428.6 cm-1, equal to Eq. (23) with 2/sqrt(pi) and 1.77 times the printed form's -1.3786, 2.3858 and -0.5302; the corrected model reproduces the paper's residual ranges against Philipp's data (check) and refractiveindex.info's evaluation of this model (SiO2/Popova) to 1e-3 (checked 2026-09-26)."
