citation = "H. J. Lehmeier, W. Leupacher and A. Penzkofer, Opt. Commun. 56, 67 (1985)"
doi = "10.1016/0030-4018(85)90069-0"
library = "Lehmeier_1985_NonresonantThirdOrder"
identity = "VALIDATED_WITH_WARNINGS"
kind = "compilation"
technique = """Third-harmonic generation of a mode-locked Nd:glass laser (1.055 um) in He, Ne, \
Ar, Kr, Xe and N2, measuring the third-order hyperpolarizability; the standard \
refractive indices at the fundamental and the harmonic needed for the phase mismatch are \
taken from the literature."""
notes = """The linear refractivities of Table 1 are at standard pressure and \
temperature (1 atm, 0 degrees C, Table 1 caption); they are reproductions (Dalgarno and \
Kingston for the rare gases, Landolt-Boernstein for N2), not measurements of this \
paper. The library's Table 1 header is garbled but its cells are correct (checked \
against the image). Delta k_0 and the coherence length follow from the refractivities \
and are not extracted. Wavelengths are taken as vacuum (lambda_1 = 2 pi c / omega_1).

Third-order data (added 2026-09-26): the paper's own THG \
gamma(3)(-w3; w1, w1, w1) at 1.055 um for He, Ne, Ar, Kr, Xe and N2 (Table 1, SI and \
esu columns, the chi ratio to He, chi_0(He) from note c), and Table 2's comparison at \
694.3 nm (this work transferred, Ward and New normalised, six theories, and the dc Kerr \
gamma(-w; w, 0, 0) of Buckingham and Dunmur). These are the values solprop and Luna \
inherited for He, Ne, Ar, Kr, Xe and N2.

Defining equations, exactly (the conversions depend on them):
- Eq. (1), p. 67: P_NL = 4 eps0 chi(3) : EEE, 'SI units in the notation of ref. [17]' \
(Minck, Terhune and Wang 1966).
- p. 67: E_j = {E_j0 exp[i(k_j z - w_j t)] + c.c.}/2 and P_NL,j = {P_NL,j0 exp[i(k_j z - \
w_j t)] + c.c.}/2, so the field amplitude is E0 with E = E0 cos(...) (the E/2 \
convention for the complex amplitude).
- Eq. (2), p. 67: P_NL,30 = eps0 chi_1111(3)(-w3; w1, w1, w1) E_10^3 exp(-i Delta k z) \
(the 4 of Eq. (1) cancels the 1/4 of cos^3 -> cos 3wt).
- p. 68: I_j = (n_j c eps0 / 2) |E_j0|^2.
- Eq. (13), p. 69: chi_1111(3)(-w3; w1, w1, w1) = eps0^-1 N L(4) gamma_1111(3)(-w3; w1, w1, \
w1) = (N0 p T0 L(4) / eps0 p0 T) gamma(3), with the Lorentz local-field factor L(4) = \
(n1^2 + 2)^3 (n3^2 + 2)/81, N0 = p0/k T0 = 2.6869e19 cm^-3 at p0 = 1 atm (printed \
'1 atm^-1 1.0133 x 10^5 Pa', a garbled '1 atm = 1.0133 x 10^5 Pa') and T0 = 273.15 K: \
an ideal-gas density.
- Hence per molecule p(3w) amplitude = gamma(3) E_10^3 and, on the real field, \
p = 4 gamma(3) E^3. In Shelton and Rice's Taylor convention (p = ... + gamma_T E^3/6, \
with the same K factors) gamma_T = 24 gamma(3). Example: He 24 x 1.13e-64 / \
6.2354e-65 = 43.5 au. gamma(3) is in C m^4/V^3 = C^4 m^4 J^-3, the SI unit of the \
atomic unit.
- Table 2 caption: gamma(3)[esu] = 8.0888e24 gamma(3)[SI] (Ref. 17). Table 2 note b: \
Ward and New's values are 'a factor 4 smaller [here] than those in refs. [1] and [3] \
because of our definition of gamma(3)': Lehmeier's gamma(3) = Ward's chi / 4 = \
gamma_T / 24.
- Eq. (14)-(15), p. 69: n at (p, T) from n0 by Lorentz-Lorenz with ideal-gas scaling.
- Eq. (16)-(17), p. 71: Miller's rule, the anharmonic coupling xi/f^2 of Table 1 (not \
extracted).
- Eq. (18), p. 72: gamma(-w3a; w1a, w1a, w1a) = (omega_0 - omega_3b)/(omega_0 - \
omega_3a) gamma(-w3b; ...), the single-resonance transfer from 1.055 um to 694.3 nm used \
for Table 2 column (a).

Measurement (pp. 69-70): single ~5 ps pulses of a mode-locked Nd-phosphate glass laser, \
lambda_1 = 1.055 um, I10(z_m) ~ 2e9 W/cm^2; cells 4.52 cm (He, Ne; 0.9-2.5 x 10^5 Pa) \
and 1.18 cm (others; 0-0.9 x 10^5 Pa) centred 8 cm behind the focus (b = 0.44 cm, f = \
30.5 cm), in a vacuum chamber with Maker-fringe-minimum windows; T = 296 K (Figs. 2, 3 \
captions). gamma(3) is the best fit of Eq. (12) to eta/I10^2 against pressure, using \
the refractivities of Table 1. Absolute: energies calibrated against a pyroelectric \
meter. Part: THG has no rotational contribution and the atoms' values are electronic; \
N2's contains its (small) vibrational THG part, recorded as total. Lehmeier's density \
is the ideal gas at 296 K (Eq. (13)); the local-field factor is included."""

