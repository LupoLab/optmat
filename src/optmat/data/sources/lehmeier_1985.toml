[[datasets]]
id = "gamma_thg_He"
material = "He"
file = "He/lehmeier_1985__gamma_thg_He.csv"
table = "tbl_3d2f3ba324ee"
quantity = "hyperpolarizability"
unit = "SI"
scale = 1e-64
abscissa_unit = "um"
use = "primary"
notes = "Table 1 (p. 71), gamma_1111(3)(-w3; w1, w1, w1) in 10^-64 C m^4/V^3, the paper's measurement at lambda_1 = 1.055 um (vacuum: lambda_1 = 2 pi c/omega_1), 5 ps pulses, 296 K, 0-2.5 x 10^5 Pa, fitted with Eqs. (12), (13), (15) (ideal-gas N, Lorentz local field). Relative error +-0.1 (p. 71: 'The relative error of the normalized energy conversion is estimated to be about +-0.2 leading to a relative error of the third hyperpolarizabilities of +-0.1'). Convention: Lehmeier's own (p. 67, Eq. (1)): P_NL = 4 eps0 chi(3) EEE on the real field, chi(3) = eps0^-1 N L(4) gamma(3) (Eq. (13), p. 69), so the per-molecule dipole is p = 4 gamma(3) E^3 and gamma_T = 24 gamma(3) (Shelton and Rice's Taylor series, p = ... + gamma_T E^3/6). An atom: THG has no nuclear contribution; the value is electronic."
[datasets.uncertainty]
relative = 0.1
level = "not stated"
[datasets.parameters]
process = "thg"
convention = "lehmeier_1985"
part = "electronic"

