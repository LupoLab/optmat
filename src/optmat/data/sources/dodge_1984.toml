variable = "lambda: wavelength in um (air, inferred; see the source notes)"
range = "0.2025-7.04 um measured (45 wavelengths); Table II computed at 0.20-7.00 um; 'near 19 C'"
coefficients = { A1 = "0.41344023", A2 = "0.50497499", A3 = "2.4904862", lambda1 = "0.03684262", lambda2 = "0.09076162", lambda3 = "23.771995" }
