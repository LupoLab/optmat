range = "The paper's definition of the tunnelling regime; F_BSI is 'the field at which the potential barrier saddle point 2 sqrt(ZF) equals the electron binding energy E0 = Z^2/2n*^2, for a state with m = 0, and neglecting the Stark shift' (p. 4011)"
coefficients = { field_lower = "1.24e8", field_upper = "1.7e6", intensity_lower = "1.6e13", intensity_upper = "3.8e9" }
check = "Computed 2026-09-27 (hartree 27.2114 eV, F_au = 5.1422e9 V/cm, I = c eps0 F^2/2 = 1.32721e-3 F^2): the upper field constant is 1.736e6 (printed 1.7e6) and the upper intensity 4.00e9 (printed 3.8e9, the square of the rounded 1.7e6: 3.84e9); the lower field constant is 1.270e8 (printed 1.24e8, 2 % low), and the lower intensity, 2.0e13 from the printed 1.24e8 or 2.1e13 from 1.270e8, is not the printed 1.6e13 (25 % low). The text's per-atom values (record notes) follow Eq. (10) only roughly (He at 1.06 um: F_TI printed 5.6e8, 5.80e8 from 1.24e8)."
notes = "Fig. 2 draws these limits; F_BSI = E0^2/4 (Z = 1) in its caption. Not corrected: the lower intensity bound's discrepancy is recorded, not explained."
