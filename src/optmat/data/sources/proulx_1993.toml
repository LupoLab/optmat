scale = 1e-53
quantity = "multiphoton_ionization_cross_section"
unit = "cm4 s"
abscissa_unit = "hartree"
use = "check"
notes = "Table 2 (p. L11), 'Present': the two-photon ionisation cross section of ground-state He above the one-photon threshold (excess-photon ionisation), x 10^-53 cm4 s, at omega = 1.0, 1.1, 1.2, 1.3 au: 26.7, 750, 16.2, 10.5. 1.1 au is on a 1De doubly excited resonance below the n = 2 threshold (photoelectron energy 1.297 au; Table 4 places the 2(1,0)2+ 1De peak at 1.2983). The 'Bachau et al' column beside it is bachau_1990's Table I, not taken. No uncertainty stated."
[datasets.parameters]
photons = 2
polarization = "linear"
gauge = "velocity"
final_state = "He+ (1s) + e-"
method = "lowest-order perturbation theory, final-state correlation included (Eq. 8); complex Sturmian two-electron basis l, l' <= 3, n_r, n_r' <= 20, |kappa| = 1.0, arg kappa = 80 degrees; Pade summation"
definition = "sigma_2 in cm4 s, Gamma = sigma_2 Phi^2 with Phi the photon flux in cm^-2 s^-1 (the definition not printed; Table 1's Gamma / I^2 so converted agrees with saenz_1999, the record's notes)"
