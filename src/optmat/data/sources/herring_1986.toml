check = "Against Table I (scratch, 2026-09-26): 80 K within 1.1 %; 195 K off by -2.2 (S(2)), -5.0 (S(4)), +0.3 (S(6)), -4.5 (S(8)), -4.5 (S(10)), -0.4 % (S(12)): not 'better than 3 %' at 195 K for S(4), S(8), S(10). A least-squares C_0 through B_0 gives 6.65, 4.79, 4.85, 5.13, 4.99, 5.45, close to the printed ones."
