[[formulas]]
id = "eq9_power_law"
material = "N2"
equation = "Eq. (9), p. 7; Table VII (tbl_b2bf3ef501ad), p. 7"
printed = "B = B_0 (T/295)^gamma"
variable = "T: temperature in K; B: FWHM self-broadening coefficient of N2 S(J) in MHz per perfect-gas amagat; B_0 its 295 K value (Table I)"
state = "pure N2, self-broadening"
density = "ideal"
range = "80-295 K (the three measured temperatures); S(2)-S(12)"
coefficients = { B0_S2 = "4160", gamma_S2 = "0.33", gamma_S2_error = "0.02", B0_S4 = "3580", gamma_S4 = "0.28", gamma_S4_error = "0.01", B0_S6 = "3560", gamma_S6 = "0.26", gamma_S6_error = "0.04", B0_S8 = "3270", gamma_S8 = "0.33", gamma_S8_error = "0.004", B0_S10 = "3060", gamma_S10 = "0.35", gamma_S10_error = "0.002", B0_S12 = "2870", gamma_S12 = "0.39", gamma_S12_error = "0.03" }
check = "Against Table I at 195 and 80 K (scratch, 2026-09-26): within 2.1 % except S(6) 195 K (+4.1 %: 3197 against 3070) and S(12) 195 K (+4.4 %: 2442 against 2340); the paper says 'Both Eqs. (9) and (10) can be used to predict B to better than 3 % over the range of 80-300 K' (p. 7), which these two rows exceed. A log-linear refit through B_0 gives gamma = 0.335, 0.276, 0.273, 0.331, 0.348, 0.414 (J = 2-12), within 0.025 of the printed values."
notes = "Table VII's B_0 are Table I's 295 K values. The paper's gamma is the exponent of the per-density coefficient; for a per-pressure coefficient 'gamma = 1 - eta' (p. 7), so in the vocabulary's gamma(T0)(T0/T)^N form N = 1 - gamma per atm and N = -gamma per amagat. The printed errors are presumably fit errors (not described). The abstract says 0.25 < gamma < 0.39, the text (p. 7) 0.26 < gamma < 0.39 (Table VII's smallest is 0.26)."

