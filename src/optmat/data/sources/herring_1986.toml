check = "With the printed 4 pi^2, Table IV's A would be 4.31, 6.71, 5.89, 19.32 MHz amagat (80 K S(0), S(1); 295 K S(0), S(1)); Table IV prints 1.37, 2.10, 1.87, 6.15, which 4 pi nu_R^2 D_0 reproduces (1.372, 2.135, 1.874, 6.149; the 80 K S(1) row 1.6 % low) (scratch, 2026-09-26)."
notes = "Eq. (3), rho_c = 3.33 A/Delta nu_D, reproduces Table IV's rho_c (0.095, 0.087, 0.068, 0.134); curated as eq3_cutoff."
[[formulas.corrections]]
term = "prefactor"
printed = "4 pi^2"
corrected = "4 pi"
reason = "Eq. (2) as printed is a factor pi larger than every A of Table IV, which the paper computes with it; 4 pi nu_R^2 D_0 reproduces Table IV to 0.3 % (three rows) and 1.6 % (80 K S(1)). It is also Bischel and Dyer's Eq. (7) (Ref. 18, Phys. Rev. A 33, 3113), Delta nu_FWHM = D_0 k_e^2/(pi rho) with k_e = 2 pi nu_R, i.e. A = 4 pi nu_R^2 D_0."
evidence = "Eq. (2) on p. 5 (journal p. 1948; the pdf page image checked) prints 4 pi^2. Table IV (tbl_0e34a8d11d00, image checked): nu_R 354 and 587 cm-1, D_0 0.871, 0.493, 1.19, 1.42; A 1.37, 2.10, 1.87, 6.15 MHz amagat. bischel_1986 Eq. (7), p. 6."

