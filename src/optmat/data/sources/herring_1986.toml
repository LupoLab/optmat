notes = "'There is a cutoff density, rho_c, at which this model [Eq. (1), the diffusion model] predicts a linewidth that is 10% larger than that predicted by the \"hard collision\" line-shape theory' (p. 5), from Bischel & Dyer (Ref. 18); above it the line is Lorentzian with the width of Eq. (1)."

