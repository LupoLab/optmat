citation = "G. C. Herring, M. J. Dyer and W. K. Bischel, \"Temperature and density dependence of the linewidths and line shifts of the rotational Raman lines in N2 and H2\", Phys. Rev. A 34, 1944 (1986)"
doi = "10.1103/PhysRevA.34.1944"
library = "Herring_1986_TemperatureDensityDependence"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Quasi-cw stimulated Raman gain spectroscopy (pp. 1-2): a single-mode Kr-ion \
probe at 568 nm (< 30 MHz) and a pulse-amplified single-mode cw dye pump near 565 nm \
(10 ns, 100 MHz linewidth), crossed at 1.0 degree in a sample cell (80, 195 or 295 K) \
and a room-temperature reference cell; Stokes S-branch lines. Densities 0.01-2.0 \
amagat (N2) and up to 3 amagat (H2), from a Baratron gauge and a thermocouple by the \
perfect-gas law (the virial correction is below 1 %, p. 2). Line shapes fitted with \
Voigt profiles, the Gaussian part being the pump-laser width (about 100 MHz); the \
Lorentzian FWHM against density gives B."""
notes = """Identity checked against the first page. Page numbers are pdf pages (1-8 = \
journal pp. 1944-1951). Materials: 14N2 and H2 (normal, ortho:para 3:1, Table IV \
caption); no other isotopologue is measured. Odd-J N2 lines were not studied (p. 3).

WIDTH CONVENTION. Every width and coefficient is a FULL width: Fig. 3's axis 'FWHM \
RAMAN LINEWIDTH (MHz)' for the N2 S(10) data from which B is fitted; for H2, Eq. (1), \
p. 5: 'the Raman line-shape function is Lorentzian with a FWHM linewidth Delta nu that \
can be expressed as Delta nu = A/rho + B rho'. B in MHz per perfect-gas amagat (p. 2). \
N2: the law is linear in density, no Dicke term ('Doppler broadening (5 MHz), and hence \
the Dicke narrowing, is negligible', p. 2). H2: the law INCLUDES the Dicke term A/rho \
(A in MHz amagat), but A was NOT fitted: it was computed by Eq. (2) from the \
self-diffusion coefficients D_0 of Bischel and Dyer's Q-branch study (Ref. 18 = \
bischel_1986, Table III) and held fixed, B being the one free parameter (p. 5); 'the \
maximum correction to the linewidth due to including the collisional narrowing term \
... is on the order of 5-10 %' (p. 5).

UNCERTAINTIES (p. 3). N2 Table I: 'For S(4) through S(12), the specified \
uncertainties are one standard deviation for the least-squares fit. For S(0), S(2), \
S(14), and S(16), data were obtained at only one density, and the uncertainties shown \
... represent the error in the linewidth determination of a single-line profile.' \
'Systematic errors, due to uncertainty in the dye-laser scan width, are about 1 % or \
less.' H2 Table V: 'one standard deviation for the one-parameter linear least-squares \
fit' (p. 5). Tables III and VI: not stated.

TABLE I against TABLE II. The 'Present work' column of Table II repeats Table I's 295 \
K values except S(6), 3570 +- 30 (Table I 3560 +- 30), and S(10), 3070 +- 60 (Table I \
3060 +- 60); both images checked. Table VII's B_0 are Table I's (3560, 3060). \
Unresolved; Table I is the primary.

LINE SHIFTS (p. 6). N2: self and O2-induced shifts 'in the range 50-150 MHz/amagat' \
with no consistent J or T dependence, disturbed by an unexplained line asymmetry; the \
paper gives only an upper limit, 'the density line shifts are less than 150 \
MHz/amagat' (not extracted). H2: Table VI, delta nu = nu_R(rho) - nu_R(0) (Eq. (5); a \
negative shift lowers the Raman frequency). At 80 K the Q(1) shift is 13 times the \
S(1) shift (p. 6).

TABLE IV (p. 5), ortho:para 3:1: nu_R (354 and 587 cm-1, rounded), the Doppler FWHM \
by Eq. (4), A by Eq. (2), and, not extracted (no quantity), D_0 (cm2 amagat s-1, note a \
'Reference 18': bischel_1986 Table III, whose 81 and 298 K Q(0) and Q(1) values are \
reused here at 80 and 295 K for S(0) and S(1)) and rho_c (amagat, Eq. (3)): 80 K S(0) \
D_0 0.871, rho_c 0.095; 80 K S(1) 0.493, 0.088; 295 K S(0) 1.19, 0.068; 295 K S(1) \
1.42, 0.134.

TEMPERATURE LAWS (Table VII, p. 7). Eq. (9) B = B_0 (T/295)^gamma is a law for the \
per-density coefficient; the paper notes (p. 7) that 'gamma ... is related to eta by \
gamma = 1 - eta, where eta is the exponent of the temperature for pressure-broadening \
coefficients'. In the vocabulary's form gamma(T) = gamma(T0)(T0/T)^N, N = -gamma for B \
per amagat and N = eta = 1 - gamma for a coefficient per unit pressure. Recorded as \
formulas (not as broadening_temperature_exponent datasets, whose N is not the printed \
gamma).

solprop: its N2 rotational FWHM density coefficient, 3.3e9 Hz/amagat, cites this paper \
without a J: Table I at 295 K runs from 4160 (S(2)) to 2660 (S(14)) MHz/amagat; 3.3e9 \
is S(8) (3270) rounded. Its H2 rotational law, 6.15e6/n + 114e6 n Hz (n in amagat, \
'Tables IV/V: S(1), 295 K'), is Table IV's A = 6.15 MHz amagat and Table V's B = 114 \
MHz/amagat for S(1) at 295 K exactly. Ref. 4 is 'G. V. Milahailov [sic], Zh. Eksp. \
Teor. Fiz. 36, 1368 (1959) [Sov. Phys.-JETP 9, 974 (1959)]', the paper in the library \
as Mikhailov_1959 (see mikhailov_1959)."""

