citation = "S. A. Danichkin, A. A. Eliseev, T. N. Popova, O. V. Ravodina and V. V. Stenina, \"Raman scattering parameters for gas molecules (survey)\", J. Appl. Spectrosc. 35, 1057 (1981) [Zh. Prikl. Spektrosk. 35, 581 (1981)]"
doi = "10.1007/bf00605646"
library = "Danichkin_1981_RamanScatteringParameters"
identity = "VALIDATED_WITH_WARNINGS"
kind = "compilation"
technique = """A survey of the vibrational Q-branch Raman parameters of gases measured before \
1980 (mercury-lamp and laser work): frequency shifts, depolarization ratios and \
cross sections relative to the N2 Q branch, every value converted by the authors to one \
system of measurement, 488.0 nm linearly polarized excitation, observation at theta = \
pi/2 to the electric vector (and phi = pi/2 to the beam), the cross section the sum of \
both polarization components of the Q branch, with Eqs. (5)-(14) relating other \
geometries and natural light, a lambda_RS^-4 law between excitation wavelengths, and \
rho = (1/4) rho_pol/(1 - rho_pol) from a whole-band to a Q-branch depolarization \
ratio (pp. 1057-1061). The absolute N2 cross section is evaluated from nine results \
(Table 2) and the survey recommends values (Table 3)."""
notes = """English translation, J. Appl. Spectrosc. 35, 1057-1066 (1981), translated from \
Zh. Prikl. Spektrosk. 35, No. 4, 581-591 (1981) (footnote p. 1057); PDF page n is p. \
1056 + n. The volume first requested (35) is right; the pages are 1057-1066. Identity \
checked on the first page (authors) and the running footnote.

WHAT IS TAKEN. Table 1 (Frequency Shifts and Experimental Values of Degrees of \
Depolarization and Relative Scattering Cross Sections for the Q Branch of Vibrational \
RS in Gases; tbl_fede8ab1f190 p. 1058, continued tbl_e069277a54e8 p. 1059 and \
tbl_c9af12ff6f78 p. 1060), for the curated species N2, O2, D2, H2, O3, CO, CO2 (nu1, \
2nu2 and the hot bands at 1409 and 1265 cm-1), N2O (nu1, nu3) and CH4 (nu1): the shift \
(raman_shift, check), each measured depolarization ratio with its reference \
(depolarization_ratio, reproduced) and each cross-section ratio to N2 with its \
excitation wavelength and reference (raman_cross_section_ratio, reproduced). SF6 is not \
in the survey. Table 2 (absolute_N2, reproduced) and the text's recommended sigma_N2 \
(check); Table 3's recommended rho and sigma/sigma_N2 (check). Out of scope and not \
transcribed: F2, NO, H2O, HCl, SO2 (nu1, nu2), HBr, HF, Cl2, DCl, DBr, BrCl, Br2, I2, \
ICl, IBr, H2S. The 'values used in calcula.' column of Table 1 (the adopted \
depolarization ratio) is the rho of Table 3; the per-molecule datasets quote it.

STRUCTURAL FIX. The library's Table 1 cells join the stacked lines of each column \
without separators and lose the foot of the hydrogen block (a ratio, two wavelengths, \
a reference): the in-scope lines are transcribed from the images in the script, which \
checks them against every cell it can (see tools/extract/danichkin_1981.py). Decimal \
commas are printed; the values use points.

ALL MEASURED VALUES ARE REPRODUCTIONS, converted: 'all RS parameters tabulated in \
Table 1, are referred to a single system of measurements, corresponding to lambda_0 = \
488.0 nm, linearly polarized exciting radiation, observation angle theta = pi/2, \
scattering cross section equal to the sum of both polarization components for the Q \
branch, unless otherwise stated. This transition is made with the help of the equations \
presented above' (p. 1061). The abscissa of every file is therefore 488.0 nm (standard \
air, the Ar+ line); the original excitation wavelength of each cross-section ratio is \
the column excitation_nm. Of the cited works kolos_1967 (ref. [17]), murphy_1969 (ref. \
[10]), fenner_1973 (ref. [12]) and hyatt_1973 (ref. [42]) are curated (the last two \
re-pointed 2026-09-27; see RE-POINTING below). The ratios are 'per molecule': 'In Table 1, cross sections \
calculated per molecule are presented', divided by the fraction N/N0 of molecules in the \
initial level at 300 K: 0.95 for O3 (nu1), 0.91 for SO2, 0.92 for CO2 (nu1, 2nu2), 0.88 \
for N2O (nu1, nu2), 0.99 for F2, 0.075 for the CO2 hot bands at 1409 and 1265 cm-1 \
(lower level 01(1)0 at 667 cm-1), and 1 for N2, O2, H2, D2, CO, CH4 (p. 1063).

TABLE 2 (p. 1062, the library's unlabelled tbl_d60a413f5ef7; image checked, its caption \
is printed above the table). Per row: lambda_0; the original result; the converted \
cross section; the reference; the method; the conditions. [23] 435.8 nm, (I_RS/I_Ray) \
(nu_0/(nu_0 - Delta nu)) = 0.9e-3 -> 4.7, from the ratio to Rayleigh scattering with \
sigma_par^Ray = (2.12 +- 0.09)e-28 cm^2 sr^-1 at 694.3 nm and rho^Ray = (0.59 +- \
0.03)e-2 [33], natural light, Q branch, phi = 90 deg. [10][5] 435.8 nm, I_N2/I_CH4 = 0.14 \
and 0.17 (entire band) +- (<10 %) -> 5.5 and 6.2 (entire band), with methane's sigma = \
6.58e-30 cm^2/sr +- 5 % (murphy_1969). [34] 694.3 nm, sigma_0 = 2.3e-30 cm^2 (total, \
pulsed) -> 13.80. [22] 514.5 nm, sigma = (4.4 +- 1.7)e-31 cm^2 sr^-1 against benzene \
[35] -> 5.5. [7] 514.5 nm, sigma_par = (4.3 +- 0.2)e-31, against Rayleigh and a standard \
lamp -> 5.6. [12] 488.0 nm, sigma_par = (3.3 +- 1.1)e-31, calibrated spectrometer -> \
3.4. [12] 488.0 nm, sigma_par = 4.3e-31 against benzene [36] -> 4.4. [42] 488.0 nm, \
sigma_par = (5.4 +- 0.3)e-31, against the H2 rotational line 1-3 -> 5.5. [42] 514.5 nm, \
sigma_par = (4.2 +- 0.2)e-31 (the opening parenthesis is missing in print) -> 5.4. \
Recommended (p. 1063): sigma_N2 = (5.5 +- 0.2)e-31 cm^2 sr^-1 at 488 nm.

For review: with the recommended sigma_N2 and the ratios, an absolute Q-branch cross \
section at 488 nm follows for every molecule (e.g. O2 1.23 +- 0.06, CH4 7.3 +- 0.8, H2 \
3.2 +- 1.5 times 5.5e-31 cm^2/sr). H2's recommended ratio carries a 47 % uncertainty; \
the H2 entries spread from 1.62 to 5.88.

Q-BRANCH WIDTH (p. 1064; notes only, no linewidth measured here): the approximate \
width delta = alpha k T ln2/(h B) of an unresolved Q branch [3]; 'for N2, O2, and CH4 \
under different pressures and normal temperature, the width of the Q branch does not \
exceed 3 cm^-1' [39] (Mikhailov, Tr. FIAN 27, 150 (1964)); CO2 likewise [40]; for H2 at \
300 K the most intense Q line is J = 1 (Fig. 2a, from [5]). Figures 1-2 are schematic \
and a digitised spectrum: nothing taken.

ISOTOPOLOGUES: natural gases; H2 and D2 are normal hydrogen and deuterium (no \
ortho:para statement). CD4, HD and the other isotopologues are not in the survey.

RE-POINTING (2026-09-27): the citations of ref. [12] (Fenner, \
Hyatt, Kellam and Porto 1973) and ref. [42] (Hyatt, Cherlow, Fenner and Porto 1973) in \
reproduced_from are now the curated fenner_1973 and hyatt_1973; no value changed. \
Against the originals (fenner_1973 Tables II and IV, hyatt_1973 Table II; Danichkin's \
values are converted to the survey's system, so small differences are expected): O2 \
1.33 +- 0.13 (Fenner 1.3), CO 1.02 (1.0), CO2 nu1 1.41 (1.4), CO2 2nu2 0.91 (0.89), CH4 \
6.0 (6.0), H2 entire band 2.44 (Fenner's 'H2 (sum)' 2.4), H2 Q(1) 1.6 (1.6), N2O nu1 \
2.50 (2.2: the ratio 1.136 is Danichkin's division by N/N0 = 0.88), N2O nu3 0.62 (0.51: \
a factor 1.22 that the stated 0.88 does not explain); absolute N2 3.4 and 4.4 (Fenner \
3.3 +- 1.1 and 4.3), 5.5 and 5.4 (Hyatt 5.4 +- 0.3 at 488.0 nm and 4.2 +- 0.2 at 514.5 \
nm, the latter scaled to 488 nm). The H2 row 'ref. [12], 514.5 nm, 2.26' has no \
counterpart in Fenner et al., who measured at 488.0 nm only: the reference or the \
wavelength of that row is doubtful (ref. [18], Carlson and Fenner 1972, is another \
candidate; not in the library). The CO2 values are not divided by the 0.92 Danichkin \
et al. state for CO2 (1.4/0.92 = 1.52 against 1.41), unlike N2O nu1."""

