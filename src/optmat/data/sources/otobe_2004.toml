table = "tbl_a857b4484f15"
quantity = "ionization_rate"
unit = "au"
scale = -0.0734986443513289
abscissa = "intensity"
abscissa_unit = "W/cm2"
use = "check"
notes = "Table II (p. 053404-6), column '2p_x (eV)' (Xe 5p_x, perpendicular to the field): Gamma_x, the imaginary part of the complex Kohn-Sham (KLI-SIC) orbital energy in a static field, eV as printed, against the 'laser intensity' of the field (I = c eps0 F^2/2: 4-9e13 W/cm^2 are F = 0.0338-0.0506 au). scale = -2/27.211386245981 makes it the rate of the orbital w = -2 Gamma/hbar in atomic units (Eq. (10)): the rate of ONE electron in that orbital; the atom's 5p rate is 2 x (w_px + w_py + w_pz) (record notes). Equal to p_y. No uncertainty is stated."
