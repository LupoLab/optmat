citation = "J. Kestin, Ö. Korfali, J. V. Sengers and B. Kamgar-Parsi, \"Density dependence and composition dependence of the viscosity of neon-helium and neon-argon mixtures\", Physica A 106, 415 (1981)"
doi = "10.1016/0378-4371(81)90121-7"
library = "Kestin_1981_DensityDependenceComposition"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """A viscosity study (oscillating-disk viscometer at 25 °C) of He-Ne and \
Ne-Ar mixtures, which also measured the density of two Ne-Ar mixtures against \
pressure (pp. 417-419). Mixtures prepared gravimetrically, the mole fractions known \
'to about four significant figures' (p. 417); purities 99.995 % He, 99.997 % Ne, \
99.998 % Ar. Pressure by a dead-weight gauge, 'about 0.0003 MPa at pressures up to \
3 MPa and 0.003 MPa at pressures beyond 3 MPa' (p. 418). Density by weighing the charge \
of a mixture cylinder of known volume at the viscometer's pressure, the volume \
calibrated against pressure with pure argon and neon of known density (Michels' \
equations of state); the room kept close to 25 °C (pp. 418-419)."""
notes = """Identity VALIDATED_WITH_WARNINGS by the library (Crossref fields). Printed \
pp. 415-442 (pdf pages 1-28; printed page = pdf page + 414). Mainly a viscosity paper; \
only its equation-of-state data are recorded here.

TABLE III (p. 421; Experimental pressures and densities for two Ne-Ar mixtures at \
25 °C; image checked against every extracted cell, 2026-10-01, all agree): \
x_Ar = 0.2727 (10 rows, 0.43-16.40 MPa) and 0.7722 (11 rows, 0.70-13.70 MPa), each row \
P (MPa), rho x 10^3 (mol/cm^3), Z_exp = PV/RT and (Z_exp - Z_calc) x 10^3. Extracted: \
the density (mixture_density, primary) and Z_exp (mixture_compressibility_factor, \
check) against pressure, all rows (the table stops at 16.4 MPa, 162 atm, just above \
the 150 atm used for other sources; the whole table is kept). Z_exp is computed from \
the same P and rho, rounded to three decimals: it is a check on the density, never \
fitted beside it.

CHECKED: Z_exp = P / (rho R T), R = 8.31441 J/(mol K), T = 298.15 K, reproduces every \
printed Z_exp within its rounding except the first row of x_Ar = 0.7722 \
(P = 0.7032 MPa, rho = 0.3522e-3 mol/cm^3), which gives 0.805 against the printed \
1.000. The printed Z_exp = 1.000 and residual +1e-3 are consistent with the pressure \
and the paper's equation of state (rho = 0.2837e-3 mol/cm^3 would give both), not \
with the printed density, and a density of 0.3522e-3 at that pressure would leave a \
residual of -0.19 that the fit would not have hidden. One of the two printed numbers \
is wrong; which cannot be shown from the paper, so no erratum: the row is excluded \
from both datasets of that mixture. Refitting the paper's Eqs. (2)-(6) to the other \
20 rows (Z from P and rho; B_ii and C_iii of Table IIA; E the only free parameter) \
gives E_Ne-Ar = 12.99 cm^3/mol against the printed 12.95 (p. 420), which reproduces \
it within the rounding of Table IIA's pure-gas coefficients. The printed residual \
column is not reproduced: recomputed from the printed Z_exp with Table IIA's B and C \
the residuals have an rms of 1.0e-3, the printed ones 2.3e-3, and the two differ by \
up to 3e-3 (rms 2.4e-3). Left in the printed cells, not used.

TABLES IIA and IIB (p. 419): B (cm^3/mol) and C ((cm^3/mol)^2) of Ne-Ar (x_Ar) and \
He-Ne (x_Ne) mixtures at 25 °C. The pure-gas rows are the authors' refits of Eq. (2) \
to the isotherms of Michels and coworkers for helium, neon and argon (0-160 atm, \
their refs. 12, 13 and 15); the mixture rows are computed from them by Eqs. (3)-(6) \
with the excess second virial coefficient E = B_12 - (B_11 + B_22)/2: 12.95 cm^3/mol \
for Ne-Ar (this work, from Table III) and 0.76 cm^3/mol for He-Ne (Brewer and \
Vaughn, J. Chem. Phys. 50, 2960 (1969), the paper's ref. 16; not in the library). Checked \
(2026-10-01): the mixture B are reproduced from the pure rows and those E to 0.01 \
cm^3/mol (Ne-Ar 9.16, 3.00, -4.99 for the printed -4.98; He-Ne 11.93, 11.99, 11.76), \
and the C within 1 (cm^3/mol)^2 by the geometric-mean rule (6). Extracted: the \
mixture B (mixture_second_virial_coefficient), as checks, since they are model \
values (the He-Ne ones rest on Brewer and Vaughn's E). Not extracted: the pure-gas \
rows (refits of Michels' data, which optmat would take from the originals) and C (no \
quantity in the vocabulary). He-Ne is filed under helium (He sorts before Ne) with \
helium's mole fraction, 1 - x_Ne: 0.8021, 0.5965 and 0.2172 for the printed x_Ne \
0.1979, 0.4035 and 0.7828.

E_Ne-Ar = 12.95 cm^3/mol at 25 °C (p. 420, text): the excess second virial \
coefficient fitted to Table III, entered inline. The paper compares it with Brewer \
and Vaughn's 13.00 cm^3/mol; that value, and E_He-Ne = 0.76 cm^3/mol, are Brewer and \
Vaughn's and are not recorded here (to be curated from the original).

NOT EXTRACTED: the viscosities (Tables IV-VI) and the viscosity expansions (Tables \
VII-IX). The densities printed beside the viscosities are, for neon, the He-Ne \
mixtures and the first 20 points of x_Ar = 0.5467, computed from the measured \
pressure and the equation of state above (p. 426); for the other Ne-Ar points they \
are measured, but Table VI prints no pressure, so they are not pressure-density data.

UNCERTAINTY: the densities 'with an accuracy of about 0.1%' (p. 419), level not \
stated; the pressure as above; the composition to about four significant figures. \
The temperature is 25 °C as the caption states; the room was kept 'close to 25 °C' \
(p. 418) and the viscometer temperatures of Table VI lie within 0.25 K of it (24.77 to \
25.23 °C)."""

