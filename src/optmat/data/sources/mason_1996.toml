file = "O3/mason_1996__present.csv"
table = "tbl_cf055268b405"
quantity = "interval_oscillator_strength"
abscissa_unit = "eV"
columns = { x_upper = "eV" }
use = "check"
notes = "Table 3 'Present': oscillator strengths integrated from this paper's cross section over 8 intervals (3.675-3.956 eV, the Huggins band; 4.13-6.20 and 3.75-6.25 eV, the Hartley band; then 6.25-11.25 eV). The last interval ends at 11.25 eV (note a), not 11.30. Abscissa: the interval's lower edge E_1 (eV), row id the interval. Integrated band strengths: a check (the cross section itself is only in figures). Uncertainty not stated."

