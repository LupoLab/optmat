citation = "N. J. Mason, J. M. Gingell, J. A. Davies, H. Zhao, I. C. Walker and M. R. F. Siggel, \"VUV optical absorption and electron energy-loss spectroscopy of ozone\", J. Phys. B: At. Mol. Opt. Phys. 29, 3075 (1996)"
doi = "10.1088/0953-4075/29/14/019"
library = "Mason_1996_VUVOpticalAbsorption"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Synchrotron-radiation absorption at the SERC Daresbury source, Beam Line 3.1, with \
the Daresbury Laboratory molecular science absorption apparatus: a 16 cm cell between LiF \
windows, a sodium-salicylate-coated exit window and photomultiplier; low-energy grating, \
2.3 eV (540 nm) to the LiF cut-off 11.3 eV (110 nm), covered in sections of about 20 nm \
scanned in steps of 0.05 nm; fixed sample pressure 10 mTorr - 1 Torr (Baratron), ring \
current monitored, I0 from the evacuated cell; Beer-Lambert law (Eq. 1); checked for line \
saturation (pp. 3077-3078). Sample: an ozone/oxygen mixture (about 45 % O3) from a \
calibrated storage bulb (Davies et al. 1993). Also near-threshold electron energy-loss \
spectra (trapped-electron spectrometer), not optical data."""
notes = """Identity checked against the first page (PDF page 2, journal p. 3075): Mason, \
Gingell, Davies, Zhao, Walker and Siggel, J. Phys. B 29, 3075 (1996). Journal pages \
3075-3089 = PDF pages 2-16 (page 1 is the publisher's cover). O3 only.

The cross sections are given only in figures: Fig. 5 (105-480 nm, 3.5-11.3 eV, in Mb \
against photon energy), Fig. 6 (the Hartley and Huggins bands), Fig. 7 (the Rydberg \
region); 'The final VUV absorption cross sections for ozone for 354 > lambda > 110 nm \
(3.5 < E < 11.3 eV) are given in figures 5-7' (p. 3079). No table of cross sections \
(the Mainz atlas's Mason data are a digitisation of Fig. 5).

Facts for the data files (pages checked on the page images):
- Absolute scale (pp. 3079-3080): the O2 part of the mixture was removed by normalising \
the mixture's spectrum to a pure-O2 spectrum at the O2 band at 9.96 eV, 'fully \
consistent with the previously calibrated concentrations' (about 45 % O3, less than 2 % \
degradation in the cell); a CO impurity (A 1Pi bands, 6-8 eV, from ozone attacking the \
viton seals) was also subtracted. 'By normalizing the present data at lambda = 253 nm \
to the value of Mauersberger [Mauersberger et al. 1987], it was possible to reconfirm \
the ozone partial pressures within the gas cell and monitor any degradation': the \
Hartley peak is tied to Mauersberger et al.'s 253 nm cross section.
- Uncertainty: not stated for ozone. 'Having measured cross sections for many other \
molecular targets in this region with excellent (<= 5%) agreement to current standards \
and with no indication of wavelength dependence in the detection efficiencies, we are \
confident that the present results are the most reliable ozone VUV absorption cross \
sections for 185 > lambda > 110 nm (6.7 < E < 11.3 eV) currently available' (p. 3085).
- Wavelengths: vacuum (a vacuum-ultraviolet synchrotron monochromator; not stated \
explicitly); the figures are in photon energy.
- Temperature: not stated (room temperature; the atlas's 298 K is not in the paper).
- Resolution: not stated; sampling 0.05 nm steps (p. 3077); 'the higher resolution in \
the present data reveals fine structure within features 4-7' (p. 3079).

Datasets: Table 3 (image checked), the oscillator strengths of band structures: the \
present values ('Integration of the cross section over all wavelengths (3.75 < E < \
6.25 eV) of the Hartley band', p. 3084) and those of other experiments and theories \
(reproduced). Format need, as kumar_2010_supplement: an interval-integrated oscillator \
strength has no quantity of its own; oscillator_strength at the interval's lower edge E_1 \
(eV) is used, the interval in the row id. Check (2026-09-25): the present values over \
the contiguous intervals 3.75-6.25, 6.25-7.50, 7.50-8.90, 8.90-9.76, 9.76-10.70 and \
10.70-11.25 eV sum to 0.3692, the total oscillator strength below 11.25 eV.

Not extracted: Table 1 (band centres in eV of features 1-7, present and four earlier \
works) and Table 2 (Rydberg states: energies, assignments, quantum defects, term \
values): no vocabulary quantity. The first three vertical ionisation energies quoted, \
12.75, 13.03 and 13.57 eV, and the adiabatic 12.52 eV used (p. 3083), are reproduced \
from photoelectron work."""

