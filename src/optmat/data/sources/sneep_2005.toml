citation = "M. Sneep and W. Ubachs, J. Quant. Spectrosc. Radiat. Transfer 92, 293 (2005)"
doi = "10.1016/j.jqsrt.2004.07.025"
library = "Sneep_2005_DirectMeasurementRayleigh"
identity = "VALIDATED"
kind = "measurement"
technique = """Pulsed cavity ring-down extinction (mirror reflectivity above 99.98 %, 82 cm \
cavity), the decay rate recorded during a 15 min pressure ramp from vacuum to about \
1 bar; the cross section is the slope of the loss rate against the density \
(Eq. 8), the density from a capacitance manometer (2 hPa) and the cell temperature \
(about 20 C) by the ideal gas law ('a negligible error of < 0.5%', p. 7). Nd:YAG-pumped \
dye laser (0.05 cm^-1) at 470-490 nm (Ar, N2) and 470-570 nm (CO2), and the unseeded \
Nd:YAG second harmonic at 18 788.4 +- 0.4 cm^-1 (532.2 nm, 1 cm^-1 bandwidth) for Ar, \
N2, CO, CO2, CH4, N2O, SF6 and O2 (pp. 5-7, 12)."""
notes = """The measured quantity is the total extinction, taken to be the Rayleigh \
scattering cross section (all Cabannes, Brillouin, Raman and wing contributions; no \
absorption assumed), per molecule. Comparison 'n-based' cross sections use Eq. (2), \
sigma = 24 pi^3 nu^4 / N^2 ((n^2 - 1)/(n^2 + 2))^2 F_k(nu), with the refractive index at \
15 C and 1013 hPa and N = 25.47e18 cm^-3 (the ideal-gas density there, p. 8). \
Forward and backward scattering kept in the cavity bias the result low by 'less than \
0.01%' (p. 7).

Datasets: the 532.2 nm cross sections of Table 2 (measured, primary; n-based, check) \
and oxygen's Rayleigh part from a three-component fit (text, p. 15). The \
wavelength-resolved Ar, N2, CO2 data (13, 23 and 47 new frequencies, with earlier \
Naus and Ubachs 2000 data) are shown in Figs. 4 and 5 only and are not extracted; \
Table 1 gives power-law fits to them (formulas *_power_*).

Carbon monoxide (section 5.1, pp. 12-13; Table 2): purity 99.997 %, three pressure \
ramps; measured 6.19 (0.4) against n-based 6.82 x 10^-27 cm^2, 9 % low, one of the \
'somewhat larger discrepancies' of the abstract. Table 2's (n - 1) = 325e-6 is from \
the authors' Eq. (17), a fit to Smith et al.'s 38 values (smith_1976 Table VII, both \
the measured and the interpolated cells), and F_k = 1.016 from Bridge and \
Buckingham's rho_p = 0.0048 at 632.8 nm (Eq. 7 gives 1.0161), taken as \
wavelength-independent after Oddershede and Svendsen (1982). Eq. (2) with 325e-6 and \
1.016 gives 6.817e-27 (printed 6.82; checked 2026-09-25).

Table 2's (n - 1) x 10^6 at 15 C, 101 325 Pa, from the formulas below, are Ar 268, N2 \
284, CO2 427, CH4 481, N2O 483, SF6 733; its F_k are Ar 1, N2 1.035, CO2 1.145, CH4 \
1.000, N2O 1.225, SF6 1.000. With these, Eq. (2) reproduces the n-based column (Ar \
4.561, N2 5.298, CO2 13.31, CH4 14.684, N2O 18.182, SF6 34.108 x 10^-27 cm^2 against \
4.56, 5.30, 13.29, 14.69, 18.19, 34.1; checked 2026-09-25).

The measured values lie below the n-based ones by 2.5-4 % for Ar, N2 and CO2 at \
532.2 nm and by up to 15 % for CH4 ('We do not have an explanation for the obtained \
differences', p. 14); over 470-645 nm Ar and N2 agree with the n-based values to 1 % \
on average and CO2 is 3.9 % low (Table 1). Purities (Table 2): Ar 99.999, N2 99.9, \
CO2 99.7, CH4 99.5, N2O 99.7, SF6 99.8 %. Pressure ramps: 3, 3, 4, 3, 2, 2.

Oxygen at 532.2 nm shows a quadratic density dependence from the O2-O2 \
collision-induced absorption peaking at 532.2 nm (Eq. 22); the three-component fit \
gives sigma_R = (4.50 +- 0.15) x 10^-27 cm^2 (p. 15). With the Rayleigh part fixed at \
the n-based value, sigma_CIA = (1.01 +- 0.03) x 10^-46 cm^5 molecule^-2 (not \
extracted; no quantity). The n-based oxygen value is printed '4066 x 10^-27 cm^2' \
(p. 16, page image checked), evidently 4.066 x 10^-27; it is not reproduced by \
Eqs. (23) and (24) (see o2_eq23)."""

