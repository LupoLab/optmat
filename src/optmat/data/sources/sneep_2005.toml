[[formulas]]
id = "ar_eq9"
material = "Ar"
equation = "Eq. (9), p. 8"
printed = "(n - 1) x 10^8 = 6432.135 + 286.06021 x 10^12 / (14.4 x 10^9 - (nu/cm^-1)^2)"
variable = "nu: vacuum wavenumber in cm^-1"
state = "1atm_15C"
density = "real"
range = "5000-33000 cm^-1 (as stated)"
coefficients = { A = "6432.135", B = "286.06021e12", C = "14.4e9" }
reproduced_from = ["peck_1964"]
check = "Identical to peck_1964's 15 C formula (643.2135 + 286060.21/(144 - sigma^2), x 10^-7) rewritten in cm^-1; gives (n - 1) = 267.97e-6 at 18 788.4 cm^-1 (Table 2: 268). Checked 2026-09-25."
notes = "Peck and Fisher's formula is for the real gas at 15 C; the authors use it with the ideal-gas N = 25.47e18 cm^-3 (a 0.1 % inconsistency in n - 1)."

[[formulas]]
id = "n2_eq10"
material = "N2"
equation = "Eq. (10), p. 10"
printed = "(n - 1) x 10^8 = 6498.2 + 307.43305 x 10^12 / (14.4 x 10^9 - (nu/cm^-1)^2), 4860 cm^-1 < nu < 21360 cm^-1"
variable = "nu: vacuum wavenumber in cm^-1"
state = "1atm_15C"
density = "ideal"
range = "4860-21360 cm^-1 (468-2058 nm)"
coefficients = { A = "6498.2", B = "307.43305e12", C = "14.4e9" }
reproduced_from = ["peck_1966"]
check = "It is Peck and Khanna's 0 C formula (peck_1966 eq4: 6855.200, 3243157.0) scaled by the ideal-gas ratio 273.15/288.15: B = 307.43305e12 exactly, A = 6498.34 (printed 6498.2). Gives 283.84e-6 at 18 788.4 cm^-1 (Table 2: 284). Checked 2026-09-25."
notes = "'after scaling to 15 C and 1013 hPa' (p. 10): the scaling is the ideal-gas one from 0 C, so the formula is for the ideal-gas density 25.47e18 cm^-3, not Peck and Khanna's own (real-gas) 15 C formula eq3."

[[formulas]]
id = "n2_eq11"
material = "N2"
equation = "Eq. (11), p. 10"
printed = "(n - 1) x 10^8 = 5677.465 + 318.81874 x 10^12 / (14.4 x 10^9 - (nu/cm^-1)^2), 21360 cm^-1 < nu < 39370 cm^-1"
variable = "nu: vacuum wavenumber in cm^-1"
state = "1atm_15C"
density = "ideal"
range = "21360-39370 cm^-1 (254-468 nm)"
coefficients = { A = "5677.465", B = "318.81874e12", C = "14.4e9" }
reproduced_from = ["D. R. Bates, Planet. Space Sci. 32, 785 (1984)"]
check = "Not used for Table 2 (outside its range); also quoted by he_2021 and wilmouth_2020 (N2_table1)."
notes = "Bates's interpolation between Peck and Khanna and Abjean et al.'s ultraviolet data."

[[formulas]]
id = "n2_king_eq12"
material = "N2"
equation = "Eq. (12), p. 10"
printed = "F_k(nu) = 1.034 + 3.17 x 10^-12 (nu/cm^-1)^2"
variable = "nu: vacuum wavenumber in cm^-1"
range = "not stated"
coefficients = { a = "1.034", b = "3.17e-12" }
reproduced_from = ["D. R. Bates, Planet. Space Sci. 32, 785 (1984)"]
check = "Gives 1.0352 at 18 788.4 cm^-1 (Table 2: 1.035). Checked 2026-09-25."
notes = "A King correction factor, not a refractive index. Based on Alms et al. (alms_1975), Bridge and Buckingham (1966) and Oddershede and Svendsen (1982)."

[[formulas]]
id = "co2_eq13"
material = "CO2"
equation = "Eq. (13), p. 10"
printed = "(n - 1) = 1.1427 x 10^6 (5799.25/((128908.9)^2 - (nu/cm^-1)^2) + 120.05/((89223.8)^2 - (nu/cm^-1)^2) + 5.3334/((75037.5)^2 - (nu/cm^-1)^2) + 4.3244/((67837.7)^2 - (nu/cm^-1)^2) + 0.1218145 x 10^-4/((2418.136)^2 - (nu/cm^-1)^2))"
variable = "nu: vacuum wavenumber in cm^-1"
state = "1atm_15C"
density = "ideal"
range = "the ultraviolet and visible (Bideau-Mehu et al. 1973; not stated here)"
coefficients = { scale = "1.1427e6", B1 = "5799.25", nu1 = "128908.9", B2 = "120.05", nu2 = "89223.8", B3 = "5.3334", nu3 = "75037.5", B4 = "4.3244", nu4 = "67837.7", B5 = "0.1218145e-4", nu5 = "2418.136" }
reproduced_from = ["A. Bideau-Mehu, Y. Guern, R. Abjean and A. Johannin-Gilles, Opt. Commun. 9, 432 (1973)"]
check = "As printed (1.1427 x 10^6, page image checked) it gives n - 1 = 0.428 at 18 788.4 cm^-1, 1000 times too large. With 1.1427 x 10^3 it gives 427.79e-6 (Table 2: 427) and, with F_k = 1.145, sigma = 13.31e-27 cm^2 (Table 2: 13.29). The scale factor is misprinted: read 10^3 (427.79e-6 rounds to 428, not Table 2's 427: Sneep's own n - 1 was about 427.5e-6; He et al. 2021's 1.1427 x 10^11 on (n - 1) x 10^8 and all 22 of Ityaksov's CO2 values confirm the 10^3 reading, (second reading, 2026-09-25; TC-157)). Checked 2026-09-25."
notes = "'Their article contains a typographical error, and the corrected formula, scaled to 15 C and 1013 hPa, yields' (p. 10): the authors' correction of the 1973 formula, itself misprinted here in the power of ten. The 2418.136 cm^-1 term is CO2's infrared bands. A second misprint (found against the 1973 original, bideau_mehu_1973; TC-167): the infrared numerator 0.1218145 x 10^-4 should be 1000 times the 1973 numerator, about 0.128 (the 1973 paper prints 1.218145e-4 for Old et al.'s 1.28154e-4). As printed here the infrared term vanishes; with 0.128154 it is -0.42e-6 at 18 788.4 cm^-1 and -5.1e-6 at 1.69 um (computed 2026-09-25). With it the formula gives 427.37e-6 at 18 788.4 cm^-1, which rounds to Table 2's 427 where the printed form's 427.79e-6 does not (see check): Sneep and Ubachs computed with the term, and only their printed copy lost it. ityaksov_2008_co2 copies this form."

[[formulas]]
id = "co2_king_eq14"
material = "CO2"
equation = "Eq. (14), p. 10"
printed = "F_k(nu) = (1.1364 +- 0.0005) + (25.3 +- 1.5) x 10^-12 (nu/cm^-1)^2"
variable = "nu: vacuum wavenumber in cm^-1"
range = "the range of Alms et al.'s depolarization ratios (4579-6471 A)"
coefficients = { a = "1.1364", b = "25.3e-12" }
check = "Gives 1.1453 at 18 788.4 cm^-1 (Table 2: 1.145). 'The differences between (Eq. 14) and the measured King correction factors are less than 0.5%' (p. 10). Checked 2026-09-25."
notes = "The authors' fit of Bates's N2 model function to King factors computed with Eq. (7) from Alms et al.'s depolarization ratios (alms_1975, Table I; Fig. 7)."

[[formulas]]
id = "co_eq17"
material = "CO"
equation = "Eq. (17), p. 12"
printed = "(n - 1) x 10^8 = (22 851 +- 200) + (0.456 +- 0.01) x 10^12 / ((71 427 +- 200)^2 - (nu/cm^-1)^2)"
variable = "nu: vacuum wavenumber in cm^-1"
state = "1atm_15C"
density = "ideal"
range = "168-288 nm (Smith et al.'s data); extrapolated to 532 nm for Table 2, 'rather far outside the range of the measurements' (p. 12)"
coefficients = { A = "22851", B = "0.456e12", C = "71427" }
reproduced_from = ["smith_1976"]
check = "As printed (equation image checked) it gives n - 1 = 229.5e-6 at 18 788.4 cm^-1, not Table 2's 325e-6, and 231.5e-6 at 167.2 nm against Smith's 532.0e-6 (scaled to 15 C): the numerator is 100 times too small. With 0.456 x 10^14 it gives 324.53e-6 at 18 788.4 cm^-1 (Table 2: 325) and follows smith_1976's experiment_CO, scaled from 0 C to 15 C by 273.15/288.15, to within -0.83 % to +0.26 % over 167-288 nm (within the stated ~2 %). Read the numerator as 0.456 x 10^14. The n-based 6.82e-27 needs n - 1 = 325.1e-6; 324.53e-6 gives 6.80e-27, a 0.3 % gap within the rounding of the printed coefficients. Checked 2026-09-25."
notes = "The authors' fit of the N2/Ar functional form to Smith et al.'s 38 CO values (Fig. 6), 'scaled to 15 C and 1013 hPa, or a density of 25.47e18 cm^-3' (p. 12): an ideal-gas rescaling of Smith's real-gas 0 C values, as for Eq. (10). 'Within the range of the measurements, the accuracy of n - 1 is estimated to be ~2%'; the authors note that Smith et al. did not fit a dispersion relation themselves. Not independent of smith_1976 (which includes the Lagrange-interpolated cells among the 38)."

