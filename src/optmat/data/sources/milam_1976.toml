citation = "D. Milam and M. J. Weber, \"Measurement of nonlinear refractive-index coefficients using time-resolved interferometry: Application to optical materials for high-power neodymium lasers\", J. Appl. Phys. 47, 2497-2501 (1976)"
doi = "10.1063/1.322965"
library = "Milam_1976_MeasurementNonlinearRefractive"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Absolute time-resolved interferometry at 1064 nm (Sec. II, pp. 2497-2499): \
linearly polarized ~125-ps FWHM pulses from a Nd:YAG oscillator with Nd:YAG and \
Nd:glass amplifiers, up to 25 GW/cm2 at the interferometer, approximately Gaussian in \
space and time, 1/e2 diameters 6-12 mm. A modified Michelson interferometer (98 % of \
the intensity in the sample arm) passes the beam twice through the sample (discrete \
paths for apertures > 2 cm, otherwise one closing mirror with the two transits delayed \
in time); the fringes are imaged onto a streak camera (10-ps resolution). gamma from \
the phase shift m lambda at the incident intensity I0 by Eq. (3), gamma = m lambda / \
[I0 T(1 + T^2)] [alpha/(1 - exp(-alpha L))], T = 4(n + 1)^-2 (printed so; the \
single-surface transmittance is 4n/(n + 1)^2, as weber_1978's Eq. (16) prints it). \
Absolute intensity from calibrated beam photographs (multiple-replica, film \
calibration, calorimeter through an aperture) and the streak record of the waveform \
(Appendix). Samples 10-25 mm in aperture and >= 100 mm long (KDP 56 mm), absorption at \
1064 nm negligible (Cary 17: optical density 0.001 measurable)."""
notes = """Journal pages 2497-2501 = pdf pages 2-6 (journal page = 2495 + pdf page; pdf \
page 1 is the publisher's download cover). Identity checked against the first page.

DEFINITIONS (quoted, p. 2499). Eq. (1), n = n0 + Delta n; 'Delta n is frequently \
expressed in terms of the time-averaged optical electric-field amplitude E as n2 <E^2>, \
where the nonlinear refractive-index coefficient n2 is in electrostatic units. A more \
useful expression in practice is Delta n = gamma I, where the beam intensity I is in \
units of W/cm^2.' Eq. (2): gamma(cm^2/W) = (4 pi x 10^7/cn) n2(esu), c in cm/s. gamma \
is optmat's n2 (nonlinear_index, the self coefficient of one linearly polarized beam); \
n2 is the esu coefficient (nonlinear_index_field). Table I gives both; gamma is what \
Eq. (3) measures, so the gamma datasets are primary and the esu ones check. Check \
(computed 2026-09-27): Eq. (2) with n = n_D reproduces every gamma from its n2 to the \
printed digits (BK 7 3.426, FC 5 3.016, fused silica 2.731, FK 51 1.945, ED-2 3.772, \
FR-5 5.221, KDP 2.855 with the e-ray n_D; printed 3.43, 3.01, 2.73, 1.94, 3.77, 5.2, \
2.9).

PART (p. 2499): 'Self-focusing of laser beams in solids arises from three mechanisms: \
Kerr, electrostrictive, and thermal. The response times for electrostrictive and \
thermal self-focusing, however, are much longer than the 125-ps pulses used for our \
experiments. Therefore, the observed fringe shifts are attributed to the optical Kerr \
effect', and the fringe shift followed the pulse in time (Fig. 4, BK 7). The 125-ps \
pulses include the whole nuclear (Raman) response, and 'for silicate glasses the \
dominant contribution (~80%) to gamma is electronic in origin' (Ref. 14, p. 2500): \
part = electronic_vibrational (no electrostriction or heating), as in adair_1989.

UNCERTAINTY (p. 2500 and Appendix). The +- of Table I is the estimate for the average \
of several measurements: 'total errors of 20% or larger are possible for a single \
measurement. To reduce the experimental uncertainty, several measurements were made of \
each sample to obtain an averaged result with an estimated accuracy of 10-15%'; \
intensities 'within +-10%, with approximately 3-4% systematic error remaining after \
averaging'; fringe shifts 0.2 <= m <= 0.6 'measured reproducibly to within +-10%' (p. \
2501). Level not stated. The printed +- are 10 % of the value except FR-5 (19 %) and \
KDP (30 %).

SAMPLES (p. 2500): Schott BK 7, Owens-Illinois ED-2 and Dynasil 4000 (measured before \
by others), Hoya FC-5 (printed 'FC 5' in Table I), Schott FK 51, Hoya FR-5, and KH2PO4 \
grown by Lasermetrics. The n_D and Abbe numbers of Table I are printed without a \
source; they are kept in each file's printed cells and not recorded as indices. The \
glass Milam and Weber name Hoya FC-5 is recorded as the registered FK-5: weber_1978 \
(Table 1, reference a = this paper) and boling_1978 print the same value as 'FK-5', \
and FC-5 is Hoya's counterpart of Schott FK5 (grade 'Hoya FC-5').

OTHER VALUES. Footnote 8 (p. 2501): 'The smallest index nonlinearity measured thus far \
is gamma = (0.30 +- 0.1) x 10^-16 cm^2/W for MgF2 (10 cm in length), M. Weber and D. \
Milam (unpublished)': dataset gamma_MgF2_unpublished (check). FINDING: weber_1978 \
Table 2 gives MgF2 0.92 +- 0.31 x 10^-20 m^2/W (from Milam, Weber and Glass, Appl. \
Phys. Lett. 31, 822 (1977)), three times this footnote's value; the paper does not say \
whether the footnote value was later revised. The intensity-dependent ellipsometry \
values (Ref. 4, Owyoung, at 694 nm) 'are larger ... due to the frequency dispersion \
of gamma' (p. 2500): not tabulated here.

FIGURES (not digitised). Figs. 1-2: the apparatus. Fig. 3: streak photographs of the \
fringes. Fig. 4 (p. 2499): the incident pulse and the fringe shift against time for \
BK 7 (coincident).

REPRODUCTIONS OF THIS PAPER: weber_1978 Table 1 (reference a: fused silica, BK-7, \
FK-5, FK-51, ED-2, FR-5) and Table 2 (reference d: KH2PO4), identical values; \
milam_1998 (its reference 17: fused silica 2.73); adair_1989 Table III (TRI column, \
fused SiO2 0.95); boling_1978 Table III (n2 exper); ensley_2019 (reference l); \
adair_1987 (through weber_1978)."""

[[datasets]]
id = "gamma_MgF2_unpublished"
material = "MgF2"
table = "text"
points = [["1", "1064", "0.30", "0.1"]]
quantity = "nonlinear_index"
unit = "cm2/W"
scale = 1e-16
abscissa_unit = "nm"
use = "check"
notes = "Footnote 8 (p. 2501): 'The smallest index nonlinearity measured thus far is gamma = (0.30 +- 0.1) x 10^-16 cm^2/W for MgF2 (10 cm in length), M. Weber and D. Milam (unpublished).' Presumably the same TRI method and 1064-nm, 125-ps pulses (not stated); orientation and polarization not stated. weber_1978 Table 2 gives 0.92 +- 0.31 x 10^-20 m^2/W for MgF2 from Milam, Weber and Glass 1977: a factor 3 apart (source notes); kept as a check."
