citation = "B. P. Stoicheff, \"High resolution Raman spectroscopy of gases: IX. Spectra of H2, HD, and D2\", Can. J. Phys. 35, 730 (1957)"
doi = "10.1139/p57-079"
library = "Stoicheff_1957_HIGHRESOLUTIONRAMAN"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Photographic spontaneous Raman spectroscopy of the gases at one to two \
atmospheres (p. 731): the N.R.C. 21-ft grating spectrograph in the second order, 1.2 \
A/mm, slit 0.02 mm, Kodak 103a-O plates, exposures of 10-36 hours, the apparatus of \
paper I (Stoicheff 1954). The pure rotational lines excited by Hg 4358 A (four Stokes \
and two anti-Stokes lines of H2; five and two of HD and D2), the Q branches of the 1-0 \
bands by Hg 4047 A (no S or O lines of the 1-0 bands were seen). Second- and \
third-order iron-arc standards; Edlen's (1953) vacuum corrections applied, and the \
displacements taken from the Hg lines' vacuum wavenumbers 24705.350 and 22938.134 cm-1 \
(pp. 731-732). Two plates per spectrum, averaged. Constants from the lines by least \
squares, Eqs. (1)-(6); H2's v = 2 and 3 levels from Herzberg's (1950) infrared \
quadrupole lines with this paper's ground-state constants (p. 735)."""
notes = """Identity checked against the first page (title, author, journal, volume). \
PAGES: pdf page 1 is p. 730; pdf pages 2-3 are the unnumbered plate of Fig. 1; pdf page \
n (n >= 4) is p. 727 + n (Table I p. 732, Table II p. 734, Table III p. 736).

MATERIAL. H2 and D2 as supplied (the ortho:para ratio is not stated: normal hydrogen \
and deuterium assumed, as for any room-temperature sample); HD (Herzberg's sample) is \
not a material: its values are in these notes only. Every value is the paper's own \
except H2's v = 2 and 3 constants, which it derives from Herzberg's infrared \
measurements (G. Herzberg, Can. J. Research A 28, 144 (1950)).

CONVENTIONS (pp. 732-733). T(v, J) = G(v) + F_v(J), Eq. (1); F_v(J) = B_v J(J+1) - D_v \
J^2(J+1)^2 + H_v J^3(J+1)^3, Eq. (3); B_v = B_e - alpha_e (v+1/2) + gamma_e (v+1/2)^2, \
D_v = D_e + beta_e (v+1/2) + delta_e (v+1/2)^2, H_v ~ H_e ~ H_0 ~ H_1 (Eq. 4). The pure \
rotational lines, Eq. (6): S_0(J) = (4 B_0 - 6 D_0 + 27/4 H_e)(J + 3/2) - (8 D_0 - 34 \
H_e)(J + 3/2)^3 + 12 H_e (J + 3/2)^5; the Q lines, Q_v(J) = nu_{v-0} + (B_v - B_0) \
J(J+1) - (D_v - D_0) J^2(J+1)^2. The third rotational constant is H_e in Eq. (6) and \
the text, printed in Table II's H_v row under v = 0; recorded here as H of v = 0. \
Wavenumber displacements in vacuum cm-1. The last digit of most Table II constants is \
printed as a subscript (a digit of lower weight); the files join it to the number.

UNCERTAINTIES. Lines (p. 731): 'each line could be measured to +-0.02 cm-1 or better' \
(pure rotational); 'an accuracy of about +-0.05 cm-1 is estimated' for the weak Q-branch \
lines. Constants (p. 738): 'For all three molecules, it is estimated that the values of \
B_0 are reliable to 0.005 cm-1, the values of D_0 to 0.0003 cm-1, and the values of H_e \
to 0.5 x 10^-5 cm-1. The constants for the 1-0 bands cannot claim as high an \
accuracy'. B_e of H2 and HD 'better than +-0.010 cm-1' (pp. 735-737); D2's B_e \
'estimated error of +-0.010 cm-1' (p. 737). Levels not stated.

STRUCTURAL FIXES (the script's docstring). Table I: the library merged H2's |Delta nu| \
column into the designation cell and shifted the others left; the script restores the \
layout of the image. Table II: two subscript digits misread, H2 D_2 '0.0427;' (image \
0.0427 subscript 7: 0.04277) and D2 D_1 '0.01073' (image 0.0107 subscript 5: 0.01075; \
the text's D_0 - D_1 = 0.00059 cm-1, p. 737, and the Q-branch O - C_1 column, which \
0.01075 reproduces to 0.001 cm-1 and 0.01073 misses by 0.008 at Q_1(4), both require \
5). No erratum: both are mis-extractions.

CHECKS (scratch, 2026-09-27). Table II's constants reproduce Table I's O - C_1 column: \
H2 S_0 and Q_1 to +-0.001 cm-1 (the Q lines with the unbracketed v = 1 constants: the \
bracketed ones leave O - C of 0.014, -0.003, -0.024, 0.013); D2 Q_1 to +-0.001; a \
least-squares fit of Eq. (6) to the lines returns the printed B_0, D_0, H_e of H2 \
(59.3392, 0.04600, 5.21e-5), HD (44.6678, 0.02592, 2.25e-5) and D2 (29.9105, 0.01133, \
0.356e-5). FINDING: D2's printed O - C_1 of the pure rotational lines (-0.001, +0.003, \
-0.006, +0.003, -0.002) are the NEGATIVES of that fit's residuals (0.000, -0.004, \
+0.006, -0.003, +0.001): the column is C - O, or its signs are misprinted; the fit \
itself is not affected. HD's S_0 O - C_1 need H_e = 2.24e-5 (the rounded 2.2e-5 misses \
S_0(4) by 0.027).

HD (not a material; Tables I-III): S_0(0)-S_0(4) 267.086, 443.081, 616.089, 784.993, \
948.818; Q_1(0)-Q_1(3) 3632.055, 3628.197, 3620.511, 3608.992 cm-1. B_0 44.6678, D_0 \
0.02592, H_e 2.2e-5, B_1 42.7414, D_1 0.02553, nu_1-0 3632.053, I_0 0.62660e-40 g cm2, \
r_0 0.74973 A; B_e 45.638, I_e 0.61329, r_e 0.74173; B_e* 45.678, I_e* 0.61274, r_e* \
0.74140. Equilibrium constants (p. 737, 'tentative only'): G(v) = 3811.92_4 (v+1/2) - \
90.711_3 (v+1/2)^2 + 0.4775_9 (v+1/2)^3; B_v = 45.637_8 - 1.9500_4 (v+1/2) + 0.0140_2 \
(v+1/2)^2; D_v = 0.02634_1 - 0.00085_7 (v+1/2) + 0.000033 (v+1/2)^2; H_e = 2.2_4e-5 cm-1. \
Dunham a_0-a_4: 79598, -1.595, 1.854, -2.047, 2.250. Theory (Dunham): D_e 0.02617, \
beta_e -0.000780, H_e 2.12e-5.

OTHER TEXT VALUES (notes only). The constants from the line spacings (p. 738): H2 B_0 \
59.343, D_0 0.04604 (H_e fixed at 5.21e-5); HD 44.668, 0.02591, 2.23e-5; D2 29.912, \
0.01137, H_e 4.04e-6 cm-1. S_2(0) of H2's 2-0 band (Herzberg) lies 0.065 cm-1 below \
its calculated position and was left out (p. 735). Effective I_0 (1e-40 g cm2) and r_0 \
(A) of v = 0 (Table II): H2 0.47168, 0.75105; D2 0.93576, 0.74820. Table III's I_e, r_e \
(experimental) H2 0.46004, 0.74173 (r_e +-0.00006, p. 736); D2 0.91943, 0.74165; the \
corrected I_e*, r_e*: H2 0.45951, 0.74130 +- 0.00006; D2 0.91890, 0.74143 +- 0.00012. \
H2's Dunham a_0-a_4 (p. 739): 79566, -1.598, 1.868, -2.072, 2.261 (formula \
dunham_potential_H2). Dunham's theoretical D_e 0.04652, beta_e -0.00168, H_e 5.02e-5 \
cm-1 (p. 739); the rotation-vibration corrected omega_e^a 4401.063, B_e^a 60.856, D_e^a \
0.04679 cm-1 and B_e* 60.910, omega_e* 4404.18 cm-1 (p. 740). D2 (p. 737): B_0 - B_1 = \
1.0623 ~ alpha_e, D_0 - D_1 = 0.00059 ~ beta_e (in magnitude: D_v falls with v), D_e = \
0.01164 cm-1 by linear extrapolation.

WHO REPRINTS IT. weber_1979's Table 3.2 H2 and D2 constants (B_0, D_0, and note a's \
H_0) are this paper's Table II v = 0 values (re-pointed, 2026-09-27); bischel_1986b's \
zero-density Q(1) position cites it among four papers."""

