citation = "L. Essen, Proc. Phys. Soc. B 66, 189 (1953)"
doi = "10.1088/0370-1301/66/3/306"
library = "Essen_1953_RefractiveIndicesWater"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Microwave cavity resonator (Essen and Froome's method): the resonant frequency \
of an invar, copper-plated H019 resonator (Q about 40 000) evacuated and filled with \
the gas, n being their ratio; waveguide bridge with a source measured to 1 part in \
10^8, setting to resonance to 1 part in 10^8; 9200 Mc/s (pp. 2-3). Gases at about \
20 C and atmospheric pressure."""
notes = """Values are (n - 1) 10^6 of dry gases at 0 C and 760 mm Hg. Reduction (p. 4): \
'For dry air and its main constituents equation (2) of Essen and Froome (1951) is \
used as this was established by the experimental work of Barrell and Sears (1939)' \
(an empirical real-gas law: O2, N2 density real); 'the results for the other gases \
are reduced to S.T.P. by means of the ideal gas formula' (H2, D2, He: density ideal), \
the error from the law 'not likely to be more than 0.02%'.

Frequency: the apparatus 'was designed to operate at 9200 Mc/s' (p. 3) and the \
abstract says 9200 Mc/s, but the table heads the column '9000 Mc/s' (image checked), \
and so does the Discussion (PDF p. 4): two statements against two; \
9200 Mc/s is taken (immaterial here) (vacuum wavelength c/f = 32.586 mm). At this frequency the \
refractivity of a nonpolar gas is the static one, including the infrared \
(vibrational) polarizability; oxygen's also includes its paramagnetism (n^2 = \
epsilon mu), which the paper does not separate.

Uncertainty: the table's 'limits of error' 'including systematic errors' (O2 0.2, \
N2 0.1, H2 0.2, D2 0.3, He 0.2, x 10^-6) are used as bounds; standard deviations \
0.04, 0.04, 0.04, 0.2, 0.03 from 9, 5, 18, 5, 11 measurements. Purities (p. 4): O2 \
99.5 % (main impurity N2), N2 impurity below 1e-6, H2 99.95 % (N2), He 99.8 % (Ne), \
'corrected for the main impurities and the limits of error allow for their being \
twice the stated amount'; deuterium from the Clarendon Laboratory in two samples, the \
first 99.32 % with 0.68 % hydrogen (whether corrected is not said).

Essen and Froome's (1951) 24 000 Mc/s values of O2 and N2, printed for comparison, \
are extracted as reproduced (not in the library). Water vapour (60.7 at 20 C, 10 mm \
Hg) and CO2-free air are not curated species. The H2 and D2 values are 2 % and 3 % \
above Ishiguro et al.'s (1952) calculations (133.3, 130.8), and helium is 0.4e-6 \
above the Cuthbertsons' 34.6 (cuthbertson_1932) (pp. 5-6).

Reproductions: newell_1965's datasets essen_1953_{He,H2,N2,O2} are these values (with \
the nominal 9 GHz as frequency), now reproductions of this record."""

