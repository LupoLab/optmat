points = [["248", "248", "0.64", "0.10"], ["308", "308", "0.96", "0.15"], ["352.5", "352.5", "1.03", "0.15"]]
notes = "Abstract (p. 1309) and p. 1316: the NO3 quantum yield of N2O5 photolysis, independent of pressure (150-600 Torr N2 or O2 bath gas, about 298 K), 2 sigma including estimated systematic errors. Excimer-laser lines at their nominal wavelengths. p. 1316 prints +-0.20 at 248 nm (record notes). Disagrees with ravishankara_1986/no3_yield at 248 nm (TC-975)."
[datasets.parameters]
