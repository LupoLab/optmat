notes = "Fig. 6 (p. 023405-7), the TD-CASSCF (0,0,14) curves (black, thick): 1 - S, S the survival probability of both electrons inside R0 = 20 au, at t = 6T, the end of the six-cycle sin^2 pulse (Eq. 27), against the peak intensity I0 = E0^2, 4, 8 and 14e14 W/cm2; for He, (0,0,14) is MCTDHF with both electrons active, equal to the full two-electron TDSE where that converges (400 nm, Fig. 2(b)). The values are 1 - S; the survival read (0.9996971, 0.9841076, 0.8392404) is in the printed cells. Read from the vector drawing, the curves' last vertices (the record's notes). sigma: the digitising uncertainty, absolute, 0.06 pt on each panel's y axis (2.7e-7, 1.3e-5, 1.3e-4; 0.08 to 0.09 % of 1 - S); the calculation's own is not stated. Fig. 4(c), the same at L_max = 59, agrees at 8e14 within 1.4e-6 in S. Not the ADK or PPT curves (the record's notes)."
