citation = "P. G. Hajigeorgiou, \"The potential energy function of the ground electronic state of 16O2\", J. Chem. Phys. 138, 014309 (2013)"
doi = "10.1063/1.4773285"
library = "Hajigeorgiou_2013_PotentialEnergyFunction"
identity = "VALIDATED_WITH_WARNINGS"
kind = "fit"
technique = """Direct fit of an analytical potential energy function (a Morse-like form with a \
16-term exponent polynomial in the reduced variable y_p, p = 4.52, and an inverse-power \
inner wall below 0.925 A) and an N-dependent radial function alpha(r) in the centrifugal \
term to 420 rotational term values of the X 3Sigma_g- state of 16O2 (v = 0-31, every \
second N up to N_max), themselves computed from Yu et al.'s (J. Chem. Phys. 137, 024304 \
(2012)) Dunham coefficients for B_v, D_v, H_v and from the author's Dunham fit of \
literature vibrational energies (v = 0-35); unweighted nonlinear least squares, \
eigenvalues from the radial Schroedinger equation on 0.80-6.80 A (step 0.0005 A), \
standard deviation 0.0031 cm^-1. The constants of Table III are the quantum-mechanical \
expectation values of the fitted functions (a modified CDIST program), pp. 014309-2 to \
014309-5."""
notes = """Pages are the article's (014309-1 to 014309-8); pdf page 1 is the publisher's \
download cover, so p. 014309-n = pdf page n + 1. Identity checked against the first \
page. The library's warnings (unmatched figures on the cover page; one unmapped glyph \
on each of pdf pages 7-8, in the Omega symbols of the discussion) touch no value used.

MATERIAL AND STATE: 16O2, the X 3Sigma_g- ground state. Hund's case (b): Eq. (1), p. \
014309-2, E_vN = G_v + B_v N(N+1) - D_v [N(N+1)]^2 + H_v [N(N+1)]^3, N the rotational \
quantum number without spin. SPIN: the paper does not use the words 'spin-free'. It \
says (p. 014309-1): 'It is not the objective of the present work to carry out an \
analysis of the spin-spin and spin-rotation structure in the ground state, as these \
effects have been characterized very precisely in the work of Yu et al.', whose \
Dunham fit gave 'the rotational constants B_v and centrifugal distortion constants \
D_v and H_v, as well as ... the spin-spin and spin-rotation parameters' (p. \
014309-2). So the term values fitted here, and the B_v, D_v, H_v of Tables I and III, \
are those of the N(N+1) ladder of Eq. (1) with the spin-spin (lambda) and \
spin-rotation (gamma) splittings of each N into J = N, N +- 1 excluded (the effective \
'mechanical' constants, what solprop calls spin-free); they include no spin-spin \
constants. Also (p. 014309-7): 'the potential curve determined in this work is \
associated with the Omega = 1 spin component', because most of the data come from \
Schumann-Runge spectra (an adiabatic avoided-crossing treatment of the X-b spin-orbit \
coupling; relevant near 2 A, far above the levels that matter for Raman).

TABLE I (p. 014309-2, 'Vibrational energies, rotational constants, and centrifugal \
distortion constants (cm^-1) employed in calculating term values'; note a: 'Y00 = \
0.331 962 cm^-1 must be added to all calculated term values'): the INPUT of the fit. \
B_v, D_v, H_v are evaluated from Yu et al.'s Dunham coefficients (fitted there over v \
= 0-31): reproduced. G_v is the author's own Dunham fit of 'literature vibrational \
energies with their respective relative uncertainties over the range v = 0-35' (refs. \
4, 5, 9-15; p. 014309-2), because Yu et al.'s G_v series covers v = 0-23 only: this \
paper's fit, a check. The printed G_v are Dunham sums without Y00: G_v + Y00 is \
measured from the potential minimum (G_0 + Y00 = 787.321962 against Table III's \
787.3223). N_max (the highest N of the experimental data per v) stays in 'printed'. \
Yu et al.'s H_v are all positive; Table III's are all negative: Yu's Y03 'was \
constrained rather than fitted', thought to be the source of the discrepancy, which \
'in no way undermines the quality of the term values' (p. 014309-5).

TABLE III (p. 014309-5, 'Quantum-mechanical vibrational energies, rotational \
constants, and centrifugal distortion constants (cm^-1) calculated from the radial \
functions V(r) and alpha(r)'): this paper's result, v = 0-38. B_v = (hbar^2/2 mu) \
<psi_v|[1 + alpha(r)]/r^2|psi_v> (Eq. 14), with analogous definitions for D_v, H_v. \
The library's cells for this table are column-scrambled: transcribed in the script \
from the PDF text layer and the image (see tools/extract/hajigeorgiou_2013.py). No \
uncertainty is stated for the constants; the fit reproduces the term values with a \
standard deviation of 0.0031 cm^-1 (p. 014309-4), and 'The potential energy function \
... is strictly speaking reliable up to 90% of the dissociation limit' (v <= 31), \
perhaps to 99 % (v = 38) (p. 014309-8). The G_v of Table III are identical to Table V's \
(checked by the script) and are stored once, from Table V (table5_G_O2).

TABLE V (p. 014309-8): G_v from the potential minimum (V(r_e) = 0, p. 014309-4) and the \
inner and outer turning points (A; no quantity, kept in 'printed'), v = 0-38; 'More \
significant figures have been provided for vibrational levels with v > 31 than are \
justified by the expected uncertainties' (p. 014309-7).

TABLE IV (p. 014309-7): G_v - G_0 and B_v for v = 29-38 from Yang and Wodtke (YW; J. \
Chem. Phys. 90, 7114 (1989)): note b 'Experimental value with uncertainty +-40 cm^-1' \
(v = 29-35), note d 'Extrapolated value with unknown uncertainty' (v = 36-38), note c \
(all B_v) 'Value calculated from hybrid potential with uncertainty +-0.01 cm^-1'; and, \
in parentheses beside the present work's values, the ab initio values of Bytautas, \
Matsunaga and Ruedenberg (Ref. 7, J. Chem. Phys. 132, 074307 (2010)). The present \
work's columns repeat Table III rounded (G_v - G_0 = 35 582 for v = 29 is 36 369.0317 \
- 787.3223 = 35 581.7): not taken. Levels above v = 31 lie beyond the fitted data.

REPRODUCTION (2026-09-26, scratch script): the radial Schroedinger equation with the \
Table II potential (Eqs. 2-6 as printed, hbar^2/2 = 16.857 629 20 cm^-1 amu A^2, mu = \
7.997 457 309 78 amu, grid 0.80-6.80 A, three-point differences at steps 0.0005 and \
0.00025 A with Richardson extrapolation) gives Table III's G_v to <= 0.0001 cm^-1 for v \
= 0-11, <= 0.0004 for v <= 26, and within 0.0065 cm^-1 up to v = 38; Eq. (14) gives \
B_0-B_3 to <= 2e-8 cm^-1 (the printed rounding is 5e-10). D_v and H_v were not \
recomputed. FINDING: with Table II's A and q as printed, the inner wall A/r^q (55 664 \
cm^-1 at 0.925 A) does not join the Morse-like branch (53 943 cm^-1 there), although \
the text says A and q 'were determined by considering the values of the potential \
energy and its first derivative at r = 0.925 A' (p. 014309-3); a continuous join (A = \
15 543.5, q = 15.960) spoils the reproduction of G_v for v >= 26 by up to 0.22 cm^-1, \
so the printed A and q are those used. Whether the published form differs from the \
one programmed near 0.925 A cannot be told; it matters only above v ~ 25.

OTHER TEXT VALUES (not stored): r_e = 1.207 526 69(34) A (this work) against Yu et \
al.'s 1.207 527 63(17) A (p. 014309-5); D_e = 42 055.6 cm^-1 = Cosby and Huestis's D_0 = \
41 268.6 cm^-1 plus G_0, held fixed (p. 014309-4); the equilibrium constants of the \
Pekeris check, omega_e = 1579.833, omega_e x_e = 11.6938, B_e = 1.445 611 834, alpha_e \
= 0.015 894 6 cm^-1, 'a subset of the Dunham coefficients employed' (Yu et al.'s; \
reproduced there, not stored; yu_2012's Table I gives these B_e and alpha_e, but \
Y_10 = 1580.1037 and -Y_20 = 11.9147 cm-1, so the omega_e and omega_e x_e here are not \
Yu et al.'s), giving Y00 = 0.335 cm^-1 against the fitted 0.332 (p. \
014309-4). The reduced mass 7.997 457 309 78 amu (p. 014309-4) is solprop's O2 \
reduced mass."""

