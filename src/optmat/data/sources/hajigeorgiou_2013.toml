[[formulas]]
id = "potential"
material = "O2"
equation = "Eqs. (2)-(6), (7), (9)-(11), (14) and Table II, pp. 014309-2 to 014309-5"
printed = "V(r) = D_e [1 - exp(-beta(y_p) z)]^2 (Eq. 2); beta(y_p) = sum_i beta_i y_p^i (Eq. 3); y_p = (r^p - r_e^p)/(r^p + r_e^p) (Eq. 4); z = y_1 = (r - r_e)/(r + r_e) (Eq. 5); for r <= 0.925 A, V(r) = A/r^q (Eq. 6). Centrifugal term f_cent(r) = hbar^2/(2 mu r^2) [1 + alpha(r)] N(N+1) (Eq. 7), alpha(r) = sum_{i>0} alpha_i x^i / (1/2 + (1/2)(r/r_alpha)^m) (Eq. 11), x = (r - r_e)/r_e (Eq. 10). B_v = (hbar^2/2 mu) <psi_v|[1 + alpha(r)]/r^2|psi_v> (Eq. 14)."
variable = "r: internuclear distance in A; V in cm^-1 from the minimum; N the rotational quantum number (Hund's case (b))"
range = "0.80-6.80 A (the integration range; 'It is not expected, however, that the range of validity of the radial functions is that radially extensive'); reliable to v = 31 (90 % of D_e), perhaps v = 38"
coefficients = { D_e = "42 055.6", p = "4.52", A = "16 591.891 596", q = "15.525 821", r_e = "1.207 526 689 4", beta_0 = "6.407 585 460 1", beta_1 = "1.703 616 263 0", beta_2 = "9.664 250 463 3e-1", beta_3 = "1.103 036 912 3", beta_4 = "7.320 575 031 2e-2", beta_5 = "6.276 327 564 7", beta_6 = "-6.187 264 040 3", beta_7 = "-5.094 846 393 9e+1", beta_8 = "2.148 609 529 0e+2", beta_9 = "-6.096 967 020 8e+1", beta_10 = "-1.079 524 182 4e+3", beta_11 = "2.031 515 960 7e+3", beta_12 = "2.094 346 198 8e+2", beta_13 = "-4.453 811 356 7e+3", beta_14 = "5.004 031 447 4e+3", beta_15 = "-1.812 194 155 8e+3", r_alpha = "2.10", m = "15", alpha_5 = "1.501 199 512 8", alpha_6 = "-7.308 811 142 2", alpha_7 = "7.633 557 922 3", mu = "7.997 457 309 78", hbar2_over_2 = "16.857 629 20" }
coefficient_units = { D_e = "cm^-1", A = "cm^-1 A^q", r_e = "A", r_alpha = "A", mu = "amu (p. 014309-4)", hbar2_over_2 = "cm^-1 amu A^2 (p. 014309-4)" }
check = "Reproduces Table III/V: G_v to <= 0.0001 cm^-1 for v = 0-11, <= 0.0004 cm^-1 for v <= 26, <= 0.0065 cm^-1 to v = 38; B_0-B_3 (Eq. 14) to <= 2e-8 cm^-1 (three-point finite differences, steps 0.0005 and 0.00025 A, Richardson-extrapolated; checked 2026-09-26). D_v, H_v not recomputed."
notes = "Table II (p. 014309-4): 'Fitted and constrained parameters ... Parameters in square brackets were constrained' (D_e, p, A, q, r_alpha, m); the standard deviations of the others: r_e 3.43e-7 A, beta_0 ... beta_15 1.69e-5, 4.86e-4, 1.37e-3, 2.08e-2, 4.00e-2, 3.26e-1, 6.70e-1, 2.30, 5.68, 9.22, 2.16e1, 3.19e1, 3.09e1, 5.54e1, 5.08e1, 1.64e1; alpha_5-alpha_7 6.62e-2, 1.94e-1, 1.43e-1 ('Many more significant figures have been provided ... than warranted by the standard deviations in order to eliminate round-off error'). alpha_1-alpha_4 are excluded (zero). The printed A and q do not join the outer branch continuously at 0.925 A (see the record's notes), yet they are the ones that reproduce Table III. Term values are fitted after raising them by |Y00| = 0.332 cm^-1, so V(r_e) = 0."
