[[errata]]
dataset = "text_K_per_p_He"
row = ""
column = "scale"
printed = "1e-20"
corrected = "1e-21"
reason = "Eq. (11) prints K/p = 1.937(10) x 10^-20 C^2 m J^-2 bar^-1 for helium. With K = (27/(2 lambda)) N A_K (Eq. 3), N = p/RT, lambda = 632.8 nm and T = 303.7 K, the paper's own A_K^(2) = 2.321 x 10^-30 C^2 m^5 J^-2 mol^-1 gives K/p = 1.96 x 10^-21 per bar (1.2 % above 1.937, the local-field factor f^(2) at 80-97 bar); 10^-20 would imply A_K ten times larger, and gamma(He) = 276 x 10^-64. The same relation holds for the H2 table: 7.46 x 10^-29 gives K/p = 6.30 x 10^-20 per bar, against the measured 0.3733 x 10^-18 / 5.953 bar = 6.27 x 10^-20."
evidence = "Page image of p. 156 checked (Eq. 11 prints 10^-20; not an extraction error). Fig. 2 (p. 156) plots K / 10^-19 C^2 m J^-2 against p: about 1.5-1.9 on its scale at 76-97 bar, i.e. K/p of about 2 x 10^-21 per bar. Checked 2026-09-26."
