citation = "R. Tammer, K. Löblein, K. H. Peting and W. Hüttner, \"Field calibrated measurements of the dc Kerr constants of helium and molecular hydrogen\", Chem. Phys. 168, 151 (1992)"
doi = "10.1016/0301-0104(92)80117-e"
library = "Tammer_1992_FieldCalibratedMeasurements"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Absolute dc Kerr effect (static-field-induced birefringence) of H2 and He at \
632.8 nm (He-Ne laser), with the Senarmont-type ellipsometer and Kerr cell of Tammer & \
Hüttner (tammer_1990), whose field integral is here calibrated absolutely by the \
rotational Stark effect of OCS: the J = 7 <- 6 transition near 85139.1 MHz was recorded \
in the Kerr capacitor at several fields (12 Stark spectra), simulated from the \
mechanically measured plate distance d(y) and the OCS dipole moment and anisotropy of \
Lahaye et al. (1986), and the mean gap adjusted to fit: integral of E^2 dy = (2.492 +- \
0.010) x 10^12 V^2 m^-1 at 12 kV, edge correction included (pp. 152-154). The new \
spacers (FRIALIT) replaced those of the 1990 work; the 1990 H2 data were re-evaluated by \
comparison with new K(T0, p) at T0 = 303.7 K (correction factor 1.0637 +- 0.0031). He: \
22 pressures between 76 and 97 bar at 303.7 K (lower pressures arced), fitted by a \
straight line through the origin; H2: 12 pressures, 5.95-49.3 bar, at 303.7 K (p. 154, \
156-157)."""
notes = """Pages are the journal's (151-158; p. = pdf page + 150).

DEFINITIONS (pp. 151-152). n_z - n_x = lambda K E^2 (Eq. 1); K = (27/(2 lambda)) N A_K \
for a dilute gas (Eq. 3; N moles per volume) with A_K = (N_A/(81 eps0)) [gamma + (Delta \
alpha Delta alpha^0)_eff / 5 k_B T] (Eq. 4), 'the first molar Kerr virial coefficient ... \
identical with the molar Kerr constant for an ensemble of non-interacting molecules'; \
gamma = (3/2)(gamma_z - gamma_x) (Eq. 5), 'the anisotropy of the KE second \
hyperpolarizability': Buckingham's gamma_K, the dc Kerr gamma(-w; w, 0, 0) in the \
Taylor-series convention (the static expansion of Eq. 9 carries (1/6) gamma E^3; \
shelton_1994 Table VI reproduces the He value as 44.3 au = 27.6e-64 / 6.2354e-65). \
Molar Kerr constant mK = A_K + B_K N + C_K N^2 + ... (Eq. 6) with K = (27/2)(f(n, \
eps)/(lambda n)) N mK (Eq. 7), f a local-field function; the two used, f^(2) = ((n^2 + \
2)/3)((eps + 2)/3) and f^(4) = ((n^2 + 2)/3)^2((eps + 2)/3)^2, are defined in \
tammer_1990 (Eqs. 13-14) and give the superscripts (2) and (4). The unit C^4 m^4 J^-3 \
of gamma is the SI unit of the optmat vocabulary; A_K in C^2 m^5 J^-2 mol^-1, B_K in \
C^2 m^8 J^-2 mol^-2 (as printed).

PARTS. For H2, A_K includes the orientation term; gamma is A_K minus the orientation \
term (Delta alpha Delta alpha^0)_eff/5kT, calculated (tammer_1990, Eq. 6) from the \
J-dependent ab initio anisotropies of Bishop & Cheung (1980) and Rychlewski (1980), \
'The error of the so determined orientation term is less than 0.2% and therefore \
negligible' (p. 158): an electronic plus vibrational gamma_K. Checked here: 81 eps0 \
A_K/N_A - gamma gives the same orientation term in this Table 1 and in tammer_1990's \
Table 1 at every temperature (to 5e-4 in 1e-62 units). He: an atom, no orientation \
term, electronic.

TABLE 1 (p. 155): 'Corrected H2 dc KE data from table 1 of ref. [3] [tammer_1990], \
lambda = 632.8 nm ... The H2 data at T0 = 303.7 K in the last row have been obtained \
in the present work. The errors given in parentheses in units of the least significant \
figure are standard deviations'; 'the errors are statistical contributions only' (p. \
155). Maximum pressure 115 bar. Datasets: A_K (the 13 re-corrected rows, check; the new \
row, primary), B_K^(4) and B_K^(2) (kerr_virial_coefficient, order 2, check), gamma \
(check). Not taken: b' (the p^2 coefficient of Eq. 12, 10^-24 C^2 m J^-2 bar^-2), a and \
b (K = a rho + b rho^2, tammer_1990 Eq. 12), and 10^29 Delta = A_K - A_K^calc (the \
header's capital Delta is extracted as 'A'; the new row prints '-'). 'The total error of \
the new value A_K listed in the last row of table 1 is the sum of a statistical (one \
standard deviation, see table 1) and a 1.3% systematic contribution ... uncertainties \
for T: 0.11%, p: 0.25%, compensation current: 0.5% and field integral: 0.4%. The \
previously assigned [3] field integral error was 0.7%' (p. 155; the four add linearly to \
1.26 %).

THE 1.0637 CORRECTION. 'Comparison with A_K(T0) calculated with the ref. [3] molecular \
parameters led to the correction factor 1.0637 +- 0.0031, in the sense that all values \
K, mK, and A_K given in ref. [3] should be multiplied by this number' (p. 154). Checked \
here against tammer_1990 Table 1: the re-corrected Table 1 is not the 1990 table times \
one factor. A_K(1992)/A_K(1990) is 1.0634 on average (standard deviation 0.0022, range \
1.0592 at 376.5 K to 1.0684 at 219.5 K), a(1992)/a(1990) 1.0635 (1.0599-1.0660), and b, \
B_K^(4), B_K^(2) differ by 0.86-1.30 times: the data were refitted, not rescaled. The \
row printed 376.5 K here is 376.8 K in tammer_1990 Table 1; its orientation term here \
(3.5731e-62, from 81 eps0 A_K/N_A - gamma) corresponds to 376.5 K rather than 376.8 K \
(3.5712e-62 x 376.8/376.5 = 3.5740e-62), so the new table was evaluated at 376.5 K. \
Which temperature is right is not stated.

TABLE 2 (p. 155), gamma(H2) at 632.8 nm: this work 4.68(14) x 10^-62 C^4 m^4 J^-3, \
'Remeasured after the field calibration. The error contains a systematic contribution \
of 1.3% in the original Kerr data'; 'Its error is obtained from that of A_K in the last \
row of table 1 neglecting the uncertainty in the orientation term' (p. 155). Checked: \
(0.019 + 0.013 x 7.455) x 10^-29 x 81 eps0/N_A = 0.138 x 10^-62. In au (6.235377e-65): \
751 +- 22. Literature rows (reproduced): Shelton 1990 ESHG 4.54(3) and Rosasco & Hurst \
1986 ac Kerr 4.52(23), both 'Extrapolated to dc KE using dispersion relations, see ref. \
[3]. Extrapolation errors and the uncertainty arising from normalizing to a theoretical \
gamma_z(He) value [19] are not included'; theory 4.53 (Bishop, Pipin & Cybulski 1991), \
4.45 (Bishop, Pipin & Rérat 1990; the reference list prints 'J. Phys. Chem. 92 (1990) \
1902', tammer_1990 'J. Chem. Phys. 92 (1990) 1902'), 4.40 (Bishop & Lam 1988). The \
authors' weighted mean of these, 4.55 x 10^-62, 'is known to an uncertainty of less \
than +-3%' (p. 157).

HELIUM (pp. 155-156). 'The error bars are standard deviations from the statistics of \
repeated field settings. A straight line was fitted through the entries and the \
origin, resulting in the slope K/p = 1.937(10) x 10^-20 C^2 m J^-2 bar^-1' (Eq. 11; \
misprinted: 10^-21 is meant, erratum below). 'higher order virial coefficients can be \
neglected ... estimating B_K with aid of the theory of Buckingham et al. [17]: For p = \
80 bar, a value amounting to only 0.5% of A_K': the pair term is not removed. A_K^(2) = \
2.321(11) and A_K^(4) = 2.312(12) x 10^-30 C^2 m^5 J^-2 mol^-1 (statistical errors \
only); 'Adopting the first one we obtain, according to eq. (4), the Kerr \
hyperpolarizability anisotropy of the helium atom as given in the first row of table \
3' (27.6(5), 'The error contains a systematic contribution of 1.3%'). Checked: 81 eps0 \
x 2.321e-30/N_A = 27.64e-64; (0.011 + 0.013 x 2.321) x 1.1909e-3 = 0.49e-64. In au: \
44.3 +- 0.8 (as shelton_1994 Table VI). Literature (Table 3, reproduced): Buckingham & \
Dunmur 1968 33(2) (buckingham_1968), Boyle et al. 1966 32.0(53), theory 27.57 (Bishop & \
Pipin 1989 = bishop_1989) and 26.78 (Bishop & Lam 1988). 'the present investigation is \
one order of magnitude more accurate' (p. 157).

RATIO (pp. 156-157). 'gamma(H2) and gamma(He) have been determined with the same \
buildup and optical alignment of the Kerr apparatus. Systematic errors therefore cancel \
when their ratio is considered: we obtain gamma(H2)/gamma(He) = 16.94(17) which compares \
with 16.43 when the corresponding theoretical values [6,8] are combined. The error \
estimate of the former value means one standard deviation sigma and presumes that the \
hydrogen orientation term in eq. (4) as calculated in ref. [3] is correct.' Checked: \
4.682e-62/27.64e-64 = 16.94.

UNLABELLED TABLE (p. 157, 'table 4' in the text; tbl_2b285a6d3881, checked against the \
image; not stored, as no quantity holds a Kerr constant against pressure): K of H2 at \
303.7 K and 632.8 nm at 12 pressures from 5.953 to 49.274 bar (10^18 K from 0.3733(42) to \
3.0492(35) C^2 m J^-2), with the mass density, 10^4(n - 1), 10^4(eps - 1) and the molar \
Kerr constants mK^(4), mK^(2) (7.43-7.53 x 10^-29); 'Extrapolation to zero density \
leads to A_K = 7.46(2) x 10^-29 ... in the last line of table 1' (caption), offered as a \
calibration standard for dc Kerr measurements (p. 157). Eqs. (13)-(14): K = (27/(2 \
lambda))((p/k_B T) A_K + b' p^2) with b'-bar = -(8.1 +- 5.4) x 10^-24 C^2 m J^-2 bar^-2, \
'the error meaning three standard deviations', the weighted mean of Table 1's b' (p. \
157): a formula for H2 K(T, p) in the paper (the A_K term is per unit of k_B T, whose \
units the text does not reconcile; not recorded as a formula).

Reproductions elsewhere: shelton_1994/table6_He_dc_kerr_expt (row 'ref 11', 44.3 +- 0.8 \
au). The library copy has no validation warnings; the Table 2 and 3 cells were read from \
the JSON and agree with the images."""

