unit = "cm3/mol"
abscissa_unit = "angstrom"
wavelength_medium = "vacuum"
use = "reproduced"
reproduced_from = ["gaiser_2018"]
notes = "Table VIII 'Experiment, Ref. [58]': Gaiser and Fellmuth's (2018) dielectric-constant gas thermometry A_eps = 0.5172544(10) cm^3/mol, as in gaiser_2018/molar_polarizability_He. 'In agreement with but an order of magnitude' less accurate than theory (abstract); theory is 0.3 of its sigma below."
