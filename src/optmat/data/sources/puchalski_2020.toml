quantity = "molar_refractivity"
unit = "cm3/mol"
abscissa_unit = "angstrom"
wavelength_medium = "vacuum"
use = "check"
notes = "Table VIII 'Molar polarizability (4 pi/3) alpha_d N_A': 0.51725408(5) cm^3/mol, A_eps of 4He (static, electric). The same number as alpha_static converted with N_A = 6.02214076e23 (reproduced to 1e-9): a check, not fitted beside it. The value yang_2025 (puchalski_He) and rourke_2021 (A_eps_He) quote."
[datasets.uncertainty]
column = true
level = "not stated"

