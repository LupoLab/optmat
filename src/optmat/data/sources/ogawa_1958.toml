unit = "Mb"
scale = 0.045705266114
abscissa_unit = "angstrom"
wavelength_medium = "vacuum"
use = "check"
notes = "Table I, second column: the relative absorption coefficient (Lyman alpha = 500), with the printed +- as sigma (level not stated; the precision of the relative shape). scale = (614 / 500) x 1e18 / n0, the paper's own conversion to the absolute coefficient, then to Mb. The same measurements as 'absolute' (a check of the per-point precision, never fitted beside it)."
