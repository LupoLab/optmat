citation = "T. R. Ensley and N. K. Bambha, \"Ultrafast nonlinear refraction measurements of infrared transmitting materials in the mid-wave infrared\", Opt. Express 27, 37940-37951 (2019)"
doi = "10.1364/OE.27.037940"
library = "Ensley_2019_UltrafastNonlinearRefraction"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Conventional single-beam Z-scan (open and closed aperture, CA/OA division \
where valid) with a reference detector (p. 37941-37942). 2 um: Ti:sapphire amplifier \
(Spectra-Physics Solstice, 800 nm, ~100 fs FWHM, 1 kHz) pumping a TOPAS-Prime OPA \
(idler, horizontally polarized), pulse 90 fs FWHM (autocorrelation in BBO; p. 37941), w0 = 31 um \
(HW1/e^2), z0 = 1.5 mm, CaF2 lens, PbS detectors. 3.9 um: Coherent Hidra-F-100 (800 \
nm, ~100 fs, 10 Hz) pumping a TOPAS-HE-Prime, DFG in KTA (horizontally polarized), \
pulse 240 fs FWHM (autocorrelation in AgGaS2), w0 = 51 um, z0 = 2.1 mm, ZnSe lens, PbSe \
detectors. Energies by a THz radiometer (and a calibrated pyroelectric at 3.9 um). \
Each Z-scan energy is fitted separately (Sheik-Bahae et al. [11], Eqs. (9), (11), or a \
Huygens-Fresnel propagation when 2PA is present) and the fits averaged. The 800-nm \
measurements of Table 2 are not described separately; the only 800-nm source is the \
~100 fs Ti:sapphire amplifier."""
notes = """Journal pages 37940-37951 = PDF pages 1-12 (Table 1 p. 37945, Table 2 p. \
37947, Table 3 p. 37948). Identity checked against the first page.

DEFINITION (p. 37941): 'n(I) = n0 + n2 I and alpha(I) = alpha0 + alpha2 I where \
... I is the irradiance, and alpha2 is the third order NLA (two-photon absorption, \
2PA) coefficient' (alpha2 = beta of dI/dz = -alpha I - beta I^2). Whether reflection \
losses were removed from I is not stated. 'for all materials studied, there was no \
observed linear dependence on n2 and/or alpha2 with irradiance' (p. 37942). The \
paper does not discuss the Raman (nuclear) part; with 90-240 fs pulses it is partly \
included (the curators' rule): part = 'unknown'. Polarization: linear (the OPA idler \
and the DFG output are 'horizontally polarized', pp. 37940-37941); crystal \
orientations: GaAs and InP [100] wafers, the others not stated.

TRANSCRIBED (all tables JSON-only; every cell checked against the images, agree): \
Table 1, semiconductors: band gap (eV, 'taken from Ref. [19]', Sze 1981; Si and Ge \
'(indirect)') and n2 (1e-14 cm2/W) at 2 and 3.9 um; ZnSe at 3.9 um is Ref. [24]'s \
published value (Werner et al. 2019, a paper with Ensley as co-author): its own \
reproduced dataset. Table 2 (fluoride crystals and glasses): Eq. (1) (BGO) \
prediction, this work at 800 nm and 2 um, and literature values at 532 nm, 800 nm and \
1.06 um, each lettered a-m by reference; STRUCTURAL FIX: the library's header 'h_2 \
(10^-6 cm^-3/W)' is a mis-reading of 'n2 (10^-16 cm2/W)' (image; see the script). \
Table 3, chalcogenide glasses (Amorphous Materials, Inc.): n2 at 2 and 3.9 um. Text \
values: 2PA coefficients alpha2 at 2 um of GaSb, Si and Ge (datasets beta_*).

TEXT VALUES CHECKED against the tables: ZnS (5.5 +- 1.1) and (5.0 +- 1.3) x 1e-15 \
cm2/W at 2 and 3.9 um; GaSb -(3.5 +- 0.7) x 1e-12 and (5.5 +- 1.4) x 1e-12; Si (7.7 +- \
1.5) x 1e-14 at 2 um; Ge -(3.5 +- 0.7) x 1e-13 at 2 um; ZnSe (1.2 +- 0.3) x 1e-14 at \
3.9 um (Ref. [24]); CaF2 (1.7 +- 0.34) and MgF2 (1.1 +- 0.22) x 1e-16 at 2 um; AMTIR-1 \
(7.5 +- 1.9) x 1e-14 and AMTIR-5 (1.6 +- 0.4) x 1e-13 at 3.9 um; AMTIR-6 (8.3 +- 2) x \
1e-14 at 3.9 um: all agree with the tables.

UNCERTAINTY (captions): Tables 1 and 3, '+- 20 %' at 2 um and '+-25 %' at 3.9 um; \
Table 2, '+- 15 %' at 800 nm and '+-20 %' at 2 um. Relative, level not stated. The \
negative n2 of GaSb and Ge at 2 um are real (self-defocusing near the 2PA edge, \
compared with the two-band theory).

LITERATURE COLUMNS OF TABLE 2 (use = reproduced). Letters (caption): a Ref. [11] \
Sheik-Bahae et al. 1990; b [37] DeSalvo et al. 1996 (desalvo_1996); c [36] DeSalvo et \
al. 1993; d [38] Levenson 1974; e [39] Adair et al. 1992; f [40] Guo et al. 2015; g \
[41] Milam, Weber and Glass 1977; h [18] Adair et al. 1989 (adair_1989); i [42] \
Kabacinski et al. 2019 (kabacinski_2019); j [43] Milam 1998 (milam_1998); k [44] Lu et \
al. 2012; l [45] Milam and Weber 1976; m [46] Adair et al. 1987. '(+), (#), and (*) \
denote measurements at 525 nm, 810 nm, and 1.03 um': those values carry that \
wavelength. The 1.06-um column is written as 1060 nm. Checks against the curated \
originals: b = DeSalvo's esu values converted (BaF2 532 nm 2.1 = DeSalvo's own text \
value; BaF2 1064 nm 1.4 against 1.43; MgF2 0.58, 0.58 against 0.57 with DeSalvo's \
Table II n0 = 1.4; LiF 0.57, 0.75 against 0.61, 0.81 with Table II's n0 = 1.3, i.e. \
Ensley converted with LiF's true index ~1.39, as refractiveindex.info did); h = Adair \
1989 Table IV esu values converted with Adair's n(1.06 um) (BaF2 1.91, CaF2 1.26, MgF2 \
0.76, LiF 0.79: agree); i = Kabacinski's 1.71 at 1030 nm (agrees); j = Milam's \
recommended values, 3.0 at 527 nm and 2.74 at 1053 nm, listed under 532 nm and 1.06 um.

FORMULAS: Eq. (1), the Boling-Glass-Owyoung n2 (Ref. [35] = boling_1978) with K = 68, \
converted with n2(mks) = n2(esu) 40 pi/(c n0) (Ref. [36]); Eq. (2), Lines's \
chalcogenide/oxide n2 (Ref. [54]). Section 3.1's two-band theory uses K = 3100, K' = \
1.5e-8 and E_p = 21.4 eV (p. 37942; desalvo_1996 uses K' = 7.33e-9 and E_p = 21 eV \
and explains the factor 2). Other text numbers not extracted: GaSb n0 = 3.78 (2 um) and \
3.72 (3.9 um) from Ref. [25], alpha0 = 0.22 and 9.3 cm^-1 (p. 37943); Si literature: \
alpha2 ~ 0.4 cm/GW and n2 ~ 1.1e-13 cm2/W at 2 um [28], Gai et al. (2.7 +- 0.5) x 1e-14 \
cm2/W at 3-5 um [30]; Ge |n2| = 4.0e-14 (2 um), 5e-14 (4 um) [32], chi(3) = 4e-11 esu \
(n2 = 9.9e-14 cm2/W) at 3.8 um [33] (p. 37945); Wagner et al. [27] alpha2(Ge) = 71 \
cm/GW at 2.05 um. Figures (not digitised): Fig. 2 transmission spectra 0.3-20 um; Fig. \
3 ZnS Z-scans and n2 dispersion with literature; Fig. 4 two-band theory curves for \
ZnSe, GaAs, InP, GaSb with data; Figs. 5-6 Z-scans of CaF2, MgF2 (2 um), AMTIR-1, \
AMTIR-5 (3.9 um).

SAMPLES (p. 37942): ZnS/Cleartran 3 mm (Meller Optics SCD3349-02A); ZnSe 2 mm (ISP \
Optics); GaAs undoped [100] 0.35 mm, InP undoped n-type [100] 0.35 mm, GaSb undoped \
p-type 0.5 mm (Wafer Technology); Si 1 mm, Ge 1 mm (Andover); fused silica 1 mm \
(Thorlabs WG41010); BK7 1 mm (Thorlabs WG11010: the paper writes 'BK7', whether Schott \
BK7 or N-BK7 is not stated; recorded as BK7); BaF2, CaF2, MgF2, LiF 3 mm (Eksma \
Optics); AMTIR-1 2 mm, -2 2 mm, -4 2.5 mm, -5 2 mm, -6 2 mm.

REFRACTIVEINDEX.INFO: the 'Ensley' n2 pages (BK7, BaF2, CaF2, LiF, MgF2, SiO2 at 0.8 \
and 2.0 um; Si at 2.0 and 3.9 um) agree with Tables 1-2 (1e-16 cm2/W = 1e-20 m2/W). \
They give '100 fs' for every value; the paper gives 90 fs at 2 um and 240 fs at 3.9 um \
(p. 37941), ~100 fs only for the 800-nm source."""

