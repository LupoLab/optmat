[[formulas]]
id = "bgo_eq1"
equation = "Eq. (1), p. 37946"
printed = "n2(esu) = 68 (n_d - 1)(n_d^2 + 2)^2 / {nu_d [1.517 + (n_d^2 + 2)(n_d + 1) nu_d / (6 n_d)]^(1/2)} 10^-13; n2(mks) = n2(esu)(40 pi)/(c n0)"
variable = "n_d, the index at the Fraunhofer d line (587.56 nm); nu_d = (n_d - 1)/(n_F - n_C), F = 486.13 nm, C = 656.27 nm; c the speed of light"
coefficients = { K = "68", a = "1.517" }
reproduced_from = ["boling_1978"]
check = "Not reproduced exactly: n_d and nu_d come from the dispersion relations of Refs. [47]-[50] and the n0 of the conversion is not stated. Rough check with Boling et al.'s own Table III inputs (boling_1978: fused silica n_d = 1.458, nu_d = 70; BK-7 1.517, 64): 8.33e-14 esu -> 2.41e-16 cm2/W (n0 = 1.45) against the column's 2.5; 1.15e-13 esu -> 3.20e-16 (n0 = 1.51) against 3.2. Computed 2026-09-26."
notes = "The Boling-Glass-Owyoung empirical formula (Ref. [35]), printed here without the K symbol (K = 68). Values in Table 2's 'Eq. (1)' column (datasets eq1_*)."

[[formulas]]
id = "lines_eq2"
equation = "Eq. (2), p. 37947"
printed = "n2(cm^2/W) = 3.4 (n0^2 + 2)^3 (n0^2 - 1) d^2 / (n0^2 E_s^2) 10^-16"
variable = "d, the mean cation-anion bond length in angstrom; E_s, the Sellmeier gap in eV; n0 the linear index"
coefficients = { prefactor = "3.4", E_s_As2S3 = "5.3", d_As2S3 = "0.228 nm" }
reproduced_from = ["M. E. Lines, J. Appl. Phys. 69(10), 6876-6884 (1991)"]
check = "For As2S3 (AMTIR-6) with E_s = 5.3 eV and d = 0.228 nm [54, 55]: n0 = 2.43 (2 um, from Ref. [56]) gives 2.58e-14 cm2/W, printed '2.5 x 10^-14'; n0 = 2.41 (3.9 um) gives 2.48e-14, printed '2.4 x 10^-14' (pp. 37947-37948). Both printed values are 3-4 % below the formula, as if truncated rather than rounded; the formula as printed is otherwise reproduced. Computed 2026-09-26."
notes = "Lines's empirical relation for chalcogenide glasses (Ref. [54]). The paper compares it with AMTIR-6 (2.5 at 2 um agrees; 8.3 +- 2 at 3.9 um does not)."

