citation = "C. Hattig and P. Jorgensen, \"Coupled cluster calculations of the frequency-dependent second hyperpolarizabilities of Ne, Ar, N2, and CH4\", J. Chem. Phys. 109, 2762 (1998)"
doi = "10.1063/1.476833"
library = "Hattig_1998_CoupledClusterCalculations"
identity = "VALIDATED"
kind = "theory"
technique = """Coupled-cluster cubic response functions (orbital-unrelaxed CCS, CC2, CCSD; \
DALTON) and SCF (RPA) cubic response for the dc Kerr effect, DFWM, ESHG and THG; \
orbital-relaxed finite-field CCSD and CCSD(T) for the static limit. Correlation-consistent \
x-aug-cc-pVXZ basis sets (frequency-dependent: t-aug-cc-pV5Z for Ne, Ar; t-aug-cc-pVTZ for \
N2, CH4), frozen cores (Ne 1s, Ar 1s-2p, CH4 1a1; N2 none) unless stated; equilibrium \
geometries r_NN = 2.074, r_CH = 2.052 a.u.; N2 vibrationally averaged over a CCSD(T) \
potential (Table XII); CH4 zero-point and pure vibrational corrections taken from Bishop \
and Sauer (1997) and Bishop and Pipin (1995) (pp. 2764-2765, 2772-2774)."""
notes = """Identity: pdf page 1 is the publisher's cover; journal pages 2762-2778 = pdf \
pages 2-18 (page = pdf page + 2760). The library's text rendering garbles many numbers \
in the running text (plus-minus read as '6', '=' as '5'); every number quoted here from \
the text was read on the rendered pdf pages 6, 12 and 14 (2766, 2772, 2774).

PROCESSES AND COMPONENTS (p. 2764): gamma^dcKerr(w) = gamma(-w; 0, 0, w), gamma^DFWM(w) = \
gamma(-w; w, w, -w) (the intensity-dependent index: process kerr), gamma^ESHG(w) = \
gamma(-2w; w, w, 0), gamma^THG(w) = gamma(-3w; w, w, w). Tabulated are the isotropic \
gamma_par = (1/15) sum (gamma_xxyy + gamma_xyyx + gamma_xyxy) (Eq. 26) for DFWM, ESHG, \
THG, and for the dc Kerr effect gamma_K = (3/2)(gamma_par - gamma_perp) (Eq. 28), \
gamma_perp = (1/15) sum (2 gamma_xyyx - gamma_xxyy); 'in the static limit gamma_par = 3 \
gamma_perp = gamma_K = gamma_0'. Components recorded: 'K' (dc Kerr), 'parallel' (others). \
CONVENTION: the response functions are derivatives of the quasienergy Lagrangian (Eq. \
18), equivalent in the static limit to finite-field energy derivatives, with the same \
static limit for all processes, and are compared directly with Shelton's ESHG data: the \
Taylor-series (T) convention. Atomic units. Frequencies: omega in a.u. with lambda/nm \
as vacuum wavelengths (45.5634/1319.0 = 0.034544); the wavelength column of every file \
is omega (hartree), the row id lambda as printed.

PARTS. Ne, Ar: electronic. N2: Table XIII is vibrationally averaged (v = 0) electronic \
gamma (zero-point correction included, pure vibrational and rotational parts not); \
Tables VI and XII at fixed geometry. CH4: Table XV electronic at the equilibrium \
geometry; Table XVI adds the zero-point correction and (dc Kerr, ESHG) the pure \
vibrational contribution of Bishop and Pipin (electronic_vibrational); its THG column \
is 'Only electronic contribution' (with the zero-point correction, 2974 - 2635.2 = 339 \
at 1319 nm).

DATASETS. (1) Tables VIII (Ne), IX (Ar), XIII (N2), XV (CH4): CCSD gamma for the four \
processes (ccsd_<process>_<gas>). Table XV prints lambda '590.0' for omega 0.077357 \
(589.0 nm in Tables VII and XVI): the row id keeps the print. (2) Tables IV-VII: THG by \
SCF, CCS, CC2 (and N2's CCSD at the equilibrium geometry); the CCSD columns of Ne, Ar \
and CH4 equal the THG columns of (1) and are not repeated. Tables IV and V are captioned \
'q-aug-cc-pV5Z', Tables VIII, IX 't-aug-cc-pV5Z', with identical CCSD THG values (the \
static CCSD values of the two bases are equal, 110.2 (Ne); Ar 1178.5/1179.0, Table II): \
one of the captions is probably inaccurate (TC-247). (3) Table III, static gamma_0 by \
method (static_<gas>): unrelaxed CCS, CC2, CCSD (footnote a t-aug-cc-pV5Z, b \
t-aug-cc-pVTZ, c d-aug-cc-pVTZ), SCF, relaxed CCSD and CCSD(T), and the all-electron \
'core corr.' rows; the 'effect' rows (differences) are not taken; rows citing other \
work are static_others_<gas> (reproduced). (4) Table XII: the vibrationally averaged \
static <0|gamma_0|0> of N2, 915.0 (CCSD/t-aug-cc-pVTZ; at r_e 903.0; the averaged \
values at 694.3 and 457.9 nm are within 0.2 of Table XIII's, not taken again). (5) \
Tables X, XI, XIV, XVI: the paper's final estimates (best_<process>_<gas>): Ne and Ar \
CCSD response times gamma^CCSD(T)(0)/gamma^CCSD(0) (all electrons, Table III: 107.1/110.2 \
Ne, 1159/1178 Ar); N2 Table XIII times the best-estimate/t-aug-cc-pVTZ static ratio \
(894/915.0 = 0.977: 972.1 x 0.977 = 949.8, checked); CH4 as described above. Values \
marked 'a' in Tables XI and XVI are interpolated. (6) The experimental columns of the \
same tables (expt_<process>_<gas>, reproduced; see each dataset).

STATIC BEST ESTIMATES (text). Ne: CCSD(T), all electrons, t-aug-cc-pCV5Z: 107.1 \
(Table III), 'in good agreement with the refined experimental estimate' 106.4 +- 2 \
(Hattig and Jorgensen, Chem. Phys. Lett. 283, 109 (1998), from the CCSD dispersion \
shifted to Shelton's visible points) and Shelton and Donley's fit 108.1 +- 2.2; the \
intrinsic uncertainty of the ab initio results 'about +-3 a.u.' (p. 2770). Ar: CCSD(T) \
all electrons 1159 (Table III); uncertainty 'about 1 %-3 %' (p. 2771). N2 (p. 2772): \
unrelaxed CCSD basis-set limit 867 +- 7 (873.2 in d-aug-cc-pV5Z plus core -6.7, p. \
2766), plus triples and relaxation (+15.4, Table III) and zero-point correction (+12): \
'gamma_0^e,N2 = 894 a.u.', against Shelton's 917 +- 9. CH4 (p. 2774): CCSD basis limit \
2318 +- 35 plus the zero-point correction of Bishop and Sauer and -70 (relaxation and \
triples): 'gamma_par^e,CH4(0) = 2533 a.u.', 'about +-70 a.u. or +-3 %'; CCSD/t-aug-cc-pVTZ \
plus the zero-point correction gives 2650, against Shelton's 2590 and Bishop and \
Pipin's 2607. Hartree-Fock limits 715 +- 2 (N2), 1865 +- 5 (CH4) (p. 2766). The \
Table I and II basis-set studies (SCF, CCSD static gamma_0 in 16 basis sets) are not \
extracted.

OTHER STATEMENTS: N2 THG ratio to He at 694.3 nm (Ward and New) 26.75 +- 4.25 -> 1295 +- \
206 a.u.; Lehmeier et al. 21.1 +- 2.1 at 1055 nm -> 954 +- 95; Shelton's rovibrational \
contribution to N2 THG at 694.3 nm -0.64 a.u.; to N2 gamma_K(632.8 nm) vibrational 0.5 \
a.u. and rotational 4670 a.u., which 'hinders a meaningful comparison' with the dc Kerr \
1443 +- 160 (p. 2774). CH4 THG: Ward and Elliot's ratio 82.5 +- 2.5 at 694.3 nm -> 3997 +- \
120; the equilibrium-geometry CCSD value interpolated to 694.3 nm is 3600, with the \
zero-point correction 4162 (p. 2775). Lehmeier et al.'s THG values are 'about 30 % too \
small' for Ne and in 'significant disagreement' for Ar (pp. 2771-2772). The CH4 dc Kerr \
dispersion of the calculation is 'distinctly too small' against Shelton and \
Palubinskas, attributed to the approximate vibrational part (p. 2775)."""

