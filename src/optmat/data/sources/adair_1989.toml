[[datasets]]
id = "n2_additivity_MgAl2O4"
material = "MgAl2O4"
file = "MgAl2O4/adair_1989__n2_additivity_MgAl2O4.csv"
table = "tbl_5192778e0ba3"
quantity = "nonlinear_index_field"
unit = "esu"
scale = 1e-13
abscissa_unit = "um"
use = "check"
notes = "Table X (p. 3348), column 'n2 (10^-13 esu) calculated from simple oxides': Eq. (5) with the Lorentz local field and the sum of the cation-oxygen pair hyperpolarizabilities of Table IX (the caption says Table VII), assuming additivity; the average error against the measured values is about 13 % (p. 3348). A prediction; part as the measurements it is built from. The table's measured column equals Table IV (checked by the script)."
