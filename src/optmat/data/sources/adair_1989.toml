citation = "R. Adair, L. L. Chase, and S. A. Payne, \"Nonlinear refractive index of optical crystals\", Phys. Rev. B 39, 3337-3350 (1989)"
doi = "10.1103/physrevb.39.3337"
library = "Adair_1989_NonlinearRefractiveIndex"
identity = "VALIDATED_WITH_WARNINGS"
kind = "measurement"
technique = """Nearly degenerate three-wave mixing (TWM), as in the authors' glass work (Ref. \
19, J. Opt. Soc. Am. B 4, 875 (1987), adair_1987, which gives the details): a 1.064-um beam (omega1) \
and a 1.071-um beam (omega2) from a Raman-shifted dye laser, collinear, generate \
2 omega1 - omega2; offset Delta = omega1 - omega2 = 60 cm^-1 (coherence length ~10 cm, \
samples up to 1 cm; the samples were a few mm thick). Two nearly identical focal \
regions, the sample arm and a CS2 reference arm, detected through a double monochromator \
by S-1 photomultipliers and a two-channel gated integrator, the sample signal normalized \
shot by shot to the reference. Relative measurement: n2 from the signal ratio to a \
standard through Eq. (10), [chi1111]_s = [chi1111]_c (I_s/I_c)^(1/2) (n_s/n_c)^2 (l_c/l_s) \
C^2 (C^2 corrects the surface reflectivities), the standard calibrated 'with the average \
of the nonlinear refractive indices of seven glass samples measured by time-resolved \
interferometry by Milam et al.' (Refs. 15-18) (pp. 3339-3340). Linear polarization; bulk \
single crystals except AgCl (polycrystalline). The pulse duration is not stated in this \
paper (the text says only that the pulses are nanosecond, p. 3338; see Ref. 19)."""
notes = """Journal pages 3337-3350 = pdf pages 1-14 (journal page = 3336 + pdf page). \
Identity checked against the first page. Every table image was compared with the \
extracted cells (2026-09-26): no misread cell in any of the 11 table files.

DEFINITIONS (quoted, Gaussian esu). Eq. (1), p. 3337: n = n0 + n2 <E^2>, 'where n0 is \
the linear refractive index and E is the applied optical electric field' (citing Yariv); \
Eq. (2), p. 3337: 'For linearly polarized light in an isotropic medium or light \
polarized along a cube axis in a cubic crystal', n2 = (12 pi / n0) chi(3)_1111. Eq. (3), \
p. 3337: n2 = n2(electronic) + n2(vibrational) + n2(electrostriction) + n2(thermal); \
p. 3338: electronic and vibrational response times ~1e-15 and 1e-13 s, electrostrictive \
'about 10^-8 s under our experimental conditions'; 'In the propagation of nanosecond \
laser pulses through a medium only the first two of the mechanisms in Eq. (3) are \
active. These are also the only two mechanisms that contribute to our measured values \
of n2.' Hence part = electronic_vibrational for the measured values (the Raman \
response is included; electrostriction and thermal are not). Finite Delta: 'the use of \
a finite frequency difference Delta may result in the measurement of only a partial \
contribution to n2 arising from the Raman-active lattice vibrations'; Table I (SF-58 at \
Delta = 63.5-9.8 cm^-1) shows no dispersion within ~5 %, and 'all of the crystals ... \
have no Raman-active vibrations below about 150 cm^-1' (p. 3339). Eq. (4), p. 3338: the \
hyperpolarizability of a constituent, p_i = alpha_i E_l + gamma_i E_l^3 / 6, E_l the \
local field: the Taylor-series (T) convention with the local field. Eq. (5), p. 3338 \
(BGO): n2 = (f^4 pi / 2n) sum_i N_i gamma_i, N_i the number density, f = (n^2 + 2)/3 the \
Lorentz local field. Tensor, p. 3338-3339: for cubic 432, -43m, m3m crystals and a \
linearly polarized beam along [001] polarized at Theta to [100], Eq. (7): chi(3)(Theta) = \
(2 chi1122 + chi1221) + (chi1111 - 2 chi1122 - chi1221) [(cos^2(2 Theta) + 1)/2]; with \
Kleinman symmetry, Eq. (8), chi1122 = chi1221, Eq. (9): chi(3)(Theta) = 3 chi1122 + \
(chi1111 - 3 chi1122) [(cos^2(2 Theta) + 1)/2]; isotropy is r = chi1122/chi1111 = 1/3 \
(p. 3346). Table III footnote b: the TWM values are 'the chi1111 component unless \
otherwise noted'. No circular-polarization relation is given. Table II footnote a: \
P_crit = c lambda^2 / (32 pi^2 n2) = 94 kW (SF-58).

ACCURACY (quoted). p. 3340: 'we believe that the accuracy of relative n2 measurements is \
better than 5% for nearly all of the samples measured. Some materials (KF, KCl, NaBr, \
KBr, CaO, and SrO) had marginal optical quantity [sic], and the estimated errors are on \
the order of 15%.' p. 3341: 'Despite this uncertainty in the absolute values, our \
relative values of n2 are believed to be accurate to better than 15% based on the \
reproducibility and scatter of our data.' p. 3349: 'relative values of n2 can be \
measured with an accuracy of about 5%'. The absolute scale rests on Milam et al.'s TRI \
glasses: 'any persistent error in the calibration set is incorporated into our results' \
(p. 3340). Levels not stated.

THE n2 DATASETS (nonlinear_index_field: n = n0 + n2 <E^2>, Eq. 1, in esu; scale 1e-13 as \
printed; nothing converted). parameters.definition quotes Eq. (1). The tables, all in \
units of 10^-13 esu and checked against the images (2026-09-26): \
(1) Table IV (tbl_55822e89640f, p. 3342, 43 rows; continued tbl_2e1f875bba6b, p. 3343, 12 \
rows; both JSON-only, two header rows): columns 'Measured n2' (datasets n2_<row>, \
primary, relative uncertainty 5 % or 15 % as stated) and 'Calculated n2' (the BGO Eq. (6) \
with K = 68, formula bgo_k68; datasets n2_bgo_<row>, check). Row labels give the polarization: [100] or [110] \
for cubic crystals, (o)/(e) for uniaxial ones, (x+y), (y), (x+z), (gamma) for KTP, \
L-arginine phosphate (printed 'L-argenine') and YAlO3. Blank calculated cells (CeF3, CaO, \
SrO, Ga2O3, Er2O3, CaMgSi2O6, KTaO3) have no Abbe number. The fused silica row: n2 = 0.85 \
(measured), 0.83 (calculated), n = 1.4496, nu_d = 67.8; crystal quartz (o): 1.12, 1.06; \
(e): 1.16, 1.13. ZnS is labelled (e)/(o), so the sample was hexagonal, not the registered \
cubic ZnS. (2) Table I (tbl_c3b6ccc6cfdc, p. 3340): SF-58 and CS2 n2 at Delta = 63.5, 32.3, \
19.8, 9.8 cm^-1 (CS2 is a liquid: skipped; SF-58: dataset n2_offset_SF-58, check, the \
offset as column delta). (3) Table II (tbl_0f4b0f5d826e, p. 3340): SF-58 n2 at 250, 75, \
50, 12 kW, 1.064 um (dataset n2_power_SF-58, check, column power). (4) Table III (tbl_fbb684fc9121, p. 3341; 16 \
materials): this work's TWM (1.06/1.07 um; '(av)' after LaF3, CeF3, Al2O3 and YAG is not \
explained, presumably an average; Al2O3 1.25 (av) is not the mean of Table IV's o and e \
values, 1.23 and 1.30, which is 1.265; this column otherwise repeats Table IV, checked \
by the script, so only Al2O3's 1.25 is recorded, n2_av_Al2O3, check), and literature, \
all reproduced, one dataset per material and column (n2_tri_*, n2_maker_terhune_*, \
n2_levenson_bloembergen_*, n2_lynch_*, n2_levenson_*, n2_smith_pdf_*; a TWM column's \
second wavelength is the column omega2): TRI 1.06 um (footnote c, Refs. 15 and 17: Milam and Weber, J. \
Appl. Phys. 47, 2497 (1976); Milam, Weber and Glass, Appl. Phys. Lett. 31, 822 (1977)), \
TWM 0.693/0.746 um ('Corrected values from Ref. 2 as cited in Ref. 28': Maker and \
Terhune, Phys. Rev. 137, A801 (1965) via C. C. Wang, Phys. Rev. B 2, 2045 (1970)), TWM \
0.575/0.610 um (Ref. 23, Levenson and Bloembergen, Phys. Rev. B 10, 4447 (1974)), TWM \
0.575/0.592 um (Ref. 24, Lynch, Levenson and Bloembergen, Phys. Lett. 50A, 61 (1974)), TWM \
0.560/0.590 um (Ref. 25, Levenson, IEEE J. Quantum Electron. QE-10, 110 (1974)), and PDF \
(power-dependent focus) 1.06 um (Ref. 27, Smith, Bechtel and Bloembergen, Phys. Rev. B 12, \
706 (1975), the same paper as Milam 1998's Ref. 18). Fused SiO2: 0.85 (this work), 0.95 \
(TRI), 1.8 (Maker-Terhune/Wang), 2.4 (Levenson 1974). The text (p. 3341) says Maker and \
Terhune's values are 'consistently larger than ours by a factor of 2' and Levenson's \
'roughly a factor of 3 larger ... except for CdF2'. (5) Table VIII (tbl_8652b8e99339, p. \
3347, 13 cubic crystals): n2 with the polarization along [100], propagation along [001] \
(footnote a); datasets n2_table8_*, check (the same measurements as Table IV, recorded \
so that the three differing cells are in the data). (6) Table X (tbl_5192778e0ba3, p. 3348, 11 complex oxides): n (1.06 um, \
rounded Table IV values), n2 measured (= Table IV) and n2 'calculated from simple oxides' \
by additivity of the Table IX pair hyperpolarizabilities through Eq. (5) (average error \
13 % with the Lorentz field, 17 % with f = 1, p. 3349); BeAl2O4 and GSAG have no calculated \
value (footnote a: the BeO and Sc2/3O gammas were extrapolated from them); datasets \
n2_additivity_*, check; the measured column equals Table IV (checked by the script). \
refractiveindex.info's 'Adair' n2 pages of Al2O3 (o, e), BaF2, CaF2, LiF, MgF2, SiO2 and \
YAG are this paper's Table IV esu values converted by n2[m2/W] = 40 pi n2[esu]/(c n0) \
with Table IV's n (agreement 0.2-1.6 %, rounding), although they cite Ref. 19 (the 1987 \
glasses paper); its BK7 page is from Ref. 19 (BK7 is not in this paper).

FINDINGS BETWEEN TABLES (images checked). Table VIII prints KBr 3.07 against Table IV/III \
2.93; CaO 5.07 against Table IV 5.20 (5.07 is Table IV's SrO[110]); MgO 1.6 against 1.61. \
Which of each pair is right is not decidable from the paper, so no erratum: both are \
recorded (Table IV primary, Table VIII check) and the dataset notes say so. Table X prints 'Gd3Sc2Al2O12' \
against Table IV and the text (p. 3347) 'Gd3Sc2Al3O12' (GSAG; a misprint of the formula \
in Table X, mapped to GSAG by the script; its n2 equals Table IV's GSAG row). \
Table IX's header prints 'gamma(MxO < MxS' for 'gamma(MxO, MxS)'. The text (p. 3346) \
quotes r = 0.46 (LiF), 0.45 (NaF), 0.29 (KF), 0.56 (CaF2), 0.60 (SrF2), 0.66 (BaF2), 0.31 \
(CdF2), consistent with Table VIII.

TABLE VIII RATIOS (not recorded: no quantity for a ratio of chi(3) components). \
chi1122/chi1111 from the polarization anisotropy of n2 via Eq. (9), assuming chi1122 = \
chi1221 (footnote b), this work (footnote c), e.g. CaF2 0.556 +- 0.020, BaF2 0.658 +- \
0.008, MgO 0.482 +- 0.025, LiF 0.460 +- 0.017; the last column reproduces Ref. 2 (Maker and \
Terhune 1965; LiF, NaCl, KCl, KBr, CaF2, MgO) and Ref. 23 (Levenson and Bloembergen \
1974; CaF2, SrF2, CdF2, BaF2).

HYPERPOLARIZABILITIES. Tables V (gamma_expt), VII \
and IX: gamma per neutral formula unit containing one anion (LiF, Mg1/2F, La1/3F, \
Al2/3O, Si1/2O, ZnS ...), in 10^-39 esu, from the measured n2 through Eq. (5), assuming \
the anion dominates (gamma+ << gamma-). Convention T with the Lorentz local field \
(Eq. 4). Wavelength 1.064 um (the TWM fundamental; Table V's header says 1.06 um). They \
are use = check: a model reduction of the n2, not an independent measurement. Table VII \
repeats Table V's LiF, NaF, KF (141, 320, 889; checked equal by the script), taken once. \
Table IX's BeO (436.0, footnote b 'Obtained from BeAl2O4 and Al2O3 assuming \
additivity') and Sc2/3O (920.0, from GSAG, p. 3347) are pair values, not a crystal's \
gamma: not recorded. Check (computed 2026-09-26): with Eq. (5), n = 1.4496 and an assumed \
fused-silica density of 2.20 g/cm3 (not stated in the paper; N(O) = 4.41e22 cm^-3), gamma \
= 510e-39 esu per Si1/2O gives n2 = 0.851e-13 esu, Table IV's 0.85: the table's gamma is \
per oxygen, with N the oxygen density. Table V's theory: the in-crystal alpha+, alpha-, \
gamma+, gamma- of Johnson, Subbaswammy and Senatore (Ref. 12) for 16 alkali halides are \
NOT transcribed (per-ion values of an LDA theory; no per-material quantity); only the \
'gamma_theory (adjusted)' column of the 7 crystals measured here is recorded, as \
reproduced. The alkali halides that appear only in those theory columns (RbF, LiCl, \
RbCl, LiBr, RbBr, LiI, NaI, KI, RbI) are not registered.

LINEAR INDEX. Table IV's 'n (1.06 um)' column is recorded per row (refractive_index, \
reproduced from the handbook of each footnote, Refs. 29-39); Table X's n repeats it \
rounded and is not recorded. The Abbe numbers nu_d (Table IV) have no quantity: quoted in \
each dataset's notes. Eq. (6) uses n_d (587.56 nm) whereas Table IV prints n at 1.06 um.

FIGURES (not digitised): Fig. 2 (p. 3343), measured n2 against n (log scales); Fig. 3 \
(p. 3343), measured against BGO-calculated n2, with K = 68 and K = 48 lines; Fig. 4 (p. \
3345), Johnson et al.'s ln alpha- and ln gamma- against R^-2; Figs. 5 and 6 (pp. 3346, \
3348), measured gamma per F and per O against R^-2 (CdF2 and the d-shell oxides off the \
line)."""

[[formulas]]
id = "bgo_k68"
equation = "Eq. (6), p. 3338 (the Boling-Glass-Owyoung formula, Ref. 5), with K = 68 (p. 3341)"
printed = "n_2 = K (n_d - 1)(n_d^2 + 2)^2 / { nu_d [1.517 + (n_d^2 + 2)(n_d + 1) nu_d / (6 n_d)]^(1/2) } x 10^-13 esu"
variable = "n_d: the linear index at the He d line, 5875.6 A; nu_d: the Abbe number; n2 in esu (n = n0 + n2 <E^2>)"
range = "low-index crystals and glasses; K = 68 'determined by a best fit to low-index glasses and fluoride crystals' (Refs. 5, 15-18)"
coefficients = { K = "68", a = "1.517", scale = "1e-13" }
check = "Table IV's 'Calculated n2' column uses K = 68 (p. 3341). Evaluated with Table IV's n (1.06 um) in place of n_d (the paper does not print n_d), the formula gives values below the printed ones by a median of 4 % (calc/formula = 1.04; 33 of 48 rows within 6 %, 36 within 10 %; up to 1.38 for CdS (e), 1.29 ZnO (e), 1.25 TiO2, 1.23 LAP (x+z), 1.19 GSAG, SrTiO3; 0.90 YGG): consistent with n_d > n(1.06 um) for most rows; the large departures are high-dispersion crystals, where n_d and n(1.06 um) differ most. Not reproduced exactly (n_d not available). Checked 2026-09-26."
notes = "Relative to the measurements: measured/formula has a median of 0.76 with K = 68 and 1.08 with K = 48 (computed from Table IV with n(1.06 um); the paper says K = 48 'fits the entire set of data much better', the oxides of Ti4+, Zr4+, W6+ lying ~40 % below even that line, p. 3341). The paper also rederived the formula with f = 1 (p. 3349): 'not very different'."

[[formulas]]
id = "bgo_k48"
equation = "Eq. (6), p. 3338, with K = 48 (the dashed line of Fig. 3, p. 3341)"
printed = "n_2 = K (n_d - 1)(n_d^2 + 2)^2 / { nu_d [1.517 + (n_d^2 + 2)(n_d + 1) nu_d / (6 n_d)]^(1/2) } x 10^-13 esu"
variable = "n_d: the linear index at the He d line, 5875.6 A; nu_d: the Abbe number; n2 in esu (n = n0 + n2 <E^2>)"
range = "the crystals of Table IV (fitted to the whole set; p. 3341)"
coefficients = { K = "48", a = "1.517", scale = "1e-13" }
check = "No tabulated values use K = 48 (only Fig. 3's dashed line). The median of measured/formula over Table IV's 48 rows with an Abbe number is 1.08 when Table IV's n (1.06 um) stands for n_d (computed 2026-09-26)."

[[formulas]]
id = "wilson_curtis_alpha"
equation = "Eq. (15), p. 3345, with Table VI (tbl_8fbcb8f4b360, p. 3346), columns 'Theor.' (fits to Johnson et al.'s calculations, Ref. 12)"
printed = "alpha^- = alpha_0^- exp(-C / R^2)"
variable = "R: the nearest-neighbour (anion-cation) distance in angstrom; alpha in A^3"
coefficients = { alpha0_F = "2.24", C_F = "3.87", alpha0_Cl = "5.50", C_Cl = "4.36", alpha0_Br = "7.24", C_Br = "4.66", alpha0_I = "10.5", C_I = "5.41" }
check = "A fit to Table V's theoretical alpha- (Johnson et al.), not to measurements; not reproduced here (the NN distances of the alkali halides other than Table VII's fluorides are not printed). Table VI verified against its image."

[[formulas]]
id = "wilson_curtis_gamma"
equation = "Eq. (17), p. 3346, with Table VI (tbl_8fbcb8f4b360, p. 3346): gamma0 and D, 'Theor.' (fits to Johnson et al.'s gamma-, Ref. 12) and 'Expt.' (this work: fluorides of Table VII without CdF2, oxides of Table IX)"
printed = "gamma^- = gamma_0^- exp(-D / R^2)"
variable = "R: the nearest-neighbour (anion-cation) distance in angstrom; gamma in 10^-39 esu per formula unit (convention of Eq. 4); D in A^2"
coefficients = { gamma0_F_theory = "4040", D_F_theory = "11.3", gamma0_Cl_theory = "16 100", D_Cl_theory = "16.9", gamma0_Br_theory = "24 400", D_Br_theory = "18.6", gamma0_I_theory = "47 500", D_I_theory = "22.6", gamma0_F_expt = "4950", D_F_expt = "14.7", gamma0_O_expt = "34 270", D_O_expt = "18.3" }
check = "Evaluated at Table VII's separations with the F expt parameters (computed 2026-09-26): LiF 130 (Table VII 141), NaF 322 (320), Mg1/2F 121 (128), Ba1/2F 649 (626), La1/3F 471 (487), Ce1/3F 454 (440), but Ca1/2F 361 (282), Sr1/2F 480 (412), KF 630 (889), Cd1/2F 330 (1520; excluded from the fit, the square point of Fig. 5). With the O expt parameters at Table IX's separations: MgO 562 (485), CaO 1467 (1500), SrO 2192 (2290), Al2/3O 227 (248), Y2/3O 983 (945), Er2/3O 953 (1040), Zr1/2O 953 (650), and far below for the d-shell or covalent units (ZnO 322 vs 4850, Ti1/2O 292 vs 2520, Ga2/3O 353 vs 887, Sc2/3O 562 vs 920, Si1/2O 29 vs 510, BeO 41 vs 436), as the paper says (the 'rounded data points' only, p. 3348). The paper states D = 18.29 in the text (p. 3348) and 18.3 in Table VI. Coefficients with a thin space printed as '16 100', '24 400', '47 500', '34 270'."
notes = "The model predicts D = 2C (p. 3346); the paper finds D/C = 3.7 on average for the theory fits."

