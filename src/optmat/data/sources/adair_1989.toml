notes = "Table III (p. 3341), 'Comparison of work with previously published results', column TWM^d 0.693/0.746 um, footnote d 'Corrected values from Ref. 2 as cited in Ref. 28' (Maker and Terhune 1965 via C. C. Wang 1970); 'Measured n2 (10^-13 esu)' as tabulated by Adair et al. (n = n0 + n2 <E^2>; whether they converted the originals' conventions is not said). For a TWM column the abscissa is the first (pump) wavelength and the column omega2 the second. Maker and Terhune 'used a setup similar to ours with collinear phase matching and a large value of Delta equal to the 992-cm^-1 vibration of benzene, which was the calibration medium. These results are consistently larger than ours by a factor of 2' (p. 3340). Large-Delta TWM 'is too large to include the vibrational contribution to chi(3) in most crystals and glasses' (p. 3340): part electronic. Orientation not stated."
[datasets.parameters]
definition = "<E^2>, 'E is the applied optical electric field' (Eq. 1, p. 3337)"
part = "electronic"
coefficient = "self"
technique = "three-wave mixing, Delta = 992 cm^-1 (benzene calibration)"

