use = "check"
notes = "Table V (p. 3344), column gamma_expt ('Comparison with experiment at 1.06 um'). Per neutral formula unit with one anion (LiF), in 10^-39 esu, derived by the authors from their measured n2 through Eq. (5) with the Lorentz local field f = (n^2 + 2)/3 and N the number density of formula units (p. 3338; assumption gamma+ << gamma-, pp. 3344, 3346-3347). The n2 is the measurement (the n2_* datasets of this record); this gamma is a model-dependent reduction of it, hence use = check. For the alkali halides the n2 'averaged over the [100] and [110] polarizations' was used (p. 3344). Table VII (p. 3346) repeats the value (checked equal by the script)."
[datasets.parameters]
process = "kerr"
convention = "T"
part = "electronic_vibrational"
technique = "nearly degenerate three-wave mixing (TWM)"
polarization = "linear"
form = "bulk"

