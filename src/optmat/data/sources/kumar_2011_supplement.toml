id = "idos_C"
material = "O3"
file = "O3/kumar_2011_supplement__idos_C.csv"
table = "tbl_4d1cc5fd6d9e"
quantity = "interval_oscillator_strength"
abscissa_unit = "eV"
columns = { x_upper = "eV" }
use = "check"
notes = "Distribution C (KRT and 0.95 x Swift's refractivity), the authors' compromise. Integrated oscillator strength over [E_j, E_j+1] (the last to infinity), rows j = 1-39, abscissa E_j (eV, the lower edge; 1.313 eV - 100 keV). Not a line: an interval integral (format need). Constrained to refractivity data (source notes): a check."

