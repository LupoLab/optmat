citation = "A. Kumar and A. J. Thakkar, J. Chem. Phys. 135, 074303 (2011), supplementary material"
doi = "10.1063/1.3626523"
library = "Kumar_2011_OzoneUnresolvedDiscrepancies/supplement_01"
identity = "VALIDATED"
kind = "compilation"
technique = """Supplementary material (Ref. 43 of the paper, kumar_2011) of Kumar and Thakkar's \
constrained dipole oscillator strength distributions of O2 and O3: the integrated DOS \
(IDOS) per energy interval of the final O2 DOSD (p. 2) and of the five O3 DOSDs A, B1, \
B2, C, D (pp. 3-4), with the sources of the initial data, and ten-term pseudospectra \
for O2 and O3 (B1, C) (p. 5). The method (kumar_2011, Sec. II): the Meath constrained \
least-squares scaling of the photoabsorption data per interval, with an iterated [1/1] \
Pade high-energy tail (Eq. 9) above 100 keV."""
notes = """Identity checked against the first page of the supplement (PDF page 1): \
'Supplementary material for "Ozone: Unresolved discrepancies for dipole oscillator \
strength distributions, dipole sums, and van der Waals coefficients" by Ashok Kumar and \
Ajit J. Thakkar, June 26, 2011' (the paper is kumar_2011, VALIDATED; the supplement's \
own library status is UNVERIFIED). Supplement pages 1-5. 'The IDOS entries are for the \
intervals from E(j) to E(j+1) with the last interval ending at infinity. The numbers in \
parentheses are powers of ten.' Energies E(j) in eV (the O2 header prints 'Ej(eV)'; \
the O3 header 'E(j)', the same edges above 36 eV).

REFERENCE NUMBERS: the supplement's reference numbers for the O3 sources and for the \
later O2 sources are 9 higher than in the published paper's list (a preprint \
numbering): Anderson 'Ref. 68' is the paper's 59, Burrows 76 -> 67, Molina 64 -> 55, \
Mason 73 -> 64, Tu & Nee 77 -> 68, Cook 62 -> 53, Ogawa & Cook 59 -> 50, Gejo 74 -> 65, \
Henke 70 -> 61, Chantler 71 -> 62 (the paper's 68, 76, 64, 73, 77, 62, 59, 74, 70, 71 are \
Tu & Nee, Maroulis, Mason, Epprecht, Naves, Chantler, Anderson, Cummings, Swift, Hohm). \
The names are unambiguous; the numbers below are the paper's.

O3 sources of the initial data (p. 4, page image checked; the line 'j=14-15: Mason et \
al.' is lost from the library's Markdown and survives as an unclassified block):
  j = 1-3 (1.313-1.642 eV): Anderson (S. M. Anderson, Geophys. Res. Lett. 20, 1579 \
(1993), paper Ref. 59; the Wulf band)
  j = 4-6 (1.642-3.552 eV): Burrows et al. (burrows_1999)
  j = 7-13 (3.552-6.702 eV): Molina & Molina (J. Geophys. Res. 91, 14501 (1986))
  j = 14-15 (6.702-9.501 eV): Mason et al. (mason_1996)
  j = 16-17 (9.501-12.00 eV): Tu & Nee (Surf. Rev. Lett. 9, 125 (2002))
  j = 18 (12.00-20.60 eV): Cook (in Recent Developments in Mass Spectrometry, 1970, pp. \
761-764)
  j = 19 (20.60-23.57 eV): Ogawa & Cook (ogawa_1958)
  j = 20 (23.57-30.51 eV): 1.9 x O2 DOSD; j = 21 (30.51-36.47): 1.7 x O2 DOSD; j = 22-32 \
(36.47-524.5 eV): 1.5 x O2 DOSD
  j = 33-34 (524.5-555.8 eV): Gejo et al. (Chem. Phys. Lett. 277, 497 (1997); the O 1s \
edge)
  j = 35-38 (555.8 eV - 100 keV): 1.5 x O2 DOSD; j = 39 (above 100 keV): Eq. (9).
The paper's text (kumar_2011 p. 074303-4) attributes the 12-20.6 eV data to both Ogawa \
& Cook and Cook ('the photoabsorption data [50, 53] in the 12-20.6 eV range, which \
accounts for 28%-34% of S-2, is insufficiently accurate'); the supplement assigns j = 18 \
(12.00-20.60 eV) to Cook alone and Ogawa & Cook to j = 19.

O3 constraints (kumar_2011, pp. 074303-3 and -4): all five use the KRT sum rule S(0) = 24; \
A no refractivity; B1 Swift et al.'s refractivity at 1.315 um (swift_1988); B2 the \
Cuthbertsons' at 546.1 nm (cuthbertson_1914); C and D Swift et al.'s multiplied by 0.95 \
and 0.90. The scale factors 1 + a_i of the 12-20.6 eV interval are 0.986 (A), 1.34 (B1, \
B2), 1.18 (C) and 1.012 (D); checked here: the j = 18 IDOS ratios B1/A = 1.359 and D/A = \
1.026 reproduce 1.34/0.986 and 1.012/0.986, C/A = 1.193 against 1.197 (0.3 %, the \
rounding of 1.18). The authors reject A and D (S(-2) below the range 18.55-20.70 of the \
ab initio values plus the zero-point correction 1.43 of naves_2011) and ignore B2 (within \
0.4 % of B1); 'The true S_k probably lie between the predictions of the B1 and C \
distributions' (Table III caption). Interval j = 10 (4.352-5.391 eV, the Hartley band) \
holds 0.0795 (B1) and 0.0787 (C).

O2 (p. 2, image checked): constraints KRT S(0) = 16 and the refractivities of Smith et \
al. at 2208.7 A (smith_1976) and Stoll at 9224 A (stoll_1922) (kumar_2011 p. 074303-3). \
Sources per j (printed): Discrete (Schumann-Runge bands) Bethke (bethke_1959) and Lewis \
et al.; j = 4, 7-11, 15-17 Chan et al. (Chem. Phys. 170, 99 (1993)); 5-6 Gibson et al.; \
12-14 Holland et al.; 18-28 Brion et al. (1979); 29, 32-33 '2*O, Henke et al.' \
(henke_1993); 30-31 Barrus et al.; 34-35 '2*O, Chantler'; 36 Eq. (9). Rows j = 1-3 are \
not printed (the discrete row).

Checks (2026-09-25): O2 discrete + IDOS = 16.000 (15.99982); O3 IDOS sums 24.0004 (A), \
24.0014 (B1), 23.9991 (B2), 24.0006 (C), 24.0016 (D) = S(0) = 24 to the rounding; the \
pseudospectra reproduce kumar_2011's Tables I and III (formulas' checks).

Not independent of the refractivity data used as constraints: the IDOS and the \
pseudospectra are checks against those data, not fits to them (as kumar_2010_supplement). \
FORMAT NEED (as kumar_2010_supplement): an interval-integrated oscillator strength has no \
quantity of its own; oscillator_strength at the lower edge E_j (eV) is used, row = j.

kumar_2011's notes say 'The DOSDs themselves are supplementary material, not in the \
library': they now are (this record)."""

