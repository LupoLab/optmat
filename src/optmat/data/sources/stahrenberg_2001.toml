abscissa_unit = "um"
use = "primary"
notes = "n of Ag(110), 0.12782-0.49594 um (9.70-2.50 eV), 361 rows, as the database file prints them (numbers provided by N. Esser to refractiveindex.info; see notes). Whether roughness-corrected is not stated."
[datasets.parameters]
