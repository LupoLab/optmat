name: Offer a paper or data
description: A measurement or calculation that optmat lacks, or better data than it holds.
labels: [data]
body:
  - type: markdown
    attributes:
      value: |
        Please search the [issues](https://github.com/LupoLab/optmat/issues?q=is%3Aissue) and the [curated sources](https://optmat.readthedocs.io/en/latest/the-data/sources.html) first. Cite the paper; do not attach its PDF or paste its tables, since the publishers' copyright applies.
  - type: textarea
    id: citation
    attributes:
      label: The source
      description: The citation and DOI, or the data service or repository.
    validations:
      required: true
  - type: textarea
    id: content
    attributes:
      label: What it holds
      description: The quantity, the materials, and the range of wavelength, temperature or density. Whether the values are printed in tables, in a supplement or only in figures, and the stated uncertainty if you know it.
    validations:
      required: true
  - type: textarea
    id: improves
    attributes:
      label: What it would improve
      description: The model or the value it would change or check, and a page or register entry (`TC-n`) that bears on it, if you know one.
