name: Report a problem with a value
description: A wrong value or model, a failure, or a suspected misprint in a paper. The maintainers fill in the rest.
body:
  - type: markdown
    attributes:
      value: |
        Please [search the issues](https://github.com/LupoLab/optmat/issues?q=is%3Aissue) first. The [review register](https://optmat.readthedocs.io/en/latest/register.html) may already record the disagreement or the doubt.
  - type: textarea
    id: value
    attributes:
      label: Which value or model
      description: The material, the wavelength and conditions, and the function you called. A short script is ideal. For a misprint, the paper and where in it.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What you compared against (a paper with its table or page, an independent calculation, an instrument), and at what conditions. Cite a paper rather than pasting its tables.
    validations:
      required: true
  - type: textarea
    id: got
    attributes:
      label: What optmat gives
      description: The value, or the output or the traceback.
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Version
      description: The output of `python -c "import optmat; print(optmat.__version__)"`.
      render: text
    validations:
      required: true
