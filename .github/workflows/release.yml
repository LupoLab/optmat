# Publishes to PyPI through trusted publishing (OIDC): no token is stored anywhere.
# Triggered by publishing a GitHub release whose tag is v<version> (e.g. v0.8.0).
# One-time setup: a pending publisher on PyPI for LupoLab/optmat, this workflow and the
# environment "pypi", and a GitHub environment named "pypi".
name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # the OIDC token that PyPI's trusted publishing exchanges
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # hatch-vcs derives the version from the tag
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.14
      - name: Build the sdist and the wheel
        run: uv build
      # The version comes from the tag (hatch-vcs), so a release from an untagged or
      # dirty checkout would publish a development version: fail instead.
      - name: Check the built version matches the tag
        run: |
          wheel=$(ls dist/*.whl)
          version=$(basename "$wheel" | cut -d- -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match the built version $version" >&2
            exit 1
          fi
      - name: Check the wheel installs and imports
        run: |
          uv run --isolated --no-project --python 3.14 --with "$(ls dist/*.whl)[gas]" \
            python -c "import optmat; print(optmat.__version__)"
      - name: Publish to PyPI
        run: uv publish
